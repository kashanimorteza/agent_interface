[project]
name = "backend"
version = "0.1.0"
description = "Backend application Behaviour and external API for the Trading Assistant."
requires-python = ">=3.13"
dependencies = [
    "my-database",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.uv.sources]
my-database = { path = "../my_database", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
