[project]
name = "my-backend"
version = "0.1.0"
description = "Trading Assistant application layer: Model Logic over Data Access, published through an HTTP API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "my-database",
    "my-model",
    "pyyaml>=6.0.3",
]

[tool.uv.sources]
my-model = { path = "../model", editable = true }
my-database = { path = "../database", editable = true }

[tool.fastapi]
entrypoint = "my_backend.api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_backend"]
