[project]
name = "backend"
version = "0.1.0"
description = "Trading Assistant Backend: the application layer implementing the Target's Behaviour and publishing its API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "model",
    "database",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.5",
]

[tool.uv.sources]
model = { path = "../model" }
database = { path = "../database" }

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "ruff>=0.16",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.fastapi]
entrypoint = "backend.main:app"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Test code freely passes a freshly created Domain Definition's `id` (typed `int | None`
# because it is unset before persistence) into APIs typed `id_: int`; it is always
# populated once returned from a create/get call. `src` keeps full strict checking.
executionEnvironments = [
    { root = "tests", reportArgumentType = "none" },
    { root = "src" },
]
