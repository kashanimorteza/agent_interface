[project]
name = "trading-assistant-backend"
version = "0.1.0"
description = "Backend Component of Trading Assistant — FastAPI application exposing every Model's standard operations over the Database Interface"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]==0.141.1",
    "uvicorn==0.52.4",
    "trading-assistant-database",
]

[tool.uv.sources]
trading-assistant-database = { path = "../database", editable = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_backend"

[tool.fastapi]
entrypoint = "trading_backend.main:app"
