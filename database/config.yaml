# Database runtime configuration, generated from the Database Preferences and the
# configuration structure standard. It is the sole runtime source for Engines,
# Instances, Settings, and shared Initial Data.
engines:
  sqlite:
    name: "SQLite"
    driver: "sqlite"
    parameters:
      foreign_keys: true
      check_same_thread: false
  postgresql:
    name: "PostgreSQL"
    driver: "postgresql"
    parameters: {}

instances:
  sqlite:
    name: "SQLite"
    active: true
    engine: "sqlite"
    host: null
    port: null
    database: "application.db"
    username: null
    password: null
    options: {}
  postgresql:
    name: "PostgreSQL"
    active: true
    engine: "postgresql"
    host: "127.0.0.1"
    port: 5432
    database: "application"
    username: "postgres"
    password: ""
    options: {}

settings:
  default_instance: "sqlite"
  storage_root: "db"
  query:
    filter_combination: "AND"
    default_limit: -1
    default_order:
      field: "id"
      direction: "ASCENDING"
  lifecycle:
    after_generation:
      enabled: true
      instance: "default_instance"
      fail_on_error: true
      commands:
        - "create_tables"
        - "insert_initial_data"

initial_data: []
