# Database's runtime configuration: non-secret Engine profiles, Database Instances, and the
# default Instance selection. No connection secret or credential value is recorded here;
# those are resolved from Database's private runtime secret source at connection time.

engines:
  sqlite:
    driver: sqlite3
    url_scheme: sqlite

instances:
  general:
    name: "Trading Assistant General"
    purpose: "General application data."
    engine: sqlite
    database: trading_assistant_general

default_instance: general
