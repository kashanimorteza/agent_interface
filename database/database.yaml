# Settings owned by the Database layer.
#
# Everything here belongs to this layer alone: which engines it supports, which
# Instances it offers, and which of them is used when a caller names none. What
# another layer consumes from this one is a binding and lives in the project's
# public configuration; secret values live in this layer's own private file and
# are referred to here by name only.

layer: "database"

settings:

  # <!-------------------------------------------- engines -->
  # A profile here means this layer has an adapter for that engine. It is not a
  # claim that a server is running, and adding an entry does not implement one.
  engines:

    sqlite:
      driver: "sqlite3"
      storage: "file"
      url_scheme: "sqlite"
      parameters:
        - "database"
      connection:
        foreign_keys: true
        check_same_thread: false
      requires_secrets: []

  # <!-------------------------------------------- instances -->
  # Each Instance is one stored identity: stable key, readable name, the purpose
  # it serves, and exactly one engine it is reached through.
  instances:

    general:
      name: "Trading Assistant General"
      purpose: "General application data."
      engine: "sqlite"
      database: "trading_assistant_general"

  # <!-------------------------------------------- default -->
  # Used when a caller names no Instance. It must name one declared above; an
  # Instance a caller names explicitly is never redirected here.
  default_instance: "general"

# The names of the secrets this layer requires, resolved from its own private
# file or from the runtime environment. Names only — never values.
secrets:
  - "TRADING_ASSISTANT_DATABASE_ENCRYPTION_KEY"
