# Runtime settings owned by the Database layer.
#
# It lives inside the Database layer's own code path so the layer is complete
# within its own directory. It declares what this layer supports and offers:
# the Engine profiles it implements, the Instances it makes selectable, and
# the one default. Cross-layer bindings live in the public root configuration
# and secret values live in the secrets file; neither is duplicated here.
#
# A secret is named here, never valued here.

settings:

  # Engine profiles this layer implements an adapter for. Adding an entry
  # does not implement an adapter; it declares that one exists.
  engines:
    SQLite:
      storage: file
      url_scheme: sqlite
      driver: sqlite3
      foreign_keys: true
      check_same_thread: false
      busy_timeout_ms: 5000

  # The selectable database identities. Each names one declared Engine.
  instances:
    general:
      name: Trading Assistant General
      purpose: General application data.
      engine: SQLite
      database: trading_assistant_general
      host: localhost
      port: engine_default
      username_secret: TRADING_ASSISTANT_GENERAL_DATABASE_USERNAME
      password_secret: TRADING_ASSISTANT_GENERAL_DATABASE_PASSWORD

  # The Instance used when a consumer selects none. Must name a declared one.
  default_instance: general

  credentials:
    # Name of the runtime secret holding the key for the reversible at-rest mode.
    encryption_key_secret: TRADING_ASSISTANT_DATABASE_ENCRYPTION_KEY
