# Internal tooling of the Database layer: the recorded, ordered, reversible
# history of the stored structure. It is reached from inside this layer only and
# is deliberately absent from what the package publishes.

[alembic]
script_location = %(here)s/my_database/history
prepend_sys_path = %(here)s
path_separator = os
# The connection is resolved from this layer's own settings for the selected
# Instance, so no connection string is written down here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
