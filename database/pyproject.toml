[project]
name = "my-database"
version = "0.1.0"
description = "Persistence layer of Trading Assistant: stores the shared domain definitions and publishes one definition-driven data interface."
requires-python = ">=3.14"
dependencies = [
    "my-model",
    "sqlalchemy==2.0.52",
    "alembic==1.19.2",
    # Reversible at-rest treatment needs real encryption; the Preferences name the
    # mode and where its key comes from, not a library. This is that choice.
    "cryptography==50.0.1",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
my-model = { path = "../model" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_database"]

# The settings this layer owns travel with it, so an installed copy is as
# complete as the source tree. There is still one source file; this is the
# build taking it along.
[tool.hatch.build.targets.wheel.force-include]
"database.yaml" = "my_database/database.yaml"
".env.example" = "my_database/.env.example"
