[project]
name = "database"
version = "0.1.0"
description = "Persists Entity data and publishes the standard data Operations for the Trading Assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "model",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
