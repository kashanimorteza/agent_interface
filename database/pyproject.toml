[project]
name = "database"
version = "0.1.0"
description = "Persistence gateway for the Trading Assistant Entities."
requires-python = "==3.14.*"
dependencies = [
    "model==0.1.0",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "database"

[tool.uv.sources]
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["database"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
