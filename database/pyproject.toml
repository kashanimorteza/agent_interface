[project]
name = "database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morteza", email = "kashani.morteza@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "model",
    "sqlalchemy>=2,<3",
    "alembic",
    "cryptography",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[tool.uv.sources]
model = { path = "../model", editable = true }

[tool.ruff]
extend-exclude = ["migrations/versions"]

[tool.pyright]
exclude = ["migrations/versions"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
