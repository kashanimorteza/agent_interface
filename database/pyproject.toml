[project]
name = "database"
version = "0.1.0"
description = "Persistence gateway for the Trading Assistant Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "model",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
]

[project.scripts]
database = "database.interface:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["src/database/db/*"]
wheel-exclude = ["database/db/*"]

[tool.uv.sources]
model = { path = "../model" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
