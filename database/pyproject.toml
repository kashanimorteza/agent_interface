[project]
name = "my-database"
version = "0.1.0"
description = "Trading Assistant persistence layer: maps the shared Models to reproducible storage and publishes one generic data-access interface with a transaction boundary and an Instance Registry."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "cryptography>=50.0.1",
    "my-model",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
]

[tool.uv.sources]
my-model = { path = "../model", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_database"]
