[project]
name = "my-database"
version = "0.1.0"
description = "Persistence layer for the Trading Assistant project."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "cryptography>=50.0.1",
    "my-model",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
my-model = { path = "../model", editable = true }
