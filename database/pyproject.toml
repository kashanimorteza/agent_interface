[project]
name = "my-database"
version = "0.1.0"
description = "Database Component of Trading Assistant — generic Database Interface over SQLite via SQLAlchemy and Alembic"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "cryptography==50.0.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "my_database"
