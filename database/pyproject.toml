[project]
name = "database"
version = "0.1.0"
description = "Reusable persistence library for the Trading Assistant: one data-access gateway over selectable Instances."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "model",
    "psycopg[binary]==3.3.6",
    "pyyaml==6.0.3",
    "sqlmodel==0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/database/__init__.py" = ["F401", "F403"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.uv.sources]
model = { path = "../model", editable = true }

[project.scripts]
database-create-tables = "database.core.tables:main"
database-insert-initial-data = "database.core.initial_data:main"
database-prepare = "database.core._prepare:main"
