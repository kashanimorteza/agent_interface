[project]
name = "database"
version = "0.1.0"
description = "Reusable Database library: one stable data-access gateway that persists Model Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "model",
    "pyyaml",
    "sqlalchemy",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "database"

[tool.uv.sources]
model = { path = "../model", editable = true }

[tool.ruff.lint.isort]
combine-as-imports = true
