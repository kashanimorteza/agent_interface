[project]
name = "database"
version = "0.1.0"
description = "Trading Assistant Database: the complete persistence boundary for the Target's domain."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "model",
    "sqlalchemy>=2,<3",
    "alembic>=1.13",
    "cryptography>=42",
    "pyyaml>=6",
]

[tool.uv.sources]
model = { path = "../model" }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
    "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
