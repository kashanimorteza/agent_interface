[project]
name = "database"
version = "0.1.0"
description = "Reusable storage library persisting the Trading Assistant Entities behind one public Interface."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "model",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "database"

[tool.uv.sources]
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
