[project]
name = "ta_database"
version = "0.1.0"
description = "Database Component of Trading Assistant — generic Database Interface, Data Logic and Mapping, and Storage Adapter."
requires-python = "==3.14.*"
dependencies = [
    "SQLAlchemy==2.0.52",
    "Alembic==1.19.2",
    "cryptography==50.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ta_database"]
