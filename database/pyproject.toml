[project]
name = "database"
version = "0.1.0"
description = "Persistence of the Trading Assistant Entities behind one public Interface."
requires-python = ">=3.14"
dependencies = [
    "model",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "database"
module-root = ""

[tool.uv.sources]
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
