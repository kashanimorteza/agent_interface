# Runtime settings owned by the Model layer.
#
# It lives inside the Model layer's own code path so the layer is complete
# within its own directory. It carries only what the Model layer owns; the
# layers it consumes are declared in the public root configuration instead.
#
# The Model layer is an importable library of domain declarations. Nothing in
# it is changeable by a user or environment, so it owns no setting.

settings: {}
