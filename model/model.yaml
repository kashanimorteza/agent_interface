# Settings owned by the Model layer.
#
# Only what this layer owns belongs here. What this layer consumes from another
# one is a binding and lives in the project's public configuration file; what
# any layer keeps secret lives in that layer's own private file, never here.

layer: "model"

# The Model layer holds no user-changeable setting of its own. Its field
# defaults, entity declarations and rules are part of the shared definitions,
# not configuration, because a consumer changing them would change what the
# project means rather than how it runs.
settings: {}

# The names of the secrets this layer requires. It requires none: it stores
# nothing and reaches nothing, and the credentials it declares are fields of
# domain records rather than values this layer holds. With no secret to keep,
# the layer needs no private secret file.
secrets: []
