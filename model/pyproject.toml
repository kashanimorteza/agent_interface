[project]
name = "model"
version = "0.1.0"
description = "Reusable Model library: flat, technology-independent Entities with public Declarations and JSON conversion."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
    "sqlalchemy",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "model"

[tool.ruff.lint.isort]
combine-as-imports = true
