[project]
name = "model"
version = "0.1.0"
description = "Independent, technology-independent data-model Entities for the Trading Assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
