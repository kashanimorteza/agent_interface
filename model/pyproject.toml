[project]
name = "model"
version = "0.1.0"
description = "Reusable data-model Entities of the Trading Assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-core>=2.50.0",
    "sqlalchemy>=2.1.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "model"
