[project]
name = "model"
version = "0.1.0"
description = "Trading Assistant shared domain Model."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pyright>=1,<2",
    "ruff>=0.6,<1",
]
