[project]
name = "model"
version = "0.1.0"
description = "The shared domain Model: authoritative Domain Definitions for the Trading Assistant."
readme = "README.md"
authors = [
    { name = "SFCARS", email = "sfcarsoffice@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
