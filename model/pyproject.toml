[project]
name = "my-model"
version = "0.1.0"
description = "Shared domain Model layer of Trading Assistant: the logical entities, their fields, relationships, rules and initial records."
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_model"]
