[project]
name = "model"
version = "0.1.0"
description = "Shared domain Model for the Trading Assistant Target."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
