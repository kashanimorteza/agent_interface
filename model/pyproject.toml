[project]
name = "model"
version = "0.1.0"
description = "Reusable, storage-independent data-model Entities of the Trading Assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "sqlmodel==0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/model/__init__.py" = ["F401", "F403"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
