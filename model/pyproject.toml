[project]
name = "trading-assistant-model"
version = "0.1.0"
description = "Reusable library of the Trading Assistant Domain Entities."
readme = "README.md"
authors = [
    { name = "SFCARS", email = "sfcarsoffice@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
