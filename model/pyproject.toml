[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "model"
version = "0.1.0"
description = "Independent data-model library that defines and publishes the Trading Assistant Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pydantic", "sqlmodel"]

[dependency-groups]
dev = ["pyright", "ruff"]

[tool.setuptools]
package-dir = { model = "." }
packages = ["model", "model.core", "model.entity"]

[tool.setuptools.package-data]
model = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The Interface publishes Entities in Target order, not alphabetical order.
"interface.py" = ["I001", "RUF022"]

[tool.pyright]
include = ["."]
exclude = [".venv", "build", "dist"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
