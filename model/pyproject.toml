[project]
name = "model"
version = "0.1.0"
description = "Reusable data-model Entities of the Trading Assistant."
requires-python = "==3.14.*"
dependencies = [
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "sqlmodel==0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "model"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
include = ["model"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
