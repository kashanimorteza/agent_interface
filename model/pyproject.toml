[project]
name = "model"
version = "0.1.0"
description = "Reusable data-model Entities and their complete public Declarations."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.per-file-ignores]
"src/model/interface.py" = ["PLC0414"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]
