[project]
name = "my-model"
version = "0.1.0"
description = "Trading Assistant shared Model package: the logical domain Models with their fields, relationships, rules, initial data, and the validation every consumer reuses."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_model"]
