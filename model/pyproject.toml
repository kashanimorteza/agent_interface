[project]
name = "model"
version = "0.1.0"
description = "The Model Component: the authoritative Domain Definitions of the Trading Assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
