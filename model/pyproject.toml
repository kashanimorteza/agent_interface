[project]
name = "model"
version = "0.1.0"
description = "Reusable, technology-independent data-model Entities of the Trading Assistant."
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.5",
    "sqlmodel==0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "ruff==0.16.9",
]
