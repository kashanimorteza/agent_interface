meta:
  name: "STRUCTURE — نقشهٔ پروژه"
  purpose: "جواب سوال «چه چیزی کجاست» — فهرست لایه‌ها و مسیر شاخص هرکدام"
  completeness: "چیزی که در این نقشه نیست، از نظر ایجنت وجود ندارد"
  depth: "این نقشه محتوای هیچ لایه‌ای را نمی‌داند — فقط مسیر و مسئولیت آن را می‌گوید"
  agent_may_edit: false
  on_change_needed: "پیشنهاد در STATE/questions.yaml ثبت شود — تغییر فقط توسط انسان"
  updated: "2026-08-24"


layers:
  layer_1: "ROOT.yaml — ورود و پروتوکول"
  layer_2: "PROJECT.yaml — لایهٔ محصول؛ خودش را تعریف می‌کند، نقشه فقط به آن اشاره دارد"
  layer_3: "RULES/RULES.yaml — لایهٔ قواعد؛ خودش را تعریف می‌کند، نقشه فقط به آن اشاره دارد"
  layer_4: "DEVELOP/DEVELOP.yaml — لایهٔ ساخت؛ خودش را تعریف می‌کند، نقشه فقط به آن اشاره دارد"
  cross_1: "STATE/STATE.yaml — لایهٔ وضعیت جاری؛ خودش را تعریف می‌کند، نقشه فقط به آن اشاره دارد"
  cross_2: "HISTORY/HISTORY.yaml — لایهٔ تاریخچه؛ خودش را تعریف می‌کند، نقشه فقط به آن اشاره دارد"


map:

  root:
    layer: 1
    path: "ROOT.yaml"
    responsibility: "نقطهٔ ورود — پروتوکول خواندن، حالت‌های کاری، و پروتوکول نوشتن"
    note: "تنها فایلی که ایجنت بدون راهنمایی پیدایش می‌کند"

  project:
    layer: 2
    path: "PROJECT.yaml"
    responsibility: "تعریف محصول — شناسه، اهداف، غیراهداف، نتایج، معماری"
    note: "برای فهم اینکه چه چیزی ساخته می‌شود، PROJECT.yaml را بخوان"

  rules:
    layer: 3
    path: "RULES/RULES.yaml"
    responsibility: "شاخص لایهٔ قواعد — فایل‌های قاعده، ترتیب خواندن، و تقدم آن‌ها آنجا تعریف شده‌اند"
    note: "محتوای هیچ قاعده‌ای اینجا نیست — پیش از هر کاری RULES.yaml را بخوان"

  develop:
    layer: 4
    path: "DEVELOP/DEVELOP.yaml"
    responsibility: "شاخص لایهٔ ساخت — آیتم‌ها، قالب فایل‌های آیتم، و قراردادها آنجا تعریف شده‌اند"
    note: "برای هر کاری در این لایه، اول DEVELOP.yaml را بخوان"

  state:
    layer: "cross"
    path: "STATE/STATE.yaml"
    responsibility: "شاخص لایهٔ وضعیت — فایل‌های وضعیت، ترتیب خواندن، و قواعد نوشتن آن‌ها آنجا تعریف شده‌اند"
    note: "برای فهم «الان کجاییم»، اول STATE.yaml را بخوان"

  history:
    layer: "cross"
    path: "HISTORY/HISTORY.yaml"
    responsibility: "شاخص لایهٔ تاریخچه — انواع ثبت، قالب هرکدام، و قواعد نوشتن آن‌ها آنجا تعریف شده‌اند"
    note: "برای ثبت هر چیزی در این لایه، اول HISTORY.yaml را بخوان"
