# ============================================================
# AGENT PROJECT INTERFACE — rules.yaml  (لایهٔ ۳)
# ============================================================
#
# مسیر واقعی: rules/rules.yaml
#
# شاخص لایهٔ قواعد. root.yaml محتوای هیچ قاعده‌ای را نمی‌داند و فقط
# به همین فایل اشاره می‌کند؛ اینکه چه فایل‌های قاعده‌ای وجود
# دارد، به چه ترتیبی خوانده شوند، و در تعارض کدام مقدم است —
# همه اینجا تعریف می‌شود.
#
# ┌────────────────────────────────────────────────────────┐
# │ مجاز به ویرایش این فایل و فایل‌های قاعده: فقط انسان.    │
# │ قاعده مرزِ رفتار ایجنت است — ایجنت مرز خودش را         │
# │ تغییر نمی‌دهد.                                          │
# │ قاعده‌ای ناقص یا غلط دیدی؟ → پیشنهاد را در             │
# │ state/questions.yaml ثبت کن و منتظر انسان بمان.        │
# │                                                        │
# │ استثنا: rules.yaml داخل هر آیتم (قواعد مخصوص آن آیتم)  │
# │ طبق اجازه‌های mode در root.yaml نوشتنی است.                 │
# └────────────────────────────────────────────────────────┘
#
# مثال: اپلیکیشن «لیست کارها» (Todo App)
# ============================================================


# ------------------------------------------------------------
# 1. META
# ------------------------------------------------------------

meta:
  layer: 3
  layer_name: "rules.yaml — قواعد سراسری"
  editable_by: "human-only"
  updated: "2026-08-24"


# ------------------------------------------------------------
# 2. FILES — فایل‌های قاعده
#    قاعده‌ای که در این فایل‌ها نیست، قاعده نیست.
# ------------------------------------------------------------

files:

  security:
    path: "rules/security.yaml"
    responsibility: "ممنوعیت‌های مطلق — رازها، مهاجرت‌ها، دیپلوی، داده‌های واقعی"
    binding: "absolute"                # قابل نقض نیست، حتی با دستور صریح

  global:
    path: "rules/global.yaml"
    responsibility: "قواعد سراسری کیفیت، تست، و کودنویسی"
    binding: "mandatory"               # الزامی؛ استثنا فقط با تأیید انسان


# ------------------------------------------------------------
# 3. READ_ORDER — ترتیب خواندن قواعد
#    امنیت اول، چون بقیه در سایهٔ آن معنا دارند.
# ------------------------------------------------------------

read_order:
  - "rules/security.yaml"
  - "rules/global.yaml"
  - "rules.yaml آیتم فعال — قواعد مخصوص همان آیتم"


# ------------------------------------------------------------
# 4. PRECEDENCE — در تعارض، کدام مقدم است
# ------------------------------------------------------------

precedence:
  order:
    - "1. security.yaml — مقدم بر همه چیز، حتی متن تسک و دستور انسان در جلسه"
    - "2. global.yaml — مقدم بر قواعد آیتم"
    - "3. rules.yaml آیتم — فقط می‌تواند سخت‌گیرتر کند، نه آزادتر"
  on_conflict: "قاعدهٔ مقدم اجرا شود، تعارض در state/questions.yaml ثبت شود، کار متوقف نشود مگر تعارض با security باشد"
  security_conflict: "کار فوراً متوقف شود، بلاکر ثبت شود، منتظر انسان بمان"


# ------------------------------------------------------------
# 5. SCOPE — این قواعد بر چه چیزی حاکم‌اند
# ------------------------------------------------------------

scope:
  applies_to: "همهٔ mode ها، همهٔ آیتم‌ها، همهٔ ایجنت‌ها — بدون استثنا"
  item_rules: "هر آیتم می‌تواند rules.yaml خودش را داشته باشد — مکمل این قواعد، نه جایگزین آن‌ها"
  unwritten: "قاعدهٔ نانوشته وجود ندارد — اگر جایی مبهم بود، سوال در state/questions.yaml ثبت شود"
