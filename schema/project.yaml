# ============================================================
# AGENT PROJECT INTERFACE — project.yaml  (لایهٔ ۲)
# ============================================================
#
# مسیر واقعی: project.yaml
#
# تعریف محصول. root.yaml نمی‌داند این پروژه چیست و فقط به همین فایل
# اشاره می‌کند؛ هر چه به «چه چیزی ساخته می‌شود و چرا» مربوط
# است — شناسه، اهداف، غیراهداف، نتایج، و معماری — اینجا
# تعریف می‌شود.
#
# این فایل «چه چیزی» را می‌گوید، نه «چگونه». «چگونه» در
# لایهٔ ۳ (قواعد) و لایهٔ ۴ (ساخت) است.
#
# ┌────────────────────────────────────────────────────────┐
# │ مجاز به ویرایش این فایل: فقط انسان.                    │
# │ تعریف محصول تصمیم انسان است، نه استنتاج ایجنت.         │
# │ تعریفی ناقص، مبهم یا متناقض دیدی؟ → پیشنهاد را در      │
# │ state/questions.yaml ثبت کن و منتظر انسان بمان.        │
# └────────────────────────────────────────────────────────┘
#
# مثال: اپلیکیشن «لیست کارها» (Todo App)
# ============================================================


# ------------------------------------------------------------
# 1. META
# ------------------------------------------------------------

meta:
  layer: 2
  layer_name: "PROJECT — تعریف محصول"
  editable_by: "human-only"
  updated: "2026-08-24"


# ------------------------------------------------------------
# 2. IDENTITY — این پروژه چیست
# ------------------------------------------------------------

identity:
  id: "todo-app"
  name: "برنامهٔ لیست کارها"
  one_liner: "اپلیکیشن وب مدیریت کارهای روزانه با حساب کاربری و همگام‌سازی."


# ------------------------------------------------------------
# 3. GOALS — چه چیزی باید محقق شود
# ------------------------------------------------------------

goals:
  - "کاربر بتواند حساب بسازد و وارد شود"
  - "کاربر بتواند کار بسازد، ویرایش کند، تمام‌شده علامت بزند، و حذف کند"
  - "کارهای هر کاربر روی همهٔ دستگاه‌هایش همگام باشد"


# ------------------------------------------------------------
# 4. NON_GOALS — چه چیزی ساخته نمی‌شود
#    به اندازهٔ اهداف مهم است — مرز پروژه را می‌بندد.
# ------------------------------------------------------------

non_goals:
  - "کار تیمی و اشتراک‌گذاری لیست بین کاربران"
  - "اپلیکیشن موبایل بومی — فقط وب"
  - "یادآور، نوتیفیکیشن، و تقویم"


# ------------------------------------------------------------
# 5. OUTCOMES — پروژه کِی تمام است
#    معیار قابل‌بررسی، نه احساس پیشرفت.
# ------------------------------------------------------------

outcomes:
  - "کاربر تازه بتواند ثبت‌نام کند و اولین کارش را در کمتر از یک دقیقه بسازد"
  - "کارها پس از بستن و باز کردن مرورگر باقی بمانند"
  - "تست‌های خودکار هر دو آیتم سبز باشند"


# ------------------------------------------------------------
# 6. ARCHITECTURE — شکل کلی محصول
#    فقط تصمیم‌های سطح محصول؛ جزئیات هر آیتم در definition.yaml خودش.
# ------------------------------------------------------------

architecture:
  shape: "وب اپلیکیشن دولایه — کلاینت مرورگری + سرویس API"
  data: "پایگاه دادهٔ رابطه‌ای؛ منبع حقیقت سمت سرور است"
  boundary: "کلاینت و سرور فقط از راه قرارداد api-v1 حرف می‌زنند"
  decided_elsewhere: "تکنالوژی هر آیتم در definition.yaml همان آیتم تعریف می‌شود"


# ------------------------------------------------------------
# 7. CONSTRAINTS — محدودیت‌های بیرونی
# ------------------------------------------------------------

constraints:
  - "بک‌اند اول ساخته می‌شود؛ فرانت‌اند به قرارداد وابسته است نه به تسک‌های بک‌اند"
  - "بدون سرویس ابری پولی در نسخهٔ اول"
