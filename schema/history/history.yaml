meta:
  layer: "cross"
  layer_name: "HISTORY — تاریخچه"
  purpose: "جواب سوال «چرا به اینجا رسیدیم» — نه وضعیت جاری، نه تعریف"
  write_mode: "append-only"
  immutability: "چیزی پاک یا بازنویسی نمی‌شود — ثبت غلط با ثبت جدید اصلاح می‌شود، نه با ویرایش قدیم"
  index_agent_may_edit: false
  index_on_change_needed: "پیشنهاد در state/questions.yaml ثبت شود — خودِ این شاخص فقط توسط انسان تغییر می‌کند"
  files_agent_may_edit: true
  updated: "2026-08-24"


records:

  decisions:
    path: "history/decisions/"
    responsibility: "تصمیم‌نامه‌ها (ADR) — تصمیم‌های معماری و طراحی که بعداً کسی می‌پرسد «چرا این‌طور شد»"
    file_pattern: "ADR-0001-<slug>.yaml"
    id_source: "شمارندهٔ ADR در state/counters.yaml"
    when_to_write: "هر تصمیمی که بیش از یک تسک را متأثر می‌کند یا بعداً غیربدیهی به نظر می‌رسد"
    fields:
      id: "شناسهٔ ADR"
      title: "تصمیم در یک جمله"
      date: "تاریخ ثبت"
      context: "چه مسئله‌ای باعث این تصمیم شد"
      decision: "چه چیزی تصمیم گرفته شد"
      alternatives: "چه گزینه‌هایی رد شد و چرا"
      consequences: "این تصمیم چه چیزی را آسان و چه چیزی را سخت می‌کند"
      status: "active | superseded"
      superseded_by: "شناسهٔ ADR جانشین — فقط وقتی status برابر superseded است"

  journal:
    path: "history/journal/"
    responsibility: "گزارش هر جلسهٔ ایجنت — چه شد، چه ماند، بعدی چیست"
    file_pattern: "<YYYY-MM-DD>-<seq>-<item>.yaml"
    when_to_write: "پایان هر جلسه — الزامی، حتی اگر جلسه بی‌نتیجه بوده"
    fields:
      date: "تاریخ جلسه"
      mode: "mode فعال آن جلسه"
      item: "آیتم فعال آن جلسه"
      tasks_touched: "تسک‌هایی که لمس شدند و نتیجهٔ هرکدام"
      decisions_made: "شناسهٔ ADR های ثبت‌شده در این جلسه"
      blockers_opened: "بلاکرهای باز شده"
      blockers_resolved: "بلاکرهای رفع شده"
      questions_asked: "سوال‌های ثبت‌شده برای انسان"
      unfinished: "کار نیمه‌تمام — دقیقاً کجا متوقف شد و ایجنت بعدی از کجا ادامه دهد"
      next: "قدم پیشنهادی بعدی"


rules:
  append_only: "فایل ثبت‌شده هرگز ویرایش نمی‌شود — اصلاح با ثبت جدید انجام می‌شود"
  no_deletion: "هیچ فایلی از این لایه حذف نمی‌شود، حتی اگر تصمیمش منسوخ شده باشد"
  supersede_not_edit: "تصمیم منسوخ‌شده با ADR جدید جایگزین می‌شود و status قدیمی به superseded تغییر می‌کند — این تنها ویرایش مجاز است"
  session_mandatory: "هر جلسه دقیقاً یک ژورنال دارد — بدون ژورنال، جلسه ناتمام است"
  handoff: "اگر کار نیمه‌تمام ماند، فیلد unfinished باید طوری نوشته شود که ایجنت بعدی بدون حدس زدن ادامه دهد"
  no_state_here: "وضعیت جاری اینجا نوشته نمی‌شود — آن در state/ است؛ اینجا فقط رویداد گذشته ثبت می‌شود"
  id_before_write: "قبل از ساخت هر ADR، شمارندهٔ ADR در state/counters.yaml زیاد شود"
