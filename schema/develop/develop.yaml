# ============================================================
# AGENT PROJECT INTERFACE — DEVELOP.yaml  (لایهٔ ۴)
# ============================================================
#
# مسیر واقعی: DEVELOP/DEVELOP.yaml
#
# شاخص لایهٔ ساخت. ROOT دربارهٔ آیتم‌ها هیچ نمی‌داند و فقط
# به همین فایل اشاره می‌کند؛ هر چه به «ساخت» مربوط است —
# آیتم‌ها، قالب فایل‌های هر آیتم، و قراردادها — اینجا تعریف
# می‌شود.
#
# ┌────────────────────────────────────────────────────────┐
# │ مجاز به ویرایش این فایل: فقط انسان.                    │
# │ افزودن/حذف آیتم یک تصمیم معماری است، نه کار ایجنت.     │
# │ نیاز به آیتم جدید دیدی؟ → پیشنهاد را در               │
# │ STATE/questions.yaml ثبت کن و منتظر انسان بمان.        │
# │                                                        │
# │ فایل‌های داخل هر آیتم (DEFINITION / RULES / PLAN /     │
# │ STATUS) نوشتنی‌اند — طبق اجازه‌های mode در ROOT.       │
# └────────────────────────────────────────────────────────┘
#
# مثال: اپلیکیشن «لیست کارها» (Todo App)
# ============================================================


# ------------------------------------------------------------
# 1. META
# ------------------------------------------------------------

meta:
  layer: 4
  layer_name: "DEVELOP — آیتم‌های ساخت"
  editable_by: "human-only"
  updated: "2026-08-24"


# ------------------------------------------------------------
# 2. ITEMS — آیتم‌های ساخت
#    آیتمی که اینجا نیست، از نظر ایجنت وجود ندارد.
# ------------------------------------------------------------

items:

  backend:
    enabled: true
    path: "DEVELOP/backend/"
    prefix: "BE"                       # شناسهٔ تسک‌ها: BE-0001
    code_path: "backend/"              # کود واقعی این آیتم در ریپازیتوری
    summary: "API، منطق کارها و کاربران، دیتابیس"

  frontend:
    enabled: true
    path: "DEVELOP/frontend/"
    prefix: "FE"
    code_path: "frontend/"
    summary: "کلاینت وب — مصرف‌کنندهٔ قرارداد api-v1"


# ------------------------------------------------------------
# 3. ITEM_FILES — قالب استاندارد داخل هر آیتم
#    هر آیتم دقیقاً همین چهار فایل را دارد، نه کمتر نه بیشتر.
# ------------------------------------------------------------

item_files:
  DEFINITION.yaml: "این آیتم چه می‌کند، با چه تکنالوژی، جزئیات خاص خودش"
  RULES.yaml: "قواعد مخصوص این آیتم — مکمل قواعد سراسری"
  PLAN.yaml: "گروه‌های تسک + تسک‌ها، قدم به قدم"
  STATUS.yaml: "وضعیت و گزارش اجرای تسک‌های PLAN"

item_read_order:
  - "DEFINITION.yaml"
  - "RULES.yaml"
  - "PLAN.yaml"
  - "STATUS.yaml"


# ------------------------------------------------------------
# 4. SHARED — دارایی‌های مشترک بین آیتم‌ها
# ------------------------------------------------------------

shared:
  contracts:
    path: "DEVELOP/shared/contracts/"
    responsibility: "قراردادهای نسخه‌بندی‌شده بین آیتم‌ها — اتصال فقط از اینجا"


# ------------------------------------------------------------
# 5. BOUNDARIES — مرزهای این لایه
# ------------------------------------------------------------

boundaries:
  code_isolation: "هر آیتم فقط داخل code_path خودش می‌نویسد — دست زدن به کود آیتم دیگر ممنوع"
  cross_item_link: "ارتباط بین آیتم‌ها فقط از راه shared/contracts — نه وابستگی مستقیم تسک به تسک"
  contract_change: "قرارداد frozen تغییر نمی‌کند — نیاز به تغییر → پیشنهاد در STATE/questions.yaml"
