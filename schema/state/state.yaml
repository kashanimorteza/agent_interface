meta:
  layer: "cross"
  layer_name: "STATE — وضعیت جاری"
  purpose: "جواب سوال «الان کجاییم و چه باید بکنم» — نه تاریخچه، نه تعریف"
  write_mode: "overwrite"
  history_rule: "این لایه تاریخچه نگه نمی‌دارد — هر چه باید بماند در history/ ثبت می‌شود"
  index_agent_may_edit: false
  index_on_change_needed: "پیشنهاد در state/questions.yaml ثبت شود — خودِ این شاخص فقط توسط انسان تغییر می‌کند"
  files_agent_may_edit: true
  updated: "2026-08-24"


files:

  stage:
    path: "state/stage.yaml"
    responsibility: "mode فعال + آیتم فعال"
    agent_may_edit: false
    reason: "mode مرز اجازه‌های ایجنت است — ایجنت مرز خودش را عوض نمی‌کند"
    on_change_needed: "پیشنهاد در questions.yaml — تغییر فقط توسط انسان"

  blockers:
    path: "state/blockers.yaml"
    responsibility: "موانع باز — چیزی که کار را متوقف کرده"
    agent_may_edit: true
    linked_to: "تسک متأثر در status.yaml آیتم به حالت blocked می‌رود — بلاکر و تسک همیشه هم‌زمان به‌روز می‌شوند"

  questions:
    path: "state/questions.yaml"
    responsibility: "صف سوال، درخواست تأیید، و پیشنهادِ تغییر برای انسان"
    agent_may_edit: true
    write_rule: "هر سوال همراه با پیشنهاد ثبت شود، نه فقط سوال"
    answer_rule: "جواب را فقط انسان می‌نویسد — ایجنت جواب خودش را نمی‌نویسد"

  counters:
    path: "state/counters.yaml"
    responsibility: "شمارنده‌های شناسه — BE، FE، ADR، BLK، Q"
    agent_may_edit: true
    write_rule: "قبل از ساخت هر آیتم شناسه‌دار، اول شمارنده زیاد شود، بعد شناسه استفاده شود"
    uniqueness: "شناسه هرگز دوباره استفاده نمی‌شود — حتی اگر آیتم قبلی حذف یا لغو شده باشد"


read_order:
  enforcement: "در آغاز هر جلسه، پیش از هر لایهٔ دیگر"
  steps:
    - path: "state/stage.yaml"
      why: "بدان کدام mode و کدام آیتم فعال است — بقیهٔ جلسه به این وابسته است"
    - path: "state/questions.yaml"
      why: "اگر انسان به سوالی جواب داده، اول آن را اعمال کن"
    - path: "state/blockers.yaml"
      why: "موانع باز را بدان تا کار بلاک‌شده را دوباره شروع نکنی"
    - path: "state/counters.yaml"
      why: "فقط هنگام نیاز به شناسهٔ جدید — نه در خواندن آغازین"


rules:
  single_source: "وضعیت جاری فقط در این لایه زندگی می‌کند — در plan.yaml یا definition.yaml تکرار نشود"
  task_status_exception: "وضعیت تسک‌ها اینجا نیست — در status.yaml همان آیتم است"
  answered_question: "سوال جواب‌داده‌شده پس از اعمال، بسته می‌شود و خلاصه‌اش در history/journal ثبت می‌شود"
  resolved_blocker: "بلاکر رفع‌شده از blockers.yaml حذف می‌شود و رفعش در ژورنال ثبت می‌شود"
  no_silent_change: "هر تغییر در این لایه باید در ژورنال همان جلسه بازتاب داشته باشد"
