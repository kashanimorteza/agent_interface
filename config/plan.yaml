              description: "Make CreateTables stop and report, with the Declaration-incompatibility error that identifies the Entity, when an existing Table differs from the Declaration of its Entity, and never resolve the difference by altering the Table."
              reason: "A silent repair would hide a divergence between stored structure and Model meaning."
