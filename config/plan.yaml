                - "P2-G6-T9"
              constraints: []
              acceptance: "A changing Operation that fails part way leaves the Instance's data exactly as it was before the call; a later failing call never undoes an earlier successful call."
              status: "done"
              log:
                - at: '2026-10-05T11:18:40Z'
                  execution: '007'
                  event: claimed
                  detail: Dependencies are done (P2-G7-T3 and P2-G7-T5 for G7-T6; P2-G6-T3, T4, T6, T7, T8 and T9 for G8-T1; P2-G7-T5 for G8-T2). Claimed before changing the Task result.
