# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 74
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "A reusable, independent Model library that publishes every Target Entity with its complete Declaration and lossless JSON conversion through one stable Interface."
      constraints: []
      task_count: 28
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Library foundation"
          description: "Brings the Model Component into existence as an independent, reusable library that all remaining work builds on."
          area: "Component setup and dependency resolution"
          does: "The Model library exists as a self-contained, loadable unit whose selected technology and quality tooling are ready."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "003"
              title: "Provide the Model library as an independent reusable unit"
              description: "Establish the Model Component as an independent library whose selected technology and quality tooling are set up and whose dependency versions are resolved and recorded, so every later Task has a working place to realize its result."
              reason: "Every other Task in the phase builds on a Component that can be set up and consumed on its own."
              inputs:
                - "Resolved technology and tooling selections for the Model Component"
              skills: []
              expected_result: "A Model library that sets up from a clean state in an isolated environment with its dependencies resolved and recorded, and that a consumer can load."
              depends_on: []
              constraints: []
              acceptance: "From a clean state the library sets up in an isolated environment without error, and a consumer can then load it successfully."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies satisfied (none). Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: 'Created the Model Component as a uv project in model/ with the importable package model/model/. Dependencies resolved and recorded in uv.lock; direct dependencies pinned to the resolved versions (sqlmodel 0.0.47, pydantic 2.13.5, sqlalchemy 2.0.54; dev: ruff 0.16.10, pyright 1.1.414); Python constrained to 3.14.*. Observed: virtual environment deleted and rebuilt from the lock file, then the package loaded without error.'
                  decisions:
                    - unset: Physical arrangement of the package inside the Component root
                      chosen: Component root model/ holds the project declaration, lock file and documentation; the importable package model/model/ holds Interface, entity/ and core/. A model/.gitignore excludes the environment and bytecode caches.
                      why: Model Preferences name the Component directory and package as model but leave the project layout unstated; this keeps the Interface at the package root and the README at the Component root.
                    - unset: Build backend and version pinning form
                      chosen: uv_build with an explicit module root, and exact == pins for every direct dependency.
                      why: Development Preferences select uv and require concrete stabilized versions; the backend choice was unstated.
                - at:
                  execution: '004'
                  event: amended
                  detail: 'Quality-tool configuration was added to the project declaration after the Task was completed, once the tools Development Preferences select (ruff, pyright) were run on the Component: ruff line length 120 with the pycodestyle, pyflakes, isort, pyupgrade and bugbear rule sets and E501 ignored (descriptions copied from the Target are long lines), pyright in standard mode over the package; the ignore list excludes the environment, bytecode caches and the formatter cache. The final state rebuilds from the lock file and loads.'
                  decisions:
                    - unset: Rule sets and strictness of the selected formatter, linter and type checker
                      chosen: ruff line length 120 with rule sets E, F, I, UP, B and E501 ignored; pyright standard mode.
                      why: Development Preferences select the tools and the Python typing style but leave rules and strictness unstated.
        P1-G2:
          id: "P1-G2"
          title: "Core contracts"
          description: "The shared public contracts and shared Entity behaviour that every Entity relies on, kept independent of any single Entity."
          area: "Core: shared Declaration and Foundation contracts and shared Entity behaviour"
          does: "The contracts and behaviour every Entity depends on are in place and observable independently of any one Entity."
          constraints: []
          task_count: 8
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "003"
              title: "Publish the Declaration contract for Entities and Fields"
              description: "Publish the structured, immutable record that expresses the complete meaning of an Entity and of each of its Fields, free of any runtime behaviour."
              reason: "Entities and their consumers need one shared place that states what an Entity means."
              inputs:
                - "Completed Model library foundation"
              skills: []
              expected_result: "Any Entity can state its name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, and each Field its complete properties, through one uniform public record."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "A consumer can read every Entity-level and Field-level property through the published Declaration shape; the record cannot be altered after creation; it carries no storage, transport, or workflow information; and an absent default is distinguishable from an explicit null default."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependency P1-G1-T1 is done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Published the Declaration contract: immutable Entity-level and Field-level records with ordered Fields, Primary Key, Relations, Uniqueness Constraints and Indexes. Observed in a scratch run: assignment on a Declaration and mutation of a Field's constraints are refused; an absent default (has_default false) differs from an explicit null default (has_default true, default None); contradictory declarations (default plus generation, bad Relation, duplicate metadata, wrong is_active, unrecognized marker) are rejected. Field member names (name, description, type, nullable, has_default, default, sensitivity, immutable, constraints, value_generation) were not fixed by Model Preferences."
                  decisions:
                    - unset: Public member names of the Field Declaration and the names of the Relation, Uniqueness Constraint and Index records
                      chosen: FieldDeclaration members name, description, type, nullable, has_default, default, sensitivity, immutable, constraints, value_generation; Uniqueness Constraints and Indexes expressed as tuples of Field names; Entity-level and Relation members as listed in Model Preferences.
                      why: Preferences list only the Entity-level and Relation member names; the remaining names follow the Field properties named by the Model Definition.
            P1-G2-T2:
              id: "P1-G2-T2"
              source_id: "003"
              title: "Resolve Target Types to realizable value categories and stop on an unknown Type"
              description: "Provide one interpretation of every Target-declared Type into its realized value category and its JSON representation, and make realization stop with a report, rather than guess, when a Type is not recognized."
              reason: "Fields cannot be realized or converted faithfully without one agreed interpretation of every Target Type."
              inputs:
                - "Completed Model library foundation"
              skills: []
              expected_result: "Every Type the Target uses resolves to exactly one value category and JSON representation, and an unknown Type halts realization with an explicit report."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "Each Target Type is realized as its category requires, keeping decimals exact and datetimes timezone-aware; a Type the Target has not declared before stops realization with a clear report and yields no guessed result."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependency P1-G1-T1 is done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Published one Type table (string, integer, float, decimal, boolean, datetime as timezone-aware, date, time, uuid) from Model Preferences. An unknown Type raises an error naming the Type and the supported set before any declaration exists. Observed in a scratch run: Type 'money' is rejected with a report; a decimal default of integer 0 and an integer default of true are rejected under strict checking."
            P1-G2-T3:
              id: "P1-G2-T3"
              source_id: "003"
              title: "Enforce the Field contract on construction and mutation"
              description: "Provide the shared Entity behaviour that accepts only declared Fields and applies the same strict rules, with no coercion, to direct construction and to assignment: required values, nullability, Types, defaults, and constraints. Explicit false, zero, empty string, and null remain supplied values; a rejected assignment keeps the prior value; an immutable Field cannot change."
              reason: "One strict runtime contract stops construction and mutation from changing data or inventing behaviour."
              inputs:
                - "Published Declaration contract"
                - "Type resolution"
              skills:
                - "sqlmodel"
              expected_result: "A shared Entity behaviour under which invalid values are rejected and valid values are kept exactly as supplied."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T2"
              constraints: []
              acceptance: "Constructing with an unknown Field, a wrong Type, or a missing required value is rejected; supplied false, zero, empty string, and null are retained as given; a rejected assignment leaves the earlier value intact; an attempt to change an immutable Field is refused."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T1 and P1-G2-T2 are done. Claim recorded after first drafts of the shared base inputs (naming, column types, Foundation contract) had been written; no Entity or shared base module existed before this claim.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Shared Entity base realized: every direct construction is first validated strictly (declared Fields only, required values, nullability, Types, constraints, no coercion) and then initialized; assignment to a declared Field is validated strictly and atomically and reports the Field name without the value; immutable Fields refuse change; the base also verifies at class creation that an Entity's realized Fields match its Declaration in name, order, Type and presence. Observed in a scratch run with a throwaway Entity: unknown Field, wrong Type, missing value, over-long value and integer-for-decimal are rejected; false, empty string and null are retained as supplied; a rejected assignment keeps the earlier value; assigning an immutable Field is refused."
                  decisions:
                    - unset: How strict validation is applied to a table model, which skips validation on construction
                      chosen: The base validates the supplied data through the table model's own validation before initializing, detecting SQLModel's internal partial-initialization state through its finish_init flag (a private module of the pinned SQLModel version).
                      why: Model Preferences require validation before initializing; the flag is the only way to tell internal partial initialization from a direct construction without recursion.
                    - unset: Whether diagnostics may carry values
                      chosen: Every Entity hides input values in validation errors.
                      why: Model forbids echoing sensitive values in diagnostics; hiding for all Fields avoids depending on markers.
                    - unset: Extra consistency guard
                      chosen: Class creation fails when an Entity's realized Fields do not match its Declaration.
                      why: Keeps the Declaration the single source of the Entity's meaning, as Model Preferences require for copied metadata.
                - at:
                  execution: '004'
                  event: corrected
                  detail: "A defect surfaced while realizing Entities: a float Field accepted an integer at construction and kept it unconverted, an implicit coercion. Direct construction and assignment now refuse an integer for a float Field; JSON text keeps JSON's single number type. Observed: Asset(point_size=1) and assignment of 2 are rejected, 2.5 is accepted, a JSON round trip of a float is unchanged. ruff and pyright pass."
            P1-G2-T4:
              id: "P1-G2-T4"
              source_id: "003"
              title: "Keep generated values under their declaration's control"
              description: "Handle Fields with declared Value Generation: an omitted Auto Increment Field stays in an explicit pending state without becoming nullable, a caller-supplied value for it is refused, and a Generated Identifier is produced at Entity creation when one is declared."
              reason: "Generation ownership must stay with whoever is responsible for assigning the value, never with the caller or with Model."
              inputs:
                - "Shared Field-contract enforcement"
              skills:
                - "sqlmodel"
              expected_result: "Auto Increment Fields stay pending until assigned elsewhere, and declared Generated Identifiers are produced when an Entity is created."
              depends_on:
                - "P1-G2-T3"
              constraints: []
              acceptance: "Creating an Entity without its auto-incremented value yields a valid Entity whose value reads as not yet assigned; supplying such a value is rejected; Model never assigns it."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependency P1-G2-T3 is done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: 'Generated-value handling added to the shared base: an Auto Increment Field omitted at construction stays pending (None) without becoming nullable; a non-null caller-supplied value is refused at construction and any later assignment of such a Field is refused; the base never assigns it; a declared Generated Identifier is produced with the selected uuid4 algorithm when omitted. Observed in a scratch run against in-memory SQLite: omitted id reads None; id=3 refused; id=None accepted as pending; assignment refused before and after the database assigned id 1; the database-assigned value was readable afterwards.'
                  decisions:
                    - unset: Whether an explicit null for an Auto Increment Field counts as a supplied value
                      chosen: Explicit null is accepted as the pending state; any non-null value is refused.
                      why: Model Preferences name None as the pending representation and Model forbids supplied values, so null is the one value that carries no caller choice.
            P1-G2-T5:
              id: "P1-G2-T5"
              source_id: "003"
              title: "Keep Sensitivity Markers metadata-only"
              description: "Accept only the approved Sensitivity Markers, expose a marker through the Declaration, leave the marked value untouched in the Entity and its JSON Object, and keep sensitive values out of every diagnostic."
              reason: "Model records the meaning of sensitivity without taking on responsibility for protecting values."
              inputs:
                - "Published Declaration contract"
                - "Shared Field-contract enforcement"
              skills:
                - "sqlmodel"
              expected_result: "Sensitivity is visible in Declarations while values remain exactly as supplied and never appear in failure reports."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T3"
              constraints: []
              acceptance: "A Field carrying an approved marker exposes it through its Declaration and holds exactly the supplied value; an unapproved marker is rejected; a failure involving such a Field reports no part of its value."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T1 and P1-G2-T3 are done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Sensitivity is metadata only: a Field Declaration accepts only the markers Model Preferences recognize (password, sensitive) and exposes the marker; Entity state and the JSON Object keep the exact supplied value; every Entity hides input values in validation errors; the Entity's diagnostic representation omits Fields that carry a marker. Observed in a scratch run: a failure involving a marked Field's Entity names the Field and Type but not the value; the JSON text carried the exact value; an unrecognized marker was rejected at declaration."
                  decisions:
                    - unset: Whether the Entity's own printable representation may show a marked value
                      chosen: The representation omits Fields carrying a Sensitivity Marker.
                      why: Representations appear in logs and tracebacks; omitting the Field protects secrets without changing the stored value, the JSON Object or the Declaration.
            P1-G2-T6:
              id: "P1-G2-T6"
              source_id: "003"
              title: "Map every Entity to its storage-ready table form"
              description: "Make each Entity realize its Declaration as a storage-ready table form with deterministic table, column, constraint, and index naming, an identity column for auto-increment Fields, and column behaviour that keeps decimals exact and datetimes timezone-aware and stored in UTC."
              reason: "Consumers of Model rely on one predictable storage mapping that matches the Declaration exactly."
              inputs:
                - "Published Declaration contract"
                - "Type resolution"
                - "Shared Field-contract enforcement"
              skills:
                - "sqlmodel"
              expected_result: "Any Entity can be consumed as a table form whose names, constraints, indexes, and column behaviour follow one fixed convention."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T2"
                - "P1-G2-T3"
              constraints: []
              acceptance: "For any Entity the table name equals the Entity name and each column name equals its Field name; primary key, foreign key, unique, and index names follow one deterministic convention; auto-increment Fields map to an identity column; decimal and datetime values keep their exact value in their columns."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T1, P1-G2-T2 and P1-G2-T3 are done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Storage-ready mapping realized in the shared base and Core column types: constraint names follow one convention set on the shared metadata (pk_<table>, fk_<table>_<field>, uq_<table>_<fields joined by _>, ix_<table>_<fields joined by _>); the exact-decimal column type stores decimal text and returns decimal.Decimal; the datetime column type is built on a timezone-aware datetime column, normalizes to UTC on write and returns UTC-aware values on read; table name, identity construct and SQLite autoincrement are applied per Entity from its Declaration. Observed in a scratch run on in-memory SQLite: table name equals the Entity name, column names equal Field names, constraint names matched the convention, auto-increment id rendered as an identity primary key, Decimal('1.2300') and a +02:00 datetime came back exact and UTC-aware."
                  decisions:
                    - unset: Meaning of 'exactly the Entity name' for the table name
                      chosen: The table name equals the Entity's physical class name (e.g. TradingPlatform), not the spaced logical name.
                      why: A table named with a space would break the prescribed constraint names; the physical name is the Entity name in its realized form.
            P1-G2-T7:
              id: "P1-G2-T7"
              source_id: "003"
              title: "Apply deterministic physical naming"
              description: "Keep logical Entity, Field, and Relation names exactly as the Target spells them, derive physical names deterministically from the selected language's naming rules, and reject unresolvable reserved-word or normalization collisions instead of repairing them."
              reason: "Domain names must stay understandable without technical context while source still follows its language."
              inputs:
                - "Published Declaration contract"
              skills: []
              expected_result: "Declarations carry exact Target spellings, and physical names are derived the same way on every generation."
              depends_on:
                - "P1-G2-T1"
              constraints: []
              acceptance: "Every Declaration exposes names spelled exactly as the Target spells them; physical names follow the selected naming style identically on every generation; a collision that cannot be resolved is reported and rejected, never silently altered."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependency P1-G2-T1 is done. Claim recorded after the first draft of the naming module had been written.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Naming rules realized: an Entity's class name is its logical name with spaces removed and each word capitalized; Field attribute names are snake_case; both reject unnormalizable names and names that collide with Python keywords, SQLModel/Pydantic attributes or the Model's own member names; a Declaration rejects Fields whose normalized names collide. Logical names stay exactly as supplied in the Declaration. Observed in a scratch run: 'Trading Platform' maps to TradingPlatform; 'metadata', 'class', 'json', 'declaration' and 'to_json' are rejected; two Fields normalizing to the same name are rejected. Cross-Entity collisions are not decidable inside one Declaration and are left to the Interface Task."
                  decisions:
                    - unset: What counts as a reserved word and how logical names become physical names
                      chosen: Reserved = Python keywords, every attribute of the SQLModel base, and declaration, to_json, from_json. Entity names use PascalCase from space-separated words; Field names use snake_case.
                      why: Model Preferences select PascalCase for Entities and snake_case for Fields without listing the collisions to reject.
            P1-G2-T8:
              id: "P1-G2-T8"
              source_id: "003"
              title: "Provide lossless Entity-to-JSON conversion"
              description: "Provide the shared conversion between an Entity and its JSON Object, meaning JSON text with one root object whose keys are exactly the Field names in Declaration order, and reconstruction of an Entity from that text which rejects malformed text and otherwise follows the construction rules."
              reason: "Consumers need one portable, lossless value representation of every Entity."
              inputs:
                - "Shared Field-contract enforcement"
                - "Generated-value handling"
              skills:
                - "sqlmodel"
              expected_result: "Every Entity converts to JSON text and back without loss."
              depends_on:
                - "P1-G2-T3"
                - "P1-G2-T4"
              constraints: []
              acceptance: "Converting any Entity to JSON text and back yields an equal Entity; keys are exactly the Field names in Declaration order; null, false, zero, and empty string stay distinct; exact decimals and offset-bearing datetimes are preserved; malformed text is rejected; a pending auto-increment value is represented as null."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T3 and P1-G2-T4 are done. Claimed before changing the Task result; a first draft of the Foundation contract existed from earlier work on this Group.
                - at:
                  execution: '004'
                  event: completed
                  detail: "Foundation realized as the shared conversion contract: to_json writes JSON text with one root object whose keys are exactly the Field names in Declaration order; from_json parses the text, decodes each value through its own strict Field check (decimals only from strings, datetimes only from offset-bearing strings), rejects malformed text, non-object roots, non-standard constants, unknown keys, wrong Types and missing required values, then constructs through the table model's strict validation. Observed in a scratch run: Entity to JSON text and back gave identical JSON with a 20-digit decimal and a +02:00 datetime preserved; null, false, zero and empty string stayed distinct; pending id is null and restores as pending; a database-loaded Entity round-tripped; every rejection case above raised without echoing a supplied value. A defect found on the way (JSON numbers accepted for decimals; key order following assignment order) was corrected before completion. ruff and pyright pass on the Core."
                  decisions:
                    - unset: Whether JSON reconstruction may restore an already-assigned Auto Increment value
                      chosen: from_json accepts a non-null value for an Auto Increment Field; direct construction and assignment still refuse one.
                      why: A lossless round trip of a stored Entity requires restoring its assigned id; the refusal in Model's Principle concerns a caller choosing the value.
                    - unset: How JSON text is decoded into Types
                      chosen: Each Field is decoded by its own strict adapter after parsing the text with the standard JSON parser, because SQLModel table models skip Pydantic's JSON-mode validation.
                      why: Validating the whole text through the table model accepted unvalidated strings; explicit per-Field decoding keeps exact decimals and rejects coercion.
        P1-G3:
          id: "P1-G3"
          title: "Entities"
          description: "One Task per Target Entity. Each Task realizes exactly one Entity as the Target's Models section defines it and holds only that Entity's own meaning."
          area: "Entity units"
          does: "Every Target Entity exists as its own Entity whose Declaration matches the Target definition and which behaves according to the shared Core contracts."
          constraints: []
          task_count: 15
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              source_id: "003"
              title: "Realize the User Entity"
              description: "Realize the User Entity as the Target defines it."
              reason: "User is the owning concept most other Entities relate to, so it must exist before its dependents can resolve their Relations."
              inputs:
                - "Target definition of the User Entity"
                - "Completed Core contracts"
              skills:
                - "sqlmodel"
              expected_result: "A User Entity complete per its Target definition and ready for publication."
              depends_on:
                - "P1-G2-T5"
                - "P1-G2-T6"
                - "P1-G2-T7"
                - "P1-G2-T8"
              constraints: []
              acceptance: "User's Declaration exposes uniqueness of name and of username, and its credential Fields hold exactly the values supplied."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T5, P1-G2-T6, P1-G2-T7 and P1-G2-T8 are done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: 'Entity module realized from its Target definition by the shared Entity template: Declaration (Fields in Target order with id first, Primary Key, Relations, Uniqueness Constraints) and table-model Fields that match it. Observed: ruff and pyright pass on the Component; a scratch comparison of the Declaration against the realized table found no differences in table name, column order, primary key, nullability, foreign keys versus Relations, unique constraints, constraint names, identity construct or SQLite autoincrement; construction, JSON text round trip and Declaration access worked.'
                  decisions:
                    - unset: Whether credential Fields carry a Sensitivity Marker
                      chosen: No Sensitivity Marker is declared on password or api_key.
                      why: The Target states credentials as storage Rules (hash at rest), not as a Sensitivity Marker, and Model adds only id, is_active and Preference defaults; storage protection belongs to Database. Recorded as an Open Question for the Human.
                    - unset: Where the Entity's Declaration description and Field descriptions come from
                      chosen: The Target Purpose text, verbatim, for the Entity and for each Field; id carries none.
                      why: Model preserves each Entity's and Field's description from the Target.
            P1-G3-T2:
              id: "P1-G3-T2"
              source_id: "003"
              title: "Realize the Trading Platform Entity"
              description: "Realize the Trading Platform Entity as the Target defines it."
              reason: "Trading Platform is an independent concept that Instances and Positions refer to."
              inputs:
                - "Target definition of the Trading Platform Entity"
                - "Completed Core contracts"
              skills:
                - "sqlmodel"
              expected_result: "A Trading Platform Entity complete per its Target definition and ready for publication."
              depends_on:
                - "P1-G2-T5"
                - "P1-G2-T6"
                - "P1-G2-T7"
                - "P1-G2-T8"
              constraints: []
              acceptance: "Trading Platform's Declaration exposes uniqueness of name and the platform code Field, and carries no behaviour tied to any particular platform."
              status: "done"
              log:
                - at:
                  execution: '004'
                  event: claimed
                  detail: Dependencies P1-G2-T5, P1-G2-T6, P1-G2-T7 and P1-G2-T8 are done. Claimed before changing the Task result.
                - at:
                  execution: '004'
                  event: completed
                  detail: 'Entity module realized from its Target definition by the shared Entity template: Declaration (Fields in Target order with id first, Primary Key, Relations, Uniqueness Constraints) and table-model Fields that match it. Observed: ruff and pyright pass on the Component; a scratch comparison of the Declaration against the realized table found no differences in table name, column order, primary key, nullability, foreign keys versus Relations, unique constraints, constraint names, identity construct or SQLite autoincrement; construction, JSON text round trip and Declaration access worked.'
            P1-G3-T3:
              id: "P1-G3-T3"
              source_id: "003"
              title: "Realize the Instance Entity"
              description: "Realize the Instance Entity as the Target defines it."
              reason: "Instance connects a User to a Trading Platform and is referred to by Accounts."
              inputs:
                - "Target definition of the Instance Entity"
                - "Completed Core contracts"
                - "Completed User and Trading Platform Entities"
              skills:
                - "sqlmodel"
              expected_result: "An Instance Entity complete per its Target definition and ready for publication."
              depends_on:
                - "P1-G2-T5"
                - "P1-G2-T6"
                - "P1-G2-T7"
                - "P1-G2-T8"
                - "P1-G3-T1"
