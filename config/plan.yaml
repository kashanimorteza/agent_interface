                  execution: '007'
                  event: completed
                  detail: 'Verified and recorded that every changing Operation (Add, Update, Delete, Enable, Disable, Truncate) runs in one explicit transaction that commits on success and rolls back on any error, and that separate calls share no transaction. Observed on a real database holding the Initial Data: a duplicate Add, a Delete of a referenced record and a Truncate of a referenced Entity each failed with the execution-failure error and the data of every Entity was exactly as before; a failed call after a successful one did not undo the earlier one; successive calls each committed on their own. No separate code was needed beyond the transaction handling recorded under the Engine connection Task.'
