                  execution: '007'
                  event: completed
                  detail: "Implemented the Table difference check in the Core's CreateTables coordinator with an Engine capability that describes existing Tables. Observed on a real database: an added column on Currency stopped the command with the Declaration-incompatibility error 'Currency (differs in columns)'; a hand-made Broker with nullable columns and no keys or relations was reported as 'Broker (differs in columns, unique, foreign_keys)'; after each stop the Tables and the stored record were exactly as before; with the mismatching Table dropped the next run created only that Table and reported 14 already matched."
                  decisions:
                    - unset: What aspects of an existing Table are compared with its Declaration and when the comparison runs
                      chosen: Before anything is created, every existing Table is described by the Engine (column names and order, a type family, nullability, primary key, uniqueness sets, foreign keys, non-unique indexes) and compared with what the Entity's Declaration implies; every differing aspect is listed by name (never a value) in one Declaration-incompatibility error naming the Entity, and nothing is changed. Type families treat strings, decimals and UUIDs as text because they share storage; a missing Table is simply created.
                      why: The Definition says a difference stops the command, is reported and is never resolved by judgment; collecting every difference in one report is allowed when safe.
