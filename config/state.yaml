            - group: "P1-G1"
              tasks: ["P1-G1-T01", "P1-G1-T02", "P1-G1-T03", "P1-G1-T04", "P1-G1-T05", "P1-G1-T06", "P1-G1-T07", "P1-G1-T08", "P1-G1-T09", "P1-G1-T10"]
              reason: "Library establishment and every shared contract and behaviour the Model Definition requires of all Entities."
            - group: "P1-G2"
