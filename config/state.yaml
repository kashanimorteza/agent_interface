    - id: "012"
      skill: "my-interface-review"
      parent_id: "009"
      phase: "P3"
      event: "review"
      outcome: "satisfied"
      started_at: "2026-10-05T11:50:49Z"
      completed_at: "2026-10-05T11:54:27Z"
      duration: "3:38"
      report: "Reviewed P3 (Logic) against its Plan (21 Tasks) and the Review categories of Logic, Storage Service and Entity Service. One Finding raised (an inaccurate troubleshooting entry in the Logic README), resolved and rechecked. All 6 Logic, 8 Storage Service and 10 Entity Service review observations and all 21 Task acceptance criteria were observed to hold; technical checks pass; regeneration gives zero difference. While reviewing, a defect in the already-reviewed Database Component was observed and is recorded as an Open Question. Outcome satisfied. One Open Question and reaffirmed ones; no Blockers."
      open_questions:
        - "OQ-012-1"
      blockers: []
      data:
        findings:
          - id: "F-012-1"
            state: "resolved"
            resolution: "Rewrote the troubleshooting entry of the Logic README to state what actually happens: passing the Entity class again raises InvalidInputError for some Actions (get_by_id(User, 1): the id must be an integer) and TypeError for others (count(User): the class is taken for the filters), an unknown keyword such as entity= raises TypeError, and only add and update take an Entity instance; the fix (call the Action without the class) is unchanged."
            recheck: "Each symptom named in the new entry was reproduced in a clean prepared copy (InvalidInputError, TypeError, TypeError); the other troubleshooting claim that was unobserved (no such table on an unprepared Database) was reproduced as an execution-failure error; the README's examples and the documentation observations pass again; ruff and pyright pass."
            kind: "documentation"
            component: "Logic"
            expected: "Task P3-G7-T3 and Logic Preferences: the troubleshooting part covers real problems a consumer can meet and how to fix them; each stated symptom is what actually happens."
            observed: "The Logic README says that passing the Entity class again to a Child Service Action fails with a TypeError about an unexpected argument and gives get_by_id(User, 1) as the example. That call raises InvalidInputError ('An id must be an integer'); other forms of the same mistake raise InvalidInputError or a TypeError about the class not being iterable, and an unexpected keyword raises a TypeError."
            evidence: "README.md line 125 (the TypeError bullet in Troubleshooting). Observed in a clean prepared copy: get_by_id(User, 1) -> InvalidInputError; sum(User, User.id) -> InvalidInputError; add(User, instance) -> InvalidInputError; count(User) and list(User) -> TypeError: 'SQLModelMetaclass' object is not iterable; get_by_id(entity=User, id=1) -> TypeError (unexpected keyword)."
        checks_performed:
          logic_review_observations:
            - "1. Interface needs in the Logic Definition versus the Logic Interface Schema: aligned by reading (Complete, Unchanged, Nothing else against the entries, no_behaviour and contract_change rules); the Schema holds nothing beyond them."
            - "2. Logic Interface publishes exactly one entry for every Service listed in Logic Preferences, under its configured name, and nothing else: observed (Entity and Storage; equal to its published list)."
            - "3. Every entry is the identical Interface object of its Service: observed by identity."
            - "4. No Service other than the Storage Service imports Database's Interface: observed by scanning every import of every file (only the Storage Service's two files import Database)."
            - "5. No Service imports Logic Interface: observed by the same scan; loading either Service alone does not load Logic's entrypoint (fresh interpreters)."
            - "6. No two Services share a name or directory: observed (entity and storage)."
          storage_service_review_observations:
            - "Interface needs versus the Logic Storage Interface Schema: aligned by reading."
            - "Storage Interface publishes exactly one Action for every capability Database publishes (16) and nothing else besides the gateway and the 16 republished contracts: observed."
            - "Each Action has the same parameter names, order and defaults (and annotations) as its capability: observed for all 16."
            - "Each Action returns its capability's result and raises its errors unchanged: observed by comparing 16 Actions with Database for the same arguments, and the invalid-input error for all 16."
            - "Every republished contract, including every Database error, is the identical object: observed by identity (16)."
            - "No Action adds validation, retry, Engine or default-Instance selection or a rule: observed by parsing the source (every Action body is the single forwarding return)."
            - "Every Action is an operation of the one gateway class, is named exactly as its capability and uses the one Database access created in its constructor: observed (one construction of Database in the source; a second gateway holds its own access)."
            - "Loading the Interface opens no connection and creates no data or file: observed with audit hooks."
          entity_service_review_observations:
            - "Interface needs versus the Logic Entity Interface Schema: aligned by reading."
            - "Entity Interface publishes exactly one Child Service for every Entity in the Collection (15) and every Storage contract except the gateway (16), nothing else: observed."
            - "Every republished contract is the identical object Storage publishes: observed by identity."
            - "Base has exactly one Action for every Storage Action that takes an Entity (12), in Storage's order, with the same name, and none for the four that take none: observed."
            - "Each Action has Storage's parameter names, order and defaults without the Entity class parameter, add and update keeping the instance: observed for all 12."
            - "Each Action returns Storage's result, raises its errors unchanged and rejects an instance of another Entity with the Invalid Input error: observed on all 15 Child Services against the real database (add and update rejection; count, list and get by id equal to Storage's)."
            - "Every Action uses the one Storage access Base holds: observed with a recording stand-in (10 Actions on each of 15 Children forwarded the bound Entity class through it)."
            - "Every Child unit and structure name follows the configured patterns and is valid, unique and free of collisions: observed."
            - "Every Child Service binds exactly its own Entity and receives Base: observed by identity."
            - "Loading the Interface opens no connection and creates no data or file: observed with audit hooks."
          plan_acceptance: "All 21 Task acceptance criteria were observed to hold, including the literal end-to-end scenario through the Logic Interface (add, list by Filter, read, update, disable, enable, count, sum over exact decimals, delete, another kind rejected, every answer equal to Database's) and the claim that the gateway follows Database: in a scratch copy a capability and a contract were added to and one capability removed from Database's Interface, and regeneration added or removed exactly those Actions and republished the contract, nothing else."
          technical:
            - "ruff format check, ruff check and pyright pass; the lock file is consistent with the declaration; the declared dependencies (model, database) are exactly what the source imports."
            - "The Component builds to a wheel and source archive; the wheel installs into a fresh environment with the sibling Components and the Logic Interface imports from it."
            - "All 73 Python examples of the three READMEs execute in order on a freshly prepared database (35, 33 and 5)."
            - "Regeneration of every generated source file from the live Model, Database and Storage Interfaces, followed by the selected formatter, gives zero difference."
            - "No machine-specific path, agent-identifying text or timestamp; no framework, process or transport import; Model and Database are unchanged and the real Database storage still holds 15 Tables and 23 records."
          testing_scope: "Persistent testing is disabled for Logic; every condition was verified transiently with scripts kept outside the Component and with scratch copies for anything that writes data, and no test was added to it."
        observations_about_the_review:
          - "The generator is the implementer's own tool and is not part of the Component, so zero-difference regeneration shows consistency with the live Interfaces, not independence; independence comes from the separate observations above, which derive the expected membership and signatures from the live Interfaces themselves. The naming-collision stop (a generation-time configuration error) cannot be observed in the shipped Component and rests on the generator run recorded in the Task Log."
          - "Whether an Action's Entity parameter is a class or an instance cannot be read from the published types (Database types them all alike); the Task Log records the decision that add and update take the instance, which matches what the Database Interface Schema states. It stays open as OQ-010-1."
          - "Database publishes no documentation on its capabilities, so Storage and Base Actions carry none (OQ-011-1)."
          - "Several of my own checks failed on first run because of mistakes in the checks (a link regex that also matched an external link, and a paragraph counter that split a code block); each was verified directly and not treated as a defect of the Component. Two lines of an earlier scratch probe ended in an unconditional pass and are not counted as evidence."
        open_questions:
          OQ-012-1:
            question: "Reviewing Logic showed a defect in the Database Component, whose P2 Review was recorded satisfied: when a non-sequence value is passed as the filters parameter of an Operation (for example count(User) given through a Child Service, so the class lands in filters), Database raises a raw TypeError ('object is not iterable') instead of the invalid-input error its Definition and Schema require for invalid input. Logic passes it through unchanged, as required. Should Database be re-planned or re-developed and re-reviewed?"
            current_choice: "Not changed: it belongs to the Database Component and Review may change only the reviewed Component; the Logic README documents the observed behaviour."
            where: "Database core data module, query resolution"
        reaffirmed_open_questions:
          OQ-010-1: "Observed again at review; the result matches the Database Interface Schema's statement that add and update take an Entity instance."
          OQ-011-1: "Observed again at review; Storage and Base Actions carry no documentation because Database publishes none."
