              reason: "One Entity per Target model, in Target order, so each Entity is an independently executable and observable result."
            - group: "P1-G3"
              tasks: ["P1-G3-T01", "P1-G3-T02", "P1-G3-T03", "P1-G3-T04"]
              reason: "Public exports, ordered collection, cross-Entity metadata resolution, and side-effect-free loading, as the Model Interface Schema and Definition require."
            - group: "P1-G4"
