# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "config/state.yaml"
  path_note: "Mutable Workflow position, Phase progress, and execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the Phase selected by stable Target phase identifier, then the Log Entries by identifier."
  selection: "A requested phase resolves to the phases entry keyed by that phase identifier; a Log Entry resolves by its identifier."
  absence: "No matching phases entry means no progress is recorded for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current Workflow position."
  phases: "Aggregate progress for each Target phase."
  log: "Recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "reviewing"
    phase: "P1"
    mode_reason: "Reviewing phase P1 was invoked directly by the Human."
    set_by: "review"
    set_at: "2026-10-05T09:13:12Z"
  phases:
    P1:
      id: "P1"
      planning: "completed"
      development: "completed"
      review: "not satisfied"
      completed_at: null
  log:
    - id: "001"
      skill: "configure"
      event: "configure"
      outcome: "completed"
      started_at: "2026-10-05T08:45:11Z"
      completed_at: "2026-10-05T08:45:32Z"
      duration: "21 seconds"
      report: "Generated Plan Config and State Config from their current Schemas composed with the general YAML structure; both were absent. Structure verified by parsing the two records."
      data:
        records:
          - file: "config/plan.yaml"
            result: "created"
          - file: "config/state.yaml"
            result: "created"
    - id: "002"
      skill: "plan"
      phase: "P1"
      event: "plan"
      outcome: "completed"
      started_at: "2026-10-05T08:46:47Z"
      completed_at: "2026-10-05T08:50:18Z"
      duration: "3:31"
      open_questions:
        - "002-OQ1"
      blockers: []
      report: "Planned phase P1 (Model) from scratch: 1 Plan, 5 Groups, 32 Tasks. No prior Plan existed, so nothing was preserved, changed, removed, or replaced. Structure checked: counts, key/id agreement, dependency resolution and acyclicity, no duplicate statements across Tasks, no path or symbol terms in planning content."
      data:
        phases:
          planned: ["P1"]
          skipped: []
          stopped: []
        task_changes:
