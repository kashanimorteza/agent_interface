            question: "The Target states credentials as storage Rules (hash or encrypted at rest) and declares no Sensitivity Marker, so no Entity Field carries a marker. Should the Target declare markers (the approved ones are password and sensitive) so Model exposes them in Declarations?"
            current_choice: "No markers declared; Model adds only id, is_active and Preference defaults."
            where: "P1-G3-T1"
          OQ-004-2:
            question: "The sqlmodel Skill recommends SQLModel's built-in UTC datetime column type (SQLModel 0.0.45 and newer) and advises against DateTime(timezone=True) overrides. Model Preferences prescribe DateTime(timezone=True) stored in UTC and read back UTC-aware. Should Preferences adopt the built-in type?"
            current_choice: "A Core column type built on DateTime(timezone=True) that normalizes to UTC on write and returns UTC-aware values on read."
            where: "P1-G2-T6"
          OQ-004-3:
            question: "Model refuses a caller-supplied Auto Increment value, but a lossless JSON round trip of a stored Entity must restore its assigned id. Is accepting an assigned id in from_json (and only there) the intended reading?"
            current_choice: "from_json accepts a non-null Auto Increment value; direct construction and assignment refuse one."
            where: "P1-G2-T8"
