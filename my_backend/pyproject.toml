[project]
name = "my-backend"
version = "0.1.0"
description = "Application Behaviour and public HTTP API for the Trading Assistant Target."
requires-python = ">=3.13"
dependencies = [
    "my-model",
    "my-database",
    "fastapi[standard]>=0.115",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_backend"]

[tool.uv.sources]
my-model = { path = "../my_model", editable = true }
my-database = { path = "../my_database", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "my_backend.app:app"

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
