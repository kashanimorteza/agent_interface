[project]
name = "api"
version = "0.1.0"
description = "The Trading Assistant API: every Group of the Logic library served through one network boundary."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "logic",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api.bootstrap:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
logic = { path = "../logic", editable = true }

[tool.fastapi]
entrypoint = "api.bootstrap:app"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
