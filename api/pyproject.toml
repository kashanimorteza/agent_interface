[project]
name = "api"
version = "0.1.0"
description = "Target API: one network boundary that serves every Group."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "api"

[tool.ruff.lint.isort]
combine-as-imports = true
