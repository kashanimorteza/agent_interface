[project]
name = "api"
version = "0.1.0"
description = "Separate API executable over the Logic library for operating on the Trading Assistant Entities."
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "logic",
    "pyyaml>=6.0.3",
]

[project.scripts]
api = "api.bootstrap:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
logic = { path = "../logic" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
