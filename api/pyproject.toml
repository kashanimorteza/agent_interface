[project]
name = "api"
version = "0.1.0"
description = "Executable API that serves every Group beneath one network address."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "logic",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api.bootstrap:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "api"

[tool.uv.sources]
logic = { path = "../logic", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["api"]
