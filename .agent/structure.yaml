meta:
  name: "STRUCTURE — project map"
  purpose: "Answers the question 'where is everything' — the list of layers and the path to each index"
  completeness: "Anything not on this map does not exist as far as an agent is concerned"
  depth: "This map knows the content of no layer — only its path and responsibility"
  agent_may_edit: false
  on_change_needed: "Record a proposal in questions.yaml — only a human may change this file"
  updated: "2026-08-24"


layers:
  layer_1: "root.yaml — entry and protocol"
  layer_2: "project.yaml — product layer; defines itself, the map only points to it"
  layer_3: "rules.yaml — rules layer; defines itself, the map only points to it"
  layer_4: "develop/develop.yaml — build layer; defines itself, the map only points to it"
  cross_1: "state.yaml — current state layer; defines itself, the map only points to it"
  cross_2: "history/history.yaml — history layer; defines itself, the map only points to it"


map:

  root:
    layer: 1
    path: "root.yaml"
    responsibility: "Entry point — read protocol, working modes, and write protocol"
    note: "The only file an agent finds without guidance"

  project:
    layer: 2
    path: "project.yaml"
    responsibility: "Product definition — identity, goals, non-goals, outcomes, architecture"
    note: "To understand what is being built, read project.yaml"

  rules:
    layer: 3
    path: "rules.yaml"
    responsibility: "Rules governing agent behavior — security, quality, and their precedence"
    note: "No rule lives anywhere else — read rules.yaml before doing anything"

  develop:
    layer: 4
    path: "develop/develop.yaml"
    responsibility: "Build layer index — items, the file template of each item, and the contracts between them"
    note: "For any work in this layer, read develop.yaml first"

  state:
    layer: "cross"
    path: "state.yaml"
    responsibility: "State layer index — state files, their read order, and the rules for writing them"
    note: "To understand 'where we are right now', read state.yaml first"

  history:
    layer: "cross"
    path: "history/history.yaml"
    responsibility: "History layer index — record types, the format of each, and the rules for writing them"
    note: "Before recording anything in this layer, read history.yaml first"
