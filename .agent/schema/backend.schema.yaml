schema:
  id: agent-interface-backend
  version: "1.1"
  purpose: "The shape of backend.yaml — every parameter an agent reads to understand the backend project"
  defaults:
    rule: "A field carrying `default` is always written into backend.yaml — the project's stated value when the project states one, the schema's default when it does not."
    note: "A default is an answer, not a guess — an unstated field that has one is never written as 'to be defined' and never becomes an open question. A field with no default keeps that behaviour unchanged."

structure:
  - enabled
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - standards
  - code_layout
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Enabled -->
  enabled:
    required: true
    purpose: "Whether the backend is in play — false leaves the entry standing and takes the item out of the build."

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding the backend's actual code — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The backend in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that produces code is proven by a written test in tests/ — true means a task's verify is that test run; set by the human."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory every verify command runs from, and the environment it runs inside — for the backend, always inside its virtual environment."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the backend is answerable for — one sentence, wider than summary and narrower than the product."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "What the backend is built with — the choices an agent follows and never re-decides; every choice carries a default, so a choice the project leaves unstated is answered by the schema rather than guessed."
    fields:
      language:
        required: true
        purpose: "The programming language the backend is written in, and the parent of everything language-specific — its environment tool and its packages hang beneath it."
        fields:
          name:
            required: true
            default: "Python"
            purpose: "The language itself."
          version:
            required: true
            default: "latest"
            purpose: "The language version — the pinned version when the project names one, otherwise the latest stable release available when development starts."
          environment:
            required: true
            purpose: "The isolated environment every command and every install happens inside — created and driven by one named tool, and never committed."
            fields:
              name:
                required: true
                default: "uv"
                purpose: "The tool that creates the virtual environment and installs into it — the only route a dependency enters the project by."
              version:
                required: true
                default: "latest"
                purpose: "The version of that tool."
          packages:
            required: true
            purpose: "The frameworks, libraries, and tools the backend is built on — one structured entry per role, never a single combined line; a role the project leaves unstated takes its default."
            fields:
              api:
                required: true
                purpose: "The framework serving the HTTP surface the contract is published over."
                fields:
                  name:
                    required: true
                    default: "FastAPI"
                    purpose: "The API framework."
                  version:
                    required: true
                    default: "latest"
                    purpose: "Its version."
              orm:
                required: true
                purpose: "The layer every read and write of the database goes through."
                fields:
                  name:
                    required: true
                    default: "SQLAlchemy"
                    purpose: "The ORM."
                  version:
                    required: true
                    default: "latest"
                    purpose: "Its version."
              migration:
                required: true
                purpose: "The tool that carries the database schema from one version to the next — the only way the schema changes."
                fields:
                  name:
                    required: true
                    default: "Alembic"
                    purpose: "The migration tool."
                  version:
                    required: true
                    default: "latest"
                    purpose: "Its version."
              "<package>":
                required: false
                purpose: "One entry per further package the project names — same two fields, set by the human, never inferred by an agent from the code."
                fields:
                  name:
                    required: true
                    purpose: "The package."
                  version:
                    required: true
                    purpose: "Its version."
      database:
        required: true
        purpose: "The data engine, where the data physically lives, who owns the schema, and the only permitted route to it."
      run:
        required: true
        purpose: "The command that starts the backend."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "How the backend's code is written — conventions the project settles once so an agent follows them instead of deciding them file by file; each carries a default, and the project's value wins wherever it states one."
    fields:
      naming:
        required: true
        purpose: "The case style each kind of name takes — the defaults are the conventions of the default language and hold until the project states otherwise."
        fields:
          variables:
            required: true
            default: "snake_case"
            purpose: "How a variable is named."
          functions:
            required: true
            default: "snake_case"
            purpose: "How a function or method is named."
          classes:
            required: true
            default: "PascalCase"
            purpose: "How a class is named."
          constants:
            required: true
            default: "UPPER_SNAKE_CASE"
            purpose: "How a constant is named."
          files:
            required: true
            default: "snake_case"
            purpose: "How a file inside code_path is named."
          folders:
            required: true
            default: "snake_case"
            purpose: "How a folder inside code_path is named."

  # <!--------------------------------------------------------------------------------- Code_Layout -->
  code_layout:
    required: true
    purpose: "Every path inside code_path and what it holds — the key is the path, the value is its responsibility in one line; a folder ends with a slash, a file carries its extension. Entry point, configuration, database access, models, validation schemas, services, routes, errors, migrations, and tests each have their own place."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The backend's only connection to the other items — the contract it publishes."
    fields:
      produces:
        required: true
        purpose: "The contract version the backend publishes."
      rule:
        required: true
        purpose: "What the contract binds the backend to — the implementation must match the frozen contract exactly."
      change_rule:
        required: true
        purpose: "What happens when the contract must change — a frozen contract is versioned, never edited, and that is a human decision."
      "<version>":
        required: true
        purpose: "One entry per contract version — the full surface a consumer may build against."
        fields:
          lifecycle:
            required: true
            purpose: "Where the version stands — draft, frozen, or deprecated; only a frozen contract may be defined against."
          lifecycle_note:
            required: true
            purpose: "What the lifecycle means for this version, and what a change to it would cost."
          consumed_by:
            required: true
            purpose: "The item reading this contract."
          contract_read_order:
            required: true
            purpose: "The order the contract is read in, and why."
          conventions:
            required: true
            purpose: "What holds across the whole surface — transport, identifiers, timestamps, and the answer to an unknown id."
          error_shape:
            required: true
            purpose: "The single shape every failure takes — its rule, its exact fields, and the codes a consumer may branch on."
          models:
            required: true
            purpose: "The data shapes the surface returns — the key is the model, the value is its fields and their limits."
          routes:
            required: true
            purpose: "The surface itself, read last — each route carries method, path, summary, its body when it takes one, its success response, and the error codes it may answer with."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the backend."
    fields:
      owns:
        required: true
        purpose: "What belongs to the backend — its code and the whole database schema."
      does_not_own:
        required: true
        purpose: "What is explicitly not the backend's, however close it sits — client code."
      interface:
        required: true
        purpose: "The only thing the backend offers the outside — its contract."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the backend does not do — named so it is never inferred into a task."
