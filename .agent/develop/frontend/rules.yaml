meta:
  item: "frontend"
  layer: 4
  purpose: "Rules specific to the frontend item — a supplement to the global rules, not a replacement for them"
  relation_to_global: "May only be stricter, never more permissive — precedence is defined in the global rules.yaml"
  agent_may_edit: true
  editable_in_mode: "planning"
  updated: "2026-08-24"


code:
  - "Network requests happen only inside src/api — calling fetch directly from a component is forbidden"
  - "API types are generated from the contract, not written by hand"
  - "A page component only handles layout; logic belongs in a hook or in the api layer"
  - "No fixed text that will later need translation is hardcoded inside a component"


ui:
  - "Every network state has three renderings: loading, error, and empty"
  - "A network error shows the user a comprehensible message, not the raw error text"
  - "Every mutating action gives immediate feedback — the user must never have to guess"
  - "Forms are fully usable with the keyboard"


auth:
  - "The token is kept in browser storage with the least possible access"
  - "Protected routes without a token redirect to the login page"
  - "A 401 response from any request must clear the session and log the user out"


contract:
  - "No route is called that is not in the api-v1 contract"
  - "A gap or mistake in the contract → record a blocker, do not guess the shape of the data"


test:
  - "Every page has at least one happy-path test and one error-state test"
  - "Tests run against contract-based mock responses — never against a real service"
