# Public configuration of Trading Assistant.
#
# Cross-layer bindings only: which provider, interface or selectable resource
# each layer consumes. A setting owned by a single layer lives in that layer's
# own file instead, and no secret value appears here.
#
# Each layer gains its section as the phase that delivers it composes it in.

model:
  # The shared domain definitions. This layer consumes no other: it is the one
  # every other layer reads from, which is what keeps a single meaning for a
  # User, an Account or a Position across the whole system.
  bindings: {}
  provides:
    interface: "import"
    package: "my_model"
    location: "model"

frontend:
  # What a person sees. It consumes the application's published contract and
  # nothing else — not the definitions, not the stored data. Where that contract
  # is reached is decided here.
  bindings:
    backend:
      interface: "http"
      address: "http://127.0.0.1:8000"
  provides:
    interface: "http"
    package: "my-frontend"
    location: "frontend"

backend:
  # The application. It consumes the definitions and the persistence layer, and
  # is the first layer that runs as a service rather than being imported. Which
  # stored data it works with is decided here, not inside it.
  bindings:
    model:
      interface: "import"
      package: "my_model"
    database:
      interface: "import"
      package: "my_database"
      instance: "general"
  provides:
    interface: "http"
    package: "my_backend"
    location: "backend"

database:
  # Persistence. It consumes the shared definitions and nothing else, and it
  # decides for itself which engine and which stored identities it offers — none
  # of that belongs here, only what it consumes and what it offers in return.
  bindings:
    model:
      interface: "import"
      package: "my_model"
  provides:
    interface: "import"
    package: "my_database"
    location: "database"
    # Which stored identity a consuming layer works with when it names none.
    # The identities themselves are the Database layer's own catalogue.
    instance: "general"
