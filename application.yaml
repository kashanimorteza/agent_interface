# Centralized public runtime configuration of the Trading Assistant.
#
# Owned by Platform. Each application layer receives only its own section,
# which carries the settings owned by that layer and the bindings it consumes.
# Secret values never appear here; they are referenced by name and resolved
# from the runtime environment (see .env.example). Layers are added as their
# phases deliver them.

model:
  # The Model layer is an importable library. It consumes no other layer and
  # nothing in it is changeable by a user or environment.
  settings: {}
  bindings: {}

database:
  settings:
    # The Instance used when a consumer selects none.
    default_instance: general
    # Where a file-based Instance keeps its storage file, relative to this
    # file's directory. Never committed.
    storage_directory: data
    # Name of the runtime secret holding the key for the encrypted at-rest mode.
    encryption_key_secret: TRADING_ASSISTANT_DATABASE_ENCRYPTION_KEY
    instances:
      general:
        name: Trading Assistant General
        purpose: General application data.
        engine: SQLite
        database: trading_assistant_general
        host: localhost
        port: engine_default
        # Names of the runtime secrets holding connection credentials. A
        # file-based engine ignores them.
        username_secret: TRADING_ASSISTANT_GENERAL_DATABASE_USERNAME
        password_secret: TRADING_ASSISTANT_GENERAL_DATABASE_PASSWORD
  bindings:
    # The Database layer consumes the shared Models through the Model
    # package's public import interface.
    model:
      package: my_model
      interface: import

backend:
  settings:
    # Where the API server listens.
    host: 127.0.0.1
    port: 8000
    # Whether the API publishes its machine-readable description and the
    # interactive documentation built from it.
    api_documentation: true
  bindings:
    # The Backend consumes the shared Models through the Model package's
    # public import interface, and persistence through the Database package's
    # public gateway on the named Instance. The Backend needs no secret.
    model:
      package: my_model
      interface: import
    database:
      package: my_database
      interface: gateway
      instance: general
