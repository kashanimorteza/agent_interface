[project]
name = "my-model"
version = "0.1.0"
description = "Independent, platform-independent domain Model package for the Trading Assistant."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_model"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
