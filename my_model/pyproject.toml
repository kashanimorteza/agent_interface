[project]
name = "my_model"
version = "0.1.0"
description = "Reusable data-model library defining the Trading Assistant domain Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
