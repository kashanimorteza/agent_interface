[project]
name = "my_model"
version = "0.1.0"
description = "Independent, platform-independent domain Model package shared by every technical component."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
