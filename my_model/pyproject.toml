[project]
name = "my-model"
version = "0.1.0"
description = "Platform-independent logical Model package for the Trading Assistant Target."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_model"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1",
    "ruff>=0.6",
]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
