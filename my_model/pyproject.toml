[project]
name = "my_model"
version = "0.1.0"
description = "Independent Model layer publishing the Trading Assistant's Domain Entities."
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_model*"]
