# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/interface.yaml"
  path_note: "The entry point of the Agent Project Interface — the only file an agent finds without guidance"
  responsibility: "Machine-readable technical definition and entry point for the Agent Project Interface"
  standard: "Agent Project Interface"
  version: "8.0"
  updated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file introduces and maps the Interface. No operation edits it, and every other file carries its own write policy"
  changed_by: "The human, directly"
  on_change_needed: "Raise an open question through the mapped State configuration; never change this file autonomously"
  state_boundary: "The State Component records live Workflow position. Its Principle defines State behaviour and its generated configuration holds current values; this Interface root only locates them"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "interface"
  - "structure"
  - "agent_skills"
  - "workflow"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  interface: "The purpose and concept of the Agent Project Interface"
  structure: "The Foundational Files, Layers, Components, Modes, and Generated Configuration that form the Interface"
  agent_skills: "External Agent Skills available to execute operations represented by Interface Modes and supporting operations"
  workflow: "The ordered human-facing path for using the Interface"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- interface -->
  interface:
    description: "An independent interface between Developers and AI Agents for establishing a common protocol, structure, and standard for software development"
    overview: "The Developer describes a project in human language; the Interface turns that definition into structured project Understanding that Agents can interpret, plan against, and develop"
    concept: "Human project definitions are flexible, while Agents work more reliably with explicit and predictable information. Agent Project Interface is the communication layer between those two forms"
    agent_independence: "The core Interface Structure is independent of any specific AI model, Agent, or external execution capability; available integrations are cataloged separately"

  # <!-------------------------------------------- structure -->
  structure:

    # <!---------------------- foundations -->
    foundations:

      interface:
        path: ".interface/interface.yaml"
        responsibility: "Entry point and machine-readable technical definition of the Agent Project Interface"

      project:
        path: ".interface/project.md"
        responsibility: "Human-managed natural-language definition of the project being built"

      readme:
        path: ".interface/readme.md"
        responsibility: "Human-readable introduction to the Interface, its Structure, Agent Skills, and Workflow"

    # <!---------------------- layer_matrix -->
    layer_matrix:
      rule: "Every Component has one stable file in each descriptive Layer, whether or not that Layer currently defines Component-specific content"
      empty_file: "An empty Layer file means that the Component has no content specific to that Layer; consumers ignore it and continue with the other applicable authorities"
      stability: "Adding content to an existing Layer file never requires changing this Interface root; only adding, removing, or renaming a Component or structural path does"

    # <!---------------------- layers -->
    layers:

      principles:
        path: ".interface/principles/"
        responsibility: "Mandatory philosophy, responsibilities, and boundaries for Components, independent of tools and versions"
        answers: "Why and under what rules"

        files:
          definition:
            path: "definition.md"
            responsibility: "The philosophy and boundaries of project description, conceptual Models, project Structure, Behaviours, and phases"

          model:
            path: "model.md"
            responsibility: "Domain-entity meaning, shared logical Models, and the boundaries between logical definitions and technical representations"

          development:
            path: "development.md"
            responsibility: "Layered application architecture, interface-only communication, explicit connections, Platform composition, and cross-cutting capability coordination"

          state:
            path: "state.md"
            responsibility: "Repeatable Workflow modes, live State boundaries, critical Blockers, Open Questions, and provenance"

          task:
            path: "task.md"
            responsibility: "Phase Plans, coherent Groups, atomic self-contained Tasks, verifiable completion, and separation of Task progress from Workflow State"

          backend:
            path: "backend.md"
            responsibility: "Layered Backend boundaries, application and Model Logic, Data Access, API communication, documentation, and credential handling"

          frontend:
            path: "frontend.md"
            responsibility: "Layered Frontend boundaries, component-based Presentation, Interaction Logic, Backend API access, shared Models, and a coherent visual system"

          database:
            path: "database.md"
            responsibility: "Layered Database architecture, engine independence, generic data access, persistence ownership, schema as code, migrations, and access rules"

      preferences:
        path: ".interface/preferences/"
        responsibility: "Supported technical choices and defaults used only when the project leaves a choice unstated; explicit project values always win"
        answers: "With what"

        files:
          definition:
            path: "definition.yaml"
            responsibility: "Component-specific Definition technical choices and defaults when defined"

          model:
            path: "model.yaml"
            responsibility: "Common logical field defaults applied when individual Model definitions leave them unspecified"

          development:
            path: "development.yaml"
            responsibility: "Defaults for capabilities coordinated across application layers"

          state:
            path: "state.yaml"
            responsibility: "Component-specific State technical choices and defaults when defined"

          task:
            path: "task.yaml"
            responsibility: "Component-specific Task technical choices and defaults when defined"

          backend:
            path: "backend.yaml"
            responsibility: "Supported Backend languages and layer-specific Logic, Data Access, API framework, transport, documentation, and Model-operation defaults"

          frontend:
            path: "frontend.yaml"
            responsibility: "Supported Frontend technologies and layer-specific Presentation, Interaction Logic, API client, and Theme defaults"

          database:
            path: "database.yaml"
            responsibility: "Defaults and supported technical profiles for Database Interface, Data Logic, and Storage Adapter"

      schemas:
        path: ".interface/schema/"
        responsibility: "Shapes and validation rules for generated Interface files; Schemas contain neither Component philosophy nor technical preferences"
        answers: "In what form"

        files:
          file:
            path: "file.yaml"
            responsibility: "Outer shape shared by Interface YAML files"

          definition:
            path: "definition.yaml"
            responsibility: "Shape of the generated project description, conceptual Models, project Structure, Behaviours, and phases"

          model:
            path: "model.yaml"
            responsibility: "Shape of the generated shared Model configuration"

          development:
            path: "development.yaml"
            responsibility: "Shape of application layers, connections, cross-cutting capabilities, and Platform configuration"

          state:
            path: "state.yaml"
            responsibility: "Shape of Workflow modes, active State, critical Blockers, and Open Questions"

          task:
            path: "task.yaml"
            responsibility: "Shape of the Task configuration"

          backend:
            path: "backend.yaml"
            responsibility: "Shape of the generated Backend configuration"

          frontend:
            path: "frontend.yaml"
            responsibility: "Shape of the generated layered Frontend configuration"

          database:
            path: "database.yaml"
            responsibility: "Shape of the generated layered Database configuration"

    # <!---------------------- components -->
    components:

      definition:
        responsibility: "Structured project description, conceptual Models, project Structure, Behaviours, and ordered phases"
        resources:
          principle: "content.structure.layers.principles.files.definition"
          preference: "content.structure.layers.preferences.files.definition"
          schema: "content.structure.layers.schemas.files.definition"
          config: "content.structure.generated_configuration.files.definition"

      model:
        responsibility: "Shared logical domain Models that connect persisted data with API representations, including fields, relationships, rules, and initial data"
        resources:
          principle: "content.structure.layers.principles.files.model"
          preference: "content.structure.layers.preferences.files.model"
          schema: "content.structure.layers.schemas.files.model"
          config: "content.structure.generated_configuration.files.model"

      development:
        responsibility: "Independent application layers, declared-interface connections, cross-cutting capabilities, and the Platform that runs and deploys them"
        resources:
          principle: "content.structure.layers.principles.files.development"
          preference: "content.structure.layers.preferences.files.development"
          schema: "content.structure.layers.schemas.files.development"
          config: "content.structure.generated_configuration.files.development"

      state:
        responsibility: "Current Workflow position, repeatable working modes, critical Blockers, and Open Questions"
        resources:
          principle: "content.structure.layers.principles.files.state"
          preference: "content.structure.layers.preferences.files.state"
          schema: "content.structure.layers.schemas.files.state"
          config: "content.structure.generated_configuration.files.state"

      task:
        responsibility: "Phase Plans, coherent Groups, independently understandable atomic Tasks, progress, and Task-local history"
        resources:
          principle: "content.structure.layers.principles.files.task"
          preference: "content.structure.layers.preferences.files.task"
          schema: "content.structure.layers.schemas.files.task"
          config: "content.structure.generated_configuration.files.task"

      backend:
        responsibility: "Application and Model Logic, Database access through Data Access, and the external API"
        resources:
          principle: "content.structure.layers.principles.files.backend"
          preference: "content.structure.layers.preferences.files.backend"
          schema: "content.structure.layers.schemas.files.backend"
          config: "content.structure.generated_configuration.files.backend"

      frontend:
        responsibility: "Component-based Presentation, user Interaction Logic, and application access through Backend API"
        resources:
          principle: "content.structure.layers.principles.files.frontend"
          preference: "content.structure.layers.preferences.files.frontend"
          schema: "content.structure.layers.schemas.files.frontend"
          config: "content.structure.generated_configuration.files.frontend"

      database:
        responsibility: "Generic Database Interface, Model-driven Data Logic and Mapping, and Engine-specific Storage Adapter"
        resources:
          principle: "content.structure.layers.principles.files.database"
          preference: "content.structure.layers.preferences.files.database"
          schema: "content.structure.layers.schemas.files.database"
          config: "content.structure.generated_configuration.files.database"

    # <!---------------------- modes -->
    modes:
      authority: "content.structure.components.state"

      items:
        not_set:
          state_value: "not set"
          phase_specific: false
          responsibility: "Represent the resting State before an Interface operation has been recorded"

        configuring:
          state_value: "configuring"
          phase_specific: false
          responsibility: "Generate complete and consistent project Understanding for downstream Planning and Development"
          inputs:
            project: "content.structure.foundations.project"
            existing_understanding: "content.structure.generated_configuration"
          resolution: "For every current Component, resolve the target-project Understanding through that Component's Principles and Preferences and express the result in the form required by its Schema"
          completeness: "Produce one structurally valid current configuration for every current Component; an empty Layer contributes no information and never removes the Component's required output"
          refresh: "On every run, rebuild the complete candidate from the current Interface and target project, then reconcile it with existing generated configuration"
          preservation: "Remove stale interpreter-owned information while preserving information owned by the human, runtime, or another operation according to the current authorities"
          validation: "Validate every candidate output against its current Schema and validate the complete set for cross-Component consistency before writing any result"
          idempotency: "When the current Interface, target project, and owned generated information are unchanged, another run makes no changes"
          downstream_readiness: "The generated Understanding must let Planning create Tasks and Development execute them without reinterpreting the human project definition"
          output: "content.structure.generated_configuration"

        planning:
          state_value: "planning"
          phase_specific: true
          responsibility: "Transform the generated Understanding for a requested project phase into implementation-ready Tasks"
          inputs:
            definition: "content.structure.components.definition"
            understanding: "content.structure.generated_configuration"
            task: "content.structure.components.task"
          scope: "The requested phase; its target selects the Component being planned"
          output: "content.structure.generated_configuration.files.task"

        development:
          state_value: "development"
          phase_specific: true
          responsibility: "Execute and verify eligible planned Tasks to produce the project implementation"
          inputs:
            understanding: "content.structure.generated_configuration"
            task: "content.structure.components.task"
          scope: "The requested phase; its target selects the Component being developed"
          output: "Implementation inside the selected Component's resolved code boundary"

    # <!---------------------- generated_configuration -->
    generated_configuration:
      path: ".interface/config/"
      responsibility: "Project-specific Understanding generated from the human project definition through the applicable Layers and Components; it is an output of the Structure, not a fourth Layer"

      files:
        definition:
          path: "definition.yaml"
          responsibility: "Project description, conceptual Models, project Structure, Behaviours, and ordered phases"

        model:
          path: "model.yaml"
          responsibility: "Shared logical Models, fields, relationships, rules, and initial data"

        development:
          path: "development.yaml"
          responsibility: "Application layers, declared-interface connections, cross-cutting capabilities, and the Platform environment, composition, and deployment"

        state:
          path: "state.yaml"
          responsibility: "Available Workflow modes, current active State, critical Blockers, and Open Questions"

        task:
          path: "task.yaml"
          responsibility: "Plans, contextual Groups, and self-contained executable Tasks"

        backend:
          path: "backend.yaml"
          responsibility: "Backend-wide technology and resolved Logic, Data Access, and API layer configuration"

        frontend:
          path: "frontend.yaml"
          responsibility: "Resolved Presentation, Interaction Logic, API Access, and visual-system configuration"

        database:
          path: "database.yaml"
          responsibility: "Resolved Database Interface, Data Logic and Mapping, and Storage Adapter configuration"


  # <!-------------------------------------------- agent_skills -->
  agent_skills:
    responsibility: "External capabilities that execute operations represented by Interface Modes or supporting operations without defining the Interface Structure"

    items:
      interpreter:
        name: "my-interface-interpreter"
        path: ".claude/skills/my-interface-interpreter/SKILL.md"
        invocation: "/my-interface-interpreter"
        responsibility: "Generate or refresh complete Project Understanding for every current Component and reconcile it for downstream Planning and Development"
        mode: "content.structure.modes.items.configuring"

      tasker:
        name: "my-interface-tasker"
        path: ".claude/skills/my-interface-tasker/SKILL.md"
        invocation: "/my-interface-tasker <phase-id>"
        responsibility: "Create or reconcile an implementation-ready plan for one requested project phase"
        mode: "content.structure.modes.items.planning"

      developer:
        name: "my-interface-developer"
        path: ".claude/skills/my-interface-developer/SKILL.md"
        invocation: "/my-interface-developer <phase-id>"
        responsibility: "Implement and verify eligible planned Tasks for one requested project phase"
        mode: "content.structure.modes.items.development"

      reviewer:
        name: "my-interface-reviewer"
        path: ".claude/skills/my-interface-reviewer/SKILL.md"
        invocation: "/my-interface-reviewer <phase-id>"
        responsibility: "Review an implemented project phase and report evidence-based findings without repairing it"

      clear:
        name: "my-interface-clear"
        path: ".claude/skills/my-interface-clear/SKILL.md"
        invocation: "/my-interface-clear"
        responsibility: "Preview and clear the fixed generated Interface configuration and project directories after human confirmation"

      reset:
        name: "my-interface-reset"
        path: ".claude/skills/my-interface-reset/SKILL.md"
        invocation: "/my-interface-reset <1|2|3>"
        responsibility: "Preview and reset after human confirmation: 1 = interpreter (configuration), 2 = task (planning output), 3 = develop (implementation)"

      skill_installer:
        name: "my-interface-skill-installer"
        path: ".claude/skills/my-interface-skill-installer/SKILL.md"
        invocation: "/my-interface-skill-installer"
        responsibility: "Discover and install compatible Agent Skills for technologies detected in the configured project"


  # <!-------------------------------------------- workflow -->
  workflow:
    responsibility: "Ordered steps for defining, interpreting, planning, and developing a project through Agent Project Interface"

    steps:
      define_project:
        order: 1
        title: "Define the Project"
        actor: "Developer"
        action: "Define the project, its Models, and its ordered phases"
        writes: "content.structure.foundations.project"

      interpret_project:
        order: 2
        title: "Interpret the Project"
        skill: "content.agent_skills.items.interpreter"

      generate_tasks:
        order: 3
        title: "Generate Tasks"
        skill: "content.agent_skills.items.tasker"
        argument: "phase-id"

      develop_tasks:
        order: 4
        title: "Develop the Tasks"
        skill: "content.agent_skills.items.developer"
        argument: "phase-id"
