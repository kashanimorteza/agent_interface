schema:
  id: agent-interface-backend
  version: "5.1"
  purpose: "The shape of backend.yaml — every parameter an agent reads to understand the backend project"

policy:
  preference_resolution:
    rule: "An explicit project value always wins. When a backend technical choice is unstated, resolve it from supported backend preferences or choose the best compatible implementation option under root.yaml policy.decision_policy. Raise an open question only for a critical conflict or decision as defined there."
    resolved_by: "my-interface-interpreter only; downstream Skills consume the resolved backend configuration and never reinterpret preferences."
  database_boundary: "The backend never owns the database engine, storage, schema, or migrations. It consumes the frozen database contract and owns only its runtime connection, ORM mappings, and database client packages."
  package_resolution: "Resolve runtime packages from the selected language, API framework, ORM, and database contract through an explicitly supported compatibility entry when available. For an unlisted combination, choose a well-supported compatible package from current evidence and record the consequential choice; ask only when no safe compatible stack can be established."
  technology_skill_resolution:
    rule: "A supported technology preference may name one Agent Skill as technical guidance. When that technology is selected, my-interface-interpreter writes the Skill name into the matching resolved technology entry in backend.yaml."
    optional: "A technology with no configured Skill remains valid and produces no skill field. Never guess a Skill from the technology name."
    boundary: "A configured technology Skill guides planning and implementation only. It cannot change project requirements, phase scope, item Policy, contracts, write boundaries, workflow roles, or State authority."
  model_api_resolution:
    rule: "When the project requests an API for its domain models without naming allowed operations, apply preferences.model_api.default_operations to every model currently indexed in model.yaml."
    overrides: "An explicit project rule for a model replaces the default operations for that model. Models are resolved dynamically from model.yaml and are never copied into this Policy or its Preferences."
    boundary: "Resolve only model-level operation intent here. Endpoint paths, HTTP method mappings, payloads, response shapes, and implementation layout remain implementation output."
  version_resolution:
    explicit: "Preserve every concrete version stated by the project exactly."
    latest: "When a supported preference supplies latest, my-interface-interpreter resolves it to the latest stable version compatible with the complete selected backend stack and writes only that concrete version into backend.yaml. The token latest never appears in generated Config."
    unresolved: "If the current stable version cannot be verified, select the best supported concrete compatible version available from current evidence and record the choice. Raise an open question only when compatibility or safety cannot be established without a critical human decision."
  sensitive_data:
    credential_source: "A field is a credential when the consumed database contract assigns it a credential storage mode. The backend never guesses credential fields from their names."
    request: "A credential field is write-only input. It may be accepted when required to create or update the owning model."
    response: "A credential field is never exposed in an API response, generated response schema, or error payload."
    logging: "A credential value is always redacted from application logs, diagnostics, traces, and exception details."

preferences:
  defaults:
    code_path: "backend/"
    needs_test: false
    responsibility: "Runs application behavior and publishes the HTTP API while consuming the database contract."
    language: "Python"
  languages:
    Python:
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      naming:
        variables: "snake_case"
        functions: "snake_case"
        classes: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "snake_case"
        folders: "snake_case"
      defaults:
        api_framework: "FastAPI"
        orm: "SQLAlchemy"
  api_frameworks:
    FastAPI:
      version: "latest"
      skill: "fastapi"
  orms:
    SQLAlchemy:
      version: "latest"
  database_integrations:
    Python:
      SQLAlchemy:
        SQLite:
          driver: "Python sqlite3 standard library"
          packages: []
          url_scheme: "sqlite"
  model_api:
    default_operations:
      - "create"
      - "list"
      - "get"
      - "update"
      - "delete"
  capabilities:
    testing:
      default_enabled: false
    error_handling:
      default_enabled: false
    logging:
      default_enabled: false
    authentication:
      default_enabled: false
    https:
      default_enabled: false
    api_documentation:
      default_enabled: true

structure:
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - model_api
  - standards
  - capabilities
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding the backend's actual code — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The backend in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that produces code is proven by a written test in tests/ — true means a task's verify is that test run."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory every verify command runs from, and the environment it runs inside — for the backend, always inside its virtual environment."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the backend is answerable for — one sentence, wider than summary and narrower than the product."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "What the backend is built with — the resolved choices an agent follows and never re-decides."
    fields:
      language:
        required: true
        purpose: "The programming language the backend is written in, and the parent of everything language-specific — its environment tool and its packages hang beneath it."
        fields:
          name:
            required: true
            purpose: "The language itself."
          version:
            required: true
            purpose: "The language version."
          skill:
            required: false
            purpose: "The Agent Skill selected by this language's supported preference profile, omitted when none is configured."
          environment:
            required: true
            purpose: "The isolated environment every command and every install happens inside — created and driven by one named tool, and never committed."
            fields:
              name:
                required: true
                purpose: "The tool that creates the virtual environment and installs into it — the only route a dependency enters the project by."
              version:
                required: true
                purpose: "The version of that tool."
          packages:
            required: true
            purpose: "The frameworks, libraries, and tools the backend is built on — one structured entry per role, never a single combined line."
            fields:
              api:
                required: true
                purpose: "The framework serving the HTTP surface the contract is published over."
                fields:
                  name:
                    required: true
                    purpose: "The API framework."
                  version:
                    required: true
                    purpose: "Its version."
                  skill:
                    required: false
                    purpose: "The Agent Skill selected by this API framework's supported preference profile, omitted when none is configured."
              orm:
                required: true
                purpose: "The layer every read and write of the database goes through."
                fields:
                  name:
                    required: true
                    purpose: "The ORM."
                  version:
                    required: true
                    purpose: "Its version."
                  skill:
                    required: false
                    purpose: "The Agent Skill selected by this ORM's supported preference profile, omitted when none is configured."
              database_driver:
                required: false
                purpose: "The runtime adapter required by the resolved database contract and ORM combination; absent when the selected language provides it."
                fields:
                  name:
                    required: true
                    purpose: "The adapter package or built-in driver."
                  version:
                    required: false
                    purpose: "The adapter version when a package is installed."
                  skill:
                    required: false
                    purpose: "The Agent Skill selected by this driver's supported preference profile, omitted when none is configured."
              "<package>":
                required: false
                purpose: "One entry per further package the project names — same two fields, set by the human, never inferred by an agent from the code."
                fields:
                  name:
                    required: true
                    purpose: "The package."
                  version:
                    required: true
                    purpose: "Its version."
                  skill:
                    required: false
                    purpose: "The Agent Skill explicitly associated with this package, omitted when none is declared."

  # <!--------------------------------------------------------------------------------- Model_API -->
  model_api:
    required: true
    purpose: "The resolved model-level API intent. It applies dynamically to domain models from model.yaml without storing endpoint paths or copying model definitions into backend.yaml."
    fields:
      source:
        required: true
        purpose: "The mapped model.yaml models section that supplies the current domain-model set."
      default_operations:
        required: true
        purpose: "The operations applied when the project requests a model API and gives no model-specific operation rule."
      overrides:
        required: true
        purpose: "Explicit project operation rules keyed by model, empty when the project states none."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "How the backend's code is written — resolved conventions an agent follows instead of deciding them file by file."
    fields:
      naming:
        required: true
        purpose: "The resolved case style for each kind of name."
        fields:
          variables:
            required: true
            purpose: "How a variable is named."
          functions:
            required: true
            purpose: "How a function or method is named."
          classes:
            required: true
            purpose: "How a class is named."
          constants:
            required: true
            purpose: "How a constant is named."
          files:
            required: true
            purpose: "How a file inside code_path is named."
          folders:
            required: true
            purpose: "How a folder inside code_path is named."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of each optional backend capability; testing has its own switch in needs_test."
    fields:
      error_handling:
        required: true
        purpose: "Centralized error handling in the backend's code — a dedicated error layer beyond what the framework does on its own."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend implements centralized error handling — false means only the framework's built-in behavior."
      logging:
        required: true
        purpose: "Application logging."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend writes application logs — false means no logging is set up or required."
      api_documentation:
        required: true
        purpose: "Generated documentation of the API surface, and the format it takes when it is wanted."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend serves API documentation — false means none is generated or exposed."
          type:
            required: false
            purpose: "The documentation format or standard used — for example OpenAPI/Swagger, or another format the project names; present only when enabled is true, absent while api_documentation is disabled."
      authentication:
        required: true
        purpose: "User authentication on the API."
        fields:
          enabled:
            required: true
            purpose: "Whether the API authenticates its callers — false means every route is open."
      https:
        required: true
        purpose: "Serving the API over HTTPS."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend serves HTTPS — false means plain HTTP."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The backend's item relationships — the database contract it consumes and the runtime HTTP interface it produces. API surface details are implementation output and do not live in this configuration."
    fields:
      produces:
        required: true
        purpose: "The runtime interface the implemented backend publishes, including its framework-generated machine-readable description."
      consumes:
        required: true
        purpose: "The frozen database contract the backend consumes and the mapped path that publishes it."
      rule:
        required: true
        purpose: "The implementation boundary: tasks, resolved model-level API intent, and the consumed database contract guide development, while endpoint paths, HTTP method mappings, payloads, response shapes, error shapes, entrypoints, commands, and file layout are produced during implementation rather than prescribed here."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the backend."
    fields:
      owns:
        required: true
        purpose: "What belongs to the backend — its application code, runtime database client and ORM mappings, business behavior, and implemented HTTP interface."
      does_not_own:
        required: true
        purpose: "What is explicitly not the backend's, including frontend code and the database engine, storage, schema, and migrations."
      interface:
        required: true
        purpose: "The only thing the backend offers the outside — its implemented HTTP API and framework-generated machine-readable description."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the backend does not do — named so it is never inferred into a task."
