schema:
  id: agent-interface-backend
  version: "2.0"
  purpose: "The shape of backend.yaml — every parameter an agent reads to understand the backend project"

policy:
  preference_resolution:
    rule: "An explicit project value always wins. When a supported backend technical choice is unstated, resolve it from backend preferences. Ambiguous or conflicting information is an open question and is never resolved from a preference."
    resolved_by: "my-interface-interpreter only; downstream Skills consume the resolved backend configuration and never reinterpret preferences."
  database_boundary: "The backend never owns the database engine, storage, schema, or migrations. It consumes the frozen database contract and owns only its runtime connection, ORM mappings, and database client packages."
  package_resolution: "Resolve runtime packages from the selected language, API framework, ORM, and database contract through an explicitly supported compatibility entry; an unknown combination is an open question, never a package guessed from model knowledge."

preferences:
  defaults:
    enabled: true
    code_path: "backend/"
    needs_test: false
    responsibility: "Runs application behavior and publishes the HTTP API while consuming the database contract."
    language: "Python"
  languages:
    Python:
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      naming:
        variables: "snake_case"
        functions: "snake_case"
        classes: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "snake_case"
        folders: "snake_case"
      defaults:
        api_framework: "FastAPI"
        orm: "SQLAlchemy"
  api_frameworks:
    FastAPI:
      version: "latest"
      run: "uv run fastapi dev app/main.py"
      application:
        entrypoint: "app/main.py"
        documentation:
          default_enabled: true
          type: "Docs"
          docs_path: "/docs"
          openapi_path: "/openapi.json"
          redoc_enabled: false
  orms:
    SQLAlchemy:
      version: "latest"
  database_integrations:
    Python:
      SQLAlchemy:
        SQLite:
          driver: "Python sqlite3 standard library"
          packages: []
          url_scheme: "sqlite"
  capabilities:
    testing:
      default_enabled: false
    error_handling:
      default_enabled: false
    logging:
      default_enabled: false
    authentication:
      default_enabled: false
    https:
      default_enabled: false
    api_documentation:
      default_enabled: true

structure:
  - enabled
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - database_connection
  - standards
  - capabilities
  - code_layout
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Enabled -->
  enabled:
    required: true
    purpose: "Whether the backend is in play — false leaves the entry standing and takes the item out of the build."

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding the backend's actual code — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The backend in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that produces code is proven by a written test in tests/ — true means a task's verify is that test run."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory every verify command runs from, and the environment it runs inside — for the backend, always inside its virtual environment."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the backend is answerable for — one sentence, wider than summary and narrower than the product."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "What the backend is built with — the resolved choices an agent follows and never re-decides."
    fields:
      language:
        required: true
        purpose: "The programming language the backend is written in, and the parent of everything language-specific — its environment tool and its packages hang beneath it."
        fields:
          name:
            required: true
            purpose: "The language itself."
          version:
            required: true
            purpose: "The language version."
          environment:
            required: true
            purpose: "The isolated environment every command and every install happens inside — created and driven by one named tool, and never committed."
            fields:
              name:
                required: true
                purpose: "The tool that creates the virtual environment and installs into it — the only route a dependency enters the project by."
              version:
                required: true
                purpose: "The version of that tool."
          packages:
            required: true
            purpose: "The frameworks, libraries, and tools the backend is built on — one structured entry per role, never a single combined line."
            fields:
              api:
                required: true
                purpose: "The framework serving the HTTP surface the contract is published over."
                fields:
                  name:
                    required: true
                    purpose: "The API framework."
                  version:
                    required: true
                    purpose: "Its version."
              orm:
                required: true
                purpose: "The layer every read and write of the database goes through."
                fields:
                  name:
                    required: true
                    purpose: "The ORM."
                  version:
                    required: true
                    purpose: "Its version."
              database_driver:
                required: false
                purpose: "The runtime adapter required by the resolved database contract and ORM combination; absent when the selected language provides it."
                fields:
                  name:
                    required: true
                    purpose: "The adapter package or built-in driver."
                  version:
                    required: false
                    purpose: "The adapter version when a package is installed."
              "<package>":
                required: false
                purpose: "One entry per further package the project names — same two fields, set by the human, never inferred by an agent from the code."
                fields:
                  name:
                    required: true
                    purpose: "The package."
                  version:
                    required: true
                    purpose: "Its version."
      run:
        required: true
        purpose: "The command that starts the backend."

  # <!--------------------------------------------------------------------------------- Database_Connection -->
  database_connection:
    required: true
    purpose: "The backend's resolved connection to the independent database item — a contract reference and runtime adapter, never database ownership or schema definition."
    fields:
      item:
        required: true
        purpose: "The database item key."
      contract:
        required: true
        purpose: "The frozen database contract version the backend consumes."
      config_path:
        required: true
        purpose: "The mapped database configuration that publishes the contract."
      adapter:
        required: true
        purpose: "The resolved runtime driver and package requirements for the selected backend stack."
      url_source:
        required: true
        purpose: "Where the backend reads its connection URL or path at runtime; credentials and deployment values are never committed."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "How the backend's code is written — resolved conventions an agent follows instead of deciding them file by file."
    fields:
      naming:
        required: true
        purpose: "The resolved case style for each kind of name."
        fields:
          variables:
            required: true
            purpose: "How a variable is named."
          functions:
            required: true
            purpose: "How a function or method is named."
          classes:
            required: true
            purpose: "How a class is named."
          constants:
            required: true
            purpose: "How a constant is named."
          files:
            required: true
            purpose: "How a file inside code_path is named."
          folders:
            required: true
            purpose: "How a folder inside code_path is named."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of each optional backend capability; testing has its own switch in needs_test."
    fields:
      error_handling:
        required: true
        purpose: "Centralized error handling in the backend's code — a dedicated error layer beyond what the framework does on its own."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend implements centralized error handling — false means only the framework's built-in behavior."
      logging:
        required: true
        purpose: "Application logging."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend writes application logs — false means no logging is set up or required."
      api_documentation:
        required: true
        purpose: "Generated documentation of the API surface, and the format it takes when it is wanted."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend serves API documentation — false means none is generated or exposed."
          type:
            required: false
            purpose: "The documentation format or standard used — for example OpenAPI/Swagger, or another format the project names; present only when enabled is true, absent while api_documentation is disabled."
      authentication:
        required: true
        purpose: "User authentication on the API."
        fields:
          enabled:
            required: true
            purpose: "Whether the API authenticates its callers — false means every route is open."
      https:
        required: true
        purpose: "Serving the API over HTTPS."
        fields:
          enabled:
            required: true
            purpose: "Whether the backend serves HTTPS — false means plain HTTP."
  # <!--------------------------------------------------------------------------------- Code_Layout -->
  code_layout:
    required: true
    purpose: "Every path inside code_path and what it holds — the key is the path, the value is its responsibility in one line; a folder ends with a slash, a file carries its extension. Entry point, configuration, database client access, ORM mappings, validation schemas, services, routes, errors, and tests each have their own place. Database schema and migrations never appear here."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The backend's contract surface — the database contract it consumes and the API contract it publishes."
    fields:
      produces:
        required: true
        purpose: "The contract version the backend publishes."
      consumes:
        required: true
        purpose: "The frozen database contract the backend consumes and the mapped path that publishes it."
      rule:
        required: true
        purpose: "What the contract binds the backend to — the implementation must match the frozen contract exactly."
      change_rule:
        required: true
        purpose: "What happens when the contract must change — a frozen contract is versioned, never edited, and that is a human decision."
      "<version>":
        required: true
        purpose: "One entry per contract version — the full surface a consumer may build against."
        fields:
          lifecycle:
            required: true
            purpose: "Where the version stands — draft, frozen, or deprecated; only a frozen contract may be defined against."
          lifecycle_note:
            required: true
            purpose: "What the lifecycle means for this version, and what a change to it would cost."
          consumed_by:
            required: true
            purpose: "The item reading this contract."
          contract_read_order:
            required: true
            purpose: "The order the contract is read in, and why."
          conventions:
            required: true
            purpose: "What holds across the whole surface — transport, identifiers, timestamps, and the answer to an unknown id."
          error_shape:
            required: true
            purpose: "The single shape every failure takes — its rule, its exact fields, and the codes a consumer may branch on."
          models:
            required: true
            purpose: "The data shapes named by the project — the key is the model, and the value contains only the model details explicitly stated by the project. Unstated implementation details are outside this contract and do not create interpretation gaps."
          routes:
            required: true
            purpose: "The surface itself, read last — each route carries method, path, summary, its body when it takes one, its success response, and the error codes it may answer with."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the backend."
    fields:
      owns:
        required: true
        purpose: "What belongs to the backend — its application code, runtime database client and ORM mappings, business behavior, and API contract."
      does_not_own:
        required: true
        purpose: "What is explicitly not the backend's, including frontend code and the database engine, storage, schema, and migrations."
      interface:
        required: true
        purpose: "The only thing the backend offers the outside — its contract."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the backend does not do — named so it is never inferred into a task."
