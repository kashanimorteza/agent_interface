schema:
  id: agent-interface-frontend
  version: "2.0"
  purpose: "The shape of frontend.yaml — every parameter an agent reads to understand the frontend project"

policy:
  preference_resolution:
    rule: "An explicit project value always wins. When a supported frontend technical choice is unstated, resolve it from frontend preferences. Ambiguous or conflicting information is an open question and is never resolved from a preference."
    resolved_by: "my-interface-interpreter only; downstream Skills consume the resolved frontend configuration and never reinterpret preferences."
  backend_boundary: "The frontend reaches application data only through a frozen backend contract. It never connects to the database item or imports backend implementation code."
  package_resolution: "Install only packages selected by an explicit project value or a supported frontend preference profile; an unknown combination is an open question."

preferences:
  defaults:
    enabled: true
    code_path: "frontend/"
    needs_test: false
    responsibility: "Provides the user interface and consumes the backend API contract."
    language: "TypeScript"
    library: "React"
    framework: "Next.js"
    package_manager: "npm"
  languages:
    TypeScript:
      version: "latest"
      naming:
        variables: "camelCase"
        functions: "camelCase"
        classes: "PascalCase"
        components: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "kebab-case"
        folders: "kebab-case"
  libraries:
    React:
      version: "latest"
      component_style: "Function components"
  frameworks:
    Next.js:
      version: "latest"
      router: "App Router"
      run: "npm run dev"
  package_managers:
    npm:
      version: "latest"
  capabilities:
    testing:
      default_enabled: false
    logging:
      default_enabled: false

structure:
  - enabled
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - standards
  - capabilities
  - code_layout
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Enabled -->
  enabled:
    required: true
    purpose: "Whether the frontend is in play — false leaves the entry standing and takes the item out of the build."

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding the frontend's actual code — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The frontend in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that produces code is proven by a written test in tests/ — true means a task's verify is that test run; set by the human."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory every verify command runs from, and the environment it runs inside — for the frontend, always inside its virtual environment."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the frontend is answerable for — one sentence, wider than summary and narrower than the product."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "What the frontend is built with — the resolved choices an agent follows and never re-decides."
    fields:
      language:
        required: true
        purpose: "The frontend programming language and version."
        fields:
          name:
            required: true
            purpose: "The language name."
          version:
            required: true
            purpose: "The language version."
      library:
        required: true
        purpose: "The UI library."
        fields:
          name:
            required: true
            purpose: "The library name."
          version:
            required: true
            purpose: "The library version."
      framework:
        required: true
        purpose: "The application framework and its resolved conventions."
        fields:
          name:
            required: true
            purpose: "The framework name."
          version:
            required: true
            purpose: "The framework version."
      package_manager:
        required: true
        purpose: "The only tool through which frontend dependencies are installed and commands are run."
        fields:
          name:
            required: true
            purpose: "The package manager name."
          version:
            required: true
            purpose: "The package manager version."
      run:
        required: true
        purpose: "The command that starts the frontend."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "The resolved frontend naming and component conventions."
    fields:
      naming:
        required: true
        purpose: "The case style for frontend identifiers, files, folders, and components."
      component_style:
        required: true
        purpose: "The resolved component declaration style."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of optional frontend capabilities; testing has its own switch in needs_test."
    fields:
      logging:
        required: true
        purpose: "Whether frontend application logging is configured."
        fields:
          enabled:
            required: true
            purpose: "The resolved logging switch."

  # <!--------------------------------------------------------------------------------- Code_Layout -->
  code_layout:
    required: true
    purpose: "Every path inside code_path and what it holds — the key is the path, the value is its responsibility in one line; a folder ends with a slash, a file carries its extension. Entry point, framework configuration, pages, components, client integration, styles, and tests each have their own place. Backend and database files never appear here."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The frontend's contract surface — what it consumes from the backend and anything it explicitly publishes."
    fields:
      produces:
        required: true
        purpose: "The contract version the frontend publishes."
      consumes:
        required: true
        purpose: "The frozen backend API contract the frontend consumes and the mapped path that publishes it."
      rule:
        required: true
        purpose: "What the contract binds the frontend to — the implementation must match the frozen contract exactly."
      change_rule:
        required: true
        purpose: "What happens when the contract must change — a frozen contract is versioned, never edited, and that is a human decision."
      "<version>":
        required: false
        purpose: "One entry per contract version — the full surface a consumer may build against."
        fields:
          lifecycle:
            required: true
            purpose: "Where the version stands — draft, frozen, or deprecated; only a frozen contract may be defined against."
          lifecycle_note:
            required: true
            purpose: "What the lifecycle means for this version, and what a change to it would cost."
          consumed_by:
            required: true
            purpose: "The item reading this contract."
          contract_read_order:
            required: true
            purpose: "The order the contract is read in, and why."
          conventions:
            required: true
            purpose: "What holds across the whole surface — transport, identifiers, timestamps, and the answer to an unknown id."
          error_shape:
            required: true
            purpose: "The single shape every failure takes — its rule, its exact fields, and the codes a consumer may branch on."
          models:
            required: true
            purpose: "The data shapes the surface returns — the key is the model, the value is its fields and their limits."
          routes:
            required: true
            purpose: "The surface itself, read last — each route carries method, path, summary, its body when it takes one, its success response, and the error codes it may answer with."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the frontend."
    fields:
      owns:
        required: true
        purpose: "What belongs to the frontend — its pages, components, browser-side behavior, and client integration with the backend contract."
      does_not_own:
        required: true
        purpose: "What is explicitly not the frontend's, including backend behavior and every part of the database item."
      interface:
        required: true
        purpose: "The only thing the frontend offers the outside — its contract."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the frontend does not do — named so it is never inferred into a task."
