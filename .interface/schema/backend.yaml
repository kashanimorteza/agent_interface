schema:
  id: agent-interface-backend
  version: "9.0"
  purpose: "The shape of the generated Backend configuration"

structure:
  - code_path
  - code_path_note
  - summary
  - verify_cwd
  - responsibility
  - tech
  - standards
  - layers
  - boundaries
  - out_of_scope

sections:

  code_path:
    required: true
    purpose: "The project-relative folder containing Backend implementation artifacts."

  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to."

  summary:
    required: true
    purpose: "A one-line summary of Backend."

  verify_cwd:
    required: true
    purpose: "The resolved working directory and environment for Backend verification commands."

  responsibility:
    required: true
    purpose: "The resolved responsibilities of Backend."

  tech:
    required: true
    purpose: "The resolved Backend-wide language, environment, and packages."
    fields:
      language:
        required: true
        purpose: "The resolved Backend programming language."
        fields:
          name:
            required: true
            purpose: "The language name."
          version:
            required: true
            purpose: "The concrete language version."
          environment:
            required: true
            purpose: "The resolved isolated environment."
            fields:
              name:
                required: true
                purpose: "The environment and dependency-management tool."
              version:
                required: true
                purpose: "The concrete tool version."
      packages:
        required: true
        purpose: "Additional resolved Backend packages, empty when none apply."
        fields:
          "<package>":
            required: false
            purpose: "One package keyed by its role."
            fields:
              name:
                required: true
                purpose: "The package name."
              version:
                required: true
                purpose: "The concrete package version."

  standards:
    required: true
    purpose: "The resolved Backend implementation conventions."
    fields:
      naming:
        required: true
        purpose: "The resolved case style for Backend identifiers, files, and folders."

  layers:
    required: true
    purpose: "The resolved Logic, Data Access, and API layers of Backend."
    fields:
      logic:
        required: true
        purpose: "The resolved application-Behaviour and Model-logic layer."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Logic layer."
          model_logic:
            required: true
            purpose: "The logical units resolved from the shared Model configuration."
            fields:
              source:
                required: true
                purpose: "The generated Model configuration supplying the logical Model set."
              standard_operations:
                required: true
                purpose: "The common operations available across Model Logic units."
              models:
                required: true
                purpose: "One Logic entry per current Model."
                fields:
                  "<model>":
                    required: true
                    purpose: "The Logic surface for one shared Model."
                    fields:
                      source_model:
                        required: true
                        purpose: "The referenced shared Model key."
                      standard_operations:
                        required: true
                        purpose: "The standard Model operations implemented by this Logic unit."
                      behaviours:
                        required: true
                        purpose: "Additional Model-specific Behaviour, empty when none applies."
          project_behaviours:
            required: true
            purpose: "Backend-targeted project Behaviour implemented by Logic, empty when none applies."
            fields:
              "<behaviour>":
                required: false
                purpose: "One Backend-targeted Behaviour."
                fields:
                  source:
                    required: true
                    purpose: "The referenced project Behaviour."
                  description:
                    required: true
                    purpose: "What Logic must accomplish for this Behaviour."
                  models:
                    required: true
                    purpose: "The Model Logic units involved, empty when none applies."
          supporting_services:
            required: true
            purpose: "Supporting services and cross-cutting capabilities consumed by Logic, empty when none applies."
            fields:
              "<service>":
                required: false
                purpose: "One resolved supporting service."
                fields:
                  source:
                    required: true
                    purpose: "The generated configuration that enables and configures the service."
                  interface:
                    required: true
                    purpose: "The interface through which Logic consumes the service."
                  used_by_models:
                    required: true
                    purpose: "The Model Logic units that use the service, empty when it is not Model-specific."

      data_access:
        required: true
        purpose: "The resolved boundary between Logic and the Database interface."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Data Access layer."
          uses:
            required: true
            purpose: "The generic Database interface consumed by Data Access."
          operations:
            required: true
            purpose: "The Database operations available to Logic through Data Access."

      api:
        required: true
        purpose: "The resolved external communication layer of Backend."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the API layer."
          framework:
            required: true
            purpose: "The resolved API framework."
            fields:
              name:
                required: true
                purpose: "The framework name."
              version:
                required: true
                purpose: "The concrete framework version."
          transport:
            required: true
            purpose: "The resolved API transport settings."
            fields:
              protocol:
                required: true
                purpose: "The selected protocol, such as HTTP or HTTPS."
              tls:
                required: false
                purpose: "Resolved non-secret TLS settings, present when the protocol requires them."
          api_documentation:
            required: true
            purpose: "The resolved machine-readable API-documentation settings."
            fields:
              enabled:
                required: true
                purpose: "Whether API documentation is enabled."
              type:
                required: false
                purpose: "The documentation format, present when documentation is enabled."
          model_api:
            required: true
            purpose: "The resolved Model operations exposed through API."
            fields:
              source:
                required: true
                purpose: "The Logic Model surface consumed by API."
              default_operations:
                required: true
                purpose: "The default Model operations exposed through API."
              overrides:
                required: true
                purpose: "Model-specific API operation overrides, empty when none apply."
          behaviours:
            required: true
            purpose: "The Logic Behaviour exposed to external consumers, empty when none applies."
            fields:
              "<behaviour>":
                required: false
                purpose: "One externally exposed Logic Behaviour."
                fields:
                  source_logic:
                    required: true
                    purpose: "The Logic Behaviour exposed by API."
                  description:
                    required: true
                    purpose: "What the external API capability provides."
          credential_handling:
            required: true
            purpose: "The resolved API treatment of fields marked as credentials in Model configuration."
            fields:
              source:
                required: true
                purpose: "The Model field marker used to identify credentials."
              write_only:
                required: true
                purpose: "Whether credentials are accepted only as write input."
              exclude_from_responses:
                required: true
                purpose: "Whether credentials are excluded from API responses and response schemas."
              redact:
                required: true
                purpose: "Whether credentials are redacted from diagnostic output."
          provides:
            required: true
            purpose: "The external interface published by API."

  boundaries:
    required: true
    purpose: "The resolved ownership boundaries of Backend."
    fields:
      owns:
        required: true
        purpose: "The responsibilities owned by Backend."
      does_not_own:
        required: true
        purpose: "Responsibilities explicitly outside Backend."
      interface:
        required: true
        purpose: "The external interface published by Backend."

  out_of_scope:
    required: true
    purpose: "Resolved work explicitly outside Backend."
