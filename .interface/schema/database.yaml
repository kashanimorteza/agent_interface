schema:
  id: agent-interface-database
  version: "7.0"
  purpose: "The shape of the generated database configuration."

structure:
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - data_access
  - standards
  - capabilities
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The project-relative folder for database-owned implementation artifacts."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "A one-line summary of the database item."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that changes database behavior is proven by a written test."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory and isolated environment used for database verification commands."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "The resolved responsibilities of the database item."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "The resolved database engine, storage, ORM, migration environment, and packages."
    fields:
      engine:
        required: true
        purpose: "The database engine and version."
        fields:
          name:
            required: true
            purpose: "The engine name."
          version:
            required: true
            purpose: "The engine version or the runtime that supplies it."
      storage:
        required: true
        purpose: "Where and how database state is physically stored."
        fields:
          kind:
            required: true
            purpose: "The storage kind, such as file or server."
          location:
            required: true
            purpose: "The project-relative local path or deployment-owned location description; secrets are never committed."
      connection:
        required: true
        purpose: "Engine-specific runtime connection behavior owned by the database layer and never exposed directly to consumers."
      orm:
        required: true
        purpose: "The ORM owned by the database layer."
        fields:
          name:
            required: true
            purpose: "The ORM name."
          version:
            required: true
            purpose: "The resolved ORM version."
          language:
            required: true
            purpose: "The language in which the ORM and database interface are implemented."
      migration:
        required: true
        purpose: "The resolved migration tool, isolated environment, packages, and commands."
        fields:
          tool:
            required: true
            purpose: "The migration tool and version."
          environment:
            required: true
            purpose: "The isolated environment used only for database tooling."
          packages:
            required: true
            purpose: "The resolved packages used for migration and schema tooling."
          commands:
            required: true
            purpose: "The canonical upgrade, downgrade, and verification commands."

  # <!--------------------------------------------------------------------------------- Data_Access -->
  data_access:
    required: true
    purpose: "The generic interface through which every consumer accesses persistent data."
    fields:
      style:
        required: true
        purpose: "The resolved interface style used across all persistent models."
      model_selector:
        required: true
        purpose: "How a caller identifies the model governed by an operation."
      operations:
        required: true
        purpose: "The supported model-data operations exposed by the interface."
      sql_commands:
        required: true
        purpose: "The controlled SQL-command capability exposed through the same interface."
        fields:
          enabled:
            required: true
            purpose: "Whether SQL-command execution is available."
          parameterized:
            required: true
            purpose: "Whether SQL values must be supplied separately from the command text."
          scope:
            required: true
            purpose: "The boundary within which SQL commands execute without exposing the engine connection."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "The resolved conventions for tables, columns, constraints, indexes, and migrations."
    fields:
      naming:
        required: true
        purpose: "The database object naming conventions."
      migrations:
        required: true
        purpose: "The resolved conventions for migration ordering, reversibility, and history."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of optional database capabilities."
    fields:
      seed_data:
        required: true
        purpose: "Whether managed seed data is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved seed-data switch."
          records:
            required: false
            purpose: "The ordered initial records resolved from the shared model configuration and grouped by their physical table."
            fields:
              "<table>":
                required: false
                purpose: "The ordered initial records for one resolved physical table. Every record uses resolved column names and preserves explicit values or generation instructions."
      backups:
        required: true
        purpose: "Whether backup and restore automation is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved backup switch."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The resolved database contracts published to consumers."
    fields:
      produces:
        required: true
        purpose: "The database contract version published by this item."
      "<version>":
        required: true
        purpose: "One database contract version — the data-access surface plus the exact persistent schema it governs."
        fields:
          lifecycle:
            required: true
            purpose: "Where the contract stands — draft, frozen, or deprecated."
          lifecycle_note:
            required: true
            purpose: "An explanation of the resolved lifecycle state."
          data_access:
            required: true
            purpose: "The versioned generic interface and operations published to consumers without exposing the engine connection."
          tables:
            required: true
            purpose: "The fully resolved tables exposed by this contract version."
            fields:
              "<table>":
                required: true
                purpose: "One physical table, keyed by its resolved table name."
                fields:
                  source_model:
                    required: true
                    purpose: "The shared domain-model key that this table implements."
                  columns:
                    required: true
                    purpose: "Every physical column in the table, including project-declared fields and relationship foreign keys."
                    fields:
                      "<column>":
                        required: true
                        purpose: "One physical column, keyed by its resolved column name."
                        fields:
                          type:
                            required: true
                            purpose: "The complete resolved database type."
                          nullable:
                            required: true
                            purpose: "Whether the column accepts null."
                          primary_key:
                            required: true
                            purpose: "Whether the column belongs to the table primary key."
                          auto_increment:
                            required: true
                            purpose: "Whether the database generates this numeric key by incrementing it."
                          default:
                            required: true
                            purpose: "The database default value, or null when the column has no database default."
                          credential_storage:
                            required: false
                            purpose: "The resolved at-rest mode; present only for a credential field."
                          references:
                            required: false
                            purpose: "The exact foreign-key target; present only for a relationship column."
                            fields:
                              table:
                                required: true
                                purpose: "The resolved physical table being referenced."
                              column:
                                required: true
                                purpose: "The resolved key column being referenced."
                              on_delete:
                                required: true
                                purpose: "The resolved action when the referenced row is deleted."
                              on_update:
                                required: true
                                purpose: "The resolved action when the referenced key is updated."
                  constraints:
                    required: true
                    purpose: "Named table constraints, empty when the table has none beyond column-level primary keys and references."
                    fields:
                      "<constraint>":
                        required: false
                        purpose: "One named constraint."
                        validation: "A unique constraint requires columns. A check constraint requires expression. Other constraint kinds must provide the fields required by their resolved database representation."
                        fields:
                          type:
                            required: true
                            purpose: "The constraint kind, such as unique or check."
                          columns:
                            required: false
                            purpose: "The ordered column names governed by a column-based constraint; required for unique constraints."
                          expression:
                            required: false
                            purpose: "The resolved database expression; required for check constraints."
                          source_rule:
                            required: false
                            purpose: "The exact model rule that produced this constraint; present only when a model rule is its source."
                  indexes:
                    required: true
                    purpose: "Named indexes for the table, empty when none are required."
                    fields:
                      "<index>":
                        required: false
                        purpose: "One named index."
                        fields:
                          columns:
                            required: true
                            purpose: "The ordered column names covered by the index."
                          unique:
                            required: true
                            purpose: "Whether this index also enforces uniqueness."
  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The resolved ownership limits of the database item."
    fields:
      owns:
        required: true
        purpose: "The responsibilities owned by the database item."
      does_not_own:
        required: true
        purpose: "Responsibilities explicitly outside the database item."
      interface:
        required: true
        purpose: "The interface the database item publishes to its consumers."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "The resolved work explicitly outside the database item."
