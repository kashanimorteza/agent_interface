schema:
  id: agent-interface-database
  version: "10.0"
  purpose: "The shape of a Database configuration containing the independent package, supported Engines, configured Instances, typed Model interface, and persistence implementation"

structure:
  - code_path
  - code_path_note
  - summary
  - verify_cwd
  - responsibility
  - package
  - engines
  - instances
  - default_instance
  - layers
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The project-relative folder containing Database implementation artifacts."

  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to."

  summary:
    required: true
    purpose: "A concise description of Database."

  verify_cwd:
    required: true
    purpose: "The resolved working directory and environment for Database verification commands."

  responsibility:
    required: true
    purpose: "The resolved responsibilities of Database."

  package:
    required: true
    purpose: "The package key owned by the Database layer in generated Development configuration."

  # <!--------------------------------------------------------------------------------- Engines -->
  engines:
    required: true
    purpose: "The supported Database Engine profiles resolved from Database Preferences and explicit project choices. An Engine describes a technology; it is not a configured connection."
    fields:
      "<engine>":
        required: false
        purpose: "One supported Database Engine profile, keyed by its stable Engine identifier."
        fields:
          name:
            required: true
            purpose: "The Engine's resolved name."
          version:
            required: true
            purpose: "The concrete Engine version or the runtime that supplies it."
          driver:
            required: true
            purpose: "The resolved driver used by the Storage Adapter."
            fields:
              name:
                required: true
                purpose: "The driver name."
              version:
                required: true
                purpose: "The concrete driver version or the runtime that supplies it."
              package:
                required: true
                nullable: true
                purpose: "The package supplying the driver, or null when the runtime supplies it."
          storage_kind:
            required: true
            purpose: "The Engine's physical storage kind, such as file or server."
          connection:
            required: true
            purpose: "The Engine's common connection contract and Engine-specific non-secret settings."
            fields:
              url_scheme:
                required: true
                purpose: "The URL scheme used by the Engine driver."
              default_port:
                required: false
                purpose: "The Engine's default network port; omitted for Engines that do not use one."
              parameters:
                required: true
                purpose: "The ordered connection parameters accepted by this Engine."
              settings:
                required: true
                purpose: "Engine-specific non-secret connection settings not represented by the common fields; empty when none apply."
          naming:
            required: true
            purpose: "The resolved physical-object naming conventions for this Engine."
            fields:
              tables:
                required: true
                purpose: "The naming convention for physical tables."
              columns:
                required: true
                purpose: "The naming convention for physical columns."
              constraints:
                required: true
                purpose: "The naming convention for physical constraints."
              indexes:
                required: true
                purpose: "The naming convention for physical indexes."

  # <!--------------------------------------------------------------------------------- Instances -->
  instances:
    required: true
    purpose: "The configured Database Instances. Each entry selects one supported Engine and supplies its user-editable non-secret connection configuration."
    fields:
      "<instance>":
        required: true
        purpose: "One Database Instance, keyed by its stable normalized identifier."
        fields:
          name:
            required: true
            purpose: "The Instance's human-readable name."
          purpose:
            required: true
            purpose: "What this Instance stores or supports."
          engine:
            required: true
            purpose: "The key of the supported Engine used by this Instance."
          database:
            required: true
            purpose: "The resolved database name or file-backed database identity."
          connection:
            required: true
            purpose: "Instance-specific non-secret connection values and secret references. Unused Engine parameters are omitted."
            fields:
              host:
                required: false
                purpose: "The server host when required by the selected Engine."
              port:
                required: false
                purpose: "The server port when required by the selected Engine."
              username_secret:
                required: false
                purpose: "The environment-variable name or external secret reference supplying the username."
              password_secret:
                required: false
                purpose: "The environment-variable name or external secret reference supplying the password."
              settings:
                required: true
                purpose: "Additional non-secret settings accepted by the selected Engine; empty when none apply."

  default_instance:
    required: true
    purpose: "The key of exactly one entry in instances used when a consumer does not explicitly select an Instance."

  # <!--------------------------------------------------------------------------------- Layers -->
  layers:
    required: true
    purpose: "The resolved Database Interface, Data Logic and Mapping, and Storage Adapter layers."
    fields:

      database_interface:
        required: true
        purpose: "The only Database boundary published to consumers."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Database Interface layer."
          public_interface:
            required: true
            purpose: "The public import surface exported by the Database package."
            fields:
              kind:
                required: true
                purpose: "The interface mechanism, normally an import surface."
              entrypoint:
                required: true
                purpose: "The resolved public package entrypoint."
              database:
                required: true
                purpose: "The exported Database gateway used to execute Model operations."
              instance_registry:
                required: true
                purpose: "The exported Registry used to discover and select public Instance identities."
          instance_selection:
            required: true
            purpose: "How explicit and default Instance selection works without exposing raw connections or secrets."
            fields:
              explicit:
                required: true
                purpose: "How a caller selects an Instance by its public identity."
              default:
                required: true
                purpose: "How omission selects default_instance."
          model_contract:
            required: true
            purpose: "The typed contract through which Database accepts shared Models."
            fields:
              configuration:
                required: true
                purpose: "The generated Model configuration that defines Model meaning."
              package:
                required: true
                purpose: "The public Model package consumed by Database."
              accepts:
                required: true
                purpose: "The accepted Model type and Model instance forms."
              untyped_model_selector:
                required: true
                purpose: "Whether an untyped Model-name string and unrelated field dictionary are accepted; must resolve to false."
          operations:
            required: true
            purpose: "The standard typed operations published for persistent Models."
            fields:
              create:
                required: true
                purpose: "The resolved create operation."
                fields:
                  input:
                    required: true
                    purpose: "A typed Model instance accepted for creation."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  result:
                    required: true
                    purpose: "The typed created Model result."
              read:
                required: true
                purpose: "The resolved read operation."
                fields:
                  model:
                    required: true
                    purpose: "The Model type being read."
                  criteria:
                    required: true
                    purpose: "Typed or Model-derived criteria identifying one record."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  result:
                    required: true
                    purpose: "The typed Model result or the resolved not-found result."
              list:
                required: true
                purpose: "The resolved list operation."
                fields:
                  model:
                    required: true
                    purpose: "The Model type being listed."
                  criteria:
                    required: true
                    purpose: "Typed or Model-derived filtering criteria; empty when all records are requested."
                  ordering:
                    required: true
                    purpose: "The supported deterministic ordering contract."
                  pagination:
                    required: true
                    purpose: "The supported pagination contract."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  result:
                    required: true
                    purpose: "The ordered collection of typed Model results and applicable page metadata."
              update:
                required: true
                purpose: "The resolved update operation."
                fields:
                  model:
                    required: true
                    purpose: "The Model type being updated."
                  criteria:
                    required: true
                    purpose: "Typed or Model-derived criteria identifying the record to update."
                  changes:
                    required: true
                    purpose: "The validated Model fields and values to change."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  result:
                    required: true
                    purpose: "The typed updated Model result or the resolved not-found result."
              delete:
                required: true
                purpose: "The resolved delete operation."
                fields:
                  model:
                    required: true
                    purpose: "The Model type being deleted."
                  criteria:
                    required: true
                    purpose: "Typed or Model-derived criteria identifying the record to delete."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  result:
                    required: true
                    purpose: "The resolved deletion result, including whether a record was deleted."
              status:
                required: true
                purpose: "The resolved status operation."
                fields:
                  model:
                    required: true
                    purpose: "The Model type whose status is changed."
                  criteria:
                    required: true
                    purpose: "Typed or Model-derived criteria identifying the record."
                  instance_selection:
                    required: true
                    purpose: "How the caller selects an Instance or accepts the default."
                  actions:
                    required: true
                    purpose: "The accepted status actions: enable and disable."
                  required_field:
                    required: true
                    purpose: "The Model field required for the status operation."
                  value_mapping:
                    required: true
                    purpose: "The resolved value written for each status action."
                    fields:
                      enable:
                        required: true
                        purpose: "The resolved enabled value."
                      disable:
                        required: true
                        purpose: "The resolved disabled value."
                  result:
                    required: true
                    purpose: "The typed updated Model result or the resolved not-found result."
          sql_commands:
            required: true
            purpose: "The controlled SQL-command capability published through Database Interface."
            fields:
              enabled:
                required: true
                purpose: "Whether controlled SQL-command execution is available."
              parameterized:
                required: true
                purpose: "Whether SQL values are supplied separately from command text."
              scope:
                required: true
                purpose: "The resolved SQL execution scope."

      data_logic:
        required: true
        purpose: "The generic typed Model-operation and storage-mapping layer."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of Data Logic and Mapping."
          model_source:
            required: true
            purpose: "References to the generated Model configuration and public Model package. Database does not copy the complete Model definitions."
            fields:
              configuration:
                required: true
                purpose: "The generated Model configuration supplying fields, relationships, rules, credentials, and initial data."
              package:
                required: true
                purpose: "The Model package supplying the runtime Model types."
          mapping:
            required: true
            purpose: "The conventions used to derive physical persistence from Model configuration plus only explicit Database-specific overrides."
            fields:
              strategy:
                required: true
                purpose: "How physical storage mappings are derived from Models."
              naming:
                required: true
                purpose: "The resolved default naming conventions used by the selected Engine."
              relationships:
                required: true
                purpose: "The resolved default foreign-key and referential-action conventions."
              overrides:
                required: true
                purpose: "Database-specific mapping overrides keyed by Model; empty when derived mapping is sufficient. Overrides contain only changed physical details, never a complete Model copy."
          initial_data:
            required: true
            purpose: "How initial records declared by Model are seeded without copying those records into Database configuration."
            fields:
              source:
                required: true
                purpose: "The initial_data section of generated Model configuration."
              enabled_when_present:
                required: true
                purpose: "Whether Model-declared initial data is seeded when present."
              ordering:
                required: true
                purpose: "How relationship dependency order is respected."
              idempotent:
                required: true
                purpose: "Whether repeated seeding avoids duplicate logical records."

      storage_adapter:
        required: true
        purpose: "The resolved physical persistence implementation used for every configured Instance."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Storage Adapter layer."
          orm:
            required: true
            purpose: "The resolved ORM implementation shared by compatible Engine adapters."
            fields:
              name:
                required: true
                purpose: "The ORM name."
              version:
                required: true
                purpose: "The concrete ORM version."
              language:
                required: true
                purpose: "The ORM implementation language."
              package:
                required: true
                purpose: "The package supplying the ORM."
              capabilities:
                required: true
                purpose: "The resolved ORM capabilities used by Database."
                fields:
                  model_mapping:
                    required: true
                    purpose: "Whether the ORM provides Model-to-storage mapping."
                  parameterized_sql:
                    required: true
                    purpose: "Whether the ORM supports parameterized SQL execution."
          migration:
            required: true
            purpose: "The resolved migration tool, environment, packages, and commands."
            fields:
              tool:
                required: true
                purpose: "The migration tool and concrete version."
                fields:
                  name:
                    required: true
                    purpose: "The migration tool name."
                  version:
                    required: true
                    purpose: "The concrete migration tool version."
                  language:
                    required: true
                    purpose: "The implementation language required by the migration tool."
                  compatible_orms:
                    required: true
                    purpose: "The ORM implementations with which the selected migration tool is compatible."
              environment:
                required: true
                purpose: "The resolved Database-tooling environment."
                fields:
                  name:
                    required: true
                    purpose: "The environment and dependency-management tool name."
                  version:
                    required: true
                    purpose: "The concrete environment-tool version."
              packages:
                required: true
                purpose: "The resolved migration and schema-tooling packages."
                fields:
                  "<package>":
                    required: false
                    purpose: "One tooling package, keyed by its responsibility."
                    fields:
                      name:
                        required: true
                        purpose: "The ecosystem package name."
                      version:
                        required: true
                        purpose: "The concrete package version."
              commands:
                required: true
                purpose: "The canonical migration commands."
                fields:
                  "<command>":
                    required: false
                    purpose: "One canonical migration command keyed by its operation."
          connections:
            required: true
            purpose: "How Engine adapters create and manage connections for configured Instances."
            fields:
              instance_source:
                required: true
                purpose: "The instances section used to create connections."
              secrets:
                required: true
                purpose: "How secret references are resolved at runtime without storing values in generated configuration."
              management:
                required: true
                purpose: "How connections are created, reused, and closed within the application runtime."
          credential_storage:
            required: true
            purpose: "The resolved at-rest transformations for Model fields marked as credentials."
            fields:
              resolution:
                required: true
                purpose: "The precedence used to resolve a storage mode for each credential field."
              default_mode:
                required: true
                purpose: "The supported mode used when no explicit or exact-name field default applies."
              field_defaults:
                required: true
                purpose: "Exact-name defaults applied only to existing fields marked as credentials; empty when none apply."
                fields:
                  "<field>":
                    required: false
                    purpose: "One credential field-name default."
                    fields:
                      mode:
                        required: true
                        purpose: "The supported at-rest mode selected by this default."
              resolved_fields:
                required: true
                purpose: "The resolved storage mode for every credential field in the current Model configuration."
                fields:
                  "<credential>":
                    required: false
                    purpose: "One credential field keyed by a stable qualified Model and field identity."
                    fields:
                      model:
                        required: true
                        purpose: "The Model key containing the credential field."
                      field:
                        required: true
                        purpose: "The credential field key."
                      mode:
                        required: true
                        purpose: "The supported at-rest mode resolved for this field."
              modes:
                required: true
                purpose: "The supported credential-storage modes."
                fields:
                  "<mode>":
                    required: false
                    purpose: "One supported mode keyed by its stable name."
                    fields:
                      stored_as:
                        required: true
                        purpose: "The logical storage representation produced by the mode."
                      transformation:
                        required: true
                        purpose: "The transformation applied before persistence."
                      recoverable:
                        required: true
                        purpose: "Whether the original credential can be recovered."
                      use_case:
                        required: false
                        purpose: "The intended use when additional explanation is needed."
                      key_source:
                        required: false
                        purpose: "The runtime source of encryption key material when the mode requires it."
          standards:
            required: true
            purpose: "The resolved migration and physical-storage conventions not already owned by Model."
          backups:
            required: true
            purpose: "The resolved backup and restore capability."
            fields:
              enabled:
                required: true
                purpose: "Whether backup and restore automation is enabled."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The resolved ownership boundaries of Database."
    fields:
      owns:
        required: true
        purpose: "The responsibilities owned by Database."
      does_not_own:
        required: true
        purpose: "Responsibilities explicitly outside Database."
      interface:
        required: true
        purpose: "The public interface exported by the Database package."

  out_of_scope:
    required: true
    purpose: "Resolved work explicitly outside Database."
