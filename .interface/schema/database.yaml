schema:
  id: agent-interface-database
  version: "9.0"
  purpose: "The shape of the generated layered Database configuration"

structure:
  - code_path
  - code_path_note
  - summary
  - verify_cwd
  - responsibility
  - layers
  - boundaries
  - out_of_scope

sections:

  code_path:
    required: true
    purpose: "The project-relative folder containing Database implementation artifacts."

  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to."

  summary:
    required: true
    purpose: "A one-line summary of Database."

  verify_cwd:
    required: true
    purpose: "The resolved working directory and environment for Database verification commands."

  responsibility:
    required: true
    purpose: "The resolved responsibilities of Database."

  layers:
    required: true
    purpose: "The resolved Database Interface, Data Logic, and Storage Adapter layers."
    fields:

      database_interface:
        required: true
        purpose: "The generic interface published to Database consumers."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Database Interface layer."
          style:
            required: true
            purpose: "The resolved interface style used across persistent Models."
          model_selector:
            required: true
            purpose: "How a caller identifies the Model governed by an operation."
          operations:
            required: true
            purpose: "The standard Model-data operations published by Database Interface."
            fields:
              create:
                required: true
                purpose: "The resolved create operation."
              read:
                required: true
                purpose: "The resolved read operation."
              list:
                required: true
                purpose: "The resolved list operation."
              update:
                required: true
                purpose: "The resolved update operation."
              delete:
                required: true
                purpose: "The resolved delete operation."
              status:
                required: true
                purpose: "The resolved status operation."
                fields:
                  actions:
                    required: true
                    purpose: "The accepted status actions: enable and disable."
                  required_field:
                    required: true
                    purpose: "The Model field required for the status operation."
                  value_mapping:
                    required: true
                    purpose: "The resolved value written for each status action."
                    fields:
                      enable:
                        required: true
                        purpose: "The resolved enabled value."
                      disable:
                        required: true
                        purpose: "The resolved disabled value."
          sql_commands:
            required: true
            purpose: "The controlled SQL-command capability published through Database Interface."
            fields:
              enabled:
                required: true
                purpose: "Whether controlled SQL-command execution is available."
              parameterized:
                required: true
                purpose: "Whether SQL values are supplied separately from command text."
              scope:
                required: true
                purpose: "The resolved SQL execution scope."

      data_logic:
        required: true
        purpose: "The generic Model-driven data logic and storage-mapping layer."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Data Logic layer."
          model_source:
            required: true
            purpose: "The generated Model configuration supplying Models, fields, relationships, rules, credentials, and initial data."
          storage_schema:
            required: true
            purpose: "The resolved physical storage mapping produced from logical Models."
            fields:
              tables:
                required: true
                purpose: "The resolved physical tables."
                fields:
                  "<table>":
                    required: true
                    purpose: "One physical table, keyed by its resolved name."
                    fields:
                      source_model:
                        required: true
                        purpose: "The shared logical Model implemented by this table."
                      columns:
                        required: true
                        purpose: "The resolved physical columns."
                        fields:
                          "<column>":
                            required: true
                            purpose: "One physical column, keyed by its resolved name."
                            fields:
                              type:
                                required: true
                                purpose: "The resolved Database type."
                              nullable:
                                required: true
                                purpose: "Whether the column accepts null."
                              primary_key:
                                required: true
                                purpose: "Whether the column belongs to the primary key."
                              auto_increment:
                                required: true
                                purpose: "Whether Database generates the numeric value by incrementing it."
                              default:
                                required: true
                                purpose: "The Database default, or null when none applies."
                              credential_storage:
                                required: false
                                purpose: "The resolved at-rest mode for a credential field."
                              references:
                                required: false
                                purpose: "The resolved foreign-key target for a relationship column."
                                fields:
                                  table:
                                    required: true
                                    purpose: "The referenced physical table."
                                  column:
                                    required: true
                                    purpose: "The referenced key column."
                                  on_delete:
                                    required: true
                                    purpose: "The resolved action when the referenced row is deleted."
                                  on_update:
                                    required: true
                                    purpose: "The resolved action when the referenced key is updated."
                      constraints:
                        required: true
                        purpose: "Named table constraints, empty when none apply."
                        fields:
                          "<constraint>":
                            required: false
                            purpose: "One named constraint."
                            validation: "A unique constraint requires columns. A check constraint requires expression."
                            fields:
                              type:
                                required: true
                                purpose: "The constraint kind."
                              columns:
                                required: false
                                purpose: "The ordered columns governed by a column-based constraint."
                              expression:
                                required: false
                                purpose: "The resolved expression for an expression-based constraint."
                              source_rule:
                                required: false
                                purpose: "The logical Model rule that produced the constraint."
                      indexes:
                        required: true
                        purpose: "Named indexes, empty when none apply."
                        fields:
                          "<index>":
                            required: false
                            purpose: "One named index."
                            fields:
                              columns:
                                required: true
                                purpose: "The ordered columns covered by the index."
                              unique:
                                required: true
                                purpose: "Whether the index enforces uniqueness."
          initial_data:
            required: true
            purpose: "The resolved initial records mapped from Model configuration."
            fields:
              enabled:
                required: true
                purpose: "Whether initial-data seeding is enabled."
              records:
                required: true
                purpose: "Initial records grouped by resolved table, empty when none exist."
                fields:
                  "<table>":
                    required: false
                    purpose: "The ordered initial records for one table."

      storage_adapter:
        required: true
        purpose: "The resolved physical persistence and Database Engine adapter."
        fields:
          responsibility:
            required: true
            purpose: "The responsibility of the Storage Adapter layer."
          tech:
            required: true
            purpose: "The resolved Engine, storage, connection, ORM, migration environment, and packages."
            fields:
              engine:
                required: true
                purpose: "The resolved Database Engine."
                fields:
                  name:
                    required: true
                    purpose: "The Engine name."
                  version:
                    required: true
                    purpose: "The concrete Engine version or supplying runtime."
              storage:
                required: true
                purpose: "Where and how Database state is physically stored."
                fields:
                  kind:
                    required: true
                    purpose: "The storage kind, such as file or server."
                  location:
                    required: true
                    purpose: "The resolved storage location."
              connection:
                required: true
                purpose: "The resolved Engine-specific runtime connection settings."
              orm:
                required: true
                purpose: "The resolved ORM implementation."
                fields:
                  name:
                    required: true
                    purpose: "The ORM name."
                  version:
                    required: true
                    purpose: "The concrete ORM version."
                  language:
                    required: true
                    purpose: "The ORM implementation language."
                  package:
                    required: true
                    purpose: "The package supplying the ORM."
                  capabilities:
                    required: true
                    purpose: "The resolved ORM capabilities used by Database."
              migration:
                required: true
                purpose: "The resolved migration tool, environment, packages, and commands."
                fields:
                  tool:
                    required: true
                    purpose: "The migration tool and concrete version."
                  environment:
                    required: true
                    purpose: "The resolved Database-tooling environment."
                  packages:
                    required: true
                    purpose: "The resolved migration and schema-tooling packages."
                  commands:
                    required: true
                    purpose: "The canonical migration commands."
          standards:
            required: true
            purpose: "The resolved naming and migration conventions."
            fields:
              naming:
                required: true
                purpose: "The Database object naming conventions."
              migrations:
                required: true
                purpose: "The migration ordering, reversibility, and history conventions."
          backups:
            required: true
            purpose: "The resolved backup and restore capability."
            fields:
              enabled:
                required: true
                purpose: "Whether backup and restore automation is enabled."

  boundaries:
    required: true
    purpose: "The resolved ownership boundaries of Database."
    fields:
      owns:
        required: true
        purpose: "The responsibilities owned by Database."
      does_not_own:
        required: true
        purpose: "Responsibilities explicitly outside Database."
      interface:
        required: true
        purpose: "The interface published by Database."

  out_of_scope:
    required: true
    purpose: "Resolved work explicitly outside Database."
