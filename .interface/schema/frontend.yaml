schema:
  id: agent-interface-frontend
  version: "6.0"
  purpose: "The shape of the generated Frontend configuration"

structure:
  - code_path
  - code_path_note
  - summary
  - verify_cwd
  - responsibility
  - tech
  - standards
  - interfaces
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The project-relative folder containing Frontend implementation artifacts."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "A one-line summary of Frontend."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The resolved working directory and environment for Frontend verification commands."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "The resolved responsibilities of Frontend."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "The resolved language, library, framework, package manager, and run command used by Frontend."
    fields:
      language:
        required: true
        purpose: "The frontend programming language and version."
        fields:
          name:
            required: true
            purpose: "The language name."
          version:
            required: true
            purpose: "The language version."
      library:
        required: true
        purpose: "The UI library."
        fields:
          name:
            required: true
            purpose: "The library name."
          version:
            required: true
            purpose: "The library version."
      framework:
        required: true
        purpose: "The application framework and its resolved conventions."
        fields:
          name:
            required: true
            purpose: "The framework name."
          version:
            required: true
            purpose: "The framework version."
      package_manager:
        required: true
        purpose: "The resolved Frontend package manager."
        fields:
          name:
            required: true
            purpose: "The package manager name."
          version:
            required: true
            purpose: "The package manager version."
      run:
        required: true
        purpose: "The command that starts the frontend."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "The resolved frontend naming and component conventions."
    fields:
      naming:
        required: true
        purpose: "The case style for frontend identifiers, files, folders, and components."
      component_style:
        required: true
        purpose: "The resolved component declaration style."

  # <!--------------------------------------------------------------------------------- Interfaces -->
  interfaces:
    required: true
    purpose: "The resolved interfaces Frontend provides and consumes."
    fields:
      provides:
        required: true
        purpose: "The interface Frontend publishes, or none."
      uses:
        required: true
        purpose: "The interface consumed by Frontend."
      rule:
        required: true
        purpose: "The resolved rule governing Frontend interface use."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The resolved ownership boundaries of Frontend."
    fields:
      owns:
        required: true
        purpose: "The responsibilities owned by Frontend."
      does_not_own:
        required: true
        purpose: "Responsibilities explicitly outside Frontend."
      interface:
        required: true
        purpose: "The interface Frontend exposes outside its boundary."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "Resolved work explicitly outside Frontend."
