schema:
  id: agent-interface-database
  version: "5.0"
  purpose: "The shape of database.yaml — every parameter an agent reads to understand the independent database item"
  principles: ".interface/principles/database.md"
  preferences: ".interface/preferences/database.yaml"
  layering: "This file defines shape only. The mandatory rules of the database item live in its principles document; the supported technical choices used when project.md is silent live in its preferences file. Neither is restated here."

structure:
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - standards
  - capabilities
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding database-owned migrations, tooling, and local storage — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the Interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The database item in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that changes database behavior is proven by a written test."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory and isolated environment in which every database verification command runs."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the database item is answerable for — persistent storage, schema evolution, and its published contract."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "The resolved database engine, storage, migration environment, and packages."
    fields:
      engine:
        required: true
        purpose: "The database engine and version."
        fields:
          name:
            required: true
            purpose: "The engine name."
          version:
            required: true
            purpose: "The engine version or the runtime that supplies it."
      storage:
        required: true
        purpose: "Where and how database state is physically stored."
        fields:
          kind:
            required: true
            purpose: "The storage kind, such as file or server."
          location:
            required: true
            purpose: "The project-relative local path or deployment-owned location description; secrets are never committed."
      connection:
        required: true
        purpose: "Engine-specific connection behavior published to consumers without credentials."
      migration:
        required: true
        purpose: "The one migration tool, its isolated environment, packages, and commands."
        fields:
          tool:
            required: true
            purpose: "The migration tool and version."
          environment:
            required: true
            purpose: "The isolated environment used only for database tooling."
          packages:
            required: true
            purpose: "The exact packages installed for migration and schema tooling."
          commands:
            required: true
            purpose: "The canonical upgrade, downgrade, and verification commands."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "The resolved conventions for tables, columns, constraints, indexes, and migrations."
    fields:
      naming:
        required: true
        purpose: "The database object naming conventions."
      migrations:
        required: true
        purpose: "Ordering, reversibility, and history rules for schema changes."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of optional database capabilities; testing has its own switch in needs_test."
    fields:
      seed_data:
        required: true
        purpose: "Whether managed seed data is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved seed-data switch."
          records:
            required: false
            purpose: "The ordered initial records resolved from model.yaml and grouped by their physical table. Present only when seed data is enabled because the project declares initial data."
            fields:
              "<table>":
                required: false
                purpose: "The ordered initial records for one resolved physical table. Every record uses resolved column names and preserves explicit values or generation instructions."
      backups:
        required: true
        purpose: "Whether backup and restore automation is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved backup switch."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The database contract published to backend consumers."
    fields:
      produces:
        required: true
        purpose: "The database contract version this item publishes."
      rule:
        required: true
        purpose: "The implemented schema and the published contract must match exactly."
      change_rule:
        required: true
        purpose: "A frozen database contract is versioned, never edited; a change means a new version and migrations between versions."
      "<version>":
        required: true
        purpose: "One database contract version — engine-independent meaning plus the exact schema surface consumers may use."
        fields:
          lifecycle:
            required: true
            purpose: "Where the contract stands — draft, frozen, or deprecated."
          lifecycle_note:
            required: true
            purpose: "What the lifecycle permits and what a change costs."
          engine:
            required: true
            purpose: "The resolved engine assumptions that affect consumers."
          connection:
            required: true
            purpose: "The credential-free connection shape and runtime configuration source."
          tables:
            required: true
            purpose: "The fully resolved tables, columns, types, nullability, keys, references, constraints, indexes, and credential storage modes exposed by this version. Every relationship names its foreign-key field, referenced table, and referenced column explicitly; every constraint derived from a model rule records its source rule; and every credential field names its resolved at-rest mode."
            fields:
              "<table>":
                required: true
                purpose: "One physical table, keyed by its resolved plural_snake_case table name unless the project explicitly supplies another name."
                fields:
                  source_model:
                    required: true
                    purpose: "The domain-model key from model.yaml that this table implements."
                  columns:
                    required: true
                    purpose: "Every physical column in the table, including project-declared fields and relationship foreign keys."
                    fields:
                      "<column>":
                        required: true
                        purpose: "One physical column, keyed by its resolved column name."
                        fields:
                          type:
                            required: true
                            purpose: "The complete resolved database type."
                          nullable:
                            required: true
                            purpose: "Whether the column accepts null."
                          primary_key:
                            required: true
                            purpose: "Whether the column belongs to the table primary key."
                          auto_increment:
                            required: true
                            purpose: "Whether the database generates this numeric key by incrementing it."
                          default:
                            required: true
                            purpose: "The database default value, or null when the column has no database default."
                          credential_storage:
                            required: false
                            purpose: "The resolved plaintext, hash, or encrypted at-rest mode; present only for a credential field."
                          references:
                            required: false
                            purpose: "The exact foreign-key target; present only for a relationship column."
                            fields:
                              table:
                                required: true
                                purpose: "The resolved physical table being referenced."
                              column:
                                required: true
                                purpose: "The resolved key column being referenced."
                              on_delete:
                                required: true
                                purpose: "The resolved action when the referenced row is deleted."
                              on_update:
                                required: true
                                purpose: "The resolved action when the referenced key is updated."
                  constraints:
                    required: true
                    purpose: "Named table constraints, empty when the table has none beyond column-level primary keys and references."
                    fields:
                      "<constraint>":
                        required: false
                        purpose: "One named constraint."
                        validation: "A unique constraint requires columns. A check constraint requires expression. Other constraint kinds must provide the fields required by their resolved database representation."
                        fields:
                          type:
                            required: true
                            purpose: "The constraint kind, such as unique or check."
                          columns:
                            required: false
                            purpose: "The ordered column names governed by a column-based constraint; required for unique constraints."
                          expression:
                            required: false
                            purpose: "The resolved database expression; required for check constraints."
                          source_rule:
                            required: false
                            purpose: "The exact model rule that produced this constraint; present only when a model rule is its source."
                  indexes:
                    required: true
                    purpose: "Named indexes for the table, empty when none are required."
                    fields:
                      "<index>":
                        required: false
                        purpose: "One named index."
                        fields:
                          columns:
                            required: true
                            purpose: "The ordered column names covered by the index."
                          unique:
                            required: true
                            purpose: "Whether this index also enforces uniqueness."
  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the database item."
    fields:
      owns:
        required: true
        purpose: "The engine choice, storage, schema, constraints, indexes, migrations, and database contract."
      does_not_own:
        required: true
        purpose: "Backend ORM behavior, API behavior, frontend code, and deployment secrets."
      interface:
        required: true
        purpose: "The frozen database contract and credential-free connection requirements offered to the backend."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the database item does not do — named so it is never inferred into a task."
