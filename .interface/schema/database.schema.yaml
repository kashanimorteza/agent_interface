schema:
  id: agent-interface-database
  version: "2.6"
  purpose: "The shape of database.yaml — every parameter an agent reads to understand the independent database item"

policy:
  preference_resolution:
    rule: "An explicit project value always wins. When a supported database technical choice is unstated, resolve it from database preferences. Ambiguous or conflicting information is an open question and is never resolved from a preference."
    resolved_by: "my-interface-interpreter only; downstream Skills consume the resolved database configuration and never reinterpret preferences."
  ownership: "The database item alone owns its engine choice, physical storage, schema, constraints, indexes, migration history, and database contract."
  schema_changes: "Every schema change is expressed by an ordered reversible migration. Backend code never creates, alters, or drops database objects directly."
  contract_boundary: "Consumers use only a frozen database contract and runtime connection information; they never infer schema from migrations or database files."
  table_template_resolution:
    rule: "Use preferences.table_template as a suggested starting point for every table. Explicit project definitions always win, and the interpreter may adapt, replace, or omit template fields when the table semantics call for a better design."
    resolved_by: "my-interface-interpreter writes the complete resolved field set into each contract table; downstream Skills never reapply or reinterpret the template."
  model_table_resolution:
    rule: "Treat every domain model as persistent and map it to one database table unless the project explicitly marks that model as non-persistent or supplies a different mapping."
    naming: "Derive the default table name from the model name in plural_snake_case. An explicit project table name always wins."
    resolved_by: "my-interface-interpreter writes every resolved table name and its source model explicitly into the database contract."
  version_resolution:
    explicit: "Preserve every concrete version stated by the project exactly."
    latest: "When a supported preference supplies latest, my-interface-interpreter resolves it to the latest stable version compatible with the complete selected database tool stack and writes only that concrete version into database.yaml. The token latest never appears in generated Config."
    unresolved: "If a current stable version cannot be verified or the selected versions are incompatible, record an open question instead of guessing or preserving latest."
  relationship_resolution:
    rule: "When the project declares a relationship without specifying its physical field, represent it with a foreign-key field named <referenced_model_name_in_snake_case>_id. This name is derived from the referenced domain model and does not depend on whether the physical table name is singular or plural. An explicit project field or reference always wins."
    referenced_key: "Reference the related table primary key unless the project explicitly names another referenced key."
    type_rule: "The foreign-key field type must match the referenced key type exactly and is never hard-coded independently."
    resolved_by: "my-interface-interpreter writes the foreign-key field, referenced table, and referenced column explicitly into the database contract."
  credential_storage_resolution:
    rule: "Resolve every credential field to one mode from preferences.credential_storage. An explicit project mode for a credential field always wins; otherwise use the default mode."
    semantics: "plaintext stores the original value unchanged, hash stores a one-way representation intended only for verification, and encrypted stores a reversible encrypted representation for credentials the application must recover."
    boundary: "The database contract owns the resolved at-rest representation. The consuming backend owns the corresponding runtime transformation and never infers or changes the mode. Encryption keys and other secrets never live in the database contract or database files."

preferences:
  defaults:
    code_path: "database/"
    needs_test: false
    responsibility: "Owns persistent storage, schema evolution, and the database contract consumed by the backend."
    engine: "SQLite"
    migration_tool: "Alembic"
  engines:
    SQLite:
      version: "runtime-provided"
      storage:
        kind: "file"
        path: "app.db"
      connection:
        url_scheme: "sqlite"
        foreign_keys: true
        check_same_thread: false
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"
  migration_tools:
    Alembic:
      version: "latest"
      language: "Python"
      environment:
        name: "uv"
        version: "latest"
      packages:
        migration:
          name: "Alembic"
          version: "latest"
        schema_toolkit:
          name: "SQLAlchemy"
          version: "latest"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"
  table_template:
    purpose: "A soft default for ordinary table fields when the project leaves their shape unstated; it is guidance, not a mandatory table contract."
    fields:
      id:
        type: "integer"
        primary_key: true
        auto_increment: true
        nullable: false
      name:
        type: "string"
        nullable: false
        unique: true
        role: "The default human-readable logical key."
      description:
        type: "string"
        nullable: true
      status:
        type: "boolean"
        nullable: false
        default: true
  credential_storage:
    default: "plaintext"
    modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "reversible_encryption"
        recoverable: true
        key_source: "Runtime configuration outside the database and its contract."
  capabilities:
    testing:
      default_enabled: false
    seed_data:
      default_enabled: false
    backups:
      default_enabled: false

structure:
  - code_path
  - code_path_note
  - summary
  - needs_test
  - verify_cwd
  - responsibility
  - tech
  - standards
  - capabilities
  - contracts
  - boundaries
  - out_of_scope

sections:

  # <!--------------------------------------------------------------------------------- Code_Path -->
  code_path:
    required: true
    purpose: "The folder holding database-owned migrations, tooling, and local storage — the one place this item may write."

  # <!--------------------------------------------------------------------------------- Code_Path_Note -->
  code_path_note:
    required: true
    purpose: "Explains what code_path is relative to, so it is never read as a path inside the Interface."

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The database item in one line — read before any of its settings."

  # <!--------------------------------------------------------------------------------- Needs_Test -->
  needs_test:
    required: true
    purpose: "Whether every task that changes database behavior is proven by a written test."

  # <!--------------------------------------------------------------------------------- Verify_Cwd -->
  verify_cwd:
    required: true
    purpose: "The directory and isolated environment in which every database verification command runs."

  # <!--------------------------------------------------------------------------------- Responsibility -->
  responsibility:
    required: true
    purpose: "What the database item is answerable for — persistent storage, schema evolution, and its published contract."

  # <!--------------------------------------------------------------------------------- Tech -->
  tech:
    required: true
    purpose: "The resolved database engine, storage, migration environment, and packages."
    fields:
      engine:
        required: true
        purpose: "The database engine and version."
        fields:
          name:
            required: true
            purpose: "The engine name."
          version:
            required: true
            purpose: "The engine version or the runtime that supplies it."
      storage:
        required: true
        purpose: "Where and how database state is physically stored."
        fields:
          kind:
            required: true
            purpose: "The storage kind, such as file or server."
          location:
            required: true
            purpose: "The project-relative local path or deployment-owned location description; secrets are never committed."
      connection:
        required: true
        purpose: "Engine-specific connection behavior published to consumers without credentials."
      migration:
        required: true
        purpose: "The one migration tool, its isolated environment, packages, and commands."
        fields:
          tool:
            required: true
            purpose: "The migration tool and version."
          environment:
            required: true
            purpose: "The isolated environment used only for database tooling."
          packages:
            required: true
            purpose: "The exact packages installed for migration and schema tooling."
          commands:
            required: true
            purpose: "The canonical upgrade, downgrade, and verification commands."

  # <!--------------------------------------------------------------------------------- Standards -->
  standards:
    required: true
    purpose: "The resolved conventions for tables, columns, constraints, indexes, and migrations."
    fields:
      naming:
        required: true
        purpose: "The database object naming conventions."
      migrations:
        required: true
        purpose: "Ordering, reversibility, and history rules for schema changes."

  # <!--------------------------------------------------------------------------------- Capabilities -->
  capabilities:
    required: true
    purpose: "The resolved state of optional database capabilities; testing has its own switch in needs_test."
    fields:
      seed_data:
        required: true
        purpose: "Whether managed seed data is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved seed-data switch."
      backups:
        required: true
        purpose: "Whether backup and restore automation is part of the database item."
        fields:
          enabled:
            required: true
            purpose: "The resolved backup switch."

  # <!--------------------------------------------------------------------------------- Contracts -->
  contracts:
    required: true
    purpose: "The database contract published to backend consumers."
    fields:
      produces:
        required: true
        purpose: "The database contract version this item publishes."
      rule:
        required: true
        purpose: "The implemented schema and the published contract must match exactly."
      change_rule:
        required: true
        purpose: "A frozen database contract is versioned, never edited; a change means a new version and migrations between versions."
      "<version>":
        required: true
        purpose: "One database contract version — engine-independent meaning plus the exact schema surface consumers may use."
        fields:
          lifecycle:
            required: true
            purpose: "Where the contract stands — draft, frozen, or deprecated."
          lifecycle_note:
            required: true
            purpose: "What the lifecycle permits and what a change costs."
          consumed_by:
            required: true
            purpose: "The backend item or items consuming this contract."
          engine:
            required: true
            purpose: "The resolved engine assumptions that affect consumers."
          connection:
            required: true
            purpose: "The credential-free connection shape and runtime configuration source."
          tables:
            required: true
            purpose: "The fully resolved tables, columns, types, nullability, keys, references, constraints, indexes, and credential storage modes exposed by this version. Every relationship names its foreign-key field, referenced table, and referenced column explicitly, and every credential field names its resolved at-rest mode."
          migrations:
            required: true
            purpose: "The migration range that realizes this contract version."

  # <!--------------------------------------------------------------------------------- Boundaries -->
  boundaries:
    required: true
    purpose: "The limits of the database item."
    fields:
      owns:
        required: true
        purpose: "The engine choice, storage, schema, constraints, indexes, migrations, and database contract."
      does_not_own:
        required: true
        purpose: "Backend ORM behavior, API behavior, frontend code, and deployment secrets."
      interface:
        required: true
        purpose: "The frozen database contract and credential-free connection requirements offered to the backend."

  # <!--------------------------------------------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    required: true
    purpose: "What the database item does not do — named so it is never inferred into a task."
