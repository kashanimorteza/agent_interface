schema:
  id: agent-interface-definition
  version: "1.2"
  purpose: "The shape of definition.yaml — every parameter an agent reads to understand what the product is"

structure:
  - identity
  - goals
  - architecture
  - phases

sections:

  # <!--------------------------------------------------------------------------------- Identity -->
  identity:
    required: true
    purpose: "Who the product is — set by the human, never inferred."
    fields:
      id:
        required: true
        purpose: "The product's identifier — short, stable, machine-readable."
      name:
        required: true
        purpose: "The product's human-readable name."
      one_liner:
        required: true
        purpose: "One sentence naming the product's promise — everything the product must eventually make true."

  # <!--------------------------------------------------------------------------------- Goals -->
  goals:
    required: true
    purpose: "What a user can do when the product is finished — one capability per line, and the list every task traces back to; a goal no contract can satisfy is raised as an open question, never fixed here."

  # <!--------------------------------------------------------------------------------- Architecture -->
  architecture:
    required: true
    purpose: "The parts of the product, what each owns, and the directed contract connections between them."
    fields:
      shape:
        required: true
        purpose: "The whole architecture in one sentence — how many parts, and what joins them."
      reason:
        required: true
        purpose: "Why this shape — what it buys the build."
      parts:
        required: true
        purpose: "One entry per part of the product — its fields below."
        fields:
          "<part>":
            required: true
            purpose: "One part of the product, named by its item — an entry per part."
            fields:
              responsibility:
                required: true
                purpose: "What this part does — one sentence."
              owns:
                required: true
                purpose: "What belongs to this part."
              does_not_own:
                required: true
                purpose: "What is explicitly not this part's, however close it sits."
              produces:
                required: false
                purpose: "The contracts this part publishes, and where they live — on a producing part."
              consumes:
                required: false
                purpose: "The contracts this part reads, and where they live — on a consuming part."
      connections:
        required: true
        purpose: "The directed contract graph between architecture items — one entry per producer-to-consumer connection."
        fields:
          "<connection>":
            required: true
            purpose: "One directed connection, named for its producer and consumer."
            fields:
              from:
                required: true
                purpose: "The architecture item publishing the contract."
              to:
                required: true
                purpose: "The architecture item consuming the contract."
              contract:
                required: true
                purpose: "The published contract and version used by the consumer."
              path:
                required: true
                purpose: "Where the contract lives — the one mapped place the consumer reads."
              rule:
                required: true
                purpose: "The contract is the only connection point; neither item reaches into the other's implementation."
              versioning:
                required: true
                purpose: "A frozen contract never changes; a change means a new version."

  # <!--------------------------------------------------------------------------------- Phases -->
  phases:
    required: true
    purpose: "The authoritative ordered project phase index copied from project.md. Planning reads phase identity, title, order, target, and goal only from this section and never invents an independent phase."
    fields:
      "<phase>":
        required: true
        purpose: "One project phase — a list entry, kept in the same order as project.md."
        fields:
          id:
            required: true
            purpose: "P1, P2, ... — derived mechanically as P plus the number in the project's Phase heading and unique across the project."
          title:
            required: true
            purpose: "The phase title stated by the project, copied faithfully."
          order:
            required: true
            purpose: "The phase's one-based position in project.md."
          target:
            required: true
            purpose: "The architecture item named by the project's phase target, resolved to its indexed item key."
          goal:
            required: true
            purpose: "What the project states this phase must accomplish, copied faithfully."
