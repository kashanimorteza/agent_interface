schema:
  id: agent-interface-definition
  version: "2.6"
  purpose: "The shape of definition.yaml — every parameter an agent reads to understand what the product is"
  phase_model: "Project phases are the primary units of planning, development, review, and progress. A phase's target selects the item configuration, Policy, contracts, and code_path used for that phase. Any number of phases may target the same item."

structure:
  - identity
  - goals
  - models
  - architecture
  - phases

sections:

  # <!--------------------------------------------------------------------------------- Identity -->
  identity:
    required: true
    purpose: "Who the product is — set by the human, never inferred."
    fields:
      name:
        required: true
        purpose: "The product's human-readable name."
      description:
        required: true
        purpose: "The product description stated by the human in project.md, copied faithfully without reinterpretation."

  # <!--------------------------------------------------------------------------------- Goals -->
  goals:
    required: true
    purpose: "What a user can do when the product is finished — one capability per line, copied faithfully from project.md. Project phases translate these product capabilities into ordered implementation goals."

  # <!--------------------------------------------------------------------------------- Models -->
  models:
    required: true
    purpose: "The project's domain entities, preserved independently of any target item's technical representation. Database columns, foreign keys, indexes, and storage details do not live here."
    fields:
      "<model>":
        required: true
        purpose: "One domain model from project.md. Its key is the model heading normalized to lower_snake_case, and entries remain in project order."
        fields:
          purpose:
            required: true
            purpose: "What the model represents, copied faithfully from the model's Purpose in project.md."
          relationships:
            required: true
            purpose: "The model's conceptual relationships, empty when none are declared. Physical foreign-key fields are resolved only by the owning target item."
            fields:
              "<relationship>":
                required: false
                purpose: "One relationship declared by the project."
                fields:
                  type:
                    required: true
                    purpose: "The relationship kind stated by the project, such as belongs_to."
                  target:
                    required: true
                    purpose: "The related model key, normalized by the same rule as model keys."
                  role:
                    required: false
                    purpose: "The relationship's semantic role when the model has more than one relationship to the same target, such as source or destination; absent for an unqualified relationship."
          rules:
            required: true
            purpose: "Model-specific domain rules stated by the project, empty when none are declared. These express meaning and constraints without prescribing database fields."

  # <!--------------------------------------------------------------------------------- Architecture -->
  architecture:
    required: true
    purpose: "The target item types referenced by project phases, what each owns, and the directed contract connections between them. Items provide technical context and boundaries; they are not units of workflow."
    fields:
      shape:
        required: true
        purpose: "The whole architecture in one sentence — how many parts, and what joins them."
      parts:
        required: true
        purpose: "One entry per target item referenced by at least one project phase — its fields below. An available item type with no targeting phase does not enter the generated Understanding."
        fields:
          "<part>":
            required: true
            purpose: "One target item selected by one or more project phases — an entry per resolved target."
            fields:
              responsibility:
                required: true
                purpose: "What this part does — one sentence."
              owns:
                required: true
                purpose: "What belongs to this part."
              does_not_own:
                required: true
                purpose: "What is explicitly not this part's, however close it sits."
              produces:
                required: false
                purpose: "The contracts this part publishes, and where they live — on a producing part."
              consumes:
                required: false
                purpose: "The contracts this part reads, and where they live — on a consuming part."
      connections:
        required: true
        purpose: "The directed interface graph between target items — one entry per producer-to-consumer connection."
        fields:
          "<connection>":
            required: true
            purpose: "One directed connection, named for its producer and consumer."
            fields:
              from:
                required: true
                purpose: "The architecture item publishing the contract."
              to:
                required: true
                purpose: "The architecture item consuming the contract."
              contract:
                required: true
                purpose: "The published contract or implemented runtime interface used by the consumer."
              path:
                required: true
                purpose: "Where the consumer reads the interface — a mapped contract path or a framework-generated machine-readable location."
              rule:
                required: true
                purpose: "The contract is the only connection point; neither item reaches into the other's implementation."
              versioning:
                required: false
                purpose: "The versioning rule when this connection uses a frozen versioned contract; omitted for an implementation-generated runtime interface."

  # <!--------------------------------------------------------------------------------- Phases -->
  phases:
    required: true
    purpose: "The authoritative ordered project workflow copied from project.md. Phases are the primary units of planning, development, review, and progress. Their count is unrestricted, and multiple phases may target the same item."
    fields:
      "<phase>":
        required: true
        purpose: "One project phase — a list entry, kept in the same order as project.md."
        fields:
          id:
            required: true
            purpose: "P1, P2, ... — derived mechanically as P plus the number in the project's Phase heading and unique across the project."
          title:
            required: true
            purpose: "The phase title stated by the project, copied faithfully."
          order:
            required: true
            purpose: "The phase's one-based position in project.md."
          target:
            required: true
            purpose: "The item type named by this phase. It resolves the phase's Policy, configuration, contracts, verification context, and code_path; it does not replace the phase as the workflow scope."
          goal:
            required: true
            purpose: "What the project states this phase must accomplish, copied faithfully."
