schema:
  id: agent-interface-task
  version: "2.4"
  purpose: "The shape of task.yaml — the frame that defines a task, and the plans that hold the tasks"
  frame_and_surface: "task_schema and task_states are the frame — fixed by the human. Plans use the phase → group → task structure. Every plan key is a project phase from definition.yaml; the phase's target resolves the item configuration and code boundary used by its tasks."
  authority: "Who may write each of these, and when, is decided in the State contract — .interface/config/state.yaml under content.state_authority — and in .interface/root.yaml under content.modes; this file gives the shape and invariants, not the permission"

structure:
  - task_schema
  - task_states
  - plans

sections:

  # <!--------------------------------------------------------------------------------- Task_Schema -->
  task_schema:
    required: true
    purpose: "The fields every task carries — the definition of a task, not a task itself."
    fields:
      rule:
        required: true
        purpose: "That every task carries exactly these fields — no more, no fewer."
      fields:
        required: true
        purpose: "One entry per field of a task, each saying what that field holds."
        fields:
          id:
            required: true
            purpose: "Identifier unique within the project phase — its phase prefix keeps it unique across the project."
          title:
            required: true
            purpose: "The task in one sentence."
          goal:
            required: true
            purpose: "What becomes possible after this task that was not possible before."
          depends_on:
            required: true
            purpose: "Ids of tasks in the same project phase. Cross-phase order comes from definition.yaml, and cross-item dependency uses a contract rather than another phase's task id."
          needs_contract:
            required: true
            purpose: "The contract version required — used instead of depending on another item's task; omitted when the task needs none."
          acceptance:
            required: true
            purpose: "Human-readable acceptance criterion — what must actually work."
          verify:
            required: true
            purpose: "A runnable command that proves acceptance — without it a task is never done."
          touches:
            required: true
            purpose: "Paths this task touches, written relative to the code_path of the item named by its phase target."
          status:
            required: true
            purpose: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
          blocker:
            required: true
            purpose: "Id of a critical condition in state.yaml that genuinely prevents safe authorized continuation — present only when status is blocked, absent otherwise."
          log:
            required: true
            purpose: "Append-only list of dated entries carried with the task — absent until the task first moves."
      status_lives_here:
        required: true
        purpose: "That status is written on the task itself, so definition and state can never drift apart."
      history_lives_here_too:
        required: true
        purpose: "That there is no history file — while a Task exists, how it reached its state remains in its append-only log. Reset to planning explicitly removes generated Tasks."

  # <!--------------------------------------------------------------------------------- Task_States -->
  task_states:
    required: true
    purpose: "The vocabulary a task's status field may hold, and the protocols around it."
    fields:
      path:
        required: true
        purpose: "Where a state is written — the status field on each task."
      states:
        required: true
        purpose: "One entry per permitted status, each saying what it means — todo, claimed, blocked, done, cancelled, superseded."
      derived_ready:
        required: true
        purpose: "That ready is not a stored status — a task is ready when it is todo and all of its depends_on are done."
      phase_ready:
        required: true
        purpose: "That phase readiness is derived, never stored — a phase may enter development when it has a non-empty plan and every earlier project phase is complete."
      phase_complete:
        required: true
        purpose: "That phase completion is derived, never stored — a phase is complete when its plan is non-empty, every task not cancelled or superseded is done, and no task remains todo, claimed, or blocked."
      done_gate:
        required: true
        purpose: "That without a passing verify run no task becomes done, even if the code is written."
      claim_protocol:
        required: true
        purpose: "That a task is set to claimed and the file written before work starts, so two agents never take the same task."
      status_only_in_development:
        required: true
        purpose: "That in development mode status, blocker, and log are the only fields an agent may change, with my-interface-reset under S9 as the only outside-mode reset exception."
      reset_protocol:
        required: true
        purpose: "How an explicitly invoked project-wide reset returns every generated Task to its initial status before development, or removes every generated Task to restore the stage before planning, and clears all current State blockers and open questions for either reset stage."

  # <!--------------------------------------------------------------------------------- Plans -->
  plans:
    required: true
    purpose: "The implementation plans — one entry per project phase, keyed by phase id. Phase order and identity come from definition.yaml. The phase target selects its item Policy, configuration, contracts, verification context, and code_path."
    fields:
      "<phase>":
        required: true
        purpose: "One project phase plan — the key is P1, P2, ... exactly as indexed under definition.yaml content.phases."
        fields:
          id:
            required: true
            purpose: "The project phase id, identical to this plan's key and to the id in definition.yaml."
          title:
            required: true
            purpose: "The project phase title, copied faithfully from definition.yaml."
          order:
            required: true
            purpose: "The one-based project phase order copied from definition.yaml."
          target:
            required: true
            purpose: "The phase target copied from definition.yaml. It resolves the item-specific configuration and write boundary; it is not the plan key."
          does:
            required: true
            purpose: "What this project phase accomplishes, derived only from that phase's goal in definition.yaml."
          groups:
            required: true
            purpose: "The technical decomposition of this project phase. Environment, configuration, database, models, migrations, endpoints, or any other implementation area belongs here rather than becoming another project phase."
            fields:
              "<group>":
                required: true
                purpose: "One area of work inside the project phase — related tasks side by side."
                fields:
                  id:
                    required: true
                    purpose: "P1-G1, P1-G2, ... — the project phase id plus a group number, unique across the project."
                  title:
                    required: true
                    purpose: "The area in a few words."
                  does:
                    required: true
                    purpose: "What this group of tasks is doing, and what is true when all of them are done."
                  task_count:
                    required: true
                    purpose: "How many tasks the group holds — stated so the size is visible without counting."
                  tasks:
                    required: true
                    purpose: "The tasks of this group, each carrying exactly the fields of task_schema; a task is one atomic act, naming the one thing it creates or changes — create one file, add one method, implement one function, install one package, add one model, create one endpoint, add one migration, add one specific validation — never a broad or multi-purpose implementation goal. Anything larger is split into several tasks before it is written; many precise tasks are preferred over a few broad ones, however much the count grows, and one sitting finishes each."
