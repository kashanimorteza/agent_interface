schema:
  id: agent-interface-task
  version: "1.3"
  purpose: "The shape of task.yaml — the frame that defines a task, and the project-phase-aligned plan that holds the tasks"
  frame_and_surface: "task_schema and task_states are the frame — fixed by the human. The plan's phases mirror the project phases in the generated Understanding one for one, in the same order and with the same title and target; groups and tasks are the working surface an agent writes inside those phases in planning mode"
  authority: "Who may write each of these, and when, is decided in the State contract — .interface/config/state.yaml under content.state_authority — and in .interface/root.yaml under content.modes; this file gives the shape and the lifecycle, not the permission"

structure:
  - task_schema
  - task_states
  - plans

sections:

  # <!--------------------------------------------------------------------------------- Task_Schema -->
  task_schema:
    required: true
    purpose: "The fields every task carries — the definition of a task, not a task itself."
    fields:
      rule:
        required: true
        purpose: "That every task carries exactly these fields — no more, no fewer."
      fields:
        required: true
        purpose: "One entry per field of a task, each saying what that field holds."
        fields:
          id:
            required: true
            purpose: "Identifier unique within the project plan."
          title:
            required: true
            purpose: "The task in one sentence."
          goal:
            required: true
            purpose: "What becomes possible after this task that was not possible before."
          depends_on:
            required: true
            purpose: "Ids of earlier tasks under the same target — depending directly on a task under another target is forbidden."
          needs_contract:
            required: true
            purpose: "The contract version required — used instead of depending directly on a task under another target; omitted when the task needs none."
          acceptance:
            required: true
            purpose: "Human-readable acceptance criterion — what must actually work."
          verify:
            required: true
            purpose: "A runnable command that proves acceptance — without it a task is never done."
          touches:
            required: true
            purpose: "Paths this task touches, written relative to the code_path of the project part named by its phase target."
          status:
            required: true
            purpose: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
          blocker:
            required: true
            purpose: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise."
          log:
            required: true
            purpose: "Append-only list of dated entries carried with the task — absent until the task first moves."
      status_lives_here:
        required: true
        purpose: "That status is written on the task itself, so definition and state can never drift apart."
      history_lives_here_too:
        required: true
        purpose: "That there is no history file — how a task reached its state is in its own log, and a past entry is never rewritten."

  # <!--------------------------------------------------------------------------------- Task_States -->
  task_states:
    required: true
    purpose: "The vocabulary a task's status field may hold, and the protocols around it."
    fields:
      path:
        required: true
        purpose: "Where a state is written — the status field on each task."
      states:
        required: true
        purpose: "One entry per permitted status, each saying what it means — todo, claimed, blocked, done, cancelled, superseded."
      derived_ready:
        required: true
        purpose: "That ready is not a stored status — a task is ready when it is todo and all of its depends_on are done."
      done_gate:
        required: true
        purpose: "That without a passing verify run no task becomes done, even if the code is written."
      claim_protocol:
        required: true
        purpose: "That a task is set to claimed and the file written before work starts, so two agents never take the same task."
      status_only_in_development:
        required: true
        purpose: "That in development mode status, blocker, and log are the only fields an agent may change — the rest is the plan."

  # <!--------------------------------------------------------------------------------- Plans -->
  plans:
    required: true
    purpose: "The project plan. Its phases are not an independent technical staging invented by the planner: they are the task representation of the project phases already present in the generated Understanding. If the Understanding has ten project phases, this plan has exactly ten phases, in the same order. Each phase then contains its own implementation groups and tasks."
    fields:
      project_phases_source:
        required: true
        purpose: "The exact generated-Understanding section from which the project phases were read, so the plan's phase alignment is traceable."
      phase_alignment:
        required: true
        purpose: "The invariant that phases below have a one-to-one correspondence with the project phases in project_phases_source: the count and order are identical, and every phase preserves its source phase's identity, title, and target. The planner may create groups and tasks inside a phase, but may not create, remove, merge, split, reorder, rename, or retarget project phases."
      phases:
        required: true
        purpose: "The project-phase-aligned plan — phases at the top, groups inside a phase, and tasks inside a group; a task never sits directly in a phase, and nothing sits outside a phase. The phase entries exist in the same count and order as the source project phases; their groups and tasks stay empty until the human explicitly asks for tasks to be created."
        fields:
          "<phase>":
            required: true
            purpose: "The task representation of exactly one project phase from the generated Understanding. A later phase assumes the earlier project phases exist in their defined order."
            fields:
              id:
                required: true
                purpose: "P1, P2, ... — the identifier corresponding to the same project phase, numbered in the project's defined order."
              title:
                required: true
                purpose: "The project phase title, copied faithfully from the generated Understanding and never independently derived or renamed by the planner."
              target:
                required: true
                purpose: "The project phase target, copied faithfully from the generated Understanding; it must name a project part indexed by the Understanding. Every group and task in this phase belongs to this target."
              does:
                required: true
                purpose: "What the source project phase accomplishes, derived only from that phase's stated goal and carrying no requirement from another phase."
              groups:
                required: true
                purpose: "The implementation groups for this project phase — every task of the phase lives inside exactly one of them and serves the phase's target and goal."
                fields:
                  "<group>":
                    required: true
                    purpose: "One area of work inside the project phase — related tasks side by side."
                    fields:
                      id:
                        required: true
                        purpose: "P1-G1, P1-G2, ... — the project phase id plus a group number, unique within the plan."
                      title:
                        required: true
                        purpose: "The area in a few words."
                      does:
                        required: true
                        purpose: "What this group of tasks is doing, and what is true when all of them are done."
                      task_count:
                        required: true
                        purpose: "How many tasks the group holds — stated so the size is visible without counting."
                      tasks:
                        required: true
                        purpose: "The tasks of this group, each carrying exactly the fields of task_schema; a task is one atomic act, naming the one thing it creates or changes — create one file, add one method, implement one function, install one package, add one model, create one endpoint, add one migration, add one specific validation — never a broad or multi-purpose implementation goal. Anything larger is split into several tasks before it is written; many precise tasks are preferred over a few broad ones, however much the count grows, and one sitting finishes each."
