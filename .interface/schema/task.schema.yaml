schema:
  id: agent-interface-task
  version: "1.3"
  purpose: "The shape of task.yaml — the frame that defines a task, and the plans that hold the tasks"
  frame_and_surface: "task_schema and task_states are the frame — fixed by the human. Plans keep the established item → phase → group → task structure. Their phases are the project phases from the generated Understanding, placed under the item named by each phase's target; planning decomposes a requested phase only through its groups and tasks"
  authority: "Who may write each of these, and when, is decided in the State contract — .interface/config/state.yaml under content.state_authority — and in .interface/root.yaml under content.modes; this file gives the shape and invariants, not the permission"

structure:
  - task_schema
  - task_states
  - plans

sections:

  # <!--------------------------------------------------------------------------------- Task_Schema -->
  task_schema:
    required: true
    purpose: "The fields every task carries — the definition of a task, not a task itself."
    fields:
      rule:
        required: true
        purpose: "That every task carries exactly these fields — no more, no fewer."
      fields:
        required: true
        purpose: "One entry per field of a task, each saying what that field holds."
        fields:
          id:
            required: true
            purpose: "Identifier unique within the item — each item numbers its own tasks."
          title:
            required: true
            purpose: "The task in one sentence."
          goal:
            required: true
            purpose: "What becomes possible after this task that was not possible before."
          depends_on:
            required: true
            purpose: "Ids of tasks in the same item — depending on another item is forbidden."
          needs_contract:
            required: true
            purpose: "The contract version required — used instead of depending on another item's task; omitted when the task needs none."
          acceptance:
            required: true
            purpose: "Human-readable acceptance criterion — what must actually work."
          verify:
            required: true
            purpose: "A runnable command that proves acceptance — without it a task is never done."
          touches:
            required: true
            purpose: "Paths this task touches, written relative to the item's code_path."
          status:
            required: true
            purpose: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
          blocker:
            required: true
            purpose: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise."
          log:
            required: true
            purpose: "Append-only list of dated entries carried with the task — absent until the task first moves."
      status_lives_here:
        required: true
        purpose: "That status is written on the task itself, so definition and state can never drift apart."
      history_lives_here_too:
        required: true
        purpose: "That there is no history file — how a task reached its state is in its own log, and a past entry is never rewritten."

  # <!--------------------------------------------------------------------------------- Task_States -->
  task_states:
    required: true
    purpose: "The vocabulary a task's status field may hold, and the protocols around it."
    fields:
      path:
        required: true
        purpose: "Where a state is written — the status field on each task."
      states:
        required: true
        purpose: "One entry per permitted status, each saying what it means — todo, claimed, blocked, done, cancelled, superseded."
      derived_ready:
        required: true
        purpose: "That ready is not a stored status — a task is ready when it is todo and all of its depends_on are done."
      done_gate:
        required: true
        purpose: "That without a passing verify run no task becomes done, even if the code is written."
      claim_protocol:
        required: true
        purpose: "That a task is set to claimed and the file written before work starts, so two agents never take the same task."
      status_only_in_development:
        required: true
        purpose: "That in development mode status, blocker, and log are the only fields an agent may change — the rest is the plan."

  # <!--------------------------------------------------------------------------------- Plans -->
  plans:
    required: true
    purpose: "The plans — one per indexed item, each under its own key. Across all item plans, task phases correspond one for one to the project phases in the generated Understanding. A project phase appears only under the item named by its target. The planner never creates independent technical phases; it creates groups and tasks inside the requested project phase."
    fields:
      "<item>":
        required: true
        purpose: "One item's plan — the key is the item's name as indexed by the generated Understanding. It contains only project phases whose target resolves to this item."
        fields:
          phase_titles_lifecycle:
            required: true
            purpose: "Where this item's project-phase title list stands — empty, derived, or confirmed. empty: no project phase titles have been copied yet. derived: the Tasker copied them from the generated Understanding and the human has not confirmed the list. confirmed: the human accepted the list, and from then on only the human changes it."
          phase_titles_derived_from:
            required: true
            purpose: "The exact generated-Understanding section from which the project phase ids, titles, order, and targets were read. It reads 'not derived yet' while the lifecycle is empty."
          phase_titles:
            required: true
            purpose: "Quick lookup from project phase id to title for the phases whose target is this item. The ids, titles, and project order come from the generated Understanding. Technical implementation areas never become entries here."
          phases:
            required: true
            purpose: "This item's plan — project phases at the top, groups inside a phase, and tasks inside a group. Only a project phase requested by the human is populated; no independent technical phase is created."
            fields:
              "<phase>":
                required: true
                purpose: "One project phase from the generated Understanding whose target is this item. The Tasker writes planning work only into the matching requested phase."
                fields:
                  id:
                    required: true
                    purpose: "The project phase id — P1, P2, ... — preserved from the generated Understanding and unique across the project."
                  title:
                    required: true
                    purpose: "The project phase title, copied faithfully from the generated Understanding."
                  does:
                    required: true
                    purpose: "What the project phase accomplishes, derived only from that phase's stated goal in the generated Understanding."
                  groups:
                    required: true
                    purpose: "The technical decomposition of this project phase. Environment, configuration, database, models, migrations, routes, or any other implementation area belongs here rather than becoming another phase."
                    fields:
                      "<group>":
                        required: true
                        purpose: "One area of work inside the project phase — related tasks side by side."
                        fields:
                          id:
                            required: true
                            purpose: "P1-G1, P1-G2, ... — the project phase id plus a group number, unique within the item."
                          title:
                            required: true
                            purpose: "The area in a few words."
                          does:
                            required: true
                            purpose: "What this group of tasks is doing, and what is true when all of them are done."
                          task_count:
                            required: true
                            purpose: "How many tasks the group holds — stated so the size is visible without counting."
                          tasks:
                            required: true
                            purpose: "The tasks of this group, each carrying exactly the fields of task_schema; a task is one atomic act, naming the one thing it creates or changes — create one file, add one method, implement one function, install one package, add one model, create one endpoint, add one migration, add one specific validation — never a broad or multi-purpose implementation goal. Anything larger is split into several tasks before it is written; many precise tasks are preferred over a few broad ones, however much the count grows, and one sitting finishes each."
