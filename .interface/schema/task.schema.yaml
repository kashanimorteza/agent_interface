schema:
  id: agent-interface-task
  version: "2.0"
  purpose: "The shape of task.yaml — the fixed task frame and the single project plan whose phases mirror the project phases in the generated Understanding"
  frame_and_surface: "task_schema and task_states are the frame fixed by the human. plan is the working surface: its phases correspond one for one to definition.yaml under content.phases, and planning decomposes each phase only through groups and their tasks"
  authority: "Who may write each section, and when, is decided by the live State contract in .interface/config/state.yaml and the mode permissions in .interface/root.yaml; this file defines shape and invariants, not write permission"

structure:
  - task_schema
  - task_states
  - plan

sections:

  # <!--------------------------------------------------------------------------------- Task_Schema -->
  task_schema:
    required: true
    purpose: "The fields every task carries — the definition of a task, not a task itself."
    fields:
      rule:
        required: true
        purpose: "That every task carries exactly these fields — no more, no fewer."
      fields:
        required: true
        purpose: "One entry per field of a task, each saying what that field holds."
        fields:
          id:
            required: true
            purpose: "Identifier unique within the project plan."
          title:
            required: true
            purpose: "The task in one sentence."
          goal:
            required: true
            purpose: "What becomes possible after this task that was not possible before."
          depends_on:
            required: true
            purpose: "Ids of earlier tasks under the same target — depending directly on a task under another target is forbidden."
          needs_contract:
            required: true
            purpose: "The contract version required — used instead of depending directly on a task under another target; omitted when the task needs none."
          acceptance:
            required: true
            purpose: "Human-readable acceptance criterion — what must actually work."
          verify:
            required: true
            purpose: "A runnable command that proves acceptance — without it a task is never done."
          touches:
            required: true
            purpose: "Paths this task touches, written relative to the code_path of the project part named by the parent phase's target."
          status:
            required: true
            purpose: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
          blocker:
            required: true
            purpose: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise."
          log:
            required: true
            purpose: "Append-only list of dated entries carried with the task — absent until the task first moves."
      status_lives_here:
        required: true
        purpose: "That status is written on the task itself, so definition and state can never drift apart."
      history_lives_here_too:
        required: true
        purpose: "That there is no history file — how a task reached its state is in its own log, and a past entry is never rewritten."

  # <!--------------------------------------------------------------------------------- Task_States -->
  task_states:
    required: true
    purpose: "The vocabulary a task's status field may hold, and the protocols around it."
    fields:
      path:
        required: true
        purpose: "Where a state is written — the status field on each task."
      states:
        required: true
        purpose: "One entry per permitted status, each saying what it means — todo, claimed, blocked, done, cancelled, superseded."
      derived_ready:
        required: true
        purpose: "That ready is not a stored status — a task is ready when it is todo and all of its depends_on are done."
      done_gate:
        required: true
        purpose: "That without a passing verify run no task becomes done, even if the code is written."
      claim_protocol:
        required: true
        purpose: "That a task is set to claimed and the file written before work starts, so two agents never take the same task."
      status_only_in_development:
        required: true
        purpose: "That in development mode status, blocker, and log are the only fields an agent may change — the rest is the plan."

  # <!--------------------------------------------------------------------------------- Plan -->
  plan:
    required: true
    purpose: "The single project plan. Its phases are the task representation of the project phases in definition.yaml under content.phases, not an independent technical staging. The phase count and order are identical to the Understanding, and each phase preserves its source id, title, target, and goal. Technical decomposition happens only through groups inside those phases."
    fields:
      phases:
        required: true
        purpose: "The project phases in their defined order. If the Understanding has one phase, the plan has one phase; if it has ten, the plan has ten. Planning may not create, remove, merge, split, reorder, rename, or retarget them."
        fields:
          "<phase>":
            required: true
            purpose: "Exactly one project phase from definition.yaml under content.phases, carrying its identity and containing only the groups and tasks that deliver its goal."
            fields:
              id:
                required: true
                purpose: "The source project phase id — P1, P2, ... — preserved in the project's defined order."
              title:
                required: true
                purpose: "The source project phase title, copied faithfully from the generated Understanding."
              target:
                required: true
                purpose: "The source project phase target, copied faithfully from the generated Understanding; it names the project part whose configuration governs every group and task in this phase."
              goal:
                required: true
                purpose: "The source project phase goal, copied faithfully from the generated Understanding."
              groups:
                required: true
                purpose: "The only technical decomposition level inside the project phase. Environment, configuration, models, migrations, routes, or any other implementation area are groups here, never additional phases."
                fields:
                  "<group>":
                    required: true
                    purpose: "One coherent area of work inside the project phase; every task in the phase belongs to exactly one group."
                    fields:
                      id:
                        required: true
                        purpose: "The parent phase id plus a group number — P1-G1, P1-G2, ... — unique within the project plan."
                      title:
                        required: true
                        purpose: "The implementation area in a few words."
                      goal:
                        required: true
                        purpose: "What becomes true when every task in this group is done, within the parent phase's goal and target."
                      task_count:
                        required: true
                        purpose: "How many tasks the group holds — stated so the size is visible without counting."
                      tasks:
                        required: true
                        purpose: "The tasks of this group, each carrying exactly the fields of task_schema. A task is one atomic act naming the one thing it creates or changes; anything broader is split into multiple tasks within the appropriate group."
