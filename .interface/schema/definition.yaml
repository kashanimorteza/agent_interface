schema:
  id: agent-interface-definition
  version: "5.0"
  purpose: "The shape of definition.yaml — the project's identity, intended outcomes, and ordered project phases, without technical composition or deployment concerns"
  principles: ".interface/principles/definition.md"
  layering: "This file defines shape only. The mandatory rules of this layer live in its principles document and are not restated here."

structure:
  - identity
  - goals
  - phases

sections:

  # <!--------------------------------------------------------------------------------- Identity -->
  identity:
    required: true
    purpose: "Who the product is — set by the human, never inferred."
    fields:
      name:
        required: true
        purpose: "The product's human-readable name."
      description:
        required: true
        purpose: "The product description stated by the human in project.md, copied faithfully without reinterpretation."

  # <!--------------------------------------------------------------------------------- Goals -->
  goals:
    required: true
    purpose: "The independent product-level outcomes the project is intended to achieve — one outcome per list entry, copied faithfully from project.md. Goals do not define, group, or reference project phases."

  # <!--------------------------------------------------------------------------------- Phases -->
  phases:
    required: true
    purpose: "The authoritative ordered project workflow copied from project.md. Phases are the primary units of planning, development, review, and progress. Their count is unrestricted, and any number of phases may target the same technical item."
    fields:
      "<phase>":
        required: true
        purpose: "One project phase — a list entry, kept in the same order as project.md."
        fields:
          id:
            required: true
            purpose: "P1, P2, ... — derived mechanically as P plus the number in the project's Phase heading and unique across the project."
          title:
            required: true
            purpose: "The phase title stated by the project, copied faithfully."
          order:
            required: true
            purpose: "The phase's one-based position in project.md."
          target:
            required: true
            purpose: "The technical item named by the human for this phase. It resolves the applicable item configuration, Policy, interfaces, verification context, and code boundary."
          goal:
            required: true
            purpose: "What the project states this phase must accomplish, copied faithfully."
