schema:
  id: agent-interface-state
  version: "3.0"
  purpose: "The State contract — the shape of state.yaml: the project-wide state, the State Authority that governs it, and the transition rules, in one file"
  scope_note: "No definition, no rule, and no task status lives here — a task's status travels with the task, in task.yaml"
  authority: "state.yaml is the source of truth for the State. Its own content.state_authority section is the live authority — every field, its owner, the allowed transitions, and which Skill may perform each. This schema defines the shape of that section and the default seeded into every newly created state.yaml; once the file exists, the live copy governs and this default is not consulted at runtime. root.yaml references the State contract and does not own any of it"
  defaults:
    rule: "A section carrying `default` is always written into state.yaml when the file is created — the default is the seed, written verbatim under transition S0. No newly generated state.yaml exists without it; there is no exception."
    note: "While no state.yaml exists there is no live authority, so the default state_authority below is what authorizes its own seeding — transition S0 is defined inside it."

structure:
  - state_authority
  - active
  - blockers
  - open_questions

sections:

  # <!--------------------------------------------------------------------------------- State_Authority -->
  state_authority:
    required: true
    purpose: "The live State Authority — who may write each field of this file, on which transition, and which Skill may perform each. Read before anything below is written. Seeded verbatim from the default at creation; after the seed it is the human's alone, and a regeneration carries it through untouched."
    extension_note: "Extensible without redesigning the format: each field entry carries its own tier and writable_by, so a new state field gets its own authority, and a new skill is authorized by adding it to the lists that concern it. The extension itself is the human's edit."
    default:
      rule: "This section is the single source of truth for the runtime state, and it is part of the State contract itself. It names every field of state.yaml, who may write each one, which transitions exist, and which Skill may perform each. Where any other file — root.yaml, a schema, a config policy, a SKILL.md — appears to say something different, this section governs; the other file is wrong and is corrected, not worked around"
      principle: "An agent records a decision the human has already made, and never makes one. Invoking a Skill is the human's instruction — the Skill writes that instruction into the state, and nothing beyond it"
      scope: "This file — content.active, content.blockers, content.open_questions, and content.state_authority itself. The other config files keep their ownership in their own policy sections; nothing here widens it"
      seeded_from: "The default in .interface/schema/state.schema.yaml, written verbatim when state.yaml is created — transition S0. While no state.yaml exists there is no live authority, so that default is what authorizes its own creation; once the file exists, this live copy governs and the schema default is not consulted at runtime"
      extension_rule: "Extensible by the human alone. A new entry under fields gives a new state field its own authority; adding a skill to a writable_by or performed_by list authorizes that skill without redesigning the format; a new transition is a new entry under transitions. An agent that needs an extension raises it as an open question, never writes it"

      tiers:
        agent_writable: "Written by a named Skill, and only as part of a transition listed under transitions below"
        human_only: "Never written by an agent — in any mode, on any invocation, however convenient. The human edits it directly"
        derived: "Not stored at all — computed from what is stored, and never written anywhere"

      fields:

        state_authority:
          tier: "human_only"
          holds: "This section — the live State Authority"
          writable_by:
            - "my-interface-interpreter — only under transition S0, seeding the default from schema/state.schema.yaml because state.yaml does not yet exist"
          constraint: "After the seed it is the human's alone. A regeneration carries it through untouched, no Skill edits, extends, or narrows it, and a change it needs is an open question in this file — never a quiet rewrite"
          human_may_set: true

        active.mode:
          tier: "agent_writable"
          holds: "One of the modes defined in .interface/root.yaml under content.modes, or 'not set' when no Skill has been invoked yet"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — only under transition S0, when state.yaml does not yet exist"
          constraint: "A Skill writes only the mode it owns — the tasker writes planning and nothing else, the developer development, the reviewer review. The write is authorized by the human's invocation of that Skill and by nothing else, so no agent may enter a mode it was not invoked into, and no agent may set a mode for another Skill to find. my-interface-reset does not write this field: it deletes the file that holds it, under transition S5"
          human_may_set: true

        active.phase:
          tier: "agent_writable"
          holds: "One project phase id as definition.yaml indexes it under content.phases, or 'none'"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — only under transition S0, when state.yaml does not yet exist"
          constraint: "The phase comes from the invocation and must exist under definition.yaml content.phases. The invocation must name exactly one phase; a phase is never guessed, inferred from a target item, or carried over from a previous run. Under S0 the interpreter writes only 'none'."
          human_may_set: true

        active.target:
          tier: "derived"
          holds: "The target item of active.phase, resolved from the entry in definition.yaml content.phases whose id equals active.phase"
          writable_by: []
          constraint: "Never stored. The active target, item Policy, item configuration, contracts, verification context, and code_path are resolved fresh from active.phase whenever needed."

        active.mode_reason:
          tier: "agent_writable"
          holds: "Why this mode and this phase are the active ones — the invocation that set them, and after a run what that run concluded"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — only under transition S0, when state.yaml does not yet exist"
          constraint: "Written together with mode and phase, and rewritten at the end of a run under transition S4. It states what happened; it never argues for a mode the Skill was not invoked into"
          human_may_set: true

        active.set_by:
          tier: "agent_writable"
          holds: "Who wrote the active values — either 'the human' for a direct edit, or the Skill name followed by 'on the human's invocation'"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — only under transition S0, when state.yaml does not yet exist"
          constraint: "A Skill writes its own name and the invocation it acted on. It never writes 'the human' for a value the human did not type directly — the provenance of every state change stays readable. Under S0 the interpreter writes its own name, not the human's"
          human_may_set: true

        active.set_at:
          tier: "agent_writable"
          holds: "The date the active values were last written"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — only under transition S0, when state.yaml does not yet exist"
          constraint: "Written with every change to active, and never backdated"
          human_may_set: true

        blockers:
          tier: "agent_writable"
          holds: "What is actually missing, what each thing stops, and whose decision would release it"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — during a generation run, which is outside the modes"
          constraint: "Any mode, and a generation run, may raise a blocker, update what it stops, and remove it once the thing that was missing exists. A blocker whose decision_belongs_to is the human is removed only after the human has decided — recording that decision is transition S8"
          human_may_set: true

        open_questions.questions:
          tier: "agent_writable"
          holds: "The questions themselves — raised by an agent, addressed to the human"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter — during a generation run, which is outside the modes"
          constraint: "An agent raises a question and states why it matters. Raising is not answering"
          human_may_set: true

        open_questions.questions.answered_so_far:
          tier: "agent_writable"
          holds: "What of a question the human has already settled, and when"
          writable_by:
            - "my-interface-tasker"
            - "my-interface-developer"
            - "my-interface-reviewer"
            - "my-interface-interpreter"
          constraint: "Only the human's stated decision is recorded here, in the human's own terms and dated. An agent that writes anything here it was not told is inventing — see transition S8"
          human_may_set: true

        the_answer_to_an_open_question:
          tier: "human_only"
          holds: "The decision itself — what the value actually is"
          writable_by: []
          constraint: "No agent answers a question, closes one by supplying its answer, or writes a plausible value into a contract in place of one. A question is closed only after the human has answered it, and the answer that closes it is the human's"

        ready:
          tier: "derived"
          holds: "Whether a task may be started"
          writable_by: []
          constraint: "Never stored. A task is ready when its phase has a non-empty plan, every earlier project phase is complete, its status is todo, and every id in its depends_on is done — computed at the moment it is needed, and written nowhere"

      human_only_decisions:
        note: "These sit outside state.yaml but belong to the same ownership model — they are named here so that one section answers the whole question of who decides what"
        items:
          - "The answer to any open question in state.yaml"
          - "Freezing or versioning a contract — see the change_rule in the item files"
          - "Defining a project phase, its order, goal, or target — these come from project.md through the interpreter"
          - "The content of config/definition.yaml, outside a my-interface-interpreter run"
          - ".interface/project.md and .interface/schema/ — inputs to the pipeline, never written by an agent"
          - ".interface/root.yaml — the map of the interface, the modes, and the skill index"
          - "The State Authority itself, after its seed — this section, and its default in schema/state.schema.yaml"
          - "Asking for tasks to be created, and asking for the generated project state to be reset"

      transitions:

        - id: "S0"
          name: "generate the state file"
          from: "no state.yaml at all"
          to: "active.mode: 'not set', active.phase: 'none', and the live State Authority seeded"
          performed_by: "my-interface-interpreter"
          authorized_by: "The human's invocation of my-interface-interpreter, on a project that has no state.yaml yet — governed by the default authority in schema/state.schema.yaml, which authorizes its own seeding while no live state exists"
          requires:
            - "config/state.yaml does not exist. Where it does, a regeneration carries content.active and content.state_authority through untouched — a regeneration never resets the runtime state and never rewrites the live authority"
            - "content.state_authority is seeded verbatim from the default in schema/state.schema.yaml — a state.yaml without it is not created"
          writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at, content.state_authority — seeded from the schema default — and the blockers and questions the generation raised"
          refused_when: "state.yaml already exists. Rewriting an active a Skill or the human set, or a live authority, is outside this Skill's authority"

        - id: "S1"
          name: "enter planning"
          from: "any value of active.mode, 'not set' included"
          to: "active.mode: planning, active.phase: the phase id named by the invocation"
          performed_by: "my-interface-tasker"
          authorized_by: "The human's invocation of my-interface-tasker, which names exactly one project phase — for example /my-interface-tasker P2"
          requires:
            - "The named phase is indexed under content.phases in definition.yaml"
            - "The phase target resolves to an indexed architecture part and a mapped generated item configuration"
            - "The invocation names exactly one phase id"
          writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
          refused_when: "The invocation omits the phase, names more than one phase, names a phase the Understanding does not index, or names a mode other than planning. The Skill stops and tells the human; it does not adjust the state to fit"

        - id: "S2"
          name: "enter development"
          from: "any value of active.mode, 'not set' included"
          to: "active.mode: development, active.phase: the phase id named by the invocation"
          performed_by: "my-interface-developer"
          authorized_by: "The human's invocation of my-interface-developer, which names exactly one project phase"
          requires:
            - "The named phase is indexed under definition.yaml content.phases and has a matching plan under task.yaml content.plans"
            - "The phase plan holds at least one task — a phase with nothing to build is not entered"
            - "Every earlier project phase is complete: each has a non-empty plan, every task not cancelled or superseded is done, and none remains todo, claimed, or blocked"
            - "The phase target resolves to an indexed architecture part and a mapped generated item configuration"
          writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
          refused_when: "The invocation omits the phase, names more than one phase, the phase has no non-empty plan, an earlier phase is incomplete, its target cannot be resolved, or the invocation names a mode other than development"

        - id: "S3"
          name: "enter review"
          from: "any value of active.mode, 'not set' included"
          to: "active.mode: review, active.phase: the phase id named by the invocation"
          performed_by: "my-interface-reviewer"
          authorized_by: "The human's invocation of my-interface-reviewer, which names exactly one project phase"
          requires:
            - "The named phase is indexed under definition.yaml content.phases and has a matching non-empty plan under task.yaml content.plans"
            - "The phase target resolves to an indexed architecture part and a mapped generated item configuration"
          writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
          refused_when: "The invocation omits the phase, names more than one phase, names an unplanned phase, its target cannot be resolved, or names a mode other than review"

        - id: "S4"
          name: "record the outcome of a run"
          from: "the mode the run was performed in"
          to: "the same mode and the same phase — only active.mode_reason and active.set_at change"
          performed_by: "my-interface-tasker, my-interface-developer, my-interface-reviewer — each for its own run"
          authorized_by: "Finishing the run the human invoked"
          requires:
            - "The run has finished, and what is recorded is what it actually did or was stopped by"
          writes: "active.mode_reason, active.set_at"
          refused_when: "The Skill did not perform the run"

        - id: "S5"
          name: "reset the generated project state"
          from: "any"
          to: "no mapped generated config files and no validated project code_path directories; state.yaml and its active values, blockers, questions, and live State Authority are deleted and reseeded from the schema default at the next S0"
          performed_by: "my-interface-reset"
          authorized_by: "The human invoking my-interface-reset by name; that invocation itself authorizes deletion of the exact currently mapped generated config files and validated code_path directories, with no second confirmation"
          requires:
            - "Before any deletion, the exact existing config-file targets are resolved fresh from the current Interface map and every code-directory target is resolved from a code_path in those current generated config files"
            - "Every config target is a mapped generated file, and every code-directory target is a non-empty relative path that resolves to a strict descendant of the repository root outside .interface/, .claude/, and .git/"
            - "No protected, human-managed, symlinked, unresolved, unsafe, or unmapped path is included"
          writes: "the mapped generated config files and validated project code_path directories, by deleting them; state.yaml is deleted with the rest of config/"
          refused_when: "The complete deletion set cannot be resolved and validated before deletion, or it includes a protected, human-managed, symlinked, unresolved, unsafe, or unmapped path"

        - id: "S6"
          name: "human override"
          from: "any"
          to: "any"
          performed_by: "the human, editing state.yaml directly"
          authorized_by: "The human, who needs no transition"
          requires: []
          writes: "any field of state.yaml — this section included"
          refused_when: "Never. An agent does not contest, revert, or correct a value the human wrote — where the human's value disagrees with an invocation, the Skill stops and asks"

        - id: "S7"
          name: "raise or release a blocker"
          from: "any mode, and a generation run outside the modes"
          to: "the same mode"
          performed_by: "my-interface-tasker, my-interface-developer, my-interface-reviewer, my-interface-interpreter"
          authorized_by: "The work itself — a blocker is what stopped it, and a generation run raises what the configuration cannot supply"
          requires:
            - "The blocker states what is missing, never a guess at its answer"
            - "A blocker is removed only once the thing that was missing exists in the configuration"
          writes: "content.blockers, and the blocker field of the task it stops"
          refused_when: "Removing a blocker whose decision_belongs_to is the human, before the human has decided"

        - id: "S8"
          name: "raise a question, or record the human's answer"
          from: "any mode, and a generation run outside the modes"
          to: "the same mode"
          performed_by: "my-interface-tasker, my-interface-developer, my-interface-reviewer, my-interface-interpreter"
          authorized_by: "A gap found while working, or an answer the human has stated"
          requires:
            - "Raising: the question is stated so it can be answered, and why_it_matters names what depends on it"
            - "Recording: the answer written into answered_so_far is the human's, dated, and in the human's own terms"
          writes: "content.open_questions.questions, and answered_so_far on an existing question"
          refused_when: "The answer came from the agent, from the code, or from what seems reasonable — that is an invention, and the question stays open"

      validation:
        note: "These must hold at all times. Any Skill may check them; my-interface-reviewer checks them as part of a review, and a failure is a blocker, not a repair"
        checks:
          - "active.mode holds a mode named under content.modes in .interface/root.yaml, or 'not set'"
          - "active.phase holds a phase id indexed under content.phases in definition.yaml, or 'none'"
          - "When active.phase is not 'none', its target resolves to an indexed architecture part and mapped item configuration; active.target is derived from that target and is never stored"
          - "active.set_by names either the human or a Skill listed as writable_by for the field it wrote"
          - "Every state change an agent made corresponds to exactly one transition above"
          - "A Skill's mode matches the mode it owns under content.modes in root.yaml — a Skill running in another Skill's mode is a fault, not a state to repair"
          - "Each plan key is a phase id from definition.yaml, and its id, title, order, target, and goal-derived meaning match that phase"
          - "No open question carries an answer that no human gave"
          - "content.state_authority was seeded verbatim from the schema default and has changed only by the human's hand since — a difference an agent made is a fault, not a state to repair"

  # <!--------------------------------------------------------------------------------- Active -->
  active:
    required: true
    purpose: "The one mode and one project phase currently in play. The human decides them by invoking the owning Skill with a phase id. The phase target and item context are derived rather than stored."
    fields:
      mode:
        required: true
        purpose: "The active working mode — one of the modes defined in root.yaml, and exactly one at a time; 'not set' before any Skill has been invoked."
      mode_reason:
        required: true
        purpose: "Why this mode is the active one — the invocation that set it, and, after a run, what that run concluded."
      phase:
        required: true
        purpose: "The project phase currently being worked on, or none when no phase is active. Only a phase id indexed under content.phases in definition.yaml."
      set_by:
        required: true
        purpose: "Who wrote these values — 'the human' for a direct edit, or the Skill name and the invocation it acted on. The provenance of a state change is always readable."
      set_at:
        required: false
        purpose: "The date the active values were last written — absent only while they have never been written."

  # <!--------------------------------------------------------------------------------- Blockers -->
  blockers:
    required: true
    purpose: "What is actually missing — one entry per blocker, each addressed by id from the tasks it stops. Raised and released under transition S7 in content.state_authority of the same file."
    fields:
      "<blocker>":
        required: true
        purpose: "One blocker — a list entry."
        fields:
          id:
            required: true
            purpose: "B1, B2, ... — the id a blocked task names in its blocker field."
          blocks:
            required: true
            purpose: "What cannot move because of this — the work this blocker stops."
          what_is_missing:
            required: true
            purpose: "The thing that does not exist — stated concretely, never as a guess at its answer."
          consequence:
            required: true
            purpose: "What stays unreachable while this is missing."
          decision_belongs_to:
            required: true
            purpose: "Who must resolve it — the human when it is a decision an agent may not make, or a named Skill when the work itself releases it."
          raised:
            required: true
            purpose: "The date the blocker was raised."

  # <!--------------------------------------------------------------------------------- Open_Questions -->
  open_questions:
    required: true
    purpose: "What the human still has to decide. An agent raises a question and records the human's answer, and never supplies one — transition S8 in content.state_authority of the same file."
    fields:
      note:
        required: true
        purpose: "That these are addressed to the human, and that an agent does not answer them."
      questions:
        required: true
        purpose: "The questions themselves — one entry per question."
        fields:
          "<question>":
            required: true
            purpose: "One open question — a list entry."
            fields:
              id:
                required: true
                purpose: "Q1, Q2, ... — the id this question is referred to by."
              question:
                required: true
                purpose: "The decision the human must make, stated so it can be answered."
              why_it_matters:
                required: true
                purpose: "What in the project depends on the answer — the goal, rule, or contract that cannot be satisfied without it."
              answered_so_far:
                required: false
                purpose: "What of this question the human has already settled, and when — recorded in the human's own terms, present only on a question that was partly answered."
              blocks:
                required: true
                purpose: "The id of the blocker this question would release, or nothing yet when it blocks none."
