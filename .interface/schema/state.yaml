schema:
  id: agent-interface-state
  version: "10.0"
  purpose: "The shape of the generated State configuration"

structure:
  - modes
  - active
  - blockers
  - open_questions

sections:

  # <!--------------------------------------------------------------------------------- Modes -->
  modes:
    required: true
    purpose: "The resolved Workflow modes represented by State."
    fields:
      initial:
        required: true
        purpose: "The mode used before any Workflow operation has been recorded."
      available:
        required: true
        purpose: "The available modes and their meanings."
        fields:
          "<mode>":
            required: true
            purpose: "One Workflow mode, keyed by its stable name."
            fields:
              purpose:
                required: true
                purpose: "What activity the mode represents."
              phase_specific:
                required: true
                purpose: "Whether entering the mode requires one active phase."
              repeatable:
                required: true
                purpose: "Whether the represented operation may be invoked again after an earlier run."

  # <!--------------------------------------------------------------------------------- Active -->
  active:
    required: true
    purpose: "The current or most recently entered Workflow position."
    fields:
      mode:
        required: true
        purpose: "One key from modes.available."
      phase:
        required: true
        nullable: true
        purpose: "The active phase identifier, or null when the mode is not acting on one phase."
      mode_reason:
        required: true
        purpose: "Why the active values were recorded and what operation they represent."
      set_by:
        required: true
        purpose: "The human or operation that recorded the active values."
      set_at:
        required: true
        nullable: true
        purpose: "When the active values were recorded, or null before the first update."

  # <!--------------------------------------------------------------------------------- Blockers -->
  blockers:
    required: true
    purpose: "The unresolved critical conditions currently preventing safe or valid continuation; empty when none exist."
    fields:
      "<blocker>":
        required: false
        purpose: "One critical Blocker, keyed by its identifier."
        fields:
          id:
            required: true
            purpose: "The stable Blocker identifier."
          blocks:
            required: true
            purpose: "The work that cannot continue."
          what_is_missing:
            required: true
            purpose: "The concrete unresolved condition."
          consequence:
            required: true
            purpose: "Why the blocked work cannot safely or validly continue."
          resolution_owner:
            required: true
            purpose: "The human, operation, or external condition capable of resolving the Blocker."
          raised_at:
            required: true
            purpose: "When the Blocker was raised."

  # <!--------------------------------------------------------------------------------- Open_Questions -->
  open_questions:
    required: true
    purpose: "The unresolved critical questions that require a human decision; empty when none exist."
    fields:
      "<question>":
        required: false
        purpose: "One Open Question, keyed by its identifier."
        fields:
          id:
            required: true
            purpose: "The stable question identifier."
          question:
            required: true
            purpose: "The decision the human is being asked to make."
          why_it_matters:
            required: true
            purpose: "What materially depends on the answer."
          blocks:
            required: false
            purpose: "The Blocker identifier released by the answer, omitted when the question blocks no current work."
          answered_so_far:
            required: false
            purpose: "Only the answer or partial answer already supplied by the human, together with its provenance."
