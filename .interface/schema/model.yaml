schema:
  id: agent-interface-model
  version: "2.0"
  purpose: "The shape of the generated independent Model package and shared logical Models"

structure:
  - implementation
  - models

sections:

  # <!--------------------------------------------------------------------------------- Implementation -->
  implementation:
    required: true
    purpose: "The resolved implementation boundary for the independent shared Model package."
    fields:
      code_path:
        required: true
        purpose: "The project-relative folder containing the Model package implementation."
      code_path_note:
        required: true
        purpose: "Explains what code_path is relative to."
      summary:
        required: true
        purpose: "A concise description of the Model package."
      verify_cwd:
        required: true
        purpose: "The resolved working directory and environment for Model verification commands."
      package:
        required: true
        purpose: "The package key owned by the Model layer in generated Development configuration."
      tech:
        required: true
        purpose: "The resolved language and modeling library owned by Model."
        fields:
          language:
            required: true
            purpose: "The resolved Model implementation language."
            fields:
              name:
                required: true
                purpose: "The language name."
              version:
                required: true
                purpose: "The concrete language version."
              environment:
                required: true
                purpose: "The resolved isolated environment and dependency-management tool."
                fields:
                  name:
                    required: true
                    purpose: "The environment tool name."
                  version:
                    required: true
                    purpose: "The concrete environment-tool version."
          modeling_library:
            required: true
            purpose: "The resolved library used to implement and validate Models."
            fields:
              name:
                required: true
                purpose: "The modeling-library name."
              version:
                required: true
                purpose: "The concrete modeling-library version."
              package:
                required: true
                purpose: "The ecosystem package providing the modeling library."
      public_interface:
        required: true
        purpose: "The documented import interface through which compatible consumers use shared Models."
        fields:
          kind:
            required: true
            purpose: "The interface mechanism, normally an import surface."
          entrypoint:
            required: true
            purpose: "The resolved public import entrypoint."
          exports:
            required: true
            purpose: "The public Model symbols exposed to consumers."
      boundaries:
        required: true
        purpose: "The resolved ownership boundary of the Model package."
        fields:
          owns:
            required: true
            purpose: "Responsibilities owned by Model."
          does_not_own:
            required: true
            purpose: "Responsibilities explicitly outside Model."

  # <!--------------------------------------------------------------------------------- Models -->
  models:
    required: true
    purpose: "The resolved collection of logical Models."
    fields:
      "<model>":
        required: true
        purpose: "One logical Model, keyed by its normalized lower_snake_case name."
        fields:
          purpose:
            required: true
            purpose: "What the Model represents."
          fields:
            required: true
            purpose: "The ordered, resolved fields of the Model."
            fields:
              "<field>":
                required: false
                purpose: "One logical field, keyed by its normalized lower_snake_case name."
                fields:
                  type:
                    required: true
                    purpose: "The field's resolved logical data type."
                  size:
                    required: false
                    purpose: "The resolved size or precision when applicable."
                  nullable:
                    required: true
                    purpose: "Whether the field may contain a null value."
                  default:
                    required: false
                    purpose: "The field's resolved default value, omitted when none applies."
                  auto_increment:
                    required: false
                    purpose: "Whether the field uses an incrementing generated value."
                  primary_key:
                    required: false
                    purpose: "Whether this field is the Model's primary key; omitted when false."
                  unique:
                    required: false
                    purpose: "Whether this field must be unique by itself; omitted when false."
                  credential:
                    required: false
                    purpose: "Whether the field contains credential material requiring protected storage and write-only API handling; omitted when false."
                  purpose:
                    required: false
                    purpose: "The field's logical meaning when its name and type are insufficient."
          relationships:
            required: false
            purpose: "The Model's logical relationships, omitted when none apply."
            fields:
              "<relationship>":
                required: false
                purpose: "One logical relationship."
                fields:
                  type:
                    required: true
                    purpose: "The relationship kind, such as belongs_to."
                  target:
                    required: true
                    purpose: "The related Model key."
                  field:
                    required: false
                    purpose: "The logical field that carries the relationship, when applicable."
                  role:
                    required: false
                    purpose: "The relationship's semantic role when qualification is needed."
          rules:
            required: false
            purpose: "Model-specific domain rules, omitted when none apply."
          initial_data:
            required: false
            purpose: "The ordered initial records for the Model, omitted when none apply."
            fields:
              "<record>":
                required: false
                purpose: "One initial Model record containing field values or generation instructions."
