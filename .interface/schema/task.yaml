schema:
  id: agent-interface-task
  version: "5.0"
  purpose: "The shape of the generated Task configuration"

structure:
  - task_schema
  - task_states
  - plans

sections:

  # <!--------------------------------------------------------------------------------- Task_Schema -->
  task_schema:
    required: true
    purpose: "The resolved field frame used by every Task."
    fields:
      rule:
        required: true
        purpose: "The structural rule governing which fields every Task carries."
      fields:
        required: true
        purpose: "The definitions of the fields carried by every Task."
        fields:
          id:
            required: true
            purpose: "The Task identifier, unique within its Plan and unambiguous across all Plans."
          title:
            required: true
            purpose: "A concise statement of the atomic action."
          description:
            required: true
            purpose: "A complete explanation of what must be done."
          reason:
            required: true
            purpose: "Why the Task is necessary."
          target:
            required: true
            purpose: "The Component in which the Task performs its work."
          area:
            required: true
            purpose: "The specific module, subsystem, or work area inside the target Component."
          execution_context:
            required: true
            purpose: "The resolved implementation context needed to execute the Task."
            fields:
              kind:
                required: true
                purpose: "The nature of the work, such as code, configuration, documentation, data, or command execution."
              language:
                required: true
                purpose: "The applicable programming or configuration language, or null when no language applies."
              technologies:
                required: true
                purpose: "The ordered technologies, frameworks, packages, protocols, or tools relevant to the Task; empty when none apply."
              instructions:
                required: true
                purpose: "Implementation guidance sufficient to perform this specific Task."
              inputs:
                required: true
                purpose: "The information, artifacts, interfaces, or completed results consumed by the Task; empty when none apply."
              expected_output:
                required: true
                purpose: "The concrete artifact or observable result the Task must produce."
          depends_on:
            required: true
            purpose: "The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent."
          constraints:
            required: true
            purpose: "Task-specific restrictions and invariants that the implementation must preserve; empty when none apply."
          acceptance:
            required: true
            purpose: "The observable criterion that determines whether the intended result is correct."
          verify:
            required: true
            purpose: "A runnable command or precise executable check that proves acceptance."
          touches:
            required: true
            purpose: "The explicit files, directories, or resources the Task is expected to inspect or modify."
          status:
            required: true
            purpose: "The current Task state, using the resolved Task-state vocabulary."
          blocker:
            required: true
            purpose: "The identifier of the critical blocking condition when the Task is blocked; absent otherwise."
          log:
            required: true
            purpose: "The append-only Task-local progress history; absent until the first recorded transition."
      status_lives_here:
        required: true
        purpose: "Declares that the current status is stored on each Task."
      history_lives_here_too:
        required: true
        purpose: "Declares that the history of an existing Task is stored in its Task-local log."

  # <!--------------------------------------------------------------------------------- Task_States -->
  task_states:
    required: true
    purpose: "The resolved Task-status vocabulary and derived readiness and completion conditions."
    fields:
      path:
        required: true
        purpose: "Where the current state is stored within a Task."
      states:
        required: true
        purpose: "The permitted Task states and the meaning of each state."
      derived_ready:
        required: true
        purpose: "The condition from which Task readiness is derived."
      phase_ready:
        required: true
        purpose: "The condition from which phase readiness is derived."
      phase_complete:
        required: true
        purpose: "The condition from which phase completion is derived."

  # <!--------------------------------------------------------------------------------- Plans -->
  plans:
    required: true
    purpose: "The ordered collection of phase implementation Plans."
    fields:
      "<phase>":
        required: true
        purpose: "One Plan keyed by its phase identifier."
        fields:
          id:
            required: true
            purpose: "The phase identifier represented by this Plan."
          title:
            required: true
            purpose: "The phase title represented by this Plan."
          order:
            required: true
            purpose: "The phase's one-based position in project order."
          target:
            required: true
            purpose: "The Component targeted by the phase."
          does:
            required: true
            purpose: "The intended implementation outcome of the phase."
          groups:
            required: true
            purpose: "The ordered Groups that decompose the Plan; empty before the phase is planned."
            fields:
              "<group>":
                required: true
                purpose: "One coherent area of related work."
                fields:
                  id:
                    required: true
                    purpose: "The Group identifier, unique across all Plans."
                  title:
                    required: true
                    purpose: "A concise name for the work area."
                  description:
                    required: true
                    purpose: "What belongs to the Group and why its Tasks are related."
                  target:
                    required: true
                    purpose: "The Component in which the Group performs its work."
                  area:
                    required: true
                    purpose: "The module, subsystem, or implementation area covered by the Group."
                  does:
                    required: true
                    purpose: "The result produced when every applicable Task in the Group is complete."
                  task_count:
                    required: true
                    purpose: "The number of Tasks currently contained in the Group."
                  tasks:
                    required: true
                    purpose: "The ordered Tasks in the Group, each conforming to task_schema."
