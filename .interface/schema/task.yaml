schema:
  id: "agent-interface-task"
  version: "8.0"
  purpose: "Operational Task file structure. Sections describe stored content; initial is the empty configuration template. Planning fills actual Plans, Groups, and Tasks using the Task Component."
initialization:
  source: "initial"
  purpose: "Create the initial Config by copying this complete template. No project facts or project interpretation are needed."
  defaults: "Every section and field declares a default. Fixed required objects expand their child defaults; empty collections stay empty."
  collections: "Keys enclosed in angle brackets describe future records. Do not create placeholder Plans, Groups, or Tasks during initialization."
  optional_fields: "Optional fields remain absent until applicable. A null default on an optional field means no value is recorded."
  drafts: "Empty strings and zero order values are unfilled record defaults. Before storing usable planning work, the owning operation supplies real identifiers, required descriptive content, and valid phase order."
  preservation: "Initialization does not overwrite an existing Config file or reset its operational data."
operational_scope:
  purpose: "This file records the current state of the project's work. It is an operational record, not a description of the project."
  stores: "Which work exists, what each activity must produce, what it depends on, where it stands, and what has happened to it."
  excludes: "Project concepts, resolved technical choices, technologies, languages, Component rules, and any explanation that the human project definition, the Principles, or the Preferences already state. A stored copy of those goes stale and competes with its source."
  resolution: "Anything derivable from those sources is resolved from them at the moment the work is implemented, never read back from this file."
  constraints: "A constraint is stored only when it is specific to the work itself and derivable from no other source. This limits what the file stores, never what an implementation must respect."
inheritance:
  purpose: "A Plan, its Groups, and their Tasks form one nested structure, and that nesting is the context of every record beneath it."
  context: "A Task's phase is the Plan that contains it and its Group is the Group that contains it. Neither is stored inside the Task; the nesting and the Task identifier carry them."
  placement: "Every piece of context this file holds is stored exactly once, at the highest level where it holds: the targeted Component in the Plan, the work area in the Group, and an activity-specific constraint in the Task."
  resolution: "A Group inherits the Plan's context and a Task inherits both. A lower level may add to inherited context or make it stricter; it never repeats it and never contradicts it. Reading a Task means reading it together with its Group and Plan."
  duplication: "The same statement never appears in more than one Task of a Plan. A statement written into several Tasks belongs to their common Group or Plan and is stored there instead."
structure_independence:
  purpose: "Stored records describe responsibilities, behaviour, and observable results, never the arrangement of the implementation."
  excluded: "No file, folder, path, module, package layout, class, function, symbol, or command is stored in a Plan, Group, or Task, and no record asserts that an artifact exists at a particular location."
  target_and_area: "target and area identify a Component and a responsibility inside it, not a directory."
  sources: "No record stores a list of sources to consult. The shared understanding is produced from the human project definition and the applicable Principles and Preferences, located through the Interface document, when an operation runs."
structure:
  - "task_count"
  - "plans"
sections:
  task_count:
    required: true
    default: 0
    purpose: "A non-negative integer equal to the total number of Tasks stored across all phase Plans, regardless of status. Sum the phase task_count values; use zero when no Tasks exist. Recalculate whenever Tasks are added or removed, including reconciliation and reset."
  plans:
    required: true
    default: {}
    purpose: "Phase Plans created by Planning, keyed by phase identifier; empty before any phase is planned."
    fields:
      "<phase>":
        required: false
        default: {}
        purpose: "One Plan keyed by its phase identifier. It carries the phase's identity and the Component targeted by the whole phase."
        fields:
          id:
            required: true
            default: ""
            purpose: "The phase identifier represented by this Plan."
          title:
            required: true
            default: ""
            purpose: "The phase title represented by this Plan."
          order:
            required: true
            default: 0
            purpose: "The phase's one-based position in project order."
          target:
            required: true
            default: ""
            purpose: "The Component targeted by the phase. Inherited by every Group and Task in this Plan and never repeated in them."
          does:
            required: true
            default: ""
            purpose: "The intended implementation outcome of the phase, in one statement."
          task_count:
            required: true
            default: 0
            purpose: "A non-negative integer equal to the number of Tasks stored across all Groups in this phase Plan, regardless of status. Sum the Group task_count values; use zero for an empty Plan. Recalculate whenever Tasks are added or removed."
          groups:
            required: true
            default: {}
            purpose: "The ordered mapping of Groups that decompose the Plan, keyed by Group identifier; empty before the phase is planned."
            fields:
              "<group>":
                required: false
                default: {}
                purpose: "One coherent area of related work, keyed by its id. It carries the work area shared by its Tasks and inherits the target from its Plan."
                fields:
                  id:
                    required: true
                    default: ""
                    purpose: "The Group identifier, unique across all Plans. It carries the identifier of the Plan that contains it."
                  title:
                    required: true
                    default: ""
                    purpose: "A concise name for the work area."
                  description:
                    required: true
                    default: ""
                    purpose: "What belongs to the Group and why its Tasks are related."
                  area:
                    required: true
                    default: ""
                    purpose: "The responsibility or subsystem inside the Plan's target Component covered by the Group, named by responsibility rather than by location. Inherited by every Task in this Group."
                  does:
                    required: true
                    default: ""
                    purpose: "The result produced when every applicable Task in the Group is complete."
                  task_count:
                    required: true
                    default: 0
                    purpose: "A non-negative integer equal to the number of Tasks currently contained in the Group, regardless of status, including cancelled and superseded Tasks while they remain stored. Recalculate whenever Tasks are added or removed."
                  tasks:
                    required: true
                    default: {}
                    purpose: "Tasks keyed by identifier. Every key equals its Task id. Dependencies, not mapping order, determine execution eligibility."
                    fields:
                      "<task>":
                        required: false
                        default: {}
                        purpose: "One Task: the activity that belongs to it alone, the result it must produce, how that result is proven, and its mutable progress."
                        fields:
                          id:
                            required: true
                            default: ""
                            purpose: "The Task identifier, unique across all Plans. It carries the identifiers of the Plan and Group that contain it, so the Task can be named unambiguously outside this file without storing its phase and Group again."
                          title:
                            required: true
                            default: ""
                            purpose: "A concise statement of the atomic action."
                          description:
                            required: true
                            default: ""
                            purpose: "A complete explanation of what must be done, expressed as responsibility and behaviour without naming files, paths, or code, and without restating rules that the Principles, Preferences, or project definition already state."
                          reason:
                            required: true
                            default: ""
                            purpose: "Why the Task is necessary."
                          kind:
                            required: true
                            default: ""
                            purpose: "The nature of the work, such as code, configuration, documentation, data, or command execution."
                          inputs:
                            required: true
                            default: []
                            purpose: "The information, interfaces, or completed results consumed by the Task, named by what they are rather than where they are stored; empty when none apply."
                          expected_result:
                            required: true
                            default: ""
                            purpose: "The concrete behaviour, capability, state, or observable result the Task must produce."
                          depends_on:
                            required: true
                            default: []
                            purpose: "The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent."
                          constraints:
                            required: true
                            default: []
                            purpose: "Restrictions and invariants specific to this Task alone and derivable from no other source, stated as observable boundaries; empty when none apply, which is the normal case. A restriction stated by the project definition, a Principle, or a Preference is resolved from its own source and is never copied here."
                          acceptance:
                            required: true
                            default: ""
                            purpose: "The observable criterion that determines whether the intended result is correct."
                          verify:
                            required: true
                            default: ""
                            purpose: "The condition that must be observed to prove acceptance, stated in terms of the interfaces and behaviour the result publishes. It names no command, tool, path, or code; the concrete executable check that satisfies it is constructed and run at implementation time and recorded in the log."
                          status:
                            required: true
                            default: "todo"
                            purpose: "The current Task progress value."
                            allowed:
                              - "todo"
                              - "claimed"
                              - "blocked"
                              - "done"
                              - "cancelled"
                              - "superseded"
                          blocker:
                            required: false
                            default: null
                            purpose: "The identifier of the critical blocking condition when the Task is blocked; absent otherwise."
                          log:
                            required: false
                            default: []
                            purpose: "The append-only Task-local progress history; absent until the first recorded transition. It records meaningful transitions and, for a completed Task, the executable check used to satisfy verify and the outcome it produced."
definitions:
  task_status:
    todo: "Defined and not started."
    claimed: "Claimed by an executor before work begins."
    blocked: "Waiting on the referenced critical Blocker."
    done: "Acceptance proven by verification."
    cancelled: "No longer required, with the reason recorded in its log."
    superseded: "Replaced by another Task identified in its log."
initial:
  meta:
    path: ".interface/config/task.yaml"
    path_note: "Mutable Plans, Groups, Tasks, counts and progress."
  policy:
    agent_may_edit: true
    rule: "Apply the current Task Component and the active operation's ownership rules."
  read_order:
    - "task_count"
    - "plans"
  content_map:
    task_count: "Total number of stored Tasks."
    plans: "Current phase Plans and their Groups and Tasks."
  content:
    task_count: 0
    plans: {}
