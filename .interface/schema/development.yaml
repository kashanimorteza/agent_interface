schema:
  id: agent-interface-development
  version: "2.0"
  purpose: "The shape of development.yaml — the project's technical composition, cross-item integration, runtime, and deployment"
  principles: ".interface/principles/development.md"
  layering: "This file defines shape only. The mandatory rules of this layer live in its principles document and are not restated here."

structure:
  - summary
  - components
  - connections
  - runtime
  - deployment

sections:

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "The complete technical shape of the project in one sentence — which kinds of components participate, how they connect, and how the result runs."

  # <!--------------------------------------------------------------------------------- Components -->
  components:
    required: true
    purpose: "The technical items selected for this project — one entry per mapped component actually required by the project Understanding."
    fields:
      "<component>":
        required: true
        purpose: "One selected technical component, keyed by the item type through which map.yaml resolves its Schema and generated configuration."
        fields:
          configuration:
            required: true
            purpose: "The generated item-configuration file resolved through the current Interface map."
          responsibility:
            required: true
            purpose: "A one-sentence summary of the responsibility owned by this component's generated configuration."
          owns:
            required: true
            purpose: "A summary of the component's authoritative owned boundary."
          does_not_own:
            required: true
            purpose: "A summary of the component's authoritative excluded boundary."
          produces:
            required: false
            purpose: "A summary of the runtime interfaces provided by this component."
          consumes:
            required: false
            purpose: "A summary of the runtime interfaces used by this component."

  # <!--------------------------------------------------------------------------------- Connections -->
  connections:
    required: true
    purpose: "The directed integration graph between selected components — one entry per producer-to-consumer connection."
    fields:
      "<connection>":
        required: true
        purpose: "One directed connection, named for its producer and consumer."
        fields:
          from:
            required: true
            purpose: "The selected component providing the runtime interface."
          to:
            required: true
            purpose: "The selected component using the runtime interface."
          interface:
            required: true
            purpose: "The implemented runtime interface used by the consumer, as owned by the endpoint configurations."
          path:
            required: false
            purpose: "Where the consumer reads the interface when that location is known at configuration time; omitted when implementation produces it later."
          rule:
            required: true
            purpose: "The integration boundary both endpoint configurations require."

  # <!--------------------------------------------------------------------------------- Runtime -->
  runtime:
    required: true
    purpose: "How the project's selected components run together."
    fields:
      strategy:
        required: true
        purpose: "The execution strategy, such as native processes, containers, managed services, or a mixed topology."
      operating_system:
        required: false
        purpose: "The required operating system or platform constraint when one exists."
      orchestration:
        required: false
        purpose: "The mechanism coordinating component processes or containers when coordination is required."
      startup:
        required: true
        purpose: "The component startup order and the mechanism that brings the complete project online."
      configuration:
        required: true
        purpose: "How runtime configuration, environment-specific values, and secrets are supplied without placing secret values in Interface Config."

  # <!--------------------------------------------------------------------------------- Deployment -->
  deployment:
    required: true
    purpose: "Where and how the complete project is delivered."
    fields:
      platform:
        required: true
        purpose: "The deployment class, such as a local machine, server, container platform, cloud platform, or another supported destination."
      provider:
        required: false
        purpose: "The selected platform or cloud provider when the project requires one."
      service:
        required: false
        purpose: "The selected provider service or hosting product when applicable."
      region:
        required: false
        purpose: "The deployment region or location constraint when applicable."
      artifacts:
        required: true
        purpose: "The deployable artifacts and configuration needed to deliver the selected components."
      release:
        required: true
        purpose: "The mechanism that publishes, starts, updates, and verifies a release."
