schema:
  id: agent-interface-development
  version: "5.0"
  purpose: "The shape of a Development configuration: independent application layers, centralized runtime configuration, package boundaries and connections, and the Platform that runs and deploys them"

structure:
  - summary
  - layers
  - runtime_configuration
  - package_standard
  - packages
  - connections
  - cross_cutting
  - platform

sections:

  # <!--------------------------------------------------------------------------------- Summary -->
  summary:
    required: true
    purpose: "A concise description of the project's resolved layered composition."

  # <!--------------------------------------------------------------------------------- Layers -->
  layers:
    required: true
    purpose: "The application layers participating in the project. Every layer references exactly one valid top-level package owned by that layer."
    fields:
      "<layer>":
        required: false
        purpose: "One independent application layer."
        fields:
          name:
            required: true
            purpose: "The layer's human-readable name."
          configuration:
            required: true
            purpose: "A reference to the configuration owned by the layer."
          package:
            required: true
            purpose: "The key of the single top-level package representing this layer in packages. The referenced package must exist, have no parent, and identify this layer as its owner."
          responsibility:
            required: true
            purpose: "A concise description of the responsibility owned by the layer."
          provides:
            required: true
            purpose: "The declared interfaces the layer provides; empty when it provides none."
          consumes:
            required: true
            purpose: "The declared interfaces the layer consumes; empty when it consumes none."

  # <!--------------------------------------------------------------------------------- Runtime_Configuration -->
  runtime_configuration:
    required: true
    purpose: "The project-level settings boundary loaded and distributed by Platform without embedding user-changeable configuration inside packages."
    fields:
      files:
        required: true
        purpose: "The resolved public configuration and secret-value files."
        fields:
          public:
            required: true
            purpose: "The user-editable non-secret runtime configuration file."
            fields:
              path:
                required: true
                purpose: "The project-relative path of the public configuration file."
              location:
                required: true
                purpose: "The boundary relative to which the public configuration path is resolved."
              format:
                required: true
                purpose: "The public configuration format."
              committed:
                required: true
                purpose: "Whether the public configuration belongs in source control."
              user_editable:
                required: true
                purpose: "Whether a user may change runtime selections without editing package source."
              content:
                required: true
                purpose: "A concise description of the non-secret information stored in the public configuration file."
          secrets:
            required: true
            purpose: "The runtime source for secret values and private environment-specific settings."
            fields:
              path:
                required: true
                purpose: "The project-relative secret-file path."
              location:
                required: true
                purpose: "The boundary relative to which the secret-file path is resolved."
              format:
                required: true
                purpose: "The secret-file format."
              committed:
                required: true
                purpose: "Whether the secret-value file belongs in source control; this must resolve to false."
              user_editable:
                required: true
                purpose: "Whether an authorized user may supply or change secret values without editing package source."
              example_path:
                required: true
                purpose: "The committed non-secret example file documenting required variable names."
              content:
                required: true
                purpose: "A concise description of the secret and private information stored in the runtime source, without containing secret values."
      sections:
        required: true
        purpose: "One runtime configuration section for every participating application layer and Platform."
        fields:
          "<section>":
            required: true
            purpose: "The settings and declared bindings owned by one layer or Platform."
            fields:
              owner:
                required: true
                purpose: "The layer or Platform that owns this section."
              settings:
                required: true
                purpose: "User-changeable non-secret settings accepted by the owner; empty when none apply."
              bindings:
                required: true
                purpose: "Provider selections and interface references consumed by the owner; empty when none apply."
                fields:
                  "<binding>":
                    required: false
                    purpose: "One declared cross-layer runtime binding."
                    fields:
                      provider:
                        required: true
                        purpose: "The providing layer."
                      interface:
                        required: true
                        purpose: "The declared provider interface used by this binding."
                      selection:
                        required: false
                        purpose: "The selected provider resource, such as a Database Instance; omitted when the interface needs no selectable resource."
      precedence:
        required: true
        purpose: "The ordered runtime override precedence from highest to lowest priority."
      delivery:
        required: true
        purpose: "How Platform validates and supplies configuration to each boundary."
        fields:
          owner:
            required: true
            purpose: "The configuration-loading owner; this resolves to Platform."
          method:
            required: true
            purpose: "The resolved validation and injection mechanism."
          scope:
            required: true
            purpose: "The information each layer is permitted to receive."
      validation:
        required: true
        purpose: "When and how settings, bindings, and secret references are validated."
      override_boundary:
        required: true
        purpose: "The limit preventing runtime settings from redefining architecture, ownership, interfaces, or unsupported technologies."

  # <!--------------------------------------------------------------------------------- Package_Standard -->
  package_standard:
    required: true
    purpose: "The resolved common package conventions, derived from Development Preferences under the applicable Principles. Package-specific choices are recorded on the owning package."
    fields:
      naming:
        required: true
        purpose: "Resolved role-based naming, top-level prefix, nested naming and namespace, ecosystem adaptation, and collision handling."
        fields:
          basis:
            required: true
            purpose: "The architectural basis used to derive package names."
          top_level_prefix:
            required: true
            purpose: "The prefix applied to top-level package names, which may be empty."
          top_level_name:
            required: true
            purpose: "The naming template used for top-level packages."
          nested_name:
            required: true
            purpose: "The naming template used for nested packages."
          nested_namespace:
            required: true
            purpose: "The namespace in which nested package names must be unique."
          ecosystem_adaptation:
            required: true
            purpose: "How logical package names are adapted to the selected implementation ecosystem."
          collision_handling:
            required: true
            purpose: "How naming collisions are detected and resolved without losing the package's responsibility."
      distribution:
        required: true
        purpose: "Resolved visibility, publication, and local dependency conventions."
        fields:
          visibility:
            required: true
            purpose: "The default visibility of project packages."
          publication:
            required: true
            purpose: "Whether and how packages are published outside the project."
          local_dependency:
            required: true
            purpose: "How one package consumes another package inside the project."
      nested_packages:
        required: true
        purpose: "Resolved defaults for independent installation, dependency management, and runtime sharing of nested packages."
        fields:
          independently_installable:
            required: true
            purpose: "Whether nested packages are installed independently by default."
          dependency_management:
            required: true
            purpose: "Which boundary manages dependencies for nested packages."
          runtime:
            required: true
            purpose: "How nested packages obtain or share their runtime environment."
      documentation:
        required: true
        purpose: "Resolved README filename, location, sections, and handling of parent setup references."
        fields:
          filename:
            required: true
            purpose: "The documentation filename used at a package boundary."
          location:
            required: true
            purpose: "The documentation location relative to the package."
          sections:
            required: true
            purpose: "The ordered documentation topics required for each package."
          nested_setup:
            required: true
            purpose: "How a nested package refers to shared installation and startup instructions while documenting its own interface locally."

  # <!--------------------------------------------------------------------------------- Packages -->
  packages:
    required: true
    purpose: "The package map for the current application layers and their architectural sublayers at every depth. Every participating application layer references exactly one matching top-level package; every such package has a matching owner. Ordinary source files need no package entry. Keys are unique within this map; references must resolve and parent links must be acyclic."
    fields:
      "<package>":
        required: false
        purpose: "One package boundary; nested entries identify their parent without duplicating the parent's definition."
        fields:
          name:
            required: true
            purpose: "The resolved responsibility-based package name in its namespace."
          parent:
            required: true
            nullable: true
            purpose: "The parent package key, or null for a top-level package. Sibling names must be distinct; equal local names under different parents are qualified by their parent namespace."
          owner:
            required: true
            purpose: "A reference to the owning layer or Platform responsibility and its source configuration, including the sublayer when applicable."
          responsibility:
            required: true
            purpose: "The package's cohesive purpose and owned implementation boundary."
          kind:
            required: true
            purpose: "The resolved package form appropriate to its technology, such as an importable library, runnable application, or nested module."
          code_path:
            required: true
            purpose: "The project-relative root of this package's implementation, consistent with its owning Component's code path. Nested packages reside within the parent's implementation boundary."
          interfaces:
            required: true
            purpose: "The public interfaces provided by this package, empty when it has no consumers. References preserve the operations and meaning defined by the owning Component."
            fields:
              "<interface>":
                required: false
                purpose: "One public entry into this package."
                fields:
                  source:
                    required: true
                    purpose: "The owning definition of the interface and its capabilities."
                  kind:
                    required: true
                    purpose: "The resolved communication mechanism, such as import, network API, command, or user interface."
                  entrypoint:
                    required: false
                    purpose: "The public import name, command, or configuration-based endpoint when resolved. No secret values are stored here."
                  consumers:
                    required: true
                    purpose: "The package references or external consumer roles allowed to use this interface; nested interfaces are not implicitly public through their parent."
          dependencies:
            required: true
            purpose: "The other package interfaces and owning technology configurations this package consumes; empty when none apply. Third-party dependency versions remain defined by their owning Components."
          configuration:
            required: true
            purpose: "References to owned settings and how they are supplied or inherited from the parent; empty when no configuration is needed. No secret values are stored here."
          distribution:
            required: true
            purpose: "Resolved visibility, publication, installation method, and parent-managed or independent setup. Include the ecosystem distribution name when applicable; it may differ from the import name."
          readme:
            required: true
            purpose: "The package's implementation documentation, distinct from Interface documentation."
            fields:
              path:
                required: true
                purpose: "The project-relative path to the README at this package's root."
              sections:
                required: true
                purpose: "The resolved documentation topics for this package, including its public interface and usage examples."
              setup_reference:
                required: false
                purpose: "The parent README or shared installation and startup instructions when this package uses them."

  # <!--------------------------------------------------------------------------------- Connections -->
  connections:
    required: true
    purpose: "The ordered collection of directed connections between application layers; empty when no connection is required."
    fields:
      "<connection>":
        required: false
        purpose: "One connection from a consuming layer to a providing layer."
        fields:
          from:
            required: true
            purpose: "The layer consuming the interface."
          to:
            required: true
            purpose: "The layer providing the interface."
          interface:
            required: true
            purpose: "The declared provider interface used by the consumer."
          description:
            required: true
            purpose: "A concise explanation of the connection."

  # <!--------------------------------------------------------------------------------- Cross_Cutting -->
  cross_cutting:
    required: true
    purpose: "The resolved capabilities coordinated across application layers."
    fields:
      "<capability>":
        required: false
        purpose: "One cross-cutting capability."
        fields:
          enabled:
            required: true
            purpose: "Whether the capability is enabled."
          applies_to:
            required: true
            purpose: "The application layers affected by the capability; empty when disabled."
          settings:
            required: false
            purpose: "Resolved capability-specific settings, omitted when none apply."

  # <!--------------------------------------------------------------------------------- Platform -->
  platform:
    required: true
    purpose: "The composition layer that supplies the operating environment, coordinates the application layers, and deploys the complete project."
    fields:
      package:
        required: false
        purpose: "The package key for Platform implementation when it has its own implementation resources; omitted when Platform is only a description of composition."
      environment:
        required: true
        purpose: "The environment in which the complete project operates."
        fields:
          execution_model:
            required: true
            purpose: "The resolved model used to run the application layers."
          operating_system:
            required: false
            purpose: "The operating-system requirement when one exists."
      composition:
        required: true
        purpose: "How the application layers are connected and brought online together."
        fields:
          startup:
            required: true
            purpose: "The startup order and mechanism for the complete project."
          orchestration:
            required: false
            purpose: "The coordination mechanism when the project requires one."
          networking:
            required: true
            purpose: "How declared interfaces are made reachable between layers."
          configuration:
            required: true
            purpose: "How the top-level runtime_configuration is applied during composition without duplicating layer settings."
      deployment:
        required: true
        purpose: "How and where the complete project is delivered."
        fields:
          target:
            required: true
            purpose: "The resolved deployment destination."
          provider:
            required: false
            purpose: "The deployment provider when one is selected."
          location:
            required: false
            purpose: "The deployment location when one is required."
          artifacts:
            required: true
            purpose: "The artifacts and instructions required to deliver the complete project."
