# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/hook/profile.yaml"
  path_note: "The Profile layer of the Agent Hook Component."
  purpose: "Lifecycle events, matchers, handlers, failure policies, and Hook catalogs."
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-09-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; no Hook is activated from an undeclared runtime observation."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Register declared Hooks only after validating event, scope, handler, permission, and failure policy."
  selection: "A required deterministic control must be declared; an absent Hook is never inferred from a Rule."
  version_resolution: "Event and handler formats resolve against the selected runtime."
  matching: "Match Hooks by stable key, exact Event, matcher, and source."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty; no Hook handler is globally selected."
  options: "Supported handler types."
  settings: "Complete event and Hook catalogs, including explicit empty project declarations."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options:
    handler_types:
      command: {}
      http: {}
      prompt: {}
      agent: {}
      mcp_tool: {}
  settings:
    lifecycle_events:
      session_start: {}
      setup: {}
      user_prompt_submit: {}
      user_prompt_expansion: {}
      pre_tool_use: {}
      permission_request: {}
      permission_denied: {}
      post_tool_use: {}
      post_tool_use_failure: {}
      notification: {}
      subagent_start: {}
      subagent_stop: {}
      stop: {}
      teammate_idle: {}
      task_completed: {}
      config_change: {}
      worktree_create: {}
      worktree_remove: {}
      pre_compact: {}
      session_end: {}
      instructions_loaded: {}
    project_hooks:
      interface-boundary-guard:
        path: "resolved by Agent Sync from the selected Agent Native"
        event: "PreToolUse"
        matcher: "Read|Glob|Grep|Edit|Write|NotebookEdit|Bash|Skill"
        responsibility: "Block Agent Module reads outside the exact direct-Human Agent Sync prompt, block every non-Human attempt to invoke Agent Sync, and block direct Interface mutations outside the authorized Config boundary."
        failure_policy: "fail_closed"
        required: false
      agent-sync-read-grant:
        path: "resolved by Agent Sync from the selected Agent Native"
        event: "UserPromptExpansion"
        matcher: "my-interface-agent-sync"
        responsibility: "Grant Agent Module read access only to the prompt created by the Human's direct explicit Agent Sync entry-point invocation; a model, Agent Native, Agent Instance, Skill, coordinator, Hook, lifecycle routine, or automation can never create, inherit, or borrow this grant."
        failure_policy: "fail_closed"
        required: false
    user_hooks: {}
    managed_hooks: {}
    extension_hooks: {}
    sdk_hooks: {}
    disabled_hooks: {}
    failure_defaults:
      security_and_integrity: "fail_closed"
      notification_only: "fail_open"
