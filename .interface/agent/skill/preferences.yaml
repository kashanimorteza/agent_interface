# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/skill/preferences.yaml
  path_note: The Preferences layer of the Agent Skill Component.
  purpose: Interface-owned Skill Contracts, optional prepared Skill files or directories, and prepared and installed provider Skill declarations. Native mappings are
    resolved by Agent Sync.
  standard: Agent Project Interface
  version: '3.0'
  updated: '2026-09-18'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; Skill execution and activation state are observed without writing here.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: 'Only the explicit Agent Native Skill reads these Preferences: in its sync modes it resolves portable Contracts and materializes self-contained native Constructed Skills; in its install mode
    it resolves prepared content and provider declarations and materializes Prepared and Installed Skills. Every other consumer uses the resulting Runtime artifacts.'
  selection: Use an undeclared optional Skill only when relevant, compatible, and within current authority.
  version_resolution: Runtime and extension Skills resolve from their active providers.
  matching: During explicit Agent Sync, match Interface-owned Skills by portable Contract. During explicit the install mode of the Agent Native Skill, match a prepared Skill file or directory by the declared
    Skill's exact stable key and match external Skills by stable key and provider declaration. Either operation resolves Native identifiers and mappings from the selected Agent Native.
  realization: 'Every declared Skill resolves to one Capability Realization Kind: a Skill with a matching prepared Markdown file or prepared directory is Prepared, a remaining Interface-owned Skill with
    a portable Contract is Constructed, and a Skill under an external provider declaration is Installed.'
  invocation_realization: Realize each declared Skill's invocation policy with the Native mechanism that permits exactly the invocation paths it declares. A Skill declaring human-or-declared-coordinator
    must remain invocable both by the Human and by a declared coordinator Skill through the Native's own Skill invocation mechanism; never realize it with a Native control that withholds coordinator invocation.
    A coordinator invokes a Child Skill only through that mechanism, so the Child Skill loads and executes its own native definition; reading a Child Skill's file and executing its workflow inline, or delegating
    it to a forked or subordinate agent that inherits the coordinator's context, is never a realization of invocation. When the Native offers no control that separates autonomous activation from coordinator
    invocation, realize the declared autonomous_invocation state as an explicit instruction inside the Skill's own native definition.
  personality: 'A core Skill may name the Personality it works with (personality: <key from personality Preferences>); Agent Sync carries that Personality''s definition into the native Skill. All are null
    until the Personality definitions are complete (Human decision, 2026-09-17).'
  loop_owner: Implement owns the Planning → Developing → Reviewing loop; Reviewing records Findings and invokes nothing. Decided 2026-09-17.



# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Selected coordinating implementation Skill.
  options: Selectable implementation coordinators.
  settings: Prepared Skill file and directory convention and the complete Skill map grouped by Capability Realization Kind, with Contracts for Interface-owned Skills and provider mappings for external Skills.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    implementation_skill: implement
  options:
    implementation_skills:
      implement:
        resource: skills.supporting.implement
  settings:
    skill_files:
      directory: .interface/agent/skill/files/
      naming: <declared-skill-stable-key>.md for a single-file Skill, or <declared-skill-stable-key>/ for a Skill whose complete artifact is a directory tree
      presence: optional per declared Skill
      present: Create the selected Runtime's native Skill directory and entrypoint, preserve the prepared content as authored - the single Markdown file's instructions, or every file of the prepared directory
        tree with its internal relative paths intact - and add or adapt only metadata required by that Runtime without changing meaning.
      absent: Realize the Skill from its portable Contract or provider declaration using the selected Agent Native's conventions; absence is never an error by itself.
      unmatched: A prepared file or directory that does not match exactly one declared Skill is reported and never installed by inference.
    skills:
      core_workflow:
        configure:
          name: configure
          native: {claude: {name: my-interface-configure}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/configure.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: human-or-declared-coordinator
          human_invocation: enabled
          coordinator_invocation: enabled for declared coordinators
          autonomous_invocation: disabled
          required: true
          personality: null
        planning:
          name: planning
          native: {claude: {name: my-interface-planning}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/planning.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: human-or-declared-coordinator
          human_invocation: enabled
          coordinator_invocation: enabled for declared coordinators
          autonomous_invocation: disabled
          required: true
          personality: null
        developing:
          name: developing
          native: {claude: {name: my-interface-developing}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/developing.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: human-or-declared-coordinator
          human_invocation: enabled
          coordinator_invocation: enabled for declared coordinators
          autonomous_invocation: disabled
          required: true
          personality: null
        reviewing:
          name: reviewing
          native: {claude: {name: my-interface-reviewer}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/reviewing.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: human-or-declared-coordinator
          human_invocation: enabled
          coordinator_invocation: enabled for declared coordinators
          autonomous_invocation: disabled
          required: true
          personality: null
        launch:
          name: launch
          native: {claude: {name: my-interface-launch}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/launch.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: human-or-declared-coordinator
          human_invocation: enabled
          coordinator_invocation: enabled for declared coordinators
          autonomous_invocation: disabled
          required: true
          personality: null
      supporting:
        implement:
          name: implement
          native: {claude: {name: my-interface-implement}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/implement.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: explicit-human
          required: true
          coordination:
            allowed_skills:
            - skills.core_workflow.configure
            - skills.core_workflow.planning
            - skills.core_workflow.developing
            - skills.core_workflow.reviewing
            - skills.core_workflow.launch
            scope: Configure once when no phase was selected or when a Finding names it; Planning, Developing, and Reviewing per selected phase, repeated while Review records Findings and progress continues;
              Launch when every enabled and ready phase is assured
            authority: delegated invocation only through the Native's own Skill invocation mechanism; each Skill retains ownership of its records and outputs
            moved_from: 'reviewing.coordination on 2026-09-17 (was: {allowed_skills: [skills.core_workflow.configure, skills.core_workflow.planning, skills.core_workflow.developing],
              authority: delegated invocation only; each Skill retains ownership of its records and outputs, scope: same selected phase and current reconciliation Finding; Configure may also reconcile project-wide
              Config or Environment prerequisites})'
        reset:
          name: reset
          native: {claude: {name: my-interface-reset}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/reset.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          invocation: explicit-human
          required: true
        agent-native:
          name: agent-native
          native: {claude: {name: my-interface-agent-native}}
          path: resolved by Agent Sync from the selected Agent Native
          contract: .interface/agent/skill/contracts/agent-native.md
          architecture_contract: Skill Contract and shared Agent Skill Principles
          modes:
            1: sync self
            2: sync component
            3: install (formerly the skill-installer Skill, merged 2026-09-17)
          invocation: direct-explicit-human-only
          model_invocation: disabled
          delegated_invocation: disabled
          automated_invocation: disabled
          required: true
      prepared: {}
      installed:
        pydantic:
          name: pydantic
          activation: implicit when relevant
          required: false
          native:
            claude:
              marketplace:
                source: github
                repository: pydantic/skills
              plugin: pydantic@pydantic-skills
    naming_note: "A Skill's portable name is its key; the Claude Code Skill directory name (the `my-interface-` prefix, and `reviewer` for `reviewing`) lives only under each Skill's native.claude.name (moved there 2026-09-18)."
    placement_note: "Where a declared Skill lives in the Native (project, user, managed, extension, runtime, built-in) is Agent Sync's decision from the Native's own layout; the former source-based categories (project_skills, user_skills, managed_skills, runtime_skills, extension_skills) were collapsed into `skills` on 2026-09-18 because they mirrored one Native's layout. An entry that must land in a particular place may say so in its own `native.<agent-native>` hint."
    disabled_skills: {}
    overrides: {}

