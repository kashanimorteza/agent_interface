        fastapi:
          name: "fastapi"
          path: ".claude/skills/fastapi/SKILL.md"
          architecture_contract: "Agent Skill Principle 12"
          activation: "implicit when relevant"
          required: false
        typer:
          name: "typer"
          path: ".claude/skills/typer/SKILL.md"
