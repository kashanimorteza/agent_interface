# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/skill/profile.yaml"
  path_note: "The Profile layer of the Agent Skill Component."
  purpose: "Interface-owned Skill Contracts and native mappings, plus contextual, built-in, user, managed, and extension provider Skill declarations."
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-09-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; Skill execution and activation state are observed without writing here."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Resolve every Interface-owned Skill's portable Contract and native implementation; resolve external Skills from their provider declaration; verify usability before invocation."
  selection: "Use an undeclared optional Skill only when relevant, compatible, and within current authority."
  version_resolution: "Runtime and extension Skills resolve from their active providers."
  matching: "Match Interface-owned Skills by stable key, portable Contract, and native name; match external Skills by stable key and provider declaration."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Selected coordinating implementation Skill."
  options: "Selectable implementation coordinators."
  settings: "Complete Skill map grouped by ownership, with Contracts for Interface-owned Skills and provider mappings for external Skills."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    implementation_skill: "implement"
  options:
    implementation_skills:
      implement:
        resource: "project_skills.supporting.implement"
  settings:
    project_skills:
      core_workflow:
        configure:
          name: "my-interface-configure"
          path: ".claude/skills/my-interface-configure/SKILL.md"
          contract: ".interface/agent/skill/contracts/configure.md"
          architecture_contract: "Agent Skill Principle 4"
          invocation: "human-or-declared-coordinator"
          required: true
        planning:
          name: "my-interface-planning"
          path: ".claude/skills/my-interface-planning/SKILL.md"
          contract: ".interface/agent/skill/contracts/planning.md"
          architecture_contract: "Agent Skill Principle 5"
          invocation: "human-or-declared-coordinator"
          required: true
        developing:
          name: "my-interface-developing"
          path: ".claude/skills/my-interface-developing/SKILL.md"
          contract: ".interface/agent/skill/contracts/developing.md"
          architecture_contract: "Agent Skill Principle 6"
          invocation: "human-or-declared-coordinator"
          required: true
        reviewing:
          name: "my-interface-reviewer"
          path: ".claude/skills/my-interface-reviewer/SKILL.md"
          contract: ".interface/agent/skill/contracts/reviewing.md"
          architecture_contract: "Agent Skill Principle 7"
          invocation: "human-or-declared-coordinator"
          required: true
        launch:
          name: "my-interface-launch"
          path: ".claude/skills/my-interface-launch/SKILL.md"
          contract: ".interface/agent/skill/contracts/launch.md"
          architecture_contract: "Agent Skill Principle 8"
          invocation: "human-or-declared-coordinator"
          required: true
      supporting:
        implement:
          name: "my-interface-implement"
          path: ".claude/skills/my-interface-implement/SKILL.md"
          contract: ".interface/agent/skill/contracts/implement.md"
          architecture_contract: "Agent Skill Principle 9"
          invocation: "explicit-human"
          required: true
        reset:
          name: "my-interface-reset"
          path: ".claude/skills/my-interface-reset/SKILL.md"
          contract: ".interface/agent/skill/contracts/reset.md"
          architecture_contract: "Agent Skill Principle 10"
          invocation: "explicit-human"
          required: true
        skill-installer:
          name: "my-interface-skill-installer"
          path: ".claude/skills/my-interface-skill-installer/SKILL.md"
