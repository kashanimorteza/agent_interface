# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/skill/profile.yaml"
  path_note: "The Profile layer of the Agent Skill Component."
  purpose: "Interface-owned Skill Contracts, optional prepared Skill files or directories, and prepared, installed, built-in, user, managed, and extension provider Skill declarations. Native mappings are resolved by Agent Sync."
  standard: "Agent Project Interface"
  version: "2.0"
  updated: "2026-09-17"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; Skill execution and activation state are observed without writing here."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Only the explicit Agent Native Skill reads this Profile: in its sync modes it resolves portable Contracts and materializes self-contained native Constructed Skills; in its install mode it resolves prepared content and provider declarations and materializes Prepared and Installed Skills. Every other consumer uses the resulting Runtime artifacts."
  selection: "Use an undeclared optional Skill only when relevant, compatible, and within current authority."
  version_resolution: "Runtime and extension Skills resolve from their active providers."
  matching: "During explicit Agent Sync, match Interface-owned Skills by portable Contract. During explicit the install mode of the Agent Native Skill, match a prepared Skill file or directory by the declared Skill's exact stable key and match external Skills by stable key and provider declaration. Either operation resolves Native identifiers and mappings from the selected Agent Native."
  realization: "Every declared Skill resolves to one Capability Realization Kind: a Skill with a matching prepared Markdown file or prepared directory is Prepared, a remaining Interface-owned Skill with a portable Contract is Constructed, and a Skill under an external provider declaration is Installed."
  invocation_realization: "Realize each declared Skill's invocation policy with the Native mechanism that permits exactly the invocation paths it declares. A Skill declaring human-or-declared-coordinator must remain invocable both by the Human and by a declared coordinator Skill through the Native's own Skill invocation mechanism; never realize it with a Native control that withholds coordinator invocation. A coordinator invokes a Child Skill only through that mechanism, so the Child Skill loads and executes its own native definition; reading a Child Skill's file and executing its workflow inline, or delegating it to a forked or subordinate agent that inherits the coordinator's context, is never a realization of invocation. When the Native offers no control that separates autonomous activation from coordinator invocation, realize the declared autonomous_invocation state as an explicit instruction inside the Skill's own native definition."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Selected coordinating implementation Skill."
  options: "Selectable implementation coordinators."
  settings: "Prepared Skill file and directory convention and the complete Skill map grouped by Capability Realization Kind, with Contracts for Interface-owned Skills and provider mappings for external Skills."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    implementation_skill: "implement"
  options:
    implementation_skills:
      implement:
        resource: "project_skills.supporting.implement"
  settings:
    skill_files:
      directory: ".interface/agent/skill/files/"
      naming: "<declared-skill-stable-key>.md for a single-file Skill, or <declared-skill-stable-key>/ for a Skill whose complete artifact is a directory tree"
      presence: "optional per declared Skill"
      present: "Create the selected Runtime's native Skill directory and entrypoint, preserve the prepared content as authored - the single Markdown file's instructions, or every file of the prepared directory tree with its internal relative paths intact - and add or adapt only metadata required by that Runtime without changing meaning."
      absent: "Realize the Skill from its portable Contract or provider declaration using the selected Agent Native's conventions; absence is never an error by itself."
      unmatched: "A prepared file or directory that does not match exactly one declared Skill is reported and never installed by inference."
    project_skills:
      core_workflow:
        configure:
          name: "my-interface-configure"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/configure.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
        planning:
          name: "my-interface-planning"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/planning.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
        developing:
          name: "my-interface-developing"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/developing.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
        reviewing:
          name: "my-interface-reviewer"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/reviewing.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
          coordination:
            allowed_skills:
              - "project_skills.core_workflow.configure"
              - "project_skills.core_workflow.planning"
              - "project_skills.core_workflow.developing"
            scope: "same selected phase and current reconciliation Finding; Configure may also reconcile project-wide Config or Environment prerequisites"
            authority: "delegated invocation only; each Skill retains ownership of its records and outputs"
        launch:
          name: "my-interface-launch"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/launch.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
      supporting:
        implement:
          name: "my-interface-implement"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/implement.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "explicit-human"
          required: true
        reset:
          name: "my-interface-reset"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/reset.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "explicit-human"
          required: true
        agent-native:
          name: "my-interface-agent-native"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/agent-native.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          modes: {1: "sync self", 2: "sync component", 3: "install (formerly the skill-installer Skill, merged 2026-09-17)"}
          invocation: "direct-explicit-human-only"
          model_invocation: "disabled"
          delegated_invocation: "disabled"
          automated_invocation: "disabled"
          required: true
      prepared: {}
      installed:
        pydantic:
          name: "pydantic"
          activation: "implicit when relevant"
          required: false
          native:
            claude:
              marketplace: {source: "github", repository: "pydantic/skills"}
              plugin: "pydantic@pydantic-skills"
    user_skills: {}
    managed_skills: {}
    runtime_skills: {}
    extension_skills: {}
    disabled_skills: {}
    overrides: {}
