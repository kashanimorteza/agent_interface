# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/skill/profile.yaml"
  path_note: "The Profile layer of the Agent Skill Component."
  purpose: "Interface-owned Skill Contracts, optional prepared Markdown Skill files, and contextual, built-in, user, managed, and extension provider Skill declarations. Native mappings are resolved by Agent Sync."
  standard: "Agent Project Interface"
  version: "1.3"
  updated: "2026-09-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; Skill execution and activation state are observed without writing here."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Only explicit Agent Sync reads this Profile to resolve portable Contracts and provider declarations, then materializes self-contained native Skills for every other consumer."
  selection: "Use an undeclared optional Skill only when relevant, compatible, and within current authority."
  version_resolution: "Runtime and extension Skills resolve from their active providers."
  matching: "During explicit Agent Sync, match a prepared Markdown Skill file by the declared Skill's exact stable key, match Interface-owned Skills by portable Contract, and match external Skills by stable key and provider declaration; then resolve Native identifiers and mappings from the selected Agent Native."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Selected coordinating implementation Skill."
  options: "Selectable implementation coordinators."
  settings: "Prepared Markdown Skill-file convention and the complete Skill map grouped by ownership, with Contracts for Interface-owned Skills and provider mappings for external Skills."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    implementation_skill: "implement"
  options:
    implementation_skills:
      implement:
        resource: "project_skills.supporting.implement"
  settings:
    skill_files:
      directory: ".interface/agent/skill/files/"
      naming: "<declared-skill-stable-key>.md"
      presence: "optional per declared Skill"
      present: "Create the selected Runtime's native Skill directory and entrypoint, preserve the prepared Markdown instructions as their content, and add or adapt only metadata required by that Runtime without changing meaning."
      absent: "Realize the Skill from its portable Contract or provider declaration using the selected Agent Native's conventions; absence is never an error by itself."
      unmatched: "A Markdown file that does not match exactly one declared Skill is reported and never installed by inference."
    project_skills:
      core_workflow:
        configure:
          name: "my-interface-configure"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/configure.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          required: true
        planning:
          name: "my-interface-planning"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/planning.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          required: true
        developing:
          name: "my-interface-developing"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/developing.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          required: true
        reviewing:
          name: "my-interface-reviewer"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/reviewing.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          human_invocation: "enabled"
          coordinator_invocation: "enabled for declared coordinators"
          autonomous_invocation: "disabled"
          required: true
          coordination:
            allowed_skills:
              - "project_skills.core_workflow.configure"
              - "project_skills.core_workflow.planning"
              - "project_skills.core_workflow.developing"
            scope: "same selected phase and current reconciliation Finding; Configure may also reconcile project-wide Config or Environment prerequisites"
            authority: "delegated invocation only; each Skill retains ownership of its records and outputs"
        launch:
          name: "my-interface-launch"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/launch.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "human-or-declared-coordinator"
          required: true
      supporting:
        implement:
          name: "my-interface-implement"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/implement.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "explicit-human"
          required: true
        reset:
          name: "my-interface-reset"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/reset.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "explicit-human"
          required: true
        skill-installer:
          name: "my-interface-skill-installer"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/skill-installer.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "explicit-human"
          required: true
        agent-sync:
          name: "my-interface-agent-sync"
          path: "resolved by Agent Sync from the selected Agent Native"
          contract: ".interface/agent/skill/contracts/agent-sync.md"
          architecture_contract: "Skill Contract and shared Agent Skill Principles"
          invocation: "direct-explicit-human-only"
          model_invocation: "disabled"
          delegated_invocation: "disabled"
          automated_invocation: "disabled"
          required: true
      installed:
        pydantic:
          name: "pydantic"
          activation: "implicit when relevant"
          required: false
          native:
            claude:
              marketplace: {source: "github", repository: "pydantic/skills"}
              plugin: "pydantic@pydantic-skills"
        fastapi:
          name: "fastapi"
          activation: "implicit when relevant"
          required: false
          native:
            claude:
              marketplace: {source: "github", repository: "anthropics/skills"}
              plugin: "example-skills@anthropic-agent-skills"
        typer:
          name: "typer"
          activation: "implicit when relevant"
          required: false
          native:
            claude:
              marketplace: {source: "github", repository: "anthropics/skills"}
              plugin: "example-skills@anthropic-agent-skills"
        library-skills:
          name: "library-skills"
          activation: "implicit when package capability discovery is relevant"
          required: false
          native:
            claude:
              package_tool: "uvx library-skills"
    user_skills: {}
    managed_skills: {}
    runtime_skills: {}
    extension_skills: {}
    disabled_skills: {}
    overrides: {}
