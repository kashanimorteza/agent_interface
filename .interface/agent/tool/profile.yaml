# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/tool/profile.yaml"
  path_note: "The Profile layer of the Agent Tool Component."
  purpose: "Built-in, project, integration, extension, user, and managed Tool catalogs and availability expectations."
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-09-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; observed runtime Tools are not automatically made project requirements."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Use only Tools available to the active role and permitted for the requested action."
  selection: "An undeclared runtime Tool is optional; a missing required Tool is reported."
  version_resolution: "Runtime-provided Tool contracts resolve from the active runtime."
  matching: "Match portable Tool capability identities; Agent Sync resolves their Native names and providers."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty; Tools are selected by the active capability contract."
  options: "Empty; Tools are resources rather than alternatives."
  settings: "Complete Tool catalogs by provider and source."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings:
    runtime_tools:
      shell_execute: {required: false}
      file_read: {required: true}
      file_discover: {required: true}
      text_search: {required: true}
      file_edit: {required: true}
      file_write: {required: true}
      notebook_edit: {required: false}
      agent_delegate: {required: true}
      task_record: {required: false}
      web_fetch: {required: false}
      web_search: {required: false}
    project_tools: {}
    integration_tools: {}
    extension_tools: {}
    user_tools: {}
    managed_tools: {}
    disabled_tools: {}
    availability_checks: {}
