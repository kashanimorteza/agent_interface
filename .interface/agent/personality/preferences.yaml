# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/personality/preferences.yaml
  path_note: The Preferences layer of the Agent Personality Component.
  purpose: Declared personalities, their definition files, the Actions each performs, and the models each prefers in priority order.
  standard: Agent Project Interface
  version: '1.0'
  updated: '2026-09-18'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; observed runtime behavior is never written back as a personality choice.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: Only explicit Agent Sync reads these Preferences and its definition files; every other consumer uses the synchronized Runtime realization.
  selection: Use a declared Personality only within the active Role, Permission, and request.
  version_resolution: Model identities resolve against the selected Agent Runtime; an unavailable model falls through to the next declared one.
  matching: Match Personalities by stable key and definition file; Agent Sync resolves their Native realization.
  definition_structure: Every definition file follows .interface/foundation/schema/personality.md. Decided 2026-09-17.



# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: The default Personality when none is requested.
  options: Selectable default Personalities.
  settings: 'Complete Personality catalog: definition file, Actions, and models in priority order.'

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    default_personality: null
  options:
    default_personalities: {}
  settings:
    definitions_directory: definitions/
    personalities:
      developer:
        definition: definitions/developer.md
        actions:
        - develop
        models: []
        required: false
      planner:
        definition: definitions/planner.md
        actions:
        - plan
        models: []
        required: false
      analyst:
        definition: definitions/analyst.md
        actions:
        - analyze
        models: []
        required: false
      reviewer:
        definition: definitions/reviewer.md
        actions:
        - review
        models: []
        required: false
      architect:
        definition: definitions/architect.md
        actions:
        - structure
        models: []
        required: false
    placement_note: "Where a declared Personality lives in the Native (project, user, managed, extension, runtime, built-in) is Agent Sync's decision from the Native's own layout; the former source-based categories (personalities, user_personalities, managed_personalities, extension_personalities) were collapsed into `personalities` on 2026-09-18 because they mirrored one Native's layout. An entry that must land in a particular place may say so in its own `native.<agent-native>` hint."
    disabled_personalities: {}

