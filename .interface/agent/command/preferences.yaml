# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/command/preferences.yaml"
  path_note: "The Preferences layer of the Agent Command Component."
  purpose: "Built-in and custom command concepts, arguments, aliases, scope, and owning capability declarations. Native command realization is resolved by Agent Sync."
  standard: "Agent Project Interface"
  version: '2.0'
  updated: '2026-09-18'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; command discovery does not create a new command declaration."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Route declared command invocations to their owning capability."
  selection: "Runtime built-ins remain optional unless explicitly required; custom collisions are reported."
  version_resolution: "Built-in commands resolve from the active runtime version."
  matching: "Match exact command name, namespace, alias, and argument contract."



# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty; no command is globally selected."
  options: "Empty; Commands are entry points rather than alternatives."
  settings: "Declared commands and aliases."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings:
    commands:
      configure:
        arguments: ""
        owner: "skill.skills.core_workflow.configure"
        native: {claude: {invocation: "/my-interface-configure"}}
      plan:
        arguments: "[phase-number ...]"
        owner: "skill.skills.core_workflow.plan"
        native: {claude: {invocation: "/my-interface-plan [phase-number ...]"}}
      develop:
        arguments: "[phase-number ...]"
        owner: "skill.skills.core_workflow.develop"
        native: {claude: {invocation: "/my-interface-develop [phase-number ...]"}}
      review:
        arguments: "[phase-number ...]"
        owner: "skill.skills.core_workflow.review"
        native: {claude: {invocation: "/my-interface-review [phase-number ...]"}}
      launch:
        arguments: ""
        owner: "skill.skills.core_workflow.launch"
        native: {claude: {invocation: "/my-interface-launch"}}
      implement:
        arguments: "[phase-number ...]"
        owner: "skill.skills.supporting.implement"
        native: {claude: {invocation: "/my-interface-implement [phase-number ...]"}}
      reset:
        arguments: "[phase-number ... | config | complete]"
        owner: "skill.skills.supporting.reset"
        native: {claude: {invocation: "/my-interface-reset [phase-number ... | config | complete]"}}
      agent-native:
        arguments: "<1=sync self | 2=sync component | 3=install>"
        modes: {1: "sync self", 2: "sync component", 3: "install"}
        owner: "skill.skills.supporting.agent-native"
        invocation_scope: "direct-explicit-human-only"
        native: {claude: {invocation: "/my-interface-agent-native <1=sync self | 2=sync component | 3=install>"}}
    naming_note: "A command's portable identity is its key and its `arguments`; the slash form and the `my-interface-` prefix are Claude Code idioms and live only under each command's native.claude.invocation (moved there 2026-09-18). Another Native realizes the same key through its own invocation mechanism."
    placement_note: "Where a declared Command lives in the Native (project, user, managed, extension, runtime, built-in) is Agent Sync's decision from the Native's own layout; the former source-based categories (custom_commands, built_in_commands, user_commands, managed_commands, extension_commands) were collapsed into `commands` on 2026-09-18 because they mirrored one Native's layout; `legacy_command_files` (a Claude Code-only concept) was removed the same day — if a Native needs it, it belongs under `native.<agent-native>`. An entry that must land in a particular place may say so in its own `native.<agent-native>` hint."
    aliases: {}
