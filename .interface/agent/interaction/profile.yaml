      Analogy Engine: {required: false}
      Bedtime Story: {required: false}
      Caveman: {required: false}
      Coach: {required: false}
      ELI15: {required: false}
      Executive: {required: false}
      Feynman: {required: false}
      Gen Z: {required: false}
      Ladder: {required: false}
      No AI Slop: {required: false}
      No Slop: {required: false}
      Plain English: {required: false}
      Smart Brevity: {required: false}
      Sportscaster: {required: false}
      Street: {required: false}
      Thing Explainer: {required: false}
      Unslop: {required: false}
      Wait What: {required: false}
      Yoda: {required: false}
