# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/interaction/preferences.yaml"
  path_note: "The Preferences layer of the Agent Interaction Component."
  purpose: "Output style, progress, prompts, status presentation, artifacts, themes, and interface behavior."
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-11"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; presentation choices never change technical meaning or authority."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Apply the selected Output Style while preserving all required technical substance."
  selection: "Use the selected style when available; otherwise use the runtime default and report the missing style."
  version_resolution: "Runtime-provided interaction facilities resolve from the active runtime."
  matching: "Match custom Output Styles by exact frontmatter name and stable profile key."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Current Output Style and progress behavior."
  options: "Available Output Styles."
  settings: "Progress, prompts, status line, artifacts, themes, UI surfaces, and accessibility."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    output_style: "ADHD"
    progress_behavior: "material_updates"
  options:
    output_styles:
      ADHD: {path: ".claude/output-styles/adhd.md", required: true}
      Analogy Engine: {path: ".claude/output-styles/analogy-engine.md", required: false}
      Bedtime Story: {path: ".claude/output-styles/bedtime-story.md", required: false}
      Caveman: {path: ".claude/output-styles/caveman.md", required: false}
      Coach: {path: ".claude/output-styles/coach.md", required: false}
      ELI15: {path: ".claude/output-styles/eli15.md", required: false}
      Executive: {path: ".claude/output-styles/executive.md", required: false}
      Feynman: {path: ".claude/output-styles/feynman.md", required: false}
      Gen Z: {path: ".claude/output-styles/gen-z.md", required: false}
      Ladder: {path: ".claude/output-styles/ladder.md", required: false}
      No AI Slop: {path: ".claude/output-styles/no-ai-slop.md", required: false}
      No Slop: {path: ".claude/output-styles/no-slop.md", required: false}
      Plain English: {path: ".claude/output-styles/plain-english.md", required: false}
      Smart Brevity: {path: ".claude/output-styles/smart-brevity.md", required: false}
      Sportscaster: {path: ".claude/output-styles/sportscaster.md", required: false}
      Street: {path: ".claude/output-styles/street.md", required: false}
