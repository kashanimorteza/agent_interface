# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/connection/preferences.yaml
  path_note: The Preferences layer of the Agent Connection Component.
  purpose: External services (MCP, LSP, channels, application connectors) and installable packages (plugins, marketplaces, capability packages), their trust, and their lifecycle. Absorbs the former Integration
    and Extension Preferences.
  standard: Agent Project Interface
  version: '2.0'
  updated: '2026-09-17'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned and contains references only, never credential values; discovery never authorizes provisioning.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.
  consumption: Validate declaration, trust, compatibility, authentication, connection, and usability before dependence. Reconcile declared Extensions with runtime installation and activation state.
  selection: Do not connect, trust, authenticate, or mutate an external system without applicable authorization. Preview provenance, permissions, dependencies, and capability changes before Provisioning.
  version_resolution: Protocol and provider versions resolve from compatible declared entries. Unpinned Extensions resolve to the latest compatible provider version at activation time.
  matching: Match provider-qualified integration identities and exact server or channel keys. Match plugins by full plugin-at-marketplace identity and marketplaces by stable source key.
  absorbed: integration/preferences.yaml (v1.0) under settings.services and extension/preferences.yaml (v1.0) under settings.packages, merged verbatim on 2026-09-17.
  absorbed_preferences:
    integration:
      meta:
        path: .interface/agent/integration/preferences.yaml
        path_note: The Preferences layer of the Agent Integration Component.
        purpose: MCP, LSP, channel, application, transport, trust, and external-service connection declarations.
        standard: Agent Project Interface
        version: '1.0'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned and contains references only, never credential values.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Validate declaration, trust, compatibility, authentication, connection, and usability before dependence.
        selection: Do not connect, trust, authenticate, or mutate an external system without applicable authorization.
        version_resolution: Protocol and provider versions resolve from compatible declared entries.
        matching: Match provider-qualified integration identities and exact server or channel keys.
      content_map:
        selected: Empty; no external Integration is selected.
        options: Supported Integration protocols.
        settings: Complete connection categories; all are currently explicitly empty.
      note: Kept verbatim from the former integration Component Preferences; its content now lives under these Preferences as described in policy.absorbed.
    extension:
      meta:
        path: .interface/agent/extension/preferences.yaml
        path_note: The Preferences layer of the Agent Extension Component.
        purpose: Plugin, marketplace, package, monitor, theme, and extension lifecycle declarations.
        standard: Agent Project Interface
        version: '1.0'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; discovery never authorizes Extension Provisioning.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Reconcile declared Extensions with runtime installation and activation state.
        selection: Preview provenance, permissions, dependencies, and capability changes before Provisioning.
        version_resolution: Unpinned Extensions resolve to the latest compatible provider version at activation time.
        matching: Match plugins by full plugin-at-marketplace identity and marketplaces by stable source key.
      content_map:
        selected: Enabled Extension set.
        options: Declared Extension marketplaces.
        settings: Plugins and every supported extension category, including explicit empty categories.
      note: Kept verbatim from the former extension Component Preferences; its content now lives under these Preferences as described in policy.absorbed.

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Enabled package set per Agent Native; no external service is selected.
  options: Supported service protocols and declared package marketplaces per Agent Native.
  settings: Complete service categories (connections, transports, trust, health) and package categories (plugins, manifests, monitors, themes, update policy), each with explicit empty categories.

