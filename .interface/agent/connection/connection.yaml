# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/connection/connection.yaml
  path_note: The Preferences layer of the Agent Connection Component.
  purpose: Declared plugins, marketplaces, and tools with their trust and lifecycle.
  standard: Agent Project Interface
  version: '5.0'
  updated: '2026-10-05'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned and contains references only, never credential values.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: Read the content sections in read_order.
  selection: settings declares each plugin's and tool's desired state.
  version_resolution: Protocol and provider versions resolve from compatible declared entries. Unpinned Extensions resolve to the latest compatible provider version at activation time.
  matching: Match plugins by plugin-at-marketplace identity, marketplaces by source key, and tools by package name.


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Empty. Package state is declared in settings.
  options: Supported service protocols and declared package marketplaces.
  settings: Declared plugins and tools with their desired state; no external service is declared.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options:
    protocols:
      MCP:
        version: runtime-provided
      LSP:
        version: runtime-provided
      channel:
        version: runtime-provided
      application_connector:
        version: runtime-provided
    packages:
      marketplaces:
        claude-plugins-official:
          source: github
          repository: anthropics/claude-plugins-official
        anthropic-agent-skills:
          source: github
          repository: anthropics/skills
        claude-settings:
          source: github
          repository: fcakyon/claude-codex-settings
        karpathy-skills:
          source: github
          repository: forrestchang/andrej-karpathy-skills
  settings:
    packages:
      plugins:
        claude-code-setup:
          id: claude-code-setup@claude-plugins-official
          desired_state: enabled
        feature-dev:
          id: feature-dev@claude-plugins-official
          desired_state: enabled
        commit-commands:
          id: commit-commands@claude-plugins-official
          desired_state: enabled
        plugin-dev:
          id: plugin-dev@claude-plugins-official
          desired_state: enabled
        frontend-design:
          id: frontend-design@claude-plugins-official
          desired_state: enabled
        example-skills:
          id: example-skills@anthropic-agent-skills
          desired_state: enabled
        document-skills:
          id: document-skills@anthropic-agent-skills
          desired_state: enabled
        adhd-output-style:
          id: adhd-output-style@claude-settings
          desired_state: enabled
        claude-md-management:
          id: claude-md-management@claude-plugins-official
          desired_state: disabled
        superpowers:
          id: superpowers@claude-plugins-official
          desired_state: enabled
        andrej-karpathy-skills:
          id: andrej-karpathy-skills@karpathy-skills
          desired_state: enabled
    tools:
      graphify:
        source: pypi
        package: graphifyy
        install: "uv tool install graphifyy"
        desired_state: enabled
        provides: ["graphify Provider Skill", "graphify-guard"]
