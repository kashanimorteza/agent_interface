# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/agent/profile.yaml
  path_note: The Profile layer of the Agent Component.
  purpose: Agent Native selection, General and Specialized Agent Instance definitions, Role contracts, Coordination policy, capability configuration, lifecycle defaults, and native realizations. Absorbs
    the former Role and Coordination Profiles.
  standard: Agent Project Interface
  version: '2.0'
  updated: '2026-09-17'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; runtime-discovered Agent Natives and Agent Instances are observed without being adopted as required declarations.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.
  consumption: Use the selected Agent Native, instantiate the General Agent Instance, and expose each required Specialized Agent Instance through its declared native realization. Roles are assigned by stable
    key; coordination uses the smallest mechanism sufficient for the authorized work.
  selection: An undeclared Agent Native or Agent Instance remains an optional runtime capability and never becomes part of the required Agent Profile automatically.
  version_resolution: Agent Native behavior and Native Instance Realization formats resolve from the selected Agent Runtime.
  matching: Match the Agent Native by runtime identity and Agent Instance Definitions by stable identity and assigned Role reference; resolve native realization details through Agent Sync.
  absorbed: role/profile.yaml (v1.2) and coordination/profile.yaml (v1.2), merged verbatim under settings.roles and settings.coordination on 2026-09-17.
  absorbed_profiles:
    role:
      meta:
        path: .interface/agent/role/profile.yaml
        path_note: The Profile layer of the Agent Role Component.
        purpose: Primary and specialized responsibility contracts available for assignment to Agent Instance Definitions.
        standard: Agent Project Interface
        version: '1.2'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; runtime-discovered roles are not adopted as required roles automatically.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Select the declared primary role and use specialized roles only within their contracts.
        selection: An undeclared role may be used only as optional runtime capability when compatible with current authority.
        version_resolution: Role contracts are portable; any native realization resolves through its owning Agent Instance Definition, Agent Native, and selected Runtime.
        matching: Match Roles by stable profile key and architecture contract.
      content_map:
        selected: The current Primary Role.
        options: Selectable primary roles.
        settings: Complete role catalogs and role defaults, with unused sources explicit.
      note: Kept verbatim from the former role Component Profile; its content now lives under this Profile as described in policy.absorbed.
    coordination:
      meta:
        path: .interface/agent/coordination/profile.yaml
        path_note: The Profile layer of the Agent Coordination Component.
        purpose: Delegation, teams, tasks, messaging, concurrency, worktree isolation, and conflict handling.
        standard: Agent Project Interface
        version: '1.2'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; generated team and task runtime state is never written into it.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Use the smallest coordination mechanism and declared Agent Instance set sufficient for the authorized work.
        selection: Prefer the General Agent Instance for sequential work, delegated Specialized Agent Instances for focused isolation, and teams only for genuine peer coordination.
        version_resolution: Experimental runtime mechanisms resolve against the active compatible runtime.
        matching: Match coordination mechanisms and Agent Instance Definitions by exact declared keys.
      content_map:
        selected: Default coordination and isolation strategy.
        options: Supported coordination mechanisms.
        settings: Delegation, teams, tasks, messaging, concurrency, worktrees, and conflict policy.
      note: Kept verbatim from the former coordination Component Profile; its content now lives under this Profile as described in policy.absorbed.
  superseded_on_2026_09_17:
    meta_purpose: Agent Native selection plus General and Specialized Agent Instance identities, Role assignments, capability configuration, lifecycle defaults, and native realizations.
    content_map:
      selected: The selected Agent Native and General Agent Instance.
      options: Selectable Agent Natives and General Agent Instance definitions.
      settings: Project, runtime, user, managed, extension, and built-in Agent Instance definitions plus inherited defaults.
    note: Previous descriptions of this Profile, kept verbatim; the merged descriptions above replace them.

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Selected Agent Native, General Agent Instance, Primary Role, and default coordination and isolation strategy.
  options: Selectable Agent Natives, General Agent Instances, primary roles, and coordination mechanisms.
  settings: Agent Instance definitions by source, inherited defaults (including optional personality), Role catalogs, coordination policy, and optional per-Native realization hints.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    agent_native: runtime-primary
    general_instance: general
    primary_role: primary-execution
    default_coordination: single_agent
    mutation_isolation: scope_partition
  options:
    agent_natives:
      runtime-primary:
        runtime: selected Agent Runtime
        native_identity: runtime primary agent
        realization: runtime-provided
    general_instances:
      general:
        resource: project_instances.general
    primary_roles:
      primary-execution:
        resource: project_roles.primary-execution
    default_coordinations:
      single_agent:
        meaning: The General Agent Instance executes the work directly.
      delegated_agents:
        meaning: Specialized Agent Instances return bounded results to the accountable General Agent Instance.
      agent_team:
        meaning: Independent declared Agent Instances coordinate through shared tasks and messaging.
    mutation_isolations:
      scope_partition:
        meaning: Concurrent writers receive non-overlapping owned scopes.
      worktree:
        meaning: Concurrent writers operate in isolated worktrees.
  settings:
    project_instances:
      general:
        kind: general
        role: roles.project_roles.primary-execution
        native_identity: runtime primary agent
        native_definition: runtime-provided
        configuration: inherits instance_defaults materialized into the synchronized Runtime by explicit Agent Sync
        required: true
      interface-reader:
        kind: specialized
        role: roles.project_roles.interface-reader
        native_identity: interface-reader
        native_definition: resolved by Agent Sync from the selected Agent Native
        allowed_tools:
        - Read
        - Grep
        - Glob
        write_authority: none
        configuration: inherits instance_defaults with allowed_tools and write_authority overridden by this definition
        required: true
    runtime_instances: {}
    user_instances: {}
    managed_instances: {}
    extension_instances: {}
    built_in_instances: {}
    instance_defaults:
      model: null
      effort: null
      max_turns: null
      background: false
      isolation: null
      memory: null
      skills: []
      allowed_tools: []
      disallowed_tools: []
      personality: null
    overrides: {}
    roles:
      project_roles:
        primary-execution:
          architecture_contract: Agent Role Principle 4
          required: true
        interface-reader:
          architecture_contract: Agent Role Principle 5
          required: true
      runtime_roles: {}
      user_roles: {}
      managed_roles: {}
      extension_roles: {}
      built_in_roles: {}
    coordination:
      delegation:
        required_contract_fields:
        - objective
        - scope
        - context
        - authority
        - expected_output
        - evidence
        - stopping_condition
      teams: {}
      teammates: {}
      shared_tasks: {}
      messaging: {}
      mailboxes: {}
      concurrency: {}
      worktrees: {}
      batch_execution: {}
      conflict_resolution:
        accountable_owner: general Agent Instance
        integrate_only_after_reconciliation: true
    native:
      claude:
        realization_hints: {}

