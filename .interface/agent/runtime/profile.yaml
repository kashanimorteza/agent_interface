# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/runtime/profile.yaml
  path_note: The Profile layer of the Agent Runtime Component.
  purpose: The selected runtime, provider, models, effort, compatibility choices, and the selected Runtime's own configuration-source precedence (formerly Settings).
  standard: Agent Project Interface
  version: '2.0'
  updated: '2026-09-17'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; runtime resolution is observed without being written back as a project choice.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.
  consumption: Consumers identify the selected Runtime; explicit Agent Sync learns and applies the Native Runtime's own mechanisms.
  selection: Use a listed compatible runtime; report incompatibility rather than inventing equivalent behavior.
  version_resolution: Runtime-provided values resolve from the active installation without changing this file.
  matching: Runtime identity matches the selected Runtime exactly.
  absorbed: 'settings/profile.yaml (v1.1) merged on 2026-09-17: its source precedence, merge behavior, and reconcile policy are Claude Code mechanics and live under settings.native.claude.configuration;
    its general Principles 2-5 became Agent Profile Schema rules.'
  absorbed_profiles:
    settings:
      meta:
        path: .interface/agent/settings/profile.yaml
        path_note: The Profile layer of the Agent Settings Component.
        purpose: Configuration sources, scopes, precedence, merge behavior, environment values, and reconciliation policy.
        standard: Agent Project Interface
        version: '1.1'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; consumers reconcile declarations with runtime state without writing observations here.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Resolve sources in declared precedence and apply each setting owner's merge rule.
        selection: Unlisted native settings remain runtime defaults unless another Agent Component declares a requirement.
        version_resolution: Settings schema versions follow the selected Agent Runtime.
        matching: Match settings by stable owner and exact native key.
      content_map:
        selected: The shared project settings source and reconciliation behavior.
        options: Supported configuration source scopes.
        settings: Precedence, merge policy, environment, flags, and complete configuration categories.
      note: Kept verbatim from the former settings Component Profile; its content now lives under this Profile as described in policy.absorbed.
  superseded_on_2026_09_17:
    meta_purpose: The selected runtime, provider, model, effort, and compatibility choices.
    content_map:
      selected: The current Agent Runtime.
      options: Supported runtime alternatives.
      settings: Provider, model, effort, and compatibility declarations. Native paths, formats, mappings, and capability limits are discovered by Agent Sync from the selected Agent Native.
    note: Previous descriptions of this Profile, kept verbatim; the merged descriptions above replace them.

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: The current Agent Runtime.
  options: Supported runtime alternatives.
  settings: Provider, model, effort, and compatibility declarations, plus per-Native configuration mechanics (Claude Code source precedence, merge behavior, reconcile policy). Native paths, formats, and
    capability limits are discovered by Agent Sync.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    agent_runtime: Claude Code
  options:
    agent_runtimes:
      Claude Code:
        version: runtime-provided
  settings:
    providers: {}
    models: {}
    effort_levels: {}
    fallback_models: {}
    compatibility:
      required_profile_version: '1.0'
      status: compatible
    _models_note: Declare each model the selected Runtime offers, keyed by a stable name; Personality Profiles refer to these names in priority order.
    native:
      claude:
        configuration:
          selected:
            project_settings_source: shared_project
            reconciliation: explicit_agent_sync
          options:
            project_settings_sources:
              shared_project:
                path: resolved by Agent Sync from the selected Agent Native
            reconciliations:
              explicit_agent_sync:
                meaning: Apply Agent Module declarations only when the Human directly invokes the declared Agent Sync entry point; the Agent Native, Agent Instances, Skills, coordinators, Hooks, lifecycle
                  routines, automations, and model-generated actions cannot initiate it.
          settings:
            source_precedence:
            - managed
            - command_line
            - project_local
            - shared_project
            - user
            sources:
              managed: {}
              command_line: {}
              project_local: {}
              shared_project:
                path: resolved by Agent Sync from the selected Agent Native
              user: {}
              global: {}
            merge_behavior:
              scalar: highest-precedence applicable value
              list: runtime-defined merge and deduplication
              security: strictest applicable restriction
            environment_variables: {}
            command_line_flags: {}
            feature_flags: {}
            attribution: {}
            updates: {}
            notifications: {}
            cost_and_usage: {}
            reconcile:
              preserve_runtime_defaults: true
              write_resolved_values_back: false
              missing_required: report
              undeclared_native: optional unless incompatible

