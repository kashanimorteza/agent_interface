# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/runtime/preferences.yaml
  path_note: The Preferences layer of the Agent Runtime Component.
  purpose: The selected runtime, provider, models, effort, compatibility choices, and the selected Runtime's own configuration-source precedence (formerly Settings).
  standard: Agent Project Interface
  version: '3.0'
  updated: '2026-09-17'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; runtime resolution is observed without being written back as a project choice.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.
  absorbed: 'settings/preferences.yaml (v1.1) merged on 2026-09-17: its source precedence, merge behavior, and reconcile policy are Claude Code mechanics and live under settings.native.claude.configuration;
    its general Principles 2-5 became Agent Preferences Schema rules.'


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: Consumers identify the selected Runtime; explicit Agent Sync learns and applies the Native Runtime's own mechanisms.
  selection: Use a listed compatible runtime; report incompatibility rather than inventing equivalent behavior.
  version_resolution: Runtime-provided values resolve from the active installation without changing this file.
  matching: Runtime identity matches the selected Runtime exactly.


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: The current Agent Runtime.
  options: Supported runtime alternatives.
  settings: Provider, model, effort, and compatibility declarations, plus per-Native configuration mechanics (Claude Code source precedence, merge behavior, reconcile policy). Native paths, formats, and
    capability limits are discovered by Agent Sync.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    agent_runtime: Claude Code
  options:
    agent_runtimes:
      Claude Code:
        version: runtime-provided
  settings:
    providers: {}
    models: {}
    effort_levels: {}
    fallback_models: {}
    compatibility: {}
    _models_note: 'Declare each model the selected Runtime offers under models, keyed by a stable name, e.g. models: {opus: {provider: anthropic, id: <model-id>}, sonnet: {provider: anthropic, id: <model-id>}}.
      Personality Preferences refer to these stable names in priority order; the first is primary, the rest are fallbacks.'
    native:
      claude:
        configuration:
          selected:
            project_settings_source: shared_project
            reconciliation: explicit_agent_sync
          options:
            project_settings_sources:
              shared_project:
                path: resolved by Agent Sync from the selected Agent Native
            reconciliations:
              explicit_agent_sync:
                meaning: Apply Agent Module declarations only when the Human directly invokes the declared Agent Sync entry point; the Agent Native, Agent Instances, Skills, coordinators, Hooks, lifecycle
                  routines, automations, and model-generated actions cannot initiate it.
          settings:
            source_precedence:
            - managed
            - command_line
            - project_local
            - shared_project
            - user
            sources:
              managed: {}
              command_line: {}
              project_local: {}
              shared_project:
                path: resolved by Agent Sync from the selected Agent Native
              user: {}
              global: {}
            merge_behavior:
              scalar: highest-precedence applicable value
              list: runtime-defined merge and deduplication
              security: strictest applicable restriction
            environment_variables: {}
            command_line_flags: {}
            feature_flags: {}
            attribution: {}
            updates: {}
            notifications: {}
            cost_and_usage: {}
            reconcile:
              preserve_runtime_defaults: true
              write_resolved_values_back: false
              missing_required: report
              undeclared_native: optional unless incompatible
    _compatibility_note: Explicit empty category. The former required_profile_version/status pair had no defined meaning and was removed on 2026-09-17.

