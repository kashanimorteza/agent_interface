# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/permission/profile.yaml"
  path_note: "The Profile layer of the Agent Permission Component."
  purpose: "Permission mode, allow/ask/deny rules, sandboxing, protected sources, trust, authentication, and secrets."
  standard: "Agent Project Interface"
  version: "1.2"
  updated: "2026-09-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned and contains no credential or secret values."
  changed_by: "The human, directly."
  precedence: "Human authorization, every applicable Principle, deny rules, and stricter managed controls take precedence."
  consumption: "Resolve permissions using deny-safe least privilege before executing a protected action."
  selection: "Request authorization only when an applicable ask boundary or material undecided action requires it."
  version_resolution: "Permission syntax and sandbox facilities resolve from the selected runtime."
  matching: "Match portable Tool and resource capability patterns; Agent Sync resolves their Native syntax, and deny and stricter rules win conflicts."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Current permission mode and sandbox choice."
  options: "Supported permission modes."
  settings: "Rules, protected sources, sandbox, trust, authentication references, secrets, and external authorization."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    permission_mode: "edit_authorized"
  options:
    permission_modes:
      edit_authorized:
        meaning: "Apply ordinary project file edits without per-edit confirmation while preserving explicit ask and deny rules."
  settings:
    rules:
      allow:
        - "shell_execute"
        - "file_read"
        - "file_discover"
        - "text_search"
        - "file_edit"
        - "file_write"
        - "notebook_edit"
        - "agent_delegate"
        - "task_record"
        - "web_fetch"
        - "web_search"
      deny: []
      ask:
        - "shell_execute(git commit:*)"
        - "shell_execute(git push:*)"
        - "shell_execute(git reset:*)"
        - "shell_execute(git restore:*)"
        - "shell_execute(git checkout:*)"
        - "shell_execute(git rebase:*)"
        - "shell_execute(git clean:*)"
    sandbox:
      enabled: null
      filesystem: {}
      network: {}
      process: {}
    protected_sources:
      protected_root: ".interface/"
      mutation: "deny by default"
      read_restrictions:
        agent_module:
          path: ".interface/agent/"
          default: "deny"
          sole_consumer: "skill.project_skills.supporting.agent-sync"
          invocation: "direct-explicit-human-only"
          grant_scope: "exact expanded Human prompt only; non-transferable"
          effect: "The Agent Native, every Agent Instance, Skill, coordinator, Hook, lifecycle routine, automation, model-generated action, and Understanding workflow consumes synchronized Runtime artifacts and cannot initiate Agent Sync."
      editable_exception:
        path: ".interface/foundation/config/"
        condition: "Only the active Skill's declared write authority and the owning Component's rules may authorize an exact Config record."
      future_paths: "Protected automatically unless they are inside the editable Config exception."
    trust: {}
    authentication_references: {}
    credential_helpers: {}
    secrets:
      project_values: {}
      logging: "redact"
      output: "redact"
    external_authorizations: {}
    managed_restrictions: {}
