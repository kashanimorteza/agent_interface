# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/agent/rule/profile.yaml"
  path_note: "The Profile layer of the Agent Rule Component."
  purpose: "Project, user, managed, extension, global, and path-scoped Agent Rule declarations."
  standard: "Agent Project Interface"
  version: "1.2"
  updated: "2026-09-17"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned; Rules guide behavior but never replace enforceable Permission or Hook controls."
  changed_by: "The human, directly."
  precedence: "An explicit project decision and every applicable Principle take precedence over this file."
  consumption: "Load global Rules at startup and scoped Rules only for matching work."
  selection: "Add a Rule only for stable recurring guidance; task-specific procedures belong to Skills."
  version_resolution: "Rule format follows the selected runtime mapping."
  matching: "Match Rules by stable key and exact scope conditions."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["selected", "options", "settings"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty; all applicable required Rules load by scope."
  options: "Empty; Rules are declarations rather than alternatives."
  settings: "Complete Rule catalogs by source and scope."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings:
    project_rules:
      interface-bootstrap:
        path: "resolved by Agent Sync from the selected Agent Native"
        scope: "global"
        responsibility: "Enter through the canonical Interface file and the Foundation section files it links (understanding, operations, modes, authority, workflow) while reserving Agent Module sources exclusively for explicit Agent Sync."
        required: true
      interface-skill-policy:
        path: "resolved by Agent Sync from the selected Agent Native"
        scope: "global"
        responsibility: "Apply shared human-owned boundaries and capability policy."
        required: true
      interface-agent-capabilities:
        path: "resolved by Agent Sync from the selected Agent Native"
        scope: "global"
        responsibility: "Expose the synchronized Runtime capability identifiers and native mappings without requiring Agent Module reads."
        required: true
    path_scoped_rules: {}
    user_rules: {}
    managed_rules: {}
    extension_rules: {}
    runtime_rules: {}
    conflicts: {}
