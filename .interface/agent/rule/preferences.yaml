# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/agent/rule/preferences.yaml
  path_note: The Preferences layer of the Agent Rule Component.
  purpose: Project, user, managed, extension, global, and path-scoped Agent Rule declarations, plus the conduct settings of the former Interaction, Observability, and Session Components.
  standard: Agent Project Interface
  version: '2.0'
  updated: '2026-09-17'

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: This file is human-owned; Rules guide behavior but never replace enforceable Permission or Hook controls.
  changed_by: The human, directly.
  precedence: An explicit project decision and every applicable Principle take precedence over this file.
  consumption: Load global Rules at startup and scoped Rules only for matching work.
  selection: Add a Rule only for stable recurring guidance; task-specific procedures belong to Skills.
  version_resolution: Rule format follows the selected runtime mapping.
  matching: Match Rules by stable key and exact scope conditions.
  absorbed: interaction/preferences.yaml (v1.0), observability/preferences.yaml (v1.0), session/preferences.yaml (v1.0), merged verbatim under settings.interaction, settings.observability, settings.session on 2026-09-17.
  absorbed_preferences:
    interaction:
      meta:
        path: .interface/agent/interaction/preferences.yaml
        path_note: The Preferences layer of the Agent Interaction Component.
        purpose: Output style, progress, prompts, status presentation, artifacts, themes, and interface behavior.
        standard: Agent Project Interface
        version: '1.0'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; presentation choices never change technical meaning or authority.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Apply the selected Output Style while preserving all required technical substance.
        selection: Use the selected style when available; otherwise use the runtime default and report the missing style.
        version_resolution: Runtime-provided interaction facilities resolve from the active runtime.
        matching: Match custom Output Styles by exact frontmatter name and stable preferences key.
      content_map:
        selected: Current Output Style and progress behavior.
        options: Available Output Styles.
        settings: Progress, prompts, status line, artifacts, themes, UI surfaces, and accessibility.
      note: Kept verbatim from the former interaction Component Preferences; its content now lives under these Preferences as described in policy.absorbed.
    observability:
      meta:
        path: .interface/agent/observability/preferences.yaml
        path_note: The Preferences layer of the Agent Observability Component.
        purpose: Validation, status, diagnostics, evidence, logs, telemetry, health, and usage reporting.
        standard: Agent Project Interface
        version: '1.0'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; observations update owned runtime or operational records, never these preferences.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Run proportional checks and report current evidence using the declared status vocabulary.
        selection: Use the least expensive check that establishes the condition with sufficient confidence.
        version_resolution: Diagnostic facilities resolve from the selected runtime.
        matching: Match checks to the exact declaration, role, scope, and condition they verify.
      content_map:
        selected: Default validation depth.
        options: Supported validation depths.
        settings: Required checks, statuses, diagnostics, evidence, logs, telemetry, health, and usage.
      note: Kept verbatim from the former observability Component Preferences; its content now lives under these Preferences as described in policy.absorbed.
    session:
      meta:
        path: .interface/agent/session/preferences.yaml
        path_note: The Preferences layer of the Agent Session Component.
        purpose: Session lifecycle, resume, persistence, background work, isolation, checkpoints, and termination.
        standard: Agent Project Interface
        version: '1.0'
        updated: '2026-09-12'
      policy:
        agent_may_edit: false
        rule: This file is human-owned; generated session history and identifiers remain runtime state.
        changed_by: The human, directly.
        precedence: An explicit project decision and every applicable Principle take precedence over this file.
        consumption: Revalidate current project and runtime state before resumed or restored mutation.
        selection: Use isolation or Background Work only when it materially improves safe execution.
        version_resolution: Session mechanisms resolve from the active runtime version.
        matching: Match persisted Sessions by runtime identity; never infer identity from conversation text.
      content_map:
        selected: Default resume and background-work behavior.
        options: Supported resume behaviors.
        settings: Complete lifecycle, persistence, background, isolation, checkpoint, and termination categories.
      note: Kept verbatim from the former session Component Preferences; its content now lives under these Preferences as described in policy.absorbed.
  superseded_on_2026_09_17:
    meta_purpose: Project, user, managed, extension, global, and path-scoped Agent Rule declarations.
    content_map:
      selected: Empty; all applicable required Rules load by scope.
      options: Empty; Rules are declarations rather than alternatives.
      settings: Complete Rule catalogs by source and scope.
    note: Previous descriptions of these Preferences, kept verbatim; the merged descriptions above replace them.

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- selected
- options
- settings

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: Selected Output Style, progress behavior, validation depth, and resume behavior.
  options: Available Output Styles, progress behaviors, validation depths, and resume behaviors.
  settings: Rule catalogs by source and scope, plus interaction, observability, and session conduct settings and optional per-Native realization hints.

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    output_style: ADHD Explanatory
    progress_behavior: material_updates
    validation_depth: proportional
    resume_behavior: revalidate
    output_style_note: Provided by the enabled plugin adhd-output-style@claude-settings (see connection Preferences); the plugin owns the style, this selection names what it provides. Decided 2026-09-17.
  options:
    output_styles:
      ADHD:
        required: false
        note: Local style file; superseded as the selected style by the plugin-provided ADHD Explanatory on 2026-09-17.
      Analogy Engine:
        required: false
      Bedtime Story:
        required: false
      Caveman:
        required: false
      Coach:
        required: false
      ELI15:
        required: false
      Executive:
        required: false
      Feynman:
        required: false
      Gen Z:
        required: false
      Ladder:
        required: false
      No AI Slop:
        required: false
      No Slop:
        required: false
      Plain English:
        required: false
      Smart Brevity:
        required: false
      Sportscaster:
        required: false
      Street:
        required: false
      Thing Explainer:
        required: false
      Unslop:
        required: false
      Wait What:
        required: false
      Yoda:
        required: false
      ADHD Explanatory:
        required: true
        provided_by: plugin adhd-output-style@claude-settings
    progress_behaviors:
      material_updates:
        meaning: Report meaningful progress and blockers without narrating routine internals.
    validation_depths:
      proportional:
        meaning: Use evidence proportional to risk and repeat checks after relevant changes.
    resume_behaviors:
      revalidate:
        meaning: Re-establish context, scope, permissions, files, and outstanding work before mutation.
  settings:
    project_rules:
      interface-bootstrap:
        path: resolved by Agent Sync from the selected Agent Native
        scope: global
        responsibility: Enter through the canonical Interface file and the Foundation section files it links (introduction, terminology, architecture, understanding, operations, modes, authority, workflow) while reserving Agent Module sources
          exclusively for explicit Agent Sync.
        required: true
      interface-skill-policy:
        path: resolved by Agent Sync from the selected Agent Native
        scope: global
        responsibility: Apply shared human-owned boundaries and capability policy.
        required: true
      interface-agent-capabilities:
        path: resolved by Agent Sync from the selected Agent Native
        scope: global
        responsibility: Expose the synchronized Runtime capability identifiers and native mappings without requiring Agent Module reads.
        required: true
      git-discipline:
        path: resolved by Agent Sync from the selected Agent Native
        scope: global
        responsibility: Never run git commit or git push unless the Human explicitly asks for it in the current message; 'save it' means write files to disk, not commit. Explains the boundary that Permission
          enforces through its ask rules on git commit, push, reset, restore, checkout, rebase, and clean.
        required: true
    path_scoped_rules: {}
    user_rules: {}
    managed_rules: {}
    extension_rules: {}
    runtime_rules: {}
    conflicts: {}
    interaction:
      output_style_defaults:
        preserve_coding_instructions: true
        preserve_identifiers: true
        preserve_evidence: true
        preserve_warnings: true
      progress_updates: {}
      prompts_and_questions: {}
      status_line: {}
      artifacts: {}
      themes: {}
      terminal_interface: {}
      ide_interface: {}
      desktop_interface: {}
      web_interface: {}
      accessibility: {}
      language: {}
    observability:
      required_checks:
      - Every selected resource resolves to a declared option or resource.
      - Every required Agent Role, Rule, Skill, Tool, Hook, Integration, and Extension is discoverable and usable.
      - The selected Output Style is present and active.
      - Effective permissions and sandbox behavior match their declarations.
      - No project capability declaration contains a secret or machine credential.
      - Every explicit empty category remains represented.
      capability_statuses:
        available: Declared and usable by the intended role.
        activation_required: Declared but awaiting a stated activation condition.
        unavailable: Declared but not usable in the required scope.
        conflicting: Applicable declarations cannot be satisfied together.
        undeclared: Observed in the runtime but absent from the project profile.
        not_configured: Supported category explicitly contains no entry.
      configuration_statuses:
        reconciled: {}
        drifted: {}
        invalid: {}
        unknown: {}
      diagnostics:
        status: {}
        doctor: {}
        context: {}
        memory: {}
        skills: {}
        agents: {}
        hooks: {}
        mcp: {}
        permissions: {}
      evidence_records: {}
      logs: {}
      telemetry: {}
      traces: {}
      metrics: {}
      health_checks: {}
      cost_and_usage: {}
      redaction:
        secrets: true
        hidden_reasoning: true
    session:
      startup: {}
      resume: {}
      fork: {}
      restore: {}
      history: {}
      persistence: {}
      background_work: {}
      tasks: {}
      isolation: {}
      worktrees: {}
      checkpoints: {}
      compaction_events: {}
      usage_limit_continuation: {}
      cancellation: {}
      termination: {}
      generated_state:
        human_authored: false
        project_authority: false
    native:
      claude:
        realization_hints:
          output_style: Claude Code outputStyle setting or an output-styles file; a plugin that forces a style conflicts with this selection
          session: Claude Code session resume, checkpoints, and compaction

