# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/logic/preferences.yaml"
  path_note: "The Preferences layer of the Logic Component — Logic-owned behavioural defaults and internal realization conventions."
  purpose: "Configurable defaults for Logic organization, reliability, and verification."
  standard: "Agent Project Interface"
  version: "8.0"
  updated: "2026-09-19"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Logic choices back into it."
  changed_by: "The human, directly. A missing critical Logic choice is raised through State."
  precedence: "An explicit Target value and every applicable Logic Principle take precedence over this file."
  consumption: "Resolve Logic's Component Profile, language-owned Technical Purposes, Connections, and Platform Launch Item from Development first. Apply this file only to Logic-owned behavioural defaults and internal realization conventions. Resolve environment-specific Runtime Bindings from Platform and never copy concrete technical or Platform values into this file."
  selection: "Use a compatible configured Logic default when the Target is silent. For an explicit incompatible need, preserve Target intent under Logic Principles and record the consequential realization choice; ask only when no safe compatible choice can be established."
  version_resolution: "This file owns no versioned implementation technology. Development resolves every language, framework, package, tool, and Package Management version."
  matching: "Match standards and Logic settings by their exact keys. Match Model Logic files to public Model identities, enable and disable only to Models declaring is_active, delete only to Target-authorized Models, and idempotency only to Target-selected operations."
  understanding:
    recorded: "2026-09-19"
    what_logic_is: "Logic is the layer of reasoning: the logic, the functionality, the behaviours and the routines of the application are designed here. It is the hub of the Implementation — Model, Database and the consumers turn around it. It is not executable; it is a library."
    who_talks_to_it: "A consumer states what it wants done and Logic does the rest. The API is one consumer: it runs the server, receives the request and tells Logic. Tomorrow a command-line entry point, or another Component, is a consumer in the same way. Whoever wants to enter or change data for a Model asks Logic, never Database or Model directly."
    what_it_talks_to: "Logic talks to Model to understand the Domain Definitions and build on them, to Database to reach stored data, and later to further Components — Binance, MT5, Log, Report — each of which will be its own Component."
    public_interface: "Nobody outside reaches Logic's internal parts. Logic has one Public Interface; it groups its Operations into Categories — Data Entry is one of them — and offers Operations: a consumer names the Operation and gives what it needs — the Model and the data for a data-entry Operation, the instrument and the parameters for opening an MT5 position — and Logic decides what to read from Model, what to ask of another Component, what to do, and what to answer. One Operation may use several internal Services."
    services: "Inside Logic the work is divided into Services, one per Component Logic talks to and named after it: a Database Service for the part of the reasoning that speaks to Database, and later an MT5 Service, a Binance Service, a Log Service, a Report Service. Services are internal — invisible from outside — and each performs Actions."
    operations_vs_actions: "An Operation is the larger unit, offered by the Public Interface; an Action is the step a Service performs. Operations are composed of Actions."
    database_service_actions: "The Database Service performs add, edit, update, enable, disable, delete, list, get by ID, search, and execute command — the last one reaching Database's own capability-restricted command route for work the other Actions cannot express."
    standard_beyond_logic: "Public Interface and Operation are meant to become the shared standard of every Implementation Component — Model, Database, API and the rest — declared in Development so documentation can rely on them. Recorded here as the decision that produced it; Development owns the general statement."
    superseded: "The earlier Logic Foundation / Model Logic / Use Case Logic structure — one base class implementing the standard operations, one file per Model inheriting from it, and a separate unit for cross-Model Behaviour — was dropped on 2026-09-19. Public Interface, Operations, Services and Actions replace it. The internal structure of each Service is deliberately still open."
    data_entry_operations: "The Data Entry Category offers create, list, update, delete, enable, disable, count, sum, min, max and truncate. list carries the reading work: it takes filters — id among them, so reading one record needs no Operation of its own — an order_by field and direction, and a limit. enable sets is_active true and disable sets it false; they stay two Operations rather than one with a flag. count, sum, min and max each take filters, and sum, min and max also take the field they work on. truncate empties a Model of its records while leaving its structure in place. The names follow REST and data-library convention rather than Interface-invented ones."
    open: "Which further Categories and Operations the Public Interface offers, the full Action list of each Service beyond Database, and the internal structure of a Service are not yet decided."

  architecture_standard:
    required: true
    rule: "Logic must follow the selected architecture standard as completely as possible while preserving the Target, Logic Principles, and every owning Component boundary."
    deviation: "Any necessary deviation must be documented with the implementation."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns Logic's configurable Component Profile and technical selections."
  options: "Empty. Development owns concrete technical alternatives; Logic standards and behavioural choices are under settings."
  settings: "Logic-owned standards and defaults grouped by Model Interface, Database Interface, the Public Interface and its Operations, the internal Services and their Actions, runtime behaviour, and verification."
  implementation: "Empty. Concrete implementation resolves the Target, Logic Principles, Development technical selections, Platform Bindings, and these defaults."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    standards:
      architecture:
        selected: "Hexagonal Architecture"
        options:
          - "Hexagonal Architecture"
          - "Clean Architecture"

    model_interface: {}

    database_interface: {}

    logic:
      public_interface:
        purpose: "The one boundary every consumer uses. It groups its Operations into Categories; it names no Service and exposes no Action."
        categories:
          data_entry:
            name: "Data Entry"
            purpose: "Operations through which a consumer enters, changes, and reads data for the Models."
            operations:

              create:
                does: "Create one record for the named Model from the supplied values."
                accepts: {model: "the Model this record belongs to", values: "the field values for the new record"}
                returns: "the created record"
                outcomes: ["created", "invalid values", "conflicts with an existing record"]
                uses: "database.create"

              list:
                does: "Return the records of the named Model that match the supplied criteria, in the requested order. Reading one record by identifier is this Operation with an id filter, not an Operation of its own."
                accepts:
                  model: "the Model to read"
                  filters: "conditions a record must satisfy; id is one of them"
                  order_by: "the field to order by and its direction"
                  limit: "how many records to return; the pagination defaults apply when omitted"
                  cursor: "where to continue from, under the selected pagination strategy"
                returns: "the matching records and the position to continue from"
                outcomes: ["listed", "unknown Model", "unsupported filter or order field"]
                uses: "database.list"

              update:
                does: "Change the supplied fields of one existing record of the named Model."
                accepts: {model: "the Model this record belongs to", id: "which record", values: "the fields to change"}
                returns: "the updated record"
                outcomes: ["updated", "not found", "invalid values", "conflicts with an existing record"]
                uses: "database.update"

              delete:
                does: "Remove one record of the named Model, where the Target authorizes deletion for that Model."
                accepts: {model: "the Model this record belongs to", id: "which record"}
                returns: "the removal outcome"
                outcomes: ["deleted", "not found", "deletion not authorized for this Model", "still referenced"]
                uses: "database.delete"

              enable:
                does: "Set one record active — is_active true — where the Model declares that field."
                accepts: {model: "the Model this record belongs to", id: "which record"}
                returns: "the updated record"
                outcomes: ["enabled", "not found", "Model has no active state"]
                uses: "database.enable"

              disable:
                does: "Set one record inactive — is_active false — where the Model declares that field."
                accepts: {model: "the Model this record belongs to", id: "which record"}
                returns: "the updated record"
                outcomes: ["disabled", "not found", "Model has no active state"]
                uses: "database.disable"

              count:
                does: "Return how many records of the named Model match the supplied criteria; the whole Model when no filter is given."
                accepts: {model: "the Model to count", filters: "conditions a record must satisfy"}
                returns: "the number of matching records"
                outcomes: ["counted", "unknown Model", "unsupported filter field"]
                uses: "database.count"

              sum:
                does: "Return the total of one numeric field across the records of the named Model that match the supplied criteria."
                accepts: {model: "the Model to read", field: "the field to total", filters: "conditions a record must satisfy"}
                returns: "the total, and nothing to total when no record matches"
                outcomes: ["summed", "unknown Model", "unknown or non-numeric field", "unsupported filter field"]
                uses: "database.sum"

              min:
                does: "Return the smallest value of one field across the records of the named Model that match the supplied criteria."
                accepts: {model: "the Model to read", field: "the field to take the minimum of", filters: "conditions a record must satisfy"}
                returns: "the smallest value, and nothing when no record matches"
                outcomes: ["found", "unknown Model", "unknown or incomparable field", "unsupported filter field"]
                uses: "database.min"

              max:
                does: "Return the largest value of one field across the records of the named Model that match the supplied criteria."
                accepts: {model: "the Model to read", field: "the field to take the maximum of", filters: "conditions a record must satisfy"}
                returns: "the largest value, and nothing when no record matches"
                outcomes: ["found", "unknown Model", "unknown or incomparable field", "unsupported filter field"]
                uses: "database.max"

              truncate:
                does: "Remove every record of the named Model, leaving its structure in place."
                accepts: {model: "the Model to empty"}
                returns: "the removal outcome"
                outcomes: ["emptied", "unknown Model", "deletion not authorized for this Model", "records still referenced"]
                uses: "database.truncate"

            naming: "The Operation names follow the conventions a consumer already knows from REST and from data libraries — create, list, update, delete — rather than Interface-invented names (decided 2026-09-19)."
        category_note: "A Category groups Operations and performs no work of its own. Further Categories are added as further kinds of work appear; which Categories exist is a per-project declaration."
        operation_shape:
          does: "what the consumer gets, in the consumer's terms"
          accepts: "the values the consumer supplies"
          returns: "the Application Outcome shape"
          outcomes: "the expected failures this Operation can produce"
          uses: "the Services and Actions it composes — internal detail, never published"
      services:
        purpose: "The internal parts of Logic, one per Component Logic talks to, named after that Component. Internal only: no consumer names, reaches, or depends on one."
        database:
          name: "Database Service"
          talks_to: "Database Component"
          purpose: "The part of the reasoning that speaks to Database: entering, changing, and reading stored data for the Models."
          actions:
            create: "Create one record for a Model from supplied values."
            update: "Change supplied fields of one existing record."
            enable: "Set the record active, where the Model declares an active state."
            disable: "Set the record inactive, where the Model declares an active state."
            delete: "Remove one record, where the Target authorizes deletion for that Model."
            list: "Return records for a Model under the applicable filters, order, and limit, including a filter on the identifier."
            count: "Return how many records of a Model match the applicable filters."
            sum: "Return the total of one numeric field across the matching records."
            min: "Return the smallest value of one field across the matching records."
            max: "Return the largest value of one field across the matching records."
            truncate: "Remove every record of a Model, leaving its structure in place."
            execute_command: "Perform a data operation the other Actions cannot express, through Database's own capability-restricted command route; never structural, privilege, or migration work."
        planned:
          note: "Further Services arrive with the Components they talk to — MT5, Binance, Log, Report. Each is declared here with its own Actions when its Component exists."
        internal_structure: "Not yet decided. A Service's own layout — how its Actions are organized in files and units — is deliberately left open (2026-09-19)."
      deletion:
        requires_explicit_target_authorization: true
        inferred_from_is_active: false
      pagination:
        enabled: true
        strategy: "cursor"
        default_limit: 50
        maximum_limit: 100
        filtering: "explicitly allowlisted Fields only"
        sorting: "explicitly allowlisted Fields with stable ordering"
      authorization:
        owner: "Logic"
        enabled_when: "Development authentication applies to Logic or Target requires authorization."
      business_rate_limits:
        owner: "Logic"
        source: "Target-defined quotas and eligibility rules"

    runtime:
      configuration:
        contract_owner: "Logic"
        values_source: "Platform Runtime Binding"
        validate_before_readiness: true
        fail_fast_on_missing_required_values: true
        secrets_in_source_or_documentation: false
      reliability:
        finite_timeouts_required: true
        retry:
          bounded: true
          only_safe_or_idempotent_operations: true
          unlimited: false
      observability:
        logging:
          enabled: true
          correlate_with_request_id: true
          include_credentials_or_secrets: false
          include_internal_details_in_external_responses: false
      public_interface:
        external_behaviour: "API Component consumes the Logic Public Interface"
        internal_units_public: false

    verification:
      checks:
        - "isolated Logic tests"
        - "Model Interface contract"
        - "Database Interface contract"
        - "Authentication and authorization when enabled"
        - "Transaction grouping and idempotency when applicable"
        - "Credential and secret exclusion"
        - "application outcomes and safe logging"
      unit_tests_use_live_dependencies: false

  # <!-------------------------------------------- implementation -->
  implementation: {}
