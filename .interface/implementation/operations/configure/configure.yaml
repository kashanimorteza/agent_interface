# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/operations/configure/configure.yaml"
  path_note: "The Preferences layer of the Configure Component."
  purpose: "Configure declares the Config directory and the records generated from their Schemas."
  standard: "Agent Project Interface"
  version: "2.0"
  updated: "2026-09-20"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Configure reads it without writing resolved choices back into it."
  changed_by: "The human, directly. An Agent or Operation must not change these declarations. A missing structural requirement is resolved by the owning Config Schema."
  precedence: "The three Config Schemas and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Configure reads the Config directory and record-to-Schema mappings declared in this file."
  selection: "There is no Configure alternative to select."
  version_resolution: "No entry currently carries a version."
  matching: "There is no Configure entry to match."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Configure selects no profile."
  options: "Empty. Configure supports no alternatives."
  settings: "The Config directory, generated records, and their Schemas."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings:
    config_directory:
      path: ".interface/config/"
      owner: "Configure"
      purpose: "The directory in which Configure creates and reconciles structural Config records."
      preserve_schema_comments: true
    records:
      - name: "Application Config"
        file: "application.yaml"
        schema: ".interface/foundation/schema/application.yaml"
      - name: "Plan Config"
        file: "plan.yaml"
        schema: ".interface/foundation/schema/plan.yaml"
      - name: "State Config"
        file: "state.yaml"
        schema: ".interface/foundation/schema/state.yaml"
