# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/model/preferences.yaml"
  path_note: "The Preferences layer of the Model Component — Model-owned Field defaults and technology-independent implementation conventions."
  purpose: "Defaults for properties of existing Model Fields and conceptual conventions for realizing the Model boundary."
  standard: "Agent Project Interface"
  version: "7.2"
  updated: "2026-09-19"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly. A missing critical Model choice is raised through State."
  precedence: "An explicit Model definition and every applicable Principle take precedence over this file."
  consumption: "Use Model's identity, language, and Platform Reference from its Component Profile in Development Preferences, then resolve the applicable language-owned Technical Purposes and Package Management from Development without assuming that a package is bound to Model. Apply Model Field defaults property by property only to Fields present in the Target definition, then apply the technology-independent implementation conventions in this file. Preserve every explicit property, including false and null, and never write resolved values back into this file."
  selection: "When the Target leaves a Model-owned choice unstated and this file supplies no default, use compatible professional judgment under Model Principles and record a consequential implementation choice with the implementation."
  version_resolution: "This file owns no versioned technology. Development Preferences resolve every versioned technical item assigned to Model."
  matching: "An explicit Target property takes priority. A Preference default applies only to a missing property of an existing Field when the Target leaves that property unstated; otherwise no default applies. A Preference never creates a Field, relationship, or behavior."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns Model's configurable profile and concrete selections."
  options: "Empty. Development catalogues Model's concrete technical alternatives and Platform reference."
  settings: "Technology-independent conventions, grouped by the parts Model Principles name in its Architecture — Domain Definition, Declaration Vocabulary, and Model Foundation — plus Layout and Verification, which span the Component. Target definitions provide each Field and relationship property; this Component adds no inferred Field defaults."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    # ---- Domain Definition ----
    domain_definition:
      validation:
        declarative_constraints_first: true
        custom_validation: "only when declarative constraints are insufficient"
        strictness: "enable when coercion could hide invalid domain data"
      numeric_precision:
        exact_values: "exact decimal representation"
        approximate_values: "only when explicitly permitted by the Target"
      time:
        absolute_instants: "timezone-aware"
        canonical_timezone: "UTC"
        naive_datetime: "only when explicitly required by the Target"

    # ---- Declaration Vocabulary ----
    declaration_vocabulary:
      purpose: "The one standard, technology-independent vocabulary every Domain Definition is expressed in; read by every Component through the Model Public Interface. Database is one consumer."
      field_metadata:
        primary_key: "Marks the field or fields that identify one domain record."
        type: "The logical, technology-independent value type Model resolves from the Target (for example integer, string, decimal, boolean, datetime); no closed list — Model decides; each realization maps it to its own type system."
        length: "Maximum length of a string or binary value when the Target declares it."
        precision: "Total digits and scale of an exact numeric value when the Target declares them."
        auto_increment: "Marks an identity field whose value is generated by persistence."
        unique: "Marks a field whose value must not repeat across persisted records."
        nullable: "States whether persistence may store null for the field."
        default: "Publishes the resolved default value when the Target declares one."
        index: "Publishes an index requirement only when the Target declares it or a declared Target constraint requires it."
      relationship_metadata:
        foreign_key: "Carries the referenced Domain Definition itself together with the field it points at, never that definition's name as text. The realization refers to the definition the way its own language refers to a definition, so a reference that does not resolve fails where it is written. It names no Engine and no ORM."
        cardinality: "Publishes relationship multiplicity and optionality as the Target declares them, stated explicitly on every relationship. A relationship never takes a default multiplicity; where the Target leaves it unstated, the choice is made from the Target and recorded with the implementation."
      model_metadata:
        persistence: "Publishes whether the Domain Definition is persistent or non-persistent, as Model Principle “Every Domain Definition declares whether it is persistent” requires."
        unique_sets: "Publishes composite uniqueness constraints as ordered field-name sets."
      usage: "Entries here describe meaning only, carried by the same Domain Definition that application code uses. Each consumer maps the vocabulary to its own technology; physical mapping, migration, and enforcement are Database's, as Model Principle “Model declares every definition in one standard, technology-independent vocabulary” states."

    # ---- Model Foundation ----
    model_foundation:
      serialization:
        purpose: "The two symmetric conversions every Domain Definition carries, as required by Model Principle “Every Domain Definition converts to and from a Plain Representation”."
        capabilities:
          serialize: "Produces the Plain Representation of one instance."
          deserialize: "Produces an instance from a Plain Representation."
        naming: "Name the two capabilities for what they do, not for a wire format. The Interface fixes no language-level method name; the selected realization decides the compatible form."
        output_form: "Simple named values — a plain structure of field names and values. Never an encoded text form. Encoding the structure into JSON or any other wire format is the consuming Component's work."
        representation_target: "The plain structure is JSON-compatible: every published value is expressible in JSON without a custom encoder."
        validation_on_input: "Follows Model Principle “Every Domain Definition converts to and from a Plain Representation”: deserialize evaluates the same Intrinsic Rules the Domain Definition applies to any other instance, and fails when the data does not satisfy them, so no construction path from outside skips validation."
        relationships: "A Domain Relationship is published only as its declared foreign-key value. A related Domain Definition is never nested, and one conversion never traverses the relationship graph."
        field_selection: "Follows Model Principle “Every Domain Definition converts to and from a Plain Representation”: every Field of the Domain Definition is published, and no output policy is applied here."
        output_policy_owner: "The consuming Component. API Preferences own which Fields leave an API response, including credential exclusion."
        provided_by: "Model Foundation, as Model Principle “Every Domain Definition converts to and from a Plain Representation” requires. Prefer the Foundation's pair unchanged; override it in a Domain Definition only where that definition's own domain meaning needs a different representation."
        determinism: "Both conversions depend only on the instance's own data, produce the same result for the same input, and perform no external I/O."

    # ---- Layout ----
    layout:
      purpose: "How the separation required by the Principle “Each Domain Definition stands in its own module” is realized in the selected technology. The Principle fixes the separation; this group fixes its shape."
      domain_definition: "One file per Domain Definition, holding that definition and what belongs to it alone, named for the definition in the selected language's own naming standard."
      model_foundation: "Its own file, separate from every Domain Definition."
      public_interface: "One public entry point publishes every Domain Definition under its own identity, so a consumer imports the definition rather than the file it was declared in."
      supporting_content: "A helper, constant, or type used by exactly one Domain Definition lives with it; anything used by more than one belongs to Model Foundation."

    # ---- Verification ----
    verification:
      checks:
        - "public interface"
        - "validation behavior"
        - "serialization behavior"
        - "declaration vocabulary publishing"
        - "module separation: one Domain Definition per module, Model Foundation in its own, every definition reachable through the public entry point"
