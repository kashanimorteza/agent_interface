# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/database/preferences.yaml"
  path_note: "The Preferences layer of the Database Component — persistence defaults, credential treatment, Instances, and implementation conventions."
  purpose: "Database-owned defaults for persistence behavior and runtime storage configuration; concrete technology choices come from Development."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-13"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "An explicit Target value and every applicable Database Principle take precedence over this file."
  consumption: "Resolve Database's Component Profile, language-owned Technical Purposes, Database Item, and Platform Reference from Development first. Apply this file only for Database-owned defaults, credential treatment, Instance configuration, and implementation conventions. Never write resolved values back into this file."
  selection: "Prefer a supported compatible Database-owned default. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "This file owns no versioned Engine, ORM, migration, or package choice. Development Preferences resolve every versioned technical item assigned to Database."
  matching: "Match a selected Database-owned key to its exact entry in this file. Match Engine, ORM, migration, language, package, and Platform selections to their exact entries in Development Preferences. Match Instance identities to storage_adapter.instances and credential defaults by exact field name."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The default Instance, credential at-rest mode, portability preference, Model source, and consumer boundary."
  options: "Database-owned credential at-rest alternatives. Engine, ORM, migration, language, and package alternatives belong to Development."
  settings: "Relationship, initial-data, credential, runtime-configuration, backup, and Instance defaults."
  implementation: "Persistence safety, migration integrity, transaction, controlled-command, security, and observability conventions."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    default_instance: "general"
    portability_policy: "portable contract first; engine-specific extensions explicit"
    model_import_source: "Model Public Interface"
    consumer_access: "public Database Interface only"

  # <!-------------------------------------------- options -->
  options:
    credential_storage_modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
        allowed_for_credentials: false
        use_case: "Only explicitly classified non-credential data."
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "authenticated_reversible_protection"
        recoverable: true
        key_source: "Database's private runtime secret source, delivered through Platform under Development's Runtime Configuration ownership rules; never general configuration or Interface Config."

  # <!-------------------------------------------- settings -->
  settings:
    database_interface: {}

    data_logic:
      initial_data:
        enabled_when_present: true
        importer:
          name: "database_seed"
          entrypoint_source: "Development and the selected implementation"
          invocation_source: "Development and the selected implementation"
          configurable: true
          input_source: "Target Initial Data"
          repeatable: true
          duplicate_policy: "preserve_one_logical_record"
          transaction_boundary: "one transaction per dependency-ordered batch"
      credential_storage:
        resolution: "For an existing field resolved as a credential, require the Model-declared storage mode. Reject a missing or unsupported mode; Database never infers one from a field name."

    storage_adapter:
      runtime_configuration:
        file: "Resolve database.yaml from the fixed Database root defined by Development; the default is database/database.yaml."
        sections:
          engines: "Resolve supported Engine profiles from Development's Database Items and explicit compatible project choices. A profile denotes implemented adapter support, not a claim that its server is running."
          instances: "Resolved entries from storage_adapter.instances or explicit project Instances, keyed by stable identity, with name, purpose, Engine reference, database identity, and applicable non-secret connection settings or secret references."
          default_instance: "The resolved selected.default_instance, or explicit project selection, referring to exactly one configured Instance."
        ownership: "All Database-owned non-secret runtime settings belong in this layer-local file. Cross-layer bindings and secret values retain the locations and delivery rules defined by Development; do not duplicate them here."
        registry: "Build the public Instance Registry from the validated runtime Instance catalogue. Export selectable identities and the default, never raw connections or secret values."
        validation: "Before accepting data operations, validate Engine references and required Instance settings, and require the default to name an existing Instance. Reject an explicit unknown Instance; use the default only when selection is omitted. A connection failure never redirects an operation to another Instance."
        storage_paths: "Resolve file-backed Engine storage locations relative to the Database Component root and independent of process working directory. Under the default file-backed profile, data remains under data/. Server-backed Engines keep physical data on their configured server."
      backups:
        enabled: "environment-managed"
        required_for_irreversible_migrations: true
        restore_verification: "required before production use"
      instance_defaults:
        naming:
          key: "<role>"
          name: "<project> <role>"
          database: "<project>_<role>"
          normalization: "lower_snake_case"
        connection:
          host: "localhost"
          port: "engine_default"
        secrets:
          source: "Database's private runtime secret source delivered through Platform, overridden only by declared names from the runtime environment."
          username: "<PROJECT>_<INSTANCE>_DATABASE_USERNAME"
          password: "<PROJECT>_<INSTANCE>_DATABASE_PASSWORD"
          store_values_in_configuration: false
      instances:
        general:
          name: "<project> General"
          purpose: "General application data."
          engine: "<development.database_item>"
          database: "<project>_general"

  # <!-------------------------------------------- implementation -->
  implementation:
    mapping:
      persistent_model_required: true
      non_persistent_models_become_storage: false
      portable_contract_first: true
      engine_specific_extensions_must_be_declared: true
    migrations:
      integrity_marker: "checksum"
      drift_detection: "before normal operations"
      concurrent_runner_coordination: "engine-supported lock"
      irreversible_migration_requires: "explicit marker, verified backup, and recovery procedure"
      startup_schema_creation: true
      initial_data_required_when_declared: true
    transactions:
      isolation: "engine-resolved and explicitly recorded"
      concurrency: "optimistic version check unless the resolved operation requires locking"
      retry_transient_conflicts: true
      retry_requires_idempotency: true
      distinguish_failures:
        - "deadlock"
        - "serialization_failure"
        - "timeout"
        - "connection_failure"
    controlled_commands:
      enabled: true
      capability_restricted: true
      parameterization_required: true
      identifiers: "internal allow-list or typed operation definition"
      structural_changes: false
      privilege_changes: false
      migration_commands: false
      protected_output: true
      separately_observable: true
    security:
      runtime_least_privilege: true
      secrets_in_logs: false
      credential_storage_exposed: false
      backups_follow_data_protection: true
    observability:
      record_connection_failures: true
      record_migration_failures: true
      record_constraint_violations: true
      record_transaction_conflicts: true
      record_protected_data_access_without_values: true
