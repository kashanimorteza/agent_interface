# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/presentation/presentation.yaml"
  path_note: "The Preferences layer of the Presentation Component — supported technical choices and defaults used when a Presentation choice is unstated."
  purpose: "Defaults and supported Theme, technical, and layer settings for the Presentation package."
  standard: "Agent Project Interface"
  version: "5.1"
  updated: "2026-09-25"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Presentation choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Presentation Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read component and packages for Presentation's technical selection, then resolve Presentation-owned defaults from this file and the current project definition. Use a Development Default only when this file leaves a shared choice unstated."
  selection: "Prefer a supported compatible Presentation-owned option. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "This file resolves versions for Presentation-owned packages. Development resolves versions only for its shared Defaults."
  matching: "Match each Presentation-owned selected key to its option entry. An explicit project value takes priority over the selection recorded here."




# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "component"
  - "capabilities"
  - "packages"
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  component: "Presentation type, language, and platform."
  capabilities: "Component capabilities that are currently inactive."
  packages: "Presentation-owned package selections."
  selected: "The Presentation-owned Theme."
  options: "Supported Presentation-owned Themes."
  settings: "Component directory and package name, plus configuration grouped by the Presentation, Interaction Logic, and API Access layers."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- component -->
  component:
    type: "executable"
    language: "TypeScript"
    platform: "VPS"

  # <!-------------------------------------------- capabilities -->
  capabilities:
    testing: false
    error_handling: false
    logging: false
    encryption: false

  # <!-------------------------------------------- packages -->
  packages:
    user_interface:
      name: "React"
      package: "react"
      version: "latest-compatible"
      component_style: "Function components"
    application_framework:
      name: "Next.js"
      package: "next"
      version: "latest-compatible"
      user_interface: "React"
      router: "App Router"
      run: "npm run dev"
    api_client:
      name: "Fetch"
      package: null
      version: "runtime-provided"

  # <!-------------------------------------------- selected -->
  selected:
    theme: "Default"

  # <!-------------------------------------------- options -->
  options:

    themes:
      Default:
        version: "1.0"
        color_mode: "system"
        direction: "auto"
        token_based: true

  # <!-------------------------------------------- settings -->
  settings:

    component:
      directory: "presentation"
      package: "trading-assistant-presentation"

    interaction_logic:
      state_management: "framework-native"

    api_access:
      contract_source: "api_openapi_description"
      generated_types: true
