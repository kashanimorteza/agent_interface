# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/presentation/presentation.yaml"
  path_note: "The Preferences layer of the Presentation Component — supported technical choices and defaults used when a Presentation choice is unstated."
  purpose: "Defaults and supported Theme and layer settings for the Presentation package. Development selects the language, user-interface library, framework, and API client."
  standard: "Agent Project Interface"
  version: "5.0"
  updated: "2026-09-13"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Presentation choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Presentation Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Operations resolve Presentation's language, user-interface library, framework, and API client from its Development Component Profile and the matching Development technical catalogue. They resolve Presentation-owned defaults from this file and the current project definition."
  selection: "Prefer a supported compatible Presentation-owned option. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Development resolves versions for the selected language, user-interface library, framework, and API client. This file resolves versions only for Presentation-owned options."
  matching: "Match each Presentation-owned selected key to its option entry. An explicit project value takes priority over the selection recorded here."




# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The Presentation-owned Theme. Development selects the language, user-interface library, application framework, package manager, and API client through Presentation's Component Profile and Language Item."
  options: "Supported Presentation-owned Themes."
  settings: "Configuration grouped by the Presentation, Interaction Logic, and API Access layers."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    theme: "Default"

  # <!-------------------------------------------- options -->
  options:

    themes:
      Default:
        version: "1.0"
        color_mode: "system"
        direction: "auto"
        token_based: true

  # <!-------------------------------------------- settings -->
  settings:

    interaction_logic:
      state_management: "framework-native"

    api_access:
      contract_source: "api_openapi_description"
      generated_types: true
