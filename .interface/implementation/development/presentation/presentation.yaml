# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/presentation/presentation.yaml"
  path_note: "The Preferences layer of the Presentation Component."
  purpose: "Identity, the entities of architecture with API Access, Theme, Interaction Logic, and documentation choices, and the language profile for Presentation."
  standard: "Agent Project Interface"
  version: "9.0"
  updated: "2026-10-12"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Presentation choices back into it."
  changed_by: "The human, directly."
  precedence: "An explicit project value and every applicable Presentation Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order; realize the entities of architecture through the selected language profile in development. Use a Development Default only when this file leaves a shared choice unstated."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file resolves versions for Presentation-owned packages. Development resolves versions only for its shared Defaults."
  matching: "Match each Presentation-owned selected key to its option entry. An explicit project value takes priority over the selection recorded here."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - architecture
  - development

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Presentation's identity: type, platform, directory, and package."
  architecture: "The entities of the Architecture tree — Interaction Logic with its state management, API Access with its contract source and type generation, Theme with the selected Theme and its supported options, Areas with the API Group, Section naming, and the Entity and field sources of every Area, and Documentation with its file, location, and format."
  development: "Development capabilities and the selected language with its packages."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: executable
      platform: VPS
      directory: presentation
      package: presentation

  # <!-------------------------------------------- architecture -->
  architecture:
    entities:
      interaction_logic:
        state_management: framework-native
      api_access:
        contract_source: api_openapi_description
        generated_types: true
      theme:
        selected: Default
        options:
          Default:
            version: '1.0'
            color_mode: system
            direction: auto
            token_based: true
      areas:
        entity:
          api_group: entity
          section_naming: <entity>
          entity_source: model_entity_collection
          field_source: model_entity_declaration
      documentation:
        file: README.md
        location: the Component root
        format: markdown

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
      encryption: false
    language:
      selected: typescript
      options:
        typescript:
          name: TypeScript
          packages:
            user_interface:
              name: React
              package: react
              version: latest-compatible
              component_style: Function components
            application_framework:
              name: Next.js
              package: next
              version: latest-compatible
              user_interface: React
              router: App Router
              run: npm run dev
            api_client:
              name: Fetch
              package: null
              version: runtime-provided
          framework_layout: Directories the selected framework requires, such as the Next.js App Router app directory, hold only what the framework needs and import from view/, interaction/, api/, and theme/; no layer moves out of its own directory.
          areas: Each Area is a route segment named by its key, and each Section a route beneath it named by its Adapter, such as /entity/user; the route files only import the Section's page from areas/.
