# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/groups/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Group inside the API Component."
  purpose: "Configurable names and external realization defaults for the fixed Entity Group Role."
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-29"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Group choices back into it."
  changed_by: "The human, directly. A missing critical Entity Group choice is raised through State."
  precedence: "Explicit compatible Target meaning and every applicable Entity Group, API, Logic, and Entity Service Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings first to preserve the fixed API owner and Entity Group Role while resolving the configurable Group name. Read the referenced Entity Service Preferences to validate publish_in_logic_interface and generate_api, then read Entity Service Interface through Logic Interface to derive Resources and callable Action membership. Read layout, routing, queries, contract, and documentation for Entity Group-owned defaults."
  selection: "Use these defaults when Target is silent. Preserve explicit compatible Target choices. Leave unstated HTTP methods, schema realization, pagination representation, and other package mechanics to the selected API package or implementation skill and record the resulting external contract."
  version_resolution: "Entity Group introduces no independently versioned technology; versions resolve through API and Development Preferences."
  matching: "Match the Group to the fixed Entity Service identity, each Resource to one Entity Child Service, and each Endpoint to one API-enabled callable Action. Reject unknown overrides, invalid identities, and collisions without silent repair."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the fixed API owner and Entity Group Role, resolve its configurable name, and validate Entity Service eligibility."
  - "layout: resolve the Group directory, Router and Adapter directories, and Entity resource pattern."
  - "routing: resolve Entity Group route defaults and any explicit compatible overrides."
  - "queries: resolve bounded collection defaults for supported Entity Actions."
  - "contract: resolve Group-specific external contract choices."
  - "documentation: resolve detailed Entity Group documentation."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - routing
  - queries
  - contract
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: "api"
    group:
      role: "entity"
      name: "Entity"
    source:
      logic_service_role: "entity"
      required_publish_in_logic_interface: true
      required_generate_api: true
    endpoints:
      callable_actions_default_generate_api: true

  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    directory: "entity"
    directories:
      router: "router"
      adapter: "adapter"
    patterns:
      resource: "<entity>"

  # <!-------------------------------------------- routing -->
  routing:
    group_prefix: "/entity"
    action_path: "/<entity>/<action>"
    realization_defaults_source: "selected API package or implementation skill"
    overrides: {}

  # <!-------------------------------------------- queries -->
  queries:
    pagination:
      default_limit: 50
      maximum_limit: 100
      representation_source: "matching Entity Action and selected API package or implementation skill"
    overrides: {}

  # <!-------------------------------------------- contract -->
  contract:
    schemas:
      source: "published Entity Action contracts"
      realization_source: "selected API package or implementation skill unless Target overrides"
    outcomes:
      success_envelope: false
      unexpected_failure_request_id: true

  # <!-------------------------------------------- documentation -->
  documentation:
    audience: "external consumers of Entity capabilities"
    order:
      - overview
      - resources
      - endpoints
      - requests
      - responses
      - failures
      - collections
      - examples
    sections:
      resources: "Document every generated Entity Resource from its published Entity Child Service without copying Model definitions or Logic implementation."
      endpoints: "Document every generated Endpoint under its Entity Resource, including purpose, accepted request, returned response, and declared failures."
      examples: "Provide runnable consumer examples without exposing private API, Logic, Model, Database, framework, or package implementation details."
