# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/groups/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Group inside the API Component."
  purpose: "Configurable Entity Group names, Resource Adapter layout, and fixed Endpoints."
  standard: "Agent Project Interface"
  version: "2.5"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Group choices back into it."
  changed_by: "The human, directly. A missing critical Entity Group choice is raised through State."
  precedence: "Explicit compatible project meaning and every applicable Entity Group, API, Logic, and Entity Service Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings to identify Entity Group; read layout to resolve the Group directory and Adapter filenames; follow Entity Group Definition to create one Resource Adapter file directly inside the Group directory for every Entity presented by Entity Service; then place every fixed Endpoint and Handler in every Adapter."
  selection: "Preserve explicit compatible project choices. Use these Preferences for unstated Entity Group names and Endpoint mappings. Do not add, remove, or reinterpret an Entity Operation outside the fixed catalogue."
  version_resolution: "Entity Group introduces no independently versioned technology."
  matching: "Match every Resource Adapter to exactly one Entity presented by Entity Service and every Endpoint to the corresponding Logic Action. Reject missing Logic Actions, invalid identities, and final Method-and-Path collisions without silent repair."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Entity Group and resolve its Group name."
  - "layout: resolve the Group directory and Resource Adapter filename pattern."
  - "endpoints: create the fixed Endpoint and Handler catalogue used by every Adapter."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - endpoints

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    group:
      component: "api"
      role: "entity"
      name: "Entity"

  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    directory: "entity"
    patterns:
      adapter: "<resource>"

  # <!-------------------------------------------- endpoints -->
  endpoints:
    catalogue:
      add:
        entity_operation: "add"
        logic_action: "add"
        method: "POST"
        path: "/add"
        parameters:
          body:
            resource:
              required: true
              value: "a value of the Adapter's bound Entity Resource"
      update:
        entity_operation: "update"
        logic_action: "update"
        method: "PUT"
        path: "/update/{id}"
        parameters:
          path:
            id:
              required: true
          body:
            resource:
              required: true
              value: "a value of the Adapter's bound Entity Resource"
      list:
        entity_operation: "list"
        logic_action: "list"
        method: "GET"
        path: "/list"
        parameters:
          query:
            filters:
              required: false
            filter_combination:
              required: false
            orders:
              required: false
            limit:
              required: false
      delete:
        entity_operation: "delete"
        logic_action: "delete"
        method: "DELETE"
        path: "/delete/{id}"
        parameters:
          path:
            id:
              required: true
      enable:
        entity_operation: "enable"
        logic_action: "enable"
        method: "PATCH"
        path: "/enable/{id}"
        parameters:
          path:
            id:
              required: true
      disable:
        entity_operation: "disable"
        logic_action: "disable"
        method: "PATCH"
        path: "/disable/{id}"
        parameters:
          path:
            id:
              required: true
      get_by_id:
        entity_operation: "get_by_id"
        logic_action: "get_by_id"
        method: "GET"
        path: "/get_by_id/{id}"
        parameters:
          path:
            id:
              required: true
      count:
        entity_operation: "count"
        logic_action: "count"
        method: "GET"
        path: "/count"
        parameters:
          query:
            filters:
              required: false
            filter_combination:
              required: false
      sum:
        entity_operation: "sum"
        logic_action: "sum"
        method: "GET"
        path: "/sum"
        parameters:
          query:
            field:
              required: true
            filters:
              required: false
            filter_combination:
              required: false
      min:
        entity_operation: "min"
        logic_action: "min"
        method: "GET"
        path: "/min"
        parameters:
          query:
            field:
              required: true
            filters:
              required: false
            filter_combination:
              required: false
      max:
        entity_operation: "max"
        logic_action: "max"
        method: "GET"
        path: "/max"
        parameters:
          query:
            field:
              required: true
            filters:
              required: false
            filter_combination:
              required: false
      truncate:
        entity_operation: "truncate"
        logic_action: "truncate"
        method: "DELETE"
        path: "/truncate"
        parameters: {}
