# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/groups/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Group inside the API Component."
  purpose: "Configurable Entity Group names, Adapter layout, and default Action Mappings."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Group choices back into it."
  changed_by: "The human, directly. A missing critical Entity Group choice is raised through State."
  precedence: "Explicit compatible project meaning and every applicable Entity Group, API, Logic, and Entity Service Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings to identify Entity Group; read layout to resolve its directory and Adapter filename pattern; when Entity Service publication and Service-level API generation are enabled, create one Adapter directly inside the Group directory for every Entity Child Service presented through Logic Interface; create one Endpoint for every Action of that Child Service; then apply action_mappings or the POST /<action> fallback."
  selection: "Preserve explicit compatible project choices. Use these Preferences for unstated Entity Group names, layout names, and known Action Mappings. A compatible Target may override a default Method or Path without changing its destination Action or Behaviour."
  version_resolution: "Entity Group introduces no independently versioned technology."
  matching: "Match every Adapter to exactly one Entity Child Service and every Endpoint to exactly one Action presented by that Child Service. Derive Adapter and Entity URL identities from the bound Entity rather than a language-specific Child Service structure name. Reject invalid identities and final Method-and-Path collisions without silent repair."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Entity Group and resolve its Group name."
  - "layout: resolve the Group directory and Entity Adapter filename pattern."
  - "action_mappings: apply known Method and Path mappings; use POST /<action> for every unmapped Action."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - action_mappings

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    group:
      role: "entity"
      name: "Entity"

  # <!-------------------------------------------- layout -->
  layout:
    directory: "entity"
    patterns:
      adapter: "<entity>"

  # <!-------------------------------------------- action_mappings -->
  action_mappings:
    add:
      method: "POST"
      path: "/add"
    update:
      method: "PUT"
      path: "/update/{id}"
    list:
      method: "GET"
      path: "/list"
    delete:
      method: "DELETE"
      path: "/delete/{id}"
    enable:
      method: "PATCH"
      path: "/enable/{id}"
    disable:
      method: "PATCH"
      path: "/disable/{id}"
    get_by_id:
      method: "GET"
      path: "/get_by_id/{id}"
    count:
      method: "GET"
      path: "/count"
    sum:
      method: "GET"
      path: "/sum"
    min:
      method: "GET"
      path: "/min"
    max:
      method: "GET"
      path: "/max"
    truncate:
      method: "DELETE"
      path: "/truncate"
