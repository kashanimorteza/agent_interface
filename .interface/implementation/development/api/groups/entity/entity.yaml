# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/groups/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Group inside the API Component."
  purpose: "Name, Interface Schema reference, architecture, and documentation for Entity Group."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-10-05"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Group choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable Entity Group Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - interface
  - architecture
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Entity Group's role and configurable name."
  interface: "The API Group Interface Schema this Group follows, and its version."
  architecture: "The Group directory and the Adapter naming pattern."
  documentation: "The documentation file, its location, its section order, and the content of each section."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    group:
      role: "entity"
      name: "Entity"

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/api-group-interface.yaml"
    contract_version: "1.0"

  # <!-------------------------------------------- architecture -->
  architecture:
    directory: "entity"
    patterns:
      adapter: "<entity>"

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Entity Group directory"
    format: "markdown"
    order:
      - overview
      - endpoints
      - use
      - verify
    sections:
      overview: "What Entity Group is, in one paragraph, with one request example."
      endpoints: "Every Entity's Endpoints with Method, Path, and Parameters, each with one example."
      use: "How a client calls an Endpoint."
      verify: "How to see that every Entity and Action has its Endpoint."
