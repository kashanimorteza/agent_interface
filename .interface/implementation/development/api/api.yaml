# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/api.yaml"
  path_note: "The Preferences layer of the API Component."
  purpose: "Configurable defaults for API identity, layout, Groups, realization, network, runtime, lifecycle, and documentation."
  standard: "Agent Project Interface"
  version: "8.0"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved API choices back into it."
  changed_by: "The human, directly. A missing critical API choice is raised through State."
  precedence: "Explicit compatible project meaning and every applicable API Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings and layout; resolve the selected language and its packages; follow every Group Definition and Preferences reference; derive the Base URL from network values; then apply identity, runtime, lifecycle, and documentation defaults. Generate config.yaml according to the referenced API Configuration Structure."
  selection: "Preserve explicit compatible project choices. Use these Preferences for unstated API choices. A package may choose mechanics left unstated here but may not change the responsibilities or URL structure declared by API Definition."
  version_resolution: "Resolve latest-compatible to a concrete mutually compatible package version at implementation time and preserve every explicit compatible version."
  matching: "Match Groups by their exact configured identities and referenced files. Reject missing, stale, invalid, or colliding references without silent repair. Derive url from transport_protocol, host, port, and the optional key instead of resolving it independently."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify API and its configuration structure."
  - "layout: resolve Bootstrap, Groups, configuration, and documentation names."
  - "development: resolve the default language and its API-owned packages."
  - "groups: follow every Group Definition and Preferences reference."
  - "network: resolve transport_protocol, host, port, optional key, and derived url."
  - "identity: resolve title, description, and the non-routing API version."
  - "runtime: resolve the worker count."
  - "lifecycle: resolve OpenAPI, interactive docs, and ReDoc runtime paths."
  - "documentation: resolve file-based API documentation."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - development
  - groups
  - network
  - identity
  - runtime
  - lifecycle
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "executable"
      platform: "VPS"
      directory: "api"
      package: "api"
    configuration:
      file: "config.yaml"
      structure: ".interface/foundation/schema/api.yaml"

  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    directories:
      groups: "groups"
    files:
      bootstrap: "bootstrap"
      configuration: "config.yaml"
      documentation: "README.md"
    patterns:
      group: "<group>"

  # <!-------------------------------------------- development -->
  development:
    languages:
      default: "Python"
      python:
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
        api:
          package:
            name: "FastAPI"
            package: "fastapi[standard]"
            version: "latest-compatible"
            skill: "fastapi"
            middleware:
              cors:
                name: "CORSMiddleware"
                allow_origins: ["*"]
                allow_credentials: false
                allow_methods: ["*"]
                allow_headers: ["*"]

  # <!-------------------------------------------- groups -->
  groups:
    entity:
      definition: "groups/entity/entity.md"
      preferences: "groups/entity/entity.yaml"

  # <!-------------------------------------------- network -->
  network:
    transport_protocol: "HTTP"
    host: "127.0.0.1"
    port: 8000
    key: ""
    url: "http://127.0.0.1:8000"

  # <!-------------------------------------------- identity -->
  identity:
    title: "Target API"
    description: ""
    version: "1.0.0"

  # <!-------------------------------------------- runtime -->
  runtime:
    workers: 2

  # <!-------------------------------------------- lifecycle -->
  lifecycle:
    openapi:
      path: "/schema"
    docs:
      path: "/docs"
    redoc:
      path: "/redoc"

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    audience: "API consumers"
    order:
      - overview
      - groups
      - setup
      - use
      - troubleshooting
    sections:
      groups: "Introduce every registered Group without creating separate Group documentation; runtime API documentation is produced by the selected API package from registered Endpoints."
