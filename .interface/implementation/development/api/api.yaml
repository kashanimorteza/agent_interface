# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/api.yaml"
  path_note: "The Preferences layer of the API Component — configurable defaults shared by its complete external boundary."
  purpose: "Configurable defaults for API identity, root layout, Group references, shared realization, lifecycle, and root documentation."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-09-29"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved API choices back into it."
  changed_by: "The human, directly. A missing critical API choice is raised through State."
  precedence: "Explicit compatible Target meaning and every applicable API Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings and layout first. Read every Group Definition and Preferences reference under groups, let each pair resolve its own source, structure, capabilities, and external contract, then compose all resolved Groups through the shared API boundary. Apply shared transport, contract, request, lifecycle, and documentation defaults only after Group resolution. Use Development Defaults only when this file leaves a shared realization choice unstated."
  selection: "Preserve explicit compatible Target choices. Use these Preferences only for unstated API-wide choices. Leave package mechanics to the selected package or implementation skill when Target is silent. Never use a root API choice to redefine a Group-owned contract."
  version_resolution: "API Preferences resolve API-owned packages. Development resolves only shared Defaults."
  matching: "Match Groups by their exact configured identity and referenced files. Reject missing, stale, invalid, or colliding references without silent repair."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify API and its generated Component root."
  - "layout: resolve Bootstrap, Core, Groups, configuration, and documentation names."
  - "development: resolve the default language and API-owned package choices."
  - "groups: follow every Group Definition and Preferences reference."
  - "transport: resolve API-wide external transport and CORS policy."
  - "contract: resolve shared external identity and versioning."
  - "requests: resolve shared observable request tracking."
  - "lifecycle: resolve mandatory health and readiness paths."
  - "documentation: resolve root external-consumer documentation."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - development
  - groups
  - transport
  - contract
  - requests
  - lifecycle
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "executable"
      platform: "VPS"
      directory: "api"
      package: "api"

  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    directories:
      core: "core"
      groups: "groups"
    files:
      bootstrap: "bootstrap"
      configuration: "config.yaml"
      documentation: "README.md"
    patterns:
      group: "<group>"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      default: "Python"
    packages:
      python:
        api:
          name: "FastAPI"
          package: "fastapi[standard]"
          version: "latest-compatible"
          skill: "fastapi"

  # <!-------------------------------------------- groups -->
  groups:
    entity:
      definition: "groups/entity/entity.md"
      preferences: "groups/entity/entity.yaml"

  # <!-------------------------------------------- transport -->
  transport:
    selected: "HTTP"
    cors:
      enabled: false
      allowed_origins: []

  # <!-------------------------------------------- contract -->
  contract:
    application:
      title: "Target API"
      description: ""
    versioning:
      enabled: true
      initial_version: "v1"
      strategy_source: "selected package or implementation skill unless Target overrides"
    authentication:
      enabled: false

  # <!-------------------------------------------- requests -->
  requests:
    error_tracking:
      enabled: true

  # <!-------------------------------------------- lifecycle -->
  lifecycle:
    runtime_bindings_source: "Platform"
    health:
      path: "/health"
    readiness:
      path: "/ready"

  # <!-------------------------------------------- documentation -->
  documentation:
    location: "the Component root"
    format: "markdown"
    audience: "external consumers"
    order:
      - overview
      - groups
      - lifecycle
      - setup
      - use
      - troubleshooting
    sections:
      groups: "Introduce every enabled Group from its referenced Definition and Preferences and link to its detailed generated contract without copying that contract into root documentation."
