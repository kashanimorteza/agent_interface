# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/api/api.yaml"
  path_note: "The Preferences layer of the API Component — configurable defaults for its public boundary and realization."
  purpose: "Configurable defaults for API identity, layout, Group realization, transport contract, collections, lifecycle, and documentation."
  standard: "Agent Project Interface"
  version: "6.0"
  updated: "2026-09-29"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved API choices back into it."
  changed_by: "The human, directly. A missing critical API choice is raised through State."
  precedence: "Explicit compatible Target meaning and every applicable API Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings and layout first. Read Logic Interface and every referenced Logic Service Preference to resolve Group eligibility from publish_in_logic_interface and generate_api. Resolve callable Action membership from each Service Interface and its Action generate_api setting. Then apply API-owned Group overrides, transport, contract, request, query, lifecycle, and documentation defaults. Use Development Defaults only when this file leaves a shared realization choice unstated."
  selection: "Preserve explicit compatible Target choices. Use these Preferences only for unstated API-owned choices. Leave package mechanics to the selected package or implementation skill. Raise a missing required Endpoint method or another unresolved public-contract choice instead of guessing it."
  version_resolution: "API Preferences resolve API-owned packages. Development resolves only shared Defaults."
  matching: "Match Groups to stable Logic Service identities and Endpoints to stable callable Action identities. Reject stale overrides, ineligible Services, invalid names, and collisions without silent repair."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify API and its generated Component root."
  - "layout: resolve Bootstrap, Core, Groups, Group layers, configuration, and documentation names."
  - "development: resolve the default language and API-owned package choices."
  - "groups: derive eligible Groups and Endpoints from Logic, then apply API-owned overrides."
  - "transport: resolve the shared external transport and CORS policy."
  - "contract: resolve external identity and versioning."
  - "requests: resolve observable request tracking."
  - "queries: resolve default bounded collection behaviour."
  - "lifecycle: resolve the mandatory health and readiness paths."
  - "documentation: resolve external-consumer documentation."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - development
  - groups
  - transport
  - contract
  - requests
  - queries
  - lifecycle
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "executable"
      platform: "VPS"
      directory: "api"
      package: "trading-assistant-api"

  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    files:
      bootstrap: "bootstrap"
      configuration: "config.yaml"
      documentation: "README.md"
    directories:
      core: "core"
      groups: "groups"
    group_directories:
      router: "router"
      adapter: "adapter"
    patterns:
      group: "<service>"
      resource: "<child_service>"

  # <!-------------------------------------------- development -->
  development:
    language:
      default: "Python"
    packages:
      framework:
        name: "FastAPI"
        package: "fastapi[standard]"
        version: "latest-compatible"
      supporting:
        modeling: "sqlmodel==0.0.47"
        http_testing: "httpx"

  # <!-------------------------------------------- groups -->
  groups:
    source: "Logic Interface and referenced Logic Service Preferences"
    eligibility:
      publish_in_logic_interface: true
      generate_api: true
    endpoints:
      callable_actions_default_generate_api: true
      http_method_required: true
    routing:
      default_group_prefix: "/<group>"
      default_action_path: "/<action>"
      entity_action_path: "/<entity>/<action>"
    overrides: {}

  # <!-------------------------------------------- transport -->
  transport:
    selected: "HTTP"
    cors:
      enabled: false
      allowed_origins: []

  # <!-------------------------------------------- contract -->
  contract:
    application:
      title: "Target API"
      description: ""
    versioning:
      enabled: true
      default_strategy: "path"
      initial_version: "v1"
    authentication:
      enabled: false

  # <!-------------------------------------------- requests -->
  requests:
    error_tracking:
      enabled: true

  # <!-------------------------------------------- queries -->
  queries:
    pagination:
      default_strategy: "cursor"
      default_limit: 50
      maximum_limit: 100
    group_overrides: {}

  # <!-------------------------------------------- lifecycle -->
  lifecycle:
    runtime_bindings_source: "Platform"
    health:
      path: "/health"
    readiness:
      path: "/ready"

  # <!-------------------------------------------- documentation -->
  documentation:
    location: "the Component root"
    format: "markdown"
    audience: "external consumers"
    order:
      - overview
      - groups
      - endpoints
      - requests
      - responses
      - failures
      - collections
      - lifecycle
      - examples
    sections:
      groups: "Introduce every generated API Group and its corresponding published Logic Service without exposing Logic implementation."
      endpoints: "Document every generated Endpoint under its Group, including its purpose, accepted request, returned response, and declared failures."
      examples: "Provide runnable consumer examples without exposing private API, Logic, Model, Database, framework, or package implementation details."
