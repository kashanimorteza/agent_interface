# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/model/model.yaml"
  path_note: "The Preferences layer of the Model Component."
  purpose: "Configurable component, stable Interface realization, architecture, language, Entity defaults, and documentation choices for Model."
  standard: "Agent Project Interface"
  version: "23.0"
  updated: "2026-10-02"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit compatible Target meaning and every applicable Model Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "Resolve Model-owned versioned technical items from the selected language profile in development. Resolve latest-compatible to a concrete compatible version and preserve that resolution in dependency or lock metadata."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - interface
  - architecture
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Model's identity, the default properties of id and is_active, and the recognized Sensitivity Markers."
  interface: "The Model Interface Schema version and the names of the published symbols."
  architecture: "The physical names of Model's directories and files."
  development: "Development capabilities, the selected language and its realization profile, and the selected generated-identifier algorithm with its alternatives."
  documentation: "The documentation file, its section order, the content of each section, and the rules every section follows."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: library
      directory: model
      package: model
    entity:
      defaults:
        identity:
          type: integer
          nullable: false
          immutable: true
          value_generation: auto_increment
        activity:
          type: boolean
          nullable: false
          default: true
          immutable: false
      sensitivity_markers:
      - password
      - sensitive

  # <!-------------------------------------------- interface -->
  interface:
    schema: .interface/foundation/schema/model-interface.yaml
    contract_version: '2.1'
    symbols:
      entity_collection: entities
      entity_declaration: declaration

  # <!-------------------------------------------- architecture -->
  architecture:
    directories:
      entity: entity
      core: core
    files:
      interface: interface
      declaration: declaration
      foundation: foundation

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: python
      options:
        python:
          naming:
            entity: PascalCase
            fields: snake_case
            modules: snake_case
          symbols:
            declaration: Declaration
            foundation: Foundation
          types:
            string: {python: str, json: string}
            integer: {python: int, json: number}
            float: {python: float, json: number}
            decimal: {python: decimal.Decimal, json: string, note: never float; the string keeps precision exact}
            boolean: {python: bool, json: true / false}
            datetime: {python: pydantic.AwareDatetime, json: ISO 8601 string with offset, note: always timezone-aware, stored in UTC}
            date: {python: datetime.date, json: ISO 8601 date string}
            time: {python: datetime.time, json: ISO 8601 time string}
            uuid: {python: uuid.UUID, json: string}
          nullable: T | None
          unknown_type: stop and report; never guess
          declaration_access: class attribute
          declaration_kind: frozen dataclass
          pending_value: None
          field_realization: Realize every Field with Field. Value rules (default, nullable, description, value constraints) come from the Field; primary_key, unique, index, and foreign_key are copied from the Entity's Declaration, which stays their only source.
          table_model:
            declaration: Every Entity class is declared with table=True.
            table_name: exactly the Entity name, set through __tablename__
            column_name: exactly the Field name
            construction: The Core base runs model_validate on every direct construction before initializing, because a table model skips validation on construction.
            field_reference: Each Field's class attribute is its public Field reference.
            auto_increment: An auto_increment Identity column carries an Identity construct, and its table sets sqlite_autoincrement to true.
            constraint_names:
              mechanism: SQLAlchemy naming_convention on the shared metadata
              primary_key: pk_<table>
              foreign_key: fk_<table>_<field>
              unique: uq_<table>_<fields joined by _>
              index: ix_<table>_<fields joined by _>
            datetime_column: A datetime Field uses DateTime(timezone=True) and is always stored in UTC; where an Engine drops the offset, the value is read back as UTC-aware.
            column_types: Every other column takes the library's default type for its Python type.
            decimal_column: A decimal Field uses one fixed column type that stores the exact decimal text and returns decimal.Decimal when read, on every Engine.
          declaration_members:
            entity:
              name: name
              description: description
              fields: fields
              primary_key: primary_key
              relations: relations
              uniqueness_constraints: unique_constraints
              indexes: indexes
            relation:
              local_field: local_field
              target_entity: target_entity
              target_field: target_field
          foundation:
            methods:
              to_json: to_json
              from_json: from_json
          modeling:
            package:
              name: SQLModel
              version: latest-compatible
            realization: Implement each Entity as a SQLModel table model whose Fields and metadata realize its Declaration exactly.
            agent_skills:
            - resource: sqlmodel
              requirement: required
              activation: when_selected
              purpose: Apply SQLModel guidance while realizing and reviewing Entities.
    generated_identifier:
      selected: uuid4
      options:
        uuid4: {}
        uuid1: {}
        ulid: {}

  # <!-------------------------------------------- documentation -->
  documentation:
    file: README.md
    location: the Component root
    format: markdown
    order:
    - overview
    - interface
    - declaration
    - foundation
    - setup
    - use
    - verify
    - troubleshooting
    sections:
      overview: Give one concise introduction and one simple example using one Entity.
      interface: Explain the Entity Exports and the Entity Collection, then list every Entity once in Target order with its description, complete Field table, and Entity Metadata outside that table. Show one consumer importing an Entity directly and one enumerating the Entity Collection, rather than using wildcard exports, __all__, reflection, directory scanning, or internal paths.
      declaration: Show how a consumer reads one Entity's public Declaration, including Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, through the Entity itself.
      foundation: Give one example for each Foundation capability, then one complete Entity-to-JSON-text-to-Entity round trip.
      setup: Give the setup steps for the selected technology.
      use: Show use that follows the Entity Exports and the Entity Collection.
      verify: Verify Schema-conformant Interface shape, exact Entity Export membership, Entity Collection membership and order and its correspondence with the Exports, actual Entity and Declaration references, immutability, side-effect freedom, representative Entity construction, Declaration access, and a lossless JSON text round trip.
      troubleshooting: Cover Model concerns only.
    rules:
    - Define no other Component.
    - Expose no private helper as contract.
    - Retain no stale meaning.
    - Contain no real credential or secret.
