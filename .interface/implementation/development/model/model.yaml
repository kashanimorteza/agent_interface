# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/model/model.yaml"
  path_note: "The Preferences layer of the Model Component."
  purpose: "Configurable component, layout, and technical implementation choices for Model."
  standard: "Agent Project Interface"
  version: "13.0"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly. A missing critical Model choice is raised through State."
  precedence: "An explicit Model definition and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Model identity; read layout for Model's configured names and layout; then read Model's development section for capabilities, naming, and technical implementation choices. Use Development Defaults only when Model leaves a shared choice unstated. Preserve every explicit Target property, including false and null, and never write resolved values back into this file."
  selection: "When the Target leaves a Model-owned choice unstated and this file supplies no default, use compatible professional judgment under Model Principles and record a consequential implementation choice with the implementation."
  version_resolution: "Model's development section resolves Model-owned versioned technical items. Development resolves only its shared Defaults."
  matching: "An explicit Target property takes priority. A Preference default applies only to a missing property of an existing Field when the Target leaves that property unstated; otherwise no default applies. A Preference never creates, removes, or renames Target meaning."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the Model Component and its technical selection."
  - "layout: locate Model's Interface, Entity, Declaration, and Foundation layers and their configured names."
  - "development: apply Model capabilities, naming conventions, language, package, and implementation defaults."
  - "documentation: apply the required Model documentation structure and examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
      directory: "model"
      package: "model"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      entity: "entity"
    files:
      interface: "interface"
      declaration: "declaration"
      foundation: "foundation"
    classes:
      declaration: "Declaration"
      foundation: "Foundation"
    foundation:
      methods:
        to_json: "to_json"
        from_json: "from_json"
    casing: "Spell every name in the selected language's own casing standard, and name files and folders by the same standard, as development.languages states it."

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    naming:
      entity: "PascalCase"
      fields: "snake_case"
      modules: "snake_case"
    languages:
      python:
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
          realization: "Implement each Entity as a SQLModel table model and realize its declared Fields and metadata through SQLModel."
  
  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - foundation
      - setup
      - run
      - troubleshooting
    sections:
      overview: "Give one concise example using one Entity."
      interface: "List every public Entity separately and show its Fields in a table. Do not include usage examples in this section."
      foundation: "Give an example for each Foundation capability, then one complete example that uses all Foundation capabilities with one Entity."