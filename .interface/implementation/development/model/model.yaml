# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/model/model.yaml"
  path_note: "The Preferences layer of the Model Component."
  purpose: "Configurable component, stable Interface realization, layout, language, Entity defaults, and documentation choices for Model."
  standard: "Agent Project Interface"
  version: "15.0"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly. A missing critical Model choice is raised through State."
  precedence: "Explicit compatible Target meaning and every applicable Model Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Model identity, platform, and defaults; read interface and its Foundation Schema as the mandatory stable consumer boundary; read layout for physical artifacts; resolve the selected language and its naming, symbols, capabilities, package, and method names from development; then apply documentation preferences. Preserve every explicit Target property, including false and null, and never write resolved values back into this file."
  selection: "Preserve explicit compatible Target choices. Use these Preferences only for choices the Target leaves unstated. Use compatible professional judgment under Model Principles only when neither authority supplies a choice, and record a consequential realization choice with the implementation."
  version_resolution: "Resolve Model-owned versioned technical items from the selected language in development. Resolve latest-compatible to a concrete compatible version and preserve that resolution in dependency or lock metadata."
  matching: "An explicit compatible Target property always takes priority. Every Entity receives the mandatory id and is_active Fields defined by Model; Preferences complete only their missing properties. Every other Field originates in Target. Interface always conforms to the referenced Model Interface Schema: Target Entity changes update EntityCatalog membership only and never replace its fixed structure."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Model, its platform, and the defaults used only when mandatory or Target-declared Field properties are missing."
  - "interface: apply the fixed Model Interface Schema, public symbols, EntityEntry shape, and EntityCatalog capabilities."
  - "layout: resolve the configurable physical names of Model's Interface, Entity, Core, Declaration, and Foundation artifacts."
  - "development: resolve the default language and that language's capabilities, naming, symbols, methods, package, and realization."
  - "documentation: apply the required Model documentation structure and examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - interface
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      platform: "VPS"
      directory: "model"
      package: "model"
    defaults:
      identity:
        type: "integer"
        nullable: false
        immutable: true
        value_generation: "auto_increment"
      activity:
        type: "boolean"
        nullable: false
        default: true
        immutable: false
      value_generation:
        generated_identifier: "uuid4"
        # Alternatives include uuid1 and ulid.

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/model-interface.yaml"
    contract_version: "1.0"
    fixed: true
    publication:
      catalog:
        symbol: "Entities"
        kind: "ready immutable value"
      entry:
        symbol: "EntityEntry"
        kind: "immutable value contract"
      per_entity_root_exports: false
    catalog:
      membership: "Every Target Entity exactly once in Target order"
      immutable_after_load: true
      capabilities:
        entries: "entries"
        get: "get"
        contains: "contains"
        declaration_of: "declaration_of"
    entry:
      members:
        name: "name"
        entity: "entity"
        declaration: "declaration"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      entity: "entity"
      core: "core"
    files:
      interface: "interface"
      declaration: "declaration"
      foundation: "foundation"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    languages:
      default: "Python"
      python:
        naming:
          entity: "PascalCase"
          fields: "snake_case"
          modules: "snake_case"
        symbols:
          declaration: "Declaration"
          foundation: "Foundation"
        foundation:
          methods:
            to_json: "to_json"
            from_json: "from_json"
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
          realization: "Implement each Entity as a SQLModel model and realize its declared Fields and metadata without assigning storage or Table ownership to Model."

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - declaration
      - foundation
      - setup
      - use
      - verify
      - troubleshooting
    sections:
      overview: "Give one concise introduction and one simple example using one Entity."
      interface: "Explain the fixed EntityCatalog and EntityEntry contract, then list every Catalog member once in Target order with its description, complete Field table, and Entity Metadata outside that table. Show consumers using Catalog rather than wildcard exports, __all__, reflection, directory scanning, or internal paths."
      declaration: "Show how a consumer reads one Entity's public Declaration, including Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes."
      foundation: "Give one example for each Foundation capability, then one complete Entity-to-JSON-object-to-Entity round trip."
      verify: "Verify Schema-conformant Interface shape, exact Catalog membership and order, actual Entity and Declaration references, capability behavior, immutability, side-effect freedom, representative Entity construction, and a lossless JSON Object round trip."
