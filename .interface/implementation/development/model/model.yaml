# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/model/model.yaml"
  path_note: "The Preferences layer of the Model Component."
  purpose: "Configurable component, layout, verification, and technical implementation choices for Model."
  standard: "Agent Project Interface"
  version: "12.7"
  updated: "2026-09-25"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly. A missing critical Model choice is raised through State."
  precedence: "An explicit Model definition and every applicable Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read component, layout, and verification for Model's defaults and checks; then read development for technical implementation defaults. Preserve every explicit Target property, including false and null, and never write resolved values back into this file."
  selection: "When the Target leaves a Model-owned choice unstated and this file supplies no default, use compatible professional judgment under Model Principles and record a consequential implementation choice with the implementation."
  version_resolution: "development resolves every versioned technical item assigned to Model."
  matching: "An explicit Target property takes priority. A Preference default applies only to a missing property of an existing Field when the Target leaves that property unstated; otherwise no default applies. A Preference never creates, removes, or renames Target meaning."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "component"
  - "layout"
  - "verification"
  - "development"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  component: "The Model Component's type, language, and platform."
  layout: "Layer-directory defaults and casing."
  verification: "The checks used to verify the Model library."
  development: "The selected Pydantic implementation defaults."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- component -->
  component:
    type: "library"
    language: "Python"
    platform: "VPS"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      public_interface: "public_interface"
      definitions: "entity"
      supporting_content: "supporting"
    casing: "Spell every name in the selected language's own casing standard, and name files and folders by the same standard, as development.languages states it."

  # <!-------------------------------------------- verification -->
  verification:
    checks:
      - "public interface"
      - "direct construction and JSON conversion"
      - "declaration vocabulary publishing"
      - "definition separation: one independent Domain Definition per unit and Model Foundation in its own"

  # <!-------------------------------------------- development -->
  development:
    languages:
      python:
        modeling:
          package:
            name: "pydantic"
            version: "2.x"
            skill: "pydantic"
          guidance:
            project_rules:
              source_of_truth: "Generate each Model from its Domain Definition. Do not add Fields, constraints, defaults, or behavior that the Definition does not declare."
              foundation: "Every Model inherits the shared Foundation. Foundation owns common validation and the two JSON conversion functions; a concrete Model owns only its declared Fields and validation rules."
              definition_unit: "Create one Model class per Domain Definition and place it in its own module under the configured Definitions directory."
              flat_structure: "Do not create nested, recursive, or cross-Model structures."
