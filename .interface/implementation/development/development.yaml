# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/development.yaml"
  path_note: "The Preferences layer of the Development Subsystem — Component Profiles, centralized technical items, Connections, publication, and shared-capability defaults."
  purpose: "Configurable composition and reusable technical defaults applied across Participating Components."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-09-19"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Development choices back into it."
  changed_by: "The human, directly. A missing critical Development choice is raised through State instead of being written into this file."
  precedence: "An explicit Target value and every applicable Development Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Resolve each Component Profile first. Where Development owns a Component's language and platform references, match them to their exact option entries and Platform Launch Items. Component-specific technical preferences are resolved from that Component's own Preferences. Resolve Connections, package publication, and Cross-cutting Capability applicability from settings. Do not write resolved values back into this file."
  selection: "Use the selected compatible Component Profiles and technical items when the Target is silent. For an explicit unlisted or incompatible need, select the smallest well-supported compatible item and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest, latest-compatible, and bounded constraints such as 2.x to a concrete stable version compatible with the complete selected profile; implementation records use the resolved concrete version."
  matching: "Match Components by canonical identifier; languages by exact item key; each platform reference by the exact key of a Platform Launch Item; purpose-specific packages by their exact Technical Purpose key; Connections by their exact consumer and provider identifiers; and Cross-cutting Capability applies_to values by unique canonical Component identifiers."
  additional_dependencies: "A Component may add a compatible supporting dependency when necessary without replacing its selected primary package. Record the resolved dependency with the implementation; a consequential recurring choice is added by the human under the relevant Language Item and Technical Purpose."




# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "One configurable profile per Participating Component, including identity, path, documentation file, role, and any language or Platform reference that Development owns."
  options: "Reusable Language Items with their versions, Package Management, conventions, tools, drivers, and purpose-specific packages. Model- and Database-specific preferences belong to their respective Components."
  settings: "Project-wide naming conventions, documentation rules, Connection defaults, shared package defaults, and Cross-cutting Capability applicability."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    components:
      model:
        name: "model"
        path: "model"
        documentation: "model/README.md"
        role: "Defines the system's shared domain Model."
      database:
        name: "database"
        path: "database"
        documentation: "database/README.md"
        role: "Owns persistence and access to stored data."
      logic:
        name: "logic"
        path: "logic"
        documentation: "logic/README.md"
        type: "library"
        role: "Implements server-side application Behaviour as reusable Logic."
        language: "Python"
        platform: "VPS"
      api:
        name: "api"
        path: "api"
        documentation: "api/README.md"
        type: "executable"
        role: "Publishes the external API and runs the API process."
        language: "Python"
        api: "FastAPI"
        platform: "VPS"
      presentation:
        name: "presentation"
        path: "presentation"
        documentation: "presentation/README.md"
        type: "executable"
        role: "Provides the user-facing application."
        language: "TypeScript"
        user_interface: "React"
        application_framework: "Next.js"
        api_client: "Fetch"
        platform: "VPS"
      platform:
        name: "platform"
        path: "platform"
        documentation: "platform/README.md"
        type: "guideline"
        role: "Defines Launch Items, per-Component runtime requirements, and supporting artifacts."

  # <!-------------------------------------------- options -->
  options:

    languages:
      Python:
        version: "latest-compatible"
        package_management:
          name: "uv"
          version: "latest-compatible"
          lockfile: "uv.lock"
          isolated_environment_directory: ".venv"
          skill_provisioning: "uvx library-skills --claude"
        typing:
          style: "modern Python typing"
          prefer_builtin_generics: true
          prefer_union_operator: true
          nullable_fields: "T | None"
        closed_value_sets:
          reusable_named: "StrEnum"
          small_local: "Literal"
        concept_mappings:
          exact_decimal_representation: "decimal.Decimal"
          timezone_aware_datetime: "datetime.datetime with timezone information"
        quality_tools:
          formatter:
            name: "ruff-format"
            package: "ruff"
            version: "latest-compatible"
          linter:
            name: "ruff"
            package: "ruff"
            version: "latest-compatible"
          type_checker:
            name: "pyright"
            package: "pyright"
            version: "latest-compatible"
          test_runner:
            name: "pytest"
            package: "pytest"
            version: "latest-compatible"
        packages:
          api:
            name: "FastAPI"
            package: "fastapi[standard]"
            version: "latest-compatible"
            supporting_packages:
              validation: "pydantic>=2,<3"
              settings: "pydantic-settings"
              http_testing: "httpx"
          cli:
            name: "Typer"
            package: "typer"
            version: "latest-compatible"
      TypeScript:
        version: "latest-compatible"
        package_management:
          name: "npm"
          version: "latest-compatible"
        packages:
          user_interface:
            name: "React"
            package: "react"
            version: "latest-compatible"
            component_style: "Function components"
          application_framework:
            name: "Next.js"
            package: "next"
            version: "latest-compatible"
            user_interface: "React"
            router: "App Router"
            run: "npm run dev"
          api_client:
            name: "Fetch"
            package: null
            version: "runtime-provided"

  # <!-------------------------------------------- settings -->
  settings:

    # ---- naming ----
    naming:
      storage:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"

    documentation:
      file: "README.md"
      location: "the Component's path root, at the file its Profile's documentation key names"
      format: "markdown"
      order:
        - overview          # what it is, what it does, where it sits
        - interface         # the Public Interface: every Category and Operation, what each accepts and returns, the outcomes it can produce, and a runnable example of calling it
        - setup             # install, configure
        - run               # how to start or use it
        - verify            # how to check it works
        - troubleshooting

    connections:
      presentation_to_api:
        consumer: "presentation"
        provider: "api"
      api_to_logic:
        consumer: "api"
        provider: "logic"
      logic_to_database:
        consumer: "logic"
        provider: "database"
      logic_to_model:
        consumer: "logic"
        provider: "model"
      database_to_model:
        consumer: "database"
        provider: "model"

    packages:
      publish: false

    cross_cutting:
      testing:
        applies_to:
          - "logic"
          - "api"
      logging:
        applies_to:
          - "database"
          - "logic"
          - "api"
          - "presentation"
      error_handling:
        applies_to:
          - "model"
          - "database"
          - "logic"
          - "api"
          - "presentation"
      authentication:
        applies_to:
          - "database"
          - "logic"
          - "api"
          - "presentation"
      encryption:
        applies_to:
          - "model"
          - "database"
          - "logic"
          - "api"
          - "presentation"
