# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/development.yaml"
  path_note: "The Preferences layer of the Development Subsystem — shared defaults, Connections, Application Manifest, and documentation standard."
  purpose: "Configurable shared coordination for the Development Components."
  standard: "Agent Project Interface"
  version: "7.1"
  updated: "2026-09-25"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Development choices back into it."
  changed_by: "The human, directly. A missing critical Development choice is raised through State instead of being written into this file."
  precedence: "An explicit Component Preference and every applicable Development Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the consuming Component's Preferences first. When that Component leaves a shared choice unstated, read Development defaults. Read Connections to resolve direct dependencies, documentation for the shared documentation standard, and application_manifest for the generated Config record. Do not write resolved values back into this file."
  selection: "Use a compatible Development Default only when the Component is silent. For an explicit unlisted or incompatible need, preserve Component and Target intent under the applicable Principles and record the consequential choice; ask only when no safe compatible choice can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve an unpinned version only when it belongs to a Development-owned shared default; each Component resolves versions for its own packages and tools."
  matching: "Match Connections by their exact consumer and provider identifiers. Match a shared default only when the Component has no explicit value for that choice."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "Shared language and platform defaults used only when a Component makes no explicit selection."
  options: "Reusable language standards and quality-tool defaults."
  settings: "The Documentation Standard, direct Connections, and generated Application Manifest configuration."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- defaults -->
  defaults:
    component:
      language: "Python"
      platform: "VPS"

  # <!-------------------------------------------- options -->
  options:
    languages:
      Python:
        version: "latest-compatible"
        package_management:
          name: "uv"
          version: "latest-compatible"
          lockfile: "uv.lock"
          isolated_environment_directory: ".venv"
          skill_provisioning: "uvx library-skills --claude"
        typing:
          style: "modern Python typing"
          prefer_builtin_generics: true
          prefer_union_operator: true
          nullable_fields: "T | None"
        closed_value_sets:
          reusable_named: "StrEnum"
          small_local: "Literal"
        concept_mappings:
          exact_decimal_representation: "decimal.Decimal"
          timezone_aware_datetime: "datetime.datetime with timezone information"
        quality_tools:
          formatter:
            name: "ruff-format"
            package: "ruff"
            version: "latest-compatible"
          linter:
            name: "ruff"
            package: "ruff"
            version: "latest-compatible"
          type_checker:
            name: "pyright"
            package: "pyright"
            version: "latest-compatible"
          test_runner:
            name: "pytest"
            package: "pytest"
            version: "latest-compatible"
      TypeScript:
        version: "latest-compatible"
        package_management:
          name: "npm"
          version: "latest-compatible"

  # <!-------------------------------------------- settings -->
  settings:
    documentation:
      file: "README.md"
      location: "the Component root"
      format: "markdown"
      order:
        - overview
        - interface
        - setup
        - run
        - verify
        - troubleshooting

    connections:
      presentation_to_api:
        consumer: "presentation"
        provider: "api"
      api_to_logic:
        consumer: "api"
        provider: "logic"
      logic_to_database:
        consumer: "logic"
        provider: "database"
      logic_to_model:
        consumer: "logic"
        provider: "model"
      database_to_model:
        consumer: "database"
        provider: "model"

    application_manifest:
      file: ".interface/config/application.yaml"
      sources:
        - "each Component's non-secret public metadata"
        - "declared Connections"
