# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Service inside the Logic Component."
  purpose: "Configurable names and realization defaults for the fixed Entity Role."
  standard: "Agent Project Interface"
  version: "5.0"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Service choices back into it."
  changed_by: "The human, directly. A missing critical Entity Service choice is raised through State."
  precedence: "Explicit Target meaning and every applicable Entity Service, Storage Service, Logic, Model, and Database Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings first to preserve the fixed Logic owner and Entity Role while resolving the configurable Service name, root Interface publication, and Service-level API Group generation; then read layout. Read Entity Service Definition, Model Interface, and Storage Service Interface; derive Child membership from public Model Entities and shared Action membership from Database Entity Operations exposed by Storage. Resolve the language and shared development conventions from Logic Preferences."
  selection: "Use these defaults when the Target is silent. Preserve an explicit compatible Target choice; raise an unresolved incompatible choice rather than inventing one."
  version_resolution: "Entity Service introduces no independently versioned technology; versions resolve through Logic and Development Preferences."
  matching: "Match every Child Service to one authoritative Entity identity from Model Interface and every shared Entity Action to one current Entity Operation Action from Storage Service Interface. Never include ExecuteCommand or a Lifecycle Action in Base Entity. When Service-level API Group generation is enabled, preserve every published Child Service and all of its Actions as the complete eligible Entity API contract. Apply configured patterns with the selected language's normalization, reject invalid or colliding results, and preserve Entity Service Definition."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the fixed Logic owner and Entity Role, then resolve the configurable Service name, publish_in_logic_interface, and Service-level generate_api setting."
  - "layout: resolve its configurable directory, Interface, Base Entity, Child naming patterns, and language-specific realization names."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: "logic"
    service:
      role: "entity"
      name: "Entity"
      publish_in_logic_interface: true
      generate_api: true
  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    naming:
      child_file: "<entity>"
      child_structure: "<entity><child_suffix>"
    directory: "entity"
    files:
      interface: "interface"
      base: "base_entity"
    directories:
      entities: "entity"
    classes:
      base: "BaseEntity"
      child_suffix: "Service"
