# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/entity/entity.yaml"
  path_note: "The Preferences layer of Entity Service inside the Logic Component."
  purpose: "Configurable names and realization defaults for the fixed Entity Role."
  standard: "Agent Project Interface"
  version: "5.1"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Service choices back into it."
  changed_by: "The human, directly. A missing critical Entity Service choice is raised through State."
  precedence: "Explicit Target meaning and every applicable Entity Service, Storage Service, Logic, Model, and Database Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings first to preserve the fixed Logic owner and Entity Role while resolving the configurable Service name, and root Interface publication; then read layout. Read Model Interface through .interface/foundation/schema/model-interface.yaml and derive Child membership only from its Entity Collection; derive shared Action membership from Database Entity Operations exposed by Storage. Resolve language and shared development conventions from Logic Preferences."
  selection: "Use these defaults when the Target is silent. Preserve an explicit compatible Target choice; raise an unresolved incompatible choice rather than inventing one."
  version_resolution: "Entity Service introduces no independently versioned technology; versions resolve through Logic and Development Preferences."
  matching: "Match every Child Service to one Entity of the Entity Collection in its order, bind that actual Entity, and match every shared Entity Action to one current Entity Operation Action from Storage Service Interface. Never interpret Model package exports or include ExecuteCommand or a Lifecycle Action in Base Entity."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the fixed Logic owner and Entity Role, then resolve the configurable Service name, and publish_in_logic_interface."
  - "layout: resolve its configurable directory, Interface, Base Entity, Child naming patterns, and language-specific realization names."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: "logic"
    service:
      role: "entity"
      name: "Entity"
      publish_in_logic_interface: true
  # <!-------------------------------------------- layout -->
  layout:
    names_configurable: true
    naming:
      child_file: "<entity>"
      child_structure: "<entity><child_suffix>"
    directory: "entity"
    files:
      interface: "interface"
      base: "base_entity"
    directories:
      entities: "entity"
    classes:
      base: "BaseEntity"
      child_suffix: "Service"
