# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/entity/entity.yaml"
  path_note: "The Preferences layer of the fixed Entity Role inside the Logic Component."
  purpose: "Name, directory, Interface Schema reference, layout, development, and documentation for Entity Service."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-10-07"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Entity Service choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable Entity Service and Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - interface
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "The fixed Logic owner and Entity Role, and the configurable Service name and directory."
  interface: "The Logic Entity Interface Schema and its version."
  layout: "The physical names of the Interface and Base files, the Entities directory, and the Child naming patterns."
  development: "Development capabilities and the selected language with its realization profile."
  documentation: "The documentation file, its location, its section order, and the content of each section."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: "logic"
    service:
      role: "entity"
      name: "Entity"
      directory: "entity"

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/logic-entity-interface.yaml"
    contract_version: "2.0"

  # <!-------------------------------------------- layout -->
  layout:
    files:
      interface: "interface"
      base: "base"
    directories:
      entities: "entity"
    naming:
      child_file: "<entity>"
      child_structure: "<entity>"
      groups:
        service: "Service"
        model: "Model"
        parameter: "Parameter"
        error: "Error"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          identifier_case: "snake_case"
          structure: "One class BaseEntity in the base file"
          constructor: "__init__ creates one Storage() and keeps it on the instance"
          methods: "One method per Storage method whose first parameter is entity, in the order Storage publishes them, with the method's exact name and docstring. An entity parameter typed as a class is removed and the bound Entity is passed in its place; an entity parameter typed as an instance stays and is checked against the bound Entity, raising InvalidInputError on a mismatch. Every other argument is passed unchanged, in order."
          child: "One file per Entity holding class <Entity>(BaseEntity) with _entity = model.<Entity> from `from model import interface as model`, and only what is specific to that Entity."
          republish: "The interface file publishes four namespace classes named by layout.naming.groups: Service holds every Child class; Model holds the Entity each Child binds, under the Child's name; Parameter holds every non-error contract Storage Interface publishes except Storage; Error holds every error Storage Interface publishes. The interface file holds only these imports, the four namespace classes, and the published list; it performs no check, because conformance belongs to Review."

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Entity Service directory"
    format: "markdown"
    order:
      - overview
      - interface
      - use
      - verify
    sections:
      overview: "What Entity Service is and why it exists, in one paragraph, with one simple example."
      interface: "Every group with its members — every Child Service and its Actions, every Model, every Parameter, and every Error — each with one example."
      use: "How a caller imports a Child Service and how a Child Service adds its own Behaviour."
      verify: "How to see that Entity Service matches Model's Entity Collection and Storage Interface."
