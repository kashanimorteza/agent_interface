# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/storage/storage.yaml"
  path_note: "The Preferences layer of the fixed Storage Role inside the Logic Component."
  purpose: "Name, directory, Interface Schema reference, layout, development, and documentation for Storage Service."
  standard: "Agent Project Interface"
  version: "6.1"
  updated: "2026-10-01"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Storage Service choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable Storage Service and Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - interface
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "The fixed Logic owner and Storage Role, and the configurable Service name and directory."
  interface: "The Logic Storage Interface Schema and its version."
  layout: "The physical names of the Interface and Core files."
  development: "Development capabilities and the selected language with its realization profile."
  documentation: "The documentation file, its location, its section order, and the content of each section."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: "logic"
    service:
      role: "storage"
      name: "Storage"
      directory: "storage"

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/logic-storage-interface.yaml"
    contract_version: "2.2"

  # <!-------------------------------------------- layout -->
  layout:
    files:
      interface: "interface"
      core: "core"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          identifier_case: "snake_case"
          structure: "One class named by settings.service.name, in the core file"
          constructor: "__init__ creates one Database() and keeps it on the instance"
          methods: "One method per Database capability, in the order Database Interface publishes them, with the capability's exact name, signature, and docstring; each calls the kept Database's method with every argument, in order."
          republish: "Every contract is imported directly from Database Interface and republished. The interface file holds only these imports and the published list; it performs no check, because conformance belongs to Review."

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Storage Service directory"
    format: "markdown"
    order:
      - overview
      - interface
      - use
      - verify
    sections:
      overview: "What Storage is and why it exists, in one paragraph, with one simple example."
      interface: "Every Action and every republished contract, each with one example."
      use: "How another Logic Service imports from the Storage Interface."
      verify: "How to see that Storage matches Database Interface."