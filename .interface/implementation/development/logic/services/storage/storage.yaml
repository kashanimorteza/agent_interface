# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/services/storage/storage.yaml"
  path_note: "The Preferences layer of the fixed Storage Role inside the Logic Component."
  purpose: "Name, directory, the entities of architecture with the Interface contract and documentation, and the language profile for Storage Service."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-10-09"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Storage Service choices back into it."
  changed_by: "The human, directly."
  precedence: "Explicit Target meaning and every applicable Storage Service and Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Preserve explicit compatible Target choices. Use these Preferences for choices the Target leaves unstated; for anything still unset, follow Development's resolution order."
  version_resolution: "This file declares no versioned technology."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - architecture
  - development

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "The fixed Logic owner and Storage Role, and the configurable Service name and directory."
  architecture: "The entities of the Architecture tree — Interface with its contract version, and Documentation with its file, location, and format."
  development: "Development capabilities and the selected language with its realization profile."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      role: logic
    service:
      role: storage
      name: Storage
      directory: storage

  # <!-------------------------------------------- architecture -->
  architecture:
    entities:
      interface:
        contract_version: '3.0'
      documentation:
        file: README.md
        location: the Storage Service directory
        format: markdown

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          identifier_case: "snake_case"
          structure: "One class named by settings.service.name, in the core file"
          constructor: "__init__ creates one database_interface() and keeps it on the instance"
          methods: "One method per method of database_interface, in the order Database Interface publishes them, with the capability's exact name, signature, and docstring; each calls the kept Database's method with every argument, in order."
          republish: "The database_value, database_instance, database_result, and database_error groups are imported directly from Database Interface and republished unchanged under their own names. The interface file holds only these imports and the published list; it performs no check, because conformance belongs to Review."
