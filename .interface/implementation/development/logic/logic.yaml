# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/logic.yaml"
  path_note: "The Preferences layer of the Logic Component."
  purpose: "Identity, Interface Schema reference, layout, Service list, development, and documentation for Logic."
  standard: "Agent Project Interface"
  version: "18.0"
  updated: "2026-10-01"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Logic choices back into it."
  changed_by: "The human, directly. A missing critical Logic choice is raised through State."
  precedence: "An explicit Target value and every applicable Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the content sections in read_order."
  selection: "Use a compatible configured default when the Target is silent. Preserve an explicit compatible Target choice; raise an unresolved incompatible choice rather than inventing one."
  version_resolution: "This file resolves versions for Logic-owned packages and tools."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - interface
  - layout
  - services
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Logic's identity: type, platform, directory, and package."
  interface: "The Logic Interface Schema and its version."
  layout: "The physical names of the Services directory and the Interface and documentation files."
  services: "Every Service of Logic, with its Definition and Preferences."
  development: "Development capabilities and the selected language with its realization profile."
  documentation: "The documentation file, its location, its section order, and the content of each section."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      platform: "VPS"
      directory: "logic"
      package: "logic"

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/logic-interface.yaml"
    contract_version: "1.1"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      services: "services"
    files:
      interface: "interface"
      documentation: "README.md"

  # <!-------------------------------------------- services -->
  services:
    entity:
      definition: "services/entity/entity.md"
      preferences: "services/entity/entity.yaml"
    storage:
      definition: "services/storage/storage.md"
      preferences: "services/storage/storage.yaml"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          identifier_case: "snake_case"
          interface: "For every listed Service, `from logic.services.<directory> import interface as <Name>`, then `__all__` with every Name. The interface file holds nothing else and performs no check, because conformance belongs to Review."

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - services
      - setup
      - use
      - verify
      - troubleshooting
    sections:
      overview: "What Logic is and why it exists, in one paragraph, with one simple example."
      interface: "Every name Logic Interface publishes."
      services: "For every Service, its name and links to its README, its Definition, and its Preferences; never a copy of its contract."
      setup: "How to install Logic and what it needs next to it."
      use: "How a consumer imports from Logic Interface."
      verify: "How to see that Logic Interface publishes exactly every listed Service."
      troubleshooting: "Real problems a consumer can meet and how to fix them."
