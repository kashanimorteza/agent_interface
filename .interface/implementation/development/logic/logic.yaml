# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/logic.yaml"
  path_note: "The Preferences layer of the Logic Component — Logic-owned behavioural defaults and internal realization conventions."
  purpose: "Configurable defaults for Logic organization, reliability, and verification."
  standard: "Agent Project Interface"
  version: "13.1"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Logic choices back into it."
  changed_by: "The human, directly. A missing critical Logic choice is raised through State."
  precedence: "An explicit Target value and every applicable Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Logic's identity; then read layout, Services, verification, and development capabilities. Read Connections from Development and resolve environment-specific Runtime Bindings from Platform. Use a Development Default only when this file leaves a shared choice unstated."
  selection: "Use a compatible configured Logic default when the Target is silent. For an explicit incompatible need, preserve Target intent under Logic Principles and record the consequential realization choice; ask only when no safe compatible choice can be established."
  version_resolution: "This file resolves versions for Logic-owned packages and tools. Development resolves versions only for its shared Defaults."
  matching: "Match standards and Logic settings by their exact keys. Create exactly one configured Entity child Service class and file for every Entity published by Model Interface."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Logic."
  - "layout: locate the configured Interface file and Services directory."
  - "services: read each Service, its internal Interface, and its responsibility."
  - "verification: apply Logic verification settings."
  - "development: apply the currently enabled or disabled component capabilities."
  - "documentation: apply the required Logic documentation structure and examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - services
  - verification
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
      directory: "logic"
      package: "logic"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      services: "services"
    files:
      interface: "interface"
      
  # <!-------------------------------------------- services -->
  services:
    entity:
      name: "Entity Service"
      source: "Entity classes published by Model Interface"
      directory: "entity"
      files:
        interface: "interface"
        base: "base"
      directories:
        entities: "entity"
      classes:
        base: "EntityServiceBase"
        child_suffix: "Service"
      purpose: "The Service that handles Entity-bound Database Interface Operations for every Entity published by Model."
      interface: "The internal Service Interface that publishes Entity child Service classes and their Actions, never the base class."
      handling: "EntityServiceBase implements every Database Interface Operation that applies to an Entity. Each Entity child Service inherits those Actions, and only overrides an Action or adds a new Action when its Entity requires special Behaviour."
    database:
      name: "Database Service"
      directory: "database"
      files:
        interface: "interface"
        service: "database"
      classes:
        service: "DatabaseService"
      purpose: "The Service that handles Database Interface Operations that do not concern one Entity."
      interface: "The internal Service Interface that publishes DatabaseService Actions."
      handling: "DatabaseService handles Execute Command."

  # <!-------------------------------------------- verification -->
  verification:
    unit_tests_use_live_dependencies: false

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - services
      - setup
      - use
      - verify
      - troubleshooting
    sections:
      interface: "Document Categories organized by Service and, where applicable, by the Service's classes. Show how a consumer imports the outward Interface. Do not repeat Service Action examples here."
      services: "For every configured Service, document its internal Service Interface and give every Action it handles one complete example. For Entity Service, list every handled Entity; choose one representative Entity, such as User, and give it one complete example for each applicable Database Interface Operation. Those examples are the pattern for the remaining Entities. Document Database Service's Execute Command separately."
