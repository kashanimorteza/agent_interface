# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/logic.yaml"
  path_note: "The Preferences layer of the Logic Component — Logic-owned behavioural defaults and internal realization conventions."
  purpose: "Configurable defaults for Logic organization, reliability, and verification."
  standard: "Agent Project Interface"
  version: "14.0"
  updated: "2026-09-29"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Logic choices back into it."
  changed_by: "The human, directly. A missing critical Logic choice is raised through State."
  precedence: "An explicit Target value and every applicable Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Logic's identity; then read the fixed Interface, Core, Services, configuration, and documentation layout, followed by Services, verification, and development language and capabilities. Read Connections from Development and resolve environment-specific Runtime Bindings from Platform. Use a Development Default only when this file leaves a shared choice unstated."
  selection: "Use a compatible configured Logic default when the Target is silent. For an explicit incompatible need, preserve Target intent under Logic Principles and record the consequential realization choice; ask only when no safe compatible choice can be established."
  version_resolution: "This file resolves versions for Logic-owned packages and tools. Development resolves versions only for its shared Defaults."
  matching: "Match standards and Logic settings by their exact keys. Resolve each Service through the Definition and Preferences references declared under services."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Logic."
  - "layout: locate the fixed Interface, Core, Services, configuration, and documentation members."
  - "services: read each Service reference, then read that Service's Definition and Preferences."
  - "verification: apply Logic verification settings."
  - "development: apply the default language and the currently enabled or disabled component capabilities."
  - "documentation: apply the required Logic documentation structure and examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - services
  - verification
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      platform: "VPS"
      directory: "logic"
      package: "logic"

  # <!-------------------------------------------- layout -->
  layout:
    members_fixed: true
    names_configurable: true
    rule: "Interface publishes Service Interfaces only; shared general files belong in Core; each Service owns one directory under Services. The members are fixed, while these directory and file names are configurable defaults."
    directories:
      core: "core"
      services: "services"
    files:
      interface: "interface"
      configuration: "config.yaml"
      documentation: "README.md"
      
  # <!-------------------------------------------- services -->
  services:
    entity:
      name: "Entity Service"
      fixed: true
      public: true
      definition: "services/entity/entity.md"
      preferences: "services/entity/entity.yaml"
    database:
      name: "Database Service"
      fixed: true
      public: true
      definition: "services/database/database.md"
      preferences: "services/database/database.yaml"

  # <!-------------------------------------------- verification -->
  verification:
    unit_tests_use_live_dependencies: false

  # <!-------------------------------------------- development -->
  development:
    language:
      default: "Python"
    capabilities:
      testing: false
      error_handling: false
      logging: false

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - services
      - setup
      - use
      - verify
      - troubleshooting
    sections:
      interface: "List each configured Service Interface exactly as Logic Interface publishes it under the Service name. Show how a consumer imports a Service Interface. Logic Interface defines no Actions, wrappers, Categories, or duplicated dependency symbols."
      services: "For every configured Service, follow its referenced Definition and Preferences, document its published Interface, and give every capability it handles one complete example without copying the Service contract into Logic documentation."
