# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/logic/logic.yaml"
  path_note: "The Preferences layer of the Logic Component — Logic-owned behavioural defaults and internal realization conventions."
  purpose: "Configurable defaults for Logic organization, reliability, and verification."
  standard: "Agent Project Interface"
  version: "13.1"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Logic choices back into it."
  changed_by: "The human, directly. A missing critical Logic choice is raised through State."
  precedence: "An explicit Target value and every applicable Logic Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Logic's identity; then read layout, Services, runtime behavior, verification, and development capabilities. Read Connections from Development and resolve environment-specific Runtime Bindings from Platform. Use a Development Default only when this file leaves a shared choice unstated."
  selection: "Use a compatible configured Logic default when the Target is silent. For an explicit incompatible need, preserve Target intent under Logic Principles and record the consequential realization choice; ask only when no safe compatible choice can be established."
  version_resolution: "This file resolves versions for Logic-owned packages and tools. Development resolves versions only for its shared Defaults."
  matching: "Match standards and Logic settings by their exact keys. Match Model Logic files to public Entity classes."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Logic."
  - "layout: locate the configured Interface file and Services directory."
  - "services: read each Service, its internal Interface, and its responsibility."
  - "runtime: apply Logic runtime behavior."
  - "verification: apply Logic verification settings."
  - "development: apply the currently enabled or disabled component capabilities."
  - "documentation: apply the required Logic documentation structure and examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - layout
  - services
  - runtime
  - verification
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
      directory: "my_logic"
      package: "my_logic"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      services: "logic_services"
      entity: "entity"
    files:
      interface: "logic_interface"
      
  # <!-------------------------------------------- services -->
  services:
    entity:
      name: "Entity Service"
      source: "Entity classes published by Model Interface"
      files: "Create one file for every published Entity."
      talks_to: ["Model Component", "Database Component"]
      purpose: "The Service that handles Database Interface Operations for each Entity published by Model."
      interface: "The internal Service Interface in each Entity Service file that presents the Operations handled for that Entity."
      handling: "For each Entity file, handle every applicable Operation published by Database Interface. This Service Interface reflects Database's catalogue and contract without redefining either."

  # <!-------------------------------------------- runtime -->
  runtime:
    observability:
      logging:
        enabled: false

  # <!-------------------------------------------- verification -->
  verification:
    checks:
      - "Authentication and authorization, when Development enables them for Logic"
      - "Idempotency, for the Operations the Target selects as sensitive to repetition"
      - "Credential and secret exclusion from outcomes and logs"
    unit_tests_use_live_dependencies: false

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - services
      - setup
      - run
      - verify
      - troubleshooting
    sections:
      interface: "Document Categories organized by Service and show how a consumer imports the outward Interface. Do not repeat Service Operation examples here."
      services: "For every configured Service, document its internal Service Interface and give every Operation it handles one complete example. For Entity Service, list every handled Entity; choose one representative Entity, such as User, and give it one complete example for each applicable Database Interface Operation. Those examples are the pattern for the remaining Entities."
