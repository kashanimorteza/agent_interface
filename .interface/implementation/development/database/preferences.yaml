# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/preferences.yaml"
  path_note: "The Preferences layer of the Database Component — persistence defaults, credential treatment, Instances, and implementation conventions."
  purpose: "Database-owned defaults for persistence behavior and runtime storage configuration; concrete technology choices come from Development."
  standard: "Agent Project Interface"
  version: "10.1"
  updated: "2026-09-19"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "An explicit Target value and every applicable Database Principle take precedence over this file."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Resolve Database's Component Profile, language-owned Technical Purposes, Database Item, and Platform Reference from Development first. Apply this file only for Database-owned defaults, credential treatment, Instance configuration, and implementation conventions. Never write resolved values back into this file."
  selection: "Prefer a supported compatible Database-owned default. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "This file owns no versioned Engine, ORM, migration, or package choice. Development Preferences resolve every versioned technical item assigned to Database."
  matching: "Match a selected Database-owned key to its exact entry in this file. Match Engine, ORM, migration, language, package, and Platform selections to their exact entries in Development Preferences. Match Instance identities to storage_adapter.instances and credential defaults by exact field name."




# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The default Instance and the credential at-rest mode used when the Target states none."
  options: "Database-owned credential at-rest alternatives. Engine, ORM, migration, language, and package alternatives belong to Development."
  settings: "Conventions grouped by the parts Database Principles name in its Architecture — Database Interface, Data Logic and Mapping, and Storage Adapter — plus the subjects that span the Component: migrations, transactions, and controlled commands."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    default_instance: "general"   # the value written into database.yaml; that file is the runtime authority
    credential_at_rest_mode: "hash"   # an entry of options.credential_storage_modes; a credential the Target declares recoverable uses "encrypted"

  # <!-------------------------------------------- options -->
  options:
    credential_storage_modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
        allowed_for_credentials: false
        use_case: "Only explicitly classified non-credential data."
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "authenticated_reversible_protection"
        recoverable: true
        key_source: "database.yaml, under encryption.key, as the Database Configuration Schema defines it. Never Interface Config."

  # <!-------------------------------------------- settings -->
  settings:
    database_interface:
      criteria_shape: "Each operation takes only the criteria it needs, named for the domain rather than for storage."

    data_logic_and_mapping:
      initial_data:
        enabled_when_present: true
        importer:
          mechanism: "reusable, configurable implementation-defined import mechanism"
          configuration_source: "the selected implementation"
          configurable: true
          input_source: "Target Initial Data"
          repeatable: true
          duplicate_policy: "preserve_one_logical_record"
          transaction_boundary: "one transaction per dependency-ordered batch"
          readiness_hook: "invoke after structural migration and integrity verification during Database setup"
          failure_state: "Database not ready; report the import failure"
      credential_storage:
        modes: "The at-rest modes Database supports are catalogued in options.credential_storage_modes; the default for an unstated credential is selected.credential_at_rest_mode."
        encryption_key_source: "storage_adapter.runtime_configuration, under the encryption key the Database Configuration Schema defines. Never an Interface record and never source."

    storage_adapter:
      runtime_configuration:
        file: "database/database.yaml"
        why_one_file: "Adding an Instance, or changing a username or a password, is one edit in this one file and never a change in source."
        credential_placement: "Each Instance's connection credentials are written on that Instance, in this file, so an Instance and the credentials that reach it are read and changed together."
        instance_source: "Which Instances exist, how each reaches its Engine, and the credentials each uses are read from this file and from nowhere else."
        supplies_the_environment: "This file is how the environment supplies Database with its connection credentials and keys; a fresh checkout reproduces the structure but still needs this file to connect."
        required: true
        structure: ".interface/foundation/schema/database.yaml"
        generated_with_the_component: "Database is not complete until this file exists and the Storage Adapter reads its Engines, Instances, and default from it."
        never_in_code: "Instance identity, Engine binding, database name, host, port, username, and password are never hardcoded in source; source reads them from this file only, so adding a database or changing a credential is one edit in one file."
        sections: "Written in the shape the Database Configuration Schema defines — engines, instances, default_instance — filled from this Component's own declarations: Engine profiles from Development's Database Items and explicit compatible project choices, Instances from storage_adapter.instances or explicit project Instances, and the default from selected.default_instance."
        ownership: "All Database-owned runtime settings, including connection credentials, belong in this layer-local file. Cross-layer bindings retain the locations and delivery rules defined by Development; do not duplicate them here."
        registry: "Build the public Instance Registry from the validated runtime Instance catalogue. Export selectable identities and the default, never raw connections or secret values."
        validation: "Before accepting data operations, validate Engine references and required Instance settings, and require the default to name an existing Instance. Reject an explicit unknown Instance; use the default only when selection is omitted. A connection failure never redirects an operation to another Instance."
        storage_paths: "Resolve file-backed Engine storage locations relative to the Database Component root and independent of process working directory. Under the default file-backed profile, data remains under data/. Server-backed Engines keep physical data on their configured server."
      backups:
        enabled: "environment-managed"
        required_for_irreversible_migrations: true
        restore_verification: "required before production use"
      instance_defaults:
        naming:
          key: "<role>"
          name: "<project> <role>"
          database: "<project>_<role>"
          normalization: "lower_snake_case"
        connection:
          host: "localhost"                              # empty for a file-backed Engine
          port: "engine_default"                         # empty for a file-backed Engine
          path: "data/<database>.<engine-extension>"     # empty for a server-backed Engine
          applicability: "every Instance carries all connection keys; a key that does not apply to its Engine is left empty rather than removed, so the shape of every Instance is the same"
        credentials:
          location: "database.yaml, on the Instance that uses them"
          keys: [username, password]
          note: "Values are written in the runtime configuration file itself, so adding an Instance or changing a username or password is one edit in one file. How that file is protected is an open decision (2026-09-18)."
      instances:
        general:
          name: "<project> General"
          purpose: "General application data."
          engine: "<development.database_item>"
          database: "<project>_general"

    migrations:
      integrity_marker: "checksum"
      drift_detection: "before normal operations"
      concurrent_runner_coordination: "engine-supported lock"
      irreversible_migration_recovery: "verified backup"
    transactions:
      isolation: "engine-resolved and explicitly recorded"
      concurrency: "optimistic version check unless the resolved operation requires locking"
      retry_transient_conflicts: true
      distinguish_failures:
        - "deadlock"
        - "serialization_failure"
        - "timeout"
        - "connection_failure"
    controlled_commands:
      enabled: true
      capability_restricted: true
      identifiers: "internal allow-list or typed operation definition"
