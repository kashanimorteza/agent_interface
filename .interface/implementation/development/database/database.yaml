# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/database.yaml"
  path_note: "Preferences for the Database Component."
  purpose: "Implementation layout and technical defaults for the Database Component."
  standard: "Agent Project Interface"
  version: "11.9"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "An explicit Database Configuration and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Database identity, runtime configuration, and root directory; read layout to locate the Database layers; then read development for capabilities, naming, and technical defaults."
  selection: "When Database Configuration leaves a Database-owned technical choice unstated and this file supplies no default, use compatible professional judgment under Database Principles and record a consequential implementation choice with the implementation."
  version_resolution: "Database's development section resolves Database-owned versioned technical items. Development resolves only its shared Defaults."
  matching: "Each declared Engine uses one implementation file beneath layout.directories.engine and applies the matching development.database_engines default when one exists."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the Database Component and locate its runtime configuration and root directory."
  - "instances: identify the configured Database Instances."
  - "layout: locate the default directories for Interface, Mapping, and Engine."
  - "development: apply Database capabilities, naming conventions, language, package, and Engine defaults."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Database type, language, platform, component directory, package name, runtime database.yaml, its Foundation Structure, and the root directory for all Database files."
  instances: "Configured Database Instances and their selected Engine and database file."
  layout: "The default directories for Interface, Mapping, and Engine."
  development: "Component capabilities, Database storage naming conventions, SQLModel choices, migration defaults, and Database Engine defaults."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
      directory: "my_database"
      package: "my_database"
    configuration:
      file: "database.yaml"
      structure: ".interface/foundation/schema/database.yaml"
    database_directory:
      path: "data"
    default_instance: "application"

  # <!-------------------------------------------- instances -->
  instances:
    application:
      name: "Application"
      engine: "sqlite"
      database: "application.db"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      interface:
        directory: "interface"
      mapping: "mapping"
      engine: "engine"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
      encryption: false
    languages:
      python:
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
          guidance:
            project_rules:
              entity_source: "Use Entity classes published by Model Interface. Database Operations receive the imported Entity class or an Entity instance directly, never a Model name or identity. Do not create a separate persistence model or duplicate Entity Fields, constraints, relationships, or indexes in Database."
              engine_and_session: "Use create_engine and Session from SQLModel. Open sessions directly with the configured Engine; do not introduce a separate session factory for ordinary Database operations."
              metadata: "Import all Entity classes before using SQLModel.metadata. Use that metadata as the authoritative table metadata for table creation and migration comparison."
              query_api: "Use SQLModel's select and Session.exec APIs for ordinary Database queries."
        migration:
          name: "Alembic"
          package: "Alembic"
          version: "latest-compatible"
          compatible_modeling: "SQLModel"
          commands:
            upgrade: "uv run alembic upgrade head"
            downgrade: "uv run alembic downgrade -1"
    database_engines:
      sqlite:
        version: "runtime-provided"
        driver:
          name: "sqlite3"
          version: "runtime-provided"
          package: null
        storage:
          kind: "file"
          relative_to: "database_directory"
          location: "<database>"
          committed: false
        connection:
          url_scheme: "sqlite"
          parameters: ["database"]
          foreign_keys: true
          check_same_thread: false
      postgresql:
        version: "latest-compatible"
        driver:
          name: "psycopg"
          version: "latest-compatible"
          package: "psycopg"
        storage:
          kind: "server"
        connection:
          url_scheme: "postgresql+psycopg"
          default_port: 5432
          parameters: ["host", "port", "database", "username_secret", "password_secret"]
      mysql:
        version: "latest-compatible"
        driver:
          name: "PyMySQL"
          version: "latest-compatible"
          package: "PyMySQL"
        storage:
          kind: "server"
        connection:
          url_scheme: "mysql+pymysql"
          default_port: 3306
          parameters: ["host", "port", "database", "username_secret", "password_secret"]
          charset: "utf8mb4"
          
  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - setup
      - run
      - verify
      - troubleshooting
    sections:
      interface: "Give every published Interface Operation one complete example using the imported Entity class or Entity instance it requires."
