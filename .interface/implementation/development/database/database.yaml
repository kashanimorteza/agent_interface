# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/database.yaml"
  path_note: "Preferences for the Database Component."
  purpose: "Implementation layout and technical defaults for the Database Component."
  standard: "Agent Project Interface"
  version: "11.8"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "An explicit Database Configuration and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Database identity, runtime configuration, and root directory; read layout to locate the Database layers; then read development for capabilities, naming, and technical defaults."
  selection: "When Database Configuration leaves a Database-owned technical choice unstated and this file supplies no default, use compatible professional judgment under Database Principles and record a consequential implementation choice with the implementation."
  version_resolution: "Database's development section resolves Database-owned versioned technical items. Development resolves only its shared Defaults."
  matching: "Each declared Engine uses one implementation file beneath layout.directories.engine and applies the matching development.database_engines default when one exists."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the Database Component and locate its runtime configuration and root directory."
  - "layout: locate the default directories for Interface, Mapping, and Engine."
  - "development: apply Database capabilities, naming conventions, language, package, and Engine defaults."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Database type, language, platform, runtime database.yaml, its Foundation Structure, and the root directory for all Database files."
  layout: "The default directories for Interface, Mapping, and Engine."
  development: "Component capabilities, Database storage naming conventions, language, package defaults, and Database Engine defaults."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
    configuration:
      file: "database.yaml"
      structure: ".interface/foundation/schema/database.yaml"
    database_directory:
      path: "database"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      interface:
        directory: "interface"
      mapping: "mapping"
      engine: "engine"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
      encryption: false
    naming:
      storage:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"
    languages:
      python:
        orm:
          name: "SQLAlchemy"
          package: "SQLAlchemy"
          version: "latest-compatible"
          capabilities:
            model_mapping: true
            parameterized_sql: true
        migration:
          name: "Alembic"
          package: "Alembic"
          version: "latest-compatible"
          compatible_orm: "SQLAlchemy"
          commands:
            upgrade: "uv run alembic upgrade head"
            downgrade: "uv run alembic downgrade -1"
    database_engines:
      sqlite:
        version: "runtime-provided"
        driver:
          name: "sqlite3"
          version: "runtime-provided"
          package: null
        storage:
          kind: "file"
          relative_to: "component_root"
          location: "data/<database>.db"
          committed: false
        connection:
          url_scheme: "sqlite"
          parameters: ["database"]
          foreign_keys: true
          check_same_thread: false
      postgresql:
        version: "latest-compatible"
        driver:
          name: "psycopg"
          version: "latest-compatible"
          package: "psycopg"
        storage:
          kind: "server"
        connection:
          url_scheme: "postgresql+psycopg"
          default_port: 5432
          parameters: ["host", "port", "database", "username_secret", "password_secret"]
      mysql:
        version: "latest-compatible"
        driver:
          name: "PyMySQL"
          version: "latest-compatible"
          package: "PyMySQL"
        storage:
          kind: "server"
        connection:
          url_scheme: "mysql+pymysql"
          default_port: 3306
          parameters: ["host", "port", "database", "username_secret", "password_secret"]
          charset: "utf8mb4"
