# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/database.yaml"
  path_note: "Preferences and machine-readable public contract for the Database Component."
  purpose: "Database layout, Interface contract, runtime configuration defaults, and technical defaults."
  standard: "Agent Project Interface"
  version: "12.0"
  updated: "2026-09-30"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Generation reads it without writing resolved choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "Every applicable Database Principle and explicit compatible Target value take precedence over a Preference default."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings and instances; generate config from its Foundation Schema; publish the exact Interface contract; realize the fixed layout; then apply development and documentation preferences."
  selection: "Use compatible professional judgment only for an unstated Database-owned technical choice and record consequential implementation choices with the implementation."
  runtime: "Generated config.yaml is the sole runtime source for Engines, Instances, Settings, and Initial Data. Runtime never reads this file."
  matching: "Each active Instance receives one implementation file beneath layout.directories.engine, including when multiple Instances use the same Engine."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify Database, its read-only Model dependency, configuration, and query defaults."
  - "instances: resolve default Instance definitions."
  - "initial_data: resolve shared Initial Data."
  - "interface: generate the exact public capability groups, vocabulary, values, and publication surface."
  - "layout: realize fixed Database-owned files and directories."
  - "development: select language, packages, Engine technology, and after-generation behavior."
  - "documentation: generate the root README from the public contract."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - instances
  - initial_data
  - interface
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      platform: "VPS"
      directory: "database"
      package: "database"
    model_dependency:
      interface: "model.interface"
      consumption: "Import public Entity classes and their complete public Declarations through Model Interface only."
      ownership: "Database writes only inside its own Component output and never changes Model."
    configuration:
      file: "config.yaml"
      structure: ".interface/foundation/schema/database.yaml"
      runtime_source: true
    default_instance: "sqlite"
    storage_root: "db"
    query:
      filter_combination: "AND"
      default_limit: -1
      default_order:
        field: "id"
        direction: "ASCENDING"

  # <!-------------------------------------------- instances -->
  instances:
    sqlite:
      name: "SQLite"
      active: true
      engine: "sqlite"
      host: null
      port: null
      database: "application.db"
      username: null
      password: null
      options: {}
    postgresql:
      name: "PostgreSQL"
      active: true
      engine: "postgresql"
      host: "127.0.0.1"
      port: 5432
      database: "application"
      username: "postgres"
      password: ""
      options: {}

  # <!-------------------------------------------- initial_data -->
  initial_data: []

  # <!-------------------------------------------- interface -->
  interface:
    publication:
      - "Database"
      - "DatabaseInstance"
      - "Filter"
      - "FilterOperator"
      - "FilterCombination"
      - "Order"
      - "OrderDirection"
      - "CommandResult"
      - "LifecycleResult"
    grouping: "Entity Operations, Database-wide Operations, and Lifecycle Commands are mandatory conceptual groups, not required language-specific wrapper symbols."
    entity_operations:
      - "add"
      - "update"
      - "list"
      - "delete"
      - "enable"
      - "disable"
      - "get_by_id"
      - "count"
      - "sum"
      - "min"
      - "max"
      - "truncate"
    database_wide_operations:
      - "execute_command"
    lifecycle_commands:
      - "create_tables"
      - "insert_initial_data"
    vocabulary:
      FilterOperator:
        - "EQUALS"
        - "NOT_EQUALS"
        - "GREATER_THAN"
        - "GREATER_OR_EQUAL"
        - "LESS_THAN"
        - "LESS_OR_EQUAL"
        - "IN"
        - "CONTAINS"
        - "STARTS_WITH"
        - "ENDS_WITH"
        - "IS_NULL"
        - "IS_NOT_NULL"
      FilterCombination:
        - "AND"
        - "OR"
      OrderDirection:
        - "ASCENDING"
        - "DESCENDING"
    values:
      Filter:
        immutable: true
        fields:
          field: "Entity Field name"
          operator: "FilterOperator"
          value: "operator-compatible value; absent for IS_NULL and IS_NOT_NULL"
      Order:
        immutable: true
        fields:
          field: "Entity Field name"
          direction: "OrderDirection; defaults to ASCENDING when omitted"
      CommandResult:
        fields:
          rows: "returned row mappings or null"
          affected: "affected row count or null"
          columns: "ordered column names or null"
          success: "execution success"
          message: "public result or error message"
          instance: "DatabaseInstance used"
      LifecycleResult:
        fields:
          command: "Lifecycle Command name"
          instance: "DatabaseInstance used"
          success: "execution success"
          affected: "processed table or record count or null"
          message: "public result or error message"

  # <!-------------------------------------------- layout -->
  layout:
    fixed: true
    rule: "These names and ownership locations are fixed Database Architecture. Every additional internal source file belongs under core."
    directories:
      core: "core"
      engine: "engine"
      database: "db"
    files:
      interface: "interface"
      data: "data"
      tables: "tables"
      initial_data: "initial_data"
      engine: "<active-instance>"
      configuration: "config.yaml"
      documentation: "README.md"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    languages:
      default: "python"
      python:
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
        migration:
          name: "Alembic"
          package: "Alembic"
          version: "latest-compatible"
          compatible_modeling: "SQLModel"
    after_generation:
      enabled: true
      instance: "<default_instance>"
      fail_on_error: true
      commands:
        - "create_tables"
        - "insert_initial_data"
    database_engines:
      sqlite:
        version: "runtime-provided"
        driver:
          name: "sqlite3"
          version: "runtime-provided"
          package: null
        storage:
          kind: "file"
          relative_to: "<database-component>/db"
          location: "<database>"
          reject_escape: true
        connection:
          url_scheme: "sqlite"
          required_parameters: ["database"]
          foreign_keys: true
          check_same_thread: false
      postgresql:
        version: "latest-compatible"
        driver:
          name: "psycopg"
          version: "latest-compatible"
          package: "psycopg"
        storage:
          kind: "server"
        connection:
          url_scheme: "postgresql+psycopg"
          default_port: 5432
          required_parameters: ["host", "port", "database", "username", "password"]

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - instances
      - setup
      - use
      - lifecycle
      - verify
      - troubleshooting
    sections:
      interface: "Document all three capability groups, public vocabulary, value contracts, defaults, results, and errors with complete examples."
      instances: "Explain active DatabaseInstance members, default selection, and Database-owned storage without exposing credentials."
      lifecycle: "Explain manual CreateTables and InsertInitialData use and after-generation order."
      verify: "Verify public import, Instance selection, query vocabulary, each capability group, persistent file location, and repeatable Lifecycle Commands."
