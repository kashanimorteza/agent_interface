# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/database.yaml"
  path_note: "Preferences for the Database Component."
  purpose: "Implementation layout and technical defaults for the Database Component."
  standard: "Agent Project Interface"
  version: "11.9"
  updated: "2026-09-25"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "An explicit Database Configuration and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings for Database identity, runtime configuration, and root directory; read layout to locate the Interface, Data, and Engine layers; then read development for capabilities, naming, and technical defaults."
  selection: "When Database Configuration leaves a Database-owned technical choice unstated and this file supplies no default, use compatible professional judgment under Database Principles and record a consequential implementation choice with the implementation."
  version_resolution: "Database's development section resolves Database-owned versioned technical items. Development resolves only its shared Defaults."
  matching: "Each Engine marked `implement: true` uses one implementation file beneath layout.directories.engine and applies the matching development.database_engines default when one exists."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "settings: identify the Database Component and locate its runtime configuration and root directory."
  - "instances: identify the configured Database Instances."
  - "layout: locate the configured names and paths for Interface, Data, and Engine."
  - "development: apply Database capabilities, naming conventions, language, package, and Engine defaults."
  - "documentation: apply the required Database documentation structure and Interface examples."

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  - settings
  - instances
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      language: "Python"
      platform: "VPS"
      directory: "database"
      package: "database"
    configuration:
      file: "database.yaml"
      structure: ".interface/foundation/schema/database.yaml"
    database_directory:
      path: "db"
    default_instance: "application"
    query:
      filter_combination: "AND" # Resolved to the Filter Combination enum when List omits it.
      # Alternative: OR.
      default_order:
        field: "id"
        # Resolved to the selected Entity Field when List omits Orders.
        direction: "ascending"
        # Alternative direction: descending.

  # <!-------------------------------------------- instances -->
  instances:
    application:
      name: "Application"
      engine: "sqlite"
      database: "application.db"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      engine: "engine"
    files:
      interface: "interface"
      data: "data"
      engine: "<engine>"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    languages:
      python:
        modeling:
          package:
            name: "SQLModel"
            version: "latest-compatible"
            skill: "sqlmodel"
          guidance:
            project_rules:
              engine_and_session: "Use create_engine and Session from SQLModel. Open sessions directly with the configured Engine; do not introduce a separate session factory for ordinary Database operations."
              metadata: "Import the configured Entity classes before using SQLModel.metadata. Use SQLModel.metadata for table creation and migration comparison."
              query_api: "Use SQLModel's select and Session.exec APIs for ordinary Database queries."
        migration:
          name: "Alembic"
          package: "Alembic"
          version: "latest-compatible"
          compatible_modeling: "SQLModel"
          commands:
            upgrade: "uv run alembic upgrade head"
            downgrade: "uv run alembic downgrade -1"
        provisioning:
          on_develop: "Apply the generated migration to the configured default Instance after source verification. For file-backed storage, leave the configured database file in the configured Database Directory."
          verify: "Confirm the default Instance contains a Table for every Entity imported from Model before reporting Database development complete."
    database_engines:
      sqlite:
        implement: true
        version: "runtime-provided"
        driver:
          name: "sqlite3"
          version: "runtime-provided"
          package: null
        storage:
          kind: "file"
          relative_to: "database_directory"
          location: "<database>"
          committed: false
        connection:
          url_scheme: "sqlite"
          parameters: ["database"]
          foreign_keys: true
          check_same_thread: false
      postgresql:
        implement: false
        version: "latest-compatible"
        driver:
          name: "psycopg"
          version: "latest-compatible"
          package: "psycopg"
        storage:
          kind: "server"
        connection:
          url_scheme: "postgresql+psycopg"
          default_port: 5432
          parameters: ["host", "port", "database", "username", "password"]
      mysql:
        implement: false
        version: "latest-compatible"
        driver:
          name: "PyMySQL"
          version: "latest-compatible"
          package: "PyMySQL"
        storage:
          kind: "server"
        connection:
          url_scheme: "mysql+pymysql"
          default_port: 3306
          parameters: ["host", "port", "database", "username", "password"]
          charset: "utf8mb4"
      sql_server:
        implement: false
        version: "latest-compatible"
        driver:
          name: "pyodbc"
          version: "latest-compatible"
          package: "pyodbc"
        storage:
          kind: "server"
        connection:
          url_scheme: "mssql+pyodbc"
          default_port: 1433
          parameters: ["host", "port", "database", "username", "password"]
  
  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - setup
      - use
      - verify
      - troubleshooting
    sections:
      interface: "Give every published Interface Operation one complete example using the imported Entity class or Entity instance it requires."
