# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/development/database/database.yaml"
  path_note: "The Preferences layer of the Database Component."
  purpose: "Database identity, Instances, Interface Schema reference, layout, language profile, Engines, and documentation choices."
  standard: "Agent Project Interface"
  version: "14.0"
  updated: "2026-10-01"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Generation reads it without writing resolved choices back into it."
  changed_by: "The human, directly. A missing critical Database choice is raised through State."
  precedence: "Every applicable Database Principle and explicit compatible Target value take precedence over a Preference default."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read settings and instances; copy the Target Initial Data; generate config from its Foundation Schema; realize Interface from the Database Interface Schema; realize the fixed layout; then apply development and documentation preferences."
  selection: "Preserve explicit compatible Target choices. Use these Preferences only for choices the Target leaves unstated, and choose only among the values they list. When neither the Target nor these Preferences supply a choice, Database stops and reports the missing choice through State. It never fills a gap by its own judgment."
  version_resolution: "Resolve Database-owned versioned technical items from the selected language profile in development. Resolve latest-compatible to a concrete compatible version and preserve that resolution in dependency or lock metadata."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - settings
  - instances
  - interface
  - layout
  - development
  - documentation

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  settings: "Database's identity, the Model Interface Schema it consumes, the configuration file, the default Instance, the Storage root, and the query defaults."
  instances: "The default definition of every Instance."
  interface: "The Database Interface Schema and its version."
  layout: "The physical names of Database's directories and files."
  development: "Development capabilities, the selected language and its profile, after-generation behavior, and Engine technology."
  documentation: "The documentation file, its section order, and the content of each section."

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- settings -->
  settings:
    component:
      type: "library"
      platform: "VPS"
      directory: "database"
      package: "database"
    model_dependency:
      schema: ".interface/foundation/schema/model-interface.yaml"
    configuration:
      file: "config.yaml"
      structure: ".interface/foundation/schema/database-configuration.yaml"
    default_instance: "sqlite"
    storage_root: "db"
    query:
      filter_combination: "AND"
      default_limit: -1
      default_order:
        field: "id"
        direction: "ASCENDING"

  # <!-------------------------------------------- instances -->
  instances:
    sqlite:
      name: "SQLite"
      active: true
      engine: "sqlite"
      host: null
      port: null
      database: "application.db"
      username: null
      password: null
      options: {}
    postgresql:
      name: "PostgreSQL"
      active: false
      engine: "postgresql"
      host: "127.0.0.1"
      port: 5432
      database: "application"
      username: "postgres"
      password: ""
      options: {}

  # <!-------------------------------------------- interface -->
  interface:
    schema: ".interface/foundation/schema/database-interface.yaml"
    contract_version: "1.3"

  # <!-------------------------------------------- layout -->
  layout:
    directories:
      core: "core"
      engine: "engine"
      entry_points: "scripts"
      database: "db"
    files:
      interface: "interface"
      data: "data"
      tables: "tables"
      initial_data: "initial_data"
      engine: "<engine-in-use>"
      lifecycle_entry_points: "<lifecycle-command>"
      configuration: "config.yaml"
      documentation: "README.md"

  # <!-------------------------------------------- development -->
  development:
    capabilities:
      testing: false
      error_handling: false
      logging: false
    language:
      selected: "python"
      options:
        python:
          modeling:
            package:
              name: "SQLModel"
              version: "latest-compatible"
            agent_skills:
              - resource: "sqlmodel"
                requirement: "required"
                activation: "when_selected"
                purpose: "Apply SQLModel guidance while realizing Tables and Engine units."
            agent_avoid:
              - "Never declare or subclass a table class inside Database; Tables come only from the Model Entities."
          table_creation: "Core Tables creates exactly the Tables of the Model Entity Collection's table models through their shared metadata (create_all restricted to those Tables). It writes no per-Entity code."
          value_shapes:
            database: "a plain class, created with Database()"
            filter: "frozen dataclass with fields field, operator, value"
            order: "frozen dataclass with fields field, direction"
            command_result: "frozen dataclass with the Schema's fields, in Schema order"
            lifecycle_result: "frozen dataclass with the Schema's fields, in Schema order"
            enumerations: "enum.Enum for FilterOperator, FilterCombination, OrderDirection, and DatabaseInstance; each member's value equals its name"
          error_classes:
            base: "DatabaseError"
            invalid_configuration_or_instance: "ConfigurationError"
            inactive_instance: "InactiveInstanceError"
            invalid_input_or_field: "InvalidInputError"
            declaration_incompatibility: "DeclarationMismatchError"
            connection_failure: "ConnectionFailureError"
            execution_failure: "ExecutionError"
            incomplete_lifecycle: "LifecycleError"
          field_reference: "A Field reference is the Entity's class attribute for that Field, such as User.is_active."
          row_materialization: "Build the Entity with its own constructor from all Field values."
          engines:
            sqlite:
              driver:
                name: "sqlite3"
                version: "runtime-provided"
                package: null
              url_scheme: "sqlite"
              connect_arguments:
                check_same_thread: false
            postgresql:
              driver:
                name: "psycopg"
                version: "latest-compatible"
                package: "psycopg"
              url_scheme: "postgresql+psycopg"
    after_generation:
      enabled: true
      fail_on_error: true
      command: "prepare"
    database_engines:
      sqlite:
        version: "runtime-provided"
        storage:
          kind: "file"
          relative_to: "<database-component>/db"
          location: "<database>"
          reject_escape: true
        connection:
          required_parameters: ["database"]
          foreign_keys: true
      postgresql:
        version: "latest-compatible"
        storage:
          kind: "server"
        connection:
          default_port: 5432
          required_parameters: ["host", "port", "database", "username", "password"]

  # <!-------------------------------------------- documentation -->
  documentation:
    file: "README.md"
    location: "the Component root"
    format: "markdown"
    order:
      - overview
      - interface
      - instances
      - setup
      - use
      - lifecycle
      - initial_data
      - verify
      - troubleshooting
    sections:
      overview: "Give one short introduction and one simple example: create Database, then one add and one list."
      interface: "For every published contract (Database, DatabaseInstance, Filter, FilterOperator, FilterCombination, Order, OrderDirection, CommandResult, LifecycleResult, and every error) and for every Operation and Lifecycle Command with each of its parameters, explain what it is for and how to use it, with one example each. Cover every enumeration member, defaults, results, and errors."
      setup: "Give the setup steps for the selected technology and state that generation runs Prepare automatically."
      use: "Show every capability group used only through Interface, with Field references and enumeration members and never strings."
      troubleshooting: "Cover Database concerns only, including an inactive Instance, a difference between an existing Table and its Entity, and empty Initial Data values."
      instances: "Explain active DatabaseInstance members, default selection, and Database-owned storage without exposing credentials."
      lifecycle: "Explain manual CreateTables, InsertInitialData, and Prepare use, and that generation runs Prepare."
      initial_data: "List every Target-defined Initial Data record and state that Database inserts its values unchanged without security-based omission."
      verify: "Verify public import, Instance selection, query vocabulary, each capability group, persistent file location, and repeatable Lifecycle Commands."
