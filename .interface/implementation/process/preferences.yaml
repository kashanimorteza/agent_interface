# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Apply a shared Process default only when neither the Target nor the owning Process Component supplies the choice."
  selection: "There is currently no shared Process alternative to select."
  version_resolution: "No entry currently carries a version."
  matching: "There is currently no shared Process entry to match."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Process selects no shared technical profile."
  options: "Empty. Process catalogues no shared alternatives."
  settings: "Empty. Each Process Component currently owns its own settings."

# <!--------------------------------------------------------------------------------- Content -->
content:
  selected: {}
  options: {}
  settings: {}
