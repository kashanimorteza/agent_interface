# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/implementation/api/preferences.yaml"
  path_note: "The Preferences layer of the API Component — API-owned boundary defaults and transport conventions."
  purpose: "Defaults for the executable HTTP boundary: contract, transport, queries, lifecycle, and cross-cutting behavior."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-19"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved API choices back into it."
  changed_by: "The human, directly. A missing critical API choice is raised through State."
  precedence: "Target and API Principles take precedence over these Preferences."


# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Use API's identity, language, framework, and Platform Reference from its Component Profile in Development Preferences, then apply the boundary defaults in this file. Preserve every explicit value, including false and null, and never write resolved values back into this file."
  selection: "When the Target leaves an API-owned choice unstated and this file supplies no default, use compatible professional judgment under API Principles and record a consequential implementation choice with the implementation."
  version_resolution: "This file owns no versioned technology. Development Preferences resolve every versioned technical item assigned to API."
  matching: "An explicit Target statement takes priority. A default here applies only where the Target leaves that boundary choice unstated; otherwise no default applies. Where two entries could apply, the one naming the more specific operation, route, or resource governs, and a Component Profile selection in Development outranks a general default here."




# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns API's configurable profile and concrete selections."
  options: "Empty. Development catalogues API's concrete technical alternatives and Platform reference."
  settings: "Technology-independent defaults for the API boundary: its internal parts, runtime shape, published contract, permitted interfaces, credential handling, request identity, query behavior, HTTP surface, lifecycle, cross-cutting behavior, and idempotency."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    architecture:
      application_bootstrap:
        artifact: "API application bootstrap"
        creates_framework_application: true
        registers_routers: true
        installs_middleware: true
        installs_exception_handlers: true
        wires_authentication_dependencies: true
        configures_lifecycle: true
      router:
        directory: "router"
        file_per_domain: true
        controller_layer: "merged_into_router"
        owns_http_boundary: true
      service:
        directory: "service"
        file_per_domain: true
        owns_api_operations: true
        depends_on: "Logic Public Interface"
        depends_on_transport_or_framework: false
    runtime:
      executable: true
      entrypoint_source: "Development API runtime entrypoint"
      host_source: "Platform Runtime Binding"
      port_source: "Platform Runtime Binding"
    contract:
      application:
        title: "Target API"
        description: ""
        version: "v1"
        values_source: "Target or API Runtime Configuration"
      documentation:
        enabled: true
        contract_standard: "OpenAPI"
        contract_endpoint: "/openapi.json"
        interactive_reference_endpoint: "/docs"
      versioning:
        enabled: true
        strategy: "path"
        initial_version: "v1"
      expose_standard_model_operations: true   # the operation set Database publishes through its Database Interface
    interfaces:
      model_access:
        via: "Model Public Interface"
      logic_access:
        via: "Logic Public Interface"
      direct_database_access: false
      transport_schemas: "Create only when input or output shape differs; never create a competing Domain Definition."
    credentials:
      input_only: true
      output: "excluded"
      documentation_values: "non-secret placeholders only"
    requests:
      request_id:
        required: true
        accept_valid_incoming: true
        generate_when_absent: true
        include_in_error_response: true
        sensitive_data: false
    queries:
      strategy: "cursor"
      default_limit: 50
      maximum_limit: 100
      filtering: "explicitly allowlisted Fields only"
      sorting: "explicitly allowlisted Fields with stable ordering"
    http:
      root_path:
        source: "Platform Runtime Binding"
        default: ""
      cors:
        allowed_origins:
          - "*"
        allow_credentials: true
        allowed_methods:
          - "*"
        allowed_headers:
          - "*"
    lifecycle:
      health:
        enabled: true
        path: "/health"
      readiness:
        enabled: true
        path: "/ready"
      startup_validation: true
      graceful_shutdown: true
    cross_cutting:
      authentication:
        owner: "API Interface"
      error_handling:
        expected_failures: "Application Outcomes from Logic"
        unexpected_failures: "safe generic response"
        expose_internal_details: false
      logging:
        request_id_only: true
    idempotency:
      enabled_when: "A Target operation is selected as sensitive to repeated execution."
      key: "idempotency_key"
      atomic_result_recording: true
