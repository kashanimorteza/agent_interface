meta:
  path: ".interface/implementation/api/preferences.yaml"
  purpose: "API-owned executable boundary defaults and transport settings."
  standard: "Agent Project Interface"
  version: "1.0"

policy:
  agent_may_edit: false
  rule: "This file is human-owned. Concrete API choices are resolved from Development; this file owns API boundary defaults."
  precedence: "Target and API Principles take precedence over these Preferences."

content:
  runtime:
    executable: true
    entrypoint: "api.main:app"
    host_source: "Platform Runtime Binding"
    port_source: "Platform Runtime Binding"
  contract:
    documentation:
      enabled: true
      type: "OpenAPI"
    versioning:
      enabled: true
      strategy: "path"
      initial_version: "v1"
    expose_standard_model_operations: true
  interfaces:
    model_access:
      via: "Model Public Interface"
    logic_access:
      via: "Logic Public Interface"
    direct_database_access: false
    transport_schemas: "Create only when input or output shape differs; never create a competing Domain Definition."
  credentials:
    input_only: true
    output: "excluded"
    documentation_values: "non-secret placeholders only"
  requests:
    request_id:
      required: true
      accept_valid_incoming: true
      generate_when_absent: true
      include_in_error_response: true
      sensitive_data: false
  queries:
    strategy: "cursor"
    default_limit: 50
    maximum_limit: 100
    filtering: "explicitly allowlisted Fields only"
    sorting: "explicitly allowlisted Fields with stable ordering"
  lifecycle:
    health:
      enabled: true
      path: "/health"
    readiness:
      enabled: true
      path: "/ready"
    startup_validation: true
    graceful_shutdown: true
  cross_cutting:
    authentication:
      owner: "API Interface"
    error_handling:
      expected_failures: "Application Outcomes from Logic"
      unexpected_failures: "safe generic response"
      expose_internal_details: false
    logging:
      request_id_only: true
  idempotency:
    enabled_when: "A Target operation is selected as sensitive to repeated execution."
    key: "idempotency_key"
    atomic_result_recording: true
