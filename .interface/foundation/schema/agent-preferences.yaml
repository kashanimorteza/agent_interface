schema:
  id: "agent-interface-agent-preferences"
  version: "1.0"
  purpose: "The common structure every Agent Component Preferences follow. It defines current Agent Module selections, supported alternatives, declared capabilities, resources, mappings, and explicit empty categories without turning runtime choices into portable Principles."

# <!--------------------------------------------------------------------------------- Frame -->
frame:
  source: ".interface/foundation/schema/yaml.yaml"
  inherited: "Agent Preferences file is a YAML Interface file, so it follows the common frame: meta, policy, read_order, content_map, content. This schema defines its content rather than repeating that frame."
  scope: "This schema defines Agent Preferences content and the additional expectations placed on inherited meta and policy sections."
  path: ".interface/agent/<component>/preferences.yaml for each Agent Component."
  ownership: "The Preferences are human-owned. Agent Sync observes and realizes them without rewriting their declarations from runtime state."

# <!--------------------------------------------------------------------------------- Purpose -->
purpose:
  answers: "Which Agent Module configuration. Agent Preferences record the current desired Agent Native, Agent Instance, and capability declarations used to realize the portable Agent Principles in a selected Runtime."
  relation_to_principles: "Agent Principles define mandatory portable philosophy, responsibility, and boundaries. The Agent Preferences record current selections, resources, native mappings, and explicit absence. Preferences never weaken a Principle."
  relation_to_implementation: "Implementation Preferences may carry a stable logical capability identifier, resolved by ordinary operations against currently discoverable and usable Runtime Skills without reading these Preferences. The reference never transfers ownership of that capability to Implementation."
  relation_to_runtime: "A declaration is desired Preferences state, not proof of installation, activation, availability, authentication, or usability. Current runtime evidence establishes realization."

# <!--------------------------------------------------------------------------------- Scope -->
scope:
  contains:
    - "The selected Agent Module option for each decision owned by the Component."
    - "Supported Agent Native, Agent Instance, and Runtime alternatives."
    - "Project, runtime, built-in, user, managed, and extension capability declarations where applicable."
    - "Native resources, paths, provider identities, mappings, activation intent, requirement status, and verification expectations."
    - "Explicit empty categories when the Preferences currently declares no entry of that kind."
  excludes:
    - "Mandatory portable rules and boundaries, which belong to Agent Principles."
    - "Implementation technology and implementation preferences, which belong to Implementation Preferences."
    - "Target meaning, Models, phases, or Behaviour, which belong to Target definitions."
    - "Observed runtime state, secrets, generated operational records, or evidence presented as a Human-owned declaration."
  empty_component: "An Agent Component with no current selections or declarations still carries selected, options, and settings as explicit empty mappings."

# <!--------------------------------------------------------------------------------- Meta -->
meta:
  required_fields:
    path:
      required: true
      purpose: "The exact preferences.yaml path."
    path_note:
      required: true
      purpose: "Names the Agent Component and states that this is its Preferences layer."
    purpose:
      required: true
      purpose: "The selections and declarations owned by this Agent Component."
    standard:
      required: true
      purpose: "The Interface standard the Preferences belongs to."
    version:
      required: true
      purpose: "The Preferences version, raised whenever declaration meaning changes."
    updated:
      required: true
      purpose: "The date the Preferences last changed."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  purpose: "Every Agent Preferences state how its Human-owned declarations are read, selected, matched, and realized."
  required_fields:
    agent_may_edit:
      required: true
      value: false
      purpose: "Agent Sync observes and realizes the Preferences but never rewrites it from runtime state."
    rule:
      required: true
      purpose: "How the Preferences are treated by Agent operations."
    changed_by:
      required: true
      purpose: "Who changes Preferences declarations."
    precedence:
      required: true
      purpose: "Applicable Principles and explicit Human decisions take precedence."
    consumption:
      required: true
      purpose: "How consumers use the selected options, declarations, and mappings."
    selection:
      required: true
      purpose: "How a compatible option or undeclared optional capability is handled."
    version_resolution:
      required: true
      purpose: "How runtime-provided and provider-owned versions resolve."
    matching:
      required: true
      purpose: "How stable keys, provider identities, resources, and native mappings correspond."
  additional_fields: "A Component may add stricter Preferences-specific policy fields without removing or renaming the required fields."

# <!--------------------------------------------------------------------------------- Structure -->
structure:
  - "selected"
  - "options"
  - "settings"

# <!--------------------------------------------------------------------------------- Sections -->
sections:

  selected:
    required: true
    default: {}
    purpose: "The current Agent Module option selected for each decision owned by this Component."
    rules:
      names_declared_entry: "A selected key resolves to exactly one entry in the matching options catalogue or declared settings resource."
      no_runtime_claim: "Selection expresses desired Preferences state and never proves current runtime availability."
    empty: "An empty mapping when the Component selects nothing."

  options:
    required: true
    default: {}
    purpose: "Supported alternatives for Agent Module or Runtime decisions owned by this Component."
    rules:
      no_selection: "An option describes a supported alternative and does not select itself."
      provider_identity: "Provider-owned identity and version information remain explicit when applicable."
      portable_boundary: "An option may map a portable contract to native mechanisms but never changes that contract."
    empty: "An empty mapping when the Component catalogues no alternatives."

  settings:
    required: true
    default: {}
    purpose: "Declared Agent resources, capability categories, mappings, defaults, overrides, and explicit empty categories owned by the Component."
    rules:
      grouping: "Entries are grouped by the capability categories and ownership sources defined by the Component."
      explicit_absence: "A supported category with no declaration remains present as an empty mapping when absence must be distinguishable from omission."
      no_secrets: "Preferences may identify an authentication or secret reference but never stores its value."
      observed_state: "Installation, activation, health, and usability are verified from runtime evidence and never written back as declarations."
    empty: "An empty mapping when the Component declares and configures nothing."

# <!--------------------------------------------------------------------------------- Conventions -->
conventions:
  placeholders: "A value completed during realization is written in angle brackets."
  references: "A dotted resource reference resolves from content.settings unless its declaring field explicitly names another root."
  read_order: "read_order lists selected, options, and settings in that order."
  content_map: "content_map carries exactly one line for each of the three content sections."

# <!--------------------------------------------------------------------------------- Preferences_Rules -->
profile_rules:
  purpose: "Rules every Agent Preferences obeys. They were the general Principles of the former Settings Component and were moved here verbatim on 2026-09-17 because they govern all Preferences rather than one Component."
  rules:
  - title: "Reconciliation preserves ownership"
    rule: "Reconciliation compares current declarations with actual runtime state, reports drift, and changes only the runtime artifacts it is authorized to manage. Resolved runtime state is never written back as a new human-owned decision."
    why: "Synchronization must not convert observations into policy."
    boundary: "A runtime-provided default may be observed without being adopted as a project Preferences."
    at_a_glance:
      - "**Must** — reconcile declarations with runtime state without changing ownership *(2)*"
      - "**Never** — turn an observed runtime value into a human-owned decision *(2)*"
    origin: "formerly Agent Settings Principle 2, moved here on 2026-09-17"
  - title: "Empty configuration categories are explicit"
    rule: "Every supported configuration category exists in the Agent Preferences even when it currently contains no entries. Empty means declared and unused, not unknown or forgotten."
    why: "A complete profile distinguishes absence from omission."
    boundary: "Explicit emptiness does not require activating or configuring the category."
    at_a_glance:
      - "**Must** — represent every supported configuration category, including empty ones *(3)*"
    origin: "formerly Agent Settings Principle 3, moved here on 2026-09-17"
  - title: "Project capabilities travel with the project"
    rule: "Every project-specific Agent Instance, Role, Skill, Command, Rule, Tool declaration, Hook, Integration, Extension, interaction choice, permission policy, and required configuration is stored in or declared by the project so a compatible Agent Runtime can reconstruct the same Agent Preferences. Secret values and machine credentials never travel in that declaration."
    why: "Agent Native and Agent Instance behavior must not depend on undocumented user configuration or one machine's hidden state."
    boundary: "A project declaration may reference runtime- or user-provided infrastructure without claiming to own or transport it."
    at_a_glance:
      - "**Must** — store or declare every project-specific Agent capability and policy at project scope *(4)*"
      - "**Never** — store secret values or machine credentials in the portable declaration *(4)*"
    origin: "formerly Agent Settings Principle 4, moved here on 2026-09-17"
  - title: "Every required capability has one owner and a provable status"
    rule: "Every required Agent responsibility maps to one owning Component and one reachable Capability Contract. Its availability status is established from current runtime observation; missing, duplicate, contradictory, unreachable, inactive, or unverified mappings remain explicit and never become available by assumption."
    why: "A complete catalog is useful only when responsibility and actual usability are unambiguous."
    boundary: "Several capabilities may collaborate when exactly one contract remains accountable for the required responsibility."
    at_a_glance:
      - "**Must** — map every required responsibility to one owner and one reachable Capability Contract *(5)*"
      - "**Never** — infer availability from a missing, conflicting, inactive, or unverified mapping *(5)*"
    origin: "formerly Agent Settings Principle 5, moved here on 2026-09-17"

# <!--------------------------------------------------------------------------------- Native_Blocks -->
native_blocks:
  path: "content.settings.native.<agent-native>"
  purpose: "Optional per-Agent-Native realization suggestions and Native-only mechanics. A Component states its portable concept in Principles and its portable selections in selected, options, and settings; when the Human knows how a particular Native realizes that concept best, the suggestion goes here, keyed by that Native."
  authority: "A native block is an aid that narrows Agent Sync's discovery, never an authority that overrides the Native's own mechanism. When no block exists, the Agent Native decides the realization itself."
  scope: "Also holds declarations that exist only for one Native (for example Claude Code hook events or configuration-source precedence)."
