schema:
  id: "agent-interface-model-interface"
  version: "2.1"
  purpose: "The stable, language-independent structure through which consumers import every public Model Entity and reach its Declaration."
  kind: "Interface structure standard"
  applies_when: "The Implementation declares a Model Component."
  generates: "<model component path>/<interface file>"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  interface:
    required: true
    purpose: "The public entrypoint: one explicit export per Entity, and one ordered collection of every Entity."
    public_contracts:
      entity_exports: "One explicit named export for every current Target Entity, each being the actual public Entity."
      entity_collection: "One ready-to-use ordered immutable collection of every actual public Entity."

  entity_exports:
    required: true
    purpose: "Direct import of each Entity by its own name, for a consumer that works with a specific Entity."
    naming: "Each export's name is the Entity's physical name under the selected language's naming rules."
    membership: "Exactly one export for every current Target Entity and no other Entity export."

  entity_collection:
    required: true
    purpose: "Enumeration of every Entity, for a consumer that works with all Entities without knowing their names."
    ordered_by: "Target Entity order"
    immutable_after_load: true
    membership: "Exactly the same Entities as entity_exports, each once."

  entity_declaration:
    required: true
    purpose: "Every exported Entity exposes its own actual public Declaration, so a consumer holding an Entity reaches its meaning without another lookup."

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  explicit_exports: "Each Entity is exported by an explicit named export. No wildcard export or dynamically generated export publishes an Entity."
  actual_references: "Every export and every collection member is the actual public Entity, never a copy, wrapper, alias, or reconstruction. The Declaration an Entity exposes is its actual Declaration."
  single_publication: "Interface publishes no other Entity registry, lookup table, or discovery mechanism beside the exports and the collection."
  side_effect_free: "Loading Model Interface creates no Entity instance, data, connection, file, or process, and performs no network, storage, runtime-configuration, or other external side effect."
  contract_change: "Changing the meaning of the exports, the collection, or an Entity's exposed Declaration requires an explicit Schema version change and consumer review."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  exports:
    - "User"         # the actual User Entity
    - "Account"      # the actual Account Entity
  entities:          # ordered, immutable
    - "<actual User Entity>"
    - "<actual Account Entity>"
  declaration: "User.<declaration accessor> is User's actual Declaration"
