schema:
  id: "agent-interface-application"
  version: "1.1"
  purpose: "Shared Application Manifest structure for public Component metadata."

operational_scope:
  purpose: "Shared public metadata surface for Implementation Components."
  stores: "One section for every declared Implementation Component; each owner may add non-secret public metadata to its section."
  excludes: "Target meaning, private implementation details, internal storage structure, technical Preferences, credentials, secrets, and undeclared dependencies."

initialization:
  source: "initial"
  purpose: "Supply the Application Manifest's initial specialized content; Configure composes the generated file with the general YAML Schema."
  preservation: "Reconciliation preserves valid public metadata and reports conflicts rather than silently discarding meaningful information."
generation:
  purpose: "File-specific values Configure supplies while applying the general YAML file structure."
  path: ".interface/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."
  agent_may_edit: true
  policy_rule: "Apply the current Application Schema and preserve valid public metadata."
  resolution:
    consumption: "Read public metadata by canonical Component identifier."
    selection: "Select the section whose key is the Component being described."
    absence: "An empty section means that its owner has published no public metadata."
  read_order: ["components"]
  content_map:
    components: "Public metadata for each declared Implementation Component."

structure:
  - "components"

sections:
  components:
    required: true
    default: {}
    purpose: "Public metadata sections keyed by canonical Implementation Component identifier."
    public_metadata_fields:
      - "package_name"
      - "path"
      - "public_entrypoint"
      - "public_interface"
    fields:
      development: {required: true, default: {}}
      model: {required: true, default: {}}
      database: {required: true, default: {}}
      logic: {required: true, default: {}}
      api: {required: true, default: {}}
      presentation: {required: true, default: {}}
      platform: {required: true, default: {}}
      configure: {required: true, default: {}}
      plan: {required: true, default: {}}
      develop: {required: true, default: {}}
      review: {required: true, default: {}}
      implement: {required: true, default: {}}
      launch: {required: true, default: {}}
      reset: {required: true, default: {}}
      state: {required: true, default: {}}

initial:
  components:
    development: {}
    model: {}
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    configure: {}
    plan: {}
    develop: {}
    review: {}
    implement: {}
    launch: {}
    reset: {}
    state: {}
