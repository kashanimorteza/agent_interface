schema:
  id: "agent-interface-database-configuration"
  version: "2.1"
  purpose: "The independent structure of database.yaml: supported Engines and their parameters, named Instances, component Settings, and public Operations."
  kind: "Structure standard"
  applies_when: "The Implementation declares a Database Component."
  generates: "<database component path>/database.yaml"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  engines:
    required: true
    purpose: "The database Engines supported by the component."
    shape:
      "<engine-key>":
        name: "<human-readable engine name>"
        driver: "<engine driver or dialect>"
        parameters: "<engine-specific configuration mapping>"

  instances:
    required: true
    purpose: "Named database identities, each using one declared Engine."
    shape:
      "<instance-key>":
        name: "<human-readable instance name>"
        purpose: "<what this instance stores>"
        engine: "<engine-key declared under engines>"
        database: "<database identity>"
        host: "<host or empty>"
        port: "<port or empty>"
        path: "<storage path or empty>"
        username: "<username or empty>"
        password: "<password or empty>"
        parameters: "<instance-specific configuration mapping>"

  settings:
    required: true
    purpose: "Component-wide Database settings."
    shape:
      default_instance: "<instance-key declared under instances>"
      assignments:
        "<purpose-key>": "<instance-key declared under instances>"
      secrets:
        "<secret-key>": "<secret value or secret reference>"
      parameters: "<component-specific configuration mapping>"

  operations:
    required: true
    purpose: "Operations published by the Database Public Interface, separated into fixed Core Operations and optional Extra Operations."
    shape:
      core:
        "<operation-key>":
          enabled: "<true or false>"
          purpose: "<what this Core Operation does for one Model>"
          filters: "<optional conditions such as id = 1 or name = value>"
          order_by: "<optional ordering by one or more fields>"
      extra:
        "<operation-key>":
          enabled: "<true or false>"
          purpose: "<what this optional Extra Operation does>"
          filters: "<optional conditions that constrain the result>"
          order_by: "<optional ordering by one or more fields>"

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  engine_support: "Every declared Engine has one implementation file under the configured engine directory."
  instance_integrity: "Every Instance names an existing Engine."
  setting_integrity: "settings.default_instance and every settings.assignments value name an existing Instance."
  operation_contract: "Only enabled Operations are published through Public Interface. Core Operations work with one Model; Extra Operations may use another request shape. Every Operation accepts optional filters and order_by. Every Engine implementation preserves the applicable standard request and response form."
  configuration_ownership: "This file contains current resources. Database Preferences define layout and conventions."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  engines:
    sqlite:
      name: "SQLite"
      driver: "sqlite"
      parameters:
        timeout_seconds: 30
    postgresql:
      name: "PostgreSQL"
      driver: "postgresql"
      parameters: {}
    mysql:
      name: "MySQL"
      driver: "mysql"
      parameters: {}
    mssql:
      name: "Microsoft SQL Server"
      driver: "mssql"
      parameters: {}

  instances:
    logs:
      name: "Logs"
      purpose: "Application logs."
      engine: "sqlite"
      database: "logs"
      host: ""
      port: ""
      path: "data/logs.db"
      username: ""
      password: ""
      parameters: {}
    reports:
      name: "Reports"
      purpose: "Reporting data."
      engine: "postgresql"
      database: "reports"
      host: "localhost"
      port: "5432"
      path: ""
      username: "report_user"
      password: "<password>"
      parameters: {}
    management:
      name: "Management"
      purpose: "Application management data."
      engine: "mysql"
      database: "management"
      host: "localhost"
      port: "3306"
      path: ""
      username: "management_user"
      password: "<password>"
      parameters: {}

  settings:
    default_instance: "management"
    assignments:
      logs: "logs"
      reports: "reports"
      management: "management"
    secrets:
      encryption_key: "<secret reference>"
    parameters: {}

  operations:
    core:
      add:
        enabled: true
        purpose: "Add one record."
      edit:
        enabled: true
        purpose: "Get one record in its editable form."
      update:
        enabled: true
        purpose: "Update one record."
      list:
        enabled: true
        purpose: "List records."
      delete:
        enabled: true
        purpose: "Delete one record."
      enable:
        enabled: true
        purpose: "Enable one record."
      disable:
        enabled: true
        purpose: "Disable one record."
      get_by_id:
        enabled: true
        purpose: "Get one record by its identifier."
    extra:
      report:
        enabled: true
        purpose: "Return a report that does not operate on one Model."
