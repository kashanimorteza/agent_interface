schema:
  id: "agent-interface-database-configuration"
  version: "1.0"
  purpose: "The structure of the Database Component's runtime configuration file: supported Engines, selectable Instances with their connection settings and credentials, the default Instance, and the at-rest encryption key when one is needed."
  kind: "Structure standard"
  applies_when: "The Implementation declares a Database Component. An Implementation without one ignores this Schema."
  generates: "<database component path>/database.yaml — by default database/database.yaml"
  decided: "2026-09-18"

# <!--------------------------------------------------------------------------------- Ownership -->
ownership:
  owner: "The Database Component; Database Preferences point here through settings.storage_adapter.runtime_configuration.structure."
  written_by: "Developing, as part of generating the Database Component; the Human edits it afterwards."
  authority: "Database Principles and the Target take precedence over this Schema; this Schema fixes only the file's shape."

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  engines:
    required: true
    purpose: "The Engine profiles this Database supports, resolved from Development's Database Item. A profile means the adapter supports that Engine, never that its server is running."
    shape:
      "<engine-key>":
        driver: "<engine driver or dialect>"

  instances:
    required: true
    purpose: "One entry per selectable database identity. Add an Instance by adding an entry here."
    shape:
      "<instance-key>":
        name: "<human-readable name>"
        purpose: "<what this database holds>"
        engine: "<engine-key declared under engines>"
        database: "<database identity>"
        host: "<host>          - empty for a file-backed Engine"
        port: "<port>          - empty for a file-backed Engine"
        path: "<storage path>  - empty for a server-backed Engine"
        username: "<username>"
        password: "<password>"

  default_instance:
    required: true
    purpose: "The instance-key used when a consumer names no Instance. Exactly one, and it must exist under instances."

  encryption:
    required: false
    purpose: "The key used for the at-rest encryption of persisted credential fields, when the Target declares a field whose resolved mode is encrypted. Absent when no Model field needs it."
    shape:
      key: "<encryption key>"

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  adding_an_instance: "Add one entry under instances; no source file changes."
  changing_a_credential: "Edit username or password on that Instance; no source file changes."
  engine_applicability: "Every Instance carries the same keys. host and port apply to server-backed Engines; path applies to file-backed Engines; username and password apply to Engines that authenticate. A key that does not apply to an Instance's Engine is left empty rather than removed, so changing an Instance from one Engine to another means filling values in, not adding keys."
  default_must_exist: "default_instance names an existing Instance. An unknown explicit selection is rejected; an omitted selection uses the default."
  no_source_duplication: "Source reads every value from this file and hardcodes none of them — not the project name, the Instance key, the Engine, the database identity, the path, or a credential."
  credentials: "Connection credentials are written here, beside the Instance that uses them. How this file is protected is an open decision (2026-09-18) and this Schema does not decide it."
  persisted_credentials_are_separate: "A credential field stored inside a Model — a user's password, an API key — is not a connection credential: it follows Database Principle “Credential storage protects values at rest”'s at-rest treatment, and when that treatment is encryption its key is read from this file's encryption.key (decided 2026-09-18)."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  engines:
    sqlite:
      driver: sqlite
    postgresql:
      driver: postgresql+psycopg

  instances:
    general:
      name: "Trading Assistant General"
      purpose: "General application data."
      engine: sqlite
      database: trading_assistant_general
      host: ""
      port: ""
      path: data/trading_assistant_general.db
      username: ""
      password: ""

    analytics:
      name: "Trading Assistant Analytics"
      purpose: "Reporting and historical analysis."
      engine: postgresql
      database: trading_assistant_analytics
      host: localhost
      port: 5432
      path: ""
      username: trading_assistant
      password: "<password>"

  default_instance: general

  encryption:
    key: "<encryption key>"
