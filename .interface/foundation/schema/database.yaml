schema:
  id: "agent-interface-database-configuration"
  version: "2.1"
  purpose: "The independent structure of Database config.yaml: supported Engines and their parameters, named Instances, and component Settings."
  kind: "Structure standard"
  applies_when: "The Implementation declares a Database Component."
  generates: "<database component path>/config.yaml"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  engines:
    required: true
    purpose: "The database Engines supported by the component."
    shape:
      "<engine-key>":
        name: "<human-readable engine name>"
        driver: "<engine driver or dialect>"
        parameters: "<engine-specific configuration mapping>"

  instances:
    required: true
    purpose: "Named database identities, each using one declared Engine."
    shape:
      "<instance-key>":
        name: "<human-readable instance name>"
        active: "<whether the Instance is available through Database Interface>"
        purpose: "<what this instance stores>"
        engine: "<engine-key declared under engines>"
        database: "<database identity>"
        host: "<host or empty>"
        port: "<port or empty>"
        path: "<storage path or empty>"
        username: "<username or empty>"
        password: "<password or empty>"
        parameters: "<instance-specific configuration mapping>"

  settings:
    required: true
    purpose: "Component-wide Database settings."
    shape:
      default_instance: "<instance-key declared under instances>"
      secrets:
        "<secret-key>": "<secret value or secret reference>"
      parameters: "<component-specific configuration mapping>"

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  engine_support: "Every declared Engine selected for implementation has one implementation file under the configured engine directory."
  instance_integrity: "Every Instance names an existing Engine."
  setting_integrity: "settings.default_instance names an active existing Instance."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  engines:
    sqlite:
      name: "SQLite"
      driver: "sqlite"
      parameters:
        timeout_seconds: 30
    postgresql:
      name: "PostgreSQL"
      driver: "postgresql"
      parameters: {}
    mysql:
      name: "MySQL"
      driver: "mysql"
      parameters: {}
    mssql:
      name: "Microsoft SQL Server"
      driver: "mssql"
      parameters: {}

  instances:
    logs:
      name: "Logs"
      active: true
      purpose: "Application logs."
      engine: "sqlite"
      database: "logs"
      host: ""
      port: ""
      path: "data/logs.db"
      username: ""
      password: ""
      parameters: {}
    reports:
      name: "Reports"
      active: true
      purpose: "Reporting data."
      engine: "postgresql"
      database: "reports"
      host: "localhost"
      port: "5432"
      path: ""
      username: "report_user"
      password: "<password>"
      parameters: {}
    management:
      name: "Management"
      active: true
      purpose: "Application management data."
      engine: "mysql"
      database: "management"
      host: "localhost"
      port: "3306"
      path: ""
      username: "management_user"
      password: "<password>"
      parameters: {}

  settings:
    default_instance: "management"
    secrets:
      encryption_key: "<secret reference>"
    parameters: {}
