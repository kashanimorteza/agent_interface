schema:
  id: "agent-interface-database-interface"
  version: "2.0"
  source: "Built from the Architecture and Interface sections of Database Preferences and the Database Definition; rebuilt, with its version raised, whenever either changes a public contract."
  purpose: "The stable, language-independent structure through which consumers use every Database Operation and Lifecycle Command."
  kind: "Interface structure standard"
  applies_when: "The Implementation declares a Database Component."

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  interface:
    required: true
    purpose: "The public entrypoint. It publishes exactly these contracts, each importable by a consumer, and nothing else."
    public_contracts:
      database: "The Database class. A consumer creates one Database object and calls every Operation and Lifecycle Command on it."
      database_instance: "The enumeration of the active configured Instances; it carries no connection values."
      filter: "An immutable condition value."
      filter_operator: "The enumeration of comparison operators."
      filter_combination: "The enumeration of ways Filters combine."
      order: "An immutable ordering value."
      order_direction: "The enumeration of ordering directions."
      command_result: "The result of a Database-wide Operation."
      lifecycle_result: "The result of a Lifecycle Command."
      errors: "One base error and one error for each failure kind, each importable so a consumer can catch it."

  instance_selection:
    required: true
    purpose: "Which Instance a call runs on."
    rule: "Every Operation and Lifecycle Command accepts an optional DatabaseInstance member. When none is given, the call runs on the configured default Instance."
    values: "Only members of DatabaseInstance; an unknown or inactive Instance fails the call before any storage is touched."

  entity_operations:
    required: true
    purpose: "Operations scoped to one Entity. Each receives the Entity itself — an Entity instance or the Entity class imported from Model — never an Entity name or other string identity. Every one also accepts an optional DatabaseInstance."
    operations:
      add:
        parameters: [entity, instance]
        accepts: "one complete new Entity instance"
        returns: "the stored Entity, including generated values"
      update:
        parameters: [entity, instance]
        accepts: "one complete Entity instance; its id only locates the record"
        effect: "replaces every mutable Field; never changes id or another immutable Field"
        returns: "the stored Entity, or null when no record exists"
      list:
        parameters: [entity, filters, combination, orders, limit, instance]
        accepts: "an Entity class, optional Filters, an optional FilterCombination, optional ordered Orders, and an optional limit; a zero or negative limit means no limit"
        returns: "the matching Entity instances"
      get_by_id:
        parameters: [entity, id, instance]
        accepts: "an Entity class and an id"
        returns: "the Entity, or null when no record exists"
      delete:
        parameters: [entity, id, instance]
        accepts: "an Entity class and an id"
        returns: "the final deleted Entity, or null when no record exists"
      enable:
        parameters: [entity, id, instance]
        accepts: "an Entity class and an id"
        effect: "sets only is_active to true"
        returns: "the final Entity, including when it was already enabled, or null when no record exists"
      disable:
        parameters: [entity, id, instance]
        accepts: "an Entity class and an id"
        effect: "sets only is_active to false"
        returns: "the final Entity, including when it was already disabled, or null when no record exists"
      count:
        parameters: [entity, filters, combination, instance]
        accepts: "an Entity class, optional Filters, and an optional FilterCombination"
        returns: "the matching count"
      sum:
        parameters: [entity, field, filters, combination, instance]
        accepts: "an Entity class, one numeric Field reference of that Entity, optional Filters, and an optional FilterCombination"
        effect: "ignores null values"
        returns: "the total, or zero when nothing matches"
      min:
        parameters: [entity, field, filters, combination, instance]
        accepts: "an Entity class, one comparable Field reference of that Entity, optional Filters, and an optional FilterCombination"
        effect: "ignores null values"
        returns: "the smallest value, or null when nothing matches"
      max:
        parameters: [entity, field, filters, combination, instance]
        accepts: "an Entity class, one comparable Field reference of that Entity, optional Filters, and an optional FilterCombination"
        effect: "ignores null values"
        returns: "the largest value, or null when nothing matches"
      truncate:
        parameters: [entity, instance]
        accepts: "an Entity class"
        effect: "removes every record of that Entity and keeps its Table"
        returns: "the deleted count"

  database_wide_operations:
    required: true
    purpose: "Operations scoped to an Instance rather than one Entity. Each also accepts an optional DatabaseInstance."
    operations:
      execute_command:
        parameters: [command, parameters, instance]
        accepts: "a native command in the Instance Engine's query language and its bound parameters"
        effect: "runs any valid command the Engine supports, including a schema change; create_tables remains the standard schema-preparation path"
        returns: "a CommandResult"

  lifecycle_commands:
    required: true
    purpose: "Explicit preparation commands, callable through Interface and through generated manual entry points. Each also accepts an optional DatabaseInstance."
    commands:
      create_tables:
        parameters: [instance]
        effect: "creates every Table from the Entities of the Model Entity Collection and their Declarations, using nothing else; matching Tables are left unchanged; a difference with an existing Table stops the command"
        returns: "a LifecycleResult"
      insert_initial_data:
        parameters: [instance]
        effect: "inserts every missing configured Initial Data record; skips an identical present record; fails on a conflicting one"
        returns: "a LifecycleResult"
      prepare:
        parameters: [instance]
        effect: "runs create_tables and then insert_initial_data; stops without running insert_initial_data when create_tables fails"
        returns: "a LifecycleResult"

  vocabulary:
    required: true
    purpose: "The closed member sets of the enumerations. A consumer imports and passes members; a string is never accepted in their place."
    filter_operator: ["EQUALS", "NOT_EQUALS", "GREATER_THAN", "GREATER_OR_EQUAL", "LESS_THAN", "LESS_OR_EQUAL", "IN", "CONTAINS", "STARTS_WITH", "ENDS_WITH", "IS_NULL", "IS_NOT_NULL"]
    filter_combination: ["AND", "OR"]
    order_direction: ["ASCENDING", "DESCENDING"]

  values:
    required: true
    filter:
      immutable: true
      fields:
        field: "a Field reference the given Entity exposes, never a Field name string"
        operator: "a FilterOperator member"
        value: "an operator-compatible value; absent for IS_NULL and IS_NOT_NULL; a compatible collection for IN"
      compatibility: "CONTAINS, STARTS_WITH, and ENDS_WITH require a textual Field; comparison operators require a value compatible with the Field"
    order:
      immutable: true
      fields:
        field: "a Field reference the given Entity exposes, never a Field name string"
        direction: "an OrderDirection member; ASCENDING when omitted"

  results:
    required: true
    command_result:
      immutable: true
      fields:
        rows: "returned row mappings, or null"
        affected: "affected row count, or null"
        columns: "ordered column names, or null"
        success: "whether the command succeeded"
        message: "a public result or error message"
        instance: "the DatabaseInstance used"
    lifecycle_result:
      immutable: true
      fields:
        command: "the Lifecycle Command name"
        instance: "the DatabaseInstance used"
        success: "whether the command succeeded"
        affected: "the processed Table or record count, or null"
        message: "a public result or error message"

  errors:
    required: true
    purpose: "Failure meanings every realization keeps distinguishable, through the language's own error mechanism, without exposing credentials. Each kind is published as its own error, derived from one base error; their names belong to the selected language profile."
    kinds:
      invalid_configuration_or_instance: "invalid configuration or Instance"
      inactive_instance: "inactive Instance selected"
      invalid_input_or_field: "invalid input or Field"
      declaration_incompatibility: "Declaration incompatibility"
      connection_failure: "connection failure"
      execution_failure: "execution failure"
      incomplete_lifecycle: "incomplete Lifecycle execution"
# <!--------------------------------------------------------------------------------- Rules -->
rules:
  stable_shape: "Changing Entities, Instances, Engines, languages, packages, or internal implementation never changes this structure. An incompatible technology fails generation rather than changing Database meaning."
  parameter_order: "Every Operation and Lifecycle Command takes exactly the listed parameters, by these names and in this order. entity accepts the Entity class or instance the Operation states. Every parameter after entity, id, field, and command is optional with a default; instance is always last."
  entity_by_value: "Every Entity Operation receives an Entity instance or class. No Operation selects an Entity by name."
  no_strings: "Entities, Fields, Instances, operators, combinations, and directions are passed as imported values, never as strings."
  missing_record: "A missing record returns null; it is never an error. Invalid input, configuration, connection, or execution remains an error."
  capability_groups: "Entity Operations, Database-wide Operations, and Lifecycle Commands are mandatory conceptual groups; they do not require language-specific wrapper objects."
  field_validation: "Every Field in a Filter, Order, or aggregate is validated against the given Entity before any Instance is accessed."
  serialized_vocabulary: "Configuration stores canonical enumeration member names and resolves them when loading; an unknown name fails loading."
  instance_enumeration: "DatabaseInstance has exactly one member per active configured Instance and none for an inactive one."
  internal_hidden: "Core, Engine implementations, configuration, connection values, and storage paths are never published."
  side_effect_free: "Loading Interface opens no connection and creates no data or file."
  contract_change: "Changing any public contract, its members, or its meaning requires an explicit Schema version change and consumer review."
