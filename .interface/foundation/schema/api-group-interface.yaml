schema:
  id: "agent-interface-api-group-interface"
  version: "1.0"
  purpose: "The stable, language-independent contract through which every API Group states what it serves, so API can realize every Group the same way."
  kind: "Interface structure standard"
  applies_when: "The Implementation declares an API Component with at least one Group."
  generates: "<api component path>/<groups directory>/<group directory>/<adapter>"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  group:
    required: true
    role: "The fixed role the Group's Preferences declare."
    name: "The configurable name that sets the Group's URL segment."

  source:
    required: true
    purpose: "The one published Interface the Group serves and what it takes from it, found from that Interface's own Preferences."

  adapters:
    required: true
    membership: "One Adapter for every member of the collection the source publishes; a member added or removed adds or removes its Adapter."
    naming: "Named from its member by the Adapter pattern in the Group's Preferences."
    binding: "Bound permanently to one member; a caller never supplies it."

  endpoints:
    required: true
    membership: "One Endpoint for every operation of the Adapter's member; an operation added or removed adds or removes its Endpoint."
    identity: "Never stated by the Group; API derives it."

  parameters:
    required: true
    source: "Exactly the operation's parameters: same names, requirements, structures, and defaults, with types the source publishes."

  handler:
    required: true
    effect: "Calls the same operation through the source."
    returns: "Exactly the operation's result, unchanged."
    errors: "Exactly the operation's errors, unchanged."

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  no_behaviour: "No Handler adds a decision, semantic validation, initialization, wrapper, other call, retry, or alternate path."
  no_technique: "A Group states no Method, Path, placement, protocol, or technology; API owns every one."
  contract_change: "A change to this structure requires a Schema version change; a change in what a source publishes flows through without one."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  group:     {role: "<role>", name: "<Name>"}
  source:    "<published Interface> — <what it takes from it>"
  adapters:  one per <member>
  endpoints: one per <operation> of each <member>
