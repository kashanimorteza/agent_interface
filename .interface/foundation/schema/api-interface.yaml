schema:
  id: "agent-interface-api-interface"
  version: "1.2"
  purpose: "The stable, language-independent structure of API's public surface: every listed Group beneath its own URL segment, and nothing of API's own."
  kind: "Interface structure standard"
  applies_when: "The Implementation declares an API Component."
  generates: "<api component path>/<bootstrap file>"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  base_url:
    required: true
    source: "transport_protocol, host, port, and the optional key of the runtime Configuration."
    shape: "<transport_protocol>://<host>:<port>[/<key>]"

  groups:
    required: true
    source: "The Group list in API Preferences; each Group's name comes from that Group's own Preferences."
    membership: "One registration for every listed Group. A Group added to or removed from the list adds or removes its registration."
    segment: "Each Group is registered at <base_url>/<group segment>, the segment derived from its configured name."
    value: "Each registration serves exactly that Group's own Endpoints, unchanged."

  endpoints:
    required: true
    source: "Each Group's own Interface Schema states which Endpoints it needs."
    identity: "Every Endpoint is derived from its operation's structure at generation: POST /<operation>, or /<operation>/{id} when it takes an id; never listed by hand."
    placement: "id uses Path; every other Parameter uses Body."
    url: "<base_url>/<group segment>/<adapter segment><endpoint path>"

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  no_own_surface: "API serves no Endpoint, path, wrapper, or behaviour of its own."
  unique: "No two Groups share a segment, and no two Endpoints share a Method and Path."
  contract_change: "A change to this structure requires a Schema version change; a change in the Group list flows through without one."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  <transport_protocol>://<host>:<port>[/<key>]/<group>/<adapter>/<operation>[/{id}]   → that Group's Endpoint, unchanged
