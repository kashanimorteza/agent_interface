# <!--------------------------------------------------------------------------------- Schema -->
schema:
  id: "agent-interface-model-declaration"
  version: "1.1"
  purpose: "The Declaration Vocabulary: the one standard, technology-independent set of terms every Domain Definition states itself in. Model Principles require the vocabulary; this file fixes its terms and their meanings, so every Component reads the same declaration."

# <!--------------------------------------------------------------------------------- Frame -->
frame:
  owner: "Model"
  carried_by: "The same Domain Definition that application code uses. There is no second artifact beside it, and every Component reads the declaration through the Model Public Interface."
  authority: "A term here means what this file says it means. Adding a term, or changing what one means, is a change to this file and not a per-project decision."
  realization: "Each selected technology decides how a Domain Definition represents these terms in its own form. This file fixes the meanings, never the syntax."

# <!--------------------------------------------------------------------------------- Field -->
field:
  purpose: "What a Domain Definition declares about one of its Fields."
  terms:
    type:
      required: true
      purpose: "The logical value type the Field holds, resolved by Model from the Target — for example integer, string, decimal, boolean, datetime. No closed list: Model decides, and each realization maps the logical type to its own type system."
    length:
      required: false
      purpose: "The maximum length of a textual or binary value, when the Target declares one."
    precision:
      required: false
      purpose: "The total digits and scale of an exact numeric value, when the Target declares them."
    optional:
      required: true
      purpose: "Whether the domain allows this Field to have no value. It is a statement about the domain, not about storage; a non-persistent Domain Definition declares it too. How an absent value is recorded — a null column, an omitted key, anything else — belongs to the Component that records it."
    default:
      required: false
      purpose: "The value the Field takes when the Target declares one and none is supplied."
    identity:
      required: false
      purpose: "Marks the Field, or the ordered set of Fields, that identifies one record of this Domain Definition."
    generated:
      required: false
      purpose: "Marks a Field whose value the domain does not supply because something else produces it — most often the identity of a stored record. Which mechanism produces it belongs to the Component that produces it."
    unique:
      required: false
      purpose: "Marks a Field whose value does not repeat across the records of this Domain Definition. It is a domain constraint; enforcing it is the work of whichever Component holds the records."
    credential:
      required: false
      purpose: "Classifies the Field as a credential and states the at-rest treatment the Target requires for it. Model classifies; it never applies the treatment and never removes the Field from anything."

    activation:
      required: false
      purpose: "Marks the Field whose value says whether a record is active, when the Target gives a Domain Definition that notion. It is declared, never found by name: a Component that offers enabling and disabling sets this declared Field and no other."

# <!--------------------------------------------------------------------------------- Relationship -->
relationship:
  purpose: "What a Domain Definition declares about an association to another Domain Definition."
  terms:
    reference:
      required: true
      purpose: "The Domain Definition this relationship refers to, carried as that definition itself rather than as its name in text, together with the Field of it that is referred to. A reference that does not resolve is a broken declaration where it is written."
    cardinality:
      required: true
      purpose: "The multiplicity of the association as the Target declares it. It is never left to a default."
    optional:
      required: true
      purpose: "Whether the domain allows this association to be absent. Stated from the Target, never defaulted."

# <!--------------------------------------------------------------------------------- Definition -->
definition:
  purpose: "What a Domain Definition declares about itself."
  terms:
    persistence:
      required: true
      purpose: "Whether the Domain Definition is `persistent` or `non-persistent`. Database stores only the persistent ones and never infers this."
    unique_sets:
      required: false
      purpose: "Composite uniqueness constraints, each an ordered set of Field names whose combined value does not repeat."

# <!--------------------------------------------------------------------------------- Excluded -->
excluded:
  purpose: "Terms that look as though they belong here and do not, with the owner of each."
  index: "An access-path decision, chosen from how data is read and how much of it there is. It belongs to the Component that stores the data. Model declares uniqueness, which is a domain fact."
  foreign_key: "One storage realization of a relationship's reference. Database names it; Model declares the reference."
  column_type: "A storage type. Model declares the logical type and never a column type."
  nullable: "A storage term for what the domain calls optional. Recording an absent value belongs to the Component that records it."
