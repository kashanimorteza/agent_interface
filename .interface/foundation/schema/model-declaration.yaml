schema:
  id: "agent-interface-model-declaration"
  version: "1.3"
  purpose: "The technology-independent vocabulary carried by every independent Model Domain Definition."

vocabulary:
  definition:
    required_fields:
      id:
        required: true
        purpose: "The stable, domain-oriented identity of the Domain Definition."
      name:
        required: true
        purpose: "The Target-derived domain name of the Definition."
      description:
        required: true
        purpose: "The Target-derived meaning and responsibility of the Definition."
      kind:
        required: true
        allowed: ["entity", "value-object", "enumeration"]
        purpose: "The Target-derived kind of Domain Definition."
      public:
        required: true
        allowed: [true, false]
        purpose: "Whether the Definition is published through the Public Interface and Public Registry."
      fields:
        required: false
        purpose: "The complete Field set owned by an entity or value-object Definition."
      intrinsic_rules:
        required: false
        purpose: "The complete local data rules that apply to this Definition as a whole."
      literals:
        required: false
        purpose: "The complete set of values when this Definition is an enumeration."

  field:
    required_fields:
      name:
        required: true
        purpose: "The Target-derived identity of the Field."
      description:
        required: true
        purpose: "The Target-derived meaning of the Field."
      logical_type:
        required: true
        allowed: ["text", "integer", "decimal", "boolean", "date", "datetime"]
        purpose: "The technology-independent logical type of the Field."
      nullable:
        required: true
        purpose: "Whether the Field may hold an explicit null value."
      required:
        required: true
        purpose: "Whether the Field must be supplied when an instance is constructed."
      cardinality:
        required: false
        purpose: "The number of simple values the Field may hold when the Definition requires it."
      default:
        required: false
        purpose: "The declared value or local calculation used when construction receives no value for the Field."
      identity:
        required: false
        purpose: "Whether the Field expresses the Definition's logical identity when declared."
      length:
        required: false
        purpose: "The Target-declared length when one exists."
      precision:
        required: false
        purpose: "The Target-declared precision when one exists."
      constraints:
        required: false
        purpose: "Single-Field constraints declared by the Target."
      sensitivity:
        required: false
        purpose: "The Target-declared sensitivity or credential classification of the Field when it has one."

  constraint:
    required_fields:
      id:
        required: true
        purpose: "The stable identity of the declared constraint."
      description:
        required: true
        purpose: "The Target-derived condition the constraint expresses."

  intrinsic_rule:
    required_fields:
      id:
        required: true
        purpose: "The stable identity of the declared intrinsic rule."
      description:
        required: true
        purpose: "The Target-derived local data rule of the Domain Definition."

  enumeration_literal:
    required_fields:
      name:
        required: true
        purpose: "The Target-derived identity of the enumeration value."
      description:
        required: true
        purpose: "The Target-derived meaning of the enumeration value."

rules:
  target_meaning: "The vocabulary carries Target meaning and never invents a Definition, Field, constraint, default, or sensitivity classification."
  technology_independence: "Vocabulary values remain independent of language, package, database, engine, and runtime."
  descriptions: "Every Domain Definition and Field has a description."
  public_surface: "Only a Definition declared public is listed in the Public Registry; its id is the stable public identity used by consumers."
  default_integrity: "A default applies only when construction receives no value for the Field; it does not override a supplied value."
  constraint_integrity: "Constraints and Intrinsic Rules use identifiers unique within their Domain Definition."
  flat_independence: "Every Definition is self-contained, flat, and independently understandable. Fields describe values belonging to that Definition alone."
  kind_integrity: "An enumeration declares its complete literals and has no Fields. An entity or value-object declares its complete Fields and has no literals."
  literal_integrity: "Enumeration literal names are unique within their Domain Definition."
  completeness: "A Domain Definition carries its complete Target-derived meaning, kind, public status, Fields, Intrinsic Rules, constraints, and enumeration literals when applicable."
