schema:
  id: "agent-interface-state"
  version: "12.6"
  purpose: "Operational State format; State Principles define record meaning and ownership."
operational_scope:
  stores: "Active Workflow position, aggregate phase progress, and append-only Skill execution history."
  excludes: "Target meaning, technical decisions, individual Task status or history, Finding details, product code, secrets, and command transcripts."
initialization:
  source: "initial"
  purpose: "Create State Config from this template, then synchronize phase identities from Target without interpreting phase content."
  preservation: "Reconciliation preserves existing operational records and never replaces them with defaults."
structure: ["active", "phases", "history"]
sections:
  active:
    required: true
    default: {}
    fields:
      mode:
        required: true
        default: "not set"
        allowed: ["not set", "configuring", "planning", "development"]
      phase: {required: true, default: null, nullable: true}
      mode_reason: {required: true, default: "No Workflow operation has been recorded."}
      set_by: {required: true, default: "initialization"}
      set_at: {required: true, default: null, nullable: true}
  phases:
    required: true
    default: {}
    purpose: "Aggregate operation progress keyed by stable Target phase identifier."
    fields:
      "<phase>":
        required: false
        default: {}
        fields:
          id: {required: true, default: ""}
          planning:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "completed"]
          development:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "completed"]
          review:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "plan satisfied", "satisfied", "not satisfied", "inconclusive"]
          updated_by: {required: true, default: "initialization"}
          updated_at: {required: true, default: null, nullable: true}
  history:
    required: true
    default: []
    purpose: "Append-only concise records of State-changing Workflow events."
    item:
      fields:
        id: {required: false, default: "", purpose: "The stable identifier of this History record when one is assigned."}
        number: {required: false, default: null, nullable: true, purpose: "The chronological sequence number of this History record when one is assigned."}
        skill: {required: false, default: "", purpose: "The Skill that performed this recorded action when one is assigned."}
        parent_id: {required: false, default: "", purpose: "The identifier of the Skill or coordinator that invoked this record when applicable."}
        phase: {required: false, default: null, nullable: true}
        event: {required: false, default: ""}
        outcome: {required: false, default: ""}
        started_at: {required: false, default: null, nullable: true}
        completed_at: {required: false, default: null, nullable: true}
        duration_ms: {required: false, default: null, nullable: true, purpose: "Elapsed execution time in milliseconds when it can be measured."}
        token_usage:
          required: false
          default: {}
          purpose: "Measured token consumption when the Runtime exposes it; unknown values remain null."
          fields:
            input: {required: false, default: null, nullable: true}
            output: {required: false, default: null, nullable: true}
            total: {required: false, default: null, nullable: true}
        skills_used:
          required: false
          default: []
          purpose: "The Skills actually used by this operation."
          item:
            name: {required: false, default: ""}
            duration_ms: {required: false, default: null, nullable: true}
            token_usage:
              required: false
              default: {}
              fields:
                input: {required: false, default: null, nullable: true}
                output: {required: false, default: null, nullable: true}
                total: {required: false, default: null, nullable: true}
            report: {required: false, default: ""}
        open_questions: {required: false, default: [], purpose: "Open Question identifiers created, read, or affected by this record when applicable."}
        blockers: {required: false, default: [], purpose: "Blocker identifiers created, read, or affected by this record when applicable."}
        report: {required: false, default: "", purpose: "A concise explanation of what this record did and what a later Skill should know."}
        data:
          required: false
          purpose: "An optional Skill-owned YAML value for information specific to this record. It may be a nested mapping or list and has no shared fixed fields."
        recorded_by: {required: false, default: ""}
        recorded_at: {required: false, default: null, nullable: true}
initial:
  meta:
    path: ".interface/config/state.yaml"
    path_note: "Mutable Workflow position, aggregate progress, and append-only Skill execution history."
  policy:
    agent_may_edit: true
    rule: "Apply the current State Component and the active operation's ownership rules."
  read_order: ["active", "phases", "history"]
  content_map:
    active: "Current or most recently recorded Workflow position."
    phases: "Aggregate Planning, Development, and Review progress by phase identifier."
    history: "Append-only State-changing Workflow events."
  content:
    active:
      mode: "not set"
      phase: null
      mode_reason: "No Workflow operation has been recorded."
      set_by: "initialization"
      set_at: null
    phases: {}
    history: []
