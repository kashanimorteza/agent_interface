schema:
  id: "agent-interface-state"
  version: "12.1"
  purpose: "Operational State format; State Principles define record meaning and ownership."
operational_scope:
  stores: "Active Workflow position, aggregate phase progress, Implement and Launch results, operational history, Blockers, and Open Questions."
  excludes: "Target meaning, technical decisions, individual Task status or history, Finding details, product code, secrets, and command transcripts."
initialization:
  source: "initial"
  purpose: "Create State Config from this template, then synchronize phase identities from Target without interpreting phase content."
  preservation: "Reconciliation preserves existing operational records and never replaces them with defaults."
structure: ["active", "phases", "implementation", "launch", "history", "blockers", "open_questions"]
sections:
  active:
    required: true
    default: {}
    fields:
      mode:
        required: true
        default: "not set"
        allowed: ["not set", "configuring", "planning", "development"]
      phase: {required: true, default: null, nullable: true}
      mode_reason: {required: true, default: "No Workflow operation has been recorded."}
      set_by: {required: true, default: "initialization"}
      set_at: {required: true, default: null, nullable: true}
  phases:
    required: true
    default: {}
    purpose: "Aggregate operation progress keyed by stable Target phase identifier."
    fields:
      "<phase>":
        required: false
        default: {}
        fields:
          id: {required: true, default: ""}
          planning:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "completed"]
          development:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "completed"]
          review:
            required: true
            default: "not started"
            allowed: ["not started", "in progress", "plan satisfied", "satisfied", "not satisfied", "inconclusive"]
          updated_by: {required: true, default: "initialization"}
          updated_at: {required: true, default: null, nullable: true}
  implementation:
    required: true
    default: {}
    fields:
      status:
        required: true
        default: "not started"
        allowed: ["not started", "in progress", "completed", "blocked"]
      started_at: {required: true, default: null, nullable: true}
      completed_at: {required: true, default: null, nullable: true}
      updated_by: {required: true, default: "initialization"}
      updated_at: {required: true, default: null, nullable: true}
  launch:
    required: true
    default: {}
    fields:
      status:
        required: true
        default: "not launched"
        allowed: ["not launched", "launching", "launched", "failed", "stopped"]
      environment: {required: true, default: null, nullable: true}
      method: {required: true, default: null, nullable: true}
      access_points:
        required: true
        default: []
        item:
          fields:
            name: {required: true, default: ""}
            kind: {required: true, default: ""}
            address: {required: true, default: ""}
      updated_by: {required: true, default: "initialization"}
      updated_at: {required: true, default: null, nullable: true}
  history:
    required: true
    default: []
    purpose: "Append-only concise records of State-changing Workflow events."
    item:
      fields:
        id: {required: true, default: ""}
        operation: {required: true, default: ""}
        phase: {required: true, default: null, nullable: true}
        event: {required: true, default: ""}
        outcome: {required: true, default: ""}
        recorded_by: {required: true, default: ""}
        recorded_at: {required: true, default: ""}
  blockers:
    required: true
    default: {}
    fields:
      "<blocker>":
        required: false
        default: {}
        fields:
          id: {required: true, default: ""}
          blocks: {required: true, default: ""}
          what_is_missing: {required: true, default: ""}
          consequence: {required: true, default: ""}
          resolution_owner: {required: true, default: ""}
          raised_by: {required: true, default: ""}
          raised_at: {required: true, default: ""}
  open_questions:
    required: true
    default: {}
    fields:
      "<question>":
        required: false
        default: {}
        fields:
          id: {required: true, default: ""}
          question: {required: true, default: ""}
          why_it_matters: {required: true, default: ""}
          blocks: {required: false, default: null, nullable: true}
          raised_by: {required: true, default: ""}
          raised_at: {required: true, default: ""}
          answered_so_far:
            required: false
            default: null
            nullable: true
            fields:
              answer: {required: true, default: ""}
              answered_by: {required: true, default: ""}
              answered_at: {required: true, default: ""}
initial:
  meta:
    path: ".interface/foundation/config/state.yaml"
    path_note: "Mutable Workflow position, aggregate progress, runtime result, operational history, Blockers, and Open Questions."
  policy:
    agent_may_edit: true
    rule: "Apply the current State Component and the active operation's ownership rules."
  read_order: ["active", "phases", "implementation", "launch", "history", "blockers", "open_questions"]
  content_map:
    active: "Current or most recently recorded Workflow position."
    phases: "Aggregate Planning, Development, and Review progress by phase identifier."
    implementation: "Latest end-to-end Implement result."
    launch: "Current runtime result and verified access points."
    history: "Append-only State-changing Workflow events."
    blockers: "Unresolved critical conditions."
    open_questions: "Unresolved critical questions."
  content:
    active:
      mode: "not set"
      phase: null
      mode_reason: "No Workflow operation has been recorded."
      set_by: "initialization"
      set_at: null
    phases: {}
    implementation:
      status: "not started"
      started_at: null
      completed_at: null
      updated_by: "initialization"
      updated_at: null
    launch:
      status: "not launched"
      environment: null
      method: null
      access_points: []
      updated_by: "initialization"
      updated_at: null
    history: []
    blockers: {}
    open_questions: {}
