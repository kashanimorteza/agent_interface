schema:
  id: "agent-interface-logic-interface"
  version: "1.1"
  purpose: "The stable, language-independent structure of Logic Interface: one unchanged entry for every Service Logic lists."
  kind: "Interface structure standard"
  applies_when: "The Implementation declares a Logic Component."
  generates: "<logic component path>/<interface file>"

# <!--------------------------------------------------------------------------------- Structure -->
structure:

  interface:
    required: true
    purpose: "The Logic entrypoint. It publishes exactly the Service entries below, and nothing else."

  services:
    required: true
    source: "The Service list in Logic Preferences; each Service's name and Interface location come from that Service's own Preferences."
    membership: "One entry for every listed Service. A Service added to or removed from the list adds or removes its entry."
    naming: "Each entry carries its Service's configured name."
    value: "Each entry is the Service's own Interface, the identical object, never a copy or wrapper."

# <!--------------------------------------------------------------------------------- Rules -->
rules:
  no_behaviour: "Logic Interface defines no Action, wrapper, or rule of its own."
  contract_change: "A change to this structure requires a Schema version change; a change in the Service list flows through without one."

# <!--------------------------------------------------------------------------------- Example -->
example: |
  from logic.interface import Entity, Storage

  users = Entity.User()
  print(users.count())
  Storage.Storage().prepare()
