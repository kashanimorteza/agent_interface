schema:
  id: "agent-interface-yaml"
  version: "1.1"
  purpose: "The common structural frame followed by Interface Preferences and Config files. It defines their outer sections; what goes inside `content` belongs to the schema of that kind of file. Schema definition files, including this file, use their own definition formats and are outside this frame's scope."

structure:
  - meta
  - policy
  - read_order
  - content_map
  - content

sections:

  # <!--------------------------------------------------------------------------------- Meta -->
  meta:
      required: true
      fields:
        path:
          required: true
          purpose: "The path of the file."

        path_note:
          required: true
          purpose: "Explains the location, layer, and role of the file."
          
  # <!--------------------------------------------------------------------------------- Policy -->
  policy:
    required: true
    purpose: "Rules and policy for reading, interpreting, and modifying the file."

  # <!--------------------------------------------------------------------------------- Read_Order -->
  read_order:
    required: true
    purpose: "The order the content sections are read in, and why."

  # <!--------------------------------------------------------------------------------- Content_Map -->
  content_map:
    required: true
    purpose: "Semantic map of the content and the responsibility of each content item."

  # <!--------------------------------------------------------------------------------- Content -->
  content:
    required: true
    purpose: "Actual file content."
