# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/state.yaml"
  path_note: "Mutable Workflow position, aggregate progress, runtime result, operational history, Blockers, and Open Questions."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["active", "phases", "implementation", "launch", "history", "blockers", "open_questions"]


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current or most recently recorded Workflow position."
  phases: "Aggregate Planning, Development, and Review progress by phase identifier."
  implementation: "Latest end-to-end Implement result."
  launch: "Current runtime result and verified access points."
  history: "Append-only State-changing Workflow events."
  blockers: "Unresolved critical conditions."
  open_questions: "Unresolved critical questions."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- active -->
  active:
    mode: "development"
    phase: "P1"
    mode_reason: "Development implemented and verified every planned Task of P1."
    set_by: "my-interface-developing"
    set_at: "2026-09-10"

  # <!-------------------------------------------- phases -->
  phases:
    P1: {id: "P1", planning: "completed", development: "completed", review: "not started", updated_by: "my-interface-developing", updated_at: "2026-09-10"}
    P2: {id: "P2", planning: "not started", development: "not started", review: "not started", updated_by: "initialization", updated_at: null}
    P3: {id: "P3", planning: "not started", development: "not started", review: "not started", updated_by: "initialization", updated_at: null}
    P4: {id: "P4", planning: "not started", development: "not started", review: "not started", updated_by: "initialization", updated_at: null}
    P5: {id: "P5", planning: "not started", development: "not started", review: "not started", updated_by: "initialization", updated_at: null}
    P6: {id: "P6", planning: "not started", development: "not started", review: "not started", updated_by: "initialization", updated_at: null}

  # <!-------------------------------------------- implementation -->
  implementation:
    status: "not started"
    started_at: null
    completed_at: null
    updated_by: "initialization"
    updated_at: null

  # <!-------------------------------------------- launch -->
  launch:
    status: "not launched"
    environment: null
    method: null
    access_points: []
    updated_by: "initialization"
    updated_at: null

  # <!-------------------------------------------- history -->
  history:
    - id: "H1"
      operation: "configure"
      phase: null
      event: "Operational Config generated, phase records synchronized, and the selected Environment prepared."
      outcome: "State, Plan, and Review Config created from their Schema templates; phase records created for every current Target phase identifier at initialization defaults; selected Environment inspected and its missing requirements installed."
      recorded_by: "my-interface-configure"
      recorded_at: "2026-09-09"
    - id: "H2"
      operation: "planning"
      phase: "P1"
      event: "Planning started for P1."
      outcome: "Active mode set to planning for P1 and P1 Planning progress recorded as in progress."
      recorded_by: "my-interface-planning"
      recorded_at: "2026-09-10"
    - id: "H3"
      operation: "planning"
      phase: "P1"
      event: "Plan for P1 created and validated."
      outcome: "P1 Plan created with 4 Groups and 35 Tasks, all todo; P1 Planning progress recorded as completed; Open Question Q1 raised without blocking the Plan."
      recorded_by: "my-interface-planning"
      recorded_at: "2026-09-10"
    - id: "H4"
      operation: "development"
      phase: "P1"
      event: "Development started for P1."
      outcome: "Active mode set to development for P1 and P1 Development progress recorded as in progress."
      recorded_by: "my-interface-developing"
      recorded_at: "2026-09-10"
    - id: "H5"
      operation: "development"
      phase: "P1"
      event: "P1 Development completed."
      outcome: "All 35 P1 Tasks implemented and verified with recorded checks; the Model package is installable and publishes all 15 Models and their initial records. P1 Development progress recorded as completed; Open Question Q1 remains open and was resolved provisionally from the current authorities."
      recorded_by: "my-interface-developing"
      recorded_at: "2026-09-10"

  # <!-------------------------------------------- blockers -->
  blockers: {}

  # <!-------------------------------------------- open_questions -->
  open_questions:
    Q1:
      id: "Q1"
      question: "Should the name field of Currency, Broker, Asset, Instance, Account Group, Trailing Group, Partial Group, and Action Group be unique across all records, as the Model name-field default makes it when the project definition states no uniqueness for the field, or unique only within the combination named by that Model's declared uniqueness rule?"
      why_it_matters: "The project definition states no uniqueness property for these name fields but declares combined uniqueness rules that include them, while the Model field defaults make every unstated name field unique. Applied as written, the default makes those combined rules redundant and prevents a second user from reusing a name such as Default, which conflicts with the stated multi-user intent. The resolution becomes Model declarations in P1 and persistence constraints in P2; until it is answered, Development resolves it from the current authorities, and a later answer may require revisiting those declarations."
      blocks: null
      raised_by: "my-interface-planning"
      raised_at: "2026-09-10"
