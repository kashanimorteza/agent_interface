              declared field, nullability, default, and relationship, with foreign keys referencing their
              related structures and traceable to the User Model it implements. The storage structure
              itself rejects a new or updated record that would violate the declared uniqueness rule:
              name must be unique across User records.'
            depends_on:
            - P2-T1
            constraints: []
            acceptance: Persisting and retrieving a User record round-trips every declared field without
              loss; a missing required field or a violated persistence-level rule is rejected by the storage
              structure rather than silently accepted. Both credential fields resolve to hash storage
              at rest, not the generic encrypted default that would otherwise apply to a field literally
              named api_key. A record violating the declared uniqueness rule is rejected by the storage
