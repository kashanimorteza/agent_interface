meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 37
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model package and its reusable public interface, expressing every domain entity, relationship, rule, and initial-data declaration from the current Target Model definition.
      constraints: []
      task_count: 19
      groups:
        P1-G1:
          id: P1-G1
          title: Package Foundation
          description: Establishes the independent Model package boundary, its shared base class, and its public interface skeleton so every domain entity can be added behind one stable import surface.
          area: Model package scaffolding and shared base class
          does: A stable, importable Model package exists with a documented public interface and a shared base class ready to hold domain entities.
          constraints: []
          task_count: 1
          tasks:
            P1-T1:
              id: P1-T1
              title: Establish the Model package and shared base class
              description: Create the independent Model package as one importable unit with a documented public interface and a shared base class that every domain entity will inherit from, free of any persistence, transport, or workflow concerns.
              reason: Every domain entity needs one common package boundary and base representation before it can be added, so the package and its shared base must exist first.
              kind: code
              inputs: []
              expected_result: An importable Model package exists with an empty but documented public interface and a shared base class usable by every future domain entity.
              depends_on: []
              constraints: []
              acceptance: The package can be imported through its documented namespace with no I/O, network, or database activity occurring at import time.
              verify: Importing the package's public namespace succeeds in a clean isolated environment and exposes no domain entities yet.
              status: done
              log:
              - at: '2026-09-12T05:05:00Z'
                by: developing
                event: completed
                check: Imported my_model.__init__ in a clean venv with no I/O; the package exposed an empty entity surface bound to the shared base class.
