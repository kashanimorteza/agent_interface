              - '2026-09-19T17:09:02Z [done] Transient spec-driven check derived from the Target passed 37 of 37 observations: declaration matches the Target term for term, defaults, credential classification, uniqueness, conforming/missing/null/wrong-typed/unknown-Field data, round trip, own module.'
