meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 18
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Establish the independent Model package that defines every domain entity, field, relationship,
        rule, and required initial data declared by the project, exposed through one canonical public
        import interface and documented for its developers with complete runnable usage examples.
      constraints: []
      task_count: 18
      groups:
        P1-G1:
          id: P1-G1
          title: Model Package Foundation
          description: The shared package structure and base Model configuration every domain Model in
            this phase extends.
          area: Shared package foundation and base Model configuration
          does: A ready-to-extend Model package exists with one shared, strict base configuration that
            every domain Model builds on.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Establish the Model package foundation
              description: Create the independent Model package's foundational structure and the shared
                base Model configuration that every domain Model in this phase will extend.
              reason: Every domain Model depends on one consistent, strict base configuration; establishing
                it once avoids each Model inventing its own foundation independently.
              kind: code
              inputs:
              - Resolved Model implementation language, environment, and modeling library choices
              expected_result: An importable Model package exists with a shared base Model configuration
                enforcing the project's strict validation policy, ready for individual domain Models to
                extend.
              depends_on: []
              constraints: []
              acceptance: The package can be installed into its isolated environment and imported without
                error, and a minimal Model built on the shared base configuration validates a correct
                instance and rejects one carrying an undeclared field.
              verify: Importing the package succeeds, and a Model extending the shared base configuration
                accepts a valid instance while rejecting one with an unexpected field.
              status: done
              log:
              - at: '2026-09-12T00:57:54Z'
                by: my-interface-developing
                event: 'Implemented via the resolved Model implementation stack (uv-managed Python/Pydantic
                  package under my_model/; shared base class renamed to BaseModel per the forbidden-name
                  constraint on ''Model''). Verified by running tests/test_foundation.py (3 tests: package
                  imports, base model accepts/rejects, base class is not named Model): passed. Full suite
                  (50 tests, clean uv sync install) passed.'
        P1-G2:
          id: P1-G2
          title: Identity and Trading Platform Models
          description: The User identity concept and the catalog of supported Trading Platforms, independent
            of each other and of every other Model in this phase.
          area: User identity and Trading Platform catalog
          does: The User and Trading Platform domain concepts are available as validated Models with their
            declared fields, rules, and initial data.
          constraints: []
          task_count: 2
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              title: Define the User Model
              description: Define the User domain Model with its declared identity, credential, status,
                and descriptive fields, its credential storage rules, and its required initial administrative
                record.
              reason: User is the independent identity the rest of the user-owned domain depends on.
              kind: code
              inputs:
              - The project's User field, rule, and initial data definitions
              - The applicable Model Principles and Preferences
              expected_result: A User Model that validates its declared fields and rules and declares
                its one required initial administrative record.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: A User instance with valid data validates successfully; one violating a declared
                rule or carrying an unexpected field is rejected; the declared initial data includes exactly
                the required administrative User.
              verify: Constructing a valid User succeeds; constructing an invalid one raises a validation
                error; the Model's declared initial data names exactly the required administrative User.
              status: done
              log:
              - at: '2026-09-12T00:57:54Z'
                by: my-interface-developing
                event: 'Implemented via the resolved Model implementation stack (uv-managed Python/Pydantic
                  package under my_model/; shared base class renamed to BaseModel per the forbidden-name
                  constraint on ''Model''). Verified by running tests/test_models.py::test_user_valid_and_rejects_unexpected_field
                  and test_user_initial_data_matches_target: passed. Full suite (50 tests, clean uv sync
                  install) passed.'
