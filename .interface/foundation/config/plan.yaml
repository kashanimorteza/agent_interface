meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 18
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 1
      target: Model
      does: Deliver the Model library's shared Foundation and an authoritative Domain Definition for every domain concept the Target defines, each exposed through one stable Public Interface with its declared fields, relationships, and rules preserved, and documented as a complete, operational package.
      constraints: []
      task_count: 18
      groups:
        P1-G1:
          id: P1-G1
          title: Model Foundation
          description: The shared foundation every concrete Domain Definition in this phase builds on.
          area: Shared Model Foundation
          does: A shared Model Foundation is available for every concrete Domain Definition to build on.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Establish the Model Foundation
              description: Establish the Model Foundation shared by every concrete Domain Definition in this phase, supplying applicable common configuration and behavior consistently rather than letting each Domain Definition duplicate it.
              reason: Model Principles require every concrete Model realization to receive applicable shared configuration and behavior through one Model Foundation.
              kind: code
              inputs:
              - The Model Component Profile and its applicable Language Item
              expected_result: A shared Model Foundation exists and is available to every Domain Definition realized afterward in this phase.
              depends_on: []
              constraints: []
              acceptance: Every Domain Definition built afterward in this phase receives its applicable shared configuration and behavior from this one Foundation rather than repeating it independently.
              verify: Shared configuration and behavior are observed to apply consistently across more than one Domain Definition built on the Foundation, with no such behavior duplicated independently.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_foundation.py (7 checks) — unknown-field rejection and assignment validation observed consistently across User, Broker, and Trading Platform; every Domain Definition's effective configuration observed equal to the Foundation's.
                outcome: passed
        P1-G2:
          id: P1-G2
          title: Identity and Connectivity
          description: The domain concepts that identify a system user and a connection to a supported Trading Platform.
          area: User identity and platform-connectivity domain definitions
          does: User identity and platform-connectivity domain concepts are represented as authoritative Domain Definitions.
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              title: Define the User Domain Definition
              description: Define User as Model's authoritative Domain Definition, preserving every field, credential meaning, and rule the Target states for it.
              reason: Every user-owned domain concept in this Target depends on User as its owning identity, so Model must give User exactly one authoritative meaning.
              kind: code
              inputs:
              - The Target's Model definition for User
              - The Model Foundation
              expected_result: An authoritative User Domain Definition is available through Model's Public Interface, carrying every field, credential meaning, and rule the Target defines for User.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The User Domain Definition matches every field, credential meaning, and rule the Target states for User, with nothing invented and nothing missing.
              verify: The User Domain Definition's Public Interface, inspected against the Target's stated fields, credential meaning, and rules for User, shows an exact match.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_user.py (4 checks) — exact field set, credential meaning on password/api_key, uniqueness (name), defaults, JSON round-trip/schema.
                outcome: passed
            P1-G2-T2:
              id: P1-G2-T2
              title: Define the Trading Platform Domain Definition
              description: Define Trading Platform as Model's authoritative Domain Definition, preserving every field and rule the Target states for it, independent of any one exchange or broker.
              reason: The Target requires the system to stay independent of any specific trading platform, which depends on Trading Platform having exactly one authoritative domain meaning.
              kind: code
              inputs:
              - The Target's Model definition for Trading Platform
              - The Model Foundation
              expected_result: An authoritative Trading Platform Domain Definition is available through Model's Public Interface, carrying every field and rule the Target defines for Trading Platform.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Trading Platform Domain Definition matches every field and rule the Target states for Trading Platform, with nothing invented and nothing missing.
              verify: The Trading Platform Domain Definition's Public Interface, inspected against the Target's stated fields and rules for Trading Platform, shows an exact match.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_trading_platform.py (4 checks) — exact field set, no credential fields, no uniqueness, defaults, JSON round-trip/schema.
                outcome: passed
            P1-G2-T3:
              id: P1-G2-T3
              title: Define the Instance Domain Definition
              description: Define Instance as Model's authoritative Domain Definition, preserving every field, credential meaning, and rule the Target states for it, including its ownership by one User and its use of one Trading Platform.
              reason: Instance's domain meaning requires an owning User and a connected Trading Platform, both of which must already have one authoritative meaning before Instance can reference them.
              kind: code
              inputs:
              - The Target's Model definition for Instance
              - The Model Foundation
              - The User Domain Definition
              - The Trading Platform Domain Definition
              expected_result: An authoritative Instance Domain Definition is available through Model's Public Interface, carrying every field, credential meaning, and rule the Target defines for Instance, including its relationships to User and Trading Platform.
              depends_on:
              - P1-G1-T1
              - P1-G2-T1
              - P1-G2-T2
              constraints: []
              acceptance: The Instance Domain Definition matches every field, credential meaning, relationship, and rule the Target states for Instance, with nothing invented and nothing missing.
              verify: The Instance Domain Definition's Public Interface, inspected against the Target's stated fields, credential meaning, relationships, and rules for Instance, shows an exact match.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_instance.py (4 checks) — exact field set, credential meaning on password/api_key, uniqueness (user_id, name), nullable defaults, JSON round-trip/schema.
                outcome: passed
        P1-G3:
          id: P1-G3
          title: Financial Reference Data
          description: The domain concepts that describe currencies, brokers, and the assets available for trading.
          area: Financial reference domain definitions
          does: Currency, broker, and tradable-asset domain concepts are represented as authoritative Domain Definitions.
          constraints: []
          task_count: 3
          tasks:
