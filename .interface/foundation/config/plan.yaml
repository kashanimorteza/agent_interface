meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 55
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model package containing every resolved domain Model exactly as the current project
        definition specifies, ready for Database, Backend, and Frontend to consume through its declared public interface.
      constraints: []
      task_count: 17
      groups:
        P1-G1:
          id: P1-G1
          title: Package Foundation
          description: Establishes the empty, importable Model package boundary that every resolved Model is added to.
          area: Model package boundary
          does: An importable Model package boundary exists with a documented public interface, ready to expose Models.
          constraints: []
          task_count: 1
          tasks:
            P1-T1:
              id: P1-T1
              title: Establish the Model package boundary
              description: Establish the Model package as its own independent, importable boundary with a documented public
                interface, following the current package conventions.
              reason: Every resolved Model must be added to one shared importable package rather than existing as private
                copies, so the boundary must exist before any Model is defined.
              kind: code
              inputs: []
              expected_result: An empty, importable Model package boundary exists with a declared public interface.
              depends_on: []
              constraints: []
              acceptance: The package can be imported through its declared public interface and currently exposes no Models.
              verify: Importing the package's declared public interface succeeds and yields no Model symbols yet.
              status: done
              log:
              - at: '2026-09-10T21:43:52Z'
                event: Implemented and verified.
                check: Imported the package's declared public interface and asserted it exposed zero Model symbols.
                outcome: passed
        P1-G2:
          id: P1-G2
          title: User Identity
          description: Defines the User Model that establishes multi-user separation across the whole domain.
          area: User identity
          does: The User Model is available through the package interface exactly as the project defines it.
          constraints: []
          task_count: 1
          tasks:
            P1-T2:
              id: P1-T2
