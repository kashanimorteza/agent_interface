                - PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.
                overridden: []
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: The published declaration of User states every Field, property, relationship, and rule the Target declares for it and no other Field; each credential Field is classified with the at-rest treatment the Target requires and is never removed from the definition, and its identity, uniqueness, and default declarations are exactly the Target's; it declares itself persistent; an instance built from conforming data is valid, while missing required data, wrongly typed data, an unknown Field, or data violating a declared constraint is rejected; serialize followed by deserialize reproduces an equal instance. The result also observably conforms to the governing agent parameters and to the applicable guidance of the required pydantic Skill.
              verify: Observe through the definition's own published behaviour that its declaration read back matches the Target's declaration of User term for term, that conforming data constructs an instance and each class of non-conforming data is rejected, that the round trip through the Plain Representation reproduces an equal instance, and that the credential classification is readable from the declaration.
              status: done
              log:
