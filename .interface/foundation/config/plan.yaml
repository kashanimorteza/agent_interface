        - "Database owns no domain meaning, application behavior, or presentation; it persists and serves only what Model already declares (Database Principle 3, 7)."
        - "Encryption is satisfied through Principle 12's credential at-rest treatment (Group G2). Authentication has no separate Database-owned mechanism to add: SQLite carries no connection-level privilege model, so least privilege is achieved through OS file permissions on the data file, outside this phase's code. Logging and Error Handling require actual observable signals, not merely a Principle reference — revision 2 corrects revision 1's mistaken assumption that Principle 16 was already satisfied without an owning Task, per Review Finding F5; see Group G5."
