        P1-G7:
          id: P1-G7
          title: Model Public Interface
          description: The complete, verified public boundary through which every Domain Definition in this phase is reached.
          area: Model Public Interface
          does: Every Domain Definition in this phase is reachable through one verified, stable Model Public Interface.
          constraints: []
          task_count: 1
          tasks:
            P1-G7-T1:
              id: P1-G7-T1
              title: Verify the complete Model Public Interface
              description: Confirm that every Domain Definition produced in this phase is reachable through Model's one explicit and stable Public Interface with one unambiguous public identity, and verify the complete Model boundary's public interface, validation behavior, and serialization/schema generation.
              reason: Model must expose its authoritative Domain Definitions through one explicit, stable Public Interface rather than private internal resources, and this must be demonstrated across the complete set of Domain Definitions produced in this phase, not only individually.
              kind: code
              inputs:
              - Every Domain Definition produced in this phase
              expected_result: Every Domain Definition produced in this phase has exactly one public identity reachable through Model's Public Interface, and the complete Model boundary is verified as one coherent whole.
              depends_on:
              - P1-G2-T1
              - P1-G2-T2
              - P1-G2-T3
              - P1-G3-T1
              - P1-G3-T2
              - P1-G3-T3
              - P1-G4-T1
              - P1-G4-T2
              - P1-G5-T1
              - P1-G5-T2
              - P1-G5-T3
              - P1-G5-T4
              - P1-G6-T1
              - P1-G6-T2
              - P1-G6-T3
              constraints: []
              acceptance: Every Domain Definition produced in this phase is reachable through Model's Public Interface with one unambiguous identity, and no consumer needs private internal resources to use any of them.
              verify: Public interface resolution, validation behavior, and serialization/schema generation are observed to succeed for every Domain Definition produced in this phase when exercised together as one Model boundary, each Domain Definition is observed to resolve to exactly one unambiguous public identity, and every one of them is observed to be reachable without depending on a private internal resource.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_public_interface.py (5 checks) — every Domain Definition reachable, no duplicate public identity, no private-resource dependency, schema generation non-empty for all 15, all build on the Foundation.
                outcome: passed
        P1-G8:
          id: P1-G8
          title: Component Documentation
          description: The Model component's operational documentation.
          area: Model component operational documentation
          does: The Model component has complete, accurate, and safe operational documentation.
          constraints: []
          task_count: 1
          tasks:
            P1-G8-T1:
              id: P1-G8-T1
              title: Produce the Model component README
              description: Produce the Model component's README, explaining the component, its actual public surface and structure, setup, installation, configuration, use, verification, and troubleshooting, with accurate executable examples drawn from the resolved technical selections.
              reason: Every generated Participating Component must have complete, safe, and operational documentation.
              kind: documentation
              inputs:
              - Every Domain Definition produced in this phase
              - The resolved Model Component Profile and Language Item
