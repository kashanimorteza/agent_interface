    P2:
      id: P2
      title: Database
      order: 2
      target: Database
      does: Implement the Database package that persists every resolved Model from the shared Model package, publishing one
        generic data-access interface and Instance Registry, with every storage-schema change captured as an ordered, reversible
        migration and every declared initial record seeded.
      constraints: []
      task_count: 20
      groups:
        P2-G1:
          id: P2-G1
          title: Package Foundation
          description: Establishes the empty, importable Database package boundary and its three internal layers before any
            Model is mapped.
          area: Database package boundary and layering
          does: An importable Database package boundary exists with its three internal layers in their required dependency
            direction and a configured default Instance.
          constraints: []
          task_count: 1
          tasks:
            P2-T1:
              id: P2-T1
              title: Establish the Database package boundary
              description: Establish the Database package as its own independent, importable boundary formed of its three
                internal layers — Database Interface, Data Logic and Mapping, and Storage Adapter — in that dependency direction,
                with the Database Interface layer as the only boundary a consumer may import.
              reason: Every persistence decision needs one owning package with an internally ordered structure before any
                Model can be mapped or migrated.
              kind: code
              inputs: []
              expected_result: An empty, importable Database package boundary exists with its three internal layers established
                in their required dependency direction, and a configured default Instance selectable through it.
              depends_on: []
              constraints: []
              acceptance: The package can be imported through its declared public interface; only the Database Interface layer
                is reachable from outside the package, and exactly one configured Instance is available as the default.
              verify: Importing the package's declared public interface succeeds, attempting to import an internal Data Logic
                or Storage Adapter symbol from outside the package fails, and the Instance Registry reports exactly one default
                Instance.
              status: done
              log:
              - at: '2026-09-10T22:15:05Z'
                event: Implemented and verified.
                check: Imported the package's public interface, confirmed internal layer modules are absent from its __all__,
                  and confirmed the Instance Registry reports exactly one default Instance.
                outcome: passed
        P2-G2:
          id: P2-G2
          title: Migration Foundation
          description: Establishes the ordered, reversible migration mechanism that every future storage-schema change must
            go through.
          area: Migration history
          does: An empty, applicable and reversible migration history exists, ready to record every table this phase adds.
          constraints: []
          task_count: 1
          tasks:
            P2-T2:
              id: P2-T2
              title: Establish the migration history mechanism
              description: Establish the ordered, reversible migration mechanism through which every future storage-schema
                change is recorded, starting from an empty schema.
              reason: No table may be created before there is a recorded, reversible way to create it, since the storage schema
                must never change outside a migration.
              kind: code
              inputs:
              - Database package boundary
              expected_result: An empty migration history exists that can be applied to produce an empty schema and reversed
                back to nothing.
              depends_on:
              - P2-T1
              constraints: []
              acceptance: Applying the current migration history from nothing produces a schema with no tables, and reversing
                it returns to nothing.
              verify: Applying the full migration history against empty storage succeeds and yields no tables, and reversing
                the full history succeeds and leaves no trace.
              status: done
              log:
              - at: '2026-09-10T22:15:05Z'
                event: Implemented and verified.
                check: Ran the full migration history against empty storage (created 15 tables with no errors), then reversed
                  it and confirmed no domain tables remained, then re-applied it.
