              verify: "Instantiating Broker with every Target-declared required Field populated and valid, and a value for user_id that references an existing User, succeeds; omitting a Target-required Field or supplying a duplicate user_id and name combination violates a declared constraint and is rejected; and the Domain Definition's published declaration-vocabulary metadata matches the Target's declared properties for Broker when inspected through the Model Public Interface."
              status: "done"
