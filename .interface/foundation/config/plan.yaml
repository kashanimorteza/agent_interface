                  outcome: "PASS. The Task's stated constraint (Trading Platform determines which connection fields are required) needs external context Model does not have at construction time, so it is not an Intrinsic Rule (Model Principle 6 boundary) — documented in the module docstring and left to Logic, which composes Instance with its referenced Trading Platform."
