        P2-interface:
          id: "P2-interface"
          title: "Database Interface"
          description: "The one generic public Database Interface every consumer uses for every mapped Domain Definition, plus its capability-restricted controlled-command route for operations the standard pipeline cannot express."
          area: "Generic public data-access boundary"
          does: "Every mapped Domain Definition in this Plan is reachable through one generic, Model-typed Database Interface supporting create, read, read-by-identifier, list, search, update, delete, and (where the Domain Definition declares is_active) enable and disable, plus a separately observable, parameterized, structurally-restricted controlled-command route."
          constraints: []
          task_count: 1
          tasks:
            P2-database-interface:
              id: "P2-database-interface"
              title: "Publish the generic Database Interface"
              description: "Publish the one generic Database Interface that accepts a public Model type or instance, a supported operation, and the criteria that operation requires, routing every mapped Domain Definition through one Model-driven pipeline rather than one implementation per Domain Definition, and expose the capability-restricted controlled-command route for operations the standard pipeline cannot express."
              reason: "Consumers need one stable, generic boundary to every mapped Domain Definition instead of depending on private per-Domain-Definition persistence details."
              kind: "code"
              inputs: ["Every Domain Definition mapped in this Plan", "The Transaction boundary"]
              expected_result: "A generic Database Interface through which any mapped Domain Definition supports its applicable Model Operations without a Domain-Definition-specific entry point, plus a working controlled-command route."
              depends_on: ["P2-map-user", "P2-map-trading-platform", "P2-map-broker", "P2-map-instance", "P2-map-currency", "P2-map-asset", "P2-map-account-group", "P2-map-account", "P2-map-trailing-group", "P2-map-trailing-rule", "P2-map-partial-group", "P2-map-partial-rule", "P2-map-action-group", "P2-map-action", "P2-map-position"]
              constraints: []
              acceptance: "Every mapped Domain Definition's applicable Model Operations succeed through the generic Interface without a Domain-Definition-specific code path; an operation requiring an is_active Domain Definition to enable or disable changes only that field; the controlled-command route rejects a structural change, a privilege change, and a Migration operation while accepting a parameterized command within its capability restriction; no operation requires an untyped Model-name string."
              verify: "Each mapped Domain Definition's create/read/list/search/update/delete (and enable/disable where applicable) succeeds through the same generic Interface entry points; a controlled-command attempt at a structural, privilege, or Migration change is rejected; a within-capability controlled command succeeds and is separately observable."
              status: "todo"
        P2-seed:
          id: "P2-seed"
          title: "Initial Data Seeding"
          description: "The one reusable, repeatable Seed/Import entry point that inserts every Target-declared Initial Data record in dependency order."
          area: "Initial data import"
          does: "Every Target-declared Initial Data record (User, Trading Platform, Instance, Currency, Broker, Asset, Account Group, Account, Trailing Group, Partial Group, Action Group, and Action) exists in storage after seeding, and re-running the seed does not duplicate a logical record."
          constraints: []
          task_count: 1
          tasks:
            P2-seed-initial-data:
              id: "P2-seed-initial-data"
              title: "Seed the declared Initial Data"
              description: "Build the one reusable, configurable Seed/Import entry point that imports every Target-declared Initial Data record for User, Trading Platform, Instance, Currency, Broker, Asset, Account Group, Account, Trailing Group, Partial Group, Action Group, and Action into their resolved storage mappings, in dependency order, satisfying every relationship and non-nullable field, and repeatable without creating duplicate logical records."
              reason: "Phase 2's stated goal requires the defined initial data to exist in storage, not just a working schema."
              kind: "code"
              inputs: ["Every Target-declared Initial Data block", "Every Domain Definition mapped in this Plan", "The Transaction boundary"]
              expected_result: "Running the seed entry point once leaves every Target-declared Initial Data record persisted with its declared field values and relationships satisfied."
              depends_on: ["P2-map-user", "P2-map-trading-platform", "P2-map-broker", "P2-map-instance", "P2-map-currency", "P2-map-asset", "P2-map-account-group", "P2-map-account", "P2-map-trailing-group", "P2-map-partial-group", "P2-map-action-group", "P2-map-action"]
              constraints: []
              acceptance: "After seeding, every Target-declared Initial Data record is retrievable through the Database Interface with its declared field values and relationships; running the seed a second time leaves exactly one logical copy of each declared record rather than duplicating it."
              verify: "Querying the Database Interface after seeding returns every declared Initial Data record with matching field values; running the seed entry point a second time does not increase the count of any declared record beyond one logical copy."
              status: "todo"
        P2-integrity:
          id: "P2-integrity"
          title: "Portability and Observability"
          description: "The classification of every persistence decision as portable contract, portable mapping, or isolated Engine-specific extension, schema-drift verification, least-privilege runtime access, and the required security-relevant observability signals."
          area: "Cross-cutting persistence integrity and observability"
          does: "The complete mapping's portability boundaries are explicit, running structure is verified against recorded structure, runtime access follows least privilege, and connection failure, Migration failure, constraint violation, Transaction conflict, and protected-data access each produce an observable signal without exposing secret or credential values."
          constraints: []
          task_count: 1
          tasks:
            P2-integrity-observability:
              id: "P2-integrity-observability"
              title: "Establish portability classification, drift verification, and protected observability"
              description: "Classify every persistence decision made across this Plan's mappings as portable contract, portable mapping, or explicit isolated Engine-specific extension with its compatibility impact recorded; verify the running storage structure against the recorded Migration history before normal operations proceed; apply least-privilege runtime access; and record connection failure, Migration failure, constraint violation, Transaction conflict, and protected-data access as observable signals that never include secret or credential values."
              reason: "A persistence layer that hides its Engine-specific extensions, cannot detect structural drift, or leaks protected data through diagnostics undermines every mapping and Migration this Plan already established."
              kind: "code"
              inputs: ["Every mapping and the Migration mechanism established in this Plan"]
              expected_result: "Every Engine-specific extension used by this Plan's mappings is isolated and recorded with its portability impact; drift between recorded and running structure is detected before normal operations proceed; a connection failure, Migration failure, constraint violation, and Transaction conflict each produce a recorded signal with no secret or credential value in it."
              depends_on: ["P2-migrations"]
              constraints: []
              acceptance: "An introduced structural difference is detected as drift before further operations proceed; forcing each of a connection failure, a Migration failure, a constraint violation, and a Transaction conflict produces a corresponding recorded signal; inspecting any such signal or log shows no secret or credential value."
              verify: "Deliberately diverging the running structure from the recorded history is detected as drift; forcing each listed failure condition produces its recorded signal; the recorded signals and logs contain no secret or credential value."
              status: "todo"
