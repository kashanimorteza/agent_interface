                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The Currency Domain Definition publishes exactly the Fields, defaults, nullability, relationship, and uniqueness the Target declares for Currency through the Model Public Interface, invents nothing beyond them, and conforms with the required Pydantic guidance."
              verify: "Instantiating Currency with every Target-declared required Field populated and valid, and a value for user_id that references an existing User, succeeds; omitting a Target-required Field or supplying a duplicate user_id and code combination violates a declared constraint and is rejected; and the Domain Definition's published declaration-vocabulary metadata matches the Target's declared properties for Currency when inspected through the Model Public Interface."
              status: "done"
              log:
                - at: "2026-09-18T14:35:00Z"
                  by: "developing"
                  event: "Implemented Currency (model/src/model/currency.py): id, user_id, code, symbol, country, decimal_digits (default 2), is_active, description; Domain Relationship to User."
                  check: "Transient script check: instantiation with a user_id value succeeds; declaration_vocabulary publishes foreign_key.references == 'User' and length == 3 on code."
                  outcome: "PASS. Referential existence of user_id and the user_id+code uniqueness are published as declared metadata; Model has no database access to verify either at construction time (Principle 8/9 boundary), so enforcement belongs to Database."
                - at: "2026-09-18T15:35:00Z"
                  by: "developing"
                  event: "Fixed Review Finding F2: added an actual max_length=3 constraint to code's Field (previously the Target-declared length was published as descriptive metadata only, unenforced)."
                  check: "Adversarial re-check: Currency(user_id=1, code='USDXXX') now raises ValidationError."
                  outcome: "PASS. F2 resolved."
            T5:
              id: "T5"
              title: "Define the Broker Domain Definition"
