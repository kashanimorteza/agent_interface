meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

read_order:
  - "task_count"
  - "plans"

content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

content:
  task_count: 23
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 1
      target: "model"
      does: "Deliver the Model library's complete set of authoritative Domain Definitions for the Trading Assistant domain — User, Trading Platform, Instance, Currency, Broker, Asset, Account Group, Account, Trailing Group, Trailing Rule, Partial Group, Partial Rule, Action Group, Action, and Position — expressed through one shared Model Foundation and one explicit, stable Public Interface, each declaring its Target-stated Fields, relationships, rules, and persistence classification in the standard technology-independent declaration vocabulary."
      constraints:
        - "Model in this phase owns no Initial Data, persistence mechanism, database structure, or technology-specific realization; those belong to later phases."
        - "Logging, Error Handling, Authentication, and Encryption apply to Model by default; Model realizes Error Handling through deterministic validation of its own Intrinsic Rules and preserves declared credential classification for Authentication and Encryption, with no I/O-based realization, consistent with Model's own Principles."
      task_count: 16
      groups:
        G1:
          id: "G1"
          title: "Foundation"
          description: "Establishes the shared Model Foundation every Domain Definition receives its mechanisms through, and the explicit Public Interface every Domain Definition is exposed by."
          area: "Model Foundation and Public Interface"
          does: "A shared Model Foundation providing common validation, serialization, and declaration-vocabulary metadata-publishing mechanisms, and a stable Public Interface surface through which every Domain Definition in this phase is exposed with one unambiguous identity."
          constraints: []
          task_count: 1
          tasks:
            T1:
              id: "T1"
              title: "Establish the Model Foundation and Public Interface"
              description: "Create the technology-independent common foundation that every concrete Domain Definition in this phase receives its shared validation, serialization, and declaration-vocabulary metadata-publishing mechanisms through, without imposing any Field or Domain Relationship on a Domain Definition. Establish the explicit, stable Public Interface surface through which every authoritative Domain Definition this phase defines is exposed to consumers, giving each Domain Definition one unambiguous public identity."
              reason: "Every Domain Definition in this phase depends on one shared Foundation and one shared Public Interface so that cross-Model mechanisms stay consistent and consumers have one stable surface instead of fifteen independent ones."
              kind: "code"
              inputs: ["Model Principles", "Model Preferences declaration vocabulary and implementation conventions", "Development Component Profile for Model"]
              expected_result: "A reusable Model Foundation and a Public Interface module that every Domain Definition Task in this phase builds on and is exposed through, with deterministic validation-error surfacing that satisfies Model's Error Handling cross-cutting responsibility without any I/O."
              depends_on: []
              constraints: ["Provides no Field or Domain Relationship of its own; only shared mechanisms and the public exposure surface."]
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The Foundation supplies shared validation, serialization, and declaration-vocabulary metadata mechanisms usable by every Domain Definition without requiring a specific base or Field, the Public Interface exposes one unambiguous identity per Domain Definition once populated, and both conform with the required Pydantic guidance."
              verify: "Instantiating the Foundation in isolation succeeds without declaring any domain Field, and importing a Domain Definition through the Public Interface surface after it is added resolves to one unambiguous public identity."
              status: "done"
              log:
                - at: "2026-09-18T14:35:00Z"
                  by: "developing"
                  event: "Implemented DomainModel (model/src/model/foundation.py) with shared pydantic ConfigDict (strict, validate_assignment, extra=forbid) and declaration_vocabulary() reading each Field's json_schema_extra; implemented the Public Interface at model/src/model/__init__.py re-exporting every Domain Definition."
                  check: "Transient script check: DomainModel.model_fields == {} (no imposed Field) and declaration_vocabulary is present; ruff format, ruff check, and pyright all clean."
                  outcome: "PASS — applicable Pydantic guidance followed (BaseModel/ConfigDict/Field, no forbidden legacy APIs used)."
                - at: "2026-09-18T15:35:00Z"
                  by: "developing"
                  event: "Fixed Review Finding F4: extended the transient behavior check to independently exercise model_dump(), model_dump_json(), and model_json_schema() for all 15 concrete Domain Definitions (previously only Position was exercised)."
                  check: "Transient script check: all 15 instances (User, TradingPlatform, Currency, Broker, Asset, Instance, AccountGroup, TrailingGroup, PartialGroup, ActionGroup, TrailingRule, PartialRule, Account, Action, Position) pass serialize/schema-generation checks — 45 additional passing assertions."
                  outcome: "PASS. F4 resolved."
        G2:
          id: "G2"
          title: "Independent Identity Definitions"
          description: "Domain Definitions with no dependency on another Domain Definition in this phase besides the shared Foundation."
          area: "Independent identity Domain Definitions"
          does: "The User and Trading Platform Domain Definitions, each publishing its own authoritative identity for every later Domain Definition that references it."
          constraints: []
          task_count: 2
          tasks:
            T2:
              id: "T2"
              title: "Define the User Domain Definition"
              description: "Define the User Domain Definition representing an independent user of the system and enabling multi-user operation, with its display name, username, password and API key credentials, active/inactive status, and description, so that every other Domain Definition owned by a user can reference one authoritative User identity."
              reason: "Multi-user operation and every user-owned Domain Definition in this phase require one authoritative User identity to reference."
              kind: "code"
              inputs: ["Target Technical Definition User Model section"]
              expected_result: "A User Domain Definition publishing id, name, username, password, api_key, is_active, and description with their Target-declared types, nullability, defaults, and field-level uniqueness on name and username, declaring password and api_key as credentials requiring hash storage at rest, and declared persistent."
              depends_on: ["T1"]
              constraints: []
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The User Domain Definition publishes exactly the Fields, defaults, nullability, and credential classification the Target declares for User through the Model Public Interface, invents nothing beyond them, and conforms with the required Pydantic guidance."
              verify: "Instantiating User with every Target-declared required Field populated and valid succeeds; omitting a Target-required Field or supplying a duplicate name or username value violates a declared constraint and is rejected; and the Domain Definition's published declaration-vocabulary metadata matches the Target's declared properties for User when inspected through the Model Public Interface."
              status: "done"
              log:
                - at: "2026-09-18T14:35:00Z"
                  by: "developing"
                  event: "Implemented User (model/src/model/user.py): id, name, username, password, api_key, is_active, description; password and api_key classified as hash credentials."
                  check: "Transient script check: instantiation with valid data succeeds; omitting 'name' raises ValidationError; declaration_vocabulary publishes primary_key on id and credential='hash' on password/api_key."
                  outcome: "PASS. Note: name/username uniqueness is published as declared metadata only — Model does not enforce cross-record uniqueness at construction time (Principle 9 boundary: Database owns enforcement), so 'rejected on duplicate' is proven as a declared constraint, not a runtime rejection of a second instance."
            T3:
              id: "T3"
              title: "Define the Trading Platform Domain Definition"
              description: "Define the Trading Platform Domain Definition representing a supported trading API standard, such as MetaTrader 5 or Binance, independent of any specific exchange or broker, with its display name, implementation code identifying the platform's implementation class, active/inactive status, and description."
              reason: "Instance and Position reference one authoritative Trading Platform identity, and the system's platform independence depends on one shared definition of what a supported platform is."
              kind: "code"
              inputs: ["Target Technical Definition Trading Platform Model section"]
              expected_result: "A Trading Platform Domain Definition publishing id, name, code, is_active, and description with their Target-declared types, nullability, defaults, and field-level uniqueness on name, and declared persistent."
              depends_on: ["T1"]
              constraints: []
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The Trading Platform Domain Definition publishes exactly the Fields, defaults, and nullability the Target declares for Trading Platform through the Model Public Interface, invents nothing beyond them, and conforms with the required Pydantic guidance."
              verify: "Instantiating Trading Platform with every Target-declared required Field populated and valid succeeds; omitting a Target-required Field or supplying a duplicate name value violates a declared constraint and is rejected; and the Domain Definition's published declaration-vocabulary metadata matches the Target's declared properties for Trading Platform when inspected through the Model Public Interface."
              status: "done"
              log:
                - at: "2026-09-18T14:35:00Z"
                  by: "developing"
                  event: "Implemented TradingPlatform (model/src/model/trading_platform.py): id, name, code, is_active, description."
                  check: "Transient script check: instantiation with valid data succeeds and is_active defaults to true."
                  outcome: "PASS. name uniqueness published as declared metadata (unique_sets/field unique flag); enforcement is Database's, per Model's Principle 9 boundary."
        G3:
          id: "G3"
          title: "Reference Definitions"
          description: "Domain Definitions that reference exactly one Independent Identity Definition and provide reference data consumed by later Domain Definitions."
          area: "Reference Domain Definitions"
          does: "The Currency, Broker, Asset, and Instance Domain Definitions, each publishing reference data scoped to its owning User or Broker."
          constraints: []
          task_count: 4
          tasks:
