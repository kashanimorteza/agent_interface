meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

read_order:
  - "task_count"
  - "plans"

content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

content:
  task_count: 37
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 2
      target: "Model"
      does: "Implement each domain concept the Target defines as one authoritative, technology-independent Domain Definition with its explicit fields, relationships, and Intrinsic Rules, realized through a shared Model Foundation and exposed through Model's single explicit Public Interface. Initial Data belongs to Database and is excluded from this phase's Domain Definitions. A uniqueness constraint the Target states across multiple records is not an Intrinsic Rule of one Domain Definition; each such constraint is declared as Domain Definition metadata for Database to enforce rather than validated by Model at construction time."
      constraints:
        - "A rule that can only be evaluated by comparing against other persisted records, or that depends on another Domain Definition's platform-specific configuration not itself expressed as a Target field, is outside Model's Intrinsic Rule boundary. Model declares such a rule as metadata or preserves the field structure it depends on, without enforcing it."
      task_count: 17
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Model Foundation"
          description: "The shared, technology-independent foundation every concrete Domain Definition in this phase receives its common configuration and behavior through."
          area: "Model Foundation"
          does: "Provide one shared Model Foundation supplying consistent missing-value resolution, Intrinsic validation behavior, unknown-Field handling, and cross-record constraint declaration to every concrete Domain Definition."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              title: "Build the Model Foundation"
              description: "Establish the shared, technology-independent foundation that every concrete Domain Definition in this phase receives applicable common configuration and behavior through, including consistent resolution of missing Field values to their declared default or generator or otherwise null, deterministic and side-effect-free Intrinsic validation, consistent rejection of Fields the Target does not define, and one shared mechanism for declaring a cross-record constraint such as uniqueness as Domain Definition metadata rather than validating it within Model."
              reason: "Model Principles require every concrete Model realization to share one common Foundation so cross-Model behavior stays consistent instead of being duplicated independently in each Domain Definition."
              kind: "code"
              inputs: []
              expected_result: "A reusable Model Foundation that every concrete Domain Definition in this phase is realized through, applying identical missing-value resolution, Intrinsic validation, unknown-Field handling, and cross-record constraint declaration."
              depends_on: []
              constraints: []
              acceptance: "Every concrete Domain Definition produced later in this phase obtains its shared missing-value resolution, Intrinsic validation, unknown-Field handling, and cross-record constraint declaration mechanism from this one Foundation rather than from an independent implementation."
              verify: "Comparing the missing-value resolution, Intrinsic validation, unknown-Field handling, and cross-record constraint declaration observed on any two concrete Domain Definitions from this phase shows they originate from the same shared Foundation."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.ModelBase (Pydantic BaseModel, extra=forbid, validate_default, validate_assignment) and the shared unique_together ClassVar convention plus credential_field() helper in model/src/model/foundation.py. Verified by tests/test_foundation.py comparing User and Broker: identical unknown-field rejection, identical default resolution, deterministic validation, and independent unique_together declarations from the one shared base. uv run pytest, ruff check, ruff format --check, and pyright all pass."
        P1-G2:
          id: "P1-G2"
          title: "Identity and Platform Access"
          description: "The Domain Definitions that establish who uses the system and which Trading Platform connection they access it through."
          area: "Identity and Platform Access"
          does: "Provide authoritative Domain Definitions for the system's Users, the supported Trading Platforms, and the user-owned Instances that connect to them."
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              title: "Define the User Domain Definition"
              description: "Establish User as Model's authoritative Domain Definition for an independent system user who can hold a separate set of settings from every other user, covering every field and credential-hash Intrinsic Rule the Target's current User definition states, completed only by applicable Model Preference defaults for properties the Target leaves genuinely unstated. Its display-name uniqueness constraint is declared as Domain Definition metadata rather than validated at construction time."
              reason: "User is the identity every other user-owned Domain Definition in this phase belongs to, and must exist as one authoritative definition before those definitions can declare that relationship."
              kind: "code"
              inputs: ["Model Foundation"]
              expected_result: "A complete User Domain Definition whose password and API-key credential-hash Intrinsic Rule is enforced exactly as the Target states it, and whose display-name uniqueness constraint is declared as Domain Definition metadata."
              depends_on: ["P1-G1-T1"]
              constraints: []
              acceptance: "The User Domain Definition accepts data that satisfies the Target's current User fields and credential-hash rule, and declares its display-name uniqueness constraint as Domain Definition metadata."
              verify: "Constructing a User with every Target-stated field present and valid is observably accepted, its password and API key are observably protected from plain exposure, and the Domain Definition's declared uniqueness metadata names exactly the display name as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.User in model/src/model/identity.py: every Target field present, password/api_key typed SecretStr with credential_storage=hash metadata, unique_together=(('name',),). Verified by tests/test_identity.py::test_user_accepts_valid_data_and_protects_credentials and test_user_declares_display_name_uniqueness_metadata (both pass), plus ruff and pyright clean."
            P1-G2-T2:
              id: "P1-G2-T2"
              title: "Define the Trading Platform Domain Definition"
              description: "Establish Trading Platform as Model's authoritative Domain Definition for a supported trading API standard, covering every field the Target's current Trading Platform definition states, completed only by applicable Model Preference defaults for properties the Target leaves genuinely unstated."
              reason: "Instance and Position both use a Trading Platform through a Domain Relationship, so Trading Platform must exist as one authoritative definition before those definitions can declare that relationship."
              kind: "code"
              inputs: ["Model Foundation"]
              expected_result: "A complete Trading Platform Domain Definition exposing its display name, implementation code, and active state exactly as the Target states them."
              depends_on: ["P1-G1-T1"]
              constraints: []
              acceptance: "The Trading Platform Domain Definition accepts data that satisfies every field the Target's current Trading Platform definition states and rejects data missing a required field."
              verify: "Constructing a Trading Platform with every Target-required field present is observably accepted, and omitting a required field is observably rejected."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.TradingPlatform in model/src/model/identity.py with every Target field. Verified by tests/test_identity.py::test_trading_platform_accepts_every_required_field and test_trading_platform_rejects_missing_required_field (via model_validate to keep the negative case type-checkable); both pass, ruff and pyright clean."
            P1-G2-T3:
              id: "P1-G2-T3"
              title: "Define the Instance Domain Definition"
              description: "Establish Instance as Model's authoritative Domain Definition for a user-owned connection through which the system accesses a Trading Platform, covering its Domain Relationships to User and Trading Platform and its encrypted-credential Intrinsic Rule exactly as the Target's current Instance definition states them, with its per-user name uniqueness constraint declared as Domain Definition metadata."
              reason: "Instance connects a User to a Trading Platform, and Account later uses one Instance through a Domain Relationship, so Instance must exist as one authoritative definition after User and Trading Platform and before Account."
              kind: "code"
              inputs: ["Model Foundation", "completed User Domain Definition", "completed Trading Platform Domain Definition"]
              expected_result: "A complete Instance Domain Definition that belongs to one User, uses one Trading Platform, enforces encrypted storage for its technical password and API key, and declares its per-user name uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G2-T1", "P1-G2-T2"]
              constraints: []
              acceptance: "The Instance Domain Definition accepts data that satisfies the Target's current Instance fields, relationships, and credential-encryption rule, and declares its per-user name uniqueness constraint as Domain Definition metadata."
              verify: "Constructing an Instance with every Target-stated field and relationship present and valid is observably accepted, its technical password and API key are observably protected from plain exposure, and the Domain Definition's declared uniqueness metadata names exactly the per-user name as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.Instance in model/src/model/identity.py: user_id/trading_platform_id relationships, optional ip/username/password/api_key with password/api_key typed SecretStr (credential_storage=encrypted), unique_together=(('user_id','name'),). The Target's platform-dependent required-connection-field rule was left unenforced per the Plan's Revision 2 constraint (not evaluable from Instance's own data). Verified by tests/test_identity.py::test_instance_accepts_valid_data_and_protects_credentials and test_instance_declares_per_user_name_uniqueness_metadata; ruff and pyright clean."
        P1-G3:
          id: "P1-G3"
          title: "Trading Reference Data"
          description: "The Domain Definitions for the reference and catalog data the trading domain uses."
          area: "Trading Reference Data"
          does: "Provide authoritative Domain Definitions for the Currencies, Brokers, and Assets the trading domain references."
          constraints: []
          task_count: 3
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              title: "Define the Currency Domain Definition"
              description: "Establish Currency as Model's authoritative Domain Definition for a currency usable by the trading system, covering its Domain Relationship to User exactly as the Target's current Currency definition states it, with its per-user code uniqueness constraint declared as Domain Definition metadata."
              reason: "Account later uses one Currency as its base currency through a Domain Relationship, so Currency must exist as one authoritative definition before Account."
              kind: "code"
              inputs: ["Model Foundation", "completed User Domain Definition"]
              expected_result: "A complete Currency Domain Definition that belongs to one User and declares its per-user currency-code uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G2-T1"]
              constraints: []
              acceptance: "The Currency Domain Definition accepts data that satisfies the Target's current Currency fields and relationship, and declares its per-user code uniqueness constraint as Domain Definition metadata."
              verify: "Constructing a Currency with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the per-user currency code as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.Currency in model/src/model/reference.py, code constrained to exactly 3 characters (Field min_length/max_length), unique_together=(('user_id','code'),). Verified by tests/test_reference.py::test_currency_accepts_valid_data, test_currency_rejects_code_of_wrong_length, test_currency_declares_per_user_code_uniqueness_metadata; ruff and pyright clean."
            P1-G3-T2:
              id: "P1-G3-T2"
              title: "Define the Broker Domain Definition"
              description: "Establish Broker as Model's authoritative Domain Definition for a broker supported by the system without coupling it to one Trading Platform, covering its Domain Relationship to User exactly as the Target's current Broker definition states it, with its per-user name uniqueness constraint declared as Domain Definition metadata."
              reason: "Asset, Account, and Position each use a Broker through a Domain Relationship, so Broker must exist as one authoritative definition before those definitions."
              kind: "code"
              inputs: ["Model Foundation", "completed User Domain Definition"]
              expected_result: "A complete Broker Domain Definition that belongs to one User and declares its per-user name uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G2-T1"]
              constraints: []
              acceptance: "The Broker Domain Definition accepts data that satisfies the Target's current Broker fields and relationship, and declares its per-user name uniqueness constraint as Domain Definition metadata."
              verify: "Constructing a Broker with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the per-user name as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.Broker in model/src/model/reference.py, unique_together=(('user_id','name'),). Verified by tests/test_reference.py::test_broker_accepts_valid_data and test_broker_declares_per_user_name_uniqueness_metadata; ruff and pyright clean."
            P1-G3-T3:
              id: "P1-G3-T3"
              title: "Define the Asset Domain Definition"
              description: "Establish Asset as Model's authoritative Domain Definition for a tradable asset, covering its Domain Relationship to Broker exactly as the Target's current Asset definition states it, with its per-broker symbol uniqueness constraint declared as Domain Definition metadata."
              reason: "Action later uses one Asset through a Domain Relationship, so Asset must exist as one authoritative definition after Broker and before Action."
              kind: "code"
              inputs: ["Model Foundation", "completed Broker Domain Definition"]
              expected_result: "A complete Asset Domain Definition that belongs to one Broker and declares its per-broker symbol uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G3-T2"]
              constraints: []
              acceptance: "The Asset Domain Definition accepts data that satisfies the Target's current Asset fields and relationship, and declares its per-broker symbol uniqueness constraint as Domain Definition metadata."
              verify: "Constructing an Asset with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the per-broker symbol as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.Asset in model/src/model/reference.py, unique_together=(('broker_id','symbol'),). Verified by tests/test_reference.py::test_asset_accepts_valid_data and test_asset_declares_per_broker_symbol_uniqueness_metadata; ruff and pyright clean."
        P1-G4:
          id: "P1-G4"
          title: "Account Management"
          description: "The Domain Definitions that organize and fund trading accounts."
          area: "Account Management"
          does: "Provide authoritative Domain Definitions for the Account Groups that organize accounts and the funded Accounts used to execute trades."
          constraints: []
          task_count: 2
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              title: "Define the Account Group Domain Definition"
              description: "Establish Account Group as Model's authoritative Domain Definition for an independent group that organizes a user's trading accounts, covering its Domain Relationship to User exactly as the Target's current Account Group definition states it, with its per-user name uniqueness constraint declared as Domain Definition metadata."
              reason: "Account later belongs to one Account Group through a Domain Relationship, so Account Group must exist as one authoritative definition before Account."
              kind: "code"
              inputs: ["Model Foundation", "completed User Domain Definition"]
              expected_result: "A complete Account Group Domain Definition that belongs to one User and declares its per-user name uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G2-T1"]
              constraints: []
              acceptance: "The Account Group Domain Definition accepts data that satisfies the Target's current Account Group fields and relationship, and declares its per-user name uniqueness constraint as Domain Definition metadata."
              verify: "Constructing an Account Group with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the per-user name as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.AccountGroup in model/src/model/accounts.py, unique_together=(('user_id','name'),). Verified by tests/test_accounts.py::test_account_group_accepts_valid_data and test_account_group_declares_per_user_name_uniqueness_metadata; ruff and pyright clean."
            P1-G4-T2:
              id: "P1-G4-T2"
              title: "Define the Account Domain Definition"
              description: "Establish Account as Model's authoritative Domain Definition for a funded trading account through which the system executes trades, covering its Domain Relationships to Account Group, Broker, Instance, and Currency and its encrypted-password Intrinsic Rule exactly as the Target's current Account definition states them, with its group-broker-instance uniqueness constraint declared as Domain Definition metadata."
              reason: "Action and Position later use one Account through a Domain Relationship, so Account must exist as one authoritative definition after Account Group, Broker, Instance, and Currency and before Action and Position."
              kind: "code"
              inputs: ["Model Foundation", "completed Account Group Domain Definition", "completed Broker Domain Definition", "completed Instance Domain Definition", "completed Currency Domain Definition"]
              expected_result: "A complete Account Domain Definition that belongs to one Account Group and Broker, uses one Instance and one base Currency, enforces encrypted password storage, and declares its group-broker-instance uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G4-T1", "P1-G3-T2", "P1-G2-T3", "P1-G3-T1"]
              constraints: []
              acceptance: "The Account Domain Definition accepts data that satisfies the Target's current Account fields, relationships, and encrypted-password rule, and declares its group-broker-instance uniqueness constraint as Domain Definition metadata."
              verify: "Constructing an Account with every Target-stated field and relationship present and valid is observably accepted, its password is observably protected from plain exposure, and the Domain Definition's declared uniqueness metadata names exactly group, broker, and instance as required unique together."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.Account in model/src/model/accounts.py: password typed SecretStr (credential_storage=encrypted), balance as decimal.Decimal, unique_together=(('name',), ('group_id','broker_id','instance_id')). The Target's Instance-vs-Account credential-distinction rule was left unenforced per the Plan's Revision 2 constraint (depends on per-platform configuration no Target field expresses). Verified by tests/test_accounts.py::test_account_accepts_valid_data_and_protects_password and test_account_declares_name_and_group_broker_instance_uniqueness_metadata; ruff and pyright clean."
        P1-G5:
          id: "P1-G5"
          title: "Trade Risk Management Rules"
          description: "The Domain Definitions for the rule sets that govern trailing and partial-close risk adjustments."
          area: "Trade Risk Management Rules"
          does: "Provide authoritative Domain Definitions for the Trailing and Partial rule groups and their individual rules that govern trade risk adjustments."
          constraints: []
          task_count: 4
          tasks:
            P1-G5-T1:
              id: "P1-G5-T1"
              title: "Define the Trailing Group Domain Definition"
              description: "Establish Trailing Group as Model's authoritative Domain Definition for an independent group that organizes Stop Loss and Take Profit trailing rules, covering its Domain Relationship to User exactly as the Target's current Trailing Group definition states it, with its per-user name uniqueness constraint declared as Domain Definition metadata."
              reason: "Trailing Rule later belongs to one Trailing Group, and Account, Action, and Position each use one Trailing Group through a Domain Relationship, so Trailing Group must exist as one authoritative definition before them."
              kind: "code"
              inputs: ["Model Foundation", "completed User Domain Definition"]
              expected_result: "A complete Trailing Group Domain Definition that belongs to one User and declares its per-user name uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G2-T1"]
              constraints: []
              acceptance: "The Trailing Group Domain Definition accepts data that satisfies the Target's current Trailing Group fields and relationship, and declares its per-user name uniqueness constraint as Domain Definition metadata."
              verify: "Constructing a Trailing Group with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the per-user name as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.TrailingGroup in model/src/model/risk.py, unique_together=(('user_id','name'),). Verified by tests/test_risk.py::test_trailing_group_accepts_valid_data and test_trailing_group_declares_per_user_name_uniqueness_metadata; ruff and pyright clean."
            P1-G5-T2:
              id: "P1-G5-T2"
              title: "Define the Trailing Rule Domain Definition"
              description: "Establish Trailing Rule as Model's authoritative Domain Definition for one activation condition and adjustment within a Trailing Group, covering its Domain Relationship to Trailing Group exactly as the Target's current Trailing Rule definition states it, with its per-group trigger-percentage uniqueness constraint declared as Domain Definition metadata."
              reason: "Trailing Rule completes the Trailing Group's rule set and must exist as one authoritative definition after Trailing Group."
              kind: "code"
              inputs: ["Model Foundation", "completed Trailing Group Domain Definition"]
              expected_result: "A complete Trailing Rule Domain Definition that belongs to one Trailing Group and declares its per-group trigger-percentage uniqueness constraint as Domain Definition metadata."
              depends_on: ["P1-G1-T1", "P1-G5-T1"]
              constraints: []
              acceptance: "The Trailing Rule Domain Definition accepts data that satisfies the Target's current Trailing Rule fields and relationship, and declares its per-group trigger-percentage uniqueness constraint as Domain Definition metadata."
              verify: "Constructing a Trailing Rule with every Target-stated field and relationship present and valid is observably accepted, and the Domain Definition's declared uniqueness metadata names exactly the trigger percentage per Trailing Group as required unique."
              status: "done"
              log:
                - at: "2026-09-14T12:50:00Z"
                  by: "developing"
                  event: "Implemented model.TrailingRule in model/src/model/risk.py, decimal fields, optional adjustments default None, unique_together=(('name',), ('trailing_group_id','trigger_percentage')). Verified by tests/test_risk.py::test_trailing_rule_accepts_valid_data_with_optional_adjustments_omitted and test_trailing_rule_declares_name_and_group_trigger_uniqueness_metadata; ruff and pyright clean."
