              description: Implement the User domain entity from the current Target Model definition, expressing its declared fields, credential handling meaning, and required initial data as domain-native validation.
              reason: The system requires an independent user identity before any owned data or connection can be defined.
              kind: code
              inputs:
              - Current Target Model definition for User
              expected_result: A validated User Model exists in the shared package, enforcing every declared field and rule and declaring the required initial record.
              depends_on:
              - P1-T1
              constraints: []
              acceptance: The model accepts every valid declared User state, rejects states that violate a declared rule, and declares the required initial record's identity and values.
              verify: Construction succeeds for valid data, fails for data violating a declared rule, and the declared initial data is observable through the public interface.
              status: done
              log:
              - at: '2026-09-12T05:05:00Z'
                by: developing
                event: completed
