            P1-G5-T4:
              id: "P1-G5-T4"
              title: "Define the Partial Rule Domain Definition"
              description: "Establish Partial Rule as Model's authoritative Domain Definition for one condition and close percentage within a Partial Group, covering its Domain Relationship to Partial Group exactly as the Target's current Partial Rule definition states it, with its per-group profit-percentage uniqueness constraint declared as Domain Definition metadata."
              reason: "Partial Rule completes the Partial Group's rule set and must exist as one authoritative definition after Partial Group."
              kind: "code"
              inputs: ["Model Foundation", "completed Partial Group Domain Definition"]
              expected_result: "A complete Partial Rule Domain Definition that belongs to one Partial Group and declares its per-group profit-percentage uniqueness constraint as Domain Definition metadata."
