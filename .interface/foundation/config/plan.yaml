              expected_result: "A runtime configuration file resolving the 'general' Instance against the SQLite Engine profile, an engine/session factory built from it, and a public Instance Registry module exposing Instance identities and the default, validated before use, rejecting an unknown explicit Instance and using the default only when selection is omitted."
