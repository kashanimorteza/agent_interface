        P1-G7:
          id: P1-G7
          title: Model Public Interface
          description: The complete, verified public boundary through which every Domain Definition in this phase is reached.
          area: Model Public Interface
          does: Every Domain Definition in this phase is reachable through one verified, stable Model Public Interface.
          constraints: []
          task_count: 1
