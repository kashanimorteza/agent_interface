            P2-T19:
              id: P2-T19
              title: Implement the generic Model-driven data-access interface
              description: 'Implement one generic, Model-driven data-access interface serving every persistent Model through
                the same operation pipeline: create, read, list, update, delete, and status where applicable, plus a controlled
                SQL-execution route and an explicit transaction boundary, publishing all of it through the Database Interface
                layer alone.'
              reason: Consumers must reach persisted data through one boundary that works the same way for every current and
                future Model, rather than a separate access path per Model.
              kind: code
              inputs:
              - Every mapped Model
              expected_result: A single published interface performs create, read, list, update, delete, and status operations
                for any persistent Model by type, supports an explicit transaction boundary grouping related operations, and
                offers a controlled SQL-execution route that preserves the same data protections as the generic operations.
              depends_on: *id001
              constraints: []
              acceptance: For any persistent Model, the published interface performs create, read, list, update, and delete
                using that Model's type; the status operation succeeds only for a Model declaring a status field; grouped
                operations commit or roll back together; and a controlled SQL command runs only when its effects and results
                can be protected the same way as the generic operations.
              verify: Exercising the published interface against at least one Model from each mapped Group performs every
                generic operation correctly, a status attempt against a Model without a status field is rejected, a transaction
                group of related writes rolls back completely on a forced failure, and a controlled SQL command is rejected
                when it would bypass the required data protections.
