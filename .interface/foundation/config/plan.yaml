            acceptance: A Trading Platform can be constructed with a complete valid set of declared fields
              and is rejected only when a required field is missing; its published metadata declares name
              as a unique constraint.
            verify: Constructing Trading Platform with each required field omitted is rejected, and a
              fully valid Trading Platform round-trips through serialization preserving every declared
              field, with its published metadata declaring name as a unique constraint and no comparison
              performed against other stored Trading Platform records.
            status: done
            log:
            - at: '2026-09-15T01:30:22Z'
