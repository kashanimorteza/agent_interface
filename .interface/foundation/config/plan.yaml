# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."


# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 17
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, rules, and initial data."
      constraints: []
      task_count: 17
      groups:

        P1-G1:
          id: "P1-G1"
          title: "Package Foundation"
          description: "Establishes the shared, independent Model package and its base representation mechanism that every domain Model in this phase relies on."
          area: "Public package interface and base representation"
          does: "A working independent Model package exists with a base Model representation and the mechanism for exposing public Model types through one stable interface."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              title: "Establish the shared Model package and base representation"
              description: "Create the independent Model package's foundation: the base representation every concrete domain Model inherits from, and the public interface mechanism through which domain Models will be exposed. No domain Model is defined by this activity."
              reason: "Every domain Model needs one common base and one stable way of being exposed publicly before any domain Model can be added consistently."
              kind: "code"
              inputs: []
              expected_result: "An importable Model package exists, exposing a base representation and a documented mechanism for adding and exposing public domain Models, with no domain Model yet defined."
              depends_on: []
              constraints: []
              acceptance: "The package can be imported and its base representation and public-interface mechanism are usable by a new domain Model without modifying the mechanism itself."
              verify: "Importing the package succeeds and the base representation is usable to derive a domain Model that is then reachable through the package's public interface."
              status: "done"
              log:
                - at: "2026-09-11T20:50:51Z"
                  event: "completed"
                  check: "Imported the package's public interface, derived a probe Model from the exposed base representation, constructed a valid instance, and confirmed an unknown field is rejected."
                  outcome: "passed"

