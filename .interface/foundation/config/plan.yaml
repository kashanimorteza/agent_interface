        P2-G2:
          id: P2-G2
          title: Persistence Mapping
          description: Covers the Data Logic and Mapping layer's generic derivation of physical storage
            structure and credential at-rest treatment from the logical Model.
          area: Data Logic and Mapping
          does: Every persistent Model is mapped to a table preserving its fields, relationships, and
            stored-state rules, with every credential field's at-rest transformation applied.
          constraints: []
          task_count: 2
          tasks:
            P2-G2-T1:
              id: P2-G2-T1
              title: Implement the generic Model-to-table persistence mapping
              description: Implement the Data Logic and Mapping layer's generic mechanism that maps every
                persistent domain Model to a physical table, deriving columns, foreign keys, uniqueness,
                required-ness, and referenced-record constraints from that Model's own declared fields
                and relationships rather than from a separate per-Model implementation, with every resulting
                table traceable to the Model it implements.
              reason: One generic mapping mechanism driven by each Model's own declaration is what lets
                Database support every current and future Model through the same pipeline instead of a
                duplicated implementation per Model.
              kind: code
              inputs:
              - The published Model package
              expected_result: Every persistent Model from the Model package maps to a table recording
                its source Model, with foreign keys, single-field and composite uniqueness, required-ness,
