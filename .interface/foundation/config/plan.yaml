              - 'Structure: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance.'
              - 'API: pydantic.BaseModel, pydantic.ConfigDict, pydantic.field_validator, pydantic.model_validator, pydantic.RootModel, pydantic.computed_field, pydantic.field_serializer, pydantic.model_serializer; serialization through model_dump and model_dump_json; schema through model_json_schema.'
              agent_avoid:
              - 'Legacy APIs: validator, root_validator, parse_obj, dict, json.'
              - 'Deprecated constraint helpers, scheduled for removal in Pydantic 3 — express the same constraint with Annotated instead: constr, conint, confloat, condecimal.'
              - PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.
              agent_overridden: []
              agent_skills:
              - resource: pydantic
                requirement: required
                resolved: true
                identifier: pydantic:pydantic
              acceptance: The foundation declares no Field and no relationship; a definition built on it receives the shared validation behaviour; input that names an unknown Field is refused rather than ignored; validation is deterministic, depends only on the definition's own data, and performs no external I/O. Every statement in agent_consider is observably followed, no statement in agent_avoid appears, and the applicable guidance of the required pydantic Skill is followed.
              verify: A transient probe definition built on the foundation is shown to inherit no Fields, to refuse unknown input, and to give identical validation outcomes on repeated runs without any external access.
              status: done
              log:
              - at: '2026-09-20T07:48:17Z'
                by: developing
                event: claimed
              - at: '2026-09-20T07:48:41Z'
                by: developing
                event: done
                check: 'Transient probe (nothing kept in the Component): foundation declares no Field; probe built on it inherits none; unknown input, string-for-int, bool-for-int, naive datetime, float and NaN for an exact decimal are all refused; offsets normalise to UTC; assignment is validated; 20 repeated validations gave identical outcomes; no I/O performed.'
