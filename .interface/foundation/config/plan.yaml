              verify: The Broker Domain Definition's Public Interface, inspected against the Target's stated fields, relationships, and rules for Broker, shows an exact match.
              status: done
              log:
              - at: '2026-09-14T08:19:56Z'
                event: completed
                check: uv run pytest tests/test_broker.py (4 checks) — exact field set, uniqueness (user_id, name), defaults, JSON round-trip/schema.
