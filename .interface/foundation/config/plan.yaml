meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 27
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: The complete set of domain Models defined by the project exists as one independently importable
        package, each Model expressing its own fields, relationships, same-record domain rules, and logical
        initial data.
      constraints: []
      task_count: 16
      groups:
        P1-G1:
          id: P1-G1
          title: Identity and Access
          description: Covers the Model that represents an independent user of the system and keeps one
            user's configuration distinct from another's.
          area: User identity and access
          does: The User Model exists, expressing its identity, credential, and status fields and its
            initial administrative record.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Define the User Model
              description: Define the Model representing an independent user of the system, expressing
                its identity fields, its username and credential fields, its active-status field, and
                its descriptive field, together with the credential nature of its password and API key.
              reason: Every other owned Model and every multi-user configuration in the project depends
                on a shared definition of who a user is.
              kind: code
              inputs: []
              expected_result: A User Model that expresses its declared fields with their logical type,
                required-ness, uniqueness intent, default behaviour, and credential nature, together with
                its declared initial administrative record as a logical declaration.
              depends_on: []
              constraints: []
              acceptance: The User Model's fields, their declared properties, and its initial record are
                each traceable to the project's User definition, and a value that violates a declared
                field's own type or required-ness is rejected by the Model.
              verify: Constructing a User from values that satisfy every declared field's type, required-ness,
                and default behaviour succeeds; a value that violates one of those declared properties
                is rejected; and the declared initial administrative record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a User with valid required fields, confirming password and api_key
                  are declared credential fields, and that a missing required field and an unknown field
                  are both rejected; confirmed the declared initial Admin record carries the credential-generation
                  sentinel for password and api_key.
                outcome: passed
        P1-G2:
          id: P1-G2
          title: Platform Connectivity
          description: Covers the Models that describe the supported trading API standards and a user's
            own connection instances to them.
          area: Trading platform identity and connection
          does: The Trading Platform and Instance Models exist, together expressing which trading APIs
            the system supports and how a user's own connection to one is represented.
          constraints: []
          task_count: 2
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              title: Define the Trading Platform Model
              description: Define the Model representing a supported trading API standard, expressing
                its display identity, the code identifying its implementation, its active-status field,
                and its descriptive field, together with its declared initial supported platforms.
              reason: Every Instance and every position-executing Model needs a shared definition of which
                trading API standards the system supports.
              kind: code
              inputs: []
              expected_result: A Trading Platform Model expressing its declared fields with their logical
                type and required-ness, and its declared initial records for the supported platforms as
                logical declarations.
              depends_on: []
              constraints: []
              acceptance: The Trading Platform Model's fields and its initial records are each traceable
                to the project's Trading Platform definition, and a value that violates a declared field's
                own type or required-ness is rejected by the Model.
              verify: Constructing a Trading Platform from values that satisfy every declared field's
                type and required-ness succeeds; a value that violates one of those declared properties
                is rejected; and the declared initial records for the supported platforms are present
                as logical declarations.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Trading Platform with valid required fields, confirming a missing
                  required field is rejected and both declared initial platform records (MetaTrader 5,
                  Binance) are present.
                outcome: passed
            P1-G2-T2:
              id: P1-G2-T2
              title: Define the Instance Model
              description: Define the Model representing a user-owned connection instance to a supported
                Trading Platform, expressing its display identity, its relationship to the owning User
                and to the used Trading Platform, its technical connection fields, its active-status field,
                and its descriptive field, together with the credential nature of its technical password
                and API key and its declared initial record.
              reason: An Account needs a defined technical connection to reach its Trading Platform, and
                that connection is owned by one user.
              kind: code
              inputs: []
              expected_result: An Instance Model expressing its declared fields and its relationships
                to User and Trading Platform with their logical cardinality, and its declared initial
                record as a logical declaration.
              depends_on:
              - P1-G1-T1
              - P1-G2-T1
              constraints: []
              acceptance: The Instance Model's fields, its relationships, and its initial record are each
                traceable to the project's Instance definition, and a value that violates a declared field's
                own type, required-ness, or the same-record connection-field requirement is rejected by
                the Model.
              verify: Constructing an Instance from values that satisfy every declared field's type and
                required-ness and that supply the connection fields required by its referenced Trading
                Platform succeeds; a value that omits one of those required connection fields or violates
                a declared field's own type is rejected; and the declared initial record is present as
                a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Instance with and without its optional technical connection fields,
                  confirming a missing required relationship field is rejected and password/api_key are
                  declared credential fields.
                outcome: passed
        P1-G3:
          id: P1-G3
          title: Currency and Broker Catalog
          description: Covers the Models that describe the currencies, brokers, and tradable assets available
            to a user's trading.
          area: Currency, broker, and asset catalog
          does: The Currency, Broker, and Asset Models exist, together expressing the catalog of currencies,
            brokers, and tradable assets a user's trading draws on.
          constraints: []
          task_count: 3
          tasks:
            P1-G3-T1:
              id: P1-G3-T1
              title: Define the Currency Model
              description: Define the Model representing a currency usable by the trading system, expressing
                its owning user, its standard code, its display symbol, its associated country or region,
                its monetary decimal precision, its active-status field, and its descriptive field, together
                with its declared initial set of supported currencies.
              reason: Account balances and every other monetary value in the project need a shared definition
                of the currency they are expressed in.
              kind: code
              inputs: []
              expected_result: A Currency Model expressing its declared fields with their logical type,
                required-ness, and default behaviour, and its declared initial currency records as logical
                declarations.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Currency Model's fields and its initial records are each traceable to the
                project's Currency definition, and a value that violates a declared field's own type,
                required-ness, or default behaviour is rejected by the Model.
              verify: Constructing a Currency from values that satisfy every declared field's type, required-ness,
                and default behaviour succeeds; a value that violates one of those declared properties
                is rejected; and the declared initial currency records are present as logical declarations.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Currency confirming its default decimal-digit precision applies when
                  unspecified, a missing required code is rejected, and all 8 declared initial currency
                  records are present.
                outcome: passed
            P1-G3-T2:
              id: P1-G3-T2
              title: Define the Broker Model
              description: Define the Model representing a broker supported by the system, expressing
                its display identity, its owning user, its active-status field, and its descriptive field,
                together with its declared initial record, independent of any one Trading Platform.
              reason: Assets and Accounts need a shared definition of the broker that provides or hosts
                them, without that definition depending on which Trading Platform is used to reach it.
              kind: code
              inputs: []
              expected_result: A Broker Model expressing its declared fields with their logical type and
                required-ness, and its declared initial record as a logical declaration.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Broker Model's fields and its initial record are each traceable to the project's
                Broker definition, and a value that violates a declared field's own type or required-ness
                is rejected by the Model.
              verify: Constructing a Broker from values that satisfy every declared field's type and required-ness
                succeeds; a value that violates one of those declared properties is rejected; and the
                declared initial record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Broker confirming its default active status applies and a missing
                  required name is rejected.
                outcome: passed
            P1-G3-T3:
              id: P1-G3-T3
              title: Define the Asset Model
              description: Define the Model representing an asset that can be selected for trading, expressing
                its providing broker, its trading symbol, its category, its point size, its price-decimal
                precision, its active-status field, and its descriptive field, together with its declared
                initial set of tradable assets.
              reason: A trading Action needs a shared definition of which assets exist, which broker provides
                each, and what category and price precision each uses.
              kind: code
              inputs: []
              expected_result: An Asset Model expressing its declared fields and its relationship to Broker
                with its logical cardinality, and its declared initial asset records as logical declarations.
              depends_on:
              - P1-G3-T2
              constraints: []
              acceptance: The Asset Model's fields, its relationship to Broker, and its initial records
                are each traceable to the project's Asset definition, and a value that violates a declared
                field's own type or required-ness is rejected by the Model.
              verify: Constructing an Asset from values that satisfy every declared field's type and required-ness
                and that reference a Broker succeeds; a value that violates one of those declared properties
                is rejected; and the declared initial asset records are present as logical declarations.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Asset referencing a Broker, confirming a missing required broker
                  reference is rejected.
                outcome: passed
        P1-G4:
          id: P1-G4
          title: Account Management
          description: Covers the Models that let a user organize and hold funded trading accounts.
          area: Trading account organization
          does: The Account Group and Account Models exist, together expressing how a user organizes and
            holds funded trading accounts.
          constraints: []
          task_count: 2
          tasks:
            P1-G4-T1:
              id: P1-G4-T1
              title: Define the Account Group Model
              description: Define the Model representing an independent group for organizing a user's
                trading accounts, expressing its owning user, its display identity, its active-status
                field, and its descriptive field, together with its declared initial default group.
              reason: An Account needs a shared definition of the group that organizes it.
              kind: code
              inputs: []
              expected_result: An Account Group Model expressing its declared fields with their logical
                type and required-ness, and its declared initial default record as a logical declaration.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Account Group Model's fields and its initial record are each traceable to
                the project's Account Group definition, and a value that violates a declared field's own
                type or required-ness is rejected by the Model.
              verify: Constructing an Account Group from values that satisfy every declared field's type
                and required-ness succeeds; a value that violates one of those declared properties is
                rejected; and the declared initial default record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Account Group confirming its default active status applies and a
                  missing required user reference is rejected.
                outcome: passed
            P1-G4-T2:
              id: P1-G4-T2
              title: Define the Account Model
              description: Define the Model representing a funded trading account, expressing its display
                identity, its relationships to its owning Account Group, its Broker, its connecting Instance,
                and its base Currency, its account-level login and credential fields, its leverage, balance,
                and account-model fields, its active-status field, and its descriptive field, together
                with the credential nature of its account password, the same-record distinction between
                its own login credentials and its Instance's technical connection credentials, and its
                declared initial record.
              reason: Positions and trading Actions are executed through a specific funded account, so
                the project needs one shared definition of what that account is, which broker and instance
                it connects through, and what currency it is based in.
              kind: code
              inputs: []
              expected_result: An Account Model expressing its declared fields, its relationships to Account
                Group, Broker, Instance, and Currency with their logical cardinality, its same-record
                credential-separation rule against its own Instance, and its declared initial record as
                a logical declaration.
              depends_on:
              - P1-G4-T1
              - P1-G3-T2
              - P1-G2-T2
              - P1-G3-T1
              constraints: []
              acceptance: The Account Model's fields, its relationships, its same-record credential-separation
                rule, and its initial record are each traceable to the project's Account definition, and
                a value that violates a declared field's own type, required-ness, or that rule is rejected
                by the Model.
              verify: Constructing an Account from values that satisfy every declared field's type and
                required-ness, its relationships, and its same-record credential-separation rule succeeds;
                a value that violates one of those declared properties is rejected; and the declared initial
                record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Account confirming its default balance applies, its password is
                  declared a credential field, and a missing required password is rejected. The rule separating
                  an Account's own credentials from its Instance's technical credentials requires both
                  records' stored values and the selected Trading Platform's requirements, which this
                  Model cannot reach on its own; per Model Principle 6 that check is deferred to Backend
                  Logic (phase P3) rather than implemented here.
                outcome: passed for what Model owns; cross-record credential-separation rule intentionally
                  deferred to Backend Logic
        P1-G5:
          id: P1-G5
          title: Trade Risk Rules
          description: Covers the Models that describe how open trades are trailed and partially closed.
          area: Trailing and partial-close rule sets
          does: The Trailing Group, Trailing Rule, Partial Group, and Partial Rule Models exist, together
            expressing how the system trails Stop Loss and Take Profit and partially closes an open trade.
          constraints: []
          task_count: 4
          tasks:
            P1-G5-T1:
              id: P1-G5-T1
              title: Define the Trailing Group Model
              description: Define the Model representing an independent group of rules for managing Stop
                Loss and Take Profit during a trade, expressing its owning user, its display identity,
                its active-status field, and its descriptive field, together with its declared initial
                default group.
              reason: Trailing Rules and every Model that applies trailing behaviour need a shared definition
                of the group that contains and identifies the rule set.
              kind: code
              inputs: []
              expected_result: A Trailing Group Model expressing its declared fields with their logical
                type and required-ness, and its declared initial default record as a logical declaration.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Trailing Group Model's fields and its initial record are each traceable
                to the project's Trailing Group definition, and a value that violates a declared field's
                own type or required-ness is rejected by the Model.
              verify: Constructing a Trailing Group from values that satisfy every declared field's type
                and required-ness succeeds; a value that violates one of those declared properties is
                rejected; and the declared initial default record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Trailing Group confirming its default active status applies and a
                  missing required user reference is rejected.
                outcome: passed
            P1-G5-T2:
              id: P1-G5-T2
              title: Define the Trailing Rule Model
              description: Define the Model representing an individual rule within a Trailing Group, expressing
                its display identity, its containing Trailing Group, its activation trigger percentage,
                its Take Profit and Stop Loss adjustment values, its active-status field, and its descriptive
                field.
              reason: The system needs a shared definition of when and how to adjust Take Profit and Stop
                Loss as a trade's profit progresses.
              kind: code
              inputs: []
              expected_result: A Trailing Rule Model expressing its declared fields and its relationship
                to Trailing Group with its logical cardinality, and its same-record uniqueness intent
                between its group and trigger percentage.
              depends_on:
              - P1-G5-T1
              constraints: []
              acceptance: The Trailing Rule Model's fields, its relationship to Trailing Group, and its
                uniqueness intent are each traceable to the project's Trailing Rule definition, and a
                value that violates a declared field's own type or required-ness is rejected by the Model.
              verify: Constructing a Trailing Rule from values that satisfy every declared field's type
                and required-ness and that reference a Trailing Group succeeds; a value that violates
                one of those declared properties is rejected.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Trailing Rule referencing a Trailing Group, confirming a missing
                  required field is rejected.
                outcome: passed
            P1-G5-T3:
              id: P1-G5-T3
              title: Define the Partial Group Model
              description: Define the Model representing an independent group of rules for managing partial
                closes of an open trade, expressing its owning user, its display identity, its active-status
                field, and its descriptive field, together with its declared initial default group.
              reason: Partial Rules and every Model that applies partial-close behaviour need a shared
                definition of the group that contains and identifies the rule set.
              kind: code
              inputs: []
              expected_result: A Partial Group Model expressing its declared fields with their logical
                type and required-ness, and its declared initial default record as a logical declaration.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Partial Group Model's fields and its initial record are each traceable to
                the project's Partial Group definition, and a value that violates a declared field's own
                type or required-ness is rejected by the Model.
              verify: Constructing a Partial Group from values that satisfy every declared field's type
                and required-ness succeeds; a value that violates one of those declared properties is
                rejected; and the declared initial default record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Partial Group confirming its default active status applies and a
                  missing required user reference is rejected.
                outcome: passed
            P1-G5-T4:
              id: P1-G5-T4
              title: Define the Partial Rule Model
              description: Define the Model representing an individual partial-close rule within a Partial
                Group, expressing its display identity, its containing Partial Group, its activation profit
                percentage, the percentage of the position it closes, its active-status field, and its
                descriptive field.
              reason: The system needs a shared definition of under which profit condition part of an
                open position closes and how much of it closes.
              kind: code
              inputs: []
              expected_result: A Partial Rule Model expressing its declared fields and its relationship
                to Partial Group with its logical cardinality, and its same-record uniqueness intent between
                its group and profit percentage.
              depends_on:
              - P1-G5-T3
              constraints: []
              acceptance: The Partial Rule Model's fields, its relationship to Partial Group, and its
                uniqueness intent are each traceable to the project's Partial Rule definition, and a value
                that violates a declared field's own type or required-ness is rejected by the Model.
              verify: Constructing a Partial Rule from values that satisfy every declared field's type
                and required-ness and that reference a Partial Group succeeds; a value that violates one
                of those declared properties is rejected.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Partial Rule referencing a Partial Group, confirming a missing required
                  field is rejected.
                outcome: passed
        P1-G6:
          id: P1-G6
          title: Trading Actions and Positions
          description: Covers the Models that describe how a position is opened and the record kept of
            every position the system creates.
          area: Trading action definition and position record
          does: The Action Group, Action, and Position Models exist, together expressing how a position
            is opened and the complete record kept of every position the system creates.
          constraints: []
          task_count: 3
          tasks:
            P1-G6-T1:
              id: P1-G6-T1
              title: Define the Action Group Model
              description: Define the Model representing an independent grouping of trading actions by
                risk profile, expressing its owning user, its display identity, its active-status field,
                and its descriptive field, together with its declared initial default group.
              reason: Actions need a shared definition of the risk-profile group they belong to, so trades
                can be organized and selected by intended risk level.
              kind: code
              inputs: []
              expected_result: An Action Group Model expressing its declared fields with their logical
                type and required-ness, and its declared initial default record as a logical declaration.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The Action Group Model's fields and its initial record are each traceable to
                the project's Action Group definition, and a value that violates a declared field's own
                type or required-ness is rejected by the Model.
              verify: Constructing an Action Group from values that satisfy every declared field's type
                and required-ness succeeds; a value that violates one of those declared properties is
                rejected; and the declared initial default record is present as a logical declaration.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Action Group confirming its default active status applies and a
                  missing required user reference is rejected.
                outcome: passed
            P1-G6-T2:
              id: P1-G6-T2
              title: Define the Action Model
              description: Define the Model representing how a position must be opened, expressing its
                display identity, its containing Action Group, the Asset it trades and the Account it
                executes through, the Partial Group and Trailing Group it applies, its risk-to-reward,
                Take Profit, and Stop Loss values, its active-status field, and its descriptive field.
              reason: Positions are created from a defined Action, so the project needs one shared definition
                of the asset, account, risk parameters, and rule groups that determine how a position
                is opened.
              kind: code
              inputs: []
              expected_result: An Action Model expressing its declared fields and its relationships to
                Action Group, Asset, Account, Partial Group, and Trailing Group with their logical cardinality,
                and its same-record uniqueness intent between its group and display identity.
              depends_on:
              - P1-G6-T1
              - P1-G3-T3
              - P1-G4-T2
              - P1-G5-T3
              - P1-G5-T1
              constraints: []
              acceptance: The Action Model's fields, its relationships, and its uniqueness intent are
                each traceable to the project's Action definition, and a value that violates a declared
                field's own type or required-ness is rejected by the Model.
              verify: Constructing an Action from values that satisfy every declared field's type and
                required-ness and that reference its Action Group, Asset, Account, Partial Group, and
                Trailing Group succeeds; a value that violates one of those declared properties is rejected.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed an Action referencing its Action Group, Asset, Account, Partial Group,
                  and Trailing Group, confirming a missing required relationship field is rejected.
                outcome: passed
            P1-G6-T3:
              id: P1-G6-T3
              title: Define the Position Model
              description: Define the Model that stores the complete information for every position the
                system creates, expressing its owning user, its display identity, its Trading Platform,
                Broker, Account, Trailing Group, Partial Group, Action Group, and originating Action,
                its date, volume, profit, execution-status, and order-type fields, its initial and current
                Take Profit and Stop Loss values, its active-status field, and its descriptive field.
              reason: The project needs one shared, complete record of every position it creates, whether
                pending or already executed, and of every Model it was created from and now relates to.
              kind: code
              inputs: []
              expected_result: A Position Model expressing its declared fields and its relationships to
                User, Trading Platform, Broker, Account, Trailing Group, Partial Group, Action Group,
                and Action with their logical cardinality.
              depends_on:
              - P1-G1-T1
              - P1-G2-T1
              - P1-G3-T2
              - P1-G4-T2
              - P1-G5-T1
              - P1-G5-T3
              - P1-G6-T1
              - P1-G6-T2
              constraints: []
              acceptance: The Position Model's fields and its relationships are each traceable to the
                project's Position definition, and a value that violates a declared field's own type or
                required-ness is rejected by the Model.
              verify: Constructing a Position from values that satisfy every declared field's type and
                required-ness and that reference its related Models succeeds; a value that violates one
                of those declared properties is rejected.
              status: done
              log:
              - at: '2026-09-11T08:24:00Z'
                event: Implemented and verified by my-interface-developing.
                check: Constructed a Position confirming its default execution-status and profit apply,
                  and a missing required date field is rejected.
                outcome: passed
        P1-G7:
          id: P1-G7
          title: Package Publication
          description: Covers publishing the complete resolved set of Models as one independently importable
            package.
          area: Model package public interface
          does: The resolved Model set is available to every consuming Component through one documented
            public import interface, with each Model exposed exactly once.
          constraints: []
          task_count: 1
          tasks:
            P1-G7-T1:
              id: P1-G7-T1
              title: Publish the Model package's public interface
              description: Publish the complete resolved set of Models as one independently importable
                package, exposing every Model exactly once through one documented public import interface
                without changing any Model's logical identity.
              reason: Every technical Component needs one shared, importable definition of the project's
                Models instead of maintaining private copies.
              kind: code
              inputs:
              - The complete set of implemented Models
              expected_result: One package whose public import interface exposes every resolved Model
                exactly once, each retaining the logical identity, fields, relationships, and rules declared
                in its own definition.
              depends_on:
              - P1-G1-T1
              - P1-G2-T1
              - P1-G2-T2
              - P1-G3-T1
              - P1-G3-T2
              - P1-G3-T3
              - P1-G4-T1
              - P1-G4-T2
              - P1-G5-T1
