      P2-G3:
        id: P2-G3
        title: Storage-Schema Migrations
        description: The ordered, recorded history through which the complete storage schema is reproduced
          from nothing.
        area: 'Database: migration history'
        does: A migration tool is configured for the selected Engine and ORM, and one recorded, ordered
          migration establishes the complete current storage schema from an empty database.
        constraints: []
        task_count: 1
        tasks:
          P2-T17:
            id: P2-T17
            title: Establish the initial storage-schema migration
            description: Configure the selected migration tool for the selected Engine and ORM, then record
              one ordered migration that creates the complete storage schema for every mapped persistent
              entity, with a tested reversal.
            reason: The storage schema must never change without a recorded migration, and migration history
              is the authoritative record of how the current structure was reached.
            kind: code
            inputs:
            - Every mapped persistent entity from Persistence Mapping
            - Established Storage Adapter foundation
            expected_result: Applying the recorded migration history to an empty database produces the
              complete current storage schema for every mapped entity, and reversing that history removes
              it again without manual structural intervention.
            depends_on:
            - P2-T2
            - P2-T3
            - P2-T4
            - P2-T5
            - P2-T6
            - P2-T7
            - P2-T8
            - P2-T9
            - P2-T10
            - P2-T11
            - P2-T12
            - P2-T13
            - P2-T14
            - P2-T15
            - P2-T16
            constraints: []
            acceptance: Running the migration history forward against an empty database produces a schema
              matching every mapped entity's declared fields, constraints, and relationships; running
              it backward removes that schema; a schema-drift check against the current mappings reports
              no drift immediately after migrating.
            verify: Apply the full migration history to a fresh empty database and inspect the resulting
              structure against every mapped entity; reverse the history and confirm the structure is
              removed; run the configured drift check immediately after migrating and confirm it reports
              no drift.
            status: done
            log:
            - at: '2026-09-12T20:20:00Z'
              by: developing
              event: completed
              check: Applied the autogenerated initial migration to an empty database and confirmed all
                15 mapped tables exist; reversed it and confirmed only the alembic_version table remained;
                re-applied it and ran `alembic check`, which reported no drift against the current mappings.
              outcome: passed
      P2-G4:
        id: P2-G4
        title: Initial Data Seeding
        description: Insertion of every Model-declared initial record into the migrated schema.
        area: 'Database: initial data seeding'
        does: Every initial record the Model package declares exists in the database after seeding, in
          dependency order, with every system-generated value (identity, generated credential) supplied.
        constraints: []
        task_count: 1
        tasks:
          P2-T18:
            id: P2-T18
            title: Seed declared initial data
            description: Insert every initial record declared by the Model package into the migrated schema,
              resolving declared relationship identifiers in dependency order and supplying every system-generated
              value the Model package intentionally leaves out, including a securely generated value for
              a field the owning Model declares as a credential.
            reason: Initial records are part of what the project declared, so a rebuilt database is only
              equivalent to the original when they come back with the same meaning.
            kind: code
            inputs:
            - Every Model's declared initial data
            - The completed migration history
            expected_result: After seeding a freshly migrated, empty database, every Model-declared initial
              record exists with its declared field values, its declared relationships correctly resolved,
              and every system-generated field populated; seeding is repeatable without duplicating a
              logical record.
            depends_on:
            - P2-T17
            constraints: []
            acceptance: Seeding is repeatable without duplicating a record.
            verify: Seed a freshly migrated empty database and confirm every declared initial record is
              present with its declared values and resolved relationships and every generated field populated;
              run seeding a second time against the same database and confirm no duplicate record is created.
            status: done
            log:
            - at: '2026-09-12T20:20:00Z'
              by: developing
              event: completed
              check: 'Seeded a freshly migrated empty database: every declared initial record (24 total
                across 12 Models) was inserted with resolved relationships and generated identity and
                credential values populated; running seeding a second time inserted zero additional records
                for every Model.'
              outcome: passed
      P2-G5:
        id: P2-G5
        title: Public Database Interface
        description: The one generic, Model-driven interface through which every consumer reads and writes,
          its transaction boundary, and its controlled SQL escape hatch.
        area: 'Database: Database Interface and Data Logic'
        does: A consumer performs add, read, read-by-identifier, list, edit, delete, and status operations
          for any persistent Model through one generic interface, groups related operations in an explicit
          transaction, and can run capability-restricted controlled SQL when a standard operation cannot
          express what is needed.
        constraints: []
        task_count: 3
        tasks:
          P2-T19:
            id: P2-T19
            title: Implement the generic Model-driven data-access pipeline
            description: Implement one generic operation pipeline, published through the Database Interface,
              that performs add, read, read-by-identifier, list, edit, and delete for any persistent Model
              the caller supplies as an imported Model type or instance, plus a status operation available
              only for a Model declaring a status field, applying each Model's persistence mapping and
              the resolved credential storage transformation.
            reason: Differences between Models come from their resolved fields, relationships, constraints,
              and mappings, so one pipeline can serve every Model without a new access implementation
              per Model.
            kind: code
            inputs:
            - Every mapped persistent entity
            - Established Storage Adapter foundation and Instance Registry
            expected_result: Every mapped persistent Model supports add, read, read-by-identifier, list,
              edit, and delete through the same public operation, identified only by its imported Model
              type or instance; a Model without a status field rejects the status operation; a read never
              exposes a credential field's stored representation; a write applies the Model's declared
              validation and the resolved credential transformation before it is committed.
            depends_on:
            - P2-T1
            - P2-T2
            - P2-T3
            - P2-T4
            - P2-T5
            - P2-T6
            - P2-T7
            - P2-T8
            - P2-T9
            - P2-T10
            - P2-T11
            - P2-T12
            - P2-T13
            - P2-T14
            - P2-T15
            - P2-T16
            - P2-T17
            - P2-T18
            constraints: []
            acceptance: Every generic operation succeeds for valid input and is rejected for invalid input
              (a missing required field, a violated relationship, or a not-found identifier) with a distinguishable
              result; the status operation succeeds only for a Model declaring status and is rejected
              otherwise; a credential field's stored representation is never present in a read result.
            verify: Exercise add, read, read-by-identifier, list, edit, delete, and status for a representative
              sample of Models covering a status-bearing Model, a non-status-bearing Model, and a Model
              with a credential field, observing success for valid input, a distinguishable rejection
              for invalid input and a not-found identifier, status rejection for a Model without status,
              and absence of the credential's stored representation from every read result.
            status: done
            log:
            - at: '2026-09-12T20:20:00Z'
              by: developing
              event: completed
              check: Exercised add, read, list, edit, delete, and status for User (status-bearing, credential-bearing)
                and a synthetic status-less type; observed success for valid input, NotFoundError for
                a missing identifier, StatusNotSupportedError for the status-less type, ConstraintViolationError
                for a uniqueness and a foreign-key violation, and confirmed no read ever returned a credential's
                stored representation.
              outcome: passed
          P2-T20:
            id: P2-T20
            title: Implement the explicit transaction boundary
            description: Publish a transaction boundary through the Database Interface that lets a consumer
              group related data operations on one Instance so they commit together only when the whole
              group succeeds, and roll back together otherwise, with a distinguishable outcome for a conflict,
              timeout, or connection failure.
            reason: Related changes must not leave partially applied data when part of a group fails,
              and a consumer needs to express that relationship without owning persistence internals.
            kind: code
            inputs:
            - The generic data-access pipeline
            - Established Storage Adapter foundation
            expected_result: A consumer can group multiple generic operations on one Instance so that
              a failure in any of them rolls back every change the group made, while a group that fully
              succeeds commits every change together; a standalone operation outside a group forms its
              own atomic unit; a transient conflict, timeout, or connection failure is reported as a distinguishable
              outcome rather than a generic error.
            depends_on:
            - P2-T19
            constraints: []
            acceptance: A transaction group whose later operation fails leaves none of the group's changes
              persisted; a transaction group that fully succeeds leaves every one of its changes persisted;
              a standalone operation performed outside any group is independently committed.
            verify: Run a transaction group with a failing operation after a successful one and confirm
              neither change persisted; run a transaction group that fully succeeds and confirm every
              change persisted; perform a standalone operation outside a group and confirm it persisted
              independently of any other pending group.
            status: done
            log:
            - at: '2026-09-12T20:20:00Z'
              by: developing
              event: completed
              check: Ran a transaction group with a failing second operation and confirmed neither change
                persisted; ran a fully successful group and confirmed every change persisted; performed
                a standalone operation outside any group and confirmed it persisted independently.
              outcome: passed
          P2-T21:
            id: P2-T21
            title: Implement the controlled SQL execution route
            description: Publish a capability-restricted controlled-SQL execution route through the Database
              Interface for a data operation that cannot be expressed through the generic Model-driven
              pipeline, accepting only parameterized values and allow-listed identifiers, rejecting structural
              changes, privilege changes, and migration operations, and applying the same credential and
              sensitive-data protection to its results as the generic operations.
            reason: Some data operations cannot be expressed through generic Model-driven access, but
              they must not become a way to bypass Database's persistence protections or Migration's exclusive
              ownership of structural change.
            kind: code
            inputs:
            - The generic data-access pipeline and its transaction boundary
            expected_result: A controlled SQL command executes only against an allow-listed identifier
              with parameterized values, participates in the same transaction and validation protections
              as the generic pipeline, and is rejected outright when it attempts a structural change,
              a privilege change, or a migration operation; its results never expose a credential's stored
              representation.
            depends_on:
            - P2-T19
            - P2-T20
            constraints: []
            acceptance: A parameterized controlled SQL command against an allow-listed identifier succeeds
              and returns protected results; an attempted structural, privilege, or migration command
              through the same route is rejected before execution.
            verify: Execute a parameterized controlled SQL command against an allow-listed identifier
              and confirm it succeeds with protected results; attempt a structural command (such as creating
              or altering a table) through the same route and confirm it is rejected before execution.
            status: done
            log:
            - at: '2026-09-12T20:20:00Z'
              by: developing
              event: completed
              check: Executed a parameterized controlled SQL SELECT against an allow-listed table and
                confirmed protected (redacted) results; attempted an ALTER TABLE through the same route
                and confirmed it was rejected before execution, verified by the table remaining unchanged;
                attempted a query against a non-allow-listed table and confirmed rejection.
              outcome: passed
