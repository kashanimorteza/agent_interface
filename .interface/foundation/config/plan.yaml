              - The Model Foundation
              - The Broker Domain Definition
              expected_result: An authoritative Asset Domain Definition is available through Model's Public Interface, carrying every field, relationship, and rule the Target defines for Asset.
              depends_on:
              - P1-G1-T1
              - P1-G3-T2
              constraints: []
              acceptance: The Asset Domain Definition matches every field, relationship, and rule the Target states for Asset, with nothing invented and nothing missing.
              verify: The Asset Domain Definition's Public Interface, inspected against the Target's stated fields, relationships, and rules for Asset, shows an exact match.
              status: done
              log:
              - at: '2026-09-14T09:18:02Z'
                event: completed
                check: uv run pytest tests/test_asset.py (4 checks) — exact field set, uniqueness (broker_id, symbol), defaults, JSON round-trip/schema.
                outcome: passed
