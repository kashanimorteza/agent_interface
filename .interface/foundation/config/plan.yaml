        P1G6:
          id: P1G6
          title: Public Interface and Documentation
          description: The Model package's explicit Public Interface, Application Manifest publication,
            and operational documentation.
          area: The Model package's explicit Public Interface and operational documentation
          does: Every Domain Definition is exposed through one explicit, stable Public Interface, the
            Model package's public metadata is published to the Application Manifest, and its README documents
