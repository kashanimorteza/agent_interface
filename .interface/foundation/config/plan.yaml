task_count: 39
plans:
  P1:
    id: P1
    title: Model
    order: 1
    revision: 2
    target: Model
    does: Implement the independent Model layer and its reusable package from the defined models, fields,
      relationships, rules, and initial data.
    constraints: []
    task_count: 17
    groups:
      P1-G1:
        id: P1-G1
        title: Package Foundation
        description: 'The shared foundation every domain Model in the package builds on: its base class,
          its public import interface shape, and its isolated development environment.'
        area: Model package foundation
        does: A working, empty Model package exists with a shared base class, a documented public-interface
          shape, and an isolated environment ready to hold every domain entity.
        constraints: []
        task_count: 1
        tasks:
          P1-T1:
            id: P1-T1
            title: Establish the Model package foundation
            description: Create the independent Model package with its isolated development environment,
              its shared base class that every concrete domain Model will inherit from, and the structural
              shape of its public import interface.
            reason: Every domain Model depends on one shared base class and one stable public interface;
              establishing them first lets every later Model be added consistently rather than each inventing
              its own foundation.
            kind: code
            inputs:
            - Resolved Model Preferences for package name, language, environment, and modeling library
            expected_result: An installable, independently importable Model package exists with a project
              base class distinct from the reserved component name, an isolated environment capturing
              its dependencies, and a public interface shape ready to expose domain modules.
            depends_on: []
            constraints: []
            acceptance: The package can be installed into its isolated environment and imported on its
              own, exposing the shared base class through the public interface without importing any domain
              entity yet.
            verify: Install the package into a clean isolated environment and import it, observing that
              the import succeeds, the shared base class is reachable through the public interface, and
              no domain entity, database, network, or API dependency is required for the import to succeed.
            status: done
            log:
            - at: '2026-09-12T19:30:00Z'
              by: developing
              event: completed
              check: uv sync installed the package into its isolated environment; a fresh import exposed
                the shared base class through the public interface with no domain entity, database, network,
                or API dependency required.
              outcome: passed
      P1-G2:
        id: P1-G2
        title: Identity and Platform Access
        description: The entities that establish who uses the system and which trading-platform standards
          the system supports.
        area: 'Model: user identity and supported trading platforms'
        does: The User and Trading Platform domain entities are available through the package's public
          interface with their declared fields, rules, and initial data.
        constraints: []
        task_count: 2
        tasks:
          P1-T2:
            id: P1-T2
            title: Define the User Model
            description: Define the User domain entity in the shared Model package, exposing its fields,
              credential designations, and declared initial record as stated by the current Target Model
              definition.
            reason: User establishes independent user identity and ownership that other domain entities
              in this Model set reference.
            kind: code
            inputs:
            - Current Target Model definition for User
            - Established package foundation
            expected_result: A public User Model type is available through the package interface with
              exactly the fields, nullability, defaults, and credential designations the Target declares,
              together with its declared initial record expressed as a Model-owned initial-data declaration.
            depends_on:
            - P1-T1
            constraints: []
            acceptance: A User instance can be constructed from data satisfying every declared field,
              type, nullability, and default; construction fails when a required field is missing or a
              declared single-record rule is violated; the credential fields are distinguishable as sensitive
              and as requiring hash rather than encrypted handling.
            verify: Construct valid and invalid User instances through the public interface and observe
              that valid data succeeds, invalid data is rejected, credential fields are marked sensitive
              with hash handling distinguished from encrypted handling, and the declared initial record
              is retrievable as a Model-owned declaration without being inserted anywhere.
            status: done
            log:
            - at: '2026-09-12T19:30:00Z'
              by: developing
              event: completed
              check: 'Constructed valid and invalid User instances through the public interface; valid
                data succeeded, invalid data (missing field, unknown field) raised ValidationError, both
                credential fields carried {''credential'': True, ''storage_at_rest'': ''hash''} in their
                json_schema_extra, and the declared initial record was retrievable from user.INITIAL_DATA
                without id, password, or api_key.'
              outcome: passed
          P1-T3:
            id: P1-T3
            title: Define the Trading Platform Model
            description: Define the Trading Platform domain entity in the shared Model package, exposing
              its fields and declared initial records as stated by the current Target Model definition.
            reason: Trading Platform identifies the supported trading API standards that other entities
              in this Model set reference, independent of any specific exchange or broker.
            kind: code
            inputs:
            - Current Target Model definition for Trading Platform
            - Established package foundation
            expected_result: A public Trading Platform Model type is available through the package interface
              with exactly the fields, nullability, and defaults the Target declares, together with its
              declared initial records expressed as Model-owned initial-data declarations.
            depends_on:
            - P1-T1
            constraints: []
            acceptance: A Trading Platform instance can be constructed from data satisfying every declared
              field, type, nullability, and default; construction fails when a required field is missing.
            verify: Construct valid and invalid Trading Platform instances through the public interface
              and observe that valid data succeeds, invalid data is rejected, and both declared initial
              records are retrievable as Model-owned declarations without being inserted anywhere.
            status: done
            log:
            - at: '2026-09-12T19:30:00Z'
              by: developing
              event: completed
              check: Constructed valid and invalid Trading Platform instances through the public interface;
                valid data succeeded, a missing required field raised ValidationError, and both declared
                initial records were retrievable from trading_platform.INITIAL_DATA.
