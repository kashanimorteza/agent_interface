              inputs: ["Target Technical Definition Currency Model section", "the User Domain Definition's Public Interface"]
              expected_result: "A Currency Domain Definition publishing id, user_id, code, symbol, country, decimal_digits, is_active, and description with their Target-declared types, nullability, and defaults, a Domain Relationship to User by user_id, a composite uniqueness constraint on user_id and code, and declared persistent."
