              inputs: ["Target's Partial Rule definition"]
              expected_result: "A persistent Partial Rule Domain Definition exposing id, name, partial_group_id, profit_percentage, close_percentage, is_active, and description, relating one Partial Group, globally unique by name, unique per Partial Group by profit percentage."
              depends_on: ["P1-T-establish-foundation", "P1-T-define-partial-group"]
              constraints: []
              acceptance: "Every declared field, nullability, relationship, and uniqueness matches the Target exactly."
              verify: "The realized Partial Rule Domain Definition validates and serializes data through its public surface using exactly the declared fields and enforces its declared uniqueness constraints at the domain level where declared."
              status: "done"
              log:
                - event: "implemented and verified"
                  check: "Realized PartialRule with declared fields, PartialGroup relationship, and per-group profit-percentage uniqueness; verified via tests/test_partial_rule.py (5 tests)."
                  outcome: "passed"
                  recorded_by: "my-interface-developing"
                  recorded_at: "2026-09-15T15:10:00Z"

        P1-G-action-position:
