meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
read_order:
  - "task_count"
  - "plans"
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."
content:
  task_count: 21
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 1
      target: "model"
      does: "The Model Component exists as an independent, reusable layer that publishes one authoritative Domain Definition for every Target model through one Public Interface, ready for its consumers."
      constraints: []
      task_count: 21
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Technical readiness"
          description: "Makes the Component's resolved technical requirements available so every later Task can be built and checked in isolation."
          area: "Reproducible technical requirements of the Component"
          does: "The Component can be built and checked in an isolated, reproducible environment."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              title: "Make the Component's technical requirements available"
              description: "Resolve the technical requirements the Component needs from its Component Profile and the applicable Development items, and make them available in an isolated, reproducible environment that touches nothing outside the Component's boundary."
              reason: "Every later Task needs the resolved language, dependency management, modeling capability, and quality tools present and locked before a Domain Definition is written."
              kind: "configuration"
              inputs:
                - "The Component's profile in Development Preferences"
                - "The language, package management, modeling, and quality-tool selections it resolves to"
              expected_result: "The Component has its resolved dependencies installed and locked in an isolated environment, including the quality tools declared for its language."
              depends_on: []
              constraints: []
              agent_consider: []
              agent_avoid: []
              agent_overridden: []
              agent_skills: []
              acceptance: "Every resolved requirement is present at a version that satisfies its declared constraint, the dependency set is locked so a fresh environment reproduces it exactly, nothing is installed outside the Component's boundary, and no test tooling is added because the Component is outside the declared testing scope."
              verify: "In a fresh isolated environment reproduced from the lock, the resolved language and every declared quality tool report a version satisfying its constraint, the modeling capability can be used, and the Component's dependency declaration contains no test tooling."
              status: "done"
              log:
                - "2026-09-19T21:59:52Z Claimed by developing."
                - "2026-09-19T22:00:26Z Verified: fresh env reproduced from uv.lock (uv sync --locked) reports Python 3.14.7, pydantic 2.13.5 (2.x), ruff 0.16.8, pyright 1.1.414; pyproject and lock contain no test tooling; library-skills check found no library skills to provision. Environment isolated in the Component's own .venv."
                - "2026-09-19T22:08:49Z Addendum: added pyright configuration to the Component's pyproject so the type checker resolves the Component's own isolated environment even when the system Python on PATH is older (found when a fresh-environment gate run reported 73 spurious errors from Python 3.7); after the change bare pyright, uv run pyright, ruff check, and ruff format --check all pass and the lock is unchanged."
        P1-G2:
          id: "P1-G2"
          title: "Declaration Vocabulary and Model Foundation"
          description: "The two shared mechanisms every Domain Definition depends on: the vocabulary it declares itself in, and the foundation it receives shared behaviour from."
          area: "Shared declaration and behaviour mechanisms"
          does: "Any Domain Definition can declare itself in the one standard vocabulary and inherits shared validation and Serialization without owning or receiving domain Fields."
          constraints: []
          task_count: 2
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              title: "Provide the Declaration Vocabulary"
              description: "Provide the one technology-independent vocabulary in which every Domain Definition states its Fields, its relationships, and itself, so every term fixed by the Model Declaration Schema can be expressed, is carried by the same definition application code uses, and can be read back by any consumer through the Public Interface."
              reason: "Every Domain Definition declares itself in this vocabulary, and Database reads storage-relevant meaning from it rather than from a second artifact."
              kind: "code"
              inputs:
                - "The terms and meanings fixed by the Model Declaration Schema"
                - "The resolved modeling capability"
              expected_result: "Every Field term (type, length, precision, optionality, default, identity, generated, unique, credential with its at-rest treatment, activation), every relationship term (reference to the definition itself, cardinality, optionality), and every definition term (persistence, composite uniqueness) can be declared and read back, with no term the Schema does not define and no storage-specific term."
              depends_on: ["P1-G1-T1"]
              constraints: []
              agent_consider: &pydantic_consider
                - "Standards, json_schema: Draft 2020-12, emitted by model_json_schema(); the same output is OpenAPI 3.1 compatible."
                - "Standards, typing: Modern Python typing as the language entry states it — builtin generics and the union operator."
                - "Structure, field_declaration: Declare a constrained field as Annotated[T, Field(...)]. The assignment form reads as though the field has a default when it does not."
                - "Structure, reusable_domain_type: Define a repeated constraint once as an Annotated alias carrying AfterValidator or an annotated_types constraint, then reuse the alias instead of repeating the constraint on each field."
                - "Structure, model_config: ConfigDict(extra='forbid', validate_assignment=True, validate_default=True, str_strip_whitespace=True); add frozen=True where the concept is a value rather than an entity. The default for extra is 'ignore', which discards an unknown field silently."
                - "Structure, single_field_rule: @field_validator"
                - "Structure, cross_field_rule: @model_validator(mode='after')"
                - "Structure, polymorphic_data: A discriminated union, with Field(discriminator=...)"
                - "Structure, root_collection: RootModel[...]"
                - "Structure, non_model_validation: TypeAdapter, for validating a type that is not a BaseModel"
                - "Structure, derived_value: computed_field"
                - "Structure, validator_order: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance."
                - "API, names: base_model pydantic.BaseModel; configuration pydantic.ConfigDict; field_validation pydantic.field_validator; model_validation pydantic.model_validator; root_model pydantic.RootModel; computed_field pydantic.computed_field; field_serialization pydantic.field_serializer; model_serialization pydantic.model_serializer; serialization model_dump and model_dump_json; schema model_json_schema."
              agent_avoid: &pydantic_avoid
                - "Legacy APIs: validator, root_validator, parse_obj, dict, json."
                - "Deprecated constraint helpers, scheduled for removal in Pydantic 3; express the same constraint with Annotated instead: constr, conint, confloat, condecimal."
                - "PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead."
              agent_overridden: []
              agent_skills: &pydantic_skills
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "A transient probe definition that uses every vocabulary term declares them all, and each declared value reads back unchanged through the same definition; a relationship declared against a definition that does not exist fails where it is written; a definition declared without persistence, or a relationship declared without cardinality and optionality, is rejected; nothing storage-specific is expressible. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Declaring the transient probe and reading its declaration back through the Public Interface shows every term intact; each rejected declaration above fails at declaration time with an error naming what is missing; the probe is discarded and leaves nothing in the Component."
              status: "done"
              log:
                - "2026-09-19T22:00:26Z Claimed by developing."
                - "2026-09-19T22:03:25Z Verified with a transient probe (probe_foundation, run and discarded outside the Component): every Field/relationship/definition term declared and read back intact; rejected at declaration time: reference to a non-definition, reference to an unknown Field, missing persistence, missing cardinality, missing optionality, Field without logical type, unique set naming unknown Field; no storage-specific term exposed. ruff format/check and pyright clean. pydantic Skill guidance applied: markers are frozen dataclasses because Pydantic treats BaseModel instances inside Annotated as validators (found and fixed during the probe)."
            P1-G2-T2:
              id: "P1-G2-T2"
              title: "Provide the Model Foundation"
              description: "Provide the one shared foundation every Domain Definition receives, supplying shared validation behaviour, the Serialization pair that converts a definition to and from its Plain Representation, and declaration reading, without owning or imposing any Field or relationship."
              reason: "One foundation gives every definition the same behaviour once instead of each definition re-implementing it."
              kind: "code"
              inputs:
                - "The Declaration Vocabulary"
              expected_result: "A definition built on the Foundation can be converted to a Plain Representation of simple named values that a consumer can encode as JSON without a custom encoder, with a related definition appearing only as its declared reference value and no Field withheld, and can be rebuilt from such a representation with the same Intrinsic Rules applied; every operation is deterministic, data-only, and free of external I/O, and a failed validation is reported as an error that identifies the offending Field."
              depends_on: ["P1-G1-T1", "P1-G2-T1"]
              constraints: []
              agent_consider: *pydantic_consider
              agent_avoid: *pydantic_avoid
              agent_overridden: []
              agent_skills: *pydantic_skills
              acceptance: "On a transient probe definition, converting to the Plain Representation and rebuilding returns data equal to the original, the plain form encodes to JSON without a custom encoder, rebuilding data that breaks an Intrinsic Rule fails with an error naming the Field, and the Foundation contributes no Field or relationship to the probe. The Foundation stands apart from every Domain Definition. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Round-tripping the probe through the Serialization pair, encoding the plain form, and rebuilding from deliberately invalid data are each observed to give the stated results, and the probe's declared Fields are exactly those it declared itself; the probe is discarded and leaves nothing in the Component."
              status: "done"
              log:
                - "2026-09-19T22:03:25Z Verified with the same transient probe: Foundation adds no Field (model_fields empty); Serialization round-trip equal; plain form encodes with json.dumps and no custom encoder; no Field withheld; deserialize of an over-long value fails with error location naming the Field; unknown key and wrong-kind value (no silent coercion) rejected. ruff and pyright clean."
        P1-G3:
          id: "P1-G3"
          title: "Identity and connectivity definitions"
          description: "The Domain Definitions for who uses the system, which trading standards it supports, and the user-owned connections to them."
          area: "User, Trading Platform, and Instance domain meaning"
          does: "User, Trading Platform, and Instance are each declared as the Target defines them."
          constraints: []
          task_count: 3
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              title: "Declare the User Domain Definition"
              description: "Declare the authoritative Domain Definition for the independent user of the system, exactly as the Target defines it, standing apart from every other Domain Definition."
              reason: "Every user-owned concept refers to a User, and multi-user operation depends on it."
              kind: "code"
              inputs:
                - "The Target's definition of User"
                - "The Declaration Vocabulary"
                - "The Model Foundation"
              expected_result: "User is declared persistent with every Field and property the Target states, including generated identity, uniqueness of name and username, activation that defaults to active, an optional description, and the credential classification with the Target's at-rest treatment on password and api_key; its Plain Representation still contains those credential Fields."
              depends_on: ["P1-G2-T1", "P1-G2-T2"]
              constraints: []
              agent_consider: *pydantic_consider
              agent_avoid: *pydantic_avoid
              agent_overridden: []
              agent_skills: *pydantic_skills
              acceptance: "Reading the User declaration shows each Target Field with its stated properties, persistence declared persistent, activation declared on the active Field, and password and api_key classified as credentials with the treatment the Target requires. Valid data builds a User; data missing a required Field, or with an empty required value, is rejected; the Plain Representation round-trips. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Through the Public Interface, reading the declaration, building with valid data, building with each kind of invalid data, and round-tripping the Plain Representation give the stated results."
              status: "done"
              log:
                - "2026-09-19T22:03:25Z Claimed by developing."
                - "2026-09-19T22:05:10Z Verified with transient probe (run and discarded outside the Component, expectations transcribed from the Target): User declaration matches Target Field by Field (names, order, logical types, optionality, defaults, uniqueness, credentials, persistent, activation on is_active; password and api_key classified credential/hash and present in the Plain Representation); valid data builds; each required Field rejected when missing, null, or of the wrong kind; unknown key rejected; Plain Representation JSON-encodes without a custom encoder, keeps every Field, and round-trips equal. ruff and pyright clean. Modelling choices recorded in the definition module."
            P1-G3-T2:
              id: "P1-G3-T2"
              title: "Declare the Trading Platform Domain Definition"
              description: "Declare the authoritative Domain Definition for a supported trading API standard, exactly as the Target defines it, standing apart from every other Domain Definition and carrying nothing specific to a single exchange or broker."
              reason: "Instances and Positions refer to a Trading Platform, and the system stays independent of any one exchange through it."
              kind: "code"
              inputs:
                - "The Target's definition of Trading Platform"
                - "The Declaration Vocabulary"
                - "The Model Foundation"
              expected_result: "Trading Platform is declared persistent with every Field and property the Target states, including generated identity, unique name, the code that identifies its implementation, activation that defaults to active, and an optional description."
              depends_on: ["P1-G2-T1", "P1-G2-T2"]
              constraints: []
              agent_consider: *pydantic_consider
              agent_avoid: *pydantic_avoid
              agent_overridden: []
              agent_skills: *pydantic_skills
              acceptance: "Reading the Trading Platform declaration shows each Target Field with its stated properties and persistence declared persistent. Valid data builds one; data missing name or code is rejected; the Plain Representation round-trips. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Through the Public Interface, reading the declaration, building with valid data, building with data missing name or code, and round-tripping the Plain Representation give the stated results."
              status: "done"
              log:
                - "2026-09-19T22:03:25Z Claimed by developing."
                - "2026-09-19T22:05:10Z Verified with transient probe (run and discarded outside the Component, expectations transcribed from the Target): TradingPlatform declaration matches Target Field by Field (names, order, logical types, optionality, defaults, uniqueness, credentials, persistent, activation on is_active; name unique, code required); valid data builds; each required Field rejected when missing, null, or of the wrong kind; unknown key rejected; Plain Representation JSON-encodes without a custom encoder, keeps every Field, and round-trips equal. ruff and pyright clean. Modelling choices recorded in the definition module."
            P1-G3-T3:
              id: "P1-G3-T3"
              title: "Declare the Instance Domain Definition"
              description: "Declare the authoritative Domain Definition for a user-owned connection instance through which the system reaches a supported Trading Platform, exactly as the Target defines it, standing apart from every other Domain Definition."
              reason: "Accounts connect through an Instance, and each Instance ties one user to one Trading Platform."
              kind: "code"
              inputs:
                - "The Target's definition of Instance"
                - "The User and Trading Platform Domain Definitions"
                - "The Declaration Vocabulary"
                - "The Model Foundation"
              expected_result: "Instance is declared persistent with every Field and property the Target states, carrying its relationship to User and to Trading Platform as references to those definitions with their cardinality and optionality, the composite uniqueness of user and name, optional connection Fields, and password and api_key classified as credentials with the treatment the Target requires."
              depends_on: ["P1-G2-T1", "P1-G2-T2", "P1-G3-T1", "P1-G3-T2"]
              constraints:
                - "The Target rule that ties which connection Fields are required to the selected Trading Platform depends on data outside an Instance, so the definition does not evaluate it; the rule is preserved as stated Target meaning in the Component's documentation."
              agent_consider: *pydantic_consider
              agent_avoid: *pydantic_avoid
              agent_overridden: []
              agent_skills: *pydantic_skills
              acceptance: "Reading the Instance declaration shows each Target Field with its stated properties, both relationships carried as the referenced definitions with cardinality and optionality stated, the composite uniqueness of user and name declared, persistence declared persistent, and the credential classification and treatment on password and api_key. Valid data builds an Instance; data missing a required Field is rejected; the Plain Representation round-trips with related definitions appearing only as reference values. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Through the Public Interface, reading the declaration, following each relationship to its referenced definition, building with valid and invalid data, and round-tripping the Plain Representation give the stated results."
              status: "done"
              log:
                - "2026-09-19T22:05:10Z Verified with transient probe (run and discarded outside the Component, expectations transcribed from the Target): Instance declaration matches Target Field by Field (names, order, logical types, optionality, defaults, uniqueness, credentials, persistent, activation on is_active; user and trading-platform relationships carried as the definitions, composite (user_id,name), credentials classified encrypted); valid data builds; each required Field rejected when missing, null, or of the wrong kind; unknown key rejected; Plain Representation JSON-encodes without a custom encoder, keeps every Field, and round-trips equal. ruff and pyright clean. Modelling choices recorded in the definition module."
