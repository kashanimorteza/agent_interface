              description: Define the User Model exactly as specified in the current project definition, including its complete
                field set, domain rules, and initial data.
              reason: Every other user-owned Model in the domain references a User through its own ownership relationship,
                so User must be defined before them.
              kind: code
              inputs:
              - Model package boundary
              expected_result: The User Model is available through the package's public interface with the complete definition
                the current project definition specifies for it.
              depends_on:
              - P1-T1
              constraints: []
              acceptance: A consumer importing the package can reference the User Model and observe that its fields, rules,
                and initial data match the current project definition.
              verify: Importing the package's public interface exposes a User Model whose fields, rules, and initial data
                are consistent with the current project definition.
              status: done
              log:
              - at: '2026-09-10T21:43:52Z'
                event: Implemented and verified.
                check: Imported the package's public interface, instantiated User, and asserted its fields, credential rule,
                  and initial data matched the current project definition.
