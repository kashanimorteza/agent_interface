              agent_overridden: []
              agent_skills:
              - resource: pydantic
                requirement: required
                resolved: true
                identifier: pydantic:pydantic
              acceptance: Conversion out returns simple named values rather than encoded text, so a consumer can carry them in any wire format it chooses; it includes every Field and never nests a related definition — a relationship appears only as its declared reference value; conversion in applies the same Intrinsic Rules as construction and fails when they are not satisfied; both are deterministic, data-only, and free of external I/O. Every statement in agent_consider is observably followed, no statement in agent_avoid appears, and the applicable guidance of the required pydantic Skill is followed.
