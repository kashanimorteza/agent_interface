task_count: 16
plans:
  P1:
    id: P1
    title: Model
    order: 1
    revision: 2
    target: Model
    does: Establish the independent Model layer as one reusable package exposing every domain concept
      defined by the Target through a stable Public Interface, built on one shared Model Foundation.
    constraints:
    - Every Domain Definition in this phase is persistent and its Model realization declares that classification
      through Model's Public Interface.
    - Every Domain Definition publishes its storage-relevant metadata — primary-key identity, generated
      identity, foreign-key references, relationship cardinality, nullability, defaults, and single-field
      or composite uniqueness sets — as technology-independent Model output; Model never itself rejects
      a record for duplicating data already held by another stored record, since that comparison requires
      data outside the record being validated, and enforcement of that comparison belongs to Database.
    task_count: 16
    groups:
      P1G1:
        id: P1G1
        title: Model Foundation
        description: Covers the one shared Model Foundation every Domain Definition in this phase realizes
          on.
        area: Shared Model realization mechanisms
        does: The Model Foundation exists and is ready for every Domain Definition in this phase to build
          on.
        constraints: []
        task_count: 1
        tasks:
          P1T1:
            id: P1T1
            title: Build the shared Model Foundation
            description: Establish the shared Model Foundation that gives every concrete Domain Definition
              common validation, serialization, and metadata-publishing mechanisms, without owning or
              injecting any Field or Domain Relationship.
            reason: Every Domain Definition must gain identical baseline mechanisms so that later Domain
              Definitions do not each reinvent core Model behavior.
            kind: code
            inputs: []
            expected_result: A reusable foundation exists that any Domain Definition can build on to gain
              consistent validation, serialization, and metadata publication.
            depends_on: []
            constraints: []
            acceptance: Two unrelated Domain Definitions realized through the Foundation both expose the
              same baseline validation, serialization, and metadata-publication behavior while declaring
              completely independent Fields and relationships.
            verify: Building two Domain Definitions with different Fields on the Foundation and exercising
              their validation, serialization, and metadata output confirms consistent baseline behavior
              with no Field, default, or relationship inherited from the Foundation itself.
            status: done
            log:
            - at: '2026-09-15T01:30:22Z'
              event: implemented and verified
              check: Ran uv run pytest tests/test_foundation.py (model project root) exercising required-field
                rejection, valid construction, serialization round-trip, and published persistence metadata
                for every acceptance clause.
              outcome: passed
      P1G2:
        id: P1G2
        title: Identity
        description: Covers the User Domain Definition, the identity every other user-owned concept in
          this phase references.
        area: User identity
        does: User is fully defined and available as the identity every other Domain Definition in this
          phase depends on.
        constraints: []
        task_count: 1
        tasks:
          P1T2:
            id: P1T2
            title: Define the User Domain Definition
            description: Define the User Domain Definition as the authoritative representation of an independent
              system user, preserving every field, uniqueness rule, and credential classification the
              Target declares for it.
            reason: User is the root identity every other user-owned Domain Definition and Domain Relationship
              in this phase depends on.
            kind: code
            inputs:
            - Shared Model Foundation mechanisms
            expected_result: User is available through Model's Public Interface with its complete declared
              field set, its name and username published as declared single-field unique constraints,
              and its password and API key preserved as classified credentials with their required at-rest
              treatment.
            depends_on:
            - P1T1
            constraints: []
            acceptance: A User can be constructed with a complete valid set of declared fields and is
              rejected only when a required field is missing or of the wrong type; its published metadata
              declares name and username as unique constraints and its credential fields carry their declared
              classification and required treatment.
            verify: Constructing User with each required field individually omitted is rejected; a fully
              valid User round-trips through serialization preserving every declared field, and its published
              metadata declares name and username as unique constraints and identifies password and api_key
              as classified credentials with their declared treatment, with no comparison performed against
              other stored User records.
            status: done
            log:
            - at: '2026-09-15T01:30:22Z'
              event: implemented and verified
              check: Ran uv run pytest tests/test_user.py (model project root) exercising required-field
                rejection, valid construction, serialization round-trip, and published persistence metadata
                for every acceptance clause.
              outcome: passed
      P1G3:
        id: P1G3
        title: Trading Platform Connectivity
        description: Covers the Trading Platform and Instance Domain Definitions that let the system reach
          a supported trading platform.
        area: Trading platform connectivity
        does: Trading Platform and Instance are fully defined, giving the domain its platform and connection
          concepts.
        constraints: []
        task_count: 2
