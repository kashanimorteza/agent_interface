              - at: '2026-09-20T08:15:17Z'
                by: developing
                event: re-verified under Plan revision 2
                check: 'Re-observed against the revision-2 wording: for all 15 definitions the serialized output holds only simple values (int/str/bool/float/None), includes every Field, nests nothing, and round-trips to an equal instance; Intrinsic-Rule violations refused on conversion in.'
            P1-G2-T3:
              id: P1-G2-T3
              title: Provide the Field terms of the Declaration Vocabulary
