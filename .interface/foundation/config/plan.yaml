meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 22
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 3
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules, published through one explicit Public Interface.
      constraints: []
      task_count: 22
      groups:
        P1-G1:
          id: P1-G1
          title: Library and shared Foundation
          description: The independent Model library boundary and the Model Foundation every Domain Definition shares.
          area: Model library boundary and shared Model Foundation mechanisms
          does: Model exists as an independent library whose Foundation supplies validation, the Declaration Vocabulary, and the Serialization pair to every Domain Definition.
          constraints: []
          task_count: 3
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Establish Model as an independent library package
              description: Make Model an independently installable and importable library with its own isolated environment and its own declared dependencies, resolved from its Component Profile and the language item it selects.
              reason: Every later Task needs a package boundary to be added to, and consumers may reach Model only as an installed library through its Public Interface.
              kind: configuration
              inputs:
              - Component Profile of Model
              - Selected language item and its package management
              - Selected modeling package
              expected_result: A Model library that can be installed into a clean isolated environment and imported, whose declared dependencies include no other Participating Component.
              depends_on: []
              constraints: []
              agent:
                consider: []
                avoid: []
                overridden: []
                skills: []
              acceptance: 'A consumer environment that installs only Model can import its public entry point, Model''s declared dependencies name no other Participating Component, and the resolved versions are concrete. The check is transient: it is run, its outcome is recorded in the log, and nothing it created remains in the Component.'
              verify: Observe that a fresh isolated environment containing only the Model library imports its public entry point without error, and that the library's declared dependencies name no other Participating Component.
              status: done
              log:
              - at: '2026-09-19T14:22:51Z'
                transition: todo -> claimed
                by: developing
              - at: '2026-09-19T14:22:51Z'
                transition: claimed -> done
                by: developing
                check: Created an empty isolated consumer environment outside the repository, installed only the Model library into it, imported the public entry point, and read Model's declared dependencies.
                outcome: 'Passed: import succeeded (20 public names), only pydantic 2.13.5 and its own dependencies were installed, and no other Participating Component is declared. Toolchain resolved: Python 3.14.7, uv 0.12.10, pydantic 2.13.5, ruff 0.16.8, pyright 1.1.414. Library-skill provisioning found no bundled skills.'
            P1-G1-T2:
              id: P1-G1-T2
              title: Provide the Declaration Vocabulary publishing mechanism in Model Foundation
              description: Give every Domain Definition one shared way to state and publish, through the definition itself, its logical field type, length and precision, nullability, default, primary-key and generated identity, single and composite uniqueness, relationships with referenced definition, cardinality and optionality, persistence declaration, and any credential classification with its at-rest treatment, without the Foundation ever contributing a Field or relationship.
              reason: Database and every other consumer read one declaration from the definition itself, so the mechanism must exist before any definition is written.
              kind: code
              inputs:
              - Model Principles on the Declaration Vocabulary, persistence declaration, and credential treatment
              - Model Preferences on declaration metadata
              expected_result: A shared mechanism through which any Domain Definition declares and publishes the full vocabulary, readable by a consumer from the definition, with no second schema artifact.
              depends_on:
              - P1-G1-T1
              constraints: []
              agent:
                consider:
                - 'standards.json_schema: Draft 2020-12, emitted by model_json_schema(); the same output is OpenAPI 3.1 compatible.'
                - 'standards.typing: Modern Python typing as the language entry states it — builtin generics and the union operator.'
                - 'structure.field_declaration: Declare a constrained field as Annotated[T, Field(...)]. The assignment form reads as though the field has a default when it does not.'
                - 'structure.reusable_domain_type: Define a repeated constraint once as an Annotated alias carrying AfterValidator or an annotated_types constraint, then reuse the alias instead of repeating the constraint on each field.'
                - 'structure.model_config: ConfigDict(extra=''forbid'', validate_assignment=True, validate_default=True, str_strip_whitespace=True); add frozen=True where the concept is a value rather than an entity. The default for extra is ''ignore'', which discards an unknown field silently.'
                - 'structure.single_field_rule: @field_validator'
                - 'structure.cross_field_rule: @model_validator(mode=''after'')'
                - 'structure.polymorphic_data: A discriminated union, with Field(discriminator=...)'
                - 'structure.root_collection: RootModel[...]'
                - 'structure.non_model_validation: TypeAdapter, for validating a type that is not a BaseModel'
                - 'structure.derived_value: computed_field'
                - 'structure.validator_order: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance.'
                - 'api.base_model: pydantic.BaseModel'
                - 'api.configuration: pydantic.ConfigDict'
                - 'api.field_validation: pydantic.field_validator'
                - 'api.model_validation: pydantic.model_validator'
                - 'api.root_model: pydantic.RootModel'
                - 'api.computed_field: pydantic.computed_field'
                - 'api.field_serialization: pydantic.field_serializer'
                - 'api.model_serialization: pydantic.model_serializer'
                - 'api.serialization: model_dump, model_dump_json'
                - 'api.schema: model_json_schema'
                avoid:
                - 'legacy_apis: validator, root_validator, parse_obj, dict, json'
                - 'deprecated_constraint_helpers: constr, conint, confloat, condecimal — scheduled for removal in Pydantic 3; express the same constraint with Annotated instead.'
                - 'plain_validator: PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.'
                overridden:
                - 'api.serialization: model_dump_json — overridden by Model Principle "Every Domain Definition converts to and from a Plain Representation", which requires serialize to return simple named values and never an encoded text form.'
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: A definition that uses the mechanism publishes every vocabulary property it declares and only those; the Foundation adds no Field or relationship to it; the persistence declaration and credential classification are readable from the published declaration; and no property is inferred from a Field name. The result also conforms observably to every statement in agent.consider, contains none of the statements in agent.avoid, and follows the applicable guidance of the required pydantic Skill.
              verify: Observe, on a definition exercised only by a transient check, that the declaration a consumer reads through the Public Interface lists exactly the declared types, sizes, nullability, defaults, identity, uniqueness sets, relationships, persistence declaration, and credential treatment, and that a definition declaring none of them publishes none.
              status: done
              log:
              - at: '2026-09-19T14:22:51Z'
                transition: todo -> claimed
                by: developing
              - at: '2026-09-19T14:22:51Z'
                transition: claimed -> done
                by: developing
                check: 'Transient check on the 15 real definitions: declarations compared with the Target; a definition missing persistence or a vocabulary entry, or naming an unknown unique-set field, is refused at class creation.'
                outcome: 'Passed: every declared property published and nothing beyond it; Foundation adds no Field; persistence and credential treatment readable; generated identity published as non-nullable; an omitted nullable Field is not published as a Target default. Completion gate from a fresh environment (environment removed and re-synced from the lockfile): ruff check and format check passed, pyright 0 errors, transient behaviour check and README check passed.'
            P1-G1-T3:
              id: P1-G1-T3
              title: Provide the Serialization pair in Model Foundation
              description: 'Give every Domain Definition the two symmetric capabilities serialize and deserialize once through the Foundation: serialize yields the Plain Representation of an instance as simple named values, and deserialize yields an instance from a Plain Representation, applying the same Intrinsic Rules as any other construction and failing when they are not satisfied.'
              reason: Every Domain Definition must convert out of and back into its boundary through one shared, validated mechanism rather than one rebuilt by each consumer.
              kind: code
              inputs:
              - Model Principles on Serialization
              - Model Preferences on Serialization
              - Declaration Vocabulary mechanism
              expected_result: 'One pair of conversions available on every Domain Definition without being redeclared: an instance to a JSON-compatible plain structure of its own Fields, and a plain structure back to a validated instance.'
