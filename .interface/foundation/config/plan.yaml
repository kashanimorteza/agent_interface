    P2:
      id: "P2"
      title: "Database"
      order: 2
      revision: 1
      target: "Database"
      does: "Persist the complete Model through one generic Database Interface: a traceable storage mapping for every Domain Definition, an Instance Registry over a selectable Engine, an ordered and recoverable Migration history, an explicit Transaction boundary, the resolved credential at-rest treatment for every credential Field, the cross-record uniqueness and referential-existence constraints Model left to storage, and repeatable dependency-ordered seeding of every Target-declared Initial Data record."
      constraints:
        - "Enforces only the cross-record rules that are genuinely storage-relevant (uniqueness, referenced-record existence, resolved field properties); an operation-dependent or cross-record business rule that requires external context beyond the referenced records' own stored data (such as a conditionally required field or a cross-Model duplication rule) is not enforced here."
      task_count: 21
      groups:
        P2-foundation:
          id: "P2-foundation"
          title: "Storage Foundation"
          description: "The shared internal foundation every persistence mapping in this Plan depends on: the Engine connection and Instance Registry, the Migration mechanism, and the Transaction boundary."
          area: "Cross-mapping storage infrastructure"
          does: "A reusable Storage Adapter, Instance Registry, Migration mechanism, and Transaction boundary exist for every Domain Definition mapping in this Plan to build on."
          constraints: []
          task_count: 3
          tasks:
            P2-storage-adapter:
              id: "P2-storage-adapter"
              title: "Establish the Storage Adapter and Instance Registry"
              description: "Establish the Storage Adapter that owns the connection to the selected Engine, and publish an Instance Registry through the Database Interface that exposes every configured Instance's selectable identity, name, and purpose together with exactly one default, without exposing raw connections or secret values."
              reason: "Every persistence mapping and the generic Database Interface need one shared, already-selectable Instance to operate against before any Domain Definition can be mapped."
              kind: "code"
              inputs: ["The Database Component's applicable Principles and Preferences", "The selected Platform Environment's delivered runtime Bindings"]
              expected_result: "A Storage Adapter connected to the selected Engine, and a published Instance Registry exposing selectable Instance identities and exactly one default."
              depends_on: []
              constraints: []
              acceptance: "Consumers can discover every configured Instance identity and the default through the Registry without receiving a connection or secret value; selecting an unknown explicit Instance is rejected; omitting a selection uses the default."
              verify: "The Registry lists the configured Instances and their default; a data operation against the default Instance succeeds when no Instance is specified; an explicit unknown Instance is rejected; no Registry entry exposes a connection object or secret value."
              status: "todo"
            P2-migrations:
              id: "P2-migrations"
              title: "Establish the Migration mechanism"
              description: "Establish the ordered, recorded Migration mechanism that is the only path by which storage structure changes, with a tested reversal when semantically safe and an explicit recovery path when a Migration is irreversible."
              reason: "Storage structure for every Domain Definition mapping in this Plan must be created and evolved only through a reproducible, recorded history rather than ad-hoc structural change."
              kind: "code"
              inputs: ["The Database Component's applicable Principles and Preferences", "The Storage Adapter"]
              expected_result: "A recorded, ordered Migration history that can recreate the complete current storage structure from an empty Instance, with reversal or recovery for every Migration."
              depends_on: ["P2-storage-adapter"]
              constraints: []
              acceptance: "Applying the complete recorded Migration history to a fresh Instance reproduces the current storage structure; a safe Migration reverses cleanly; drift between the recorded and running structure is detected before normal operations proceed."
              verify: "A fresh Instance brought up through the recorded Migration history matches the current storage structure; running the reversal of a safe Migration restores the prior structure; an introduced structural difference is detected as drift."
              status: "todo"
            P2-transactions:
              id: "P2-transactions"
              title: "Establish the Transaction boundary"
              description: "Establish the explicit Transaction boundary through the Database Interface so a consumer can group related data operations on one Instance into one atomic unit, with commit, rollback, isolation, conflict handling, and retry owned by Database without exposing the underlying connection."
              reason: "Related changes made through the mappings and Interface built in this Plan must not leave partially applied data when part of a related group fails."
              kind: "code"
              inputs: ["The Database Component's applicable Principles and Preferences", "The Storage Adapter"]
              expected_result: "A Transaction boundary through which a consumer commits or rolls back a group of related operations together, and under which a standalone write remains its own atomic unit."
              depends_on: ["P2-storage-adapter"]
              constraints: []
              acceptance: "A group of related operations performed inside one Transaction either all commit or all roll back together; a failure partway through leaves no partial result; a standalone write outside an explicit Transaction remains atomic on its own."
              verify: "Forcing a failure partway through a multi-operation Transaction leaves the Instance showing none of that Transaction's changes; a successful Transaction shows all of them; a standalone write not wrapped in a Transaction still succeeds or fails as one atomic unit."
              status: "todo"
        P2-mapping:
          id: "P2-mapping"
          title: "Persistence Mapping"
          description: "The traceable storage mapping of every Domain Definition Model publishes, preserving its fields, relationship cardinality and optionality, Target-declared uniqueness constraints, referenced-record existence, and the resolved credential at-rest treatment already declared through Model's own published credential-storage meaning, without redefining any of that meaning."
          area: "Domain Definition storage mapping"
          does: "Every one of the 15 Domain Definitions Model publishes has a traceable, constraint-enforcing storage mapping reachable only through the Database Interface."
          constraints:
            - "A relationship mapping enforces referential existence against its related mapped Domain Definition; it never becomes reachable, satisfiable, or persistable before every Domain Definition it relates to is itself mapped."
            - "A credential Field's at-rest treatment is read from the resolved Domain Definition's own declared credential-storage meaning, never re-decided independently by the mapping."
          task_count: 15
          tasks:
            P2-map-user:
              id: "P2-map-user"
              title: "Map the User Domain Definition to storage"
              description: "Map the User Domain Definition to a traceable storage structure preserving its fields and the globally unique constraint on its name, and apply the resolved at-rest treatment to its password and api_key credential Fields."
              reason: "User is the independent identity every other user-scoped mapping in this Plan relates to, so it must be mapped before those relationships can be enforced in storage."
              kind: "code"
              inputs: ["The User Domain Definition published by Model", "The Storage Adapter"]
              expected_result: "A storage-mapped User reachable only through the Database Interface, with its name uniqueness enforced and its credential Fields stored under their resolved at-rest treatment."
              depends_on: ["P2-storage-adapter"]
              constraints: []
              acceptance: "Persisting a User with valid data round-trips through the Database Interface unchanged in domain meaning; persisting a second User with a duplicate name is rejected; the stored password and api_key values are not recoverable in their original form when their resolved treatment is one-way."
              verify: "A persisted User is retrievable through the Database Interface with the same field values it was given; a duplicate-name persist attempt is rejected; inspecting the raw stored credential values shows they are not the plaintext originals."
              status: "todo"
            P2-map-trading-platform:
