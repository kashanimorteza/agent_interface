              title: Apply the resolved at-rest transformation to every credential field
              description: Resolve, for every Model field declared as a credential, its at-rest persistence
                transformation and apply it within the persistence mapping so that the field's stored
                representation reflects that transformation.
              reason: A credential must never be stored in a form that exposes its usable value, so its
