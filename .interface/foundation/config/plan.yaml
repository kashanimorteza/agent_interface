meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
read_order:
  - "task_count"
  - "plans"
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."
content:
  task_count: 17
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 2
      target: "Model"
      does: "Implement the independent Model layer as one reusable package expressing every domain concept, field, relationship, rule, and credential meaning the Target declares."
      constraints:
        - "Every Domain Definition's acceptance additionally requires demonstrating serialization and schema-generation behavior through the Foundation's shared mechanism, per Model Preferences' declared verification checks (public interface, validation behavior, serialization and schema generation)."
      task_count: 17
      groups:
        P1.G1:
          id: "P1.G1"
          title: "Model Foundation"
          description: "The shared technology-independent foundation every Domain Definition builds on for validation, serialization, and metadata publishing."
          area: "Model Foundation"
          does: "Every Domain Definition can obtain shared validation, serialization, and metadata-publishing mechanisms without inheriting Fields or relationships from the Foundation."
          constraints: []
          task_count: 1
          tasks:
            P1.G1.T1:
              id: "P1.G1.T1"
              title: "Establish the shared Model Foundation"
              description: "Provide the technology-independent common foundation through which every concrete Domain Definition receives shared validation, serialization, and metadata-publishing mechanisms, without the Foundation owning, injecting, or requiring any Field or Domain Relationship."
              reason: "Model Principles require every concrete Model realization to receive applicable shared mechanisms through one Model Foundation so cross-Model behavior stays consistent without imposing domain meaning on any Domain Definition."
              kind: "code"
              inputs: ["Model Principles' Model Foundation requirement", "the resolved Model technical profile"]
              expected_result: "A shared foundation exists that every later Domain Definition can build on for validation, serialization, and metadata publishing, and the Foundation itself declares no Field or relationship."
              depends_on: []
              constraints: []
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "A Domain Definition built on the Foundation can obtain validation, serialization, and metadata-publishing behavior without redeclaring it, the Foundation declares no Field or relationship of its own, and its use demonstrates observable conformance with the associated modeling Skill's applicable guidance."
              verify: "A representative Domain Definition built on the Foundation deterministically validates its own data, serializes itself, and publishes its declared vocabulary through the Foundation's shared mechanism, without the Foundation contributing a Field or relationship."
              status: "done"
              log:
                - at: "2026-09-18T17:16:27Z"
                  by: "developing"
                  transition: "done"
                  check: "Ran a transient check (uv run python -c ...): built a representative Domain Definition on DomainModel with a primary-key field and a unique field; construction with valid data succeeded, wrong-type and missing-required-field data were deterministically rejected (ValidationError), declaration() published the field vocabulary, and model_dump_json() serialized correctly. DomainModel.model_fields == {} confirmed the Foundation declares no Field of its own. No artifact left in the component."
                  outcome: "passed"
        P1.G2:
          id: "P1.G2"
          title: "Identity"
          description: "The independent user of the system."
          area: "Identity"
          does: "The User Domain Definition exists as the shared identity every user-owned Domain Definition references."
          constraints: []
          task_count: 1
          tasks:
            P1.G2.T1:
              id: "P1.G2.T1"
              title: "Define the User Domain Definition"
              description: "Express the User domain concept as one authoritative Domain Definition in Model's standard vocabulary, preserving every field, constraint, and credential meaning the Target declares for it, and declaring whether it is persistent."
              reason: "User is a distinct domain concept required by the Target, and every other user-owned Domain Definition depends on its authoritative identity meaning."
              kind: "code"
              inputs: ["Target's User definition", "the Model Foundation"]
              expected_result: "One authoritative User Domain Definition publishes its complete declared vocabulary, including credential classification and required at-rest treatment for its credential fields, through Model's Public Interface, exactly matching the Target's declaration."
              depends_on: ["P1.G1.T1"]
              constraints: []
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The Public Interface exposes exactly one User Domain Definition whose declared vocabulary (fields, nullability, uniqueness, defaults, generated identity, and credential treatment) matches the Target's User definition, with no invented or missing property."
              verify: "Constructing a User instance with data satisfying the Target's declared constraints succeeds deterministically; data violating a declared constraint is observably rejected; the declared vocabulary is inspectable through the Public Interface and matches the Target definition."
              status: "done"
              log:
                - at: "2026-09-18T17:16:27Z"
                  by: "developing"
                  transition: "done"
                  check: "Transient check: constructed User with valid data (including hash-treatment credential fields password/api_key); rejected a wrong-typed is_active; confirmed declaration() publishes password/api_key credential classification+treatment as {classification: credential, treatment: hash}; confirmed the omitted-with-no-Target-default description field defaults to None; verified model_dump_json() serializes correctly. Exposed via the model package Public Interface (model.User)."
                  outcome: "passed"
                - at: "2026-09-18T17:28:33Z"
                  by: "developing"
                  transition: "reconciled (Plan revision 2, serialization/schema-generation constraint)"
                  check: "Transient check: model_dump(), model_dump_json(), and declaration() all run successfully on a constructed User instance, satisfying the Plan-level serialization/schema-generation constraint added in Plan revision 2."
                  outcome: "passed"
