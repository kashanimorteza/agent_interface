meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 18
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 1
      target: Model
      does: Implement the independent Model layer and its reusable package realizing every Domain Definition,
        relationship, rule, and persistence-relevant constraint declared by the Target, on one shared
        Model Foundation with an explicit Public Interface.
      constraints: []
      task_count: 18
      groups:
        G1:
          id: P1-G1
          title: Model Foundation
          description: Establishes the technology-independent shared mechanisms every concrete Domain
            Definition receives, without imposing Fields or relationships.
          area: shared Model foundation
          does: A reusable Model Foundation exists and is ready for every Domain Definition to build on.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Establish the Model Foundation
              description: Provide the technology-independent common foundation that gives every concrete
                Domain Definition shared validation, serialization, and metadata-publishing mechanisms,
                without the Foundation owning, injecting, or requiring any Field or Domain Relationship
                itself.
              reason: Every concrete Domain Definition in this phase must receive consistent shared mechanisms
                from one place instead of reimplementing them independently, per Model Principle 4.
              kind: code
              inputs: []
              expected_result: A reusable Model Foundation mechanism that every Domain Definition in this
                phase builds on for validation, serialization, and metadata publication.
              depends_on: []
              constraints: []
              acceptance: The Foundation supplies validation, serialization, and metadata-publishing mechanisms
                usable by every Domain Definition, and by itself declares no domain Field, relationship,
                or behavior.
              verify: Every Domain Definition built on the Foundation inherits its shared mechanisms consistently
                and deterministically, and the Foundation used alone exposes no domain Field or relationship.
              status: done
              log:
              - at: '2026-09-15T13:55:00Z'
                by: my-interface-developing
                event: Implemented and verified.
                check: 'Ran model/tests/test_foundation.py: DomainModel.model_fields is empty, DomainModel.__foreign_keys__
                  is empty, and DomainModel.persistence_metadata() reports no fields or foreign keys;
                  ran model/tests/test_domain_definitions.py confirming every concrete Domain Definition
                  inherits working validation, serialization, and persistence_metadata() from DomainModel.'
                outcome: passed
        G2:
          id: P1-G2
          title: Identity and Platform Reference
          description: Covers the Domain Definitions that identify system users and the supported trading
            platform standards, which every other Domain Definition in this phase ultimately depends on.
          area: identity and supported trading-platform reference data
          does: User and Trading Platform are authoritatively defined and available to every dependent
            Domain Definition.
          constraints: []
          task_count: 2
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              title: Define the User Domain Definition
              description: Define User as an authoritative Domain Definition on the Model Foundation,
                preserving every field, relationship, Intrinsic Rule, credential classification, and storage-relevant
                constraint the Target declares for it, and publishing its persistence-relevant metadata
                (identity, uniqueness, nullability, defaults, foreign keys, cardinality, composite constraints)
                for Database consumption without inventing or omitting anything the Target states.
              reason: The Target declares this concept as one meaningful domain entity, and Model Principle
                1 requires it to have exactly one authoritative Domain Definition with preserved Target
                meaning and published persistence metadata.
              kind: code
              inputs:
              - completed Model Foundation
              expected_result: A public User Domain Definition exposing its declared fields, relationships,
                and Intrinsic Rules with correct presence semantics and technology-independent persistence
                metadata.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The User Domain Definition publicly exposes exactly the fields, relationships,
                and Intrinsic Rules the Target declares for it, with correct required, nullable, default,
                and generated semantics, correct credential treatment where applicable, and persistence-relevant
                metadata matching the Target's declared meaning.
              verify: Instantiating User with valid data succeeds and preserves every declared field and
                relationship value; instantiating it with data violating a declared Intrinsic Rule or
                a required field is rejected; its declared credential fields carry the Target's required
                at-rest treatment classification; and it serializes to and validates from its published
                schema without data loss.
              status: done
              log:
              - at: '2026-09-15T13:55:00Z'
                by: my-interface-developing
                event: Implemented and verified.
                check: 'Ran the pytest suite in model/tests/test_domain_definitions.py: constructing the
                  Domain Definition with valid data round-trips through model_dump/model_validate and
                  model_dump_json/model_validate_json without data loss, generates a JSON Schema covering
                  every field, rejects construction missing a required field and construction with an
                  undeclared field, and its persistence_metadata() reports the correct primary key, auto-increment,
                  uniqueness, composite uniqueness, foreign keys, and credential treatment.'
                outcome: passed
