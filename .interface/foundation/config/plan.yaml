                - "correction — Review Finding P1-F1 (major, Foundation-level): id is now a required, non-nullable int Field (see P1-model-foundation log) instead of accepting an explicit id=None. Updated tests/test_instance.py accordingly: id added to REQUIRED/NON_NULLABLE and the _valid() fixture; the obsolete assert_id_generated_not_supplied-based test removed since the generic required/non-nullable checks now cover id like any other Field. Re-verified: pytest, ruff check, ruff format --check, and pyright all clean."
