# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."


# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 15
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 1
      target: "model"
      does: "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, rules, and initial data."
      constraints: []
      task_count: 15
      groups:

        P1-G1:
          id: "P1-G1"
          title: "Identity and Reference Data"
          description: "The independent domain identities every later Domain Definition in this phase references: the system's users and the reference concepts owned directly by a user."
          area: "Core domain identity and reference definitions"
          does: "User, Trading Platform, Currency, and Broker exist as authoritative Domain Definitions, each preserving its declared fields, relationships, rules, and credential classification."
          constraints: []
          task_count: 4
          tasks:

            P1-T1:
              id: "P1-T1"
              title: "Realize the User Domain Definition"
              description: "Realize User as an authoritative Domain Definition in Model, preserving every field and declared rule from Target exactly, expressed in Model's standard technology-independent vocabulary, and expose it through the Model Public Interface."
              reason: "User is the multi-user identity every other Domain Definition in this phase ultimately traces ownership to through a Domain Relationship, and every other Component reads it through the Model Public Interface."
              kind: "code"
              inputs: []
              expected_result: "The User Domain Definition publishes its declared fields (identity, name, username, password, api_key, is_active, description) with their declared types, nullability, uniqueness, auto-increment, primary key, and default metadata, declares itself persistent, and preserves the Target-declared credential classification and required at-rest treatment for password and api_key without applying that treatment itself."
              depends_on: []
              constraints: []
              agent_skills:
                - resource: "pydantic"
                  requirement: "required"
                  resolved: true
                  identifier: "pydantic:pydantic"
              acceptance: "The realized Domain Definition preserves every declared field, its type, nullability, uniqueness, default, and identity metadata, and its credential classifications exactly as Target declares them for User, exposed through Model's Public Interface, and observably conforms to the applicable Pydantic guidance for the selected modeling package."
              verify: "Instantiate the realized Domain Definition with valid representative field values and confirm the Public Interface publishes the declared fields, persistent classification, and credential treatment; confirm a value violating a declared constraint (missing required field, wrong type, duplicate-intended unique field) is rejected; confirm serialization and schema generation succeed."
              status: "done"
              log:
                - at: "2026-09-18T09:23:38Z"
                  by: "developing"
                  event: "Realized User in model/src/model/domain/user.py, exposed through model/src/model/__init__.py."
                  check: "Transient check (not persisted, Model is not on the testing applicability list): instantiated User with valid values; confirmed domain_fields() reports id as primary_key/auto_increment/not-nullable and password/api_key as credential=hash; confirmed a missing required field raises ValidationError and an unknown field is rejected (extra=forbid); confirmed model_dump() and model_json_schema() succeed. Also ran ruff check, ruff format --check, and pyright across the Component: all clean."
