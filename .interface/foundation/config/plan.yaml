meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
task_count: 54
plans:
  P1:
    id: "P1"
    title: "Model"
    order: 1
    revision: 1
    target: "Model"
    does: "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, rules, and initial data."
    constraints: []
    task_count: 17
    groups:
      P1-G-foundation:
        id: "P1-G-foundation"
        title: "Package Foundation"
        description: "Establishes the independent Model package as one installable unit with its shared base representation and public import interface, so every domain model built afterward has a consistent foundation to build on."
        area: "Model package foundation and public interface"
        does: "A ready, importable Model package exists with an isolated environment, a shared base representation for concrete models, and an empty but documented public interface surface."
        constraints: []
        task_count: 1
        tasks:
          P1-T-foundation:
            id: "P1-T-foundation"
            title: "Establish the Model package foundation"
            description: "Create the independent Model package as one isolated, installable unit. Provide the shared base representation every concrete domain model will inherit, and establish the package's public import interface surface, ready to expose domain modules as they are added."
            reason: "Every subsequent domain model needs a consistent package boundary, isolated environment, and shared base representation to inherit from; building this first avoids rework across every later Task."
            kind: "code"
            inputs: ["Model Standard", "Model Preferences"]
            expected_result: "An independent, installable Model package exists with its own isolated environment, a shared base representation available for concrete models to inherit, and a public interface surface that can expose domain modules."
            depends_on: []
            constraints: []
            acceptance: "The package installs cleanly in its own isolated environment and can be imported by its resolved public namespace without error."
            verify: "The package's public namespace imports successfully in a clean isolated environment and exposes no domain modules yet, since none have been added."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Established the my_model package (uv-managed, Python 3.13, Pydantic 2.x) with a shared base representation and public interface module."
                check: "uv sync installs cleanly into an isolated environment; `import my_model` succeeds; ruff and pyright report zero issues."
                outcome: "passed"
      P1-G-core-reference:
        id: "P1-G-core-reference"
        title: "Core Reference Entities"
        description: "Covers the foundational domain entities that other entities reference but which do not themselves depend on any other Model in this phase: the system user, the supported trading-platform standards, currencies, and brokers."
        area: "Model: core reference entities"
        does: "The User, Trading Platform, Currency, and Broker domain entities exist as validated, documented Models with their declared fields, rules, and initial data."
        constraints: []
        task_count: 4
        tasks:
          P1-T-user:
            id: "P1-T-user"
            title: "Define the User model"
            description: "Define the domain entity representing an independent user of the system, enabling multi-user operation with separate, distinct settings per user, carrying its declared identity, credential, and status fields and rules."
            reason: "Nearly every other domain entity in this phase is owned by or scoped to a user, so the User entity must exist and be correct before those relationships can be expressed."
            kind: "code"
            inputs: ["Target Model definition: User", "Model Standard", "Model Preferences"]
            expected_result: "A validated User domain model exists exposing its declared identity, credential, and status fields, enforcing that its credential fields are treated as sensitive, and declaring its one required initial record."
            depends_on: ["P1-T-foundation"]
            constraints: []
            acceptance: "A User instance can be constructed only when its required fields are satisfied, its credential fields are recognized as sensitive, its uniqueness rule holds, and its one declared initial record is represented."
            verify: "Constructing a User with valid data succeeds and preserves declared sensitive-field meaning; constructing one with a missing required field or a duplicate unique value is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented User with credential-marked password/api_key, name uniqueness declared via UNIQUE_TOGETHER, and the declared initial Admin record (credentials as GENERATE_SECURELY, never a fabricated literal)."
                check: "pytest: valid construction, missing-field rejection, unknown-field rejection, credential schema metadata, repr exclusion, uniqueness declaration, initial-data content, serialization round-trip — all passed. Cross-record duplicate rejection is Database's responsibility per Model Standard's validation-ownership rule (Model owns only the traceable UNIQUE_TOGETHER declaration and a pure comparator in my_model._unique, both of which are tested)."
                outcome: "passed"
          P1-T-trading-platform:
            id: "P1-T-trading-platform"
            title: "Define the Trading Platform model"
            description: "Define the domain entity representing a supported trading API standard, identifying the implementation each platform code maps to, independent of any specific exchange or broker, carrying its declared fields, status, and initial data."
            reason: "Instances and Positions both identify which trading platform standard they use, so this entity must exist first and correctly represent the supported platform set."
            kind: "code"
            inputs: ["Target Model definition: Trading Platform", "Model Standard", "Model Preferences"]
            expected_result: "A validated Trading Platform domain model exists exposing its declared fields and status, with its two declared initial records represented."
            depends_on: ["P1-T-foundation"]
            constraints: []
            acceptance: "A Trading Platform instance can be constructed only when its required fields are satisfied, and both declared initial records are represented."
            verify: "Constructing a Trading Platform with valid data succeeds; constructing one with a missing required field is rejected; both declared initial records are present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented TradingPlatform with its declared fields and both required initial records (MetaTrader 5, Binance)."
                check: "pytest: valid construction, missing-field rejection, both initial records constructible — all passed."
                outcome: "passed"
          P1-T-currency:
            id: "P1-T-currency"
            title: "Define the Currency model"
            description: "Define the domain entity representing a currency usable by the trading system, carrying its standard code, display symbol, associated country or region, monetary decimal precision, status, and declared uniqueness rule and initial data."
            reason: "Account balances and other monetary values reference a base currency, so the Currency entity must exist and be correct first."
            kind: "code"
            inputs: ["Target Model definition: Currency", "Model Standard", "Model Preferences"]
            expected_result: "A validated Currency domain model exists exposing its declared fields, enforcing the declared per-user code uniqueness rule, with its eight declared initial records represented."
            depends_on: ["P1-T-user", "P1-T-foundation"]
            constraints: []
            acceptance: "A Currency instance can be constructed only when its required fields are satisfied and the combination of its owning user and code remains unique; all eight declared initial records are represented."
            verify: "Constructing a Currency with valid data succeeds; constructing a duplicate owning-user-and-code combination is rejected; all eight declared initial records are present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Currency with a fixed-length code field, user+code uniqueness declared via UNIQUE_TOGETHER, and all eight declared initial currency records."
                check: "pytest: valid construction, code-length rejection, missing-field rejection, uniqueness declaration, all eight initial records constructible — all passed. Persisted-duplicate rejection belongs to Database (Model Standard validation ownership); Model's traceable declaration and pure comparator are verified instead."
                outcome: "passed"
          P1-T-broker:
            id: "P1-T-broker"
            title: "Define the Broker model"
            description: "Define the domain entity representing a broker supported by the system, identifying the user who owns its configuration without coupling the Broker to one Trading Platform, carrying its declared fields, uniqueness rule, and initial data."
            reason: "Assets and Accounts are both provided by or owned through a Broker, so this entity must exist and be correct first."
            kind: "code"
            inputs: ["Target Model definition: Broker", "Model Standard", "Model Preferences"]
            expected_result: "A validated Broker domain model exists exposing its declared fields, enforcing the declared per-user name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-user", "P1-T-foundation"]
            constraints: []
            acceptance: "A Broker instance can be constructed only when its required fields are satisfied and the combination of its owning user and name remains unique; the declared initial record is represented."
            verify: "Constructing a Broker with valid data succeeds; constructing a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Broker with user+name uniqueness declared via UNIQUE_TOGETHER and the declared initial FxPro record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
      P1-G-connectivity-assets:
        id: "P1-G-connectivity-assets"
        title: "Connectivity and Tradable Assets"
        description: "Covers the entities that depend on the core reference entities: a user's connection instance to a trading platform, and the tradable assets a broker provides."
        area: "Model: platform connectivity and tradable assets"
        does: "The Instance and Asset domain entities exist as validated, documented Models with their declared fields, relationships, and rules."
        constraints: []
        task_count: 2
        tasks:
          P1-T-instance:
            id: "P1-T-instance"
            title: "Define the Instance model"
            description: "Define the domain entity representing a user-owned connection instance through which the system accesses a supported Trading Platform, carrying its declared connection fields, credential-storage rule, conditional-requirement rule, and uniqueness rule."
            reason: "Accounts connect to a Trading Platform through an Instance, so this entity must exist and correctly express its ownership and platform relationship first."
            kind: "code"
            inputs: ["Target Model definition: Instance", "User model", "Trading Platform model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Instance domain model exists belonging to one User and using one Trading Platform, exposing its declared connection fields, enforcing that its credential fields use encrypted-storage meaning and that the selected Trading Platform's required connection fields are present, with the declared initial record represented."
            depends_on: ["P1-T-user", "P1-T-trading-platform"]
            constraints: []
            acceptance: "An Instance can be constructed only when it references a valid User and Trading Platform, its owning-user-and-name combination is unique, its credential fields carry encrypted-storage meaning, and the fields required by its selected Trading Platform are present."
            verify: "Constructing an Instance with valid data and all platform-required connection fields succeeds; omitting a connection field required by the selected Trading Platform is rejected; a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Instance with encrypted-storage-marked credential fields, user+name uniqueness declared via UNIQUE_TOGETHER, a pure missing_required_connection_fields check for platform-required fields, and the declared initial record."
                check: "pytest: valid construction, missing-field rejection, encrypted-credential schema metadata, connection-field gap detection (both missing and fully-present cases), uniqueness declaration, initial record content — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-asset:
            id: "P1-T-asset"
            title: "Define the Asset model"
            description: "Define the domain entity representing an asset that can be selected for trading, identifying its providing broker, symbol, category, and price precision, carrying its declared fields, uniqueness rule, and initial data."
            reason: "Actions and Positions select a tradable asset, so this entity must exist and correctly express its provider relationship first."
            kind: "code"
            inputs: ["Target Model definition: Asset", "Broker model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Asset domain model exists belonging to one Broker, exposing its declared fields, enforcing the declared per-broker symbol uniqueness rule, with its four declared initial records represented."
            depends_on: ["P1-T-broker"]
            constraints: []
            acceptance: "An Asset can be constructed only when it references a valid Broker and the combination of its broker and symbol remains unique; all four declared initial records are represented."
            verify: "Constructing an Asset with valid data succeeds; constructing a duplicate broker-and-symbol combination is rejected; all four declared initial records are present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Asset with broker+symbol uniqueness declared via UNIQUE_TOGETHER and all four declared initial asset records."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, all four initial records constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
      P1-G-accounts:
        id: "P1-G-accounts"
        title: "Account Structures"
        description: "Covers the entities that organize and represent funded trading accounts: the account group used to organize accounts, and the funded account itself."
        area: "Model: account organization and funded accounts"
        does: "The Account Group and Account domain entities exist as validated, documented Models with their declared fields, relationships, and rules."
        constraints: []
        task_count: 2
        tasks:
          P1-T-account-group:
            id: "P1-T-account-group"
            title: "Define the Account Group model"
            description: "Define the domain entity representing an independent group for organizing trading accounts owned by one user, carrying its declared fields, uniqueness rule, and initial data."
            reason: "An Account belongs to exactly one Account Group, so this entity must exist first."
            kind: "code"
            inputs: ["Target Model definition: Account Group", "User model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Account Group domain model exists belonging to one User, exposing its declared fields, enforcing the declared per-user name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-user"]
            constraints: []
            acceptance: "An Account Group can be constructed only when it references a valid User and the combination of its owning user and name remains unique; the declared initial record is represented."
            verify: "Constructing an Account Group with valid data succeeds; constructing a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented AccountGroup with user+name uniqueness declared via UNIQUE_TOGETHER and the declared initial Default record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-account:
            id: "P1-T-account"
            title: "Define the Account model"
            description: "Define the domain entity representing a funded trading account through which the system executes trades, identifying its account group, broker, connection instance, and base currency, carrying its declared login-credential, leverage, balance, and account-type fields, its credential-storage rule, its credential-separation rule between Instance and Account, and its uniqueness rule."
            reason: "Actions and Positions execute through a specific funded Account, so this entity must exist and correctly express its relationships to Account Group, Broker, Instance, and Currency first."
            kind: "code"
            inputs: ["Target Model definition: Account", "Account Group model", "Broker model", "Instance model", "Currency model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Account domain model exists belonging to one Account Group and Broker, using one Instance and one base Currency, exposing its declared fields, enforcing that its access-credential field uses encrypted-storage meaning, that Instance and Account credentials remain distinguishable, and the declared group-broker-instance uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-account-group", "P1-T-broker", "P1-T-instance", "P1-T-currency"]
            constraints: []
            acceptance: "An Account can be constructed only when it references a valid Account Group, Broker, Instance, and base Currency, its access-credential field carries encrypted-storage meaning, its credential is distinguishable from its Instance's connection credential, and the combination of its group, broker, and instance remains unique; the declared initial record is represented."
            verify: "Constructing an Account with valid data succeeds; constructing a duplicate group-broker-instance combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Account with an encrypted-storage-marked password field kept distinct from Instance's own credentials, two declared uniqueness rules (name; group+broker+instance) via UNIQUE_TOGETHER, and the declared initial Acc-1 record."
                check: "pytest: valid construction, missing-field rejection, encrypted-credential schema metadata, both uniqueness declarations, initial record content — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declarations are verified instead."
                outcome: "passed"
      P1-G-trade-rules:
        id: "P1-G-trade-rules"
        title: "Trade Management Rule Sets"
        description: "Covers the independent rule-set groups and their individual rules used to manage an open trade automatically: trailing Stop Loss/Take Profit adjustment and partial position closing."
        area: "Model: trailing and partial-close rule sets"
        does: "The Trailing Group, Trailing Rule, Partial Group, and Partial Rule domain entities exist as validated, documented Models with their declared fields, relationships, and rules."
        constraints: []
        task_count: 4
        tasks:
          P1-T-trailing-group:
            id: "P1-T-trailing-group"
            title: "Define the Trailing Group model"
            description: "Define the domain entity representing an independent group for organizing rules that manage Stop Loss and Take Profit during a trade, carrying its declared fields, uniqueness rule, and initial data."
            reason: "Each Trailing Rule belongs to one Trailing Group, and Actions and Positions select a Trailing Group, so this entity must exist first."
            kind: "code"
            inputs: ["Target Model definition: Trailing Group", "User model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Trailing Group domain model exists belonging to one User, exposing its declared fields, enforcing the declared per-user name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-user"]
            constraints: []
            acceptance: "A Trailing Group can be constructed only when it references a valid User and the combination of its owning user and name remains unique; the declared initial record is represented."
            verify: "Constructing a Trailing Group with valid data succeeds; constructing a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented TrailingGroup with user+name uniqueness declared via UNIQUE_TOGETHER and the declared initial Default record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-trailing-rule:
            id: "P1-T-trailing-rule"
            title: "Define the Trailing Rule model"
            description: "Define the domain entity representing one individual rule within a Trailing Group that tells the system when and how to adjust Take Profit and Stop Loss, carrying its declared activation-trigger and adjustment fields and its uniqueness rule."
            reason: "A Trailing Group is only useful once it contains its individual activation rules."
            kind: "code"
            inputs: ["Target Model definition: Trailing Rule", "Trailing Group model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Trailing Rule domain model exists belonging to one Trailing Group, exposing its declared fields, enforcing the declared per-group trigger-percentage uniqueness rule."
            depends_on: ["P1-T-trailing-group"]
            constraints: []
            acceptance: "A Trailing Rule can be constructed only when it references a valid Trailing Group and the combination of its group and trigger percentage remains unique."
            verify: "Constructing a Trailing Rule with valid data succeeds; constructing a duplicate group-and-trigger-percentage combination is rejected."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented TrailingRule with group+trigger-percentage uniqueness declared via UNIQUE_TOGETHER."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-partial-group:
            id: "P1-T-partial-group"
            title: "Define the Partial Group model"
            description: "Define the domain entity representing an independent group of rules for managing partial closing of an open trade, carrying its declared fields, uniqueness rule, and initial data."
            reason: "Each Partial Rule belongs to one Partial Group, and Actions and Positions select a Partial Group, so this entity must exist first."
            kind: "code"
            inputs: ["Target Model definition: Partial Group", "User model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Partial Group domain model exists belonging to one User, exposing its declared fields, enforcing the declared per-user name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-user"]
            constraints: []
            acceptance: "A Partial Group can be constructed only when it references a valid User and the combination of its owning user and name remains unique; the declared initial record is represented."
            verify: "Constructing a Partial Group with valid data succeeds; constructing a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented PartialGroup with user+name uniqueness declared via UNIQUE_TOGETHER and the declared initial Default record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-partial-rule:
            id: "P1-T-partial-rule"
            title: "Define the Partial Rule model"
            description: "Define the domain entity representing one individual partial-close rule that tells the system under which profit condition part of an open position must be closed and how much volume to close, carrying its declared activation and close-percentage fields and its uniqueness rule."
            reason: "A Partial Group is only useful once it contains its individual activation rules."
            kind: "code"
            inputs: ["Target Model definition: Partial Rule", "Partial Group model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Partial Rule domain model exists belonging to one Partial Group, exposing its declared fields, enforcing the declared per-group profit-percentage uniqueness rule."
            depends_on: ["P1-T-partial-group"]
            constraints: []
            acceptance: "A Partial Rule can be constructed only when it references a valid Partial Group and the combination of its group and profit percentage remains unique."
            verify: "Constructing a Partial Rule with valid data succeeds; constructing a duplicate group-and-profit-percentage combination is rejected."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented PartialRule with group+profit-percentage uniqueness declared via UNIQUE_TOGETHER."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
      P1-G-actions-positions:
        id: "P1-G-actions-positions"
        title: "Actions and Positions"
        description: "Covers the entities that define how a position is opened and that record the resulting positions: the risk-organizing action group, the action that defines position parameters, and the position record itself."
        area: "Model: trading actions and position records"
        does: "The Action Group, Action, and Position domain entities exist as validated, documented Models with their declared fields, relationships, and rules."
        constraints: []
        task_count: 3
        tasks:
          P1-T-action-group:
            id: "P1-T-action-group"
            title: "Define the Action Group model"
            description: "Define the domain entity representing an independent grouping for trading actions based on their risk profile, carrying its declared fields, uniqueness rule, and initial data."
            reason: "Each Action belongs to one Action Group, and Positions reference an Action Group, so this entity must exist first."
            kind: "code"
            inputs: ["Target Model definition: Action Group", "User model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Action Group domain model exists belonging to one User, exposing its declared fields, enforcing the declared per-user name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-user"]
            constraints: []
            acceptance: "An Action Group can be constructed only when it references a valid User and the combination of its owning user and name remains unique; the declared initial record is represented."
            verify: "Constructing an Action Group with valid data succeeds; constructing a duplicate owning-user-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented ActionGroup with user+name uniqueness declared via UNIQUE_TOGETHER and the declared initial Default record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-action:
            id: "P1-T-action"
            title: "Define the Action model"
            description: "Define the domain entity representing how a position must be opened, selecting its asset, account, partial-close rule set, and trailing rule set, and carrying its declared risk-to-reward, Take Profit, and Stop Loss fields and its uniqueness rule."
            reason: "A Position is created from an Action, so this entity must exist and correctly express its relationships to Action Group, Asset, Account, Partial Group, and Trailing Group first."
            kind: "code"
            inputs: ["Target Model definition: Action", "Action Group model", "Asset model", "Account model", "Partial Group model", "Trailing Group model", "Model Standard", "Model Preferences"]
            expected_result: "A validated Action domain model exists belonging to one Action Group, using one Asset, one Account, one Partial Group, and one Trailing Group, exposing its declared fields, enforcing the declared per-group name uniqueness rule, with its one declared initial record represented."
            depends_on: ["P1-T-action-group", "P1-T-asset", "P1-T-account", "P1-T-partial-group", "P1-T-trailing-group"]
            constraints: []
            acceptance: "An Action can be constructed only when it references a valid Action Group, Asset, Account, Partial Group, and Trailing Group, and the combination of its action group and name remains unique; the declared initial record is represented."
            verify: "Constructing an Action with valid data succeeds; constructing a duplicate action-group-and-name combination is rejected; the declared initial record is present in the model's initial-data declaration."
            status: "done"
            log:
              - at: "2026-09-12T12:04:25Z"
                by: "developing"
                event: "Implemented Action with action-group+name uniqueness declared via UNIQUE_TOGETHER and the declared initial Default record."
                check: "pytest: valid construction, missing-field rejection, uniqueness declaration, initial record constructible — all passed. Persisted-duplicate rejection is Database's responsibility; Model's traceable declaration is verified instead."
                outcome: "passed"
          P1-T-position:
            id: "P1-T-position"
            title: "Define the Position model"
            description: "Define the domain entity that stores the complete information for every position created by the system, whether already opened or still pending execution, identifying its owning user, trading platform, broker, account, trailing group, partial group, action group, and originating action, and carrying its declared timing, volume, profit, execution, order-type, and Take Profit/Stop Loss fields."
            reason: "This entity is the terminal record of the domain and depends on every other entity in this phase being correctly defined first."
            kind: "code"
