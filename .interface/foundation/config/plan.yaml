meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
read_order:
  - "task_count"
  - "plans"
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."
content:
  task_count: 24
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 2
      target: model
      does: The independent Model layer is available as a reusable package that publishes every Target Domain Definition — with its Fields, relationships, and rules — through one Public Interface, together with the shared foundation, vocabulary, and conversions those definitions rely on, and documentation of that Interface.
      constraints:
      - 'This phase''s result contains no Initial Data records: the Target''s Initial Data is delivered by the Database phase, because Model never owns project records.'
      task_count: 24
      groups:
        P1-G1:
          id: P1-G1
          title: Model package boundary
          description: Makes the Model Component an independent, reusable, importable package.
          area: Package boundary and dependency environment of the Model Component
          does: Model exists as an independent package that any authorized consumer can install and import in isolation.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              title: Establish Model as an independent reusable package
              description: Make the Model Component an importable package whose dependency environment can be reproduced from scratch, whose declared modeling dependency is resolved, and which depends on no other Application Package.
              reason: Every later Task and every consumer Component needs one installable Model package to build on and to import through its Public Interface.
              kind: configuration
              inputs:
              - The Model Component Profile
              - The resolved language, package management, and modeling selections
              expected_result: A fresh isolated environment can install the Model package with its declared dependencies and import it successfully.
              depends_on: []
              constraints: []
              agent_consider:
              - 'Standards: JSON Schema Draft 2020-12, emitted by model_json_schema(); the same output is OpenAPI 3.1 compatible.'
              - 'Standards: Modern Python typing as the language entry states it — builtin generics and the union operator.'
              - 'Structure: Declare a constrained field as Annotated[T, Field(...)]. The assignment form reads as though the field has a default when it does not.'
              - 'Structure: Define a repeated constraint once as an Annotated alias carrying AfterValidator or an annotated_types constraint, then reuse the alias instead of repeating the constraint on each field.'
              - 'Structure: ConfigDict(extra=''forbid'', validate_assignment=True, validate_default=True, str_strip_whitespace=True); add frozen=True where the concept is a value rather than an entity. The default for extra is ''ignore'', which discards an unknown field silently.'
              - 'Structure: Single-field rule: @field_validator. Cross-field rule: @model_validator(mode=''after'').'
              - 'Structure: Polymorphic data: a discriminated union, with Field(discriminator=...). Root collection: RootModel[...]. Validating a type that is not a BaseModel: TypeAdapter. Derived value: computed_field.'
              - 'Structure: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance.'
              - 'API: pydantic.BaseModel, pydantic.ConfigDict, pydantic.field_validator, pydantic.model_validator, pydantic.RootModel, pydantic.computed_field, pydantic.field_serializer, pydantic.model_serializer; serialization through model_dump and model_dump_json; schema through model_json_schema.'
              agent_avoid:
              - 'Legacy APIs: validator, root_validator, parse_obj, dict, json.'
              - 'Deprecated constraint helpers, scheduled for removal in Pydantic 3 — express the same constraint with Annotated instead: constr, conint, confloat, condecimal.'
              - PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.
              agent_overridden: []
              agent_skills:
              - resource: pydantic
                requirement: required
                resolved: true
                identifier: pydantic:pydantic
              acceptance: The package installs and imports in a fresh isolated environment; its dependency set contains no other Application Package; the dependencies it resolves are recorded so the same environment can be reproduced. Every statement in agent_consider is observably followed, no statement in agent_avoid appears, and the applicable guidance of the required pydantic Skill is followed.
              verify: In a fresh isolated environment the package is installed and imported successfully; inspecting its resolved dependencies shows no other Application Package; a second fresh environment resolves the same dependencies.
              status: done
              log:
              - at: '2026-09-20T07:47:22Z'
                by: developing
                event: claimed
              - at: '2026-09-20T07:48:02Z'
                by: developing
                event: done
                check: 'Transient: built wheel and installed it in a fresh isolated Python 3.14.7 environment; import of the package succeeded; resolved requirement set was pydantic>=2,<3 only (no other Application Package); uv.lock present. Prerequisites: uv 0.12.10 present, Python 3.14.7 via uv, pydantic 2.13.5, ruff 0.16.8, pyright 1.1.414 installed; library-skills scan found no packaged skills.'
              - at: '2026-09-20T08:15:17Z'
                by: developing
                event: re-verified under Plan revision 2
                check: 'Re-observed against the revision-2 wording: fresh isolated environment installs and imports the package; only dependency is pydantic>=2,<3 (no other Application Package); a second environment synced strictly from the recorded lock resolved identical dependencies (8 packages, diff empty).'
