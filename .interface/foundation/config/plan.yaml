                entrypoint, and public interface description, to the Application Manifest, and generate
                the package README explaining its public surface, setup, use, and verification.
              reason: Consumers require one stable, documented entry point to every Domain Definition
                without depending on Model's private internal organization.
              kind: code
              inputs:
              - every completed Domain Definition
