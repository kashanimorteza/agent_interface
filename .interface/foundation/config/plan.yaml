meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 29
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 1
      target: model
      does: Implement the independent Model layer and its reusable package realizing every defined domain
        concept, field, relationship, rule, and persistence-relevant metadata, published through one explicit
        Public Interface.
      constraints: []
      task_count: 17
      groups:
        P1G1:
          id: P1G1
          title: Model Foundation
          description: The shared, technology-independent mechanisms every Domain Definition relies on.
          area: Shared Model Foundation and technology-independent conventions
          does: Every concrete Model realization has access to shared validation, serialization, precision,
            time, and persistence-metadata-publishing mechanisms without inheriting any Field or relationship.
          constraints: []
          task_count: 1
          tasks:
            P1G1T1:
              id: P1G1T1
              title: Establish the Model Foundation
              description: 'Create the technology-independent Model Foundation that every Domain Definition
                shares: deterministic Intrinsic Rule validation, serialization, exact-decimal numeric
                precision, UTC timezone-aware time handling, and a persistence-relevant metadata-publishing
                mechanism (primary key, auto-increment, uniqueness, nullability, default, index, foreign
                key, cardinality, and composite uniqueness) without the Foundation owning, injecting,
                or requiring any Field or Domain Relationship itself.'
              reason: Every Domain Definition needs identical shared mechanisms so validation, serialization,
                and persistence metadata stay consistent across the Model layer without duplicating conventions
                in each Domain Definition.
              kind: code
              inputs:
              - Model Principles
              - Model Preferences implementation conventions
              - the selected Model technical item
              expected_result: A reusable Model Foundation exists that every Domain Definition can share,
                exposing deterministic validation, serialization, numeric-precision, time, and persistence-metadata-publishing
                mechanisms with no Field or relationship of its own.
              depends_on: []
              constraints: []
              acceptance: Any concrete Domain Definition can adopt the Foundation's shared mechanisms
                without inheriting a Field, a Domain Relationship, or any domain-specific behavior.
              verify: Constructing a minimal Domain Definition using the Foundation demonstrates its validation,
                serialization, and persistence-metadata-publishing mechanisms operate correctly while
                it contributes zero Fields or relationships of its own.
              status: done
              log:
              - event: implemented and verified
                check: uv run pytest -- 22 passed; uv run ruff format/check -- clean; uv run pyright --
                  0 errors
                result: passed
                at: '2026-09-15T12:01:45Z'
        P1G2:
          id: P1G2
          title: Identity and Platform Definitions
          description: User identity and the trading-platform connection concepts that depend on it.
          area: User identity and trading-platform connection concepts
          does: The User, Trading Platform, Instance, Currency, and Broker domain concepts are each defined
            with their complete fields, relationships, rules, and credential treatment.
          constraints: []
          task_count: 5
          tasks:
            P1G2T1:
              id: P1G2T1
              title: Define the User Domain Definition
              description: Define the User Domain Definition with its complete identity fields, uniqueness
                rules, active-state field, and description, declaring `password` and `api_key` as credentials
                requiring hash storage at rest, and declaring the Definition as persistent.
              reason: User is the foundational identity every other user-owned concept in the Target references.
              kind: code
              inputs:
              - Target Model definition for User
              - Model Foundation
              expected_result: A complete, persistent User Domain Definition publishing its fields, uniqueness
                constraints, and hash-at-rest credential classification for `password` and `api_key`.
              depends_on:
              - P1G1T1
              constraints: []
              acceptance: Every field, uniqueness rule, and credential classification stated by the Target
                for User is present and unaltered, and the Definition declares itself persistent.
              verify: Validating representative valid and invalid User data confirms every declared field,
                uniqueness rule, and required, nullable, or default semantic is enforced, and the credential
                fields are classified for hash storage.
              status: done
              log:
              - event: implemented and verified
                check: uv run pytest -- 22 passed; uv run ruff format/check -- clean; uv run pyright --
                  0 errors
                result: passed
                at: '2026-09-15T12:01:45Z'
