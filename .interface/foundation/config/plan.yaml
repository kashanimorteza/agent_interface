          does: "Every core reference Model is defined with its fields, relationships, domain rules, and required initial data."
          constraints: []
          task_count: 5
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              title: "Define the User domain Model"
              description: "Define the User domain Model exactly as the current Target Model definition and the applicable Model Principles and Preferences require: its fields, relationships, domain rules, credential fields, and required initial data, exposed through the package's established public interface."
              reason: "User grounds every other user-owned Model in this phase and anchors the initial data most other Models' rules and dependencies build on."
              kind: "code"
              inputs: ["Package foundation and public interface", "Current Target Model definition for User"]
              expected_result: "The User domain Model exists in the package, is reachable through its public interface, and demonstrably satisfies every field, rule, credential, and initial-data requirement the current Target definition states for it."
              depends_on: ["P1-G1-T1"]
              constraints: []
              acceptance: "A User instance can be constructed that satisfies every field and rule the current Target definition states, invalid states are rejected, and the required initial User record can be represented as a valid instance."
              verify: "The User Model is imported through the package's public interface, valid and invalid construction attempts are observed to succeed or fail as the current Target definition requires, and the required initial data is observed to construct successfully."
              status: "done"
              log:
                - at: "2026-09-11T20:52:14Z"
