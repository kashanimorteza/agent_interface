            description: 'Map the User logical Model to a traceable persistence structure, deriving its
              storage representation, physical constraints, and relationship foreign keys from the Model''s
              own declared fields, nullability, and relationships. Preserve the hash-credential designation
              the User Model declares for its password and api_key fields even though Database''s own
              generic field-name default for a field named api_key is encrypted: an explicit Model-declared
              storage mode always takes precedence over that generic default, so both fields must resolve
              to hash storage, never encrypted. Enforce the Target''s declared record-level uniqueness
              rule that Model itself cannot enforce because it depends on already-persisted state: name
              must be unique across User records.'
