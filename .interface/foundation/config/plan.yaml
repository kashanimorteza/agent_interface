        P2-G11:
          id: P2-G11
          title: Generic Data Access Interface
          description: Implements the one generic, Model-driven interface every consumer uses to reach any persisted Model.
          area: Generic data-access interface and transaction boundary
          does: A single published interface performs every generic data operation for any mapped Model, with a transaction
