# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."


# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 37
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      revision: 1
      target: "Model"
      does: "Define the complete authoritative domain Model: every Domain Definition, Field, Domain Relationship, Intrinsic Rule, and credential or sensitive meaning the Target states, expressed through one shared Model Foundation and one explicit Public Interface, independent of persistence, transport, or any other external concern."
      constraints: []
      task_count: 16
      groups:
        P1-foundation:
          id: "P1-foundation"
          title: "Model Foundation"
          description: "The shared technical-independent foundation every concrete Domain Definition in this phase depends on for common configuration and behaviour."
          area: "Cross-Model shared foundation"
          does: "A reusable Model Foundation exists that every Domain Definition in this Plan receives its shared configuration and behaviour through."
          constraints: []
          task_count: 1
          tasks:
            P1-model-foundation:
              id: "P1-model-foundation"
              title: "Establish the Model Foundation"
              description: "Establish the one Model Foundation through which every concrete Domain Definition in this phase receives shared configuration and behaviour, including the common Field defaults, strict unknown-field rejection, deterministic side-effect-free validation, and the exact-decimal and timezone-aware-UTC conventions the Model Component requires."
              reason: "Every Domain Definition in this Plan must share one consistent foundation so cross-cutting Model behaviour is defined once instead of independently by each definition."
              kind: "code"
              inputs: ["The Model Component's applicable Principles and Preferences"]
              expected_result: "A shared Model Foundation that every Domain Definition defined in this phase applies for its common configuration and behaviour."
              depends_on: []
              constraints: []
              acceptance: "Applying the Foundation to a concrete Domain Definition supplies its common Field defaults and enforces strict rejection of unknown fields, deterministic side-effect-free validation, exact-decimal numeric handling, and timezone-aware UTC time handling, without requiring any of that behaviour to be redefined per Domain Definition."
              verify: "A Domain Definition built through the Foundation exhibits the common behaviour without redeclaring it, and rejects data that violates a Foundation-enforced convention."
              status: "done"
              log:
                - "done — implemented as model.foundation.ModelFoundation (extra=\"forbid\", validate_default=True), model.ExactDecimal, model.UTCDateTime, and the id_field/is_active_field/description_field helpers; proven by tests/test_foundation.py (9 tests: common defaults applied without redeclaration, unknown-field rejection, exact-decimal rejects float, exact-decimal accepts str/int, timezone-naive datetime rejected, timezone-aware datetime normalized to UTC, deterministic validation, default Model Operations vocabulary, empty credential_storage default) via a throwaway _Sample subclass built through the Foundation; pytest, ruff check, ruff format --check, and pyright all pass with zero findings."
                - "correction — Review Finding P1-F1 (major): id_field() declared id as int | None = None, so every Domain Definition accepted an explicit id=None, contradicting the Target's declared Nullable: false for id. Fixed at the Foundation level per Model Principle 6/9: since Model owns no id-generation mechanism, an omitted id resolves to null, which a non-nullable Field must reject — id is now required (pydantic.Field() with no default), exactly like any other non-nullable Field without a Model-owned default. Added tests/test_foundation.py::test_foundation_requires_id_and_rejects_null proving omission and explicit None are both rejected. Also fixed Review Finding P1-F2 (minor): ran uv run ruff format . project-wide (README.md and touched test files were not format-clean). Re-verified clean: pytest 128 passed, ruff check clean, ruff format --check clean, pyright 0 errors."
                - "correction — Review Finding P1-F3 (major): the P1-F1 fix overcorrected by making id a required caller-supplied Field, contradicting every Domain Definition Task's own acceptance clause (\"the identity field is generated rather than supplied\") and misreading Model Principle 6's 'generated: true means the value is supplied automatically' as caller-supplied. Corrected id_field() to use default_factory=_generate_id, a process-local itertools.count placeholder sequence owned entirely by Model (Model Principle 9 — this is not a persistence-layer auto-increment and carries no uniqueness/ordering guarantee beyond this process; Database (P2) assigns the definitive persisted id). Omitting id now generates a real distinct int automatically; an explicit id (e.g. for reconstruction from persisted data, which serialization round-tripping requires) is still accepted; explicit None is still rejected (nullable: false unchanged from the P1-F1 fix). Replaced the single foundation test with four: generates-when-omitted, generated-ids-are-distinct, accepts-explicit-override, rejects-null. Removed the now-incorrect 'id' entries from all 15 Domain Definition test files' REQUIRED lists (id is no longer caller-required) while re-adding 'id' directly to each NON_NULLABLE list (still must reject explicit None) — a mechanical correction of test expectations, not a change to any Domain Definition's own fields, relationships, or rules. Re-verified clean: pytest 131 passed, ruff check clean, ruff format --check clean (35 files), pyright 0 errors."
        P1-identity:
          id: "P1-identity"
          title: "Identity"
          description: "The independent user identity that owns every other user-scoped domain concept in this Plan."
          area: "User identity"
          does: "The User Domain Definition exists as the Model's authoritative representation of an independent system user."
          constraints: []
          task_count: 1
          tasks:
            P1-user:
              id: "P1-user"
              title: "Define the User Domain Definition"
              description: "Define the User Domain Definition with exactly the fields, defaults, and Intrinsic Rules the Target's Model section states for it, preserving its password and api_key credential fields' declared hash storage-at-rest meaning, and declaring the Model Operations applicable to a User's lifecycle."
              reason: "User is the independent tenant identity every other user-scoped Domain Definition in this Plan relates to, so it must exist as one stable authoritative definition before those relationships can be defined."
              kind: "code"
              inputs: ["The Target's Model definition for User", "The Model Foundation"]
              expected_result: "A User Domain Definition published through Model's Public Interface with its declared fields, defaults, identity field, credential meaning, and applicable Model Operations."
              depends_on: ["P1-model-foundation"]
              constraints: []
              acceptance: "Constructing a User with valid Target-consistent data succeeds and reports the password and api_key fields' declared hash storage-at-rest meaning; omitting a required field, supplying null for a non-nullable field, or supplying data of the wrong type is rejected; the identity field is generated rather than supplied."
              verify: "Model's Public Interface publishes the User Domain Definition; valid data is accepted and invalid or missing required data is rejected; its declared fields, defaults, and credential meaning match the Target; its schema and serialization round-trip preserve every declared field."
              status: "done"
              log:
                - "done — implemented as model.User; proven by tests/test_user.py (9 tests: public interface exposure, valid construction + defaults, unknown-field rejection, each of 4 required fields individually rejected when missing, each non-nullable field individually rejects null, wrong-type rejection, id generated not supplied, declared hash credential storage for password/api_key, serialization+schema round-trip); pytest, ruff, and pyright all clean."
                - "correction — Review Finding P1-F1 (major, Foundation-level): id is now a required, non-nullable int Field (see P1-model-foundation log) instead of accepting an explicit id=None. Updated tests/test_user.py accordingly: id added to REQUIRED/NON_NULLABLE and the _valid() fixture; the obsolete assert_id_generated_not_supplied-based test removed since the generic required/non-nullable checks now cover id like any other Field. Re-verified: pytest, ruff check, ruff format --check, and pyright all clean."
        P1-platform-catalog:
