meta:
  path: .interface/foundation/config/plan.yaml
  path_note: Mutable Plans, Groups, Tasks, counts and progress.
policy:
  agent_may_edit: true
  rule: Apply the current Plan Component and the active operation's ownership rules.
resolution:
  procedure: Read together with the Plan Schema; Planning fills Plans, Groups, and Tasks, and every derivable fact is resolved from its authoritative source rather than read back from this file.
read_order:
- task_count
- plans
content_map:
  task_count: Total number of stored Tasks.
  plans: Current phase Plans and their Groups and Tasks.
content:
  task_count: 21
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      revision: 1
      target: Model
      does: 'Deliver the independent Model layer: one authoritative Domain Definition for every domain concept the Target defines, sharing one foundation and published through one Public Interface.'
      constraints: []
      task_count: 21
      groups:
        P1.G1:
          id: P1.G1
          title: Model Foundation
          description: 'The shared mechanism every Domain Definition receives: declaration publishing, serialization, and validating deserialization. It supplies mechanism only and never a Field or a relationship.'
          area: Model Foundation
          does: Every Domain Definition can publish its declaration and convert to and from its Plain Representation without redeclaring any of it.
          constraints: []
          task_count: 3
          tasks:
            P1.G1.T1:
              id: P1.G1.T1
              title: Publish the Declaration Vocabulary through every Domain Definition
              description: Provide the mechanism through which a Domain Definition states itself in the Declaration Vocabulary and through which a consumer reads that same declaration back from the definition itself, with no second artifact.
              reason: Database, Logic, and every other consumer must read one shared declaration instead of reinterpreting the Target.
              kind: code
              inputs:
              - The Declaration Vocabulary and its term meanings
              expected_result: A Domain Definition that states its Fields, relationships, and persistence in the vocabulary has that complete declaration readable, unchanged, from the definition.
              depends_on: []
              constraints: []
              agent:
                consider:
                - 'Standards, typing: Modern Python typing as the language entry states it, builtin generics and the union operator.'
                - 'Structure, reusable domain type: Define a repeated constraint once as an Annotated alias carrying AfterValidator or an annotated_types constraint, then reuse the alias instead of repeating the constraint on each field.'
                - 'Structure, model config: ConfigDict(extra=''forbid'', validate_assignment=True, validate_default=True, str_strip_whitespace=True); add frozen=True where the concept is a value rather than an entity. The default for extra is ''ignore'', which discards an unknown field silently.'
                - 'Standards, json schema: Draft 2020-12, emitted by model_json_schema(); the same output is OpenAPI 3.1 compatible.'
                avoid:
                - 'Legacy APIs: validator, root_validator, parse_obj, dict, json.'
                - 'Deprecated constraint helpers, scheduled for removal in Pydantic 3, express the same constraint with Annotated instead: constr, conint, confloat, condecimal.'
                - PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.
                overridden: []
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: A probe Domain Definition using every applicable vocabulary term yields a read-back declaration equal to what it stated; a relationship whose referenced definition cannot be resolved is rejected when it is declared and not later; the mechanism adds no Field or relationship to any definition; reading a declaration is deterministic and performs no external I/O. The result also observably conforms to the governing agent parameters and to the applicable guidance of the required pydantic Skill.
              verify: Observe, on a probe definition stating every applicable term, that the read-back declaration matches the stated one term for term, that an unresolvable relationship reference fails at declaration, that the probe carries no Field or relationship it did not state, and that two reads of one declaration are identical.
              status: done
              log:
              - 2026-09-19T17:04:44Z [claimed] Claimed by developing before work begins.
              - '2026-09-19T17:06:48Z [done] Transient probe check (kept outside the Component) passed 23 of 23 observations: read-back of every vocabulary term, unresolvable/named/undeclared references and missing persistence or cardinality rejected at declaration, no Field added by the mechanism, repeated reads identical. Environment: Python 3.14.7, pydantic 2.13.5. Checks left no artifact in the Component.'
            P1.G1.T2:
              id: P1.G1.T2
              title: Provide serialize for every Domain Definition
              description: Provide once, through Model Foundation, the capability that produces the Plain Representation of one instance of any Domain Definition.
              reason: Consumers must not rebuild the conversion, since each rebuilt copy is a place where domain meaning can drift.
              kind: code
              inputs:
              - The Declaration Vocabulary published by the definition
              expected_result: Every Domain Definition offers serialize and receives it without declaring it again.
              depends_on:
              - P1.G1.T1
              constraints: []
              agent:
                consider:
                - 'Standards, typing: Modern Python typing as the language entry states it, builtin generics and the union operator.'
                - 'API, serialization: pydantic.field_serializer, pydantic.model_serializer, model_dump, model_dump_json.'
                avoid:
                - 'Legacy APIs: validator, root_validator, parse_obj, dict, json.'
                overridden:
                - 'API serialization entry model_dump_json is overridden by Model Principle ''Every Domain Definition converts to and from a Plain Representation'': serialize returns simple named values and never an encoded text form.'
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: For a probe definition, serialize returns simple named values for exactly the definition's own Fields; every value is expressible in JSON without a custom encoder; no encoded text is returned; a relationship appears only as its declared reference value and is never nested; no Field is withheld; identical input yields identical output; no external I/O occurs; the probe does not declare the capability itself. The result also observably conforms to the governing agent parameters and to the applicable guidance of the required pydantic Skill.
              verify: Observe on a probe definition that the result holds exactly its own Fields as simple values, that a standard JSON encoder accepts the result unaided, that a relationship is shown only as its reference value, that repeated calls return identical results, and that the probe declares no serialization of its own.
              status: done
              log:
              - 2026-09-19T17:06:48Z [claimed] Claimed by developing before work begins.
              - '2026-09-19T17:07:09Z [done] Transient probe check passed 11 of 11 observations: plain dict of exactly the definition''s own Fields, relationship shown only as its reference value, no Field withheld (credential unchanged), exact decimal preserved, JSON-encodable with the standard encoder, repeated calls identical, provided once by the foundation and not declared by the probe.'
            P1.G1.T3:
              id: P1.G1.T3
              title: Provide deserialize for every Domain Definition
              description: Provide once, through Model Foundation, the capability that builds an instance of any Domain Definition from a Plain Representation while applying the definition's Intrinsic Rules.
              reason: The return path must validate so that nothing outside Model can hold an instance the domain rules would reject.
              kind: code
              inputs:
              - The Declaration Vocabulary published by the definition
              - The Plain Representation produced by serialize
              expected_result: Every Domain Definition offers deserialize and receives it without declaring it again.
              depends_on:
              - P1.G1.T1
              - P1.G1.T2
              constraints: []
              agent:
                consider:
                - 'Standards, typing: Modern Python typing as the language entry states it, builtin generics and the union operator.'
                - 'Structure, model config: ConfigDict(extra=''forbid'', validate_assignment=True, validate_default=True, str_strip_whitespace=True); add frozen=True where the concept is a value rather than an entity. The default for extra is ''ignore'', which discards an unknown field silently.'
                - 'Structure, single field rule: @field_validator.'
                - 'Structure, cross field rule: @model_validator(mode=''after'').'
                - 'Structure, validator order: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance.'
                avoid:
                - 'Legacy APIs: validator, root_validator, parse_obj, dict, json.'
                - 'Deprecated constraint helpers, scheduled for removal in Pydantic 3, express the same constraint with Annotated instead: constr, conint, confloat, condecimal.'
                - PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.
                overridden: []
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: For a probe definition, conforming plain data yields an instance; data that misses a required Field, holds a wrongly typed value, carries an unknown Field, or violates a declared constraint is rejected with a failure that identifies the offending Field; serialize followed by deserialize reproduces an equal instance and deserialize followed by serialize reproduces the same plain data; results are deterministic and no external I/O occurs; the probe does not declare the capability itself. The result also observably conforms to the governing agent parameters and to the applicable guidance of the required pydantic Skill.
              verify: Observe on a probe definition that conforming data constructs an instance, that each class of non-conforming data is rejected and names the offending Field, that both round trips hold, and that the probe declares no deserialization of its own.
              status: done
              log:
              - 2026-09-19T17:07:09Z [claimed] Claimed by developing before work begins.
              - '2026-09-19T17:07:57Z [done] Transient probe check passed 23 of 23 observations: conforming data builds an instance; missing, wrong-typed, boolean-for-integer, unknown-Field, over-length, float/boolean/garbage-for-exact-decimal, naive or numeric instant, and null-for-required data are each rejected naming the offending Field; both round trips hold; credential value not stripped; provided once by the foundation.'
