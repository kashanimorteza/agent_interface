              Platform, and it must correctly preserve the User and Trading Platform relationships the
              Target declares.
            kind: code
            inputs:
            - Shared Model Foundation mechanisms
            - User public identity
            - Trading Platform public identity
            expected_result: Instance is available through Model's Public Interface referencing exactly
              one User and one Trading Platform, with its technical connection fields preserved as encrypted
              credentials where declared, and its User-and-name combination published as a declared composite
              unique constraint.
            depends_on:
            - P1T1
            - P1T2
            - P1T3
            constraints: []
            acceptance: An Instance can be constructed referencing a valid User and Trading Platform with
              a complete set of declared fields and is rejected only when a required field is missing
              or an invalid reference is given; its published metadata declares the User-and-name combination
