              reason: "Accounts state their base currency through a Currency."
              kind: "code"
              inputs:
                - "The Target's definition of Currency"
                - "The User Domain Definition"
                - "The Declaration Vocabulary"
                - "The Model Foundation"
              expected_result: "Currency is declared persistent with every Field and property the Target states, including the fixed-size code, optional symbol and country, the default decimal precision, activation that defaults to active, its relationship to User, and the composite uniqueness of user and code."
              depends_on: ["P1-G2-T1", "P1-G2-T2", "P1-G3-T1"]
              constraints: []
              agent_consider: *pydantic_consider
              agent_avoid: *pydantic_avoid
              agent_overridden: []
              agent_skills: *pydantic_skills
              acceptance: "Reading the Currency declaration shows each Target Field with its stated properties including the code's declared size and the default decimal digits, the User relationship carried as that definition, the composite uniqueness of user and code, and persistence declared persistent. A code of the wrong length is rejected; valid data builds a Currency; the Plain Representation round-trips. The result conforms to every carried Agent statement, contains nothing the carried avoid statements rule out, and follows the applicable guidance of the required modeling Skill."
              verify: "Through the Public Interface, reading the declaration, building with valid data, building with a code of the wrong length, and round-tripping the Plain Representation give the stated results."
              status: "done"
              log:
                - "2026-09-19T22:05:10Z Verified with transient probe (run and discarded outside the Component, expectations transcribed from the Target): Currency declaration matches Target Field by Field (names, order, logical types, optionality, defaults, uniqueness, credentials, persistent, activation on is_active; code held at exactly 3 characters (2 and 4 rejected), decimal_digits default 2, composite (user_id,code)); valid data builds; each required Field rejected when missing, null, or of the wrong kind; unknown key rejected; Plain Representation JSON-encodes without a custom encoder, keeps every Field, and round-trips equal. ruff and pyright clean. Modelling choices recorded in the definition module."
