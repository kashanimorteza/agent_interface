                - 'structure.polymorphic_data: A discriminated union, with Field(discriminator=...)'
                - 'structure.root_collection: RootModel[...]'
                - 'structure.non_model_validation: TypeAdapter, for validating a type that is not a BaseModel'
                - 'structure.derived_value: computed_field'
                - 'structure.validator_order: Before and wrap validators run right to left; after validators run left to right. Stacked validators are written so that order is explicit rather than assumed from their appearance.'
                - 'api.base_model: pydantic.BaseModel'
                - 'api.configuration: pydantic.ConfigDict'
                - 'api.field_validation: pydantic.field_validator'
                - 'api.model_validation: pydantic.model_validator'
                - 'api.root_model: pydantic.RootModel'
                - 'api.computed_field: pydantic.computed_field'
                - 'api.field_serialization: pydantic.field_serializer'
                - 'api.model_serialization: pydantic.model_serializer'
                - 'api.serialization: model_dump, model_dump_json'
                - 'api.schema: model_json_schema'
                avoid:
                - 'legacy_apis: validator, root_validator, parse_obj, dict, json'
                - 'deprecated_constraint_helpers: constr, conint, confloat, condecimal — scheduled for removal in Pydantic 3; express the same constraint with Annotated instead.'
                - 'plain_validator: PlainValidator replaces standard validation entirely and cuts off type safety; use BeforeValidator or AfterValidator around it instead.'
                overridden:
                - 'api.serialization: model_dump_json — overridden by Model Principle "Every Domain Definition converts to and from a Plain Representation", which requires serialize to return simple named values and never an encoded text form.'
                skills:
                - resource: pydantic
                  requirement: required
                  resolved: true
                  identifier: pydantic:pydantic
              acceptance: For a definition using the Foundation, serialize returns a plain structure of named values that is JSON-compatible, never encoded text, containing every Field of the definition and no nested related definition; deserialize of that structure returns an equal instance; deserialize rejects every input that construction of the same definition would reject, including wrongly typed values, and fails when data breaks an Intrinsic Rule; both are deterministic and perform no external I/O; and no Field is withheld. The result also conforms observably to every statement in agent.consider, contains none of the statements in agent.avoid, and follows the applicable guidance of the required pydantic Skill.
              verify: Observe by a transient check that a round trip through serialize and deserialize returns an equal instance, that the output survives conversion to JSON text unchanged, that a Domain Relationship appears only as its foreign-key value, that over valid inputs and invalid inputs — wrongly typed, missing, unknown, and rule-violating data — deserialize accepts and rejects exactly what construction accepts and rejects, and that repeated calls with the same input give the same result.
              status: done
              log:
              - at: '2026-09-19T14:22:51Z'
                transition: todo -> claimed
                by: developing
              - at: '2026-09-19T14:22:51Z'
                transition: claimed -> done
                by: developing
                check: 'Transient check over all 15 definitions: serialize output JSON round-tripped unchanged, contains every Field and no nested value, decimals and datetimes survive; deserialize rejects unknown, missing, and rule-violating input; repeated calls equal.'
                outcome: 'Passed. Credential whitespace preserved; ordinary text trimmed; construction strict, deserialize lax only for JSON-compatible forms. Completion gate from a fresh environment (environment removed and re-synced from the lockfile): ruff check and format check passed, pyright 0 errors, transient behaviour check and README check passed.'
              - at: '2026-09-19T14:34:08Z'
                transition: done -> claimed
                by: developing
                reason: Acceptance or verification changed at Plan revision 2; re-examining before any change.
              - at: '2026-09-19T14:37:01Z'
                transition: claimed -> done
                by: developing
                check: 'Fixed Finding P1-F5: deserialize now validates the Plain Representation strictly (decimals and datetimes as strings; a number for a decimal, a non-ISO string for a datetime, and any wrongly typed value are rejected). Then ran a transient differential check: for all 15 definitions and every Field, 21 wrongly typed and edge candidates were given to construction and to deserialize (as their plain forms), comparing accept/reject and, where both accept, the resulting instance; plus structural inputs (unknown key, missing required, non-mapping, null, list, non-JSON value, bytes) and number-versus-string for every decimal Field. Also re-ran the reviewer''s original probe cases.'
                outcome: 'Passed: 2092 construct/deserialize pairs compared (514 accepted by both) with no divergence; all six divergences recorded in the Finding now reject in both paths; every structural input rejected with ValidationError only. The check itself first exposed an extra looseness (a numeric string such as ''2'' read as epoch seconds for a datetime Field), which was fixed by requiring ISO 8601. Fresh-environment gate (environment removed and re-synced from the lockfile): ruff check and format check clean, pyright 0 errors, behaviour, Operations, parity, and README checks passed, no test artifacts in Model.'
