      id: "P2"
      title: "Database"
      target: "Database"
      scope: "Re-assured Plan Assurance (Plan revision 2, unchanged since assured) and independently performed Implementation Assurance over all 24 completed Tasks: a clean .venv rebuild, the full 59-check pytest suite, ruff check, ruff format --check, pyright, a migration smoke-apply to a fresh database, plus adversarial checks for foreign-key RESTRICT enforcement, SQL-injection-shaped filter input, raw f-string SQL, startup schema creation (create_all outside Migrations), hardcoded secrets, and credential redaction."
