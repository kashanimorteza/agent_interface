meta:
  path: .interface/foundation/config/review.yaml
  path_note: Mutable Reviews, Findings and their state.
policy:
  agent_may_edit: true
  rule: Apply the current Review Component and the active operation's ownership rules.
read_order:
- finding_count
- reviews
content_map:
  finding_count: Total number of stored Findings.
  reviews: The current review record for each reviewed phase.
content:
  finding_count: 5
  reviews:
    P1:
      id: P1
      title: Model
      target: Model
      scope: 'Plan Assurance for revision 3 of the P1 Plan and Implementation Assurance of the built Model library against the assured Plan and current Interface and Target Understanding, observed with the reviewer''s own probes (the six recorded divergences on both paths; decimal and datetime string forms; independent wrongly typed and edge candidates; credential whitespace on every credential Field; input hygiene; JSON Schema emission; avoid-list scan of the source) plus fresh lint, type check, and README execution. Limits: the reviewer shares a session with the implementer, so independence is by separately written probes, not by a separate agent; not covered: the Database, Logic, API, and Presentation phases and any use of Model by them.'
      outcome: satisfied
      plan_outcome: satisfied
      plan_revision: 3
      implementation_outcome: satisfied
      reviewed_by: reviewer
      reviewed_at: '2026-09-19T14:38:45Z'
      finding_count: 5
      findings:
        P1-F1:
          id: P1-F1
          kind: gap
          severity: major
          task: null
          expected: 'Owner: Planning. The Plan requires the Model Public Interface to be offered as Operations, each stating what it accepts, what it returns, and which outcomes it can produce, and requires the Component documentation to cover every Operation with those three statements and a runnable example (Development Principles: "Every Component offers its work as Operations on one Public Interface" and "Every Component has complete, safe, and operational documentation").'
          observed: No Task states an Operation-level obligation. The Public Interface Task and the documentation Task never mention Operations, what each accepts or returns, or their outcomes; the documentation Task asks only for the definitions, three uses, setup, use, verification, and troubleshooting.
          evidence: 'plan.yaml, plan P1: tasks P1-G7-T1 and P1-G7-T3 — description, acceptance, and verify contain none of the words Operation, accept, return, or outcome (searched 2026-09-19T14:24:51Z).'
          state: resolved
          raised_at: '2026-09-19T14:26:00Z'
          settled_at: '2026-09-19T14:32:30Z'
          settled_by: 'Review of P1 at Plan revision 2 (2026-09-19T14:32:30Z): The Plan now requires Operations with accepts, returns, and outcomes in the Public Interface and documentation Tasks (P1-G7-T1, P1-G7-T3 at revision 2).'
        P1-F2:
          id: P1-F2
          kind: defect
          severity: major
          task: null
          expected: 'Owner: Planning. The same statement appears in only one Task of a Plan; a statement shared by several Tasks is stored once in their common Group or Plan (Plan Principles: "Context is written once and inherited").'
          observed: 'Statements common to the 15 Domain Definition Tasks are repeated in each of them: the acceptance clause "a Field the Target leaves unstated receives no invented default" appears in 15 Tasks, and the credential-classification sentence appears in the descriptions and the verification conditions of 3 Tasks. The agent-conformance sentence repeated in 17 acceptance clauses is required per Task by the Plan Schema and is not counted.'
          evidence: 'plan.yaml, plan P1: acceptance of every Task in Groups P1-G2 through P1-G6 (15 Tasks); description and verify of P1-G2-T1, P1-G2-T3, and P1-G4-T2 (identical sentences found by comparing sentence text across Tasks, 2026-09-19T14:24:51Z).'
          state: resolved
          raised_at: '2026-09-19T14:26:00Z'
          settled_at: '2026-09-19T14:32:30Z'
          settled_by: 'Review of P1 at Plan revision 2 (2026-09-19T14:32:30Z): No statement is repeated across Tasks except the skill-conformance sentence the Plan Schema requires per Task.'
        P1-F3:
          id: P1-F3
          kind: defect
          severity: minor
          task: null
          expected: 'Owner: Planning. Planning content names no file, folder, path, module, package layout, class, function, symbol, or command (Plan Principles: "A Task is independent of the implementation structure").'
          observed: 'Planning content states structure: P1-G7-T4 acceptance and verification say each definition "stands in a module of its own" and check module separation; P1-G7-T1 mentions a module; P1-G7-T2 says "private file"; P1-G7-T3 is titled and described in terms of the Component README, a file.'
          evidence: 'plan.yaml, plan P1: fields acceptance and verify of P1-G7-T4; description of P1-G7-T1 and P1-G7-T2; title of P1-G7-T3.'
          state: resolved
          raised_at: '2026-09-19T14:26:00Z'
          settled_at: '2026-09-19T14:32:30Z'
          settled_by: 'Review of P1 at Plan revision 2 (2026-09-19T14:32:30Z): No file, folder, path, module, or README wording remains in planning content.'
        P1-F4:
          id: P1-F4
          kind: defect
          severity: major
          task: null
          expected: 'Owner: Configure. The Application Manifest carries a Model section reconciled from the public metadata Model now publishes — package identity, public entry point, and public interface (Development Principles: "Components publish shared application metadata through the Application Manifest").'
          observed: The Model section of the Application Manifest is still empty although the Model library exists and publishes that metadata. Configure has not run since Model was generated, and Developing has no write authority over the Manifest.
          evidence: 'foundation/config/application.yaml: content.components.model = {} (read 2026-09-19T14:24:51Z); Developing''s Task P1-G7-T2 log records that the section was not written.'
          state: resolved
          raised_at: '2026-09-19T14:26:00Z'
          settled_at: '2026-09-19T14:32:30Z'
          settled_by: 'Review of P1 at Plan revision 2 (2026-09-19T14:32:30Z): The Model section of the Application Manifest is populated and lists the 15 definitions and 4 Operations the library exports.'
        P1-F5:
          id: P1-F5
          kind: defect
          severity: major
          task: P1-G1-T3
          expected: 'Owner: Developing. deserialize evaluates the same Intrinsic Rules the Domain Definition applies to any other instance, so nothing outside Model can construct an instance the domain rules would reject (Model Principles: "Every Domain Definition converts to and from a Plain Representation"; Task P1-G1-T3 description).'
          observed: deserialize accepts data that construction rejects. Type rules that construction enforces are relaxed in deserialize, so wrongly typed values are silently coerced into a valid instance; the implementer's recorded check covered only unknown, missing, and rule-violating input and never compared deserialize with construction, so the acceptance clause had no observable proof. The README states this divergence as intended.
          evidence: 'Reviewer probe on the installed library (2026-09-19T14:31Z): Account(leverage=''100''), Account(leverage=100.0), User(is_active=''no''), User(is_active=1), Broker(user_id=''7''), and Account(balance=5) each raise ValidationError on construction, while deserialize accepts the same values and returns an instance. Source: the deserialize Operation in the Model Foundation validates with strict=False; README section ''Behaviour every Operation shares'', bullet ''Construction is strict''.'
          state: resolved
          raised_at: '2026-09-19T14:32:30Z'
          settled_at: '2026-09-19T14:38:45Z'
          settled_by: 'Review of P1 at Plan revision 3 (2026-09-19T14:38:45Z): all six recorded divergences reject on both paths; independent probes of decimal and datetime string forms, wrongly typed and edge values, and input hygiene found deserialize accepting nothing construction rejects; the README states the new behaviour.'
