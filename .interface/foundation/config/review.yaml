    scope: "Plan Assurance (Revision 2, unchanged) plus Implementation Assurance of the model Python package against current Target Understanding, Model Principles, and the assured Plan: field presence/nullability, uniqueness metadata, credential classification, persistence declaration, foreign-key/cardinality metadata, and absence of cross-record enforcement, independently cross-checked against Target field-by-field rather than by re-reading the implementer's own tests."
    outcome: "satisfied"
    plan_outcome: "satisfied"
