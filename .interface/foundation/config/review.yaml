          kind: "defect"
          severity: "major"
          task: "P1-T-establish-foundation"
          expected: "Per Model Preferences (implementation.persistence_contract.field_metadata.default), the persistence contract must publish the resolved default value itself for every Field that declares one."
          observed: "FieldContract publishes only a has_default boolean flag; the actual resolved default value (for example is_active=True, decimal_digits=2, point_size=0.0, digits=0, balance=Decimal('0'), profit=Decimal('0'), is_executed=False) is never published through persistence_contract()."
          evidence: "model/src/model/foundation.py FieldContract.has_default: bool; every Domain Definition's PERSISTENCE_CONTRACT, e.g. model/src/model/user.py 'is_active': FieldContract(nullable=False, has_default=True), publishes presence only, not the value."
          state: "resolved"
          raised_at: "2026-09-15T15:30:00Z"
          settled_at: "2026-09-15T15:45:00Z"
          settled_by: "my-interface-reviewer"
