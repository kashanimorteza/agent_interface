meta:
  path: ".interface/foundation/config/review.yaml"
  path_note: "Mutable Reviews, Findings and their state."
policy:
  agent_may_edit: true
  rule: "Apply the current Review Component and the active operation's ownership rules."
read_order:
  - "finding_count"
  - "reviews"
content_map:
  finding_count: "Total number of stored Findings."
  reviews: "The current review record for each reviewed phase."
content:
  finding_count: 3
  reviews:
    P1:
      id: "P1"
      title: "Model"
      target: "Model"
      scope: "Plan Assurance and Implementation Assurance of P1 Plan revision 2 (17 Tasks, 9 Groups) against current Interface Understanding, Target Understanding, Model Principles, Model Preferences, Development Principles, Development Preferences, and Plan Principles, including independent adversarial construction, rejection, mutation, and declaration-vocabulary checks against the implemented model package."
      outcome: "satisfied"
      plan_outcome: "satisfied"
      plan_revision: 2
      implementation_outcome: "satisfied"
      reviewed_by: "reviewing"
      reviewed_at: "2026-09-18T17:33:01Z"
      finding_count: 3
      findings:
        P1-F1:
          id: "P1-F1"
          kind: "gap"
          severity: "major"
          task: null
          expected: "Development Principle 8 requires every Participating Component, including Model, to be generated with a complete README at its Profile's documentation path as part of generating the Component, ordered overview/structure/setup/run/capabilities/verify/troubleshooting. Plan coverage for a phase that generates a Component must include this obligation as planned, verifiable work."
          observed: "No Task, Group, or Plan-level constraint in P1's Plan (revision 1) covers README generation for the model Component. The obligation is entirely absent from the Plan's coverage, even though Developing produced a compliant README this run."
          evidence: ".interface/foundation/config/plan.yaml content.plans.P1: no task or field mentions documentation or a README across all 16 Tasks in groups P1.G1-P1.G8. Compare implementation/guide.md Understanding record ('Development — Documentation', 2026-09-18), which records this exact failure mode already having occurred once before in this project ('model/ and database/ were generated without a README although Principle 8 required one — Planning had scoped applicable obligations to the phase's own Component')."
          state: "resolved"
          raised_at: "2026-09-18T17:22:13Z"
          settled_at: "2026-09-18T17:33:01Z"
          settled_by: "reviewing (this review): Plan revision 2 adds Group P1.G9 (Documentation) with Task P1.G9.T1 requiring README generation; the README exists at model/README.md, follows the declared order, and every example was independently re-executed and matched."
        P1-F2:
          id: "P1-F2"
          kind: "defect"
          severity: "major"
          task: null
          expected: "A Task's verification condition must be an observable behavior that a correct implementation can actually satisfy, and per Model Principle 9's Boundary, Model 'does not enforce rules that require comparing multiple stored records' — uniqueness across persisted records is exactly such a rule and belongs to Database."
          observed: "11 Tasks' verify conditions state that constructing a Domain Definition with data violating 'the declared uniqueness rule' is 'observably rejected': Instance, Currency, Broker, Asset, Account Group, Account, Trailing Group, Trailing Rule, Partial Group, Partial Rule, and Action Group. A single-instance construction can never violate a uniqueness constraint, since uniqueness is only meaningful across multiple stored records; the condition as written cannot be satisfied without Model wrongly enforcing a cross-record rule it is forbidden to enforce."
          evidence: ".interface/foundation/config/plan.yaml, verify fields at P1.G3.T2 (Instance), P1.G3.T3 (Currency), P1.G3.T4 (Broker), P1.G3.T5 (Asset), P1.G4.T1 (Account Group), P1.G4.T2 (Account), P1.G5.T1 (Trailing Group), P1.G5.T2 (Trailing Rule), P1.G6.T1 (Partial Group), P1.G6.T2 (Partial Rule), P1.G7.T1 (Action Group) — each containing the phrase 'uniqueness rule is observably rejected'. Model Principles §9 Boundary: 'it does not enforce rules that require comparing multiple stored records. Database owns physical realization and enforcement.'"
          state: "resolved"
          raised_at: "2026-09-18T17:22:13Z"
          settled_at: "2026-09-18T17:33:01Z"
          settled_by: "reviewing (this review): all 11 Tasks' verify conditions in Plan revision 2 now require only that the declared uniqueness metadata is inspectable through the Public Interface, explicitly without Model enforcing it across persisted records; grep confirms the phrase 'uniqueness rule' no longer appears anywhere in the Plan."
        P1-F3:
          id: "P1-F3"
          kind: "gap"
          severity: "minor"
          task: null
          expected: "Model Preferences declare a phase-wide verification convention covering three check categories: 'public interface', 'validation behavior', and 'serialization and schema generation'. Plan coverage should give each category observable coverage across the phase."
          observed: "Only the Model Foundation Task (P1.G1.T1) verify condition mentions serialization. None of the 15 Domain Definition Tasks' acceptance or verify conditions require checking serialization or schema generation for that specific Domain Definition; each is scoped to construction, rejection, and declaration inspection only."
          evidence: ".interface/implementation/model/preferences.yaml content.implementation.verification.checks: ['public interface', 'validation behavior', 'serialization and schema generation']. .interface/foundation/config/plan.yaml: verify fields at P1.G2.T1 through P1.G8.T1 (all 15 Domain Definition Tasks) name no serialization or schema-generation condition."
          state: "resolved"
          raised_at: "2026-09-18T17:22:13Z"
          settled_at: "2026-09-18T17:33:01Z"
          settled_by: "reviewing (this review): Plan revision 2 adds a Plan-level constraint requiring serialization/schema-generation coverage for every Domain Definition; independently re-verified model_dump(), model_dump_json(), and declaration() succeed for all 15 Domain Definitions."
