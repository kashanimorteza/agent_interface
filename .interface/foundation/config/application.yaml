# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Configure creates and reconciles this file on every run; each Component owner publishes non-secret public metadata into its own section when it is generated or configured."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "components"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  components: "Public metadata sections keyed by canonical Implementation Component identifier; each section may remain empty until its owner publishes metadata."


# <!--------------------------------------------------------------------------------- Content -->
content:
  components:
    development: {}
    model: {}
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
