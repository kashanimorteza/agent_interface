meta:
  path: ".interface/foundation/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."
policy:
  agent_may_edit: true
  rule: "Configure creates and reconciles this file; each Component owner adds only non-secret public metadata (package_name, path, public_entrypoint, public_interface) to its own section."
read_order:
  - "components"
content_map:
  components: "Public metadata sections keyed by canonical Implementation Component identifier; a section stays empty until its owner publishes metadata."
content:
  components:
    development: {}
    model: {}
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
