meta:
  path: .interface/foundation/config/application.yaml
  path_note: Shared Application Manifest public Component metadata.
policy:
  agent_may_edit: true
  rule: Apply the Application Manifest Schema; each Component owner adds only non-secret public metadata to its own section.
read_order:
- components
content_map:
  components: Public metadata sections keyed by canonical Implementation Component identifier.
content:
  components:
    development: {}
    model:
      package_name: model
      path: model
      public_entrypoint: model
      public_interface:
        operations:
        - construct
        - declaration
        - serialize
        - deserialize
        domain_definitions:
        - Account
        - AccountGroup
        - Action
        - ActionGroup
        - Asset
        - Broker
        - Currency
        - Instance
        - PartialGroup
        - PartialRule
        - Position
        - TradingPlatform
        - TrailingGroup
        - TrailingRule
        - User
        types:
        - DefinitionDeclaration
        - DomainDefinition
        - FieldDeclaration
        - RelationshipDeclaration
        - ValidationError
        documentation: model/README.md
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
