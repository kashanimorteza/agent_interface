meta:
  path: ".interface/foundation/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."
policy:
  agent_may_edit: true
  rule: "Apply the current Application Manifest Schema and the active operation's ownership rules."
read_order: ["components"]
content_map:
  components: "Public metadata sections keyed by canonical Implementation Component identifier."
content:
  components:
    development: {}
    model:
      package_name: "model"
      path: "model"
      public_entrypoint: "model"
      public_interface:
        operations: ["describe", "create", "serialize", "deserialize"]
        domain_definitions: ["User", "TradingPlatform", "Instance", "Currency", "Broker", "Asset", "AccountGroup", "Account", "TrailingGroup", "TrailingRule", "PartialGroup", "PartialRule", "ActionGroup", "Action", "Position"]
        vocabulary: ["Declaration", "FieldDeclaration", "Relationship", "Precision", "Persistence", "Cardinality", "AtRest", "Identity", "Generated", "Unique", "Activation", "Credential"]
        shared_types: ["ModelFoundation", "ExactDecimal", "Instant"]
      documentation: "model/README.md"
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
