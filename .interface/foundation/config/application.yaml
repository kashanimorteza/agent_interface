meta:
  path: ".interface/foundation/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."
policy:
  agent_may_edit: true
  rule: "Configure creates and reconciles this file from its Schema; each Component owner adds only its own non-secret public metadata to its own section."
resolution:
  procedure: "Read together with the Application Manifest Schema; a section is filled only from metadata its Component already publishes, and stays at its Schema default when the Component does not yet exist."
read_order:
  - "components"
content_map:
  components: "Public metadata sections keyed by canonical Implementation Component identifier."
content:
  components:
    development: {}
    model: {}
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
