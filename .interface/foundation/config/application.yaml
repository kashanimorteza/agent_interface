# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/foundation/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata, generated and reconciled by Configure."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Configure creates and reconciles this file from the current Development Component Profiles and public metadata published by each Implementation Component. No other operation writes it."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "components"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  components: "Public metadata sections keyed by canonical Implementation Component identifier; each section may hold package_name, path, public_entrypoint, and public_interface once its owning Component publishes them."


# <!--------------------------------------------------------------------------------- Content -->
content:
  components:
    development: {}
    model: {}
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    plan: {}
    review: {}
    state: {}
