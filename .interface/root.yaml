# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/root.yaml"
  path_note: "The entry point of the Agent Project Interface — the only file an agent finds without guidance"
  standard: "Agent Project Interface"
  version: "2.2"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file introduces the interface — no mode edits it. Every other file carries its own write rules, in its own policy section"
  changed_by: "The human, directly. A change this file needs is raised as an open question in config/state.yaml, never applied by an agent"
  by_mode: "What may be written where is decided per mode — see content.modes"
  state_authority: "Who may write each field of config/state.yaml, and on which transition, is decided in one place only — the State contract: config/state.yaml under content.state_authority, seeded from the default in schema/state.schema.yaml. This file references the State contract and does not own it"
  on_change_needed: "A change to the structure, the skills, or the modes is raised with the human, never applied by an agent"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "files_and_folders"
  - "modes"
  - "agent_skills"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  files_and_folders: "The folders and files of the interface, and what each is for"
  agent_skills: "The Skills that exist, one line each"
  modes: "The working modes, and what each may write"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- files_and_folders -->
  files_and_folders:

    root:
      path: ".interface/root.yaml"
      responsibility: "Entry point and map of the Agent Project Interface"

    project:
      path: ".interface/project.md"
      responsibility: "Human-readable project definition provided by the Developer"

    schema:
      path: ".interface/schema/"
      responsibility: "Defines generated-file shapes and, for each project item, owns that item's policy and technical preferences"

      files:
        - path: "file.schema.yaml"
          responsibility: "Defines the outer shape every interface file follows — meta, policy, read_order, content_map, content"

        - path: "definition.schema.yaml"
          responsibility: "Defines the structure and format of definition.yaml"

        - path: "task.schema.yaml"
          responsibility: "Defines the structure and format of task.yaml"

        - path: "state.schema.yaml"
          responsibility: "Defines the structure and format of state.yaml — the State contract — and the default State Authority seeded into every newly created state.yaml"

        - path: "backend.schema.yaml"
          responsibility: "Defines backend.yaml plus Backend policy and preferences"

        - path: "frontend.schema.yaml"
          responsibility: "Defines frontend.yaml plus Frontend policy and preferences"

        - path: "database.schema.yaml"
          responsibility: "Defines database.yaml plus Database policy and preferences"

    config:
      path: ".interface/config/"
      responsibility: "Contains the project configuration generated after understanding project.md"

      files:
        - path: "definition.yaml"
          responsibility: "Project definition in structured format"

        - path: "task.yaml"
          responsibility: "Project tasks and plans"

        - path: "state.yaml"
          responsibility: "Current project state, and the live State Authority that governs it"

        - path: "backend.yaml"
          responsibility: "Backend project configuration"

        - path: "frontend.yaml"
          responsibility: "Frontend project configuration"

        - path: "database.yaml"
          responsibility: "Database project configuration and the database contract consumed by the backend"


  # <!-------------------------------------------- Modes -->
  modes:

    rule: "Exactly one mode is active at a time — it is named in config/state.yaml under active.mode"
    set_by: "The human decides the mode; the Skill the human invokes records that decision. Which Skill may record which mode, and under what conditions, is fixed in the State contract — config/state.yaml under content.state_authority — and no mode is ever chosen by an agent"
    entered_by: "A working phase mode is entered by invoking the Skill that owns it — planning by my-interface-tasker, development by my-interface-developer, review by my-interface-reviewer. Under S9, my-interface-reset may return the global workflow to planning with no active phase; it does not perform or invoke a planning run"

    planning:
      purpose: "Decide what will be built and in what order — no product code is written"
      owned_by: "my-interface-tasker"
      may_write:
        - "The mapped item configuration selected by the requested phase's target — planning-owned settings and relationships; a draft database contract when the target is database, never a frozen contract"
        - ".interface/config/task.yaml — the plan for the one project phase named by the invocation"
        - ".interface/config/state.yaml — active, per transitions S1 and S4 in its own content.state_authority, and blockers and open questions"
      may_not_write:
        - "Any file under the requested phase target's code_path"
        - "A frozen contract"
        - "The requested phase's id, title, order, target, or goal in config/definition.yaml"
        - "root.yaml, .interface/config/definition.yaml, and schema/"

    development:
      purpose: "Implement the tasks that planning defined"
      owned_by: "my-interface-developer"
      may_write:
        - "Files under the active phase target's code_path, limited to the touches of the claimed task"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task only"
        - ".interface/config/state.yaml — active, per transitions S2 and S4 in its own content.state_authority, and blockers and open questions"
      may_not_write:
        - "A code_path not selected by the active phase target"
        - "A frozen contract"
        - "task_schema, task_states, phase plan identity and structure, and every field of a task other than status, blocker, and log"
        - "root.yaml, .interface/config/definition.yaml, the item files, and schema/"
      plan_change: "Changing a task requires the reason written into that task's log and human approval"

    review:
      purpose: "Read the result and report — nothing is repaired in this mode"
      owned_by: "my-interface-reviewer"
      may_write:
        - ".interface/config/state.yaml — active, per transitions S3 and S4 in its own content.state_authority, and blockers and open questions"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task, to mark it blocked and record what was found"
      may_not_write:
        - "Anything else"

  # <!-------------------------------------------- Agent_Skills -->
  agent_skills:

    interpreter:
      name: "my-interface-interpreter"
      path: ".claude/skills/my-interface-interpreter/"
      responsibility: "Understands project.md as an ordered set of project phases, resolves each referenced phase target's local policy and preferences, and generates project configuration according to the Schemas"
      state: "Runs outside the modes — transitions S0, S7, and S8. S0 creates state.yaml with content.state_authority seeded verbatim from the default in schema/state.schema.yaml; a regeneration carries the existing active values and the live State Authority through untouched"

    tasker:
      name: "my-interface-tasker"
      path: ".claude/skills/my-interface-tasker/"
      responsibility: "Generates the implementation plan and Tasks for the one project phase named by the Developer, resolving its target item from the Understanding"
      state: "Owns planning mode — transitions S1, S4, S7, S8"

    developer:
      name: "my-interface-developer"
      path: ".claude/skills/my-interface-developer/"
      responsibility: "Executes planned Tasks for the one project phase named by the Developer, writing only within that phase target's code boundary"
      state: "Owns development mode — transitions S2, S4, S7, S8"

    reviewer:
      name: "my-interface-reviewer"
      path: ".claude/skills/my-interface-reviewer/"
      responsibility: "Reviews the one project phase named by the Developer against its Tasks and generated Understanding"
      state: "Owns review mode — transitions S3, S4, S7, S8, and the validation checks in the State contract"

    clear:
      name: "my-interface-clear"
      path: ".claude/skills/my-interface-clear/"
      responsibility: "Runs a bundled script that empties .interface/config/ and removes only the root backend/, frontend/, and database/ directories"
      state: "Transition S5. Invoking my-interface-clear by name authorizes its four fixed deletion targets without a second confirmation; it writes no State field because state.yaml is removed with the Config contents"

    reset:
      name: "my-interface-reset"
      path: ".claude/skills/my-interface-reset/"
      responsibility: "Resets the whole generated Task workflow to the stage before development or before planning without deleting project code or generated Understanding"
      state: "Runs outside the modes under transition S9. Development reset returns every Task to todo and State to planning; planning reset removes every generated Task and returns State to not set; both clear all current State blockers and open questions"

    skill_installer:
      name: "my-interface-skill-installer"
      path: ".claude/skills/my-interface-skill-installer/"
      responsibility: "Discovers and installs compatible AI Agent Skills for technologies represented in the generated project configuration"
      state: "Runs outside the modes as a supporting Skill. It does not write Interface Config or State"
