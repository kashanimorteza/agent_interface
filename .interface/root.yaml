# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/root.yaml"
  path_note: "The entry point of the Agent Project Interface — the only file an agent finds without guidance"
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-08-29"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "This file introduces the interface — every other file carries its own write rules, in its own policy section"
  by_mode: "What may be written where is decided per mode — see content.modes"
  on_change_needed: "A change to the structure, the skills, or the modes is raised with the human, never applied by an agent"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "files_and_folders"
  - "modes"
  - "agent_skills"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  files_and_folders: "The folders and files of the interface, and what each is for"
  agent_skills: "The Skills that exist, one line each"
  modes: "The working modes, and what each may write"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- files_and_folders -->
  files_and_folders:

    root:
      path: ".interface/root.yaml"
      responsibility: "Entry point and map of the Agent Project Interface"

    project:
      path: ".interface/project.md"
      responsibility: "Human-readable project definition provided by the Developer"

    schema:
      path: ".interface/schema/"
      responsibility: "Defines the structure and format of each Interface file"

      files:
        - path: "definition.schema.yaml"
          responsibility: "Defines the structure and format of definition.yaml"

        - path: "rules.schema.yaml"
          responsibility: "Defines the structure and format of rules.yaml"

        - path: "task.schema.yaml"
          responsibility: "Defines the structure and format of task.yaml"

        - path: "state.schema.yaml"
          responsibility: "Defines the structure and format of state.yaml"

        - path: "backend.schema.yaml"
          responsibility: "Defines the structure and format of backend.yaml"

        - path: "frontend.schema.yaml"
          responsibility: "Defines the structure and format of frontend.yaml"

    config:
      path: ".interface/config/"
      responsibility: "Contains the project configuration generated after understanding project.md"

      files:
        - path: "definition.yaml"
          responsibility: "Project definition in structured format"

        - path: "rules.yaml"
          responsibility: "Project and Agent rules"

        - path: "task.yaml"
          responsibility: "Project tasks and plans"

        - path: "state.yaml"
          responsibility: "Current project state"

        - path: "backend.yaml"
          responsibility: "Backend project configuration"

        - path: "frontend.yaml"
          responsibility: "Frontend project configuration"


  # <!-------------------------------------------- Modes -->
  modes:

    rule: "Exactly one mode is active at a time — it is named in config/state.yaml under active.mode"
    set_by: "The human — an agent never changes the active mode"

    planning:
      purpose: "Decide what will be built and in what order — no product code is written"
      may_write:
        - ".interface/config/backend.yaml and config/frontend.yaml — settings and draft contracts, never a frozen contract"
        - ".interface/config/task.yaml — the phases of an item's plan only"
        - ".interface/config/state.yaml — blockers and open questions, never active"
      may_not_write:
        - "Any file under an item's code_path"
        - "A frozen contract"
        - "root.yaml, .interface/config/definition.yaml, .interface/config/rules.yaml, and schema/"

    development:
      purpose: "Implement the tasks that planning defined"
      may_write:
        - "Files under the active item's code_path, limited to the touches of the claimed task"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task only"
        - ".interface/config/state.yaml — blockers and open questions, never active"
      may_not_write:
        - "Another item's code_path"
        - "A frozen contract"
        - "root.yaml, .interface/config/definition.yaml, .interface/config/rules.yaml, the item files, and schema/"
      plan_change: "Changing a task requires the reason written into that task's log and human approval"

    review:
      purpose: "Read the result and report — nothing is repaired in this mode"
      may_write:
        - ".interface/config/state.yaml — blockers and open questions only"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task, to mark it blocked and record what was found"
      may_not_write:
        - "Anything else"

  # <!-------------------------------------------- Agent_Skills -->
  agent_skills:

    configurator:
      name: "my_skl_configurator"
      path: ".claude/skills/my_skl_configurator/"
      responsibility: "Understands project.md and generates the project configuration according to the Schemas"

    planner:
      name: "my_skl_planner"
      path: ".claude/skills/my_skl_planner/"
      responsibility: "Generates project Tasks and plans from the project configuration"

    developer:
      name: "my_skl_developer"
      path: ".claude/skills/my_skl_developer/"
      responsibility: "Executes planned Tasks and implements the required changes"

    reviewer:
      name: "my_skl_reviewer"
      path: ".claude/skills/my_skl_reviewer/"
      responsibility: "Reviews the implementation against the Tasks and project specifications"