# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/root.yaml"
  path_note: "Entry point of the Agent Project Interface — the only file an agent finds without guidance"
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-08-29"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "This file holds no write protocol for results — every other file carries its own write rules in its own policy section"
  by_mode: "What may be written where is decided per mode — see content.modes"
  on_change_needed: "A change to the structure, the skills, or the modes is raised with the human, never applied by an agent"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - read: "project"
    why: "What is being built"
  - read: "structure"
    why: "Where every file lives and what it is for"
  - read: "skills"
    why: "Which Skill carries which stage"
  - read: "modes"
    why: "What may be written right now"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  project: "The project this interface governs, and where its definition lives"
  structure: "Every folder and file of the interface, and the purpose of each"
  skills: "The Skills that carry the stages of the workflow"
  modes: "The working modes and what each may write"


# <!--------------------------------------------------------------------------------- Content -->
content:

  project:
    name: "Trading Assistant"
    purpose: "A platform for defining and managing trading information, strategies, actions, and related data"
    definition: ".interface/project.md"
    phase: "Phase 1 — data entry and management"


  structure:

    project_md:
      path: ".interface/project.md"
      purpose: "The project definition in natural language — what the application does, phase by phase"
      owner: "human"

    schema:
      path: ".interface/schema/"
      purpose: "The shape of every config file — its sections, their order, and the meaning of each parameter"
      owner: "human"
      files:
        "file.schema.yaml": "The outer shape every interface file follows"
        "definition.schema.yaml": "Shape of config/definition.yaml"
        "rules.schema.yaml": "Shape of config/rules.yaml"
        "backend.schema.yaml": "Shape of config/backend.yaml"
        "frontend.schema.yaml": "Shape of config/frontend.yaml"
        "task.schema.yaml": "Shape of config/task.yaml"
        "state.schema.yaml": "Shape of config/state.yaml"

    config:
      path: ".interface/config/"
      purpose: "The project's understanding, generated from project.md against schema/ — what an agent plans and builds from"
      owner: "my-interface-configurator"
      files:
        "definition.yaml": "Product definition — identity, goals, architecture"
        "rules.yaml": "Every rule governing agent behavior — no rule lives anywhere else"
        "backend.yaml": "The backend item — its settings and the contracts it produces or consumes"
        "frontend.yaml": "The frontend item — its settings and the contracts it produces or consumes"
        "task.yaml": "The shape of a task, its states, and one plan per item"
        "state.yaml": "Active mode, active item, blockers, and open questions"

    claude:
      path: ".claude/"
      purpose: "How the agent is wired to this interface — Skills, subagent, rules, output style, permissions"
      files:
        "skills/": "The Skills of the workflow — see content.skills"
        "agents/interface-reader.md": "Read-only subagent — reports mode, plans, ready tasks, blockers, and open questions"
        "rules/interface-files.md": "The rules that apply when editing anything under .interface/"
        "output-styles/interface-review.md": "Every claim about the project cites the file and section it came from"
        "settings.json": "Permissions — project.md and schema/ are denied, definition.yaml and rules.yaml are asked"


  skills:
    path: ".claude/skills/"

    my-interface-configurator:
      purpose: "Reads project.md and schema/, and generates config/"
      mode: "none — runs before planning"

    my-interface-planner:
      purpose: "Reads config/, and writes the tasks and the plan into config/task.yaml"
      mode: "planning"

    my-interface-developer:
      purpose: "Implements the planned tasks under the active item's code_path"
      mode: "development"

    my-interface-reviewer:
      purpose: "Checks the result against the plan, the contracts, and rules.yaml, and reports"
      mode: "review"


  modes:
    rule: "Exactly one mode is active at a time — it is named in config/state.yaml under active.mode"
    set_by: "The human — an agent never changes the active mode"

    planning:
      purpose: "Decide what will be built and in what order — no product code is written"
      may_write:
        - "config/backend.yaml and config/frontend.yaml — settings and draft contracts, never a frozen contract"
        - "config/task.yaml — the phases of an item's plan only"
        - "config/state.yaml — blockers and open questions, never active"
      may_not_write:
        - "Any file under an item's code_path"
        - "A frozen contract"
        - "root.yaml, config/definition.yaml, config/rules.yaml, and schema/"

    development:
      purpose: "Implement the tasks that planning defined"
      may_write:
        - "Files under the active item's code_path, limited to the touches of the claimed task"
        - "config/task.yaml — the status, blocker, and log fields of a task only"
        - "config/state.yaml — blockers and open questions, never active"
      may_not_write:
        - "Another item's code_path"
        - "A frozen contract"
        - "root.yaml, config/definition.yaml, config/rules.yaml, the item files, and schema/"
      plan_change: "Changing a task requires the reason written into that task's log and human approval"

    review:
      purpose: "Read the result and report — nothing is repaired in this mode"
      may_write:
        - "config/state.yaml — blockers and open questions only"
        - "config/task.yaml — the status, blocker, and log fields of a task, to mark it blocked and record what was found"
      may_not_write:
        - "Anything else"
