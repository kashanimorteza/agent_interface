# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/root.yaml"
  path_note: "The entry point of the Agent Project Interface — the only file an agent finds without guidance"
  standard: "Agent Project Interface"
  version: "4.0"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file introduces the interface — no mode edits it. Every other file carries its own write rules, in its own policy section"
  changed_by: "The human, directly. A change this file needs is raised as an open question in config/state.yaml, never applied by an agent"
  by_mode: "What may be written where is decided per mode — see content.modes"
  state_authority: "Who may write each field of config/state.yaml, and on which transition, is decided in one place only — the State contract: config/state.yaml under content.state_authority, seeded from the default in schema/state.schema.yaml. This file references the State contract and does not own it"
  on_change_needed: "A change to the Interface structure or modes is raised with the human, never applied by an agent"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "files_and_folders"
  - "modes"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  files_and_folders: "The folders and files of the interface, and what each is for"
  modes: "The working modes, and what each may write"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- files_and_folders -->
  files_and_folders:

    root:
      path: ".interface/root.yaml"
      responsibility: "Entry point and map of the Agent Project Interface"

    readme:
      path: ".interface/readme.md"
      responsibility: "Human-readable introduction, structure, workflow, and Quick Start for the Agent Project Interface"

    project:
      path: ".interface/project.md"
      responsibility: "Human-readable project definition provided by the Developer"

    principles:
      path: ".interface/principles/"
      responsibility: "Holds each project item's mandatory principles — the fixed rules and convictions that govern the item independently of any tool, version, or project. A preference never overrides a principle"

      files:
        - path: "definition.md"
          responsibility: "The principles of the definition layer — what belongs to the project definition and why phases are the units of work"

        - path: "development.md"
          responsibility: "The principles of the development layer — connecting selected items without redefining them, component selection, connections, and item authority"

        - path: "state.md"
          responsibility: "The principles of the State contract — what State holds, the live file as authority, and verbatim seeding of the default"

        - path: "task.md"
          responsibility: "The principles of the task layer — the human-fixed frame, plans from project phases, and shape versus permission"

        - path: "backend.md"
          responsibility: "The principles of the backend item — database boundary, model API resolution, credential handling, package and version resolution"

        - path: "frontend.md"
          responsibility: "The principles of the frontend item — the HTTP API as the only data door, shared models, package resolution"

        - path: "database.md"
          responsibility: "The principles of the database item — engine independence, schema as code, migrations, ownership, contracts, and access rules"

    preferences:
      path: ".interface/preferences/"
      responsibility: "Holds each project item's supported technical choices — tools, versions, and defaults used only when project.md leaves the choice unstated. Explicit project values always win"

      files:
        - path: "backend.yaml"
          responsibility: "The backend item's preferences — languages, API frameworks, ORMs, database integrations, default model operations, and capability defaults. Follows the outer shape of schema/file.schema.yaml"

        - path: "frontend.yaml"
          responsibility: "The frontend item's preferences — languages, UI libraries, frameworks, package managers, and capability defaults. Follows the outer shape of schema/file.schema.yaml"

        - path: "database.yaml"
          responsibility: "The database item's preferences — engines, migration tooling, relationship defaults, credential storage modes, and capability defaults. Follows the outer shape of schema/file.schema.yaml"

    schema:
      path: ".interface/schema/"
      responsibility: "Defines generated-file shapes only. Each layer's mandatory rules live in principles/, and each technical item's supported choices live in preferences/"

      files:
        - path: "file.schema.yaml"
          responsibility: "Defines the outer shape every interface file follows — meta, policy, read_order, content_map, content"

        - path: "definition.schema.yaml"
          responsibility: "Defines the shape of definition.yaml — its principles live in principles/definition.md"

        - path: "model.schema.yaml"
          responsibility: "Defines the shared structure and format of model.yaml"

        - path: "development.schema.yaml"
          responsibility: "Defines the shape of development.yaml — technical composition, cross-item connections, runtime, and deployment; its principles live in principles/development.md"

        - path: "task.schema.yaml"
          responsibility: "Defines the shape of task.yaml — its principles live in principles/task.md"

        - path: "state.schema.yaml"
          responsibility: "Defines the shape of state.yaml — the State contract — and the default State Authority seeded into every newly created state.yaml; its principles live in principles/state.md"

        - path: "backend.schema.yaml"
          responsibility: "Defines the shape of backend.yaml only — its principles and preferences live in principles/backend.md and preferences/backend.yaml"

        - path: "frontend.schema.yaml"
          responsibility: "Defines the shape of frontend.yaml only — its principles and preferences live in principles/frontend.md and preferences/frontend.yaml"

        - path: "database.schema.yaml"
          responsibility: "Defines the shape of database.yaml only — its principles and preferences live in principles/database.md and preferences/database.yaml"

    config:
      path: ".interface/config/"
      responsibility: "Contains the project configuration generated after understanding project.md"

      files:
        - path: "definition.yaml"
          responsibility: "Project identity, intended outcomes, and ordered project phases in structured format"

        - path: "model.yaml"
          responsibility: "Shared logical models, fields, relationships, rules, and initial data consumed by mapped technical items"

        - path: "development.yaml"
          responsibility: "Technical composition, cross-item connections, runtime, and deployment choices"

        - path: "task.yaml"
          responsibility: "Project tasks and plans"

        - path: "state.yaml"
          responsibility: "Current project state, and the live State Authority that governs it"

        - path: "backend.yaml"
          responsibility: "Backend project configuration"

        - path: "frontend.yaml"
          responsibility: "Frontend project configuration"

        - path: "database.yaml"
          responsibility: "Database project configuration and the database contract consumed by the backend"


  # <!-------------------------------------------- Modes -->
  modes:

    rule: "Exactly one mode is active at a time — it is named in config/state.yaml under active.mode"
    set_by: "The human selects the requested workflow operation; the authorized operation records its mode and phase according to the State contract in config/state.yaml under content.state_authority. No operation chooses a mode on the human's behalf."
    entered_by: "A working phase mode is entered by its matching operation: planning, development, or review. The reset operation may return the global workflow to planning with no active phase; it does not perform a planning run."

    planning:
      purpose: "Decide what will be built and in what order — no product code is written"
      owned_by: "planning operation"
      may_write:
        - "The mapped item configuration selected by the requested phase's target in definition.yaml — planning-owned settings, relationships, and draft contracts only, never a frozen contract"
        - ".interface/config/task.yaml — the plan for the one project phase named by the invocation"
        - ".interface/config/state.yaml — active, per transitions S1 and S4 in its own content.state_authority, and blockers and open questions"
      may_not_write:
        - "Any file under the code_path of the requested phase's target"
        - "A frozen contract"
        - "The requested phase's id, title, order, target, or goal in config/definition.yaml"
        - "root.yaml, .interface/config/definition.yaml, .interface/config/model.yaml, .interface/config/development.yaml, and schema/"

    development:
      purpose: "Implement the tasks that planning defined"
      owned_by: "development operation"
      may_write:
        - "Files under the code_path of the active phase's target, limited to the touches of the claimed task"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task only"
        - ".interface/config/state.yaml — active, per transitions S2 and S4 in its own content.state_authority, and blockers and open questions"
      may_not_write:
        - "A code_path not selected by the active phase's target in definition.yaml"
        - "A frozen contract"
        - "task_schema, task_states, phase plan identity and structure, and every field of a task other than status, blocker, and log"
        - "root.yaml, .interface/config/definition.yaml, .interface/config/model.yaml, .interface/config/development.yaml, the item files, and schema/"
      plan_change: "Changing a task requires the reason written into that task's log and human approval"

    review:
      purpose: "Read the result and report — nothing is repaired in this mode"
      owned_by: "review operation"
      may_write:
        - ".interface/config/state.yaml — active, per transitions S3 and S4 in its own content.state_authority, and blockers and open questions"
        - ".interface/config/task.yaml — the status, blocker, and log fields of a task, to mark it blocked and record what was found"
      may_not_write:
        - "Anything else"
