# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/backend/preferences.yaml"
  path_note: "The Preferences layer of the Backend Component — supported technical choices and defaults used when a Backend choice is unstated."
  purpose: "Defaults and supported technical profiles for the independent Backend package, its Model Interface, Database Interface, Logic, API Interface, and API framework."
  standard: "Agent Project Interface"
  version: "6.5"
  updated: "2026-09-13"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Backend choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Backend Principle take precedence over this file."
  consumption: "Operations resolve the selected language profile and its embedded environment and API framework from these defaults and the current project definition. For every selected profile involved in the work, they resolve its agent_skills associations through the synchronized Runtime capability catalog and use each applicable Skill according to its requirement and current verified availability; only Agent Sync reads Agent Module declarations."
  selection: "Prefer a supported compatible entry. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Backend stack; implementation records use the resolved concrete version."
  matching: "Match the selected language to its exact entry under options.languages and resolve its embedded environment and API framework as parts of that coherent language profile. An explicit project value takes priority over the corresponding profile value. Match each agent_skills resource exactly to its dotted entry in the synchronized Runtime capability catalog; the association never defines the Skill or proves that it is usable."
  environment_handling: "Create and use the selected isolated environment through its resolved tool, and do not commit environment artifacts."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The selected Backend language profile."
  options: "Supported Backend language profiles. Each language contains its version, environment, API framework, and associated Agent Skills."
  settings: "Configuration grouped by Model Interface, Database Interface, Logic, and API Interface."
  implementation: "Empty. Concrete Backend implementation decisions are resolved from the Target, this Standard, and the selected compatible technical profile."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    language: "Python"

  # <!-------------------------------------------- options -->
  options:

    languages:
      Python:
        version: "latest"
        naming:
          variables: "snake_case"
          functions: "snake_case"
          classes: "PascalCase"
          constants: "UPPER_SNAKE_CASE"
          files: "snake_case"
          folders: "snake_case"
        environment:
          name: "uv"
          version: "latest"
        api_framework:
          name: "FastAPI"
          version: "latest"
          packages:
            framework: "fastapi[standard]"
            validation: "pydantic>=2,<3"
            settings: "pydantic-settings"
            http_testing: "httpx"
          agent_skills:
            - resource: "project_skills.contextual.fastapi"
              requirement: "required"
              activation: "when_selected"
              purpose: "Apply the complete applicable FastAPI guidance while implementing and independently reviewing the selected API framework and its durable checks."

  # <!-------------------------------------------- settings -->
  settings:

    model_interface: {}

    database_interface: {}

    logic:
      standard_model_operations:
        - "create"
        - "get"
        - "list"
        - "update"
        - "delete"
        - "activation"
      model_logic_layout:
        unit_per_model: true
        file_per_model: true
        file_name: "<model>"
        file_naming: "options.languages.<language>.naming.files"
        file_extension: "language_default"
        shared_definition_file: false
        registry_may_import_units: true

    api_interface:
      transport:
        protocol: "HTTP"
      api_documentation:
        enabled: true
        type: "OpenAPI"
      expose_standard_model_operations: true

  # <!-------------------------------------------- implementation -->
  implementation: {}
