# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/backend/preferences.yaml"
  path_note: "The Preferences layer of the Backend Component — Backend-owned behavioural defaults and internal realization conventions."
  purpose: "Configurable defaults for Backend's four parts, Logic organization, API contract, reliability, security boundaries, lifecycle, and verification."
  standard: "Agent Project Interface"
  version: "7.0"
  updated: "2026-09-14"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Backend choices back into it."
  changed_by: "The human, directly. A missing critical Backend choice is raised through State."
  precedence: "An explicit Target value and every applicable Backend Principle take precedence over this file."
  consumption: "Resolve Backend's Component Profile, language-owned Technical Purposes, Connections, and Platform Launch Item from Development first. Apply this file only to Backend-owned behavioural defaults and internal realization conventions. Resolve environment-specific Runtime Bindings from Platform and never copy concrete technical or Platform values into this file."
  selection: "Use a compatible configured Backend default when the Target is silent. For an explicit incompatible need, preserve Target intent under Backend Principles and record the consequential realization choice; ask only when no safe compatible choice can be established."
  version_resolution: "This file owns Public API versioning but no versioned implementation technology. Development resolves every language, framework, package, tool, and Package Management version."
  matching: "Match standards and Backend settings by their exact keys. Match Model Logic files to public Model identities, enable and disable only to Models declaring is_active, delete only to Target-authorized Models, and idempotency only to Target-selected operations."
  architecture_standard:
    required: true
    rule: "Backend must follow the selected architecture standard as completely as possible while preserving the Target, Backend Principles, and every owning Component boundary."
    deviation: "Any necessary deviation must be documented with the implementation."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns Backend's configurable Component Profile and technical selections."
  options: "Empty. Development owns concrete technical alternatives; Backend standards and behavioural choices are under settings."
  settings: "Backend-owned standards and defaults grouped by Model Interface, Database Interface, Logic, API Interface, runtime behaviour, and verification."
  implementation: "Empty. Concrete implementation resolves the Target, Backend Principles, Development technical selections, Platform Bindings, and these defaults."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    standards:
      architecture:
        selected: "Hexagonal Architecture"
        options:
          - "Hexagonal Architecture"
          - "Clean Architecture"

    model_interface: {}

    database_interface: {}

    logic:
      standard_model_operations:
        - "create"
        - "get_by_id"
        - "list"
        - "update"
        - "delete"
        - "enable"
        - "disable"
      logic_foundation:
        name: "ModelLogicBase"
        reuse_mechanism: "inheritance"
        implements_standard_operations: true
        model_specific_behaviour: false
      model_logic_layout:
        unit_per_model: true
        file_per_model: true
        file_name: "<model>"
        file_naming: "Resolve from Backend's Development Language Item."
        file_extension: "Resolve from Backend's Development Language Item."
        inherits_from: "ModelLogicBase"
        implement_only_additional_behaviour: true
        registry_may_import_units: true
      use_case_logic:
        enabled: true
        purpose: "Coordinate Behaviour spanning multiple Models or supporting services."
        may_coordinate_model_logic: true
        owns_transaction_grouping: true
        bypass_interfaces: false
      deletion:
        requires_explicit_target_authorization: true
        inferred_from_is_active: false
      pagination:
        enabled: true
        strategy: "cursor"
        default_limit: 50
        maximum_limit: 100
        filtering: "explicitly allowlisted Fields only"
        sorting: "explicitly allowlisted Fields with stable ordering"
      authorization:
        owner: "Logic"
        enabled_when: "Development authentication applies to Backend or Target requires authorization."
      business_rate_limits:
        owner: "Logic"
        source: "Target-defined quotas and eligibility rules"

    api_interface:
      model_access:
        public_types_via: "Model Interface"
        direct_database_access: false
        transport_schemas: "Create only when input or output shape differs; never create a competing Domain Definition."
      api_documentation:
        enabled: true
        type: "OpenAPI"
      expose_standard_model_operations: true
      versioning:
        enabled: true
        strategy: "path"
        initial_version: "v1"
      credentials:
        input_only: true
        output: "excluded"
        documentation_values: "non-secret placeholders only"
      error_handling:
        expected_failures: "explicit Application Outcomes from Logic"
        unexpected_failures: "safe generic response"
        include_request_id: true
        expose_internal_details: false
      authentication:
        owner: "API Interface"
        output: "validated requester identity in Request Context"
      cors:
        policy: "allowlist"
        allowed_origins_source: "Platform Runtime Binding"
        wildcard_with_credentials: false
      health:
        enabled: true
        path: "/health"
        purpose: "Report that the Backend process is running without exposing dependency or secret details."
      readiness:
        enabled: true
        path: "/ready"
        purpose: "Report readiness only after required configuration and dependencies are usable."
      request_context:
        request_id:
          required: true
          accept_valid_incoming: true
          generate_when_absent: true
          include_in_error_response: true
          sensitive_data: false
      idempotency:
        enabled_when: "A Target operation is selected as sensitive to repeated execution."
        key: "idempotency_key"
        atomic_result_recording: true

    runtime:
      configuration:
        contract_owner: "Backend"
        values_source: "Platform Runtime Binding"
        validate_before_readiness: true
        fail_fast_on_missing_required_values: true
        secrets_in_source_or_documentation: false
      reliability:
        finite_timeouts_required: true
        retry:
          bounded: true
          only_safe_or_idempotent_operations: true
          unlimited: false
      lifecycle:
        startup_validation: true
        readiness_after_required_dependencies: true
        graceful_shutdown: true
        shutdown_deadline_source: "Platform Runtime Binding"
        resource_cleanup_owner: "Provider Component"
      observability:
        logging:
          enabled: true
          correlate_with_request_id: true
          include_credentials_or_secrets: false
          include_internal_details_in_external_responses: false
      public_interface:
        external_behaviour: "API Interface only"
        launch: "official executable entry point"
        verification: "supported application construction surface"
        internal_units_public: false

    verification:
      checks:
        - "isolated Logic tests"
        - "Model Interface contract"
        - "Database Interface contract"
        - "API validation, serialization, and outcome mapping"
        - "Authentication and authorization when enabled"
        - "Transaction grouping and idempotency when applicable"
        - "Credential and secret exclusion"
        - "pagination, filtering, and stable sorting"
        - "health, readiness, startup, and shutdown"
        - "request correlation and safe logging"
        - "machine-readable API contract consistency"
      unit_tests_use_live_dependencies: false

  # <!-------------------------------------------- implementation -->
  implementation: {}
