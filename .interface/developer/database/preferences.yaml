# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/database/preferences.yaml"
  path_note: "The Preferences layer of the Database Component — supported technical choices and defaults used when a Database choice is unstated."
  purpose: "Defaults and supported technical profiles for Database Instances, Engines, Database Interface, Data Logic, and Storage Adapter."
  standard: "Agent Project Interface"
  version: "2.0"
  updated: "2026-09-12"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Database Principle take precedence over this file."
  consumption: "Operations resolve unstated Database choices from these defaults and the current project definition. Implementation creates the default Instance when no explicit Instance is defined and records the resolved Engine catalogue, Instance catalogue, and default selection in Database's own application runtime configuration, not in Interface Config."
  selection: "Prefer a supported compatible entry. For an unlisted need, select a well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Database stack; implementation records use the resolved concrete version."
  matching: "Match a selected key to the entry of that key in the matching options catalogue. An explicit Instance engine takes precedence; otherwise the Instance inherits the resolved selected.engine. The marker <selected.engine> refers to that selection and is resolved to a concrete Engine binding in application configuration. For a field resolved as a credential, preserve any explicit project storage mode, then use its exact-name entry in settings.data_logic.credential_storage.field_defaults, falling back to selected.credential_storage_mode only when no field-specific default applies. These defaults neither add fields nor override an explicit non-credential classification."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The Database code path, Engine, ORM, migration tool, default Instance, and default credential at-rest mode."
  options: "Supported Database Engines, ORM implementations, migration tools, and credential at-rest modes."
  settings: "Configuration grouped by the Database Interface, Data Logic, and Storage Adapter layers, including declared Instances."
  implementation: "Technical safety, portability, migration, transaction, and observability preferences that complement Database Principles."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    package_name: "my_database"
    code_path: "my_database/"
    engine: "SQLite"
    orm: "SQLAlchemy"
    migration_tool: "Alembic"
    default_instance: "general"
    credential_storage_mode: "encrypted"
    portability_policy: "portable contract first; engine-specific extensions explicit"
    canonical_import_style: "import my_database; my_database.<public_module>.<operation>"
    model_import_source: "my_model public namespace"
    consumer_access: "public Database interface only"

  # <!-------------------------------------------- options -->
  options:

    engines:
      SQLite:
        version: "runtime-provided"
        driver:
          name: "sqlite3"
          version: "runtime-provided"
          package: null
        storage:
          kind: "file"
          location: "<code_path>/data/<database>.db"
          committed: false
        connection:
          url_scheme: "sqlite"
          parameters:
            - "database"
          foreign_keys: true
          check_same_thread: false
        naming:
          tables: "plural_snake_case"
          columns: "snake_case"
          constraints: "snake_case"
          indexes: "ix_<table>_<column>"

      PostgreSQL:
        version: "latest"
        driver:
          name: "psycopg"
          version: "latest"
          package: "psycopg"
        storage:
          kind: "server"
        connection:
          url_scheme: "postgresql+psycopg"
          default_port: 5432
          parameters:
            - "host"
            - "port"
            - "database"
            - "username_secret"
            - "password_secret"
        naming:
          tables: "plural_snake_case"
          columns: "snake_case"
          constraints: "snake_case"
          indexes: "ix_<table>_<column>"

      MySQL:
        version: "latest"
        driver:
          name: "PyMySQL"
          version: "latest"
          package: "PyMySQL"
        storage:
          kind: "server"
        connection:
          url_scheme: "mysql+pymysql"
          default_port: 3306
          parameters:
            - "host"
            - "port"
            - "database"
            - "username_secret"
            - "password_secret"
          charset: "utf8mb4"
        naming:
          tables: "plural_snake_case"
          columns: "snake_case"
          constraints: "snake_case"
          indexes: "ix_<table>_<column>"

    orms:
      SQLAlchemy:
        version: "latest"
        language: "Python"
        package: "SQLAlchemy"
        capabilities:
          model_mapping: true
          parameterized_sql: true

    migration_tools:
      Alembic:
        version: "latest"
        language: "Python"
        compatible_orms:
          - "SQLAlchemy"
        environment:
          name: "uv"
          version: "latest"
        packages:
          migration:
            name: "Alembic"
            version: "latest"
        commands:
          upgrade: "uv run alembic upgrade head"
          downgrade: "uv run alembic downgrade -1"

    credential_storage_modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
        allowed_for_credentials: false
        use_case: "Only explicitly classified non-credential data."
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "reversible_encryption"
        recoverable: true
        key_source: "Database's private runtime secret source, located and delivered under Development's layer-local secrets convention; never general configuration or Interface Config."

  # <!-------------------------------------------- settings -->
  settings:

    database_interface: {}

    data_logic:
      relationship_defaults:
        field_name: "<referenced_model>_id"
        role_field_name: "<role>_<referenced_model>_id"
        referenced_key: "primary_key"
        index: true
        on_delete: "RESTRICT"
        on_update: "RESTRICT"
      initial_data:
        enabled_when_present: true
      credential_storage:
        resolution: "For an existing field resolved as a credential, preserve any explicit project storage mode. Otherwise use its exact-name field_defaults entry, falling back to the selected credential_storage_mode only when no field-specific default applies. These defaults neither add fields nor override an explicit non-credential classification."
        field_defaults:
          password:
            mode: "hash"
          api_key:
            mode: "encrypted"

    storage_adapter:
      runtime_configuration:
        file: "Use Development's runtime_configuration.files.layer convention with layer = database and this Component's resolved code_path; its default resolves to <code_path>/database.yaml."
        sections:
          engines: "Resolved supported Engine profiles from options.engines and explicit compatible project choices, including driver, storage, and connection parameter settings. A profile denotes implemented adapter support, not a claim that its server is running; adding a configuration entry alone does not implement a new adapter."
          instances: "Resolved entries from storage_adapter.instances or explicit project Instances, keyed by stable identity, with name, purpose, Engine reference, database identity, and applicable non-secret connection settings or secret references."
          default_instance: "The resolved selected.default_instance, or explicit project selection, referring to exactly one configured Instance."
        ownership: "All Database-owned non-secret runtime settings belong in this layer-local file. Cross-layer bindings and secret values retain the separate locations and delivery rules defined by Development; do not duplicate them here."
        registry: "Build the public Instance Registry from the validated runtime Instance catalogue. Export it through the package's public interface alongside the Database gateway; expose selectable identities and the default, never raw connections or secret values."
        validation: "Before accepting data operations, validate Engine references and required Instance settings, and require the default to name an existing Instance. Reject an explicit unknown Instance; use the default only when selection is omitted. A connection failure never redirects an operation to another Instance."
        storage_paths: "Resolve file-backed Engine storage locations from this Component's code_path, independent of the process working directory. Under the default file-backed profile, data remains under <code_path>/data/. Server-backed Engines keep physical data on their configured server, not in the application package."
      backups:
        enabled: "environment-managed"
        required_for_irreversible_migrations: true
        restore_verification: "required before production use"
      instance_defaults:
        naming:
          key: "<role>"
          name: "<project> <role>"
          database: "<project>_<role>"
          normalization: "lower_snake_case"
        connection:
          host: "localhost"
          port: "engine_default"
        secrets:
          source: "Database's layer-local secret file under Development's runtime_configuration.files.secrets convention, overridden only by declared names from the runtime environment."
          username: "<PROJECT>_<INSTANCE>_DATABASE_USERNAME"
          password: "<PROJECT>_<INSTANCE>_DATABASE_PASSWORD"
          store_values_in_configuration: false
      instances:
        general:
          name: "<project> General"
          purpose: "General application data."
          engine: "<selected.engine>"
          database: "<project>_general"

  # <!-------------------------------------------- implementation -->
  implementation:
    mapping:
      persistent_model_required: true
      non_persistent_models_become_storage: false
      portable_contract_first: true
      engine_specific_extensions_must_be_declared: true
    migrations:
      integrity_marker: "checksum"
      drift_detection: "before normal operations"
      concurrent_runner_coordination: "engine-supported lock"
      irreversible_migration_requires: "explicit marker, verified backup, and recovery procedure"
      startup_schema_creation: false
    transactions:
      isolation: "engine-resolved and explicitly recorded"
      concurrency: "optimistic version check unless the resolved operation requires locking"
      retry_transient_conflicts: true
      retry_requires_idempotency: true
      distinguish_failures:
        - "deadlock"
        - "serialization_failure"
        - "timeout"
        - "connection_failure"
    controlled_sql:
      enabled: true
      capability_restricted: true
      parameterization_required: true
      identifiers: "internal allow-list or typed operation definition"
      structural_changes: false
      privilege_changes: false
      migration_commands: false
      protected_output: true
      separately_observable: true
    security:
      runtime_least_privilege: true
      secrets_in_logs: false
      credential_storage_exposed: false
      backups_follow_data_protection: true
    observability:
      record_connection_failures: true
      record_migration_failures: true
      record_constraint_violations: true
      record_transaction_conflicts: true
      record_protected_data_access_without_values: true
