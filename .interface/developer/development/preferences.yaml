# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/development/preferences.yaml"
  path_note: "The Preferences layer of the Development Component — package publication and Cross-cutting Capability defaults shared across the fixed Component catalogue."
  purpose: "Defaults for package publication and the applicability of shared Cross-cutting Capabilities."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-13"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Development choices back into it."
  changed_by: "The human, directly. A missing critical Development choice is raised through State instead of being written into this file."
  precedence: "An explicit project value and every applicable Development Principle take precedence over this file."
  consumption: "Use packages.publish when the project leaves package publication unstated. Resolve each Cross-cutting Capability from its applies_to list: an empty list is inactive, and a non-empty list applies only to the named Components. Do not write resolved values back into this file."
  selection: "Development catalogues no technical alternatives. When the project leaves a Development-owned choice unstated and this file supplies no default, use compatible professional judgment under Development Principles and record a consequential implementation choice with the implementation."
  version_resolution: "No entry here carries a version. Versions belong to the Preferences of the Component that owns the versioned technology."
  matching: "Match packages.publish by its exact key. Match a Cross-cutting Capability by its exact key and each applies_to value to one canonical Component identifier defined by Development Principles; values are unique within the list."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns no preferred technical profile."
  options: "Empty. Development catalogues no technical alternatives."
  settings: "The package publication default and Cross-cutting Capability applicability lists."
  implementation: "Empty. Component-specific realization remains owned by each participating Component."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    packages:
      publish: false

    cross_cutting:
      testing:
        applies_to: []
      logging:
        applies_to: []
      error_handling:
        applies_to: []
      authentication:
        applies_to: []

  # <!-------------------------------------------- implementation -->
  implementation: {}
