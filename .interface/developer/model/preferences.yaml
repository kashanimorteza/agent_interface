# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/model/preferences.yaml"
  path_note: "The Preferences layer of the Model Component — Model-owned Field defaults and technology-independent implementation conventions."
  purpose: "Defaults for properties of existing Model Fields and conceptual conventions for realizing the Model boundary."
  standard: "Agent Project Interface"
  version: "3.3"
  updated: "2026-09-13"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Model choices back into it."
  changed_by: "The human, directly. A missing critical Model choice is raised through State."
  precedence: "An explicit Model definition and every applicable Principle take precedence over this file."
  consumption: "Use Model's identity, language, and Platform Reference from its Component Profile in Development Preferences, then resolve the applicable language-owned Technical Purposes and Package Management from Development without assuming that a package is bound to Model. Apply Model Field defaults property by property only to Fields present in the Target definition, then apply the technology-independent implementation conventions in this file. Preserve every explicit property, including false and null, and never write resolved values back into this file."
  selection: "When the Target leaves a Model-owned choice unstated and this file supplies no default, use compatible professional judgment under Model Principles and record a consequential implementation choice with the implementation."
  version_resolution: "This file owns no versioned technology. Development Preferences resolve every versioned technical item assigned to Model."
  matching: "An explicit Model property takes priority, followed by an exact-name entry in field_defaults.common_fields, then a matching field_defaults.field_patterns entry. A default applies only to a missing property of an existing Field; otherwise no default applies. A name or pattern never creates a Field, relationship, or behavior."
  modeling_standard:
    required: true
    rule: "Model must follow the selected domain-modeling standard as completely as possible while preserving the Target and Model Principles."
    deviation: "Any necessary deviation must be documented with the implementation."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "Empty. Development owns Model's configurable profile and concrete selections."
  options: "Empty. Development catalogues Model's concrete technical alternatives and Platform reference."
  settings: "Defaults for missing properties of Fields already present in the Target's Model definition."
  implementation: "Technology-independent conventions for validation, precision, time, public references, unknown Fields, and verification."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected: {}

  # <!-------------------------------------------- options -->
  options: {}

  # <!-------------------------------------------- settings -->
  settings:

    standards:
      domain_modeling:
        selected: "DDD"
        options:
          - "DDD"
          - "UML Domain Modeling"
          - "Conceptual Data Modeling"

    field_defaults:
      purpose: "Defaults for missing properties of Fields already present in a Model definition."
      common_fields:
        id:
          type: "integer"
          nullable: false
          identity: true
          generated: true
        is_active:
          type: "boolean"
          nullable: false
          default: true
          purpose: "Indicates whether the domain item is active."
        description:
          type: "string"
          nullable: true
          purpose: "Describes the domain item."
      field_patterns:
        "*_id":
          match: "A Field name ending in _id; the exact name id is not included."
          defaults:
            type: "integer"
            nullable: false

  # <!-------------------------------------------- implementation -->
  implementation:
    validation:
      declarative_constraints_first: true
      custom_validation: "only when declarative constraints are insufficient"
      strictness: "enable when coercion could hide invalid domain data"
    numeric_precision:
      exact_values: "exact decimal representation"
      approximate_values: "only when explicitly permitted by the Target"
    time:
      absolute_instants: "timezone-aware"
      canonical_timezone: "UTC"
      naive_datetime: "only when explicitly required by the Target"
    public_interface:
      reference_priority:
        - "direct typed reference"
        - "module-qualified reference"
        - "string identifier only when necessary"
    unknown_fields: "reject"
    verification:
      checks:
        - "public interface"
        - "validation behavior"
        - "serialization and schema generation"
