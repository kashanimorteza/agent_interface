# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/platform/preferences.yaml"
  path_note: "The Preferences layer of the Platform Component — supported Instance and Launch choices and their defaults."
  purpose: "Technical choices for preparing a runtime Instance and bringing the completed Target online through a Launch."
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-09"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Platform choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit Target value and every applicable Platform Principle take precedence over this file."
  consumption: "Operations use these Preferences only when the Target leaves a Platform choice unstated."
  selection: "Use the selected default definition unless the Target explicitly selects another compatible option."
  version_resolution: "Resolve an unpinned version to a concrete compatible stable version and preserve an explicit concrete version."
  matching: "Match Instance and Launch choices to their applicable named definitions."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The default Instance and Launch definitions."
  options: "The supported named Instance and Launch definitions."
  settings: "Shared rules for applying Platform definitions."


# <!--------------------------------------------------------------------------------- Content -->
content:
  selected:
    instance: "linux"
    launch: null

  options:
    instances:
      linux:
        environment: "linux"
        system_packages:
          ensure_installed:
            - "net-tools"
            - "iptables"
          ensure_removed:
            - "ufw"
          install_additional_target_requirements: true
    launches: {}

  settings:
    instance:
      inspect_before_preparation: true
      preserve_satisfied_requirements: true
      install_only_missing_requirements: true
    launch: {}
