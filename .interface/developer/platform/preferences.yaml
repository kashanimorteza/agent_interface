# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/developer/platform/preferences.yaml"
  path_note: "The Preferences layer of the Platform Component — named Launch Items with their owned Environment and scoped Instructions."
  purpose: "Technical defaults for selecting and applying a complete launch definition to the Target."
  standard: "Agent Project Interface"
  version: "4.3"
  updated: "2026-09-14"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Platform choices back into it."
  changed_by: "The human, directly. A missing critical Platform choice is raised through State."
  precedence: "An explicit Target value and every applicable Platform Principle take precedence over this file."
  consumption: "Resolve selected.launch to its exact entry under options.launches, then apply that Launch Item's Environment and each non-empty instruction group as one coherent launch definition. Do not infer an action from an empty group and do not write resolved values back into this file."
  selection: "Use the selected Launch Item when the Target leaves the launch method unstated. For an explicit unlisted or incompatible need, select the smallest compatible definition and record the consequential choice; ask only when no safe compatible definition can be established."
  version_resolution: "Preserve every explicit concrete version. Resolve an unpinned version to a concrete compatible stable version when a versioned package or tool is added to a Launch Item."
  matching: "Match selected.launch to its exact key under options.launches, the Environment by the fields inside that item, and Instructions by their exact operating_system, frontend, backend, and database scope keys."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"
  - "implementation"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The default named Launch Item."
  options: "The supported named Launch Items, each containing its Environment and scoped Instructions."
  settings: "Empty. The complete current Platform configuration is owned by each Launch Item."
  implementation: "Empty. Platform currently declares no additional realization conventions."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    launch: "VPS"

  # <!-------------------------------------------- options -->
  options:
    launches:
      VPS:
        environment:
          operating_system: "Linux"
        instructions:
          operating_system:
            packages:
              install:
                - "net-tools"
                - "iptables"
              remove:
                - "ufw"
          frontend: {}
          backend:
            runtime_binding:
              host: "0.0.0.0"
              port: 8000
              transport:
                HTTP:
                  enabled: true
                HTTPS:
                  enabled: false
              cors:
                allowed_origins: []
              shutdown:
                graceful_timeout_seconds: 30
              infrastructure_rate_limiting:
                enabled: false
          database: {}

  # <!-------------------------------------------- settings -->
  settings: {}

  # <!-------------------------------------------- implementation -->
  implementation: {}
