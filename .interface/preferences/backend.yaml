# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/backend.yaml"
  path_note: "The Preferences layer of the Backend Component — supported technical choices and defaults used when a Backend choice is unstated."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Generation reads it and never writes resolved Backend choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Backend Principle take precedence over this file."
  consumption: "Generation resolves each unstated Backend choice from this file and records the concrete result in generated Backend configuration. Downstream operations consume that resolved result."
  selection: "Prefer a supported compatible entry. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Backend stack; latest never appears in generated configuration."
  environment_handling: "Create and use the selected isolated environment through its resolved tool, and do not commit environment artifacts."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "languages"
  - "api_frameworks"
  - "layers"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "Backend-wide code path and language defaults."
  languages: "Supported Backend languages, versions, environments, and naming conventions."
  api_frameworks: "Supported API frameworks and their versions."
  layers: "Technical defaults grouped by the Logic, Data Access, and API layers."


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "backend/"
    language: "Python"

  languages:
    Python:
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      naming:
        variables: "snake_case"
        functions: "snake_case"
        classes: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "snake_case"
        folders: "snake_case"
  api_frameworks:
    FastAPI:
      version: "latest"
      language: "Python"

  layers:
    logic:
      standard_model_operations:
        - "create"
        - "get"
        - "list"
        - "update"
        - "delete"
    data_access: {}
    api:
      framework: "FastAPI"
      transport:
        protocol: "HTTP"
      api_documentation:
        enabled: true
        type: "OpenAPI"
      expose_standard_model_operations: true
