# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/frontend.yaml"
  path_note: "The Preferences layer of the frontend item — the supported technical choices used only when project.md leaves a frontend choice unstated. Sits beside principles/frontend.md (the mandatory rules) and schema/frontend.schema.yaml (the shape of config/frontend.yaml)"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. No mode edits it; an agent reads it during generation and never writes a resolved value back into it"
  changed_by: "The human, directly. A preference an agent believes is missing or wrong is raised as an open question in config/state.yaml"
  precedence: "An explicit project value always wins over every value here. A preference never overrides a principle in principles/frontend.md — it only fills a choice the principles leave open"
  consumption: "The generation operation resolves each unstated choice from this file and writes the concrete result into config/frontend.yaml. Downstream operations read that resolved configuration and never reinterpret this file. The token latest is resolved to a concrete version and never appears in generated config"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "languages"
  - "libraries"
  - "frameworks"
  - "package_managers"
  - "capabilities"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "The item-level defaults — code path, test switch, responsibility, and the language, library, framework, and package manager selected when the project names none"
  languages: "One entry per supported language — version and naming conventions"
  libraries: "One entry per supported UI library — version and component style"
  frameworks: "One entry per supported application framework — version, router, and run command"
  package_managers: "One entry per supported package manager and its version"
  capabilities: "The default on/off state of optional frontend capabilities"


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "frontend/"
    needs_test: false
    responsibility: "Provides the user interface and consumes the backend's implemented HTTP API."
    language: "TypeScript"
    library: "React"
    framework: "Next.js"
    package_manager: "npm"
  languages:
    TypeScript:
      version: "latest"
      naming:
        variables: "camelCase"
        functions: "camelCase"
        classes: "PascalCase"
        components: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "kebab-case"
        folders: "kebab-case"
  libraries:
    React:
      version: "latest"
      component_style: "Function components"
  frameworks:
    Next.js:
      version: "latest"
      router: "App Router"
      run: "npm run dev"
  package_managers:
    npm:
      version: "latest"
  capabilities:
    testing:
      default_enabled: false
    logging:
      default_enabled: false
