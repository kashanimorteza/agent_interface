# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/frontend.yaml"
  path_note: "The Preferences layer of the Frontend Component — supported technical choices and defaults used when a Frontend choice is unstated."
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. No mode edits it; an agent reads it during generation and never writes a resolved value back into it"
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Frontend Principle take precedence over this file."
  consumption: "Generation resolves each unstated Frontend choice from this file and records the concrete result in generated Frontend configuration. Downstream operations consume that resolved result."
  selection: "Prefer a supported profile. For an unlisted need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Frontend stack; latest never appears in generated configuration."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "languages"
  - "libraries"
  - "frameworks"
  - "package_managers"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "The Component-level defaults — code path, language, library, framework, and package manager used when those choices are unstated"
  languages: "One entry per supported language — version and naming conventions"
  libraries: "One entry per supported UI library — version and component style"
  frameworks: "One entry per supported application framework — version, router, and run command"
  package_managers: "One entry per supported package manager and its version"


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "frontend/"
    language: "TypeScript"
    library: "React"
    framework: "Next.js"
    package_manager: "npm"
  languages:
    TypeScript:
      version: "latest"
      naming:
        variables: "camelCase"
        functions: "camelCase"
        classes: "PascalCase"
        components: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "kebab-case"
        folders: "kebab-case"
  libraries:
    React:
      version: "latest"
      component_style: "Function components"
  frameworks:
    Next.js:
      version: "latest"
      router: "App Router"
      run: "npm run dev"
  package_managers:
    npm:
      version: "latest"
