# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/database.yaml"
  path_note: "The Preferences layer of the Database Component — supported technical choices and defaults used when a Database choice is unstated."
  purpose: "The supported database technical choices and defaults used when the human project definition leaves a corresponding choice unstated."
  standard: "Agent Project Interface"
  version: "3.0"
  updated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. No operation edits it; generation reads it and never writes a resolved value back into it"
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Database Principle take precedence over this file."
  consumption: "Generation resolves each unstated Database choice from this file and records the concrete result in generated Database configuration. Downstream operations consume that resolved result."
  selection: "Prefer a supported compatible entry. For an unlisted need, select a well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Database stack; latest never appears in generated configuration."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "engines"
  - "orms"
  - "migration_tools"
  - "relationship_defaults"
  - "credential_storage"
  - "capabilities"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "The Component-level defaults — code path and the engine, ORM, and migration tool selected when those choices are unstated"
  engines: "One entry per supported engine — version, physical storage, connection behavior, and object naming conventions"
  orms: "One entry per supported ORM — language, package, version, and database-layer capabilities"
  migration_tools: "One entry per supported migration tool — language, isolated environment, packages, and canonical commands"
  relationship_defaults: "Field naming, referenced key, nullability, indexing, and referential actions used when a relationship leaves them unspecified"
  credential_storage: "The default at-rest mode for credential fields and the meaning of each supported mode"
  capabilities: "The default on/off state of optional database capabilities"


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "database/"
    engine: "SQLite"
    orm: "SQLAlchemy"
    migration_tool: "Alembic"
  engines:
    SQLite:
      version: "runtime-provided"
      storage:
        kind: "file"
        path: "app.db"
      connection:
        url_scheme: "sqlite"
        foreign_keys: true
        check_same_thread: false
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"
  orms:
    SQLAlchemy:
      version: "latest"
      language: "Python"
      package: "SQLAlchemy"
      capabilities:
        model_mapping: true
        parameterized_sql: true
  migration_tools:
    Alembic:
      version: "latest"
      language: "Python"
      compatible_orms:
        - "SQLAlchemy"
      environment:
        name: "uv"
        version: "latest"
      packages:
        migration:
          name: "Alembic"
          version: "latest"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"
  relationship_defaults:
    field_name: "<referenced_model>_id"
    role_field_name: "<role>_<referenced_model>_id"
    referenced_key: "primary_key"
    nullable: false
    index: true
    on_delete: "RESTRICT"
    on_update: "RESTRICT"
  credential_storage:
    default: "plaintext"
    modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "reversible_encryption"
        recoverable: true
        key_source: "Runtime configuration outside the database and generated Interface files."
  capabilities:
    seed_data:
      default_enabled: false
    backups:
      default_enabled: false
