# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/database.yaml"
  path_note: "The Preferences layer of the Database Component — supported technical choices and defaults used when a Database choice is unstated."
  purpose: "Defaults and supported technical profiles for the Database Interface, Data Logic, and Storage Adapter layers."
  standard: "Agent Project Interface"
  version: "4.0"
  updated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Generation reads it and never writes resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Database Principle take precedence over this file."
  consumption: "Generation resolves each unstated Database choice from this file and records the concrete result in generated Database configuration. Downstream operations consume that resolved result."
  selection: "Prefer a supported compatible entry. For an unlisted need, select a well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Database stack; latest never appears in generated configuration."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "layers"
  - "engines"
  - "orms"
  - "migration_tools"
  - "credential_storage"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "Database-wide defaults."
  layers: "Technical defaults grouped by Database Interface, Data Logic, and Storage Adapter."
  engines: "Supported Database Engines and their physical storage, connection, and naming profiles."
  orms: "Supported ORM implementations and capabilities."
  migration_tools: "Supported migration tools, environments, packages, and canonical commands."
  credential_storage: "Supported at-rest modes for fields marked as credentials."


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "database/"

  layers:
    database_interface: {}
    data_logic:
      relationship_defaults:
        field_name: "<referenced_model>_id"
        role_field_name: "<role>_<referenced_model>_id"
        referenced_key: "primary_key"
        nullable: false
        index: true
        on_delete: "RESTRICT"
        on_update: "RESTRICT"
      initial_data:
        enabled_when_present: true
    storage_adapter:
      engine: "SQLite"
      orm: "SQLAlchemy"
      migration_tool: "Alembic"
      credential_storage_mode: "plaintext"
      backups:
        enabled: false

  engines:
    SQLite:
      version: "runtime-provided"
      storage:
        kind: "file"
        path: "app.db"
      connection:
        url_scheme: "sqlite"
        foreign_keys: true
        check_same_thread: false
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"

  orms:
    SQLAlchemy:
      version: "latest"
      language: "Python"
      package: "SQLAlchemy"
      capabilities:
        model_mapping: true
        parameterized_sql: true

  migration_tools:
    Alembic:
      version: "latest"
      language: "Python"
      compatible_orms:
        - "SQLAlchemy"
      environment:
        name: "uv"
        version: "latest"
      packages:
        migration:
          name: "Alembic"
          version: "latest"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"

  credential_storage:
    modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "reversible_encryption"
        recoverable: true
        key_source: "Runtime configuration outside Database and generated Interface files."
