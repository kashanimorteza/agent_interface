# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/database.yaml"
  path_note: "The Preferences layer of the Database Component — supported technical choices and defaults used when a Database choice is unstated."
  purpose: "Defaults and supported technical profiles for Database Instances, Engines, Database Interface, Data Logic, and Storage Adapter."
  standard: "Agent Project Interface"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Generation reads it and never writes resolved Database choices back into it."
  changed_by: "The human, directly. A missing critical technical choice is raised through State."
  precedence: "An explicit project value and every applicable Database Principle take precedence over this file."
  consumption: "Generation resolves each unstated Database choice from this file, creates the default Instance when no explicit Instance is defined, and records the concrete result in generated Database configuration. Downstream operations consume that resolved result."
  selection: "Prefer a supported compatible entry. For an unlisted need, select a well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established."
  version_resolution: "Preserve an explicit concrete version. Resolve latest to a concrete stable version compatible with the complete selected Database stack; latest never appears in generated configuration."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "defaults"
  - "instance_defaults"
  - "instances"
  - "layers"
  - "engines"
  - "orms"
  - "migration_tools"
  - "credential_storage"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  defaults: "Database-wide code path and default-Instance selection."
  instance_defaults: "Naming, configuration, and secret-reference defaults shared by Database Instances."
  instances: "Default Instances created only when the project defines no explicit replacement."
  layers: "Technical defaults grouped by Database Interface, Data Logic, and Storage Adapter."
  engines: "Supported Database Engines and their physical storage, connection, and naming profiles."
  orms: "Supported ORM implementations and capabilities."
  migration_tools: "Supported migration tools, environments, packages, and canonical commands."
  credential_storage: "Field-name defaults and supported at-rest modes for fields marked as credentials."


# <!--------------------------------------------------------------------------------- Content -->
content:

  defaults:
    code_path: "database/"
    default_instance: "general"

  instance_defaults:
    naming:
      key: "<role>"
      name: "<project> <role>"
      database: "<project>_<role>"
      normalization: "lower_snake_case"
    connection:
      host: "localhost"
      port: "engine_default"
    secrets:
      source: "environment"
      username: "<PROJECT>_<INSTANCE>_DATABASE_USERNAME"
      password: "<PROJECT>_<INSTANCE>_DATABASE_PASSWORD"
      store_values_in_configuration: false

  instances:
    general:
      name: "<project> General"
      purpose: "General application data."
      engine: "SQLite"
      database: "<project>_general"

  layers:
    database_interface: {}
    data_logic:
      relationship_defaults:
        field_name: "<referenced_model>_id"
        role_field_name: "<role>_<referenced_model>_id"
        referenced_key: "primary_key"
        nullable: false
        index: true
        on_delete: "RESTRICT"
        on_update: "RESTRICT"
      initial_data:
        enabled_when_present: true
    storage_adapter:
      engine: "SQLite"
      orm: "SQLAlchemy"
      migration_tool: "Alembic"
      credential_storage_mode: "plaintext"
      backups:
        enabled: false

  engines:
    SQLite:
      version: "runtime-provided"
      driver:
        name: "sqlite3"
        version: "runtime-provided"
        package: null
      storage:
        kind: "file"
      connection:
        url_scheme: "sqlite"
        parameters:
          - "database"
        foreign_keys: true
        check_same_thread: false
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"

    PostgreSQL:
      version: "latest"
      driver:
        name: "psycopg"
        version: "latest"
        package: "psycopg"
      storage:
        kind: "server"
      connection:
        url_scheme: "postgresql+psycopg"
        default_port: 5432
        parameters:
          - "host"
          - "port"
          - "database"
          - "username_secret"
          - "password_secret"
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"

    MySQL:
      version: "latest"
      driver:
        name: "PyMySQL"
        version: "latest"
        package: "PyMySQL"
      storage:
        kind: "server"
      connection:
        url_scheme: "mysql+pymysql"
        default_port: 3306
        parameters:
          - "host"
          - "port"
          - "database"
          - "username_secret"
          - "password_secret"
        charset: "utf8mb4"
      naming:
        tables: "plural_snake_case"
        columns: "snake_case"
        constraints: "snake_case"
        indexes: "ix_<table>_<column>"

  orms:
    SQLAlchemy:
      version: "latest"
      language: "Python"
      package: "SQLAlchemy"
      capabilities:
        model_mapping: true
        parameterized_sql: true

  migration_tools:
    Alembic:
      version: "latest"
      language: "Python"
      compatible_orms:
        - "SQLAlchemy"
      environment:
        name: "uv"
        version: "latest"
      packages:
        migration:
          name: "Alembic"
          version: "latest"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"

  credential_storage:
    resolution: "For an existing field resolved as a credential, preserve any explicit project storage mode. Otherwise use its exact-name field_defaults entry, falling back to layers.storage_adapter.credential_storage_mode only when no field-specific default applies. These defaults neither add fields nor override an explicit non-credential classification."
    field_defaults:
      password:
        mode: "hash"
      api_key:
        mode: "hash"
    modes:
      plaintext:
        stored_as: "string"
        transformation: "none"
        recoverable: true
      hash:
        stored_as: "string"
        transformation: "one_way_hash"
        recoverable: false
        use_case: "Credentials used only for verification."
      encrypted:
        stored_as: "string"
        transformation: "reversible_encryption"
        recoverable: true
        key_source: "Runtime configuration outside Database and generated Interface files."
