  path_note: "The Preferences layer of the Development Component — defaults for capabilities that may apply across application layers."
  purpose: "Cross-cutting capability defaults used when no explicit project choice exists."
  standard: "Agent Project Interface"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
