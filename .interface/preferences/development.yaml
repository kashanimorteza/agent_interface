# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/preferences/development.yaml"
  path_note: "The Preferences layer of the Development Component — package conventions and defaults for capabilities that may apply across application layers, including Model."
  purpose: "Central runtime-configuration, package, and cross-cutting capability defaults used when no explicit project choice exists."
  standard: "Agent Project Interface"
  version: "1.1"
  updated: "2026-09-07"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "This file is human-owned. Operations read it without writing resolved Development choices back into it."
  changed_by: "The human, directly."
  precedence: "An explicit project value and every applicable Development Principle take precedence over this file."
  consumption: "Resolve unstated runtime-configuration, package, and cross-cutting choices from this file when implementing the project. Apply package conventions to each layer and architectural sublayer, using the owning Component definitions for responsibilities and technologies. Preserve explicit compatible choices and do not rename existing implementation as a side effect of reading these defaults."
  selection: "Development catalogues one kind of alternative, the Platform the target project runs on. For an unlisted Platform need, select the smallest well-supported compatible option and record the consequential choice; ask only when no safe compatible option can be established. Every other cross-layer need this file does not cover is raised through State rather than decided inside one layer."
  version_resolution: "A Platform entry carries the version of its runtime when one applies; resolve latest to a concrete stable version and preserve an explicit one. Every other version belongs to the Preferences of the Component that owns the technology."
  matching: "Match the selected platform to the entry of that key in options.platforms; an explicit run mode in the project definition takes priority over the selection recorded here. Match a settings group to its subject by name: a layer receives the runtime-configuration section named after it, and package conventions apply to every package and architectural subpackage unless that Component's own Preferences state otherwise."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "selected"
  - "options"
  - "settings"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  selected: "The Platform the target project runs on when the project definition does not say."
  options: "Supported Platforms. Every other technology is offered by the Preferences of the Component that owns it."
  settings: "Runtime-configuration, package, and cross-cutting conventions applied across the application layers."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- selected -->
  selected:
    platform: "linux_host"

  # <!-------------------------------------------- options -->
  options:

    platforms:
      local:
        version: "runtime-provided"
        kind: "development machine"
        operating_system: "any"
        isolation: "none"
        purpose: "Running the complete system on the machine it is developed on."
      linux_host:
        version: "runtime-provided"
        kind: "server"
        operating_system: "Linux"
        isolation: "process"
        purpose: "Running the complete system directly on a Linux server or virtual private server."
      docker:
        version: "latest"
        kind: "container"
        operating_system: "Linux"
        isolation: "container"
        purpose: "Running each layer in its own container, composed together on one host."

  # <!-------------------------------------------- settings -->
  settings:

    runtime_configuration:
      files:
        public:
          path: "application.yaml"
          location: "project_root"
          format: "YAML"
          committed: true
          user_editable: true
          content: "Non-secret runtime settings and cross-layer bindings."
        secrets:
          path: ".env"
          location: "project_root"
          format: "dotenv"
          committed: false
          user_editable: true
          example_path: ".env.example"
          content: "Secret values and environment-specific private settings."
      sections:
        - "model"
        - "database"
        - "backend"
        - "frontend"
        - "platform"
      section_contract:
        settings: "Settings owned by the named layer."
        bindings: "Declared provider, interface, and selectable resource references consumed by the named layer."
      precedence:
        - "runtime_environment"
        - "public_configuration"
        - "generated_defaults"
      delivery:
        owner: "platform"
        method: "validated_injection"
        scope: "Each layer receives only its own section and declared binding references."
      validation: "Validate the complete public configuration and all references before application startup."
      override_boundary: "Runtime configuration may select among resolved compatible choices but never redefine architecture, package ownership, interfaces, or unsupported technologies."

    packages:
      naming:
        basis: "responsibility"
        top_level_prefix: "my_"
        top_level_name: "<prefix><role>"
        nested_name: "<role>"
        nested_namespace: "parent_package"
        ecosystem_adaptation: "Adapt separators, case, import names, and distribution names to the selected language and package manager. Keep the logical role recognizable."
        collision_handling: "Check the intended namespace for collisions. Use a distinct role-based qualifier when needed; the prefix alone does not guarantee uniqueness."
      distribution:
        visibility: "internal"
        publication: "none"
        local_dependency: "Use the selected ecosystem's local path or workspace mechanism when one package must be installed by another. Network consumers use the provider's API instead of installing its implementation."
      nested_packages:
        independently_installable: false
        dependency_management: "parent"
        runtime: "parent_when_applicable"
      documentation:
        filename: "README.md"
        location: "package_root"
        sections:
          - "purpose_and_boundaries"
          - "public_interface"
          - "dependencies"
          - "configuration"
          - "installation_and_startup_when_applicable"
          - "usage_examples"
        nested_setup: "Reference the parent README for shared setup and document this package's interface and usage locally."

    cross_cutting:
      testing:
        enabled: false
        applies_to: []
      logging:
        enabled: false
        applies_to: []
      error_handling:
        enabled: false
        applies_to: []
      authentication:
        enabled: false
        applies_to: []
