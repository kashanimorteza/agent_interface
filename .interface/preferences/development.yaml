  consumption: "Generation resolves unstated cross-cutting choices from this file and records their concrete state and application scope in generated Development configuration."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "cross_cutting"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  cross_cutting: "Default enabled state and application scope for capabilities coordinated across application layers."


# <!--------------------------------------------------------------------------------- Content -->
content:

  cross_cutting:
