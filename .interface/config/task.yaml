              title: "Migrations"
              does: "Set up Alembic against the app's metadata and carry the schema to its first version. When done, app.db exists with all 13 tables, and the revision downgrades and upgrades cleanly."
              task_count: 5
              tasks:
              - id: "T26"
                title: "Initialize Alembic in backend/ (alembic.ini and migrations/)"
                goal: "The migration environment exists at the layout backend.yaml names."
                depends_on: ["T4"]
                acceptance: "uv run alembic init migrations creates alembic.ini and migrations/ with env.py, script.py.mako, and versions/."
                verify: |-
                  test -f alembic.ini && test -f migrations/env.py && test -d migrations/versions && echo ok
                touches: ["alembic.ini", "migrations/env.py", "migrations/script.py.mako", "migrations/versions/", "migrations/README"]
                status: "todo"

              - id: "T27"
                title: "Wire migrations/env.py to the app's database URL and metadata with batch mode"
                goal: "Alembic reads the URL from config, sees every model, and can alter SQLite tables safely."
                depends_on: ["T26", "T25"]
                acceptance: "migrations/env.py imports app.models and app.config, sets sqlalchemy.url from config.DATABASE_URL, sets target_metadata = Base.metadata, and passes render_as_batch=True to context.configure in both offline and online runs."
                verify: |-
                  grep -q 'render_as_batch=True' migrations/env.py && grep -q 'target_metadata = Base.metadata' migrations/env.py && uv run alembic current
                touches: ["migrations/env.py"]
                status: "todo"

              - id: "T28"
                title: "Generate the initial migration creating all 13 tables"
                goal: "The schema has a versioned, reversible first revision."
                depends_on: ["T27"]
                acceptance: "uv run alembic revision --autogenerate -m initial writes one file in migrations/versions/ whose upgrade creates 13 tables and whose downgrade drops them."
                verify: |-
                  test "$(ls migrations/versions/*.py | wc -l)" -eq 1 && test "$(grep -c 'op.create_table' migrations/versions/*.py)" -eq 13 && test "$(grep -c 'op.drop_table' migrations/versions/*.py)" -eq 13 && echo ok
                touches: ["migrations/versions/"]
                status: "todo"

              - id: "T29"
                title: "Apply the migration to create app.db"
                goal: "The SQLite database exists with every table, so services and routes have somewhere to read and write."
                depends_on: ["T28"]
                acceptance: "uv run alembic upgrade head creates app.db at the root of code_path with the 13 tables plus alembic_version."
                verify: |-
                  uv run alembic upgrade head && uv run python -c "import sqlite3; c = sqlite3.connect('app.db'); t = sorted(r[0] for r in c.execute(\"select name from sqlite_master where type='table'\")); assert 'alembic_version' in t and len(t) == 14, t; print('ok')"
                touches: ["app.db"]
                status: "todo"

              - id: "T30"
                title: "Prove the initial migration downgrades and re-upgrades cleanly"
                goal: "The schema change is reversible, as the database rules require."
                depends_on: ["T29"]
                acceptance: "alembic downgrade base leaves only alembic_version; alembic upgrade head restores all 13 tables."
                verify: |-
                  uv run alembic downgrade base && uv run python -c "import sqlite3; t = [r[0] for r in sqlite3.connect('app.db').execute(\"select name from sqlite_master where type='table'\")]; assert t == ['alembic_version'], t" && uv run alembic upgrade head && uv run alembic current | grep -q head && echo ok
                touches: ["app.db"]
                status: "todo"


