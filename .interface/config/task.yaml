        phase_2.storage_schema:
          id: "phase_2.storage_schema"
          title: "Storage schema history"
          description: "The ordered, reversible migration history through which the derived storage design becomes physical structure. Its single Task establishes the history and its first entry."
          area: "The migration history and structure creation"
          does: "The complete storage structure is created from the repository by an ordered, reversible migration history, and application code never creates or alters storage objects directly."
          constraints: []
          task_count: 1
          tasks:

            phase_2.storage_schema.migration_history:
              id: "phase_2.storage_schema.migration_history"
              title: "Establish the migration history and create the structure"
              description: "Establish the migration history as internal package tooling and record its first migration, which creates every derived table, foreign key, constraint, and index, can be applied to any Instance, and can be undone."
              reason: "The structure must be reproducible and explainable from the repository, and reversible history is the only record that explains how it was reached."
              kind: "code"
              inputs:
                - "The derived storage design"
                - "The Instance connections"
                - "The migration tool conventions and commands"
              expected_result: "An ordered migration history whose first entry creates the complete structure on the selected Instance and whose reversal removes it, leaving the Instance as it was."
              depends_on:
                - "phase_2.mapping.foreign_keys"
                - "phase_2.mapping.rules"
                - "phase_2.storage_adapter.connections"
              constraints: []
              acceptance: "Applying the history to an empty general Instance creates all fourteen tables with their foreign keys, constraints, and indexes; reversing it removes them; reapplying reaches the same structure; and no table is created outside the migration history."
              verify: "On an empty Instance the fourteen tables are absent, present with every foreign key and the composite unique constraint after the history is applied, absent again after it is reversed, and present again after it is reapplied."
              status: "done"
              log:
                - at: "2026-09-07T15:15:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the mapping and connections existed; establishing the migration tooling and generating the first migration from the derived design."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary empty Instance: asserted no tables exist; applied the history with the migration tool's upgrade command and asserted exactly the fourteen tables exist, the accounts table carries three foreign keys and its three indexes, the brokers table's definition carries the named composite unique constraint, and nineteen foreign keys exist in total; reversed the latest migration and asserted no tables remain; reapplied and asserted the fourteen tables are back; asserted the history reports one head."
                  outcome: "Passed. A first generated migration rendered traceability metadata as invalid code; the mapping now records source Model and field as table and column comments, and the migration was regenerated."

        # <!-------------------- initial_data -->
        phase_2.initial_data:
          id: "phase_2.initial_data"
          title: "Initial data"
          description: "The seeding of every record the project declares as initial data. Its single Task applies the declared records with their meaning preserved."
          area: "The seeding of declared initial data"
          does: "Every declared initial record exists in the general Instance with its declared values, explicit identifiers, and generated secrets, and seeding again changes nothing."
          constraints:
            - "A generated secret is produced at seed time, reported once to whoever ran the seeding, stored only in its at-rest form, and never written to a committed or generated file."
          task_count: 1
          tasks:

            phase_2.initial_data.seed:
              id: "phase_2.initial_data.seed"
              title: "Seed the declared initial data"
              description: "Apply every Model's declared initial data to the selected Instance in dependency order, preserving explicit relationship identifiers, resolving defaults and generated values, applying the at-rest transformation to credentials, and skipping records that already exist so that seeding is repeatable."
              reason: "A rebuilt database is only equivalent to the declared project if its initial records come back with the same meaning."
              kind: "code"
              inputs:
                - "Every shared Model's initial data"
                - "The at-rest transformations"
                - "The migrated storage structure"
              expected_result: "The general Instance holds the one user, eight currencies, two trading platforms, one broker, one account group, one account, four assets, and the default trailing, partial, and action groups and default action the project declares, each with its declared values, and a second seeding adds nothing."
              depends_on:
                - "phase_2.storage_schema.migration_history"
                - "phase_2.mapping.credentials"
              constraints: []
              acceptance: "After seeding, every declared record is present with its declared values and explicit identifiers, the broker and account reference user one, platform one, group one, and currency one as declared, generated secrets are stored only in at-rest form, and seeding again leaves every count unchanged."
              verify: "Reading each seeded Model after seeding yields exactly the declared records with their declared values, the admin user's stored password and API key are not the reported generated values yet verify against them, and reading again after a second seeding yields the same counts."
              status: "done"
              log:
                - at: "2026-09-07T15:15:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the structure and transformations existed; implementing repeatable seeding in dependency order."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated Instance: seeded and asserted the inserted counts equal the declared records per Model with nothing skipped, that exactly three secrets were generated for the admin user's password and API key and the account's password, that reading each Model yields the declared records with every declared value and masked credentials, that the broker and account reference user one, platform one, group one, and currency one, that the stored admin password and API key differ from the reported values yet verify against them, that the account password recovers to the reported value, that seeding again inserts and generates nothing while skipping every record and leaving all counts unchanged, and that no generated value appears in any file under the root. Then seeded the real general Instance twice with the operator command with the same outcome."
                  outcome: "Passed."

        # <!-------------------- interface -->
        phase_2.interface:
          id: "phase_2.interface"
          title: "Database Interface"
          description: "The generic operations and the registry that the package publishes to consumers. The Tasks are related because each supplies one part of the single boundary consumers use, and none of them exposes the engine."
          area: "The Database Interface layer and its generic operations"
          does: "A consumer performs create, read, list, update, delete, and status operations on any shared Model, executes a controlled parameterized command, and discovers Instances, all through one generic Model-driven surface that never exposes a connection."
          constraints: []
          task_count: 4
          tasks:

            phase_2.interface.model_operations:
              id: "phase_2.interface.model_operations"
              title: "Provide the generic Model operations"
              description: "Provide create, read, list, update, and delete through one Model-driven pipeline that accepts a Model type or Model instance from the Model package, the operation, its criteria, and an optional Instance selection, and returns Model instances rather than storage rows."
              reason: "One pipeline serves every Model, so each Model costs no new access implementation and every consumer sees the same behaviour."
              kind: "code"
              inputs:
                - "The Model package's public import interface"
                - "The derived storage mapping"
                - "The Instance connections"
                - "The migrated storage structure"
              expected_result: "The five operations work for every one of the fourteen Models through the same calls, accept typed Model identity, and enforce the mapped constraints."
              depends_on:
                - "phase_2.mapping.columns"
                - "phase_2.storage_adapter.connections"
                - "phase_2.storage_schema.migration_history"
              constraints: []
              acceptance: "For every Model, creating from a Model instance returns it with its assigned identifier, reading by identifier returns an equal instance, listing returns instances matching supplied criteria, updating changes only the supplied fields, deleting removes the record, a Model identity given as a bare name string is rejected, and a stored value violating a mapped constraint is refused."
              verify: "Creating a currency and reading it back by identifier yields equal values; listing with a criterion returns only matching currencies; updating one field leaves the others unchanged; deleting it makes the read fail; a second currency with the same code is refused; and an operation given a Model name string instead of a Model type is rejected."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the mapping and connections existed; implementing the generic Model-driven pipeline."
                - at: "2026-09-07T15:19:41Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated Instance: created a currency from a Model instance and asserted the result is a Model instance with an identifier and the applied default; read it back by identifier and asserted equality; created a second currency and asserted listing by code returns only the first while listing without criteria returns both; updated one field and asserted the others are unchanged; deleted it and asserted reading raises not-found; asserted creating a currency with a duplicate code is refused as a constraint violation; asserted reading and listing with a Model name string, and updating with an unknown field, are rejected as invalid operations."
                  outcome: "Passed."

            phase_2.interface.status_operation:
              id: "phase_2.interface.status_operation"
              title: "Provide the status operation"
              description: "Provide the status operation that accepts exactly one action, enable or disable, for a Model that declares a status field, sets that field accordingly, and rejects any other action or any Model without a status field."
              reason: "Enabling and disabling is the one state change every status-bearing Model shares, so it belongs to the generic interface."
              kind: "code"
              inputs:
                - "The generic Model operations"
              expected_result: "Enable and disable change the status field of a status-bearing record, and every other action or Model is rejected."
              depends_on:
                - "phase_2.interface.model_operations"
              constraints: []
              acceptance: "Disabling a stored record sets its status to false and enabling sets it to true, an action other than enable or disable is rejected, and the operation is rejected for a Model without a status field."
              verify: "Disabling a seeded currency reads back status false and enabling it reads back true, an unknown action is rejected, and invoking the operation on a Model without a status field is rejected."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the generic operations; adding the enable-or-disable operation."
                - at: "2026-09-07T15:20:45Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated and seeded Instance: disabled the seeded US Dollar currency and asserted its status reads false, enabled it and asserted true; asserted an unknown action is rejected as an invalid operation; declared an ad-hoc Model without a status field and asserted the gateway rejects the operation for it, and asserted that the pipeline, given a mapping that includes that Model, rejects it specifically for declaring no status field."
                  outcome: "Passed. A first run of the check imported the Model declaration helper from the wrong module; the check was corrected and rerun."

            phase_2.interface.sql_execution:
              id: "phase_2.interface.sql_execution"
              title: "Provide controlled command execution"
              description: "Provide execution of a command against a selected Instance for cases the generic operations cannot express, taking values only as explicit parameters and returning results without exposing the underlying connection."
              reason: "Some queries cannot be expressed as Model operations, and the alternative to a controlled path is consumers reaching around the interface."
              kind: "code"
              inputs:
                - "The Instance connections"
              expected_result: "A parameterized command runs inside the Database boundary and returns its result rows, with values bound as parameters rather than interpolated."
              depends_on:
                - "phase_2.storage_adapter.connections"
              constraints: []
              acceptance: "A command with bound parameters returns the expected rows, a parameter value containing command syntax is treated as data, and the returned result carries no connection."
              verify: "Executing a count with a bound parameter returns the matching count, executing it with a parameter value that contains command syntax returns zero rather than altering the command, and the result exposes no connection object."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the generic operations; adding parameterized command execution."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated and seeded Instance: executed a count of currencies with the code bound as a parameter and asserted one row with count one; executed the same command with a parameter value containing quote-and-or command syntax and asserted count zero with all eight currencies still present; asserted the result is a list of plain mappings none of whose values can execute commands and that the result carries no connection attribute."
                  outcome: "Passed."

            phase_2.interface.instance_registry:
              id: "phase_2.interface.instance_registry"
              title: "Publish the Instance Registry"
              description: "Publish through the interface a registry from which a consumer discovers every Instance's key, name, purpose, and Engine, and which one is the default, without receiving a connection or a secret."
              reason: "A consumer chooses storage by purpose, and it can only do so if the identities are discoverable without learning how any of them connect."
              kind: "code"
              inputs:
                - "The defined Instances"
              expected_result: "A registry listing every Instance identity with the default marked, carrying no connection and no secret."
              depends_on:
                - "phase_2.storage_adapter.instances"
              constraints: []
              acceptance: "The registry lists the general Instance with its key, name, purpose, and Engine, marks it as the default, exposes no connection settings or secrets, and reports its count from the collection."
              verify: "Reading the registry yields the general Instance as the default with its identity fields, and the registry's entries contain no connection, storage location, or secret value."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the Instances were defined; publishing the registry through the gateway."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Read the registry from the gateway and asserted the default entry is the general Instance marked as default with its name, purpose, Engine, and database name; asserted the registry's length equals its entries and that lookup and membership work; asserted the entry type carries exactly the key, name, purpose, engine, database, and default fields and that no entry value is a path, contains a path separator, a storage file suffix, the storage directory, or a host."
                  outcome: "Passed. A first run of the check wrongly treated the Engine name itself as a storage reference; the check was corrected and rerun."

        # <!-------------------- composition -->
        phase_2.composition:
          id: "phase_2.composition"
          title: "Platform composition"
          description: "The Database layer's contribution to the centralized runtime configuration, the named secrets it needs, and its declared connections. Its single Task is the composition work this phase owes."
