            P2-G2-T3:
              id: P2-G2-T3
              title: Seed the initial data idempotently with credentials transformed at rest
              description: 'Provide the seeding data migration that closes the history: it inserts every Model''s initial records in definition order, preserving literal relationship identifiers, matching existing
                rows on the resolved natural keys so re-running creates no duplicate, fulfilling each generate instruction with a cryptographically random value, and storing credential fields through their
                resolved at-rest mode (user.password hash, user.api_key hash, account.password encrypted). Downgrading the revision removes the seeded records. Without the encryption key the migration fails
                clearly and stores no encrypted record.'
              reason: Initial data is part of the Model and seeding is part of Database (Database Principle 11); the Preferences resolve the ordering, idempotency, credential precedence, and the requirement
                that the key exist before the first encrypted write.
              target: database
              area: the seeding data migration and the storage-adapter seed and credential transformations
              metadata:
                phase:
                  id: P2
                  title: Database
                  order: 2
                group:
                  id: P2-G2
                  title: Storage schema, migrations, and seeding
                kind: data
                language: Python
                technologies:
                - Python 3.14.7
                - uv 0.12.10
                - SQLAlchemy 2.0.52
                - Alembic 1.19.2
                - SQLite (runtime-provided)
