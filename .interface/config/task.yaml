              verify: "Reading the public configuration yields a Database section that passes validation against the section contract and names the general Instance as default, the secrets example lists each required secret name with a non-secret placeholder, and version control reports the real secrets file as ignored."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the Instances were defined; adding the Database section, the secrets example, and the version-control exclusions."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Parsed the public configuration and asserted the Database section's keys are exactly settings and bindings, the default Instance is general and defined with its identity fields, and the binding names the Model package's import interface; resolved the section through the package's own validation; asserted no secret-named key carries a value; asserted the secrets example assigns each of the three required secret names a bracketed placeholder; asserted version control ignores the real secrets file and does not ignore the example."
                  outcome: "Passed. The real secrets file and the storage directory were added to the version-control exclusions."

    # <!-------------------------------------------- phase_3 -->
    phase_3:
      id: "phase_3"
      title: "Backend"
      order: 3
      target: "Backend"
      does: "The application layer exists as one independent package whose Logic lets a user enter and manage every defined Model through Data Access, and whose API publishes those operations and their machine-readable description to external consumers."
      constraints: []
      task_count: 10
      groups:

        # <!-------------------- package -->
        phase_3.package:
          id: "phase_3.package"
          title: "Backend package"
          description: "The package that holds the application layer: its identity and isolated environment, its dependencies on the shared Model and Database packages, and the description a consumer reads to run and use it. The Tasks are related because each establishes one part of the boundary the three internal layers live inside."
          area: "The Backend package boundary and its description"
          does: "The Backend package exists as an installable, isolated boundary that consumes the Model package through its import interface and the Database package through its public gateway, and is documented for its operators and consumers."
          constraints: []
          task_count: 2
          tasks:

            phase_3.package.establish:
              id: "phase_3.package.establish"
              title: "Establish the Backend package"
              description: "Create the application layer as its own package with its resolved identity, an isolated environment, its dependencies on the shared Model and Database packages through the ecosystem's local-dependency mechanism, and its declared API framework dependency, ready to hold the three internal layers."
              reason: "Every application responsibility must live in one boundary that consumes the shared Models and the persistence gateway before any of it can be implemented."
              kind: "code"
              inputs:
                - "The package naming and distribution conventions"
                - "The resolved Backend language, environment, and API framework"
                - "The Model package's public import interface"
                - "The Database package's public interface"
              expected_result: "An installable Backend package with a stable identity whose isolated environment resolves its dependencies, including the Model and Database packages, and which can be imported by name."
              depends_on:
                - "phase_1.package.interface"
                - "phase_2.package.interface"
              constraints: []
              acceptance: "The package installs into a fresh isolated environment from its own declaration, imports by its resolved name, and reaches the shared Models and the persistence gateway only through their public interfaces."
              verify: "Installing the package into a clean isolated environment succeeds, importing it by name succeeds, and the package's declared dependencies name the Model and Database packages and the API framework and no persistence engine, mapping, or migration technology."
              status: "done"
              log:
                - at: "2026-09-07T15:26:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed as the only eligible Task; creating the package, its isolated environment, and its dependencies on the Model and Database packages."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Read the package's declared dependencies and asserted they name the Model package, the Database package, and the API framework and none of the persistence engine, mapping, migration, or cryptography libraries; created a fresh isolated environment in a temporary directory, installed the Model, Database, and Backend packages into it from their own declarations, and from outside the package directory imported the Backend package by name and its application factory. Resolved Python 3.14.7, FastAPI 0.141.1 with its standard extras including Uvicorn 0.52.4, and PyYAML 6.0.3, with the Model and Database packages as editable local-path dependencies."
                  outcome: "Passed."

            phase_3.package.documentation:
              id: "phase_3.package.documentation"
              title: "Document the Backend package"
              description: "Write the package's public description covering its purpose and boundaries, its public interface, its dependencies, its configuration by name and non-secret example, how it is installed and started, and how its API is used, consistent with the implemented API."
              reason: "An operator must be able to start the application and a consumer must be able to use its API without inspecting the implementation."
              kind: "documentation"
              inputs:
                - "The implemented API and its description"
                - "The implemented server process"
                - "The package documentation conventions"
              expected_result: "A package description a reader can follow to install the package, start the server, and perform Model operations through the API."
              depends_on:
                - "phase_3.api.description"
                - "phase_3.composition.server"
              constraints: []
              acceptance: "The description carries every section the documentation conventions require, states how the API description is reached, names every configuration value by name with a non-secret example, and records no secret value."
              verify: "Following the description's installation and start instructions from a clean environment yields a running server whose API description is reachable where the description says, and every usage example in the description succeeds against it."
              status: "done"
              log:
                - at: "2026-09-07T15:31:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed after the API and server were implemented; writing the package description."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the description carries the purpose-and-boundaries, public-interface, dependencies, configuration, installation, and usage sections, names every public symbol, states where the API description and documentation are reached, names each configuration value, and contains no environment-style secret assignment with a real value. Against a temporary migrated and seeded project root: started the server with the description's own start command, fetched the API description where the description says it is, created a fresh isolated environment, ran the description's own installation command, and executed every usage example against the running server without error; then stopped the server."
                  outcome: "Passed."

        # <!-------------------- data_access -->
        phase_3.data_access:
          id: "phase_3.data_access"
          title: "Data Access"
          description: "The layer that is the only Backend route to persistence. Its single Task translates the data operations Logic requests into calls on the Database gateway and the results back into logical data."
          area: "The Data Access layer"
          does: "Logic reaches persistence through one translation point that calls the Database gateway on the Backend's bound Instance, returns Model instances, and contains no application Behaviour."
          constraints: []
          task_count: 1
          tasks:

            phase_3.data_access.gateway:
              id: "phase_3.data_access.gateway"
              title: "Provide the Data Access translation"
              description: "Provide the operations Logic needs for any Model, each translated into the corresponding call on the Database gateway against the Instance bound to the Backend, with the results returned as shared Model instances and persistence errors translated into logical outcomes."
              reason: "One translation point is what lets the persistence implementation change without Logic being rewritten, and makes every persistence call visible in one place."
              kind: "code"
              inputs:
                - "The Database package's public gateway and Instance Registry"
                - "The Model package's public import interface"
                - "The Backend section of the centralized runtime configuration"
              expected_result: "Create, get, list, update, and delete for any shared Model, performed through the Database gateway on the bound Instance, returning Model instances and reporting a missing record and a constraint violation as distinct logical outcomes."
              depends_on:
                - "phase_3.package.establish"
              constraints: []
              acceptance: "Every operation for every Model reaches storage only through the Database gateway, uses the Instance the Backend configuration binds, returns shared Model instances, and reports a missing record and a constraint violation as distinct outcomes without exposing the engine, connection, or mapping."
              verify: "Creating, getting, listing, updating, and deleting a currency through Data Access yields the same observable results as the Database gateway on the bound Instance, getting a missing currency yields the missing-record outcome, creating a duplicate code yields the constraint outcome, and the layer imports nothing of the Database package beyond its public interface."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; translating Logic's operations onto the Database gateway."
                - at: "2026-09-07T15:33:03Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Scanned the layer's source and asserted it imports only the Database package's public interface and names no engine, mapping, or migration technology. Against a temporary migrated project root: asserted the layer uses the general Instance the configuration binds; created a currency through Data Access and asserted the Database gateway reads back an equal record, that get and list through Data Access equal the gateway's, that an update is visible through the gateway, that a duplicate code yields the conflicting-record outcome, and that after deletion get, update, and delete each yield the missing-record outcome."
                  outcome: "Passed. A first run of the check wrongly expected the Backend outcome type from a direct gateway call; the stray assertion was removed and the check rerun."

        # <!-------------------- logic -->
        phase_3.logic:
          id: "phase_3.logic"
          title: "Logic"
          description: "The layer that implements what the application does: a common operation baseline reused by every Model's own unit, and a registry that connects the units. The Tasks are related because together they give every Model its standard Logic surface."
          area: "The Logic layer and its Model Logic units"
          does: "Every shared Model has its own separately defined Logic unit that provides create, get, list, update, and delete through the common baseline, validates input against the shared Model, reaches persistence only through Data Access, and is resolvable from a registry."
          constraints: []
          task_count: 2
          tasks:

            phase_3.logic.baseline:
              id: "phase_3.logic.baseline"
              title: "Provide the common operation baseline and registry"
              description: "Provide the shared baseline that gives any Model Logic unit the five standard operations, validating input against the shared Model definition and delegating persistence to Data Access, and provide the registry through which a Model resolves to its unit."
              reason: "Common operations implemented once and reused keep every Model's baseline identical, while the registry lets API reach a unit without knowing how the units are defined."
              kind: "code"
              inputs:
                - "The Data Access operations"
                - "The Model package's public import interface"
              expected_result: "A baseline that any unit adopts to obtain create, get, list, update, and delete with shared-Model validation, and a registry that resolves a Model to its unit."
              depends_on:
                - "phase_3.data_access.gateway"
              constraints: []
              acceptance: "A unit adopting the baseline performs all five operations for its Model through Data Access, rejects input that violates the shared Model before reaching persistence, and is returned by the registry for its Model, while an unregistered Model is reported as such."
              verify: "A unit adopting the baseline for the currency Model creates, gets, lists, updates, and deletes a currency, rejects a currency with a four-character code without any persistence call, and is what the registry returns for that Model, while the registry reports a Model with no unit."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once Data Access existed; implementing the shared baseline and the registry."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated project root with Data Access wrapped in a call-recording proxy: declared an ad-hoc unit adopting the baseline for the currency Model, registered it, and asserted the registry returns that unit for the Model; created, got, listed, updated, and deleted a currency through it; asserted that creating a currency with a four-character code yields the invalid-data outcome and that the proxy recorded no persistence call for it; asserted the registry reports the no-unit outcome for an unregistered Model."
                  outcome: "Passed."

            phase_3.logic.units:
              id: "phase_3.logic.units"
              title: "Define the Logic unit of every Model"
              description: "Define one separately defined Logic unit for each of the fourteen shared Models, each adopting the common baseline and registered under its Model, so that every Model can be entered and managed and any Model's Behaviour can later be extended without touching another's."
              reason: "The project's Behaviour is that users enter and manage all defined data, and each Model must keep its own unit even while it uses only the baseline."
              kind: "code"
              inputs:
                - "The common operation baseline and registry"
                - "The fourteen shared Models"
              expected_result: "Fourteen separately defined units, one per Model, each providing the five standard operations for its Model and resolvable from the registry."
              depends_on:
                - "phase_3.logic.baseline"
              constraints: []
              acceptance: "Each of the fourteen Models resolves through the registry to a unit defined for it alone, no unit is shared by two Models, and each unit performs the five standard operations for its Model."
              verify: "Resolving each of the fourteen Models through the registry yields fourteen distinct units, each bound to exactly its Model, and creating and deleting a record through the trailing-group unit and the asset unit succeeds for each."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the baseline; defining one unit per Model in its own module."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the units area holds fourteen separately defined unit modules; built the registry against a temporary migrated project root and asserted it holds fourteen units, that resolving each of the fourteen Models yields fourteen distinct unit objects of fourteen distinct unit types each bound to exactly its Model and each defined in its own module; created and deleted a trailing group through the trailing-group unit and an asset through the asset unit."
                  outcome: "Passed."

        # <!-------------------- api -->
        phase_3.api:
          id: "phase_3.api"
          title: "API"
          description: "The external communication boundary: the operations it exposes for every Model, the way logical outcomes become responses, and the machine-readable description it publishes. The Tasks are related because each supplies one part of the single external contract, and none of them implements Behaviour."
          area: "The API layer and the external contract"
          does: "An external consumer performs the five standard operations on every shared Model over the resolved transport, with input and output representations derived from the shared Models, credentials accepted but never returned, logical outcomes mapped to distinct responses, and a machine-readable description of it all published by the API."
          constraints: []
          task_count: 3
          tasks:

            phase_3.api.model_operations:
              id: "phase_3.api.model_operations"
              title: "Expose the standard Model operations"
              description: "Expose create, get, list, update, and delete for every shared Model over the resolved transport, decoding each request into the representation derived from the shared Model, invoking the Model's Logic unit, and serializing the result, with every credential field accepted as input only and absent from every response and response shape."
              reason: "The API is the one contract every external consumer depends on, and the project requires that users can enter and manage all defined data through it."
              kind: "code"
              inputs:
                - "The Logic units and registry"
                - "The fourteen shared Models and their credential markers"
                - "The API transport settings"
              expected_result: "Five operations for each of the fourteen Models reachable over the transport, whose inputs and outputs derive from the shared Models and whose responses never carry a credential."
              depends_on:
                - "phase_3.logic.units"
              constraints:
                - "On update, an omitted credential field leaves the stored credential unchanged, so a consumer can change other fields without resupplying a secret."
              acceptance: "For every Model, a consumer can create a record, get it, list records, update it, and delete it over the transport; the accepted input fields equal the Model's fields excluding the storage-assigned identifier; the returned fields equal the Model's fields excluding every credential; and no response, whether success or error, carries a credential value."
              verify: "Over the running transport, creating a user with a password and API key returns the user without either credential, getting and listing it return it without them, updating its name without resupplying the password succeeds and the password still verifies through the persistence gateway, and deleting it makes the get fail; and the same five operations succeed for a currency."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the Logic units existed; exposing the five operations per Model with representations derived from the shared Models."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Over the transport against a temporary migrated and seeded project root: created a user with a password and API key and asserted the response carries exactly the identifier, name, username, status, and description; asserted get and list return it without either credential; updated its name without resupplying the password and asserted success and that the original password and API key still verify through the persistence gateway; updated the password and asserted the new one verifies; deleted it and asserted get fails; asserted no user or account listing contains a supplied credential or the persistence mask; created, got, listed, updated, and deleted a currency with the applied default visible."
                  outcome: "Passed."

            phase_3.api.outcomes:
              id: "phase_3.api.outcomes"
              title: "Map logical outcomes to responses"
              description: "Map each logical outcome of Logic to a distinct external response: a request whose shape or content violates the shared Model, a record that does not exist, a persistence constraint violation, and success, with every error response describing the failure without leaking a credential or an internal detail."
              reason: "A consumer can only act on an outcome it can distinguish, and a protocol change must never become a behaviour change."
              kind: "code"
              inputs:
                - "The logical outcomes Logic and Data Access report"
                - "The exposed Model operations"
              expected_result: "Distinct responses for invalid input, a missing record, a constraint violation, and success, each carrying a description safe to return."
              depends_on:
                - "phase_3.api.model_operations"
              constraints: []
              acceptance: "A currency with a four-character code, a get of a nonexistent currency, a second currency with an existing code, and a valid create each produce a different response status, and the error responses name the failing field or record without carrying a credential or an engine detail."
              verify: "Over the running transport, the four requests above yield four distinct statuses, the invalid-input response names the code field, the missing-record and constraint responses carry a readable message, and none of the three error bodies contains a credential value or a storage-engine message."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the Model operations; mapping each logical outcome to its response."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Over the transport against a temporary migrated and seeded project root: sent a currency with a four-character code, a get of a nonexistent currency, a currency with an already-seeded code, and a valid currency, and asserted four distinct statuses; asserted the invalid-input body names the code field and carries only type, location, and message per error; asserted the missing-record body names the identifier and the conflict body names the Model; sent a user with a wrong-typed username and a user with a wrong-typed status alongside credential values and asserted no error body contains those values or any engine, constraint, or integrity message."
                  outcome: "Passed."

            phase_3.api.description:
              id: "phase_3.api.description"
              title: "Publish the API description"
              description: "Publish, from the API layer, the machine-readable description of every exposed operation and its input and output shapes in the resolved description format, with credential fields absent from every output shape."
              reason: "The layer that defines the external contract is the only one that can describe it accurately as it changes, and the Frontend builds its access from that description."
              kind: "code"
              inputs:
                - "The exposed Model operations"
                - "The API documentation settings"
              expected_result: "A machine-readable description reachable from the running API that lists every operation for every Model with input and output shapes derived from the shared Models."
              depends_on:
                - "phase_3.api.model_operations"
              constraints: []
              acceptance: "The description is served by the API in the resolved format, lists the five operations for each of the fourteen Models, derives each shape from its shared Model, and no output shape contains a credential field."
              verify: "Fetching the description from the running API yields a document in the resolved format whose operations cover all fourteen Models with all five operations each, whose user output shape lacks the password and API-key fields while its input shape has them, and whose currency shape limits the code to three characters."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the Model operations; publishing the description from the API layer."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Fetched the description from the API and asserted it is an OpenAPI 3 document whose paths cover all fourteen resources with create and list on the collection and get, update, and delete on the item, seventy operations in total; asserted the user output shape carries exactly the identifier, name, username, status, and description while the user input shape carries and requires the password and API key; asserted no output shape of any Model carries a credential field; asserted the currency input and output shapes limit the code to three characters; asserted the interactive documentation is served."
                  outcome: "Passed."

        # <!-------------------- composition -->
        phase_3.composition:
          id: "phase_3.composition"
          title: "Platform composition"
          description: "The Backend layer's contribution to the centralized runtime configuration, the process that runs its API, and its declared connections. The Tasks are related because together they are the composition work this phase owes."
          area: "The Backend layer's part of the Platform composition"
          does: "The centralized public runtime configuration carries the Backend layer's section with its transport settings and its bindings to the Model package and the Database Instance, and one process started from configuration serves the API so the complete system is runnable after this phase."
          constraints: []
          task_count: 2
          tasks:

            phase_3.composition.runtime_configuration:
              id: "phase_3.composition.runtime_configuration"
              title: "Contribute the Backend section of the runtime configuration"
              description: "Add the Backend layer's section to the centralized public runtime configuration with its transport settings, its binding to the Model package, and its binding to the Database Instance it uses, and name any secret the layer needs in the secrets example."
              reason: "Every phase that delivers a layer also delivers that layer's part of the composition, and the Instance a Backend uses is a composition setting rather than a constant in its code."
              kind: "configuration"
              inputs:
                - "The runtime configuration conventions"
                - "The Database Instance Registry"
                - "The API transport settings"
              expected_result: "The public runtime configuration carries a Backend section that satisfies the section contract, whose bindings name the Model package and a defined Database Instance."
              depends_on:
                - "phase_3.package.establish"
              constraints: []
              acceptance: "The public configuration contains the Backend section with the transport settings the server needs and bindings naming the Model package and a Database Instance the registry defines, names no secret value, and the secrets example names any secret the section references."
              verify: "Reading the public configuration yields a Backend section that passes validation against the section contract and whose bound Instance key is one the Database registry lists, and the section assigns no value to a secret-named key."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; adding the Backend section with its transport settings and bindings."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Parsed the public configuration and asserted the Backend section's keys are exactly settings and bindings; resolved the section through the package's own validation and asserted a host and an integer port; asserted the bindings name the Model package and the Database package and that the bound Instance key is listed by the Database registry; asserted no secret-named key carries a value. The Backend references no secret, so the secrets example needed no addition."
                  outcome: "Passed."

            phase_3.composition.server:
              id: "phase_3.composition.server"
              title: "Provide the server process"
              description: "Provide one command from the package that starts the API server from the Backend section of the runtime configuration and serves the exposed operations on the configured transport settings until stopped."
              reason: "A layer that cannot be brought online from configuration is not composed, and the system must be runnable after this phase."
              kind: "code"
              inputs:
                - "The Backend section of the centralized runtime configuration"
                - "The exposed Model operations"
              expected_result: "A running API server started by one command, listening where the configuration says, that answers requests for the exposed operations."
              depends_on:
                - "phase_3.api.model_operations"
                - "phase_3.composition.runtime_configuration"
              constraints: []
              acceptance: "One command starts the server on the configured transport settings, the server answers a Model operation while running, and it stops cleanly when asked."
              verify: "Running the start command from the package brings up a server at the configured location within a bounded wait, listing currencies over it returns the seeded currencies, and stopping it ends the process."
              status: "done"
              log:
                - at: "2026-09-07T15:27:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the Model operations; providing the serve command that starts the server from configuration."
                - at: "2026-09-07T15:32:51Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated and seeded project root whose Backend section names a test port: started the package's serve command as a separate process, polled the configured location and asserted the currency listing answered within thirty seconds with exactly the eight seeded currency codes while the process was still running, then asked the process to stop and asserted it ended."
                  outcome: "Passed."
