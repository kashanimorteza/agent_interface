              - An instance may exist without a value for its auto-increment primary key and without credential values, because the key is assigned by persistence and credential values are write-only (never
                returned by the Database Interface or exposed by the API); their declared nullability stays false, so a credential must be supplied when a record is created.
              - The class carries no persistence, API, or presentation detail.
              acceptance: The verify run constructs a valid User from the required fields, observes every declared default, and observes pydantic.ValidationError for a wrong type, a missing required field,
                and a null non-nullable field.
              verify: |
                uv run python -c '
                import pydantic, datetime, decimal
                from my_model import User
                fields = {"id": {"type": "integer", "nullable": False, "absent": True}, "name": {"type": "string", "nullable": False}, "username": {"type": "string", "nullable": False}, "password": {"type": "string", "nullable": False, "absent": True}, "api_key": {"type": "string", "nullable": False, "absent": True}, "status": {"type": "boolean", "nullable": False, "default": True}, "description": {"type": "string", "nullable": True}}
                sample = {"integer": 1, "string": "x", "boolean": True, "decimal": decimal.Decimal("1.5"), "float": 1.5, "datetime": datetime.datetime(2026, 1, 1)}
                absent_ok = {n for n, f in fields.items() if f.get("absent")}
                required = [n for n, f in fields.items() if not f["nullable"] and "default" not in f and n not in absent_ok]
                nullable = [n for n, f in fields.items() if f["nullable"]]
                kw = {n: sample[fields[n]["type"]] for n in required} | {n: None for n in nullable}
                inst = User(**kw)
                for n, f in fields.items():
                    if "default" in f:
                        assert getattr(inst, n) == f["default"], (n, getattr(inst, n), f["default"])
                    if n in absent_ok or n in nullable:
                        assert getattr(inst, n, None) is None, n
                def rejected(**bad):
                    try:
                        User(**bad)
                    except pydantic.ValidationError:
                        return True
                    return False
                for n in required:
                    assert rejected(**{k: v for k, v in kw.items() if k != n}), "missing required field accepted: " + n
                for n, f in fields.items():
                    if n in absent_ok:
                        continue
                    assert rejected(**{**kw, n: object()}), "wrong type accepted: " + n
                    if not f["nullable"]:
                        assert rejected(**{**kw, n: None}), "null accepted in non-nullable field: " + n
                print("user ok")
                '
              status: done
              log:
              - at: '2026-09-07T11:53:42+03:30'
                status: claimed
                note: Claimed together with the other Model activities that became ready once the project existed; each is implemented as its own module and verified independently through the package root.
              - at: '2026-09-07T11:54:30+03:30'
                status: done
                note: Provided User in its own module my_model/user.py as a Pydantic class over the shared base (unknown fields rejected, assignments validated) carrying the 7 defined fields in order with their declared
                  defaults; field purposes and markers are kept as field descriptions; the recorded size of a field is enforced as a maximum length. The field(s) id, password, api_key default to None because persistence
                  assigns the primary key on create and credential values are write-only.
                evidence: 'Recorded verify run from model/ exited 0 and printed "user ok": a User was constructed from its 2 required field(s) with 1 nullable field(s) passed as null; the declared defaults were observed
                  (status=True); pydantic.ValidationError was raised for each of the 2 missing required field(s), for a wrong-typed value in each of the 4 checked field(s), and for null in each of the 3 non-nullable
                  checked field(s).'
