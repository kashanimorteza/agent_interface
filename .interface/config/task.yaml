                after = con.execute("select password from users where id = 1").fetchone()[0]
                assert after != before[0] and "new-secret" not in after, "a supplied credential must be stored transformed"
                try:
                    db.update(User(id=999999, name="Ghost", username="ghost")); raise SystemExit("update of an absent record did not fail")
                except DatabaseError:
                    pass
                assert db.read(User, 999999) is None, "update must never create a record"
                try:
                    db.delete(User, 1); raise SystemExit("a deletion blocked by RESTRICT did not fail")
                except DatabaseError:
                    pass
                assert db.read(User, 1) is not None
                c = db.create(Currency(name="Verify Coin", code="VRC"))
                db.delete(Currency, c.id)
                assert db.read(Currency, c.id) is None
                db.status(User, 1, "disable")
                assert db.read(User, 1).status is False
                db.status(User, 1, "enable")
                assert db.read(User, 1).status is True
                try:
                    db.status(User, 1, "toggle"); raise SystemExit("an unsupported status action was accepted")
                except DatabaseError:
                    pass
                print("ok: update, delete, status")
