                verify: |-
                  grep -qx '.venv/' .gitignore && grep -qx 'app.db' .gitignore && grep -qx '.env' .gitignore && grep -qx '__pycache__/' .gitignore && echo ok
                touches: [".gitignore"]
                status: "todo"


            - id: "P1-G2"
