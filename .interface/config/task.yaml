                for r in /user /currency /trading-platform /broker /account /asset /trailing-group /trailing-rule /partial-group /partial-rule /action-group /action /position; do echo "$HOME_HTML" | grep -q "href=\"$r\"" || { echo "missing link $r"; exit 1; }; done
                curl -sf http://127.0.0.1:3000/currency | grep -q 'Currencies'
                test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/nope)" = "404"
                echo ok
              )
