# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/task.yaml
  path_note: 'Generated configuration of the Task Component — the resolved Task frame, the Task-state vocabulary, and one Plan per project phase. Shape: schema/task.yaml; rules: principles/task.md; the Task Preferences layer is empty'
  standard: Agent Project Interface
  schema_version: '6.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: The configuring operation materializes task_schema, task_states, the task_count totals (zero until Tasks exist), and one Plan shell per phase with empty groups; it never creates a Group or Task. Every operation that adds or removes Tasks recalculates the Group, Plan, and total task_count values. The planning operation fills the groups of the one phase it was invoked for with activities, expected results, and verification, never with implementation steps. The development operation owns the implementation method and changes only the status, blocker, and log of a Task it has claimed. Reset acts as its own fixed script defines
  changed_by: The planning operation (Plan groups), the development operation (Task status, blocker, log), the reset operation, and the configuring operation (frame and empty shells only)
  preservation: On re-configuring, an existing Plan whose groups are non-empty is preserved when its source phase is unchanged. Removing or changing a phase whose Plan holds Tasks is a critical conflict, reported and never applied silently. This run followed a stage-1 reset that had emptied the generated configuration, so no existing Plan was found and every Plan shell below was created empty


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- task_schema
- task_states
- task_count
- plans


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: The resolved field frame every Task carries
  task_states: The Task-status vocabulary and the derived readiness and completion conditions
  task_count: The total number of Tasks stored across all Plans, recalculated whenever Tasks are added or removed
  plans: One Plan per project phase, keyed by phase id from definition.yaml


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- task_schema -->
  task_schema:
    rule: Every Task carries exactly these fields — no more, no fewer. blocker and log are structurally part of the frame but are absent until they first apply. A Task defines the activity, why it is needed, where its responsibility belongs, the resolved constraints, the expected result, and the evidence of completion; it never prescribes implementation steps, algorithms, source layout, code, the files to change, or the commands that perform the work.
    fields:
      id: Identifier in the form <phase>-G<group>-T<n>, unique within its Plan and unambiguous across all Plans.
      title: A concise statement of the one atomic activity.
      description: A complete explanation of what must be achieved — the activity and its observable result, not the method of implementing it.
      reason: Why the Task is necessary.
      target: The Component in which the Task performs its work — the phase target from definition.yaml.
      area: The specific module, subsystem, or work area inside the target Component, such as one of its resolved layers or the Platform composition the phase delivers for it.
      metadata:
        kind: The nature of the work — code, configuration, documentation, data, or command execution.
        language: The applicable programming or configuration language, or null when none applies.
        technologies: The ordered resolved technologies relevant to the Task, taken from the target Component's generated configuration; empty when none apply. Descriptive metadata only — never a place to select or explain an implementation.
      inputs: The information, artifacts, interfaces, or completed results the Task consumes; empty when none apply.
      references: The generated configuration entries — file and section — that Development must consult for the resolved technical decisions behind the Task; empty when none apply.
      expected_result: The concrete artifact, behaviour, state, or observable result the Task must produce.
      depends_on: The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent.
      constraints: Task-specific restrictions and invariants the implementation must preserve, resolved from the generated configuration; empty when none apply.
      acceptance: The observable criterion that determines whether the intended result is correct.
      verify: A runnable command or precise executable check, run from the target Component's verify_cwd, that proves acceptance after implementation. It never doubles as a hidden implementation procedure.
      status: The current Task state, using the task_states vocabulary.
      blocker: The identifier of the critical Blocker in state.yaml when the Task is blocked; absent otherwise.
      log: The append-only Task-local progress history of dated entries; absent until the first recorded transition.
    status_lives_here: The current status is stored on each Task, so Plans and State never drift apart.
    history_lives_here_too: There is no separate history file. While a Task exists, how it reached its state is recorded in its own append-only log.

  # <!-------------------------------------------- task_states -->
  task_states:
    path: The status field on each Task.
    states:
      todo: Defined and not yet started.
      claimed: An executor has taken the Task and written the claim before starting work.
      blocked: Work cannot safely continue; the Task's blocker field names the Blocker in state.yaml.
      done: Acceptance is proven by a passing verify run.
      cancelled: The Task will not be done and no other Task replaces it.
      superseded: Another Task replaced this one; the log names the replacement.
    derived_ready: A Task is ready when its phase is ready, its status is todo, and every Task in its depends_on is done. Ready is computed when needed and never stored.
    phase_ready: A phase is ready for development when its Plan has at least one Group with at least one Task and every earlier phase is complete. Readiness is derived, never stored.
    phase_complete: A phase is complete when its Plan is non-empty, every Task not cancelled or superseded is done, and no Task remains todo, claimed, or blocked. Completion is derived, never stored.

  # <!-------------------------------------------- task_count -->
  task_count: 20

  # <!-------------------------------------------- plans -->
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, rules, and initial data.
      task_count: 20
      groups:
        P1-G1:
          id: P1-G1
          title: Package foundation
          description: Establishes the toolchain and the my_model project so that the Model package can exist, be imported, and be verified inside its own isolated environment. The Tasks are related because
            no Model can be provided or verified before the resolved toolchain and project exist.
          target: model
          area: the my_model package root and its isolated environment (model/)
          does: A verified toolchain and an importable my_model project at model/ running CPython 3.14.7 with Pydantic 2.13.5 under uv 0.12.10, ready to receive the shared Models.
          task_count: 2
          tasks:
          - id: P1-G1-T1
            title: Make the resolved toolchain available
            description: 'Ensure the development machine provides the toolchain the Model package is resolved to: uv 0.12.10 as the environment tool and CPython 3.14.7 as the interpreter uv manages. Installing
              or upgrading them is part of this activity when they are absent or at another version.'
            reason: model.yaml resolves the Model package to Python 3.14.7 managed by uv 0.12.10; every verify command of this Plan runs through uv with those versions, and preparing required prerequisites
              is part of Development under the shared toolchain policy.
            target: model
            area: development toolchain for the my_model package
            metadata:
              kind: command execution
              language: null
              technologies:
              - uv 0.12.10
              - Python 3.14.7
            inputs:
            - The current uv and Python installations on the development machine
            references:
            - .interface/config/model.yaml — content.implementation.tech (language and environment versions)
            expected_result: uv 0.12.10 and a uv-managed CPython 3.14.7 are available on PATH for every later verify command of this Plan.
            depends_on: []
            constraints:
            - Unrelated tools, projects, and installations on the machine are preserved.
            acceptance: '`uv --version` reports 0.12.10 and `uv python find 3.14.7` resolves an interpreter.'
            verify: uv --version | grep -q '^uv 0\.12\.10\b' && uv python find 3.14.7
            status: todo
          - id: P1-G1-T2
            title: Establish the my_model project with its isolated environment
            description: Establish the my_model package at model/ as the resolved uv-managed Python project so that, inside its own environment, `import my_model` succeeds with CPython 3.14.7 and pydantic 2.13.5
              in use and the dependency lock current. The package holds no Model yet; the later Tasks add them.
            reason: Every later Task of this Plan is verified inside this environment, and the Database and Backend phases install this project as an editable local path dependency, which requires a valid project
              in the resolved form.
            target: model
            area: the my_model package root and its isolated environment (model/)
            metadata:
              kind: configuration
