              expected_result: '`from my_model import User` succeeds; an instance is constructed from the required fields with every declared default applied; a wrong type, a missing required field, and null
                in a non-nullable field are each rejected with pydantic.ValidationError; an instance may exist without a value for id, password, api_key.'
              depends_on:
              - P1-G1-T2
              constraints:
              - 'Resolved by Planning from the Preferences: the Model package is my_model at model/ (distribution name my-model, internal, never published, installed by consumers as an editable local path dependency),
