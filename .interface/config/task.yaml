                for the Database Interface, Data Logic and Mapping, and Storage Adapter layers; it installs my_model from model/ as an editable path dependency. The one configured Instance is general — name
                "Trading Assistant General", purpose "General application data.", Engine SQLite (file-backed, runtime-provided sqlite3, foreign keys enforced, check_same_thread false), database identity trading_assistant_general,
                file database/data/trading_assistant_general.db — and it is the default Instance. Every verify command runs from database/ through uv run.'
              - 'Verification contract for the public interface, fixed by Planning as the most literal reading of the Database Principles so the interface is verifiable and Backend can rely on it: `from my_database
                import Database, InstanceRegistry, DatabaseError`. `InstanceRegistry()` exposes `default` (the default Instance key) and `instances` (the configured Instances in order, each exposing `key`,
                `name`, `purpose`, `engine`). `Database()` selects the default Instance and `Database(instance=<key>)` a named one. The operations are methods named after the standard operations — `create(instance)`
                returning the stored instance, `read(model, key)` returning an instance or None, `list(model, criteria=None, order_by=None, limit=None, offset=None)` returning a list ordered by primary key
                unless `order_by` names a Model field, with `criteria` a mapping of field name to value, `update(instance)` returning the stored instance, `delete(model, key)`, `status(model, key, action)`,
                and `sql(statement, parameters=None)` binding a mapping to `:name` placeholders and returning plain rows. Every failure inside the boundary is raised as DatabaseError or a subclass of it; no
                driver or ORM exception escapes.'
              - Consumers import only from the my_database package root; the Engine, connection, ORM mappings, tables, migrations, and database file are never exposed.
              - The isolated environment, build artifacts, and every database file under the data directory stay out of source control (the repository already ignores *.db).
              - Storage schema objects are created, altered, and dropped only by migrations; application code and the ORM never create tables at startup.
