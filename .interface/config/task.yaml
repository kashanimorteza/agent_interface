# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/task.yaml"
  path_note: "Generated configuration — the frame that defines a task, and the plans that hold the tasks, one plan per item"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  task_creation: "No speculative tasks — tasks are created only when the human asks for them, by my-interface-planner in planning mode. A generation run writes no task and no build stage"
  rule: "task_schema and task_states are the frame, fixed by the human. phase_titles are derived by my-interface-planner and confirmed by the human; phases are written in planning mode; in development and review only a task's status, blocker, and log move. Who may write what, and when, is the State contract's — config/state.yaml under content.state_authority — and root.yaml's content.modes"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_schema — what a task is, before any task"
  - "task_states — the vocabulary of status, before reading one"
  - "plans — the plans themselves, one per item"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: "The fields every task carries — the definition of a task, not a task itself"
  task_states: "The vocabulary of the status field and its protocols"
  plans: "One plan per item — backend and frontend"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Task_Schema -->
  task_schema:
    rule: "Every task carries exactly these fields — no more, no fewer."
    fields:
      id: "Identifier unique within the item — each item numbers its own tasks."
      title: "The task in one sentence."
      goal: "What becomes possible after this task that was not possible before."
      depends_on: "Ids of tasks in the same item — depending on another item is forbidden."
      needs_contract: "The contract version required — used instead of depending on another item's task; omitted when the task needs none."
      acceptance: "Human-readable acceptance criterion — what must actually work."
      verify: "A runnable command that proves acceptance — without it a task is never done."
      touches: "Paths this task touches, written relative to the item's code_path."
      status: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
      blocker: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise."
      log: "Append-only list of dated entries carried with the task — absent until the task first moves."
    status_lives_here: "Status is written on the task itself, so definition and state can never drift apart."
    history_lives_here_too: "There is no history file — how a task reached its state is in its own log, and a past entry is never rewritten."

  # <!-------------------------------------------- Task_States -->
  task_states:
    path: "The status field on each task."
    states:
      todo: "Defined and waiting — nobody has started it."
      claimed: "An agent has taken it and is working on it now."
      blocked: "Stopped by a named blocker — its blocker field holds the id in state.yaml."
      done: "Its verify ran and passed — the only route to done."
      cancelled: "The human withdrew it — it is kept, not deleted."
      superseded: "Replaced by a later task — the log says which."
    derived_ready: "ready is not a stored status — a task is ready when it is todo and all of its depends_on are done, computed at the moment it is needed."
    done_gate: "Without a passing verify run no task becomes done, even if the code is written."
    claim_protocol: "A task is set to claimed and the file written before work starts, so two agents never take the same task."
    status_only_in_development: "In development mode status, blocker, and log are the only fields an agent may change — the rest is the plan."

  # <!-------------------------------------------- Plans -->
  plans:

    backend:
      phase_titles_lifecycle: "empty"
      phase_titles_derived_from: "not derived yet"
      phase_titles: []
      phases: {}

    frontend:
      phase_titles_lifecycle: "empty"
      phase_titles_derived_from: "not derived yet"
      phase_titles: []
      phases: {}
