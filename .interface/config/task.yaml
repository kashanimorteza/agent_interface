        # <!-------------------- mapping -->
        phase_2.mapping:
          id: "phase_2.mapping"
          title: "Data Logic and Mapping"
          description: "The layer that derives the physical persistence design from the shared Models: columns from fields, foreign keys from relationships, constraints from rules, and at-rest transformations from credential nature. The Tasks are related because each resolves one kind of logical declaration into its storage representation through one Model-driven mechanism."
          area: "The Data Logic and Mapping layer and the derived storage design"
          does: "Every shared Model has a derived, engine-independent storage mapping that records its source Model, preserves every field, relationship, and rule, and applies the resolved at-rest mode to every credential field."
          constraints: []
          task_count: 4
          tasks:

            phase_2.mapping.columns:
              id: "phase_2.mapping.columns"
              title: "Map Model fields to table columns"
              description: "Derive for every shared Model a table whose columns carry each field's resolved type, nullability, uniqueness, size, default, and primary-key and auto-increment nature, named by the resolved naming conventions, with each table recording the Model it implements."
              reason: "A Model that has no table cannot be stored, and a column that loses a field property lets stored data violate the Model."
              kind: "code"
              inputs:
                - "Every shared Model's field declarations"
                - "The Engine naming conventions"
              expected_result: "Fourteen derived table mappings, each traceable to its source Model, with one column per field carrying the field's declared properties."
              depends_on:
                - "phase_2.package.establish"
              constraints: []
              acceptance: "Every one of the fourteen Models resolves to exactly one table that names its source Model; every field resolves to one column with matching nullability, uniqueness, size, and default; and every identifier column is an auto-incrementing primary key."
              verify: "Resolving the mapping for each Model yields a table recording that Model, whose column set equals the Model's field set and whose per-column properties equal the field's declared properties, including the three-character size of the currency code and the zero balance default of the account."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; deriving the storage design from the Model package's field declarations."
                - at: "2026-09-07T15:19:41Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "For each of the fourteen Models resolved its table mapping and asserted the table's comment records the source Model, the column set equals the field set, each column's nullability, uniqueness, primary-key and auto-increment nature, size, logical type, comment, and default equal the field's declared properties, and each table has one auto-incrementing integer primary key; asserted the currency code column has length three, the account balance defaults to zero, and the fourteen table names are the plural snake case of the Model names."
                  outcome: "Passed."

            phase_2.mapping.foreign_keys:
              id: "phase_2.mapping.foreign_keys"
              title: "Map relationships to foreign keys"
              description: "Resolve every declared relationship into an explicit foreign key on the carrying field, referencing the related Model's primary key with the same type, indexed, with the resolved referential actions, and keep roles explicit where a Model relates to the same target more than once."
              reason: "A relationship that exists only in the Model is a connection the stored data can break."
              kind: "code"
              inputs:
                - "Every shared Model's relationship declarations"
                - "The derived column mappings"
                - "The relationship defaults"
              expected_result: "Every declared relationship is a recorded foreign key carrying the referencing field, referenced table, and referenced column."
              depends_on:
                - "phase_2.mapping.columns"
