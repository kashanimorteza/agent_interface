                verify: |-
                  uv run python -c "from app import config; assert config.DATABASE_PATH == 'app.db'; assert config.DATABASE_URL == 'sqlite:///app.db'; print('ok')" && DATABASE_PATH=x.db uv run python -c "from app import config; assert config.DATABASE_URL == 'sqlite:///x.db'; print('ok')"
