              - .interface/principles/database.md — 1 (three internal layers), 2 (engine independence), 3–4 (defined as code, ordered reversible migrations), 6 (one generic interface), 7 (Instances), 8–9 (tables,
                constraints, relationships), 10 (secrets and credential storage), 11 (initial data)
              - .interface/principles/backend.md — 9 (credentials are write-only at the API boundary)
              expected_result: After upgrade head with the key set, every table holds exactly its declared records with the declared values and relationship identifiers, generated credentials are stored transformed,
                re-seeding over a pre-existing natural key creates no duplicate, downgrading the seed revision removes the records, and upgrading without the key fails without storing an encrypted record.
              depends_on:
              - P2-G2-T2
              constraints:
              - 'Resolved by Planning from the Preferences and the project definition: the Database package is my_database at database/ (distribution my-database, internal, never published, installed by consumers
                as an editable local path dependency), a uv-managed Python project on CPython 3.14.7 with uv 0.12.10, SQLAlchemy 2.0.52 as ORM and Alembic 1.19.2 as migration tool, with three nested packages
                for the Database Interface, Data Logic and Mapping, and Storage Adapter layers; it installs my_model from model/ as an editable path dependency. The one configured Instance is general — name
                "Trading Assistant General", purpose "General application data.", Engine SQLite (file-backed, runtime-provided sqlite3, foreign keys enforced, check_same_thread false), database identity trading_assistant_general,
                file database/data/trading_assistant_general.db — and it is the default Instance. Every verify command runs from database/ through uv run.'
              - 'Seeding resolved from the initial data of project.md under the Preferences: the 22 initial records are applied by an idempotent data migration after the schema revisions, in definition order
                (which respects every relationship dependency), matching each record on its Model''s natural key (user: name, currency: code, trading_platform: name, broker: user_id + name, account_group: name,
                account: name, asset: symbol, trailing_group: name, partial_group: name, action_group: name, action: name) — the explicitly unique field other than name, else name, else the composite unique
                rule — so re-running creates no duplicate; a literal relationship identifier is preserved exactly; a value written as a generate instruction is fulfilled with a cryptographically random value
                at seed time and never written into any file of the repository.'
              - 'Credential at-rest modes resolved by the Preferences'' precedence (explicit project rule, then field-name default, then the plaintext layer default): user.password hash, user.api_key hash,
                account.password encrypted. hash is a salted one-way hash suitable for verification; encrypted is reversible encryption under a key read from the environment variable TRADING_ASSISTANT_CREDENTIAL_ENCRYPTION_KEY
                (any non-empty secret is accepted and the cipher key is derived from it; the URL-safe base64 encoding of 32 random bytes is a valid value), required before the first encrypted write including
                seeding; no key, generated value, or stored representation is ever written into a file of the repository.'
              - Consumers import only from the my_database package root; the Engine, connection, ORM mappings, tables, migrations, and database file are never exposed.
              - The isolated environment, build artifacts, and every database file under the data directory stay out of source control (the repository already ignores *.db).
              - Storage schema objects are created, altered, and dropped only by migrations; application code and the ORM never create tables at startup.
              - 'No test framework, logging, error handling, or authentication capability is introduced: every cross-cutting capability is disabled in the Development Preferences.'
              - The seeding data migration is the last revision of this phase's history.
              acceptance: The verify run seeds a fresh Instance, checks every table's record count against the declared initial data, the recorded values and relationship identifiers, and the transformed credentials,
                proves the failure without the key, and proves idempotency by reverting the seed, pre-inserting one natural key, and re-seeding.
              verify: |
