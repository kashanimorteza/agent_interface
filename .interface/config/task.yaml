meta:
  path: ".interface/config/task.yaml"
  path_note: "Generated task frame and one empty plan per indexed project item."

policy:
  planning: "my-interface-tasker may derive phase titles and write phases, groups, and tasks only in planning mode."
  development: "my-interface-developer may change only task status, blocker, and append-only log fields."
  human_only: "The human confirms phase title lifecycles and authorizes plan changes."

read_order:
  - "task_schema"
  - "task_states"
  - "plans"

content_map:
  task_schema: "The exact frame every future task must follow."
  task_states: "The allowed stored task states and transition protocols."
  plans: "Separate initial plans for database, backend, and frontend."

content:
  task_schema:
    rule: "Every task carries exactly the fields listed here; optional fields are omitted until applicable."
    fields:
      id: "Identifier unique within its item."
      title: "The atomic task in one sentence."
      goal: "What becomes possible after the task."
      depends_on: "Task ids in the same item only."
      needs_contract: "A required external contract version, omitted when none is needed."
      acceptance: "The human-readable completion criterion."
      verify: "A runnable command that proves acceptance."
      touches: "Paths relative to the item's code_path."
      status: "One stored value from task_states.states."
      blocker: "A state blocker id, present only while blocked."
      log: "Append-only dated history, absent until the task first moves."
    status_lives_here: "A task's status is stored only on that task."
    history_lives_here_too: "A task's append-only log is its complete history; there is no separate history file."

  task_states:
    path: "content.plans.<item>.phases.<phase>.groups.<group>.tasks.<task>.status"
    states:
      todo: "Defined and not yet claimed."
      claimed: "Claimed by one developer before work begins."
      blocked: "Unable to proceed and linked to a blocker in state.yaml."
      done: "Acceptance is met and verify passed."
      cancelled: "Intentionally stopped by an authorized plan decision."
      superseded: "Replaced by a later authorized task."
    derived_ready: "Ready is never stored; todo plus all same-item dependencies done means ready."
    done_gate: "A task cannot become done without a passing verify command."
    claim_protocol: "Write claimed status before changing product code."
    status_only_in_development: "During development, only status, blocker, and log may change."

  plans:
    database:
      phase_titles_lifecycle: "empty"
      phase_titles_derived_from: "not derived yet"
      phase_titles: {}
      phases: {}
    backend:
      phase_titles_lifecycle: "empty"
      phase_titles_derived_from: "not derived yet"
      phase_titles: {}
      phases: {}
    frontend:
      phase_titles_lifecycle: "empty"
      phase_titles_derived_from: "not derived yet"
      phase_titles: {}
      phases: {}
