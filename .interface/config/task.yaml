# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/task.yaml
  path_note: 'Generated configuration of the Task Component — the resolved Task frame, the Task-state vocabulary, and one Plan per project phase. Shape: schema/task.yaml; rules: principles/task.md; the Task Preferences layer is empty'
  standard: Agent Project Interface
  schema_version: '5.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: The configuring operation materializes task_schema, task_states, the task_count totals (zero until Tasks exist), and one Plan shell per phase with empty groups; it never creates a Group or Task. Every operation that adds or removes Tasks recalculates the Group, Plan, and total task_count values. The planning operation fills the groups of the one phase it was invoked for. The development operation changes only the status, blocker, and log of a Task it has claimed. Reset acts as its own fixed script defines
  changed_by: The planning operation (Plan groups), the development operation (Task status, blocker, log), the reset operation, and the configuring operation (frame and empty shells only)
  preservation: On re-configuring, an existing Plan whose groups are non-empty is preserved when its source phase is unchanged. Removing or changing a phase whose Plan holds Tasks is a critical conflict, reported and never applied silently. This run found no existing Plans, so every Plan shell below was created empty


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- task_schema
- task_states
- task_count
- plans


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: The resolved field frame every Task carries
  task_states: The Task-status vocabulary and the derived readiness and completion conditions
  task_count: The total number of Tasks stored across all Plans, recalculated whenever Tasks are added or removed
  plans: One Plan per project phase, keyed by phase id from definition.yaml


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- task_schema -->
  task_schema:
    rule: Every Task carries exactly these fields — no more, no fewer. blocker and log are structurally part of the frame but are absent until they first apply.
    fields:
      id: Identifier in the form <phase>-G<group>-T<n>, unique within its Plan and unambiguous across all Plans.
      title: A concise statement of the one atomic action.
      description: A complete explanation of what must be done.
      reason: Why the Task is necessary.
      target: The Component in which the Task performs its work — the phase target from definition.yaml.
      area: The specific module, subsystem, or work area inside the target Component, such as one of its resolved layers or the Platform composition the phase delivers for it.
      execution_context:
        kind: The nature of the work — code, configuration, documentation, data, or command execution.
        language: The applicable programming or configuration language, or null when none applies.
        technologies: The ordered technologies, frameworks, packages, protocols, or tools relevant to the Task, resolved from the target Component's configuration; empty when none apply.
        instructions: Implementation guidance sufficient to perform this specific Task.
        inputs: The information, artifacts, interfaces, or completed results the Task consumes; empty when none apply.
        expected_output: The concrete artifact or observable result the Task must produce.
      depends_on: The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent.
      constraints: Task-specific restrictions and invariants the implementation must preserve; empty when none apply.
      acceptance: The observable criterion that determines whether the intended result is correct.
      verify: A runnable command or precise executable check, run from the target Component's verify_cwd, that proves acceptance.
      touches: The explicit files, directories, or resources the Task inspects or modifies, relative to the target Component's code_path.
      status: The current Task state, using the task_states vocabulary.
      blocker: The identifier of the critical Blocker in state.yaml when the Task is blocked; absent otherwise.
      log: The append-only Task-local progress history of dated entries; absent until the first recorded transition.
    status_lives_here: The current status is stored on each Task, so Plans and State never drift apart.
    history_lives_here_too: There is no separate history file. While a Task exists, how it reached its state is recorded in its own append-only log.

  # <!-------------------------------------------- task_states -->
  task_states:
    path: The status field on each Task.
    states:
      todo: Defined and not yet started.
      claimed: An executor has taken the Task and written the claim before starting work.
      blocked: Work cannot safely continue; the Task's blocker field names the Blocker in state.yaml.
      done: Acceptance is proven by a passing verify run.
      cancelled: The Task will not be done and no other Task replaces it.
      superseded: Another Task replaced this one; the log names the replacement.
    derived_ready: A Task is ready when its phase is ready, its status is todo, and every Task in its depends_on is done. Ready is computed when needed and never stored.
    phase_ready: A phase is ready for development when its Plan has at least one Group with at least one Task and every earlier phase is complete. Readiness is derived, never stored.
    phase_complete: A phase is complete when its Plan is non-empty, every Task not cancelled or superseded is done, and no Task remains todo, claimed, or blocked. Completion is derived, never stored.

  # <!-------------------------------------------- task_count -->
  task_count: 22

  # <!-------------------------------------------- plans -->
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, rules, and initial data.
      task_count: 22
      groups:
        P1-G1:
          id: P1-G1
          title: Package scaffold
          description: Establishes the toolchain and the my_model uv project inside model/ so every later Task has an isolated environment with the resolved Python, uv, and Pydantic versions. The Tasks are
            related because nothing in the package can be written or verified before the project and its environment exist.
          target: model
          area: package root (model/) and the development toolchain
          does: A uv-managed project at model/ named my-model, pinned to Python 3.14.7 with pydantic 2.13.5 locked, an importable empty my_model package under src/, and a verified toolchain.
          tasks:
          - id: P1-G1-T1
            title: Install and verify the resolved toolchain (uv 0.12.10 and Python 3.14.7)
            description: Make uv 0.12.10 and CPython 3.14.7 available on the development machine so the Model package can be created and verified with the exact resolved versions. Check the current uv version
              first; if it is not 0.12.10, install 0.12.10 with the version-pinned standalone installer (curl -LsSf https://astral.sh/uv/0.12.10/install.sh | sh) or, when Homebrew provides exactly 0.12.10,
              with brew upgrade uv, and make sure the installed binary is the one resolved on PATH (the standalone installer places it in ~/.local/bin, which must precede /usr/local/bin). Then run uv python
              install 3.14.7 so uv manages that interpreter.
            reason: model.yaml resolves the Model package to Python 3.14.7 managed by uv 0.12.10; every verify command in this Plan runs through uv with those versions, and the shared toolchain policy makes
              installing required prerequisites part of Development.
            target: model
            area: development toolchain
            execution_context:
              kind: command execution
              language: null
              technologies:
              - uv 0.12.10
              - Python 3.14.7
              instructions: |
                1. Run `uv --version`. If it prints `uv 0.12.10`, skip to step 3.
                2. Install uv 0.12.10: either `curl -LsSf https://astral.sh/uv/0.12.10/install.sh | sh` (installs to ~/.local/bin) or `brew upgrade uv` when Homebrew's formula is exactly 0.12.10. Open a new shell (or export PATH so ~/.local/bin precedes /usr/local/bin) and confirm `uv --version` prints `uv 0.12.10`. Preserve any other uv installation; do not remove Homebrew packages.
                3. Run `uv python install 3.14.7` and confirm `uv python find 3.14.7` prints an interpreter path.
                4. Record the installation method actually used in this Task's log.
              inputs:
              - .interface/config/model.yaml — implementation.tech (language and environment versions)
              - The machine's current uv installation, if any (this machine had Homebrew uv 0.12.7 and a uv-managed CPython 3.14.7 when the Plan was written)
              expected_output: A shell in which `uv --version` prints `uv 0.12.10` and `uv python find 3.14.7` resolves an interpreter.
            depends_on: []
            constraints:
            - Do not uninstall or downgrade unrelated tools; other projects on the machine keep their installations.
            - Use only the official uv installer or Homebrew; do not build uv from source.
            acceptance: '`uv --version` reports exactly 0.12.10 and uv can find CPython 3.14.7.'
            verify: uv --version | grep -qx 'uv 0.12.10' && uv python find 3.14.7
            touches:
            - ~/.local/bin/uv or /usr/local/bin/uv (toolchain, outside the package)
            - uv-managed Python installations (outside the package)
            status: todo
          - id: P1-G1-T2
            title: Create the my_model uv project with src layout and a locked pydantic dependency
            description: 'Create the model/ directory as a uv project for the importable library my_model: a pyproject.toml declaring the distribution name my-model, version 0.1.0, requires-python >=3.14,<3.15,
              the single dependency pydantic==2.13.5, and the uv_build build backend (requires uv_build>=0.12.10,<0.13.0, build-backend uv_build, which defaults to the src layout and derives the module name
              my_model); a .python-version file pinning 3.14.7; a README.md stub holding only the title line `# my_model` and one sentence (the full README is written by P1-G4-T3); and src/my_model/__init__.py
              containing only a module docstring for now. Run uv sync to create the .venv and uv.lock.'
            reason: Every later Task adds modules to this package and verifies them through uv run inside this environment; the src layout and uv_build backend are the resolved package form recorded in development.yaml,
              and the Database and Backend phases later install this project as an editable path dependency, which requires a working build backend.
            target: model
            area: package root (model/)
            execution_context:
              kind: configuration
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
              instructions: |
                1. Create model/pyproject.toml with:
                   [project] name = "my-model", version = "0.1.0", description = "Shared logical Models of Trading Assistant", readme = "README.md", requires-python = ">=3.14,<3.15", dependencies = ["pydantic==2.13.5"]
                   [build-system] requires = ["uv_build>=0.12.10,<0.13.0"], build-backend = "uv_build"
                   Do not add a [tool.uv.build-backend] table: the defaults (module-root src, module-name my_model) are the intended layout.
                2. Write model/.python-version containing `3.14.7`.
                3. Write model/README.md with the line `# my_model` and one sentence saying it is the shared Model package of Trading Assistant.
                4. Create model/src/my_model/__init__.py with a docstring only (`"""Shared logical Models of Trading Assistant."""`).
                5. From model/ run `uv sync`; it must create model/.venv and model/uv.lock and install pydantic 2.13.5.
                6. Confirm the root .gitignore already ignores .venv, dist/, and __pycache__/ (it does); commit uv.lock and .python-version, never .venv.
              inputs:
              - P1-G1-T1 — the verified toolchain
              - .interface/config/model.yaml — implementation (code_path, package, tech)
              - .interface/config/development.yaml — packages.my_model (kind, distribution) and package_standard.naming
              expected_output: model/pyproject.toml, model/.python-version, model/README.md (stub), model/src/my_model/__init__.py, model/uv.lock, and a synced model/.venv.
            depends_on:
            - P1-G1-T1
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            - The only run-time dependency is pydantic; pyyaml is used by verify commands through `uv run --with pyyaml` and is never added to the project.
            acceptance: uv sync succeeds, the lock is current, and the environment runs CPython 3.14.7 with pydantic 2.13.5 and an importable my_model package.
            verify: uv lock --check && uv run python -c 'import sys, pydantic, my_model; assert sys.version_info[:3] == (3, 14, 7), sys.version; assert pydantic.VERSION == "2.13.5", pydantic.VERSION; print("ok")'
            touches:
            - pyproject.toml
            - .python-version
            - README.md
            - src/my_model/__init__.py
            - uv.lock
            - .venv/ (created, never committed)
            status: todo
          task_count: 2
        P1-G2:
          id: P1-G2
          title: Logical metadata and base class
          description: 'Builds the private foundation every Model module relies on: the immutable metadata structures that carry a Model''s resolved logical definition, and the shared Pydantic base class with
            the field-annotation helper, the metadata builder, and the consistency check. The Tasks are related because the Model classes can only be declared once these two modules exist.'
          target: model
          area: private modules src/my_model/_metadata.py and src/my_model/_base.py
          does: A metadata frame whose as_dict output reproduces the exact shape of content.models in model.yaml, and a Model base class from which every shared Model derives its validation and its metadata.
          tasks:
          - id: P1-G2-T1
            title: Implement the logical metadata structures in _metadata.py
            description: 'Create src/my_model/_metadata.py with immutable structures describing a Model''s resolved logical definition: LogicalType, an UNSET sentinel for an undeclared default, FieldMeta, RelationshipMeta,
              RuleMeta, GenerateInstruction, and ModelMeta. Each structure has an as_dict() method that renders exactly the shape used under content.models in .interface/config/model.yaml so a Model''s metadata
              can be compared with the generated configuration verbatim.'
            reason: model.yaml requires model_metadata(model) to return the resolved logical definition of a Model — fields with type, size, nullable, default, auto_increment, primary_key, unique, credential,
              and purpose; relationships; rules; and initial data — in a stable structure that Database and Backend consume instead of parsing the file.
            target: model
            area: src/my_model/_metadata.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
              instructions: |
                Implement, using dataclasses(frozen=True, kw_only=True) and enum.StrEnum:
                - `class LogicalType(StrEnum)`: integer, string, boolean, decimal, float, datetime.
                - `UNSET`: a module-level sentinel object (its own class with a readable repr) meaning no logical default is declared; distinct from None and False.
                - `FieldMeta`: name: str | None = None; type: LogicalType; size: int | None = None; nullable: bool; default: object = UNSET; auto_increment: bool = False; primary_key: bool = False; unique: bool = False; credential: bool = False; purpose: str | None = None. as_dict() returns keys in this order and only when applicable: type (the enum value), size (when not None), nullable (always), default (when not UNSET, the literal as declared — False and 0 are included), auto_increment, primary_key, unique, credential (each only when True), purpose (when not None).
                - `RelationshipMeta`: name: str; type: str (belongs_to or uses); target: str; field: str | None = None; role: str | None = None. as_dict() returns type, target, field (when set), role (when set).
                - `RuleMeta`: rule: str; kind: str; field: str | None = None; fields: tuple[str, ...] | None = None; storage: str | None = None. as_dict() returns rule, kind, field (when set), fields as a list (when set), storage (when set).
                - `GenerateInstruction`: instruction: str = "Generate securely". as_dict() returns {"generate": instruction}.
                - `ModelMeta`: key: str; purpose: str; fields: tuple[FieldMeta, ...]; relationships: tuple[RelationshipMeta, ...] = (); rules: tuple[RuleMeta, ...] = (); initial_data: tuple[Mapping[str, object], ...] = (). as_dict() returns purpose, fields as an ordered mapping name -> FieldMeta.as_dict(), relationships as a mapping name -> as_dict() only when non-empty, rules as a list only when non-empty, and initial_data as a list of plain dicts only when non-empty, rendering every GenerateInstruction value through its as_dict(). Also provide `field(name)` returning the FieldMeta or raising KeyError.
                Export nothing from the package root yet; that is P1-G4-T2. Use only the standard library.
              inputs:
              - P1-G1-T2 — the project and environment
              - .interface/config/model.yaml — content.models (the target shape of as_dict) and implementation.public_interface.exports.metadata
              expected_output: src/my_model/_metadata.py defining LogicalType, UNSET, FieldMeta, RelationshipMeta, RuleMeta, GenerateInstruction, and ModelMeta with as_dict renderers.
            depends_on:
            - P1-G1-T2
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            - Structures are immutable; as_dict must never emit a key for an absent optional property, and must emit default when it is declared even if the value is False or 0.
            acceptance: Each structure renders exactly the model.yaml shape for representative inputs, including the omission rules for absent properties and the inclusion of False and 0 defaults.
            verify: |
              uv run python -c '
              from my_model._metadata import LogicalType, UNSET, FieldMeta, RelationshipMeta, RuleMeta, GenerateInstruction, ModelMeta
              f = FieldMeta(name="is_executed", type=LogicalType.boolean, nullable=False, default=False, purpose="x")
              assert f.as_dict() == {"type": "boolean", "nullable": False, "default": False, "purpose": "x"}, f.as_dict()
              i = FieldMeta(name="id", type=LogicalType.integer, nullable=False, auto_increment=True, primary_key=True)
              assert i.as_dict() == {"type": "integer", "nullable": False, "auto_increment": True, "primary_key": True}, i.as_dict()
              c = FieldMeta(name="code", type=LogicalType.string, size=3, nullable=False, unique=True, purpose="p")
              assert c.as_dict() == {"type": "string", "size": 3, "nullable": False, "unique": True, "purpose": "p"}, c.as_dict()
              assert list(c.as_dict()) == ["type", "size", "nullable", "unique", "purpose"]
              d = FieldMeta(name="description", type=LogicalType.string, nullable=True, purpose="d")
              assert d.as_dict() == {"type": "string", "nullable": True, "purpose": "d"} and d.default is UNSET
              r = RelationshipMeta(name="base_currency", type="uses", target="currency", field="base_currency_id", role="base currency")
              assert r.as_dict() == {"type": "uses", "target": "currency", "field": "base_currency_id", "role": "base currency"}
              u = RuleMeta(rule="r", kind="unique", fields=("user_id", "name"))
              assert u.as_dict() == {"rule": "r", "kind": "unique", "fields": ["user_id", "name"]}
              k = RuleMeta(rule="r", kind="credential", field="password", storage="hash")
              assert k.as_dict() == {"rule": "r", "kind": "credential", "field": "password", "storage": "hash"}
              assert GenerateInstruction().as_dict() == {"generate": "Generate securely"}
              m = ModelMeta(key="user", purpose="p", fields=(i, c), rules=(k,), initial_data=({"name": "Admin", "password": GenerateInstruction()},))
              assert m.as_dict() == {"purpose": "p", "fields": {"id": i.as_dict(), "code": c.as_dict()}, "rules": [k.as_dict()], "initial_data": [{"name": "Admin", "password": {"generate": "Generate securely"}}]}, m.as_dict()
              assert "relationships" not in m.as_dict() and m.field("code") is c
              print("ok")
              '
            touches:
            - src/my_model/_metadata.py
            status: todo
          - id: P1-G2-T2
            title: Implement the shared Model base class, metadata builder, and consistency check in _base.py
            description: Create src/my_model/_base.py with the Pydantic base class every shared Model extends, the mapping from logical types to Python types, build_metadata(cls) which assembles a ModelMeta
              from a Model class, and check_consistency(cls) which proves that the Python representation of a class agrees with its logical metadata. Each Model class declares its logical facts as class variables
              (logical_key, logical_purpose, logical_relationships, logical_rules, logical_initial_data) and annotates every field as Annotated[<python type>, FieldMeta(...)] with the Python default alongside.
            reason: The Model Principles require every Model to carry one shared logical meaning with domain validation, and model.yaml requires that metadata to be derivable from the package; a single base
              class keeps the fourteen Model modules uniform and lets the verify commands prove each module against the generated configuration.
            target: model
            area: src/my_model/_base.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
              instructions: |
                Implement in src/my_model/_base.py:
                - `PYTHON_TYPES: dict[LogicalType, type]` = {integer: int, string: str, boolean: bool, decimal: decimal.Decimal, float: float, datetime: datetime.datetime}.
                - `class Model(pydantic.BaseModel)` with `model_config = ConfigDict(extra="forbid", validate_assignment=True, from_attributes=True)` and ClassVar declarations `logical_key: ClassVar[str]`, `logical_purpose: ClassVar[str]`, `logical_relationships: ClassVar[tuple[RelationshipMeta, ...]] = ()`, `logical_rules: ClassVar[tuple[RuleMeta, ...]] = ()`, `logical_initial_data: ClassVar[tuple[Mapping[str, object], ...]] = ()`. Subclasses declare fields as `name: Annotated[<type>, FieldMeta(...)] [= default]`; Pydantic keeps the FieldMeta in `cls.model_fields[name].metadata`.
                - `build_metadata(cls) -> ModelMeta`: iterate cls.model_fields in declaration order, take the single FieldMeta from each field's metadata (raise TypeError when absent or duplicated), copy it with name set (dataclasses.replace), and return ModelMeta(key=cls.logical_key, purpose=cls.logical_purpose, fields=..., relationships=cls.logical_relationships, rules=cls.logical_rules, initial_data=cls.logical_initial_data).
                - `check_consistency(cls) -> None`, raising ValueError naming the first violation: (a) every field carries exactly one FieldMeta; (b) the annotation's base type, after unwrapping `X | None`, is PYTHON_TYPES[meta.type]; (c) the annotation is optional (`X | None`) if and only if meta.nullable or meta.auto_increment or meta.credential; (d) when meta.default is declared the field is not required and its Python default equals the declared literal converted for the type (Decimal(str(literal)) for decimal, the literal itself otherwise); (e) when no default is declared the field is required unless optional, in which case its default is None; (f) logical_key is non-empty lower_snake_case; every relationship field, rule field, and initial-data key names a declared field.
                The rules for optional fields encode the resolved decision that a Model instance exists before persistence assigns its auto-increment key and that Database returns instances without credential values (database.yaml, layers.database_interface.operations), while the metadata keeps their logical nullability false.
              inputs:
              - P1-G2-T1 — src/my_model/_metadata.py
              - .interface/config/model.yaml — implementation.public_interface.exports.validation and content.models
              - .interface/config/database.yaml — layers.database_interface.operations (credential fields are never populated in returned instances)
              expected_output: src/my_model/_base.py defining PYTHON_TYPES, Model, build_metadata, and check_consistency.
            depends_on:
            - P1-G2-T1
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            - Class-variable names use the logical_ prefix, never Pydantic's model_ namespace.
            - Unknown fields are rejected (extra=forbid) and assignments are validated.
            acceptance: A throwaway subclass declared with the documented conventions passes check_consistency, yields the expected ModelMeta with fields in declaration order, validates required fields, rejects
              unknown fields, and applies defaults.
            verify: |
              uv run python -c '
              from typing import Annotated, ClassVar
              from decimal import Decimal
              import pydantic
              from my_model._base import Model, build_metadata, check_consistency, PYTHON_TYPES
              from my_model._metadata import FieldMeta, LogicalType, RelationshipMeta
              class Thing(Model):
                  logical_key: ClassVar[str] = "thing"
                  logical_purpose: ClassVar[str] = "A thing."
                  logical_relationships: ClassVar[tuple] = (RelationshipMeta(name="owner", type="belongs_to", target="user", field="owner_id"),)
                  logical_initial_data: ClassVar[tuple] = ({"name": "One", "owner_id": 1},)
                  id: Annotated[int | None, FieldMeta(type=LogicalType.integer, nullable=False, auto_increment=True, primary_key=True)] = None
                  name: Annotated[str, FieldMeta(type=LogicalType.string, nullable=False, unique=True, purpose="Name.")]
                  owner_id: Annotated[int, FieldMeta(type=LogicalType.integer, nullable=False)]
                  secret: Annotated[str | None, FieldMeta(type=LogicalType.string, nullable=False, credential=True)] = None
                  amount: Annotated[Decimal, FieldMeta(type=LogicalType.decimal, nullable=False, default=0)] = Decimal("0")
                  note: Annotated[str | None, FieldMeta(type=LogicalType.string, nullable=True)] = None
              check_consistency(Thing)
              m = build_metadata(Thing)
              assert m.key == "thing" and [f.name for f in m.fields] == ["id", "name", "owner_id", "secret", "amount", "note"]
              assert m.as_dict()["fields"]["amount"] == {"type": "decimal", "nullable": False, "default": 0}
              assert m.as_dict()["fields"]["secret"] == {"type": "string", "nullable": False, "credential": True}
              assert m.as_dict()["relationships"] == {"owner": {"type": "belongs_to", "target": "user", "field": "owner_id"}}
              t = Thing(name="n", owner_id=1)
              assert t.id is None and t.secret is None and t.amount == Decimal("0") and PYTHON_TYPES[LogicalType.decimal] is Decimal
              bad = 0
              for kw in ({"name": "n"}, {"name": "n", "owner_id": 1, "extra": 1}, {"name": "n", "owner_id": "x"}):
                  try:
                      Thing(**kw)
                  except pydantic.ValidationError:
                      bad += 1
              assert bad == 3, bad
              class Wrong(Model):
                  logical_key: ClassVar[str] = "wrong"
                  logical_purpose: ClassVar[str] = "w"
                  value: Annotated[str, FieldMeta(type=LogicalType.integer, nullable=False)]
              try:
                  check_consistency(Wrong); raise SystemExit("inconsistent class accepted")
              except ValueError:
                  pass
              print("ok")
              '
            touches:
            - src/my_model/_base.py
            status: todo
          task_count: 2
        P1-G3:
          id: P1-G3
          title: Model classes
          description: Declares the fourteen shared Models, one module per Model in project order, each deriving from the shared base class and carrying its resolved fields, relationships, rules, and initial
