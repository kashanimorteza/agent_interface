              description: "Add the Database layer's section to the centralized public runtime configuration with the non-secret settings of every Instance and the default Instance key, declare its binding to the Model package, name every secret the layer needs in the secrets example with the environment as its source, and keep the real secrets file out of version control."
              reason: "Every phase that delivers a layer also delivers that layer's part of the composition, and a persistence layer without configured connections cannot be composed with anything."
