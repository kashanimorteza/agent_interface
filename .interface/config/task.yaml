# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/task.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Task Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- task_count -->
  task_count: 72

  # <!-------------------------------------------- plans -->
  plans:

    # <!------------------------------- Phase 1 -->
    phase-1:
      id: "phase-1"
      title: "Model"
      order: 1
      target: "Model"
      does: "The independent Model layer exists as a reusable package whose documented public surface exposes every entity the project defines, with resolved fields, declared connections, own-data validation, and the records the project requires at the start."
      constraints: []
      task_count: 21
      groups:

        # <!-------------------- Group 1 -->
        phase-1-g1:
          id: "phase-1-g1"
          title: "Package foundation"
          description: "Everything the layer must own before any entity can be defined inside it: its own package boundary, and the definition behaviour every one of its Models relies on."
          area: "The Model package boundary and the shared definition behaviour inside it"
          does: "The layer exists as its own package with its declared dependencies and isolated environment, and carries the shared definition behaviour every Model builds on."
          constraints: []
          task_count: 2
          tasks:

            phase-1-g1-boundary:
              id: "phase-1-g1-boundary"
              title: "Establish the layer as an independent package boundary"
              description: "Bring the layer into existence as its own package: its identity under the resolved naming basis, its declared dependency set, and an isolated environment those dependencies resolve into, so the layer owns everything it needs without reaching outside itself."
              reason: "Every later activity in this phase adds to a boundary that must already own its identity, its dependencies, and the environment they run in."
              kind: "configuration"
              inputs:
                - "The resolved package naming and distribution conventions"
                - "The resolved implementation language, isolated environment, and modeling technology"
              expected_result: "The layer exists as its own package with a declared identity and dependency set, and those dependencies resolve into an environment isolated to this layer."
              depends_on: []
              constraints: []
              acceptance: "The package identity follows the resolved naming basis, the declared dependencies resolve, and the environment holding them belongs to this layer alone."
              verify: "The declared dependency set resolves repeatably into the layer's own isolated environment, the resolved identity is readable from the package's own declaration, and no environment artifact is carried in version-controlled content."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Created the layer's own package with its declared identity, its pinned dependency and its isolated environment."
                  check: "uv sync run twice with 'uv export --no-hashes | sort | md5'; the resolved distribution identity read back through importlib.metadata; git status --porcelain for environment artifacts"
                  outcome: "Both resolutions produced the digest c616606b0d5fbe4e953554a62f60c4d2; identity read back as my-model 0.1.0 importable as my_model; no environment artifact is version-controlled. Resolved concrete versions: Python 3.14.7, Pydantic 2.13.5."

            phase-1-g1-foundation:
              id: "phase-1-g1-foundation"
              title: "Establish the shared definition behaviour every Model builds on"
              description: "Provide the behaviour every entity definition in this package relies on: completing a field's unstated properties without displacing a stated one, keeping an absent value distinct from an explicitly empty one and from a value awaiting declared generation, marking a field as a credential together with the storage treatment it requires, and validating what a definition can determine from its own values."
              reason: "Stated once, this behaviour keeps every definition consistent and stops each one inventing its own answer to the same question."
              kind: "code"
              inputs:
                - "The resolved defaults for unstated field properties"
                - "The resolved modeling technology"
              expected_result: "A definition built on this foundation completes its unstated field properties, preserves the stated ones, keeps absent, explicitly empty, and pending generated values distinguishable, and rejects values that violate what it can determine on its own."
              depends_on:
                - "phase-1-g1-boundary"
              constraints: []
              acceptance: "A stated field property survives completion unchanged, including one stated as false or empty; an unstated property is completed from the applicable default; and a field that exists only among the defaults is never introduced into a definition."
              verify: "A definition stating a property keeps it after completion, one omitting that property carries the applicable default afterwards, and a field appearing only among the defaults is absent from the resulting definition."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Built the shared definition behaviour: per-property completion from the applicable defaults, credential declaration with its storage treatment, the absent / explicitly-empty / awaiting-generation distinction, and own-data validation."
                  check: "uv run python check_g1_foundation.py"
                  outcome: "PASS: a property stated as False survived completion, an omitted one was completed from its exact-name and name-shape default, a name present only among the defaults stayed out of the definition, and an omitted field stayed distinguishable from one set to nothing."

        # <!-------------------- Group 2 -->
        phase-1-g2:
          id: "phase-1-g2"
          title: "Domain entity definitions"
          description: "One shared definition for each entity the project's domain is made of, each carrying the information, connections, and rules the project states for it. Nothing here decides how the definitions are stored, exposed, or presented."
          area: "The domain entity definitions the package holds"
          does: "Every entity the project defines is available as a shared definition with its resolved fields, its declared connections, and validation of what its own values determine."
          constraints: []
          task_count: 14
          tasks:

            phase-1-g2-user:
              id: "phase-1-g2-user"
              title: "Define the User entity"
              description: "Express User as a shared definition carrying what the project states for it, including which of its fields are credentials and the storage treatment each of those requires."
              reason: "Separate users with separate settings depend on one shared definition of what a user is, and its credential fields must be identifiable as credentials wherever they travel."
              kind: "code"
              inputs:
                - "The project's definition of the User entity"
                - "The shared definition behaviour of this package"
              expected_result: "User is available as a shared definition with its resolved fields, its credential declarations and their required storage treatment, and validation of what its own values determine."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "A user built from valid values carries every declared field with its stated meaning, and each credential field is identifiable as a credential together with the storage treatment the project requires for it."
              verify: "Valid user values produce the declared domain state, each credential field reports itself as a credential with its required storage treatment, and values violating what the definition determines on its own are rejected with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined User with its credential fields and the hashed storage each requires."
                  check: "uv run python check_entities.py user"
                  outcome: "PASS: valid values produced the declared state, both credentials reported hashed storage at rest, and a record missing its required credential was refused naming the missing fields."

            phase-1-g2-currency:
              id: "phase-1-g2-currency"
              title: "Define the Currency entity"
              description: "Express Currency as a shared definition carrying what the project states for it, including the fixed length of its standard code and the monetary decimal precision it declares."
              reason: "Every monetary value in the system is interpreted against a currency, so its code and precision must mean the same thing to every layer that reads them."
              kind: "code"
              inputs:
                - "The project's definition of the Currency entity"
                - "The shared definition behaviour of this package"
              expected_result: "Currency is available as a shared definition whose standard code is constrained to its declared length and whose monetary precision is readable from the definition."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "A currency built from valid values carries its standard code at the declared length and its monetary precision unchanged, and a code of any other length is refused."
              verify: "Values whose code matches the declared length are accepted with the precision preserved, and a code of a different length is refused with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Currency with its fixed-length standard code and monetary precision."
                  check: "uv run python check_entities.py currency"
                  outcome: "PASS: a three-character code was accepted with its precision preserved, while a shorter and a longer code were each refused with the reason."

            phase-1-g2-trading-platform:
              id: "phase-1-g2-trading-platform"
              title: "Define the Trading Platform entity"
              description: "Express Trading Platform as a shared definition carrying what the project states for it, including the selector value that identifies which platform implementation the application is to use."
              reason: "The system stays independent of any one exchange or broker only if the platform is domain data naming its implementation, rather than an implementation naming itself."
              kind: "code"
              inputs:
                - "The project's definition of the Trading Platform entity"
                - "The shared definition behaviour of this package"
              expected_result: "Trading Platform is available as a shared definition whose implementation selector is carried as ordinary domain data."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "A platform built from valid values carries its display name and its implementation selector unchanged, and needs no platform implementation to exist in order to be valid."
              verify: "Valid platform values are accepted and the implementation selector is readable from the resulting state without any platform implementation being present."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Trading Platform, carrying its implementation selector as domain data."
                  check: "uv run python check_entities.py trading-platform"
                  outcome: "PASS: the implementation selector was readable from the resulting state with no platform implementation present."

            phase-1-g2-account-group:
              id: "phase-1-g2-account-group"
              title: "Define the Account Group entity"
              description: "Express Account Group as a shared definition carrying what the project states for it."
              reason: "Accounts are organized into groups, and the group must be a subject of its own before anything can be assigned to it."
              kind: "code"
              inputs:
                - "The project's definition of the Account Group entity"
                - "The shared definition behaviour of this package"
              expected_result: "Account Group is available as a shared definition that stands on its own."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "An account group built from valid values is complete without any account referring to it."
              verify: "Valid account-group values produce the declared domain state with no account present."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Account Group as a standalone grouping."
                  check: "uv run python check_entities.py account-group"
                  outcome: "PASS: valid values produced the declared state with no account present and no connection required."

            phase-1-g2-asset:
              id: "phase-1-g2-asset"
              title: "Define the Asset entity"
              description: "Express Asset as a shared definition carrying what the project states for it, including its category and the values that describe the precision of its price."
              reason: "The system has to know exactly what is being traded and how finely its price moves, and every layer must read those the same way."
              kind: "code"
              inputs:
                - "The project's definition of the Asset entity"
                - "The shared definition behaviour of this package"
              expected_result: "Asset is available as a shared definition carrying its trading symbol, its category, and the values describing its price precision."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "An asset built from valid values exposes its category and both price-precision values so a reader can interpret its prices without consulting anything else."
              verify: "Valid asset values are accepted and the resulting state yields the category and both price-precision values directly."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Asset with its category and price-precision values."
                  check: "uv run python check_entities.py asset"
                  outcome: "PASS: the category and both price-precision values were readable directly from the resulting state."

            phase-1-g2-trailing-group:
              id: "phase-1-g2-trailing-group"
              title: "Define the Trailing Group entity"
              description: "Express Trailing Group as a shared definition carrying what the project states for it."
              reason: "The set of rules that manage protective and target levels is identified by its group, which must exist as a subject before its rules refer to it."
              kind: "code"
              inputs:
                - "The project's definition of the Trailing Group entity"
                - "The shared definition behaviour of this package"
              expected_result: "Trailing Group is available as a shared definition identifying a rule set independently of the rules it will hold."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "A trailing group built from valid values is complete with no rule assigned to it."
              verify: "Valid trailing-group values produce the declared domain state with no rule present."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Trailing Group as a standalone rule set."
                  check: "uv run python check_entities.py trailing-group"
                  outcome: "PASS: valid values produced the declared state with no rule present and no connection required."

            phase-1-g2-partial-group:
              id: "phase-1-g2-partial-group"
              title: "Define the Partial Group entity"
              description: "Express Partial Group as a shared definition carrying what the project states for it."
              reason: "The rules that close portions of an open trade are identified by their group, which must exist as a subject before its rules refer to it."
              kind: "code"
              inputs:
                - "The project's definition of the Partial Group entity"
                - "The shared definition behaviour of this package"
              expected_result: "Partial Group is available as a shared definition identifying a rule set independently of the rules it will hold."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "A partial group built from valid values is complete with no rule assigned to it."
              verify: "Valid partial-group values produce the declared domain state with no rule present."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Partial Group as a standalone rule set."
                  check: "uv run python check_entities.py partial-group"
                  outcome: "PASS: valid values produced the declared state with no rule present and no connection required."

            phase-1-g2-action-group:
              id: "phase-1-g2-action-group"
              title: "Define the Action Group entity"
              description: "Express Action Group as a shared definition carrying what the project states for it."
              reason: "Actions are selected by the risk level of the grouping they belong to, so that grouping is a subject in its own right."
              kind: "code"
              inputs:
                - "The project's definition of the Action Group entity"
                - "The shared definition behaviour of this package"
              expected_result: "Action Group is available as a shared definition identifying a risk-based grouping independently of the actions assigned to it."
              depends_on:
                - "phase-1-g1-foundation"
              constraints: []
              acceptance: "An action group built from valid values is complete with no action assigned to it."
              verify: "Valid action-group values produce the declared domain state with no action present."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Action Group as a standalone risk-based grouping."
                  check: "uv run python check_entities.py action-group"
                  outcome: "PASS: valid values produced the declared state with no action present and no connection required."

            phase-1-g2-broker:
              id: "phase-1-g2-broker"
              title: "Define the Broker entity"
              description: "Express Broker as a shared definition carrying what the project states for it, including its two declared connections and the uniqueness rule that spans more than one of its fields."
              reason: "The system works with any configured broker, so a broker's owner and its trading platform are part of what a broker is."
              kind: "code"
              inputs:
                - "The project's definition of the Broker entity"
                - "The resolved User and Trading Platform definitions"
              expected_result: "Broker is available as a shared definition carrying both declared connections through the fields that express them, with its multi-field uniqueness rule declared and traceable to it."
              depends_on:
                - "phase-1-g2-user"
                - "phase-1-g2-trading-platform"
              constraints: []
              acceptance: "A broker built from valid values carries both declared connections through their expressing fields, and its multi-field uniqueness rule is discoverable as part of the definition rather than enforced by it."
              verify: "Valid broker values are accepted with both connections readable from the resulting state, and the multi-field uniqueness rule is retrievable from the definition without the definition attempting to evaluate it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Broker with both connections and its multi-field uniqueness rule declared for the layer that holds the records."
                  check: "uv run python check_entities.py broker"
                  outcome: "PASS: both connections were readable from the resulting state, the multi-field uniqueness rule was retrievable without the entity attempting to evaluate it, and a second broker sharing a name was accepted because no stored records were available to judge it."

            phase-1-g2-trailing-rule:
              id: "phase-1-g2-trailing-rule"
              title: "Define the Trailing Rule entity"
              description: "Express Trailing Rule as a shared definition carrying what the project states for it, including its activation threshold and the adjustments the project allows to be left unset."
              reason: "How protective and target levels move during a trade is decided per rule, and an adjustment nobody set must stay distinguishable from one deliberately set to nothing."
              kind: "code"
              inputs:
                - "The project's definition of the Trailing Rule entity"
                - "The resolved Trailing Group definition"
              expected_result: "Trailing Rule is available as a shared definition carrying its connection to the group that contains it, its required activation threshold, and its optional adjustments."
              depends_on:
                - "phase-1-g2-trailing-group"
              constraints: []
              acceptance: "A rule built from valid values carries its group connection and its activation threshold, and an omitted adjustment stays distinguishable from one explicitly set to no value."
              verify: "Valid rule values are accepted with the activation threshold preserved, and omitting an adjustment versus explicitly setting it to no value produces two distinguishable states."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Trailing Rule with its activation threshold and its optional adjustments."
                  check: "uv run python check_entities.py trailing-rule"
                  outcome: "PASS: the activation threshold kept its precision, and omitting an adjustment produced a state distinguishable from setting it to nothing."

            phase-1-g2-partial-rule:
              id: "phase-1-g2-partial-rule"
              title: "Define the Partial Rule entity"
              description: "Express Partial Rule as a shared definition carrying what the project states for it, including the threshold that activates it and the portion of the position it closes."
              reason: "How much of an open trade is closed, and at what point, is decided per rule and must mean the same to every layer that acts on it."
              kind: "code"
              inputs:
                - "The project's definition of the Partial Rule entity"
                - "The resolved Partial Group definition"
              expected_result: "Partial Rule is available as a shared definition carrying its connection to its group and both of its required proportional values."
              depends_on:
                - "phase-1-g2-partial-group"
              constraints: []
              acceptance: "A rule built from valid values carries its group connection and both proportional values at their declared precision, and a value that is not a number is refused."
              verify: "Valid rule values are accepted with both proportional values preserved at their declared precision, and a non-numeric value is refused with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Partial Rule with both of its proportional values."
                  check: "uv run python check_entities.py partial-rule"
                  outcome: "PASS: both proportional values kept their declared precision and a non-numeric value was refused with the reason."

            phase-1-g2-account:
              id: "phase-1-g2-account"
              title: "Define the Account entity"
              description: "Express Account as a shared definition carrying what the project states for it, including its three declared connections and the access credential together with the storage treatment the project requires for it."
              reason: "An account is where a trade is actually sent, so where it belongs, what it is denominated in, and how it is accessed are all part of what it is."
              kind: "code"
              inputs:
                - "The project's definition of the Account entity"
                - "The resolved Account Group, Broker, and Currency definitions"
              expected_result: "Account is available as a shared definition carrying its three declared connections, its numeric leverage and balance, and its access credential marked with the storage treatment the project requires."
              depends_on:
                - "phase-1-g2-account-group"
                - "phase-1-g2-broker"
                - "phase-1-g2-currency"
              constraints: []
              acceptance: "An account built from valid values carries all three declared connections, keeps its numeric values at their declared precision, and reports its access credential as a credential with its required storage treatment."
              verify: "Valid account values are accepted with the numeric values preserved at their declared precision and the credential reporting its required storage treatment, while a non-numeric value in a numeric field is refused with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Account with its three connections and its encrypted access credential."
                  check: "uv run python check_entities.py account"
                  outcome: "PASS: all three connections were readable, leverage and balance kept their precision, the access credential reported encrypted storage, and a non-numeric leverage was refused with the reason."

            phase-1-g2-action:
              id: "phase-1-g2-action"
              title: "Define the Action entity"
              description: "Express Action as a shared definition carrying what the project states for it, including all of its declared connections and the values that determine how a position is opened."
              reason: "An action is the complete instruction for opening a position, so everything the instruction selects belongs to it."
              kind: "code"
              inputs:
                - "The project's definition of the Action entity"
                - "The resolved Action Group, Asset, Account, Partial Group, and Trailing Group definitions"
              expected_result: "Action is available as a shared definition carrying every declared connection and the risk, target, and protective values that shape the position it opens."
              depends_on:
                - "phase-1-g2-action-group"
                - "phase-1-g2-asset"
                - "phase-1-g2-account"
                - "phase-1-g2-partial-group"
                - "phase-1-g2-trailing-group"
              constraints: []
              acceptance: "An action built from valid values carries every declared connection and every value that determines the position's parameters, and one built with a required connection missing is refused."
              verify: "Valid action values are accepted with every declared connection readable from the resulting state, and omitting a required connection is refused with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Action with all five connections and the values that shape the position it opens."
                  check: "uv run python check_entities.py action"
                  outcome: "PASS: all five connections were readable and an action missing its account connection was refused naming it."

            phase-1-g2-position:
              id: "phase-1-g2-position"
              title: "Define the Position entity"
              description: "Express Position as a shared definition carrying what the project states for it, including every declared connection, its execution indicator, and its initial and current protective and target values as separately carried information."
              reason: "Tracking a trade requires knowing where it was sent, what it came from, whether it has executed yet, and how far its levels have moved from where they started."
              kind: "code"
              inputs:
                - "The project's definition of the Position entity"
                - "The resolved Trading Platform, Broker, Account, Trailing Group, Partial Group, Action Group, and Action definitions"
              expected_result: "Position is available as a shared definition carrying every declared connection, its timing and volume, its execution indicator, and both its initial and its current protective and target values."
              depends_on:
                - "phase-1-g2-trading-platform"
                - "phase-1-g2-broker"
                - "phase-1-g2-account"
                - "phase-1-g2-trailing-group"
                - "phase-1-g2-partial-group"
                - "phase-1-g2-action-group"
                - "phase-1-g2-action"
              constraints: []
              acceptance: "A position built from valid values carries every declared connection, keeps its initial protective and target values readable separately from its current ones, and distinguishes a position awaiting execution from one already executed."
              verify: "Valid position values are accepted with every declared connection readable, the initial and current protective and target values retrievable independently of each other, and an unexecuted position distinguishable from an executed one."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Defined Position with all seven connections and its opening and current levels held apart."
                  check: "uv run python check_entities.py position"
                  outcome: "PASS: all seven connections were readable, the opening and current protective and target values were retrievable independently, and an unexecuted position was distinguishable from an executed one."

        # <!-------------------- Group 3 -->
        phase-1-g3:
          id: "phase-1-g3"
          title: "Initial records"
          description: "The records the project requires to exist when it begins, declared with the entity definitions that carry them. Declaring them is this phase's work; inserting them and producing any value the project requires to be generated is not."
          area: "The declared initial records of the domain entities"
          does: "Every record the project requires at the start is declared with its entity as a logical declaration, retrievable by whichever layer later performs the insertion."
          constraints: []
          task_count: 2
          tasks:

            phase-1-g3-independent-records:
              id: "phase-1-g3-independent-records"
              title: "Declare the initial records that reference no other record"
              description: "Carry, with each entity that declares them, the starting records whose values refer to no other record. Where the project requires a value to be generated securely, declare the requirement in place of a value."
              reason: "The records a project must start with describe the domain itself, so they belong beside the definitions rather than inside whatever later stores them."
              kind: "data"
              inputs:
                - "The project's declared starting records"
                - "The resolved entity definitions that carry them"
              expected_result: "Every starting record that refers to no other record is declared with its entity and retrievable as a logical declaration, with securely generated values present as requirements rather than as values."
              depends_on:
                - "phase-1-g2-user"
                - "phase-1-g2-currency"
                - "phase-1-g2-trading-platform"
                - "phase-1-g2-account-group"
                - "phase-1-g2-asset"
                - "phase-1-g2-trailing-group"
                - "phase-1-g2-partial-group"
                - "phase-1-g2-action-group"
              constraints: []
              acceptance: "Each declared record is complete for its entity except where the project requires a generated value, and no generated credential value appears anywhere in the declarations."
              verify: "The declarations are retrievable per entity, each satisfies the validation its definition performs on its own values, and no credential value is present in them."
              status: "done"
              log:
