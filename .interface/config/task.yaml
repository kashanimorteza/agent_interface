meta:
  path: .interface/config/task.yaml
  path_note: Generated task frame and one empty Plan shell for each project phase.
policy:
  agent_may_edit: true
  rule: Generation owns the frame and empty Plan shells; planning owns phase decomposition; development owns only task status,
    blocker, and log; reset acts only through its State transition.
  changed_by: The operation authorized for the specific section by content.state_authority in state.yaml, or the human directly.
read_order:
- task_schema
- task_states
- plans
content_map:
  task_schema: The fixed fields carried by every generated task.
  task_states: The task-state vocabulary and protocols.
  plans: One phase-aligned Plan shell per project phase.
content:
  task_schema:
    rule: Every generated task carries exactly the fields listed here, with optional fields omitted when not applicable.
    fields:
      id: Identifier unique within the project phase.
      title: The task in one sentence.
      goal: What becomes possible when the task is complete.
      depends_on: Ids of prerequisite tasks in the same project phase.
      acceptance: Human-readable condition that must work.
      verify: Runnable command proving acceptance.
      touches: Paths relative to the selected item's code_path.
      status: Current task state.
      blocker: Critical State blocker id; absent unless status is blocked.
      log: Append-only dated task history; absent until the task first moves.
    status_lives_here: Each task stores its own status.
    history_lives_here_too: Each task carries its own append-only log while it exists.
  task_states:
    path: content.plans.<phase>.groups.<group>.tasks.<task>.status
    states:
      todo: Available when its derived readiness conditions hold.
      claimed: Owned by one development run and written before work starts.
      blocked: Stopped by a critical blocker recorded in state.yaml.
      done: Acceptance is satisfied and verification passed.
      cancelled: Intentionally removed from required work by an authorized human decision.
      superseded: Replaced by another task under an authorized plan change.
    derived_ready: A task is ready when it is todo, all same-phase depends_on tasks are done, and every earlier phase is complete.
    phase_ready: A phase is ready for development when its plan is non-empty and every earlier phase is complete.
    phase_complete: A phase is complete when its plan is non-empty and every task not cancelled or superseded is done.
    done_gate: A task never becomes done without a passing verify run.
    claim_protocol: Write claimed before implementation begins so another agent cannot take the same task.
    status_only_in_development: Development may change only status, blocker, and log; reset is the explicit exception.
    reset_protocol: Development reset returns generated tasks to todo and preserves logs; planning reset removes groups and
      tasks while preserving phase plan shells; both clear State blockers and questions.
  plans:
    P1:
      id: P1
      title: Data Foundation
      order: 1
      target: Database
      does: Make all defined project data persistently available to the system
      groups: {}
    P2:
      id: P2
      title: Data Operations
      order: 2
      target: Backend
      does: Make all defined project data available for consistent creation, retrieval, update, and deletion operations
      groups: {}
    P3:
      id: P3
      title: Data Management Interface
      order: 3
      target: Frontend
      does: Enable users to enter and manage all defined project data through a user-facing experience
      groups: {}
