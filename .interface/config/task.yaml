              acceptance: "alembic/versions/ holds exactly one revision, generated with the message 'create contract v1 tables' and reviewed, whose upgrade calls op.create_table thirteen times and whose downgrade calls op.drop_table thirteen times"
              verify: "test \"$(ls alembic/versions/*.py | wc -l | tr -d ' ')\" = '1' && test \"$(grep -c 'op.create_table(' alembic/versions/*.py)\" = '13' && test \"$(grep -c 'op.drop_table(' alembic/versions/*.py)\" = '13'"
              touches:
                - "alembic/versions/"
              status: "done"
              log:
                - "2026-09-03 — claimed by my-interface-developer"
                - "2026-09-03 — verify passed and revision 36be9d3a0aa7 reviewed — 13 create_table, 14 indexes, uq_asset_details_broker_id_asset_id, RESTRICT FKs; downgrade drops all in reverse order"

            - id: "P1-T25"
              title: "Apply the initial revision to app.db with alembic upgrade head"
              goal: "database/app.db exists and holds the thirteen contract tables at the head revision"
              depends_on: ["P1-T24"]
              needs_contract: "database contract v1"
              acceptance: "After uv run alembic upgrade head, alembic current reports the head revision and app.db contains exactly the thirteen tables of contract v1 beside alembic_version"
              verify: >-
                uv run alembic upgrade head && uv run alembic current | grep -q '(head)' && uv run python -c "import sqlite3; c = sqlite3.connect('app.db'); n = {r[0] for r in c.execute(\"select name from sqlite_master where type = 'table' and name != 'alembic_version'\")}; expected = {'trading_platforms', 'brokers', 'accounts', 'assets', 'asset_details', 'strategies', 'trailing_groups', 'trailing_rules', 'partial_groups', 'partial_rules', 'action_groups', 'actions', 'positions'}; assert n == expected, n ^ expected"
              touches:
                - "app.db"
              status: "done"
              log:
                - "2026-09-03 — claimed by my-interface-developer"
                - "2026-09-03 — verify passed — alembic upgrade head applied 36be9d3a0aa7; app.db holds exactly the thirteen contract tables at head"

            - id: "P1-T26"
              title: "Prove the initial revision reverses by downgrading to base and upgrading back to head"
              goal: "The migration history is reversible, as the database standards require"
              depends_on: ["P1-T25"]
              needs_contract: "database contract v1"
              acceptance: "uv run alembic downgrade base leaves app.db with no contract table, and uv run alembic upgrade head restores all thirteen"
