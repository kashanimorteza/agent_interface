          task_count: 3
          tasks:
          - id: P3-G2-T1
            title: Shared Model specification module
            description: 'Implement src/lib/models/model-specs.ts exporting the type FieldSpec {name, type: ''integer''|''string''|''boolean''|''decimal''|''float''|''datetime'',
              nullable, primaryKey, hasDefault, default?, size?, credential, purpose?, relation?: {target, type}}, the type
              ModelSpec {key, name, purpose, route, title, resource, fields: FieldSpec[]}, the constant MODEL_SPECS: Record<string,
              ModelSpec> with the 13 Models in model.yaml order (fields in model.yaml order, exact types, nullability, defaults,
              sizes, credential flags, relationships as relation), route and title from frontend.yaml presentation.routes (/user,
              Users …), and resource from the Backend resource names (trading-platforms …); plus MODEL_KEYS, getSpec(key) throwing
              for an unknown key, and modelForRoute(slug) mapping a route segment (without the leading slash) to its Model key
              or undefined.'
            reason: 'Frontend Principle 5: Presentation and Interaction Logic use the shared Models'' logical meaning without
              redefining it; one static, verifiable specification module lets a generic table and form serve every Model.'
            target: frontend
            area: shared models — src/lib/models/model-specs.ts
            execution_context:
              kind: code
              language: TypeScript
              technologies:
              - TypeScript 5.9.3
              - Node.js 24.20.0 LTS
              instructions: Transcribe from .interface/config/model.yaml exactly; the verify executes the module with Node and
                compares it against model.yaml, frontend.yaml, and database.yaml. Use only erasable TypeScript syntax and no
                imports. Name and purpose come from definition.yaml (name) and model.yaml (purpose).
              inputs:
              - .interface/config/model.yaml — content.models
              - .interface/config/frontend.yaml — layers.presentation.routes (path, title)
              - .interface/config/database.yaml — data_logic.storage_schema.tables (table names → resource names, matching the
                Backend README)
              - .interface/config/definition.yaml — content.models (names)
              expected_output: src/lib/models/model-specs.ts.
            depends_on:
            - P3-G1-T2
            constraints:
            - Lib modules under src/lib use only erasable TypeScript syntax (no enum, namespace, or parameter properties) and
              relative imports with explicit .ts extensions, so Node 24 can execute them directly for verification.
            - Nothing about a Model is invented, renamed, or omitted; credential flags come only from model.yaml credential
              markers.
            acceptance: Executed by Node, MODEL_SPECS matches model.yaml for every Model (order, fields, types, nullability,
              defaults, sizes, credential flags, relationships), routes and titles match frontend.yaml, resources match the
              Backend, and modelForRoute resolves every route segment.
            verify: |-
              node --input-type=module -e 'const m = await import('"'"'./src/lib/models/model-specs.ts'"'"');
              if (m.getSpec('"'"'currency'"'"').key !== '"'"'currency'"'"') throw new Error('"'"'getSpec'"'"');
              if (m.modelForRoute('"'"'trading-platform'"'"') !== '"'"'trading_platform'"'"' || m.modelForRoute('"'"'nope'"'"') !== undefined) throw new Error('"'"'modelForRoute'"'"');
              let threw = false; try { m.getSpec('"'"'nope'"'"'); } catch { threw = true; } if (!threw) throw new Error('"'"'getSpec must throw'"'"');
              console.log(JSON.stringify(m.MODEL_SPECS));' > .specs.json && uv run --with pyyaml python - <<'PY'
              import json, yaml
              specs = json.load(open('.specs.json'))
              models = yaml.safe_load(open('../.interface/config/model.yaml'))['content']['models']
              defs = yaml.safe_load(open('../.interface/config/definition.yaml'))['content']['models']
              routes = yaml.safe_load(open('../.interface/config/frontend.yaml'))['content']['layers']['presentation']['routes']
              tables = yaml.safe_load(open('../.interface/config/database.yaml'))['content']['layers']['data_logic']['storage_schema']['tables']
              table_of = {t['source_model']: n for n, t in tables.items()}
              assert list(specs) == list(models), list(specs)
              for key, m in models.items():
                  s = specs[key]
                  assert s['key'] == key and s['purpose'] == m['purpose'] and s['name'] == defs[key]['name'], key
                  assert [f['name'] for f in s['fields']] == list(m['fields']), key
                  for f in s['fields']:
                      d = m['fields'][f['name']]
                      assert f['type'] == d['type'] and f['nullable'] == d['nullable'], (key, f['name'])
                      assert f['primaryKey'] == bool(d.get('primary_key', False)) and f['credential'] == bool(d.get('credential', False)), (key, f['name'])
                      assert f['hasDefault'] == ('default' in d) and (not f['hasDefault'] or f['default'] == d['default']), (key, f['name'])
                      assert f.get('size') == d.get('size'), (key, f['name'])
                      rel = next((r for r in (m.get('relationships') or {}).values() if r['field'] == f['name']), None)
                      assert (f.get('relation') or None) == ({'target': rel['target'], 'type': rel['type']} if rel else None), (key, f['name'])
                  assert s['route'] == routes[key]['path'] and s['title'] == routes[key]['title'], key
                  assert s['resource'] == table_of[key].replace('_', '-'), key
              print('ok')
              PY
              rm -f .specs.json
            touches:
            - src/lib/models/model-specs.ts
            status: todo
