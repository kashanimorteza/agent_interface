# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/task.yaml"
  path_note: "Config layer of the Agent Project Interface — the task frame and the plans; the frame is fixed here by the interpreter, the plans are filled by my-interface-tasker"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Who may write what is decided in the State contract (config/state.yaml under content.state_authority) and in root.yaml under content.modes — planning writes an item's phase_titles (while its lifecycle is empty or derived) and the phases of that item's plan; development and review write only a task's status, blocker, and log"
  frame: "task_schema and task_states are the frame — fixed by the human; no mode edits them"
  changed_by: "my-interface-interpreter on regeneration (frame and empty plans only, carrying phase_titles and their lifecycle through untouched); my-interface-tasker in planning mode; my-interface-developer and my-interface-reviewer for status, blocker, and log"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_schema — what a task is, before any task is read"
  - "task_states — the vocabulary of status, before any status is read"
  - "plans — the plans themselves, read last"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: "The fields every task carries — the definition of a task, not a task itself"
  task_states: "The vocabulary a task's status may hold, and the protocols around it"
  plans: "One plan per indexed item — project phases at the top, groups inside a phase, tasks inside a group"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Task_Schema -->
  task_schema:
    rule: "Every task carries exactly these fields — no more, no fewer."
    fields:
      id: "Identifier unique within the item — each item numbers its own tasks."
      title: "The task in one sentence."
      goal: "What becomes possible after this task that was not possible before."
      depends_on: "Ids of tasks in the same item — depending on another item is forbidden."
      needs_contract: "The contract version required — used instead of depending on another item's task; omitted when the task needs none."
      acceptance: "Human-readable acceptance criterion — what must actually work."
      verify: "A runnable command that proves acceptance — without it a task is never done."
      touches: "Paths this task touches, written relative to the item's code_path."
      status: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states."
      blocker: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise."
      log: "Append-only list of dated entries carried with the task — absent until the task first moves."
    status_lives_here: "Status is written on the task itself, so definition and state can never drift apart."
    history_lives_here_too: "There is no history file — how a task reached its state is in its own log, and a past entry is never rewritten."

  # <!-------------------------------------------- Task_States -->
  task_states:
    path: "The status field on each task."
    states:
      todo: "Defined and waiting — nobody has started it."
      claimed: "An agent has taken it and is working on it now."
      blocked: "It cannot move — its blocker field names the blocker in state.yaml."
      done: "Its verify command ran and passed."
      cancelled: "The human withdrew it — it will not be done."
      superseded: "Replaced by a newer task — the log names the replacement."
    derived_ready: "ready is not a stored status — a task is ready when it is todo and all of its depends_on are done."
    done_gate: "Without a passing verify run no task becomes done, even if the code is written."
    claim_protocol: "A task is set to claimed and the file written before work starts, so two agents never take the same task."
    status_only_in_development: "In development mode status, blocker, and log are the only fields an agent may change — the rest is the plan."

  # <!-------------------------------------------- Plans -->
  plans:

    backend:
      phase_titles_lifecycle: "derived"
      phase_titles_derived_from: "config/state.yaml content.blockers B1 ('Phase 1 (Backend API)', stopping backend development) and config/backend.yaml content.out_of_scope (Phase 1's goal: create and run the API for the defined models) — the only generated sections carrying the phase index; see open question Q5 in config/state.yaml"
      phase_titles:
        P1: "Backend API"
      phases:

        phase_1:
          id: "P1"
          title: "Backend API"
          does: "Creates and runs the API for all defined project models — the whole backend surface of contract v1, running over SQLite."
          groups:

            environment_and_scaffold:
              id: "P1-G1"
              title: "Environment & application scaffold"
              does: "Creates the uv-managed project, installs the four configured packages, and stands up the app package — config, database session, FastAPI entry point with Docs on and ReDoc off, and the API-key check. When done, an empty but running application exists."
              task_count: 10
              tasks:
                - id: "T1"
                  title: "Initialize the backend project with uv"
                  goal: "A uv-managed project with pyproject.toml exists for every install and command to run inside."
                  depends_on: []
                  acceptance: "pyproject.toml exists in code_path and uv commands run inside the project's virtual environment."
                  verify: "uv run python --version"
                  touches: ["pyproject.toml"]
                  status: "blocked"
                  blocker: "B1"
                - id: "T2"
                  title: "Install FastAPI"
                  goal: "The API framework of contract v1 is importable."
                  depends_on: ["T1"]
                  acceptance: "FastAPI is a project dependency in pyproject.toml, installed through uv."
                  verify: "uv run python -c \"import fastapi\""
                  touches: ["pyproject.toml"]
                  status: "todo"
                - id: "T3"
                  title: "Install Uvicorn"
                  goal: "The server named by tech.run can start the application."
                  depends_on: ["T1"]
                  acceptance: "Uvicorn is a project dependency in pyproject.toml, installed through uv."
                  verify: "uv run python -c \"import uvicorn\""
                  touches: ["pyproject.toml"]
                  status: "todo"
                - id: "T4"
                  title: "Install SQLAlchemy"
                  goal: "The only permitted route to the data is importable."
                  depends_on: ["T1"]
                  acceptance: "SQLAlchemy is a project dependency in pyproject.toml, installed through uv."
                  verify: "uv run python -c \"import sqlalchemy\""
                  touches: ["pyproject.toml"]
                  status: "todo"
                - id: "T5"
                  title: "Install Alembic"
                  goal: "The only way the database schema changes is importable."
                  depends_on: ["T1"]
                  acceptance: "Alembic is a project dependency in pyproject.toml, installed through uv."
                  verify: "uv run python -c \"import alembic\""
                  touches: ["pyproject.toml"]
                  status: "todo"
                - id: "T6"
                  title: "Create the app package"
                  goal: "The importable package every backend module lives under exists."
                  depends_on: ["T1"]
                  acceptance: "app/__init__.py exists and 'import app' succeeds."
                  verify: "uv run python -c \"import app\""
                  touches: ["app/__init__.py"]
                  status: "todo"
                - id: "T7"
                  title: "Create the configuration module"
                  goal: "The database file location and API-key settings have one home, read from the environment — never committed."
                  depends_on: ["T6"]
                  acceptance: "app/config.py defines the SQLite file location (inside code_path) and the API-key setting, with no credential written into the repository."
                  verify: "uv run python -c \"from app import config\""
                  touches: ["app/config.py"]
                  status: "todo"
                - id: "T8"
                  title: "Create the database module"
                  goal: "One place makes the SQLAlchemy engine and sessions — the only place a connection is made."
                  depends_on: ["T4", "T7"]
                  acceptance: "app/database.py builds the engine from config and provides the session and declarative base the models build on."
                  verify: "uv run python -c \"from app import database\""
                  touches: ["app/database.py"]
                  status: "todo"
                - id: "T9"
                  title: "Create the FastAPI entry point with Docs on and ReDoc off"
                  goal: "A runnable application exists, serving Swagger UI at /docs and no ReDoc, ready for routers to register into."
                  depends_on: ["T2", "T7"]
                  acceptance: "app/main.py creates the FastAPI app with docs_url '/docs' and redoc_url disabled, and 'uv run uvicorn app.main:app' starts it."
                  verify: "uv run python -c \"from app.main import app; assert app.docs_url == '/docs' and app.redoc_url is None\""
                  touches: ["app/main.py"]
                  status: "todo"
                - id: "T10"
                  title: "Add the API-key check"
                  goal: "The API-key capability is enforceable on every route a router registers."
                  depends_on: ["T9"]
                  acceptance: "A request without a valid API key is rejected per contract v1's error codes; the key value comes from configuration, never from the repository."
                  verify: "uv run python -c \"from app.main import app; assert app.openapi().get('components', {}).get('securitySchemes')\""
                  touches: ["app/main.py", "app/config.py"]
                  status: "todo"

