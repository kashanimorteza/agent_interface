                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "For each of the fourteen Models resolved its table mapping and asserted the table records its source Model, the column set equals the field set, each column's optionality, uniqueness, size, logical type, default, and recorded source field equal the field's declarations, and each table has one identifier column assigned by storage; asserted the currency code column has length three, the account balance defaults to zero, and the fourteen table names are the plural snake case of the Model names."
                  outcome: "Passed."

            phase_2.data_logic.foreign_keys:
              id: "phase_2.data_logic.foreign_keys"
              title: "Map relationships to foreign keys"
              description: "Resolve every declared relationship into an explicit foreign key on the carrying field, referencing the related Model's identifier with the same type, taking its optionality from the resolved Model field rather than from any separate default, indexed, with the resolved referential actions, and keeping roles explicit where a Model relates to the same target more than once."
              reason: "A relationship that exists only in the Model is a connection the stored data can break."
              kind: "code"
              inputs:
                - "Every shared Model's relationship declarations"
                - "The derived column mappings"
                - "The unstated physical mapping defaults for naming, indexing, and referential actions"
              expected_result: "Every declared relationship is a recorded foreign key carrying the referencing field, referenced table, and referenced column."
              depends_on:
                - "phase_2.data_logic.columns"
              constraints: []
              acceptance: "All nineteen declared relationships resolve to foreign keys on their existing carrying fields, each referencing the target's identifier with the same type, an index, and the resolved referential actions; each foreign key's optionality equals the optionality of the Model field carrying it; and none duplicates a carrying field."
              verify: "Enumerating the resolved foreign keys yields one per declared relationship, each naming its carrying column, referenced table, and referenced column and matching the optionality of its Model field, with the account's base-currency reference resolving to the currency table and the position's action reference resolving to the action table."
              status: "done"
              log:
                - at: "2026-09-07T21:09:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; resolving relationships into foreign keys."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Enumerated the resolved foreign keys across all tables and asserted their number equals the nineteen declared relationships, that each declared relationship resolves to exactly one foreign key on its carrying field referencing the target's identifier with the same column type, an index named for the table and column, and restrict actions on delete and update; asserted for every one of them that the recorded optionality and the derived column's optionality both equal the optionality of the Model field carrying it, so no separate default was applied; asserted the account's base-currency reference names the currency table with its base-currency role and the position's action reference names the action table."
                  outcome: "Passed."

            phase_2.data_logic.persistence_rules:
              id: "phase_2.data_logic.persistence_rules"
              title: "Guarantee the rules that depend on stored state"
              description: "Resolve every declared Model rule whose truth depends on stored data into an enforcement the persistence layer guarantees when changes are committed, including uniqueness across records and the existence of referenced records, keeping each enforcement traceable to the rule it implements and reporting any requirement the selected Engine cannot represent rather than dropping it."
              reason: "A rule that exists only in the domain description is a rule the stored data can violate, and one enforced only before writing is a rule two concurrent writers can defeat."
              kind: "code"
              inputs:
                - "Every shared Model's rule declarations and unique field properties"
                - "The derived column mappings"
              expected_result: "Every rule within the persistence layer's responsibility is enforced at commit and recorded against the rule it implements, with no such rule silently absent."
              depends_on:
                - "phase_2.data_logic.columns"
              constraints: []
              acceptance: "The broker's uniqueness of user together with name is enforced as one composite rule traceable to its declaration, every unique field property is enforced, a reference to a record that does not exist is refused, each enforcement names its source rule, and no declared rule within this responsibility is missing from the resolved design."
              verify: "Storing a second broker with the same user and name as an existing one is refused while storing the same name under a different user succeeds; storing a second currency with an existing code is refused; and two writers that concurrently store the same unique value leave exactly one record stored, with the other refused."
              status: "done"
              log:
                - at: "2026-09-07T21:09:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; resolving the rules that depend on stored data into guarantees."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted every declared composite uniqueness rule, every unique field property, and every relationship resolves to a recorded guarantee naming the declaration it implements, and that the broker's composite guarantee carries the Model's own rule object. Against a temporary migrated Instance: stored a broker, stored the same broker name under a different user successfully, and asserted a second broker with the same user and name is refused; stored a currency and asserted a second with the same code is refused; asserted a broker referencing a nonexistent user is refused. Then ran two threads, each with its own gateway on the same Instance and released together at a barrier, both storing the same unique currency code, and asserted exactly one reported success and one reported refusal with exactly one record present afterwards."
                  outcome: "Passed."

            phase_2.data_logic.credentials:
              id: "phase_2.data_logic.credentials"
              title: "Apply at-rest transformations to credential fields"
              description: "Resolve each credential field to one at-rest mode, an explicit declaration first and the applicable default otherwise, and apply the matching transformation when a credential is stored: a one-way transformation that can be verified but not recovered, and a reversible transformation whose key comes from the runtime environment."
              reason: "A credential stored as given is a secret in the database, and a transformation decided per caller is applied inconsistently."
              kind: "code"
              inputs:
                - "The credential fields and their declared storage rules"
                - "The supported at-rest modes and their defaults"
              expected_result: "Storing a credential persists only its transformed representation, and the stored representation reaches no consumer."
              depends_on:
                - "phase_2.data_logic.columns"
              constraints: []
              acceptance: "The user's password and API key resolve to the one-way mode and the account's password to the reversible mode; a stored one-way credential differs from the given value, verifies against it, and cannot be recovered; a stored reversible credential differs from the given value and is recovered only with the runtime key; and the key is read from the runtime environment rather than from any package or generated file."
              verify: "Transforming a value in the one-way mode yields something that is not the input, verifies against the input, does not verify against another value, and refuses recovery; transforming a value in the reversible mode yields something that is not the input, recovers the input with the runtime key, and fails to recover without it or with a different key."
              status: "done"
              log:
                - at: "2026-09-07T21:10:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; resolving at-rest modes and implementing the transformations."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the resolved at-rest modes are the one-way mode for the user's password and API key and the reversible mode for the account's password; transformed a value in the one-way mode and asserted the result differs from it, verifies against it, does not verify against another value, and refuses recovery; transformed a value in the reversible mode with a runtime key and asserted the result differs from it and recovers it, that without a key both transforming and recovering fail as a configuration failure, and that a different key fails to recover; asserted no package source assigns the encryption key."
                  outcome: "Passed."

            phase_2.data_logic.validation_reuse:
              id: "phase_2.data_logic.validation_reuse"
              title: "Check incoming data through the shared Model validation"
              description: "Check what a Model's own data determines by applying the validation the Model package publishes, for a complete state when a record is created and for a partial change when one is updated, so that an absent field, an explicitly null field, and a value awaiting generation keep the meanings the Model gives them."
              reason: "A second copy of the same checks drifts from the Model, and the three cases are exactly where a persistence layer otherwise invents its own answers."
              kind: "code"
              inputs:
                - "The Model package's published validation"
                - "The derived column mappings"
              expected_result: "Data that the shared validation refuses is refused before any storage change, with the same fields named, and data it accepts is stored with defaults applied and omitted fields untouched."
              depends_on:
                - "phase_2.data_logic.columns"
              constraints: []
              acceptance: "The persistence layer holds no second definition of the checks the shared validation performs; a create whose data the shared validation refuses is refused naming the same field and changes no stored data; a change omitting a field leaves that field as it was; a change setting a field that permits null to null stores null; a change setting a field that does not permit null to null is refused; and a value still awaiting generation is never stored."
              verify: "Creating a currency whose code exceeds its declared size is refused naming that field with no record stored; updating a currency with no fields leaves it identical; updating only its symbol leaves its code and name unchanged; setting its nullable description to null stores null while setting its required name to null is refused; and attempting to store a record whose credential still awaits generation is refused."
              status: "done"
              log:
                - at: "2026-09-07T21:11:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; routing incoming data through the Model package's published validation."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the operation pipeline calls the Model package's published complete-state and partial-change validation rather than defining the same checks itself. Against a temporary migrated Instance: attempted to store a currency whose code exceeds its declared size and asserted the refusal names exactly that field and left the record count unchanged; stored a currency, then asserted an update with no fields returns it identical, an update of only its symbol leaves its name and code unchanged, setting its nullable description to null stores null, and setting its required name to null is refused naming that field with the stored name unchanged; attempted to store a user whose two credentials still await generation and asserted the refusal names both fields with no user stored."
                  outcome: "Passed."

        # <!-------------------- storage_schema -->
        phase_2.storage_schema:
          id: "phase_2.storage_schema"
          title: "Storage schema history"
          description: "The ordered, reversible migration history through which the derived storage design becomes physical structure. Its single Task establishes the history and its first entry."
          area: "The migration history and structure creation"
          does: "The complete storage structure is created from the repository by an ordered, reversible migration history, and application code never creates or alters storage objects directly."
          constraints: []
          task_count: 1
          tasks:

            phase_2.storage_schema.migration_history:
              id: "phase_2.storage_schema.migration_history"
              title: "Establish the migration history and create the structure"
              description: "Establish the migration history as internal package tooling and record its first migration, which creates every derived table, foreign key, constraint, and index, can be applied to any declared Instance, and can be undone."
              reason: "The structure must be reproducible and explainable from the repository, and reversible history is the only record that explains how it was reached."
              kind: "code"
              inputs:
                - "The derived storage design and its enforced rules"
                - "The Instance connections"
                - "The migration tool conventions and commands"
              expected_result: "An ordered migration history whose first entry creates the complete structure on the selected Instance and whose reversal removes it, leaving the Instance as it was."
              depends_on:
                - "phase_2.data_logic.foreign_keys"
                - "phase_2.data_logic.persistence_rules"
                - "phase_2.storage_adapter.connections"
              constraints: []
              acceptance: "Applying the history to an empty general Instance creates all fourteen tables with their foreign keys, constraints, and indexes; reversing it removes them; reapplying reaches the same structure; and no table is created outside the migration history."
              verify: "On an empty Instance the fourteen tables are absent, present with every foreign key and the composite uniqueness enforcement after the history is applied, absent again after it is reversed, and present again after it is reapplied."
              status: "done"
              log:
                - at: "2026-09-07T21:12:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the mapping and connections existed; establishing the migration tooling and generating the first migration from the derived design."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary empty Instance: asserted no tables exist; applied the history with the migration tool's upgrade command and asserted exactly the fourteen tables exist, the accounts table carries three foreign keys, nineteen foreign keys exist in total, and the brokers table's definition carries the named composite uniqueness constraint; reversed the latest migration and asserted no tables remain; reapplied and asserted the fourteen tables are back; asserted the history reports one head."
                  outcome: "Passed."

