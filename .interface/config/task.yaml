            description: 'Create database/ as a uv project with a src-layout import package named trading_database: pyproject.toml
              declaring project name trading-assistant-database, version 0.1.0, requires-python ">=3.14", exactly pinned dependencies
              SQLAlchemy==2.0.52, alembic==1.19.2 and cryptography==50.0.1, and the uv_build build backend that `uv init --package`
              generates, plus [tool.uv.build-backend] module-name = "trading_database" because the import package name differs
              from the distribution name; a .python-version file containing 3.14; src/trading_database/__init__.py holding only
              a module docstring and __version__ = "0.1.0"; and a generated uv.lock. Remove any sample entry point or main()
              that uv init adds.'
            reason: Every later Task runs inside this environment, and Backend installs this directory as a local path dependency,
              so the Database must be a buildable package with reproducible, exactly pinned dependencies.
            target: database
            area: package foundation — code_path root
            execution_context:
