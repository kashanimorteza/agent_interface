                  needs_contract: "v1"
                  acceptance: "GET /trading-platforms without X-API-Key answers 401, and with a wrong key answers 401."
                  verify: "(uv run uvicorn app.main:app --port 8765 >/dev/null 2>&1 & echo $! > .uvicorn.pid); sleep 3; a=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/trading-platforms); b=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: wrong' http://127.0.0.1:8765/trading-platforms); kill $(cat .uvicorn.pid); rm -f .uvicorn.pid; test \"$a\" = \"401\" && test \"$b\" = \"401\""
                  touches: ["app/main.py"]
                  status: "todo"
