            phase-1-g3-referencing-records:
              id: "phase-1-g3-referencing-records"
              title: "Declare the initial records whose values reference other records"
              description: "Carry, with each entity that declares them, the starting records whose values refer to records of other entities, so the references and the order they can be resolved in are both derivable from the declarations."
              reason: "A starting record that points at another one is only usable if what it points at is declared too and can be resolved first."
              kind: "data"
              inputs:
                - "The project's declared starting records that carry references"
                - "The declared starting records that reference nothing"
                - "The resolved entity definitions that carry references"
              expected_result: "Every starting record carrying a reference is declared with its entity, and the order in which the declarations can be resolved without an unresolved reference is derivable from them."
              depends_on:
                - "phase-1-g3-independent-records"
                - "phase-1-g2-broker"
                - "phase-1-g2-account"
                - "phase-1-g2-action"
              constraints: []
              acceptance: "Every reference in these declarations identifies a record declared for the entity it points at, and no declaration refers to a record that is never declared."
              verify: "Each reference resolves to a declared record of the referenced entity, and the declarations can be read in an order in which every reference is already available."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Declared the records that carry references and derived the order in which they resolve, with references identified by declaration position."
                  check: "uv run python check_records.py referencing"
                  outcome: "PASS: every reference in the Broker, Account and Action records resolves to a declared record of its target, and reading the 22 records in the derived order never meets a reference to something not yet read."

        # <!-------------------- Group 4 -->
        phase-1-g4:
          id: "phase-1-g4"
          title: "Published surface, description, and composition"
          description: "What turns the finished definitions into a layer other boundaries can use: one public surface, a description of how to use it, and the layer's own contribution to the running system."
          area: "The layer's published surface and its part of the system composition"
          does: "Consumers outside the layer reach every shared definition through one documented public surface, and the layer contributes its own configuration and demonstrated usability to the composed system."
          constraints: []
          task_count: 3
          tasks:

            phase-1-g4-public-surface:
              id: "phase-1-g4-public-surface"
              title: "Publish the package's public surface"
              description: "Expose every resolved entity definition, and the starting records declared with them, through one public surface, using names compatible with the resolved ecosystem while preserving each definition's logical identity."
              reason: "Consumers must reach the shared definitions through one promised surface, because anything they reach around it is a dependency this layer never agreed to keep."
              kind: "code"
              inputs:
                - "The resolved entity definitions"
                - "The declared starting records"
                - "The resolved naming conventions of the implementation ecosystem"
              expected_result: "Every resolved entity definition and every declared starting record is reachable through one public surface, each definition appearing on it exactly once."
              depends_on:
                - "phase-1-g2-user"
                - "phase-1-g2-currency"
                - "phase-1-g2-trading-platform"
                - "phase-1-g2-account-group"
                - "phase-1-g2-asset"
                - "phase-1-g2-trailing-group"
                - "phase-1-g2-partial-group"
                - "phase-1-g2-action-group"
                - "phase-1-g2-broker"
                - "phase-1-g2-trailing-rule"
                - "phase-1-g2-partial-rule"
                - "phase-1-g2-account"
                - "phase-1-g2-action"
                - "phase-1-g2-position"
                - "phase-1-g3-independent-records"
                - "phase-1-g3-referencing-records"
              constraints: []
              acceptance: "Each entity the project defines appears on the surface exactly once under a name preserving its logical identity, and none of them is reachable only by going around the surface."
              verify: "Consuming the published surface yields every entity the project defines, each exactly once, so that a missing or duplicated entity is detectable from the surface alone."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published one public surface carrying every entity, the declared records with their order, and the declaration types a consumer needs to read a definition."
                  check: "uv run python check_surface.py"
                  outcome: "PASS: all 14 entities are published exactly once and are the defined objects themselves; the 11 record-declaring entities and 22 ordered records are reachable from the surface; no published name is unreachable."

            phase-1-g4-composition:
              id: "phase-1-g4-composition"
              title: "Deliver the layer's part of the system composition"
              description: "Provide what this layer contributes to a running system: the configuration it owns itself, a private declaration of any secret it requires without the values, and a demonstration that a consumer outside the layer can use it through its published surface alone."
              reason: "A layer composed only at the end is composed against layers that were never used together, so each phase delivers its layer's part of the composition as the layer arrives."
              kind: "configuration"
              inputs:
                - "The published public surface of this layer"
                - "The resolved runtime-configuration ownership and delivery conventions"
              expected_result: "The layer carries the configuration it owns, declares any secret it needs by name only, and is demonstrably usable from outside its boundary through its published surface."
              depends_on:
                - "phase-1-g4-public-surface"
              constraints: []
              acceptance: "A consumer outside this layer obtains the shared definitions using the published surface alone, and no secret value appears in version-controlled content."
              verify: "Consumption from outside the layer's boundary succeeds using only the published surface and the layer's own configuration, resolved independently of the location the consumer runs from, and version-controlled content holds no secret value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Gave the layer the configuration it owns, recorded that it requires no secret, and added its section to the project's public cross-layer configuration."
                  check: "an isolated consumer environment created outside the layer with 'uv run --isolated --no-project --with ./model', run from the project root, importing the entities and the ordered records through the published package alone; the layer's own settings read from its code path; a search for credential-shaped literals across the layer's content"
                  outcome: "PASS: a consumer outside the layer, in its own environment, reached every published capability through my_model alone; the layer's settings resolved from its own code path rather than the caller's directory; the layer declares no secret, keeps no secret file, and no credential-shaped value exists in its content."

            phase-1-g4-description:
              id: "phase-1-g4-description"
              title: "Provide the package's public description"
              description: "Describe the package for the people who will use it, covering every subject a package description is required to cover, so a consumer can use it without reading its implementation."
              reason: "The description is what lets another boundary depend on this one without inspecting how it is built."
              kind: "documentation"
              inputs:
                - "The published public surface of this layer"
                - "The layer's own configuration and setup requirements"
                - "The resolved package documentation conventions"
              expected_result: "The package carries a public description covering each required subject and consistent with what it actually publishes."
              depends_on:
                - "phase-1-g4-public-surface"
                - "phase-1-g4-composition"
              constraints: []
              acceptance: "Every subject the description must cover is present, what it says about the public surface matches what is published, and it records no credential or other secret value."
              verify: "Each required subject is present in the description, every capability it presents as public is reachable through the published surface, and no secret value appears in it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Wrote the package's public description covering purpose and boundaries, public interface, dependencies, configuration, installation and usage."
                  check: "uv run python check_description.py"
                  outcome: "PASS: every required subject is present, each capability the examples show resolves through the published surface, the named dependency version matches the declaration, and no credential value appears."

    # <!------------------------------- Phase 2 -->
    phase-2:
      id: "phase-2"
      title: "Database"
      order: 2
      target: "Database"
      does: "The persistence layer exists as an independent package that stores the shared domain definitions, rebuilds its whole structure from a recorded and reversible history, holds the declared starting records, and publishes one definition-driven boundary with selectable Instances and an explicit transaction boundary."
      constraints: []
      task_count: 21
      groups:

        # <!-------------------- Group 1 -->
        phase-2-g1:
          id: "phase-2-g1"
          title: "Package boundary and internal layering"
          description: "What the layer must own before anything is stored: its own package, its declared consumption of the shared definitions, and the internal separation everything else is built inside."
          area: "The layer's own package boundary and the separation of responsibilities inside it"
          does: "The layer exists as its own package consuming the shared definitions through their published interface, with its three internal responsibilities separated and ordered."
          constraints: []
          task_count: 2
          tasks:

            phase-2-g1-boundary:
              id: "phase-2-g1-boundary"
              title: "Establish the persistence layer as its own package"
              description: "Bring the layer into existence as its own package: its identity under the resolved naming basis, its declared dependencies including the shared domain definitions it consumes, and an isolated environment those dependencies resolve into."
              reason: "This layer stores what another layer defines, so its boundary has to declare that consumption from the start rather than growing its own copy of the definitions."
              kind: "configuration"
              inputs:
                - "The resolved package naming and distribution conventions"
                - "The resolved implementation language, isolated environment, engine, mapping and history technologies"
                - "The published interface of the shared domain definitions"
              expected_result: "The layer exists as its own package whose declared dependencies include the shared domain definitions, reached through their published interface and resolving into an environment isolated to this layer."
              depends_on: []
              constraints: []
              acceptance: "The package identity follows the resolved naming basis, and the shared domain definitions are reached as a declared dependency rather than reproduced inside this layer."
              verify: "The layer's declared dependencies resolve into its own environment, and the domain definitions it works with are the ones the defining layer publishes, with no second copy of any of them held here."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Created the layer as its own package that takes the shared definitions as a declared local-path dependency, with its own pinned dependencies and isolated environment."
                  check: "uv run python check_db.py g1-boundary"
                  outcome: "PASS: the dependency resolves into this layer's own environment, every entity it works with is the object the defining layer publishes, and no module here redefines one."

            phase-2-g1-layers:
              id: "phase-2-g1-layers"
              title: "Establish the internal layers and the direction between them"
              description: "Give the package its internal separation: a published boundary, a mapping and operation responsibility beneath it, and a storage responsibility beneath that, each owning what it is responsible for and reaching only the one directly below it."
              reason: "Every later activity in this phase belongs to one of the three, so the boundaries and their direction have to exist before any of them is filled."
              kind: "code"
              inputs:
                - "The declared internal layering of this Component and its dependency direction"
              expected_result: "The three internal responsibilities exist as separate boundaries, each reaching only the one directly beneath it."
              depends_on:
                - "phase-2-g1-boundary"
              constraints: []
              acceptance: "Each internal boundary reaches only the boundary directly below it, and nothing outside the layer is required to know that the lower ones exist."
              verify: "Following what each internal boundary depends on yields only the one directly beneath it, never one further down and never one above; and nothing below the published boundary is reachable from outside the layer."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Separated the package into a published boundary, a mapping and operation responsibility, and a storage responsibility, with a shared vocabulary of failures and results beneath all three."
                  check: "uv run python check_db.py g1-layers"
                  outcome: "PASS: each internal boundary reaches only the one directly beneath it, none reaches further down or back up, and nothing published comes from below the boundary."

        # <!-------------------- Group 2 -->
        phase-2-g2:
          id: "phase-2-g2"
          title: "Engine, Instances and the settings the layer owns"
          description: "How the layer reaches an engine and which stored identities it offers: the catalogue it owns, the connection it opens, the checks that run before it serves anything, and where it reads what it must never carry."
          area: "The layer's connection to its engine and the Instances and settings it owns"
          does: "The layer knows which engines and Instances it supports, connects to the one selected, refuses to serve an invalid configuration, and reads its secrets from its own private area."
          constraints: []
          task_count: 4
          tasks:

            phase-2-g2-configuration:
              id: "phase-2-g2-configuration"
              title: "Record the engine catalogue, the Instances and the default selection"
              description: "Resolve the supported engine profiles, the Instance catalogue and the default selection, and hold them in the settings this layer owns, each Instance carrying a stable identity, a readable name, a stated purpose and one engine binding."
              reason: "Everything else in the layer resolves what it acts on from this catalogue, so it exists before any connection, catalogue or operation can name an Instance."
              kind: "configuration"
              inputs:
                - "The resolved engine profiles and their connection parameters"
                - "The resolved Instance catalogue and default selection"
                - "The conventions for the settings a layer owns"
              expected_result: "The layer's own settings carry the supported engines, every Instance with its identity, name, purpose and engine binding, and exactly one default naming an existing Instance."
              depends_on:
                - "phase-2-g1-layers"
              constraints: []
              acceptance: "Every Instance names a supported engine, exactly one Instance is the default, and how many Instances there are is read from the catalogue rather than stated separately beside it."
              verify: "Reading the settings this layer owns yields the engine catalogue, every declared Instance with its identity, name, purpose and engine, and a default resolving to one of them, with no secret value among them."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Recorded the engine catalogue, the Instance catalogue and the default selection in the settings this layer owns."
                  check: "uv run python check_db.py g2-configuration"
                  outcome: "PASS: the settings yield the supported engines and every Instance with its identity, name, purpose and engine binding; the default resolves to a declared Instance; how many there are is read from the catalogue; no secret value is among them."

            phase-2-g2-connection:
              id: "phase-2-g2-connection"
              title: "Reach the engine an Instance is bound to"
              description: "Give the storage responsibility the ability to open, use and release a connection for a selected Instance, applying the settings its engine profile declares, and deciding where a file-backed engine keeps its data from the layer's own location rather than from wherever a process happens to be running."
              reason: "Every stored operation reaches the engine through this one place, which is what leaves the engine replaceable later."
              kind: "code"
              inputs:
                - "The resolved engine profile and the settings it declares"
                - "The recorded Instance catalogue"
              expected_result: "A working connection for a selected Instance can be opened and released with its engine profile's settings in effect."
              depends_on:
                - "phase-2-g2-configuration"
              constraints: []
              acceptance: "A connection for a selected Instance works and is released afterwards, the settings its profile declares are in effect, and where a file-backed engine keeps data is decided by the layer rather than by the caller."
              verify: "The same Instance reaches the same stored data when operations are run from different working directories, and each setting the engine profile declares is observably in effect on the open connection."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Gave the storage responsibility a single place that opens, uses and releases a connection for a selected Instance, resolving file-backed storage from the layer's own location."
                  check: "uv run python check_db.py g2-connection"
                  outcome: "PASS: the same Instance reached identical stored data from the layer directory, the project root and a temporary directory; the engine profile's reference enforcement was observably in effect; the data stays under the layer."

            phase-2-g2-validation:
              id: "phase-2-g2-validation"
              title: "Check the configuration before anything is served"
              description: "Establish, before data operations are served, that every Instance names a supported engine, that each engine profile has the settings it requires, and that the default names an existing Instance; and refuse an explicitly named Instance nobody declared."
              reason: "A configuration mistake discovered on the first stored operation is discovered by whoever was storing data, which is the wrong person and the wrong moment."
              kind: "code"
              inputs:
                - "The recorded engine catalogue, Instances and default selection"
              expected_result: "An invalid configuration stops operations from being served, and an explicitly named unknown Instance is refused rather than served by the default."
              depends_on:
                - "phase-2-g2-configuration"
              constraints: []
              acceptance: "An unsupported engine reference, a missing required setting, or a default matching no Instance each prevents operations from being served, and each refusal says which of them it was."
              verify: "Each of those three configuration faults is refused with its own reason before any operation is served; naming an undeclared Instance is refused instead of quietly served by the default; and a connection that fails never moves an operation to a different Instance."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made the settings be checked before anything is served, and an explicitly named unknown Instance refused rather than answered by the default."
                  check: "uv run python check_db.py g2-validation"
                  outcome: "PASS: an unsupported engine, a missing required setting and a default naming nothing were each refused with their own reason; an undeclared Instance was refused by name; an omitted selection used the default."

            phase-2-g2-secrets:
              id: "phase-2-g2-secrets"
              title: "Read the layer's secrets from its own private area"
              description: "Declare by name the secrets this layer requires, both what its engine profiles need to connect and the key material a reversible credential treatment depends on, and read them from the layer's private runtime area, leaving an uncommitted example that carries the names and no values."
              reason: "The layer needs values it must never carry, so where it reads them from is settled before anything that depends on them is built."
              kind: "configuration"
              inputs:
                - "The resolved connection parameters and the secret references they use"
                - "The resolved credential treatments and what each of them requires"
                - "The conventions for a layer's own secrets"
              expected_result: "Every secret this layer needs is declared by name and read from its private area, while committed content carries the names and none of the values."
              depends_on:
                - "phase-2-g2-configuration"
              constraints: []
              acceptance: "Each declared secret resolves by name from the layer's private area, a required one that is absent is reported as absent rather than substituted, and no value for any of them exists in committed content."
              verify: "A secret placed in the layer's private area is readable by the name declared for it; the same name left absent produces a reported failure naming it; and searching committed content for each declared name finds no value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Declared the layer's secrets by name and made them resolve from its private area or the runtime environment, with a committed example carrying names only."
                  check: "uv run python check_db.py g2-secrets"
                  outcome: "PASS: a supplied secret was readable by its declared name; the same name absent produced a failure naming it rather than a substitute; no committed file carries a value for any declared name; the private file is kept out of version control."

        # <!-------------------- Group 3 -->
        phase-2-g3:
          id: "phase-2-g3"
          title: "Mapping the definitions to stored structure"
          description: "Turning the shared definitions into structure that holds them: the tables and columns they become, the connections between them, the rules only stored records can settle, and what happens to a credential on its way in."
          area: "The mapping from the shared definitions into stored structure and the guarantees held over it"
          does: "Every definition has stored structure derived from it, its connections and its stored-state rules are enforced there, and each credential is transformed on the way in and never handed back."
          constraints: []
          task_count: 4
          tasks:

            phase-2-g3-schema:
              id: "phase-2-g3-schema"
              title: "Derive the stored structure from the shared definitions"
              description: "Turn every persistent definition into one table whose columns come from its resolved fields, record on each table which definition it implements, and express the whole structure in terms that belong to no particular engine."
              reason: "The stored structure is the definitions in another form, so deriving it is what keeps the two from drifting apart as either changes."
              kind: "code"
              inputs:
                - "The published domain definitions and their resolved fields"
                - "The resolved physical naming conventions"
              expected_result: "Every persistent definition has exactly one table whose columns carry its resolved fields, and each table records the definition it implements."
              depends_on:
                - "phase-2-g1-layers"
              constraints: []
              acceptance: "Every published definition maps to one table, each of its resolved fields reaches a column preserving that field's logical meaning, and which definition a table implements is readable from the mapping."
              verify: "The mapping covers each published definition exactly once with every resolved field present as a column, and the structure can be described without naming anything specific to one engine."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Derived one table per published definition from its resolved fields, each recording the definition it implements, described without reference to any one engine."
                  check: "uv run python check_db.py g3-schema"
                  outcome: "PASS: all 14 definitions map to one table each with every resolved field present as a column and its declared optionality preserved; each table records its definition; the mapping names no particular engine."

            phase-2-g3-relationships:
              id: "phase-2-g3-relationships"
              title: "Map the declared connections as explicit references"
              description: "Represent each declared connection as an explicit reference to the related key of the same type, preserving the cardinality, the optional participation and the role it was declared with, including where one definition connects more than once to the same target, and reusing a declared reference field instead of adding another beside it."
              reason: "A connection that survives as a value but loses its cardinality or its role is no longer the connection that was declared."
              kind: "code"
              inputs:
                - "The declared connections with their cardinality, optionality and roles"
                - "The unstated physical mapping choices for references, their indexing and their referential behaviour"
              expected_result: "Every declared connection exists as an explicit reference preserving its cardinality, optionality and role, with the table and column it refers to recorded."
              depends_on:
                - "phase-2-g3-schema"
              constraints: []
              acceptance: "Each reference points at the related key with the same type, its optionality follows what was declared rather than a separate default of this layer, and an already declared reference field is reused rather than duplicated."
              verify: "For every declared connection the structure names the referring field, the table it refers to and the column it refers to; a connection declared as required refuses a missing reference while one declared as optional accepts it; and a definition connecting twice to the same target keeps its two roles distinguishable."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Mapped every declared connection as an explicit reference to the related key, indexed, with referential behaviour from the unstated physical defaults."
                  check: "uv run python check_db.py g3-relationships"
                  outcome: "PASS: all 19 declared connections name their referring field, referenced table and referenced column, each carrying the referenced key's type and the declared optionality; a required connection left out was refused naming it; an optional value was accepted absent; a definition connecting seven times keeps every role distinct."

            phase-2-g3-constraints:
              id: "phase-2-g3-constraints"
              title: "Guarantee the rules that only stored records can settle"
              description: "Enforce, at the moment changes are committed, the declared rules that cannot be judged without stored records — that values declared unique stay unique across records, and that every reference identifies a record that exists — while leaving what the definitions already judge from their own values to them."
              reason: "These are exactly the rules the defining layer declared but could not enforce, so they hold nowhere until this layer holds them."
              kind: "code"
              inputs:
                - "The declared rules that require stored records to evaluate"
                - "The validation the definitions already perform on their own values"
              expected_result: "A change that breaks a declared uniqueness rule or refers to a record that does not exist fails, and each enforcement is traceable to the declaration it came from."
              depends_on:
                - "phase-2-g3-schema"
              constraints: []
              acceptance: "Uniqueness holds across stored records and every reference resolves to an existing record when changes are committed, including when more than one writer commits at once, and no rule the definitions already judge is judged a second time here."
              verify: "Storing a value that duplicates one declared unique fails, and so does storing a reference to a record that does not exist, both at commit and both when two writers commit concurrently; and a rule the definitions judge from their own values is refused by them rather than by a second copy of it here."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Enforced the declared rules that need stored records — uniqueness across records and references that resolve — at commit, leaving what the definitions judge themselves to them."
                  check: "uv run python check_db.py g3-constraints"
                  outcome: "PASS: a duplicate of a value declared unique was refused, so was a reference to a record that does not exist, and so was the multi-field uniqueness rule the definitions could only declare; two writers committing the same unique value left exactly one stored; a rule the definitions judge was still refused by them."

            phase-2-g3-credentials:
              id: "phase-2-g3-credentials"
              title: "Resolve and apply what happens to a credential at rest"
              description: "Resolve each field the definitions declare as a credential to exactly one treatment at rest, preferring what the project states and otherwise the applicable field-specific default, apply the matching transformation as the value is stored, and keep the stored form out of everything read back."
              reason: "A credential whose treatment is decided per caller is treated inconsistently, and its stored form is the one thing that must never leave this layer."
              kind: "code"
              inputs:
                - "The credential fields and the treatment each of them declares"
                - "The resolved treatments at rest and the key material a reversible one needs"
              expected_result: "Every credential field resolves to one treatment, its stored value carries that transformation, and nothing read back exposes the stored form."
              depends_on:
                - "phase-2-g3-schema"
                - "phase-2-g2-secrets"
              constraints: []
              acceptance: "Each credential field resolves to exactly one treatment with an explicit project statement winning over any default, and a stored credential is never the value that was supplied."
              verify: "A credential stored under a one-way treatment cannot be read back as the original value yet can still be checked against it; one stored under a recoverable treatment yields its original value only inside this layer; and nothing handed to a consumer, derived results included, carries the stored form of a credential."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Resolved each credential field to one treatment at rest with the project's explicit statement winning, applied the transformation on the way in, and kept the stored form inside the layer."
                  check: "uv run python check_db.py g3-credentials"
                  outcome: "PASS: the User credentials resolved to the one-way treatment and the Account credential to the reversible one the project states; a stored credential is never the supplied value; the one-way one cannot be read back but still verifies against the value behind it; the reversible one is readable only inside the layer; no read hands a stored form out."

        # <!-------------------- Group 4 -->
        phase-2-g4:
          id: "phase-2-g4"
          title: "The recorded history of the structure"
          description: "How the stored structure came to exist and how it is rebuilt: an ordered, reversible record of every structural change, kept inside the layer."
          area: "The ordered record the stored structure is built and rebuilt from"
          does: "The whole stored structure can be built from nothing, stepped back, and explained by the recorded order of the changes that produced it."
          constraints: []
          task_count: 2
          tasks:

            phase-2-g4-history:
              id: "phase-2-g4-history"
              title: "Establish the ordered, reversible record of structural change"
              description: "Give the layer an internal way to record each structural change at a fixed position in an order and to step it back again, kept inside the layer rather than offered to consumers."
              reason: "The structure has to be rebuildable from what the repository holds before any structure is created, or the first thing created has no recorded origin."
              kind: "configuration"
              inputs:
                - "The resolved technology for recording structural change and the commands it offers"
                - "The connection to the selected Instance"
              expected_result: "Structural changes can be recorded in a fixed order and stepped back, through something reachable only from inside the layer."
              depends_on:
                - "phase-2-g2-connection"
              constraints: []
              acceptance: "A recorded change can be applied and undone, its position in the order is fixed, and nothing about the mechanism appears on the boundary this layer publishes."
              verify: "Applying and then reversing a recorded structural change returns the structure to what it was, the order of the recorded changes is readable, and the mechanism cannot be reached through the published boundary."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Established the ordered, reversible record of structural change as internal tooling of the layer."
                  check: "uv run python check_db.py g4-history"
                  outcome: "PASS: applying and then reversing a recorded change returned the structure to what it was, the recorded order is readable, and neither the mechanism nor anything from it appears on the published boundary."

            phase-2-g4-initial-structure:
              id: "phase-2-g4-initial-structure"
              title: "Record the change that creates the whole structure"
              description: "Record, as the first change in the order, the creation of the complete derived structure with its references, its constraints and its indexes, so the structure can be built from nothing and taken back to nothing."
              reason: "Until the structure exists as a recorded change it exists only where it was first made, which no other environment can reproduce."
              kind: "code"
              inputs:
                - "The derived structure with its references, constraints and indexes"
              expected_result: "Applying the recorded history to an empty engine produces the complete structure, and reversing it leaves nothing behind."
              depends_on:
                - "phase-2-g4-history"
                - "phase-2-g3-relationships"
                - "phase-2-g3-constraints"
                - "phase-2-g3-credentials"
              constraints: []
              acceptance: "The structure the history produces is the structure derived from the definitions, and nothing structural exists that the history does not account for."
              verify: "Applying the recorded history to an empty engine yields every table, reference, constraint and index the derivation calls for; reversing it removes them; and comparing what was applied against what was derived shows no difference in either direction."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Recorded the first change: the creation of the complete derived structure with its references, constraints and indexes."
                  check: "uv run python check_db.py g4-initial-structure"
                  outcome: "PASS: applying the history to an empty engine produced exactly the derived structure — same tables, same columns, same references, and every derived index present; reversing it left nothing behind; the applied and derived structures differ in neither direction."

        # <!-------------------- Group 5 -->
        phase-2-g5:
          id: "phase-2-g5"
          title: "The published boundary"
          description: "The single surface consumers reach stored data through: which stored identity they act on, the definition-driven operations, the state change the definitions give a field of its own, the way related changes are held together, and the controlled route for what the operations cannot express."
          area: "The one boundary this layer publishes to its consumers"
          does: "A consumer discovers and selects a stored identity, works with every definition through one pipeline, groups related changes so they hold or fail together, and reaches nothing of how any of it is done."
          constraints: []
          task_count: 5
          tasks:

            phase-2-g5-registry:
              id: "phase-2-g5-registry"
              title: "Publish the Instance identities consumers select from"
              description: "Derive from the validated configuration a published catalogue of selectable Instance identities together with the default, carrying identity, name and purpose and nothing that connects to anything."
              reason: "A consumer has to choose which stored data it is working with without learning anything about how that data is reached."
              kind: "code"
              inputs:
                - "The validated Instance catalogue and default selection"
              expected_result: "Consumers discover the available Instance identities and the default through the published boundary, and use one of those identities to say where an operation acts."
              depends_on:
                - "phase-2-g2-validation"
              constraints: []
              acceptance: "The published catalogue holds exactly the configured Instances and carries no connection and no secret, and the identity it publishes is the one an operation accepts."
              verify: "The published catalogue lists every configured Instance and names the default; an identity taken from it selects where an operation acts; and nothing reachable through it yields a connection or a secret value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published the catalogue of selectable stored identities and the default, derived from the validated settings."
                  check: "uv run python check_db.py g5-registry"
                  outcome: "PASS: the catalogue holds exactly the configured Instances and names the default; an identity or its key taken from the catalogue selects where an operation acts; an undeclared key is refused; nothing on it yields a connection or a secret."

            phase-2-g5-operations:
              id: "phase-2-g5-operations"
              title: "Serve every definition through one operation pipeline"
              description: "Publish one generic surface that takes a domain definition, or an instance of one, together with whatever criteria an operation needs, and serves creating, reading, listing, updating and deleting for every persistent definition through a single pipeline driven by the definitions themselves."
              reason: "One pipeline is what makes each new definition cost no new access implementation."
              kind: "code"
              inputs:
                - "The published domain definitions"
                - "The derived structure and the guarantees held over it"
                - "The selectable Instance identities"
              expected_result: "Every persistent definition can be created, read, listed, updated and deleted through one published surface, with no per-definition implementation behind it."
              depends_on:
                - "phase-2-g4-initial-structure"
                - "phase-2-g5-registry"
              constraints: []
              acceptance: "The same surface serves every persistent definition, a caller supplies the definition itself rather than its name alongside a loose set of values, and an update that mentions some fields leaves the rest as they were."
              verify: "Each of the operations works for every published definition through the one surface; identifying a definition by a bare name with unrelated values is refused; an update changes only the fields it states; and no caller ends up holding the engine connection."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published one definition-driven pipeline serving create, read, list, update and delete for every definition, with no per-definition implementation."
                  check: "uv run python check_db.py g5-operations"
                  outcome: "PASS: every one of the 14 definitions is served through the one surface; a definition named as a string was refused; an unknown criteria field was refused; an update changed only the fields it stated; nothing returned exposes a connection."

            phase-2-g5-status:
              id: "phase-2-g5-status"
              title: "Serve enabling and disabling where a definition declares it"
              description: "Publish an operation that enables or disables a record through the field the definitions declare for it, accepting those two actions and nothing else, and available only where the selected definition carries that field."
              reason: "Enabling and disabling is the one state change the definitions give a field of its own, and its own operation keeps callers from writing that field by hand."
              kind: "code"
              inputs:
                - "The definitions that declare a field for their active state"
                - "The published operation pipeline"
              expected_result: "A record of a definition carrying that field can be enabled or disabled through the published surface, and a definition without one refuses the operation."
              depends_on:
                - "phase-2-g5-operations"
              constraints: []
              acceptance: "Enabling sets the declared field to its enabled value and disabling to its disabled one, any other action is refused, and a definition without that field refuses the operation rather than ignoring it."
              verify: "Enabling and disabling change the declared field to the matching value and change nothing else; an action other than those two is refused; and the operation aimed at a definition without that field is refused with the reason."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published enabling and disabling through the field the definitions declare for it."
                  check: "uv run python check_db.py g5-status"
                  outcome: "PASS: enabling and disabling set the declared field and changed nothing else; a third action was refused; a definition declaring no such field refused the operation with the reason."

            phase-2-g5-transactions:
              id: "phase-2-g5-transactions"
              title: "Publish a boundary that holds related changes together"
              description: "Let a consumer group related operations on one stored identity so their changes take effect together or not at all, with this layer owning the committing, the undoing and the cleanup, and reporting what happened without handing over what it used."
              reason: "A consumer knows which changes belong together but must not take ownership of how they are made to hold together."
              kind: "code"
              inputs:
                - "The published operation pipeline"
                - "The connection handling of the selected Instance"
              expected_result: "Operations grouped on one stored identity take effect together when the group succeeds and leave nothing applied when it does not, while a write outside any group remains atomic on its own."
              depends_on:
                - "phase-2-g5-operations"
              constraints: []
              acceptance: "No operation inside a group takes effect on its own, a failed or abandoned group leaves the stored data as it was, and the outcome is reported without the consumer receiving the connection."
              verify: "A group whose later operation fails leaves none of its earlier changes stored while the same group succeeding leaves all of them; a write outside any group is stored atomically; and the reported outcome says what happened without exposing anything used to do it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published a boundary that holds related changes together on one stored identity, owning the commit, the undo and the cleanup."
                  check: "uv run python check_db.py g5-transactions"
                  outcome: "PASS: a group whose later operation failed left none of its earlier changes; the same group succeeding left all of them; a group called off left the data as it was; a lone write was atomic; the group exposes nothing used to reach the data."

            phase-2-g5-commands:
              id: "phase-2-g5-commands"
              title: "Serve controlled commands for what the operations cannot express"
              description: "Publish a route for work that cannot be expressed through the generic operations, carrying its values as explicit parameters, refusing structural change, establishing before it runs what it can read or change and how the protections hold for that, and checking the changes it makes within the same unit before they take effect."
              reason: "Some data work genuinely falls outside definition-driven operations, and without a controlled route for it a consumer reaches around the boundary instead."
              kind: "code"
              inputs:
                - "The protections and constraints the published boundary holds"
                - "The boundary that holds related changes together"
                - "The selected Instance and the identity of its engine"
              expected_result: "Work that cannot be expressed as a generic operation runs on the selected identity under the same protections, and anything whose effects or results cannot be protected is refused before it runs."
              depends_on:
                - "phase-2-g5-operations"
                - "phase-2-g5-transactions"
              constraints: []
              acceptance: "Values travel as parameters rather than as text built into the command, structural change is refused, work that would read or write past the protections is refused before running, and a failure undoes what it changed."
              verify: "A value supplied as a parameter is treated as a value even when it reads like part of a command; an attempted structural change is refused; work whose result would expose the stored form of a credential is refused before running; changes are checked before they take effect and undone when that check fails; and work depending on one engine's own dialect is identified as such."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Published the controlled route for work the operations cannot express, refusing structural change and anything whose effects or results cannot be protected."
                  check: "uv run python check_db.py g5-commands"
                  outcome: "PASS: a parameter carrying a statement-shaped string stayed a value and left the data untouched; create, alter and drop were each refused; naming or writing a credential column, and returning every column of a table holding one, were refused before running; an unknown table and several statements in one command were refused; a change the definitions refuse was rolled back and the earlier value left in place; a command declared for another engine was refused naming it."

        # <!-------------------- Group 6 -->
        phase-2-g6:
          id: "phase-2-g6"
          title: "The declared starting records as stored data"
          description: "Bringing the records the project declared into storage, in an order that works, and in a way that survives being run again."
          area: "The declared starting records once they are stored"
          does: "Every record the project declared is stored with the meaning it was declared with, and running the seeding again leaves it that way."
          constraints: []
          task_count: 2
          tasks:

            phase-2-g6-seeding:
              id: "phase-2-g6-seeding"
              title: "Store the declared starting records in dependency order"
              description: "Bring in the records the definitions declare, in an order where everything referred to already exists, keeping the reference identifiers the declarations carry, and producing the values the declarations left to be generated instead of inventing them."
              reason: "A rebuilt database only replaces the one before it if the records the project declared come back meaning the same thing."
              kind: "data"
              inputs:
                - "The declared starting records and the order they resolve in"
                - "The published operation pipeline and the boundary that holds changes together"
                - "The resolved credential treatments"
              expected_result: "Every declared record is stored, its references resolve to the records the declaration pointed at, and each value left to be generated exists without having been written down anywhere first."
              depends_on:
                - "phase-2-g5-operations"
                - "phase-2-g5-transactions"
              constraints: []
              acceptance: "Every declared record is present afterwards, each satisfies its required fields through a supplied value, a resolved default or a generated one, and nothing left to be generated was decided in advance."
              verify: "After seeding, each declared record is retrievable through the published boundary carrying the values it declared; every reference resolves to the record its declaration identified; and a value left to be generated exists carrying the treatment its field declares."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Stored the declared starting records in dependency order, turning each declared reference position into the identifier storage assigned, and generating the values the declarations deliberately do not carry."
                  check: "uv run python check_db.py g6-seeding"
                  outcome: "PASS: all 22 declared records are retrievable through the published boundary with the values they declared; every reference resolves to the record its declaration identified, verified independently of the seeding; the three values left to be generated exist under the treatment their field declares and are not guessable."

            phase-2-g6-repeatable:
              id: "phase-2-g6-repeatable"
              title: "Keep the seeding safe to run again"
              description: "Make a second run over already-seeded data leave the same records rather than another copy of them, and leave the values produced by the first run alone."
              reason: "Seeding runs again whenever a database is rebuilt or brought up to date, so the second run has to be as safe as the first."
              kind: "code"
              inputs:
                - "The stored starting records"
                - "The declared uniqueness rules"
              expected_result: "Running the seeding again over already-seeded data changes nothing and breaks nothing."
              depends_on:
                - "phase-2-g6-seeding"
              constraints: []
              acceptance: "A second run neither duplicates a logical record nor fails on a uniqueness rule, and a value produced by the first run survives it unchanged."
              verify: "Seeding twice leaves the same records with the same identities as seeding once; a value generated during the first run is the same after the second; and neither run reports a broken rule."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made seeding recognise records already present rather than storing them again."
                  check: "uv run python check_db.py g6-repeatable"
                  outcome: "PASS: seeding twice left the same 22 records with the same identities as seeding once; a value generated by the first run was unchanged after the second; the second run stored nothing and recognised all 22; neither run reported a broken rule."

        # <!-------------------- Group 7 -->
        phase-2-g7:
          id: "phase-2-g7"
          title: "Composition and public description"
          description: "What makes the finished layer usable by the rest of the system: its part of the running composition, and the description a consumer reads instead of the implementation."
          area: "The layer's part of the system composition and the description of what it publishes"
          does: "The layers delivered so far run together through their published boundaries, and this one can be used from its description alone."
          constraints: []
          task_count: 2
          tasks:

            phase-2-g7-composition:
              id: "phase-2-g7-composition"
              title: "Deliver the layer's part of the system composition"
              description: "Provide what this layer contributes to a running system: the settings it owns, its private area for the secrets it declared, its recorded binding to the definitions it consumes, and a demonstration that the layers delivered so far work together through their published boundaries alone."
              reason: "This is the first phase in which two delivered layers have to run together, and they are only known to do so once something outside both of them uses them that way."
              kind: "configuration"
              inputs:
                - "The settings this layer owns and the secrets it declares"
                - "The boundary this layer publishes"
                - "The published interface of the shared definitions"
                - "The conventions for cross-layer bindings"
              expected_result: "The layer carries the settings it owns and the names of the secrets it needs, its consumption of the shared definitions is recorded as a binding, and something outside both layers stores and retrieves a domain record through their published boundaries."
              depends_on:
                - "phase-2-g5-registry"
                - "phase-2-g6-repeatable"
              constraints: []
              acceptance: "A consumer outside this layer reaches stored data only through the published boundary, each layer's own settings stay with the layer that owns them, and no secret value is in committed content."
              verify: "Something outside both layers stores and retrieves a record of a shared definition using only their published boundaries, resolved independently of the directory it runs from; the settings each layer owns and the binding between them are each read from where their owner keeps them; and committed content holds no secret value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Delivered the layer's part of the composition: the settings it owns travelling with it wherever it runs, its private secret area, and its binding to the shared definitions in the project's public configuration."
                  check: "uv run python check_db.py g7-composition"
                  outcome: "PASS: a consumer outside both layers, in its own isolated environment, stored and retrieved a domain record through their published boundaries alone, from the project root and from a temporary directory; each layer's settings and the binding between them were read from where their owner keeps them; no settings this layer owns leaked into the public configuration; no committed content carries a secret value."

            phase-2-g7-description:
              id: "phase-2-g7-description"
              title: "Describe the layer for the consumers that will use it"
              description: "Describe this layer for whoever will consume it, covering every subject a package description must cover, and saying which of its parts are internal and therefore promised to nobody."
              reason: "A consumer that has to read the implementation to find the boundary ends up depending on something the boundary never promised."
              kind: "documentation"
              inputs:
                - "The published boundary and everything it offers"
                - "The layer's own settings, declared secrets and setup requirements"
                - "The resolved conventions for describing a package"
              expected_result: "The package carries a description covering each required subject, matching what it actually publishes, and marking as internal what consumers may not depend on."
              depends_on:
                - "phase-2-g7-composition"
                - "phase-2-g5-commands"
                - "phase-2-g5-status"
              constraints: []
              acceptance: "Every required subject is present, everything presented as public is reachable through the published boundary, what is marked internal is not reachable there, and no secret or connection value is recorded."
              verify: "Each required subject appears in the description; every capability its examples use resolves through the published boundary; the internal parts it names are absent from that boundary; and no credential or connection value appears anywhere in it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Wrote the package description covering purpose and boundaries, public interface, dependencies, configuration, installation and usage, and naming what is internal."
                  check: "uv run python check_db.py g7-description"
                  outcome: "PASS: every required subject is present; each capability the examples use resolves through the published boundary; the three internal parts it names are absent from that boundary; no credential or connection value appears."

    # <!------------------------------- Phase 3 -->
    phase-3:
      id: "phase-3"
      title: "Backend"
      order: 3
      target: "Backend"
      does: "The application layer exists as an independent package that turns the shared definitions into what the application does, reaches stored data only through the persistence boundary, and publishes one described external contract through which every kind of data the project defines can be entered and managed."
      constraints: []
      task_count: 16
      groups:

        # <!-------------------- Group 1 -->
        phase-3-g1:
          id: "phase-3-g1"
          title: "Package boundary and internal layering"
          description: "What the layer must own before it does anything: its own package, its declared consumption of the two layers already delivered, and the internal separation everything else is built inside."
          area: "The layer's own package boundary and the separation of responsibilities inside it"
          does: "The layer exists as its own package consuming the shared definitions and the persistence boundary through what each publishes, with its three internal responsibilities separated and ordered."
          constraints: []
          task_count: 2
          tasks:

            phase-3-g1-boundary:
              id: "phase-3-g1-boundary"
              title: "Establish the application layer as its own package"
              description: "Bring the layer into existence as its own package: its identity under the resolved naming basis, its declared dependencies including both delivered layers, and an isolated environment those resolve into."
              reason: "This layer is the first to consume two others, so which boundaries it depends on has to be declared before any of them is used."
              kind: "configuration"
              inputs:
                - "The resolved package naming and distribution conventions"
                - "The resolved implementation language, isolated environment and contract technology"
                - "The published interfaces of the shared definitions and of the persistence layer"
              expected_result: "The layer exists as its own package whose declared dependencies name both delivered layers, resolving into an environment isolated to this layer."
              depends_on: []
              constraints: []
              acceptance: "The package identity follows the resolved naming basis, and each layer it consumes is reached as a declared dependency rather than reproduced here."
              verify: "The layer's declared dependencies resolve into its own environment, and both consumed layers are the ones their owners publish, with nothing of either redefined inside this one."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Created the layer as its own package taking both delivered layers as declared local-path dependencies, with its own pinned dependencies and isolated environment."
                  check: "uv run python check_backend.py g1-boundary"
                  outcome: "PASS: both consumed layers are declared and resolve into this layer's own environment; the definitions and the persistence boundary in use are the ones their owners publish; and nothing of either is redefined here."

            phase-3-g1-layers:
              id: "phase-3-g1-layers"
              title: "Establish the internal layers and the direction between them"
              description: "Give the package its internal separation: an external boundary, a behaviour responsibility beneath it, and a data-reaching responsibility beneath that, each owning what it is responsible for and reaching only the one directly below it."
              reason: "Every later activity in this phase belongs to one of the three, so which of them owns what has to be settled before any is filled."
              kind: "code"
              inputs:
                - "The declared internal layering of this Component and its dependency direction"
              expected_result: "The three internal responsibilities exist as separate boundaries, each reaching only the one directly beneath it, with the lowest of them the only one that reaches the persistence boundary."
              depends_on:
                - "phase-3-g1-boundary"
              constraints: []
              acceptance: "No boundary reaches past the one immediately below it, the external boundary reaches neither stored data nor the persistence layer, and only the lowest boundary consumes what the persistence layer publishes."
              verify: "Following what each internal boundary depends on yields only the one directly beneath it; the published persistence boundary appears as a dependency of the lowest one alone; and neither of the two above it reaches stored data by any route."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Separated the package into an external boundary, a behaviour responsibility and a single data-reaching responsibility, with the shared vocabulary of refusals beneath all three."
                  check: "uv run python check_backend.py g1-layers"
                  outcome: "PASS: each internal boundary reaches only the one directly beneath it; the persistence layer is named in exactly one module, the lowest one; and neither of the two above it reaches stored data by any route."

        # <!-------------------- Group 2 -->
        phase-3-g2:
          id: "phase-3-g2"
          title: "The route to stored data"
          description: "The one place in this layer that talks to the persistence boundary: turning requested data operations into calls on it, working on the stored identity the composition binds, and carrying a group of related operations through as one."
          area: "The layer's single route to the persistence boundary"
          does: "Data operations asked for by the behaviour above reach stored data through one translation point, on the bound stored identity, and a group of related ones holds together or fails together."
          constraints: []
          task_count: 3
          tasks:

            phase-3-g2-translation:
              id: "phase-3-g2-translation"
              title: "Translate requested data operations into calls on the persistence boundary"
              description: "Turn each data operation the behaviour above asks for into a call on what the persistence layer publishes, and turn what comes back into logical data that carries no trace of how it was stored."
              reason: "One translation point is what lets the persistence layer change without the behaviour above being rewritten, and it puts every stored-data call in one readable place."
              kind: "code"
              inputs:
                - "The published persistence boundary and the operations it offers"
                - "The shared domain definitions"
              expected_result: "Every data operation this layer performs goes through one translation point and comes back as logical data."
              depends_on:
                - "phase-3-g1-layers"
              constraints: []
              acceptance: "Each offered data operation is reachable through this one point and returns logical data, and nothing of the storage mechanism travels back with it."
              verify: "Each data operation performed through this point yields the shared definitions' own data and nothing engine-shaped, connection-shaped or query-shaped; and no other part of this layer performs one."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made one module the layer's only route to stored data, turning requested operations into calls on the published persistence boundary and results back into the definitions' own data."
                  check: "uv run python check_backend.py g2-translation"
                  outcome: "PASS: creating, reading, listing, changing and removing all pass through this one point and come back as the shared definitions' own data; nothing engine-, connection- or session-shaped travels with it; and no other module in the layer performs a data operation."

            phase-3-g2-instance:
              id: "phase-3-g2-instance"
              title: "Work on the stored identity the composition binds"
              description: "Resolve which stored identity this layer's operations act on from the binding the composition declares, selecting it from the catalogue the persistence layer publishes rather than deciding it here."
              reason: "Which stored data the application works with is a composition decision, and a layer that answers it for itself cannot be pointed anywhere else without being edited."
              kind: "configuration"
              inputs:
                - "The declared cross-layer binding naming the stored identity"
                - "The published catalogue of selectable stored identities"
              expected_result: "The stored identity this layer acts on comes from the declared binding and is one the persistence layer publishes."
              depends_on:
                - "phase-3-g2-translation"
              constraints: []
              acceptance: "Changing the bound identity changes where operations act without any change to this layer's code, and a bound identity the persistence layer does not publish is reported rather than replaced by another."
              verify: "Operations act on the identity the binding names; a binding naming an identity that is not published is refused with the reason; and no identity is written into this layer's own implementation."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made the stored identity come from the binding the composition declares, checked against the catalogue the persistence layer publishes."
                  check: "uv run python check_backend.py g2-instance"
                  outcome: "PASS: operations act on the identity the binding names; a binding naming an identity the layer beneath does not publish is refused at startup naming it; and no stored identity is written into this layer's implementation."

            phase-3-g2-grouping:
              id: "phase-3-g2-grouping"
              title: "Carry a group of related operations through as one"
              description: "Take a group of related data operations the behaviour above has decided belong together, run them through the persistence boundary's own way of holding changes together on one stored identity, and report what happened without taking ownership of it."
              reason: "The behaviour above knows which changes belong together but must not own the means of making them hold, and the layer that owns those means is not this one either."
              kind: "code"
              inputs:
                - "The published way of holding related changes together"
                - "The data operations asked for as one group"
              expected_result: "Operations the behaviour above groups take effect together or not at all, with the outcome reported back and nothing of the mechanism handed on."
              depends_on:
                - "phase-3-g2-translation"
              constraints: []
              acceptance: "No operation in a group takes effect on its own, a failed group leaves stored data as it was, and this layer neither decides what belongs in a group nor owns how the group is held."
              verify: "A group whose later operation fails leaves none of its earlier ones stored while the same group succeeding leaves all of them; the outcome reaches the caller; and nothing the persistence layer keeps to itself is passed upward."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Connected a group of related operations to the persistence boundary's own way of holding changes together, propagating the outcome without owning it."
                  check: "uv run python check_backend.py g2-grouping"
                  outcome: "PASS: a group whose later operation failed left none of its earlier ones stored while the same group succeeding left all of them; the outcome reached the caller; and nothing the persistence layer keeps to itself is passed upward."

        # <!-------------------- Group 3 -->
        phase-3-g3:
          id: "phase-3-g3"
          title: "What the application does"
          description: "The behaviour of the application, expressed without reference to how a request arrives or how data is stored: one unit for each kind of data, a common baseline they share, the conditions each operation must satisfy, and the state change that only some kinds of data have."
          area: "The application behaviour and the per-definition units that carry it"
          does: "Every kind of data the project defines has its own unit of behaviour, sharing a common baseline, enforcing what its operations require, and offering the state change only where the definition declares it."
          constraints: []
          task_count: 4
          tasks:

            phase-3-g3-baseline:
              id: "phase-3-g3-baseline"
              title: "Provide the common baseline every unit shares"
              description: "Provide the behaviour common to every kind of data — the resolved standard operations — once, so each unit reuses it instead of restating it, while remaining able to extend or replace any part of it."
              reason: "Fourteen units restating the same operations would be fourteen places to correct, and the point of a per-definition unit is what it adds, not what it repeats."
              kind: "code"
              inputs:
                - "The resolved set of standard operations"
                - "The single route to stored data and the way related operations are grouped"
              expected_result: "The standard operations exist once as a baseline that any unit reuses and any unit may extend."
              depends_on:
                - "phase-3-g2-translation"
                - "phase-3-g2-grouping"
              constraints: []
              acceptance: "Every resolved standard operation is available from the baseline, reaches stored data only through this layer's single route, and can be extended by one unit without changing it for the others."
              verify: "Each standard operation performed through the baseline produces its result for a definition that supports it; overriding one in a single unit changes that unit's behaviour and no other's; and the baseline reaches stored data by no route but the layer's own."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Provided the standard operations once as a baseline every unit reuses and any unit may override."
                  check: "uv run python check_backend.py g3-baseline"
                  outcome: "PASS: each of the resolved standard operations produces its result through the baseline; overriding one in a single unit changed that unit alone and left the others as they were; and the baseline reaches stored data only through this layer's own route."

            phase-3-g3-units:
              id: "phase-3-g3-units"
              title: "Give every kind of data its own unit of behaviour"
              description: "Define, separately for each kind of data the project declares, the unit that carries that kind's operations and behaviour, so each has somewhere of its own to grow into even while it only uses what it shares."
              reason: "A kind of data whose behaviour lives in a shared definition has nowhere to become different, and the moment one of them needs its own rule every other one is disturbed."
              kind: "code"
              inputs:
                - "The published domain definitions"
                - "The common baseline the units share"
              expected_result: "Each declared kind of data has its own separately defined unit, reachable as the one place that kind's behaviour belongs."
              depends_on:
                - "phase-3-g3-baseline"
              constraints: []
              acceptance: "There is exactly one unit per declared kind of data, each defined in its own right rather than as one definition standing in for several, and each reachable through whatever collects them without that collection defining any of them."
              verify: "Every published definition has a unit of its own and no unit serves two of them; a change to one unit leaves the others as they were; and whatever gathers the units only gathers them."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Gave each of the fourteen kinds of data its own separately defined unit of behaviour, gathered by a registry that defines none of them."
                  check: "uv run python check_backend.py g3-units"
                  outcome: "PASS: every published definition has exactly one unit, each defined in its own module rather than one definition standing in for several; a change to one leaves the others untouched; and the gathering point defines no unit itself."

            phase-3-g3-validation:
              id: "phase-3-g3-validation"
              title: "Enforce what an operation requires of the state it produces"
              description: "Judge each operation against the state it would produce: reuse what the definitions already judge from their own values, add the conditions that depend on the operation itself, and for a change that states only some fields, judge the result together with the values already stored rather than the fragment supplied."
              reason: "A partial change judged only on what it carries can produce a whole that no rule was ever applied to, and the conditions that depend on the operation have nowhere else to live."
              kind: "code"
              inputs:
                - "The validation the definitions perform on their own values"
                - "The conditions that depend on an operation rather than on the values alone"
                - "The values already stored for the record being changed"
              expected_result: "An operation is refused when the state it would produce breaks a rule, whether that rule is judged by the definitions or by the operation's own conditions."
              depends_on:
                - "phase-3-g3-baseline"
              constraints: []
              acceptance: "A change stating some fields is judged against the resulting whole rather than the fragment, what the definitions judge is left to them rather than restated here, and what only stored records can settle is still left to the layer that holds them."
              verify: "A change stating one field that would make the resulting record invalid is refused even though the field alone looks valid; a rule the definitions judge is refused by them; and a rule needing stored records is still refused by the layer that holds them."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made each operation judged against the state it would produce, reading back what is stored so a change stating some fields is judged as a whole."
                  check: "uv run python check_backend.py g3-validation"
                  outcome: "PASS: a change stating one field that alone looks valid was refused because the resulting record was not, and the refused change was not applied; what the definitions judge was refused by them with their own reason; and what only stored records can settle was still refused by the layer that holds them."

            phase-3-g3-status:
              id: "phase-3-g3-status"
              title: "Offer the state change only where a definition declares it"
              description: "Make the enable-and-disable operation available through a kind of data's own unit exactly when that kind declares the field it acts on, following the meaning the persistence boundary already gives it."
              reason: "This operation belongs to the definitions that have somewhere to put its result, and offering it elsewhere would mean inventing that somewhere."
              kind: "code"
              inputs:
                - "The definitions declaring a field for their active state"
                - "The meaning the persistence boundary gives that operation"
                - "The per-definition units"
              expected_result: "A kind of data declaring the field can be enabled and disabled through its own unit, and one that does not declare it refuses the operation."
              depends_on:
                - "phase-3-g3-units"
              constraints: []
              acceptance: "The operation runs through the owning unit and this layer's own route rather than around either, no field is created to make it possible, and the two actions it accepts are the only ones."
              verify: "Enabling and disabling through a declaring definition's unit change that definition's declared field and nothing else; a definition without the field refuses the operation with the reason; and the operation reaches stored data through the layer's single route."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Offered enabling and disabling through each kind of data's own unit, exactly where the definition declares the field."
                  check: "uv run python check_backend.py g3-status"
                  outcome: "PASS: enabling and disabling through a declaring definition's unit changed that field and nothing else; every unit offers the operation exactly when its definition declares the field; a definition without one refused with the reason; and the operation reaches stored data through the layer's single route."

        # <!-------------------- Group 4 -->
        phase-3-g4:
          id: "phase-3-g4"
          title: "The external contract"
          description: "The one contract outside consumers depend on: how a request becomes a call on the behaviour beneath, what data goes in and comes out, what never comes out, everything the project's stated behaviour requires to be reachable, and the description of all of it."
          area: "The layer's external boundary and the contract it publishes"
          does: "An outside consumer can enter and manage every kind of data the project defines through one described contract, without a credential ever coming back and without reaching anything but this boundary."
          constraints: []
          task_count: 5
          tasks:

            phase-3-g4-representations:
              id: "phase-3-g4-representations"
              title: "Derive what goes in and comes out from the shared definitions"
              description: "Build the data shapes this contract accepts and returns from the shared definitions themselves, so each field carried keeps the meaning it was given, and an operation carries the subset it needs without any of it being restated here."
              reason: "A contract that describes the same data in its own words is a second definition, and the two stop agreeing the first time either changes."
              kind: "code"
              inputs:
                - "The published domain definitions and their resolved fields"
                - "The operations the contract offers"
              expected_result: "Every shape this contract accepts or returns comes from the shared definitions, carrying the meaning of each field it includes."
              depends_on:
                - "phase-3-g1-layers"
              constraints: []
              acceptance: "No field, rule or meaning of a definition is restated in this layer, and a shape carrying part of a definition still carries that part's declared meaning."
              verify: "Each shape's fields and their meaning trace to the shared definition they come from; changing a definition changes the shape without this layer being edited; and no definition is described twice."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Derived what the contract accepts and returns from the shared definitions themselves, in three shapes: what creates a record, what changes one, and what comes back."
                  check: "uv run python check_backend.py g4-representations"
                  outcome: "PASS: no shape invents a field, each carries the annotation its definition declares, and what comes back is exactly the definition minus its credentials; a shape follows a definition that changes without this layer being edited; and no definition is restated here."

            phase-3-g4-transport:
              id: "phase-3-g4-transport"
              title: "Turn an arriving request into a call on the behaviour beneath"
              description: "Receive a request over the resolved transport, check that its shape is one this contract accepts, call the behaviour that answers it, and turn what comes back — including a refusal — into a response the transport can carry."
              reason: "Keeping this boundary to communication is what lets the same behaviour be reached another way later without any of it being rewritten."
              kind: "code"
              inputs:
                - "The resolved transport and its conventions"
                - "The per-definition units of behaviour"
                - "The shapes this contract accepts and returns"
              expected_result: "A request arriving over the resolved transport reaches the behaviour that answers it and produces a response carrying its outcome."
              depends_on:
                - "phase-3-g3-units"
                - "phase-3-g4-representations"
              constraints: []
              acceptance: "This boundary decides nothing about what the application does, reaches stored data through no route of its own, and turns both a result and a refusal into a response that says which it is."
              verify: "A well-formed request produces the result the behaviour beneath produced; a malformed one is refused as malformed without the behaviour being reached; a refusal from beneath arrives as a response distinguishable from a success; and this boundary depends on nothing below the behaviour it calls."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made the external boundary decode a request, call the behaviour that answers it, and turn a result or a refusal into a response."
                  check: "uv run python check_backend.py g4-transport"
                  outcome: "PASS: a well-formed request produced what the behaviour produced; a malformed one and one carrying an unknown field were both refused without the behaviour being reached; a refusal arrived carrying its reason and distinguishable from a success; and this boundary reaches nothing below the behaviour it calls."

            phase-3-g4-operations:
              id: "phase-3-g4-operations"
              title: "Make every kind of data enterable and manageable"
              description: "Expose, for every kind of data the project defines, the operations the project's stated behaviour requires of it, so that all of the data the project describes can be entered and managed through this contract."
              reason: "Entering and managing all the defined data is what the project says the application is for, and a kind of data missing from the contract cannot be either."
              kind: "code"
              inputs:
                - "The project's stated behaviour"
                - "The per-definition units and the operations each supports"
                - "The way a request reaches the behaviour beneath"
              expected_result: "Every kind of data the project defines can be created, retrieved, listed, changed and removed through this contract, with the state change offered wherever the definition declares it."
              depends_on:
                - "phase-3-g4-transport"
                - "phase-3-g3-status"
                - "phase-3-g3-validation"
              constraints: []
              acceptance: "No kind of data the project defines is unreachable, each offered operation reaches its own kind's unit, and an operation a definition does not support is absent rather than present and failing."
              verify: "For every kind of data the project defines, a record can be entered, retrieved, listed, changed and removed through this contract; a request for one kind reaches that kind's own behaviour; and an operation a definition cannot support is not offered for it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Exposed the five standard operations for every kind of data the project defines, with the state change wherever the definition declares it."
                  check: "uv run python check_backend.py g4-operations"
                  outcome: "PASS: all 14 kinds of data can be listed, entered, retrieved, changed and removed through the contract, and the status operation is offered exactly where the field is declared; a record was entered and fully managed through the contract, with a change altering only the field it stated; and a request for one kind reached that kind's own behaviour."

            phase-3-g4-credentials:
              id: "phase-3-g4-credentials"
              title: "Accept a credential without ever returning one"
              description: "Take the fields the definitions mark as credentials as input where an operation needs them, describe them as input so a consumer knows how to supply them, and keep them out of every response and every described response shape."
              reason: "A credential that crosses this boundary outward even once is spent, and the places it slips out are the ones nobody looks at."
              kind: "code"
              inputs:
                - "The credential markers the shared definitions carry"
                - "The shapes this contract accepts and returns"
              expected_result: "A credential can be supplied through this contract and appears in no response, no described response shape, and no recorded output."
              depends_on:
                - "phase-3-g4-representations"
                - "phase-3-g4-operations"
              constraints: []
              acceptance: "Which fields are credentials is read from the definitions rather than guessed from their names, and no response, description, example, diagnostic or refusal carries a credential value."
              verify: "A record created with a credential comes back without it, and so does every later retrieval of it; the described response shapes contain no credential field while the input shapes do; and a refusal caused by a credential says so without repeating the value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made credential fields input-only: accepted where an operation needs them, absent from every response and from every described response shape."
                  check: "uv run python check_backend.py g4-credentials"
                  outcome: "PASS: a record created with credentials came back without them, and so did every later retrieval and every listing; the described response shapes carry no credential field while the input shapes do; which fields are credentials is read from the definitions rather than guessed from names; and a refusal about a credential did not repeat its value."

            phase-3-g4-description:
              id: "phase-3-g4-description"
              title: "Publish a machine-readable description of the contract"
              description: "Have this boundary produce a description of the operations it offers and the shapes they carry, in the resolved machine-readable form, so a consumer can learn the contract from the contract itself."
              reason: "Only the boundary that defines the contract can describe it accurately as it changes, and a description written anywhere else is out of date the first time it does."
              kind: "code"
              inputs:
                - "The offered operations and the shapes they carry"
                - "The resolved form the description takes"
              expected_result: "A machine-readable description of every offered operation and shape is published by this boundary and matches what it actually offers."
              depends_on:
                - "phase-3-g4-operations"
                - "phase-3-g4-credentials"
              constraints: []
              acceptance: "The description is produced by this boundary rather than maintained beside it, covers every offered operation, and carries no credential value or other secret."
              verify: "The published description lists every operation the contract offers and no operation it does not; an operation added to the contract appears in it without anything else being edited; and it contains no credential value and no example that is one."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Had the boundary publish a machine-readable description of the contract, with a readable rendering of it."
                  check: "uv run python check_backend.py g4-description"
                  outcome: "PASS: the description covers exactly the operations the contract offers and no others; an operation added to the contract appears in it with nothing else edited; it is produced by the boundary rather than kept as a file beside it; and it carries no credential value or credential-shaped example."

        # <!-------------------- Group 5 -->
        phase-3-g5:
          id: "phase-3-g5"
          title: "Composition and public description"
          description: "What makes the finished layer part of a running system and usable by whoever comes next: its own part of the composition, and the description a consumer reads instead of the implementation."
          area: "The layer's part of the system composition and the description of what it publishes"
          does: "The three layers delivered so far run together, and this one can be started and used from its description alone."
          constraints: []
          task_count: 2
          tasks:

            phase-3-g5-composition:
              id: "phase-3-g5-composition"
              title: "Deliver the layer's part of the system composition"
              description: "Provide what this layer contributes to a running system: the settings it owns, its private area for any secret it declares, its recorded bindings to the layers it consumes, and the running process that serves its contract, so that all three delivered layers work together through their published boundaries alone."
              reason: "This is the first phase whose layer runs as a service rather than being imported, and a composition assembled later would be assembled against layers that were never run together."
              kind: "configuration"
              inputs:
                - "The settings this layer owns and any secret it declares"
                - "The published boundaries of the layers it consumes"
                - "The conventions for cross-layer bindings and for the process that runs a layer"
              expected_result: "The layer carries the settings it owns, records what it consumes as bindings, and runs as a process serving its contract over the resolved transport."
              depends_on:
                - "phase-3-g4-operations"
                - "phase-3-g2-instance"
              constraints: []
              acceptance: "The running layer answers over the resolved transport, each layer's own settings stay with the layer that owns them, what this one consumes is recorded as a binding rather than assumed, and no secret value is in committed content."
              verify: "With the layer running, an outside consumer reaches stored data through its contract alone and receives what the delivered layers hold; the settings each layer owns and the bindings between them are each read from where their owner keeps them; and committed content holds no secret value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Delivered the layer's part of the composition: the settings it owns, its bindings to both consumed layers in the public configuration, and the process that serves the contract where its settings say."
                  check: "uv run python check_backend.py g5-composition"
                  outcome: "PASS: the layer started and answered on the address its own settings name, and an outside consumer reached what the delivered layers hold through its contract alone; each layer's settings sit with the layer that owns them and the bindings in the public configuration; no setting this layer owns leaked into that file; and no committed content carries a secret value."

            phase-3-g5-readme:
              id: "phase-3-g5-readme"
              title: "Describe the layer for the consumers that will use it"
              description: "Describe this layer for whoever will consume it, covering every subject a package description must cover, including how it is configured and started and where its machine-readable contract description is found."
              reason: "The next layer built on this one meets it as a running contract rather than as source, and what it can rely on has to be written down somewhere other than the implementation."
              kind: "documentation"
              inputs:
                - "The published contract and everything it offers"
                - "The layer's own settings, declared secrets and startup requirements"
                - "The resolved conventions for describing a package"
              expected_result: "The package carries a description covering each required subject, consistent with the contract it actually publishes."
              depends_on:
                - "phase-3-g5-composition"
                - "phase-3-g4-description"
              constraints: []
              acceptance: "Every required subject is present, what it says the contract offers is what the contract offers, and it records no credential or other secret value."
              verify: "Each required subject appears in the description; every operation it presents is one the running contract answers; the startup it describes brings the layer up; and no credential value appears in it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Wrote the package description covering purpose and boundaries, public interface, dependencies, configuration, installation and startup, and usage."
                  check: "uv run python check_backend.py g5-readme"
                  outcome: "PASS: every required subject is present; every path the description shows is one the contract answers and every published name its examples use resolves; the startup command it gives brought the layer up and it answered; and no credential value appears in it."

    # <!------------------------------- Phase 4 -->
    phase-4:
      id: "phase-4"
      title: "Frontend"
      order: 4
      target: "Frontend"
      does: "The presentation layer exists as an independent package through which a person can see and work with every kind of data the project defines, reaching the application only through the contract the layer beneath publishes, and looking like one product throughout."
      constraints: []
      task_count: 14
      groups:

        # <!-------------------- Group 1 -->
        phase-4-g1:
          id: "phase-4-g1"
          title: "Package boundary and internal layering"
          description: "What the layer must own before anything is shown: its own package, and the separation between what a person sees, how the interface behaves, and how application data is fetched."
          area: "The layer's own package boundary and the separation of responsibilities inside it"
          does: "The layer exists as its own package with its three internal responsibilities separated and ordered, reaching the application only through the published contract."
          constraints: []
          task_count: 2
          tasks:

            phase-4-g1-boundary:
              id: "phase-4-g1-boundary"
              title: "Establish the presentation layer as its own package"
              description: "Bring the layer into existence as its own package: its identity under the resolved naming basis, its declared dependencies, and the environment they resolve into, kept separate from the layers already delivered."
              reason: "This layer is built with a different toolchain from the ones beneath it, so its own environment has to stand on its own before anything is put in it."
              kind: "configuration"
              inputs:
                - "The resolved package naming and distribution conventions"
                - "The resolved implementation language, user-interface technology, application framework and package manager"
              expected_result: "The layer exists as its own package with a declared identity and dependency set that resolve into an environment belonging to it alone."
              depends_on: []
              constraints: []
              acceptance: "The package identity follows the resolved naming basis, its declared dependencies resolve, and nothing of the layers beneath it is installed into or reproduced inside it."
              verify: "The layer's declared dependencies resolve into its own environment and it builds; no implementation of another layer is present among them; and no environment artifact is carried in version-controlled content."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Created the layer as its own package with its own toolchain and pinned dependencies, separate from the three layers beneath it."
                  check: "node check_frontend.mjs g1-boundary"
                  outcome: "PASS: the declared dependencies resolve into this layer's own environment and it builds; no other layer's implementation is installed here or reached from here; and neither the installed packages nor the build output is in version control."

            phase-4-g1-layers:
              id: "phase-4-g1-layers"
              title: "Establish the internal layers and the direction between them"
              description: "Give the package its internal separation: what a person sees, the behaviour of the interface beneath it, and beneath that the single place application data is fetched, each reaching only the one directly below it."
              reason: "Every later activity in this phase belongs to one of the three, so which of them owns what has to be settled before any is filled."
              kind: "code"
              inputs:
                - "The declared internal layering of this Component and its dependency direction"
              expected_result: "The three internal responsibilities exist as separate boundaries, each reaching only the one directly beneath it, with the lowest of them the only one that reaches the published contract."
              depends_on:
                - "phase-4-g1-boundary"
              constraints: []
              acceptance: "What a person sees performs no communication with the application itself, and only the lowest boundary reaches the contract."
              verify: "Following what each internal boundary depends on yields only the one directly beneath it; the contract is reached from the lowest one alone; and nothing in the layer imports or reaches the implementation of any layer beneath it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Separated the package into what a person sees, how the interface behaves, and the single place the application is reached."
                  check: "node check_frontend.mjs g1-layers"
                  outcome: "PASS: each internal boundary reaches only the one directly beneath it; the application is reached from the lowest one alone, with no other module in the layer communicating with it; and the pages compose views rather than fetching."

        # <!-------------------- Group 2 -->
        phase-4-g2:
          id: "phase-4-g2"
          title: "The door to application data"
          description: "The one place this layer talks to the application: reaching the published contract, deriving what is sent and received from what that contract describes, and sending a change that says exactly what it means."
          area: "The layer's single boundary onto the published contract"
          does: "Application data is reached only through the published contract, in shapes derived from the contract's own description, with a change carrying exactly what was changed."
          constraints: []
          task_count: 3
          tasks:

            phase-4-g2-client:
              id: "phase-4-g2-client"
              title: "Reach the application through its published contract"
              description: "Provide the one place this layer talks to the application: sending a request, carrying the outcome back, and turning both a result and a refusal into something the behaviour above can work with."
              reason: "One door is what keeps the application's rules in one place and lets the way it is reached change without the interface being rewritten."
              kind: "code"
              inputs:
                - "The published contract and where the composition says it is"
                - "The refusals the contract can answer with"
              expected_result: "Every request this layer makes goes through one place, and both a result and a refusal come back in a form the behaviour above can act on."
              depends_on:
                - "phase-4-g1-layers"
              constraints: []
              acceptance: "Nothing above this point performs communication of its own, a refusal arrives carrying the reason the contract gave rather than one invented here, and where the application is reached comes from the composition rather than from the implementation."
              verify: "Every request the layer makes is made from this one place; a refusal answered by the contract arrives with its own reason and is distinguishable from a result; and pointing the composition at a different address changes where requests go without any part of the layer being edited."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made one module the layer's only way of talking to the application, carrying back a result or a refusal in the words the application used."
                  check: "node check_frontend.mjs g2-client"
                  outcome: "PASS: the address comes from the composition's binding and appears nowhere in the implementation; a refusal arrived carrying the application's own reason and is distinguishable from a result; and the layer reads the binding from where the composition keeps it."

            phase-4-g2-shapes:
              id: "phase-4-g2-shapes"
              title: "Derive what is sent and received from the contract's own description"
              description: "Build the shapes this layer sends and receives from the machine-readable description the contract publishes, so each field keeps the meaning it has on the other side, and keep them checkable against that description as it changes."
              reason: "A shape written out by hand is a second definition of the same data, and it stops agreeing with the contract the first time either changes."
              kind: "code"
              inputs:
                - "The machine-readable description the contract publishes"
                - "The operations this layer needs"
              expected_result: "Every shape this layer sends or receives is derived from the contract's description and traceable to what that description says."
              depends_on:
                - "phase-4-g2-client"
              constraints: []
              acceptance: "No field or meaning is written out independently of the contract, a credential appears only among what may be sent and never among what is expected back, and a change to the contract is detectable in the shapes rather than silently ignored."
              verify: "Each shape corresponds to what the contract's description states for that operation; no shape expects a credential in what comes back while a credential may still be sent; and a contract that no longer matches the shapes is reported rather than passing unnoticed."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Took the client's shapes from the contract's own machine-readable description, generating the types and deriving the catalogue of what can be worked with."
                  check: "node check_frontend.mjs g2-shapes"
                  outcome: "PASS: all 14 kinds of data and every field they carry correspond to what the description states; the 3 fields the contract accepts but never returns are recognised as write-only and kept out of what is displayed; no field is written out by hand; and a contract that has moved on, or cannot be reached, is reported rather than passing unnoticed."

            phase-4-g2-changes:
              id: "phase-4-g2-changes"
              title: "Send a change that says exactly what was changed"
              description: "Make a change carry the fields a person actually changed and no others, keeping a field left alone apart from one deliberately emptied, and never filling in a value the application would supply for itself."
              reason: "A change that sends every field it happens to hold overwrites things nobody touched, and a value invented to fill a gap becomes a value the user never chose."
              kind: "code"
              inputs:
                - "What the contract accepts for a change"
                - "The fields a person actually changed"
              expected_result: "A change carries only what was changed, an emptied field is sent as emptied, and a field the application supplies for itself is left out."
              depends_on:
                - "phase-4-g2-shapes"
              constraints: []
              acceptance: "A field nobody touched is absent from what is sent, a field deliberately emptied is present as empty, and nothing is sent in place of a value the application would supply."
              verify: "Changing one field of a record sends that field alone and leaves the record's other values as they were; emptying a field and leaving it alone produce two different requests; and a record created without an optional value carries no invented one."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made a change carry the fields that were actually altered, keeping clearing apart from leaving alone, and never inventing a value the application supplies for itself."
                  check: "node check_frontend.mjs g2-changes"
                  outcome: "PASS: altering one field sent that field alone; clearing a field and leaving it alone produced two different requests; and creating a record without an optional value sent none, with the application's own default arriving as 2 rather than something invented. Against the running application, a change to one field left the others as they were."

        # <!-------------------- Group 3 -->
        phase-4-g3:
          id: "phase-4-g3"
          title: "How the interface behaves"
          description: "The behaviour that belongs to the experience rather than to the application: what is being looked at, what is being typed, and what the person is told while they wait or when something is refused."
          area: "The interface's own state and the flows through which a person works"
          does: "A person can work through each kind of data with the interface keeping track of what they are doing, what they have typed, and what the application answered."
          constraints: []
          task_count: 3
          tasks:

            phase-4-g3-flows:
              id: "phase-4-g3-flows"
              title: "Coordinate the work a person does with one kind of data"
              description: "Hold, for each kind of data, the interface state that working with it needs — what is being listed, which record is open, what has just changed — and coordinate the steps of looking at it, adding to it, changing it and removing it."
              reason: "The steps of working with a record are the same whichever kind of data it is, and holding them once keeps every kind of data behaving the same way."
              kind: "code"
              inputs:
                - "The operations the contract offers for each kind of data"
                - "The single door to application data"
              expected_result: "For every kind of data, the interface can list it, open one record, add one, change one and remove one, keeping track of where the person is."
              depends_on:
                - "phase-4-g2-shapes"
              constraints: []
              acceptance: "This behaviour decides nothing the application decides, requests an outcome that depends on application rules rather than working it out, and keeps interface state separate from the data it is showing."
              verify: "Each step for a kind of data reaches the application through the single door and updates what is shown from what came back; an outcome that depends on an application rule is the one the application returned; and interface state is distinguishable from the record it describes."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Held, for each kind of data, the steps of listing it, opening one record, adding, changing and removing one, with the interface state that goes with them."
                  check: "node check_frontend.mjs g3-flows"
                  outcome: "PASS: every step reaches the application through the single door and shows what came back rather than what was sent; the flows perform no communication of their own; and the interface's own standing is held apart from the record it describes."

            phase-4-g3-input:
              id: "phase-4-g3-input"
              title: "Hold what a person types until they mean it"
              description: "Manage what is being entered — what has been typed, what has been touched, what is still empty — check what can be checked as they go, and hand on only the fields they actually changed."
              reason: "What someone has typed is not yet what they mean, and telling the difference is what lets a change say exactly what they changed."
              kind: "code"
              inputs:
                - "What the contract accepts for each operation"
                - "The fields a person has entered or altered"
              expected_result: "Entering and altering values is held until submitted, with the fields actually changed distinguishable from the ones left alone."
              depends_on:
                - "phase-4-g3-flows"
                - "phase-4-g2-changes"
              constraints: []
              acceptance: "A field left untouched is distinguishable from one emptied on purpose, what can be checked before sending is checked, and no check here stands in for one the application makes."
              verify: "Altering one field of a form submits that field alone; clearing a field submits it as cleared; something the interface can see is wrong is caught before it is sent; and a rule the application owns is still answered by the application."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Made what a person types be held until they submit it, with the fields they touched distinguishable from the ones they left alone."
                  check: "node check_frontend.mjs g3-input"
                  outcome: "PASS: what was touched is tracked separately from what was typed; what the contract states about a field — its length, whether it is a number — is checked before sending; a field the application can supply for itself is not treated as missing; and a rule the application owns was still refused by the application, with its own reason."

            phase-4-g3-feedback:
              id: "phase-4-g3-feedback"
              title: "Tell the person what is happening"
              description: "Make waiting, emptiness and refusal visible: that a request is in flight, that there is nothing to show yet, and what the application said when it refused, in the words it used."
              reason: "An interface that goes quiet while it waits, or that swallows a refusal, leaves the person guessing what the application did."
              kind: "code"
              inputs:
                - "The outcomes the single door carries back"
                - "The state of each flow"
              expected_result: "A request in flight, an empty result and a refusal are each visible to the person, and a refusal carries the reason the application gave."
              depends_on:
                - "phase-4-g3-flows"
              constraints: []
              acceptance: "Waiting is distinguishable from emptiness and both from refusal, and a refusal is presented as the application returned it rather than reworded into something it did not say."
              verify: "A request in flight shows as in flight and stops doing so when it finishes; a result with nothing in it is shown as empty rather than as an error; and a refused operation shows the reason the application gave for refusing it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Gave waiting, emptiness and refusal each their own name and their own appearance, with a refusal carrying the application's words."
                  check: "node check_frontend.mjs g3-feedback"
                  outcome: "PASS: the four standings are named and distinguishable, emptiness is not treated as an error, and a refusal is shown with the reason the application gave rather than one written here."

        # <!-------------------- Group 4 -->
        phase-4-g4:
          id: "phase-4-g4"
          title: "What a person sees"
          description: "The interface itself: one visual system decided once, the reusable pieces built on it, the views that put them together for each kind of data, and the way a person gets from any of it to any other."
          area: "The rendered interface and the visual system it is built on"
          does: "A person sees one coherent product in which every kind of data the project defines can be found, read and worked with."
          constraints: []
          task_count: 4
          tasks:

            phase-4-g4-visual-system:
              id: "phase-4-g4-visual-system"
              title: "Decide the appearance once"
              description: "Resolve the visual decisions of the interface — its colours, its type, its spacing, its reading direction and its light or dark appearance — in one place, so everything built afterwards consumes them instead of choosing again."
              reason: "An interface where each piece decides its own appearance stops reading as one product, and changing how it looks becomes a change in every piece of it."
              kind: "code"
              inputs:
                - "The resolved visual system and its stated appearance defaults"
              expected_result: "Every visual decision is resolved in one place and reachable from anywhere in the layer that renders something."
              depends_on:
                - "phase-4-g1-layers"
              constraints: []
              acceptance: "Nothing rendered invents a visual decision of its own, and changing one of the resolved decisions changes the interface everywhere it applies."
              verify: "Changing a resolved visual decision changes what is rendered throughout without any rendered piece being edited; the interface follows the resolved appearance mode and reading direction; and no rendered piece states a visual value of its own."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Resolved the interface's appearance once — its colours, type, spacing, shape and layout — including the point at which the layout narrows, and applied the resolved light-or-dark and reading direction at the top."
                  check: "node check_frontend.mjs g4-visual-system"
                  outcome: "PASS: over 25 visual decisions are resolved in one place; the reader's light or dark preference is followed and a stated choice wins over it; no rendered piece states a colour, a size or an inline value of its own; and the running interface carries the resolved reading direction."

            phase-4-g4-components:
              id: "phase-4-g4-components"
              title: "Build the pieces the interface is made of"
              description: "Build the focused, reusable pieces every part of the interface is assembled from — the ways of showing a set of records, of entering and editing values, of asking for confirmation, of showing what is happening — each defined once and used wherever that idea appears."
              reason: "One definition per idea is what keeps the interface consistent as it grows and keeps a change to that idea in one place."
              kind: "code"
              inputs:
                - "The resolved visual system"
                - "The user-interface ideas the project's data needs"
              expected_result: "Each recurring user-interface idea exists once as a reusable piece that consumes the resolved visual system."
              depends_on:
                - "phase-4-g4-visual-system"
              constraints: []
              acceptance: "The same idea appears in one definition rather than several, each piece is usable in more than one place without being rewritten, and none of them talks to the application."
              verify: "Each recurring idea resolves to a single definition used in more than one place; changing that definition changes every use of it; and no rendered piece communicates with the application itself."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Built the reusable pieces the interface is assembled from — records, fields, actions, marks, asking before acting, and saying what is happening."
                  check: "node check_frontend.mjs g4-components"
                  outcome: "PASS: each recurring idea has a single definition, none of them is defined again elsewhere, the ones used across views are used in more than one place, and no rendered piece talks to the application."

            phase-4-g4-views:
              id: "phase-4-g4-views"
              title: "Assemble the views for working with each kind of data"
              description: "Put the pieces together into the views through which a person works with one kind of data: seeing what is there, opening one, adding one, changing one, removing one, and turning one on or off where that kind of data allows it."
              reason: "Entering and managing the defined data is what the project says the application is for, and a view is where a person actually does it."
              kind: "code"
              inputs:
                - "The project's stated behaviour"
                - "The reusable pieces and the flows behind them"
                - "The operations each kind of data offers"
              expected_result: "Every kind of data the project defines has views through which a person can see it, add to it, change it and remove from it, with turning a record on or off available wherever that kind of data allows it."
              depends_on:
                - "phase-4-g4-components"
                - "phase-4-g3-flows"
                - "phase-4-g3-input"
                - "phase-4-g3-feedback"
              constraints: []
              acceptance: "No kind of data the project defines is missing a way to work with it, a view coordinates the pieces rather than absorbing behaviour that belongs beneath it, and an operation a kind of data does not offer is absent rather than shown and failing."
              verify: "For every kind of data the project defines, a person can reach a view that lists it, one that shows a single record, and the means to add, change and remove one; turning a record on or off appears only where that kind of data allows it; and no view communicates with the application except through the behaviour beneath it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Assembled the views for working with a kind of data: seeing what is there and adding to it, and reading, changing, enabling, disabling and removing one record."
                  check: "node check_frontend.mjs g4-views"
                  outcome: "PASS: all 14 kinds of data have a listing that answers and names itself, a single record is reachable, and each view goes through the behaviour beneath rather than communicating itself; turning a record on or off is tied to what the kind of data allows, which is all 14."

            phase-4-g4-navigation:
              id: "phase-4-g4-navigation"
              title: "Make everything reachable from one place"
              description: "Give the interface a way of getting from anywhere to anywhere: somewhere a person arrives, from which every kind of data is reachable, and from any of it back again."
              reason: "Views nobody can find are views nobody uses, and a person needs to know where they are as well as what they are looking at."
              kind: "code"
              inputs:
                - "The views for each kind of data"
                - "The resolved visual system"
              expected_result: "A person arriving at the interface can reach every kind of data the project defines, and can tell where they are while doing it."
              depends_on:
                - "phase-4-g4-views"
              constraints: []
              acceptance: "Every kind of data is reachable from where a person arrives, without any address being typed by hand, and where they are is apparent from the interface."
              verify: "Starting where a person arrives, every kind of data the project defines is reachable by following the interface alone; each reached view says which kind of data it is showing; and returning from one to where the person started works from any of them."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Gave the interface somewhere to arrive at, from which every kind of data is reachable, and a way back from each of them."
                  check: "node check_frontend.mjs g4-navigation"
                  outcome: "PASS: every one of the 14 kinds of data is linked from where a person arrives; each view reached says which kind of data it shows; and a way back to the starting point is present on them."

        # <!-------------------- Group 5 -->
        phase-4-g5:
          id: "phase-4-g5"
          title: "Composition and public description"
          description: "What makes the finished layer part of the running system and usable by whoever comes next: its own part of the composition, and the description someone reads instead of the implementation."
          area: "The layer's part of the system composition and the description of what it offers"
          does: "All four layers run together, and this one can be built, started and used from its description alone."
          constraints: []
          task_count: 2
          tasks:

            phase-4-g5-composition:
              id: "phase-4-g5-composition"
              title: "Deliver the layer's part of the system composition"
              description: "Provide what this layer contributes to a running system: the settings it owns, its recorded binding to the contract it consumes, whatever secret handling it requires kept away from anything delivered to a person's browser, and the process that serves the interface, so that all four delivered layers work together."
              reason: "This is the last layer, and until it runs against the others the system has never been seen working end to end by anyone."
              kind: "configuration"
              inputs:
                - "The settings this layer owns"
                - "The published contract and where the composition says it is"
                - "The conventions for cross-layer bindings, for a layer's secrets, and for the process that runs a layer"
              expected_result: "The layer builds and runs, reaching the contract at the address the composition names, with all four delivered layers working together."
              depends_on:
                - "phase-4-g4-navigation"
                - "phase-4-g2-client"
              constraints: []
              acceptance: "The running interface shows data that came from the layers beneath it, where it reaches them is recorded as a binding rather than written into the implementation, and nothing delivered to a person's browser carries a secret value."
              verify: "With every layer running, the interface shows records the layers beneath it hold and a change made in the interface is visible in them afterwards; the address it reaches comes from the recorded binding; and nothing built for delivery to a browser contains a secret value."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Delivered the layer's part of the composition: the settings it owns, its binding to the application's contract, and the process that serves the interface."
                  check: "node check_frontend.mjs g5-composition"
                  outcome: "PASS: with all four layers running, the interface served every kind of data and a record added through the contract was held by the layers beneath; the address comes from the recorded binding and no setting this layer owns leaked into the public configuration; nothing built for delivery to a browser carries a secret, and no secret file is in version control."

            phase-4-g5-readme:
              id: "phase-4-g5-readme"
              title: "Describe the layer for whoever comes to it next"
              description: "Describe this layer for whoever will run or change it, covering every subject a package description must cover, including how it is built, how it is started, and what it expects to be running before it is."
              reason: "This layer is the one a person meets first and the one whose setup is least guessable from its source, so what it needs has to be written down."
              kind: "documentation"
              inputs:
                - "What the layer offers and what it consumes"
                - "The layer's own settings and startup requirements"
                - "The resolved conventions for describing a package"
              expected_result: "The package carries a description covering each required subject, consistent with what the layer actually does and needs."
              depends_on:
                - "phase-4-g5-composition"
              constraints: []
              acceptance: "Every required subject is present, what it says about starting the layer is what actually starts it, what it says the layer needs running is what the layer needs, and it records no secret value."
              verify: "Each required subject appears in the description; the build and startup it gives bring the interface up; the dependency it states on the layer beneath is the one the layer actually has; and no secret value appears in it."
              status: "done"
              log:
                - at: "2026-09-08"
                  by: "my-interface-developer"
                  from: "todo"
                  to: "done"
                  note: "Wrote the package description covering purpose and boundaries, public interface, dependencies, configuration, installation and startup, and usage."
                  check: "node check_frontend.mjs g5-readme"
                  outcome: "PASS: every required subject is present; the versions and commands it states are the ones the package actually declares and offers; it says which layer must already be running; the startup it gives brought the interface up and it answered; and no credential value appears in it."
