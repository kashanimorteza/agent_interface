        # <!-------------------- interface -->
        phase_2.interface:
          id: "phase_2.interface"
          title: "Database Interface"
          description: "The operations, the transaction boundary, and the registry that the package publishes to consumers. The Tasks are related because each supplies one part of the single boundary consumers use, and none of them exposes the engine."
          area: "The Database Interface layer and its published operations"
          does: "A consumer performs create, read, list, update, delete, and status operations on any shared Model, groups related operations so they succeed or fail together, executes a controlled parameterized command, and discovers Instances, all through one generic Model-driven surface that never exposes a connection."
          constraints: []
          task_count: 5
          tasks:

            phase_2.interface.model_operations:
              id: "phase_2.interface.model_operations"
              title: "Provide the generic Model operations"
              description: "Provide create, read, list, update, and delete through one Model-driven pipeline that accepts a Model type or Model instance from the Model package, the operation, its criteria, and an optional Instance selection, and returns Model instances rather than storage rows."
              reason: "One pipeline serves every Model, so each Model costs no new access implementation and every consumer sees the same behaviour."
              kind: "code"
              inputs:
                - "The Model package's public import interface"
                - "The derived storage mapping and the shared validation checks"
                - "The Instance connections"
                - "The migrated storage structure"
              expected_result: "The five operations work for every one of the fourteen Models through the same calls, accept typed Model identity, and enforce the guaranteed rules."
              depends_on:
                - "phase_2.data_logic.validation_reuse"
                - "phase_2.storage_adapter.connections"
                - "phase_2.storage_schema.migration_history"
              constraints: []
              acceptance: "For every Model, creating from a Model instance returns it with its assigned identifier, reading by identifier returns an equal instance, listing returns instances matching supplied criteria, updating changes only the supplied fields, deleting removes the record, and a Model identity given as a bare name string with a field mapping is rejected."
              verify: "Creating a currency and reading it back by identifier yields equal values; listing with a criterion returns only matching currencies; updating one field leaves the others unchanged; deleting it makes the read fail; and an operation given a Model name string instead of a Model type is rejected."
              status: "done"
              log:
                - at: "2026-09-07T21:11:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the mapping, connections, and structure existed; implementing the generic Model-driven pipeline."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated Instance: stored a currency from a Model instance and asserted the result is a Model instance with an assigned identifier and the applied default; read it back by identifier and asserted equality; stored a second from a Model type and its data and asserted listing by code returns only the first while listing without criteria returns both; updated one field and asserted the others are unchanged; deleted it and asserted reading raises not-found; asserted storing a duplicate code is refused as a rule violation; asserted reading and listing with a Model name string instead of a Model type are rejected."
                  outcome: "Passed."

            phase_2.interface.status_operation:
              id: "phase_2.interface.status_operation"
              title: "Provide the status operation"
              description: "Provide the status operation that accepts exactly one action, enable or disable, for a Model that declares a status field, sets that field accordingly, and rejects any other action or any Model without a status field."
              reason: "Enabling and disabling is the one state change every status-bearing Model shares, so it belongs to the generic interface."
              kind: "code"
              inputs:
                - "The generic Model operations"
              expected_result: "Enable and disable change the status field of a status-bearing record, and every other action or Model is rejected."
              depends_on:
                - "phase_2.interface.model_operations"
              constraints: []
              acceptance: "Disabling a stored record sets its status to false and enabling sets it to true, an action other than enable or disable is rejected, and the operation is rejected for a Model without a status field."
              verify: "Disabling a seeded currency reads back status false and enabling it reads back true, an unknown action is rejected, and invoking the operation on a Model without a status field is rejected."
              status: "done"
              log:
                - at: "2026-09-07T21:12:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the generic operations; adding the enable-or-disable operation."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated and seeded Instance: disabled the seeded US Dollar currency and asserted its status reads false both from the result and from a fresh read, enabled it and asserted true; asserted an unknown action is rejected; declared an ad-hoc Model without a status field and asserted the gateway rejects the operation for it, and that the pipeline, given a mapping including that Model, rejects it specifically for declaring no status field."
                  outcome: "Passed."

            phase_2.interface.transactions:
              id: "phase_2.interface.transactions"
              title: "Publish the transaction boundary"
              description: "Publish a boundary through which a consumer groups related operations on one Instance, so that the group's changes are committed together only when the whole unit succeeds and are undone together when it fails or is cancelled, while a write outside any group forms its own unit, and report the outcome without handing over the connection."
              reason: "Related changes must not be left half applied when one of them fails, and the consumer needs to say which changes belong together without owning persistence internals."
              kind: "code"
              inputs:
                - "The generic Model operations"
                - "The Instance connections"
              expected_result: "A published boundary that commits a group of operations together, undoes them together on failure or cancellation, and reports what happened without exposing a connection."
              depends_on:
                - "phase_2.interface.model_operations"
              constraints: []
              acceptance: "Records written inside a group that succeeds are all present afterwards; none of them is present after a group that fails or is cancelled; no operation inside a group is durable before the group completes; a write outside any group is atomic on its own; the boundary reports its outcome and yields no connection; and one group acts on exactly one Instance."
              verify: "Creating two currencies inside one group and completing it leaves both stored; creating one and then failing the group leaves neither; cancelling a group after a create leaves nothing stored; a standalone create that violates a guaranteed rule leaves nothing stored; and the boundary exposes no connection object."
              status: "done"
              log:
                - at: "2026-09-07T21:12:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the generic operations; publishing the transaction boundary."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated Instance: stored two currencies inside one group, completed it, and asserted both are present, the unit reports itself committed, and it names the one Instance it acted on; stored one and then triggered a rule violation inside a second group, asserted the failure propagated, the unit reports itself rolled back, and neither change survived; stored one inside a third group and cancelled it, asserting no error escaped, the unit reports itself rolled back, and nothing was kept; opened a fourth group, stored a currency in it, and from a second independent gateway on the same Instance asserted the record was not visible before the group completed and was visible after; asserted a standalone store that breaks a guaranteed rule leaves the record count unchanged; asserted the unit exposes no connection attribute."
                  outcome: "Passed."

            phase_2.interface.sql_execution:
              id: "phase_2.interface.sql_execution"
              title: "Provide controlled command execution"
              description: "Provide execution of a data command against a selected Instance for cases the generic operations cannot express, taking values only as explicit parameters, participating in the published transaction boundary when one is active, refusing any command that would change the storage structure, and identifying a command written for one Engine as such."
              reason: "Some queries cannot be expressed as Model operations, and the alternative to a controlled path is consumers reaching around the interface."
              kind: "code"
              inputs:
                - "The Instance connections"
                - "The published transaction boundary"
              expected_result: "A parameterized data command runs inside the Database boundary and returns its result, bound rather than interpolated, sharing the active transaction and unable to alter the structure."
              depends_on:
                - "phase_2.interface.transactions"
              constraints: []
              acceptance: "A command with bound parameters returns the expected result, a parameter value containing command syntax is treated as data, a command that would create, alter, or drop a storage object is refused, a command run inside a group is undone with that group, and the returned result carries no connection."
              verify: "Executing a count with a bound parameter returns the matching count and executing it with a parameter value that contains command syntax returns zero rather than altering the command; a command that would drop a table is refused and the table remains; a command run inside a group that is then failed leaves its change undone; and the result exposes no connection object."
              status: "done"
              log:
                - at: "2026-09-07T21:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the transaction boundary existed; adding controlled command execution."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Against a temporary migrated and seeded Instance: executed a count of currencies with the code bound as a parameter and asserted one row with count one; executed the same command with a parameter value containing quote-and-or command syntax and asserted count zero with all eight currencies still present; asserted four structural commands are refused, including one hidden behind a comment, and that the table and its rows remain; ran a data command inside a group, observed its change within the group, cancelled the group, and asserted the change was undone; asserted a command declared for another Engine is refused while the same command declared for the selected Engine succeeds; asserted the result is a list of plain mappings none of whose values can execute commands."
                  outcome: "Passed."

            phase_2.interface.instance_registry:
              id: "phase_2.interface.instance_registry"
              title: "Publish the Instance Registry"
              description: "Publish through the interface a registry derived from the validated Instance catalogue, from which a consumer discovers every Instance's identity and which one is the default, and whose identities can be supplied to select the Instance for an operation, without any connection or secret being handed over."
              reason: "A consumer chooses storage by purpose, and it can only do so if the identities are discoverable and usable without learning how any of them connect."
              kind: "code"
              inputs:
                - "The resolved Instance identities"
              expected_result: "A registry listing every declared Instance identity with the default marked, carrying no connection and no secret, whose identities select the Instance an operation acts on."
              depends_on:
                - "phase_2.storage_adapter.instances"
              constraints: []
              acceptance: "The registry lists the general Instance with its key, name, purpose, and Engine, marks it as the default, derives its entries from the declared catalogue rather than a second list, exposes no connection settings or secrets, and an identity taken from it selects that Instance for an operation."
              verify: "Reading the registry yields the general Instance as the default with its identity fields and a count matching the declared catalogue, its entries contain no connection, storage location, or secret value, and performing an operation with an identity taken from the registry reaches that Instance."
              status: "done"
              log:
                - at: "2026-09-07T21:11:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once identities resolved; publishing the registry through the gateway."
                - at: "2026-09-07T21:17:50Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Read the registry from the gateway and asserted the default entry is the general Instance marked as default with its name, purpose, and Engine; asserted its length and entry count both equal the number of Instances the layer configuration declares, so it derives from that catalogue rather than a second list; asserted lookup and membership work; asserted the entry type carries exactly the key, name, purpose, engine, database, and default fields and that no entry value contains a path separator, a storage file suffix, a host, or a secret; stored and read a record using an identity taken from the registry and asserted it reached that Instance."
                  outcome: "Passed."

        # <!-------------------- composition -->
        phase_2.composition:
