# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/task.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Task Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."


# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 18
  plans:

    # <!-------------------------------------------- phase_1 -->
    phase_1:
      id: "phase_1"
      title: "Model"
      order: 1
      target: "Model"
      does: "The independent Model layer exists as one reusable package that declares every defined Model with its fields, relationships, rules, and initial data, and publishes them through one documented import interface."
      constraints: []
      task_count: 18
      groups:

        # <!-------------------- package -->
        phase_1.package:
          id: "phase_1.package"
          title: "Model package"
          description: "The package that holds the Model layer: its identity and isolated environment, the single public import interface through which every Model is reached, and the description a consumer reads to use it. The Tasks are related because each establishes one part of the boundary the domain Models live inside."
          area: "The Model package boundary and its public import interface"
          does: "The Model package exists as an installable, isolated boundary that exposes every declared Model once through one documented public import interface."
          constraints: []
          task_count: 3
          tasks:

            phase_1.package.establish:
              id: "phase_1.package.establish"
              title: "Establish the Model package"
              description: "Create the Model layer as its own package with its resolved identity, an isolated environment, and its declared dependencies, ready to hold the domain Models. The package consumes no other application layer."
              reason: "Every Model of the project must live in one shared boundary before any Model can be declared in it."
              kind: "code"
              inputs:
                - "The package naming and distribution conventions"
                - "The resolved Model language, isolated environment, and modeling technology"
              expected_result: "An installable Model package with a stable identity, whose isolated environment resolves its dependencies and which can be imported by name."
              depends_on: []
              constraints: []
              acceptance: "The package installs into a fresh isolated environment from its own declaration, imports by its resolved name, and declares no dependency on another application layer."
              verify: "Installing the package into a clean isolated environment succeeds, and importing it by name succeeds without reaching any other application layer."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed as the only eligible Task; creating the package and its isolated environment."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Created a fresh isolated environment in a temporary directory, installed the package into it from its own declaration, and from outside the package directory imported it by name, asserting that fourteen Models are exposed and that no module of another application layer was loaded; asserted that the declared dependencies contain only the modeling library. Resolved Python 3.14.7 and Pydantic 2.13.5."
                  outcome: "Passed."

            phase_1.package.interface:
              id: "phase_1.package.interface"
              title: "Publish the public import interface"
              description: "Expose every declared Model exactly once through the package's single public import interface, each under an ecosystem-compatible public symbol that preserves the Model's logical identity."
              reason: "Consumers must obtain every Model from one declared surface rather than from the package's internals."
              kind: "code"
              inputs:
                - "Every declared Model of the phase"
              expected_result: "One public import surface through which each of the fourteen defined Models is reachable by its logical name."
              depends_on:
                - "phase_1.models.user"
                - "phase_1.models.currency"
                - "phase_1.models.trading_platform"
                - "phase_1.models.broker"
                - "phase_1.models.account_group"
                - "phase_1.models.account"
                - "phase_1.models.asset"
                - "phase_1.models.trailing_group"
                - "phase_1.models.trailing_rule"
                - "phase_1.models.partial_group"
                - "phase_1.models.partial_rule"
                - "phase_1.models.action_group"
                - "phase_1.models.action"
                - "phase_1.models.position"
              constraints: []
              acceptance: "Each of the fourteen defined Models is importable from the public interface under exactly one symbol, and the set of public Model symbols equals the set of defined Models."
              verify: "Importing each defined Model by its public name from the interface succeeds, and enumerating the interface's public Model symbols yields exactly the fourteen defined Models with no duplicate."
              status: "done"
              log:
                - at: "2026-09-07T14:47:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed after every Model Task was implemented; publishing the single public import interface."
                - at: "2026-09-07T14:48:48Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Imported each of the fourteen defined Models by its public name from the package interface and asserted each is a Model subclass; enumerated the interface's declared public symbols, filtered to Model subclasses, and asserted the set equals the fourteen defined Models with no duplicate and that the ordered Model registry lists them in project order."
                  outcome: "Passed."

            phase_1.package.documentation:
              id: "phase_1.package.documentation"
              title: "Document the Model package"
              description: "Write the package's public description covering its purpose and boundaries, its public interface, its dependencies, its configuration, how it is installed, and how it is used, consistent with the implemented interface."
              reason: "A consumer must be able to install and use the package without inspecting its implementation."
              kind: "documentation"
              inputs:
                - "The implemented public import interface"
                - "The package documentation conventions"
              expected_result: "A package description a reader can follow to install the package and to import and use any defined Model."
              depends_on:
                - "phase_1.package.interface"
              constraints: []
              acceptance: "The description carries every section the documentation conventions require, names every public Model exactly as the interface exposes it, and records no secret value."
              verify: "Following the description's installation and usage instructions from a clean environment succeeds, and every Model named in the description is importable exactly as written."
              status: "done"
              log:
                - at: "2026-09-07T14:47:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed after the interface was published; writing the package description."
                - at: "2026-09-07T14:49:00Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the description carries the purpose-and-boundaries, public-interface, dependencies, configuration, installation, and usage sections and names all fourteen Models; created a fresh isolated environment, ran the description's own installation command against it, imported every Model named in the description exactly as written, and executed every usage example in the description without error; scanned the description for credential-like values, exempting the documented generation marker and bracketed placeholders."
                  outcome: "Passed. A first run flagged the bracketed placeholder password in the usage example; the check was corrected to exempt placeholders and rerun."

        # <!-------------------- models -->
        phase_1.models:
          id: "phase_1.models"
          title: "Domain Models"
          description: "The declaration of every Model the project defines, each with the fields, relationships, rules, and initial data that belong to it. The Tasks are related because each declares one Model inside the same package, and together they form the complete resolved Model set."
          area: "The domain Model definitions and their validation"
          does: "Every Model the project defines is declared in the package with its fields completed from the applicable field defaults, its relationships, its domain rules, and its initial data, and each refuses a value that violates its declared field properties."
          constraints:
            - "An initial-data value the project marks as generated securely is declared as a value to be generated, never as a stored value. The package holds no generated secret, and generation is performed by the layer that inserts the initial data."
            - "A relationship is declared on the Model that carries the referencing field and names the referenced Model by its logical identity, so the referenced Model must already be declared."
          task_count: 14
          tasks:

            phase_1.models.user:
              id: "phase_1.models.user"
              title: "Declare the User Model"
              description: "Declare the User Model as the project defines it, with its fields, its two credential fields, its two storage rules, and its Admin initial record."
              reason: "User is the entity every user-owned configuration refers to, and multi-user operation depends on it."
              kind: "code"
              inputs:
                - "The User Model definition"
              expected_result: "The User Model is declared with its seven fields, password and api_key marked as credentials, both hash-storage rules, and the Admin record with generated secrets."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for User is present with its declared properties, password and api_key carry their credential nature and hash-storage rule, and the Admin record is declared with its password and api_key marked for generation."
              verify: "A User built from the Admin record reads back name, username, status, and description with their declared properties, and a User without a username, or with a non-boolean status, is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the logical field properties of name (string, required, unique), username (required), password and api_key (credential), status (boolean, default true), and description (nullable); asserted both hash-storage rules are declared and that the Admin record marks password and api_key for generation; built a User from the Admin record with locally generated secrets and asserted name, username, status, and description read back as declared; asserted a validation error without username and with status given as text or as a number."
                  outcome: "Passed."

            phase_1.models.currency:
              id: "phase_1.models.currency"
              title: "Declare the Currency Model"
              description: "Declare the Currency Model as the project defines it, with its fields, including the three-character unique code and the decimal-digit precision, and its eight initial records."
              reason: "Every account and every monetary value in the system is expressed in a currency."
              kind: "code"
              inputs:
                - "The Currency Model definition"
              expected_result: "The Currency Model is declared with its eight fields and its eight initial currency records."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Currency is present with its declared properties, code is limited to three characters and unique, decimal_digits defaults to two, and all eight initial records are declared."
              verify: "A Currency built from the US Dollar record reads back every field as declared, decimal_digits reads two when left unstated, and a Currency whose code has four characters is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted code is a required unique string of size three, decimal_digits is an integer defaulting to two, and symbol is nullable; asserted eight initial records are declared; built a Currency from the US Dollar record and asserted every field reads back as declared; built one without decimal_digits and asserted it reads two; asserted a validation error for a four-character code."
                  outcome: "Passed."

            phase_1.models.trading_platform:
              id: "phase_1.models.trading_platform"
              title: "Declare the Trading Platform Model"
              description: "Declare the Trading Platform Model as the project defines it, with its fields, including the code that identifies the implementation to use, and its two initial records."
              reason: "Brokers and positions identify the trading API standard they operate through by this Model."
              kind: "code"
              inputs:
                - "The Trading Platform Model definition"
              expected_result: "The Trading Platform Model is declared with its five fields and its MetaTrader 5 and Binance initial records."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Trading Platform is present with its declared properties, and both initial records are declared with their codes."
              verify: "A Trading Platform built from the Binance record reads back name and code as declared with status true, and a Trading Platform without a code is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the logical name and that the two initial records carry the codes metatrader_5 and binance; built a Trading Platform from the Binance record and asserted name, code, and status true; asserted a validation error without a code."
                  outcome: "Passed."

            phase_1.models.broker:
              id: "phase_1.models.broker"
              title: "Declare the Broker Model"
              description: "Declare the Broker Model as the project defines it, with its fields, its relationships to User and Trading Platform, its per-user name uniqueness rule, and its FxPro initial record."
              reason: "Accounts and positions are reached through a broker, and a broker is owned by one user on one trading platform."
              kind: "code"
              inputs:
                - "The Broker Model definition"
                - "The declared User Model"
                - "The declared Trading Platform Model"
              expected_result: "The Broker Model is declared with its six fields, both relationships, the composite uniqueness rule, and the FxPro record."
              depends_on:
                - "phase_1.models.user"
                - "phase_1.models.trading_platform"
              constraints:
                - "The Broker name is unique per user, as the composite rule states, and not unique on its own; the exact-name default that would make name unique alone does not apply to this Model."
              acceptance: "Every field the project defines for Broker is present with its declared properties, the relationships to User and Trading Platform are declared through user_id and trading_platform_id, the uniqueness of user_id together with name is declared as a rule, and name alone is not declared unique."
              verify: "A Broker built from the FxPro record reads back every field as declared, its relationships resolve to User and Trading Platform, and a Broker without a user_id is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once User and Trading Platform were declared; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted name is not declared unique on its own and user_id is a required integer; asserted the composite uniqueness rule over user_id and name is declared; asserted the relationships resolve by field to the User and Trading Platform Model classes; built a Broker from the FxPro record and asserted every field reads back as declared; asserted a validation error without user_id."
                  outcome: "Passed."

            phase_1.models.account_group:
              id: "phase_1.models.account_group"
              title: "Declare the Account Group Model"
              description: "Declare the Account Group Model as the project defines it, with its fields and its Default initial record."
              reason: "Every account belongs to a group, so the group must exist before accounts can be organized."
              kind: "code"
              inputs:
                - "The Account Group Model definition"
              expected_result: "The Account Group Model is declared with its four fields and its Default record."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Account Group is present with its declared properties, name is unique, and the Default record is declared."
              verify: "An Account Group built from the Default record reads back name as declared with status true and description absent, and an Account Group without a name is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted name is unique; built an Account Group from the Default record and asserted name, status true, and description absent; asserted a validation error without a name."
                  outcome: "Passed."

            phase_1.models.account:
              id: "phase_1.models.account"
              title: "Declare the Account Model"
              description: "Declare the Account Model as the project defines it, with its fields, its credential password with its encrypted-storage rule, its relationships to Account Group, Broker, and Currency, and its Acc-1 initial record."
              reason: "Trades are executed through a funded account, which must know its group, its broker, its base currency, and its access credentials."
              kind: "code"
              inputs:
                - "The Account Model definition"
                - "The declared Account Group Model"
                - "The declared Broker Model"
                - "The declared Currency Model"
              expected_result: "The Account Model is declared with its twelve fields, password marked as a credential with its encrypted-storage rule, three relationships, and the Acc-1 record with a generated password."
              depends_on:
                - "phase_1.models.account_group"
                - "phase_1.models.broker"
                - "phase_1.models.currency"
              constraints: []
              acceptance: "Every field the project defines for Account is present with its declared properties, balance defaults to zero, password carries its credential nature and encrypted-storage rule, the three relationships are declared through group_id, broker_id, and base_currency_id, and the Acc-1 record is declared with its password marked for generation."
              verify: "An Account built from the Acc-1 record reads back leverage one hundred and account_type CFD with balance zero when unstated, and an Account with a non-integer leverage, or without a base_currency_id, is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once Account Group, Broker, and Currency were declared; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted balance is a decimal defaulting to zero and password is a credential with the encrypted-storage rule declared; asserted the relationships resolve by field to the Account Group, Broker, and Currency Model classes; asserted the Acc-1 record marks password for generation; built an Account from that record with a locally generated password and asserted leverage one hundred, account_type CFD, and balance zero; asserted a validation error for a fractional leverage, a textual leverage, and a missing base_currency_id."
                  outcome: "Passed."

            phase_1.models.asset:
              id: "phase_1.models.asset"
              title: "Declare the Asset Model"
              description: "Declare the Asset Model as the project defines it, with its fields, including the unique symbol, the category, the point size, and the price digits, and its four initial records."
              reason: "An action can only trade an asset the system knows, together with its category and price precision."
              kind: "code"
              inputs:
                - "The Asset Model definition"
              expected_result: "The Asset Model is declared with its eight fields and its four initial asset records."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Asset is present with its declared properties, name and symbol are each unique, point_size and digits carry their zero defaults, and all four initial records are declared."
              verify: "An Asset built from the EURUSD record reads back symbol, category, point_size, and digits as declared, and an Asset without a category, or with a non-numeric point_size, is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted name and symbol are each unique, point_size is a float defaulting to zero, and digits an integer defaulting to zero; asserted four initial records; built an Asset from the EURUSD record and asserted symbol, category, point_size, and digits; asserted a validation error without a category and with a textual point_size."
                  outcome: "Passed."

            phase_1.models.trailing_group:
              id: "phase_1.models.trailing_group"
              title: "Declare the Trailing Group Model"
              description: "Declare the Trailing Group Model as the project defines it, with its fields and its Default initial record."
              reason: "Trailing rules and actions refer to a trailing group, so the group must exist before either can."
              kind: "code"
              inputs:
                - "The Trailing Group Model definition"
              expected_result: "The Trailing Group Model is declared with its four fields and its Default record."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Trailing Group is present with its declared properties, name is unique, and the Default record is declared."
              verify: "A Trailing Group built from the Default record reads back name as declared with status true, and a Trailing Group with a non-boolean status is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Built a Trailing Group from the Default record and asserted name and status true; asserted a validation error for a textual status."
                  outcome: "Passed."

            phase_1.models.trailing_rule:
              id: "phase_1.models.trailing_rule"
              title: "Declare the Trailing Rule Model"
              description: "Declare the Trailing Rule Model as the project defines it, with its fields, including the trigger percentage and the optional take-profit and stop-loss adjustments, and its relationship to Trailing Group. It defines no initial record."
              reason: "A trailing group is only useful through the rules that say when and how Take Profit and Stop Loss are adjusted."
              kind: "code"
              inputs:
                - "The Trailing Rule Model definition"
                - "The declared Trailing Group Model"
              expected_result: "The Trailing Rule Model is declared with its eight fields and its relationship to Trailing Group, and declares no initial data."
              depends_on:
                - "phase_1.models.trailing_group"
              constraints: []
              acceptance: "Every field the project defines for Trailing Rule is present with its declared properties, take_profit_adjustment and stop_loss_adjustment are optional, trigger_percentage is required, the relationship is declared through trailing_group_id, and no initial record is declared."
              verify: "A Trailing Rule built with a name, a trailing_group_id, and a trigger_percentage and no adjustments is accepted, and a Trailing Rule without a trigger_percentage is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once Trailing Group was declared; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted both adjustments are nullable and trigger_percentage is required; asserted the relationship resolves through trailing_group_id to the Trailing Group Model class and that no initial data is declared; built a Trailing Rule with only name, trailing_group_id, and trigger_percentage and asserted both adjustments read absent; asserted a validation error without trigger_percentage."
                  outcome: "Passed."

            phase_1.models.partial_group:
              id: "phase_1.models.partial_group"
              title: "Declare the Partial Group Model"
              description: "Declare the Partial Group Model as the project defines it, with its fields and its Default initial record."
              reason: "Partial rules and actions refer to a partial group, so the group must exist before either can."
              kind: "code"
              inputs:
                - "The Partial Group Model definition"
              expected_result: "The Partial Group Model is declared with its four fields and its Default record."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Partial Group is present with its declared properties, name is unique, and the Default record is declared."
              verify: "A Partial Group built from the Default record reads back name as declared with status true, and a Partial Group without a name is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Built a Partial Group from the Default record and asserted name and status true; asserted a validation error without a name."
                  outcome: "Passed."

            phase_1.models.partial_rule:
              id: "phase_1.models.partial_rule"
              title: "Declare the Partial Rule Model"
              description: "Declare the Partial Rule Model as the project defines it, with its fields, including the profit percentage that activates it and the percentage of the position to close, and its relationship to Partial Group. It defines no initial record."
              reason: "A partial group is only useful through the rules that say when and how much of a position is closed."
              kind: "code"
              inputs:
                - "The Partial Rule Model definition"
                - "The declared Partial Group Model"
              expected_result: "The Partial Rule Model is declared with its seven fields and its relationship to Partial Group, and declares no initial data."
              depends_on:
                - "phase_1.models.partial_group"
              constraints: []
              acceptance: "Every field the project defines for Partial Rule is present with its declared properties, profit_percentage and close_percentage are both required, the relationship is declared through partial_group_id, and no initial record is declared."
              verify: "A Partial Rule built with a name, a partial_group_id, a profit_percentage, and a close_percentage is accepted, and a Partial Rule without a close_percentage is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once Partial Group was declared; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted profit_percentage and close_percentage are required; asserted the relationship resolves through partial_group_id to the Partial Group Model class and that no initial data is declared; built a Partial Rule with name, partial_group_id, profit_percentage, and close_percentage; asserted a validation error without close_percentage."
                  outcome: "Passed."

            phase_1.models.action_group:
              id: "phase_1.models.action_group"
              title: "Declare the Action Group Model"
              description: "Declare the Action Group Model as the project defines it, with its fields and its Default initial record."
              reason: "Actions are organized by risk profile through their group, so the group must exist before actions can."
              kind: "code"
              inputs:
                - "The Action Group Model definition"
              expected_result: "The Action Group Model is declared with its four fields and its Default record."
              depends_on:
                - "phase_1.package.establish"
              constraints: []
              acceptance: "Every field the project defines for Action Group is present with its declared properties, name is unique, and the Default record is declared."
              verify: "An Action Group built from the Default record reads back name as declared with description absent, and an Action Group with a numeric name is refused."
              status: "done"
              log:
                - at: "2026-09-07T14:46:14Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; declaring the Model."
                - at: "2026-09-07T14:48:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Built an Action Group from the Default record and asserted name and description absent; asserted a validation error for a numeric name."
                  outcome: "Passed."

            phase_1.models.action:
              id: "phase_1.models.action"
