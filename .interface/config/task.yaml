        phase_1.composition:
          id: "phase_1.composition"
          title: "Platform composition"
          description: "The Model layer's contribution to the centralized runtime configuration and its declared connections, so that the complete system stays composable after this phase. Its single Task is the composition work this phase owes."
          area: "The Model layer's part of the Platform composition"
          does: "The centralized public runtime configuration carries the Model layer's section, and the Model layer's connections are declared: it consumes no application layer and is provided to future consumers through its import interface."
          constraints: []
          task_count: 1
          tasks:

            phase_1.composition.runtime_configuration:
              id: "phase_1.composition.runtime_configuration"
              title: "Contribute the Model section of the runtime configuration"
              description: "Establish the centralized public runtime configuration with the Model layer's section, and record the Model layer's declared connections."
              reason: "Every phase that delivers a layer also delivers that layer's part of the composition, so the system remains composable after this phase rather than only after the last."
              kind: "configuration"
              inputs:
                - "The runtime configuration conventions"
                - "The Model package identity"
              expected_result: "The public runtime configuration exists with a Model section that satisfies the section contract, and the Model layer's connections are recorded as consuming no layer and providing its import interface."
              depends_on:
                - "phase_1.package.establish"
              constraints:
                - "The Model section carries no settings and no bindings, because nothing in the Model layer is changeable by a user or environment."
              acceptance: "The public runtime configuration contains the Model section, the section satisfies the section contract, and the configuration names no secret value."
              verify: "Reading the public runtime configuration yields a Model section that passes validation against the section contract, and the recorded connections show Model consuming no other layer."
              status: "done"
              log:
                - at: "2026-09-07T14:47:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; establishing the public runtime configuration with the Model section."
                - at: "2026-09-07T14:48:48Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Parsed the public runtime configuration at the project root and asserted it carries a Model section whose keys are exactly settings and bindings, both mappings, with bindings empty so that Model consumes no other layer; scanned the file for credential-like keys and asserted none. The Model layer's connections are also recorded in the package description: it consumes no layer and provides its import interface."
                  outcome: "Passed."
