# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/task.yaml"
  path_note: "Generated Config — the frame that defines a task and the plans that hold the tasks, one plan per project phase keyed by phase id. Created by my-interface-interpreter with the frame and an empty plan per phase according to .interface/schema/task.schema.yaml; filled by my-interface-tasker in planning mode, one phase per invocation"
  schema: ".interface/schema/task.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-03"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "task_schema and task_states are the frame — seeded here by my-interface-interpreter and fixed by the human after that. Planning mode writes the plan of the one project phase named by the invocation. Development and review modes write only the status, blocker, and log fields of a task. my-interface-reset under S9 is the only outside-mode exception, and it changes tasks only as content.task_states.reset_protocol says"
  changed_by: "my-interface-tasker in planning mode; my-interface-developer and my-interface-reviewer for task status, blocker, and log; my-interface-reset under S9; the human for the frame"
  authority: "Who may write which field, and when, is decided in config/state.yaml under content.state_authority and in .interface/root.yaml under content.modes — this file gives shape and invariants, not permission"
  phase_identity: "Each plan's id, title, order, and target are copied from config/definition.yaml under content.phases and are never changed by planning, development, or review; a phase changes in project.md first and reaches here through the interpreter"
  regeneration: "A regeneration by my-interface-interpreter preserves every existing plan and task; it never empties a plan that planning has filled"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_schema"
  - "task_states"
  - "plans"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: "The fields every task carries — the definition of a task, not a task itself"
  task_states: "The vocabulary a task's status may hold, and the protocols around it"
  plans: "One plan per project phase, keyed by phase id — groups inside a phase, tasks inside a group"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Task_Schema -->
  task_schema:
    rule: "Every task carries exactly these fields — no more, no fewer"
    fields:
      id: "Identifier unique within the project phase — its phase prefix keeps it unique across the project"
      title: "The task in one sentence"
      goal: "What becomes possible after this task that was not possible before"
      depends_on: "Ids of tasks in the same project phase. Cross-phase order comes from definition.yaml, and cross-item dependency uses a contract rather than another phase's task id"
      needs_contract: "The contract version required — used instead of depending on another item's task; omitted when the task needs none"
      acceptance: "Human-readable acceptance criterion — what must actually work"
      verify: "A runnable command that proves acceptance, run from the verify_cwd of the item named by the phase target — without it a task is never done"
      touches: "Paths this task touches, written relative to the code_path of the item named by its phase target"
      status: "Where the task stands right now — the one field of a task that moves; its vocabulary is task_states"
      blocker: "Id of the blocker in config/state.yaml — present only when status is blocked, absent otherwise"
      log: "Append-only list of dated entries carried with the task — absent until the task first moves"
    status_lives_here: "Status is written on the task itself, so definition and state can never drift apart"
    history_lives_here_too: "There is no history file — while a task exists, how it reached its state stays in its own append-only log, and a past entry is never rewritten. A reset to planning explicitly removes generated tasks"

  # <!-------------------------------------------- Task_States -->
  task_states:
    path: "The status field on each task"
    states:
      todo: "Defined and not yet started"
      claimed: "An agent has taken it and is working on it — written before work starts"
      blocked: "Cannot proceed; the blocker field names the blocker in config/state.yaml"
      done: "Acceptance proven by a passing verify run"
      cancelled: "Will not be done; the log says why"
      superseded: "Replaced by another task; the log names it"
    derived_ready: "ready is not a stored status — a task is ready when it is todo and every id in its depends_on is done, computed when needed and written nowhere"
    phase_ready: "Phase readiness is derived, never stored — a phase may enter development when it has a non-empty plan and every earlier project phase is complete"
    phase_complete: "Phase completion is derived, never stored — a phase is complete when its plan is non-empty, every task not cancelled or superseded is done, and no task remains todo, claimed, or blocked"
    done_gate: "Without a passing verify run no task becomes done, even if the code is written"
    claim_protocol: "A task is set to claimed and the file written before work starts, so two agents never take the same task"
    status_only_in_development: "In development mode status, blocker, and log are the only fields an agent may change — the rest is the plan. my-interface-reset under S9 is the only outside-mode reset exception"
    reset_protocol: "A reset is project-wide and explicitly invoked. A development reset sets every generated task's status to todo, removes every blocker field, keeps every prior log entry, and appends one dated reset entry to each task; it is refused while any task is claimed. A planning reset replaces groups with an empty mapping in every phase plan, removing every generated group and task while preserving each plan shell's id, title, order, target, and does. Either reset stage clears every current State blocker and open question without answering it; later work raises again anything still unresolved"

  # <!-------------------------------------------- Plans -->
  plans:

    P1:
      id: "P1"
      title: "Database"
      order: 1
      target: "database"
      does: "Creates the database schema and migrations for all defined project models — the thirteen tables of database contract v1 realized by an ordered, reversible Alembic history, with the declared initial records seeded"
      groups: {}

    P2:
      id: "P2"
      title: "Backend API"
      order: 2
      target: "backend"
      does: "Creates and runs the API for all defined project models — the implemented HTTP API with its generated OpenAPI description, built against the frozen database contract"
      groups: {}
