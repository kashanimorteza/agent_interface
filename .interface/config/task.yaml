              - .interface/config/backend.yaml — layers.api.api_documentation (OpenAPI at /openapi.json)
              - backend/README.md — resource paths and operations (P2 output)
              expected_output: package.json script generate:api, scripts/generate-api.mjs, and the committed src/lib/api/schema.d.ts.
            depends_on:
