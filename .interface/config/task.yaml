          title: Registry and metadata interface
          description: 'Completes the documented public interface of the package beyond the Model classes: the ordered registry that names every Model and the accessor that exposes each Model''s resolved definition.
            The Tasks are related because both make the Model set discoverable and readable by Database and Backend without parsing the Interface.'
