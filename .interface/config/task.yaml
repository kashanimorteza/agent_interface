              id: "P1-G8"
              title: "Run the API"
              does: "Mounts the surface behind the API key and proves the running server answers as the contract says; when done, the phase goal — the API created and running for all models — is met."
              task_count: 5
              tasks:
                - id: "T77"
                  title: "Mount the aggregate router in app/main.py behind the verify_api_key dependency."
                  goal: "Every contract route is served and guarded by the API key."
                  depends_on: ["T12", "T76"]
                  needs_contract: "v1"
                  acceptance: "app.include_router(router, dependencies=[Depends(verify_api_key)]) is applied; the app exposes all 65 contract routes plus /docs."
                  verify: "uv run python -c \"from app.main import app; n = sum(len(r.methods) for r in app.routes if getattr(r, 'methods', None) and not r.path.startswith(('/docs', '/openapi')) and r.path != '/'); assert n == 65, n\""
                  touches: ["app/main.py"]
                  status: "blocked"
                  blocker: "B1"
                  log:
                    - "2026-09-02 — claimed by my-interface-developer"
                    - "2026-09-02 — verify failed (AssertionError: 0) — blocked by B1 — my-interface-developer"
                - id: "T78"
                  title: "Prove the server starts with the run command and serves /docs."
                  goal: "The API runs."
                  depends_on: ["T77", "T3"]
                  acceptance: "`uv run uvicorn app.main:app --reload` starts; GET /docs answers 200."
                  verify: "(uv run uvicorn app.main:app --port 8765 >/dev/null 2>&1 & echo $! > .uvicorn.pid); sleep 3; code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/docs); kill $(cat .uvicorn.pid); rm -f .uvicorn.pid; test \"$code\" = \"200\""
                  touches: ["app/main.py"]
