                title: "Create the position router in app/routes/position.py with the five /positions routes"
                goal: "The contract's /positions surface is served: list, create, read, replace, delete."
                depends_on: ["T59", "T58"]
                acceptance: "app/routes/position.py defines router = APIRouter(prefix='/positions', tags=['positions']) with GET '' -> list[PositionRead] 200; POST '' body PositionCreate -> PositionRead 201; GET '/{id}' -> PositionRead 200 or 404; PUT '/{id}' body PositionCreate -> PositionRead 200 or 404; DELETE '/{id}' -> 204 no body or 404. Each route only validates, calls the service through a get_db session, and raises HTTPException 404 with detail 'Position not found' when the service returns None or False."
                verify: |-
                  uv run python -c "from fastapi import FastAPI; from fastapi.testclient import TestClient; from app.database import SessionLocal; from app.routes.position import router; db = SessionLocal(); ids={}; a = FastAPI(); a.include_router(router); c = TestClient(a); body = {'name': 'x', 'entry_price': 1.0, 'take_profit': 1.0, 'stop_loss': 1.0, 'status': 'x', 'description': None}; r = c.post('/positions', json=body); assert r.status_code == 201, r.text; i = r.json()['id']; assert c.get('/positions').status_code == 200; assert c.get(f'/positions/{i}').json()['id'] == i; assert c.put(f'/positions/{i}', json={**body, 'name': 'y'}).json()['name'] == 'y'; assert c.delete(f'/positions/{i}').status_code == 204; assert c.get(f'/positions/{i}').status_code == 404; assert c.put(f'/positions/{i}', json=body).status_code == 404; assert c.delete(f'/positions/{i}').status_code == 404; assert c.post('/positions', json={}).status_code == 422; db.close(); print('ok')"
                touches: ["app/routes/position.py"]
                status: "todo"

              - id: "T73"
                title: "Aggregate the 13 routers into one router in app/routes/__init__.py"
                goal: "main.py can mount the whole surface, and gate it, with one include."
                depends_on: ["T60", "T61", "T62", "T63", "T64", "T65", "T66", "T67", "T68", "T69", "T70", "T71", "T72"]
                acceptance: "app/routes/__init__.py defines router = APIRouter() and includes the router of each of the 13 modules."
                verify: |-
                  uv run python -c "from fastapi import FastAPI; from app.routes import router; a = FastAPI(); a.include_router(router); n = sum(len(ops) for ops in a.openapi()['paths'].values()); assert n == 65, n; print('ok')"
                touches: ["app/routes/__init__.py"]
                status: "todo"

              - id: "T74"
                title: "Mount the aggregate router in app/main.py"
                goal: "Every contract route is served by the app, open to every caller."
                depends_on: ["T73", "T10"]
                acceptance: "app/main.py calls app.include_router(router) with no dependency; the OpenAPI document lists 65 operations over 26 paths, and no operation declares a query parameter."
                verify: |-
                  uv run python -c "from app.main import app; spec = app.openapi(); paths = spec['paths']; n = sum(len(ops) for ops in paths.values()); assert len(paths) == 26 and n == 65, (len(paths), n); extra = [(p, m) for p, ops in paths.items() for m, op in ops.items() if any(x.get('in') == 'query' for x in op.get('parameters', []))]; assert not extra, extra; print('ok')"
                touches: ["app/main.py"]
                status: "todo"


            - id: "P1-G8"
              title: "Run"
              does: "Prove the phase goal against the mounted application and a live server: a chain of referenced models works end to end, the documentation matches the contract, and the server answers over the network. When done, the API for all defined project models is created and running."
              task_count: 3
              tasks:
              - id: "T75"
                title: "Prove a create-read-replace-delete chain through the mounted app across referenced models"
                goal: "The contract works end to end over HTTP, including references between models."
                depends_on: ["T74"]
                acceptance: "Create a trading platform, a broker under it, an account under the broker, an asset, a strategy, an action group, and an action referencing them all; read the action back; replace its name; delete everything in reverse order; each delete answers 204 and a read after it answers 404."
                verify: |-
                  uv run python -c "from fastapi.testclient import TestClient; from app.main import app; c = TestClient(app); K = ''
                  def mk(p, b):
                      r = c.post(p + K, json=b); assert r.status_code == 201, (p, r.text); return r.json()['id']
                  tp = mk('/trading-platforms', {'name': 'mt5', 'status': 'active', 'description': None}); br = mk('/brokers', {'name': 'b', 'trading_platform_id': tp, 'status': 'active', 'description': None}); ac = mk('/accounts', {'name': 'a', 'username': 'u', 'password': 'p', 'broker_id': br, 'status': 'active', 'description': None}); asst = mk('/assets', {'name': 'EURUSD', 'status': 'active', 'description': None}); st = mk('/strategies', {'name': 's', 'risk_parameter': 1.0, 'status': 'active', 'description': None}); ag = mk('/action-groups', {'name': 'g', 'status': 'active', 'description': None}); act = mk('/actions', {'name': 'act', 'asset_id': asst, 'account_id': ac, 'strategy_id': st, 'group_id': ag, 'status': 'active', 'description': None}); assert c.get(f'/actions/{act}' + K).json()['asset_id'] == asst; assert c.put(f'/actions/{act}' + K, json={'name': 'act2', 'asset_id': asst, 'account_id': ac, 'strategy_id': st, 'group_id': ag, 'status': 'active', 'description': None}).json()['name'] == 'act2'
                  for p, i in [('/actions', act), ('/action-groups', ag), ('/strategies', st), ('/assets', asst), ('/accounts', ac), ('/brokers', br), ('/trading-platforms', tp)]: assert c.delete(f'{p}/{i}' + K).status_code == 204, p; assert c.get(f'{p}/{i}' + K).status_code == 404, p
                  print('ok')"
                touches: ["app/main.py"]
                status: "todo"

              - id: "T76"
                title: "Prove the documentation surface matches the contract"
                goal: "Docs is served, ReDoc is not, and the OpenAPI document describes exactly the contract's 26 paths."
                depends_on: ["T74"]
                acceptance: "GET /docs answers 200, GET /redoc answers 404, GET /openapi.json answers 200 and lists exactly the 26 contract paths."
                verify: |-
                  uv run python -c "from fastapi.testclient import TestClient; from app.main import app; c = TestClient(app); assert c.get('/docs').status_code == 200; assert c.get('/redoc').status_code == 404; r = c.get('/openapi.json'); assert r.status_code == 200; paths = set(r.json()['paths']); want = {'/accounts', '/accounts/{id}', '/action-groups', '/action-groups/{id}', '/actions', '/actions/{id}', '/assets', '/assets/{id}', '/brokers', '/brokers/{id}', '/executes', '/executes/{id}', '/partial-groups', '/partial-groups/{id}', '/partial-rules', '/partial-rules/{id}', '/positions', '/positions/{id}', '/strategies', '/strategies/{id}', '/trading-platforms', '/trading-platforms/{id}', '/trailing-groups', '/trailing-groups/{id}', '/trailing-rules', '/trailing-rules/{id}'}; assert paths == want, paths ^ want; print('ok')"
                touches: ["app/main.py"]
                status: "todo"

              - id: "T77"
                title: "Start the real server and answer a request over the network"
                goal: "The phase goal — the API runs — is proven against a live uvicorn process, not only the test client."
                depends_on: ["T75", "T76"]
                acceptance: "uvicorn serves app.main:app on 127.0.0.1:8765; GET /docs answers 200 and GET /assets answers 200 with a JSON list; the server is stopped afterwards."
                verify: |-
                  uv run python -c "import threading, time, uvicorn, httpx; from app.main import app; s = uvicorn.Server(uvicorn.Config(app, host='127.0.0.1', port=8765, log_level='error')); t = threading.Thread(target=s.run, daemon=True); t.start(); time.sleep(2); b = 'http://127.0.0.1:8765'; a = httpx.get(b + '/docs').status_code; k = httpx.get(b + '/assets'); s.should_exit = True; t.join(5); assert a == 200 and k.status_code == 200 and isinstance(k.json(), list), (a, k.status_code); print('ok')"
                touches: ["app/main.py"]
                status: "todo"
