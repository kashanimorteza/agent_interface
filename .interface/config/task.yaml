          - id: P1-G3-T2
            title: Provide the model_metadata accessor
            description: Expose model_metadata from the my_model package root so that, given any shared Model class or instance, it returns that Model's resolved logical definition — key, purpose, the fields
              in declared order with their type, size, nullable, default, auto_increment, primary_key, unique, credential, and purpose, the relationships, the rules, and the initial data — with the same content
              as the generated Model configuration.
            reason: model.yaml names model_metadata as the metadata export so Database and Backend derive their own representations from the package instead of parsing model.yaml at run time; database.yaml
              relies on it for fields, relationships, rules, credential markers, and initial data.
            target: model
            area: the model_metadata accessor of my_model
            metadata:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
            inputs:
            - P1-G3-T1 — the MODELS registry
            - The resolved definitions of the fourteen Models carried by their classes
            references:
            - .interface/config/model.yaml — content.implementation.public_interface.exports.metadata
            - .interface/config/model.yaml — content.models
            - .interface/config/database.yaml — content.layers.data_logic (model_metadata supplies fields, relationships, rules, credential markers, and initial data)
            expected_result: For every Model in MODELS, model_metadata(class) and model_metadata(instance) expose the recorded definition with equal content, addressable by the recorded names; a property the
              configuration does not record is absent or unset rather than invented, and a generate instruction in initial data remains an instruction.
            depends_on:
            - P1-G3-T1
            constraints:
            - Consumers import only from the my_model package root; no internal module is part of the public interface.
            - The package accepts no runtime configuration and reads no Interface file at run time; only verify commands read .interface/config/model.yaml.
            - The isolated environment and build artifacts are never committed.
            - The returned definition is a stable structure whose parts are addressable by the recorded names (key, purpose, fields, relationships, rules, initial_data, and the field properties); its concrete
              container type is Development's choice.
            - The Model package never generates a value for a generate instruction; fulfilling it belongs to Database at seed time.
            acceptance: The verify run compares the definition returned for every Model class and for an instance of it against content.models of model.yaml and finds equal content in every recorded property.
            verify: |
              uv run --with pyyaml python -c '
              import yaml, datetime, decimal
              from collections.abc import Mapping
              from my_model import MODELS, model_metadata
              EXP = yaml.safe_load(open("../.interface/config/model.yaml"))["content"]["models"]
              def get(o, k):
                  return o.get(k) if isinstance(o, Mapping) else getattr(o, k, None)
              def plain(v):
                  return v if v is None or isinstance(v, (str, int, float, bool)) else getattr(v, "value", v)
              def named(items):
                  return dict(items) if isinstance(items, Mapping) else {get(i, "name"): i for i in (items or [])}
              LITERALS = (str, int, float, bool, decimal.Decimal)
              sample = {"integer": 1, "string": "x", "boolean": True, "decimal": decimal.Decimal("1.5"), "float": 1.5, "datetime": datetime.datetime(2026, 1, 1)}
              def check(m, key):
                  e = EXP[key]
                  assert get(m, "key") == key, (key, get(m, "key"))
                  assert get(m, "purpose") == e["purpose"], (key, "purpose")
                  fm = named(get(m, "fields"))
                  assert list(fm) == list(e["fields"]), (key, "field order", list(fm))
                  for n, ef in e["fields"].items():
                      f = fm[n]
                      assert plain(get(f, "type")) == ef["type"], (key, n, "type", plain(get(f, "type")))
                      assert bool(get(f, "nullable")) == ef["nullable"], (key, n, "nullable")
                      assert get(f, "size") == ef.get("size"), (key, n, "size")
                      assert get(f, "purpose") == ef.get("purpose"), (key, n, "purpose")
                      for flag in ("auto_increment", "primary_key", "unique", "credential"):
                          assert bool(get(f, flag)) == bool(ef.get(flag)), (key, n, flag)
                      d = get(f, "default")
                      if "default" in ef:
                          assert d == ef["default"], (key, n, "default", d)
                      else:
                          assert not isinstance(d, LITERALS), (key, n, "default not recorded but present", d)
                  rm = named(get(m, "relationships"))
                  assert list(rm) == list(e.get("relationships") or {}), (key, "relationships", list(rm))
                  for n, er in (e.get("relationships") or {}).items():
                      for p in ("type", "target", "field", "role"):
                          assert plain(get(rm[n], p)) == er.get(p), (key, n, p)
                  rules = list(get(m, "rules") or []); erules = e.get("rules") or []
                  assert len(rules) == len(erules), (key, "rules", len(rules))
                  for r, er in zip(rules, erules):
                      for p in ("rule", "kind", "field", "storage"):
                          assert plain(get(r, p)) == er.get(p), (key, "rule", p)
                      fs = get(r, "fields")
                      assert (list(fs) if fs else None) == er.get("fields"), (key, "rule fields")
                  data = list(get(m, "initial_data") or []); edata = e.get("initial_data") or []
                  assert len(data) == len(edata), (key, "initial_data", len(data))
                  for rec, erec in zip(data, edata):
                      assert isinstance(rec, Mapping), (key, "initial record must be a mapping of field values")
                      assert list(rec) == list(erec), (key, "record keys", list(rec))
                      for k, ev in erec.items():
                          gv = rec[k]
                          if isinstance(ev, Mapping) and "generate" in ev:
                              assert gv == ev or get(gv, "generate") == ev["generate"] or get(gv, "instruction") == ev["generate"], (key, k, "generate instruction", gv)
                          else:
                              assert gv == ev, (key, k, gv, ev)
              for key, cls in MODELS.items():
                  check(model_metadata(cls), key)
                  e = EXP[key]["fields"]
                  kw = {n: sample[f["type"]] for n, f in e.items() if not f["nullable"] and "default" not in f and not f.get("auto_increment") and not f.get("credential")}
                  check(model_metadata(cls(**kw)), key)
              print("ok: " + str(len(MODELS)) + " Models")
              '
            status: todo
        P1-G4:
          id: P1-G4
          title: Documentation and distribution
          description: 'Makes the finished package usable by its consumers: documents it as the package standard requires and proves it installs as the local dependency the Database and Backend phases rely
            on. The Tasks are related because both concern handing the package to other layers rather than its domain content.'
          target: model
          area: package documentation and local-dependency distribution of my_model
          does: A README covering the required sections with runnable examples, and a lock-checked, buildable project that a separate environment installs as an editable path dependency.
          task_count: 2
          tasks:
          - id: P1-G4-T1
            title: Document the my_model package
            description: Provide the package README that the package standard requires at the package root, covering purpose and boundaries, the public interface (the fourteen Model classes, MODELS, model_metadata,
              the validation behaviour, and the convention that the primary key and credential values may be absent on an instance), dependencies, configuration (none), installation and startup including how
              a consumer installs the package as an editable local path dependency, and runnable usage examples.
            reason: The Development Principles require every package to carry a README that lets a consumer use it without inspecting its implementation; development.yaml records the required sections for my_model.
            target: model
            area: package documentation (model/README.md)
            metadata:
              kind: documentation
              language: Markdown
              technologies:
              - Markdown
            inputs:
            - P1-G3-T2 — the complete public interface
            references:
            - .interface/config/development.yaml — content.packages.my_model.readme and content.package_standard.documentation
            - .interface/config/model.yaml — content.implementation (code_path, verify_cwd, package, tech, public_interface, boundaries)
            expected_result: model/README.md with the six required sections, consistent with the implemented interface, whose usage examples execute successfully.
            depends_on:
            - P1-G3-T2
            constraints:
            - Document configuration names and non-secret examples only; never record credentials or generated values.
            - Usage examples are Python code blocks that run against the installed package.
            acceptance: The README contains a heading for each required section and every Python usage example executes without error.
            verify: |
              for k in purpose interface dependenc configuration installation usage; do grep -qiE "^#{1,6} .*$k" README.md || { echo "missing section: $k"; exit 1; }; done && uv run python -c '
              import re, pathlib
              blocks = re.findall(r"```python\n(.*?)```", pathlib.Path("README.md").read_text(), re.S)
              assert blocks, "no Python usage example"
              for b in blocks:
                  exec(compile(b, "README.md", "exec"), {})
              print("ok: " + str(len(blocks)) + " example(s) ran")
              '
            status: todo
          - id: P1-G4-T2
            title: Prove the package installs as a local dependency
            description: 'Prove that the my_model project is distributable in the resolved form: its lock is current, its build backend produces a wheel and a source distribution, and a separate environment
              that installs the project as an editable path dependency imports my_model and sees the fourteen registered Models — the mechanism the Database and Backend phases will use.'
            reason: development.yaml records my_model as an internal package installed by my_database and my_backend as an editable local path dependency; a working build and a current lock are prerequisites
              for those installs and for reproducing the package from a fresh checkout.
            target: model
            area: local-dependency distribution of my_model
            metadata:
              kind: command execution
              language: null
              technologies:
              - uv 0.12.10
              - Python 3.14.7
            inputs:
            - P1-G4-T1 — the documented package
            - P1-G3-T1 — the MODELS registry
            references:
            - .interface/config/development.yaml — content.package_standard.distribution.local_dependency and content.packages.my_model.distribution
            - .interface/config/model.yaml — content.implementation (code_path, verify_cwd, package, tech, public_interface, boundaries)
            expected_result: A current lock, a wheel and a source distribution of my-model, and a successful editable-path import of my_model with fourteen registered Models from an isolated environment.
            depends_on:
            - P1-G4-T1
            - P1-G3-T1
            constraints:
            - Consumers import only from the my_model package root; no internal module is part of the public interface.
            - The package accepts no runtime configuration and reads no Interface file at run time; only verify commands read .interface/config/model.yaml.
            - The isolated environment and build artifacts are never committed.
            acceptance: uv lock --check passes, uv build produces the wheel and source distribution, and an isolated environment installing the project as an editable path dependency imports my_model with fourteen
              Models.
            verify: uv lock --check && rm -rf dist && uv build && ls dist/my_model-*.whl dist/my_model-*.tar.gz && uv run --isolated --no-project --python 3.14.7 --with-editable . python -c 'import my_model;
              assert len(my_model.MODELS) == 14, len(my_model.MODELS); print("ok")'
