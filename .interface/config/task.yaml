meta:
  path: .interface/config/task.yaml
  path_note: Config layer of the Agent Project Interface — the task frame and the plans; the frame is written here by my-interface-interpreter, the plans are filled by my-interface-tasker
  standard: Agent Project Interface
  version: '1.0'
  updated: '2026-09-02'
policy:
  agent_may_edit: true
  rule: Who may write what is decided by the State contract (config/state.yaml under content.state_authority) and by content.modes in root.yaml — planning writes an item's phase_titles, its lifecycle and derived_from while that lifecycle is empty or derived, and the phases of that item's plan; development and review write only the status, blocker, and log of a task
  frame: task_schema and task_states are the frame — no mode edits them
  changed_by: my-interface-interpreter on regeneration (frame and empty plans only, carrying any existing phase_titles and lifecycle through untouched); my-interface-tasker in planning mode; my-interface-developer and my-interface-reviewer for status, blocker, and log
  phase_source: Every phase id, title, order, target, and goal comes from .interface/config/definition.yaml under content.phases — planning never invents a phase
read_order:
- task_schema — what a task is, before any task is read
- task_states — the vocabulary of status, before any status is read
- plans — the plans themselves, read last
content_map:
  task_schema: The fields every task carries — the definition of a task, not a task itself
  task_states: The vocabulary a task's status may hold, and the protocols around it
  plans: One plan per indexed item — project phases at the top, groups inside a phase, tasks inside a group
content:
  task_schema:
    rule: Every task carries exactly these fields — no more, no fewer.
    fields:
      id: Identifier unique within the item — each item numbers its own tasks.
      title: The task in one sentence.
      goal: What becomes possible after this task that was not possible before.
      depends_on: Ids of tasks in the same item — depending on another item is forbidden.
      needs_contract: The contract version the task requires — used instead of depending on another item's task, and omitted when the task needs none.
      acceptance: Human-readable acceptance criterion — what must actually work.
      verify: A runnable command that proves acceptance — without it a task is never done.
      touches: The paths this task touches, written relative to the item's code_path.
      status: Where the task stands right now — the one field of a task that moves; its vocabulary is task_states.
      blocker: Id of the blocker in state.yaml — present only when status is blocked, absent otherwise.
      log: Append-only list of dated entries carried with the task — absent until the task first moves.
    status_lives_here: Status is written on the task itself, so a task's definition and its state can never drift apart.
    history_lives_here_too: There is no history file — how a task reached its state is in its own log, and a past entry is never rewritten.
  task_states:
    path: The status field on each task.
    states:
      todo: Defined and waiting — nobody has started it.
      claimed: An agent has taken it and is working on it now.
      blocked: It cannot move — its blocker field names the blocker in state.yaml.
      done: Its verify command ran and passed.
      cancelled: The human withdrew it — it will not be done.
      superseded: Replaced by a newer task — its log names the replacement.
    derived_ready: ready is not a stored status — a task is ready when its status is todo and every id in its depends_on is done, computed at the moment it is needed.
    done_gate: Without a passing verify run no task becomes done, however complete the code looks.
    claim_protocol: A task is set to claimed and the file written before any work starts, so two agents never take the same task.
    status_only_in_development: In development mode status, blocker, and log are the only fields an agent may change — everything else is the plan.
  plans:
    backend:
      phase_titles_lifecycle: derived
      phase_titles_derived_from: .interface/config/definition.yaml — content.phases
      phase_titles:
        P1: Backend API
      phases:
        phase_1:
          id: P1
          title: Backend API
          does: Creates and runs the API for all thirteen models the project defines — the whole of contract v1's surface, served over the migrated SQLite database.
          groups:
            environment_and_scaffold:
              id: P1-G1
              title: Environment and application scaffold
              does: Creates the uv project, installs the four configured packages one at a time, and stands up the application package — configuration, database session, the FastAPI entry point with Docs on and ReDoc off, and the API-key check. When every task here is done an empty application runs.
              task_count: 10
              tasks:
              - id: T1
                title: Initialize the backend project with uv
                goal: A uv-managed project exists, so every later install and command runs inside its virtual environment.
                depends_on: []
                acceptance: pyproject.toml exists in code_path and uv runs commands inside the project's own environment.
                verify: uv run python --version
                touches:
                - pyproject.toml
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed and starting implementation'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T1 done'
              - id: T2
                title: Install FastAPI
                goal: FastAPI is importable — the API framework contract v1 is served over.
                depends_on:
                - T1
                acceptance: FastAPI is a dependency in pyproject.toml, installed through uv.
                verify: uv run python -c "import fastapi"
                touches:
                - pyproject.toml
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed and starting implementation'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T2 done'
              - id: T3
                title: Install Uvicorn
                goal: Uvicorn is importable — the server named by tech.run.
                depends_on:
                - T1
                acceptance: Uvicorn is a dependency in pyproject.toml, installed through uv.
                verify: uv run python -c "import uvicorn"
                touches:
                - pyproject.toml
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T3 done'
              - id: T4
                title: Install SQLAlchemy
                goal: SQLAlchemy is importable — the only permitted route to the data.
                depends_on:
                - T1
                acceptance: SQLAlchemy is a dependency in pyproject.toml, installed through uv.
                verify: uv run python -c "import sqlalchemy"
                touches:
                - pyproject.toml
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T4 done'
              - id: T5
                title: Install Alembic
                goal: Alembic is importable — the only way the database schema may change.
                depends_on:
                - T1
                acceptance: Alembic is a dependency in pyproject.toml, installed through uv.
                verify: uv run python -c "import alembic"
                touches:
                - pyproject.toml
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T5 done'
              - id: T6
                title: Create the app package
                goal: The importable package every backend module lives under exists.
                depends_on:
                - T1
                acceptance: app/__init__.py exists and the package imports.
                verify: uv run python -c "import app"
                touches:
                - app/__init__.py
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T6 done'
              - id: T7
                title: Create the configuration module
                goal: The database location and the API-key setting have one home, read from the environment so no credential is committed.
                depends_on:
                - T6
                acceptance: app/config.py exposes the SQLite file location inside code_path and the API-key setting, reading both from the environment.
                verify: uv run python -c "from app import config"
                touches:
                - app/config.py
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T7 done'
              - id: T8
                title: Create the database module
                goal: One module makes the engine, the session and the declarative base — the only place a connection is opened.
                depends_on:
                - T4
                - T7
                acceptance: app/database.py builds the SQLAlchemy engine from config and exposes the session and the declarative base the models will use.
                verify: uv run python -c "from app import database"
                touches:
                - app/database.py
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T8 done'
              - id: T9
                title: Create the FastAPI entry point with Docs on and ReDoc off
                goal: A runnable application exists that serves Swagger UI and no ReDoc, ready for routers to register into.
                depends_on:
                - T2
                - T7
                acceptance: app/main.py creates the FastAPI app with docs at /docs and redoc disabled, and the configured run command starts it.
                verify: uv run python -c "from app.main import app; assert app.docs_url == '/docs' and app.redoc_url is None"
                touches:
                - app/main.py
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T9 done'
              - id: T10
                title: Add the API-key check to the application
                goal: Every route a router registers can require the API key, which is the project's only access control.
                depends_on:
                - T9
                acceptance: A request without a valid API key is rejected, and the key is read from configuration rather than the repository.
                verify: uv run python -c "from app.main import app; assert app.openapi().get('components',{}).get('securitySchemes')"
                touches:
                - app/main.py
                - app/config.py
                status: done
                log:
                - date: '2026-09-02'
                  entry: 'my-interface-developer: claimed'
                - date: '2026-09-02'
                  entry: 'my-interface-developer: verify passed, T10 done'
            migration_environment:
              id: P1-G2
              title: Migration environment
              does: Wires Alembic to the declarative metadata and the configured SQLite file, so the schema can only ever move by migration. When this is done migrations can be generated and applied.
              task_count: 1
              tasks:
              - id: T11
                title: Initialize the Alembic migration environment
