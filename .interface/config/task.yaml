# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/task.yaml
  path_note: 'Generated configuration of the Task Component — the resolved Task frame, the Task-state vocabulary, and one Plan per project phase. Shape: schema/task.yaml; rules: principles/task.md; the Task Preferences layer is empty'
  standard: Agent Project Interface
  schema_version: '5.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: The configuring operation materializes task_schema, task_states, the task_count totals (zero until Tasks exist), and one Plan shell per phase with empty groups; it never creates a Group or Task. Every operation that adds or removes Tasks recalculates the Group, Plan, and total task_count values. The planning operation fills the groups of the one phase it was invoked for. The development operation changes only the status, blocker, and log of a Task it has claimed. Reset acts as its own fixed script defines
  changed_by: The planning operation (Plan groups), the development operation (Task status, blocker, log), the reset operation, and the configuring operation (frame and empty shells only)
  preservation: On re-configuring, an existing Plan whose groups are non-empty is preserved when its source phase is unchanged. Removing or changing a phase whose Plan holds Tasks is a critical conflict, reported and never applied silently


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- task_schema
- task_states
- task_count
- plans


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: The resolved field frame every Task carries
  task_states: The Task-status vocabulary and the derived readiness and completion conditions
  task_count: The total number of Tasks stored across all Plans, recalculated whenever Tasks are added or removed
  plans: One Plan per project phase, keyed by phase id from definition.yaml


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- task_schema -->
  task_schema:
    rule: Every Task carries exactly these fields — no more, no fewer. blocker and log are structurally part of the frame but are absent until they first apply.
    fields:
      id: Identifier in the form <phase>-G<group>-T<n>, unique within its Plan and unambiguous across all Plans.
      title: A concise statement of the one atomic action.
      description: A complete explanation of what must be done.
      reason: Why the Task is necessary.
      target: The Component in which the Task performs its work — the phase target from definition.yaml.
      area: The specific module, subsystem, or work area inside the target Component, such as one of its resolved layers.
      execution_context:
        kind: The nature of the work — code, configuration, documentation, data, or command execution.
        language: The applicable programming or configuration language, or null when none applies.
        technologies: The ordered technologies, frameworks, packages, protocols, or tools relevant to the Task, resolved from the target Component's configuration; empty when none apply.
        instructions: Implementation guidance sufficient to perform this specific Task.
        inputs: The information, artifacts, interfaces, or completed results the Task consumes; empty when none apply.
        expected_output: The concrete artifact or observable result the Task must produce.
      depends_on: The identifiers of Tasks whose completed outputs are prerequisites; empty when the Task is independent.
      constraints: Task-specific restrictions and invariants the implementation must preserve; empty when none apply.
      acceptance: The observable criterion that determines whether the intended result is correct.
      verify: A runnable command or precise executable check, run from the target Component's verify_cwd, that proves acceptance.
      touches: The explicit files, directories, or resources the Task inspects or modifies, relative to the target Component's code_path.
      status: The current Task state, using the task_states vocabulary.
      blocker: The identifier of the critical Blocker in state.yaml when the Task is blocked; absent otherwise.
      log: The append-only Task-local progress history of dated entries; absent until the first recorded transition.
    status_lives_here: The current status is stored on each Task, so Plans and State never drift apart.
    history_lives_here_too: There is no separate history file. While a Task exists, how it reached its state is recorded in its own append-only log.

  # <!-------------------------------------------- task_states -->
  task_states:
    path: The status field on each Task.
    states:
      todo: Defined and not yet started.
      claimed: An executor has taken the Task and written the claim before starting work.
      blocked: Work cannot safely continue; the Task's blocker field names the Blocker in state.yaml.
      done: Acceptance is proven by a passing verify run.
      cancelled: The Task will not be done and no other Task replaces it.
      superseded: Another Task replaced this one; the log names the replacement.
    derived_ready: A Task is ready when its phase is ready, its status is todo, and every Task in its depends_on is done. Ready is computed when needed and never stored.
    phase_ready: A phase is ready for development when its Plan has at least one Group with at least one Task and every earlier phase is complete. Readiness is derived, never stored.
    phase_complete: A phase is complete when its Plan is non-empty, every Task not cancelled or superseded is done, and no Task remains todo, claimed, or blocked. Completion is derived, never stored.

  # <!-------------------------------------------- task_count -->
  task_count: 21

  # <!-------------------------------------------- plans -->
  plans:
    P1:
      id: P1
      title: Database
      order: 1
      target: database
      does: Implement the database, apply the defined model structure, and insert the defined initial data.
      task_count: 21
      groups:
        P1-G1:
          id: P1-G1
          title: Package foundation
          description: 'Everything the Database implementation stands on: the uv-managed package with exactly pinned dependencies,
            the ignore and configuration templates, the runtime settings resolution, and the error types shared by all three
            layers.'
          target: database
          area: package foundation — code_path root and src/my_database/ top-level modules
          does: database/ is an installable, reproducible Python package whose settings resolve DATABASE_URL and CREDENTIAL_ENCRYPTION_KEY
            from runtime configuration and whose error types are ready for the Storage Adapter, Data Logic, and Database Interface.
          task_count: 4
          tasks:
          - id: P1-G1-T1
            title: Initialize the uv-managed Database package
            description: 'Create database/ as a uv project with a src-layout import package named my_database (development.yaml
              package my_database; its three nested packages database_interface, data_logic, and storage_adapter are created
              by later Tasks): pyproject.toml declaring project name my-database, version 0.1.0, requires-python ">=3.14", exactly
              pinned dependencies SQLAlchemy==2.0.52, alembic==1.19.2 and cryptography==50.0.1, and the uv_build build backend
              that `uv init --package` generates, plus [tool.uv.build-backend] module-name = "my_database" because the import
              package name differs from the distribution name; a .python-version file containing 3.14; src/my_database/__init__.py
              holding only a module docstring and __version__ = "0.1.0"; and a generated uv.lock. Remove any sample entry point
              or main() that uv init adds.'
            reason: Every later Task runs inside this environment, and Backend installs this directory as a local path dependency,
              so the Database must be a buildable package with reproducible, exactly pinned dependencies.
            target: database
            area: package foundation — code_path root
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - SQLAlchemy 2.0.52
              - Alembic 1.19.2
              - SQLite (runtime-provided by the Python sqlite3 module)
              - cryptography 50.0.1
              instructions: From the project root run `mkdir -p database && cd database && uv init --package --name my-database
                --python 3.14 .` (or author the same files by hand), rename the generated import package directory to src/my_database
                and strip it to a docstring plus __version__, then run `uv add "SQLAlchemy==2.0.52" "alembic==1.19.2" "cryptography==50.0.1"`
                followed by `uv lock` and `uv sync`. Without the module-name setting uv_build looks for src/trading_assistant_database/
                and the build fails. Set the project description to "Database Component of Trading Assistant — generic Database
                Interface over SQLite via SQLAlchemy and Alembic". cryptography is the Planning-selected package for the reversible
                encryption mode of credential columns; the one-way hash mode uses the standard library. Do not add any other
                dependency.
              inputs:
              - .interface/config/database.yaml — code_path, verify_cwd, layers.storage_adapter.tech (engine, ORM, migration
                versions)
              - .interface/config/development.yaml — platform.environment.operating_system (Python 3.14.7 with uv 0.12.10) and
                connections.backend_to_database (Backend installs this package as a local path dependency)
              expected_output: database/pyproject.toml, database/uv.lock, database/.python-version, database/src/my_database/__init__.py,
                and an untracked database/.venv with the pinned packages installed.
            depends_on: []
            constraints:
            - No secret value, generated credential, or encryption key is written into any committed file, Interface file, or
              Task log.
            - Versions are pinned exactly as listed; the token latest never appears.
            - The import package is my_database under src/; the distribution name is my-database.
            acceptance: uv sync succeeds, uv.lock matches pyproject.toml, and inside the environment my_database imports while
              sqlalchemy, alembic, and cryptography report versions 2.0.52, 1.19.2, and 50.0.1.
            verify: uv sync --quiet && uv lock --check && uv run python -c "import my_database, sqlalchemy, alembic, cryptography;
              assert sqlalchemy.__version__ == '2.0.52', sqlalchemy.__version__; assert alembic.__version__ == '1.19.2', alembic.__version__;
              assert cryptography.__version__ == '50.0.1', cryptography.__version__; print('ok')"
            touches:
            - pyproject.toml
            - uv.lock
            - .python-version
            - src/my_database/__init__.py
            status: todo
          - id: P1-G1-T2
            title: Ignore rules and runtime-configuration template
            description: 'Add database/.gitignore with one entry per line: .venv/, __pycache__/, *.pyc, app.db, *.db, *.db-journal,
              *.db-wal, *.db-shm, and .env. Add database/.env.example listing the two runtime variables with an explanatory
              comment each and no values: DATABASE_URL (SQLAlchemy URL; empty means the default sqlite URL of database/app.db)
              and CREDENTIAL_ENCRYPTION_KEY (a Fernet key; required before the first encrypted credential is written, including
              the initial-data migration).'
            reason: The database file, the virtual environment, and secrets must never be committed, and the variable names
              delivered by the Platform must be discoverable by developers without exposing values.
            target: database
            area: package foundation — code_path root
            execution_context:
              kind: configuration
              language: null
              technologies:
              - git
              instructions: 'Write both files by hand. Keep .env.example value-free: the CREDENTIAL_ENCRYPTION_KEY line must
                be exactly `CREDENTIAL_ENCRYPTION_KEY=` and the DATABASE_URL line exactly `DATABASE_URL=`; put the default and
                the key-generation command in comments above them.'
              inputs:
              - .interface/config/development.yaml — platform.composition.configuration (mechanism and the DATABASE_URL and
                CREDENTIAL_ENCRYPTION_KEY variables)
              - .interface/config/database.yaml — layers.storage_adapter.tech.storage.location (database/app.db, never committed)
              expected_output: database/.gitignore and database/.env.example.
            depends_on: []
            constraints:
            - No value is written for any variable in .env.example.
            - The ignore list contains the exact lines app.db, .env, and .venv/.
            acceptance: Both files exist, the ignore rules cover app.db, .env, and .venv/, and .env.example names both variables
              without values.
            verify: test -f .gitignore && test -f .env.example && grep -qx 'app.db' .gitignore && grep -qx '.env' .gitignore
              && grep -qx '.venv/' .gitignore && grep -qx 'DATABASE_URL=' .env.example && grep -qx 'CREDENTIAL_ENCRYPTION_KEY='
              .env.example && echo ok
            touches:
            - .gitignore
            - .env.example
            status: todo
          - id: P1-G1-T3
            title: Runtime settings module
            description: 'Implement src/my_database/settings.py: a frozen dataclass Settings(database_url: str, credential_encryption_key:
              str | None) and get_settings(*, environ: Mapping[str, str] | None = None, load_env_file: bool = True) -> Settings.
              Resolution order per variable: the given environ (default os.environ) first; then, when load_env_file is true,
              a .env file in the Database code root parsed as KEY=VALUE lines (blank lines and # comments ignored, surrounding
              quotes stripped) without overriding variables already present; finally the default DATABASE_URL, the sqlite URL
              of <code root>/app.db as an absolute path. The code root is the nearest ancestor of settings.py containing pyproject.toml;
              when none exists (non-editable install) fall back to the current working directory. Expose constants ENV_DATABASE_URL,
              ENV_CREDENTIAL_ENCRYPTION_KEY, DEFAULT_DATABASE_FILENAME = "app.db". Never read .env.example. get_settings is
              a pure function without caching.'
            reason: Database Principle 9 and development.yaml require the connection URL and the encryption key to come from
              runtime configuration through one resolution path shared by the engine, the migrations, and the credential transformations.
            target: database
            area: package foundation — src/my_database/settings.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              instructions: Use only the standard library (dataclasses, os, pathlib). Implement a small _parse_env_file(path)
                helper. The default URL must be built as f"sqlite:///{absolute_path}" (four slashes for an absolute path). A
                CREDENTIAL_ENCRYPTION_KEY that is absent or empty resolves to None.
              inputs:
              - .interface/config/development.yaml — platform.composition.configuration.variables (DATABASE_URL, CREDENTIAL_ENCRYPTION_KEY)
              - .interface/config/database.yaml — layers.storage_adapter.tech.storage and tech.connection (sqlite scheme, file
                app.db in code_path)
              expected_output: src/my_database/settings.py with Settings and get_settings.
            depends_on:
            - P1-G1-T1
            constraints:
            - No secret value, generated credential, or encryption key is written into any committed file, Interface file, or
              Task log.
            - Process environment always wins over the .env file; the .env file never overrides it.
            acceptance: With an empty environ and no .env file the default URL is a sqlite URL ending in /app.db under the database
              code root; explicit environ values are returned unchanged.
            verify: |-
              uv run python - <<'PY'
              from pathlib import Path
              from my_database.settings import get_settings, ENV_DATABASE_URL, ENV_CREDENTIAL_ENCRYPTION_KEY
              s = get_settings(environ={}, load_env_file=False)
              assert s.database_url.startswith('sqlite:////'), s.database_url
              assert s.database_url.endswith('/app.db'), s.database_url
              assert Path(s.database_url.removeprefix('sqlite:///')).parent == Path.cwd().resolve(), s.database_url
              assert s.credential_encryption_key is None
              s = get_settings(environ={ENV_DATABASE_URL: 'sqlite:///./x.db', ENV_CREDENTIAL_ENCRYPTION_KEY: 'k'}, load_env_file=False)
              assert s.database_url == 'sqlite:///./x.db' and s.credential_encryption_key == 'k', s
              print('ok')
              PY
            touches:
            - src/my_database/settings.py
            status: todo
          - id: P1-G1-T4
            title: Database error types
            description: 'Implement src/my_database/errors.py with the exception hierarchy every layer raises and consumers
              catch: DatabaseError(Exception) as the base, and subclasses UnknownModelError, UnknownFieldError, RecordNotFoundError,
              ConstraintViolationError, InvalidActionError, UnsupportedOperationError, CredentialKeyMissingError, and UnsupportedCredentialModeError,
              each accepting a human-readable message.'
            reason: Consumers must be able to handle Database failures without depending on SQLAlchemy or sqlite3 exception
              types, which would leak the engine and ORM through the interface boundary.
            target: database
            area: package foundation — src/my_database/errors.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              instructions: Plain exception classes with docstrings; no logic. Keep the names exactly as listed because later
                Tasks import them.
              inputs:
              - .interface/config/database.yaml — layers.database_interface (operations and rejection rules) and Database Principle
                6 (consumers never see engine internals)
              expected_output: src/my_database/errors.py defining the nine classes.
            depends_on:
            - P1-G1-T1
            constraints: []
            acceptance: All nine classes import and every specific error is a subclass of DatabaseError.
            verify: |-
              uv run python - <<'PY'
              from my_database import errors as e
              names = ['UnknownModelError','UnknownFieldError','RecordNotFoundError','ConstraintViolationError','InvalidActionError','UnsupportedOperationError','CredentialKeyMissingError','UnsupportedCredentialModeError']
              for n in names:
                  assert issubclass(getattr(e, n), e.DatabaseError), n
              assert issubclass(e.DatabaseError, Exception)
              print('ok')
              PY
            touches:
            - src/my_database/errors.py
            status: todo
        P1-G2:
          id: P1-G2
          title: Storage Adapter
          description: 'The engine-specific persistence layer: the SQLite connection with foreign keys enforced, the SQLAlchemy
            declarative mapping of all 13 resolved tables, and the credential at-rest transformations. Tables are mapped in
            dependency tiers so each tier is verifiable on its own.'
          target: database
          area: storage_adapter — src/my_database/storage_adapter/
          does: Base.metadata describes the complete storage schema exactly as resolved in database.yaml, the engine enforces
            SQLite foreign keys, and hash and encrypted credential modes are implemented for Data Logic and seeding to use.
          task_count: 6
          tasks:
          - id: P1-G2-T1
            title: Declarative base with naming conventions
            description: 'Create src/my_database/storage_adapter/__init__.py (docstring only) and storage_adapter/base.py defining
              NAMING_CONVENTION = {"ix": "ix_%(table_name)s_%(column_0_name)s", "uq": "uq_%(table_name)s_%(column_0_N_name)s",
              "fk": "fk_%(table_name)s_%(column_0_name)s_%(referred_table_name)s", "pk": "pk_%(table_name)s", "ck": "ck_%(table_name)s_%(constraint_name)s"},
              metadata = MetaData(naming_convention=NAMING_CONVENTION), class Base(DeclarativeBase) bound to that metadata,
              and decimal_type() -> Numeric returning Numeric(18, 8), the resolved precision for every logical decimal field.'
            reason: database.yaml fixes the names uq_<table>_<columns> and ix_<table>_<column>; a metadata-level naming convention
              makes every constraint and index name deterministic so migrations and the storage schema stay traceable.
            target: database
            area: storage_adapter — src/my_database/storage_adapter/base.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - SQLAlchemy 2.0.52
              instructions: 'Use SQLAlchemy 2.0 declarative style (sqlalchemy.orm.DeclarativeBase). Export Base, metadata, NAMING_CONVENTION,
                and decimal_type. Numeric(18, 8) is a Planning decision: database.yaml resolves the logical decimal type to
                Numeric and leaves precision open; 18 digits with 8 decimals covers prices, volumes, balances, and percentages.'
              inputs:
              - .interface/config/database.yaml — layers.storage_adapter.standards.naming (constraints, indexes, types)
              expected_output: src/my_database/storage_adapter/__init__.py and src/my_database/storage_adapter/base.py.
            depends_on:
            - P1-G1-T1
            constraints: []
            acceptance: Base.metadata carries the five naming conventions and decimal_type() returns Numeric(18, 8).
            verify: |-
              uv run python - <<'PY'
              from sqlalchemy import Numeric
              from my_database.storage_adapter.base import Base, NAMING_CONVENTION, decimal_type
              nc = Base.metadata.naming_convention
              assert nc['uq'] == 'uq_%(table_name)s_%(column_0_N_name)s' and nc['ix'] == 'ix_%(table_name)s_%(column_0_name)s', nc
              assert set(nc) >= {'ix', 'uq', 'fk', 'pk', 'ck'}
              d = decimal_type(); assert isinstance(d, Numeric) and (d.precision, d.scale) == (18, 8), d
              print('ok')
              PY
            touches:
            - src/my_database/storage_adapter/__init__.py
            - src/my_database/storage_adapter/base.py
            status: todo
          - id: P1-G2-T2
            title: Engine and session factory with SQLite foreign-key enforcement
            description: 'Implement src/my_database/storage_adapter/engine.py: create_database_engine(url: str | None = None)
              -> Engine building sqlalchemy.create_engine on url or get_settings().database_url, passing connect_args={"check_same_thread":
              False} for sqlite URLs and registering a "connect" event listener that executes PRAGMA foreign_keys=ON on every
              new sqlite connection; get_engine() -> Engine returning a module-level engine cached per resolved URL; reset_engine()
              disposing and clearing the cache; session_factory(engine: Engine | None = None) -> sessionmaker with expire_on_commit=False.'
            reason: The Storage Adapter alone owns the connection; database.yaml requires foreign-key enforcement and check_same_thread
              false for SQLite, and every other module must obtain the engine from this one place.
            target: database
            area: storage_adapter — src/my_database/storage_adapter/engine.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - SQLAlchemy 2.0.52
              - SQLite (runtime-provided by the Python sqlite3 module)
              instructions: Use sqlalchemy.event.listens_for(engine, "connect") and execute the pragma through the raw DBAPI
                cursor. Detect sqlite with make_url(url).get_backend_name() == "sqlite". Nothing here is exported from the package
                root.
              inputs:
              - .interface/config/database.yaml — layers.storage_adapter.tech.connection (url_scheme sqlite, foreign_keys true,
                check_same_thread false)
              - src/my_database/settings.py from P1-G1-T3 (database_url)
              expected_output: src/my_database/storage_adapter/engine.py with create_database_engine, get_engine, reset_engine,
                and session_factory.
            depends_on:
            - P1-G1-T3
            constraints:
            - The engine, connection, and session never leave the package through the Database Interface (Database Principle
              6).
            acceptance: A connection from get_engine() against a sqlite URL reports PRAGMA foreign_keys = 1 and the engine URL
              uses the sqlite driver.
            verify: |-
              ( set -e
                trap 'rm -f .verify.db' EXIT
                rm -f .verify.db
                export DATABASE_URL=sqlite:///./.verify.db
                uv run python - <<'PY'
              from sqlalchemy import text
              from my_database.storage_adapter.engine import get_engine, session_factory
              e = get_engine()
              assert e.url.get_backend_name() == 'sqlite', e.url
              with e.connect() as c:
                  assert c.execute(text('PRAGMA foreign_keys')).scalar() == 1
              with session_factory()() as s:
                  assert s.execute(text('select 1')).scalar() == 1
              print('ok')
              PY
              )
            touches:
            - src/my_database/storage_adapter/engine.py
            status: todo
          - id: P1-G2-T3
            title: Map the seven independent tables
            description: In src/my_database/storage_adapter/tables.py define SQLAlchemy 2.0 declarative classes (Mapped[...]
              / mapped_column) for the tables that reference no other table — User→users, Currency→currencies, TradingPlatform→trading_platforms,
              Asset→assets, TrailingGroup→trailing_groups, PartialGroup→partial_groups, ActionGroup→action_groups — with columns
              in the exact order, type, nullability, and default resolved under database.yaml data_logic.storage_schema.tables.
              Each class declares __model_key__ with its source Model key (user, currency, trading_platform, asset, trailing_group,
              partial_group, action_group).
            reason: 'Database Principle 7: every persistent Model maps to a table traceably; the mapping is the source of the
              storage schema migration and of the Model registry, so it must match the resolved schema exactly.'
            target: database
            area: storage_adapter — src/my_database/storage_adapter/tables.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - SQLAlchemy 2.0.52
              instructions: 'Types: Integer, String, String(3) for currencies.code, Boolean, Float, and decimal_type() from
                base.py for Numeric. id: mapped_column(Integer, primary_key=True, autoincrement=True). Columns with a resolved
                default carry both a Python default= and a server_default= (sa.text("1") for true, sa.text("0") for false, sa.text("2"),
                sa.text("0.0"), sa.text("0")) so the schema itself holds the default. unique=True on users.name, currencies.code,
                assets.name, assets.symbol, trailing_groups.name, partial_groups.name, and action_groups.name so the convention
                yields uq_<table>_<column>. Credential columns (users.password, users.api_key) are ordinary non-nullable String
                columns here; the transformation is applied by Data Logic. Do not define relationship() attributes; foreign
                keys arrive in the next Tasks.'
              inputs:
              - .interface/config/database.yaml — data_logic.storage_schema.tables for users, currencies, trading_platforms,
                assets, trailing_groups, partial_groups, action_groups
              - .interface/config/model.yaml — content.models (purpose and field meaning of the source Models)
              expected_output: src/my_database/storage_adapter/tables.py with seven mapped classes registered on Base.metadata.
            depends_on:
            - P1-G2-T1
            constraints:
            - Column names and order are exactly those resolved in database.yaml; nothing is added or renamed.
            acceptance: Base.metadata holds the seven tables with the resolved column lists, currencies.code has length 3, the
              seven uq_ constraints exist, and each class carries its __model_key__.
            verify: |-
              uv run python - <<'PY'
              from my_database.storage_adapter.base import Base
              import my_database.storage_adapter.tables  # noqa: F401 — registers the mappings
              md = Base.metadata
              expected = {'users': ['id', 'name', 'username', 'password', 'api_key', 'status', 'description'], 'currencies': ['id', 'name', 'code', 'symbol', 'country', 'decimal_digits', 'status', 'description'], 'trading_platforms': ['id', 'name', 'code', 'status', 'description'], 'assets': ['id', 'name', 'symbol', 'category', 'point_size', 'digits', 'status', 'description'], 'trailing_groups': ['id', 'name', 'status', 'description'], 'partial_groups': ['id', 'name', 'status', 'description'], 'action_groups': ['id', 'name', 'status', 'description']}
              for name, cols in expected.items():
                  assert name in md.tables, name
                  got = [c.name for c in md.tables[name].columns]
                  assert got == cols, (name, got)
              assert md.tables['currencies'].c.code.type.length == 3
              constraint_names = {c.name for n in expected for c in md.tables[n].constraints}
              for n in ['uq_users_name', 'uq_currencies_code', 'uq_assets_name', 'uq_assets_symbol', 'uq_trailing_groups_name', 'uq_partial_groups_name', 'uq_action_groups_name']:
                  assert n in constraint_names, (n, constraint_names)
              by_table = {m.local_table.name: m.class_ for m in Base.registry.mappers}
