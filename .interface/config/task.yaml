            dependency. The Tasks are related because they turn the private modules into the one interface consumers are allowed to use.
          target: model
          area: src/my_model/_registry.py, src/my_model/__init__.py, README.md, and the distribution built from pyproject.toml
          does: An importable my_model root exposing the fourteen Model classes, MODELS, model_metadata, and the metadata types; a README covering the required sections; and a buildable, lock-checked distribution.
          tasks:
          - id: P1-G4-T1
            title: Implement the MODELS registry and the model_metadata accessor in _registry.py
            description: Create src/my_model/_registry.py defining MODELS, the immutable ordered mapping from each Model key to its class in project order, and model_metadata(model), which accepts a Model class
              or instance, rejects anything that is not a shared Model, and returns its ModelMeta built once and cached.
            reason: model.yaml names MODELS and model_metadata as the registry and metadata exports of the public interface; Database resolves Model identity through the registry and every consumer reads Model
              definitions through the accessor.
            target: model
            area: src/my_model/_registry.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
              instructions: |
                1. Import the fourteen classes from their modules and define `MODELS: Mapping[str, type[Model]] = MappingProxyType({...})` with the keys in this exact order: "user", "currency", "trading_platform", "broker", "account_group", "account", "asset", "trailing_group", "trailing_rule", "partial_group", "partial_rule", "action_group", "action", "position".
                2. Define `model_metadata(model: type[Model] | Model) -> ModelMeta`: resolve the class (`model if isinstance(model, type) else type(model)`); if the class is not one of MODELS' values raise `LookupError(f"{cls.__qualname__} is not a shared Model")`; return the ModelMeta from build_metadata(cls) computed once per class (functools.cache on a private helper keyed by class).
                3. Keep the module private; the root package re-exports MODELS and model_metadata in P1-G4-T2.
              inputs:
              - P1-G3-T1 … P1-G3-T14 — the fourteen Model modules
              - P1-G2-T2 — build_metadata
              - .interface/config/model.yaml — implementation.public_interface.exports.registry and exports.metadata; content.models (key order)
              expected_output: src/my_model/_registry.py defining MODELS and model_metadata.
            depends_on:
            - P1-G3-T1
            - P1-G3-T2
            - P1-G3-T3
            - P1-G3-T4
            - P1-G3-T5
            - P1-G3-T6
            - P1-G3-T7
            - P1-G3-T8
            - P1-G3-T9
            - P1-G3-T10
            - P1-G3-T11
            - P1-G3-T12
            - P1-G3-T13
            - P1-G3-T14
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            - MODELS is immutable and preserves project order; model_metadata never accepts a Model-name string.
            acceptance: MODELS lists the fourteen keys in model.yaml order mapped to the right classes, model_metadata returns metadata equal to model.yaml for every Model whether given a class or an instance,
              the result is cached, and a non-Model raises LookupError.
            verify: |
              uv run --with pyyaml python -c '
              import yaml
              from my_model._registry import MODELS, model_metadata
              from my_model._base import Model
              exp = yaml.safe_load(open("../.interface/config/model.yaml"))["content"]["models"]
              assert list(MODELS) == list(exp), (list(MODELS), list(exp))
              for key, cls in MODELS.items():
                  assert issubclass(cls, Model) and cls.logical_key == key
                  assert model_metadata(cls).as_dict() == exp[key], key
                  assert model_metadata(cls) is model_metadata(cls)
              first = MODELS["currency"](name="US Dollar", code="USD")
              assert model_metadata(first).key == "currency"
              try:
                  MODELS["x"] = None; raise SystemExit("MODELS is mutable")
              except TypeError:
                  pass
              try:
                  model_metadata(dict); raise SystemExit("non-Model accepted")
              except LookupError:
                  pass
              print("ok")
              '
            touches:
            - src/my_model/_registry.py
            status: todo
          - id: P1-G4-T2
            title: Publish the package root exports in __init__.py
            description: 'Replace the placeholder src/my_model/__init__.py with the public interface: import and re-export the fourteen Model classes, MODELS, model_metadata, and the metadata types (ModelMeta,
              FieldMeta, RelationshipMeta, RuleMeta, LogicalType, GenerateInstruction, UNSET), declare __all__ with exactly those names, and keep the module docstring describing the package and stating that
              consumers import only from my_model.'
            reason: development.yaml records my_model as the import entrypoint consumed by Database and Backend; model.yaml requires the Model classes, the registry, and the metadata accessor to be exposed
              from the package root and nowhere else.
            target: model
            area: src/my_model/__init__.py
            execution_context:
              kind: code
              language: Python
              technologies:
              - Python 3.14.7
              - uv 0.12.10
              - Pydantic 2.13.5
              instructions: |
                1. In src/my_model/__init__.py import User, Currency, TradingPlatform, Broker, AccountGroup, Account, Asset, TrailingGroup, TrailingRule, PartialGroup, PartialRule, ActionGroup, Action, Position from their modules, MODELS and model_metadata from ._registry, and ModelMeta, FieldMeta, RelationshipMeta, RuleMeta, LogicalType, GenerateInstruction, UNSET from ._metadata.
                2. Set `__all__ = ["User", "Currency", "TradingPlatform", "Broker", "AccountGroup", "Account", "Asset", "TrailingGroup", "TrailingRule", "PartialGroup", "PartialRule", "ActionGroup", "Action", "Position", "MODELS", "model_metadata", "ModelMeta", "FieldMeta", "RelationshipMeta", "RuleMeta", "LogicalType", "GenerateInstruction", "UNSET"]`.
                3. Keep the docstring; add a `__version__ = "0.1.0"` matching pyproject.toml.
              inputs:
              - P1-G4-T1 — src/my_model/_registry.py
              - .interface/config/model.yaml — implementation.public_interface (entrypoint, exports)
              expected_output: src/my_model/__init__.py exporting the documented public interface.
            depends_on:
            - P1-G4-T1
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            acceptance: Every documented export is importable from my_model, __all__ contains exactly the documented names, and the exported classes are the same objects the registry maps.
            verify: |
              uv run python -c '
              import my_model
              expected = ["User", "Currency", "TradingPlatform", "Broker", "AccountGroup", "Account", "Asset", "TrailingGroup", "TrailingRule", "PartialGroup", "PartialRule", "ActionGroup", "Action", "Position", "MODELS", "model_metadata", "ModelMeta", "FieldMeta", "RelationshipMeta", "RuleMeta", "LogicalType", "GenerateInstruction", "UNSET"]
              assert sorted(my_model.__all__) == sorted(expected), (sorted(my_model.__all__), sorted(expected))
              for name in expected:
                  assert hasattr(my_model, name), name
              for key, cls in my_model.MODELS.items():
                  assert getattr(my_model, cls.__name__) is cls, key
              assert my_model.model_metadata(my_model.User).key == "user" and my_model.__version__ == "0.1.0"
              print("ok")
              '
            touches:
            - src/my_model/__init__.py
            status: todo
          - id: P1-G4-T3
            title: Write the package README with the required sections
            description: 'Replace the README.md stub with the package documentation required by development.yaml: purpose and boundaries, public interface, dependencies, configuration, installation and startup,
              and usage examples, so a consumer can use my_model without reading its implementation.'
            reason: The Development Principles require every package to carry a README that lets a consumer use it without inspecting the implementation; development.yaml records the required sections for my_model.
            target: model
            area: README.md
            execution_context:
              kind: documentation
              language: Markdown
              technologies:
              - Markdown
              - Python 3.14.7
              instructions: 'Write model/README.md with the title `# my_model` and these second-level headings in this order: `## Purpose and boundaries` (what the package is, that it owns Model meaning and
                validation only, and what it does not own — persistence, Behaviour, API, presentation); `## Public interface` (the fourteen Model classes, MODELS, model_metadata, the metadata types, that consumers
                import only from my_model, and the convention that id and credential fields are None before persistence and in instances returned by Database); `## Dependencies` (Python 3.14.7, pydantic 2.13.5,
                uv 0.12.10; no other run-time dependency); `## Configuration` (the package accepts no runtime configuration); `## Installation and startup` (uv sync in model/, and how a consumer installs it
                as an editable path dependency: tool.uv.sources with path ../model and editable true); `## Usage examples` (a fenced python block containing exactly: from my_model import User, MODELS, model_metadata;
                u = User(name="Admin", username="admin", password="secret", api_key="key"); meta = model_metadata(User); assert meta.key == "user" and list(MODELS)[0] == "user"; print(u.model_dump(exclude={"password",
                "api_key"})) — written as separate lines — plus a short example of reading meta.fields and meta.relationships). Record no secret values.'
              inputs:
              - P1-G4-T2 — the public interface
              - .interface/config/development.yaml — packages.my_model.readme.sections and package_standard.documentation
              - .interface/config/model.yaml — implementation (summary, public_interface, boundaries)
              expected_output: model/README.md with the six required sections and a runnable usage example.
            depends_on:
            - P1-G4-T2
            constraints:
            - Document configuration names and non-secret examples only; never record credentials or generated values.
            - Keep the documentation consistent with the implemented interface.
            acceptance: The README contains the six required headings in order and its usage example runs successfully against the package.
            verify: |
              for h in "## Purpose and boundaries" "## Public interface" "## Dependencies" "## Configuration" "## Installation and startup" "## Usage examples"; do grep -qF "$h" README.md || { echo "missing: $h"; exit 1; }; done && uv run python -c '
              from my_model import User, MODELS, model_metadata
              u = User(name="Admin", username="admin", password="secret", api_key="key")
              meta = model_metadata(User)
              assert meta.key == "user" and list(MODELS)[0] == "user"
              print(u.model_dump(exclude={"password", "api_key"}))
              '
            touches:
            - README.md
            status: todo
          - id: P1-G4-T4
            title: Verify the lockfile, build the distribution, and install it in isolation
            description: 'Prove the package is distributable as the local dependency the Database and Backend phases will install: confirm uv.lock is current, build the wheel and sdist with the uv_build backend,
              and import the built wheel in an isolated interpreter to confirm the fourteen Models are reachable without the source tree.'
            reason: development.yaml records my_model as an editable local path dependency of my_database and my_backend; a working build backend and a current lockfile are prerequisites for those installs
              and for reproducing the package from a fresh checkout.
            target: model
            area: distribution (pyproject.toml, uv.lock, dist/)
            execution_context:
              kind: command execution
              language: null
              technologies:
              - uv 0.12.10
              - Python 3.14.7
              instructions: |
                1. From model/ run `uv lock --check`; if it fails, run `uv lock` and inspect why the lock was stale before continuing.
                2. Run `uv build`; it must produce dist/my_model-0.1.0-py3-none-any.whl and dist/my_model-0.1.0.tar.gz.
                3. Run the isolated import check in the verify command; it installs the wheel into a throwaway environment and counts the registry.
                4. Leave dist/ untracked (the root .gitignore ignores it); do not commit build artifacts.
              inputs:
              - P1-G4-T2 — the public interface
              - P1-G4-T3 — README.md referenced by pyproject.toml
              - P1-G1-T2 — pyproject.toml and uv.lock
              expected_output: A current uv.lock, dist/my_model-0.1.0-py3-none-any.whl, dist/my_model-0.1.0.tar.gz, and a passing isolated import of the wheel.
            depends_on:
            - P1-G4-T2
            - P1-G4-T3
            constraints:
            - Consumers import only from the my_model package root; every internal module is private and may change freely.
            - The package depends on nothing but pydantic at run time and never reads .interface files at run time; the verify commands may read them.
            - Do not commit .venv, dist, or __pycache__ directories.
            acceptance: uv lock --check passes, uv build produces the wheel and sdist, and an isolated interpreter that installs only the wheel imports my_model with fourteen registered Models.
            verify: uv lock --check && rm -rf dist && uv build && test -f dist/my_model-0.1.0-py3-none-any.whl && test -f dist/my_model-0.1.0.tar.gz && uv run --isolated --no-project --python 3.14.7 --with
              ./dist/my_model-0.1.0-py3-none-any.whl python -c 'import my_model; assert len(my_model.MODELS) == 14; print("ok")'
            touches:
            - uv.lock
            - dist/ (created, never committed)
            - pyproject.toml (read)
            status: todo
