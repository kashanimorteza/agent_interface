          area: the MODELS registry and model_metadata accessor of the my_model public interface
          does: MODELS and model_metadata exported from the my_model root, exposing the fourteen Models in project order and their definitions with the same content as model.yaml.
          task_count: 2
          tasks:
          - id: P1-G3-T1
            title: Provide the MODELS registry
            description: 'Expose MODELS from the my_model package root: the ordered mapping from every Model key of the generated configuration (lower_snake_case) to its exported class, in project order.'
            reason: model.yaml names MODELS as the registry export of the public interface; Database resolves Model identity through it and Backend iterates it to connect one Logic unit per Model.
