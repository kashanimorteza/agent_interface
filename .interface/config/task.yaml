              depends_on: ["P1-T2"]
              acceptance: "pyproject.toml declares a project named trading-assistant-database, requires-python >=3.14, and dependencies alembic==1.19.1 and sqlalchemy==2.0.52; uv lock produces uv.lock pinning both"
              verify: "uv lock && grep -q 'name = \"alembic\"' uv.lock && grep -q 'version = \"1.19.1\"' uv.lock && grep -q 'name = \"sqlalchemy\"' uv.lock && grep -q 'version = \"2.0.52\"' uv.lock"
              touches:
                - "pyproject.toml"
                - "uv.lock"
              status: "done"
              log:
                - "2026-09-03 — claim record failed to persist before work (helper invocation error); work done and verify passed — pyproject.toml declared, uv.lock pins alembic 1.19.1 and sqlalchemy 2.0.52"

