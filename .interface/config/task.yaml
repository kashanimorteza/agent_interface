        # <!-------------------- composition -->
        phase_1.composition:
          id: "phase_1.composition"
          title: "Platform composition"
          description: "The Model layer's contribution to the runtime configuration: its own settings file inside its code path, its bindings section in the public root file, and its declared connections, so the system stays composable after this phase. Its single Task is the composition work this phase owes."
          area: "The Model layer's part of the Platform composition"
          does: "The Model layer's own settings file exists inside its code path, the public root configuration carries the Model layer's bindings, both satisfy the section contract, and the Model layer's connections are declared: it consumes no application layer and is provided to future consumers through its import interface."
          constraints: []
          task_count: 1
          tasks:

            phase_1.composition.runtime_configuration:
              id: "phase_1.composition.runtime_configuration"
              title: "Contribute the Model layer's runtime configuration"
              description: "Establish the Model layer's own settings file inside its code path and the public root configuration with the Model layer's bindings section, each holding only what the section contract assigns to it, and record the Model layer's declared connections."
              reason: "Every phase that delivers a layer also delivers that layer's part of the composition, so the system remains composable after this phase rather than only after the last."
              kind: "configuration"
              inputs:
                - "The runtime configuration conventions"
                - "The Model package identity"
              expected_result: "The Model layer's settings file exists in its code path, the public root configuration exists with a Model bindings section, both satisfy the section contract, and the Model layer's connections are recorded as consuming no layer and providing its import interface."
              depends_on:
                - "phase_1.package.establish"
              constraints:
                - "The Model layer's settings file carries no settings and its bindings section carries no bindings, because nothing in the Model layer is changeable by a user or environment and it consumes no other layer."
              acceptance: "The layer file holds only Model-owned settings and the public file holds only the Model bindings, neither holds anything the contract assigns to the other, both satisfy the contract, and neither names a secret value."
              verify: "Reading the Model layer's settings file and the public configuration's Model section yields a settings mapping and a bindings mapping that each pass validation against the section contract, and the recorded connections show Model consuming no other layer."
              status: "done"
              log:
                - at: "2026-09-07T20:55:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed once the package existed; establishing the layer's own settings file and the public bindings section."
                - at: "2026-09-07T20:59:34Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Parsed the Model layer's own configuration file inside its code path and asserted its only key is the settings mapping, that the mapping is empty because the layer owns no setting, and that it carries no bindings; parsed the public root configuration and asserted its Model section's only key is the bindings mapping, that the mapping is empty because the layer consumes no other layer, and that it carries no settings, so neither file holds what the section contract assigns to the other; asserted neither file assigns a value to a secret-named key."
                  outcome: "Passed."
