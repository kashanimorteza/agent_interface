              expected_result: "Fourteen derived table mappings, each traceable to its source Model, with one column per field carrying the field's declared properties."
              depends_on:
                - "phase_2.package.establish"
              constraints: []
              acceptance: "Every one of the fourteen Models resolves to exactly one table that names its source Model; every field resolves to one column whose optionality, uniqueness, size, and default match the field; and every identifier column is assigned by storage."
              verify: "Resolving the mapping for each Model yields a table recording that Model, whose column set equals the Model's field set and whose per-column properties equal the field's declared properties, including the three-character size of the currency code and the zero balance default of the account."
              status: "done"
