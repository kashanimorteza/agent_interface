              acceptance: "All nineteen declared relationships resolve to foreign keys on their existing carrying fields, each referencing the target table's primary key with an index and the resolved referential actions, and none duplicates a carrying field."
              verify: "Enumerating the resolved foreign keys yields one per declared relationship, each naming its carrying column, referenced table, and referenced column, with the account's base-currency reference resolving to the currency table and the position's action reference resolving to the action table."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; resolving relationships into foreign keys."
                - at: "2026-09-07T15:19:41Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Enumerated the resolved foreign keys across all tables and asserted their number equals the nineteen declared relationships, that each declared relationship resolves to exactly one foreign key on its carrying field referencing the target's primary key with the same column type, an index named for the table and column, and restrict actions on delete and update; asserted the account's base-currency reference names the currency table with its base-currency role and the position's action reference names the action table."
                  outcome: "Passed."

            phase_2.mapping.rules:
              id: "phase_2.mapping.rules"
              title: "Map domain rules to storage constraints"
              description: "Resolve every declared Model rule into a storage constraint that preserves its meaning and remains traceable to the rule, including composite uniqueness and the at-rest mode a credential rule requires."
              reason: "A rule that exists only in the domain description is a rule the stored data can violate."
              kind: "code"
              inputs:
                - "Every shared Model's rule declarations"
                - "The derived column mappings"
              expected_result: "Every declared rule is represented in the derived storage design and recorded against the rule it implements."
              depends_on:
                - "phase_2.mapping.columns"
              constraints: []
              acceptance: "The broker's composite uniqueness of user and name resolves to one composite unique constraint, every credential-storage rule resolves to the matching at-rest mode on its column, and each resolved constraint names its source rule."
              verify: "Enumerating the resolved constraints yields a composite unique constraint over the broker's user and name columns traceable to its rule, and the resolved at-rest modes are hash for the user's password and API key and encrypted for the account's password."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; resolving rules into constraints and at-rest modes."
                - at: "2026-09-07T15:19:41Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Asserted the broker mapping holds exactly one composite unique constraint over user_id and name whose source rule is the Model's own composite rule and which is present on the derived table; asserted the resolved at-rest modes are hash for the user's password and API key and encrypted for the account's password; asserted every rule of every Model is the source of one resolved constraint and every at-rest constraint records the mode of its credential rule."
                  outcome: "Passed."

            phase_2.mapping.credentials:
              id: "phase_2.mapping.credentials"
              title: "Apply at-rest transformations to credential fields"
              description: "Apply the resolved at-rest mode when a credential value is stored: a one-way transformation for hash mode, and a reversible transformation whose key comes from the runtime environment for encrypted mode, so that no consumer ever receives or supplies the stored representation."
              reason: "A credential stored as given is a secret in the database, and a transformation decided per caller is applied inconsistently."
              kind: "code"
              inputs:
                - "The resolved at-rest modes"
                - "The credential storage mode definitions"
              expected_result: "Storing a credential persists only its transformed representation; a hashed credential can be verified but not recovered, and an encrypted credential can be recovered only with the runtime key."
              depends_on:
                - "phase_2.mapping.columns"
              constraints: []
              acceptance: "A stored hashed credential differs from the given value, verifies against it, and cannot be recovered; a stored encrypted credential differs from the given value and is recovered only with the runtime key; and the key is read from the runtime environment rather than from any package or generated file."
              verify: "Transforming a password for the user Model yields a value that is not the input, verifies against the input, and does not verify against another value; transforming a password for the account Model yields a value that is not the input and recovers the input with the runtime key, and fails without it."
              status: "done"
              log:
                - at: "2026-09-07T15:13:00Z"
                  status: "claimed"
                  by: "my-interface-developer"
                  note: "Claimed together with the column mapping; implementing the hash and encrypted transformations."
                - at: "2026-09-07T15:20:37Z"
                  status: "done"
                  by: "my-interface-developer"
                  check: "Hashed a value and asserted the result differs from it, verifies against it, does not verify against another value, and cannot be recovered; encrypted a value with a runtime key and asserted the result differs from it and recovers it; asserted that without a key both encrypting and recovering fail with a configuration error and that a different key fails to recover; asserted no package source assigns the encryption key."
                  outcome: "Passed. A first run failed because the hashing work factor exceeded the hashing library's default memory limit; the work factor was reduced and an explicit memory limit set, then rerun."

