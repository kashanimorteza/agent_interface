                import sqlite3
                seeds = {"user": {"table": "users", "count": 1, "natural_key": ["name"]}, "currency": {"table": "currencies", "count": 8, "natural_key": ["code"]}, "trading_platform": {"table": "trading_platforms", "count": 2, "natural_key": ["name"]}, "broker": {"table": "brokers", "count": 1, "natural_key": ["user_id", "name"]}, "account_group": {"table": "account_groups", "count": 1, "natural_key": ["name"]}, "account": {"table": "accounts", "count": 1, "natural_key": ["name"]}, "asset": {"table": "assets", "count": 4, "natural_key": ["symbol"]}, "trailing_group": {"table": "trailing_groups", "count": 1, "natural_key": ["name"]}, "trailing_rule": {"table": "trailing_rules", "count": 0, "natural_key": []}, "partial_group": {"table": "partial_groups", "count": 1, "natural_key": ["name"]}, "partial_rule": {"table": "partial_rules", "count": 0, "natural_key": []}, "action_group": {"table": "action_groups", "count": 1, "natural_key": ["name"]}, "action": {"table": "actions", "count": 1, "natural_key": ["name"]}, "position": {"table": "positions", "count": 0, "natural_key": []}}
                con = sqlite3.connect("data/verify_g2t3.db")
                for key, s in seeds.items():
                    n = con.execute("select count(*) from " + s["table"]).fetchone()[0]
                    assert n == s["count"], (key, n, s["count"])
                assert [r[0] for r in con.execute("select code from currencies order by id")] == ["USD", "EUR", "GBP", "JPY", "CHF", "CAD", "AUD", "NZD"]
                assert con.execute("select decimal_digits, symbol, country from currencies where code = ?", ("JPY",)).fetchone() == (0, "¥", "Japan")
                assert con.execute("select code from trading_platforms where name = ?", ("MetaTrader 5",)).fetchone() == ("metatrader_5",)
                assert con.execute("select user_id, trading_platform_id from brokers where name = ?", ("FxPro",)).fetchone() == (1, 1)
                assert con.execute("select group_id, broker_id, base_currency_id, username, leverage, account_type from accounts where name = ?", ("Acc-1",)).fetchone() == (1, 1, 1, "test", 100, "CFD")
                assert con.execute("select symbol, category, digits from assets where name = ?", ("XAUUSD",)).fetchone() == ("XAU/USD", "Commodity", 2)
                assert con.execute("select action_group_id, asset_id, account_id, partial_group_id, trailing_group_id from actions where name = ?", ("Default",)).fetchone() == (1, 1, 1, 1, 1)
                pw, ak = con.execute("select password, api_key from users where name = ?", ("Admin",)).fetchone()
                assert pw and ak and pw != ak and "Generate securely" not in (pw, ak), "generated credentials must be stored transformed"
                ap = con.execute("select password from accounts where name = ?", ("Acc-1",)).fetchone()[0]
                assert ap and ap != "Generate securely"
                print("ok: initial data seeded (" + str(sum(s["count"] for s in seeds.values())) + " records)")
                PY
                uv run python data/verify_g2t3_check.py
                uv run alembic downgrade -1
                uv run python -c '
                import sqlite3
                con = sqlite3.connect("data/verify_g2t3.db")
                assert con.execute("select count(*) from currencies").fetchone()[0] == 0, "downgrading the seed revision must remove the seeded records"
                con.execute("insert into currencies (name, code, symbol, country, decimal_digits, status) values (?, ?, ?, ?, ?, ?)", ("US Dollar", "USD", "$", "United States", 2, 1))
                con.commit()
                print("ok: seed reverted; one USD pre-inserted")
                '
                uv run alembic upgrade head
                uv run python data/verify_g2t3_check.py
                uv run python -c '
                import sqlite3
                con = sqlite3.connect("data/verify_g2t3.db")
                assert con.execute("select count(*) from currencies where code = ?", ("USD",)).fetchone()[0] == 1, "re-seeding duplicated a record"
                print("ok: re-seeding is idempotent on natural keys")
                '
                rm -f data/verify_g2t3.db data/verify_g2t3_check.py
