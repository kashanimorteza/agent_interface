                export DATABASE_URL="sqlite:///$PWD/.verify.db"
                export CREDENTIAL_ENCRYPTION_KEY=$(uv run --with cryptography python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
                ( cd ../database && uv run alembic upgrade head >/dev/null 2>&1 )
                ( cd ../backend && BACKEND_PORT=8765 uv run python -m trading_backend >/dev/null 2>&1 & echo $! > ../frontend/.backend.pid )
                for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/openapi.json >/dev/null 2>&1 && break; sleep 1; done
                export NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8765
                unset NEXT_PUBLIC_API_BASE_URL
                npm run build > .build.log 2>&1 || { tail -40 .build.log; exit 1; }
                rm -f .build.log
                ( npm run start -- --port 3000 >/dev/null 2>&1 & echo $! > .frontend.pid )
                trap 'if [ -f .frontend.pid ]; then kill $(cat .frontend.pid) 2>/dev/null || true; rm -f .frontend.pid; fi; if [ -f .backend.pid ]; then kill $(cat .backend.pid) 2>/dev/null || true; rm -f .backend.pid; fi; rm -f .verify.db' EXIT
