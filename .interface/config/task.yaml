            - id: "P1-T24"
              title: "Generate the initial revision that creates all thirteen contract tables with alembic revision --autogenerate"
              goal: "One reviewed migration file exists whose upgrade creates every contract table and whose downgrade drops them"
              depends_on: ["P1-T10", "P1-T11", "P1-T12", "P1-T13", "P1-T14", "P1-T15", "P1-T16", "P1-T17", "P1-T18", "P1-T19", "P1-T20", "P1-T21", "P1-T22", "P1-T23"]
