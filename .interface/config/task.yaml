              a null non-nullable field.
            verify: |
              uv run --with pyyaml python -c '
              import yaml, pydantic, datetime, decimal
              from my_model import User
              e = yaml.safe_load(open("../.interface/config/model.yaml"))["content"]["models"]["user"]["fields"]
              sample = {"integer": 1, "string": "x", "boolean": True, "decimal": decimal.Decimal("1.5"), "float": 1.5, "datetime": datetime.datetime(2026, 1, 1)}
              absent_ok = {n for n, f in e.items() if f.get("auto_increment") or f.get("credential")}
              required = [n for n, f in e.items() if not f["nullable"] and "default" not in f and n not in absent_ok]
              nullable = [n for n, f in e.items() if f["nullable"]]
              kw = {n: sample[e[n]["type"]] for n in required} | {n: None for n in nullable}
              inst = User(**kw)
              for n, f in e.items():
                  if "default" in f:
                      assert getattr(inst, n) == f["default"], (n, getattr(inst, n), f["default"])
                  if n in absent_ok or n in nullable:
                      assert getattr(inst, n, None) is None, n
              def rejected(**bad):
                  try:
                      User(**bad)
                  except pydantic.ValidationError:
                      return True
                  return False
              for n in required:
                  assert rejected(**{k: v for k, v in kw.items() if k != n}), "missing required field accepted: " + n
              for n, f in e.items():
                  if n in absent_ok:
                      continue
                  assert rejected(**{**kw, n: object()}), "wrong type accepted: " + n
                  if not f["nullable"]:
                      assert rejected(**{**kw, n: None}), "null accepted in non-nullable field: " + n
              print("user ok")
              '
