# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State: active Workflow position, aggregate phase progress, and the execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and State Component; preserve existing operational records and never replace them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the phase records keyed by stable Target phase identifier, then the log."
  selection: "A requested phase resolves to the record keyed by that phase identifier; a Log Entry resolves by its id."
  absence: "No matching phase record means the phase has no recorded State; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current or most recently recorded Workflow Mode, its phase, and its provenance."
  phases: "Aggregate Planning, Development, and Review progress for each stable Target phase."
  log: "Preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "not set"
    phase: null
    mode_reason: "No Workflow operation has been recorded."
    set_by: "initialization"
    set_at: null
  phases:
    P1:
      id: "P1"
      planning: "not started"
      development: "not started"
      review: "not started"
      completed_at: null
