# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable Workflow position, Blockers and Open Questions."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "blockers"
  - "open_questions"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current or most recently recorded Workflow position."
  blockers: "Unresolved critical conditions."
  open_questions: "Unresolved critical questions for the human."


# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "development"
    phase: "phase_3"
    mode_reason: "Development implemented and verified all 10 Tasks of phase_3 (Backend); every Task is done with its check recorded, and the API server starts from the runtime configuration."
    set_by: "my-interface-developer"
    set_at: "2026-09-07T15:33:03Z"
  blockers: {}
  open_questions: {}
