# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable State Config: active Workflow position, aggregate phase progress, and the preserved execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema. Reconciliation preserves existing operational records and never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress, then log for recorded execution history."
  selection: "A phase resolves to the entry keyed by its stable Target phase identifier; a Log Entry resolves by its id."
  absence: "An empty phases mapping means no phase identity has been recorded; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The active Workflow mode, phase, and the reason, author, and time of the last change."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

