          - "Location and technology: the Component root is the model directory at the repository root and the importable package model is mapped onto it (setuptools package-dir) so the Interface unit, core, entity and documentation share one root as the canonical topology requires. Python >=3.14; sqlmodel 0.0.47 (pydantic 2.13.5, sqlalchemy 2.0.54) resolved and locked by uv; ruff and pyright with strict type checking are the development tools."
          - "Private Model-owned support: SQLModel table models skip validation on construction and validate only after setting on assignment, so the shared Entity base validates construction through the pydantic validator (strict, unknown Fields forbidden, input values hidden in diagnostics) and validates an assignment before applying it. This rests on SQLModel 0.0.47 behaviour; upgrading SQLModel should repeat the verification."
          - "Type semantics: float accepts only finite float values (no int, Decimal or Fraction); non-finite floats and decimals are rejected because JSON cannot represent them and round trips must be lossless; decimal accepts only Decimal; a JSON integer is read as float only when exactly representable."
          - "The Target Size of Currency code is realized as a maximum length of 3."
          - "Only the identity Field is immutable (the Model rule for an assigned identity); no Field carries a sensitivity marker because the Target declares none."
          - "Relations, Uniqueness Constraints and Indexes are published as Declaration metadata only; no foreign key, unique or index is baked into the table classes because the Database Definition realizes them from Entity metadata."
          - "JSON representation: to_json returns a JSON object as a dict and from_json accepts one (decoding JSON text is the caller's step). Failures: ValueError for a non-object or an invalid encoding, TypeError for a wrong-kind decimal or datetime encoding, and pydantic ValidationError for construction-contract violations."
          - "Documentation: a Declaration section sits between Interface and Foundation because the Model Preferences order omits it while the Model Definition requires it; the Interface tables and Entity Metadata are generated from the published Declarations."
          - "Tool configuration: the alphabetical import and __all__ ordering rules are disabled for the Interface unit only because Target order is mandatory. The formatter also formats Python code blocks in the documentation."
          - "The sqlmodel Skill's relationship and foreign_key patterns were deliberately not applied: the Model Definition requires flat Entities with name-only Relations and Database owns foreign keys. This was treated as a binding project decision rather than a Skill recommendation to escalate; the Human may disagree."
        notes_for_human:
