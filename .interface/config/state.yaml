            state: "resolved"
            task: "P1-G1-T1"
            expected: "The shared Declaration capability performs no behaviour of its own (Task P1-G1-T1 acceptance; Model Principle: Declaration provides no runtime behaviour)."
            observed: "The Declaration class defines a public lookup method (field) that searches its fields at runtime. The recorded check for the Task asserted that this method was the only method, so it accepted the behaviour instead of establishing its absence. Nothing in the Source or README uses the method."
            evidence: "my_model/src/my_model/model_declaration.py, method field on Model_Declaration; observed at runtime as the only callable public attribute of the class."
            resolution: "Removed the unused lookup method from the Declaration class in the Source. Re-observed: the Declaration and its helper records have no callable public attributes; ruff format/check and pyright report no issues; the Target comparison of all 15 Entities, the entry-point check, the persistence-metadata check, and the README check all pass again."
        outcomes:
