# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/state.yaml
  path_note: 'Generated configuration of the State Component — the four fixed Workflow modes, the current active State, critical Blockers, and Open Questions. Shape: schema/state.yaml; rules: principles/state.md;
    the State Preferences layer is empty'
  standard: Agent Project Interface
  schema_version: '10.0'
  created: '2026-09-07'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: 'Every Workflow operation records its own active mode, optional phase, reason, provenance, and time when it runs, and may raise, update, or release Blockers and Open Questions it encounters. No
    operation rewrites project meaning, Task content, or another Component''s information through this file. Active State is descriptive, not an authorization gate: no transition graph restricts which mode
    may follow another, and every mode is repeatable'
  changed_by: The configuring, planning, and development operations for their own runs; the reset operation as its fixed behaviour defines; the human directly
  modes: The four modes are fixed by principles/state.md and explained by interface.md; this file records them so State is understandable on its own
  blockers: A Blocker records what is blocked, what is missing, why continuation is impossible, who can resolve it, and who raised it and when; an operation authorized to verify its resolution removes it
    from the unresolved collection
  questions: An operation raises an Open Question only for a critical decision it cannot safely resolve, recording who raised it and when, and records only an answer the human supplied with its author and
    time. It never invents the human's answer; a fully answered question is removed


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- modes
- active
- blockers
- open_questions


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  modes: The initial mode and the four fixed Workflow modes with their meanings
  active: The current or most recently entered Workflow position, with reason, provenance, and time
  blockers: Unresolved critical conditions preventing safe or valid continuation, keyed by identifier
  open_questions: Unresolved critical questions that require a human decision, keyed by identifier


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- modes -->
  modes:
    initial: not set
    available:
      not set:
        purpose: The initial Workflow position before any operation has been recorded, or the position restored by an applicable reset. It represents no operation.
        phase_specific: false
        repeatable: true
      configuring:
        purpose: Project Understanding is being generated or refreshed from project.md into the generated configuration of every Component.
        phase_specific: false
        repeatable: true
      planning:
        purpose: Plans, Groups, and Tasks are being generated or reconciled for one requested project phase as bounded, verifiable activities without prescribing implementation.
        phase_specific: true
        repeatable: true
      development:
        purpose: Eligible planned Tasks are being implemented and verified for one requested project phase.
        phase_specific: true
        repeatable: true

  # <!-------------------------------------------- active -->
  active:
    mode: configuring
    phase: null
    mode_reason: The human invoked the configuring operation after a stage-1 reset had emptied the generated configuration and removed every implementation directory, and after the Interface had been restructured
      — the Definition Component was removed, interface.yaml was replaced by interface.md, and the Task, State, Model, Database, and Development authorities changed. The operation rebuilt the complete project
      Understanding for the seven current Components from project.md and the current authorities, materialized the phase Plans in task.yaml directly from project.md, and created this State file; it acted
      on no single phase.
    set_by: configuring operation (my-interface-interpreter) — acting on the human's request to interpret project.md
    set_at: '2026-09-07T02:30:34+03:30'

  # <!-------------------------------------------- blockers -->
  blockers: {}

  # <!-------------------------------------------- open_questions -->
  open_questions: {}
