# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State: the active Workflow position, aggregate Phase progress, and the preserved execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and the State Component's ownership rules; reconciliation preserves existing operational records and never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the aggregate progress of the Phase concerned, then the Log."
  selection: "A Phase resolves to the record keyed by its stable Target phase identifier; a Log Entry resolves by its project-wide identifier."
  absence: "No matching Phase record means the Phase has not been reconciled; an empty Log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its Phase when applicable, and its provenance."
  phases: "Aggregate Planning, Development, and Review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "not set"
    phase: null
    mode_reason: "No Workflow operation has been recorded."
    set_by: "initialization"
    set_at: null
  phases:
    P1:
      id: "P1"
      planning: "not started"
      development: "not started"
      review: "not started"
      completed_at: null
