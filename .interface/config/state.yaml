          - "State phase progress for P1 (planning, development, review, completed_at) has no entry yet. State owns that record and no Core Skill run so far wrote it; Review reports it as needed rather than writing it."
          - "The built wheel under the component's ignored build output predates the fix and should be rebuilt on next packaging."
