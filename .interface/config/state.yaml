# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Generated runtime State — the working modes, the live State Authority, the active mode and phase, blockers, and open questions, in one file. Its shape is schema/state.yaml and its rules are principles/state.md"
  standard: "Agent Project Interface"
  schema_version: "9.0"
  created: "2026-09-05"
  seeded_under: "S0"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "content.state_authority below is the live authority for this file. It names every field, who may write it, on which transition, and by which operation. Read it before anything below it is written. Where any other Interface file appears to say something different, that section governs"
  changed_by: "The authorized operation named for each field under content.state_authority, or the human directly under transition S6"
  seeding: "content.state_authority was seeded verbatim from the default in schema/state.yaml under transition S0 on 2026-09-05. After the seed it is the human's alone; a regeneration carries it and content.active through untouched"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "state_authority"
  - "active"
  - "blockers"
  - "open_questions"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  state_authority: "The live State Authority — the working modes, who may write each field, on which transition, and by which operation"
  active: "The current workflow mode and active project phase"
  blockers: "Critical conditions that genuinely prevent safe authorized continuation"
  open_questions: "Critical decisions the human still has to make because Agent discretion cannot safely resolve them"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- state_authority -->
  state_authority:
    rule: "This section is the single source of truth for the runtime state. It defines the working modes, names every field of state.yaml, states who may write each one, defines which transitions exist, and identifies which operation may perform each. Where any other Interface file appears to say something different, this section governs; the other file is wrong and is corrected, not worked around"
    principle: "State records human-owned decisions and genuinely blocking conditions. An agent resolves ordinary implementation and technical decisions under its integration's decision policy without turning them into questions; it never supplies the answer to a question that correctly remains with the human. A human-requested operation writes State only as the transitions below permit"
    scope: "This file — the modes and authority in content.state_authority, plus content.active, content.blockers, and content.open_questions. The other config files keep their ownership in their own policy sections; nothing here widens it"
    seeded_from: "The default in .interface/schema/state.yaml, written verbatim when state.yaml is created — transition S0. While no state.yaml exists there is no live authority, so that default is what authorizes its own creation; once the file exists, this live copy governs and the schema default is not consulted at runtime"
    extension_rule: "Extensible by the human alone. A new entry under fields gives a new state field its own authority; adding an operation to a writable_by or performed_by list authorizes that operation without redesigning the format; a new transition is a new entry under transitions. An agent that needs an extension raises it as an open question, never writes it"

    modes:
      rule: "Exactly one mode is active at a time; active.mode records it, or holds 'not set' when no workflow operation has been requested yet"
      set_by: "The human selects the requested workflow operation; the authorized operation records its mode and phase according to the transitions below. No operation chooses a mode on the human's behalf."
      entered_by: "A working phase mode is entered by its matching operation: planning, development, or review. The reset operation may return the global workflow to planning with no active phase; it does not perform a planning run."

      planning:
        purpose: "Decide what will be built and in what order — no product code is written"
        owned_by: "planning operation"
        may_write:
          - "The mapped item configuration selected by the requested phase's target in definition.yaml — planning-owned settings and relationships only"
          - ".interface/config/task.yaml — the plan for the one project phase named by the invocation"
          - ".interface/config/state.yaml — active, per transitions S1 and S4 in this State Authority, and blockers and open questions"
        may_not_write:
          - "Any file under the code_path of the requested phase's target"
          - "The requested phase's id, title, order, target, or goal in config/definition.yaml"
          - "map.yaml, .interface/config/definition.yaml, .interface/config/model.yaml, .interface/config/development.yaml, and schema/"

      development:
        purpose: "Implement the tasks that planning defined"
        owned_by: "development operation"
        may_write:
          - "Files under the code_path of the active phase's target, limited to the touches of the claimed task"
          - ".interface/config/task.yaml — the status, blocker, and log fields of a task only"
          - ".interface/config/state.yaml — active, per transitions S2 and S4 in this State Authority, and blockers and open questions"
        may_not_write:
          - "A code_path not selected by the active phase's target in definition.yaml"
          - "task_schema, task_states, phase plan identity and structure, and every field of a task other than status, blocker, and log"
          - "map.yaml, .interface/config/definition.yaml, .interface/config/model.yaml, .interface/config/development.yaml, the item files, and schema/"
        plan_change: "Changing a task requires the reason written into that task's log and human approval"

      review:
        purpose: "Read the result and report — nothing is repaired in this mode"
        owned_by: "review operation"
        may_write:
          - ".interface/config/state.yaml — active, per transitions S3 and S4 in this State Authority, and blockers and open questions"
          - ".interface/config/task.yaml — the status, blocker, and log fields of a task, to mark it blocked and record what was found"
        may_not_write:
          - "Anything else"

    tiers:
      agent_writable: "Written by an authorized operation, and only as part of a transition listed under transitions below"
      human_only: "Never written by an agent — in any mode, on any invocation, however convenient. The human edits it directly"
      derived: "Not stored at all — computed from what is stored, and never written anywhere"

    fields:

      state_authority:
        tier: "human_only"
        holds: "This section — the live State Authority"
        writable_by:
          - "generation operation — only under transition S0, seeding the default from schema/state.yaml because state.yaml does not yet exist"
        constraint: "After the seed it is the human's alone. A regeneration carries it through untouched; no operation edits, extends, or narrows it, and a change it needs is an open question in this file — never a quiet rewrite"
        human_may_set: true

      active.mode:
        tier: "agent_writable"
        holds: "One of the modes defined in content.state_authority.modes, or 'not set' when no workflow operation has been requested yet"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — only under transition S0, when state.yaml does not yet exist"
          - "reset operation — only under transition S9, to planning for a development reset or 'not set' for a planning reset"
        constraint: "An operation writes only the mode it owns, except that reset records the workflow stage explicitly selected by the human under S9: planning after development is reset, or 'not set' after planning is reset. Reset never performs planning"
        human_may_set: true

      active.phase:
        tier: "agent_writable"
        holds: "One project phase id as definition.yaml indexes it under content.phases, or 'none'"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — only under transition S0, when state.yaml does not yet exist"
          - "reset operation — only under transition S9, and only to 'none'"
        constraint: "The phase comes from the human request and must exist under definition.yaml content.phases. The request must name exactly one phase; a phase is never guessed, inferred from a target item, or carried over from a previous run. Under S0 generation and under S9 reset write only 'none'."
        human_may_set: true

      active.target:
        tier: "derived"
        holds: "The target of active.phase, resolved from the entry in definition.yaml content.phases whose id equals active.phase"
        writable_by: []
        constraint: "Never stored. The active target is resolved fresh from active.phase in definition.yaml; its selected component in development.yaml and its item Policy, configuration, interfaces, verification context, and code_path are then resolved through the current Interface map."

      active.mode_reason:
        tier: "agent_writable"
        holds: "Why this mode and this phase are the active ones — the invocation that set them, and after a run what that run concluded"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — only under transition S0, when state.yaml does not yet exist"
          - "reset operation — only under transition S9"
        constraint: "Written together with mode and phase, rewritten at the end of a run under transition S4, or written by reset under S9 to record the selected stage and destination. It states what happened; it never argues for a mode the operation did not enter"
        human_may_set: true

      active.set_by:
        tier: "agent_writable"
        holds: "Who wrote the active values — either 'the human' for a direct edit, or the authorized operation acting on the human's request"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — only under transition S0, when state.yaml does not yet exist"
          - "reset operation — only under transition S9"
        constraint: "An operation writes its generic operation name and the human request it acted on. It never writes 'the human' for a value the human did not type directly — the provenance of every state change stays readable. Under S0 generation writes its operation name, not the human's"
        human_may_set: true

      active.set_at:
        tier: "agent_writable"
        holds: "The date the active values were last written"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — only under transition S0, when state.yaml does not yet exist"
          - "reset operation — only under transition S9"
        constraint: "Written with every change to active, and never backdated"
        human_may_set: true

      blockers:
        tier: "agent_writable"
        holds: "Only critical conditions that genuinely prevent safe authorized continuation, what each condition stops, and whose action or decision would release it"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — during a generation run, which is outside the modes"
          - "reset operation — only under transition S9, clearing every blocker"
        constraint: "Any mode, and a generation run, may raise a blocker only when the active agent integration classifies the condition as critical and work cannot safely or validly continue. Ordinary unspecified technical details are resolved by agent judgment and never become blockers. A blocker may be updated and removed once the condition is resolved in its owning configuration, interface, code, evidence, or human decision. A blocker whose decision_belongs_to is the human is otherwise removed only after the human has decided — recording that decision is transition S8. Reset may clear every blocker without answering it only as part of S9"
        human_may_set: true

      open_questions.questions:
        tier: "agent_writable"
        holds: "Critical project questions that cannot be safely resolved through Agent discretion — raised by an agent and addressed to the human"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation — during a generation run, which is outside the modes"
          - "reset operation — only under transition S9, clearing every open question"
        constraint: "An agent raises a question only when the active agent integration classifies the decision as critical, and states why it matters. Ordinary ambiguity is resolved through professional judgment and continuation. Raising is not answering. Reset may clear every question without answering it only as part of S9"
        human_may_set: true

      open_questions.questions.answered_so_far:
        tier: "agent_writable"
        holds: "What of a question the human has already settled, and when"
        writable_by:
          - "planning operation"
          - "development operation"
          - "review operation"
          - "generation operation"
        constraint: "Only the human's stated decision is recorded here, in the human's own terms and dated. An agent that writes anything here it was not told is inventing — see transition S8"
        human_may_set: true

      the_answer_to_an_open_question:
        tier: "human_only"
        holds: "The decision itself — what the value actually is"
        writable_by: []
        constraint: "No agent answers a question, closes one by supplying its answer, or writes a plausible project decision in place of one. A question is closed only after the human has answered it, and the answer that closes it is the human's"

      ready:
        tier: "derived"
        holds: "Whether a task may be started"
        writable_by: []
        constraint: "Never stored. A task is ready when its phase has a non-empty plan, every earlier project phase is complete, its status is todo, and every id in its depends_on is done — computed at the moment it is needed, and written nowhere"

    human_only_decisions:
      note: "These sit outside state.yaml but belong to the same ownership model — they are named here so that one section answers the whole question of who decides what"
      items:
        - "The answer to any open question in state.yaml"
        - "Defining a project phase, its order, target, and intended outcome — these come from project.md through the interpreter"
        - "The generated technical composition, runtime, and deployment in config/development.yaml, outside a generation operation"
        - "The content of config/definition.yaml, outside a generation operation"
        - "The content of config/model.yaml, outside a generation operation"
        - ".interface/project.md and .interface/schema/ — inputs to the pipeline, never written by an agent"
        - ".interface/map.yaml — the file and folder map of the Interface"
        - "The State Authority itself, after its seed — this section, and its default in schema/state.yaml"
        - "Asking for tasks to be created, and asking for development or planning to be reset project-wide"

    transitions:

      - id: "S0"
        name: "generate the state file"
        from: "no state.yaml at all"
        to: "active.mode: 'not set', active.phase: 'none', and the live State Authority seeded"
        performed_by: "generation operation"
        authorized_by: "The human's request for generation, on a project that has no state.yaml yet — governed by the default authority in schema/state.yaml, which authorizes its own seeding while no live state exists"
        requires:
          - "config/state.yaml does not exist. Where it does, a regeneration carries content.active and content.state_authority through untouched — a regeneration never resets the runtime state and never rewrites the live authority"
          - "content.state_authority is seeded verbatim from the default in schema/state.yaml — a state.yaml without it is not created"
        writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at, content.state_authority — seeded from the schema default — and the blockers and questions the generation raised"
        refused_when: "state.yaml already exists. Rewriting active values another operation or the human set, or rewriting a live authority, is outside generation authority"

      - id: "S1"
        name: "enter planning"
        from: "any value of active.mode, 'not set' included"
        to: "active.mode: planning, active.phase: the phase id named by the invocation"
        performed_by: "planning operation"
        authorized_by: "The human's planning request, which names exactly one project phase"
        requires:
          - "The named phase is indexed under content.phases in definition.yaml"
          - "The named phase's target in definition.yaml resolves to a selected component in development.yaml and a mapped generated item configuration"
          - "The invocation names exactly one phase id"
        writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
        refused_when: "The request omits the phase, names more than one phase, names a phase the Understanding does not index, or requests a mode other than planning. The operation stops and tells the human; it does not adjust the state to fit"

      - id: "S2"
        name: "enter development"
        from: "any value of active.mode, 'not set' included"
        to: "active.mode: development, active.phase: the phase id named by the invocation"
        performed_by: "development operation"
        authorized_by: "The human's development request, which names exactly one project phase"
        requires:
          - "The named phase is indexed under definition.yaml content.phases and has a matching plan under task.yaml content.plans"
          - "The phase plan holds at least one task — a phase with nothing to build is not entered"
          - "Every earlier project phase is complete: each has a non-empty plan, every task not cancelled or superseded is done, and none remains todo, claimed, or blocked"
          - "The named phase's target in definition.yaml resolves to a selected component in development.yaml and a mapped generated item configuration"
        writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
        refused_when: "The request omits the phase, names more than one phase, the phase has no non-empty plan, an earlier phase is incomplete, its target cannot be resolved, or requests a mode other than development"

      - id: "S3"
        name: "enter review"
        from: "any value of active.mode, 'not set' included"
        to: "active.mode: review, active.phase: the phase id named by the invocation"
        performed_by: "review operation"
        authorized_by: "The human's review request, which names exactly one project phase"
        requires:
          - "The named phase is indexed under definition.yaml content.phases and has a matching non-empty plan under task.yaml content.plans"
          - "The named phase's target in definition.yaml resolves to a selected component in development.yaml and a mapped generated item configuration"
        writes: "active.mode, active.phase, active.mode_reason, active.set_by, active.set_at"
        refused_when: "The request omits the phase, names more than one phase, names an unplanned phase, its target cannot be resolved, or requests a mode other than review"

      - id: "S4"
        name: "record the outcome of a run"
        from: "the mode the run was performed in"
        to: "the same mode and the same phase — only active.mode_reason and active.set_at change"
        performed_by: "planning, development, or review operation — each for its own run"
        authorized_by: "Finishing the run the human invoked"
        requires:
          - "The run has finished, and what is recorded is what it actually did or was stopped by"
        writes: "active.mode_reason, active.set_at"
        refused_when: "The operation did not perform the run"

      - id: "S6"
        name: "human override"
        from: "any"
        to: "any"
        performed_by: "the human, editing state.yaml directly"
        authorized_by: "The human, who needs no transition"
        requires: []
        writes: "any field of state.yaml — this section included"
        refused_when: "Never. An agent does not contest, revert, or correct a value the human wrote — where the human's value disagrees with a request, the operation stops and asks"

      - id: "S7"
        name: "raise or release a blocker"
        from: "any mode, and a generation run outside the modes"
        to: "the same mode"
        performed_by: "generation, planning, development, or review operation"
        authorized_by: "The work itself — only a critical condition that prevents safe authorized continuation may become a blocker"
        requires:
          - "The condition meets the critical threshold supplied by the active agent integration; ordinary missing implementation detail does not"
          - "The blocker states what is missing, never a guess at a human-owned answer"
          - "A blocker is removed only once the critical condition is resolved in its owning configuration, interface, code, evidence, or human decision"
        writes: "content.blockers, and the blocker field of the task it stops"
        refused_when: "Removing a blocker whose decision_belongs_to is the human, before the human has decided"

      - id: "S8"
        name: "raise a question, or record the human's answer"
        from: "any mode, and a generation run outside the modes"
        to: "the same mode"
        performed_by: "generation, planning, development, or review operation"
        authorized_by: "A critical human-owned decision found while working, or an answer the human has stated"
        requires:
          - "Raising: the decision meets the critical threshold supplied by the active agent integration, the question is stated so it can be answered, and why_it_matters names what materially depends on it"
          - "Recording: the answer written into answered_so_far is the human's, dated, and in the human's own terms"
        writes: "content.open_questions.questions, and answered_so_far on an existing question"
        refused_when: "Raising a non-critical implementation question that Agent discretion can resolve; or recording an answer that came from the Agent, from the code, or from what merely seems reasonable after the question was correctly classified as human-owned"

      - id: "S9"
        name: "reset development or planning project-wide"
        from: "any mode or 'not set'"
        to: "For development reset, every generated Task is todo and active is planning / none. For planning reset, every phase Plan has empty groups and active is 'not set' / none. For both stages, State blockers and open questions are empty"
        performed_by: "reset operation"
        authorized_by: "The human's reset request naming exactly one reset stage: development or planning"
        requires:
          - "task.yaml exists, every phase in definition.yaml has its matching Plan shell, and at least one generated Task exists"
          - "The invocation supplies exactly one supported stage and no phase id"
          - "No generated Task is claimed; active work is never reset underneath its owner"
          - "For development reset, every generated Task status becomes todo, every Task blocker field is removed, every prior Task log remains append-only, and one dated reset entry is appended to each Task"
          - "For planning reset, groups becomes an empty mapping in every phase Plan, removing every generated Group and Task while preserving the Plan shells"
          - "For either reset stage, content.blockers and content.open_questions.questions become empty lists; clearing is not an answer, and later work raises again anything still unresolved"
        writes: "content.active.mode, content.active.phase, content.active.mode_reason, content.active.set_by, content.active.set_at, content.blockers, content.open_questions.questions; and the project-wide Task reset defined by task.yaml content.task_states.reset_protocol"
        refused_when: "The invocation is missing, names a phase, has more than one argument, or is not development or planning; task.yaml or a Plan shell is missing; no generated Task exists; a Task is claimed; or the complete mutation cannot be validated before writing"

      - id: "S10"
        name: "materialize or reconcile the Task frame"
        from: "Any runtime state, including immediately after S0; task.yaml may or may not exist"
        to: "The same runtime State, with the current Task frame and exactly one Plan shell for every project phase"
        performed_by: "generation operation"
        authorized_by: "The human's request for generation or regeneration"
        requires:
          - "The complete candidate Definition and Task reconciliation is resolved and validated in memory before any generated file is written"
          - "task_schema and task_states are materialized from the current mapped Task Schema"
          - "Every project phase receives one Plan shell whose id, title, order, target, and does agree with the candidate Definition and whose groups mapping is empty when the shell is new"
          - "An existing non-empty Plan is preserved byte for byte when its source phase is unchanged"
          - "A changed phase may be reconciled automatically only while its existing groups mapping is empty"
        writes: "The mapped generated task.yaml — task_schema, task_states, a missing Plan shell, or the identity fields of an existing empty Plan shell only. This transition writes no State field"
        refused_when: "Generation would create a Group or Task; alter or delete any existing Group or Task; remove a phase whose Plan contains Tasks; change the identity, order, target, or intended outcome of a phase whose Plan contains Tasks; change active, state_authority, or any other State field; or the complete candidate cannot satisfy Task and State validation before writing"

    validation:
      note: "These must hold at all times. Any operation may check them; the review operation checks them as part of a review, and a failure is a blocker, not a repair"
      checks:
        - "active.mode holds a mode named under content.state_authority.modes, or 'not set'"
        - "active.phase holds a phase id indexed under content.phases in definition.yaml, or 'none'"
        - "When active.phase is not 'none', its target in definition.yaml resolves to a selected component in development.yaml and a mapped item configuration; active.target is derived from that phase and is never stored"
        - "active.set_by names either the human or an operation listed as writable_by for the field it wrote"
        - "Every state change an agent made corresponds to exactly one transition above"
        - "An operation's mode matches the mode it owns under content.state_authority.modes, except for the explicit S9 development-reset result of planning / none; an operation performing another operation's work remains a fault"
        - "Each plan key is a phase id from definition.yaml; its id, title, order, target, and goal-derived meaning match that phase"
        - "Every phase in definition.yaml has exactly one Plan shell in task.yaml, and task.yaml has no Plan whose phase is absent from definition.yaml"
        - "No open question carries an answer that no human gave"
        - "content.state_authority was seeded verbatim from the schema default and has changed only by the human's hand since — a difference an agent made is a fault, not a state to repair"

  # <!-------------------------------------------- active -->
  active:
    mode: "not set"
    mode_reason: "No workflow operation has been requested yet. The generation operation created this file under transition S0 while interpreting project.md; it entered no mode and selected no phase."
    phase: "none"
    set_by: "generation operation — acting on the human's request to interpret project.md"
    set_at: "2026-09-05"

  # <!-------------------------------------------- blockers -->
  blockers: []

  # <!-------------------------------------------- open_questions -->
  open_questions:
    note: "These are addressed to the human. An agent raises a question and records the human's answer; it never supplies one."
    questions: []
