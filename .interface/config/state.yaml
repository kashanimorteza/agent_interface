# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Active Workflow position, aggregate phase progress, and the project's recorded execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema; reconciliation preserves existing operational records and never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress by stable Target phase identifier, then log for recorded execution history."
  selection: "A requested phase resolves to the phases entry keyed by that phase identifier; a Log Entry resolves by its id."
  absence: "No matching phases entry means no State is recorded for that phase; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its phase when applicable, and its provenance."
  phases: "Aggregate operation progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

