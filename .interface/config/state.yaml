# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State record in the Config boundary: active Workflow position, aggregate phase progress, and the execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema. Existing operational records are preserved and never replaced with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases by stable Target phase identifier for aggregate progress, and log for recorded execution history."
  selection: "A requested phase resolves to the entry keyed by that phase identifier; a Log Entry resolves by its id."
  absence: "No matching phase entry means phase reconciliation has not recorded that phase; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Active Workflow position: Mode, phase, reason, who set it, and when."
  phases: "Aggregate operation progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

