          - "SQLModel derives table names from class names, so the User Entity maps to a table named user, which is a reserved word in some database engines. Database (phase P2) chooses its engine and should account for this."
          - "SQLite stores decimals with a fixed scale (1.10 returns as 1.1000000000) and normalizes datetimes to UTC; both are storage behaviours for Database to handle."
