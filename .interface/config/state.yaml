meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State: active Workflow position, aggregate phase progress, and the recorded execution Log."

policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; State owns the active Workflow position, aggregate phase progress, and the operational Log."

resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress by stable Target phase identifier, and log for the recorded execution history."
  selection: "A phase resolves to the entry keyed by its stable Target phase identifier; a Log Entry resolves by its sequential id."
  absence: "A missing phase entry means no aggregate progress has been recorded for it; an empty log means no execution has been recorded."

read_order: ["active", "phases", "log"]

content_map:
  active: "Current Workflow mode, its phase, and why and when it was set."
  phases: "Aggregate operation progress keyed by stable Target phase identifier."
  log: "The preserved history of recorded Skill executions and their outcomes."

