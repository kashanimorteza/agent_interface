# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "The State Config record: the active Workflow position, aggregate Phase progress, and the project's recorded Skill execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; reconciliation never replaces them with defaults. State never holds Target meaning, technical decisions, individual Task status or history, product code, secrets, or command transcripts."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, then phases for aggregate progress, then log for recorded execution history."
  selection: "A phase resolves to the record keyed by its stable Target phase identifier; a Log Entry resolves by its project-wide sequential id."
  absence: "An absent phase record means no progress has been recorded for that phase; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its Phase when applicable, and its provenance."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

