# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/state.yaml
  path_note: 'Generated configuration of the State Component — the available Workflow modes, the current active State, critical Blockers, and Open Questions. Shape: schema/state.yaml; rules: principles/state.md; the State Preferences layer is empty'
  standard: Agent Project Interface
  schema_version: '10.0'
  created: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: 'Every Workflow operation records its own active mode, optional phase, reason, provenance, and time when it runs, and may raise, update, or release Blockers and Open Questions it encounters. No operation rewrites project meaning, Task content, or another Component''s information through this file. Active State is descriptive, not an authorization gate: no transition graph restricts which mode may follow another, and every operation is repeatable'
  changed_by: The configuring, planning, and development operations for their own runs; the reset operation as its fixed script defines; the human directly
  modes: The available modes are fixed by principles/state.md and located by interface.yaml; this file records them so State is understandable on its own
  questions: An operation raises an Open Question only for a critical decision it cannot safely resolve, and records only an answer the human supplied. It never invents the human's answer


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- modes
- active
- blockers
- open_questions


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  modes: The initial mode and the available Workflow modes with their meanings
  active: The current or most recently entered Workflow position, with reason, provenance, and time
  blockers: Unresolved critical conditions preventing safe or valid continuation, keyed by identifier
  open_questions: Unresolved critical questions that require a human decision, keyed by identifier


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- modes -->
  modes:
    initial: not set
    available:
      not set:
        purpose: The resting State before any Workflow operation has been recorded. It represents no operation.
        phase_specific: false
        repeatable: false
      configuring:
        purpose: Project Understanding is being generated or refreshed from project.md into the generated configuration of every Component.
        phase_specific: false
        repeatable: true
      planning:
        purpose: Plans, Groups, and Tasks are being generated or reconciled for one requested project phase.
        phase_specific: true
        repeatable: true
      development:
        purpose: Eligible planned Tasks are being implemented and verified for one requested project phase.
        phase_specific: true
        repeatable: true

  # <!-------------------------------------------- active -->
  active:
    mode: development
    phase: P3
    mode_reason: 'The human requested development of phase P3 (Frontend) again. The development operation re-checked the toolchain: Node.js 24 LTS with npm 12.0.2 is still not installed (Blocker B2 remains), so no P3 Task is eligible and nothing in frontend/ was created.'
    set_by: development operation (my-interface-developer) — acting on the human's request to develop P3
    set_at: '2026-09-06T11:25:35+03:30'

  # <!-------------------------------------------- blockers -->
  blockers:
    B1:
      id: B1
      blocks: Completion of Task P2-G5-T3 (Generic Model routers for every Model) and therefore completion of phase P2.
      what_is_missing: 'A passing run of the Task''s verify command. Its final assertion introspects app.routes for objects carrying operation_id, but FastAPI 0.141.1 includes routers lazily as _IncludedRouter objects, so app.routes never exposes route operation ids and that assertion fails regardless of the implementation. Every functional assertion before it passed, and the P2-G5-T4 verify proved all 65 operation ids unique through /openapi.json.'
      consequence: Development may not mark a Task done without a passing verify and may not change the Plan, so the Task stays blocked although its implementation is complete and functionally verified.
      resolution_owner: The planning operation (re-run /my-interface-tasker P2 so the verify checks operation ids through the OpenAPI document instead of route introspection) or the human.
      raised_at: '2026-09-06T04:20:11+03:30'

  # <!-------------------------------------------- open_questions -->
  open_questions: {}
