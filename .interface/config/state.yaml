# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Operational State Config in the Config directory: active Workflow position, aggregate Phase progress, and recorded execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; State Principles define record meaning and ownership."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read the active Workflow position, then the Phase progress keyed by stable Target phase identifier, then the execution log."
  selection: "A requested phase resolves to the entry keyed by that phase identifier; a Log Entry resolves by its identifier."
  absence: "No matching Phase entry means no aggregate progress has been recorded for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The active Workflow position: mode, phase, reason, setter, and time."
  phases: "Aggregate operation progress for each Target phase."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

