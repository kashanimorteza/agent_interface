        passes:
          - pass: 1
            outcome: "not satisfied"
            findings_raised: ["F1", "F2", "F3", "F4", "F5", "F6"]
          - pass: 2
            outcome: "not satisfied"
            reviewer: "fresh independent read-only Agent Instance; own probes"
            confirmed_holding: ["F2", "F4 (cited routes)", "F5", "F6", "F3 (cited case)", "F1 (every Entity-owned route, 15 Entities, about 1900 failing calls)"]
            findings_raised: ["N1", "N2", "N3"]
          - pass: 3
            outcome: "satisfied"
            reviewer: "fresh independent read-only Agent Instance; tightly scoped to N1-N3 plus a bounded regression hunt; own probes"
            confirmed_holding: ["N1 (nine routes plus legitimate values)", "N2 (every guaranteed route clean on 15 Entities; residual routes as documented)", "N3", "all 15 Declarations against the Target", "README tables and executable examples"]
            findings_raised: ["G1", "G2"]
          - pass: 4
            outcome: "satisfied"
            reviewer: "primary Agent, direct recheck of G1 and G2 only, plus the complete verification battery re-run on the final state"
            scope: "G1, G2 and regression of everything else"
        findings:
          - id: "F1"
            severity: "blocking"
            kind: "defect"
            state: "resolved_for_entity_routes_residual_recorded_as_N2"
            pass2_note: "Pass 2 confirmed no view leaks on any Entity-owned route; residual on pydantic routes that never reach the Entity recorded as N2."
            resolution: "Overrode model_validate_json and model_validate_strings on the shared Entity base so that any failure, including text that is not valid JSON, is rebuilt with type, location and message but no input. Recheck: unparsable and malformed JSON text carrying a canary value, through every entry path, across all 15 Entities: no view (str, repr, json(), errors(), errors(include_input=True), context, cause) contains it. The extended T5 sensitivity check now includes these paths. Files: model/src/model/core/_entity.py."
            title: "Malformed JSON text leaks the whole input, including sensitive values, through errors() and json()"
            expected: "A sensitive value is never echoed in validation diagnostics (Model Principle: Sensitivity remains metadata; Plan P1-G10-T5 acceptance)."
            observed: "For model_validate_json on text that is not valid JSON, str(error) is clean but errors() and json() carry the raw JSON text as input, including the password value. The JSON parse failure occurs before the wrapping validator can rebuild the error."
            evidence: "Probe: User.model_validate_json('{\"password\":\"SECRETPW\"} SECRETPW') then error.json() and repr(error.errors()) both contain SECRETPW (reproduced independently; syntax-error variant also leaks). Location: the wrapping validator in model/src/model/core/_entity.py only wraps handler(data)."
            missing_evidence: "P1-G10-T5's recorded check exercised no malformed-JSON path, so its outcome did not establish the condition for that path."
          - id: "F2"
            severity: "should-fix"
            kind: "defect"
            state: "resolved"
            pass2_note: "Pass 2 confirmed rejection on every route tried, including subclasses, other Entity instances, mapping types and TypeAdapter."
            resolution: "The generated-value refusal now also applies when the raw input is an object carrying the identity as an attribute (including a null identity); an existing Entity of the same class is not treated as supplied input. Recheck: refused across all 15 Entities for from_attributes with and without strict; an object without an id is accepted. Files: model/src/model/core/_entity.py."
            title: "A generated identity can be supplied through model_validate(obj, from_attributes=True)"
            expected: "A caller-supplied Auto Increment value is rejected on every construction path; the documentation says model_validate is included."
            observed: "The generated-value refusal returns early for non-mapping input, so an object carrying an id attribute sets id on a fresh Entity."
            evidence: "Probe: class O with id=77 and the required attributes; User.model_validate(O(), from_attributes=True).id returns 77 (reproduced independently). Location: the before-validator in model/src/model/core/_entity.py."
          - id: "F3"
            severity: "should-fix"
            kind: "defect"
            state: "resolved_residual_recorded_as_N1"
            pass2_note: "Pass 2 confirmed integers are refused everywhere and legitimate floats accepted; residual conversion of non-float numeric objects recorded as N1."
            resolution: "Float Fields now refuse integers and booleans (a before-validator on the shared Float type). from_json restores a whole JSON number for a float Field only when it is exactly representable, as a float; larger, huge, boolean, text and non-finite values are rejected. Documented in the README Use section and Troubleshooting. Recheck: construction, assignment, model_copy and from_json on Asset.point_size. Files: model/src/model/core/_types.py, foundation.py, README.md."
            title: "Float Fields silently coerce int to float and can change the value"
            expected: "Field contracts are enforced without implicit coercion (Model Principle: Construction and mutation enforce Field contracts; documentation says without coercion)."
            observed: "An int is accepted for a float Field and stored as a float; 2**53+1 is stored as 2**53, silently changing the value."
            evidence: "Probe: Asset(broker_id=1, symbol='s', category='c', point_size=2**53+1).point_size == 2**53+1 is False (reproduced independently). Location: Float alias in model/src/model/core/_types.py."
          - id: "F4"
            severity: "minor"
            kind: "defect"
            state: "resolved_residual_recorded_as_N3"
            pass2_note: "Pass 2 confirmed del and model_copy enforcement; residual bypass through the deprecated copy() recorded as N3."
            resolution: "Added __delattr__ refusing deletion of any declared Field and made model_copy apply each update through the same assignment enforcement; documented that pydantic's non-validating model_construct is outside the contract. Recheck across all 15 Entities: every declared Field deletion refused, valid and invalid updates handled, assigned id immutable on the copy, unknown update key refused, original untouched. Files: model/src/model/core/_entity.py, README.md."
            title: "Field enforcement can be bypassed by deleting an attribute or by model_copy(update=...)"
            expected: "An immutable Field cannot change and Field rules apply identically to every change (Model Principle: Construction and mutation enforce Field contracts)."
            observed: "del entity.id succeeds on an assigned identity; model_copy(update={'name': 123}) and model_copy(update={'id': 7}) return Entities holding unvalidated values."
            evidence: "Probe on an Entity with id assigned: delattr(entity, 'id') raises nothing; entity.model_copy(update={'name': 123}).name == 123; entity.model_copy(update={'id': 7}).id == 7 (reproduced independently). Location: model/src/model/core/_entity.py overrides only __setattr__."
          - id: "F5"
            severity: "minor"
            kind: "defect"
            state: "resolved"
            pass2_note: "Pass 2 confirmed every guard and that all 15 shipped Declarations still conform to the Target."
            resolution: "FieldDeclaration now validates type, sensitivity and value generation membership, auto-increment only on integers, constraint keys and size values, and that a default has exactly the Field's type (time-zone-aware for datetimes) and size; Declaration rejects a local Field appearing in more than one Relation; the class-creation check now also compares default type. Recheck: 10 wrong-default cases, unknown names, bad constraints, repeated relation Field all rejected; valid declarations accepted. Files: model/src/model/core/declaration.py, _entity.py."
            title: "Declaration integrity guards are incomplete"
            expected: "Every default satisfies its Field contract and contradictory values fail; participating Fields are not repeated (Model Principles: Fields preserve a complete value contract; Entity Metadata resolves completely)."
            observed: "A string default is accepted for an integer Field; an unknown type name is accepted; one local Field can carry two Relations."
            evidence: "Probe: FieldDeclaration('x','integer',nullable=False,has_default=True,default='a') is accepted; FieldDeclaration('x','bogus',nullable=False) is accepted; a Declaration with Relation('id','A','id') and Relation('id','B','id') is accepted (reproduced independently). Location: model/src/model/core/declaration.py. All shipped Declarations are correct; the gap is in the guard."
          - id: "F6"
            severity: "minor"
            kind: "defect"
            state: "resolved"
            pass2_note: "Pass 2 confirmed rejections and canonical acceptances, and lossless round trip of sign, exponent and digits."
            resolution: "from_json now accepts decimal text only in plain ASCII decimal or exponent form; whitespace, underscores, non-ASCII digits and other forms are rejected. Recheck: 17 malformed and 7 canonical texts on every decimal Field. Files: model/src/model/core/foundation.py; README Use section."
            title: "from_json accepts non-canonical decimal text"
            expected: "Foundation rejects malformed Objects and incompatible values; decimals travel as text such as 10.50."
            observed: "Decimal text with surrounding whitespace or underscores is accepted and normalized."
            evidence: "Probe: Account.from_json with balance ' 1 ' returns Decimal('1') and with '1_0' returns Decimal('10') (reproduced independently). Location: model/src/model/core/foundation.py."
          - id: "N1"
            severity: "should-fix"
            kind: "unmet-requirement"
            state: "resolved"
            pass3_note: "Pass 3 confirmed on nine validation routes and legitimate float values including -0.0, subnormals and float subclasses."
            resolution: "Float now refuses anything that is not already a float (integers, booleans, Decimal, Fraction, objects defining __float__, text, bytes, containers); genuine floats including -0.0, subnormal and near-maximum values and float subclasses are accepted; whole JSON numbers via from_json remain the documented exact-representation exception. Recheck: construction, assignment, model_copy, copy, model_validate, from_json and JSON validation on the float Field, plus legitimate values. Files: model/src/model/core/_types.py, README.md."
            raised_in_pass: 2
            title: "A float Field silently converts Decimal, Fraction and any object with __float__"
            expected: "Enforcement without implicit coercion (Model Definition: Construction and mutation enforce Field contracts; Plan P1-G2-T2 expected result); the documentation states float Fields hold only float values."
            observed: "The Float type refuses only integers, so other numeric objects are converted to float."
            evidence: "Probe: Asset(broker_id=1, symbol='s', category='c', point_size=Decimal('0.1')).point_size is 0.1 (a float); Fraction(1,2) gives 0.5; an object defining __float__ gives 2.5; same on model_validate and assignment. Location: model/src/model/core/_types.py, the before-validator on Float."
          - id: "N2"
            severity: "should-fix"
            kind: "unmet-requirement"
            state: "resolved_by_narrowing_claim_with_recorded_decision"
            pass3_note: "Pass 3 confirmed the guaranteed routes are clean and the residual routes leak as documented. Pass 3 showed that replacing an Entity's __pydantic_validator__ with a sanitizing proxy, and overriding parse_raw, could close two of the residual routes (not composite adapters such as TypeAdapter(list[User])). Decision recorded: not adopted. The proxy depends on pydantic internals, is reset by model_rebuild, would leave composite adapters open, and would raise the guarantee only from 'Entity-owned routes' to 'most routes'; the documented, exact boundary is kept. The Human may direct otherwise."
            resolution: "Not closable inside Model: for text that cannot be parsed as JSON, pydantic-core raises during parsing before any schema or Entity code runs, so TypeAdapter, an Entity's raw __pydantic_validator__ and the deprecated parse_raw cannot be intercepted by the Entity. Resolved by making the documented claim exact: the README now guarantees withheld input only for the Entity's own methods, names the pydantic routes outside that guarantee, and tells consumers to use the Entity's methods when text may hold a sensitive value. Recheck: the guaranteed routes are clean on the canary, the named residual routes behave as documented, and the documentation names them. Files: model/README.md."
            raised_in_pass: 2
            title: "Input echo remains on pydantic routes that never reach the Entity (TypeAdapter and the raw validator on unparsable JSON text; deprecated parse_raw)"
            expected: "A sensitive value is never echoed in validation diagnostics (Model Definition: Sensitivity remains metadata); the documentation claims failures never carry the caller's input, including for text that is not valid JSON."
            observed: "For unparsable JSON text passed to TypeAdapter(User).validate_json(...), to User.__pydantic_validator__.validate_json(...), or to the deprecated User.parse_raw(...), errors() and json() contain the raw text. The failure occurs during JSON parsing in pydantic itself, before any Entity code can run, so the Entity-level wrappers cannot see it."
            evidence: "Reviewer probes reproduced on all 15 Entities; the claim in model/README.md (Use section) is broader than what holds."
          - id: "N3"
            severity: "minor"
            kind: "defect"
            state: "resolved"
            pass3_note: "Pass 3 confirmed enforcement, include/exclude refusal, and copy.copy, deepcopy and pickle behaviour."
            resolution: "Overrode the deprecated copy so it applies updates through the same enforcement as model_copy and rejects include and exclude; documented alongside model_copy and added construct to the outside-the-contract note. Recheck across all 15 Entities: valid update accepted, wrong-type and immutable-id and unknown-key updates refused, include and exclude refused, plain and deep copies equal, pending id assignable on the copy only. Files: model/src/model/core/_entity.py, README.md."
            raised_in_pass: 2
            title: "The deprecated copy(update=...) bypasses assignment enforcement"
            expected: "An immutable Field cannot change and Field rules apply identically to every change (Model Definition); the documentation says updated values go through assignment rules."
            observed: "model_copy was overridden but the deprecated BaseModel.copy was not."
            evidence: "Probe: with an assigned id, e.copy(update={'name': 5, 'id': 9}) returns an Entity with id 9 and name 5 and no error. Location: model/src/model/core/_entity.py (no override of copy)."
          - id: "G1"
            severity: "minor"
            kind: "defect"
            state: "resolved"
            resolution: "Both datetime and decimal decode failures in from_json are now raised outside the exception handler, so the failure carries no __cause__ or __context__. Recheck: 96 failing from_json calls across every decimal and datetime Field of all 15 Entities have empty exception chains and no view containing the canary; the reviewer's own probe (Position.from_json with a bad date) shows both empty. Files: model/src/model/core/foundation.py."
            recheck: "Direct reproduction of the reviewer's probe and an extended check across all Entities; not a further independent pass, because both are minor and the change is a restructure of two raise sites and one documentation sentence."
            raised_in_pass: 3
            title: "from_json on a datetime Field leaves the input text in the failure's __context__"
            expected: "Rejections do not expose a sensitive value (Plan P1-G2-T2; Model Definition: Sensitivity remains metadata); the documentation says a failure through from_json never carries the caller's input."
            observed: "The datetime failure is raised while handling the parser's own exception, so the original error, whose message quotes the text, remains reachable as __context__ although the traceback hides it."
            evidence: "Probe: Position.from_json({'date': 'CANARYSECRET'}) raises a clean ValidationError whose __context__ is the ValueError quoting the text. Location: model/src/model/core/foundation.py, the datetime decode (the decimal decode has the same shape but its context carries no text)."
          - id: "G2"
            severity: "minor"
            kind: "defect"
            state: "resolved"
            resolution: "README now states that parse_raw also shows the raw text in str() and repr() (TypeAdapter and the raw validator: errors() and json()), and that copy refuses include and exclude. Recheck: the README contains the exact statements and the documented parse_raw exposure is observable. Files: model/README.md."
            recheck: "Direct reproduction of the reviewer's probe and an extended check across all Entities; not a further independent pass, because both are minor and the change is a restructure of two raise sites and one documentation sentence."
            raised_in_pass: 3
            title: "README understates the parse_raw exposure"
            expected: "The README states accurately which routes are outside the input-withholding guarantee."
            observed: "The README says the residual routes report the raw text in errors() and json(); for the deprecated parse_raw the text also appears in str() and repr()."
            evidence: "Probe: User.parse_raw('{CANARYSECRET}') shows input_value='{CANARYSECRET}' in str(error). Location: model/README.md, Use section."
        observations_about_the_review:
          - "A time-zone-aware datetime with a named zone loses the zone identity on a JSON round trip (offset and instant preserved); the documentation only promises time-zone-aware."
          - "Unknown caller key names appear in error locations (names, not values)."
          - "repr(entity) shows sensitive values; consistent with preserving values and not a validation or generation diagnostic."
          - "The regeneration evidence for P1-G10-T8 used transient scripts kept outside the repository, so it cannot be repeated by a reader who lacks them."
          - "Pass 2: errors() reports input None for every failure because inputs are withheld; cosmetic."
          - "Pass 2: model_validate_json cannot succeed for Entities with decimal or datetime Fields because strict mode rejects JSON strings for those types; text parsing is outside Model, so by design."
          - "Pass 3: unknown caller key names appear as error locations (names, not values); the README does not mention that copy(include/exclude) is refused; Entity.copy no longer emits pydantic's deprecation warning."
          - "Pass 2: re-calling __init__ on an existing Entity resets a generated identity, and private or dunder attributes can be set; pydantic behaviour outside the contract."
