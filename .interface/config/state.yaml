# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Operational State: active Workflow position, aggregate Phase progress, and the recorded execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema. Reconciliation preserves existing operational records and never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress by stable Target phase identifier, and log for recorded execution history."
  selection: "A phase resolves to the entry keyed by its stable Target phase identifier; a Log Entry resolves by its sequential identifier."
  absence: "An empty phases mapping means no Phase identities have been reconciled; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current Workflow Mode, phase, reason, and who set it and when."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

