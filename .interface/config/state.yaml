# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable Workflow position, aggregate phase progress, and the Skill execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and State Principles; preserve existing operational records and never replace them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress by stable Target phase identifier, and log for recorded Skill executions."
  selection: "A phase resolves to the record keyed by its Target phase identifier; a Log Entry resolves by its project-wide sequential identifier."
  absence: "A phase without a record has not been reconciled into State; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its Phase when applicable, and its provenance."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "not set"
    phase: null
    mode_reason: "No Workflow operation has been recorded."
    set_by: "initialization"
    set_at: null
  phases: {}
  log:
    - id: "001"
      skill: "my-interface-configure"
      parent_id: ""
      phase: null
      event: "configure"
      outcome: "completed"
      started_at: "2026-09-26T19:32:06Z"
      completed_at: "2026-09-26T19:32:27Z"
      duration: "20 seconds"
      token_usage:
        input: null
        output: null
        total: null
      skills_used: []
      open_questions: []
      blockers: []
      report: "Generated application.yaml, plan.yaml, and state.yaml from their Schemas; each conforms to the general YAML frame and its specialized Schema. No Config record existed beforehand."
      data:
        duration_ms: 20425
        records_created:
          - "application.yaml"
          - "plan.yaml"
          - "state.yaml"
        decisions:
          - "The State Schema declares no generation block, so State's frame fields (path_note, policy, resolution, content_map) were derived from its structure, purposes, and the State Principles; read_order is its declared structure."
          - "phases stays empty as the State Schema's initial content declares; phase identities are populated during Phase reconciliation, not by Configure."
        schema_gap: "state.yaml under .interface/foundation/schema/ lacks a generation block like application.yaml and plan.yaml have. It is human-owned and left unchanged."
