# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State: active Workflow position, aggregate Phase progress, and the execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and State Principles; preserve existing operational records and never replace them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress by stable Target phase identifier, then log for recorded execution history."
  selection: "A requested phase resolves to the phases entry keyed by its stable Target phase identifier; a Log Entry resolves by its project-wide sequential id."
  absence: "A missing phases entry means the phase identity has not been reconciled; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current or most recently recorded Workflow Mode, its Phase when applicable, and its provenance."
  phases: "Aggregate Planning, Development, and Review progress for each stable Target phase identifier."
  log: "Preserved history of recorded Skill executions and their outcomes."

