      report: "Reviewed phase P1 (Model) against its current Plan, the Model Definition and the Target. Two independent reviewers examined non-overlapping scopes; Review reproduced every reported item itself before recording it, and found nothing further by direct probing. Recorded 9 Findings (7 defects, 2 missing-evidence). Resolved 8 by changing the reviewed Source or documentation and re-verifying with the full regression suite each time (format, lint, strict types, 124-Field behaviour, documentation, packaging, repeatability all still pass). One (F8, gate 15 Publication has no recorded evidence) could not be resolved without reconstructing missing process history, which the Missing evidence Principle forbids; it is left open as OQ1. Outcome: not satisfied, pending OQ1.\n\nProcess note: this execution accidentally truncated its own Log Entry with a Python one-liner that opened the file in write mode before an error in the same expression. It was reconstructed from the content built and verified earlier in this same execution, re-validated against the State Schema and against every fact this report states."
      data:
        phase_selection: "Argument 1 resolved to Target phase P1 (Model)."
        method: "Two independent read-only reviewers with fresh context examined non-overlapping scopes (A: shared behaviour, Entities, Interface and metadata; B: package, documentation, evidence quality). Review also read the core Source and probed it directly. Every reported item was reproduced by Review before being recorded, and reviewer reports were treated as inputs, not proof."
        findings:
          - id: "F1"
            title: "Deleting a Field bypasses immutability and nullability"
            kind: "defect"
            severity: "medium"
            refs: "P1.G2.T4 acceptance and verify; Model Definition: an immutable Field, including an assigned identity, cannot change"
            expected: "An immutable Field cannot be changed and a non-nullable Field never holds null (P1.G2.T4)."
            observed: "del on an Entity attribute succeeded: with an assigned identity, del broker.id made the identity read back as null; del broker.name left a non-nullable Field null and to_json reported it."
            evidence: "core/base.py defined __setattr__ but no __delattr__. Reproduced with: b = Broker(name='b', user_id=1, id=7); del b.id; b.id gave None. Reproduced by Review and by reviewer A."
            raised_by: "reviewer A, reproduced by Review"
            state: "resolved"
            resolution: "Added Entity.__delattr__ to core/base.py: deleting a Field now raises ValueError naming the Entity and Field and leaves every value unchanged, for both fresh and ORM-persistent instances. Re-verified directly (del on every Field of a live Entity, and on a committed, refreshed, expired, updated, merged and deleted ORM row) and by the full regression suite (39+57+124-Field behaviour + repeatability), all passing."
          - id: "F2"
            title: "from_json accepts non-canonical decimal and datetime strings"
            kind: "defect"
            severity: "low"
            refs: "P1.G2.T6 acceptance (malformed input is rejected); Model Definition Foundation principle (decimal is an exact base-10 string, datetime is ISO 8601)"
            expected: "A string that is not a base-10 decimal or an ISO 8601 date-time is rejected."
            observed: "Decimal strings with underscores, surrounding spaces and non-ASCII digits were accepted ('1_0' gave 10, ' 1.5 ' gave 1.5, Arabic-Indic digits gave 123). Datetime strings without a time or in other layouts were accepted ('2024-01-01' became midnight; '2024-01-01 10:00', '2024-W01-1' and '20240101T100000' were accepted)."
            evidence: "core/foundation.py _decode passed the value to Decimal(...) and datetime.fromisoformat(...) without checking its shape. Reproduced with TrailingRule.from_json (trigger_percentage) and Position.from_json (date). Reproduced by Review and by reviewer A."
            raised_by: "reviewer A, reproduced by Review"
            state: "resolved"
            resolution: "core/foundation.py now checks the exact shape (a regular expression for a base-10 decimal or an ISO 8601 date-time) before parsing, rejecting underscores, surrounding whitespace, non-ASCII digits, calendar-week and other non-canonical forms. Directly re-verified 15 rejected and 8 accepted decimal strings, 12 rejected and 5 accepted datetime strings, and that every offset and microsecond combination to_json can produce parses back through from_json."
          - id: "F3"
            title: "OverflowError escapes from_json"
            kind: "defect"
            severity: "low"
            refs: "P1.G2.T6 acceptance (malformed input is rejected); Model Definition Foundation boundary (rejection with a diagnostic)"
            expected: "An out-of-range JSON integer for a float Field is rejected with a diagnostic that names the Entity and Field."
            observed: "Asset.from_json({..., 'point_size': 10**400}) raised builtins.OverflowError ('int too large to convert to float'), which named neither the Entity nor the Field and was neither ValueError nor ValidationError."
            evidence: "core/foundation.py _decode, float branch: float(value) was unguarded. Reproduced by Review and by reviewer B."
            raised_by: "reviewer B, reproduced by Review"
            state: "resolved"
            resolution: "The float branch of core/foundation.py now catches OverflowError and raises ValueError naming the Entity and Field, like every other decoding failure. Directly re-verified with 10**400, -10**400, 2**1024 and 2**53+1, and that every exactly representable integer is still accepted."
          - id: "F4"
            title: "Documentation and docstring contradict the integer-to-float reading of from_json"
            kind: "defect"
            severity: "low"
            refs: "P1.G6.T6 and P1.G7.T5 acceptance: documentation agrees with the public Model"
            expected: "Documented statements match observed behaviour."
            observed: "README Troubleshooting said an integer is not accepted for a float and the from_json docstring said it follows the same contract as direct creation, but Asset.from_json with point_size 1 returned 1.0 while Asset(point_size=1) was rejected. The P1.G7.T5 result stated every prose claim held."
            evidence: "README.md line 567; core/foundation.py from_json docstring. Reproduced by Review; reported by reviewers A and B."
            raised_by: "reviewers A and B, reproduced by Review"
            state: "resolved"
            resolution: "Resolved together with F2 and F7. The from_json docstring and the README Foundation and Use sections now state the JSON integer-to-float exception explicitly; the README Troubleshooting example was rewritten to demonstrate it accurately. Re-verified: the documentation suite (18/18), the troubleshooting suite, and G7.T5's prose-vs-behaviour and stale-content scans all pass."
          - id: "F5"
            title: "Dead code in core/logical_type.py"
            kind: "defect"
            severity: "low"
            refs: "P1.G7.T6 acceptance; Model Definition 'Generated source and package meet selected technology standards' (no dead or duplicate code)"
            expected: "The package contains no code that nothing uses."
            observed: "validate_value, _ADAPTERS and PYTHON_TYPES, with the imports only they needed, had no caller in the package or the documentation. Only LogicalType and Float were used."
            evidence: "grep -rn 'validate_value|PYTHON_TYPES|_ADAPTERS' --include='*.py' --exclude-dir=.venv model matched only core/logical_type.py. Found independently by Review and by both reviewers."
            raised_by: "Review and reviewers A and B"
            state: "resolved"
            resolution: "Removed validate_value, _ADAPTERS and PYTHON_TYPES and their now-unused imports (TypeAdapter, ConfigDict) from core/logical_type.py; kept LogicalType and Float, the only symbols anything uses. Verified by name-level inspection of the module and a source-wide reference scan, and by ruff/pyright staying clean."
          - id: "F6"
            title: "Directly imported pydantic distributions are not declared"
            kind: "defect"
            severity: "low"
            refs: "P1.G1.T1 acceptance; Model Definition: the package declares the dependencies it needs"
            expected: "The manifest declares every distribution the source imports directly."
            observed: "pyproject.toml declared only sqlmodel, while the source imported pydantic and pydantic_core, which were present only transitively."
            evidence: "pyproject.toml dependencies; core/foundation.py line 6; core/logical_type.py lines 6-7. Reproduced by Review; reported by reviewers A and B."
            raised_by: "reviewers A and B, reproduced by Review"
            state: "resolved"
            resolution: "Declared pydantic as a direct dependency in pyproject.toml and relocked; pydantic_core was already unnecessary once F5 removed the dead code, and is no longer imported anywhere. Verified: uv.lock records pydantic as a direct dependency of the model package, and every third-party module actually imported by the source is now declared."
          - id: "F7"
            title: "Documented examples depend on a native technology exception type"
            kind: "defect"
            severity: "medium"
            refs: "P1.G6.T6 acceptance (use examples rely only on the public surface); Model Definition: native technology types do not leak as public Model concepts"
            expected: "Examples rely only on the published Model surface and standard library."
            observed: "The Use example and four Troubleshooting examples imported and caught pydantic.ValidationError. The P1.G6.T6 result noted the pydantic import and accepted it."
            evidence: "README.md lines 541, 570, 592, 614 and their except clauses. Reproduced by Review; reported by reviewer B."
            raised_by: "reviewer B, reproduced by Review"
            state: "resolved"
            resolution: "Resolved together with F2 and F4. The Use example and the four Troubleshooting examples that used to import pydantic.ValidationError now catch the published ValueError instead; no documentation example imports or names pydantic. Re-verified: every example executes and its output matches, and a direct scan confirms the README contains neither 'pydantic' nor 'ValidationError'."
          - id: "F8"
            title: "Gate 15 (Publication) has no recorded passing result"
            kind: "missing-evidence"
            severity: "medium"
            refs: "P1.G7.T8 acceptance (every applicable gate has a recorded passing result); Model Definition 'Generation failures are explicit and atomic' (candidate output is staged and published only after every check succeeds)"
            expected: "A recorded observation that candidate output replaced prior output only after all gates passed and that failure would have left the prior valid Model intact."
            observed: "The P1.G7.T8 result records gate 15 as noted rather than mechanically checked, reasoning that the Model was produced in place and no prior Model existed. No staged publication or atomicity observation is recorded."
            evidence: "P1.G7.T8 done entry in .interface/config/plan.yaml. Missing evidence is not resolved by an explanation, and the Task Log belongs to Develop."
            raised_by: "reviewer B, confirmed by Review"
            state: "open"
            resolution: null
          - id: "F9"
            title: "P1.G1.T2 records no observation for two of its contracts"
            kind: "missing-evidence"
            severity: "low"
            refs: "P1.G1.T2 verify (for each contract an observable behaviour demonstrates its outcome)"
            expected: "For every contract assessed, an observed behaviour supports the recorded outcome."
            observed: "The result asserted Entity Metadata and JSON conversion are technology-independent without an observation, and its 35 checks ran against a transient probe and not the delivered base class."
            evidence: "P1.G1.T2 done entry in .interface/config/plan.yaml. Later Tasks observe the same contracts in the delivered Model, but Review does not infer missing evidence from the implementation."
            raised_by: "reviewer B, confirmed by Review"
            state: "resolved"
            resolution: "Resolved by direct observation of the current Source, independent of the Task Log: core/declaration.py imports only dataclasses, enum, .logical_type and typing, and core/foundation.py imports only collections.abc, contextlib, datetime, decimal, .declaration, .logical_type, pydantic and typing. Neither imports sqlmodel or sqlalchemy, the assessed modeling technology, so the Declaration (Entity Metadata) and Foundation (JSON conversion) contracts do not depend on it. This observation, made by Review on the current Source, is the evidence for these two contracts."
        not_recorded_as_findings:
          - "model_copy(update=...) and model_construct do not validate: they are the technology's explicit non-validating operations, and the Model Definition defines no copy or clone semantics, so treating them as a requirement would invent one."
          - "Running pyright outside uv run cannot find the environment because the tool configuration names no environment; both reviewers hit it. The Plan does not require that invocation."
          - "The Target Size of Currency code is realized as a maximum length; both readings (exact or maximum) are consistent with the Target text. Already recorded by Develop."
        open_questions_detail:
          - id: "OQ1"
            finding: "F8"
            statement: "Gate 15 (Publication: candidate output is staged and replaces prior output only after every check passes, and a failed generation leaves the prior valid Model intact) has no recorded evidence, and Review could not obtain it. The generation tooling that produced this Model does not exist in the repository (Develop's own report says so), so the property cannot be observed on the current Source, and reconstructing a substitute generator to test it would be exactly the kind of inferred, non-authoritative evidence the Missing evidence Principle forbids. This is a genuine gap, not a defect: nothing observed contradicts the property, but nothing establishes it either."
            decision_needed: "Whether this gap is acceptable for a first-created Model (nothing existed to protect), or whether Develop should commit reusable, atomic (stage-then-replace) generation tooling to the repository so this gate becomes checkable for this and future regenerations."
        process_note: "This execution's own Log Entry was accidentally truncated to zero bytes by a Python one-liner that opened the file in write mode before an error in the same expression. It was reconstructed from the exact content built and verified earlier in this same execution and re-validated against the State Schema afterward. Nothing else was lost: Config other than this file, and every other execution's Log Entry (001-003), were not touched by the mistake."
