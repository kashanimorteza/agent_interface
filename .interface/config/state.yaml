# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable State Config: active Workflow position, aggregate phase progress, and the project's recorded execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; reconciliation never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, then phases for aggregate progress of a stable Target phase identifier, then log for recorded execution history."
  selection: "A requested phase resolves to the phases entry keyed by that phase identifier; a recorded execution resolves to the log entry with the matching id."
  absence: "A phase with no entry has no recorded progress; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its phase when applicable, and its provenance."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "not set"
    phase: null
    mode_reason: "No Workflow operation has been recorded."
    set_by: "initialization"
    set_at: null
  phases:
