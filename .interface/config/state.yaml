# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable Workflow position, Blockers and Open Questions."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Component and the active operation's ownership rules."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "blockers"
  - "open_questions"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current or most recently recorded Workflow position."
  blockers: "Unresolved critical conditions."
  open_questions: "Unresolved critical questions for the human."


# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "planning"
    phase: "phase_1"
    mode_reason: "Planning created the Plan for phase_1 (Model) from the current project definition, Principles, and Preferences after the Configure reset."
    set_by: "my-interface-tasker"
    set_at: "2026-09-07T20:49:19Z"
  blockers: {}
  open_questions: {}
