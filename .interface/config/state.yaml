# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/state.yaml
  path_note: Mutable Workflow position, Blockers and Open Questions.


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: Apply the current State Component and the active operation's ownership rules.


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- active
- blockers
- open_questions


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: Current or most recently recorded Workflow position.
  blockers: Unresolved critical conditions.
  open_questions: Unresolved critical questions for the human.


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- active -->
  active:
    mode: development
    phase: P2
    mode_reason: 'The development operation for phase 2 (P2, Database) completed: all 11 Tasks of its Plan were implemented in database/ and every verify passed, with evidence recorded in each Task''s log. No Blocker or Open Question was raised. Phase 3 (Backend) is not yet planned.'
    set_by: development operation (my-interface-developer) — acting on the human's request to develop phase 2
    set_at: '2026-09-07T12:29:03+03:30'

  # <!-------------------------------------------- blockers -->
  blockers: {}

  # <!-------------------------------------------- open_questions -->
  open_questions: {}
