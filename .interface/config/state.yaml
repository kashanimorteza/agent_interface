# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable State Config: active Workflow position, aggregate phase progress, and the preserved execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema. Reconciliation preserves existing operational records and never replaces them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress, then log for recorded execution history."
  selection: "A phase resolves to the entry keyed by its stable Target phase identifier; a Log Entry resolves by its id."
  absence: "An empty phases mapping means no phase identity has been recorded; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The active Workflow mode, phase, and the reason, author, and time of the last change."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
content:
  active:
    mode: "not set"
    phase: null
    mode_reason: "No Workflow operation has been recorded."
    set_by: "initialization"
    set_at: null
  phases: {}
  log:
    - id: "001"
      skill: "my-interface-configure"
      phase: null
      event: "configure"
      outcome: "completed"
      started_at: "2026-09-25T16:15:34Z"
      completed_at: "2026-09-25T16:15:54Z"
      duration: "20 seconds"
      token_usage:
        input: null
        output: null
        total: null
      skills_used:
        - name: "my-interface-configure"
          duration: null
          token_usage:
            input: null
            output: null
            total: null
          report: "Generated the three declared Config Records from their Schemas."
      open_questions: []
      blockers: []
      report: "Generated application.yaml, plan.yaml, and state.yaml from their Schemas composed with the general YAML structure; every record conforms to its Schema. The State Schema declares no generation block, so State's meta, policy, resolution, read_order, and content_map values were derived from its own structure, sections, and initialization rules. started_at is the time State was first written."
      data:
        generated:
          - ".interface/config/application.yaml"
          - ".interface/config/plan.yaml"
          - ".interface/config/state.yaml"
        drift:
          - "State Schema has no generation block; its file-specific frame values were derived, not read."
          - "Configure Skill names duration_ms; the State Schema defines only duration, so duration_ms is not recorded."
