# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable active Workflow position, aggregate phase progress, and the recorded execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema; preserve existing operational records and never replace them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the phase entries by stable Target phase identifier, then the log in recorded order."
  selection: "A requested phase resolves to the entry keyed by that phase identifier; a Log Entry resolves by its id."
  absence: "An empty phases mapping means no phase has been reconciled; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The active Workflow position: mode, phase, reason, and who set it and when."
  phases: "Aggregate operation progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

