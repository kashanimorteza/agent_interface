# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable operational State: active Workflow position, aggregate Phase progress, and the execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and State Principles; record operational position only, never Target meaning or individual Task status."
  changed_by: "Every Skill records its own Log Entry; the operation that owns a progress field updates it; Configure reconciles the structure."
  precedence: "The State Schema and every applicable State Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, then phases for aggregate progress by stable Target phase identifier, then log for execution history."
  selection: "A requested phase resolves to the phases entry keyed by its identifier; a Log Entry resolves by its project-wide sequential id."
  absence: "No matching phases entry means the phase has not been reconciled; an empty log means no execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its Phase when applicable, and its provenance."
  phases: "Aggregate Planning, Development, and Review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

