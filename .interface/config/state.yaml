# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Project-wide state that belongs to no single task — no definition, no rule, and no task status lives here."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "An agent may write blockers and open_questions. content.active is set by the human only — never by an agent, in any mode."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "blockers"
  - "open_questions"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The one mode and item currently in play."
  blockers: "What is actually missing, and what it stops."
  open_questions: "What the human still has to decide."


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Active -->
  active:
    mode: "to be defined"
    mode_reason: "Not yet chosen — config/ was just generated by my-interface-configurator from Phase 1 of project.md; no working mode has been activated yet."
    item: "none"
    set_by: "human (pending)"

  # <!-------------------------------------------- Blockers -->
  blockers: []

  # <!-------------------------------------------- Open_Questions -->
  open_questions:
    note: "These are addressed to the human. An agent raises a question here and never answers one on its own."
    questions:
      - id: "Q1"
        question: "What technology and framework should the frontend use? project.md states this 'will be defined separately' but does not name it."
        why_it_matters: "frontend.yaml's tech, code_layout, and run command cannot be completed without it, and rules.yaml's environment and design groups stay 'to be defined' until it is chosen."
        blocks: "none yet"

      - id: "Q2"
        question: "Should Account.Password (a trading/broker account credential, not a login credential) be stored encrypted, hashed, or in plain text?"
        why_it_matters: "project.md states 'Authentication is not required' for the application itself, but says nothing about protecting this stored credential field; backend.yaml's Account model and rules.yaml's security group both depend on the answer."
        blocks: "none yet"

      - id: "Q3"
        question: "What values does Execute.State take, and how does it differ from Execute.Status? Phase 1 lists both as separate fields on Execute, but only defines what Status means (the enable/disable pattern shared by every model)."
        why_it_matters: "backend.yaml's Execute model and contract cannot state a concrete field definition for State without this."
        blocks: "none yet"

      - id: "Q4"
        question: "What type, format, or range does Strategy.Risk Parameter take, and what type/precision does Execute.Profit use?"
        why_it_matters: "backend.yaml's Strategy and Execute models need a concrete field definition to validate input and define the API contract; project.md names both fields but not their shape."
        blocks: "none yet"

      - id: "Q5"
        question: "rules.yaml's code and database groups, beyond the stack project.md names (Python, FastAPI, SQLAlchemy, SQLite, a standard migration framework), are undefined — should the human supply specific conventions (route/service structure, validation approach, indexing strategy), or should framework-standard defaults be adopted once planning begins?"
        why_it_matters: "Planning cannot write concrete backend tasks against code and database rules that are still marked 'to be defined'."
        blocks: "none yet"
