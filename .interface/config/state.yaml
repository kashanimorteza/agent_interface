# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable State Config: active Workflow position, aggregate phase progress, and the project's execution Log."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; State Principles define record meaning and ownership."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the phase selected by stable Target phase identifier, then the log in recorded order."
  selection: "A requested phase resolves to the phases entry keyed by that identifier; a Log Entry resolves by its project-wide identifier."
  absence: "No matching phases entry means no progress has been recorded for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current or most recently recorded Workflow Mode, its phase when applicable, and its provenance."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
