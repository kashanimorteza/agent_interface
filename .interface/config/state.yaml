# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Mutable Workflow position, aggregate phase progress, and the recorded execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema and preserve existing operational records; never replace them with defaults."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, phases for aggregate progress, then log for the recorded execution history."
  selection: "A requested phase resolves to the phases entry keyed by its stable Target phase identifier; a Log Entry resolves by its id."
  absence: "No matching phases entry means no progress has been recorded for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
