# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/state.yaml"
  path_note: "Operational State: active Workflow position, aggregate Phase progress, and the project's recorded execution history."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Schema. Existing operational records are preserved and never replaced with defaults. Target meaning, technical decisions, individual Task status or history, product code, secrets, and command transcripts are never stored here."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active for the current Workflow position, then phases for aggregate progress of the phase in question, then log for recorded execution history."
  selection: "A phase resolves to the entry in phases keyed by its stable Target phase identifier; a Log Entry resolves by its sequential id."
  absence: "An empty phases mapping means no phase identity has been recorded yet; an empty log means no Skill execution has been recorded."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The current Workflow mode, its phase, and the reason, author, and time of the last mode change."
  phases: "Aggregate planning, development, and review progress keyed by stable Target phase identifier."
  log: "The project's preserved history of recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
