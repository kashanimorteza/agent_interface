meta:
  path: ".interface/config/database.yaml"
  path_note: "Generated Database item configuration and draft database contract."

policy:
  agent_may_edit: true
  changed_by: "my-interface-interpreter during generation; my-interface-tasker may refine settings and draft contracts during planning."
  preference_source: ".interface/schema/database.schema.yaml — policy and preferences"
  contract_authority: "Only the human may freeze or version a contract; a frozen contract is never edited."
  ownership: "This item alone owns storage, schema, constraints, indexes, migrations, and its database contract."

read_order:
  - "enabled"
  - "code_path"
  - "summary"
  - "tech"
  - "standards"
  - "capabilities"
  - "code_layout"
  - "contracts"
  - "boundaries"
  - "out_of_scope"

content_map:
  enabled: "Whether the Database item participates in the build."
  code_path: "The only project-code directory owned by Database."
  code_path_note: "How code_path is resolved."
  summary: "The Database item in one line."
  needs_test: "Whether every database-changing task requires a written test."
  verify_cwd: "Where database verification commands run."
  responsibility: "What Database is answerable for."
  tech: "Resolved engine, storage, connection, and migration tooling."
  standards: "Resolved naming and migration conventions."
  capabilities: "Optional Database behavior."
  code_layout: "The intended ownership of paths inside code_path."
  contracts: "The draft database contract published to Backend."
  boundaries: "Database ownership limits."
  out_of_scope: "Work excluded from this item."

content:
  enabled: true
  code_path: "database/"
  code_path_note: "Relative to the repository root, never relative to .interface/."
  summary: "SQLite persistence and Alembic schema evolution for every Trading Assistant model."
  needs_test: false
  verify_cwd: "database/ in the uv-managed Python environment"
  responsibility: "Own persistent storage, schema evolution, and the database contract consumed by Backend."

  tech:
    engine:
      name: "SQLite"
      version: "runtime-provided"
    storage:
      kind: "file"
      location: "database/app.db"
    connection:
      url_scheme: "sqlite"
      foreign_keys: true
      check_same_thread: false
      credentials: "none"
    migration:
      tool:
        name: "Alembic"
        version: "latest"
      environment:
        language: "Python"
        manager: "uv"
        manager_version: "latest"
      packages:
        migration:
          name: "Alembic"
          version: "latest"
        schema_toolkit:
          name: "SQLAlchemy"
          version: "latest"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"

  standards:
    naming:
      tables: "snake_case"
      columns: "snake_case"
      constraints: "snake_case"
      indexes: "ix_<table>_<column>"
    migrations:
      ordered: true
      reversible: true
      history: "Append-only; an applied migration is never rewritten."

  capabilities:
    seed_data:
      enabled: false
    backups:
      enabled: false

  code_layout:
    "pyproject.toml": "Database tooling project and exact uv-managed dependencies."
    "alembic.ini": "Alembic configuration."
    "migrations/": "Database-owned migration environment."
    "migrations/env.py": "Migration runtime and schema metadata integration."
    "migrations/versions/": "Ordered reversible migration files."
    "schema.py": "Database schema metadata used by migrations."
    "app.db": "Local SQLite storage; runtime data is not committed."
    "tests/": "Database verification tests when needs_test becomes true."

  contracts:
    produces: "database-v1"
    rule: "The implemented schema and database-v1 must match exactly before the contract can be frozen."
    change_rule: "The human freezes a complete version; later changes create a new version and migrations between versions."
    database-v1:
      lifecycle: "draft"
      lifecycle_note: "The project names every model and field, but column types, nullability, primary-key details, constraints, and delete behavior remain unresolved under Q1/B1. Backend may not implement against this draft."
      consumed_by:
        - "backend"
      engine:
        name: "SQLite"
        version: "runtime-provided"
      connection:
        url_scheme: "sqlite"
        runtime_source: "Backend reads the project-relative database path from its resolved configuration; no credentials are committed."
        foreign_keys: true
        check_same_thread: false
      tables:
        trading_platform:
          source_model: "Trading Platform"
          fields: ["ID", "Name", "Status", "Description"]
          primary_key: "unresolved by Q1"
          field_definitions: "types and nullability unresolved by Q1"
          references: []
          constraints: "unresolved by Q1"
          indexes: "unresolved by Q1"
        broker:
          source_model: "Broker"
          fields: ["ID", "Name", "Trading Platform ID", "Status", "Description"]
          primary_key: "unresolved by Q1"
          field_definitions: "types and nullability unresolved by Q1"
          references:
            - "Trading Platform ID -> Trading Platform.ID"
          constraints: "unresolved by Q1"
          indexes: "unresolved by Q1"
        account:
          source_model: "Account"
          fields: ["ID", "Name", "Username", "Password", "Broker ID", "Status", "Description"]
          primary_key: "unresolved by Q1"
          field_definitions: "types and nullability unresolved by Q1"
          references:
