    storage_adapter:
      responsibility: Owns the connection to the SQLite engine, the SQLAlchemy mappings that realize the storage schema, the Alembic migration history that creates it, credential at-rest transformations, and physical persistence operations.
      tech:
        engine:
          name: SQLite
          version: runtime-provided — the SQLite library bundled with Python 3.14.7's sqlite3 module
        storage:
          kind: file
          location: database/app.db — project-relative; overridable through runtime configuration and never committed
        connection:
          url_scheme: sqlite
          foreign_keys: true
          check_same_thread: false
          note: Foreign-key enforcement is switched on for every connection; the URL and file path are supplied by runtime configuration.
        orm:
          name: SQLAlchemy
          version: 2.0.52
          language: Python
          package: SQLAlchemy
          capabilities:
            model_mapping: true
            parameterized_sql: true
        migration:
          tool: Alembic 1.19.2
          environment:
            name: uv
            version: 0.12.10
            python: 3.14.7
          packages:
            migration:
              name: Alembic
              version: 1.19.2
            orm:
              name: SQLAlchemy
              version: 2.0.52
          commands:
            upgrade: uv run alembic upgrade head
            downgrade: uv run alembic downgrade -1
            verify: uv run alembic current
      standards:
        naming:
          tables: plural_snake_case — derived from the Model key; every resolved name is written explicitly under data_logic.storage_schema
          columns: snake_case
          constraints: snake_case — uq_<table>_<columns> for unique constraints
          indexes: ix_<table>_<column>
          foreign_keys: <referenced_model>_id, or the explicit Model field when one is declared, such as base_currency_id
          types: Engine-independent SQLAlchemy generic types — Integer, String, String(n), Boolean, Numeric, Float, DateTime — mapped to the engine by the ORM
        migrations:
          ordering: One Alembic revision per storage-schema change, each with a fixed position in a linear revision history.
          reversibility: Every revision implements both upgrade and downgrade.
          history: The revision history is the authoritative record of the storage schema; application code never creates, alters, or drops database objects, and the ORM never creates tables at startup.
          seeding: Initial records are applied by an idempotent data migration after the schema revisions. Each table is matched on its natural key — users.name, currencies.code, trading_platforms.name, brokers (user_id, name), accounts.name, assets.symbol, trailing_groups.name, partial_groups.name, action_groups.name, actions.name — so re-running creates no duplicate logical record and breaks no uniqueness rule. Literal relationship ids are preserved exactly; a generate instruction is fulfilled with a cryptographically random value that is never persisted in plain form.
          credentials: A column carrying credential_storage is transformed on write — one-way hash for hash, reversible encryption for encrypted — with the encryption key read from runtime configuration and never stored in the repository.
      backups:
        enabled: false

  # <!-------------------------------------------- boundaries -->
  boundaries:
    owns: The engine, physical storage, runtime connection, ORM, model-to-storage mappings, storage schema, constraints, indexes, migration history, initial data, credential at-rest transformations, and the generic Database Interface.
    does_not_own: Application Behaviour, the HTTP API, Frontend, deployment secrets, and the secret values of runtime configuration.
    interface: The generic Database Interface under content.layers.database_interface — the only way any consumer reaches persistent data.

  # <!-------------------------------------------- out_of_scope -->
  out_of_scope:
  - Exposing the engine connection, tables, ORM mappings, migrations, or the database file to any consumer.
  - Publishing an HTTP API or any user interface.
  - Model-specific application Behaviour — that belongs to Backend Logic.
  - Backup and restore automation — disabled above.
  - Storing encryption keys, connection secrets, or generated credential values in the repository or in Interface files.
