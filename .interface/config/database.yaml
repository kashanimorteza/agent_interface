        to: "database-v1"
        range: "unresolved until Q1 is answered and the first migration is planned"

  boundaries:
    owns:
      - "SQLite engine choice and database/app.db storage"
      - "Schema objects, constraints, indexes, and relationships"
      - "Alembic migration history"
      - "database-v1 contract"
    does_not_own:
      - "Backend ORM behavior and HTTP API behavior"
      - "Frontend code"
      - "Credentials or deployment secrets"
    interface: "The frozen database contract and credential-free SQLite connection requirements."

  out_of_scope:
    - "Backend ORM models and services"
    - "HTTP routes or API schemas"
    - "Frontend behavior"
    - "Seed data and backup automation"
