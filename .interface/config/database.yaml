  # <!-------------------------------------------- interface -->
  interface:
    style: "One generic data-access interface implemented in Python and shared by every persistent model — a caller names the model, selects an operation, and supplies the data or criteria that operation requires. There is no per-model access implementation."
    model_selector: "The model key exactly as indexed under content.models of config/model.yaml, such as trading_platform; the interface resolves it to its table through storage_schema."
    operations:
      create: "Insert one record for the selected model from a mapping of field values and return the created record. Credential fields are transformed on write."
      read: "Return one record of the selected model by its primary key, or nothing when absent. Credential columns are never returned."
      list: "Return records of the selected model, optionally filtered by field criteria, ordered, and paged. Credential columns are never returned."
      update: "Apply a mapping of field values to one record by primary key and return the updated record. Credential fields are transformed on write."
      delete: "Remove one record by primary key, subject to the RESTRICT referential actions of every relationship that references it."
      status:
        actions: ["enable", "disable"]
        required_field: "status"
        value_mapping:
          enable: true
          disable: false
        note: "Available only for a model that declares a status field; a model without one rejects the operation. It is never a general update."
    sql_commands:
      enabled: true
      parameterized: true
      scope: "Executed inside the database boundary against the item's own connection, with values supplied as explicit parameters and never interpolated into command text; the connection is never returned to the caller."

  # <!-------------------------------------------- boundaries -->
  boundaries:
    owns: "The engine, physical storage, runtime connection, ORM, model-to-storage mappings, internal storage schema, constraints, indexes, migration history, seed data, credential at-rest transformations, and the generic data-access interface."
    does_not_own: "Application behavior, the HTTP API, the frontend, deployment secrets, and the secret values of runtime configuration."
    interface: "The generic data-access interface under content.interface — the only way any consumer reaches persistent data."

  # <!-------------------------------------------- out_of_scope -->
  out_of_scope:
    - "Exposing the engine connection, tables, ORM mappings, migrations, or the database file to any consumer."
    - "Publishing an HTTP API or any user interface."
    - "Backup and restore automation — disabled above."
    - "Written tests for database behavior — needs_test is false."
    - "Storing encryption keys, connection secrets, or generated credential values in the repository or in Interface files."
