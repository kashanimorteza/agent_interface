# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- code_path -->
  code_path: "database/"

  # <!-------------------------------------------- code_path_note -->
  code_path_note: "Relative to the project root — the directory containing .interface/. It is never a path inside the Interface."

  # <!-------------------------------------------- summary -->
  summary: "A file-based SQLite database mapped through SQLAlchemy, versioned by Alembic migrations, seeded with the project's initial data, and published to the backend through one generic data-access interface."

  # <!-------------------------------------------- needs_test -->
  needs_test: false

  # <!-------------------------------------------- verify_cwd -->
  verify_cwd: "database/ — every verify command runs from this directory inside the uv-managed virtual environment, invoked through uv run."

  # <!-------------------------------------------- responsibility -->
  responsibility: "Owns the complete persistence layer — engine, physical storage, runtime connection, ORM, model-to-table mappings, schema, constraints, indexes, migration history, and seed data — and publishes the generic data-access interface every consumer uses."

  # <!-------------------------------------------- tech -->
  tech:
    engine:
      name: "SQLite"
      version: "runtime-provided — the SQLite library bundled with Python 3.14.7's sqlite3 module"
    storage:
      kind: "file"
      location: "database/app.db — project-relative; overridable through runtime configuration and never committed"
    connection:
      url_scheme: "sqlite"
      foreign_keys: true
      check_same_thread: false
      note: "Foreign-key enforcement is switched on for every connection; the URL and file path are supplied by runtime configuration."
    orm:
      name: "SQLAlchemy"
      version: "2.0.52"
      language: "Python"
      package: "SQLAlchemy"
      capabilities:
        model_mapping: true
        parameterized_sql: true
    migration:
      tool: "Alembic 1.19.2"
      environment:
        name: "uv"
        version: "0.12.9"
        python: "3.14.7"
      packages:
        migration:
          name: "Alembic"
          version: "1.19.2"
        orm:
          name: "SQLAlchemy"
          version: "2.0.52"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"
        verify: "uv run alembic current"

