# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/database.yaml"
  path_note: "Generated Config — everything an agent reads to understand the database item: its resolved engine, storage, migration tooling, standards, seed data, and the fully resolved database contract it publishes to the backend. Derived by my-interface-interpreter from .interface/project.md through config/definition.yaml and the Policy and Preferences in .interface/schema/database.schema.yaml"
  schema: ".interface/schema/database.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-03"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "my-interface-interpreter writes the whole file during a generation run. Planning mode, for a phase whose target is database, may write planning-owned settings and a draft contract, never a frozen one. Development and review modes do not write this file"
  changed_by: "The human directly; my-interface-interpreter on regeneration; my-interface-tasker in planning mode within the limits above"
  contract_rule: "A contract version whose lifecycle is frozen is never edited by any agent — see content.contracts.change_rule"
  schema_changes: "Every schema change is an ordered reversible migration owned by this item. Backend code never creates, alters, or drops database objects"
  resolution: "project.md phases the database first and declares every model field with its type, nullability, default, key, and uniqueness, so the tables below copy those declarations exactly. It states no engine, tool, storage, or naming choice, so every value under tech and standards comes from the Preferences in .interface/schema/database.schema.yaml, with every 'latest' resolved to the concrete stable version verified on 2026-09-03 against PyPI and endoflife.date and checked to resolve together on Python 3.14. Every relationship uses the exact field the project binds to it (explicit_field); nullability, indexing, and referential actions come from relationship_defaults because the project leaves them unstated. Every deterministic model rule became a named constraint with its source rule; the one rule with more than one database representation is an open question. The two fields the project calls a credential resolved to plaintext, the credential_storage default. The project declares initial data, so seed_data is enabled and every record is carried as declared; three records omit required fields and are open questions, never filled in"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "standards"
  - "capabilities"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
