            ix_trailing_rules_trailing_group_id: { columns: ["trailing_group_id"], unique: false }

        partial_groups:
          source_model: "partial_group"
          columns:
            id: { type: "INTEGER", nullable: false, primary_key: true, auto_increment: true, default: null }
            name: { type: "VARCHAR", nullable: false, primary_key: false, auto_increment: false, default: null }
            status: { type: "BOOLEAN", nullable: false, primary_key: false, auto_increment: false, default: true }
            description: { type: "VARCHAR", nullable: true, primary_key: false, auto_increment: false, default: null }
