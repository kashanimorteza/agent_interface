  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: "The folder holding database-owned migrations, tooling, and local storage — the one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The database item in one line"
  needs_test: "Whether every task that changes database behavior is proven by a written test"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the database item is answerable for"
  tech: "The resolved engine, storage, connection behavior, and migration tooling with concrete versions"
  standards: "The resolved naming and migration conventions"
  capabilities: "The resolved state of each optional capability"
  contracts: "The database contract published to the backend — every table fully resolved"
  boundaries: "What the database item owns, does not own, and offers"
  out_of_scope: "What the database item does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Code_Path -->
  code_path: "database/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the Interface. It holds migrations, schema metadata, tooling, and the local SQLite file; no backend application file lives here"

  # <!-------------------------------------------- Summary -->
  summary: "A SQLite database evolved by Alembic migrations, holding the thirteen Trading Assistant domain models as tables and publishing their schema as a contract to the backend"

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "database/ — every verify command runs from the item's code_path, inside the uv-managed virtual environment at database/.venv, invoked through uv run"

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Owns persistent storage, schema evolution through ordered reversible migrations, and the database contract consumed by the backend for every domain model"

  # <!-------------------------------------------- Tech -->
  tech:
    engine:
      name: "SQLite"
      version: "runtime-provided — the SQLite library bundled with Python 3.14.7"
    storage:
      kind: "file"
      location: "database/app.db — a single file at the root of code_path, relative to the repository root, never committed"
    connection:
      url_scheme: "sqlite"
      foreign_keys: true
      foreign_keys_note: "Foreign key enforcement is off by default in SQLite; every connection turns it on with PRAGMA foreign_keys=ON"
      check_same_thread: false
      credentials: "None — a file path is the whole connection; nothing secret is committed"
    migration:
      tool:
        name: "Alembic"
        version: "1.19.1"
      environment:
        name: "uv"
        version: "0.12.9"
        python: "3.14.7"
        note: "database/.venv, created and driven by uv and never committed; every command and every install happens through uv run inside code_path. This environment serves database tooling only and is separate from the backend's"
      packages:
        migration:
          name: "Alembic"
          version: "1.19.1"
        schema_toolkit:
          name: "SQLAlchemy"
          version: "2.0.52"
          role: "Declares the table metadata Alembic migrates against — schema definition only, no application ORM behavior"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"
        verify: "uv run alembic upgrade head && uv run alembic current — passes when the reported revision is the head of the migration history"

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      tables: "plural_snake_case — the model name pluralized, so Asset Detail becomes asset_details"
      columns: "snake_case"
      foreign_keys: "<referenced_model_in_snake_case>_id — derived from the referenced model, not from its table name"
      constraints: "snake_case — uq_<table>_<columns> for a unique constraint"
      indexes: "ix_<table>_<column>"
    migrations:
      ordering: "A single linear history under alembic/versions/ — every revision names its down_revision, and there is one head"
      reversibility: "Every migration carries a working downgrade that reverses its upgrade"
      history: "A migration that has been applied is never edited or deleted; a correction is a new migration"
      autogenerate: "Alembic autogenerate against the SQLAlchemy metadata is the starting point; the generated revision is reviewed before it is kept"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    seed_data:
      enabled: false
    backups:
      enabled: false

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "database contract v1"
    rule: "The implemented schema and the published contract must match exactly — a table, column, key, constraint, or index that exists in one and not the other is a fault"
    change_rule: "A frozen contract is never edited. A change means a new version entry, migrations that move the schema between versions, and a human decision to freeze the new version. Freezing is the human's alone — see content.state_authority in config/state.yaml"

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — fully resolved from project.md, the table template, and the relationship, rule, and credential resolution rules. Columns the project names but does not shape carry draft types listed under resolution_notes and open questions Q1 to Q4 in config/state.yaml. Planning for P1 may complete the draft; only the human freezes it. The backend consumes a frozen contract, so P2 development waits on that freeze"
      engine:
        name: "SQLite"
        implications: "Dynamic typing — declared types are affinities, not enforced storage classes; numeric(18, 8) is stored with NUMERIC affinity. No native boolean or datetime; boolean is stored as integer 0 or 1. Foreign keys are enforced only with PRAGMA foreign_keys=ON. A single writer at a time"
      connection:
        shape: "sqlite URL to the database file — sqlite:///<path to database/app.db>"
        runtime_source: "The consumer reads the URL from one environment variable, DATABASE_URL, and falls back to the file at database/app.db relative to the repository root when it is unset — draft; planning may rename the variable before the human freezes"
        requirements:
          - "PRAGMA foreign_keys=ON on every connection"
          - "check_same_thread=False for the SQLite driver"
          - "No credentials — the file path is the whole connection"

      resolution_notes:
        template: "Every table carries id, name, description, and status from the table template; status is a boolean where true means active and false means inactive"
        relationships: "Every belongs_to relationship in definition.yaml is an integer foreign-key column, not null, indexed, RESTRICT on delete and update, referencing the target table's id — the relationship_defaults preference"
        named_values: "Columns the project names in a model's purpose — username and password on accounts; stop_loss and take_profit on strategies; profit_threshold and close_portion on partial_rules; profit, stage, state, entry_price, take_profit, and stop_loss on positions — are included with draft types: numeric(18, 8) for prices, profits, and thresholds, and string for stage and state. Their precision, unit, and vocabulary are open question Q2"
        unshaped_values: "Values the project mentions without naming — broker-specific parameters on brokers, related parameters on assets, broker-specific settings on asset_details, the threshold and adjustment values of trailing_rules, and further risk parameters on strategies — have no column; they are open question Q1"
        group_settings: "The settings a position receives through its related groups have no declared relationship on positions or actions, so no foreign key links a position or action to a trailing_group or partial_group — open question Q3"
        credential: "accounts.password is the one credential field; it resolved to plaintext, the credential_storage default, because the project states no mode — open question Q4 asks the human to confirm"

      tables:

        trading_platforms:
