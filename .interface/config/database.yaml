# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/database.yaml
  path_note: 'Generated configuration of the Database Component — the resolved Database Interface, Data Logic and Mapping, and Storage Adapter layers. Shape: schema/database.yaml; rules: principles/database.md; defaults: preferences/database.yaml'
  standard: Agent Project Interface
  schema_version: '9.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: Written only by the configuring operation. Planning and development read it and never write it
  changed_by: The human, directly, or by re-running the configuring operation
  resolution: project.md states no Database technology. Engine, ORM, migration tool, relationship defaults, and the default credential mode were resolved from preferences/database.yaml; each latest token was resolved to the concrete stable version verified against the package index on 2026-09-06. Every table, column, constraint, index, and initial record under data_logic was derived from config/model.yaml
  agent_selected: Column types are written as engine-independent SQLAlchemy generic types so the engine can change without redesigning the data. The database file lives inside code_path at database/app.db. Initial data is enabled because project.md declares initial data and the preference enables seeding whenever it is present. Python 3.14.7 is shared with Backend so one interpreter serves both uv environments. Explicit project credential modes (hash, encrypted) override the preference default of plaintext


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- code_path
- code_path_note
- summary
- verify_cwd
- responsibility
- layers
- boundaries
- out_of_scope


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: The project-relative folder for Database implementation artifacts
  code_path_note: What code_path is relative to
  summary: The Database in one line
  verify_cwd: The directory and environment for Database verification commands
  responsibility: The resolved responsibilities of Database
  layers: The resolved Database Interface, Data Logic and Mapping, and Storage Adapter layers
  boundaries: What Database owns, does not own, and publishes
  out_of_scope: Work explicitly outside Database


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- code_path -->
  code_path: database/

  # <!-------------------------------------------- code_path_note -->
  code_path_note: Relative to the project root — the directory containing .interface/. It is never a path inside the Interface.

  # <!-------------------------------------------- summary -->
  summary: A file-based SQLite Database mapped through SQLAlchemy, versioned by Alembic migrations, seeded with the project's initial data, and published to Backend through one generic Database Interface.

  # <!-------------------------------------------- verify_cwd -->
  verify_cwd: database/ — every verify command runs from this directory inside the uv-managed virtual environment, invoked through uv run.

  # <!-------------------------------------------- responsibility -->
  responsibility: Owns the complete persistence layer — engine, physical storage, runtime connection, ORM, storage schema, constraints, indexes, migration history, and initial data — and publishes the generic Database Interface every consumer uses.

  # <!-------------------------------------------- layers -->
  layers:
    database_interface:
      responsibility: The only boundary published to consumers. It accepts a Model key, an operation, and that operation's data or criteria, and never exposes the engine, connection, ORM, tables, migrations, or database file.
      style: One generic data-access interface implemented in Python and shared by every persistent Model — there is no per-Model access implementation.
      model_selector: The Model key exactly as indexed under content.models of .interface/config/model.yaml, such as trading_platform; Data Logic resolves it to its table through the storage schema.
      operations:
        create: Insert one record for the selected Model from a mapping of field values and return the created record. Credential fields are transformed on write according to their at-rest mode.
        read: Return one record of the selected Model by its primary key, or nothing when absent. Credential columns are never returned.
        list: Return records of the selected Model, optionally filtered by equality criteria, ordered, and paged. Credential columns are never returned.
        update: Apply a mapping of field values to one record by primary key and return the updated record. Credential fields are transformed on write.
        delete: Remove one record by primary key, subject to the RESTRICT referential actions of every relationship that references it.
        status:
          actions:
          - enable
          - disable
          required_field: status
          value_mapping:
            enable: true
            disable: false
      sql_commands:
        enabled: true
        parameterized: true
        scope: Executed inside the Database boundary against the Storage Adapter's own connection, with values supplied as explicit parameters and never interpolated into command text; the connection is never returned to the caller.
    data_logic:
      responsibility: Implements the generic Model-driven operation pipeline and resolves logical Models, fields, relationships, rules, credentials, and initial data into storage meaning. Differences between Models come only from their resolved definitions; no Model-specific application Behaviour lives here.
