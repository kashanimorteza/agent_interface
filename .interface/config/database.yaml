  code_path_note: "What code_path is relative to"
  summary: "The database item in one line"
  needs_test: "Whether every task that changes database behavior is proven by a written test"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the database item is answerable for"
  tech: "The resolved engine, storage, connection behavior, and migration tooling with concrete versions"
  standards: "The resolved naming and migration conventions"
  capabilities: "The resolved state of each optional capability, including the seed records the project declares"
  contracts: "The database contract published to the backend — every table fully resolved"
  boundaries: "What the database item owns, does not own, and offers"
  out_of_scope: "What the database item does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Code_Path -->
  code_path: "database/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the Interface. It holds migrations, schema metadata, seed tooling, and the local SQLite file; no backend application file lives here"

  # <!-------------------------------------------- Summary -->
  summary: "A SQLite database evolved by Alembic migrations, holding the thirteen Trading Assistant domain models as tables, seeded with the records the project declares, and publishing its schema as a contract to the backend"

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "database/ — every verify command runs from the item's code_path, inside the uv-managed virtual environment at database/.venv, invoked through uv run"

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Owns persistent storage, schema evolution through ordered reversible migrations, the seeding of the declared initial records, and the database contract consumed by the backend for every domain model"

  # <!-------------------------------------------- Tech -->
  tech:
    engine:
      name: "SQLite"
      version: "runtime-provided — the SQLite library bundled with Python 3.14.7"
    storage:
      kind: "file"
      location: "database/app.db — a single file at the root of code_path, relative to the repository root, never committed"
    connection:
      url_scheme: "sqlite"
      foreign_keys: true
      foreign_keys_note: "Foreign key enforcement is off by default in SQLite; every connection turns it on with PRAGMA foreign_keys=ON"
      check_same_thread: false
      credentials: "None — a file path is the whole connection; nothing secret is committed"
    migration:
      tool:
        name: "Alembic"
        version: "1.19.1"
      environment:
        name: "uv"
        version: "0.12.9"
        python: "3.14.7"
        note: "database/.venv, created and driven by uv and never committed; every command and every install happens through uv run inside code_path. This environment serves database tooling only and is separate from the backend's"
      packages:
        migration:
          name: "Alembic"
          version: "1.19.1"
        schema_toolkit:
          name: "SQLAlchemy"
          version: "2.0.52"
          role: "Declares the table metadata Alembic migrates against and carries the seed inserts — schema definition and seeding only, no application ORM behavior"
      commands:
        upgrade: "uv run alembic upgrade head"
        downgrade: "uv run alembic downgrade -1"
        verify: "uv run alembic upgrade head && uv run alembic current — passes when the reported revision is the head of the migration history"

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      tables: "plural_snake_case — the model name pluralized, so Asset Detail becomes asset_details"
      columns: "snake_case — exactly the field names the project declares"
      foreign_keys: "The field the project binds to the relationship; where the project names none, <referenced_model_in_snake_case>_id"
      constraints: "snake_case — uq_<table>_<columns> for a unique constraint"
      indexes: "ix_<table>_<column>"
    migrations:
      ordering: "A single linear history under alembic/versions/ — every revision names its down_revision, and there is one head"
      reversibility: "Every migration carries a working downgrade that reverses its upgrade"
      history: "A migration that has been applied is never edited or deleted; a correction is a new migration"
      autogenerate: "Alembic autogenerate against the SQLAlchemy metadata is the starting point; the generated revision is reviewed before it is kept"
      seed_data: "Seed inserts run after the schema they need exists, in dependency order, and are idempotent — a rerun never creates a duplicate logical record and never violates a uniqueness rule"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    seed_data:
      enabled: true
      note: "Enabled because the project declares initial data. Records are grouped by table in dependency order and carry exactly the values project.md states; {instruction: ...} marks a generation instruction, not a stored value. Three records omit required columns that have no default — assets.Default lacks asset_type, accounts.Default lacks username, password, leverage, and account_type, and actions.Default lacks risk_by_reward, take_profit, and stop_loss. They are open questions Q3, Q4, and Q5 in config/state.yaml and cannot be seeded until answered; because accounts references assets and actions references accounts, those three tables seed only once all three are answered"
      records:
        users:
          - name: "Admin"
            username: "admin"
            password: { instruction: "Generate securely" }
            api_key: { instruction: "Generate securely" }
        trading_platforms:
          - name: "Binance"
            user_id: 1
            code: "binance"
          - name: "MetaTrader 5"
            user_id: 1
            code: "metatrader_5"
        brokers:
          - name: "Default"
            user_id: 1
            trading_platform_id: 1
        assets:
          - name: "Default"
            symbol: "Default"
        accounts:
          - name: "Default"
            broker_id: 1
            base_asset_id: 1
        trailing_groups:
          - name: "Default"
        partial_groups:
          - name: "Default"
        action_groups:
          - name: "Default"
        actions:
          - name: "Default"
            action_group_id: 1
            asset_id: 1
            account_id: 1
            partial_group_id: 1
            trailing_group_id: 1
    backups:
      enabled: false

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "database contract v1"
    rule: "The implemented schema and the published contract must match exactly — a table, column, key, constraint, or index that exists in one and not the other is a fault"
    change_rule: "A frozen contract is never edited. A change means a new version entry, migrations that move the schema between versions, and a human decision to freeze the new version. Freezing is the human's alone — see content.state_authority in config/state.yaml"

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — resolved column by column from the fields project.md declares, plus the relationship, rule, and credential resolution rules. Open questions Q2 and Q6 in config/state.yaml touch this contract; planning for P1 may complete the draft, and only the human freezes it. The backend consumes a frozen contract, so P2 development waits on that freeze"
      engine:
        name: "SQLite"
        implications: "Dynamic typing — declared types are affinities, not enforced storage classes. numeric is stored with NUMERIC affinity and carries no declared precision because the project declares none; datetime is stored as ISO 8601 text; boolean is stored as integer 0 or 1. Foreign keys are enforced only with PRAGMA foreign_keys=ON. A single writer at a time"
      connection:
        shape: "sqlite URL to the database file — sqlite:///<path to database/app.db>"
        runtime_source: "The consumer reads the URL from one environment variable, DATABASE_URL, and falls back to the file at database/app.db relative to the repository root when it is unset — draft; planning may rename the variable before the human freezes"
        requirements:
          - "PRAGMA foreign_keys=ON on every connection"
          - "check_same_thread=False for the SQLite driver"
          - "No credentials — the file path is the whole connection"

      resolution_notes:
        columns: "Every column is a field project.md declares, in the project's order, with its declared type, nullability, and default. No column was added or removed"
        types: "integer, string, and boolean are used as declared. decimal becomes numeric with no precision, and datetime becomes datetime, because the project declares no size for either"
        uniqueness: "A field declared unique by itself is a unique index named ix_<table>_<column>. A multi-field rule is a named unique constraint carrying its source rule"
        relationships: "Every relationship uses the exact field the project binds to it — explicit_field — including base_asset_id on accounts, whose role base names it. Each is an integer foreign key, not null, indexed, RESTRICT on delete and update, referencing the target table's id, per relationship_defaults"
        unresolved_rule: "The broker rule that user_id must match the user_id of the referenced trading platform has more than one materially different database representation — a composite foreign key with a supporting unique constraint, a trigger, or application-level enforcement — so it is not represented here and is open question Q2. It is preserved in definition.yaml and is never silently dropped"
        credentials: "users.password and accounts.password are the fields the project calls a credential; both resolved to plaintext, the credential_storage default, because the project states no mode — open question Q6 asks the human to confirm and to say whether users.api_key is a credential. api_key is stored as an ordinary string until then"

