  interface:
    style: generic model-oriented data access
    model_selector: logical model key from model.yaml
    operations:
      create: Create one model record from supplied data.
      read: Read one model record by supplied criteria.
      list: List model records using supplied criteria.
      update: Update matching model records with supplied data.
      delete: Delete matching model records.
      status:
        actions:
        - enable
        - disable
        required_field: status
        value_mapping:
          enable: true
          disable: false
    sql_commands:
      enabled: true
      parameterized: true
      scope: Controlled execution inside the database layer without exposing the connection.
  boundaries:
    owns:
    - database engine integration
    - physical storage
    - ORM mapping
    - schema
    - constraints
    - indexes
    - migrations
    - data-access interface
    does_not_own:
    - backend behavior
    - HTTP API
    - frontend
    - deployment secrets
    interface: Generic model-oriented data access and controlled parameterized SQL execution.
  out_of_scope:
  - HTTP API
  - frontend behavior
  - direct consumer access to database internals
  - backup automation
