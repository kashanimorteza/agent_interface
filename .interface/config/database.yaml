  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "The SQLite engine choice and the app.db file"
      - "Every table, column, key, constraint, and index"
      - "The Alembic migration history and its tooling environment"
      - "The seeding of the initial records the project declares, in dependency order and idempotently"
      - "The database contract, in every version, including the at-rest storage mode of every credential field"
    does_not_own:
      - "Backend ORM mappings, sessions, or query behavior"
      - "API behavior and endpoints"
      - "Deployment secrets, encryption keys, and the runtime generation of the credential values the seed instructions call for"
    interface: "The frozen database contract under content.contracts, and the credential-free connection requirements it states — nothing else is offered to the backend"

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Backup and restore automation — capability disabled"
    - "Database tests — needs_test is false"
    - "Enforcing the broker rule that user_id must match the referenced trading platform's user_id — open question Q2 decides where it lives"
    - "Any application logic, validation beyond schema constraints, or API surface"
    - "Connecting to Binance, MetaTrader 5, or any trading platform"
