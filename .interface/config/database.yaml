# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/database.yaml"
  path_note: "Generated Config — everything an agent reads to understand the database item: its resolved engine, storage, migration tooling, standards, and the fully resolved database contract it publishes to the backend. Derived by my-interface-interpreter from .interface/project.md through config/definition.yaml and the Policy and Preferences in .interface/schema/database.schema.yaml"
  schema: ".interface/schema/database.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-03"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "my-interface-interpreter writes the whole file during a generation run. Planning mode, for a phase whose target is database, may write planning-owned settings and a draft contract, never a frozen one. Development and review modes do not write this file"
  changed_by: "The human directly; my-interface-interpreter on regeneration; my-interface-tasker in planning mode within the limits above"
  contract_rule: "A contract version whose lifecycle is frozen is never edited by any agent — see content.contracts.change_rule"
  schema_changes: "Every schema change is an ordered reversible migration owned by this item. Backend code never creates, alters, or drops database objects"
  resolution: "project.md phases the database first and states no engine, tool, storage, or naming choice, so every value under tech and standards comes from the Preferences in .interface/schema/database.schema.yaml, with every 'latest' resolved to the concrete stable version verified on 2026-09-03 against PyPI, GitHub, and endoflife.date and checked to resolve together on Python 3.14. Every domain model became one table under model_table_resolution; the table template supplied id, name, description, and status; every declared relationship became a foreign-key column under relationship_resolution; the one model rule became a unique constraint under model_rule_resolution; and the Account password credential resolved to the plaintext default under credential_storage_resolution. Columns the project names in prose but does not shape carry draft types recorded in resolution_notes and open questions in config/state.yaml"


