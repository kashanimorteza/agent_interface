      columns: "snake_case"
      constraints: "snake_case — uq_<table>_<columns> for unique constraints"
      indexes: "ix_<table>_<column>"
      foreign_keys: "<referenced_model>_id, or the explicit project field when one is declared, such as base_currency_id"
      types: "Engine-independent SQLAlchemy generic types — Integer, String, String(n), Boolean, Numeric, Float, DateTime — mapped to the engine by the ORM"
    migrations:
      ordering: "One Alembic revision per schema change, each with a fixed position in a linear revision history."
      reversibility: "Every revision implements both upgrade and downgrade."
      history: "The revision history is the authoritative record of the schema; application code never creates, alters, or drops database objects, and the ORM never creates tables at startup."
      seeding: "Seed records are applied by an idempotent data migration after the schema revisions. Each table is matched on its natural key — users.name, currencies.code, trading_platforms.name, brokers (user_id, name), accounts.name, assets.symbol, trailing_groups.name, partial_groups.name, action_groups.name, actions.name — so re-running creates no duplicate logical record and breaks no uniqueness rule. Literal relationship ids are preserved exactly."
      credentials: "A column carrying credential_storage is transformed by the database layer on write — one-way hash for hash, reversible encryption for encrypted — with the encryption key read from runtime configuration and never stored in the repository."

