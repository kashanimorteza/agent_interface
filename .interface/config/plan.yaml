    P2:
      id: "P2"
      title: "Database"
      order: 2
      target: "database"
      does: "Implement the Database Component that derives and provisions storage for every Model Entity through the configured Engine, publishes the complete Interface Operation catalogue to Logic, and inserts the Target-declared initial data through that Interface."
      constraints: []
      task_count: 28
      groups:
        p2-g-foundation:
          id: "p2-g-foundation"
          title: "Storage Derivation and Provisioning"
          description: "The Database layer's foundation: deriving durable storage structure from every Model Entity and provisioning the configured default Instance from it."
          area: "Database storage derivation and default Instance provisioning"
          does: "Every imported Model Entity has a matching storage structure, and the configured default Instance exists with that structure verified present."
          constraints: []
          task_count: 2
          tasks:
            p2-derive-structure:
              id: "p2-derive-structure"
              source_id: "006"
              title: "Derive storage structure from Model Entity metadata"
              description: "Derive a durable storage structure for every Domain Entity imported through Model's public entry point, mapping each Entity's declared Fields, constraints, relationships, indexes, and defaults to the configured Engine's storage mechanisms, without duplicating, altering, or inventing any Entity's declared metadata."
              reason: "Database must independently derive its storage structure from Model's authoritative Entity declarations rather than defining a second persistence model."
              inputs: ["Every Domain Entity published by Model's public entry point", "The declared Database Configuration"]
              skills: ["sqlmodel"]
              expected_result: "A storage structure exists that maps every imported Domain Entity's declared Fields, constraints, relationships, indexes, and defaults to the configured Engine, with no Entity invented or omitted."
              depends_on: []
              constraints: []
              acceptance: "The derived storage structure includes one mapped structure for every imported Domain Entity, preserving every declared Field, constraint, relationship, index, and default exactly."
              verify: "Comparing the derived storage structure against every imported Entity's declared metadata shows a matching structure for each Entity, with no Field, constraint, relationship, index, or default added, dropped, or altered."
              status: "done"
              log:
                - at: "2026-09-27T12:01:34Z"
                  status: "done"
                  note: "Derived storage structure via Alembic autogenerate comparing SQLModel.metadata (all 15 imported my_model Entities) against an empty target: detected exactly 15 added tables, one per Entity, with no Entity invented or omitted. Verified: independently inspected the generated migration and the resulting schema's PRAGMA foreign_key_list/index_list for instance, account, action, and position, confirming every declared relationship, foreign key, and unique constraint (e.g. account's group_id/broker_id/instance_id/base_currency_id FKs, action's 5 FKs, position's 8 FKs) matches the Target/Model declarations exactly."
            p2-provision-instance:
              id: "p2-provision-instance"
              source_id: "006"
              title: "Provision the default Database Instance"
              description: "Apply the derived storage structure to the configured default Instance, creating its durable storage in the configured Database Directory, and confirm the resulting storage contains the required structure for every imported Entity."
              reason: "A developed Database Component must leave a usable default storage instance in place, not only source and a command that could create one later."
              inputs: ["The derived storage structure", "The configured default Instance and Database Directory"]
              skills: ["sqlmodel"]
              expected_result: "The configured default Instance exists as durable storage in the configured Database Directory, containing the required structure for every imported Domain Entity."
              depends_on: ["p2-derive-structure"]
              constraints: []
              acceptance: "The configured default Instance's storage physically exists in the configured Database Directory and contains a matching structure for every imported Domain Entity."
              verify: "Opening the configured default Instance's storage directly, independent of any Interface Operation, shows the required structure present for every imported Domain Entity."
              status: "done"
              log:
                - at: "2026-09-27T12:01:34Z"
                  status: "done"
                  note: "Ran 'uv run alembic upgrade head' from the component root, creating data/application.db and applying the initial migration. Verified independently: connected to the file directly with Python's sqlite3 (bypassing the Database Interface entirely) and listed sqlite_master tables, confirming all 15 required Entity tables (account, account_group, action, action_group, asset, broker, currency, instance, partial_group, partial_rule, position, trading_platform, trailing_group, trailing_rule, user) are present."
