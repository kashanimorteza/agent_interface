                outcome: 'Passed. Root holds exactly src, db, config.yaml, README.md, pyproject.toml, uv.lock, .python-version (plus the tool-managed environment); the package holds the Interface, py.typed, core and engine only; core holds data, tables, initial_data and private internal units; engine holds one unit per active Instance; the storage directory holds only the data file; no source lies outside the package. Note: as in Model, the Interface, core and engine sit inside the src package directory of the Component.'
