          constraints: []
          task_count: 3
          tasks:
            P4-G11-T01:
              id: P4-G11-T01
              source_id: '010'
              title: Provide the health signal
              description: Provide a health signal that reports the API process is alive. It is served at a configurable location, does not depend on readiness, and is not an Endpoint of any Group.
              reason: Operators need to know that the process itself is running regardless of whether it can serve requests.
              inputs:
              - Bootstrap composition
              - Declared health location
              skills:
              - python-skills:python-guidelines
              expected_result: A health signal that reports liveness independent of readiness.
              depends_on:
              - P4-G10-T01
              - P4-G2-T02
              constraints: []
              acceptance: While the process runs, the health signal reports it alive at the configured location, including when readiness is negative.
              verify: Requesting the health signal from a running API reports alive, including while a required dependency is unavailable and readiness is negative.
              status: done
              log:
              - at: '2026-09-29T17:29:00Z'
                transition: "todo -> claimed"
                note: "Claimed by my-interface-develop (log 012) before providing the health signal."
              - at: '2026-09-29T17:29:47Z'
                transition: "claimed -> done"
                check: "Requested the health signal from the composed application before its startup completed, while Logic's Entity Interface was made unavailable, and after a full startup; checked that the signal is absent from the Group contract; ruff and pyright ran clean."
                outcome: "Health answered 200 {status: alive} in all three states and does not appear in the contract of Group Endpoints. It is served at the Preferences' default location; making the location configurable is Task P4-G11-T03. The state 'readiness negative' can be observed only once the readiness signal exists (P4-G11-T02); the combined observation is repeated there and in P4-G15-T09."
            P4-G11-T02:
              id: P4-G11-T02
              source_id: '010'
              title: Provide the readiness signal
              description: Provide a readiness signal, distinct from health, that is positive only after the required configuration has been validated and the dependencies the API can observe through its declared connection are ready, and negative otherwise. It is served at a configurable location and is not an Endpoint of any Group.
              reason: Operators must be able to tell a running process from one that is able to serve requests.
              inputs:
              - Bootstrap composition
              - Validated runtime values
              - Read-only Logic provider
              - Declared readiness location
              skills:
              - python-skills:python-guidelines
              expected_result: A readiness signal that reflects whether the API can serve requests.
              depends_on:
              - P4-G11-T01
              - P4-G2-T02
              - P4-G1-T02
              constraints: []
              acceptance: Readiness is negative before configuration is valid or while a dependency observable through Logic's published surface is unavailable, positive once both are ready, and different from the health signal.
              verify: Requesting the readiness signal before configuration is valid, while a stand-in for Logic is unavailable, and once both are ready shows negative, negative, and positive, while the health signal reports alive throughout.
              status: done
              log:
              - at: '2026-09-29T17:29:47Z'
                transition: "todo -> claimed"
                note: "Claimed by my-interface-develop (log 012) before providing the readiness signal."
              - at: '2026-09-29T17:30:18Z'
                transition: "claimed -> done"
                check: "Requested health and readiness together in five states of a composed application: before its startup completes, started with Logic present, started while Logic's Entity Interface was made unavailable, after Logic returned, and after shutdown; checked the readiness signal is absent from the Group contract; ruff and pyright ran clean."
                outcome: "Readiness read 503 not ready before startup, 200 ready when started with Logic present, 503 while Logic was unavailable, 200 again on recovery and 503 after shutdown, while health read 200 alive in every state, so the two signals differ. 'Before configuration is valid' is observed as 'before startup completes': an API with an invalid runtime value never starts serving (verified in P4-G10-T01), and readiness is only positive after startup, which follows validation. Readiness observes only what Logic's published surface offers (that the Entity Service Interface is published); Database reachability is not independently observable by API (the planned reading, still for the Human to confirm). Observation: the error-tracking record also lists a 503 readiness answer as a failure."
