              acceptance: The User Entity declares a unique display name and unique username, credential Fields flagged sensitive, an active default of true, and an optional description, with no Field, constraint, or default beyond what the Target declares.
              verify: Inspecting the User Entity through the Model's public surface reports a unique display name and unique username, credential Fields flagged sensitive, an active default of true, and an optional description, and an instance built from valid data converts to JSON and back unchanged.
