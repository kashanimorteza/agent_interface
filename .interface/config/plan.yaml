# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 31
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules.
      constraints: []
      task_count: 31
      groups:
        P1-G1:
          id: P1-G1
          title: Library foundation
          description: The independent library that holds everything else the phase produces.
          area: Component packaging
          does: Model exists as an installable, loadable library that every later Model result is placed in.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish Model as an installable, loadable library
              description: Create the independent Model library so a consumer can install it into a clean environment and load it, declaring only the dependencies Model itself needs, each resolved to a concrete compatible version.
              reason: Every other Model result is delivered through this library, and consumers reach Model only when it can be installed and loaded.
              inputs:
              - Model's selected technology and package identity
              - The shared development defaults for language and dependency management
              skills:
              - sqlmodel
              expected_result: A library that installs into a clean isolated environment and loads without error, with a minimal, version-resolved dependency declaration and no application behaviour yet.
              depends_on: []
              constraints: []
              acceptance: The library installs into a clean isolated environment and loads without error, and its dependency declaration lists only what Model needs, each with a concrete resolved version.
              verify: Observe that a fresh isolated environment installs and loads the library successfully, and that its dependency declaration contains no unnecessary item and no unresolved version.
              status: done
              log:
              - at: '2026-09-30T12:15:18.156+03:30'
                transition: todo -> claimed
                evidence: Dependencies done; claimed before changing the result.
              - at: '2026-09-30T12:15:55.023+03:30'
                transition: claimed -> done
                check: Built the library, installed the built wheel into a fresh isolated Python 3.14 environment, and loaded it; listed the installed distributions.
                outcome: 'Install and load succeeded. Runtime dependencies are pydantic 2.13.5 and sqlmodel 0.0.47 (exact pins) with their transitive packages only; ruff 0.16.9 and pyright 1.1.414 are in the dev group and absent from the clean install. Locations: Component directory model/, manifest pyproject.toml, lock uv.lock.'
              - at: '2026-09-30T12:29:28.087+03:30'
                note: 'Amended after verification by P1-G10-T6: a dependency audit (imports versus declarations) showed pydantic_core is imported directly but was declared only transitively. Declared pydantic-core at the exact version pydantic already pins, relocked, rebuilt, and reinstalled the wheel into a fresh environment: 12 packages resolve, runtime set unchanged in substance, load succeeds.'
        P1-G2:
          id: P1-G2
          title: Shared Core contracts
          description: The public contracts and shared behaviour that every Entity relies on and that depend on no specific Entity.
          area: Core
          does: Declaration, Field-contract enforcement, and Foundation conversion exist as reusable Core capabilities independent of any Entity.
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Establish the public Declaration contract
              description: Provide the public structured contract through which every Entity and Field publishes its complete logical meaning, as the Model Definition's Declaration contract requires, carrying no runtime behaviour.
              reason: Consumers and every Entity need one canonical, technology-independent representation of Entity and Field meaning.
              inputs:
              - The Model Definition's Declaration contract
              skills:
              - sqlmodel
              expected_result: A public Declaration contract able to represent any Entity and Field the Target declares, including the difference between an absent default and an explicit null default.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: A Declaration built for a sample Entity exposes every Entity-level and Field-level member with exact values, distinguishes an absent default from an explicit null default, and carries no behaviour.
              verify: Observe through the public contract that a sample Entity Declaration and its Field Declarations return every member unchanged and that an absent default reads differently from an explicit null default.
              status: done
              log:
              - at: '2026-09-30T12:15:55.186+03:30'
                transition: todo -> claimed
                evidence: Dependencies done; claimed before changing the result.
              - at: '2026-09-30T12:16:49.388+03:30'
                transition: claimed -> done
                check: Ran format, lint (ruff) and strict static-type (pyright) checks on the Declaration unit, then a transient behavioural script against the public contract (outside the Component; Model testing capability is off).
                outcome: 'Passed. A sample Declaration exposes name, description, ordered fields, primary key, relations, uniqueness constraints and indexes unchanged; a Field exposes type, nullability, description, sensitivity, immutability, constraints and value generation. Absent default (has_default False) reads differently from explicit null default (has_default True, default None). The records are frozen data with no callable members. Integrity failures (missing/repeated Field, wrong primary key, unresolved relation/constraint, default+generation, null default on non-nullable) are rejected. Unit: model/src/model/core/declaration.py.'
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Establish shared enforcement of Field contracts
              description: Provide the shared behaviour by which any Entity accepts only its declared Fields and enforces required values, nullability, Types, defaults, value generation, constraints, and immutability identically on direct construction and on assignment, keeping an omitted auto-increment identity pending until its owner assigns it.
              reason: A single enforcement path prevents construction and mutation from interpreting omission, null, defaults, or generation differently from one Entity to another.
              inputs:
              - The Declaration contract
              - The Model Definition's construction, mutation, and identity rules
              skills:
              - sqlmodel
              expected_result: Shared behaviour under which an Entity built or changed through the public surface is strictly validated without implicit coercion, and a rejected assignment leaves the prior value intact.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: Unknown Fields, missing required values, null in a non-nullable Field, incompatible values, and changes to an immutable Field are rejected; explicit false, zero, empty string, and null are kept as supplied; a rejected assignment leaves the prior value; an omitted auto-increment identity stays pending and refuses a caller-supplied value.
              verify: Observe on a sample Entity that each invalid construction or assignment is rejected without exposing a sensitive value, each valid supplied value is retained exactly, a rejected assignment leaves the prior value, and an omitted auto-increment identity reads as pending.
              status: done
              log:
              - at: '2026-09-30T12:16:49.555+03:30'
                transition: todo -> claimed
                evidence: Dependencies done; claimed before changing the result.
              - at: '2026-09-30T12:19:06.246+03:30'
                transition: claimed -> done
                check: Format, lint and strict static-type checks on the shared base, then a transient behavioural script (outside the Component) building a sample Entity with integer, string, boolean, float, decimal, datetime, nullable, defaulted and auto-increment Fields.
                outcome: 'Passed. Rejected: unknown Field, missing required value, null in non-nullable Field, wrong types (including bool for integer, str for integer, int for decimal, naive datetime, wrong-size string, NaN float), and any caller-supplied auto-increment value through direct construction, model_validate and JSON validation (even null). Kept exactly: explicit false, zero, empty string and null. A rejected assignment left the prior value. An omitted auto-increment identity reads as pending; it accepts one integer assignment, then refuses any change or reset. Diagnostics from failures on a password-marked Field did not contain the supplied value. A Declaration that disagrees with the annotated Fields (type, nullability, presence, default, order, membership) fails at class creation. Unit: model/src/model/core/_entity.py (private).'
              - at: '2026-09-30T12:29:28.309+03:30'
                note: 'Amended after verification by P1-G10-T5: pydantic''s structured error views (errors() and json()) carried caller-supplied input values, including the whole input mapping when a generated identity was supplied, although str() and repr() did not. Added an outermost wrapping validator that rebuilds any validation failure with the same type, location and message but no input. Reproduced the leak before the change and confirmed no view contains the value afterwards on every entry path (construction, model_validate, JSON validation, assignment, from_json). Earlier enforcement, foundation, entity, interface, documentation and Target checks re-run and pass.'
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Establish shared Entity-to-JSON Object conversion
              description: Provide the public shared capability that turns an Entity into a decoded JSON Object whose keys are exactly its Field names in Declaration order, and rebuilds an Entity from such an Object without loss.
              reason: Consumers need one portable, lossless value representation of every Entity.
              inputs:
              - The Declaration contract
              - The Field-contract enforcement behaviour
              skills:
              - sqlmodel
              expected_result: A Foundation capability that converts any Entity to a JSON Object and back with no change of value, and rejects a malformed Object.
              depends_on:
              - P1-G2-T1
              - P1-G2-T2
              constraints: []
              acceptance: Converting a sample Entity yields exactly its Field names in Declaration order with null, false, zero, and empty string kept distinct; rebuilding from that Object yields identical Field values; a malformed Object, an unknown Field, a missing required value, or an incompatible value is rejected.
              verify: Observe on a sample Entity that conversion and reconstruction round-trip with identical values, that the Object's keys equal the Declaration's Field names in order, and that each listed malformed input is rejected.
              status: done
              log:
              - at: '2026-09-30T12:19:06.409+03:30'
                transition: todo -> claimed
                evidence: Dependencies done; claimed before changing the result.
              - at: '2026-09-30T12:19:38.741+03:30'
                transition: claimed -> done
                check: Format, lint and strict static-type checks on the Foundation unit; transient script (outside the Component) round-tripping sample Entities and feeding malformed input. Earlier Declaration and enforcement checks re-run after Entity began inheriting Foundation.
                outcome: 'Passed. Conversion yields exactly the Field names in Declaration order, JSON-compatible (survives real JSON text outside Model). Reconstruction gives identical values and identical value kinds for null, false, zero, empty string, exact decimals (carried as text) and aware datetimes (carried as ISO 8601 text); a pending auto-increment identity stays pending and an assigned one is restored. Rejected without echoing values: non-mapping input, unknown Field, missing required value, null in non-nullable Field, wrong types, non-text decimal, unparsable or non-finite decimal, unparsable or naive datetime, bad identity value. Unit: model/src/model/core/foundation.py.'
        P1-G3:
          id: P1-G3
          title: Access and connectivity Entities
