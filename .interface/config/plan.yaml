        P2-G6:
          id: P2-G6
          title: Reusable library and manifest
          description: Making Database usable by other Components and discoverable in the shared Application Manifest.
          area: Component packaging
          does: Database is a self-contained library that consumes Model through its published surface and is discoverable by other Components.
          constraints: []
          task_count: 2
          tasks:
            P2-G6-T1:
              id: P2-G6-T1
              source_id: '006'
              title: Make Database consumable as an independent reusable library
              description: Make Database usable by other Components as a self-contained reusable library that uses the shared Model only through Model's published surface and exposes only its own published surface.
              reason: Logic connects to Database as a provider and Database connects to Model as a provider.
              inputs:
              - The published Operations
              - The Model's published Entities
              skills: []
              expected_result: Another Component can use Database's published Operations from outside Database.
              depends_on:
              - P2-G2-T4
              constraints: []
              acceptance: A consumer outside Database can use the published Operations with Model Entities and needs nothing beyond the published surfaces, and Database reaches Model only through Model's published surface.
              verify: A separate consuming context can install Database, import a published Model Entity, and perform an Operation, with no access to Database's private resources.
              status: done
              log:
              - at: '2026-09-28T05:00:40+03:30'
                by: '007'
                from: todo
                to: claimed
                event: claimed by develop before work began
              - at: '2026-09-28T05:03:50+03:30'
                by: '007'
                from: claimed
                to: done
                event: verified
                check: 'Transient check: created an unrelated consuming project outside both libraries, installed Model and Database into it, imported Model Entities and Database''s public names, and ran Count, List with a Filter, an Order and a limit, Get by ID and Execute Command against the provisioned default Instance (read-only); statically scanned every import of Model in Database''s source and migrations.'
                outcome: 'The consumer used the Operations with Model Entities using only the published surfaces; Database imports only Model''s public Interface and Declaration layers. Note for setup: the consumer must add Model itself as well, because uv does not apply a dependency''s local source paths.'
                location: database/pyproject.toml, database/src/database/
              - at: '2026-09-28T05:08:56+03:30'
                by: '007'
                event: note
                note: 'Correction to this Task''s ''done'' evidence: it said the consumer must add Model itself because uv does not apply a dependency''s local source paths. That was wrong. Later observation showed that adding only Database (editable) also installs the local Model through Database''s declared source, and that Database must be installed editable because it finds its configuration relative to its own source (a non-editable install fails with a file-not-found error). The Task''s acceptance still holds.'
