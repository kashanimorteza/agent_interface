# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
  changed_by: "The Plan, Develop, Review, and Reset operations within their ownership; Configure reconciles the structure."
  precedence: "The Plan Schema and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 135
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields,
        relationships, and rules.
      constraints: []
      task_count: 34
      groups:
        P1-G1:
          id: P1-G1
          title: Reusable library setup
          description: Establishes the Model as a standalone reusable library that other Components can
            consume, with a reproducible dependency environment.
          area: The Model's packaging and dependency resolution as an independent library.
          does: The Model exists as an independent, installable library whose dependencies are resolved
            to concrete versions and recorded.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the Model as an independent library
              description: Create the Model as a self-contained reusable library in the selected language,
                with an isolated dependency environment. Resolve every unpinned dependency to a concrete
                compatible version and record the resolution so the environment is reproducible.
              reason: Every later Task needs a library to live in, and consumers need to depend on the Model
                without depending on anything else in the application.
              inputs:
              - Model Preferences for component identity and technology
              - Development defaults for the selected language and package management
              skills:
              - sqlmodel
              expected_result: An empty but valid, installable Model library with its dependency set resolved
                and recorded.
              depends_on: []
              constraints: []
              acceptance: The Model library can be installed into an isolated environment from its recorded
                dependency resolution alone, and importing its entrypoint succeeds without requiring any
                other application Component.
              status: done
              log:
              - at: '2026-10-04T15:49:49Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:50:01Z'
                by: '004'
                status: done
                event: completed
                note: Created the Model as a standalone library with an isolated environment; dependencies
                  resolved to concrete versions (sqlmodel 0.0.47 and its dependency set) and recorded in
                  a lockfile; quality tools (ruff, pyright) declared as development dependencies per Development
                  defaults. uv was unavailable on the machine, so the official uv wheel was fetched from
                  PyPI (checksum verified) into the session scratchpad and not installed into the project
                  or user scope.
                evidence: 'Import of the entrypoint succeeded in the project environment; locked sync reproduced
                  the environment. Library root: model/ (pyproject.toml, uv.lock, model/ package).'
              - at: '2026-10-04T15:50:01Z'
                by: '004'
                event: decision
                unset: Python version bound, build backend, and package layout inside the Component directory
                chosen: requires-python >=3.14 (latest-compatible interpreter available), uv_build backend,
                  flat package directory named model inside the Component directory
                why: Model Preferences state Component directory and package name but not these; Development
                  defaults select uv and latest-compatible Python.
        P1-G2:
          id: P1-G2
          title: Core contracts and shared Entity behaviour
          description: 'Everything shared by all Entities: the public Declaration and Foundation contracts,
            universal Fields, strict Field behaviour, and the storage-ready form. Entities are built on
            this group and it depends on no specific Entity.'
          area: 'The shared Core of the Model: public Declaration contract, JSON Foundation, and shared
            Entity runtime behaviour.'
          does: Every Entity can be defined by supplying only its own Target meaning, and inherits one uniform
            declaration, validation, conversion, and storage-ready behaviour.
          constraints: []
          task_count: 11
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Define the public Declaration contract
              description: Define the structured public records that describe an Entity (name, description,
                ordered Fields, Primary Key, Relations, Uniqueness Constraints, Indexes) and a Field (name,
                description, Type, presence meaning, Default Value, sensitivity, immutability, constraints,
                Value Generation), with no runtime behaviour and no technical choice.
              reason: Consumers must read each Entity's complete meaning from one published structure instead
                of reinterpreting it.
              inputs:
              - Target definition of the Model layer
              - Model Preferences for Declaration member names
              skills:
              - sqlmodel
              expected_result: A shared Declaration contract that can hold every Target-declared Entity
                and Field property, distinguishing an absent Default Value from an explicit null.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: An Entity's Declaration exposes exactly the listed Entity properties and each
                Field's Declaration exposes exactly the listed Field properties, and a Default Value of
                null is distinguishable from no Default Value.
              status: done
              log:
              - at: '2026-10-04T15:52:16Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:52:30Z'
                by: '004'
                status: done
                event: completed
                note: Defined the public Declaration contract as frozen records for Entity, Field, and Relation,
                  with validation of every contradictory or invalid declaration (unknown type or generation,
                  unrecognized sensitivity marker, Default Value combined with Value Generation, default
                  not matching its type, unresolved or duplicate metadata). A Default Value is represented
                  by a singleton marker so absence is distinct from explicit null. Cross-Entity Relation
                  resolution and endpoint-type compatibility is provided as a pure validation function for
                  the Interface to apply.
                evidence: 'Exercised: unknown type, sensitivity marker, and default-with-generation declarations
                  are each rejected with a message naming the Field only; absent default (NO_DEFAULT) differs
                  from default null.'
              - at: '2026-10-04T15:52:30Z'
                by: '004'
                event: decision
                unset: Representation of Default Value presence, Field member names, constraint representation,
                  and relation target field
                chosen: NO_DEFAULT singleton for absence; Field members name, description, type, nullable,
                  default, sensitivity, immutable, constraints, value_generation; constraints as ordered
                  (name, value) pairs; relation target field is the target Entity primary key id
                why: Model Preferences name only Entity and Relation members; Target states relations by
                  Entity and local Field without naming the target Field.
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Supply the universal Identity and Activity Fields
              description: Give every Entity exactly one Identity Field and exactly one Activity Field,
                taking their unstated properties from the Model's Entity defaults, and no other universal
                Field.
              reason: Every record must be identifiable, and every record must be removable from use without
                deletion.
              inputs:
              - Model Preferences Entity defaults
              - Shared Declaration contract
              skills:
              - sqlmodel
              expected_result: Every Entity carries a non-nullable, immutable, auto-incrementing identity
                and a non-nullable, mutable Boolean activity flag defaulting to active.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: Any Entity shows exactly one identity Field that cannot change once assigned and
                exactly one Boolean activity Field defaulting to true that can be changed, and no further
                universal Field.
              status: done
              log:
              - at: '2026-10-04T15:52:30Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: done
                event: completed
                note: Realized the universal Identity (integer, non-nullable, immutable, auto-increment,
                  pending until generated) and Activity (non-nullable Boolean, defaults to active) Fields
                  as shared declaration and column helpers drawn from the Model Entity defaults. No other
                  universal Field added.
                evidence: Declarations built from the helpers show exactly one id and one is_active with
                  the default properties; scratch Entities using them behaved accordingly (id pending as
                  null, is_active true by default, id assignment rejected).
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Enforce strict Field contracts on construction
              description: 'Make direct construction and construction from a JSON Object apply the same
                strict rules: accept only declared Fields, require every required value, honour nullability,
                Types, defaults, generation and constraints, apply no implicit coercion, and keep explicit
                false, zero, empty string, and null as supplied values. Construction performs no storage,
                network, or workflow operation.'
              reason: A single runtime contract stops package conventions from changing or inventing data.
              inputs:
              - Shared Declaration contract
              - Universal Identity and Activity Fields
              skills:
              - sqlmodel
              expected_result: Construction of any Entity is validated identically whichever way it is requested.
              depends_on:
              - P1-G2-T2
              constraints: []
              acceptance: Constructing an Entity from valid values succeeds, while an undeclared Field,
                a value of the wrong Type, a missing required value, and a constraint violation each fail,
                identically for direct and JSON Object construction.
              status: done
              log:
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: done
                event: completed
                note: 'Added the shared Entity base. Every direct construction and every JSON Object construction
                  rejects unknown Fields up front, then runs full strict validation before initialization
                  (table models skip validation on their own). Strict mode: no implicit coercion; explicit
                  false, zero, empty string, and null stay supplied values. Validation errors hide input
                  values. The base also refuses to define an Entity whose realization differs from its own
                  Declaration (name/order, type, nullability, default, primary key, Relation, uniqueness).'
                evidence: 'Scratch Entities: unknown Field, wrong type (string for integer, integer for
                  Boolean, float for decimal), missing required value, size violation, and naive datetime
                  were each rejected on construction; valid construction succeeded; JSON Object construction
                  rejected a decimal given as a JSON number.'
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                event: decision
                unset: How to run validation for table models and which SQLModel internals to rely on
                chosen: Override construction to call model_validate with strict=True before SQLModel initialization,
                  and read SQLModel finish_init flag (a private SQLModel flag) to tell partial initialization
                  from real construction; dependency pinned by lockfile
                why: Model Preferences require running validation before initializing; partial initialization
                  inside model_validate would otherwise recurse.
            P1-G2-T4:
              id: P1-G2-T4
              source_id: '003'
              title: Enforce Field contracts on mutation
              description: Make assignment to a mutable Field revalidate atomically so a failed assignment
                leaves the prior value intact, and make an immutable Field reject any change. Define no
                equality, ordering, hashing, copy, clone, or merge behaviour, and keep mutable Entities
                unhashable.
              reason: Mutation must not be able to leave an Entity in an invalid state or invent behaviour
                beyond the contract.
              inputs:
              - Strict construction behaviour
              skills:
              - sqlmodel
              expected_result: Valid mutation takes effect, invalid mutation is rejected without side effect,
                and immutable Fields stay fixed.
              depends_on:
              - P1-G2-T3
              constraints: []
              acceptance: Assigning a valid value to a mutable Field changes it, assigning an invalid value
                fails and the earlier value remains, changing an immutable Field fails, and a mutable Entity
                cannot be used as a hashing key.
              status: done
              log:
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: done
                event: completed
                note: 'Mutation of a declared Field revalidates the whole Entity atomically: a valid value
                  takes effect, an invalid one raises and leaves the prior value. Immutable and generated
                  Fields reject any assignment. Mutable Entities are unhashable and no equality, ordering,
                  copy, or merge behaviour was added by the Model.'
                evidence: 'Scratch Entity: valid assignment changed the Field; invalid assignment raised
                  and the earlier value remained; assigning id raised; hashing an Entity raised TypeError;
                  session commit after a valid assignment persisted the change.'
            P1-G2-T5:
              id: P1-G2-T5
              source_id: '003'
              title: Keep omitted Auto Increment Fields pending
              description: Make an omitted Auto Increment Field remain in an explicit pending state without
                becoming nullable, reject a caller-supplied value unless the Target explicitly permits one,
                and never assign the value inside the Model.
              reason: Generation of identity values belongs to storage, so the Model must not choose them
                nor let callers do so.
              inputs:
              - Strict construction behaviour
              skills:
              - sqlmodel
              expected_result: Entities can exist before their identity has been assigned and represent
                that state explicitly.
              depends_on:
              - P1-G2-T3
              constraints: []
              acceptance: An Entity constructed without its identity reports a pending identity, is still
                valid, rejects a caller-supplied identity, and the Model never fills the identity in itself.
              status: done
              log:
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                status: done
                event: completed
                note: An omitted Auto Increment Field stays pending as null without the Field becoming nullable
                  in its Declaration; supplying a non-null value on direct construction is rejected; the
                  Model never assigns it (storage does).
                evidence: 'Scratch Entity: constructed without id reported id None and stayed valid; id=3
                  on construction raised; after session commit storage assigned id 1.'
              - at: '2026-10-04T15:55:24Z'
                by: '004'
                event: decision
                unset: Whether JSON Object reconstruction may carry an assigned identity
                chosen: Reconstruction from JSON accepts a non-null identity, direct construction does not
                why: Target does not permit caller-supplied values, but a lossless round trip of a stored
                  Entity is impossible otherwise; JSON text is the representation of an already-stored Entity.
            P1-G2-T6:
              id: P1-G2-T6
              source_id: '003'
              title: Convert an Entity to a JSON Object
              description: Provide the Foundation capability that renders any Entity as JSON text with one
                root object whose keys are exactly the Entity's Field names in Declaration order, preserving
                each Type's semantics and keeping null, false, zero, and empty string distinct. Decimal
                values keep exact precision and datetime values carry their timezone offset. The pending
                identity is rendered as null.
              reason: Consumers need one portable and lossless value representation of every Entity.
              inputs:
              - Shared Declaration contract
              - Universal Identity and Activity Fields
              skills:
              - sqlmodel
              expected_result: A shared conversion from any Entity to JSON text with no added keys, nesting,
                metadata, or value transformation.
              depends_on:
              - P1-G2-T2
              constraints: []
              acceptance: The JSON text for any Entity parses as a standard JSON object with exactly the
                Entity's Field names as keys in Declaration order, and decimal and datetime values keep
                their exact value.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: Foundation to_json renders an Entity as JSON text with a root object whose keys are
                  exactly the Field names in Declaration order; null, false, zero, and empty string stay
                  distinct; decimal as exact string; datetime as ISO 8601 text with offset; pending identity
                  as null; no added keys or nesting.
                evidence: 'Scratch Entity output: {"id": null, "parent_id": 1, "label": "ab", "amount":
                  "1.10", "at": null, "score": 0.0, "is_active": true}.'
            P1-G2-T7:
              id: P1-G2-T7
              source_id: '003'
              title: Reconstruct an Entity from a JSON Object
              description: Provide the Foundation capability that rebuilds an Entity from JSON text, rejecting
                malformed text and otherwise applying the same strict construction rules, so that conversion
                to JSON and back returns an equal Entity without loss.
              reason: A round trip must be lossless for the representation to be trusted by consumers.
              inputs:
              - JSON Object conversion
              - Strict construction behaviour
              skills:
              - sqlmodel
              expected_result: A shared reconstruction from JSON text that is the exact inverse of the conversion.
              depends_on:
              - P1-G2-T3
              - P1-G2-T6
              constraints: []
              acceptance: Reconstructing from the JSON text of any Entity yields an Entity with identical
                Field values, malformed text is rejected, and decimal and datetime values are unchanged
                by the round trip.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: Foundation from_json parses JSON text, rejects malformed text, non-object roots, and
                  mis-typed decimal or datetime values, then constructs through the strict construction
                  rules.
                evidence: 'Scratch Entity: round trip of an Entity equalled the original; malformed text
                  and an array root were rejected; a decimal given as number was rejected; offset datetime
                  text was accepted and read back as the same instant.'
            P1-G2-T8:
              id: P1-G2-T8
              source_id: '003'
              title: Keep sensitivity as metadata only
              description: Accept only the Sensitivity Markers the Model Preferences recognize, expose the
                marker through the Field's Declaration, preserve the actual value unchanged in Entity state
                and JSON Object, and keep sensitive values out of validation and generation diagnostics.
              reason: The Model records what a value means without taking responsibility for protecting
                it, and must never leak it.
              inputs:
              - Model Preferences recognized markers
              - Shared Declaration contract
              skills:
              - sqlmodel
              expected_result: Markers are published as metadata and sensitive values are untouched and
                never echoed.
              depends_on:
              - P1-G2-T3
              - P1-G2-T6
              constraints: []
              acceptance: A marked Field's Declaration shows its marker, its value is identical in Entity
                state and JSON Object, an unrecognized marker is rejected, and no validation failure message
                contains a sensitive value.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: 'Sensitivity markers are accepted only from the recognized set (password, sensitive)
                  and exposed through the Field Declaration; actual values stay unchanged in Entity state
                  and JSON; validation errors never include input values. Observation: the Target declares
                  no Sensitivity Marker on any Model, so none of the Target Entities carries one (Target
                  credential rules concern storage at rest, which belongs to Database).'
                evidence: 'Scratch Entity with a password-marked Field: Declaration showed the marker; value
                  identical in state and JSON; oversize, wrong-type, assignment, and JSON-reconstruction
                  failures all contained no part of the supplied value; an unrecognized marker was rejected.'
            P1-G2-T9:
              id: P1-G2-T9
              source_id: '003'
              title: Stop on an unrecognized Field Type
              description: Make Entity generation stop and report when a Target Field declares a Type that
                the Model does not recognize, rather than guessing a realization.
              reason: A guessed Type would silently change the meaning of the data.
              inputs:
              - Shared Declaration contract
              - Model Preferences Type realizations
              skills:
              - sqlmodel
              expected_result: Entity generation is rejected with an explicit report for any unknown Type.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: A definition containing a Type outside the recognized Target vocabulary produces
                no Entity and a clear report naming the Type, while every recognized Type is accepted.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: An unrecognized Field Type is rejected when its Declaration is created, with a message
                  naming the Field and Type, so no Entity can be defined with it. Implemented as part of
                  the Declaration contract.
                evidence: Declaring a Field with type blob raised "Field 'x' declares unknown type 'blob'";
                  all nine recognized Types were accepted by the vocabulary.
            P1-G2-T10:
              id: P1-G2-T10
              source_id: '003'
              title: Give every Entity its storage-ready form
              description: 'Realize every Entity in a table-ready form: the table takes exactly the Entity''s
                name, each column exactly the Field''s name, the identity column is auto-incrementing, and
                primary key, foreign key, unique, and index constraints are named deterministically in the
                form the Model Preferences list. Declaration remains the sole source of that metadata. The
                Model itself runs no storage.'
              reason: The Database Component consumes the Model through this form, so its naming must be
                exact and predictable.
              inputs:
              - Shared Declaration contract
              - Model Preferences table model and constraint naming
              skills:
              - sqlmodel
              expected_result: A uniform storage-ready realization shared by every Entity.
              depends_on:
              - P1-G2-T2
              constraints: []
              acceptance: For any Entity the table name equals the Entity name, column names equal Field
                names, constraint and index names follow the Preferences' naming forms, and the identity
                column auto-increments.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: 'Storage-ready form: table named exactly as the Entity, columns exactly as Fields,
                  identity column auto-increments (Identity construct and SQLite autoincrement), constraint
                  and index names follow pk_<table>, fk_<table>_<field>, uq_<table>_<fields>, ix_<table>_<fields>
                  through a naming convention on the shared metadata. Combined uniqueness constraints are
                  supplied from the Declaration data by each Entity.'
                evidence: Scratch tables produced constraints pk_Parent, uq_Parent_name, fk_Child_parent_id,
                  uq_Child_parent_id_label and a primary key with AUTOINCREMENT in generated DDL.
            P1-G2-T11:
              id: P1-G2-T11
              source_id: '003'
              title: Preserve exact datetime and decimal values in storage form
              description: Make datetime Fields timezone-aware and held in UTC, restoring UTC awareness
                on any storage engine that drops the offset, and make decimal Fields store exact decimal
                text and read back as exact decimals on every storage engine.
              reason: Financial values and timestamps must not drift or lose meaning when stored.
              inputs:
              - Storage-ready form
              - Model Preferences datetime and decimal storage rules
              skills:
              - sqlmodel
              expected_result: Datetime and decimal Fields round-trip through the storage-ready form without
                change in value.
              depends_on:
              - P1-G2-T10
              constraints: []
              acceptance: A datetime value written in any offset reads back as the same instant, timezone-aware
                in UTC, and a decimal value reads back exactly equal to what was written.
              status: done
              log:
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                status: done
                event: completed
                note: datetime Fields use the timezone-aware type and are stored and read back as UTC-aware
                  (SQLModel selects its UTC-normalizing column, which satisfies the stated UTC rule without
                  forcing a timezone-flagged column that would bypass normalization); decimal Fields use
                  one text-based column type that returns exact Decimal on every Engine.
                evidence: Written +03:00 datetime read back as the same instant in UTC (09:00+00:00 for
                  12:00+03:00); a 28-digit decimal read back exactly equal; the same Numeric default dropped
                  digits (1.1234567890) in a probe.
              - at: '2026-10-04T15:55:25Z'
                by: '004'
                event: decision
                unset: How to realize timezone-aware storage
                chosen: Rely on the aware datetime type SQLModel maps to its UTC column instead of a manually
                  timezone-flagged column
                why: The installed SQLModel guidance states the manual override bypasses UTC normalization;
                  the observable requirement (stored in UTC, read back UTC-aware) is met.
        P1-G3:
          id: P1-G3
          title: Target Entities
          description: 'One Entity for every Model in the Target, each defined independently as a flat unit
            that preserves its Target meaning exactly: every Field with its order, Type, nullability, defaults,
            and constraints, plus its Relations, Uniqueness Constraints, and Indexes, using the Target''s
            exact logical names.'
          area: 'The Entity layer of the Model: one unit per Target model, in Target order.'
          does: Every Target model exists as an Entity whose public Declaration, construction behaviour,
            and JSON conversion match its Target definition.
          constraints: []
          task_count: 15
          tasks:
            P1-G3-T1:
              id: P1-G3-T1
              source_id: '003'
              title: Define the User Entity
              description: Define User as the Model Entity for an independent user of the system, with its
                unique name and username and its credential Fields.
              reason: User is a Target Model and therefore must be published as an Entity.
              inputs:
              - Target definition of User
              - Shared Core contracts
              skills:
              - sqlmodel
              expected_result: The User Entity, complete with its Declaration and Foundation capabilities.
              depends_on:
              - P1-G2-T2
              - P1-G2-T3
              - P1-G2-T4
              - P1-G2-T5
              - P1-G2-T6
              - P1-G2-T7
              - P1-G2-T10
              - P1-G2-T11
              constraints: []
              acceptance: User exposes a Declaration matching its Target definition, including unique name
                and username, and its credential Fields preserve their values.
              status: done
              log:
              - at: '2026-10-04T15:56:40Z'
                by: '004'
                status: claimed
