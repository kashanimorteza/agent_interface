              source_id: '007'
              title: Verify persistent file storage stays Database-owned
              description: Verify that the file-backed Instance keeps its data in Database-owned storage regardless of installation, environment, working location, and consumer, and rejects an escaping location.
              reason: Data must survive and remain findable however Database is used.
