                outcome: "330 collection requests: each accepted size (1 to 100) reached Logic with exactly that limit, an unfiltered list reached Logic with limit 50 and nothing else, and every other size was refused before Logic; 1275 filter, ordering or page-like inputs were all refused (422) and none reached Logic; 732 aggregate requests: only the published Fields reached Logic (unchanged), and every credential, unknown and hostile name was refused before Logic. 0 problems."
