                event: correction
                from_status: done
                to_status: done
                note: 'Defect found while planning troubleshooting documentation: recognising an already-encrypted value by trial decryption meant that, after the key was replaced, reading a record and storing it back would encrypt the ciphertext again. Recognition is now by the value''s structure, independent of the key. Re-verified: the reversible-protection check (original recovered only with the referenced secret; a token from another secret is recognised by shape but not decryptable; plain and arbitrary text are not recognised) and a new check in which, after the key was replaced, reading Instance and Account records and storing them back through Update left every stored encrypted value identical. Formatter, linter, and type checker still clean.'
