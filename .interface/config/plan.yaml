# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 38
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Deliver the independent, reusable Model library that publishes every Target Entity, in Target order, each reproducing its Target definition exactly, together with its documentation."
      constraints: []
      task_count: 38
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Library foundation"
          description: "Work that makes Model exist as a self-contained library other Components can depend on."
          area: "Model's identity as an independent, reusable library"
          does: "Model stands alone as a reusable library that declares only the dependencies it needs."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "002"
              title: "Establish Model as an independent reusable library"
              description: "Create the Model library as a self-contained unit that other Components can take as a dependency, with its own declaration of the dependencies it needs and the versions they resolve to."
              reason: "Every later piece of Model work needs a home, and the Components that consume Model can only do so if it stands alone."
              inputs: ["The selected language and realization profile for Model"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "A Model library that another Component can take as a dependency, whose dependencies are exactly those Model itself needs, each at a concrete resolved version."
              depends_on: []
              constraints: []
              acceptance: "A consumer that has only Model and Model's own declared dependencies available can load Model with no other Component present, and every declared dependency carries a concrete version."
              status: "done"
              log:
                - at: "2026-09-30T19:58:37Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began."
                - at: "2026-09-30T19:58:51Z"
                  status: "done"
                  note: "Created the Model library: pyproject.toml (concrete pins pydantic==2.13.5, sqlmodel==0.0.47, build backend pinned, Python >=3.14 per the Development default 'latest-compatible'), uv.lock, package 'model'. Smoke: package imports from the project environment. Conformance is established by Review."
        P1-G2:
          id: "P1-G2"
          title: "Shared Entity contracts"
          description: "The public Declaration contract, the strict Field rules, the sensitivity metadata, and the lossless JSON conversion that every Entity shares."
          area: "Core: the Declaration and Foundation contracts and the Field rules shared by every Entity"
          does: "Every Entity can rely on one public Declaration contract, one set of strict Field rules, and one lossless JSON conversion, without the shared area depending on any specific Entity."
          constraints: []
          task_count: 10
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "002"
              title: "Define the Field Declaration contract"
              description: "Provide the public structured record that states one Field's meaning: its name, description, Type, nullability, whether a Default Value is explicitly present and what it is, optional Sensitivity Marker, immutability, applicable constraints, and optional Value Generation. The record carries no behaviour."
              reason: "Consumers must read Field meaning from one canonical record instead of inferring it from storage or transport."
              inputs: ["The Field meaning a Declaration must expose"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "A public Field Declaration able to express every Field property Model preserves, including the difference between an absent Default Value and an explicit null."
              depends_on: ["P1-G1-T1"]
              constraints: []
              acceptance: "A Field Declaration can express a Field with no default, a Field whose default is explicitly null, a Field whose default is false or zero, and a generated Field, and each reads back exactly as recorded."
              status: "done"
              log:
                - at: "2026-09-30T20:00:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G1-T1 is done."
                - at: "2026-09-30T20:00:51Z"
                  status: "done"
                  note: "Produced the Field Declaration contract: a frozen, behaviour-free record with name, description, Type, nullability, explicit Default Value presence and value (has_default/default), Sensitivity Marker, immutability, constraints and Value Generation. Construction rejects an unknown Type (naming the Field), unknown marker or generation, a Default Value together with Value Generation, and a value without has_default. Conformance is established by Review."
            P1-G2-T2:
              id: "P1-G2-T2"
              source_id: "002"
              title: "Define the Entity Declaration contract"
              description: "Provide the public structured record that states one Entity's meaning: its name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes. A Relation records only its local Field, target Entity name, and target Field name, and Uniqueness Constraints and Indexes preserve their ordered participating Fields."
              reason: "Consumers must read Entity meaning and structure from one canonical record that any realization can be compared against."
              inputs: ["The Field Declaration contract"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "A public Entity Declaration able to express every Entity property and piece of Entity Metadata Model preserves."
              depends_on: ["P1-G2-T1"]
              constraints: []
              acceptance: "An Entity Declaration with several Relations and a combined Uniqueness Constraint reads back its Fields and metadata in the order recorded, and a local Field reference that does not resolve within the Entity, a repeated participating Field, or a duplicate metadata declaration is rejected."
              status: "done"
              log:
                - at: "2026-09-30T20:00:51Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T1 is done."
                - at: "2026-09-30T20:01:11Z"
                  status: "done"
                  note: "Produced the Entity Declaration contract (and the Relation record): a frozen record of name, description, ordered Fields, Primary Key, Relations (local Field, target Entity name, target Field name), and ordered Uniqueness Constraints and Indexes. Construction rejects an unresolved local Field, a repeated participating Field, a duplicate Relation/Constraint/Index, and an Entity without the mandatory id (non-nullable, immutable) and is_active (non-nullable mutable Boolean). Smoke: rejections observed. Conformance is established by Review."
            P1-G2-T3:
              id: "P1-G2-T3"
              source_id: "002"
              title: "Enforce strict Field contracts on construction"
              description: "Make constructing an Entity accept only declared Fields and enforce required values, nullability, defaults, and value constraints, treating explicit false, zero, empty string, and null as supplied values. The rules apply identically to direct construction and construction from a JSON Object, and construction performs no storage, network, or application operation."
              reason: "One construction contract prevents valid data in one place from being rejected in another."
              inputs: ["The Entity Declaration contract"]
              skills: ["pydantic:pydantic", "python-skills:python-guidelines"]
              expected_result: "Entities that can be constructed only from values satisfying their declared Field contracts."
              depends_on: ["P1-G2-T2"]
              constraints: []
              acceptance: "Constructing with an undeclared Field, a missing required value, or a null for a non-nullable Field is rejected; an explicit false, zero, empty string, or permitted null keeps exactly that value; and a default applies only to an omitted Field."
              status: "done"
              log:
                - at: "2026-09-30T20:01:11Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T2 is done."
                - at: "2026-09-30T20:01:34Z"
                  status: "done"
                  note: "Produced the private shared base enforcing strict Field contracts: undeclared Fields forbidden, required/nullable/default rules, no implicit coercion (strict validation), finite floats only, sensitive input values hidden from diagnostics, and construction-time verification that each Entity's Python Fields realize its Declaration (Type, nullability, Default Value, required, constraints, order). Smoke: a conforming class loads and six deliberate mismatches are each rejected. Conformance is established by Review."
            P1-G2-T4:
              id: "P1-G2-T4"
              source_id: "002"
              title: "Enforce Field value categories without coercion"
              description: "Make each Field accept values only of its declared Type, including exact decimal values and timezone-aware datetimes, and never convert a value of another category implicitly. A Target Type that Model does not recognise stops generation instead of being guessed."
              reason: "Implicit conversion would let the same record mean different things to different consumers."
              inputs: ["The Entity Declaration contract"]
              skills: ["pydantic:pydantic"]
              expected_result: "Field values that keep their declared category and exact value, and a generation that refuses an unknown Type."
              depends_on: ["P1-G2-T2"]
              constraints: []
              acceptance: "A value of the wrong category is rejected for every Type the Target uses, a decimal keeps its exact value, a datetime keeps its exact instant, and an unrecognised Type in the Target halts generation with a report naming the affected Field."
              status: "done"
              log:
                - at: "2026-09-30T20:01:11Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T2 is done."
                - at: "2026-09-30T20:01:34Z"
                  status: "done"
                  note: "Field values keep their declared category: Types map to str, int, float, decimal.Decimal, bool and pydantic.AwareDatetime under strict validation (no implicit conversion); Declaration construction halts on an unrecognised Type naming the Field. Observation for Review: strict mode accepts an integer value for a float Field. Conformance is established by Review."
            P1-G2-T5:
              id: "P1-G2-T5"
              source_id: "002"
              title: "Keep mutation atomic and respect immutable Fields"
              description: "Make changing a mutable Field re-check the full Field contract before the change takes effect, leave the previous value untouched when the change is rejected, and refuse any change to an immutable Field once it is assigned."
              reason: "A failed change must never leave an Entity half-updated or alter a value the Target declares fixed."
              inputs: ["Strict construction and value-category rules"]
              skills: ["pydantic:pydantic"]
              expected_result: "Entities whose mutable Fields change only to valid values and whose immutable Fields never change."
              depends_on: ["P1-G2-T3", "P1-G2-T4"]
              constraints: []
              acceptance: "An invalid assignment is rejected and the Field still holds its previous value, a valid assignment takes effect, and assigning to an immutable Field after it is set is rejected."
              status: "done"
              log:
                - at: "2026-09-30T20:01:35Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependencies P1-G2-T3 and P1-G2-T4 are done."
                - at: "2026-09-30T20:01:58Z"
                  status: "done"
                  note: "Produced atomic mutation: assignment revalidates the full Field contract before taking effect (a rejected assignment leaves the previous value), and an immutable Field refuses any change once assigned. Smoke: an over-long assignment and a wrongly typed assignment were rejected with the prior value kept; reassigning an assigned id was rejected. Conformance is established by Review."
            P1-G2-T6:
              id: "P1-G2-T6"
              source_id: "002"
              title: "Support pending generated identities"
              description: "Let an omitted Auto Increment Field remain in an explicit pending state without becoming nullable, reject a caller-supplied value for it unless the Target explicitly permits one, and leave assignment of its value to the owning persistence realization."
              reason: "The Component that stores a record, not the caller, is responsible for assigning its generated identity."
              inputs: ["Strict construction rules"]
              skills: ["pydantic:pydantic"]
              expected_result: "Entities that can exist before their generated identity has been assigned."
              depends_on: ["P1-G2-T3"]
              constraints: []
              acceptance: "An Entity constructed without its auto-incremented Field is valid and reports that Field as pending, supplying a value for that Field is rejected, and the Field never accepts a null as a supplied value."
              status: "done"
              log:
                - at: "2026-09-30T20:01:35Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependencies P1-G2-T3 and P1-G2-T4 are done."
                - at: "2026-09-30T20:01:58Z"
                  status: "done"
                  note: "Produced pending generated identities: an omitted Auto Increment Field stays None (pending) without becoming nullable; construction rejects a supplied value (including null); assignment by the owning persistence realization is accepted once and never as null. Decision recorded for Review/Human: direct construction rejects a supplied Auto Increment value, while reconstruction from JSON text (P1-G2-T9) treats the JSON value as the Entity's assigned identity state, so an Entity whose identity has been assigned still round-trips. Conformance is established by Review."
            P1-G2-T7:
              id: "P1-G2-T7"
              source_id: "002"
              title: "Preserve Sensitivity Markers as metadata only"
              description: "Accept only recognised Sensitivity Markers, expose a Field's marker through its Declaration, keep the actual value unchanged in Entity state, and keep sensitive values out of every validation and generation diagnostic."
              reason: "Model records what a value means without taking ownership of protecting it."
              inputs: ["The Field Declaration contract", "Strict construction rules"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "Fields that can carry a recognised marker without any change to their values."
              depends_on: ["P1-G2-T1", "P1-G2-T3"]
              constraints: []
              acceptance: "A Field carrying a recognised marker exposes it through its Declaration, an unrecognised marker is rejected, a stored value reads back unchanged, and a rejected construction never echoes the sensitive value."
              status: "done"
              log:
                - at: "2026-09-30T20:01:58Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependencies P1-G2-T1 and P1-G2-T3 are done."
                - at: "2026-09-30T20:02:08Z"
                  status: "done"
                  note: "Sensitivity Markers are metadata only: a Field Declaration accepts only the recognised markers named by Model Preferences (password, sensitive) and exposes the marker; Entity state keeps values unchanged; validation diagnostics hide input values (smoke: a rejected construction did not echo the supplied value). No Target Field declares a marker, so none is recorded. Conformance is established by Review."
            P1-G2-T8:
              id: "P1-G2-T8"
              source_id: "002"
              title: "Convert an Entity to JSON text"
              description: "Provide the shared conversion that turns an Entity into JSON text with one object at its root whose keys are exactly the Entity's Field names in Declaration order, preserving declared Type semantics and distinguishing null, false, zero, and empty string."
              reason: "Consumers need one portable, language-independent representation of an Entity."
              inputs: ["The Entity Declaration contract", "Value-category and pending-identity rules"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "A conversion from any Entity to JSON text."
              depends_on: ["P1-G2-T2", "P1-G2-T4", "P1-G2-T6"]
              constraints: []
              acceptance: "Converting an Entity yields valid JSON text whose single root object has exactly the Entity's Fields as keys in declared order, separates null from false, zero, and empty string, keeps decimal precision and datetime offset, leaves sensitive values unchanged, and shows a pending generated Field as null."
              status: "done"
              log:
                - at: "2026-09-30T20:01:58Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependencies P1-G2-T2, P1-G2-T4 and P1-G2-T6 are done."
                - at: "2026-09-30T20:02:08Z"
                  status: "done"
                  note: "Produced the shared Entity-to-JSON-text conversion (to_json on Foundation): JSON text with one object at its root whose keys are the Field names in Declaration order; decimals as strings, datetimes as ISO 8601 with offset, null/false/zero/empty string kept distinct, a pending generated Field shown as null. Smoke: sample output checked for key order, exact decimal and offset. Conformance is established by Review."
            P1-G2-T9:
              id: "P1-G2-T9"
              source_id: "002"
              title: "Reconstruct an Entity from JSON text"
              description: "Provide the shared reverse conversion that rebuilds an Entity from JSON text, rejects malformed text, and applies the same strict Field contracts as direct construction."
              reason: "Lossless reconstruction is what makes the JSON representation usable as the portable form of an Entity."
              inputs: ["Strict construction rules", "The Entity-to-JSON-text conversion"]
              skills: ["pydantic:pydantic", "python-skills:python-guidelines"]
              expected_result: "A conversion from JSON text back to an Entity."
              depends_on: ["P1-G2-T3", "P1-G2-T8"]
              constraints: []
              acceptance: "Text produced by the conversion rebuilds an Entity equal in every Field, including exact decimal and datetime values, and text that is malformed, carries an undeclared key, or holds a wrongly typed value is rejected."
              status: "done"
              log:
                - at: "2026-09-30T20:02:08Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependencies P1-G2-T3 and P1-G2-T8 are done."
                - at: "2026-09-30T20:02:31Z"
                  status: "done"
                  note: "Produced the JSON-text-to-Entity conversion (from_json on Foundation): standard-library JSON parsing (non-standard constants and non-object roots rejected), strings converted by each Field's declared Type (decimal, datetime, date, time, uuid), then the same strict construction as direct construction (undeclared keys, wrong categories, nulls for non-nullable Fields rejected). JSON null on a generated Field stays pending; a generated value restores an assigned identity. Smoke: pending and assigned Entities round-trip equal with exact decimal and offset; ten malformed or wrongly typed inputs rejected. Decision recorded for Human review: a strict global pydantic JSON mode rejects JSON strings for Decimal/datetime, so conversion is explicit per declared Type. Conformance is established by Review."
            P1-G2-T10:
              id: "P1-G2-T10"
              source_id: "002"
              title: "Make the shared contracts available through every Entity"
              description: "Arrange the Declaration and Foundation contracts and the strict Field rules so that every Entity exposes its own Declaration and the shared conversions, while the shared area depends on neither the Interface nor any specific Entity."
              reason: "Each Entity can then be realized independently without duplicating shared rules."
              inputs: ["Every shared Entity contract"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "One shared area from which every Entity obtains its Declaration, conversions, and Field rules."
              depends_on: ["P1-G2-T2", "P1-G2-T3", "P1-G2-T4", "P1-G2-T5", "P1-G2-T6", "P1-G2-T7", "P1-G2-T8", "P1-G2-T9"]
              constraints: []
              acceptance: "An Entity built on the shared area reaches its own Declaration and both JSON conversions, and the shared area loads and works with no Entity and no Interface present."
              status: "done"
              log:
                - at: "2026-09-30T20:02:31Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; all eight prerequisite Tasks are done."
                - at: "2026-09-30T20:02:39Z"
                  status: "done"
                  note: "Core arrangement: every Entity inherits Foundation (public), which derives from the private Base; each Entity therefore exposes its own Declaration (class attribute declaration) and the shared to_json/from_json, with the strict Field rules applied by the base. Declaration and Foundation sit in their own core units and Core imports neither Entity nor Interface (checked by search). Conformance is established by Review."
        P1-G3:
          id: "P1-G3"
          title: "Identity and platform connection Entities"
          description: "The Entities that describe who uses the system, which trading platforms it supports, and the connections users hold to those platforms."
          area: "Entity realization for users, supported trading platforms, and platform connection instances"
          does: "User, Trading Platform, and Instance are available as complete public Entities."
          constraints: []
          task_count: 3
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              source_id: "002"
              title: "Realize the User Entity"
              description: "Make User available as a public Entity describing one independent user of the system, including the credentials that identify that user."
              reason: "Multi-user operation starts from a User that every owner-scoped Entity refers to."
              inputs: ["The Target's User definition"]
              skills: ["sqlmodel"]
              expected_result: "A public User Entity."
              depends_on: ["P1-G2-T10"]
              constraints: []
              acceptance: "User's Declaration shows both of its uniquely identifying Fields as unique, and a User constructs once its names and credentials are supplied, taking the Target defaults for its remaining Fields."
              status: "done"
              log:
                - at: "2026-09-30T20:02:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T10 is done."
                - at: "2026-09-30T20:05:49Z"
                  status: "done"
                  note: "Produced the User Entity as one public unit, generated from the Technical Definition so Field names, order, Purpose text, Types, nullability, defaults and metadata reproduce it exactly: 7 Fields; unique name and username. Its Declaration is the class attribute declaration. Smoke: the unit loads (Declaration consistency check passes), constructs from required values, and round-trips through JSON text. Conformance is established by Review."
            P1-G3-T2:
              id: "P1-G3-T2"
              source_id: "002"
              title: "Realize the Trading Platform Entity"
              description: "Make Trading Platform available as a public Entity describing one supported trading API standard and the implementation it selects."
              reason: "The system must stay independent of any one exchange or broker by describing each supported platform as data."
              inputs: ["The Target's Trading Platform definition"]
              skills: ["sqlmodel"]
              expected_result: "A public Trading Platform Entity."
              depends_on: ["P1-G2-T10"]
              constraints: []
              acceptance: "Trading Platform's Declaration shows its unique name, and a Trading Platform constructs from its name and implementation-selecting code, taking the Target default for its active state."
              status: "done"
              log:
                - at: "2026-09-30T20:02:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T10 is done."
                - at: "2026-09-30T20:05:49Z"
                  status: "done"
                  note: "Produced the Trading Platform Entity as one public unit, generated from the Technical Definition so Field names, order, Purpose text, Types, nullability, defaults and metadata reproduce it exactly: 5 Fields; unique name. Its Declaration is the class attribute declaration. Smoke: the unit loads (Declaration consistency check passes), constructs from required values, and round-trips through JSON text. Conformance is established by Review."
            P1-G3-T3:
              id: "P1-G3-T3"
              source_id: "002"
              title: "Realize the Instance Entity"
              description: "Make Instance available as a public Entity describing one user-owned connection to a supported Trading Platform, with the optional technical connection details that platform may require."
              reason: "A user's connection to a platform is owned by that user and must be described separately from the platform itself."
              inputs: ["The Target's Instance definition"]
              skills: ["sqlmodel"]
              expected_result: "A public Instance Entity."
              depends_on: ["P1-G2-T10"]
              constraints: []
              acceptance: "Instance's Declaration shows its Relations to User and Trading Platform and the uniqueness of its owner together with its name, and an Instance constructs without its optional connection Fields."
              status: "done"
              log:
                - at: "2026-09-30T20:02:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T10 is done."
                - at: "2026-09-30T20:05:49Z"
                  status: "done"
                  note: "Produced the Instance Entity as one public unit, generated from the Technical Definition so Field names, order, Purpose text, Types, nullability, defaults and metadata reproduce it exactly: 10 Fields; Relations to User and Trading Platform; unique user_id + name; optional connection Fields nullable. Its Declaration is the class attribute declaration. Smoke: the unit loads (Declaration consistency check passes), constructs from required values, and round-trips through JSON text. Conformance is established by Review."
        P1-G4:
          id: "P1-G4"
          title: "Reference data Entities"
          description: "The Entities that describe the currencies, brokers, and tradable assets the system works with."
          area: "Entity realization for currencies, brokers, and tradable assets"
          does: "Currency, Broker, and Asset are available as complete public Entities."
          constraints: []
          task_count: 3
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              source_id: "002"
              title: "Realize the Currency Entity"
              description: "Make Currency available as a public Entity describing one usable currency with its standard code, display sign, region, and decimal precision."
              reason: "Accounts and monetary values need a per-user description of each usable currency."
              inputs: ["The Target's Currency definition"]
              skills: ["sqlmodel"]
              expected_result: "A public Currency Entity."
              depends_on: ["P1-G2-T10"]
              constraints: []
              acceptance: "Currency's Declaration shows its owner Relation, its length-limited code, and the uniqueness of owner together with code, and a Currency constructs from its owner and code, taking the Target default for decimal digits."
              status: "done"
              log:
                - at: "2026-09-30T20:02:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T10 is done."
                - at: "2026-09-30T20:05:49Z"
                  status: "done"
                  note: "Produced the Currency Entity as one public unit, generated from the Technical Definition so Field names, order, Purpose text, Types, nullability, defaults and metadata reproduce it exactly: 8 Fields; Relation to User; code limited to 3 characters; unique user_id + code; decimal_digits defaults to 2. Its Declaration is the class attribute declaration. Smoke: the unit loads (Declaration consistency check passes), constructs from required values, and round-trips through JSON text. Conformance is established by Review."
            P1-G4-T2:
              id: "P1-G4-T2"
              source_id: "002"
              title: "Realize the Broker Entity"
              description: "Make Broker available as a public Entity describing one broker a user has configured, independent of any trading platform."
              reason: "Accounts and assets must refer to a broker without being coupled to one trading platform."
              inputs: ["The Target's Broker definition"]
              skills: ["sqlmodel"]
              expected_result: "A public Broker Entity."
              depends_on: ["P1-G2-T10"]
              constraints: []
              acceptance: "Broker's Declaration shows its owner Relation and the uniqueness of owner together with name."
              status: "done"
              log:
                - at: "2026-09-30T20:02:39Z"
                  status: "claimed"
                  note: "Claimed by my-interface-develop (Log Entry 003) before work began; dependency P1-G2-T10 is done."
