                outcome: 'Passed. Relations to User and Trading Platform by logical name; owner-plus-name uniqueness; password and api_key markers; ip, username, password and api_key nullable and null when omitted; constructing without owner or platform is rejected. Unit: model/src/model/entity/instance.py.'
