                outcome: "With no origin listed no answer carried cross-origin permission for any origin (preflight answered 405, no header); with origins listed, exactly those origins were granted (simple and preflight requests answered with that origin), while an unlisted origin and the look-alike origin received no permission (preflight 400, no header). The cross-origin layer is added only when Platform's runtime bindings list origins; the API Preferences declare the policy disabled and list none, so the Platform list is the only source of admitted origins."
            P4-G10-T04:
              id: P4-G10-T04
              source_id: '010'
              title: Stop gracefully within the declared wait
              description: 'Honour the declared wait for graceful shutdown: when the running API is asked to stop, it stops accepting new requests and lets requests already in progress finish within that wait.'
