                log_entry: '005'
                event: completed
                from_status: claimed
                to_status: done
                check: 'Transient script (private configuration with its own key file) encrypted a value and asserted: the stored form differs from the value and does not contain it, decrypting with the referenced secret returned the original, a second configuration with a different secret could not decrypt it, replacing the key changed the outcome, and encrypting twice gave different forms.'
                outcome: 'passed: original recovered only with the referenced secret'
                locations: my_database/src/my_database/protection.py (Protection.encrypt, decrypt, is_encrypted)
