              "constraints": []
              "acceptance": "Every field, type, nullability, default, key, reference, uniqueness, and sensitive flag declared for User is present and nothing undeclared is added."
              "verify": "Inspecting the published declaration of User shows exactly the declared items, an instance can be constructed directly, and it survives a JSON round trip with equal values."
              "status": "done"
              "log":
              - "at": "2026-09-26T22:51:57Z"
