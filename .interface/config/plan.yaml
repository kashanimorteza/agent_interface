        "P2-G4":
          "id": "P2-G4"
          "title": "Credential storage protection"
          "description": "Storage-level protection applied to the Target-declared sensitive credential Fields, as decided outside Model."
          "area": "Storage-level protection of sensitive credential Fields"
          "does": "Every Target-declared sensitive credential Field is protected in storage exactly as its Model's Rule requires."
          "constraints": []
          "task_count": 3
          "tasks":
            "P2-G4-T1":
              "id": "P2-G4-T1"
              "source_id": "006"
              "title": "Apply hash storage to the User Model's credential Fields"
              "description": "Ensure the User Model's password and api_key Fields are stored using hash storage at rest, so that no persisted User record exposes either value in a reversible form."
              "reason": "The User Model's declared Rules require its password and api_key credentials to use hash storage at rest, and that handling is decided outside Model, inside Database."
              "inputs":
              - "The User Entity's declared sensitive Fields"
              - "The User Model's declared storage Rules"
              "skills": []
              "expected_result": "Every persisted User record stores its password and api_key as a hash, never as the original submitted value."
              "depends_on":
              - "P2-G2-T1"
              - "P2-G2-T3"
              "constraints": []
              "acceptance": "A User record added or updated with a password or api_key value never stores that original value; only a hash of it is present in storage."
              "verify": "Adding a User with a known password and api_key and inspecting the persisted record shows a hash rather than the original value, and no stored representation allows recovering the original value."
              "status": "todo"
            "P2-G4-T2":
              "id": "P2-G4-T2"
              "source_id": "006"
              "title": "Apply encrypted storage to the Instance Model's credential Fields"
              "description": "Ensure the Instance Model's password and api_key Fields are stored using encrypted storage at rest, so a persisted Instance record can be decrypted back to its original connection credential when legitimately needed."
              "reason": "The Instance Model's declared Rules require its password and api_key to use encrypted storage at rest."
              "inputs":
              - "The Instance Entity's declared sensitive Fields"
              - "The Instance Model's declared storage Rules"
              "skills": []
              "expected_result": "Every persisted Instance record stores its password and api_key encrypted, recoverable only through the intended decryption process."
              "depends_on":
              - "P2-G2-T1"
              - "P2-G2-T3"
              "constraints": []
              "acceptance": "An Instance record added or updated with a password or api_key value never stores that original value in plain form; storage holds an encrypted representation that the intended decryption process reproduces exactly."
              "verify": "Adding an Instance with a known password and api_key and inspecting the persisted record shows an encrypted representation, and decrypting that stored representation reproduces the original value."
              "status": "todo"
