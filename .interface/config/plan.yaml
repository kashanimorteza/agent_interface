        P3-G8:
          id: P3-G8
          title: Credential protection
          description: The at-rest treatment the Target declares for credential Fields, hash storage for User credentials and encrypted storage for Instance and Account credentials, applied by the owning Entity's Child Service whenever a value is added or updated through Entity Service, together with the Target's rule that one credential is not duplicated across Account and Instance. The raw Storage Service route publishes Database's contract unchanged and stays outside this Group.
          area: Entity-specific credential Behaviour of the User, Instance, and Account Child Services
          does: Credential Fields the Target names are stored only in their declared protected form whenever they are written through Entity Service, and no credential value is duplicated across Account and Instance.
          constraints: []
          task_count: 8
          tasks:
            P3-G8-T01:
              id: P3-G8-T01
              source_id: '008'
              title: Protect the User password at rest
              description: Make the User Child Service store the User's password only as a one-way hash, as the Target declares, whenever a User is added or updated, so that the supplied plain value is never stored and an update that does not change it never alters the stored value.
              reason: The Target requires the User password to use hash storage at rest, and neither Model nor Database applies any behaviour based on the meaning of a Field.
              inputs:
              - Target rule for the User password
              - Runtime configuration contract for credential protection
              - User Child Service
              skills:
              - python-skills:python-guidelines
              expected_result: A User password that is stored only in its hash form whenever written through Entity Service.
              depends_on:
              - P3-G6-T01
              - P3-G2-T02
              - P3-G4-T02
              constraints: []
              acceptance: After a User is added through Entity Service, the stored password is not the supplied value and Logic offers no way to turn it back into that value; updating the User with its password unchanged leaves the stored value unchanged; updating it with a new password replaces the stored value with a protected form of the new value.
              verify: Adding a User, then reading the stored record directly through Storage, shows a password different from the supplied one; updating the User with its password unchanged shows an identical stored value; updating it with a new password shows a stored value different from both the earlier stored value and the new plain value.
              status: done
              log:
              - at: '2026-09-29T13:35:15Z'
                transition: todo -> claimed
                note: 'Claimed by my-interface-develop (log 009) before writing the credential-protecting behaviour of the User, Instance, and Account Child Services. Recorded: the shared protection helpers in Logic''s Core were written earlier, together with the configuration contract, before this claim.'
