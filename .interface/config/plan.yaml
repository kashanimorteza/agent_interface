# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 149
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules.
      constraints: []
      task_count: 29
      groups:
        P1-G1:
          id: P1-G1
          title: Independent library
          description: Establishes Model as a self-contained, reusable library so that Database and Logic can consume its public surface without any other Component.
          area: Model as a standalone reusable library
          does: Model exists as an independent library with its own isolated environment and dependency set, ready to receive its layers.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T01:
              id: P1-G1-T01
              source_id: '002'
              title: Establish the Model library as an independent reusable unit
              description: Create the Model Component as a standalone library with its own isolated development environment and dependency management, so that it depends on no other Component and can be consumed by other Components through its public surface only.
              reason: Every later Task places its result inside this library, and Database and Logic must be able to consume it independently.
              inputs:
              - The Model Component definition and preferences
              - The shared Development defaults
              skills: []
              expected_result: An empty but consumable Model library exists with its own environment and dependency management and no dependency on any other Component.
              depends_on: []
              constraints: []
              acceptance: The library can be set up from scratch in an isolated environment and its public surface can be imported by a consumer that has no other Component present.
              verify: In a clean isolated environment, install the library and import its public surface; the import succeeds and no other Component is required.
              status: done
              log:
              - at: '2026-09-27T23:37:24Z'
                status: claimed
                note: Claimed before creating the Model library project.
              - at: '2026-09-27T23:37:44Z'
                status: done
                check: Created a fresh venv outside the project, installed the model directory into it, and ran python -c 'import model' from a neutral working directory; listed installed packages.
                outcome: 'Passed: import succeeded; the environment held only model plus its third-party dependencies (sqlmodel, sqlalchemy, pydantic, etc.); no other Component module was loaded.'
        P1-G2:
          id: P1-G2
          title: Declaration capabilities
          description: Provides the public Declaration layer through which every Entity records its complete technology-independent meaning. Declaration holds meaning and metadata only and never runtime behaviour.
          area: Declaration layer
          does: Declaration can record every kind of Field, identity, relationship, constraint, index, and value-generation meaning the Target requires.
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T01:
              id: P1-G2-T01
              source_id: '002'
              title: Record Field meaning in Declaration
              description: Enable Declaration to record, for each Field, its logical Type, presence and nullability, fixed Default Value, optional sensitivity marker (password or sensitive), immutability, and structured restrictions such as length, precision, scale, range, pattern, or allowed values, in a form consumers and storage realization can use.
              reason: Every Target-declared Field property must be preserved as structured meaning rather than descriptive prose.
              inputs:
              - The Target's declared Field types, defaults, nullability, size limits, and credential Fields
              - The Model Declaration Principles
              skills:
              - sqlmodel
              expected_result: Declaration exposes a way to declare each Field property listed above and to read it back as structured meaning.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: Each Field property can be declared once and read back unchanged, including false, null, and zero values.
              verify: Declare a Field exercising every property, including a nullable Field, a Field defaulting to false, and a Field defaulting to zero; reading the Declaration returns each property exactly as declared.
              status: done
              log:
              - at: '2026-09-27T23:37:44Z'
                status: claimed
                note: Claimed before writing the Declaration layer (field meaning, identity, references, uniqueness, indexes).
              - at: '2026-09-27T23:38:27Z'
                status: done
                check: Ran a script (uv run python) declaring one Field with every property (nullable, None default, sensitivity marker, immutability, length, precision, scale, minimum, maximum, pattern, allowed values) plus Fields defaulting to False, zero, and none, and asserted each reads back unchanged and has_default distinguishes them.
                outcome: 'Passed: all properties read back exactly as declared; False, 0, and None defaults are distinguishable from no default; both sensitivity markers exist.'
            P1-G2-T02:
              id: P1-G2-T02
              source_id: '002'
              title: Record identity, references, uniqueness, and indexes in Declaration
              description: Enable Declaration to record the `id` Identity and Primary Key of an Entity, a Reference from a Field to another Entity's `id`, Uniqueness Constraints over one Field or a declared combination of Fields, and Index intentions over one Field or a declared combination of Fields.
              reason: The Target relates Entities through Identity and References and constrains them with single and composite uniqueness, so Declaration must be able to express all of them.
              inputs:
              - The Target's declared relationships and uniqueness rules
              - The Model Declaration Principles
              skills:
              - sqlmodel
              expected_result: Declaration exposes a way to declare and read back Identity, Primary Key, References that identify their target Entity and `id`, single and composite Uniqueness Constraints, and single and composite Index intentions.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: A Reference always identifies its target Entity and `id`, and a Uniqueness Constraint or Index can cover one Field or several.
              verify: Declare a Reference, a single-Field uniqueness, a two-Field uniqueness, and a two-Field Index; reading the Declaration returns each with its target Entity and covered Fields.
              status: done
              log:
              - at: '2026-09-27T23:37:44Z'
                status: claimed
                note: Claimed before writing the Declaration layer (field meaning, identity, references, uniqueness, indexes).
              - at: '2026-09-27T23:38:27Z'
                status: done
                check: Ran a script (uv run python) declaring an Entity with a Reference, a single-Field uniqueness, a two-Field uniqueness, and a two-Field Index, then read Identity, Primary Key, and each item back; also attempted invalid declarations.
                outcome: 'Passed: Identity/Primary Key ''id'' exposed, Reference reports target Entity and ''id'', single and composite uniqueness and index read back with covered Fields; a non-''id'' Reference target, empty or duplicate coverage, missing ''id'', duplicate Field names, and unknown covered Fields were all refused.'
            P1-G2-T03:
              id: P1-G2-T03
              source_id: '002'
              title: Record value generation in Declaration
              description: Enable Declaration to record Value Generation for a Field, covering Auto Increment and a generated identifier, and ensure one Field can never declare both a Default Value and Value Generation.
              reason: Every Target Entity's `id` is auto-incremented, and the Model defines generated identifiers as a supported form of Value Generation.
              inputs:
              - The Target's `id` Field definition
              - The Model Declaration Principles
              skills:
              - sqlmodel
              expected_result: Declaration exposes both Auto Increment and generated-identifier Value Generation and rejects a Field that declares both a Default Value and Value Generation.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: Each Value Generation form can be declared and read back, and declaring both a Default Value and Value Generation on one Field is refused.
              verify: Declare a Field with Auto Increment and a Field with a generated identifier and read both back; attempt to declare a Field with both a Default Value and Value Generation and observe that it is refused.
              status: done
              log:
              - at: '2026-09-27T23:38:27Z'
                status: claimed
                note: 'Claimed at first eligibility (after G2-T01 done). Note: the value-generation result (Generation kinds and the default/generation exclusivity rule) had already been written into the Declaration source together with G2-T01 before this Task was claimable; it is verified here without further change.'
              - at: '2026-09-27T23:38:32Z'
                status: done
                check: Ran a script (uv run python) declaring an Auto Increment Field and a generated-identifier Field and reading both back, then attempting to declare Fields combining a Default Value (None, False, 0, and a string) with Value Generation.
                outcome: 'Passed: both Value Generation forms read back; every default-plus-generation combination, including falsy defaults, was refused with an explanatory error.'
        P1-G3:
          id: P1-G3
          title: Foundation behaviour
          description: Provides the public Foundation layer that gives every Entity the same conversion behaviour without contributing Fields, constraints, or domain meaning.
          area: Foundation layer
          does: Every Entity can be converted to JSON and constructed from JSON through one shared implementation.
          constraints: []
          task_count: 2
          tasks:
            P1-G3-T01:
              id: P1-G3-T01
              source_id: '002'
              title: Provide Entity-to-JSON conversion in Foundation
              description: Provide one shared capability that converts any Entity into its JSON form, including values that JSON cannot represent natively, without adding any Field or constraint to the Entity.
              reason: Consumers exchange Entities as JSON, and one shared implementation keeps conversion consistent across all Entities.
              inputs:
              - The Model Foundation Principles
              - The Target's Field types, including decimal and datetime
              skills:
              - sqlmodel
              expected_result: Any Entity instance yields a JSON form that contains exactly its declared Fields with their values.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: Converting an Entity instance produces a JSON form whose Fields and values match the instance, and the conversion adds no Field of its own.
              verify: Convert an Entity instance that holds decimal, datetime, boolean, null, and text values; the JSON form contains exactly the declared Fields and each value is faithfully represented.
              status: done
              log:
              - at: '2026-09-27T23:38:32Z'
                status: claimed
                note: Claimed before writing the Foundation layer.
              - at: '2026-09-27T23:39:13Z'
                status: done
                check: Ran a script (uv run python) that defines a probe Entity with decimal, datetime, boolean, null, integer, and text values, converts an instance with to_json, and asserts the JSON keys equal the declared Fields exactly, values are faithful (decimal and datetime as strings), and Foundation itself declares no Fields.
                outcome: 'Passed: JSON contained exactly the six declared Fields with faithful values; Foundation injects no Field.'
            P1-G3-T02:
              id: P1-G3-T02
              source_id: '002'
              title: Provide JSON-to-Entity construction in Foundation
              description: Provide one shared capability that builds an Entity from its JSON form, restoring values that JSON represents indirectly, without adding any Field or constraint to the Entity.
              reason: Consumers receive Entities as JSON and need one shared, consistent way to reconstruct them.
              inputs:
              - The Model Foundation Principles
              - The Target's Field types, including decimal and datetime
              skills:
              - sqlmodel
              expected_result: Any Entity's JSON form yields an equivalent Entity instance.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: Constructing an Entity from the JSON form of an instance yields an instance equal to the original in every declared Field.
              verify: Convert an Entity instance to JSON and construct an Entity from that JSON; every declared Field of the result equals the original, including decimal, datetime, boolean, and null values.
              status: done
              log:
              - at: '2026-09-27T23:38:32Z'
                status: claimed
                note: Claimed before writing the Foundation layer.
              - at: '2026-09-27T23:39:13Z'
                status: done
                check: 'Same script: converted the probe instance to JSON and constructed an Entity from that JSON; compared every declared Field and round-tripped an instance with a null id.'
                outcome: 'Passed: reconstructed instance equals the original; decimal restored as Decimal, datetime restored timezone-aware, boolean/null/text unchanged. Gotcha recorded: table models skip value conversion in model_validate_json, so from_json parses JSON first and validates the mapping.'
        P1-G4:
          id: P1-G4
          title: Entity definitions
          description: Holds one Task per Target Model. Each Task realizes one Entity in its own public unit, flat and independently understandable, with its meaning recorded in Declaration, its conversion behaviour supplied by Foundation, and every cross-Entity connection recorded as an explicit Reference.
          area: Entity layer
          does: All fifteen Target Models exist as separate, complete, technology-independent Entities.
          constraints: []
          task_count: 15
          tasks:
            P1-G4-T01:
              id: P1-G4-T01
              source_id: '002'
              title: Define the User Entity
              description: Define the User Entity, the independent system user, with every Field, default, and uniqueness rule the Target declares for it. Its two credential Fields must be identifiable as credentials through the sensitivity marker.
              reason: Every other owned Entity belongs to a User, so this Entity anchors multi-user operation.
              inputs:
              - The Target definition of User
              - The Declaration and Foundation capabilities
              skills:
              - sqlmodel
              expected_result: The User Entity is published with all seven declared Fields, unique name and username, active-by-default, and both credential Fields marked as sensitive credentials.
              depends_on:
              - P1-G2-T01
              - P1-G2-T02
              - P1-G2-T03
              - P1-G3-T01
              - P1-G3-T02
              constraints: []
              acceptance: The Declaration of User lists every declared Field with the declared Type and nullability, unique `name` and `username`, `is_active` defaulting to true, and a sensitivity marker on `password` and `api_key`.
              verify: Reading the User Declaration shows each of the seven Fields as declared, the two uniqueness constraints, the default, and the credential markers.
              status: done
              log:
              - at: '2026-09-27T23:40:18Z'
                status: claimed
                note: 'Claimed late: the claim command was blocked once by the interface-boundary-guard hook (a false positive on an unrelated shell redirect) and, because it ran in the same batch as the file writes, the Entity unit for this Task was written before the claim was recorded. No result content depended on the claim; the Task is verified below before completion.'
              - at: '2026-09-27T23:40:26Z'
                status: done
                check: 'Ran a spec check (uv run python) built from the Target''s User definition: compared the Declaration and the realized table (columns, nullability, defaults, single-Field uniqueness) to the spec, checked credential markers, flatness, own-unit location, and a to_json/from_json round trip with all Fields populated.'
                outcome: 'Passed: 7 Fields as declared; unique name and username; is_active defaults true; password marked password and api_key marked sensitive; no relationships; JSON round trip equal.'
            P1-G4-T02:
              id: P1-G4-T02
              source_id: '002'
              title: Define the Trading Platform Entity
              description: Define the Trading Platform Entity, a supported trading API standard, with every Field, default, and uniqueness rule the Target declares for it.
              reason: Instances and Positions must identify the trading platform they use.
              inputs:
              - The Target definition of Trading Platform
              - The Declaration and Foundation capabilities
              skills:
              - sqlmodel
              expected_result: The Trading Platform Entity is published with all five declared Fields, unique name, and active-by-default.
              depends_on:
