              - P4-G3-T03
              constraints: []
              acceptance: A request that violates its published shape is refused with a clear failure and never reaches the Adapter, while a well-formed request that Logic would refuse is passed on and answered with Logic's declared failure.
              verify: Sending shape-violating requests against a recording stand-in for the Adapter shows clear failures and no call received, and sending a well-formed request that a stand-in for Logic refuses shows the call received and Logic's declared failure returned.
