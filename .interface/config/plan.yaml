              expected_result: The User Entity exists as its own unit with its Fields, rules, and Entity Metadata declared as the Target defines them.
              depends_on:
              - P1-G1-T02
              - P1-G2-T01
              - P1-G2-T02
              - P1-G2-T03
              constraints: []
              acceptance: The User Declaration matches its Target definition without a missing, added, reordered, or altered item, and the Entity accepts values that conform to it.
              verify: Reading User through the Declaration layer and comparing it item by item with the Target shows no difference, constructing User from conforming values succeeds, and constructing it with a missing Required Field is refused.
              status: done
              log:
              - at: '2026-09-28T21:53:47Z'
