              status: done
              log:
              - at: '2026-10-04T16:39:42Z'
                by: '007'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T16:41:25Z'
                by: '007'
                status: done
                event: completed
                note: Every changing Operation (Add, Update, Delete, Enable, Disable, Truncate, native command) runs
