              id: "P3-G4-T17"
              source_id: "007"
              title: "Forward every request unchanged and return every outcome unchanged"
              description: "Make every Action pass its request and the optional Instance member to Database through Database's published Interface, exactly once and without alteration, and hand back Database's declared result or failure as it is, adding no result wrapper, no interpretation, and no repetition of a request."
              reason: "Database stays the single authority for persistence, and a repeated Execute Command or Lifecycle Command cannot be assumed safe to repeat."
              inputs: ["Every Storage Action"]
              skills: ["python-skills:python-guidelines"]
              expected_result: "Every Action behaves as a transparent route to the one Database capability it corresponds to."
              depends_on: ["P3-G4-T01", "P3-G4-T02", "P3-G4-T03", "P3-G4-T04", "P3-G4-T05", "P3-G4-T06", "P3-G4-T07", "P3-G4-T08", "P3-G4-T09", "P3-G4-T10", "P3-G4-T11", "P3-G4-T12", "P3-G4-T13", "P3-G4-T14", "P3-G4-T15", "P3-G4-T16"]
              constraints: []
              acceptance: "For each Action, the request and an explicit Instance member reach Database unchanged and exactly once through its published Interface, an omitted Instance leaves Database to choose its default, the value returned or failure raised is Database's own without a wrapper, and a failing Execute Command or Lifecycle Command is not repeated."
              status: "done"
              log:
                - at: "2026-10-01T10:20:38Z"
                  log_entry: "008"
                  transition: "todo -> claimed"
                  note: "Claimed before work began; dependencies P3-G4-T01 to T16 are done."
                - at: "2026-10-01T10:21:33Z"
                  log_entry: "008"
                  transition: "claimed -> done"
                  note: "Every Action builds Database's gateway through its published Interface, makes one call with its parameters in Database's own order and the optional Instance last, and returns the result directly: no wrapper, no interpretation, no try or retry. Observed with spies standing in for Database: for all 16 Actions an explicit Instance member and the request reached Database unchanged and exactly once, an omitted Instance arrived as None (Database then chooses its default), the returned value was the identical object, and a raised failure was the identical failure with exactly one attempt, including for Execute Command and the three Lifecycle Commands. A scan of every Logic source import found none reaching Database other than through its published Interface, and none of a Service importing Logic Interface."
