# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 27
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Deliver the independent, reusable Model library realizing every Target-defined Entity, its fields, relationships, and rules.
      constraints: []
      task_count: 27
      groups:
        P1-G1:
          id: P1-G1
          title: Library and shared capabilities
          description: The reusable library itself and the shared Declaration and Foundation capabilities every Entity depends on.
          area: Library structure and shared capabilities
          does: A package that can be installed and imported, with Declaration and two-way JSON Foundation conversion available to every Entity.
          constraints: []
          task_count: 4
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '002'
              title: Establish the Model library as an importable reusable package
              description: Create the Model Component as a reusable library that other Components can depend on and import, with its dependencies declared and installable in an isolated environment.
              reason: Every later Task needs a library to live in, and Database and Logic consume Model as a library.
              inputs: []
              skills:
              - python-skills:python-guidelines
              expected_result: A Model library that a consumer can install into an isolated environment and import.
              depends_on: []
              constraints: []
              acceptance: A consumer environment can install the library and import it without error.
              verify: In a clean isolated environment, installing the library and importing it succeeds and exposes no unrelated behaviour.
              status: done
              log:
              - at: '2026-09-26T23:50:50+03:30'
                status: claimed
                note: Claimed by my-interface-develop (State Log Entry 003) before creating the library.
              - at: '2026-09-26T23:51:12+03:30'
                status: done
                check: Built the library wheel, installed it into a fresh isolated environment, and imported it; listed its public names.
                outcome: 'Passed: install and import succeeded; the package exposes no public names beyond its docstring.'
                locations:
                - my_model/pyproject.toml
                - my_model/src/my_model/__init__.py
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '002'
              title: Provide the Declaration capability for recording Entity meaning
              description: 'Provide the shared public capability through which each Entity records its technology-independent meaning: Fields and Types, Field Rules, Primary Key, Relationships, Uniqueness Constraints, Index intentions, and Value Generation, with no runtime behaviour.'
              reason: Entities cannot record their meaning until the shared recording capability exists.
              inputs: []
              skills:
              - python-skills:python-guidelines
              expected_result: A public Declaration capability that Entities can use to record every kind of declared meaning.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Declaration can record each kind of declared meaning, including a combined Uniqueness Constraint and a Reference that names its target Entity and identity, and adds no behaviour.
              verify: Using the published Declaration capability, a sample Entity meaning of each kind can be recorded and read back unchanged, and no operation on Declaration alters data.
              status: done
              log:
              - at: '2026-09-26T23:51:12+03:30'
                status: claimed
                note: Claimed by my-interface-develop (State Log Entry 003).
              - at: '2026-09-26T23:52:00+03:30'
                status: done
                check: Recorded a sample Entity meaning using every Declaration kind (auto-increment identity, sized string, credential with at-rest requirement, declared None default, immutable flag, Reference, combined uniqueness, Index) and read it back; attempted mutation; listed callable members.
                outcome: 'Passed: every kind reads back unchanged, records are immutable, and the Declaration class has no methods.'
                locations:
                - my_model/src/my_model/model_declaration.py
            P1-G1-T3:
              id: P1-G1-T3
              source_id: '002'
              title: Provide Foundation conversion of an instance to JSON
              description: Provide the shared public Foundation capability that converts an Entity instance to JSON without adding Fields, constraints, or meaning.
              reason: Consumers need one consistent way to serialize any Entity.
              inputs: []
              skills:
              - python-skills:python-guidelines
              expected_result: An instance of any Model class converts to JSON through Foundation.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Conversion represents every Field value faithfully, including exact decimals, date-times, booleans, and absent values.
              verify: Converting an instance carrying each of those value kinds yields JSON whose values match the instance, and no Field is added or dropped.
              status: done
              log:
              - at: '2026-09-26T23:51:12+03:30'
                status: claimed
                note: Claimed by my-interface-develop (State Log Entry 003).
              - at: '2026-09-26T23:52:00+03:30'
                status: done
                check: Converted a sample Foundation subclass holding string, exact decimal, timezone-aware date-time, boolean, and absent values to JSON and compared its keys and values to the instance.
                outcome: 'Passed: JSON keys equal the model fields exactly, the decimal is the exact text 1.10, the date-time is ISO with UTC offset, and the absent value is null.'
                locations:
                - my_model/src/my_model/model_foundation.py
            P1-G1-T4:
              id: P1-G1-T4
              source_id: '002'
              title: Provide Foundation creation of an instance from JSON
              description: Extend the shared Foundation capability so that an Entity instance can be created from JSON, without adding Fields, constraints, or meaning.
              reason: Consumers need to rebuild an Entity from its JSON form.
              inputs:
              - Foundation conversion to JSON
              skills:
              - python-skills:python-guidelines
              expected_result: An instance of any Model class can be created from JSON through Foundation.
              depends_on:
              - P1-G1-T3
              constraints: []
              acceptance: Creation restores every Field value faithfully, so conversion to JSON and back yields an equal instance.
              verify: For an instance carrying exact decimals, date-times, booleans, and absent values, converting to JSON and creating from that JSON yields an instance equal to the original.
              status: done
              log:
              - at: '2026-09-26T23:52:00+03:30'
                status: claimed
                note: Claimed by my-interface-develop (State Log Entry 003).
              - at: '2026-09-26T23:54:06+03:30'
                status: done
                check: Converted a plain Foundation subclass and a table-model subclass (exact decimal, timezone-aware date-time, boolean, absent value) to JSON and created an instance from that JSON; compared to the original.
                outcome: 'Passed: both round trips yield an equal instance with Decimal and timezone-aware datetime types restored. First attempt failed for the table model (validating JSON directly left values as text); creation now validates the parsed JSON instead.'
                locations:
                - my_model/src/my_model/model_foundation.py
