# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 45
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "model"
      does: "Implement the independent Model layer publishing Declaration, Foundation, and Interface layers for every Target-defined Domain Entity, preserving their Target-declared Fields, relationships, and rules."
      constraints: []
      task_count: 17
      groups:
        p1-g-foundation:
          id: "p1-g-foundation"
          title: "Shared Foundation and Interface"
          description: "The Model layer's shared, non-domain-specific behaviour and its one public entry point, used by every Entity and every consumer."
          area: "Model-wide shared behaviour and public entry point"
          does: "One shared conversion behaviour is available to every Domain Entity, and every Entity and capability is reachable from one public entry point."
          constraints: []
          task_count: 2
          tasks:
            p1-foundation-conversion:
              id: "p1-foundation-conversion"
              source_id: "003"
              title: "Provide shared Entity conversion behaviour"
              description: "Implement the conversion behaviour shared by every Domain Entity: converting an Entity instance to a JSON-compatible representation and constructing an Entity instance from a JSON-compatible representation, without introducing Fields, constraints, or domain meaning of its own."
              reason: "Every Entity needs one consistent, non-duplicated way to convert to and from JSON so Logic and other consumers do not each implement their own conversion."
              inputs: ["The complete set of Domain Entities and their declared Fields"]
              skills: ["sqlmodel"]
              expected_result: "Any Domain Entity instance can be converted to a JSON-compatible representation and reconstructed from one, using shared behaviour that injects no Field or domain rule of its own."
              depends_on: []
              constraints: []
              acceptance: "Converting an Entity instance to its JSON-compatible representation and back reproduces an equivalent instance for every declared Field, for every Entity."
              verify: "For a representative instance of each Entity, the conversion round trip preserves every declared Field's value and type without loss or alteration."
              status: "done"
              log:
                - at: "2026-09-27T11:24:04Z"
                  status: "done"
                  note: "Implemented Model_Foundation.to_json()/from_json() using SQLModel's model_dump(mode='json') and model_validate(), injecting no Field of its own. Verified: created and committed one instance of every declared Entity in an in-memory SQLite database, called to_json() then from_json() on each, and confirmed every declared Field's value was preserved across all 15 Entities."
            p1-foundation-interface:
              id: "p1-foundation-interface"
              source_id: "003"
              title: "Publish the Model public entry point"
              description: "Present every Domain Entity class and the shared conversion capability through one public entry point, so consuming Components can access any Model capability without depending on internal layering."
              reason: "Logic and Database need one convenient, complete point of access to every Entity and capability the Model layer publishes."
              inputs: ["Every declared Domain Entity", "The shared conversion behaviour"]
              skills: ["sqlmodel"]
              expected_result: "Every Domain Entity class and the shared conversion capability is reachable from one public entry point."
              depends_on: ["p1-user", "p1-trading-platform", "p1-instance", "p1-currency", "p1-broker", "p1-asset", "p1-account-group", "p1-account", "p1-trailing-group", "p1-trailing-rule", "p1-partial-group", "p1-partial-rule", "p1-action-group", "p1-action", "p1-position"]
              constraints: []
              acceptance: "Every declared Domain Entity and the shared conversion capability can be obtained from the public entry point alone."
              verify: "Each Domain Entity class and the shared conversion capability is importable from the public entry point and behaves identically to importing it directly."
              status: "done"
              log:
                - at: "2026-09-27T11:24:04Z"
                  status: "done"
                  note: "Published model_interface.py re-exporting Model_Declaration, Model_Foundation, and all 15 Entity classes as one public entry point. Verified: imported every Entity and both Foundation classes from my_model.model_interface alone in a fresh Python process; every import resolved and behaved identically to importing it directly from its own unit."
        p1-g-user:
          id: "p1-g-user"
          title: "User Identity"
          description: "The independent system user every other user-owned Entity refers back to."
          area: "User identity and access"
          does: "The system has one authoritative representation of an independent system user."
          constraints: []
          task_count: 1
          tasks:
            p1-user:
              id: "p1-user"
              source_id: "003"
              title: "Declare the User Domain Entity"
              description: "Define User as one flat, technology-independent Domain Entity that records its Target-declared Fields with their types, presence and default rules, credential sensitivity markers, primary key, and declared Uniqueness Constraints, preserving every Target-declared Field, constraint, default, and sensitivity marker exactly. User has no relationships to another Entity."
              reason: "Every user-owned Entity in the Target depends on one authoritative User identity."
              inputs: ["Target's User field and rule definitions"]
              skills: ["sqlmodel"]
              expected_result: "A User Domain Entity exists that preserves every declared Field, uniqueness rule, default, and credential sensitivity marker."
              depends_on: []
              constraints: []
              acceptance: "The User Domain Entity's declared Fields, uniqueness rules, defaults, and sensitivity markers exactly match the Target's User definition, with no Field invented or omitted."
              verify: "Inspecting the User Domain Entity's declaration shows every Target-declared Field with its type, nullability, uniqueness, default, and sensitivity marker present, and it independently converts to and from its JSON-compatible representation through the shared Foundation behaviour."
              status: "done"
              log:
                - at: "2026-09-27T11:24:04Z"
                  status: "done"
                  note: "Declared User with name/username unique, password/api_key carrying the password sensitivity marker, is_active defaulting true, and description optional (id/is_active/description inherited from the shared Model_Declaration base; conversion inherited from Model_Foundation). No relationships, matching the Target definition. Verified: created and committed a User row in an in-memory SQLite database; every declared Field, including both credential Fields, round-tripped through to_json()/from_json() unchanged."
