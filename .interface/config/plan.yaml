              "reason": "User is a Target-declared domain concept and needs its one authoritative Entity."
              "inputs":
              - "The Target definition of User"
              - "The shared Declaration and Foundation capabilities"
              "skills":
              - "sqlmodel"
              "expected_result": "User is a public, stand-alone Entity that carries its complete declared meaning and the shared JSON conversion."
              "depends_on":
              - "P1-G1-T1"
              - "P1-G1-T2"
              "constraints": []
              "acceptance": "Every field, type, nullability, default, key, reference, uniqueness, and sensitive flag declared for User is present and nothing undeclared is added."
              "verify": "Inspecting the published declaration of User shows exactly the declared items, an instance can be constructed directly, and it survives a JSON round trip with equal values."
              "status": "done"
              "log":
              - "at": "2026-09-26T22:51:57Z"
