              - P1-G2-T02
              - P1-G2-T03
              - P1-G3-T01
              - P1-G3-T02
              constraints: []
              acceptance: The Declaration of Trading Platform lists every declared Field with its Type and nullability, unique `name`, and `is_active` defaulting to true.
              verify: Reading the Trading Platform Declaration shows the five Fields, the uniqueness constraint, and the default as declared.
              status: done
              log:
              - at: '2026-09-27T23:40:18Z'
                status: claimed
                note: 'Claimed late: the claim command was blocked once by the interface-boundary-guard hook (a false positive on an unrelated shell redirect) and, because it ran in the same batch as the file writes, the Entity unit for this Task was written before the claim was recorded. No result content depended on the claim; the Task is verified below before completion.'
              - at: '2026-09-27T23:40:26Z'
                status: done
                check: Same spec check against the Target's Trading Platform definition.
                outcome: 'Passed: 5 Fields as declared; unique name; is_active defaults true; realization agrees with Declaration; JSON round trip equal.'
            P1-G4-T03:
              id: P1-G4-T03
              source_id: '002'
              title: Define the Instance Entity
              description: Define the Instance Entity, a user-owned connection to a Trading Platform, with every Field, Reference, default, and uniqueness rule the Target declares for it. Its two credential Fields are optional and must be identifiable as credentials.
              reason: Accounts connect to a trading platform through an Instance.
              inputs:
              - The Target definition of Instance
              - The Declaration and Foundation capabilities
              - The completed referenced Entities
              skills:
