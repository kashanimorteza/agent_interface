# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 283
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules.
      constraints: []
      task_count: 38
      groups:
        P1-G1:
          id: P1-G1
          title: Package and Declaration
          description: The installable Model package and the Declaration layer that records Entity meaning; every other Model layer builds on them.
          area: Model package establishment and the Declaration layer
          does: An installable Model package exists whose Declaration layer can record the complete logical meaning of any Entity.
          constraints: []
          task_count: 2
          tasks:
            P1-G1-T01:
              id: P1-G1-T01
              source_id: '003'
              title: Establish the installable Model package
              description: Establish the Model as a reusable, installable package in the technology the Model Preferences select, with every necessary dependency resolved to a concrete compatible version and stabilized in the technology's dependency metadata.
              reason: Every other Model layer needs a package that installs and imports before anything can be realized in it.
              inputs:
              - Resolved Model technology selection
              - Model dependency version policy
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A Model package that installs and imports cleanly, declares only necessary dependencies, and records their concrete versions.
              depends_on: []
              constraints: []
              acceptance: The package installs by the technology's standard mechanism, imports without error or side effect, and its dependency versions are concrete and identical on repeated resolution.
              verify: Installing the package in a clean environment and importing it succeeds, and resolving its dependencies again without any change yields the same concrete versions.
              status: done
              log:
              - at: '2026-09-28T21:48:53Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before creating the Model package.
              - at: '2026-09-28T21:49:15Z'
                transition: claimed -> done
                check: Installed the package into a clean virtual environment with uv and imported it; ran uv lock --check twice with no manifest change.
                outcome: Install succeeded (sqlmodel 0.0.47, pydantic 2.13.5, sqlalchemy 2.0.54 resolved), import succeeded with no side effect, lock check reported Resolved 12 packages unchanged both times. Python 3.14 selected as latest installed compatible; ruff and pyright added to the dev group as the Development-default quality tools.
            P1-G1-T02:
              id: P1-G1-T02
              source_id: '003'
              title: Provide the Declaration layer
              description: Provide the public Declaration layer that records an Entity's logical meaning and Entity Metadata without runtime behaviour.
              reason: Declaration is the single readable source of Entity meaning that Entities, Foundation, and consumers depend on.
              inputs:
              - Installable Model package
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A public Declaration layer able to hold every canonical member of an Entity Declaration and Field Declaration.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: A declared sample Entity exposes every canonical member exactly as declared, distinguishes an absent Default Value from an explicit null, keeps structural metadata outside its Field Declarations, and refuses an unrecognized sensitivity marker.
              verify: Reading a declared sample Entity through the Declaration layer returns each member as declared, and declaring an unrecognized sensitivity marker is rejected with a diagnostic that names the Entity and Field.
              status: done
              log:
              - at: '2026-09-28T21:49:15Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before writing the Declaration layer.
              - at: '2026-09-28T21:50:42Z'
                transition: claimed -> done
                check: Ran a transient script that declares a sample Entity through the Declaration layer, reads every member back, and declares invalid variants; ruff format/check and pyright clean.
                outcome: Every canonical member read back as declared; absent Default Value (has_default false) is distinct from an explicit null Default Value; structural metadata is outside FieldDeclaration; unrecognized sensitivity markers were refused with diagnostic naming Sample.secret; unresolved Primary Key, unknown Uniqueness Constraint Field, and repeated Index Field were refused.
        P1-G2:
          id: P1-G2
          title: Entity behaviour and Foundation
          description: 'The shared behaviour every Entity inherits: Field-contract enforcement on construction and mutation, and Foundation''s JSON conversion.'
          area: Shared Entity behaviour and the Foundation layer
          does: Any Entity built on the shared behaviour enforces its Field contracts and converts to and from JSON without loss.
          constraints: []
          task_count: 6
          tasks:
            P1-G2-T01:
              id: P1-G2-T01
              source_id: '003'
              title: Validate declared Fields on direct Entity construction
              description: Make direct Entity construction validate its input against the declared Fields, Types, nullability, and value constraints.
              reason: One construction contract stops packages from changing Entity values through silent coercion or acceptance of undeclared input.
              inputs:
              - Declaration layer
              skills:
              - sqlmodel
              - pydantic:pydantic
              expected_result: Direct construction that accepts valid input and refuses every input the Field contract prohibits.
              depends_on:
              - P1-G1-T02
              constraints: []
              acceptance: Unknown Fields, missing Required Fields, null for a non-nullable Field, incompatible Types, and violated value constraints are each refused without creating an Entity, while valid input yields an Entity holding exactly the supplied values.
              verify: Constructing a representative Entity, using a transient stand-in when no Target Entity exists yet, with one input per prohibited case is refused each time, and constructing it with valid input, including explicit false, zero, empty string, and null where permitted, preserves every supplied value.
              status: done
              log:
              - at: '2026-09-28T21:50:42Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before writing construction validation.
              - at: '2026-09-28T21:51:33Z'
                transition: claimed -> done
                check: Transient stand-in Entity (verification only, kept outside the Model) built on the shared base; constructed it with one input per prohibited class and with valid input; ruff format/check clean.
                outcome: 'Refused, without creating an Entity: unknown Field, missing Required Field, null for non-nullable, wrong-typed str for int, bool for int, int for float, float for decimal, naive datetime, length above limit, int for bool. Valid construction kept explicit empty string, false, zero, 0.0 and null exactly, and a timezone-aware datetime and Decimal(1.50) unchanged.'
            P1-G2-T02:
              id: P1-G2-T02
              source_id: '003'
              title: Apply omission, default, and generation semantics on construction
              description: Define what an omitted Field becomes when an Entity is constructed, including the not-yet-generated state of an Auto Increment Field.
              reason: Direct and JSON construction must resolve omitted values identically or Entities diverge by construction route.
              inputs:
              - Direct construction validation
              skills:
              - sqlmodel
              expected_result: Construction that resolves every omitted Field according to its declared presence, Default Value, and Value Generation.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: An omitted nullable Field without a Default Value becomes null, an omitted Field with a Default Value receives exactly that value, an omitted Auto Increment Field stays pending without becoming nullable, and no explicitly supplied value is ever replaced.
              verify: Constructing a representative Entity with each kind of omission yields the described value for each Field, and supplying false, zero, empty string, or null explicitly keeps that exact value.
              status: done
              log:
              - at: '2026-09-28T21:51:33Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before extending construction and adding assignment enforcement.
              - at: '2026-09-28T21:52:10Z'
                transition: claimed -> done
                check: Transient script constructing the stand-in Entity with each kind of omission and with explicit false/zero/empty string/null; ruff and pyright clean.
                outcome: Omitted nullable Field without default -> null; omitted Fields with Default Value received the exact default (0, Decimal 0, false, true); omitted Auto Increment id stayed pending (None) while its Declaration remained non-nullable; explicit values 0, false, empty string, null and Decimal 0.10 were never replaced.
            P1-G2-T03:
              id: P1-G2-T03
              source_id: '003'
              title: Enforce immutability and atomic revalidation on assignment
              description: Make assignment to a Field revalidate Type, nullability, and value constraints, and make immutable Fields, including `id` once assigned or generated, unchangeable.
              reason: Entity state must obey the declared Field rules after construction as well as during it.
              inputs:
              - Direct construction validation
              skills:
              - sqlmodel
              - pydantic:pydantic
              expected_result: Entity assignment that enforces Field contracts and leaves the previous value in place on failure.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: A valid assignment to a mutable Field takes effect, an invalid assignment is refused and leaves the previous value unchanged, and any change to an immutable Field is refused.
              verify: Assigning valid and invalid values to a mutable Field of a representative Entity changes only the valid case, and attempting to change `id` after it holds a value is refused with the value intact.
              status: done
              log:
              - at: '2026-09-28T21:51:33Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before extending construction and adding assignment enforcement.
              - at: '2026-09-28T21:52:10Z'
                transition: claimed -> done
                check: Transient script assigning valid and invalid values to a mutable Field, then reassigning id after it held a value (via assignment and via construction).
                outcome: 'Valid assignments took effect; invalid ones (too long, null on non-nullable, wrong types) were refused with previous value intact; first assignment of pending id succeeded; changing or clearing id afterwards was refused (Stub.id: is immutable) with value 10 intact, and a constructed id could not be changed.'
            P1-G2-T04:
              id: P1-G2-T04
              source_id: '003'
              title: Keep validation diagnostics free of sensitive values
              description: Ensure that every rejection raised by construction or assignment identifies the Entity and Field involved and never includes the value of a Field that carries a sensitivity marker.
              reason: Diagnostics are the most likely place for a credential to leak into logs or output.
              inputs:
              - Direct construction validation
              - Assignment revalidation
              skills:
              - pydantic:pydantic
              expected_result: Rejection diagnostics that name the Entity and Field but contain no sensitive value.
              depends_on:
              - P1-G2-T01
              - P1-G2-T03
              constraints: []
              acceptance: Every rejection for a sensitivity-marked Field names the Entity and Field and contains neither the rejected value nor the previous value.
              verify: Triggering a construction rejection and an assignment rejection on a sensitivity-marked Field of a representative Entity with a recognizable placeholder value produces diagnostics that name the Entity and Field and do not contain that placeholder.
              status: done
              log:
              - at: '2026-09-28T21:52:10Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before working on diagnostics and Foundation JSON conversion.
              - at: '2026-09-28T21:52:59Z'
                transition: claimed -> done
                check: Transient script triggering a construction rejection and an assignment rejection on the sensitivity-marked Field of the stand-in Entity with a recognizable placeholder object, after first holding a distinct previous value.
                outcome: 'Both diagnostics read Stub.secret: must be of type string; neither contains the rejected placeholder nor the previous value; previous value stayed intact after the rejected assignment.'
            P1-G2-T05:
              id: P1-G2-T05
              source_id: '003'
              title: Provide Entity-to-JSON conversion
              description: Provide the Foundation capability that converts an Entity to its JSON representation for every Target-declared Type.
              reason: JSON is the only portable value representation Model publishes, so consumers need a single conversion route.
              inputs:
              - Declaration layer
              - Construction semantics
              skills:
              - sqlmodel
              expected_result: A Foundation capability that turns any Entity into its JSON object.
              depends_on:
              - P1-G2-T02
              constraints: []
              acceptance: The output has exactly the Entity's Field names in Declaration order with their current values preserved per Type semantics, keeps null, false, zero, and empty string distinct, represents a pending Auto Increment value as null, and contains no metadata, nested Entity, or undeclared key.
              verify: Converting a representative Entity holding each value kind and a pending Auto Increment value yields a JSON object whose keys and order match its Declaration and whose values equal the Entity's values.
              status: done
              log:
              - at: '2026-09-28T21:52:10Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 004) before working on diagnostics and Foundation JSON conversion.
              - at: '2026-09-28T21:53:00Z'
                transition: claimed -> done
                check: Transient script converting the stand-in Entity holding each value kind, and one with omitted values, to JSON; checked key set and order, values, JSON-compatibility.
                outcome: Keys equal the Declaration Field names in order with nothing extra; pending Auto Increment id -> null; empty string, zero, false, 0.0 stayed distinct from null; Decimal 1234567890.1200 -> exact text; aware datetime -> ISO text with +03:30 offset; sensitivity-marked value unchanged; json.dumps accepted the result.
            P1-G2-T06:
              id: P1-G2-T06
              source_id: '003'
              title: Provide JSON-to-Entity construction
              description: Provide the Foundation capability that constructs an Entity from a JSON object under the same contract as direct construction.
              reason: Consumers must be able to rebuild an Entity from its portable representation without a second set of rules.
              inputs:
              - Entity-to-JSON conversion
              - Construction semantics
              skills:
              - sqlmodel
              - pydantic:pydantic
              expected_result: A Foundation capability that turns a JSON object into an Entity.
              depends_on:
              - P1-G2-T02
              - P1-G2-T05
              constraints: []
              acceptance: Valid JSON yields an Entity equal in every value to its source, while malformed input, unknown Fields, incompatible Types, and missing Required Fields are refused, and omissions resolve exactly as in direct construction.
              verify: Converting a representative Entity to JSON and back yields identical values for every Field, and JSON with a malformed shape, an unknown key, a wrong-typed value, or a missing Required Field is refused.
              status: done
              log:
              - at: '2026-09-28T21:53:00Z'
                transition: todo -> claimed
                note: 'Claimed by my-interface-develop (log 004). Note: the from_json capability was written in the same unit as to_json before this claim was recorded; nothing was verified or marked done before the claim.'
              - at: '2026-09-28T21:53:16Z'
                transition: claimed -> done
                check: 'Transient script: round trip through JSON text for a fully populated and a mostly omitted stand-in Entity, then twelve malformed or non-conforming payloads; ruff and pyright clean.'
                outcome: 'Round trips preserved every value and its exact type (empty string, zero, false, 0.0, Decimal 0.0100 text, aware datetime with -05:00 offset, null, pending id). Refused: non-object, list, non-text key, unknown key, missing Required Field, wrong-typed value, bool for int, number for decimal, malformed decimal, malformed datetime, naive datetime, null for non-nullable. A found defect (TypeError escaping for a non-text decimal) was fixed and rechecked. Omission resolved as in direct construction. Earlier G1/G2 checks rerun green after the fix.'
        P1-G3:
          id: P1-G3
          title: Entities
          description: One Entity for every Target-declared domain concept, each defined independently from its Target definition.
          area: Entity definitions
          does: Every Target-declared model exists as exactly one Entity with its Fields and Entity Metadata declared.
