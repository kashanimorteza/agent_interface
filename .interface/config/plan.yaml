              verify: Asking a running API to stop while a slow request is in progress shows the in-progress request completing, a new request being refused, and the process ending within the declared wait.
              status: done
              log:
              - at: '2026-09-29T17:31:28Z'
                transition: "todo -> claimed"
                note: "Claimed by my-interface-develop (log 012) before applying the graceful-shutdown wait."
              - at: '2026-09-29T17:31:59Z'
                transition: "claimed -> done"
                check: "Ran the API through its own startup path with a transient extra route that sleeps, sent a stop signal one second into a slow request, then immediately requested a fresh connection and timed the process end. Two scenarios: wait 6s with a 3s request, and wait 2s with a 20s request; ruff and pyright ran clean."
                outcome: "Wait 6s / request 3s: the in-progress request completed with 200 and its body, a new request was refused (connection refused), and the process ended 2.1s after the stop signal, within the wait. Wait 2s / request 20s: a new request was refused and the process ended 2.1s after the signal (within the 2s wait plus process teardown), cutting the unfinished request off; that cut-off answer is uvicorn's plain-text 500, produced outside the API's failure representation (only when the wait expires)."
        P4-G11:
          id: P4-G11
          title: Lifecycle signals
          description: The health and readiness signals that let operators distinguish a running process from one able to serve requests.
          area: API health and readiness signals
