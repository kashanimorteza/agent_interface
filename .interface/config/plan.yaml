          does: No protected credential is stored in plain form, and each is protected in the manner the Model classifies it.
          constraints: []
          task_count: 3
          tasks:
            P2-G5-T1:
              id: P2-G5-T1
              source_id: '004'
              title: Provide one-way protection for hashed credentials
              description: Provide the capability that turns a supplied credential value into a one-way stored form and checks a supplied value against that stored form.
              reason: Model classifies some credentials as hashed at rest and leaves the enforcement to Database.
              inputs:
              - Model's classification of credential Fields at rest
              - Combined Entity metadata
              skills:
              - python-skills:python-guidelines
              expected_result: A capability that produces a one-way stored form for a credential value and checks a value against it.
              depends_on:
              - P2-G3-T1
              constraints: []
              acceptance: The stored form differs from the supplied value and cannot be turned back into it, the original value checks successfully against it, and any other value does not.
              verify: Protecting a value yields a form unequal to it, checking the original value against that form succeeds, and checking any different value fails.
              status: done
              log:
              - at: '2026-09-26T04:52:47+03:30'
                log_entry: '005'
                event: claimed
                from_status: todo
                to_status: claimed
                note: Claimed before providing one-way protection; the Entity metadata was done.
              - at: '2026-09-26T04:53:21+03:30'
                log_entry: '005'
                event: completed
                from_status: claimed
                to_status: done
                check: 'Transient script protected a value and asserted: the stored form differs from the value and does not contain it, has the stored-form structure, the original value checks true, a different value and an empty value check false, protecting the same value twice gives different forms, no function offering a way back exists in the module, and a 500-character value still yields a short stored form.'
                outcome: 'passed: one-way, salted, verifiable, no way back'
                locations: my_database/src/my_database/protection.py (hash_credential, check_credential, is_hashed)
            P2-G5-T2:
              id: P2-G5-T2
              source_id: '004'
              title: Provide reversible protection for encrypted credentials
              description: Provide the capability that turns a supplied credential value into an encrypted stored form using the secret that Settings reference, and recovers the original value from that form.
              reason: Model classifies some credentials as encrypted at rest so that their original value stays usable, and leaves the enforcement to Database.
              inputs:
              - Model's classification of credential Fields at rest
              - Completed Settings
              - Combined Entity metadata
              skills:
              - python-skills:python-guidelines
              expected_result: A capability that produces an encrypted stored form for a credential value and recovers the original from it.
              depends_on:
              - P2-G1-T3
              - P2-G3-T1
              constraints: []
              acceptance: The stored form differs from the supplied value, the original value is recovered from it using the referenced secret, and it is not recovered without that secret.
              verify: Encrypting a value yields a form unequal to it, decrypting with the referenced secret returns the original value, and decrypting with a different secret does not.
              status: done
              log:
              - at: '2026-09-26T04:52:47+03:30'
                log_entry: '005'
                event: claimed
                from_status: todo
                to_status: claimed
