        P3-G9:
          id: P3-G9
          title: Outward Interface
          description: The single boundary through which every consumer reaches Logic. It gathers the Services' Actions as Operations in Categories organized by Service.
          area: Logic Interface
          does: A consumer reaches all of Logic's Behaviour through one Interface and nothing else.
          constraints: []
          task_count: 5
          tasks:
            P3-G9-T01:
              id: P3-G9-T01
              source_id: '006'
              title: Gather the Entity Service Actions as Operations in a Category
              description: Provide the one outward Interface that gathers every Entity Service Action as a consumer-facing Operation in a Category for the Entity Service, each named by what the consumer wants done.
              reason: There must be one door for every consumer.
              inputs:
              - The Entity Service Actions
              skills: []
              expected_result: The Interface offers an Operation for every Entity Service Action, grouped in the Entity Service's Category.
              depends_on:
              - P3-G8-T25
              constraints: []
              acceptance: Each of the 15 Entities has all twelve Operations in the Category, with unique consumer-facing names.
              verify: List the Interface's Operations and see the Entity Category holding 180 uniquely named Operations, twelve for each of the 15 Entities.
              status: todo
            P3-G9-T02:
              id: P3-G9-T02
              source_id: '006'
              title: Publish each Operation's contract
              description: Ensure every Operation states what it accepts, what it returns, and which Application Outcomes it can produce, in a form a consumer can read from the Interface itself.
              reason: A consumer must know an Operation's contract without reading Logic's internals.
              inputs:
              - The Interface's Operations
              skills: []
              expected_result: Every Operation publishes its accepted inputs, its result, and its declared Application Outcomes.
              depends_on:
              - P3-G9-T01
              constraints: []
              acceptance: No Operation lacks a stated contract, and each stated outcome can actually occur.
              verify: Read the contract of every Operation and see inputs, result, and outcomes stated; exercise a sample and see the stated outcomes occur.
              status: todo
            P3-G9-T03:
              id: P3-G9-T03
              source_id: '006'
              title: Keep Services and dependencies out of the Interface
              description: Ensure the Interface exposes no Service, connection, session, engine, mapping, or storage detail, and that a Category identifies its Service without making it reachable.
              reason: Consumers must not depend on Logic's internals.
              inputs:
              - The Interface
              - The Logic Principles on the outward Interface
              skills: []
              expected_result: The Interface's public surface consists of Operations and Application Outcomes only.
              depends_on:
              - P3-G9-T01
              constraints: []
              acceptance: No public name leads to a Service, connection, session, engine, mapping, or storage detail.
              verify: Enumerate everything reachable from the Interface's public surface; only Operations, Categories, and outcomes appear, and no Service or dependency detail is reachable.
              status: todo
            P3-G9-T04:
              id: P3-G9-T04
              source_id: '006'
              title: Keep Logic a library
              description: Ensure Logic starts no process, owns no transport schema, and depends on no consumer framework.
              reason: Behaviour without a transport of its own can serve any consumer.
              inputs:
              - The completed library
              skills: []
              expected_result: Logic can be imported and used in-process, and its dependencies contain no server or web framework.
              depends_on:
              - P3-G9-T01
              constraints: []
              acceptance: Importing Logic starts nothing, and its installed dependencies include no consumer framework.
              verify: In a clean environment, import Logic and see no process, listener, or background work start; list its dependencies and see no server or web framework.
              status: todo
            P3-G9-T05:
              id: P3-G9-T05
              source_id: '006'
              title: Reach other Components only through their Interfaces
              description: Ensure Logic reaches Model and Database only through their public Interfaces, from the Service that owns each dependency, and uses no other route or private part.
              reason: A Component reached only through its published surface can change everything behind it without disturbing Logic.
              inputs:
              - Logic's source
              - The declared Connections
              skills: []
              expected_result: Logic uses only the public Interfaces of Model and Database.
              depends_on:
              - P3-G9-T01
              constraints: []
              acceptance: Every use of Model or Database enters through their published Interface, and no other Component is used.
              verify: Inspect every cross-Component use in Logic; each enters through Model's or Database's Interface, and none reaches a private layer or another Component.
              status: todo
