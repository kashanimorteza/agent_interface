# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 21
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: The independent Model layer and its reusable library exist for every Target-declared model, with their fields, relationships, and rules preserved.
      constraints: []
      task_count: 21
      groups:
        P1-G1:
          id: P1-G1
          title: Library foundations
          description: The reusable Model library and the two shared capabilities every Entity depends on.
          area: Model library identity, shared Declaration capability, and shared conversion behaviour
          does: A consumable Model library with a shared way to declare Entity meaning and to convert instances to and from JSON.
          constraints: []
          task_count: 3
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the Model as an independent reusable library
              description: Create the Model Component as a standalone reusable library that other Components can install and import, with its public layers present but holding no Entity yet.
              reason: Every later Model Task needs a library that exists and can be consumed on its own.
              inputs:
              - Model Component identity and technical selection
              skills:
              - python-skills:python-guidelines
              expected_result: An installable Model library whose public entry point can be imported by a consumer.
              depends_on: []
              constraints: []
              acceptance: A consumer can install the library into a clean environment and import its public entry point without error.
              verify: In a clean environment, installing the library and importing its public entry point both succeed.
              status: done
              log:
              - at: '2026-09-26T20:53:12Z'
                status: claimed
                note: Claimed before work began.
              - at: '2026-09-26T20:53:32Z'
                status: done
                check: Created a fresh isolated environment, installed the library from its Component root, and imported the public entry point from outside the project directory.
                outcome: Install and import both succeeded (Python 3.14, uv build backend, SQLModel 0.0.47 resolved).
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '003'
              title: Provide the shared Declaration capability
              description: 'Provide the public capability through which every Entity records its technology-independent meaning: Types, Field Rules (presence, defaults, sensitive flag, immutability, length, constraints), Primary Key, Uniqueness Constraints, Relationships, Index intentions, and Value Generation. It carries no runtime behaviour.'
              reason: Database and Logic must read one complete, structured data meaning per Entity without coupling to a storage technology.
              inputs:
              - The Model definition of Declaration
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A public Declaration capability able to record every kind of Entity meaning as structured, readable data.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Every kind of meaning listed for Declaration can be recorded and read back as structured data, and no runtime behaviour is present.
              verify: Declaring a sample Entity that uses each kind of meaning lets a consumer read every declared item back as structured data, and the capability exposes no operations beyond declaration.
              status: done
              log:
              - at: '2026-09-26T20:53:32Z'
                status: claimed
                note: Claimed before work began.
              - at: '2026-09-26T20:54:29Z'
                status: done
                check: Ran a script that declared a sample Entity using every kind of meaning (auto-increment identity, length, immutability, extra constraint, sensitive flag, false default, nullable Field, Reference, single and composite uniqueness, index) and read each item back; asserted no public behaviour on the declaration classes and that declarations are immutable. Also ruff format, ruff check, and pyright on the source.
                outcome: All assertions passed; ruff and pyright reported no issues. A dedicated NO_DEFAULT marker distinguishes an undeclared default from declared false or null.
            P1-G1-T3:
              id: P1-G1-T3
              source_id: '003'
              title: Provide the shared Foundation conversion behaviour
              description: Provide the public capability that converts an Entity instance to JSON and creates an instance from JSON, without adding Fields, constraints, or domain meaning of its own.
              reason: Every Entity needs one consistent conversion behaviour rather than its own copy.
              inputs:
              - The Model definition of Foundation
              skills:
              - python-skills:python-guidelines
              expected_result: A public Foundation capability offering conversion to and from JSON for any Entity that adopts it.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: An instance converted to JSON and then created from that JSON equals the original, and Foundation adds no Field or constraint to the adopting Entity.
              verify: Applying the capability to a sample Entity, the round trip through JSON yields an equal instance, and the sample's declared Fields are unchanged by adopting it.
              status: done
              log:
              - at: '2026-09-26T20:54:30Z'
                status: claimed
                note: Claimed before work began.
              - at: '2026-09-26T20:55:31Z'
                status: done
                check: Ran a script that defined a sample table Entity (integer, string, decimal, timezone-aware datetime, boolean, nullable Fields) adopting the Foundation, converted an instance to JSON and back, decoded from text and bytes, and confirmed a partial payload is rejected and that adopting adds no Field. Also ruff format, ruff check, pyright.
                outcome: Round trip returned an equal instance. First attempt using the JSON-native validator failed (table Entities left Decimal and datetime as raw text); switched to parse-then-model_validate and all assertions then passed with no lint or type issues.
