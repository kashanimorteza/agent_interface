              - "The created storage tables"
              - "The Database configuration's default Instance"
              "skills":
              - "sqlmodel"
              "expected_result": "A migration that recreates the default Instance's complete table structure when applied to a fresh, empty storage location."
              "depends_on":
              - "P2-G5-T1"
              "constraints": []
              "acceptance": "Applying the generated migration to a fresh, empty storage location produces a table for every imported Entity, matching the structure already created in the default Instance."
