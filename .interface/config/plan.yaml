          area: Entities for users, supported trading platforms, and user-owned platform connections.
          does: The User, Trading Platform, and Instance Entities are defined and published.
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Define the User Entity
              description: Define the User Entity, including its two credential Fields and its two independently unique naming Fields.
              reason: User is the owner referenced by most other Entities.
              inputs:
              - The Target's User Model definition
              - Completed Declaration and Foundation capabilities
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A published User Entity that matches the Target's User definition.
              depends_on:
              - P1-G1-T2
              - P1-G1-T3
              - P1-G1-T4
              - P1-G1-T5
              - P1-G1-T6
              constraints: []
              acceptance: The User Entity's Fields, Types, nullability, default, sensitivity markers on the credential Fields, uniqueness rules, and auto-incrementing identity all match the Target definition, and it is flat.
              verify: Compare the User Entity's published Declaration with the Target definition Field by Field and observe no difference, and observe that a User instance converts to JSON and back unchanged.
              status: done
              log:
              - at: '2026-09-28T11:13:09Z'
                transition: todo -> claimed
                note: Claimed before work began; all dependencies done.
              - at: '2026-09-28T11:13:49Z'
                transition: claimed -> done
                check: 'Transient check (generated comparison against the Target''s Model definition, run through the Model Component''s environment, not persisted): compared the Entity''s published Declaration with the Target definition Field by Field (Type, nullability, default, size, uniqueness, generation, Reference, purpose text, sensitivity marker), then built an instance from JSON and round-tripped it.'
                outcome: 7 of 7 Fields match; unique name and username; credential Fields carry sensitivity markers (password for the password credential, sensitive for the API key); flat; lossless JSON round trip. Passed.
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Define the Trading Platform Entity
              description: Define the Trading Platform Entity, including its unique display name and the code that identifies which platform implementation applies.
              reason: Trading Platform keeps the system independent of any specific exchange or broker and is referenced by Instance and Position.
              inputs:
              - The Target's Trading Platform Model definition
              - Completed Declaration and Foundation capabilities
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A published Trading Platform Entity that matches the Target's definition.
              depends_on:
              - P1-G1-T2
              - P1-G1-T3
              - P1-G1-T4
              - P1-G1-T5
              - P1-G1-T6
              constraints: []
              acceptance: Every Field, Type, default, uniqueness rule, and the auto-incrementing identity of the Trading Platform Entity match the Target definition, and it is flat.
              verify: Compare the Trading Platform Entity's published Declaration with the Target definition Field by Field and observe no difference, and observe a lossless JSON round trip of one instance.
              status: done
              log:
              - at: '2026-09-28T11:13:09Z'
                transition: todo -> claimed
                note: Claimed before work began; all dependencies done.
              - at: '2026-09-28T11:13:49Z'
                transition: claimed -> done
                check: 'Transient check (generated comparison against the Target''s Model definition, run through the Model Component''s environment, not persisted): compared the Entity''s published Declaration with the Target definition Field by Field (Type, nullability, default, size, uniqueness, generation, Reference, purpose text, sensitivity marker), then built an instance from JSON and round-tripped it.'
                outcome: 5 of 5 Fields match; unique name; flat; lossless JSON round trip. Passed.
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Define the Instance Entity
              description: Define the Instance Entity, including its References to its owning User and its Trading Platform, its optional connection Fields and credentials, and the uniqueness of a name within one owner.
              reason: Instance holds each user's connection to a trading platform and is referenced by Account.
              inputs:
              - The Target's Instance Model definition
              - The published User and Trading Platform Entities
              skills:
              - sqlmodel
              expected_result: A published Instance Entity that matches the Target's definition.
              depends_on:
              - P1-G2-T1
              - P1-G2-T2
              constraints: []
              acceptance: Every Field, Type, nullability, default, credential sensitivity marker, Reference, and combined uniqueness rule of the Instance Entity match the Target definition, and it is flat.
              verify: Compare the Instance Entity's published Declaration with the Target definition Field by Field and observe no difference, observe that each Reference names the correct target Entity and identity, and observe a lossless JSON round trip of one instance.
              status: done
              log:
              - at: '2026-09-28T11:13:49Z'
                transition: todo -> claimed
                note: Claimed before work began; all dependencies done.
              - at: '2026-09-28T11:14:16Z'
                transition: claimed -> done
                check: 'Transient check (generated comparison against the Target''s Model definition, run through the Model Component''s environment, not persisted): compared the Entity''s published Declaration with the Target definition Field by Field (Type, nullability, default, size, uniqueness, generation, Reference target and id, purpose text, sensitivity marker), then built an instance from JSON and round-tripped it. Also ran the formatter, linter, and type checker over the Component with no findings.'
                outcome: 10 of 10 Fields match; References to User and Trading Platform name the correct Entity and id; unique user and name combination; credential Fields carry sensitivity markers; flat; lossless JSON round trip. Passed.
