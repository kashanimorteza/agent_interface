        P3-G2:
          id: P3-G2
          title: Configuration, outcomes, and bounded dependency use
          description: 'The foundations every Operation shares: the runtime configuration contract, the Application Outcomes Logic returns, the translation of Database''s answers into those Outcomes, and the finite limits on waiting and retrying.'
          area: Runtime configuration contract, Application Outcomes, and bounded use of dependencies
          does: Logic validates its runtime configuration before use, answers every request with an Application Outcome, and never waits or retries without limit.
          constraints: []
          task_count: 5
          tasks:
            P3-G2-T01:
              id: P3-G2-T01
              source_id: 008
              title: Define and validate the runtime configuration contract
              description: Define the configuration contract that names every runtime value Logic's Behaviour requires, including the secret material the Target's encrypted credential treatment needs and the finite bounds on waiting and retrying, and validate that every required value is present and well formed before any Operation runs. Logic owns the contract and its validation, never the values or their delivery.
              reason: A contract validated before readiness fails at start with a clear cause rather than mid-operation with an unclear one.
              inputs:
              - Behaviour that needs runtime values
              - Platform-supplied runtime values
              skills:
              - python-skills:python-guidelines
              expected_result: A configuration contract whose complete set of values is accepted and whose incomplete or malformed set is refused before use, without revealing a secret value.
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: A complete set of values is accepted; each missing or malformed required value is refused before any Operation runs, with a message that names the value and contains no supplied value; the contract holds no secret value.
              verify: Supplying a complete set of placeholder values is accepted, omitting each required value in turn and supplying each in a malformed form is refused before any Operation is performed, every refusal names the value without revealing any supplied value, and scanning the contract finds no secret value.
              status: done
              log:
              - at: '2026-09-29T08:35:19Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the configuration contract and the Outcome vocabulary.
              - at: '2026-09-29T08:36:00Z'
                transition: claimed -> done
                check: Transient script (kept outside Logic) building the configuration from a complete set of placeholder values, from each set with one value omitted, from nine malformed sets (short secret, non-numeric, zero, negative, not-a-number, and infinite timeout, negative, non-numeric, and fractional retries), and from a boolean retry count; it also scanned the configuration source for long literals.
                outcome: The complete set was accepted and its representation hides the secret; all 3 omissions, all 9 malformed sets, and the boolean were refused with ConfigurationError naming the value and never containing a supplied value (13 refusals); the source holds no secret literal, only the three value names. ruff and pyright clean.
            P3-G2-T02:
              id: P3-G2-T02
              source_id: 008
              title: Provide the Application Outcome vocabulary
              description: 'Provide the closed set of Application Outcomes Logic returns: a success carrying the requested result, and the expected failures — a requested record that does not exist, a request that is invalid, a request that conflicts with a stored record, a request that breaks a reference between records, and a dependency that cannot answer in time. The set is independent of transport and persistence.'
              reason: A consumer needs one transport-independent and storage-independent way to learn what happened, so the same request means the same thing through every consumer.
              inputs:
              - Behaviour the Operations must report
              skills:
              - python-skills:python-guidelines
              expected_result: A closed Outcome vocabulary in which a consumer can tell the success from each expected failure without inspecting anything else.
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: Each situation named above maps to a distinct Outcome, a success carries its result, a failure carries a safe reason, and no Outcome carries a transport, engine, session, mapping, or schema detail.
              verify: Constructing each Outcome shows the situations are distinguishable by a consumer, a success exposes its result, and inspecting every failure Outcome finds only a safe reason and no transport or storage detail.
              status: done
              log:
              - at: '2026-09-29T08:35:19Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the configuration contract and the Outcome vocabulary.
              - at: '2026-09-29T08:36:00Z'
                transition: claimed -> done
                check: Transient script constructing a success and one failure for each expected-failure kind, and attempting three contradictory outcomes (success with a reason, failure without a reason, failure with a value); it also listed the Outcome fields.
                outcome: Six distinct kinds exist (success, not_found, invalid, conflict, broken_reference, unavailable); a success exposes its value and no reason, each failure exposes a reason and no value, all three contradictory outcomes were refused, and the Outcome holds only kind, value, and reason, so no transport or storage detail can travel in it.
            P3-G2-T03:
              id: P3-G2-T03
              source_id: 008
              title: Translate Database's answers and refusals into Application Outcomes
              description: 'Turn every answer and refusal that Database returns into the matching Application Outcome: an absent record into the does-not-exist Outcome, a uniqueness refusal into the conflict Outcome, a refused reference into the broken-reference Outcome, and an unreachable Instance into the unavailable Outcome. A failure that is not an expected one is never reshaped into a success.'
              reason: Logic must hide engine, session, mapping, and schema details from consumers while still telling them precisely what happened.
              inputs:
              - Application Outcome vocabulary
              - Answers and refusals Database publishes
              skills:
              - python-skills:python-guidelines
              expected_result: Each Database answer or refusal produces the Outcome that corresponds to it, with no storage detail exposed.
              depends_on:
              - P3-G2-T02
              - P3-G1-T03
              constraints: []
              acceptance: Every situation listed produces its corresponding Outcome, an unrecognized failure is not turned into a success, and no Outcome exposes an engine, session, mapping, or schema detail.
              verify: Standing in for Database with each answer and refusal in turn shows the corresponding Outcome each time, a failure of an unexpected kind does not surface as a success, and inspecting every Outcome finds no storage detail.
              status: done
              log:
              - at: '2026-09-29T08:36:01Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the translation of Database answers and refusals.
              - at: '2026-09-29T08:37:05Z'
                transition: claimed -> done
                check: Transient script that built a real Database over a throwaway SQLite file (a copy of the packaged configuration pointing at a temporary path; the shipped storage was never opened), provoked each refusal through Database's published Operations, and passed every raised failure to the translation; it also translated constructed PostgreSQL integrity and connection errors carrying their SQLSTATE codes, unrecognized failures, and scanned every reason for engine wording.
                outcome: A repeated unique value gave the conflict Outcome; adding a record with a missing reference, deleting a referred-to record, and truncating a referred-to Entity each gave the broken-reference Outcome; an unknown Field, a non-numeric Sum, a wrongly typed id, a malformed command, a missing bind parameter, and an unknown column each gave the invalid Outcome; constructed PostgreSQL unique, foreign-key, not-null, syntax, connection, interface, and timeout errors gave conflict, broken-reference, invalid, invalid, unavailable, unavailable, and unavailable; RuntimeError, KeyError, and AttributeError were not translated so they surface as themselves; no reason contains engine, constraint, table, or command text.
            P3-G2-T04:
              id: P3-G2-T04
              source_id: 008
              title: Bound every wait on a dependency with a finite timeout
              description: Apply a finite limit, taken from the runtime configuration, to every wait on Database or any other dependency; when the limit is reached the Operation ends with the unavailable Outcome.
              reason: An unbounded wait turns one unavailable dependency into work that never ends.
              inputs:
              - Validated runtime configuration
              - Application Outcome vocabulary
              skills:
              - python-skills:python-guidelines
              expected_result: No Operation waits on a dependency for longer than the configured limit.
              depends_on:
              - P3-G2-T01
              - P3-G2-T02
              - P3-G1-T03
              constraints: []
              acceptance: A dependency that never answers ends the Operation within the configured limit with the unavailable Outcome, and no wait exists without a limit.
              verify: Standing in for Database with an answer that never arrives shows the Operation ending within the configured limit with the unavailable Outcome, and examining every point where a dependency is awaited finds a limit at each.
              status: done
              log:
              - at: '2026-09-29T08:37:06Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the bounded wait on dependency calls.
              - at: '2026-09-29T08:38:16Z'
                transition: claimed -> done
                check: Transient script running a call that blocks until released with a 0.3 second configured limit, then a call that returns a value, one that returns nothing, one that raises an expected failure, and one that raises an unexpected failure; it also scanned Logic's source for every point that waits on a call.
                outcome: The blocked call ended after 0.31 seconds with the unavailable Outcome saying the data did not answer within 0.3 seconds; the value and the empty answer came back as successes; the ValueError became the invalid Outcome; the RuntimeError surfaced as itself; the only wait point in the source is the single join carrying the configured limit. ruff and pyright clean.
            P3-G2-T05:
              id: P3-G2-T05
              source_id: 008
              title: Retry only safe or idempotent work, and only boundedly
              description: When a dependency is temporarily unavailable, repeat only an operation that is safe or idempotent to repeat and only up to the configured number of attempts; an operation whose repetition could change data twice is attempted once.
              reason: A retry of an unsafe change can silently apply it twice, and a retry without a limit never ends.
              inputs:
              - Validated runtime configuration
              - Bounded waiting
              skills:
              - python-skills:python-guidelines
              expected_result: Retries never exceed their configured bound and are never applied to work that is unsafe to repeat.
              depends_on:
              - P3-G2-T04
              constraints: []
              acceptance: A read that fails temporarily is repeated no more than the configured number of times and then ends unavailable; a change that is unsafe to repeat is attempted exactly once even when its outcome is uncertain.
              verify: Standing in for Database with repeated temporary failures shows a read attempted no more than the configured bound before the unavailable Outcome, and an unsafe change attempted exactly once, with the number of attempts counted in each case.
              status: done
              log:
              - at: '2026-09-29T08:38:17Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before adding bounded retries to dependency calls.
              - at: '2026-09-29T08:38:34Z'
                transition: claimed -> done
                check: 'Transient script with a scripted dependency that fails temporarily a chosen number of times, run with two configured retries: a repeatable call that always fails, an unsafe call that always fails, a repeatable call failing once, a repeatable call failing with a non-temporary refusal, a stalled repeatable call, a stalled unsafe call, and a repeatable call with zero configured retries; calls were counted in each case.'
                outcome: The always-failing repeatable call was attempted 3 times (1 plus 2 retries) and ended unavailable; the unsafe call was attempted exactly once; the call failing once succeeded on the second attempt; the non-temporary refusal was attempted once and gave the invalid Outcome; the stalled repeatable call was attempted 3 times, each bounded, in under a second; the stalled unsafe call once; with zero retries a repeatable call was attempted once. ruff and pyright clean.
        P3-G3:
