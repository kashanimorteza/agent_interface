          "title": "Persistent storage provisioning"
          "description": "Table creation and migration so the default Instance is a real, reproducible storage location."
          "area": "Table creation, migration, and default Instance provisioning"
          "does": "The default Instance exists on disk with a table for every persisted Model, reproducible through its migration."
          "constraints": []
          "task_count": 2
          "tasks":
            "P2-G5-T1":
              "id": "P2-G5-T1"
              "source_id": "006"
              "title": "Create storage tables for every persisted Model"
              "description": "Derive and create, in the configured default Instance, one storage table for every Entity imported from the Model package, matching each Entity's declared identity, references, uniqueness constraints, defaults, and indexes, without creating a second persistence model."
              "reason": "The default Instance must have a real table for every persisted Model before any record can be stored."
              "inputs":
              - "Every imported Entity class and its declared persistence metadata"
              - "The Database configuration's default Instance"
              "skills":
              - "sqlmodel"
              "expected_result": "The default Instance contains one table for every imported Entity, matching its declared structural metadata."
              "depends_on":
              - "P2-G1-T1"
              "constraints": []
              "acceptance": "The default Instance contains exactly one table for every Entity imported from the Model package, and each table's identity, references, uniqueness constraints, defaults, and indexes match that Entity's declared metadata."
              "verify": "Inspecting the default Instance's created storage shows a table for every imported Entity, and comparing each table's structure with its Entity's declared metadata shows no missing or extra item."
