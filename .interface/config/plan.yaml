              - P1-G2-T01
              - P1-G2-T02
              - P1-G2-T03
              - P1-G3-T01
              - P1-G3-T02
              constraints: []
              acceptance: The Declaration of Instance lists every declared Field, References to User and Trading Platform, nullable `ip`, `username`, `password`, and `api_key` with credential markers on the last two, and a composite uniqueness over `user_id` and `name`.
              verify: Reading the Instance Declaration shows the Fields, the two References with their target Entity and `id`, the nullable Fields, the credential markers, and the composite uniqueness.
              status: done
              log:
              - at: '2026-09-27T23:40:26Z'
                status: claimed
                note: Claimed before writing the Entity unit.
              - at: '2026-09-27T23:40:57Z'
                status: done
                check: 'Spec check (uv run python) built from the Target''s Instance definition: Declaration and realized table compared for Fields, nullability, credential markers, both References (declaration and foreign keys to the target id), composite uniqueness, flatness, and JSON round trip.'
                outcome: 'Passed: 10 Fields; References to User and Trading Platform realized as foreign keys; nullable ip/username/password/api_key; password and api_key marked; unique (user_id, name); round trip equal.'
            P1-G4-T04:
