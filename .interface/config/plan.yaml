# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  "task_count": 56
  "plans":
    "P1":
      "id": "P1"
      "title": "Model"
      "order": 1
      "target": "Model"
      "does": "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules."
      "constraints": []
      "task_count": 21
      "groups":
        "P1-G1":
          "id": "P1-G1"
          "title": "Shared Model layers"
          "description": "The shared Declaration and Foundation capabilities that every Entity depends on."
          "area": "Shared declaration metadata and shared conversion behaviour"
          "does": "Every Entity can record its meaning and convert to and from JSON through common capabilities."
          "constraints": []
          "task_count": 2
          "tasks":
            "P1-G1-T1":
              "id": "P1-G1-T1"
              "source_id": "003"
              "title": "Provide the shared Declaration capability"
              "description": "Make available the single shared capability through which every Entity records its technology-independent data meaning: field types, presence and nullability, defaults, the sensitive flag, immutability, length and other declared restrictions, primary identity, references to other Entities, uniqueness over one or several fields, index intentions, and value generation. It carries no runtime behaviour."
              "reason": "Every Entity must record its meaning in one common, consumer-readable form so Database and Logic read the same facts."
              "inputs":
              - "The Model Definition's list of declaration facets"
              "skills":
              - "sqlmodel"
              "expected_result": "A public shared Declaration capability that an Entity can use to state each facet and that a consumer can read back."
              "depends_on": []
              "constraints": []
              "acceptance": "Every facet the Model Definition lists can be stated for an Entity and read back exactly as stated, and the capability performs no behaviour of its own."
              "verify": "Stating each facet on a sample Entity and reading every one back yields exactly what was stated, including a uniqueness over several fields and a reference to another Entity."
              "status": "done"
              "log":
              - "at": "2026-09-26T22:50:52Z"
                "event": "claimed"
                "note": "Claimed by Develop (State entry 004) before work began; all dependencies done."
              - "at": "2026-09-26T22:51:56Z"
                "event": "done"
                "check": "Transient script: stated every declaration facet (types, nullability, default, sensitive, immutability, length, constraints, primary key, auto-increment value generation, reference, composite uniqueness, unique and plain indexes) on a sample Entity declaration and read each back; asserted the declaration exposes only a lookup helper and is immutable."
                "outcome": "Passed: every facet read back exactly as stated; no behaviour beyond lookup."
            "P1-G1-T2":
              "id": "P1-G1-T2"
              "source_id": "003"
              "title": "Provide the shared Foundation conversion behaviour"
              "description": "Make available the single shared capability that converts an Entity instance to JSON and creates an instance from JSON. It defines no fields, constraints, or domain meaning."
              "reason": "Every Entity needs one consistent JSON conversion contract without a shared domain structure being imposed."
              "inputs": []
              "skills":
              - "sqlmodel"
              "expected_result": "A public shared Foundation capability offering conversion to JSON and creation from JSON for any Entity that uses it."
              "depends_on": []
              "constraints": []
              "acceptance": "Converting an instance to JSON and creating an instance from that JSON reproduces the original values, and the capability adds no fields to the Entity using it."
              "verify": "A sample Entity using it survives a JSON round trip with equal values and exposes no fields beyond those it declares."
              "status": "done"
              "log":
              - "at": "2026-09-26T22:50:52Z"
                "event": "claimed"
                "note": "Claimed by Develop (State entry 004) before work began; all dependencies done."
              - "at": "2026-09-26T22:51:56Z"
                "event": "done"
                "check": "Transient script: defined a sample Entity on the shared Foundation with integer, string, Decimal, timezone-aware datetime and nullable fields; converted to JSON, created from that JSON (str and bytes), compared instances and field sets."
                "outcome": "Passed: round trip equal for str and bytes input; field set unchanged (Foundation adds no fields)."
        "P1-G2":
          "id": "P1-G2"
          "title": "Domain Entities"
          "description": "One Entity for each Target-declared Model, each standing alone, flat, and explicitly related to the others through references. Initial Data is outside these Entities."
