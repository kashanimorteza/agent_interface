# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 79
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: The independent Model layer and its reusable package exist, defining every Target model with every Field, Type, default, rule, Reference, and constraint the Target declares for it, each convertible to and constructible from JSON.
      constraints: []
      task_count: 31
      groups:
        P1-G1:
          id: P1-G1
          title: Shared Model behaviour
          description: The shared capabilities every Entity uses for JSON exchange, independent of any Entity's domain meaning.
          area: Foundation layer
          does: Entity-to-JSON conversion and JSON-to-Entity construction are available to every Entity through one shared implementation.
          constraints: []
          task_count: 2
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Provide Entity-to-JSON conversion
              description: Provide the shared capability that converts any Entity into JSON, without adding Fields, constraints, or domain meaning.
              reason: Consumers exchange Entities as JSON, and one shared implementation keeps that behaviour consistent for every Entity.
              inputs:
              - Model Foundation responsibility
              skills:
              - sqlmodel
              expected_result: Any Entity can be converted to a JSON representation of exactly its own Fields.
              depends_on: []
              constraints: []
              acceptance: The JSON produced for an Entity contains every one of that Entity's Field values and nothing else.
              verify: Converting an Entity holding known values yields JSON whose content matches those values Field for Field, and the capability introduces no Field of its own.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Converted a throwaway sample Entity holding known values (integer, string, exact decimal, boolean false, null, aware datetime) with the Foundation JSON conversion; the JSON held exactly those Fields with matching values and no extra Field. Foundation itself declares no Fields. ruff, ruff format and pyright reported no problems.
                location: Foundation base in model/src/model/foundation.py
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '003'
              title: Provide JSON-to-Entity construction
              description: Provide the shared capability that constructs any Entity from JSON, without adding Fields, constraints, or domain meaning.
              reason: Consumers receive Entities as JSON, and one shared implementation keeps construction consistent for every Entity.
              inputs:
              - Model Foundation responsibility
              skills:
              - sqlmodel
              expected_result: Any Entity can be constructed from a JSON representation of its Fields.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: An Entity constructed from JSON carries the Field values that JSON supplied and is equivalent to the Entity it was produced from.
              verify: Constructing an Entity from JSON produced by Entity-to-JSON conversion yields an Entity equal to the original, and the capability introduces no Field of its own.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Constructed the sample Entity from the JSON string and from its bytes; the result equalled the original Field for Field. ruff, ruff format and pyright reported no problems.
                location: Foundation base in model/src/model/foundation.py
        P1-G2:
          id: P1-G2
          title: Shared Declaration capability
          description: The technology-independent vocabulary through which every Entity records its data meaning and metadata.
          area: Declaration layer
          does: Every kind of Entity meaning the Target declares can be recorded and exposed through Declaration without runtime behaviour.
          constraints: []
          task_count: 5
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Declare Field Type, nullability, and Default Value
              description: Provide the Declaration capability to record and expose each Field's logical Type, whether the Field is required or nullable, and its fixed Default Value.
              reason: Consumers and storage realization need structured Field meaning rather than descriptive prose.
              inputs:
              - Model Declaration responsibility
              skills:
              - sqlmodel
              expected_result: A Field's Type, presence semantics, and Default Value are recorded and readable by consumers, independent of language, database, or Engine.
              depends_on: []
              constraints: []
              acceptance: For any declared Field, its Type, nullability, and Default Value can be read back exactly as declared, including a false or null default.
              verify: Declaring Fields with differing Types, nullability, and defaults (including false and null) and reading them back returns each exactly as declared.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Declared Fields of boolean, string, integer and decimal Type with false, null, no default and a decimal default and read each back exactly; a null default is distinguished from no default. ruff, ruff format and pyright reported no problems.
                location: Declaration in model/src/model/declaration.py
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Declare sensitivity marker, immutability, length, and constraints
              description: Provide the Declaration capability to record and expose a Field's optional sensitivity marker (`password` or `sensitive`), its immutability, its length, and any other Target-declared restriction as usable structured meaning.
              reason: Consumers and storage realization must be able to apply the same domain restriction consistently.
              inputs:
              - Model Declaration responsibility
              skills:
              - sqlmodel
              expected_result: A Field's sensitivity marker, immutability, length, and other declared restrictions are recorded and readable by consumers.
              depends_on: []
              constraints: []
              acceptance: A declared marker, immutability, length, or restriction on a Field can be read back exactly as declared, and a Field without them reports none.
              verify: Declaring a Field with each of these rules and one without any, then reading them back, returns each exactly as declared and nothing invented.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Declared a Field with password marker, immutability, length and a pattern restriction and one with none; each read back exactly and the bare Field reported none. The sensitive marker also read back. ruff, ruff format and pyright reported no problems.
                location: Declaration in model/src/model/declaration.py
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Declare Identity, Primary Key, and Value Generation
              description: Provide the Declaration capability to record and expose an Entity's `id` Identity and Primary Key and any Value Generation, such as Auto Increment or a generated identifier, keeping Value Generation and Default Value mutually exclusive for one Field.
              reason: Every Entity needs a distinguishing Identity, and a Field must never claim both a fixed default and generated values.
              inputs:
              - Model Declaration responsibility
              - Field Default Value declaration
              skills:
              - sqlmodel
              expected_result: Identity, Primary Key, and Value Generation are recorded and readable, and a Field cannot declare both Value Generation and a Default Value.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: An Entity's Identity, Primary Key, and Value Generation are readable as declared, and declaring both Value Generation and a Default Value on one Field is rejected or otherwise prevented.
              verify: Reading back a declared Identity, Primary Key, and Value Generation returns them as declared, and a Field declared with both Value Generation and a Default Value is refused.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Declared an integer auto-increment id and a generated-identifier id; identity, primary key and value generation read back as declared. Declaring a default together with value generation raised ValueError, and an Entity without an id Field was refused. ruff, ruff format and pyright reported no problems.
                location: Declaration in model/src/model/declaration.py
            P1-G2-T4:
              id: P1-G2-T4
              source_id: '003'
              title: Declare References
              description: Provide the Declaration capability to record and expose a Field-level Reference that identifies its target Entity and that Entity's `id`, without nesting or copying either Entity.
              reason: Cross-Entity connections must be explicit and flat so no hidden structural coupling exists.
              inputs:
              - Model Declaration responsibility
              skills:
              - sqlmodel
              expected_result: A Reference is recorded and readable, naming its target Entity and `id`.
              depends_on: []
              constraints: []
              acceptance: A declared Reference reports its target Entity and `id`, and neither Entity contains the other.
              verify: Declaring a Reference between two Entities and reading it back returns the target Entity and `id`, with neither Entity nested inside the other.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Declared a Reference; it reported target Entity 'User', target Field 'id' and source Field. A Reference from an undeclared Field was refused. References hold only names, so no Entity is nested in another. ruff, ruff format and pyright reported no problems.
                location: Declaration in model/src/model/declaration.py
            P1-G2-T5:
              id: P1-G2-T5
              source_id: '003'
              title: Declare Uniqueness Constraints and Index intentions
              description: Provide the Declaration capability to record and expose Uniqueness Constraints and Index intentions, each covering one Field or a declared combination of Fields.
              reason: Target rules require single-Field and composite uniqueness, and Index intentions must remain independent of any database.
              inputs:
              - Model Declaration responsibility
              skills:
              - sqlmodel
              expected_result: Single-Field and composite Uniqueness Constraints and Index intentions are recorded and readable.
              depends_on: []
              constraints: []
              acceptance: A declared single-Field or composite Uniqueness Constraint or Index intention can be read back naming exactly the Fields it covers.
              verify: Declaring one single-Field and one composite constraint and index, then reading them back, returns exactly the Fields each covers.
              status: done
              log:
              - at: '2026-09-28T04:37:31+03:30'
                by: '004'
                from: todo
                to: claimed
                event: claimed by develop before work began; dependencies within scope satisfied or claimed together
              - at: '2026-09-28T04:38:49+03:30'
                by: '004'
                from: claimed
                to: done
                event: verified
                check: Transient check script exercising the published Declaration and Foundation with throwaway samples, plus ruff check, ruff format and pyright over the Model source.
                outcome: Declared single-Field and composite Uniqueness Constraints and Index intentions; each read back exactly its Fields. A constraint over an undeclared Field was refused. ruff, ruff format and pyright reported no problems.
                location: Declaration in model/src/model/declaration.py
