                unset: 'How operators behave where the Schema is silent: case sensitivity, nulls, and exactness'
                chosen: Text matching is case-sensitive; NOT_EQUALS and every comparison leave out records whose Field
                  is null (null satisfies only IS_NULL); decimals compare by exact value; IN with no members selects
                  nothing
                why: The Schema names the operators without defining them; standard SQL null semantics and the Model's
                  exact decimal and instant-based datetime meaning are the least surprising reading, and case-sensitive
                  matching avoids this Engine's default of folding case.
