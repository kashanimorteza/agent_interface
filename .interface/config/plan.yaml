                check: 'Ran a script (uv run python) against a throwaway Instance. Forced failures on a throwaway Instance and compared full snapshots of the affected Tables before and after: Add and Update violating uniqueness, Delete of a referenced record, Truncate that would remove an unreferenced record before hitting a referenced one, a changing command that fails on its second row, and Enable and Disable made to fail by a temporary storage trigger. Then ran successful changes and read them from a fresh connection. The first run of the Enable check did not fail because enabling an already-active record makes no change; the check was corrected to make the change real.'
