              reason: A change must have one reliable result regardless of failure.
              inputs:
              - Every data-changing Operation
              skills: []
              expected_result: A data-changing Operation either applies fully or not at all.
              depends_on:
              - P2-G6-T01
              - P2-G6-T03
              - P2-G6-T05
              - P2-G6-T06
              - P2-G6-T07
              - P2-G6-T08
              - P2-G8-T01
              constraints: []
              acceptance: After a forced failure partway through a change, the Instance is identical to its state before the Operation.
              verify: For each data-changing Operation and a changing command, force a failure partway through and observe the Instance unchanged; run each successfully and observe the full change.
              status: done
              log:
              - at: '2026-09-28T00:03:34Z'
                status: claimed
                note: Claimed before writing the change.
              - at: '2026-09-28T00:04:40Z'
