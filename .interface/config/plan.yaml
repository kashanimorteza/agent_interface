              id: P3-G5-T01
              source_id: '006'
              title: Choose the treatment of every sensitive Field
              description: Determine, from each Field's declared sensitivity marker together with the Target's storage rules, which Fields get one-way hashing and which get reversible encryption, and make that determination available to every Operation.
              reason: The marker names a category of value, and the Target's storage rule decides the treatment, so the two must be combined in one place.
              inputs:
              - Every Entity's sensitivity markers
              - The Target's storage rules for credentials
              skills: []
              expected_result: 'Every sensitive Field has exactly one treatment: the User''s credentials are hashed, and the Instance''s and Account''s credentials are encrypted.'
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: The determination covers each sensitive Field and assigns the treatment the Target declares.
              verify: List every sensitive Field of every Entity with its treatment; the User's password and API key are hashed, and the Instance's password and API key and the Account's password are encrypted.
              status: todo
            P3-G5-T02:
              id: P3-G5-T02
              source_id: '006'
              title: Hash User credentials compatibly with the stored data
              description: Provide one-way hashing of a credential and checking of a presented credential against a stored hash, using the same stored form that the Initial Data already holds for the User.
              reason: Credentials stored earlier must remain usable, and later ones must be interchangeable with them.
              inputs:
              - The stored User credentials produced by the Initial Data
              - The Target's storage rule for User credentials
              skills: []
              expected_result: Logic hashes a credential into the stored form and verifies a presented credential against a stored hash, including the stored User hashes.
              depends_on:
              - P3-G5-T01
              constraints: []
              acceptance: The generated Admin credentials verify against the stored hashes; a wrong credential does not; a newly hashed value verifies and differs each time it is hashed.
              verify: Verify the delivered Admin credentials against the stored hashes without displaying them; verify a wrong credential fails; hash one value twice and see two different stored forms that both verify.
              status: todo
            P3-G5-T03:
              id: P3-G5-T03
              source_id: '006'
              title: Encrypt connection and account credentials compatibly with the stored data
              description: Provide reversible protection of a credential and recovery of the original, using the secret from Logic's configuration and the same stored form that the Initial Data already holds for the Instance and Account.
              reason: Credentials stored earlier must remain recoverable by an authorized holder of the secret, and later ones must be interchangeable with them.
              inputs:
              - The stored Instance and Account credentials produced by the Initial Data
              - The configuration contract's secret
              skills: []
              expected_result: Logic protects a credential into the stored form and recovers the original from a stored value, including the stored Instance and Account values.
              depends_on:
              - P3-G5-T01
              - P3-G2-T02
              constraints: []
              acceptance: With the right secret the stored values decrypt to the delivered originals; a newly protected value round-trips; the wrong secret fails.
              verify: With the configured secret, recover the stored Instance and Account credentials and compare them with the delivered originals without displaying them; protect and recover a new value; use a wrong secret and see recovery fail.
              status: todo
            P3-G5-T04:
              id: P3-G5-T04
              source_id: '006'
              title: Protect sensitive values before passing them to Database
              description: Provide the preparation that protects each supplied sensitive value with its treatment before an Entity is passed to Database for Add or Update, leaves null values null, leaves unsupplied Fields untouched, and never protects a value twice.
              reason: Database stores whatever it receives, so protection must happen first and exactly once.
              inputs:
              - The chosen treatments
              - The hashing and encryption capabilities
              skills: []
              expected_result: Stored sensitive values are always the protected form of what the consumer supplied.
              depends_on:
              - P3-G5-T02
              - P3-G5-T03
              - P3-G3-T02
              constraints: []
              acceptance: After an Entity prepared this way is handed to Database, storage holds the protected form and not the original; unsupplied Fields keep their stored values; nulls stay null.
              verify: Prepare test Entities for Add and for Update, hand them to Database's Add and Update Operations, and read the storage directly; the stored values are protected forms of the test values, an Update that omits the credential leaves it unchanged, and a null credential stays null.
              status: todo
            P3-G5-T05:
              id: P3-G5-T05
              source_id: '006'
              title: Withhold sensitive values from returned records
              description: Provide the preparation of records for return to a consumer so that they carry neither an original sensitive value nor the stored form of one.
              reason: A returned record that carries stored forms invites being passed back to Update and protected a second time.
              inputs:
              - The chosen treatments
              - The Application Outcome shapes
              skills: []
              expected_result: Records prepared for return lack their sensitive Fields' values.
              depends_on:
              - P3-G5-T04
              constraints: []
              acceptance: For every Entity with sensitive Fields, no prepared record exposes a value in a sensitive Field.
              verify: Prepare stored records of every Entity with sensitive Fields for return and inspect each; none carries a value in a sensitive Field.
              status: todo
            P3-G5-T06:
              id: P3-G5-T06
              source_id: '006'
              title: Keep original sensitive values out of errors, logs, and outcomes
              description: Ensure the original sensitive value never appears in an error, log entry, or Application Outcome, including invalid-input and conflict outcomes produced while handling that value.
              reason: Failures that echo the value they rejected disclose it.
              inputs:
              - The chosen treatments
              - The translated failure outcomes
              skills: []
              expected_result: No outcome, error, or log entry contains an original sensitive value.
              depends_on:
              - P3-G5-T04
              - P3-G3-T02
              - P3-G2-T03
              constraints: []
              acceptance: Provoking every failure kind with a distinctive test credential reveals the value nowhere.
              verify: Present a distinctive test credential to validation, protection, and failure translation in each failing case (invalid input, conflict, reference problem, unexpected failure) and search all outcomes, errors, and logs for it; it is not found.
              status: todo
        P3-G6:
          id: P3-G6
          title: Credential separation rules
          description: Applies the Target's rule that the same credential must not be duplicated across an Instance and the Accounts that use it. No Trading Platform currently declares that it requires a shared credential, so a duplicate is always refused.
          area: Rules that span Instance and Account
          does: Instance credentials and Account credentials stay distinct.
          constraints: []
          task_count: 2
          tasks:
            P3-G6-T01:
              id: P3-G6-T01
              source_id: '006'
              title: Refuse an Account credential that duplicates its Instance's
              description: Provide the rule, applied whenever an Account is added or changed, that refuses as a conflict an Account whose sensitive credential equals a credential of the Instance it uses.
              reason: Instance credentials authenticate the platform connection and Account credentials authenticate one account, and sharing a value weakens both.
              inputs:
              - The Target's rule on separate credentials
              - The protected credential capabilities
              skills: []
              expected_result: An Account is accepted when its credentials differ from its Instance's and refused as a conflict when one is equal.
              depends_on:
              - P3-G5-T04
              - P3-G3-T02
              constraints: []
              acceptance: Equal credentials produce a conflict without revealing either value; different ones are accepted.
              verify: Present an added and a changed Account whose credential equals its Instance's to the rule and see a conflict with no value shown; present different credentials and see acceptance.
              status: todo
            P3-G6-T02:
              id: P3-G6-T02
              source_id: '006'
              title: Refuse an Instance credential that duplicates a linked Account's
              description: Provide the rule, applied whenever an Instance is changed, that refuses as a conflict a change that makes one of its sensitive credentials equal to a credential of an Account that uses it.
              reason: The rule must hold from both sides, or changing the Instance could break it.
              inputs:
              - The Target's rule on separate credentials
              - The protected credential capabilities
              skills: []
              expected_result: An Instance Update that would duplicate a linked Account's credential is refused as a conflict.
              depends_on:
              - P3-G6-T01
              constraints: []
              acceptance: The duplicate change is refused without revealing either value, and other changes are accepted.
              verify: Present an Instance change that makes a credential equal to a linked Account's to the rule and see a conflict with no value shown; present a distinct credential and see acceptance.
              status: todo
        P3-G7:
          id: P3-G7
          title: Bounded dependency use
          description: Bounds how long and how often Logic waits on and repeats calls to its dependencies.
          area: Bounded use of Database
          does: No call to a dependency waits forever or repeats without limit.
          constraints: []
          task_count: 2
          tasks:
            P3-G7-T01:
              id: P3-G7-T01
              source_id: '006'
              title: Give every dependency call a finite limit
              description: Ensure every call Logic makes to a dependency is bounded by a finite time limit taken from Logic's configuration, with a safe default.
              reason: One unavailable dependency must not stall Logic forever.
              inputs:
              - The configuration contract
              - The Logic Principles on bounded execution
              skills: []
              expected_result: A call to a stalled dependency ends within the configured limit and produces an unexpected-failure outcome.
              depends_on:
              - P3-G2-T02
              - P3-G3-T02
              constraints: []
              acceptance: A stalled dependency call is abandoned near the limit and reported without leaking detail.
              verify: Make a dependency call stall and see it end near the configured limit with a detail-free unexpected failure.
              status: todo
            P3-G7-T02:
              id: P3-G7-T02
              source_id: '006'
              title: Retry only safe calls, and only a limited number of times
              description: Ensure Logic retries a transiently failing read a limited number of times taken from its configuration, and never retries a change automatically.
              reason: A repeated change could be applied twice, and an unlimited retry could never end.
              inputs:
              - The configuration contract
              - The Logic Principles on bounded execution
              skills: []
              expected_result: Reads are retried up to the configured limit and then fail, and changes are attempted exactly once.
              depends_on:
              - P3-G7-T01
              constraints: []
              acceptance: A read that keeps failing is attempted the limit plus one times at most; a failing change is attempted once.
              verify: Make a read fail transiently and see it retried within the limit and succeed; make it fail permanently and see it stop at the limit; make a change fail and see exactly one attempt.
              status: todo
        P3-G8:
          id: P3-G8
          title: Entity Service
          description: The internal Service that presents, for each Entity Model publishes, an Action for every Database Operation applicable to that Entity. Its Service Interface reflects Database's catalogue and contract without redefining either. The first nine Tasks provide the shared Actions, and the rest provide one unit per Entity.
          area: Entity Service
          does: Every published Entity has Actions for every applicable Database Operation, each answering with Application Outcomes.
          constraints: []
          task_count: 25
          tasks:
            P3-G8-T01:
              id: P3-G8-T01
              source_id: '006'
              title: Provide the Add Action
              description: 'Provide the Entity Service Action that reflects Database''s Add Operation: it validates the request, protects sensitive values, stores the record, and returns a success outcome carrying the created record without its sensitive values.'
              reason: Consumers must be able to create records through Logic alone.
              inputs:
              - Database's Add Operation
              - The validation, protection, and outcome capabilities
              skills: []
              expected_result: Add returns success with the created record, or the matching expected failure, and stores nothing on failure.
              depends_on:
              - P3-G4-T02
              - P3-G3-T02
              - P3-G7-T02
              - P3-G5-T05
              constraints: []
              acceptance: A valid request creates a record and returns it without sensitive values; invalid and conflicting requests return their expected failures and store nothing.
              verify: Add a valid record and see success with the record; add an invalid one and a duplicate and see invalid input and conflict with nothing stored.
              status: todo
            P3-G8-T02:
              id: P3-G8-T02
              source_id: '006'
              title: Provide the Update Action
              description: 'Provide the Entity Service Action that reflects Database''s Update Operation: it validates the supplied values, protects sensitive values, changes only supplied Fields, and returns success with the updated record, or not found.'
              reason: Consumers must be able to change records through Logic alone.
              inputs:
              - Database's Update Operation
              - The Add Action
              skills: []
              expected_result: Update returns success with the updated record, not found for an unknown record, or the matching expected failure.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: Only supplied Fields change, an unknown record yields not found, and invalid or conflicting changes leave the record unchanged.
              verify: Update one Field and see only it change; update an unknown record and see not found; update with an invalid value and a duplicate and see the failures with the record unchanged.
              status: todo
            P3-G8-T03:
              id: P3-G8-T03
              source_id: '006'
              title: Provide the Delete Action
              description: 'Provide the Entity Service Action that reflects Database''s Delete Operation: it removes a record and returns success, not found for an unknown record, or a reference problem when other records still refer to it.'
              reason: Consumers must be able to remove records through Logic alone.
              inputs:
              - Database's Delete Operation
              - The Add Action
              skills: []
              expected_result: Delete returns success, not found, or a reference problem.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: An unreferenced record is removed, an unknown record yields not found, and a referenced record is kept with a reference problem.
              verify: Delete an unreferenced record and see success; delete it again and see not found; delete a referenced record and see a reference problem with the record kept.
              status: todo
            P3-G8-T04:
              id: P3-G8-T04
              source_id: '006'
              title: Provide the Enable and Disable Actions
              description: 'Provide the Entity Service Actions that reflect Database''s Enable and Disable Operations: each activates or deactivates a record and returns success with the record, or not found for an unknown record.'
              reason: Consumers must be able to switch records on and off through Logic alone.
              inputs:
              - Database's Enable and Disable Operations
              - The Add Action
              skills: []
              expected_result: Enable and Disable change the record's active state and report an unknown record as not found.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: The record's active state changes as requested, and an unknown record yields not found.
              verify: Disable an active record and see it inactive, enable it and see it active; run both on an unknown record and see not found.
              status: todo
            P3-G8-T05:
              id: P3-G8-T05
              source_id: '006'
              title: Provide the Truncate Action
              description: 'Provide the Entity Service Action that reflects Database''s Truncate Operation: it removes every record of an Entity and returns success with the number removed, or a reference problem when other records still refer to them.'
              reason: Consumers must be able to clear an Entity through Logic alone.
              inputs:
              - Database's Truncate Operation
              - The Add Action
              skills: []
              expected_result: Truncate returns success with the count removed or a reference problem, and removes nothing on failure.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: An unreferenced Entity is emptied and the count returned; a referenced one keeps every record.
              verify: Truncate an Entity holding three unreferenced records and see success with 3; truncate an Entity whose records are referenced and see a reference problem with all records kept.
              status: todo
            P3-G8-T06:
              id: P3-G8-T06
              source_id: '006'
              title: Provide the Get by ID Action
              description: 'Provide the Entity Service Action that reflects Database''s Get by ID Operation: it returns success with the record, without its sensitive values, or not found.'
              reason: Consumers must be able to retrieve one record through Logic alone.
              inputs:
              - Database's Get by ID Operation
              - The Add Action
              skills: []
              expected_result: Get by ID returns success with the record or not found.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: An existing record is returned without sensitive values and an unknown one yields not found.
              verify: Add a record, retrieve it and see success without sensitive values; retrieve an unknown id and see not found.
              status: todo
            P3-G8-T07:
              id: P3-G8-T07
              source_id: '006'
              title: Provide the List Action
              description: 'Provide the Entity Service Action that reflects Database''s List Operation: it accepts optional Filters, a filter combination, Orders, and a limit as Database defines them, and returns success with the matching records without their sensitive values, or invalid input for an unknown Field.'
              reason: Consumers must be able to find records through Logic alone.
              inputs:
              - Database's List Operation
              - The Get by ID Action
              skills: []
              expected_result: List returns the matching records as Database's Operation defines, or invalid input for an unknown Field.
              depends_on:
              - P3-G8-T06
              constraints: []
              acceptance: Filters, combination, Orders, and limit behave as Database defines them; sensitive values are withheld; an unknown Field yields invalid input.
              verify: List with Filters, a combination, Orders, and a limit and see the records Database's Operation would return without sensitive values; list by an unknown Field and see invalid input.
              status: todo
            P3-G8-T08:
              id: P3-G8-T08
              source_id: '006'
              title: Provide the Count Action
              description: 'Provide the Entity Service Action that reflects Database''s Count Operation: it returns success with the number of records.'
              reason: Consumers must be able to learn how many records exist through Logic alone.
              inputs:
              - Database's Count Operation
              - The Add Action
              skills: []
              expected_result: Count returns success with the number of records, 0 for none.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: The number equals the number of stored records.
              verify: Count an empty Entity and see 0; add records and see the number.
              status: todo
            P3-G8-T09:
              id: P3-G8-T09
              source_id: '006'
              title: Provide the Sum, Min, and Max Actions
              description: 'Provide the Entity Service Actions that reflect Database''s Sum, Min, and Max Operations: each accepts a Field and returns success with the total, smallest, or largest value as Database defines, or invalid input for an unknown or unsuitable Field, and never reveals a sensitive Field''s values.'
              reason: Consumers must be able to compute aggregates through Logic alone.
              inputs:
              - Database's Sum, Min, and Max Operations
              - The Add Action
              skills: []
              expected_result: Sum, Min, and Max return Database's results, or invalid input for an unknown, unsuitable, or sensitive Field.
              depends_on:
              - P3-G8-T01
              constraints: []
              acceptance: Results equal Database's; empty or null-only cases behave as Database defines; unknown, unsuitable, and sensitive Fields yield invalid input.
              verify: Run each aggregate over a Field with values including a null and over an empty Entity and see Database's results; run them on an unknown Field, a non-numeric Field for Sum, and a sensitive Field and see invalid input.
              status: todo
            P3-G8-T10:
              id: P3-G8-T10
              source_id: '006'
              title: Provide the User Entity file
              description: Provide the Entity Service unit for the User Entity, whose Service Interface presents an Action for every applicable Database Operation as the shared Actions define. Its credentials are hashed before storage, and its records never carry their credentials outward.
              reason: Consumers must be able to operate on the User records through Logic.
              inputs:
