                transition: "claimed -> done"
                check: "Started the API through its entry point with the default locations, with both locations changed (then requested the old and the new locations), and with attempts to switch the health signal off (empty, off, false, none, disabled, root, a reserved framework location), the readiness signal off (empty), and both signals at one location; ruff and pyright ran clean."
                outcome: "Defaults served health at /health and readiness at /ready; with API_HEALTH_PATH=/alive and API_READINESS_PATH=/serving each signal answered 200 at its new location and 404 at the old one; every attempt to disable a signal was refused at start with a message naming the value and saying the signal cannot be disabled, so no configuration produces a running API without both signals; identical locations were refused. Choice made: the two locations are optional runtime values (defaults from the API Preferences), added to the runtime configuration contract of P4-G2-T02."
