                transition: "claimed -> done"
                check: "Served the Entity Group over a recording stand-in Adapter and sent shape-violating requests that carried a recognisable secret value: a missing body field, a wrong type, malformed JSON, an undeclared body field, an undeclared query input, a record id of the wrong type, and a missing record id; then sent a well-formed request that the stand-in Application refuses and one it accepts; also an unknown path and a wrong method; ruff and pyright ran clean."
                outcome: "Every shape violation was refused with 422 before the Adapter (no call received), the failure names the input and the rule ('body.username: Field required', 'query.password: Extra inputs are not permitted') and carries the request identifier, and the secret value appears in no response; the well-formed request that the application refuses reached the Adapter and was answered with the declared failure (409 'User.name: must be unique'); the accepted request returned 201; an unknown path and a wrong method are answered in the same failure representation (404 and 405). Choices: undeclared inputs are refused (Transport Schemas forbid extra fields and the Router refuses undeclared query inputs); every Endpoint documents its declared failures in the contract (404 for a missing record, 409, 422, 500) with the shared failure body."
