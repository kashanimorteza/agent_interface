        P3-G5:
          id: P3-G5
          title: Credential handling
          description: 'The treatment of the credential Fields the Target designates in User, Instance, and Account: protection before storage, and no exposure of an original credential value.'
          area: Sensitive-value handling of credential Fields
          does: Credentials are protected as the Target states before they reach Database, an unchanged credential survives an edit, and no original credential value leaves Logic.
          constraints:
          - Logic applies credential treatment only to values it receives through an Operation and does not rewrite credentials already stored.
          - Reading a record whose stored credential is not in protected form never fails an Operation and never exposes that value.
          task_count: 8
          tasks:
            P3-G5-T01:
              id: P3-G5-T01
              source_id: 008
              title: Provide one-way credential protection
              description: Provide protection of a credential value into a stored form from which the original cannot be recovered, together with the check of a candidate value against that stored form.
              reason: The Target states hash storage at rest for the User credentials, and Logic owns that treatment.
              inputs:
              - Credential value
              - Treatment the Target states for hash storage
              skills:
              - python-skills:python-guidelines
              expected_result: A protection whose stored form hides the original and can still confirm or reject a candidate.
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: The stored form differs from the original and does not contain it, protecting the same value twice does not require the forms to match, a candidate equal to the original is confirmed against the stored form, and a different candidate is rejected.
              verify: Protecting a placeholder value and inspecting the stored form shows it is neither the original nor contains it, checking the original against it succeeds, and checking a different value fails.
              status: done
              log:
              - at: '2026-09-29T08:43:05Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the credential protections.
              - at: '2026-09-29T08:43:42Z'
                transition: claimed -> done
                check: Transient script protecting a placeholder passphrase twice with the one-way protection and checking it against both stored forms, a different value, a malformed stored form, the original text itself, and a protector built with another secret.
                outcome: The stored form differs from the value and does not contain it; the two stored forms differ from each other yet both confirm the original; a different value, a malformed form, and the plain text are all rejected; confirmation does not depend on the configured secret. ruff and pyright clean.
            P3-G5-T02:
              id: P3-G5-T02
              source_id: 008
              title: Provide reversible credential protection
              description: Provide protection of a credential value into a stored form that only Logic can turn back into the original for its own use, using the secret material the runtime configuration supplies.
              reason: The Target states encrypted storage at rest for the Instance and Account credentials, and Logic owns that treatment.
              inputs:
              - Credential value
              - Treatment the Target states for encrypted storage
              - Validated runtime configuration
              skills:
              - python-skills:python-guidelines
              expected_result: A protection whose stored form hides the original from everything except Logic's own use of the configured secret.
              depends_on:
              - P3-G2-T01
              constraints: []
              acceptance: The stored form differs from the original and does not contain it, Logic recovers the original from the stored form with the configured secret, and a different secret cannot recover it.
              verify: Protecting a placeholder value and inspecting the stored form shows it is neither the original nor contains it, recovering it with the configured secret returns the original, and recovering it with another secret fails.
              status: done
              log:
              - at: '2026-09-29T08:43:05Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before writing the credential protections.
              - at: '2026-09-29T08:43:42Z'
                transition: claimed -> done
                check: Transient script protecting a placeholder passphrase twice with the reversible protection and recovering it with the configured secret, with another secret, and from text that is not an encrypted form (the plain value, a one-way form, and a corrupted token).
                outcome: Neither stored form equals or contains the value and the two forms differ; the configured secret recovers the original from both; another secret, the plain value, a one-way form, and a corrupted token recover nothing.
            P3-G5-T03:
              id: P3-G5-T03
              source_id: 008
              title: Protect the User credentials before they reach Database
              description: Apply the one-way protection to each User credential Field of a record Logic is asked to add or change, before the User reaches Database, so the original value is never stored.
              reason: The Target states hash storage at rest for the User credentials.
              inputs:
              - User Service
              - Add and Update Actions
              - One-way credential protection
              skills:
              - python-skills:python-guidelines
              expected_result: User records whose credentials are stored only in protected form.
              depends_on:
              - P3-G5-T01
              - P3-G4-T01
              - P3-G3-T02
              - P3-G3-T04
              constraints: []
              acceptance: After adding or updating a User with placeholder credentials, the values received by Database differ from the originals and cannot yield them, and a candidate equal to an original is confirmed against the stored form.
              verify: Adding and updating a User through a stand-in for Database shows the credential values it receives are protected forms of the supplied placeholders, and checking each original against them succeeds while checking other values fails.
              status: done
              log:
              - at: '2026-09-29T08:43:43Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before protecting User credentials in Add and Update.
              - at: '2026-09-29T08:44:17Z'
                transition: claimed -> done
                check: Transient script adding a User through the User Service over a recording stand-in for Database (forwarding to a real Database over a throwaway SQLite file) with distinctive placeholder credentials, inspecting the Entity Database received and the stored record, then updating the User with new placeholder credentials and inspecting again; it also compared the caller's own Entity before and after.
                outcome: The credential values Database received on Add and on Update were one-way protected forms that neither equal nor contain the placeholders; each original was confirmed against its stored form and a different value or the previous original was rejected; the stored record held the same protected forms; the caller's Entity kept its original values. The mapping of User credential Fields to the hash treatment follows the Target's stated at-rest rule (Open Question OQ-008-1 in log 008). ruff and pyright clean.
            P3-G5-T04:
