                transition: "claimed -> done"
                check: "Provoked a declared refusal, a missing record, a shape violation and an unknown path, and an unexpected failure on every one of the 12 kinds of Action (a stand-in raising an exception whose text names a storage engine, a file path, a stack trace marker and a secret), through the real Bootstrap composition, inspecting each response body, its request identifier and header, and every record captured from the error-tracking logger."
                outcome: "The declared refusal stays a failure (409 naming the rule); all 12 kinds of unexpected failure are answered 500 'Internal server error' with the request identifier in the body equal to the X-Request-ID header and no exception text, storage name, path, stack trace or secret; the missing record (404), the shape violation (422) and the unknown path (404) are failures in the same {detail, request_id} representation; the 16 error-tracking records hold no secret and no exception text, path or storage name, only identifier, method, path, status and the exception type."
