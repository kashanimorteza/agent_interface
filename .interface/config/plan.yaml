    P3:
      id: P3
      title: Logic
      order: 3
      target: Logic
      does: Implement the reusable Logic library for operating on the defined models.
      constraints: []
      task_count: 59
      groups:
        P3-G1:
          id: P3-G1
          title: Independent library
          description: Establishes Logic as a self-contained, reusable library that reaches Model and Database only through their public Interfaces.
          area: Logic as a standalone reusable library
          does: Logic exists as an independent library with its own isolated environment and dependency set, ready to receive its Behaviour.
          constraints: []
          task_count: 1
          tasks:
            P3-G1-T01:
              id: P3-G1-T01
              source_id: '006'
              title: Establish the Logic library as an independent reusable unit
              description: Create the Logic Component as a standalone library with its own isolated development environment and dependency management, depending on Model and Database only through their public Interfaces and on no other Component.
              reason: Every later Task places its result in this library, and API must be able to consume it independently.
              inputs:
              - The Logic Component definition and preferences
              - The shared Development defaults
              - The declared Connections from Logic to Model and to Database
              - The published Model and Database surfaces
              skills: []
              expected_result: An empty but consumable Logic library exists whose only Component dependencies are Model and Database.
              depends_on:
              - P1-G5-T01
              - P1-G5-T02
              - P2-G5-T03
              - P2-G11-T01
              constraints: []
              acceptance: The library can be set up from scratch in an isolated environment and its public surface imported by a consumer, with Model and Database available and no other Component present.
              verify: In a clean isolated environment, install Model, Database, and the library and import the library's public surface; the import succeeds and no Component other than Model and Database is required.
              status: todo
        P3-G2:
          id: P3-G2
          title: Runtime configuration contract
          description: Defines the runtime values Logic needs, checks them before use, and keeps them private. Logic owns the contract and never the delivery of the values.
          area: Logic runtime configuration
          does: Logic states what it needs at runtime, refuses to start without it, and never lets a secret escape.
          constraints: []
          task_count: 3
          tasks:
            P3-G2-T01:
              id: P3-G2-T01
              source_id: '006'
              title: Define Logic's configuration contract
              description: 'Define the runtime values Logic requires, each with its meaning, whether it is a secret, and whether it is required or has a safe default: the secret needed for reversible credential protection, and the limits that bound Logic''s use of a dependency.'
              reason: Logic needs a stated contract so that its environment knows exactly what to supply.
              inputs:
              - The Logic Principles on runtime configuration
              - The needs of credential protection and of bounded dependency use
              skills: []
              expected_result: A configuration contract exists that names every runtime value Logic requires and marks the secret one.
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: Every value Logic later reads is declared in the contract, and no value is read that the contract does not declare.
              verify: Read the contract through Logic; it lists each required value with its meaning, secrecy, and default, and Logic reads no other runtime value.
              status: todo
            P3-G2-T02:
              id: P3-G2-T02
              source_id: '006'
              title: Validate the configuration before use
              description: Ensure Logic validates every required runtime value before any Operation runs and refuses to become ready when a required value is missing or invalid, with a failure that names the value and the cause.
              reason: A contract checked before readiness fails at start with a clear cause instead of mid-operation with an unclear one.
              inputs:
              - The configuration contract
              skills: []
              expected_result: Logic reports a missing or invalid required value before serving any Operation, and accepts a complete valid configuration.
              depends_on:
              - P3-G2-T01
              constraints: []
              acceptance: A complete configuration is accepted, and each required value that is missing or invalid is rejected with a failure naming that value.
              verify: Supply a complete configuration and see it accepted; omit each required value in turn, and supply an invalid one, and see each rejected before any Operation runs.
              status: todo
            P3-G2-T03:
              id: P3-G2-T03
              source_id: '006'
              title: Keep configuration secrets out of every output
              description: Ensure a secret runtime value never appears in source, errors, public interfaces, logs, or Application Outcomes, including when validation or use of that value fails.
              reason: A secret that leaks through a failure message is disclosed as effectively as one that is published.
              inputs:
              - The configuration contract
              - The Logic Principles on runtime configuration
              skills: []
              expected_result: No output of Logic contains the secret value, even on failure.
              depends_on:
              - P3-G2-T02
              constraints: []
              acceptance: Failures caused by a missing, malformed, or wrong secret reveal neither the value supplied nor any part of it.
              verify: Supply a distinctive test secret that is malformed or wrong, provoke each failure, and search every error, outcome, and log for the test secret and its fragments; none is found.
              status: todo
        P3-G3:
          id: P3-G3
          title: Application Outcomes
          description: 'Defines the logical results Logic returns: a success or one of the expected failures an Operation declares, independent of transport and of persistence.'
          area: Application Outcomes
          does: Every Operation answers with an Application Outcome that hides how the work was carried out.
          constraints: []
          task_count: 2
          tasks:
            P3-G3-T01:
              id: P3-G3-T01
              source_id: '006'
              title: Define the Application Outcome shapes
              description: 'Define the Application Outcome: a success that carries the Operation''s result, or an expected failure identified by its kind and a message. The expected failure kinds are not found, invalid input, conflict, and reference problem.'
              reason: Consumers must learn what happened without learning which Components took part.
              inputs:
              - The Logic Principles on Application Outcomes
              skills: []
              expected_result: Application Outcomes exist for success and for each of the four expected failure kinds.
              depends_on:
              - P3-G1-T01
              constraints: []
              acceptance: Each outcome states its kind and carries either a result or a message, and nothing about transport or storage.
              verify: Construct each outcome kind and read it back; each states its kind and result or message and holds no transport or storage detail.
              status: todo
            P3-G3-T02:
              id: P3-G3-T02
              source_id: '006'
              title: Translate dependency failures into expected failures
              description: Ensure Logic turns the failures of Database and of validation into the declared expected failure kinds, without exposing storage detail, and treats any other failure as unexpected without leaking its detail.
              reason: A uniqueness or relationship failure is an expected result of a request, and must reach the consumer in the application's terms.
              inputs:
              - The Application Outcome shapes
              - The failures Database's Interface can produce
              skills: []
              expected_result: A uniqueness violation becomes a conflict, a dangling or still-referenced relationship becomes a reference problem, an unknown record becomes not found, and other failures do not leak detail.
              depends_on:
              - P3-G3-T01
              constraints: []
              acceptance: Each dependency failure produces the matching outcome kind and no outcome mentions tables, sessions, engines, or schema.
              verify: Provoke a duplicate, a dangling reference, a still-referenced removal, an unknown record, and an unexpected dependency failure; see conflict, reference problem, reference problem, not found, and a detail-free unexpected failure.
              status: todo
        P3-G4:
          id: P3-G4
          title: Model constraint validation
          description: Applies the constraints Model declares to the values a request supplies, before any change is passed to Database. Logic applies them as Model declares them and never redefines them.
          area: Validation of supplied Entity values
          does: A request carrying values that break a Model-declared constraint is refused as invalid input, and nothing is handed to Database.
          constraints: []
          task_count: 2
          tasks:
            P3-G4-T01:
              id: P3-G4-T01
              source_id: '006'
              title: Validate types, presence, and nullability
              description: Ensure a request's supplied values are checked against the Entity's declared Types, required Fields, nullability, and Field names, and that a violation produces an invalid-input outcome naming the Field without echoing a sensitive value.
              reason: The storage layer does not check value types, so Logic must refuse wrong values before they are stored.
              inputs:
              - Every published Entity and its Declaration
              - The Application Outcome shapes
              skills: &id003
              - pydantic:pydantic
              expected_result: Wrong types, missing required Fields, nulls in non-nullable Fields, and undeclared Field names are refused as invalid input.
              depends_on:
              - P3-G3-T01
              constraints: []
              acceptance: Each violation yields invalid input naming the Field, nothing is handed to Database, and a valid request is accepted.
              verify: Submit a request with a wrong type, an omitted required Field, a null in a non-nullable Field, and an undeclared Field name; see invalid input for each with nothing handed to Database; submit a valid request and see it accepted.
              status: todo
            P3-G4-T02:
              id: P3-G4-T02
              source_id: '006'
              title: Validate declared restrictions
              description: Ensure a request's supplied values are checked against the restrictions the Entity's Declaration states, such as length, range, pattern, and allowed values, wherever an Entity declares one.
              reason: Model-declared restrictions must hold for every stored record.
              inputs:
              - Every published Entity and its Declaration
              skills: *id003
              expected_result: A value that breaks a declared restriction is refused as invalid input.
              depends_on:
              - P3-G4-T01
              constraints: []
              acceptance: Each declared restriction is enforced; a value within the restriction is accepted.
              verify: For each restriction any Entity declares, submit a value that breaks it and one that satisfies it; see invalid input for the first and acceptance for the second.
              status: todo
        P3-G5:
          id: P3-G5
          title: Sensitive-value handling
          description: Chooses and applies the special treatment of credential Fields before an Entity reaches Database, and keeps the original values from leaving Logic. Database stores whatever it receives.
          area: Sensitive-value handling
          does: Credentials are protected as the Target declares, compatibly with what the Initial Data already stored, and never leave Logic in the clear.
