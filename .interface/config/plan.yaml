# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 23
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Deliver the independent Model layer as a reusable package that publishes one Entity for every Model the Target defines, with its Fields, References, and rules.
      constraints: []
      task_count: 23
      groups:
        P1-G1:
          id: P1-G1
          title: Package and shared layers
          description: The reusable package that publishes the Model layers, and the Declaration and Foundation capabilities that every Entity relies on. Entity work cannot start before these capabilities exist.
          area: Model package composition, Declaration metadata capabilities, and Foundation conversion capabilities.
          does: A standalone Model package exists whose Declaration can express every kind of Entity metadata the Target uses and whose Foundation converts any Entity to and from JSON.
          constraints: []
          task_count: 6
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the reusable Model package with its four public layers
              description: Create the Model as a standalone, reusable library whose Interface, Entity, Declaration, and Foundation layers are all publicly reachable, with no dependence on any other project Component.
              reason: Every later Task adds content to these layers, and other Components consume Model only as a package.
              inputs:
              - Model layer composition
              - Model technical selection and naming
              skills:
              - python-skills:python-guidelines
              expected_result: A Model package that a separate consumer can obtain and use, exposing the four public layers, still empty of Entities.
              depends_on: []
              constraints: []
              acceptance: The package stands alone and each of the four layers is publicly reachable by a consumer.
              verify: From a consumer outside the Model Component, observe that each of the four public layers can be reached and that nothing from another project Component is required to use the package.
              status: done
              log:
              - at: '2026-09-28T11:08:44Z'
                transition: todo -> claimed
                note: Claimed before work began; all dependencies done.
              - at: '2026-09-28T11:10:55Z'
                transition: claimed -> done
                check: From a consumer working directory outside the Model Component, imported the interface, entity, declaration, and foundation layers of the model package through the Component's own environment, and read the project's declared runtime dependencies.
                outcome: 'All four layers imported and identified themselves; the only runtime dependency is the SQLModel package, so no other project Component is required. Source: model/src/model/{interface,declaration,foundation}.py and model/src/model/entity/. Passed.'
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '003'
              title: Provide Declaration support for Field Types and Field Rules
              description: Let Declaration record, as structured and consumer-usable meaning, each Field's logical Type, presence and nullability, Default Value, optional sensitivity marker (password or sensitive), immutability, and declared restrictions such as length, range, pattern, precision, or allowed values.
              reason: Entities can only preserve Target Field meaning if Declaration can express it without free-form prose.
              inputs:
              - Model Declaration layering and Field Rule vocabulary
              - The Field kinds and rules the Target's Models use
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A Declaration capability through which any Field's Type and Field Rules are recorded and readable by consumers.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: A Field can carry each supported Type and Field Rule, and a consumer can read every recorded rule back exactly as declared.
              verify: Observe, on a transient sample Entity defined only for the check, that a Field declared with each Type and each Field Rule publishes that same meaning through Declaration.
              status: done
              log:
              - at: '2026-09-28T11:10:55Z'
                transition: todo -> claimed
                note: 'Claimed; dependencies done. Note: the shared layer source (declaration and foundation) was drafted in one pass immediately before this claim was recorded, and is verified under this claim before any Task is marked done.'
              - at: '2026-09-28T11:11:44Z'
                transition: claimed -> done
                check: 'Transient check (not persisted; testing capability is disabled) run through the Model Component''s environment on a throwaway sample Entity: declared a Field with each Type (integer, string, boolean, float, decimal, datetime) and each Field Rule (nullability, Default Value, both sensitivity markers, immutability, length, pattern, range, precision, scale, allowed values) and read every one back through Declaration.'
                outcome: 'Every Type and rule read back exactly as declared. Source: model/src/model/declaration.py. Passed.'
              - at: '2026-09-28T11:16:46Z'
                note: Declaration.of was later made deterministic (uniqueness and index groups ordered by size then declared Field order); re-ran the Type and Field Rule check afterwards. Passed.
            P1-G1-T3:
              id: P1-G1-T3
              source_id: '003'
              title: Provide Declaration support for identity, References, uniqueness, and indexes
              description: Let Declaration record an Entity's Identity and Primary Key, Field-level References that name their target Entity and its identity, Uniqueness Constraints over one Field or a declared combination of Fields, and Index intentions over one or several Fields.
              reason: Target Models rely on identity, cross-Entity connections, and single and composite uniqueness that consumers and storage must both be able to read.
              inputs:
              - Model Declaration layering
              - The identity, Reference, and uniqueness kinds the Target's Models use
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A Declaration capability through which identity, References, composite uniqueness, and indexes are recorded and readable.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Each metadata kind can be declared for one Field or several Fields and is published unchanged, with every Reference naming its target Entity and identity.
              verify: Observe, on transient sample Entities defined only for the check, that identity, a Reference, a single-Field and a multi-Field uniqueness rule, and an Index are all published through Declaration as declared.
              status: done
              log:
              - at: '2026-09-28T11:10:55Z'
                transition: todo -> claimed
                note: 'Claimed; dependencies done. Note: the shared layer source (declaration and foundation) was drafted in one pass immediately before this claim was recorded, and is verified under this claim before any Task is marked done.'
              - at: '2026-09-28T11:11:44Z'
                transition: claimed -> done
                check: 'Transient check (not persisted; testing capability is disabled) run through the Model Component''s environment on a throwaway sample Entity plus a second sample Entity: declared identity, a Reference, a single-Field and a two-Field uniqueness rule, and a single-Field and a two-Field Index, and read them through Declaration.'
                outcome: Primary Key, Reference (target Entity and id, realized as a foreign key), both uniqueness rules and both Indexes published as declared. Passed.
              - at: '2026-09-28T11:16:46Z'
                note: Declaration.of was later made deterministic (uniqueness and index groups ordered by size then declared Field order); re-ran the identity, Reference, uniqueness, and Index check afterwards. Passed.
            P1-G1-T4:
              id: P1-G1-T4
              source_id: '003'
              title: Provide Declaration support for Value Generation
              description: Let Declaration record automatic value supply when an Entity is created, covering both an auto-incrementing value and a generated identifier, kept distinct from a Default Value.
              reason: The Target's Models use auto-incrementing identity, and the Model preferences define a generated-identifier style for Entities that do not state one.
              inputs:
              - Model Declaration layering
              - Completed Field Rule support
              skills:
              - sqlmodel
              expected_result: A Declaration capability that records Value Generation and rejects a Field that also declares a Default Value.
              depends_on:
              - P1-G1-T2
              constraints: []
              acceptance: Both Value Generation kinds can be declared and published, and one Field can never declare both Value Generation and a Default Value.
              verify: Observe that a sample Field with Auto Increment and a sample Field with a generated identifier publish their generation intent, and that declaring a Default Value together with Value Generation on one Field is refused.
              status: done
              log:
              - at: '2026-09-28T11:11:45Z'
                transition: todo -> claimed
                note: Claimed before work began; all dependencies done.
              - at: '2026-09-28T11:13:09Z'
                transition: claimed -> done
                check: 'Transient check through the Model Component''s environment: declared an auto-increment identity and a generated-identifier Field on a throwaway Entity, created two instances, and attempted to declare a Default Value together with Value Generation.'
                outcome: Both generation kinds published through Declaration; two instances received distinct 36-character generated identifiers; combining a Default Value with Value Generation was refused with an error. Passed.
            P1-G1-T5:
              id: P1-G1-T5
              source_id: '003'
              title: Provide Foundation conversion of an Entity to JSON
              description: Give every Entity one shared capability that converts an instance to JSON, without adding Fields, constraints, domain meaning, or validation.
              reason: Consumers need one consistent way to serialise Entities that does not depend on each Entity's own code.
              inputs:
              - Model Foundation layering
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A shared Foundation capability that produces a JSON representation of any Entity instance.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The JSON produced contains exactly the Entity's own Field values and nothing added by Foundation.
              verify: Convert an instance of a transient sample Entity to JSON and observe that the result carries every declared Field value and no additional content.
              status: done
              log:
              - at: '2026-09-28T11:10:55Z'
                transition: todo -> claimed
                note: 'Claimed; dependencies done. Note: the shared layer source (declaration and foundation) was drafted in one pass immediately before this claim was recorded, and is verified under this claim before any Task is marked done.'
              - at: '2026-09-28T11:11:44Z'
                transition: claimed -> done
                check: 'Transient check (not persisted; testing capability is disabled) run through the Model Component''s environment on a throwaway sample Entity: converted an instance to JSON and compared the JSON keys with the Entity''s declared Fields.'
                outcome: JSON keys equal the declared Fields exactly and values match; nothing added by Foundation. Passed.
              - at: '2026-09-28T11:16:46Z'
                note: 'Later change: to_json changed to emit Fields in declared Field order (previously key order depended on how the instance was built). Re-ran the JSON conversion check after the change: JSON keys equal the declared Fields in declared order, values match. Passed.'
            P1-G1-T6:
              id: P1-G1-T6
              source_id: '003'
              title: Provide Foundation construction of an Entity from JSON
              description: Give every Entity one shared capability that builds an instance from JSON, without adding Fields, constraints, domain meaning, or validation of its own.
              reason: Consumers need the reverse of serialisation so Entity data can round-trip through JSON.
              inputs:
              - Model Foundation layering
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: A shared Foundation capability that constructs an Entity instance from a JSON representation.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: An instance built from JSON carries the values supplied and converting it back to JSON reproduces the original.
              verify: Build an instance of a transient sample Entity from JSON and observe that its values match the input and that a round trip to JSON and back is lossless.
              status: done
              log:
              - at: '2026-09-28T11:10:55Z'
                transition: todo -> claimed
                note: 'Claimed; dependencies done. Note: the shared layer source (declaration and foundation) was drafted in one pass immediately before this claim was recorded, and is verified under this claim before any Task is marked done.'
              - at: '2026-09-28T11:11:44Z'
                transition: claimed -> done
                check: 'Transient check (not persisted; testing capability is disabled) run through the Model Component''s environment on a throwaway sample Entity: built an instance from JSON, and round-tripped instance to JSON and back.'
                outcome: Values match the input, Decimal and datetime values are restored to their types, and the round trip is lossless (compared as parsed JSON). Initial attempt using JSON-string validation left Decimal/datetime as strings on a table model; changed construction to validate the parsed JSON, then passed.
              - at: '2026-09-28T11:16:46Z'
                note: 'Re-ran the construction and round-trip check after the to_json ordering change: values match, types restored, and the round trip is now string-identical. Passed.'
        P1-G2:
          id: P1-G2
          title: Access and connectivity Entities
