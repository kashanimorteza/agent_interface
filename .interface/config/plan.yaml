meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
  changed_by: "Agent and Skills operating within the Operation that owns the Plan content being written, per Authority and Ownership."
  precedence: "The Plan Schema and every applicable Principle take precedence over this file's content."

resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

read_order:
  - "task_count"
  - "plans"

content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

content:
  task_count: 24
  plans:
    P2:
      id: "P2"
      title: "Database"
      order: 2
      target: "Database"
      does: "Implement the database using the shared Model package and insert the defined initial data."
      constraints: []
      task_count: 7
      groups:
        database-configuration:
          id: "database-configuration"
          title: "Database Configuration"
          description: "Declares the storage technologies, connection identities, and shared settings the rest of the Database Component resolves requests against."
          area: "Database-wide configuration of available storage technologies, connection identities, and shared settings"
          does: "Every storage technology Database supports and every connection identity built from them is declared, and exactly one connection identity is resolvable as the default."
          constraints: []
          task_count: 1
          tasks:
            declare-database-configuration:
              id: "declare-database-configuration"
              source_id: "004"
              title: "Declare the Database Component's storage technologies, connection identities, and shared settings"
              description: "Declare every storage technology the Database Component supports, every named connection identity built from those technologies, and the shared settings needed to resolve which technology and identity a request uses by default."
              reason: "Every other Database responsibility (routing, storage derivation, provisioning) depends on knowing which storage technologies and connection identities exist before it can select one."
              inputs: ["The Database Component's declared storage technologies, connection identities, and shared settings"]
              skills: []
              expected_result: "A resolvable Database configuration exists identifying every declared storage technology, every declared connection identity and which technology it uses, and the shared settings including exactly one default connection identity."
              depends_on: []
              constraints: []
              acceptance: "Every declared connection identity names an existing declared storage technology, and exactly one connection identity is resolvable as the default."
              verify: "Resolving the Database configuration's default connection identity returns exactly one connection identity, and every declared connection identity's named storage technology exists among the declared storage technologies."
              status: "todo"
        storage-derivation-engine:
          id: "storage-derivation-engine"
          title: "Storage Derivation and Technology Implementation"
          description: "Turns every Domain Entity Model publishes into real storage structure and makes each declared storage technology able to execute the published Database Operations against it."
          area: "Storage structure derivation and per-technology execution of Database Operations"
          does: "A storage structure exists for every currently declared Domain Entity, and every storage technology marked for implementation can execute the full published Operation catalogue against that structure using its own mechanisms."
          constraints: []
          task_count: 2
          tasks:
            derive-storage-structure:
              id: "derive-storage-structure"
              source_id: "004"
              title: "Derive storage structure from every published Domain Entity"
              description: "Derive the storage structure required to persist every Domain Entity Model publishes, using only the Entity metadata imported from Model's single entry point, without duplicating or redefining any Entity field, constraint, relationship, or index."
              reason: "Storage cannot be created or queried until the structure it stores is derived from the authoritative Entity declarations."
              inputs: ["Every Domain Entity and its declared metadata, imported through Model's single entry point"]
              skills: ["sqlmodel"]
              expected_result: "A storage structure exists for every currently declared Domain Entity, matching its declared fields, constraints, relationships, and indexes without a second definition of any of them."
              depends_on: ["declare-database-configuration"]
              constraints: []
              acceptance: "Every currently declared Domain Entity has a corresponding storage structure whose fields, constraints, relationships, and indexes match the Entity's own declared metadata exactly."
              verify: "Building storage from the imported Entity metadata alone produces one storage structure per currently declared Domain Entity, with no Entity requiring a separately maintained definition."
              status: "todo"
            implement-storage-engine:
              id: "implement-storage-engine"
              source_id: "004"
              title: "Implement the published Database Operations for every declared storage technology"
              description: "Implement the published Database Operations for every storage technology marked for implementation, using that technology's own mechanisms, while preserving each Operation's request and result contract, and isolate each technology's implementation from every other."
              reason: "The published Operations must actually execute against a real storage technology before Database has any usable behaviour."
              inputs: ["The published Database Operation catalogue and contracts", "The declared storage technologies marked for implementation"]
              skills: ["sqlmodel"]
              expected_result: "Every storage technology marked for implementation executes every published Database Operation correctly and independently of every other implemented technology."
              depends_on: ["derive-storage-structure"]
              constraints: []
              acceptance: "Each published Operation, run against a storage technology marked for implementation, produces the result its contract defines, using that technology's own mechanisms."
              verify: "Invoking each published Operation against every storage technology marked for implementation returns the result its published contract defines, without requiring any Operation to know which technology handled it."
              status: "todo"
        interface-routing:
          id: "interface-routing"
          title: "Public Boundary and Request Routing"
          description: "Gives Logic one public place to perform every Database Operation and makes sure every request reaches the connection identity and storage technology it resolves to."
          area: "The Database Component's public boundary and internal request routing"
          does: "Every declared Database Operation is usable through one public boundary, and every request that boundary receives reaches the correct connection identity and storage technology and returns a result matching that Operation's published contract."
          constraints: []
          task_count: 2
          tasks:
            publish-database-interface:
              id: "publish-database-interface"
              source_id: "004"
              title: "Publish every Database Operation through one public boundary"
              description: "Publish every declared Database Operation through the one public boundary Logic uses, accepting an imported Entity class or Entity instance directly rather than a Model name or identity, and never exposing internal routing or storage-technology behaviour to a consumer."
              reason: "Logic needs one stable, documented place to perform every kind of data operation without depending on how Database is organized internally."
              inputs: ["The declared Database Operation catalogue"]
              skills: []
              expected_result: "Every declared Database Operation is callable from outside Database through the one public boundary, accepting an imported Entity class or instance, and no internal routing or storage detail is required of the caller."
              depends_on: ["derive-storage-structure"]
              constraints: []
              acceptance: "Every declared Operation is reachable and usable through the one public boundary alone, using only an imported Entity class or instance as its subject."
              verify: "Calling each declared Operation through the one public boundary, passing only an imported Entity class or instance, produces the result its contract defines without the caller referencing any internal routing or storage-technology detail."
              status: "todo"
            route-database-requests:
              id: "route-database-requests"
              source_id: "004"
              title: "Route every request to its resolved connection identity and storage technology"
              description: "Route every request the public boundary receives to the connection identity and storage technology it resolves to, forward it to that technology's implementation, and return its result according to the requested Operation's published contract."
              reason: "The public boundary must reach the correct storage technology for each request without the caller choosing it directly."
              inputs: ["The published Database Operation catalogue", "The declared configuration of connection identities and storage technologies"]
              skills: []
              expected_result: "Every request reaches the storage technology its resolved connection identity uses, and its result matches the requested Operation's published contract."
              depends_on: ["publish-database-interface", "implement-storage-engine", "declare-database-configuration"]
              constraints: []
              acceptance: "A request for any declared connection identity is forwarded to that identity's storage technology, and the returned result matches the requested Operation's published contract."
              verify: "Performing the same Operation against two different declared connection identities that use different storage technologies produces, from each, the result the Operation's published contract defines."
              status: "todo"
        default-provisioning:
          id: "default-provisioning"
          title: "Default Instance Provisioning and Initial Data"
          description: "Leaves the configured default connection identity holding real, usable storage populated with every initial data record the Target declares, not only source that could create it later."
          area: "Default connection identity provisioning and Target-declared initial data"
          does: "The configured default connection identity contains the required storage structure for every currently declared Domain Entity and holds every initial data record the Target declares."
          constraints: []
          task_count: 2
          tasks:
            provision-default-instance:
              id: "provision-default-instance"
              source_id: "004"
              title: "Provision the configured default connection identity's storage"
              description: "Provision the configured default connection identity's storage structure from the imported Entity metadata so that a required storage structure exists for every currently declared Domain Entity before Database development is reported complete."
              reason: "A developed Database Component must leave a usable default storage instance in place, not only source code and a command that could create one later."
              inputs: ["The configured default connection identity", "Every currently declared Domain Entity and its imported metadata"]
              skills: ["sqlmodel"]
              expected_result: "The configured default connection identity contains the required storage structure for every currently declared Domain Entity."
              depends_on: ["derive-storage-structure", "declare-database-configuration"]
              constraints: []
              acceptance: "The configured default connection identity's storage contains the required structure for every currently declared Domain Entity."
              verify: "Inspecting the configured default connection identity's storage shows the required structure present for every currently declared Domain Entity."
              status: "todo"
            insert-initial-data:
              id: "insert-initial-data"
              source_id: "004"
              title: "Insert the Target's declared initial data into the default connection identity"
              description: "Insert every initial data record the Target declares for a Domain Entity into the configured default connection identity, using the published Database Operations, without inserting a record the Target does not declare."
              reason: "The Target requires specific starting records to exist before the system is usable, and Database is where those records must actually be stored."
              inputs: ["Every Target-declared initial data record and the Domain Entity it belongs to", "The published Database Operations"]
              skills: []
              expected_result: "Every Target-declared initial data record exists in the configured default connection identity's storage, attributed to its correct Domain Entity."
              depends_on: ["provision-default-instance", "route-database-requests"]
              constraints: []
              acceptance: "Every Target-declared initial data record exists in the configured default connection identity's storage, attributed to its correct Domain Entity, and no undeclared record was inserted in its place."
              verify: "Retrieving records for each Domain Entity that declares initial data from the configured default connection identity returns exactly the records the Target declares for it."
              status: "todo"
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules."
      constraints: []
      task_count: 17
      groups:
        model-foundation-interface:
          id: "model-foundation-interface"
          title: "Model Foundation and Interface"
          description: "Provides the shared conversion behaviour every Domain Entity relies on and the single entry point that presents every public Entity and capability the Model Component publishes."
          area: "Shared Model-wide behaviour and the Component's public entry point"
          does: "Every Domain Entity converts to and from its shared external representation using one common behaviour, and every public Entity and capability is reachable through one convenient entry point."
          constraints: []
          task_count: 2
          tasks:
            model-foundation:
              id: "model-foundation"
              source_id: "002"
              title: "Provide shared Entity JSON conversion behaviour"
              description: "Provide one shared capability, usable by every Domain Entity, that converts an Entity instance to its external JSON-compatible representation and reconstructs an equivalent instance from that representation. The capability carries no field, constraint, or domain meaning of its own; every Entity uses it as-is."
              reason: "Logic, Database, and any other consumer need one consistent way to serialize and reconstruct any Entity instance, without each Entity re-implementing that behaviour separately."
              inputs: []
              skills: ["sqlmodel"]
              expected_result: "A shared conversion capability exists and is usable by every current and future Domain Entity to produce and consume its JSON-compatible representation."
              depends_on: []
              constraints: []
              acceptance: "Any Domain Entity instance can be converted to its JSON-compatible representation and an equivalent instance can be reconstructed from that representation, using the same shared capability, without that capability defining any Entity's fields or domain meaning."
              verify: "Converting an instance of any Domain Entity to its JSON-compatible representation and back reconstructs an instance with the same field values, using the identical shared capability for every Entity."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Ran `uv run python verify.py` (temporary script, removed after use) calling to_json() then from_json() through Model_Foundation for an instance of every declared Domain Entity.
                  result: Every reconstructed instance matched the original field values using the identical shared Model_Foundation capability; no Entity defines its own conversion.
            model-interface:
              id: "model-interface"
              source_id: "002"
              title: "Publish every Entity through one Model entry point"
              description: "Present every public Domain Entity and the shared conversion capability through one convenient entry point, so a consumer can reach any Entity and Model capability without needing to know how Model organizes its internal parts."
              reason: "Logic and Database need one dependable place to discover and import every Entity Model publishes, instead of depending on Model's internal organization."
              inputs: []
              skills: ["sqlmodel"]
              expected_result: "Every public Domain Entity and Model's shared conversion capability are reachable through one entry point."
              depends_on: ["model-foundation", "user-entity", "trading-platform-entity", "instance-entity", "currency-entity", "broker-entity", "asset-entity", "account-group-entity", "account-entity", "trailing-group-entity", "trailing-rule-entity", "partial-group-entity", "partial-rule-entity", "action-group-entity", "action-entity", "position-entity"]
              constraints: []
              acceptance: "Every Domain Entity Model currently publishes, and its shared conversion capability, can be reached through the one entry point without consulting any other Model part."
              verify: "Importing Model through its single entry point makes every currently declared Domain Entity and the shared conversion capability available for direct use."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Imported every public Entity and Model_Foundation exclusively through `my_model.model_interface`, then ran `SQLModel.metadata.create_all()` against an in-memory SQLite engine.
                  result: All 15 tables were created from the entry-point import alone; every currently declared Entity and the shared conversion capability are reachable through the one entry point.
        identity-connectivity:
          id: "identity-connectivity"
          title: "Identity and Connectivity"
          description: "Covers the Domain Entities that establish who uses the system, which trading platforms it supports, and how a user connects to one of them."
          area: "User identity, supported trading platforms, and platform connections"
          does: "The system can represent a distinct user, a supported trading platform standard, and a user's own connection to one of those platforms."
          constraints: []
          task_count: 3
          tasks:
            user-entity:
              id: "user-entity"
              source_id: "002"
              title: "Define the User Domain Entity"
              description: "Declare the User concept as a Domain Entity, capturing its identity and every field, rule, default, and sensitivity marker the Target declares for it, exactly as the Target states them."
              reason: "Every other owned concept in the system belongs to a user, so the User Entity must exist as the single authoritative representation of that concept before dependent Entities can reference it."
              inputs: ["The Target's declared identity, fields, field rules, sensitivity markers, and initial data for the User concept."]
              skills: ["sqlmodel"]
              expected_result: "The User Domain Entity is declared with its complete identity, fields, rules, and sensitivity markers, ready for other Entities to reference and for Logic and Database to consume."
              depends_on: ["model-foundation"]
              constraints: []
              acceptance: "The User Entity is declared with exactly the identity, fields, field rules, and sensitivity markers the Target states for it, independently understandable without referencing any other Entity."
              verify: "An instance of the User Entity can be constructed with its declared fields and converted to and reconstructed from its JSON-compatible representation without loss of any field value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed a User instance with id, name, username, password, api_key, is_active, description and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field value; password and api_key carry a recorded sensitivity marker (password/sensitive) as structured Field metadata.
            trading-platform-entity:
              id: "trading-platform-entity"
              source_id: "002"
              title: "Define the Trading Platform Domain Entity"
              description: "Declare the Trading Platform concept as a Domain Entity, capturing its identity and every field, rule, and default the Target declares for it, exactly as the Target states them."
              reason: "The system must represent each supported trading platform standard independently so an Instance can identify which platform it connects to."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Trading Platform concept."]
              skills: ["sqlmodel"]
              expected_result: "The Trading Platform Domain Entity is declared with its complete identity, fields, and rules, ready for other Entities to reference."
              depends_on: ["model-foundation"]
              constraints: []
              acceptance: "The Trading Platform Entity is declared with exactly the identity, fields, and rules the Target states for it, independently understandable without referencing any other Entity."
              verify: "An instance of the Trading Platform Entity can be constructed with its declared fields and converted to and reconstructed from its JSON-compatible representation without loss of any field value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed a Trading Platform instance with id, name, code, is_active, description and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field value.
            instance-entity:
              id: "instance-entity"
              source_id: "002"
              title: "Define the Instance Domain Entity"
              description: "Declare the Instance concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationships to the User that owns it and the Trading Platform it connects through."
              reason: "A user needs their own representation of a connection to a supported trading platform, distinct from the platform standard itself and from any account that later uses it."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Instance concept, and its declared Relationships to User and Trading Platform."]
              skills: ["sqlmodel"]
              expected_result: "The Instance Domain Entity is declared with its complete fields and rules and its explicit Relationships to User and Trading Platform, ready for Account to reference."
              depends_on: ["model-foundation", "user-entity", "trading-platform-entity"]
              constraints: []
              acceptance: "The Instance Entity is declared with exactly the fields and rules the Target states for it, together with explicit Relationships identifying the User that owns it and the Trading Platform it uses, without nesting either Entity inside it."
              verify: "An instance of the Instance Entity can be constructed with its declared fields and its References to a User and a Trading Platform, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed an Instance referencing an existing User (user_id) and Trading Platform (trading_platform_id), round-tripped it through to_json()/from_json(), and confirmed both foreign keys resolved during SQLModel.metadata.create_all().
                  result: Reconstructed instance matched every field and reference value; no Entity was nested inside Instance, only explicit id references.
        financial-reference-data:
          id: "financial-reference-data"
          title: "Financial Reference Data"
          description: "Covers the Domain Entities that define the currencies, brokers, and tradable assets available to a user."
          area: "Currency, broker, and tradable asset reference data"
          does: "The system can represent a user's currencies, the brokers they use, and the tradable assets each broker provides."
          constraints: []
          task_count: 3
          tasks:
            currency-entity:
              id: "currency-entity"
              source_id: "002"
              title: "Define the Currency Domain Entity"
              description: "Declare the Currency concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationship to the User that owns it."
              reason: "Accounts and other monetary concepts need one authoritative representation of a currency, owned per user, to reference as their base currency."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Currency concept, and its declared Relationship to User."]
              skills: ["sqlmodel"]
              expected_result: "The Currency Domain Entity is declared with its complete fields, rules, and its explicit Relationship to User, ready for Account to reference."
              depends_on: ["model-foundation", "user-entity"]
              constraints: []
              acceptance: "The Currency Entity is declared with exactly the fields and rules the Target states for it, together with an explicit Relationship identifying the User that owns it."
              verify: "An instance of the Currency Entity can be constructed with its declared fields and its Reference to a User, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed a Currency instance referencing an existing User (user_id) and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field and reference value; the code Field's declared length constraint (3) was preserved as structured metadata.
            broker-entity:
              id: "broker-entity"
              source_id: "002"
              title: "Define the Broker Domain Entity"
              description: "Declare the Broker concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationship to the User that owns it."
              reason: "Assets, accounts, and positions each need one authoritative representation of the broker providing them, independent of any specific trading platform."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Broker concept, and its declared Relationship to User."]
              skills: ["sqlmodel"]
              expected_result: "The Broker Domain Entity is declared with its complete fields, rules, and its explicit Relationship to User, ready for Asset, Account, and Position to reference."
              depends_on: ["model-foundation", "user-entity"]
              constraints: []
              acceptance: "The Broker Entity is declared with exactly the fields and rules the Target states for it, together with an explicit Relationship identifying the User that owns it."
              verify: "An instance of the Broker Entity can be constructed with its declared fields and its Reference to a User, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed a Broker instance referencing an existing User (user_id) and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field and reference value.
            asset-entity:
              id: "asset-entity"
              source_id: "002"
              title: "Define the Asset Domain Entity"
              description: "Declare the Asset concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationship to the Broker that provides it."
              reason: "Actions need one authoritative representation of every tradable asset a broker provides, together with the category and pricing precision the Target declares for it."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Asset concept, and its declared Relationship to Broker."]
              skills: ["sqlmodel"]
              expected_result: "The Asset Domain Entity is declared with its complete fields, rules, and its explicit Relationship to Broker, ready for Action to reference."
              depends_on: ["model-foundation", "broker-entity"]
              constraints: []
              acceptance: "The Asset Entity is declared with exactly the fields and rules the Target states for it, together with an explicit Relationship identifying the Broker that provides it."
              verify: "An instance of the Asset Entity can be constructed with its declared fields and its Reference to a Broker, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed an Asset instance referencing an existing Broker (broker_id) and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field and reference value.
        account-management:
          id: "account-management"
          title: "Account Management"
          description: "Covers the Domain Entities that organize a user's trading accounts into groups and define each funded trading account."
          area: "Account grouping and funded trading accounts"
          does: "The system can represent a user's account groups and the funded trading accounts placed inside them."
          constraints: []
          task_count: 2
          tasks:
            account-group-entity:
              id: "account-group-entity"
              source_id: "002"
              title: "Define the Account Group Domain Entity"
              description: "Declare the Account Group concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationship to the User that owns it."
              reason: "A user needs one authoritative way to organize their trading accounts into independent groups before an Account can belong to one."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Account Group concept, and its declared Relationship to User."]
              skills: ["sqlmodel"]
              expected_result: "The Account Group Domain Entity is declared with its complete fields, rules, and its explicit Relationship to User, ready for Account to reference."
              depends_on: ["model-foundation", "user-entity"]
              constraints: []
              acceptance: "The Account Group Entity is declared with exactly the fields and rules the Target states for it, together with an explicit Relationship identifying the User that owns it."
              verify: "An instance of the Account Group Entity can be constructed with its declared fields and its Reference to a User, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed an Account Group instance referencing an existing User (user_id) and round-tripped it through to_json()/from_json().
                  result: Reconstructed instance matched every field and reference value.
            account-entity:
              id: "account-entity"
              source_id: "002"
              title: "Define the Account Domain Entity"
              description: "Declare the Account concept as a Domain Entity, capturing its identity, every field, rule, and default the Target declares for it, and its explicit Relationships to the Account Group that contains it, the Broker that owns it, the Instance used to connect it, and the Currency used as its base currency."
              reason: "The system needs one authoritative representation of a funded trading account, distinguishing its own account-level credentials from the technical connection credentials owned by its Instance, before it can be used to execute trades and launch positions."
              inputs: ["The Target's declared identity, fields, field rules, and initial data for the Account concept, and its declared Relationships to Account Group, Broker, Instance, and Currency."]
              skills: ["sqlmodel"]
              expected_result: "The Account Domain Entity is declared with its complete fields, rules, and its explicit Relationships to Account Group, Broker, Instance, and Currency, ready for Action and Position to reference."
              depends_on: ["model-foundation", "account-group-entity", "broker-entity", "instance-entity", "currency-entity"]
              constraints: []
              acceptance: "The Account Entity is declared with exactly the fields and rules the Target states for it, together with explicit Relationships identifying the Account Group, Broker, Instance, and Currency it uses, without nesting any of those Entities inside it."
              verify: "An instance of the Account Entity can be constructed with its declared fields and its References to an Account Group, a Broker, an Instance, and a Currency, and converted to and reconstructed from its JSON-compatible representation without loss of any field or reference value."
              status: "done"
              log:
                - at: '2026-09-27T16:20:00Z'
                  event: Task completed by my-interface-develop (parent Log Entry 003).
                  check: Constructed an Account instance referencing an existing Account Group, Broker, Instance, and Currency, and round-tripped it through to_json()/from_json(); confirmed all four foreign keys resolved during SQLModel.metadata.create_all().
                  result: Reconstructed instance matched every field and reference value; password carries a recorded sensitivity marker.
        risk-rule-groups:
          id: "risk-rule-groups"
          title: "Risk Rule Groups"
          description: "Covers the Domain Entities that define the trailing stop-loss and take-profit rules and the partial-close rules a user can apply to a trade."
          area: "Trailing stop-loss and take-profit rules, and partial-close rules"
          does: "The system can represent a user's trailing rule groups and partial-close rule groups, together with the individual rules each group contains."
          constraints: []
