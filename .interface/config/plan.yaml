              "reason": "User is a Target-declared domain concept and needs its one authoritative Entity."
              "inputs":
              - "The Target definition of User"
              - "The shared Declaration and Foundation capabilities"
              "skills":
              - "sqlmodel"
              "expected_result": "User is a public, stand-alone Entity that carries its complete declared meaning and the shared JSON conversion."
              "depends_on":
              - "P1-G1-T1"
