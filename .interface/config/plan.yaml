              acceptance: Each declared and unexpected failure yields a failing response, unexpected failures carry the request identifier, and nothing internal or secret appears.
              verify: Provoking each declared failure and unexpected failures through a stand-in for Logic shows failing responses, request identifiers on the unexpected ones, and no exception text, persistence detail, or secret in any response.
              status: done
              log:
