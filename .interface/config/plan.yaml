        P3-G7:
          id: P3-G7
          title: Credential protection
          description: The at-rest treatment the Target requires for credential Fields of User, Instance, and Account.
          area: At-rest treatment of credential Fields inside Entity Service
          does: Credential Fields the Target names are stored hashed or encrypted as the Target requires and never disclosed.
          constraints: []
          task_count: 6
          tasks:
            P3-G7-T01:
              id: P3-G7-T01
              source_id: '010'
              title: Declare the credential protection configuration
              description: Declare in Logic's configuration contract each value the encrypted-storage treatment requires, supplied by the environment and validated before use, and never read from source or a built-in default.
              reason: Encrypted storage needs a protection value that Logic requires but does not own.
              inputs:
              - Configuration validation capability
              - Target credential storage requirements
              skills:
              - python-skills:python-guidelines
              expected_result: A declared and validated credential protection configuration.
              depends_on:
              - P3-G2-T02
              constraints: []
              acceptance: The contract names every value the treatment requires, the value is obtained only from Logic's configuration, and a missing or invalid value is refused by the validation capability with no secret disclosed.
              verify: Reading the contract lists each required value, and loading it with the value absent, invalid, and valid shows two refusals that disclose nothing followed by acceptance.
              status: done
              log:
              - at: '2026-09-29T22:20:53Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 011) before realizing credential protection.
              - at: '2026-09-29T22:21:46Z'
                transition: claimed -> done
                check: 'Transient script (check_g7): read the declared contract from Logic''s configuration, then validated the credential protection value with it absent, invalid (not a well-formed key), and valid.'
                outcome: The contract declares one required value (environment variable, purpose, and a key-format check); the absent and invalid cases were refused with an error naming the value and its variable without echoing the supplied text; the valid key was accepted. The value is read only from the environment, never from source or a default.
            P3-G7-T02:
              id: P3-G7-T02
              source_id: '010'
              title: Hash User credentials at rest
              description: When a User is added or updated through Entity Service, store User's password and API key as one-way hashes so their plaintext cannot be recovered from the stored value, as the Target requires.
              reason: The Target requires User credentials to use hash storage at rest.
              inputs:
              - Target credential rules for User
              - User Child Service
              - Add and Update Entity Actions
              skills:
              - python-skills:python-guidelines
              expected_result: User credentials that reach Storage only as hashes.
              depends_on:
              - P3-G6-T04
              - P3-G6-T02
              constraints: []
              acceptance: After adding a User with plaintext credentials the stored record holds, for each credential, a value that differs from the supplied plaintext and from which the plaintext cannot be recovered; updating a User whose credential Fields still hold the stored value leaves the stored credentials unchanged; updating with a new plaintext stores a newly hashed value; no plaintext is returned.
              verify: Adding a User and reading the raw stored record shows only non-plaintext credential values, updating the description alone leaves both stored values unchanged, and updating with a new plaintext changes the stored value to a different non-plaintext value.
              status: done
              log:
              - at: '2026-09-29T22:20:53Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 011) before realizing credential protection.
              - at: '2026-09-29T22:21:46Z'
