          task_count: 5
          tasks:
            P2-G9-T01:
              id: P2-G9-T01
              source_id: '004'
              title: Generate credentials securely
              description: 'Provide generation of a fresh, unpredictable value for each credential the Initial Data leaves to be generated: the User''s password and API key, each Instance''s password and API key, and each Account''s password.'
              reason: The Target requires these credentials to be generated securely rather than fixed.
              inputs:
              - The Initial Data definitions marking credentials as generated securely
              skills: []
              expected_result: A fresh, unpredictable credential value can be produced for each generated credential, and no two are equal.
              depends_on: []
              constraints: []
              acceptance: Repeated generation yields distinct values from a source suitable for secrets, of sufficient length for a credential.
              verify: Generate several credentials and see that all are distinct, non-empty, and of credential-grade length.
              status: done
              log:
              - at: '2026-09-28T00:06:00Z'
                status: claimed
                note: Claimed before writing credential generation.
              - at: '2026-09-28T00:06:10Z'
                status: done
                check: Ran a script (uv run python) that generated 10,000 credentials and checked distinctness, length, character set, and lack of shared prefixes, and confirmed the source is the operating system's secure random generator. Values were not printed.
                outcome: 'Passed: all 10,000 values distinct, at least 43 characters of URL-safe text (256 bits), no shared prefix pattern; generated from the secure source (secrets.token_urlsafe).'
            P2-G9-T02:
              id: P2-G9-T02
              source_id: '004'
              title: Store User credentials as one-way hashes
              description: Protect the User's password and API key so that only a one-way hash of each is stored, never the value itself.
              reason: The Target requires User credentials to use hash storage at rest.
              inputs:
              - The Target's storage requirement for User credentials
              - A generated credential
              skills: []
              expected_result: The stored form of each User credential is a hash from which the original cannot be recovered, and a supplied value can be checked against it.
              depends_on:
              - P2-G9-T01
              constraints: []
              acceptance: The stored value differs from the original, the same original does not produce a guessable result, and a matching original verifies while a different one does not.
              verify: Protect a generated credential, see that the stored form is not the original, verify the original against it successfully, and see a different value fail.
              status: done
              log:
              - at: '2026-09-28T00:06:10Z'
                status: claimed
                note: Claimed before writing hashing, encryption, and delivery of credentials.
              - at: '2026-09-28T00:06:40Z'
                status: done
                check: 'Ran a script (uv run python) with output, error, and log streams captured: hashed a generated credential and checked the stored form differs from the original and does not contain it, that hashing the same original twice differs (salted), that the original verifies, a different value and an altered value fail, and an unknown scheme fails. No credential was printed.'
                outcome: 'Passed: one-way salted scrypt hash; the original verifies and other values do not; nothing was written to output or logs.'
            P2-G9-T03:
              id: P2-G9-T03
              source_id: '004'
              title: Store connection and account credentials encrypted
              description: Protect each Instance's password and API key and each Account's password so that they are stored encrypted and can be decrypted by an authorized holder of the encryption key, with the key kept outside version control.
              reason: The Target requires these credentials to use encrypted storage at rest.
