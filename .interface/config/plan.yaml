                outcome: The stored password differs from the supplied plain value and is a scrypt hash text (no way back is published by Logic); the returned record carries the same stored form; an update with the password unchanged left the stored value identical, and an update with a new password replaced it with a different hash of the new value while the other credential stayed unchanged.
