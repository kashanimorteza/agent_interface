              - at: '2026-09-26T04:54:00+03:30'
                log_entry: '005'
                event: completed
                from_status: claimed
                to_status: done
                check: 'Transient script (private storage and key) took the protected credential Fields from the Model Declarations (User hashed, Instance and Account encrypted) and, through the Interface: added a sample of every Entity and read the raw stored values, which were the classified protected form, differed from and did not contain the supplied value, and verified as the right protection (hash check or decryption) for it; Edit, Get by ID, and List presented the stored forms; a record read through Edit, Get by ID, or List and stored back through Update left every stored credential value identical; updating a non-credential Field left credentials as stored; supplying a new plain credential replaced it with a newly protected one; nullable credentials stayed absent; and a dump of the whole database held none of the supplied plain credentials.'
                outcome: 'passed: 5 protected Fields on 3 Entities stored protected on every write, unchanged through read-then-store-back, no plain credential in storage'
                locations: my_database/src/my_database/engine/sqlite.py (add, update use Protection.protect), protection.py (Protection.protect)
