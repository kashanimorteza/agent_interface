            P4-G15-T09:
              id: P4-G15-T09
              source_id: '010'
              title: Verify the lifecycle signals
              description: Verify that the health signal reports liveness independent of readiness, that readiness is positive only when the API can serve requests, and that neither can be disabled.
              reason: Operators rely on these signals to manage the API.
              inputs:
              - Running API
              skills: []
              expected_result: Evidence that the lifecycle signals behave as declared.
              depends_on:
              - P4-G11-T01
              - P4-G11-T02
              - P4-G11-T03
              constraints: []
              acceptance: Health reports alive whenever the process runs, readiness follows the API's ability to serve, and neither signal can be removed.
              verify: Observing both signals while the API starts, while a dependency is unavailable, and once it is ready shows the declared behaviour, and trying to disable each shows it still present.
              status: done
              log:
              - at: '2026-09-29T17:31:59Z'
                transition: "todo -> claimed"
                note: "Claimed by my-interface-develop (log 012) before verifying the lifecycle signals."
              - at: '2026-09-29T17:32:32Z'
                transition: "claimed -> done"
                check: "Observed health and readiness together while the composed application had not finished starting, once started, while Logic's Entity Interface was unavailable, after Logic returned, and after shutdown (in process); then started the real process with attempts to switch each signal off (empty, off, false, none, disabled, root, reserved location, identical locations) and checked whether it served."
                outcome: "Health answered alive in all five states; readiness was 503 while starting, 200 once started, 503 while Logic was unavailable, 200 after recovery and 503 after shutdown. Every attempt to disable either signal was refused when the API started, naming the value and saying the signal cannot be disabled, so no accepted configuration yields a running API without both signals. The check covers the lifecycle as far as the developable API goes; the real Group routes are not yet part of the running API."
