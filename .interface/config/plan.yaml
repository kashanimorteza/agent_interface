                outcome: 'Passed. CreateTables then InsertInitialData run in order on the configured Instance only; a CreateTables failure stops before insertion and names the Instance and command. Real Component run: 15 tables aligned, no Initial Data declared, data file created in its db directory.'
            P2-G12-T11:
