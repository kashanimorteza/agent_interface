                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T16:37:36Z'
                by: '007'
                status: done
                event: completed
                note: 'The SQLite unit selects records by Filters under a FilterCombination: every comparison, membership,
                  text-matching, and null-test operator selects the records it names, several Filters combine with AND
                  or OR, and no Filters selects every record. Decimal Fields are compared by exact numeric value through
                  an order-preserving key (so 10 is greater than 9, negatives order correctly, 1.2 equals a stored 1.20);
                  datetime Fields are compared by instant (any offset); text matching is case-sensitive and treats %
                  and _ literally.'
                evidence: 'Compared with an independent reference evaluator in plain Python over the real data, every
                  case agreed: all operators on text, integer, float, boolean, decimal (9 probes x 6 operators on 9
                  values mixing signs and scales, plus IN across scales and nullable decimals), and datetime in three
                  offsets; AND, OR, the default combination, a single Filter, and no Filters. Invalid Fields and a text
                  combination were refused with the invalid input error.'
