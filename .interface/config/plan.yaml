# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 31
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules."
      constraints: []
      task_count: 31
      groups:

        P1-G1:
          id: "P1-G1"
          title: "Library structure"
          description: "The Model library as an independent, reusable Component with its four layers separated by responsibility. Every other Group builds inside it."
          area: "Model library packaging and layer separation"
          does: "Model exists as an independently obtainable library whose Interface, Entity, Declaration, and Foundation layers are separated, ready to receive the Entities."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "002"
              title: "Establish the Model library"
              description: "Bring the Model Component into existence as an independently obtainable library in which the Interface, Entity, Declaration, and Foundation layers are separated by responsibility. It depends on no other project Component."
              reason: "Database and Logic consume Model as a shared library, so it must exist on its own before any Entity or behaviour can be placed in it."
              inputs:
                - "Model's layer responsibilities"
                - "Model's technical selections and the Development shared defaults"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "An empty but complete Model library that a consumer can obtain and import, with the four layers present and separated."
              depends_on: []
              constraints: []
              acceptance: "The library can be obtained and imported in an environment containing no other project Component; its four layers are distinguishable by responsibility; it declares no dependency on another project Component."
              verify: "Observe that a clean environment holding no other project Component can obtain and import the library, and that the four layers are separately identifiable."
              status: "done"
              log:
                - at: "2026-09-25T20:52:07Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; no dependencies. Beginning by establishing the Model Component as its own library folder at the project root."
                - at: "2026-09-25T20:52:55Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Model Component established as its own uv library folder at the project root (folder model/, distribution trading-assistant-model, import package trading_assistant_model under src/), Python 3.14 (uv latest), sqlmodel 0.0.47 (pydantic 2.13.5, sqlalchemy 2.0.54), dev tools ruff 0.16.9 and pyright 1.1.414. No Interface source fixes a Component location; this choice follows the project-root Component folders already referenced by .gitignore. Four layer packages exist (interface, entity, declaration, foundation), each documented by its responsibility. Check (transient): built a wheel, created an empty venv outside the project, installed only that wheel, imported the package from site-packages, imported all four layers, read the distribution's requirements. Result: passed. Requires only sqlmodel; no other project Component installed or required."

        P1-G2:
          id: "P1-G2"
          title: "Declaration"
          description: "The private layer that records each Entity's technology-independent data meaning, without runtime behaviour."
          area: "Declaration layer"
          does: "Declaration can record every kind of Field-level and structure-level meaning the Target declares, in usable structured form and independent of any language, package, database, or Engine."
          constraints: []
          task_count: 2
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "002"
              title: "Record Field-level meaning in Declaration"
              description: "Let Declaration record, for each Field, its logical Type, presence and nullability, default, sensitivity, immutability, length, and any other declared restriction such as range, pattern, precision, or scale, as structured meaning that validation and storage realization can use."
              reason: "Validation and storage realization must apply the same Field restriction consistently, which prose alone cannot support."
              inputs:
                - "Model Principles for Declaration"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "Declaration can hold every Field-level property the Target declares and gives it back exactly as recorded, including an explicit null or false."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "Every recorded Field property is readable exactly as given, an omitted property is distinguishable from an explicit null, and Declaration performs no validation or other runtime behaviour itself."
              verify: "Record a representative Field carrying each kind of property, including an explicit null and an explicit false, and observe that each property is read back unchanged and that Declaration does nothing beyond holding it."
              status: "done"
              log:
                - at: "2026-09-25T20:53:21Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G1-T1 done. Building Declaration's Field-level vocabulary as pure data with no behaviour."
                - at: "2026-09-25T20:54:09Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Declaration layer provides FieldDeclaration with logical Type (FieldType StrEnum: integer, string, boolean, decimal, float, datetime) plus nullable, default, sensitive, immutable, length (maximum length), free-form restrictions mapping, and generation. Unstated properties hold an OMITTED marker, distinct from explicit None or False. All Declaration classes are frozen dataclasses with no methods. Check (transient script): recorded a Field with every property including default=None and sensitive=False and read each back unchanged; an unstated property reads OMITTED; explicit null/false are not OMITTED; every declaration class has zero user-defined methods and is frozen; mutation raises FrozenInstanceError. First run of the companion T2 check failed on a substring false positive (immu-table contained table); the check was corrected to whole-word matching and rerun. Result: passed. ruff format, ruff check, pyright clean."

            P1-G2-T2:
              id: "P1-G2-T2"
              source_id: "002"
              title: "Record structure-level meaning in Declaration"
              description: "Let Declaration record an Entity's Identity as its Primary Key, Uniqueness Constraints over one Field or a combination of Fields, Relationships expressed as References that name the target Entity and the identity referred to, Index intentions, and Value Generation by auto increment, generated identifier, or generated timestamp."
              reason: "Database derives keys, unique constraints, and foreign keys from this meaning, so it must be complete and independent of any physical storage choice."
              inputs:
                - "Model Principles for Declaration"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "Declaration can hold every structure-level property the Target declares and gives it back exactly as recorded, without choosing any physical storage detail."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "A recorded Identity, single-Field and combined-Field Uniqueness Constraint, Reference, Index intention, and Value Generation are each readable exactly as given; a Reference names both its target Entity and the identity it refers to; no table, column, or storage syntax appears."
              verify: "Record a representative Entity that uses each structure-level kind, including a combined-Field uniqueness and a Reference, and observe that each is read back unchanged and that no physical storage detail is introduced."
              status: "done"
              log:
                - at: "2026-09-25T20:53:21Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G1-T1 done. Building Declaration's structure-level vocabulary (identity, uniqueness, references, indexes, value generation) as pure data."
                - at: "2026-09-25T20:54:09Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Declaration records Identity (primary_key), UniqueConstraint over one or several Fields, Reference (fields, target entity, identity fields), Index intentions, and per-Field ValueGeneration (auto_increment, generated_identifier, generated_timestamp), all as frozen data. Check (transient script): recorded a representative Entity with a primary key, a single-Field and a combined-Field uniqueness, a Reference naming target Entity and identity, two Index intentions, and auto-increment and generated-timestamp generation; each read back unchanged; empty defaults for absent kinds; vocabulary field names contain no table, column, SQL, foreign, engine or delete words. Result: passed. ruff format, ruff check, pyright clean."

        P1-G3:
          id: "P1-G3"
          title: "Foundation"
          description: "The private layer that gives every Entity the same validation and JSON conversion behaviour, without contributing domain meaning."
          area: "Foundation layer"
          does: "Any Entity that records its meaning in Declaration gets validation at construction and in both JSON directions, safe handling of sensitive and immutable Fields, and no Field or rule it did not declare."
          constraints: []
          task_count: 7
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              source_id: "002"
              title: "Verify Entity data against Declaration on direct construction"
              description: "Let Foundation check the data of an Entity against that Entity's Declaration whenever the Entity is constructed directly, rejecting data that breaks a Field constraint or an Intrinsic Rule. Foundation adds no Field, constraint, or meaning of its own."
              reason: "Every instance that reaches a consuming Component must conform to its Entity, and one shared implementation keeps that consistent."
              inputs:
                - "Declaration's recorded Field-level meaning"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "A representative Entity constructed directly is accepted when its data conforms to its Declaration and rejected when it does not."
              depends_on:
                - "P1-G2-T1"
              constraints: []
              acceptance: "Conforming data constructs an instance; data violating any recorded Field constraint or Intrinsic Rule is rejected; the instance carries exactly the Fields its own Declaration lists."
              verify: "Construct a representative Entity with conforming data and with data violating each kind of recorded constraint, and observe acceptance and rejection respectively and the absence of any extra Field."
              status: "done"
              log:
                - at: "2026-09-25T20:56:38Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G2-T1 done. Probe of SQLModel 0.0.47 showed table models skip validation on direct construction, so Foundation will validate through model_validate and initialise from the checked values."
                - at: "2026-09-25T20:58:25Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Foundation base (SQLModel subclass, strict validation) checks every directly constructed Entity against its Declaration: SQLModel table models skip validation on init, so init runs model_validate under a re-entrancy guard, then applies the Declaration's declared restrictions (min, max, pattern, allowed_values, precision, scale), then initialises from the checked values. Class definition fails with TypeError when an Entity's fields, types, nullability or length disagree with its Declaration, or when a restriction cannot be enforced. Foundation itself carries no Field. Check (transient script, representative probe Entities): conforming data constructs with exactly the declared Fields; rejected: too-long string, wrong type, missing required Field, restriction min and max, bool for integer, string for integer, explicit null on a non-nullable Field, pattern, allowed values, precision, scale, float for exact decimal; inclusive bounds accepted; SQLite persist and reload of a table model works; five deliberately mismatched classes (type, nullability, extra field, length, unknown restriction) are refused at definition. Two test defects were corrected during the run (a precision example of exactly 5 digits was in fact valid); no code change was needed for them. Result: passed. ruff format, ruff check, pyright clean."
                - at: "2026-09-25T20:58:35Z"
                  transition: "done -> done"
                  by: "003"
                  entry: "Correction to the completion entry above: exactly one test defect occurred (the precision example of exactly 5 digits was valid), not two. No Foundation code changed because of it."

            P1-G3-T2:
              id: "P1-G3-T2"
              source_id: "002"
              title: "Apply declared defaults and distinguish omission from explicit null"
              description: "When an input omits a Field, let construction apply that Field's declared default; when an input supplies an explicit null, keep it as null and validate it as such."
              reason: "The Target declares defaults and nullability, and treating an omitted value as an explicit null would change the domain meaning."
              inputs:
                - "Declaration's recorded defaults and nullability"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "Omitted and explicitly null values behave differently and correctly for every Field of a representative Entity."
              depends_on:
                - "P1-G3-T1"
              constraints: []
              acceptance: "An omitted Field takes its declared default; an explicit null is retained where the Field is nullable and rejected where it is not; the two inputs never produce the same result unless the declaration makes them identical."
              verify: "Construct a representative Entity with a Field omitted, with the same Field explicitly null, and with a non-nullable Field explicitly null, and observe the default applied, the null retained, and the null rejected."
              status: "done"
              log:
                - at: "2026-09-25T20:58:57Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G3-T1 done. Adding a class-definition check that declared defaults match the Entity's defaults, and confirming omission versus explicit null behave differently."
                - at: "2026-09-25T21:00:06Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Declared defaults are applied when a Field is omitted (SQLModel validation), an explicit null is kept on nullable Fields and rejected on non-nullable ones, and a Field with declared value generation may stay null until generated. Foundation now also refuses, at class definition, any Entity whose Field default differs from its Declaration (value, type, required versus defaulted, or null default). Check (transient script, probe Entity with integer, string, boolean, exact decimal, float and date-time Fields): omitted Fields took int 2, string x, None, True, Decimal 0 (a Decimal, not int) and 0.0 and were absent from model_fields_set; explicit None on a nullable Field with a non-null default stayed None while omission gave x, and was present in model_fields_set; explicit None rejected for name, qty, active, amount and ratio; pending id accepted; five deliberately mismatched defaults were refused at definition. Result: passed. ruff format, ruff check, pyright clean."

            P1-G3-T3:
              id: "P1-G3-T3"
              source_id: "002"
              title: "Ignore unknown input Fields"
              description: "Let construction ignore any supplied input Field that the Entity's Declaration does not list, rather than failing or adding it."
              reason: "Consumers may pass wider data, and Model must preserve exactly the Entity's declared Fields."
              inputs:
                - "Declaration's recorded Field list"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "Input carrying undeclared Fields produces an instance with only the declared Fields."
              depends_on:
                - "P1-G3-T1"
              constraints: []
              acceptance: "An undeclared input Field neither causes rejection nor appears on the resulting instance or in its JSON."
              verify: "Construct a representative Entity from input that includes an undeclared Field, and observe that construction succeeds and that the Field is absent from the instance and its JSON."
              status: "done"
              log:
                - at: "2026-09-25T20:58:58Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G3-T1 done. Making unknown-input handling explicit; its completion check needs JSON conversion (P1-G3-T5), so it will be completed after that Task."
                - at: "2026-09-25T21:00:06Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Unknown-input handling is now explicit in Foundation's configuration (extra ignored). Check (transient script, probe Entity): construction with undeclared inputs zzz, other, declaration and model_config succeeded; the instance has no such attribute; they are absent from model_dump and from the JSON produced by conversion (P1-G3-T5, in progress, was used only to observe that output), whose keys are exactly the declared Fields; the class-level declaration was unchanged; unknown input alongside a too-long value or a missing required Field is still rejected. Result: passed."

            P1-G3-T4:
              id: "P1-G3-T4"
              source_id: "002"
              title: "Create an Entity instance from JSON"
              description: "Provide once, through Foundation, the creation of a validated Entity instance from JSON, applying the same checks, defaults, null handling, and unknown-Field handling as direct construction."
              reason: "Consumers receive Entity data as JSON and need it validated on entry without reimplementing that behaviour."
              inputs:
                - "Foundation's construction validation, default handling, and unknown-Field handling"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "A representative Entity can be created from JSON when the JSON conforms and is refused when it does not."
              depends_on:
                - "P1-G3-T1"
                - "P1-G3-T2"
                - "P1-G3-T3"
              constraints: []
              acceptance: "Conforming JSON yields an instance equal to direct construction from the same data; nonconforming JSON is rejected; the outcome is identical to direct construction for omitted, null, and unknown inputs."
              verify: "Create a representative Entity from conforming and nonconforming JSON, including omitted, explicitly null, and undeclared Fields, and compare each outcome with direct construction from the same data."
              status: "done"
              log:
                - at: "2026-09-25T21:00:22Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependencies P1-G3-T1, T2 and T3 done. Adding creation from JSON text or a parsed JSON object that decodes JSON's string forms of exact decimals and date-times and then follows the same construction route as direct construction."
                - at: "2026-09-25T21:01:25Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Foundation.from_json accepts JSON text, bytes or an already parsed JSON object. It reads JSON's string forms of exact decimals (and integers as decimals), ISO date-times and integers for float Fields, then constructs through the same route as direct construction, so all checks, defaults, null handling and unknown-input handling are shared. Structurally invalid JSON or a non-object raises ValueError (raised outside the except block so no input text is chained); nonconforming data raises the validation error. Check (transient script, probe Entity): a full JSON object built the same values and set of supplied Fields as direct construction for text, bytes and parsed-object input, and == held for the two instances; omitted, explicit-null, unknown, null-on-non-nullable, missing and null-name inputs each produced the identical outcome via JSON and via direct construction; 14 nonconforming payloads rejected (too long, wrong types, float for exact decimal, malformed decimal, boolean for decimal, naive and malformed date-time, string for boolean and float, empty object); integers accepted for decimal and float Fields; eight structurally invalid inputs raised ValueError; conversion to JSON and back reproduced equal values and identical JSON. Result: passed. ruff format, ruff check, pyright clean."

            P1-G3-T5:
              id: "P1-G3-T5"
              source_id: "002"
              title: "Convert an Entity instance to JSON"
              description: "Provide once, through Foundation, the conversion of an Entity instance to JSON, verifying the instance against its Declaration as it is converted."
              reason: "Data leaving Model toward a consumer must also conform to the Entity."
              inputs:
                - "Foundation's construction validation"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "A valid instance converts to JSON that carries exactly its declared Fields, and an instance that no longer conforms is refused."
              depends_on:
                - "P1-G3-T1"
              constraints: []
              acceptance: "Conversion of a conforming instance yields JSON containing only declared Fields; converting that JSON back yields an equal instance; an instance that violates its Declaration is not converted."
              verify: "Convert a representative instance to JSON and back and observe equality, and observe that an instance made nonconforming after construction is refused."
              status: "done"
              log:
                - at: "2026-09-25T20:58:57Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependency P1-G3-T1 done. Adding conversion to JSON that re-verifies the instance against its Declaration first."
                - at: "2026-09-25T21:01:25Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Foundation.to_json re-verifies the instance against its Declaration, then writes JSON text holding every declared Field, with exact decimals and date-times as strings (UTC written with a Z suffix). Sensitive values are included so a round trip is possible; whether to expose them is a consumer decision. Check (transient script): JSON keys equal the declared Fields in order, amount is the string 1.50, pending id is null; conversion to JSON and back through from_json (P1-G3-T4) rebuilt equal values and identical JSON, including for an instance with all-default Fields; instances damaged after construction by bypassing every check (too-long string, wrong type, null on a non-nullable Field, string for integer, float for exact decimal) were each refused, while an undamaged instance converted. Result: passed. ruff format, ruff check, pyright clean."

            P1-G3-T6:
              id: "P1-G3-T6"
              source_id: "002"
              title: "Keep sensitive values out of validation diagnostics"
              description: "Let Foundation apply the sensitivity that Declaration records, so that a supplied value of a sensitive Field never appears in any validation failure message or detail."
              reason: "Credentials must not leak through error output during normal model handling."
              inputs:
                - "Declaration's recorded sensitivity"
                - "Foundation's construction validation and JSON creation"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "Failed validation involving a sensitive Field reports the failure without reproducing the supplied value."
              depends_on:
                - "P1-G2-T1"
                - "P1-G3-T1"
                - "P1-G3-T4"
              constraints: []
              acceptance: "For both direct construction and creation from JSON, the diagnostic for a rejected sensitive Field contains no part of the supplied value, while diagnostics for non-sensitive Fields still show theirs."
              verify: "Supply an invalid value to a sensitive Field and to a non-sensitive Field of a representative Entity by each route, and observe that only the non-sensitive value appears in its diagnostic."
              status: "done"
              log:
                - at: "2026-09-25T21:02:01Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependencies P1-G2-T1, P1-G3-T1 and P1-G3-T4 done. Adding redaction of sensitive input values in every validation failure raised by direct construction, JSON creation, assignment and JSON conversion."
                - at: "2026-09-25T21:03:29Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Every validation failure Foundation raises is rebuilt so that the input value of a sensitive Field is replaced by [hidden] (also inside the whole-input mapping shown by a missing-Field error, and in declared-restriction failures); non-sensitive values are shown unchanged. The failure is raised after the handler has exited, so no original exception is chained. Applies to direct construction, JSON creation, assignment and conversion to JSON. Check (transient script, probe Entity with sensitive string, integer, pattern-restricted and immutable Fields; marker strings searched in str, repr, errors(), json(), the formatted traceback and __cause__/__context__): 14 scenarios plus a damaged instance, none leaked; the failure still names the Field and rule; a non-sensitive too-long value appears in its diagnostic by both routes, and in a mixed failure it appears while the sensitive value does not. One test defect corrected during the run: the traceback printed the test's own call-site source containing a literal marker, so the marker is now built at run time; no library change resulted. Not covered by this Task: sensitive values still appear in an instance's repr and in JSON conversion output, which are not validation diagnostics. Result: passed. All earlier Foundation and Declaration checks re-run after this change and passed. ruff format, ruff check, pyright clean."

            P1-G3-T7:
              id: "P1-G3-T7"
              source_id: "002"
              title: "Prevent changes to immutable Fields"
              description: "Let Foundation apply the immutability that Declaration records, so that a Field declared immutable cannot be changed after the instance is constructed."
              reason: "Immutable domain facts must stay stable once an instance exists."
              inputs:
                - "Declaration's recorded immutability"
              skills:
                - "sqlmodel"
                - "pydantic:pydantic"
                - "python-skills:python-guidelines"
              expected_result: "A Field recorded as immutable rejects any later change while mutable Fields remain changeable."
              depends_on:
                - "P1-G2-T1"
                - "P1-G3-T1"
              constraints: []
              acceptance: "A change to an immutable Field after construction is refused and leaves the value unchanged; a change to a mutable Field is allowed and still validated."
              verify: "Change an immutable and a mutable Field of a representative constructed instance and observe refusal with the value unchanged for the first and a validated change for the second."
              status: "done"
              log:
                - at: "2026-09-25T21:02:01Z"
                  transition: "todo -> claimed"
                  by: "003"
                  entry: "Claimed; dependencies P1-G2-T1 and P1-G3-T1 done. Adding refusal of any change to a Field declared immutable once the instance is constructed, and validated assignment for mutable Fields."
                - at: "2026-09-25T21:03:29Z"
                  transition: "claimed -> done"
                  by: "003"
                  entry: "Foundation refuses any assignment to a Field whose Declaration marks it immutable, with a frozen_field validation failure that leaves the value unchanged (also when the Field was left unset at construction), and validates every assignment to a mutable Field against the same rules as construction, including declared restrictions, before applying it. Construction, JSON creation and SQLAlchemy loading are unaffected. Check (transient script, probe Entities): immutable Field refused three times (new value, null, same value) with type frozen_field at the Field, value unchanged; unset immutable Field could not be set later; mutable name changed to xyz; invalid changes (too long, null, string for integer, bool for integer) refused with value unchanged; restriction min refused on assignment; immutable Field still set by construction and by JSON creation; SQLite persist and reload assigned the database id without error, a loaded instance refused an immutable change and accepted a mutable one. Result: passed. All earlier checks re-run and passed. ruff format, ruff check, pyright clean."

        P1-G4:
          id: "P1-G4"
          title: "Identity and platform Entities"
          description: "The Entities that identify who uses the system and which trading platforms and connection instances it reaches."
          area: "User, Trading Platform, and Instance Entities"
          does: "The User, Trading Platform, and Instance Entities exist exactly as the Target declares them, with their relationships."
          constraints: []
          task_count: 3
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              source_id: "002"
              title: "Provide the User Entity"
              description: "Provide the User Domain Entity, the independent user of the system, exactly as the Target declares it."
              reason: "User is the owner that most other Entities refer to, so it is the first Entity the rest depend on."
              inputs:
                - "The Target's User definition"
                - "Declaration and Foundation behaviour"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "A User Entity with exactly the declared Fields, types, nullability, defaults, identity, and uniqueness, with its credential Fields classified sensitive."
              depends_on:
                - "P1-G2-T2"
                - "P1-G3-T4"
                - "P1-G3-T5"
                - "P1-G3-T6"
              constraints: []
              acceptance: "The declared meaning of User matches the Target's User definition Field for Field, including the uniqueness of name and username and the sensitivity of password and api_key, with nothing added; valid data constructs and round-trips through JSON, and violating data is rejected."
              verify: "Compare the declared meaning of the User Entity with the Target's User definition, then observe construction and JSON round-trip with valid data and rejection with data violating a declared rule."
              status: "done"
              log:
                - at: "2026-09-25T21:06:33Z"
