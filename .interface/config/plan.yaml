          does: No response, failure, or contract of the API carries a credential value in any form, while credentials can still be supplied on input for Logic to protect.
          constraints: []
          task_count: 5
          tasks:
            P4-G7-T01:
              id: P4-G7-T01
              source_id: '010'
              title: Carry supplied credentials to Logic without applying protection
              description: Carry every credential Field a caller supplies on User, Instance, and Account records to Logic exactly as supplied, so that Logic alone applies the at-rest protection. API hashes, encrypts, stores, or alters nothing itself.
              reason: The at-rest treatment of credentials is Logic's Behaviour, and applying it again or differently at the boundary would give one credential two owners.
              inputs:
              - Request shapes
              - Credential Fields the Target designates
              skills:
              - python-skills:python-guidelines
              expected_result: Supplied credential values reach Logic unchanged and are handled by API in no other way.
              depends_on:
              - P4-G6-T01
              - P4-G6-T03
              - P4-G6-T08
              - P4-G5-T04
              constraints: []
              acceptance: The credential value that reaches Logic equals the value the caller supplied, and API applies no protection, transformation, or storage to it.
              verify: Supplying credential values on a User, an Instance, and an Account against a recording stand-in for Logic shows the identical values arriving, and inspecting the API's own handling shows no protection, storage, or transformation applied.
              status: done
              log:
              - at: "2026-09-29T18:12:30Z"
                transition: "todo -> claimed"
                note: "Claimed by my-interface-develop (log 013) before verifying that supplied credentials are carried to Logic unchanged; the pass-through is a property of the Router and Adapter built earlier in this log, so no further code change is expected."
