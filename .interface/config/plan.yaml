# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 22
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules.
      constraints: []
      task_count: 22
      groups:
        P1-G1:
          id: P1-G1
          title: Shared Model mechanisms
          description: The mechanisms every Domain Definition relies on, independent of any domain meaning. Later Groups build the domain concepts on them.
          area: Model Foundation, Declaration Vocabulary, and failure reporting
          does: Every Domain Definition can rely on shared validation, metadata, conversion, declaration, and failure-reporting mechanisms that carry no domain Fields or relationships.
          constraints: []
          task_count: 4
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the Model Foundation
              description: Provide the single common foundation through which every concrete Domain Definition receives shared validation and metadata mechanisms. The foundation owns no Field and no relationship; each Domain Definition supplies its own complete set.
              reason: All Domain Definitions need one shared source of mechanisms so behaviour stays consistent while domain meaning stays in the definitions.
              inputs:
              - Model Principles for the Model Foundation
              - Development's technical selections for Model
              skills: []
              expected_result: A foundation on which any Domain Definition can be built to obtain the shared mechanisms without acquiring a Field or relationship from it.
              depends_on: []
              constraints: []
              acceptance: A representative definition built on the foundation exposes the shared validation and metadata mechanisms and has exactly the Fields it declares itself.
              verify: Observe that a representative definition carries no Field or relationship inherited from the foundation and that the shared validation and metadata mechanisms are available on it.
              status: done
              log:
              - at: '2026-09-24T12:39:43Z'
                transition: todo -> claimed
                by: '004'
                entry: Claimed before scaffolding the Model Component.
              - at: '2026-09-24T12:40:21Z'
                transition: claimed -> done
                by: '004'
                entry: 'Foundation base built in the model component''s foundation module; strict/forbid/validate-assignment config plus shared exact-decimal, finite-float, UTC-datetime validated types. Transient check (uv run python probe): foundation has zero model_fields; probe definition has only its own 4 Fields; whitespace stripped; aware datetime normalised to UTC; NaN/inf decimal and float, int-for-decimal, naive datetime, unknown field, wrong type, and invalid assignment all rejected. Passed. The metadata (declaration) mechanism attaches to this foundation in P1-G1-T3, which depends on this Task.'
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '003'
              title: Provide conversion to and from Plain Representation
              description: Provide once, through the Model Foundation, the two symmetric conversions between a Domain Definition and its Plain Representation as the Model Principles define them, so no definition implements its own.
              reason: Consumers need validated, wire-format-neutral conversion without duplicating domain meaning.
              inputs:
              - Model Principles for Plain Representation and Serialization
              - The Model Foundation
              skills: []
              expected_result: Every definition built on the foundation can produce its Plain Representation and build a validated instance from one.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Converting an instance out and back in yields an equal instance; converting in a Plain Representation that breaks an Intrinsic Rule fails; both directions are deterministic and perform no external I/O.
              verify: Observe round-trip equality for a representative definition, observe failure for an invalid Plain Representation and for a non-finite number, and observe that a related definition appears only as its declared reference value.
              status: done
              log:
              - at: '2026-09-24T12:40:22Z'
                transition: todo -> claimed
                by: '004'
                entry: Claimed; dependency P1-G1-T1 done.
              - at: '2026-09-24T12:41:25Z'
                transition: claimed -> done
                by: '004'
                entry: 'serialize/deserialize added once on the foundation. Transient check (uv run python probe): output is JSON-encodable with no custom encoder (decimal as string, date-time as UTC ISO string); round-trip equality incl. through a JSON encode/decode; repeat conversion identical. Conversion in rejected: string-for-int, string-for-bool, string-for-float, float-for-decimal, NaN, underscore and non-numeric decimal strings, naive and malformed date-time, non-finite float, missing Field, unknown Field, and non-mapping input (int, None, list). Construction rejects the plain string forms. Passed.'
            P1-G1-T3:
              id: P1-G1-T3
              source_id: '003'
              title: Provide the Declaration Vocabulary for Domain Definitions
              description: Provide the means for each Domain Definition to state its Fields, properties, relationships, and constraints in the one technology-independent Declaration Vocabulary, and for consumers to read that declaration through the definition itself.
              reason: Database and Logic must read domain meaning from the definition, not from a separate artifact.
              inputs:
              - The Model Declaration Schema
              - Model Principles for the Declaration Vocabulary
              - The Model Foundation
              skills: []
              expected_result: A definition can state type, length, precision, nullability, default, identity, uniqueness, constraints, relationships, and persistence, and the statement is readable from the definition.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: The declaration a definition publishes reproduces each declared property exactly, invents no absence state, default, or generation mechanism, and is readable without a separate artifact.
              verify: Observe the declaration published by a representative definition against the properties it was given, including an explicit null and an explicit false, and observe that no separate schema artifact is needed to read it.
              status: done
              log:
              - at: '2026-09-24T12:41:25Z'
                transition: todo -> claimed
                by: '004'
                entry: Claimed; dependency P1-G1-T1 done.
              - at: '2026-09-24T12:42:46Z'
                transition: claimed -> done
                by: '004'
                entry: 'Declaration Vocabulary added to the foundation: Declare (per-Field meaning in Annotated metadata), FieldDeclaration, Relationship (carries the referenced definition class, cardinality, optionality), Constraint, Rule, Sensitivity, Declaration; class keywords description/persistent/kind/relationships/intrinsic_rules/composite_constraints; definition.declaration readable from the definition. Nullability, required, and default are read from the Pydantic Field so they cannot drift. Transient check (scratchpad check_t3.py): complete ordered Fields; explicit null/false defaults and nullable-without-default preserved; generated+identity, uniqueness, length, credential sensitivity published; nothing invented for unstated properties; relationship carries the definition object; composite constraint published; persistence must be declared; name-only reference, bad cardinality, undeclared Field, duplicate constraint ids, and unenforced length all fail at class creation. ruff and pyright clean. Passed.'
            P1-G1-T4:
              id: P1-G1-T4
              source_id: '003'
              title: Report validation and conversion failures consistently
              description: Ensure that every failure raised by Model validation and conversion is reported to the consumer through the applicable error-handling capability in one consistent, understandable form.
              reason: Error handling applies to Model, and consumers need failures they can tell apart and act on.
              inputs:
              - The Development applicability of the error-handling capability to Model
              - The Model Foundation and conversion behaviour
              skills: []
              expected_result: Validation and conversion failures surface uniformly across all definitions.
              depends_on:
              - P1-G1-T2
              constraints: []
              acceptance: A validation failure and a conversion failure each identify what was rejected and why, in the same form for every definition.
              verify: Observe the reported failure for an invalid Field value on construction, an invalid assignment, and an invalid Plain Representation, and observe that the form is the same for each.
              status: done
              log:
              - at: '2026-09-24T12:42:46Z'
                transition: todo -> claimed
                by: '004'
                entry: Claimed; dependency P1-G1-T2 done.
              - at: '2026-09-24T12:43:10Z'
                transition: claimed -> done
                by: '004'
                entry: 'No new code: Pydantic ValidationError is the one failure form. The error-handling capability has no definition beyond its applicability to Model in the Development Preferences, so this consistent form was chosen and is recorded here. Transient check: invalid construction, invalid assignment, invalid conversion in (missing Fields, malformed decimal, non-mapping input) across two different definitions all raise the same ValidationError type; every reported error carries a location, a message, and a type. Passed.'
