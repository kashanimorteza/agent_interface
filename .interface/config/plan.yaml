# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  # Total number of Tasks across all phase Plans; recalculate whenever Tasks are added or removed.
  task_count: 34
  # Phase Plans keyed by phase identifier; empty before any phase is planned.
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Deliver the independent Model library that publishes every Target Entity with its complete public meaning through one conformant public Interface, together with complete documentation."
      constraints: []
      task_count: 34
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Library establishment"
          description: "The Model library as a delivered unit that later work fills."
          area: "The Model library as an installable, importable unit"
          does: "An empty Model library that installs into a fresh isolated environment and imports cleanly."
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "003"
              title: "Establish the installable Model library"
              description: "Create the Model library as a unit a consumer can install and import, holding no Entity yet, using the shared language standards and quality defaults Development supplies to it."
              reason: "Every later result needs a delivered library to live in and to be imported by its consumers."
              inputs:
                - "Development's shared defaults"
                - "Model's selected realization choices"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "A Model library that installs into a fresh isolated environment and can be imported by a consumer."
              depends_on: []
              constraints: []
              acceptance: "Installation succeeds without error and importing the library succeeds."
              verify: "Install the library into a clean isolated environment, import it from a separate consumer context, and observe that both succeed and that nothing from another Component is required."
              status: "done"
              log:
                - at: "2026-09-30T16:13:44Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before establishing the library."
                - at: "2026-09-30T16:15:52Z"
                  transition: "claimed -> done"
                  check: "Built the library wheel, created a fresh isolated environment, installed only the wheel with its declared dependencies, and imported the library from a separate working directory."
                  outcome: "Installation and import both succeeded (Python 3.14.7). The environment held only the library, pydantic, sqlmodel, and their transitive dependencies; no other Component was required. Location of the library: model/ with src layout; dependency records pyproject.toml and uv.lock."

        P1-G2:
          id: "P1-G2"
          title: "Shared Core contracts"
          description: "The public Declaration contract, the strict Field value contract, and the Foundation JSON conversion that every Entity relies on."
          area: "Shared Declaration, value-contract enforcement, and Foundation conversion"
          does: "Every Entity can rely on one Declaration contract, one strict value contract, and one lossless JSON conversion."
          constraints: []
          task_count: 5
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "003"
              title: "Provide the public Declaration contract"
              description: "Provide the immutable structured records that publish an Entity's and a Field's complete logical meaning, holding no runtime behaviour."
              reason: "Every other Component reads Entity meaning only through one canonical logical shape."
              inputs:
                - "The Model Definition's canonical Declaration members"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "A public Declaration contract for an Entity and for a Field that exposes every canonical logical member."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "An Entity Declaration exposes its name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes; a Field Declaration exposes its name, description, Type, nullability, explicit Default Value presence and value, sensitivity, immutability, constraints, and Value Generation."
              verify: "Build one representative Entity Declaration for the check alone and read every acceptance member back through its public surface; observe that each is present, that Field and metadata order is preserved, that an absent Default Value is distinguishable from an explicit null default, and that reading it performs no behaviour."
              status: "done"
              log:
                - at: "2026-09-30T16:15:52Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before generating the shared Core contracts."
                - at: "2026-09-30T16:18:08Z"
                  transition: "claimed -> done"
                  check: "Ran a transient probe Entity check (session scratchpad, not persisted; testing capability is disabled) against the generated Core (model/src/model/core). Built one representative Declaration and read back every Entity and Field member, order, absent-versus-null default, sensitivity, constraints; attempted mutation of a Declaration and its constraints."
                  outcome: "Passed. All members present in order; absent default distinguishable from explicit null default; Declaration is frozen and constraints are read-only."
            P1-G2-T2:
              id: "P1-G2-T2"
              source_id: "003"
              title: "Provide strict Field value-contract enforcement"
              description: "Provide the shared behaviour every Entity applies identically to direct construction, construction from a JSON Object, and assignment to a mutable Field: only declared Fields are accepted, required values, nullability, Types, defaults, and constraints are enforced without implicit coercion, explicit false, zero, empty string, and null stay supplied values, a failed assignment leaves the earlier value in place, and an immutable Field never changes."
              reason: "One enforcement behaviour prevents each Entity and each construction path from interpreting values differently."
              inputs:
                - "The completed Declaration contract"
              skills:
                - "pydantic:pydantic"
                - "sqlmodel"
              expected_result: "A shared enforcement behaviour every Entity can apply on all three entry paths."
              depends_on:
                - "P1-G2-T1"
              constraints: []
              acceptance: "A representative Entity built for the check accepts valid values and rejects an undeclared Field, a wrong Type, a missing required value, and a change to an immutable Field; a rejected assignment preserves the earlier value."
              verify: "Exercise the representative Entity through direct construction, construction from a JSON Object, and assignment; observe identical accept and reject outcomes on all three paths, that false, zero, empty string, and null are kept as supplied, and that no rejection message reveals a sensitive value."
              status: "done"
              log:
                - at: "2026-09-30T16:15:52Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before generating the shared Core contracts."
                - at: "2026-09-30T16:18:08Z"
                  transition: "claimed -> done"
                  check: "Ran a transient probe Entity check (session scratchpad, not persisted; testing capability is disabled) against the generated Core (model/src/model/core). Exercised the probe through direct construction, JSON construction, and assignment; included undeclared Field, wrong Type, boolean given an integer, missing required value, naive datetime, null on a non-nullable Field, immutable change, and sensitive values placed in invalid input."
                  outcome: "Passed. Identical accept and reject outcomes on all three paths; rejected assignment kept the earlier value; false, zero, empty string, and null kept as supplied; no diagnostic contained the sensitive value."
            P1-G2-T3:
              id: "P1-G2-T3"
              source_id: "003"
              title: "Support the pending state of an Auto Increment Field"
              description: "Let an Entity whose identity is produced by its owning persistence realization exist before that value is assigned: an omitted Auto Increment Field stays explicitly pending while remaining non-nullable, and a caller-supplied value is rejected unless the Target explicitly permits one."
              reason: "Target Entities take their identity from elsewhere, so they must be constructible before it exists."
              inputs:
                - "The completed value-contract enforcement"
              skills:
                - "pydantic:pydantic"
              expected_result: "An Entity with an omitted Auto Increment Field can be created in an explicit pending state."
              depends_on:
                - "P1-G2-T2"
              constraints: []
              acceptance: "The pending Field is reported as pending, its Declaration still states it non-nullable, and a supplied value is rejected."
              verify: "Construct the representative Entity without the Field and observe the pending state and the unchanged non-nullable Declaration; construct it with a supplied value and observe rejection; observe that its JSON Object shows the pending state as null."
              status: "done"
              log:
                - at: "2026-09-30T16:15:52Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before generating the shared Core contracts."
                - at: "2026-09-30T16:18:08Z"
                  transition: "claimed -> done"
                  check: "Ran a transient probe Entity check (session scratchpad, not persisted; testing capability is disabled) against the generated Core (model/src/model/core). Constructed the probe without and with an Auto Increment value, and through JSON with null and with a value."
                  outcome: "Passed. Omitted identity is pending (None) while its Declaration stays non-nullable; a supplied value is rejected on direct and JSON construction; pending appears as JSON null and round-trips."
            P1-G2-T4:
              id: "P1-G2-T4"
              source_id: "003"
              title: "Convert an Entity to JSON text"
              description: "Provide the shared conversion that turns any Entity into JSON text with one object at its root whose keys are exactly the Entity's Fields in Declaration order, preserving Type semantics and distinguishing null, false, zero, and empty string, without adding keys, nesting Entities, or transforming a sensitive value."
              reason: "Consumers need one portable, lossless representation of an Entity."
              inputs:
                - "The completed Declaration contract"
                - "The pending-state behaviour"
              skills:
                - "pydantic:pydantic"
              expected_result: "Any Entity can be converted to conformant JSON text."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T3"
              constraints: []
              acceptance: "The text is valid JSON whose root is one object with exactly the Entity's Field names in Declaration order, with decimal and datetime values represented exactly as their Types define."
              verify: "Convert the representative Entity holding decimal, datetime, boolean, null, zero, and empty-string values, read the text with an independent JSON reader, and observe the key set and order, the exact values, and an unchanged sensitive value."
              status: "done"
              log:
                - at: "2026-09-30T16:15:52Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before generating the shared Core contracts."
                - at: "2026-09-30T16:18:08Z"
                  transition: "claimed -> done"
                  check: "Ran a transient probe Entity check (session scratchpad, not persisted; testing capability is disabled) against the generated Core (model/src/model/core). Converted a probe holding exact decimal, datetime with offset, boolean false, null, zero, empty string, float, and a sensitive value; parsed the text with a separate JSON reader."
                  outcome: "Passed. Valid JSON; keys exactly the Field names in Declaration order; decimal held as exact string 1.10; datetime as ISO 8601 UTC with offset; null, false, zero, and empty string distinct; sensitive value unchanged; no nesting."
            P1-G2-T5:
              id: "P1-G2-T5"
              source_id: "003"
              title: "Reconstruct an Entity from JSON text"
              description: "Provide the shared conversion that rebuilds an Entity from JSON text without loss, rejects malformed text, and otherwise applies the same strict value contract as direct construction."
              reason: "A one-way conversion cannot serve as a portable contract; consumers must be able to return to the Entity."
              inputs:
                - "The completed value-contract enforcement"
                - "The Entity-to-JSON conversion"
              skills:
                - "pydantic:pydantic"
              expected_result: "Any Entity's JSON text can be turned back into an Entity."
              depends_on:
                - "P1-G2-T2"
                - "P1-G2-T4"
              constraints: []
              acceptance: "Text produced from an Entity reconstructs an Entity whose every Field value matches the original; malformed text and text carrying an undeclared key or an invalid value are rejected."
              verify: "Reconstruct the representative Entity from its own text and compare every Field value, including exact decimal and datetime values and the pending state; supply malformed text and text with an undeclared key and observe rejection."
              status: "done"
              log:
                - at: "2026-09-30T16:15:52Z"
                  transition: "todo -> claimed"
                  note: "Claimed by execution 004 before generating the shared Core contracts."
                - at: "2026-09-30T16:18:08Z"
                  transition: "claimed -> done"
                  check: "Ran a transient probe Entity check (session scratchpad, not persisted; testing capability is disabled) against the generated Core (model/src/model/core). Reconstructed the probe from its own text and compared every Field value and Type; supplied malformed text, non-object roots, NaN, undeclared key, invalid decimal, decimal as a JSON number, naive datetime, and a non-string datetime."
                  outcome: "Passed. Every Field value matched including exact decimal digits, UTC datetime, and pending id; every invalid input was rejected."

        P1-G3:
