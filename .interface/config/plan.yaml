                outcome: Passed. No change under model/ (git clean, identical to HEAD, no file newer than the phase start); Database imports only the top-level public package of Model (one import, in the unit that reads Entities and Declarations); no Database source names or writes a Model path.
            P2-G12-T13:
              id: P2-G12-T13
              source_id: '007'
              title: Verify no credential is exposed
              description: Verify that no error, result, public value, or documentation exposes a credential or a secret.
              reason: Exposed credentials would defeat the purpose of keeping connection values out of consumers' reach.
              inputs:
              - Every public failure and result
              - The documentation
              skills: []
              expected_result: Evidence that nothing leaks a credential.
              depends_on:
              - P2-G10-T4
              - P2-G11-T4
              constraints: []
              acceptance: No failure, result, member, or document contains a credential value.
              verify: Observe provoked failures and every result and document for the absence of credential values.
              status: done
              log:
              - at: '2026-09-30T15:24:50.497+03:30'
                transition: todo -> claimed
                evidence: Dependencies done; claimed before running the verification.
              - at: '2026-09-30T15:26:05.866+03:30'
                transition: claimed -> done
                check: Transient script provoked 15 failures (duplicate and conflicting records carrying marker credentials, referenced delete, invalid SQL with a marker parameter, bad Filter value and Field name, unreachable server with a marker password, incompatible structure, over-precise decimal, invalid configuration containing a credential, invalid and conflicting Initial Data, preparation failure), then searched message, args, repr and the full formatted traceback of each for the markers, checked for chained driver errors, member and result text, the README and the configuration.
                outcome: Passed. 15 failures across 6 meanings contain no marker anywhere in their text or traceback; none carries a chained driver error; members and results expose no connection value; the README contains no host, port, user or marker; the configuration holds no real credential (server password empty).
