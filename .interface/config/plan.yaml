                outcome: 'User: 7 Fields (order, Type, nullability, description, Default Value, length, Value Generation, sensitivity), Primary Key id, 0 Relation(s), 2 Uniqueness Constraint(s), no Indexes all matched the Target with nothing missing, added, reordered, or altered; table columns matched; construction from conforming values succeeded and omitted defaults resolved; a missing Required Field was refused.'
