# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 40
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "Deliver the independent, reusable Model library that defines and publishes every Target-declared Entity with its Fields and Entity Metadata, provides the shared Declaration and JSON conversion behaviour, is documented, and is proven conformant and repeatable."
      constraints: []
      task_count: 40
      groups:
        "P1.G1":
          id: "P1.G1"
          title: "Package realization"
          description: "Makes the Model a usable reusable package and proves that the selected modeling technology can carry every Model contract before any Entity depends on it."
          area: "Model package and technology realization"
          does: "The Model installs and imports as an independent package, and the selected modeling technology is confirmed capable of preserving every Model contract."
          constraints: []
          task_count: 2
          tasks:
            "P1.G1.T1":
              id: "P1.G1.T1"
              source_id: "002"
              title: "Establish the installable Model package"
              description: "Create the independent Model package so that it installs and imports through the standard mechanism of the selected technology, exposes its public type information, and declares only the dependencies it needs."
              reason: "Every other Model result is delivered through this package, and other Components must be able to reuse it."
              inputs: []
              skills:
                - "python-skills:python-guidelines"
              expected_result: "A package that installs into a clean isolated environment and can be imported, before any Entity content exists."
              depends_on: []
              constraints: []
              acceptance: "The package installs and imports by the standard mechanism of the selected technology and its public type information is discoverable."
              verify: "In a clean environment, installing the package and importing it succeeds and its public types can be inspected."
              status: "done"
              log:
                - at: "2026-09-28T18:02:32Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:04:55Z"
                  event: "done"
                  execution_id: "003"
                  check: "uv sync in the Model Component root resolved and locked dependencies; ruff format --check, ruff check and strict pyright ran on the package; uv build produced a wheel that was installed into a fresh isolated environment and imported from an unrelated working directory."
                  outcome: "Passed. Python 3.14.7, sqlmodel 0.0.47 resolved and recorded in the lock file; format, lint and strict type checks reported no findings; the wheel contains the root package, core and entity packages and the typing marker; import succeeded from the clean environment with declared requirement sqlmodel."
            "P1.G1.T2":
              id: "P1.G1.T2"
              source_id: "002"
              title: "Confirm the modeling technology preserves every Model contract"
              description: "Assess the selected modeling technology against the Model's value, construction, mutation, Entity Metadata, and JSON conversion contracts. Supply private Model-owned support where a native capability is missing, and report an incompatibility where meaning cannot be preserved."
              reason: "A missing capability must be found before Entities are built on it, so that no public meaning is narrowed, approximated, or coerced."
              inputs:
                - "The installable Model package"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "A recorded assessment with one outcome per contract: supported, bridged privately, or incompatible."
              depends_on:
                - "P1.G1.T1"
              constraints: []
              acceptance: "Every contract has a stated outcome and no contract is silently narrowed."
              verify: "For each contract an observable behaviour demonstrates its outcome, and every incompatibility is reported with the affected contract identified."
              status: "done"
              log:
                - at: "2026-09-28T18:05:03Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:07:51Z"
                  event: "done"
                  execution_id: "003"
                  check: "Read the installed SQLModel 0.0.47 construction, validation and assignment source, then ran a transient probe (a table model plus a private Model-owned base) through 35 observable checks covering construction, logical Types, exact decimal, timezone-aware datetime, Auto Increment pending state, defaults and explicit false/zero/empty/null, length constraint, immutability, atomic reassignment, model_validate, diagnostics hiding input values, and a real SQLite session round trip."
                  outcome: "Passed 35/35. Outcomes per contract: Types, defaults, decimal and datetime meaning and pending Auto Increment are natively supported; construction validation and atomic, immutability-aware assignment are BRIDGED PRIVATELY because SQLModel table models skip validation on construction and validate only after setting on assignment (base class validates through the pydantic validator with strict, extra-forbid and hidden-input configuration, and routes the validated value through SQLModel assignment so ORM change tracking still works); Entity Metadata and JSON conversion are technology-independent and owned by Declaration and Foundation. No contract is incompatible. Observations for later phases: SQLite storage rescales decimals (1.10 returns as 1.1000000000) and normalizes datetimes to UTC, which are storage concerns of Database, not Model runtime values."
        "P1.G2":
          id: "P1.G2"
          title: "Shared Entity behaviour"
          description: "Holds the behaviour every Entity shares: the canonical Declaration, logical Type semantics, construction and mutation, and the Foundation JSON conversions. None of it carries the domain meaning of any one Entity."
          area: "Declaration and Foundation"
          does: "Any Entity can be given its Declaration, constructed, mutated, and converted to and from JSON through shared behaviour."
          constraints: []
          task_count: 6
          tasks:
            "P1.G2.T1":
              id: "P1.G2.T1"
              source_id: "002"
              title: "Provide the canonical Declaration capability"
              description: "Provide the public capability that records and exposes an Entity Declaration and its Field Declarations in the canonical logical contract, without any runtime behaviour."
              reason: "Entity meaning and metadata must be readable by consumers independently of language, package, and database."
              inputs:
                - "The technology capability assessment"
              skills:
                - "python-skills:python-guidelines"
              expected_result: "A public Declaration capability from which an Entity's name, description, Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes can be read."
              depends_on:
                - "P1.G1.T2"
              constraints: []
              acceptance: "A representative Declaration exposes every canonical member unchanged, including explicit false, explicit null, and absent optional values."
              verify: "Reading a representative Declaration through the public surface returns each canonical member as supplied and distinguishes an absent Default Value from an explicit null Default Value."
              status: "done"
              log:
                - at: "2026-09-28T18:08:23Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:10:50Z"
                  event: "done"
                  execution_id: "003"
                  check: "ruff format, ruff check and strict pyright on the package, then a transient behavioural check reading representative Declarations through the public surface."
                  outcome: "Passed. Entity Declaration exposes exactly the seven canonical members and Field Declaration exposes all sixteen canonical members; an absent Default Value is distinguishable from an explicit null Default Value; explicit false, constraints, sensitivity marker and value generation read back unchanged; Declarations are frozen and carry no behaviour; Relations are recorded by name only."
            "P1.G2.T2":
              id: "P1.G2.T2"
              source_id: "002"
              title: "Provide logical Type semantics"
              description: "Provide the shared meaning of integer, string, boolean, float, decimal, and datetime so that every Field value keeps its logical Type without implicit conversion."
              reason: "Portable value meaning must be identical for every Entity regardless of its native realization."
              inputs:
                - "The technology capability assessment"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "Each logical Type accepts and preserves only values of its own Type, keeping exact decimal values, Unicode text, and datetime precision and timezone meaning."
              depends_on:
                - "P1.G1.T2"
              constraints: []
              acceptance: "A value of each logical Type is preserved unchanged, and a value of a different Type category is rejected without coercion."
              verify: "Supplying a value of each logical Type is accepted unchanged, while supplying a boolean for an integer, a float for a decimal, or a string for a number is rejected."
              status: "done"
              log:
                - at: "2026-09-28T18:08:23Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:10:50Z"
                  event: "done"
                  execution_id: "003"
                  check: "Transient full matrix of the six logical Types against 23 representative values (138 type/value pairs) through the shared value validation, checking acceptance, unchanged return, and that error text does not echo the offending value; ruff format, ruff check and strict pyright."
                  outcome: "Passed with 0 deviations after two fixes found by the matrix: float previously accepted and silently converted int, Decimal and Fraction (lossy), and error text echoed input. Now each Type accepts only its own category unchanged (bool is never integer, int/Decimal/str never float, float/str/int never decimal, str never datetime), Unicode text, exact Decimal text and datetime offset and microseconds are preserved, and non-finite float and decimal values are rejected because JSON cannot represent them (needed for lossless round trips). Diagnostics hide input values."
            "P1.G2.T3":
              id: "P1.G2.T3"
              source_id: "002"
              title: "Provide the Entity construction contract"
              description: "Provide the shared behaviour by which an Entity is created directly from supplied values, applying Field presence, nullability, Type, value constraints, Default Values, and declared Value Generation."
              reason: "Direct construction and JSON construction must follow one contract so omission, null, and defaults never differ by path."
              inputs:
                - "The Declaration capability"
                - "The logical Type semantics"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "Entity creation that accepts valid input and rejects unknown Fields, missing Required Fields, null for a non-nullable Field, incompatible Types, and violated constraints, while preserving explicit false, zero, empty string, and null."
              depends_on:
                - "P1.G2.T1"
                - "P1.G2.T2"
              constraints: []
              acceptance: "A representative Entity is created correctly from valid input, receives omitted values only as declared, and every invalid input is rejected."
              verify: "Creating a representative Entity with valid input succeeds with the expected values, and each class of invalid input is observed to be rejected with a diagnostic that identifies the Entity and Field."
              status: "done"
              log:
                - at: "2026-09-28T18:10:50Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:12:23Z"
                  event: "done"
                  execution_id: "003"
                  check: "Transient representative Entity (every logical Type, defaults, a length constraint, a pending Auto Increment identity) built on the real Model base was constructed with 15 classes of invalid input plus valid, omitted, explicit false/zero/empty/null, naive and aware datetime, exact decimal, model_validate, positional-argument and SQLite session cases; ruff format, ruff check and strict pyright."
                  outcome: "Passed. Valid input constructs; omitted values receive their exact Default Value or null; pending identity stays pending and is assigned by the ORM at flush; unknown Fields, missing Required Fields, null for non-nullable, wrong-category values (str/bool for integer, int for boolean, int/Decimal/nan for float, float/str/int for decimal, str for datetime) and violated length are rejected; explicit false, zero, empty string and null are kept; diagnostics name the Entity and Field and never echo the value. Verification caught one real defect first (SQLModel silently ignores strict and extra config given as class keywords, so Entities were coercing); fixed by declaring the config on the base."
            "P1.G2.T4":
              id: "P1.G2.T4"
              source_id: "002"
              title: "Provide the Entity mutation contract"
              description: "Provide the shared behaviour by which a mutable Field can be reassigned with revalidation, an immutable Field cannot change once assigned, and a failed assignment leaves the previous value unchanged."
              reason: "Declared state rules must hold after creation as well as at creation."
              inputs:
                - "The Entity construction contract"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "Entity state changes that honour immutability and revalidate every assignment atomically."
              depends_on:
                - "P1.G2.T3"
              constraints: []
              acceptance: "A valid assignment changes the value, an invalid assignment is rejected and leaves the prior value intact, and an immutable Field cannot be changed."
              verify: "Assigning valid and invalid values to a mutable Field and attempting to change an immutable Field, including an assigned identity, each produce the expected outcome with the prior value intact after every failure."
              status: "done"
              log:
                - at: "2026-09-28T18:12:23Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:14:32Z"
                  event: "done"
                  execution_id: "003"
                  check: "Transient representative Entity on the real base: valid and 9 classes of invalid assignment (with a full state snapshot compared before and after each failure), nullable reassignment, one-time identity assignment then immutability, unknown attribute, model_validate with an explicit identity, and a SQLite session covering assignment on a commit-expired instance, immutability on an ORM-assigned row, sqlmodel_update, and reload from a second session; ruff format, ruff check and strict pyright."
                  outcome: "Passed (part of 57/57, plus 39/39 regression). Valid assignments change the value and persist; every invalid assignment is rejected with the previous state byte-for-byte intact; the assigned identity cannot be changed or cleared, including on a row the ORM assigned and expired; sqlmodel_update is validated the same way; diagnostics hide the value. Design note: the guard stands down during model_validate internals (a context flag) so validation with an explicit identity still works."
            "P1.G2.T5":
              id: "P1.G2.T5"
              source_id: "002"
              title: "Provide Foundation conversion of an Entity to JSON"
              description: "Provide the public Foundation capability that converts any Entity to its portable JSON representation."
              reason: "JSON is the only portable value representation of the Model and consumers need it to exchange Entities."
              inputs:
                - "The Declaration capability"
                - "The logical Type semantics"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "A public conversion capability producing a JSON object that reflects the Entity's current values."
              depends_on:
                - "P1.G2.T1"
                - "P1.G2.T2"
              constraints: []
              acceptance: "The JSON of a representative Entity has exactly the Entity's Field names in Declaration order, each value encoded by its logical Type, and no metadata or undeclared key."
              verify: "Converting a representative Entity holding every logical Type yields JSON whose keys, order, and encodings match the Entity, with null, false, zero, and empty string kept distinct."
              status: "done"
              log:
                - at: "2026-09-28T18:10:50Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:12:23Z"
                  event: "done"
                  execution_id: "003"
                  check: "Same transient representative Entity converted to JSON and inspected for key set and order, encodings of every logical Type, null/false/zero/empty-string distinctness, pending identity, plain-document validity (dump and reload), and independence from the Entity."
                  outcome: "Passed. Keys are exactly the Field names in Declaration order with no metadata or undeclared key; decimal is an exact base-10 string, datetime is ISO 8601 preserving microseconds and offset (naive stays without offset), integer/float/boolean/string keep their JSON kinds, pending Auto Increment identity is null, null/false/zero/empty string remain distinct, and the result survives a JSON dump and reload unchanged."
            "P1.G2.T6":
              id: "P1.G2.T6"
              source_id: "002"
              title: "Provide Foundation construction of an Entity from JSON"
              description: "Provide the public Foundation capability that constructs an Entity from its portable JSON representation using the same construction contract as direct creation."
              reason: "Consumers must be able to rebuild an Entity from JSON without loss or divergent validation."
              inputs:
                - "The Entity construction contract"
                - "The Entity-to-JSON conversion"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "A public construction capability that rebuilds an equal Entity from JSON and rejects malformed input."
              depends_on:
                - "P1.G2.T3"
                - "P1.G2.T5"
              constraints: []
              acceptance: "A representative Entity survives a JSON round trip with every value and Type unchanged, and malformed input, unknown Fields, incompatible Types, and missing Required Fields are rejected."
              verify: "A round trip of a representative Entity holding null, false, zero, an empty string, an exact decimal, and a timezone-aware datetime reproduces every value, and each rejection case is observed to fail."
              status: "done"
              log:
                - at: "2026-09-28T18:12:23Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:14:32Z"
                  event: "done"
                  execution_id: "003"
                  check: "Same run: round trips through to_json, JSON text and from_json for six entity states (full, nulls/false/zero/empty, pending identity, naive datetime, 34-digit exact decimal, negative and extreme values) comparing every value and Python type; omission, explicit null identity, Z suffix and integer-for-float cases; and 20 malformed-input classes plus three checks that rejection text never echoes the offending value."
                  outcome: "Passed. Every round trip reproduces every value and Type unchanged (exact decimal text, datetime offset and microseconds, null/false/zero/empty string kept distinct); omission behaves as in direct construction; malformed input is rejected (non-object, non-string keys, unknown Field, missing Required Field, null for non-nullable, wrongly encoded decimal or datetime, wrong-kind values, non-exact integer for float, violated length) with messages that do not echo values. Exception kinds: ValueError for a non-object or an invalid encoding, TypeError for a wrong-kind decimal or datetime encoding, pydantic ValidationError for constructor-contract violations."
        "P1.G3":
          id: "P1.G3"
          title: "Target input validation"
          description: "Holds the pre-generation check of the Target's Model declarations so that defects are found before any Entity is defined."
          area: "Input conformance"
          does: "The Target's Model declarations are confirmed generation-ready, or every defect is reported with its location."
          constraints: []
          task_count: 1
          tasks:
            "P1.G3.T1":
              id: "P1.G3.T1"
              source_id: "002"
              title: "Validate the Target Model declarations"
              description: "Examine every Target-declared Model for completeness, unique naming, valid Field rules and defaults, type-compatible and resolvable Entity Metadata, and unambiguous identity, reporting each defect with its Entity, Field, and violated rule."
              reason: "Generating from incomplete or contradictory input would silently change or omit Target meaning."
              inputs:
                - "The Target's Model declarations"
              skills: []
              expected_result: "A validation result that either confirms every Target Model is ready for definition or lists actionable defects."
              depends_on: []
              constraints: []
              acceptance: "Every Target-declared Entity and Field is covered, and each reported defect names its Entity, Field, and violated rule without being hidden by omission or coercion."
              verify: "The result accounts for every Target-declared Entity and Field, and each defect it reports identifies its Entity, Field, and rule."
              status: "done"
              log:
                - at: "2026-09-28T18:02:32Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:04:55Z"
                  event: "done"
                  execution_id: "003"
                  check: "Transient validator parsed the Target Models section and checked Entity/Field naming, Types, Default Values against Type and nullability, Auto Increment, length applicability, Primary Key identity, and Relation and Uniqueness Constraint resolution, Type compatibility and duplicates. Counts were cross-checked with an independent line count, and known defects were injected to confirm reporting."
                  outcome: "Passed. 15 Entities, 124 Fields (independent count 124) and 28 Relations (independent count 28) accounted for with 0 defects. Injected defects (missing target Entity, missing local Field, incompatible Relation Types, unsupported Type, null Default on non-nullable Field, badly typed Default, length on non-string, Auto Increment on string, duplicate Field, duplicate Entity, Uniqueness Constraint naming an undeclared Field) were each reported with Entity, Field and rule; a valid control stayed clean. Two validator gaps found while testing (null Default read as text, badly typed Default crashing) were fixed and re-tested."
        "P1.G4":
          id: "P1.G4"
          title: "Entity definitions"
          description: "One Task per Target-declared Model concept, in Target order. Each Task completes the whole Entity, its Fields and its Entity Metadata, as the Target declares it."
          area: "Entity"
          does: "Every Target-declared Model concept has exactly one authoritative Entity."
          constraints: []
          task_count: 15
          tasks:
            "P1.G4.T1":
              id: "P1.G4.T1"
              source_id: "002"
              title: "Define the User Entity"
              description: "Define the Entity for the Target's User concept."
              reason: "Model must own the single authoritative definition of the User concept."
              inputs:
                - "The Target's declaration of User"
              skills:
                - "sqlmodel"
                - "python-skills:python-guidelines"
              expected_result: "A complete User Entity ready for publication."
              depends_on:
                - "P1.G2.T4"
                - "P1.G2.T6"
                - "P1.G3.T1"
              constraints: []
              acceptance: "The User Entity matches the Target's declaration in name, description, Field order, each Field's Type, nullability, defaults, and rules, and its Entity Metadata."
              verify: "Reading the User Declaration through the public surface shows exactly the Target-declared meaning, and creating a User from JSON that contains only its Required Fields succeeds while omitting any one Required Field is rejected."
              status: "done"
              log:
                - at: "2026-09-28T18:14:32Z"
                  event: "claimed"
                  execution_id: "003"
                  detail: "Status changed from todo to claimed before work began."
                - at: "2026-09-28T18:16:50Z"
                  event: "done"
                  execution_id: "003"
                  check: "Transient per-Entity conformance script: compared the published Declaration with the Target (name, description, Field membership and order, Type, nullability, Default Value presence and value, length, Purpose text, immutability, value generation, Relations and Uniqueness Constraints in canonical order, no undeclared marker or constraint); compared the class Fields with the Declaration (order, annotation, nullability, required-ness, defaults, maximum length, strict float validation); inspected the SQLModel table (columns, column types, identity as the only primary key, no foreign key, unique or index baked in); checked the import graph (core, sqlmodel and standard library only, no sibling Entity); built the Entity from JSON holding only its Required Fields, checked omitted defaults and the JSON round trip, and confirmed each single omitted Required Field is rejected. Also an independent raw-text cross-check of Target lines against published Declarations, ruff format, ruff check and strict pyright."
                  outcome: "Passed. 7 Fields (4 Required), 0 Relation(s) and 2 Uniqueness Constraint(s) match the Target exactly; independent raw-text cross-check found 0 mismatches across all 124 Fields; generated shared metadata creates the table without error."
            "P1.G4.T2":
