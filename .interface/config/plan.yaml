meta:
  path: ".interface/config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

read_order: ["task_count", "plans"]

content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

content:
  task_count: 69
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Deliver the independent, reusable Model library that defines every Target-declared Entity exactly as declared, with its Fields, relationships, and rules.
      constraints: []
      task_count: 24
      groups:
        P1-G1:
          id: P1-G1
          title: Shared Model layers
          description: 'The shared mechanisms every Entity depends on: recording technology-independent Entity meaning and the common JSON conversion behaviour.'
          area: Declaration and Foundation layers
          does: Every Entity can record its technology-independent meaning and convert to and from JSON through shared, domain-neutral layers.
          constraints: []
          task_count: 2
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '002'
              title: Provide the Declaration layer
              description: Provide the shared layer through which an Entity records its Fields with their Types and Field Rules, its Primary Key, Uniqueness Constraints, Relationships, Index intentions, and Value Generation, as structured meaning a consumer can read without any runtime behaviour.
              reason: Every Entity must carry complete logical meaning that Database and Logic can consume without inventing structure.
              inputs: []
              skills:
              - python-skills:python-guidelines
              expected_result: A public Declaration layer that can record every kind of Entity fact named above in structured, readable form and holds no runtime behaviour.
              depends_on: []
              constraints: []
              acceptance: An Entity can record each kind of logical fact through Declaration and a consumer can read every recorded fact back in structured form; Declaration itself performs no runtime action.
              verify: Recording a sample Entity's facts of every kind through the public Declaration layer and reading them back yields exactly what was recorded, and the layer exposes no operational behaviour.
              status: done
              log:
              - at: '2026-09-26T03:54:48+03:30'
                log_entry: '003'
                event: claimed
                from_status: todo
                to_status: claimed
                note: Claimed before creating the shared Declaration and Foundation layers.
              - at: '2026-09-26T03:55:58+03:30'
                log_entry: '003'
                event: completed
                from_status: claimed
                to_status: done
                check: Transient script recorded a sample Entity's facts of every kind (fields with Types/rules/sensitivity/at-rest/length/immutability, primary key, single and combined uniqueness, reference, index, all three Value Generation kinds, cross-Entity rule) and read them back; asserted exact equality, immutability, and that no record type exposes callable behaviour.
                outcome: 'passed: all assertions held'
                locations: my_model/src/my_model/declaration.py
            P1-G1-T2:
              id: P1-G1-T2
              source_id: '002'
              title: Provide the Foundation layer
              description: Provide the shared layer that converts an Entity instance to JSON and creates an instance from JSON, without adding Fields, constraints, or domain meaning of its own.
              reason: Every Entity needs one consistent implementation of the common conversion behaviour rather than a copy per Entity.
              inputs: []
              skills:
              - python-skills:python-guidelines
              expected_result: A public Foundation layer offering instance-to-JSON conversion and JSON-to-instance creation that any Entity can use.
              depends_on: []
              constraints: []
              acceptance: Converting an instance to JSON and creating an instance from that JSON returns an instance with identical values, and the layer contributes no Field or constraint.
              verify: Round-tripping a sample instance through the public Foundation conversion returns equal values, and the sample exposes no Fields beyond those it declares.
              status: done
              log:
              - at: '2026-09-26T03:54:48+03:30'
                log_entry: '003'
                event: claimed
                from_status: todo
                to_status: claimed
                note: Claimed before creating the shared Declaration and Foundation layers.
              - at: '2026-09-26T03:55:59+03:30'
                log_entry: '003'
                event: completed
                from_status: claimed
                to_status: done
                check: Transient script round-tripped a plain and a table Entity (Decimal, aware datetime, nullable string) through to_json then from_json from both str and bytes; asserted equal values, same type, and that Foundation itself declares no Fields and adds none.
                outcome: 'passed: all assertions held'
                locations: my_model/src/my_model/foundation.py
        P1-G2:
          id: P1-G2
          title: Access and connectivity Entities
          description: The Entities that identify who uses the system and how it reaches supported trading platforms.
          area: Entities identifying users, trading platforms, and platform connections
          does: User, Trading Platform, and Instance exist as complete, independent Domain Entities.
          constraints: []
          task_count: 3
          tasks:
