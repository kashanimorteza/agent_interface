              verify: Adding and updating an Instance through a stand-in for Database shows the credential values it receives are protected forms of the supplied placeholders and that Logic recovers each original from them with the configured secret.
              status: done
              log:
              - at: '2026-09-29T08:44:18Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 009) before protecting Instance and Account credentials.
              - at: '2026-09-29T08:44:40Z'
                transition: claimed -> done
                check: Transient script adding and then updating an Instance through the Instance Service over a recording stand-in for Database (forwarding to a real Database over a throwaway SQLite file) with distinctive placeholder credentials, and once with no credentials; the Entity Database received and the stored record were decrypted with the configured secret and searched for the placeholders.
                outcome: On Add and on Update the credential values Database received were reversible protected forms that neither equal nor contain the placeholders and that the configured secret opened to the originals; absent credentials stayed absent; the stored record held the same protected forms. The mapping of Instance credential Fields to the encrypted treatment follows the Target's stated at-rest rule (Open Question OQ-008-1 in log 008). ruff and pyright clean.
            P3-G5-T05:
