              title: Validate transport input before it reaches Logic
              description: Refuse external input that is missing, malformed, or of the wrong type at the Router with a clear public failure before it reaches the Adapter or Logic. Shape validation belongs to API, while whether the application accepts a well-formed request remains Logic's decision.
              reason: Transport validity is a property of the boundary, and it must not be confused with application validity.
              inputs:
