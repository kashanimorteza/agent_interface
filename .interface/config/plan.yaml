          id: P2-G11
          title: Storage guarantees
          description: Guarantees that hold across every Operation rather than for one of them.
          area: Value fidelity and atomic change across the Database's storing Operations.
          does: Whatever is stored comes back exactly as supplied, and no changing request leaves a partial
            result.
          constraints: []
          task_count: 2
          tasks:
            P2-G11-T1:
              id: P2-G11-T1
              source_id: '006'
              title: Store every value exactly as received
              description: 'Make storing and returning an Entity preserve each value exactly as supplied:
                null, false, zero, and the empty string stay distinct, exact decimals and timezone-aware datetimes
                keep their value, and credential or sensitivity-marked Fields are stored without hashing,
                encryption, masking, or any other treatment based on meaning.'
              reason: Storage that interpreted meaning would hide or change data unpredictably, and meaning
                belongs to its owner.
              inputs:
              - Add and retrieve Operations
              - Model Entity Field Types
              skills: *id001
              expected_result: Lossless storage of every Field value.
              depends_on:
              - P2-G9-T2
              constraints: []
              acceptance: Adding an Entity and retrieving it returns values identical to those supplied for
                every Field type, including credential Fields, which come back exactly as given.
              status: done
              log:
              - at: '2026-10-04T16:37:36Z'
                by: '007'
                status: claimed
                event: claimed
                note: Dependencies done; claimed before work.
              - at: '2026-10-04T16:39:42Z'
                by: '007'
                status: done
                event: completed
                note: 'Storing and returning an Entity preserves each value exactly as supplied: null, false, zero,
                  and the empty string stay distinct; a 38-digit exact decimal and a microsecond datetime with a -07:30
                  offset read back as the same value (the datetime as the same instant, timezone-aware in UTC); credential
                  and password Fields are stored and returned exactly as supplied, without hashing, encryption, masking,
                  or any other treatment based on meaning. The Database adds no such behaviour; the guarantee holds
                  because it passes values through unchanged.'
                evidence: A decimal with 38 significant digits and an exact zero came back identical; an empty-string
                  name and description, a null description, a false activity flag, a zero integer, and an unset optional
                  text came back distinct and unchanged; a credential value with punctuation, spaces, and non-Latin
                  letters and a 200-character key came back identical and the raw stored text equalled the supplied
                  text; a datetime with a -07:30 offset and microseconds came back as the same instant (UTC-aware);
                  a float came back as the same float.
