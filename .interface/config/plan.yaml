        P2-G6:
          id: P2-G6
          title: Request handling
          description: How every request selects its Instance and how supplied request inputs are checked before any Instance acts on them.
          area: Instance selection and request validation
          does: Every request reaches only the intended Instance and is refused before it acts when its inputs are not valid.
          constraints: []
          task_count: 3
          tasks:
            P2-G6-T01:
              id: P2-G6-T01
              source_id: '006'
              title: Route each request to the selected or default Instance
              description: Make every Operation accept an optional Instance Enum member, serve the request from that Instance, and serve it from the configured default Instance when none is supplied.
              reason: Consumers must reach the storage they intend and must be able to omit the choice.
              inputs:
              - Instance Enum
              - Storage access for every active Instance
              - Execute Command
              - Add
              - Get by ID
              skills:
              - sqlmodel
              - python-skills:python-guidelines
              expected_result: Request routing to the selected or default Instance.
              depends_on:
              - P2-G3-T01
              - P2-G5-T01
              - P2-G5-T02
              - P2-G5-T03
              constraints: []
              acceptance: A request naming an active Instance reads and changes only that Instance, and a request naming none reads and changes only the configured default Instance.
              verify: Adding and retrieving an equivalent record once for each active Instance selection and once with no selection shows that only the selected Instance, or the default Instance for the request with none, holds or returns the record.
              status: done
              log:
              - at: '2026-09-28T23:04:14Z'
                transition: todo -> claimed
                note: Claimed by my-interface-develop (log 007) before writing the query-default resolution and the shared Data layer with routing and request validation.
