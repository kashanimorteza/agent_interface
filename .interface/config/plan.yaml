                  log_entry: "008"
                  transition: "claimed -> done"
                  note: "Added the Storage naming: it reads Database's current public capabilities from its published gateway, names every capability from its own name unless a configured override replaces that base name, and raises a ConfigurationError that lists any override naming no current capability instead of ignoring it. The override list holds no entry today because Storage Preferences configure none. Observed: with no override the 16 names are storage_<capability>; an override of add to insert changed only add's published name (storage_insert) while the other 15 names and the capability keys were unchanged; overrides for an unknown capability, and for a mix of known and unknown ones, were each rejected with an error naming them; with a stand-in Database that no longer publishes Prepare, an override for prepare was rejected, and a capability the stand-in newly publishes was named storage_archive without any override. Limit: Database's gateway publishes no group metadata, so an override that targets a capability whose group changed cannot be told apart at run time; matching uses the capability's stable name only."
