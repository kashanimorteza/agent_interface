# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "The backend item's configuration — generated from Phase 1 of .interface/project.md."


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Planning mode may write settings and draft contracts here, never a frozen one. Development mode may write nothing in this file. Freezing a contract version is a human decision."


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled"
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "standards"
  - "code_layout"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the backend is in play."
  code_path: "Where the backend's code lives."
  code_path_note: "What code_path is relative to."
  summary: "The backend in one line."
  needs_test: "Whether a written test gates every task — false, per project.md."
  verify_cwd: "Where and inside what environment a verify command runs."
  responsibility: "What the backend is answerable for."
  tech: "What the backend is built with."
  standards: "Naming conventions the code follows."
  code_layout: "Every path inside code_path and what it holds."
  contracts: "The backend's only connection to the frontend — its published API."
  boundaries: "The limits of the backend."
  out_of_scope: "What the backend does not do."


# <!--------------------------------------------------------------------------------- Content -->
content:

  enabled: true

  code_path: "backend/"
  code_path_note: "Relative to the repository root."

  summary: "A FastAPI service that owns and serves all trading data — Account, Asset, Strategy, Action Group, Action, and Execute."

  needs_test: false

  verify_cwd: "backend/, run inside the backend's virtual environment."

  responsibility: "Stores every trading record, enforces what a valid record looks like, and answers the create / list / get / update / delete / enable-disable operations Phase 1 requires for each of the six models, through an HTTP API."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"
    database: "SQLite — a single file, owned entirely by the backend; reached only through the SQLAlchemy ORM, never queried directly by the frontend."
    run: "to be defined — the exact startup command is not stated by project.md (open question Q5)."

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "app/main.py": "Entry point — creates and configures the FastAPI app."
    "app/config.py": "Application configuration."
    "app/database.py": "SQLAlchemy engine and session setup — the only route to the SQLite file."
    "app/models/": "SQLAlchemy ORM models, one module per trading entity."
    "app/schemas/": "Pydantic request/response validation schemas for each entity."
    "app/routers/": "FastAPI route handlers, one module per entity."
    "app/services/": "Business logic invoked by routers — kept out of the route handlers themselves."
    "app/errors.py": "The shared error shape and exception handlers."
    "alembic/": "Database migrations — the only way the schema changes."
    "tests/": "Not required by project.md (needs_test is false); reserved if a test is ever written."

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "v1"
    rule: "Once v1 is frozen, the backend implements it exactly — no field, route, or error code beyond what v1 states."
    change_rule: "v1 is never edited once frozen. A needed change becomes v2, and freezing or versioning is a human decision."
    v1:
      lifecycle: "draft"
      lifecycle_note: "Not yet frozen. Models below are built directly from Phase 1's stated fields, but Account.Password's storage method, Execute.State, Strategy.Risk Parameter, and Execute.Profit's exact type are still open (Q2, Q3, Q4) — freezing now would lock in a guess for each."
      consumed_by: "frontend"
      contract_read_order:
        - "conventions"
        - "error_shape"
        - "models"
        - "routes"
      conventions:
        transport: "JSON over HTTP."
        identifiers: "Integer, auto-incrementing primary keys, assigned by the database."
        timestamps: "None — no model in Phase 1 carries a created/updated timestamp."
        unknown_id: "A request naming an id that does not exist answers 404 Not Found, in the shared error shape."
      error_shape:
        rule: "Every failure — validation, not-found, or otherwise — returns the same JSON envelope."
        fields:
          error:
            code: "Machine-readable error code a consumer may branch on."
            message: "Human-readable description of what went wrong."
        codes:
          - "not_found"
          - "validation_error"
      models:
        Account:
          id: "integer, primary key"
          name: "string, required"
          username: "string, required"
          password: "string, required — storage method (plain / hashed / encrypted) not yet decided, see open question Q2"
          status: "enum: active | disabled"
          description: "string, optional"
        Asset:
          id: "integer, primary key"
          name: "string, required"
          status: "enum: active | disabled"
          description: "string, optional"
        Strategy:
          id: "integer, primary key"
          name: "string, required"
          risk_parameter: "to be defined — type/format/range not stated, see open question Q4"
          status: "enum: active | disabled"
          description: "string, optional"
        Action_Group:
          id: "integer, primary key"
          name: "string, required"
          status: "enum: active | disabled"
          description: "string, optional"
        Action:
          id: "integer, primary key"
          name: "string, required"
          asset_id: "integer, foreign key -> Asset.id"
          strategy_id: "integer, foreign key -> Strategy.id"
          group_id: "integer, foreign key -> Action_Group.id"
          status: "enum: active | disabled"
          description: "string, optional"
        Execute:
          id: "integer, primary key"
          name: "string, required"
          action_id: "integer, foreign key -> Action.id"
          profit: "to be defined — numeric, exact type/precision not stated, see open question Q4"
          state: "to be defined — values not stated, and how it differs from status is unclear, see open question Q3"
          status: "enum: active | disabled"
          description: "string, optional"
      routes:
        note: "Per project rules, routes are not enumerated route-by-route; each model below gets the same standard operation set."
        Account: "create, list, get by id, update, delete, and toggle status between active/disabled."
        Asset: "Same operation set as Account."
        Strategy: "Same operation set as Account."
        Action_Group: "Same operation set as Account."
        Action: "Same operation set as Account; create/update validate that asset_id, strategy_id, and group_id name existing records."
        Execute: "Same operation set as Account; create/update validates that action_id names an existing Action. State's own values are open (Q3)."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns: "The whole database schema and every trading record: Account, Asset, Strategy, Action Group, Action, Execute."
    does_not_own: "The user interface, or how a record is visually entered, listed, or displayed."
    interface: "Its published API contract (contracts.v1) — the only way the frontend reaches trading data."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope: "MetaTrader integration, trade execution, and reporting — project.md excludes these from Phase 1. User authentication and login — project.md states authentication is not required."
