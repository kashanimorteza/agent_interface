# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "Generated backend item configuration — produced only by my-interface-interpreter, resolved from project.md, definition.yaml, and schema/backend.schema.yaml"
  standard: "Agent Interface Backend"
  schema: ".interface/schema/backend.schema.yaml"
  version: "4.5"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: "Only my-interface-interpreter during a generation run, and my-interface-tasker for planning-owned settings while planning phase P2"
  rule: "The backend never owns the database engine, storage, schema, or migrations — see schema/backend.schema.yaml policy. It consumes only the frozen database contract"
  code_boundary: "Only files under content.code_path may be written by development, and only within the touches of a claimed task for phase P2"
  credential_rule: "A credential field is write-only input, is never exposed in a response, generated schema, or error payload, and is always redacted from logs, diagnostics, traces, and exception details"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "model_api"
  - "standards"
  - "capabilities"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: "The one folder the backend item may write"
  summary: "The backend in one line"
  needs_test: "Whether backend code must be proven by a written test"
  verify_cwd: "Where and how backend verification commands run"
  responsibility: "What the backend is answerable for"
  tech: "The resolved language, environment, and packages"
  model_api: "The resolved model-level API intent for the project's domain models"
  standards: "Naming conventions for backend code"
  capabilities: "Error handling, logging, documentation, authentication, and HTTPS switches"
  contracts: "The database contract consumed and the HTTP interface produced"
  boundaries: "The limits of the backend"
  out_of_scope: "What the backend explicitly does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  code_path: "backend/"
  code_path_note: "Relative to the repository root, not the Interface — the only place the backend item may write."
  summary: "The Trading Assistant's backend — a FastAPI application implementing a CRUD API for every defined domain model, backed by the database contract through SQLAlchemy."
  needs_test: false
  verify_cwd: "backend/, inside its uv-managed virtual environment"
  responsibility: "Runs application behavior and publishes the HTTP API while consuming the database contract."

  tech:
    language:
      name: "Python"
      version: "3.14.7"
      environment:
        name: "uv"
        version: "0.12.1"
      packages:
        api:
          name: "FastAPI"
          version: "0.141.1"
          skill: "fastapi"
        orm:
          name: "SQLAlchemy"
          version: "2.0.52"

  model_api:
    source: ".interface/config/definition.yaml — content.models"
    default_operations:
      - "create"
      - "list"
      - "get"
      - "update"
      - "delete"
    overrides: {}

  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "OpenAPI (FastAPI-generated Swagger UI)"
    authentication:
      enabled: false
    https:
      enabled: false

  contracts:
    produces: "The implemented HTTP API and its FastAPI-generated OpenAPI description, published once the API is implemented."
    consumes: "The database contract published at .interface/config/database.yaml — content.contracts.v1."
    rule: "The implementation boundary: tasks, resolved model-level API intent, and the consumed database contract guide development, while endpoint paths, HTTP method mappings, payloads, response shapes, error shapes, entrypoints, commands, and file layout are produced during implementation rather than prescribed here."

  boundaries:
    owns: "Application code, the runtime database client and ORM mappings, business behavior, and the implemented HTTP interface."
    does_not_own: "Frontend code and the database engine, storage, schema, and migrations."
    interface: "The implemented HTTP API and its FastAPI-generated OpenAPI description."

  out_of_scope: "Frontend UI, the database engine and schema/migrations, and anything not needed to implement the resolved model-level API for the project's domain models."
