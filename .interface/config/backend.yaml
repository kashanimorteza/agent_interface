# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "Generated configuration — everything an agent reads to understand the backend item, including the contract it publishes"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Written in planning mode by my-interface-tasker — settings and draft contracts only, never a frozen contract. Freezing or versioning a contract is the human's decision. Development and review modes read this file and do not write it"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled, code_path, summary — is this item in play, where it lives, what it is"
  - "needs_test, verify_cwd — how its tasks are proven"
  - "responsibility, tech, standards — what it must do and what it is built with"
  - "capabilities — the optional behaviors switched on or off"
  - "code_layout — where every kind of code lives"
  - "contracts — the surface it publishes, read conventions first, routes last"
  - "boundaries, out_of_scope — where it ends"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the backend is in the build"
  code_path: "The one folder this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The backend in one line"
  needs_test: "Whether tasks are proven by written tests"
  verify_cwd: "Where and in what environment verify commands run"
  responsibility: "What the backend is answerable for"
  tech: "Language, environment, packages, database, run command"
  standards: "Naming conventions"
  capabilities: "The optional capabilities — which are on, which stay off"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The contract the backend publishes — api-v1"
  boundaries: "What the backend owns and what it does not"
  out_of_scope: "What the backend does not do in Phase 1"


# <!--------------------------------------------------------------------------------- Content -->
content:

  enabled: true

  code_path: "backend/"
  code_path_note: "Relative to the project root (the repository root), beside .interface/ — never a path inside the interface."

  summary: "A FastAPI service over SQLite that stores the trading information and serves the API Phase 1 delivers for all defined models, through contract api-v1."

  needs_test: false

  verify_cwd: "backend/ — every verify command runs from there, inside the uv virtual environment."

  responsibility: "Own the trading data — its storage, its schema, its validation — and offer everything the user manages through one HTTP API."

  # <!-------------------------------------------- Tech -->
  tech:

    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"

    database:
      engine: "SQLite"
      lives_at: "A single database file under backend/data/, created by migrations and never committed."
      schema_owner: "The backend — the schema exists and changes only through its Alembic migrations."
      access_route: "Every read and write goes through the SQLAlchemy ORM — no raw connection anywhere else."

    run: "uv run uvicorn app.main:app --reload — from backend/."

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "Docs — the interactive documentation page the framework serves; ReDoc is disabled (project.md: ReDoc: false)."
    authentication:
      enabled: false
    https:
      enabled: false
    api_key:
      enabled: true

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "app/main.py": "Entry point — creates the FastAPI application and mounts the routes"
    "app/config.py": "Configuration — settings, including the database file path"
    "app/database.py": "Database access — engine, session, and the SQLite foreign-key pragma"
    "app/models/": "SQLAlchemy models — one file per model"
    "app/schemas/": "Validation schemas — the shapes request bodies are checked against"
    "app/services/": "Business logic — everything a route calls"
    "app/routes/": "API routes — one file per model, thin over the services"
    "migrations/": "Alembic migrations — the only way the database schema changes"
    "data/": "The SQLite database file — git-ignored, never committed"
    "tests/": "Verification scripts where a task's verify needs one — automated tests are not required (Testing: false)"

  # <!-------------------------------------------- Contracts -->
  contracts:

    produces: "api-v1"
    rule: "The implementation must match the frozen contract exactly — the contract binds the backend, not the other way round."
    change_rule: "A frozen contract is versioned, never edited. A change means a new version, and freezing or versioning is the human's decision."

    api-v1:
      lifecycle: "draft"
      lifecycle_note: "Drafted at generation from the project's models and Phase 1 operations. The tasker may refine it; only the human freezes it, and nothing is built against it until frozen. It cannot be frozen while blocker B1 stands — risk_parameter, execute.state, password handling, delete-of-referenced behavior, and the API key mechanics are undecided (Q1–Q5)."
      consumed_by: "frontend"

      contract_read_order:
        - "conventions — what holds everywhere, before any specific shape"
        - "error_shape — how every failure looks, before any success"
        - "models — the data shapes, before the routes that carry them"
        - "routes — the surface itself, last, once everything it uses is known"

      conventions:
        transport: "JSON over plain HTTP — HTTPS is disabled (capabilities.https: false)."
        identifiers: "Every model has an integer id, assigned by the backend."
        api_key: "Requests carry an API key (capabilities.api_key: true) — how the key is issued and carried is undecided (Q5)."
        documentation: "The API serves its interactive Docs page (capabilities.api_documentation); ReDoc is disabled."
        status: "Every model carries status with the vocabulary enabled | disabled — items are enabled or disabled through it (Phase 1)."
        timestamps: "None — the project defines no timestamp fields."
        unknown_id: "A request naming an id that does not exist is answered 404 with the framework's built-in error body."

      error_shape:
        rule: "No custom shape — error_handling is disabled, so every failure takes the framework's built-in response body and standard HTTP status codes; no route adds a layer of its own."
        fields:
          framework_defined: "The body is whatever FastAPI produces built-in — no custom fields are defined or promised"
        codes:
          - "Standard HTTP status codes only — no custom code vocabulary exists while error_handling is disabled"

      models:
        account:
          fields: "id (integer), name (string), username (string), password (string — storage and exposure are Q3), status (enabled | disabled), description (string)"
        asset:
          fields: "id (integer), name (string), status (enabled | disabled), description (string)"
        strategy:
          fields: "id (integer), name (string), risk_parameter (to be defined — Q1), status (enabled | disabled), description (string)"
        action_group:
          fields: "id (integer), name (string), status (enabled | disabled), description (string)"
        action:
          fields: "id (integer), name (string), asset_id (integer — references asset), strategy_id (integer — references strategy), group_id (integer — references action_group), status (enabled | disabled), description (string)"
        execute:
          fields: "id (integer), name (string), action_id (integer — references action), profit (number), state (to be defined — Q2), status (enabled | disabled), description (string)"

      routes:
        rule: "One management surface per model, from Phase 1's stated operations: add a record, view records in a list, view one record, edit and update a record, delete a record, and enable or disable a record through its status. Per the interpreter's rules the routes are not spelled out route by route here; the tasker drafts them in planning mode from these operations."
        summary: "Six models, each with the same management surface — add, list, view one, update, delete, enable/disable via status. What a delete does to a referenced item's referrers is undecided (Q4)."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns: "Everything under backend/, and the whole database schema and its data."
    does_not_own: "Client code — nothing under the frontend's code_path, and nothing the user sees."
    interface: "Contract api-v1 — the only thing the backend offers the outside."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Authentication — the project states Authentication: false"
    - "HTTPS — the project states HTTPS: false"
    - "A custom error-handling layer — the project states Error Handling: false"
    - "Application logging — the project states Logging: false"
    - "Automated tests — the project states Testing: false"
    - "ReDoc documentation — the project states ReDoc: false"
    - "MetaTrader integration — Phase 1 excludes it"
    - "Trade execution — Phase 1 excludes it"
    - "Reporting — Phase 1 excludes it"
    - "The frontend and anything the user sees — Phase 1's Target is the backend (the goal sentence also names the frontend; that contradiction is Q6)"
