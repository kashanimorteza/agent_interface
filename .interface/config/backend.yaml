  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under backend/"
      - "The SQLite database and the whole of its schema, moved only through migrations"
      - "The API surface, the key check on it, and the Docs page that describes it"
    does_not_own:
      - "The frontend and any code under frontend/"
      - "Any page, component, or client-side state"
    interface: "The contract under content.contracts — v1 — and nothing else."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "HTTPS — switched off by the project."
    - "Centralized error handling and application logging — both switched off by the project."
    - "User authentication, sessions, or login — switched off by the project; the key parameter is the only gate."
    - "A written test suite — testing is switched off by the project."
    - "ReDoc — switched off by the project; only Docs is served."
    - "Placing trades or talking to Binance, MetaTrader 5, or any platform library — the project describes the platforms as integrations to be defined, and no phase asks the backend to execute a trade."
    - "Evaluating trailing or partial rules against a live position — the models store the rules; no phase asks for an engine that applies them."
    - "Paging, filtering, sorting, or searching on list routes — not stated by the project."
    - "Serving or building the frontend."
