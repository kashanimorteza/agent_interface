# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: true

  # <!-------------------------------------------- Code_Path -->
  code_path: "backend/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the interface."

  # <!-------------------------------------------- Summary -->
  summary: "A FastAPI service over SQLite that exposes the Trading Assistant's models through an API-key-protected HTTP API."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd:
    directory: "backend/"
    environment: "Inside the uv-managed virtual environment — every verify command is run through uv so it never touches the system interpreter."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Manages the application's data and functionality — the project's entities, their storage, and the API that serves them."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"
          note: "The project asks for the standard Python migration framework; Alembic is the schema default for that role."
    database:
      engine: "SQLite"
      location: "A single database file inside code_path — backend/trading_assistant.db"
      schema_owner: "The backend — the database schema belongs to it entirely."
      access: "Only through the SQLAlchemy ORM; no raw connection outside the ORM and the migration tool."
    run:
      command: "uv run uvicorn app.main:app --reload"
      cwd: "backend/"
      transport: "Plain HTTP — HTTPS is false."

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "OpenAPI — the interactive Docs endpoint (Swagger UI at /docs); ReDoc disabled"
    authentication:
      enabled: false
    https:
      enabled: false
    api_key:
      enabled: true
      header: "X-API-Key"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "pyproject.toml": "The uv project manifest — the dependencies and the Python requirement."
    "alembic.ini": "Alembic configuration pointing at the SQLite database file."
    "app/": "The application package."
    "app/main.py": "Entry point — creates the FastAPI app, mounts the routers, applies the API key dependency, serves /docs."
    "app/config.py": "Configuration — database URL and the API key value."
    "app/database.py": "Database access — engine, session factory, declarative base, session dependency."
    "app/models/": "One SQLAlchemy model per project entity."
    "app/schemas/": "One Pydantic module per entity — create, update, and read shapes."
    "app/services/": "One service module per entity — every read and write of the database."
    "app/routers/": "One router per entity — the routes of the contract, delegating to services."
    "migrations/": "Alembic environment and versions — the only way the schema changes."
    "migrations/versions/": "The migration scripts."

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "v1"
    rule: "The implementation must match the frozen contract exactly — every route, model, and convention listed under the version."
    change_rule: "A frozen contract is versioned, never edited; the human decides when a version freezes and when a new one is opened."

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — the backend may still be shaped against it and planning may refine it; a consumer may not build against it until the human freezes it, and freezing makes any later change a new version."
      consumed_by: "frontend"
      contract_read_order:
        - "conventions — what holds everywhere"
        - "error_shape — what every failure looks like"
        - "models — the data shapes"
        - "routes — the surface itself"
      conventions:
        transport: "HTTP with JSON bodies and responses; plain HTTP, no HTTPS."
        identifiers: "Every entity carries an integer ID assigned by the backend; a route addresses an entity by that ID in its path."
        timestamps: "No entity carries a timestamp field — the project states none."
        unknown_id: "A route addressed with an ID that does not exist answers 404."
        api_key: "Every route requires the API key in the X-API-Key header; a missing or wrong key answers 401."
        documentation: "The interactive Docs endpoint at /docs describes this surface; ReDoc is disabled."
      error_shape:
        rule: "Error handling is disabled, so every failure takes the framework's built-in shape and no custom error layer exists."
        fields:
          detail: "The framework's error detail — a string, or for a validation failure a list of the failing locations and messages."
        codes:
          401: "Missing or invalid API key."
          404: "No entity with the given ID."
          422: "The request body or path parameter failed validation."
      models:
        note: "Each model lists exactly the fields the project states; unstated implementation details are outside this contract and do not create interpretation gaps."
        trading_platform:
          name: "Trading Platform"
          purpose: "Defines the trading integration used to execute trades. Initial platforms include Binance and MetaTrader 5, and additional platforms may be added later. Each platform can provide its own development interface for performing trading operations through its related library."
          fields:
            - "ID"
            - "Name"
            - "Status"
            - "Description"
        broker:
          name: "Broker"
          purpose: "Defines a broker, its broker-specific parameters, and the trading platform it uses. A broker also acts as the parent under which its trading accounts are defined."
          fields:
            - "ID"
            - "Name"
            - "Trading Platform ID"
            - "Status"
            - "Description"
          references:
            - "Trading Platform ID refers to trading_platform"
        account:
          name: "Account"
          purpose: "Defines a trading account that belongs to a specific broker and is used to perform trading operations."
          fields:
            - "ID"
            - "Name"
            - "Username"
            - "Password"
            - "Broker ID"
            - "Status"
            - "Description"
          references:
            - "Broker ID refers to broker"
        asset:
          name: "Asset"
          purpose: "Defines a tradable asset and its related parameters, such as EURUSD or XAUUSD."
          fields:
            - "ID"
            - "Name"
            - "Status"
            - "Description"
        strategy:
          name: "Strategy"
          purpose: "Defines the trading settings used by an action, including values such as stop loss and take profit."
          fields:
            - "ID"
            - "Name"
            - "Risk Parameter"
            - "Status"
            - "Description"
        trailing_group:
          name: "Trailing Group"
          purpose: "Defines a group for managing the rules that determine when and how stop loss and take profit values should change during a trade."
          fields:
            - "ID"
            - "Name"
            - "Status"
            - "Description"
        trailing_rule:
          name: "Trailing Rule"
          purpose: "Defines an individual rule within a trailing group. For example, when profit reaches a specified percentage of the take-profit target, the rule can adjust the take profit and stop loss."
          fields:
            - "ID"
            - "Name"
            - "Trailing Group ID"
            - "Status"
            - "Description"
          references:
            - "Trailing Group ID refers to trailing_group"
        partial_group:
          name: "Partial Group"
          purpose: "Defines a group of rules for closing all or part of a position at specified profit levels, such as closing 10%, 30%, or the entire position."
          fields:
            - "ID"
            - "Name"
            - "Status"
            - "Description"
        partial_rule:
          name: "Partial Rule"
          purpose: "Defines an individual rule within a partial group, including the profit threshold and the portion of the position to close when that threshold is reached."
          fields:
            - "ID"
            - "Name"
            - "Partial Group ID"
            - "Profit Threshold"
            - "Close Portion"
            - "Status"
            - "Description"
          references:
            - "Partial Group ID refers to partial_group"
        action_group:
          name: "Action Group"
          purpose: "Groups trading actions by an operating or risk profile, such as Standard or High Risk."
          fields:
            - "ID"
            - "Name"
            - "Status"
            - "Description"
        action:
          name: "Action"
          purpose: "Defines a trading action within an action group by combining an asset, an account, and a strategy. For example, a High Risk action can trade EURUSD through Account A using Strategy B."
          fields:
            - "ID"
            - "Name"
            - "Asset ID"
            - "Account ID"
            - "Strategy ID"
            - "Group ID"
            - "Status"
            - "Description"
          references:
            - "Asset ID refers to asset"
            - "Account ID refers to account"
            - "Strategy ID refers to strategy"
            - "Group ID refers to action_group"
        execute:
          name: "Execute"
          purpose: "Tracks actions that have been activated and executed, including the current stage and state of each execution."
          fields:
            - "ID"
            - "Name"
            - "Action ID"
            - "Profit"
            - "State"
            - "Status"
            - "Description"
          references:
            - "Action ID refers to action"
        position:
          name: "Position"
          purpose: "Stores the complete information for a position created from an executed order, including its entry price, take profit, stop loss, and the settings applied through its related groups."
          fields:
            - "ID"
            - "Name"
            - "Entry Price"
            - "Take Profit"
            - "Stop Loss"
            - "Status"
            - "Description"
