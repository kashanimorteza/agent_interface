# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "Config layer of the Agent Project Interface — the backend item's configuration, generated from Phase 1 of project.md by my-interface-interpreter"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Planning mode may write settings and draft contracts here, never a frozen contract — per content.modes in root.yaml"
  changed_by: "my-interface-interpreter on regeneration from project.md; my-interface-tasker in planning mode for settings and draft contracts; the human at any time"
  frozen_contracts: "A contract version whose lifecycle is frozen is never edited by any agent — a change means a new version, decided by the human"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled, code_path, code_path_note, summary — whether and where this item is in play"
  - "needs_test, verify_cwd — how work on it is proven"
  - "responsibility, tech, standards, capabilities — what it is answerable for and what it is built with"
  - "code_layout — where everything lives inside code_path"
  - "contracts — the surface it publishes, read before boundaries so the limits are read knowing the surface"
  - "boundaries, out_of_scope — its limits, read last"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the backend is in the build"
  code_path: "The one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The backend in one line"
  needs_test: "Whether tasks are proven by written tests"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the backend is answerable for"
  tech: "What the backend is built with — never re-decided by an agent"
  standards: "How the code is written — settled once"
  capabilities: "Optional capabilities, each switched on or off"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The API contract the backend publishes"
  boundaries: "What the backend owns, does not own, and offers"
  out_of_scope: "What the backend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: true

  # <!-------------------------------------------- Code_Path -->
  code_path: "to be defined"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, outside .interface/ — the project does not yet name the folder holding the backend's code; see open question Q1 in config/state.yaml."

  # <!-------------------------------------------- Summary -->
  summary: "A FastAPI service over SQLite that manages all Trading Assistant data and exposes it as an API-key-protected, documented API."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "The backend's code_path (to be defined — Q1), always inside its uv-managed virtual environment."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "The backend manages the application's data and functionality — it owns the database schema, the core trading entities, and the API surface through which everything is reached."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"
    database:
      engine: "SQLite"
      location: "A single database file inside code_path, never committed"
      schema_owner: "The backend, moved only through Alembic migrations"
      access_route: "SQLAlchemy is the only route to the data — no raw connections"
    run: "uv run uvicorn app.main:app --reload — from code_path, inside the uv environment"

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "OpenAPI via FastAPI's built-in Docs (Swagger UI at /docs); ReDoc disabled"
    authentication:
      enabled: false
    https:
      enabled: false
    api_key:
      enabled: true

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "app/": "The backend application package — everything importable lives under it"
    "app/main.py": "Entry point — creates the FastAPI app, wires routers and the API-key dependency"
    "app/config.py": "Configuration — database file location, API key settings"
    "app/database.py": "SQLAlchemy engine and session setup — the only place a connection is made"
    "app/models/": "SQLAlchemy models — one file per entity"
    "app/schemas/": "Pydantic validation schemas — request and response shapes, one file per entity"
    "app/routers/": "FastAPI routers — one file per entity, thin routes only"
    "app/services/": "Business logic the routes call — logic never lives in a route"
    "migrations/": "Alembic migration environment and version scripts"
    "alembic.ini": "Alembic configuration"
    "pyproject.toml": "Project metadata and dependencies, managed by uv"

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "v1"
    rule: "The implementation must match the frozen contract exactly — the contract binds the backend, not the other way around."
    change_rule: "A frozen contract is versioned, never edited; creating a new version and freezing it are human decisions."

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — planning may still reshape it; no consumer may build against it until the human freezes it, and a change while draft costs nothing but a re-read."
      consumed_by: "frontend"
      contract_read_order:
        - "conventions — what holds across the whole surface, before any route"
        - "error_shape — the one shape every failure takes"
        - "models — the data shapes the surface returns"
        - "routes — the surface itself, read last so every route is read knowing the shapes it carries"
      conventions:
        transport: "HTTP (HTTPS disabled by the project), JSON request and response bodies"
        api_key: "Every request carries the API key; a request without a valid key is rejected"
        identifiers: "Every model is addressed by its ID field"
        timestamps: "to be defined — the project states no timestamp fields"
        unknown_id: "A request for an unknown id answers 404 with the standard error shape"
      error_shape:
        rule: "Every failure takes FastAPI's built-in shape — the project disables a custom error layer"
        fields:
          detail: "What went wrong — a message, or the framework's validation detail list"
        codes:
          "401/403": "Missing or invalid API key"
          "404": "Unknown id"
          "422": "Request body or parameter failed validation"
      models:
        note: "Field names come from project.md; types and limits are not stated by the project — to be defined, see open question Q3 in config/state.yaml."
        trading_platform: "ID, Name, Status, Description — the trading integration used to execute trades (initially Binance and MetaTrader 5)"
        broker: "ID, Name, Trading Platform ID, Status, Description — a broker, its parameters, and the platform it uses; parent of its accounts"
        account: "ID, Name, Username, Password, Broker ID, Status, Description — a trading account belonging to a broker"
        asset: "ID, Name, Status, Description — a tradable asset such as EURUSD or XAUUSD"
        strategy: "ID, Name, Risk Parameter, Status, Description — trading settings used by an action, such as stop loss and take profit"
        trailing_group: "ID, Name, Status, Description — a group of rules governing how stop loss and take profit change during a trade"
        trailing_rule: "ID, Name, Status, Description — one rule within a trailing group"
        partial_group: "ID, Name, Status, Description — a group of rules for closing part or all of a position at profit levels"
        partial_rule: "ID, Name, Status, Description — one rule within a partial group"
        action_group: "ID, Name, Status, Description — groups actions by operating or risk profile, such as Standard or High Risk"
        action: "ID, Name, Asset ID, Strategy ID, Group ID, Status, Description — combines an asset, an account, and a strategy inside a group"
        execute: "ID, Name, Action ID, Profit, State, Status, Description — tracks activated and executed actions, with stage and state"
        position: "ID, Name, Status, Description — the complete information of a position created from an executed order"
      routes:
        note: "Per the interpreter's backend rule, routes are not defined route by route here — the pattern below is the surface."
        pattern: "Standard CRUD per model: list, get by id, create, update, delete — under a path named after the model; every route requires the API key, answers JSON, and may fail with the codes in error_shape."
        detail: "Exact paths, bodies, and success responses are settled by planning in this contract before the human freezes v1."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under its code_path"
      - "The whole database schema and the data in it"
      - "The API surface and contract v1"
    does_not_own:
      - "Client code and the user interface — however close they sit"
    interface: "Contract v1 above is the only thing the backend offers the outside."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Live trading integration — connecting to Binance, MetaTrader 5, or any platform library is not part of Phase 1; Phase 1 creates and runs the API for the defined models"
    - "User authentication — disabled by the project; API key support is the only access control"
    - "HTTPS, application logging, a centralized error layer, and written tests — all disabled by the project"
    - "Any user interface — that is the frontend's"
