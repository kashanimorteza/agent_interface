# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Planning mode may write settings and a draft contract version here; development and review write nothing here"
  frozen: "A contract version whose lifecycle is frozen is never edited by any mode — a change is a new version, and only the human creates or freezes one"
  regeneration: "A regeneration by my-interface-interpreter re-reads project.md; it never touches a frozen contract version"


