# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "Generated Config — everything an agent reads to understand the backend item: its resolved technology with concrete versions and technology Skills, model-level API intent, standards, capabilities, and its contract relationships. Endpoint paths, payloads, entrypoints, commands, and file layout are implementation output and do not live here. Derived by my-interface-interpreter from .interface/project.md through config/definition.yaml and the Policy and Preferences in .interface/schema/backend.schema.yaml"
  schema: ".interface/schema/backend.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-03"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "my-interface-interpreter writes the whole file during a generation run. Planning mode, for a phase whose target is backend, may write planning-owned settings and relationships. Development and review modes do not write this file"
  changed_by: "The human directly; my-interface-interpreter on regeneration; my-interface-tasker in planning mode within the limits above"
  database_boundary: "The backend never owns the database engine, storage, schema, migrations, or seed data. It consumes the frozen database contract and owns only its runtime connection, ORM mappings, and database client packages"
  sensitive_data: "A field is a credential when the consumed database contract assigns it a credential storage mode — users.password and accounts.password in database contract v1. Each is write-only input, accepted when required to create or update its model, never exposed in a response, generated response schema, or error payload, and always redacted from logs, diagnostics, traces, and exception details. The backend never guesses credential fields from their names; users.api_key is not a credential in the contract until open question Q6 says otherwise"
  technology_skill: "The FastAPI preference names the Agent Skill fastapi as technical guidance, so it is written into the api package entry. It guides planning and implementation only and changes no requirement, scope, Policy, contract, boundary, role, or State authority"
  resolution: "project.md phases the backend second and asks for a running API over all defined models without naming operations, so model_api applies the default operations from the Preferences to every model indexed in config/definition.yaml. It states no language, framework, ORM, or capability choice, so every value under tech, standards, and capabilities comes from the Preferences in .interface/schema/backend.schema.yaml, with every 'latest' resolved to the concrete stable version verified on 2026-09-03 against PyPI and endoflife.date and checked to resolve together on Python 3.14. The database adapter comes from the supported Python + SQLAlchemy + SQLite compatibility entry"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "model_api"
  - "standards"
  - "capabilities"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: "The folder holding the backend's actual code — the one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The backend in one line"
  needs_test: "Whether every code-producing task is proven by a written test"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the backend is answerable for"
  tech: "The resolved technology — language, environment, packages, all with concrete versions, and the technology Skill the Preferences name"
  model_api: "The resolved model-level API intent, applied dynamically to the models in definition.yaml"
  standards: "The resolved naming conventions"
  capabilities: "The resolved state of each optional capability"
  contracts: "The database contract the backend consumes and the runtime HTTP interface it produces"
  boundaries: "What the backend owns, does not own, and offers"
  out_of_scope: "What the backend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Code_Path -->
  code_path: "backend/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the Interface. Database schema, migrations, and seed data live in the database item's code_path, not here"

  # <!-------------------------------------------- Summary -->
  summary: "A FastAPI application over SQLAlchemy that publishes an implemented HTTP API for the thirteen Trading Assistant domain models against the frozen database contract"

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "backend/ — every verify command runs from the item's code_path, inside the uv-managed virtual environment at backend/.venv, invoked through uv run"

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Runs the application behavior of Trading Assistant and publishes the implemented HTTP API for every domain model while consuming the database contract"

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "3.14.7"
      environment:
        name: "uv"
        version: "0.12.9"
        note: "backend/.venv, created and driven by uv and never committed; every command and every install happens through uv run inside code_path"
      packages:
        api:
          name: "FastAPI"
          version: "0.141.1"
          skill: "fastapi"
        orm:
          name: "SQLAlchemy"
          version: "2.0.52"
        database_driver:
          name: "Python sqlite3 standard library"
          note: "Provided by the language runtime — no package is installed for the database adapter"

  # <!-------------------------------------------- Model_API -->
  model_api:
    source: ".interface/config/definition.yaml — content.models"
    default_operations:
      - "create"
      - "list"
      - "get"
      - "update"
      - "delete"
    overrides: {}

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "OpenAPI — the machine-readable description FastAPI generates from the implemented API"
    authentication:
      enabled: false
    https:
      enabled: false

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "The implemented HTTP API for every model in definition.yaml, with the OpenAPI description FastAPI generates from it — the runtime interface a consumer reads from the running backend"
    consumes: "database contract v1 — .interface/config/database.yaml under content.contracts.v1; only its frozen form is built against, and it currently stands at draft"
    rule: "Tasks, the resolved model-level API intent in model_api, the sensitive_data policy, the fastapi technology Skill, and the consumed database contract guide development. Endpoint paths, HTTP method mappings, payloads, response shapes, error shapes, entrypoints, commands, and file layout are produced during implementation rather than prescribed here"

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Application code under backend/"
      - "The runtime database connection and SQLAlchemy ORM mappings matching the frozen database contract"
      - "Validation, services, and the implemented API for every domain model"
      - "The runtime HTTP interface and its framework-generated OpenAPI description"
    does_not_own:
      - "The database engine, storage, schema, migrations, or seed data"
      - "Any user interface"
    interface: "The implemented HTTP API and its framework-generated machine-readable description — nothing else is offered to the outside"

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Creating, altering, dropping, or seeding database objects — the database item owns schema, migrations, and initial data"
    - "Authentication, HTTPS, application logging, and centralized error handling — capabilities disabled"
    - "Tests — needs_test is false"
    - "Executing trades or connecting to Binance, MetaTrader 5, or any platform library — no phase asks for it"
    - "Serving a user interface — no phase targets a frontend"
