# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/backend.yaml"
  path_note: "Generated Config — everything an agent reads to understand the backend item: its resolved technology, standards, layout, and the contract it publishes. Derived by my-interface-interpreter from .interface/project.md and the resolved defaults in .interface/preferences/develop.yaml, according to .interface/schema/backend.schema.yaml"
  schema: ".interface/schema/backend.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-02"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "my-interface-interpreter writes the whole file during a generation run. Planning mode may write settings and a draft contract, never a frozen one. Development and review modes do not write this file"
  changed_by: "The human directly; my-interface-interpreter on regeneration; my-interface-tasker in planning mode within the limits above"
  contract_rule: "A contract version whose lifecycle is frozen is never edited by any agent — see content.contracts.change_rule"
  resolution: "Every technical choice here is either stated in project.md or resolved from a preference default; project.md was silent on all of them, so every value under tech, standards, and capabilities comes from .interface/preferences/develop.yaml"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled"
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "standards"
  - "capabilities"
  - "code_layout"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the backend is in the build"
  code_path: "The folder holding the backend's actual code — the one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The backend in one line"
  needs_test: "Whether every code-producing task is proven by a written test"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the backend is answerable for"
  tech: "The resolved technology — language, environment, packages, database, run command"
  standards: "The resolved naming conventions"
  capabilities: "The resolved state of each optional capability"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The contract the backend publishes — its only connection to other items"
  boundaries: "What the backend owns, does not own, and offers"
  out_of_scope: "What the backend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: true

  # <!-------------------------------------------- Code_Path -->
  code_path: "backend/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the interface."

  # <!-------------------------------------------- Summary -->
  summary: "A FastAPI service over SQLite that stores every Trading Assistant model and serves the API for defining and managing them."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "backend/ — every verify command runs from this directory inside the uv virtual environment, prefixed with uv run."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Manages application data and functionality — the persistence of every project model and the API through which they are defined and managed."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"
    database:
      engine: "SQLite"
      location: "app.db — a single file at the root of code_path, never committed"
      schema_owner: "The backend — the whole schema is its own, and it moves only through Alembic migrations"
      access: "SQLAlchemy sessions obtained from the database module — the only permitted route to the data"
      connection:
        check_same_thread: false
        foreign_keys: true
    run: "uv run fastapi dev app/main.py — from code_path, inside the virtual environment"

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "Docs — the framework's generated OpenAPI documentation, served at /docs with the schema at /openapi.json; ReDoc disabled"
    authentication:
      enabled: false
    https:
      enabled: false

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "pyproject.toml": "The uv project file — the declared dependencies and the Python version"
    "alembic.ini": "Alembic configuration pointing at the migrations folder and the database"
    "alembic/": "Alembic environment and the migration scripts under alembic/versions/ — the only way the schema changes"
    "app.db": "The SQLite database file — created at runtime, never committed"
    "app/": "The application package"
    "app/main.py": "Entry point — creates the FastAPI application and mounts the routers"
    "app/config.py": "Configuration — the database location and application settings"
    "app/database.py": "Database access — the engine, the session factory, the declarative base, and the SQLite connection settings"
    "app/models/": "One SQLAlchemy model per project model, one file each"
    "app/schemas/": "One validation schema module per project model — the request and response shapes"
    "app/services/": "One service module per project model — the business logic every route calls"
    "app/routes/": "One router module per project model — the routes of the contract, nothing more"
    "app/errors.py": "The single error shape and the handlers that render every failure in it"
    "tests/": "Reserved for tests — empty while needs_test is false"

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "v1"
    rule: "The implementation matches the frozen contract exactly — every route, body, response, and error code it names, and nothing it does not name."
    change_rule: "A frozen contract is never edited. A change means a new version, and freezing or versioning a contract is the human's decision — an agent raises it as an open question."

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — the models are copied from project.md as stated, and the route set is derived from the phase goal 'Create and run the API for all defined project models' and the product's promise to define and manage them; the project states no route explicitly. Until the human confirms the surface and freezes this version, no consumer may define against it, and the surface may still change at no cost beyond re-planning. Once frozen, any change costs a new version."
      consumed_by: "frontend"
      contract_read_order: "conventions, then error_shape, then models, then routes — the routes only make sense once the shared behavior and the shapes they carry are known."

      conventions:
        transport: "HTTP with JSON request and response bodies; plain HTTP, no HTTPS"
        base_path: "/ — every route is mounted at the root, one resource path per model"
        identifiers: "Every model carries an ID field, assigned by the backend on creation and never supplied by the caller; its type is not stated by the project"
        timestamps: "None — the project states no timestamp field on any model"
        unknown_id: "A path that names an id no row carries answers 404 with the error shape and code not_found"
        unknown_reference: "A body that names a referenced id no row carries — a Broker's Trading Platform ID, an Account's Broker ID, and so on — answers 422 with the error shape and code validation_error, naming the field"
        status_and_state: "Every model carries a Status field, and Execute additionally a State field; their permitted values are not stated by the project and are outside this contract"

      error_shape:
        rule: "Every failure, from any route, is one JSON object with a single top-level key error; a consumer never has to branch on anything else"
        fields:
          error.code: "One of the codes below — the value a consumer branches on"
          error.message: "A human-readable sentence stating what went wrong, never a stack trace, path, SQL, or internal identifier"
          error.field: "The name of the offending field when the failure concerns one field, absent otherwise"
        codes:
          validation_error: "422 — the body or a query parameter failed validation, or referenced an id that does not exist"
          not_found: "404 — the id in the path names no row"

      models:
        TradingPlatform:
          purpose: "The trading integration used to execute trades — initially Binance and MetaTrader 5; each platform can provide its own development interface through its related library"
          fields: ["ID", "Name", "Status", "Description"]
        Broker:
          purpose: "A broker, its broker-specific parameters, and the trading platform it uses; the parent of its trading accounts"
          fields: ["ID", "Name", "Trading Platform ID", "Status", "Description"]
          references: {"Trading Platform ID": "TradingPlatform"}
        Account:
          purpose: "A trading account that belongs to a specific broker and is used to perform trading operations"
          fields: ["ID", "Name", "Username", "Password", "Broker ID", "Status", "Description"]
          references: {"Broker ID": "Broker"}
          note: "Password is never returned in any response; its storage at rest is an open question in state.yaml"
        Asset:
          purpose: "A tradable asset and its related parameters, such as EURUSD or XAUUSD"
          fields: ["ID", "Name", "Status", "Description"]
        Strategy:
          purpose: "The trading settings used by an action, including values such as stop loss and take profit"
          fields: ["ID", "Name", "Risk Parameter", "Status", "Description"]
        TrailingGroup:
          purpose: "A group for the rules that decide when and how stop loss and take profit change during a trade"
          fields: ["ID", "Name", "Status", "Description"]
        TrailingRule:
          purpose: "An individual rule within a trailing group — for example, when profit reaches a percentage of the take-profit target, adjust take profit and stop loss"
          fields: ["ID", "Name", "Trailing Group ID", "Status", "Description"]
          references: {"Trailing Group ID": "TrailingGroup"}
        PartialGroup:
          purpose: "A group of rules for closing all or part of a position at specified profit levels, such as 10%, 30%, or the entire position"
          fields: ["ID", "Name", "Status", "Description"]
        PartialRule:
          purpose: "An individual rule within a partial group — the profit threshold and the portion of the position to close when it is reached"
          fields: ["ID", "Name", "Partial Group ID", "Profit Threshold", "Close Portion", "Status", "Description"]
          references: {"Partial Group ID": "PartialGroup"}
        ActionGroup:
          purpose: "Groups trading actions by an operating or risk profile, such as Standard or High Risk"
          fields: ["ID", "Name", "Status", "Description"]
        Action:
          purpose: "A trading action within an action group combining an asset, an account, and a strategy"
          fields: ["ID", "Name", "Asset ID", "Account ID", "Strategy ID", "Group ID", "Status", "Description"]
          references: {"Asset ID": "Asset", "Account ID": "Account", "Strategy ID": "Strategy", "Group ID": "ActionGroup"}
        Execute:
          purpose: "Tracks actions that have been activated and executed, including the current stage and state of each execution"
          fields: ["ID", "Name", "Action ID", "Profit", "State", "Status", "Description"]
          references: {"Action ID": "Action"}
        Position:
          purpose: "The complete information for a position created from an executed order — entry price, take profit, stop loss, and the settings applied through its related groups"
          fields: ["ID", "Name", "Entry Price", "Take Profit", "Stop Loss", "Status", "Description"]

      routes:
        pattern: "Every model exposes the same five routes on its resource path: list, create, read one, update one, delete one. The body of create and update carries every field of the model except ID; a response carries every field of the model, ID included, and never the Account Password."
        resources:
          TradingPlatform: "/trading-platforms"
          Broker: "/brokers"
          Account: "/accounts"
          Asset: "/assets"
          Strategy: "/strategies"
          TrailingGroup: "/trailing-groups"
          TrailingRule: "/trailing-rules"
          PartialGroup: "/partial-groups"
          PartialRule: "/partial-rules"
          ActionGroup: "/action-groups"
          Action: "/actions"
          Execute: "/executes"
          Position: "/positions"
        per_resource:
          - method: "GET"
            path: "<resource>"
            summary: "List every row of the model"
            body: "none"
            success: "200 — a JSON array of the model"
            errors: []
          - method: "POST"
            path: "<resource>"
            summary: "Create one row of the model"
            body: "Every field of the model except ID"
            success: "201 — the created model, ID included"
            errors: ["validation_error"]
          - method: "GET"
            path: "<resource>/{id}"
            summary: "Read one row by id"
            body: "none"
            success: "200 — the model"
            errors: ["not_found"]
          - method: "PUT"
            path: "<resource>/{id}"
            summary: "Replace one row by id"
            body: "Every field of the model except ID"
            success: "200 — the updated model"
            errors: ["validation_error", "not_found"]
          - method: "DELETE"
            path: "<resource>/{id}"
            summary: "Delete one row by id"
            body: "none"
            success: "204 — no body"
            errors: ["not_found"]

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under backend/"
      - "The whole database schema and every migration that moves it"
      - "The API contract it publishes"
    does_not_own:
      - "Client code — anything under frontend/"
      - "The design of any page"
    interface: "Contract v1 under content.contracts — the only thing the backend offers the outside"

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Executing trades or any trading operation through a platform's library — the project names Binance and MetaTrader 5 as integrations, but no phase assigns that work"
    - "Evaluating trailing or partial rules against live prices — the models are stored and managed, not run"
    - "Authentication, sessions, and per-user ownership — no capability asks for them"
    - "HTTPS, application logging, and a centralized error layer beyond the framework's own — disabled by preference default"
    - "Written tests — needs_test is false"
