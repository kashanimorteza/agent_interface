  boundaries: "What the backend owns, does not own, and offers"
  out_of_scope: "What the backend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: true

  # <!-------------------------------------------- Code_Path -->
  code_path: "backend/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the interface."

  # <!-------------------------------------------- Summary -->
  summary: "A FastAPI service over a SQLite database that stores every model the project defines and serves a keyed HTTP API for them."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "backend/ — every verify command runs from this folder, inside the uv virtual environment it holds, as `uv run <command>`."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "The backend is answerable for the data of the Trading Assistant — every model, its storage, its schema, and the API through which the frontend and any other caller reads and writes it."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "Python"
      version: "latest"
      environment:
        name: "uv"
        version: "latest"
      packages:
        api:
          name: "FastAPI"
          version: "latest"
          note: "Installed with its standard extra, which carries the ASGI server the run command needs; no further package is named by the project."
        orm:
          name: "SQLAlchemy"
          version: "latest"
        migration:
          name: "Alembic"
          version: "latest"
          note: "Alembic is the migration framework used for database schema changes."
    database:
      engine: "SQLite"
      location: "app.db — a single file at the root of code_path, never committed"
      schema_owner: "The backend — no other item creates, alters, or reads its tables"
      route: "Only through the SQLAlchemy models and the session the database module provides; the schema moves only through Alembic migrations"
    run: "uv run fastapi dev app/main.py — from code_path, inside the virtual environment"

  # <!-------------------------------------------- Standards -->
  standards:
    naming:
      variables: "snake_case"
      functions: "snake_case"
      classes: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "snake_case"
      folders: "snake_case"

  # <!-------------------------------------------- Capabilities -->
  capabilities:
    error_handling:
      enabled: false
    logging:
      enabled: false
    api_documentation:
      enabled: true
      type: "OpenAPI served as Docs — the framework's interactive documentation page at /docs; ReDoc is disabled"
    authentication:
      enabled: false
    https:
      enabled: false
    api_key:
      enabled: true
      note: "Every request carries a key URL parameter; the accepted value is read from the environment, never committed"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "pyproject.toml": "Project metadata and the dependencies uv installs"
    "uv.lock": "The lock file uv writes — committed, never edited by hand"
    ".venv/": "The virtual environment uv creates — never committed"
    ".gitignore": "Keeps .venv/, app.db, and local environment files out of the repository"
    "alembic.ini": "Alembic configuration pointing at migrations/"
    "app.db": "The SQLite database file — never committed"
    "app/": "The application package"
    "app/__init__.py": "Marks the package"
    "app/main.py": "Entry point — creates the FastAPI app, enables Docs, disables ReDoc, and mounts every router behind the key dependency"
    "app/config.py": "Configuration read from the environment — the database file path and the accepted API key"
    "app/database.py": "Engine, session factory, and the declarative base; enables SQLite foreign-key enforcement on every connection"
    "app/dependencies.py": "The key dependency — reads the key URL parameter and answers 401 when it is missing or does not match"
    "app/models/": "One SQLAlchemy model per project model, one file each"
    "app/schemas/": "One Pydantic schema module per project model — the create/replace body and the response shape"
    "app/services/": "One service module per project model — the list, create, read, replace, and delete logic"
    "app/routes/": "One router per project model — validates input, calls the service, returns the result"
    "migrations/": "Alembic environment and its versions/ folder — the only way the schema changes"

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "v1"
    rule: "The implementation must match the contract version it serves exactly — every route the contract lists exists, and no route exists that the contract does not list."
    change_rule: "A frozen contract is versioned, never edited — a change means a new version entry, and creating or freezing one is the human's decision. A draft may be refined in planning mode until the human freezes it."

    v1:
      lifecycle: "draft"
      lifecycle_note: "Draft — derived from project.md by the interpreter and refinable in planning mode; the frontend may read it but may only be defined against it once the human freezes it. Freezing costs nothing now; a change after freezing costs a v2."
      consumed_by: "frontend"
      contract_read_order:
        - "conventions — what holds everywhere, read first so nothing below is re-stated"
        - "error_shape — the one failure shape, so a consumer branches on codes not text"
        - "models — the data shapes the routes carry"
        - "routes — the surface itself, read last"

      conventions:
        transport: "HTTP, JSON request and response bodies, UTF-8; plain HTTP, no TLS."
        base_path: "No prefix — routes are served at the paths listed."
        key: "Every route requires the key URL query parameter (?key=...); a request whose key is missing or does not match the configured value is answered 401 before anything else."
        identifiers: "id is an integer assigned by the backend on create; the caller never sends it and never chooses it."
        references: "A field ending in _id holds the id of an existing row of the referenced model; the referenced model is named on the field."
        unknown_id: "A route that names an id no row carries answers 404."
        timestamps: "No model states a timestamp field, so none is part of this contract."
        collections: "A list route returns every row as a JSON array; no paging, filtering, or sorting is stated by the project, so none is part of v1."
        documentation: "The OpenAPI document and the Docs page describe exactly the routes below."

      error_shape:
        rule: "Every failure takes the framework's built-in shape, because centralized error handling is switched off — a consumer branches on the status code, never on the text."
        fields:
          detail: "A string for 401 and 404; for 422 the framework's list of validation errors, each naming the location, message, and type."
        codes:
          401: "The key URL parameter is missing or does not match."
          404: "The id in the path names no row of that model."
          422: "The request body or a path parameter failed validation."

      models:
