# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Application Schema and preserve valid public metadata."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read public metadata by canonical Component identifier."
  selection: "Select the section whose key is the Component being described."
  absence: "An empty section means that its owner has published no public metadata."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "components"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  components: "Public metadata for each declared Implementation Component."

# <!--------------------------------------------------------------------------------- Content -->
content:
  components:
    development: {}
    model:
      package_name: "my_model"
      path: "my_model/"
      public_entrypoint: "my_model.model_interface"
      public_interface: "Fifteen Entity classes (User, TradingPlatform, Instance, Currency, Broker, Asset, AccountGroup, Account, TrailingGroup, TrailingRule, PartialGroup, PartialRule, ActionGroup, Action, Position), each with a declaration and JSON conversion (to_json, from_json), presented with the ModelDeclaration and ModelFoundation capabilities. Layers my_model.entity, my_model.model_declaration and my_model.model_foundation are also public."
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    configure: {}
    plan: {}
    develop: {}
    review: {}
    implement: {}
    launch: {}
    reset: {}
    state: {}
