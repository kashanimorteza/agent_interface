# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/application.yaml"
  path_note: "Shared Application Manifest public Component metadata."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Application Schema and preserve valid public metadata."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read public metadata by canonical Component identifier."
  selection: "Select the section whose key is the Component being described."
  absence: "An empty section means that its owner has published no public metadata."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "components"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  components: "Public metadata for each declared Implementation Component."

# <!--------------------------------------------------------------------------------- Content -->
content:
  components:
    development: {}
    model:
      package_name: "my_model"
      path: "my_model"
      public_entrypoint: "my_model.model_interface"
      public_interface:
        entities: ["Account", "AccountGroup", "Action", "ActionGroup", "Asset", "Broker", "Currency", "Instance", "PartialGroup", "PartialRule", "Position", "TradingPlatform", "TrailingGroup", "TrailingRule", "User"]
        capabilities: ["ModelFoundation", "ModelDeclaration", "FieldDeclaration", "ReferenceDeclaration", "LogicalType", "ValueGeneration", "NO_DEFAULT"]
        layers:
          interface: "my_model.model_interface"
          entity: "my_model.entity"
          declaration: "my_model.model_declaration"
          foundation: "my_model.model_foundation"
    database: {}
    logic: {}
    api: {}
    presentation: {}
    platform: {}
    configure: {}
    plan: {}
    develop: {}
    review: {}
    implement: {}
    launch: {}
    reset: {}
    state: {}
