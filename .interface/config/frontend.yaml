# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Config layer of the Agent Project Interface — the frontend item's configuration, generated from Phase 1 of project.md by my-interface-interpreter"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Planning mode may write settings and draft contracts here, never a frozen contract — per content.modes in root.yaml"
  changed_by: "my-interface-interpreter on regeneration from project.md; my-interface-tasker in planning mode for settings and draft contracts; the human at any time"
  frozen_contracts: "A contract version whose lifecycle is frozen is never edited by any agent — a change means a new version, decided by the human"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled, code_path, code_path_note, summary — whether and where this item is in play"
  - "needs_test, verify_cwd — how work on it is proven"
  - "responsibility, tech — what it is answerable for and what it is built with"
  - "code_layout — where everything lives inside code_path"
  - "contracts — what it publishes and consumes"
  - "boundaries, out_of_scope — its limits, read last"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the frontend is in the build"
  code_path: "The one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The frontend in one line"
  needs_test: "Whether tasks are proven by written tests"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the frontend is answerable for"
  tech: "What the frontend is built with — never re-decided by an agent"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "What the frontend publishes and what it consumes"
  boundaries: "What the frontend owns, does not own, and offers"
  out_of_scope: "What the frontend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: false
  enabled_note: "The frontend is defined by the project but no defined phase targets it — Phase 1 targets the backend only. The entry stands; the item is out of the build."

  # <!-------------------------------------------- Code_Path -->
  code_path: "to be defined"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, outside .interface/ — the project does not yet name the folder holding the frontend's code; see open question Q2 in config/state.yaml."

  # <!-------------------------------------------- Summary -->
  summary: "A Next.js/React TypeScript application providing the user interface over the backend's API."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "The frontend's code_path (to be defined — Q2), inside its npm-managed environment (node_modules, never committed)."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "The frontend provides the user interface for interacting with the application — everything the user sees and touches, built entirely on the backend's contract."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "TypeScript"
      version: "to be defined"
      library: "React"
      framework: "Next.js"
      package_manager: "npm"
    database: "None — the frontend owns no database; all data comes through the backend's contract."
    environment: "The npm-managed environment of code_path (node_modules), never committed."
    run: "npm run dev — from code_path"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    note: "to be defined — no phase targets the frontend yet; the layout is settled when one does."

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "None — the frontend publishes no contract."
    consumes: "The backend's contract — .interface/config/backend.yaml under content.contracts, and only a frozen version of it."
    rule: "The frontend builds only against a frozen backend contract version, never against a draft."
    change_rule: "A frozen contract is versioned, never edited; adopting a new version is a human decision."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under its code_path"
      - "The user interface and its presentation logic"
    does_not_own:
      - "The database, the application data, or the API surface — however close they sit"
    interface: "The user interface itself — the frontend offers no contract to other items."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Everything, until a phase targets the frontend — Phase 1 targets the backend only"
    - "Owning or reaching the database directly — data is reached only through the backend's contract"
    - "Written tests — disabled by the project"
