# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/frontend.yaml
  path_note: 'Generated configuration of the Frontend Component — Frontend-wide technology and the resolved Presentation, Interaction Logic, and API Access layers. Shape: schema/frontend.yaml; rules: principles/frontend.md; defaults: preferences/frontend.yaml'
  standard: Agent Project Interface
  schema_version: '7.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: Written only by the configuring operation. Planning and development read it and never write it
  changed_by: The human, directly, or by re-running the configuring operation
  resolution: project.md states no Frontend technology. Language, library, framework, package manager, API client, Theme, and layer defaults were resolved from preferences/frontend.yaml; each latest token was resolved to the concrete stable version verified against the npm registry on 2026-09-06. Routes, pages, and Model operations were derived from config/model.yaml and the Frontend-targeted Behaviour from config/definition.yaml
  agent_selected: 'The route, page, and Component set is the smallest composition that realizes the one project Behaviour for every Model: one management page per Model composed from eight reusable Components. TypeScript 7.0.2 is the registry''s current stable release; the framework declares no TypeScript peer constraint, so if its type checking rejects it during implementation the development operation may pin the latest 6.x release (6.0.3) and record that in the Task log. Node.js 24 LTS satisfies the framework''s engine requirement and is recorded in development.yaml'


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- code_path
- code_path_note
- summary
- verify_cwd
- responsibility
- tech
- standards
- layers
- boundaries
- out_of_scope


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: The folder holding Frontend implementation artifacts
  code_path_note: What code_path is relative to
  summary: The Frontend in one line
  verify_cwd: The directory and environment for Frontend verification commands
  responsibility: The resolved responsibilities of Frontend
  tech: The resolved Frontend-wide language, library, framework, package manager, run command, and packages
  standards: The resolved naming and Component conventions
  layers: The resolved Presentation, Interaction Logic, and API Access layers
  boundaries: What Frontend owns, does not own, and offers outside
  out_of_scope: Work explicitly outside Frontend


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- code_path -->
  code_path: frontend/

  # <!-------------------------------------------- code_path_note -->
  code_path_note: Relative to the project root — the directory containing .interface/. It is never a path inside the Interface.

  # <!-------------------------------------------- summary -->
  summary: A TypeScript Next.js web application whose Presentation composes reusable Components into one management page per Model, whose Interaction Logic coordinates entering and managing records, and whose API Access consumes the Backend API through Fetch.

  # <!-------------------------------------------- verify_cwd -->
  verify_cwd: frontend/ — every verify command runs from this directory through the npm package manager against the locally installed node_modules, which is never committed.

  # <!-------------------------------------------- responsibility -->
  responsibility: Presents the application to users through composed Components, manages user interaction and user-interface state, and reaches application data only through API Access to the Backend API.

  # <!-------------------------------------------- tech -->
  tech:
    language:
      name: TypeScript
      version: 7.0.2
    library:
      name: React
      version: 19.2.8
    framework:
      name: Next.js
      version: 16.3.4
      router: App Router
    package_manager:
      name: npm
      version: 12.0.2
    run: npm run dev
    packages: {}

  # <!-------------------------------------------- standards -->
  standards:
    naming:
      variables: camelCase
      functions: camelCase
      classes: PascalCase
      components: PascalCase
      constants: UPPER_SNAKE_CASE
      files: kebab-case
      folders: kebab-case
    component_style: Function components

  # <!-------------------------------------------- layers -->
  layers:
    presentation:
      responsibility: Renders pages and views by composing reusable user-interface Components under one coherent Theme. A page coordinates Components and never absorbs interaction or application logic.
      component_architecture: reusable_composition — focused, composable Components reused wherever the same interface concept appears; no monolithic pages or duplicated fragments.
      theme:
        name: Default
        color_mode: system
        direction: auto
        token_based: true
        tokens: {}
      routes:
        home:
          path: /
          title: Home
          page: home
        user:
          path: /user
          title: Users
          page: user_management
        currency:
          path: /currency
          title: Currencies
          page: currency_management
        trading_platform:
          path: /trading-platform
          title: Trading Platforms
          page: trading_platform_management
        broker:
          path: /broker
          title: Brokers
          page: broker_management
        account:
          path: /account
          title: Accounts
          page: account_management
        asset:
          path: /asset
          title: Assets
          page: asset_management
        trailing_group:
          path: /trailing-group
          title: Trailing Groups
          page: trailing_group_management
        trailing_rule:
          path: /trailing-rule
          title: Trailing Rules
          page: trailing_rule_management
        partial_group:
          path: /partial-group
          title: Partial Groups
          page: partial_group_management
        partial_rule:
          path: /partial-rule
          title: Partial Rules
          page: partial_rule_management
        action_group:
          path: /action-group
          title: Action Groups
          page: action_group_management
        action:
          path: /action
          title: Actions
          page: action_management
        position:
          path: /position
          title: Positions
          page: position_management
      pages:
        home:
          responsibility: The entry into data management — presents the navigation to every Model's management page.
          components:
          - app_shell
          - navigation
          behaviours: []
          models: []
        user_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables User records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - user
        currency_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Currency records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - currency
        trading_platform_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Trading Platform records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - trading_platform
        broker_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Broker records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - broker
        account_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Account records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - account
        asset_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Asset records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - asset
        trailing_group_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Trailing Group records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - trailing_group
        trailing_rule_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Trailing Rule records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - trailing_rule
        partial_group_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Partial Group records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - partial_group
        partial_rule_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Partial Rule records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - partial_rule
        action_group_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Action Group records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - action_group
        action_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Action records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - action
        position_management:
          responsibility: Lists, creates, edits, deletes, and enables or disables Position records.
          components:
          - app_shell
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
          behaviours:
          - enable_users_to_enter_and_manage_all_defined_project_data
          models:
          - position
      components:
        app_shell:
          responsibility: The persistent application frame — header, navigation region, and content area — that every page renders inside.
          kind: layout
          reusable: true
          uses_components:
          - navigation
          - notification
          models: []
        navigation:
          responsibility: Links to the home page and to the management page of every Model.
          kind: navigation
          reusable: true
          uses_components: []
          models: []
        data_table:
          responsibility: Lists the records of one Model with its fields as columns, with row actions to edit, delete, and enable or disable a record.
          kind: table
          reusable: true
          uses_components:
          - status_toggle
          models: []
        record_form:
          responsibility: Creates or edits one record of one Model, composing one form field per editable Model field and treating credential fields as write-only input.
          kind: form
          reusable: true
          uses_components:
          - form_field
          models: []
        form_field:
          responsibility: Renders one Model field for input according to its logical type — text, number, boolean, date-time, or a selection of related records for a relationship field.
          kind: input
          reusable: true
          uses_components: []
          models: []
        confirm_dialog:
          responsibility: Asks the user to confirm a destructive action such as delete before it is sent.
          kind: dialog
          reusable: true
          uses_components: []
          models: []
        status_toggle:
          responsibility: Enables or disables one record by updating its status field.
          kind: control
          reusable: true
          uses_components: []
          models: []
        notification:
          responsibility: Shows the outcome of an operation — success or the error returned by the Backend API.
          kind: feedback
          reusable: true
          uses_components: []
          models: []
    interaction_logic:
      responsibility: Manages user-interface state — input, form state, selection, navigation intent, loading and error state — and coordinates Presentation Components. Performs interaction-level validation only; authoritative rules remain in Backend Logic.
      state_management:
        strategy: framework-native — React state and hooks with Next.js App Router data flow; no external state library
      behaviours:
        enable_users_to_enter_and_manage_all_defined_project_data:
          source: .interface/config/definition.yaml — content.behaviours.enable_users_to_enter_and_manage_all_defined_project_data
          description: Enable users to enter and manage all defined project data. The user-interface flow lists a Model's records, opens a form to create or edit one, confirms before deleting, toggles enabled state, and shows the outcome of every operation.
          models:
          - user
          - currency
          - trading_platform
          - broker
          - account
          - asset
          - trailing_group
          - trailing_rule
          - partial_group
          - partial_rule
          - action_group
          - action
          - position
          components:
          - data_table
          - record_form
          - confirm_dialog
          - status_toggle
          - notification
    api_access:
      responsibility: The only Frontend boundary that communicates with Backend. Owns the client, request and response transport, and translation between API representations and the data used by Interaction Logic.
      uses: Backend API — .interface/config/backend.yaml content.layers.api, reached at the base URL supplied by runtime configuration
      contract_source: The Backend's framework-generated OpenAPI description, served by the running Backend
      client:
        name: Fetch
        version: runtime-provided — the Fetch API of the browser and the Node.js runtime
      generated_types: true
      model_operations:
        source: .interface/config/backend.yaml — content.layers.api.model_api
        operations:
          user: &id001
          - create
          - get
          - list
          - update
          - delete
          currency: *id001
          trading_platform: *id001
          broker: *id001
          account: *id001
          asset: *id001
          trailing_group: *id001
          trailing_rule: *id001
          partial_group: *id001
          partial_rule: *id001
          action_group: *id001
          action: *id001
          position: *id001
      behaviours:
        enable_users_to_enter_and_manage_all_defined_project_data:
          source: .interface/config/backend.yaml — content.layers.api.behaviours.enable_users_to_enter_and_manage_all_defined_project_data
          used_by: content.layers.interaction_logic.behaviours.enable_users_to_enter_and_manage_all_defined_project_data
      rule: Frontend reaches application data and capabilities only through the Backend API as described by its generated OpenAPI document. It never connects to Database, never imports Backend implementation code, depends on no endpoint definition stored in Interface configuration, and treats credential fields as write-only input.

  # <!-------------------------------------------- boundaries -->
  boundaries:
    owns: Presentation, user-interface interaction and state, the API client boundary, and the visual system.
    does_not_own: Application persistence, Database access, authoritative application Behaviour, Backend API implementation, and cross-layer composition.
    interface: The user-facing web application served to the browser; it publishes no interface to another layer.

  # <!-------------------------------------------- out_of_scope -->
  out_of_scope:
  - Connecting to Database or reading the database file.
  - Redefining or copying domain Models — they are read from model.yaml and reflected through the Backend API.
  - User authentication, session handling, application logging, and automated tests — every cross-cutting capability is disabled in development.yaml.
  - Live trading, charting, or market-data features beyond entering and managing the defined data.
