# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Generated configuration of the frontend item — every resolved parameter an agent reads to understand the frontend. Its shape is schema/frontend.yaml, its rules are principles/frontend.md, and its unstated choices were resolved from preferences/frontend.yaml"
  standard: "Agent Project Interface"
  schema_version: "6.0"
  generated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Written by the generation operation. The planning operation may write planning-owned settings and relationships only, and only while the active phase targets this item. Development and review never write it. Downstream operations consume the resolved values here and never reinterpret the preferences"
  changed_by: "The generation operation, the planning operation within its authority, or the human directly"
  resolution: "project.md states no frontend technology. Every choice under tech, standards, and capabilities was resolved from preferences/frontend.yaml; each latest token was resolved to the concrete stable version verified against the npm registry on 2026-09-05"
  agent_selected: "TypeScript 7.0.2 is the registry's current stable release. The framework declares no TypeScript peer constraint, so compatibility with it could not be confirmed from package metadata; if the framework's type checking rejects it during implementation, the development operation may pin the latest 6.x release (6.0.3) and record that in the task log. Node.js 24 LTS satisfies the framework's engine requirement and is recorded under runtime in development.yaml"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "standards"
  - "capabilities"
  - "code_layout"
  - "interfaces"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: "The folder holding the frontend's actual code — the one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The frontend in one line"
  needs_test: "Whether every code-producing task is proven by a written test"
  verify_cwd: "The directory and environment every verify command runs inside"
  responsibility: "What the frontend is answerable for"
  tech: "The resolved language, UI library, framework, package manager, and run command"
  standards: "The resolved naming and component conventions"
  capabilities: "The resolved state of optional frontend capabilities"
  code_layout: "Every path inside code_path and what it holds"
  interfaces: "The backend HTTP interface the frontend consumes and what it publishes"
  boundaries: "What the frontend owns, does not own, and offers outside"
  out_of_scope: "What the frontend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- code_path -->
  code_path: "frontend/"

  # <!-------------------------------------------- code_path_note -->
  code_path_note: "Relative to the project root — the directory containing .interface/. It is never a path inside the Interface."

  # <!-------------------------------------------- summary -->
  summary: "A TypeScript Next.js web application that lets users enter and manage every domain model through the backend's HTTP API."

  # <!-------------------------------------------- needs_test -->
  needs_test: false

  # <!-------------------------------------------- verify_cwd -->
  verify_cwd: "frontend/ — every verify command runs from this directory through the npm package manager against the locally installed node_modules, which is never committed."

  # <!-------------------------------------------- responsibility -->
  responsibility: "Provides the user interface and consumes the backend's implemented HTTP API."

  # <!-------------------------------------------- tech -->
  tech:
    language:
      name: "TypeScript"
      version: "7.0.2"
    library:
      name: "React"
      version: "19.2.8"
    framework:
      name: "Next.js"
      version: "16.3.4"
      router: "App Router"
    package_manager:
      name: "npm"
      version: "12.0.2"
    run: "npm run dev"

  # <!-------------------------------------------- standards -->
  standards:
    naming:
      variables: "camelCase"
      functions: "camelCase"
      classes: "PascalCase"
      components: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "kebab-case"
      folders: "kebab-case"
    component_style: "Function components"

  # <!-------------------------------------------- capabilities -->
  capabilities:
    logging:
      enabled: false

  # <!-------------------------------------------- code_layout -->
  code_layout:
    package.json: "npm manifest — dependencies, scripts including the run command."
    package-lock.json: "npm lockfile — committed so installs are reproducible."
    tsconfig.json: "TypeScript compiler configuration."
    next.config.ts: "Next.js framework configuration."
    app/: "App Router root — routes, layouts, and pages."
    app/layout.tsx: "Root layout and application entry point."
    app/page.tsx: "Home page — the entry into data management."
    app/globals.css: "Global styles."
    app/<model>/: "One route segment per domain model from model.yaml, in kebab-case, holding its list, create, and edit pages."
    components/: "Shared UI components — tables, forms, inputs, navigation."
    lib/api/: "Client integration — the HTTP client and typed calls built from the backend's generated OpenAPI description."
    lib/: "Shared non-UI helpers."
    public/: "Static assets served as-is."
    tests/: "Frontend tests — empty while needs_test is false."

  # <!-------------------------------------------- interfaces -->
  interfaces:
    provides: "none"
    uses: "The backend's implemented HTTP API and its framework-generated OpenAPI description, reached at the API base URL supplied by runtime configuration."
    rule: "The frontend follows the backend's implemented interface as described by its generated API description. It does not depend on endpoint definitions stored in Interface Config, never connects to the database item, never imports backend code, and treats credential fields as write-only input."

  # <!-------------------------------------------- boundaries -->
  boundaries:
    owns: "Pages, components, browser-side behavior, styles, and the client integration with the implemented backend HTTP API."
    does_not_own: "Backend behavior and every part of the database item."
    interface: "The user-facing web application served to the browser; it publishes no interface to another item."

  # <!-------------------------------------------- out_of_scope -->
  out_of_scope:
    - "Connecting to the database or reading the database file."
    - "Redefining or copying domain models — they are read from model.yaml and reflected through the backend API."
    - "User authentication or session handling — the backend API is open in this configuration."
    - "Live trading, charting, or market-data features beyond entering and managing the defined data."
    - "Application logging — disabled above."
