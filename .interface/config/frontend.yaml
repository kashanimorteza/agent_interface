# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Config layer of the Agent Project Interface — the frontend item's configuration, generated from Phase 1 of project.md by my-interface-interpreter"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Planning mode may write settings and draft contracts here, never a frozen contract — per content.modes in root.yaml. Development and review may not write this file at all"
  changed_by: "my-interface-interpreter on regeneration from project.md; my-interface-tasker in planning mode; the human at any time"
  frozen_contracts: "A contract version whose lifecycle is frozen is never edited by any agent — a change means a new version, and that is the human's decision"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled, code_path, code_path_note, summary — whether this item is in play and where it lives"
  - "needs_test, verify_cwd — how work on it is proven"
  - "responsibility, tech — what it answers for and what it is built with"
  - "code_layout — where everything sits inside code_path"
  - "contracts — what it publishes and what it consumes"
  - "boundaries, out_of_scope — its limits, read last"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the frontend is in the build"
  code_path: "The one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The frontend in one line"
  needs_test: "Whether tasks are proven by written tests"
  verify_cwd: "Where, and inside what, every verify command runs"
  responsibility: "What the frontend is answerable for"
  tech: "What the frontend is built with — never re-decided by an agent"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "What the frontend publishes and what it consumes"
  boundaries: "What the frontend owns, does not own, and offers"
  out_of_scope: "What the frontend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: false
  enabled_note: "The project defines the frontend as a part of the product, but Phase 1 targets the backend and no defined phase targets the frontend. The entry stands; the item is out of the build until a phase names it."

  # <!-------------------------------------------- Code_Path -->
  code_path: "to be defined"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "A folder relative to the repository root, outside .interface/ — never a path inside the interface. The project names no folder for the frontend's code; see open question Q2 in config/state.yaml."

  # <!-------------------------------------------- Summary -->
  summary: "A Next.js and React application written in TypeScript, providing the user interface over the backend's API."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "The frontend's code_path — to be defined, see Q2 — inside its npm-managed environment."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "The frontend is answerable for everything the user sees and touches — the interface through which the application is used, built entirely on the backend's contract."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "TypeScript"
      version: "to be defined"
      library: "React"
      framework: "Next.js"
      package_manager: "npm"
    database: "None — the frontend owns no data engine; everything it shows comes through the backend's contract."
    environment: "The npm-managed environment inside code_path — node_modules, never committed."
    run: "npm run dev, from code_path"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    note: "to be defined — no phase targets the frontend yet, and the project states no layout for it. The layout is settled when a phase names this item."

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "None — the frontend publishes no contract; it is a consumer only."
    consumes: "The backend's contract — .interface/config/backend.yaml under content.contracts — and only a version whose lifecycle is frozen."
    rule: "The frontend is built against a frozen backend contract version and never against a draft; contract v1 is currently draft."
    change_rule: "A frozen contract is versioned, never edited; adopting a new version is the human's decision."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under its code_path"
      - "The user interface and its presentation logic"
    does_not_own:
      - "The database, the application data, and the API surface — however close they sit to what it displays"
    interface: "The user interface itself — the frontend offers no contract to any other item."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Everything, until a phase targets this item — Phase 1 targets the backend alone"
    - "Owning or reaching the database directly — its data comes only through the backend's contract"
    - "Written tests — switched off by the project"
