# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Generated frontend item configuration — produced only by my-interface-interpreter, resolved from project.md, definition.yaml, and schema/frontend.schema.yaml"
  standard: "Agent Interface Frontend"
  schema: ".interface/schema/frontend.schema.yaml"
  version: "4.0"
  updated: "2026-09-04"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: "Only my-interface-interpreter during a generation run, and my-interface-tasker for planning-owned settings while planning phase P3"
  rule: "The frontend reaches application data only through the backend's implemented HTTP API and its generated machine-readable description — see schema/frontend.schema.yaml policy. It never connects to the database item or imports backend implementation code"
  code_boundary: "Only files under content.code_path may be written by development, and only within the touches of a claimed task for phase P3"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "standards"
  - "capabilities"
  - "code_layout"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  code_path: "The one folder the frontend item may write"
  summary: "The frontend in one line"
  needs_test: "Whether frontend code must be proven by a written test"
  verify_cwd: "Where and how frontend verification commands run"
  responsibility: "What the frontend is answerable for"
  tech: "The resolved language, library, framework, package manager, and run command"
  standards: "Naming and component conventions"
  capabilities: "The frontend logging switch"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The backend HTTP interface consumed"
  boundaries: "The limits of the frontend"
  out_of_scope: "What the frontend explicitly does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  code_path: "frontend/"
  code_path_note: "Relative to the repository root, not the Interface — the only place the frontend item may write."
  summary: "The Trading Assistant's frontend — a Next.js application for entering and managing all defined project data through the backend API."
  needs_test: false
  verify_cwd: "frontend/, inside its npm-managed project"
  responsibility: "Provides the user interface and consumes the backend's implemented HTTP API."

  tech:
    language:
      name: "TypeScript"
      version: "7.0.2"
    library:
      name: "React"
      version: "19.2.8"
    framework:
      name: "Next.js"
      version: "16.3.4"
    package_manager:
      name: "npm"
      version: "12.0.2"
    run: "npm run dev"

  standards:
    naming:
      variables: "camelCase"
      functions: "camelCase"
      classes: "PascalCase"
      components: "PascalCase"
      constants: "UPPER_SNAKE_CASE"
      files: "kebab-case"
      folders: "kebab-case"
    component_style: "Function components"

  capabilities:
    logging:
      enabled: false

  code_layout:
    "app/": "Next.js App Router route segments and pages."
    "app/layout.tsx": "Root layout for the application shell."
    "app/page.tsx": "The application's home page."
    "components/": "Reusable UI components shared across pages."
    "lib/api-client.ts": "Client integration with the backend's implemented HTTP API."
    "styles/": "Global and shared styles."
    "next.config.ts": "Next.js framework configuration."
    "package.json": "Frontend package manifest and scripts."

  contracts:
    produces: "none"
    consumes: "The backend's implemented HTTP API and its framework-generated OpenAPI description, once published by the backend."
    rule: "The frontend follows the backend's implemented interface as described by its generated API description; it does not depend on endpoint definitions stored in Interface Config."

  boundaries:
    owns: "Pages, components, browser-side behavior, and client integration with the implemented backend HTTP API."
    does_not_own: "Backend behavior and every part of the database item."
    interface: "None published — the frontend is the product's user-facing surface and does not offer a contract to another item."

  out_of_scope: "Backend business logic and API implementation, and the database engine and schema/migrations."
