# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Generated configuration layer of the Agent Project Interface — the frontend item's configuration, produced by my-interface-interpreter from Phase 1 of .interface/project.md"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Written only in planning mode by my-interface-planner — settings and draft contracts, never a frozen contract. Development and review modes read it and write nothing here"
  changed_by: "my-interface-planner on the human's invocation, my-interface-interpreter regenerating from project.md, or the human directly"
  contract_rule: "A contract version whose lifecycle is frozen is never edited by any agent — a change means a new version, and freezing or versioning is the human's decision"

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled — first, because false takes everything below out of the build"
  - "code_path, code_path_note, summary, needs_test, verify_cwd — where it lives and how it is proven"
  - "responsibility, tech, code_layout — what it is and how it is built"
  - "contracts, boundaries, out_of_scope — its connections and limits"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the frontend is in play"
  code_path: "The one folder this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The frontend in one line"
  needs_test: "Whether tasks are proven by written tests"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the frontend is answerable for"
  tech: "The technology choices an agent follows and never re-decides"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "What the frontend publishes and consumes"
  boundaries: "What the frontend owns, does not own, and offers"
  out_of_scope: "What the frontend does not do, named so it is never inferred into a task"

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: false

  # <!-------------------------------------------- Code_Path -->
  code_path: "to be defined"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root and outside .interface/ — the folder that will hold the frontend's code. Not yet named by the human; deferred until a phase targets the frontend. See Q2 in config/state.yaml."

  # <!-------------------------------------------- Summary -->
  summary: "A Next.js user interface for the Trading Assistant, consuming the backend's API — outside Phase 1 and disabled until a later phase targets it."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "to be defined — the frontend's code_path once it is named; deferred until a phase targets the frontend"

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Provides the user interface for interacting with the application."

  # <!-------------------------------------------- Tech -->
  tech:
    language: "TypeScript, with React as the UI library and Next.js as the framework — versions to be defined when a phase targets the frontend."
    database: "None of its own — the frontend holds no data engine and reaches data only through the backend's API contract."
    environment: "npm-managed node_modules inside code_path, never committed — npm is the project's stated package manager; the Node.js version is to be defined."
    run: "to be defined — settled when a phase targets the frontend."

  # <!-------------------------------------------- Code_Layout -->
  code_layout: "to be defined — laid out when a phase targets the frontend; nothing inside code_path exists in Phase 1."

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "none — the frontend publishes no contract; it consumes the backend's contract, .interface/config/backend.yaml under content.contracts."
    rule: "The frontend is built only against a frozen version of the backend's contract, never against a draft."
    change_rule: "A frozen contract is never edited — a change means a new version, and freezing or versioning is the human's decision."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns: "Its code under its code_path, and everything the user sees."
    does_not_own: "The data, the database schema, and the business functionality — those are the backend's."
    interface: "It publishes no contract — it renders the user interface and consumes the backend's contract."

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Everything, in Phase 1 — the frontend is disabled until a later phase targets it"
