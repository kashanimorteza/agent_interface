# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/frontend.yaml"
  path_note: "Generated Config — everything an agent reads to understand the frontend item: its resolved technology, layout, and the contract it consumes. Derived by my-interface-interpreter from .interface/project.md and the resolved defaults in .interface/preferences/develop.yaml, according to .interface/schema/frontend.schema.yaml"
  schema: ".interface/schema/frontend.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-02"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "my-interface-interpreter writes the whole file during a generation run. Planning mode may write settings and a draft contract, never a frozen one. Development and review modes do not write this file"
  changed_by: "The human directly; my-interface-interpreter on regeneration; my-interface-tasker in planning mode within the limits above"
  resolution: "project.md does not mention a frontend. The item exists and is enabled because .interface/preferences/develop.yaml names it a default project part; every technical value comes from that file. What the frontend shows, and how it is started, is not stated by either source and is recorded as an open question in state.yaml — see content.tech.run"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "enabled"
  - "code_path"
  - "code_path_note"
  - "summary"
  - "needs_test"
  - "verify_cwd"
  - "responsibility"
  - "tech"
  - "code_layout"
  - "contracts"
  - "boundaries"
  - "out_of_scope"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether the frontend is in the build"
  code_path: "The folder holding the frontend's actual code — the one place this item may write"
  code_path_note: "What code_path is relative to"
  summary: "The frontend in one line"
  needs_test: "Whether every code-producing task is proven by a written test"
  verify_cwd: "Where and inside what every verify command runs"
  responsibility: "What the frontend is answerable for"
  tech: "The resolved technology — language and frameworks, data, environment, run command"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The contract the frontend publishes — none — and the one it consumes"
  boundaries: "What the frontend owns, does not own, and offers"
  out_of_scope: "What the frontend does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Enabled -->
  enabled: true

  # <!-------------------------------------------- Code_Path -->
  code_path: "frontend/"

  # <!-------------------------------------------- Code_Path_Note -->
  code_path_note: "Relative to the repository root, beside .interface/ — never a path inside the interface."

  # <!-------------------------------------------- Summary -->
  summary: "A Next.js application in TypeScript that gives the user an interface over the backend's API — what it shows is not yet stated by the project."

  # <!-------------------------------------------- Needs_Test -->
  needs_test: false

  # <!-------------------------------------------- Verify_Cwd -->
  verify_cwd: "frontend/ — every verify command runs from this directory through npm, with node_modules as its environment."

  # <!-------------------------------------------- Responsibility -->
  responsibility: "Provides the user interface for interacting with the application."

  # <!-------------------------------------------- Tech -->
  tech:
    language:
      name: "TypeScript"
      version: "latest"
      library:
        name: "React"
        version: "latest"
        component_style: "Function components"
      framework:
        name: "Next.js"
        version: "latest"
        router: "App Router"
      package_manager:
        name: "npm"
        version: "latest"
      naming:
        variables: "camelCase"
        functions: "camelCase"
        classes: "PascalCase"
        components: "PascalCase"
        constants: "UPPER_SNAKE_CASE"
        files: "kebab-case"
        folders: "kebab-case"
    database: "None — the frontend holds no data of its own and owns no schema; every read and write goes through the backend's contract v1"
    environment: "node_modules/ under code_path — created by npm install, never committed; every command and every install happens through npm inside code_path, and the Next.js build output is never committed"
    run: "unresolved — neither project.md nor the preferences state the command that starts the frontend; see open question Q3 in .interface/config/state.yaml"

  # <!-------------------------------------------- Code_Layout -->
  code_layout:
    "package.json": "The npm project file — the declared dependencies and scripts"
    "tsconfig.json": "TypeScript configuration"
    "next.config.ts": "Next.js configuration"
    "node_modules/": "The installed dependencies — never committed"
    "app/": "The Next.js App Router — one folder per route, each holding its page component"
    "app/layout.tsx": "The root layout every page renders inside"
    "components/": "Shared React function components used by more than one page"
    "lib/": "Client code that is not a component — the API client and shared helpers"
    "lib/api/": "The typed client for backend contract v1 — the only place a backend route is called from"
    "tests/": "Reserved for tests — empty while needs_test is false"

  # <!-------------------------------------------- Contracts -->
  contracts:
    produces: "none — the frontend publishes no contract; it consumes backend contract v1 at .interface/config/backend.yaml under content.contracts"
    rule: "The frontend calls only the routes backend contract v1 names, in the shapes it names, and reaches the backend by no other route."
    change_rule: "The frontend never edits a backend contract. A route it needs and the contract lacks is raised as an open question; adding it is a new backend contract version, and that is the human's decision."

  # <!-------------------------------------------- Boundaries -->
  boundaries:
    owns:
      - "Everything under frontend/"
      - "The pages, components, and client code through which a user interacts with the application"
    does_not_own:
      - "Any project data or its schema — those are the backend's"
      - "Anything under backend/"
    interface: "None published — the frontend is a consumer of backend contract v1 and offers nothing to other items"

  # <!-------------------------------------------- Out_Of_Scope -->
  out_of_scope:
    - "Any page or feature — no project phase targets the frontend and project.md states nothing it must show; see open question Q3 in state.yaml"
    - "Storing data locally or reaching the database — every read and write goes through the backend contract"
    - "Written tests — needs_test is false"
    - "Logging — disabled by preference default"
