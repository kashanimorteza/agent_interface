        order_type:
          type: "string"
          nullable: false
          purpose: "Stores the position's order type."
        base_tp:
          type: "decimal"
          nullable: false
          purpose: "Stores the position's initial Take Profit value."
        base_sl:
          type: "decimal"
          nullable: false
          purpose: "Stores the position's initial Stop Loss value."
        real_tp:
          type: "decimal"
          nullable: false
          purpose: "Stores the position's current Take Profit value."
        real_sl:
          type: "decimal"
          nullable: false
          purpose: "Stores the position's current Stop Loss value."
        status:
          type: "boolean"
          nullable: false
          default: true
          purpose: "Indicates whether the position is active."
        description:
          type: "string"
          nullable: true
          purpose: "Describes the position."
      relationships:
        trading_platform:
          type: "uses"
          target: "trading_platform"
          field: "trading_platform_id"
        broker:
          type: "uses"
          target: "broker"
          field: "broker_id"
        account:
          type: "uses"
          target: "account"
          field: "account_id"
        trailing_group:
          type: "uses"
          target: "trailing_group"
          field: "trailing_group_id"
        partial_group:
          type: "uses"
          target: "partial_group"
          field: "partial_group_id"
        action_group:
          type: "uses"
          target: "action_group"
          field: "action_group_id"
        action:
          type: "belongs_to"
          target: "action"
          field: "action_id"

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Three parts in a line — a database publishes a frozen schema contract to a backend, and the backend publishes an implemented HTTP API with its generated description to a frontend"
    parts:

      database:
        responsibility: "Owns persistent storage for every domain model, evolves the schema through ordered reversible migrations, seeds the declared initial records, and publishes the database contract the backend builds against"
        owns:
          - "The database engine choice, physical storage, schema, constraints, and indexes"
          - "The migration history and seed data for every model"
          - "The database contract — .interface/config/database.yaml under content.contracts"
        does_not_own:
          - "Backend ORM mappings, API behavior, or runtime connection code"
          - "Frontend code"
          - "Deployment secrets and encryption keys"
        produces:
          - "database contract — .interface/config/database.yaml, content.contracts, consumed by the backend"

      backend:
        responsibility: "Runs the application behavior and publishes an implemented HTTP API for every domain model, consuming the frozen database contract"
        owns:
          - "Application code, validation, and services under its code_path"
          - "The runtime database connection and ORM mappings matching the frozen database contract"
          - "The implemented HTTP API and its framework-generated machine-readable description"
        does_not_own:
          - "The database engine, storage, schema, migrations, or seed data"
          - "Any user interface"
        consumes:
          - "database contract — .interface/config/database.yaml, content.contracts, frozen form only"
        produces:
          - "The implemented HTTP API with its framework-generated machine-readable description, read from the running backend by the frontend"

      frontend:
        responsibility: "Provides the user interface for entering and managing all defined project data by consuming the backend's implemented HTTP API"
        owns:
          - "Pages, components, browser-side behavior, and styles under its code_path"
          - "The client integration with the implemented backend HTTP API"
        does_not_own:
          - "Backend behavior or backend implementation code"
          - "Every part of the database item"
        consumes:
          - "The backend's implemented HTTP API and its framework-generated machine-readable description, read from the running backend"

    connections:

      database_to_backend:
        from: "database"
        to: "backend"
        contract: "database contract — the fully resolved tables, columns, types, keys, references, constraints, indexes, and credential storage modes, plus the credential-free connection shape"
        path: ".interface/config/database.yaml — content.contracts"
        rule: "The contract is the only connection point; neither item reaches into the other's implementation. The backend never infers schema from migrations or database files, and the database item never contains backend application code"
        versioning: "A frozen database contract is versioned, never edited; a change means a new version and migrations between versions. The backend builds only against a frozen version"

      backend_to_frontend:
        from: "backend"
        to: "frontend"
        contract: "The implemented HTTP API and its framework-generated machine-readable description"
        path: "Served by the running backend at the location its framework generates — read at runtime, not stored in Interface Config"
        rule: "The contract is the only connection point; neither item reaches into the other's implementation. The frontend never connects to the database item or imports backend code, and it depends on no endpoint definitions stored in Interface Config"

  # <!-------------------------------------------- Phases -->
  phases:

    - id: "P1"
      title: "Database"
      order: 1
      target: "database"
      goal: "Create the database schema and migrations for all defined project models."

    - id: "P2"
      title: "Backend API"
      order: 2
      target: "backend"
      goal: "Create and run the API for all defined project models."

    - id: "P3"
      title: "Frontend"
      order: 3
      target: "frontend"
      goal: "Create the frontend interface for entering and managing all defined project data through the backend API."
