# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — id, name, and its one-sentence promise"
  goals: "What a user can do when the product is finished — the list every task traces back to"
  architecture: "The parts of the product, what each owns, and the single connection between them"
  phases: "The ordered project phase index copied from project.md — the only source planning reads phases from"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Identity -->
  identity:
    id: "trading-assistant"
    name: "Trading Assistant"
    one_liner: "A platform for defining and managing trading information, strategies, actions, and related data."

  # <!-------------------------------------------- Goals -->
  goals:
    - "Define and manage the trading platforms used to execute trades, initially Binance and MetaTrader 5, with room for more."
    - "Define and manage brokers, each tied to a trading platform and acting as the parent of its trading accounts."
    - "Define and manage trading accounts, each belonging to one broker and used to perform trading operations."
    - "Define and manage tradable assets such as EURUSD or XAUUSD."
    - "Define and manage strategies — the trading settings such as stop loss and take profit that an action uses."
    - "Define and manage trailing groups and the trailing rules within them that adjust stop loss and take profit during a trade."
    - "Define and manage partial groups and the partial rules within them that close part or all of a position at given profit levels."
    - "Define and manage action groups that gather trading actions by an operating or risk profile."
    - "Define and manage actions, each combining an asset, an account, and a strategy inside an action group."
    - "Track executions — activated actions with their current stage and state."
    - "Store positions created from executed orders, with entry price, take profit, stop loss, and the settings applied through their groups."

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Two parts — a backend that manages application data and functionality, and a frontend that provides the user interface — joined only by the backend's published API contract."
    reason: "The project states the two parts and their responsibilities directly; keeping the API contract as the single bridge lets each part be built and verified on its own."
    parts:
      backend:
        responsibility: "Manages application data and functionality."
        owns:
          - "The data models the project defines and the database schema that holds them."
          - "The API surface that exposes those models."
          - "Everything under its code_path — see config/backend.yaml"
        does_not_own:
          - "The user interface and any client code."
        produces:
          - "The backend API contract — config/backend.yaml under content.contracts"
      frontend:
        responsibility: "Provides the user interface for interacting with the application."
        owns:
          - "The user interface and everything under its code_path — see config/frontend.yaml"
        does_not_own:
          - "Application data, its storage, and the API that serves it."
        consumes:
          - "The backend API contract — config/backend.yaml under content.contracts"
    connection:
      path: ".interface/config/backend.yaml — content.contracts"
      rule: "The contract is the only connection point — no part reaches into another by any other route."
      versioning: "A frozen contract never changes; a change means a new version, and freezing or versioning is the human's decision."

  # <!-------------------------------------------- Phases -->
  phases:
    - id: "P1"
      title: "Backend API"
      order: 1
      target: "backend"
      goal: "Create and run the API for all defined project models."
