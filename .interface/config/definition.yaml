  on_gap: "A requirement the project leaves undecided is raised as an open question in config/state.yaml, never settled here"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "identity"
  - "goals"
  - "architecture"
  - "phases"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — id, name, and the one promise everything traces back to"
  goals: "What a user can do when the product is finished — the list every task traces back to"
  architecture: "The parts of the product, what each owns, and the single connection point between them"
  phases: "The ordered project phases copied from project.md — the only phase index planning may use"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Identity -->
  identity:
    id: "trading-assistant"
    name: "Trading Assistant"
    one_liner: "A platform for defining and managing trading information, strategies, actions, and related data."

  # <!-------------------------------------------- Goals -->
  goals:
    - "Define the trading platforms used to execute trades — Binance and MetaTrader 5 first, with further platforms added later."
    - "Define brokers, each bound to the trading platform it uses, as the parent of its trading accounts."
    - "Define trading accounts, each with its username and password, under the broker they belong to."
    - "Define tradable assets such as EURUSD or XAUUSD."
    - "Define strategies that hold the trading settings an action uses, such as stop loss and take profit, with a risk parameter."
    - "Define trailing groups, and inside each the trailing rules that decide when and how stop loss and take profit move during a trade."
    - "Define partial groups, and inside each the partial rules that close a portion of a position when a profit threshold is reached."
    - "Group trading actions by an operating or risk profile, such as Standard or High Risk."
    - "Define trading actions that combine an asset, an account, and a strategy inside an action group."
    - "Track the actions that have been activated and executed, with the profit, stage, and state of each execution."
    - "Store the complete information of a position created from an executed order — entry price, take profit, stop loss, and the settings applied through its related groups."
    - "Reach every model above through an HTTP API whose requests carry a URL key parameter, with API documentation served as Docs."
    - "Interact with all of the above through a web user interface."

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Two parts — a backend that owns the data and its API, and a frontend that renders the user interface — joined by the backend's published API contract."
    reason: "The project states the two parts by name and gives each its own technology and code path; one contract between them lets each be planned, built, and reviewed on its own."

    parts:

      backend:
        responsibility: "Manages application data and functionality — it stores every model the project defines and serves the API for them."
        owns:
          - "The code under backend/"
          - "The database and the whole of its schema"
          - "Every model the project defines and the persistence of it"
          - "The API surface and its documentation"
        does_not_own:
          - "The user interface and any code under frontend/"
        produces:
          - ".interface/config/backend.yaml — content.contracts — the API contract the frontend builds against"

      frontend:
        responsibility: "Provides the user interface for interacting with the application."
        owns:
          - "The code under frontend/"
          - "Every page, component, and client-side state of the user interface"
        does_not_own:
          - "Application data, its storage, or any business logic — these are the backend's, reached only through its contract"
        consumes:
          - ".interface/config/backend.yaml — content.contracts — read for every call the interface makes"

    connection:
      path: ".interface/config/backend.yaml — content.contracts"
      rule: "The contract is the only connection point — the frontend reaches the backend through the routes the contract publishes and by no other route; neither part reads or writes the other's code or data."
      versioning: "A frozen contract never changes; a change means a new version, and freezing or versioning is the human's decision — see change_rule in backend.yaml."

  # <!-------------------------------------------- Phases -->
  phases:
    - id: "P1"
      title: "Backend API"
      order: 1
      target: "backend"
      goal: "Create and run the API for all defined project models."
