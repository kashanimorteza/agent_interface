# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "Written only by my-interface-interpreter during a generation run; no mode edits it — planning, development, and review read it and never write it"
  changed_by: "The human, by changing .interface/project.md and regenerating, or by editing this file directly"
