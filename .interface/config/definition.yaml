  schema: ".interface/schema/definition.schema.yaml"
  generated_by: "my-interface-interpreter"
  generated_at: "2026-09-03"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "Written whole by my-interface-interpreter during a generation run and by nobody else. No mode edits this file — planning, development, and review read it only"
  changed_by: "The human directly, or my-interface-interpreter on regeneration from .interface/project.md"
  source_rule: "Every fact here traces to .interface/project.md. Where project.md is silent, the gap is recorded in config/state.yaml as an open question and nothing is invented here"
  phase_model: "Phases are the primary units of planning, development, review, and progress. A phase's target selects the item configuration, Policy, contracts, and code_path used for that phase; only target item types referenced by at least one phase appear under architecture"
  on_change_needed: "A change to what the product is belongs in .interface/project.md first; this file follows it on the next generation run"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "identity"
  - "goals"
  - "models"
  - "architecture"
  - "phases"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — its name and the description the human stated"
  goals: "What a user can do when the product is finished — copied faithfully from project.md"
  models: "The domain entities, their purposes, conceptual relationships, and rules — independent of any target item's technical representation"
  architecture: "The target items referenced by project phases, what each owns, and the directed connections between them"
  phases: "The authoritative ordered project workflow copied from project.md"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Identity -->
  identity:
    name: "Trading Assistant"
    description: "A platform for defining and managing trading information, strategies, actions, and related data."

  # <!-------------------------------------------- Goals -->
  goals:
    - "Manage trading platforms, brokers, and trading accounts."
    - "Manage assets and broker-specific asset settings."
    - "Define trading strategies, action groups, and trading actions."
    - "Configure trailing and partial-close rule groups."
    - "Execute trading actions and track positions."

  # <!-------------------------------------------- Models -->
  models:

    trading_platform:
      purpose: "Defines the trading integration used to execute trades. Initial platforms include Binance and MetaTrader 5, and additional platforms may be added later. Each platform can provide its own development interface for performing trading operations through its related library."
      relationships: {}
      rules: []

    broker:
      purpose: "Defines a broker, its broker-specific parameters, and the trading platform it uses. A broker also acts as the parent under which its trading accounts are defined."
      relationships:
        trading_platform:
          type: "belongs_to"
          target: "trading_platform"
      rules: []

    account:
      purpose: "Defines a trading account, including its username identifier and password credential used to perform trading operations."
      relationships:
        broker:
          type: "belongs_to"
          target: "broker"
      rules: []

    asset:
      purpose: "Defines a tradable asset and its related parameters, such as EURUSD or XAUUSD."
      relationships: {}
      rules: []

    asset_detail:
      purpose: "Defines the broker-specific settings for an asset, allowing the same asset to have different settings for different brokers."
      relationships:
        broker:
          type: "belongs_to"
          target: "broker"
        asset:
          type: "belongs_to"
          target: "asset"
      rules:
        - "Only one Asset Detail may exist for each Broker and Asset pair."

    strategy:
      purpose: "Defines the trading settings and risk parameters used by an action, including values such as stop loss and take profit."
      relationships: {}
      rules: []

    trailing_group:
      purpose: "Defines a group for managing the rules that determine when and how stop loss and take profit values should change during a trade."
      relationships: {}
      rules: []

    trailing_rule:
      purpose: "Defines an individual rule within a trailing group. For example, when profit reaches a specified percentage of the take-profit target, the rule can adjust the take profit and stop loss."
      relationships:
        trailing_group:
          type: "belongs_to"
          target: "trailing_group"
      rules: []

    partial_group:
      purpose: "Defines a group of rules for closing all or part of a position at specified profit levels, such as closing 10%, 30%, or the entire position."
      relationships: {}
      rules: []

    partial_rule:
      purpose: "Defines an individual rule within a partial group, including the profit threshold and the portion of the position to close when that threshold is reached."
      relationships:
        partial_group:
          type: "belongs_to"
          target: "partial_group"
      rules: []

    action_group:
      purpose: "Groups trading actions by an operating or risk profile, such as Standard or High Risk."
      relationships: {}
      rules: []

    action:
      purpose: "Defines a trading action within an action group by combining an asset, an account, and a strategy. For example, a High Risk action can trade EURUSD through Account A using Strategy B."
      relationships:
        action_group:
          type: "belongs_to"
          target: "action_group"
        asset:
          type: "belongs_to"
          target: "asset"
        account:
          type: "belongs_to"
          target: "account"
        strategy:
          type: "belongs_to"
          target: "strategy"
      rules: []

    position:
      purpose: "Tracks a trading action after it has been activated and executed, storing complete position information including its profit, current stage and state, entry price, take profit, stop loss, and the settings applied through its related groups."
      relationships:
        action:
          type: "belongs_to"
          target: "action"
      rules: []

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Two target items joined by one frozen contract — a database item that owns storage and schema for every model, and a backend item that consumes the database contract and publishes an implemented HTTP API with a framework-generated machine-readable description. The frontend item type is available in the Interface but no phase targets it, so it does not enter this Understanding"

    parts:

      database:
        responsibility: "Owns persistent storage, the schema for every domain model, its migration history, and the database contract the backend consumes"
        owns:
          - "The database engine choice and its physical storage"
          - "Tables, columns, keys, constraints, and indexes for all thirteen domain models"
          - "Ordered, reversible migrations and their history"
          - "The database contract, in every version"
        does_not_own:
          - "Backend ORM behavior, services, or API endpoints"
          - "Deployment secrets and credentials"
        produces:
          - "database contract v1 — .interface/config/database.yaml under content.contracts.v1"

      backend:
        responsibility: "Runs the application behavior and publishes the implemented HTTP API for every domain model while consuming the database contract"
        owns:
          - "Application code, runtime database connection, and ORM mappings"
          - "Validation, services, and the implemented API for all thirteen domain models"
          - "The runtime HTTP interface and its framework-generated machine-readable description"
        does_not_own:
          - "The database engine, storage, schema, or migrations"
          - "Any user interface"
        produces:
          - "The implemented HTTP API and its framework-generated machine-readable description — served by the running backend, described in .interface/config/backend.yaml under content.contracts.produces"
        consumes:
          - "database contract v1 — .interface/config/database.yaml under content.contracts.v1"

    connections:

      database_to_backend:
        from: "database"
        to: "backend"
        contract: "database contract v1 — lifecycle draft until the human freezes it"
        path: ".interface/config/database.yaml — content.contracts.v1"
        rule: "The contract is the only connection point; the backend never reads migrations or database files to infer schema, and the database item never reaches into backend code"
        versioning: "A frozen contract never changes; a change means a new version and migrations between versions, decided by the human"

  # <!-------------------------------------------- Phases -->
  phases:
    - id: "P1"
      title: "Database"
      order: 1
      target: "database"
      goal: "Create the database schema and migrations for all defined project models."

    - id: "P2"
      title: "Backend API"
      order: 2
      target: "backend"
      goal: "Create and run the API for all defined project models."
