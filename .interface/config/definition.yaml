# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/definition.yaml"
  path_note: "Config layer of the Agent Project Interface — the structured project definition, generated from Phase 1 of project.md by my-interface-interpreter"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "No mode edits this file. It is regenerated only by a my-interface-interpreter run, from project.md"
  changed_by: "The human, by editing project.md and re-running my-interface-interpreter. A change this file needs is raised as an open question in config/state.yaml"
  source: ".interface/project.md — Phase 1 only"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "identity — what the product is, before anything else"
  - "goals — what must eventually be possible, before how it is split"
  - "architecture — the parts and their single connection point, read last because every other config file resolves its items against it"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — id, name, and its one-sentence promise"
  goals: "What a user can do when the product is finished — the list every task traces back to"
  architecture: "The parts of the product, what each owns, and the single connection between them"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Identity -->
  identity:
    id: "trading-assistant"
    name: "Trading Assistant"
    one_liner: "A platform for defining and managing trading information, strategies, actions, and related data."

  # <!-------------------------------------------- Goals -->
  goals:
    - "Define and manage the trading platforms used to execute trades (initially Binance and MetaTrader 5, extensible later)"
    - "Define and manage brokers, their platform-specific parameters, and the trading platform each uses"
    - "Define and manage trading accounts under their brokers"
    - "Define and manage tradable assets such as EURUSD or XAUUSD"
    - "Define and manage strategies carrying trading settings such as stop loss and take profit"
    - "Define and manage trailing groups and their trailing rules for adjusting stop loss and take profit during a trade"
    - "Define and manage partial groups and their partial rules for closing part or all of a position at profit levels"
    - "Define and manage action groups that organize actions by operating or risk profile"
    - "Define and manage actions that combine an asset, an account, and a strategy inside a group"
    - "Track executions of activated actions, including each execution's stage and state"
    - "Store the complete information of positions created from executed orders"

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Two parts — a backend that owns the data and application functionality, and a frontend that owns the user interface — joined by the backend's API contract."
    reason: "The project defines the backend and frontend as separate structural parts, letting the API for all models be built and run (Phase 1) independently of any user interface."

    parts:

      backend:
        responsibility: "Manages the application's data and functionality, exposed as an API."
        owns:
          - "All backend code under its code_path"
          - "The whole database schema and the data in it"
          - "The API surface and its contract"
        does_not_own:
          - "Client code and the user interface"
        produces:
          - "The backend API contract — .interface/config/backend.yaml under content.contracts"

      frontend:
        responsibility: "Provides the user interface for interacting with the application."
        owns:
          - "All frontend code under its code_path"
          - "The user interface and its presentation logic"
        does_not_own:
          - "The database, the application data, or the API surface"
        consumes:
          - "The backend API contract — .interface/config/backend.yaml under content.contracts"

    connection:
      path: ".interface/config/backend.yaml under content.contracts"
      rule: "The backend API contract is the only connection point between the parts — no part reaches into another by any other route."
      versioning: "A frozen contract never changes; a change means a new version, and freezing or versioning is the human's decision."
