# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/definition.yaml"
  path_note: "Generated configuration — the structured project definition the tasker and developer read instead of project.md"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "Regenerated only by my-interface-interpreter from Phase 1 of project.md. No mode edits it; a change it needs is raised as an open question in config/state.yaml"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "identity — what the product is, before anything else"
  - "goals — what a user can do when it is finished"
  - "architecture — the parts, what each owns, and the one connection between them"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — id, name, and its one promise"
  goals: "The capabilities every task traces back to"
  architecture: "The parts of the product and the single contract joining them"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Identity -->
  identity:
    id: "trading-assistant"
    name: "Trading Assistant"
    one_liner: "A platform for defining and managing trading information — accounts, assets, strategies, actions, and executions — so the user can enter, view, and maintain everything the trading system needs."

  # <!-------------------------------------------- Goals -->
  goals:
    - "Add trading information: accounts, assets, strategies, action groups, actions, and executes"
    - "View each kind of information in a list"
    - "View an individual item in full"
    - "Edit and update an existing item"
    - "Delete an item"
    - "Enable or disable an item through its status"

  # <!-------------------------------------------- Architecture -->
  architecture:
    shape: "Two parts — a backend that owns the data and its API, and a frontend that owns the user interface — joined by a single API contract."
    reason: "The project is built incrementally in phases and the frontend technology is decided separately; one contract between the parts lets each be planned, built, and reviewed on its own without reaching into the other."

    parts:

      backend:
        responsibility: "Manages the application's data and functionality — it stores the trading information and serves it over an API."
        owns:
          - "The API surface"
          - "The database schema and the data itself"
          - "Validation and the rules applied to the data"
        does_not_own:
          - "The user interface — nothing the user sees is the backend's"
        produces:
          - "api-v1 — the API contract, in .interface/config/backend.yaml under content.contracts"

      frontend:
        responsibility: "Provides the user interface for entering, viewing, and managing the trading information."
        owns:
          - "The screens, forms, and lists the user works in"
        does_not_own:
          - "Data storage, the database schema, and the rules applied to the data — all behind the backend's contract"
        consumes:
          - "api-v1 — the backend's API contract, in .interface/config/backend.yaml under content.contracts"

    connection:
      path: ".interface/config/backend.yaml — content.contracts"
      rule: "The contract is the only connection point — the frontend reaches the backend's data through the contract's surface and by no other route."
      versioning: "A frozen contract never changes; a change means a new version, and freezing or versioning is the human's decision."
