# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/definition.yaml"
  path_note: "Generated configuration of the definition layer — the project's identity, intended outcomes, and ordered phases interpreted from .interface/project.md. Its shape is schema/definition.yaml and its rules are principles/definition.md"
  standard: "Agent Project Interface"
  schema_version: "5.0"
  source: ".interface/project.md"
  generated: "2026-09-05"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "Written only by the generation operation while interpreting project.md. Outside a generation run this file is human-owned; planning, development, and review read it and never write it"
  changed_by: "The human, by editing project.md and requesting regeneration, or by editing this file directly"
  regeneration: "Every value is re-derived from the current project.md. Removing a phase, or changing the identity, order, target, or goal of a phase whose plan already holds tasks, is reported as a critical conflict and never applied silently"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "identity"
  - "goals"
  - "phases"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  identity: "Who the product is — its name and the description stated by the human"
  goals: "The independent product-level outcomes the project is intended to achieve"
  phases: "The authoritative ordered project workflow — each phase's id, title, order, target item, and goal"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- identity -->
  identity:
    name: "Trading Assistant"
    description: "A platform for defining and managing trading information, strategies, actions, and related data."

  # <!-------------------------------------------- goals -->
  goals:
    - "Enable users to enter and manage all defined project data."

  # <!-------------------------------------------- phases -->
  phases:
    - id: "P1"
      title: "Data Foundation"
      order: 1
      target: "database"
      goal: "Make all defined project data persistently available to the system."

    - id: "P2"
      title: "Data Operations"
      order: 2
      target: "backend"
      goal: "Make all defined project data available for consistent creation, retrieval, update, and deletion operations."

    - id: "P3"
      title: "Data Management Interface"
      order: 3
      target: "frontend"
      goal: "Enable users to enter and manage all defined project data through a user-facing experience."
