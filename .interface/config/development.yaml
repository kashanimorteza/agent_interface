# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/development.yaml
  path_note: 'Generated configuration of the Development Component — the independent application layers, the centralized runtime configuration, the common package standard and package map, declared-interface connections, cross-cutting capabilities, and the Platform that runs and deploys them. Shape: schema/development.yaml; rules: principles/development.md; defaults: preferences/development.yaml'
  standard: Agent Project Interface
  schema_version: '5.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: Written only by the configuring operation. Outside a configuring run this file is human-owned; planning and development read it and never write it
  changed_by: The human, directly, or by re-running the configuring operation
  precedence: Layer responsibilities and interfaces summarized here must agree with each layer's own generated configuration. When they differ, the owning configuration governs and this file is reconciled. Package entries reference the owning Component definitions for operations, technologies, and domain meaning and never redefine them
  agent_selected: 'project.md states no runtime, composition, deployment, or package constraint. Package names follow preferences/development.yaml (responsibility-based, prefix my_, nested role names in the parent namespace, adapted to each ecosystem); no existing implementation was renamed because the generated configuration was empty when this run started. The runtime-configuration files, sections, precedence, and delivery follow preferences/development.yaml; the concrete setting names, their generated defaults, the environment-variable forms, and the secret name TRADING_ASSISTANT_CREDENTIAL_ENCRYPTION_KEY are agent-selected so they are never re-decided downstream. Platform owns the configuration loader, validation, and process startup, so it has its own package, my_platform. Its code path is developer/ because that is the implementation directory the fixed reset workflow already recognizes and cleans alongside model/, database/, backend/, and frontend/. Platform has no phase of its own: each phase plans and delivers the Platform composition its target Component needs to run and be verified — the Model phase needs none, the Database phase establishes the runtime-configuration files and the Platform loader with validation and the migration command, the Backend phase adds the Backend start command, and the Frontend phase adds the Frontend start command. The execution model, startup order, local addresses, and deployment target are agent-selected under the shared decision policy. Every cross-cutting capability keeps its preference default because the project requests none; authentication therefore stays disabled although the User Model carries credentials — enabling it would add a Behaviour the project does not state, and the human can request it in project.md'


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- summary
- layers
- runtime_configuration
- package_standard
- packages
- connections
- cross_cutting
- platform


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  summary: The project's resolved layered composition in one sentence
  layers: The application layers participating in the project, their top-level package, and the interfaces each provides and consumes
  runtime_configuration: The project-level settings boundary — files, per-layer sections and bindings, precedence, delivery, validation, and the override limit
  package_standard: The common package conventions resolved from Development Preferences
  packages: The package map — one entry per application layer, per architectural sublayer, and for Platform, with interfaces, dependencies, configuration, distribution, and README
  connections: The directed consumer-to-provider connections between layers
  cross_cutting: The resolved state and scope of capabilities coordinated across layers
  platform: The Platform package, environment, composition, and deployment of the complete project


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- summary -->
  summary: Four independent application layers — an importable Python Model package defining the shared domain, a file-based Database package persisting it behind a typed interface, a Python HTTP API Backend consuming both, and a TypeScript web Frontend consuming the Backend API — each organized as a package with one nested package per architectural sublayer, composed by a Platform package that loads one centralized runtime configuration and runs the layers as native local processes on one machine.

  # <!-------------------------------------------- layers -->
  layers:
    model:
      name: Model
      configuration: .interface/config/model.yaml
      package: my_model
      responsibility: Defines every shared logical Model once — identity, fields, relationships, rules, initial data, and domain validation — and publishes them as one importable package.
      provides:
      - 'Model package — the import interface of my_model: one Pydantic class per shared Model, the MODELS registry, and model_metadata, as resolved under implementation.public_interface of its configuration.'
      consumes: []
    database:
      name: Database
      configuration: .interface/config/database.yaml
      package: my_database
      responsibility: Owns the complete persistence layer — supported Engines, Instances, storage, connections, ORM, mappings, storage schema, migrations, credential at-rest transformations, and initial data — and publishes one typed Database gateway with an Instance Registry.
      provides:
      - Database Interface — the typed create, read, list, update, delete, and status operations for every persistent Model, Instance discovery and selection, and parameterized SQL execution, as resolved under layers.database_interface of its configuration.
      consumes:
      - Model package
    backend:
      name: Backend
      configuration: .interface/config/backend.yaml
      package: my_backend
      responsibility: Executes application Behaviour and Model Logic over the shared Models, reaches persistence only through Data Access, and publishes the external HTTP API.
      provides:
      - Backend API — the implemented HTTP API for every Model's standard operations and exposed Behaviour, with its generated OpenAPI description, as resolved under layers.api of its configuration.
      consumes:
      - Model package
      - Database Interface
    frontend:
      name: Frontend
      configuration: .interface/config/frontend.yaml
      package: my_frontend
      responsibility: Presents the application to users through composed Components, manages user interaction, and reaches application data only through API Access.
      provides:
      - Web application — the user-facing interface served to the browser.
      consumes:
      - Backend API

  # <!-------------------------------------------- runtime_configuration -->
  runtime_configuration:
    files:
      public:
        path: application.yaml
        format: YAML
        committed: true
        user_editable: true
        content: Non-secret runtime settings and cross-layer bindings, one top-level key per section below; Platform creates it with the generated defaults recorded here.
      secrets:
        path: .env
        format: dotenv
        committed: false
        example_path: .env.example
        content: Secret values and environment-specific private settings named by the secret references below; .env.example is committed and lists every variable name with an empty value.
    sections:
      model:
        owner: model
        settings: {}
        bindings: {}
      database:
        owner: database
        settings:
          default_instance:
            default: general
            meaning: The Instance key used when a consumer selects none; must name a configured Instance.
          instances:
            general:
              engine:
                default: sqlite
                meaning: The supported Engine key bound by the Instance, from engines in database.yaml.
              file:
                default: database/data/trading_assistant_general.db
                meaning: The project-relative SQLite database file of the Instance.
          credential_encryption_key_secret:
            default: TRADING_ASSISTANT_CREDENTIAL_ENCRYPTION_KEY
            meaning: The name of the environment variable holding the reversible-encryption key for encrypted credential fields; the value lives only in .env or the process environment.
        bindings: {}
      backend:
        owner: backend
        settings:
          host:
            default: 127.0.0.1
            meaning: The bind address of the HTTP API server.
          port:
            default: 8000
            meaning: The port of the HTTP API server.
          allowed_origins:
            default:
            - http://127.0.0.1:3000
            - http://localhost:3000
            meaning: The browser origins allowed to call the API — the Frontend's local origins.
        bindings:
          database:
            provider: database
            interface: Database Interface
            selection: general
      frontend:
        owner: frontend
        settings:
          host:
            default: 127.0.0.1
            meaning: The address the Frontend server listens on.
          port:
            default: 3000
            meaning: The port the Frontend server listens on.
          api_base_url:
            default: http://127.0.0.1:8000
            meaning: The Backend API base URL used by API Access in the browser and on the server.
        bindings:
          backend_api:
            provider: backend
            interface: Backend API
      platform:
        owner: platform
        settings: {}
        bindings: {}
    precedence:
    - runtime_environment
    - public_configuration
    - generated_defaults
    delivery:
      owner: platform
      method: 'validated_injection — Platform loads application.yaml, overlays the process environment and .env, validates the complete configuration, and injects each layer''s own section into the process it starts as environment variables: Python layers receive flat variables named <SECTION>__<KEY> in upper case with double underscores for nesting and comma-separated lists (for example DATABASE__DEFAULT_INSTANCE, DATABASE__INSTANCES__GENERAL__FILE, BACKEND__PORT, BACKEND__BINDINGS__DATABASE__SELECTION); the Frontend, a Node.js process, receives its section in the forms its framework reads (HOSTNAME, PORT, NEXT_PUBLIC_API_BASE_URL). A user overrides a value with the same variable name in the process environment or .env. No layer reads application.yaml, and every layer falls back to its generated defaults when no section is delivered'
      scope: Each layer receives only its own section and the secret values it references; the Backend process also receives the database section and the credential-encryption key because it hosts the Database package in-process, and the Database package reads only the database variables. The Model package receives nothing.
    validation: Platform validates the complete public configuration before any layer starts — every section is present and well-formed, every binding names a participating provider and a declared interface, every Instance selection names a configured Instance, and every referenced secret variable is set when a current field requires it — and stops with the first error instead of starting a layer.
    override_boundary: Runtime configuration may select among resolved compatible choices — the Instance, addresses, ports, origins, file locations, and secret references — but never redefines architecture, package ownership, interfaces, layer technologies, or unsupported Engines.

  # <!-------------------------------------------- package_standard -->
  package_standard:
    naming:
      basis: responsibility — a package is named for the responsibility it owns, never for a technology or a project fact
      top_level_prefix: my_
      top_level_name: <prefix><role> — my_model, my_database, my_backend, my_frontend, my_platform
      nested_name: <role> — the architectural sublayer name inside the parent namespace (my_database.storage_adapter, my_backend.logic, my_frontend/src/api-access)
      nested_namespace: parent_package
      ecosystem_adaptation: 'Python packages keep snake_case import names (my_model, my_database, my_backend, my_platform) and use hyphenated distribution names (my-model, my-database, my-backend, my-platform); the npm package name is my-frontend and its nested packages are kebab-case directories under src/ (presentation, interaction-logic, api-access). The logical role stays recognizable in every form.'
      collision_handling: 'Checked in the intended namespaces: no installed Python distribution or module named my_model, my_database, my_backend, or my_platform exists in the project environments, and the private npm package my-frontend is never published, so no qualifier is needed. If a collision appears later, a role-based qualifier is added; the prefix alone does not guarantee uniqueness.'
    distribution:
      visibility: internal
      publication: none — no package is published to a registry
      local_dependency: 'When one package must be installed by another, the consumer uses the ecosystem''s local path mechanism: the Database installs the Model package as an editable uv path dependency (tool.uv.sources with path ../model and editable true), and the Backend installs the Model and Database packages the same way from ../model and ../database. Network consumers use the provider''s API instead of installing its implementation: the Frontend never installs the Backend. Platform installs no layer package; it starts layer processes in their own directories.'
    nested_packages:
      independently_installable: false
      dependency_management: parent — a nested package declares no dependencies of its own; the parent's pyproject.toml or package.json manages them
      runtime: parent_when_applicable — a nested package runs inside its parent's process and environment
    documentation:
      filename: README.md
      location: package_root
      sections:
      - purpose_and_boundaries
      - public_interface
      - dependencies
      - configuration
      - installation_and_startup_when_applicable
      - usage_examples
      nested_setup: A nested package's README references the parent README for shared installation and startup and documents this package's interface and usage locally.

  # <!-------------------------------------------- packages -->
  packages:

    my_model:
      name: my_model
      parent: null
      owner: layers.model — .interface/config/model.yaml
      responsibility: The shared domain — one Pydantic class per Model with its validation, the ordered MODELS registry, and the model_metadata accessor exposing each Model's resolved fields, relationships, rules, and initial data.
      kind: importable Python library (uv project with the uv_build backend, src layout, import package my_model) with no architectural sublayers
      code_path: model/
      interfaces:
        model_package:
          source: .interface/config/model.yaml — implementation.public_interface (models, registry, metadata, validation) and content.models
          kind: import
          entrypoint: my_model — the Model classes, MODELS, and model_metadata
          consumers:
          - my_database.data_logic
          - my_backend.logic
          - my_backend.api
      dependencies:
      - .interface/config/model.yaml — implementation.tech (language, environment, modeling library)
      configuration: none — the Model package accepts no runtime configuration; its runtime-configuration section is empty
      distribution: internal; not published; distribution name my-model, import name my_model; installed by consumers as an editable local path dependency; its own uv environment for verification
      readme:
        path: model/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_database:
      name: my_database
      parent: null
      owner: layers.database — .interface/config/database.yaml
      responsibility: The complete persistence layer of the project — the Database Interface, Data Logic and Mapping, and Storage Adapter sublayers, the migration history, and the initial-data seeding.
      kind: importable Python library (uv project with the uv_build backend, src layout, import package my_database) that also carries the Alembic migration tooling
      code_path: database/
      interfaces:
        database_interface:
          source: .interface/config/database.yaml — layers.database_interface (public_interface, instance_selection, model_contract, operations, sql_commands)
          kind: import
          entrypoint: my_database — the package root re-exports the Database gateway, the InstanceRegistry, and the Database error types from the nested database_interface package
          consumers:
          - my_backend.data_access
      dependencies:
      - my_model.model_package — installed as an editable local path dependency and used by my_database.data_logic
      - .interface/config/database.yaml — engines, instances, and layers.storage_adapter (ORM, migration tool)
      configuration: 'The database section of runtime_configuration, delivered as DATABASE__* variables (default_instance, instances.<key>.engine, instances.<key>.file, credential_encryption_key_secret) plus the value of the referenced secret variable; generated defaults from database.yaml apply when nothing is delivered'
      distribution: internal; not published; distribution name my-database, import name my_database; installed by consumers as an editable local path dependency; its own uv environment for the migration tooling
      readme:
        path: database/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_database.database_interface:
      name: database_interface
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.database_interface
      responsibility: The only boundary published to consumers — the typed Database gateway that accepts my_model classes and instances, the InstanceRegistry, Instance selection, and controlled parameterized SQL execution.
      kind: nested Python package (my_database.database_interface)
      code_path: database/src/my_database/database_interface/
      interfaces:
        gateway:
          source: .interface/config/database.yaml — layers.database_interface
          kind: import
          entrypoint: my_database.database_interface — the Database gateway and InstanceRegistry, delegated by the parent root as the public Database Interface
          consumers:
          - my_database (the parent re-exports it as the package's public interface)
      dependencies:
      - my_database.data_logic — the generic Model-driven operation pipeline
      configuration: inherited from the parent (the database section through the Storage Adapter)
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/database_interface/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_database.data_logic:
      name: data_logic
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.data_logic
      responsibility: The generic Model-driven data logic and storage mapping — derives every table, column, constraint, index, and foreign key from my_model metadata under the mapping rules, and resolves credentials and initial data into storage meaning.
      kind: nested Python package (my_database.data_logic)
      code_path: database/src/my_database/data_logic/
      interfaces:
        operations:
          source: .interface/config/database.yaml — layers.data_logic (model_source, mapping, initial_data)
          kind: import
          entrypoint: my_database.data_logic — the derived storage mapping and the generic create, read, list, update, delete, and status functions over a Storage Adapter session
          consumers:
          - my_database.database_interface
      dependencies:
      - my_model.model_package — Model classes, MODELS, and model_metadata
      - my_database.storage_adapter — mapped tables, credential transformations, sessions
      configuration: none of its own; inherited from the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/data_logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_database.storage_adapter:
      name: storage_adapter
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.storage_adapter
      responsibility: The Engine-specific persistence — one SQLite connection per configured Instance with foreign keys enforced, the SQLAlchemy mapping of the derived storage schema, credential at-rest transformations, the seed functions, and the Alembic migration history that creates the schema.
      kind: nested Python package (my_database.storage_adapter) plus the Alembic environment at the parent root
      code_path: database/src/my_database/storage_adapter/
      interfaces:
        storage:
          source: .interface/config/database.yaml — layers.storage_adapter (orm, migration, connections, credential_storage, standards, backups)
          kind: import
          entrypoint: my_database.storage_adapter — engines and session factory per Instance, mapped tables, credential transformations, seed and unseed
          consumers:
          - my_database.data_logic
          - the parent's Alembic migration environment (database/alembic/)
      dependencies: []
      configuration: 'The database section (DATABASE__* variables) and the credential-encryption key, read through the parent''s settings boundary'
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/storage_adapter/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_backend:
      name: my_backend
      parent: null
      owner: layers.backend — .interface/config/backend.yaml
      responsibility: The Backend application — the API, Logic, and Data Access sublayers composed into one FastAPI application that publishes the HTTP API over the Database Interface.
      kind: runnable Python application (uv project with the uv_build backend, src layout, import package my_backend) served by the resolved ASGI server
      code_path: backend/
      interfaces:
        backend_api:
          source: .interface/config/backend.yaml — layers.api (model_api, behaviours, credential_handling, api_documentation, provides)
          kind: network API (HTTP with an OpenAPI description)
          entrypoint: 'http://<backend host>:<backend port>/ — default http://127.0.0.1:8000, with the OpenAPI document at /openapi.json (configuration-based endpoint; no secret values)'
          consumers:
          - my_frontend.api_access
          - external HTTP clients of the API
      dependencies:
      - my_model.model_package — installed as an editable local path dependency and used by my_backend.logic and my_backend.api
      - my_database.database_interface — installed as an editable local path dependency and used only by my_backend.data_access
      - .interface/config/backend.yaml — tech (language, environment, packages) and layers.api.framework
      configuration: 'The backend section of runtime_configuration, delivered as BACKEND__* variables (host, port, allowed_origins, bindings.database.selection); the database section and the credential-encryption key are present in the same process for the Database package and are never read by Backend code'
      distribution: internal; not published; distribution name my-backend, import name my_backend; runs in its own uv environment and is installed by no other package
      readme:
        path: backend/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_backend.api:
      name: api
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.api
      responsibility: The external communication boundary — request validation, transport schemas derived from the my_model classes with credential fields write-only, HTTP error mapping, one router per Model, and the application with its OpenAPI description and allowed origins.
      kind: nested Python package (my_backend.api)
      code_path: backend/src/my_backend/api/
      interfaces:
        application:
          source: .interface/config/backend.yaml — layers.api
          kind: import
          entrypoint: my_backend.api — the FastAPI application object served by the parent's runner
          consumers:
          - my_backend (the parent's runner serves it as the Backend API)
      dependencies:
      - my_backend.logic — the Model Logic units and project Behaviour
      - my_model.model_package — the Model classes and model_metadata from which transport schemas are derived
      configuration: allowed origins through the parent's settings boundary
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/api/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_backend.logic:
      name: logic
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.logic
      responsibility: Application Behaviour and Model Logic — the standard-operation baseline, one Logic unit per shared Model in its own source file, their registry, and the declaration of the project Behaviour.
      kind: nested Python package (my_backend.logic)
      code_path: backend/src/my_backend/logic/
      interfaces:
        model_logic:
          source: .interface/config/backend.yaml — layers.logic (model_logic, project_behaviours, supporting_services)
          kind: import
          entrypoint: my_backend.logic — the Model Logic units and their registry
          consumers:
          - my_backend.api
      dependencies:
      - my_backend.data_access — the only route to persistence
      - my_model.model_package — Model classes, validation, and model_metadata
      configuration: none of its own; inherited from the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_backend.data_access:
      name: data_access
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.data_access
      responsibility: The only Backend boundary that consumes the Database Interface — selecting the bound Instance, translating Logic's data operations into calls on the Database gateway and Database errors into Backend errors, without application Behaviour.
      kind: nested Python package (my_backend.data_access)
      code_path: backend/src/my_backend/data_access/
      interfaces:
        data_access:
          source: .interface/config/backend.yaml — layers.data_access (uses, operations)
          kind: import
          entrypoint: my_backend.data_access — the DataAccess boundary bound to the Database gateway of the selected Instance
          consumers:
          - my_backend.logic
      dependencies:
      - my_database.database_interface — through the parent's editable local path dependency on my_database
      configuration: the database Instance selection (BACKEND__BINDINGS__DATABASE__SELECTION) through the parent's settings boundary; the Database package reads its own section
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/data_access/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_frontend:
      name: my_frontend
      parent: null
      owner: layers.frontend — .interface/config/frontend.yaml
      responsibility: The Frontend application — the Presentation, Interaction Logic, and API Access sublayers composed into one Next.js application served to the browser.
      kind: runnable Next.js application (private npm package my-frontend, App Router entry under src/app/) run by npm
      code_path: frontend/
      interfaces:
        user_interface:
          source: .interface/config/frontend.yaml — layers.presentation.routes and pages, boundaries.interface
          kind: user interface (web application)
          entrypoint: http://127.0.0.1:3000/ by default — the home route and one management route per Model as resolved in frontend.yaml (configuration-based endpoint; no secret values)
          consumers:
          - end users through a browser
      dependencies:
      - my_backend.backend_api — consumed over the network by my_frontend.api_access; the Backend is never installed
      - .interface/config/frontend.yaml — tech (language, library, framework, package manager, packages)
      configuration: The frontend section of runtime_configuration, delivered as HOSTNAME, PORT, and NEXT_PUBLIC_API_BASE_URL; the framework-required NEXT_PUBLIC_ prefix exposes the API base URL to the browser and inlines it at build time
      distribution: internal; private npm package my-frontend that is never published or installed by another package; run with npm
      readme:
        path: frontend/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_frontend.presentation:
      name: presentation
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.presentation
      responsibility: The reusable user-interface Components, the Theme, and the page compositions that render the home page and the Model management pages; the App Router entry files under src/app/ only mount these compositions.
      kind: nested TypeScript package (directory frontend/src/presentation/ with an index export)
      code_path: frontend/src/presentation/
      interfaces:
        pages_and_components:
          source: .interface/config/frontend.yaml — layers.presentation (theme, routes, pages, components)
          kind: import
          entrypoint: '@/presentation — page compositions and Components imported by the App Router entry files'
          consumers:
          - my_frontend (the App Router entry under src/app/ mounts the pages)
      dependencies:
      - my_frontend.interaction_logic — user-interface state and the management flow
      configuration: none of its own; the Theme tokens are part of this package
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/presentation/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

    my_frontend.interaction_logic:
      name: interaction-logic
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.interaction_logic
      responsibility: User-interface state and flow — notifications of operation outcomes and the per-Model records hook that lists, creates, updates, deletes, and toggles records through API Access.
      kind: nested TypeScript package (directory frontend/src/interaction-logic/ with an index export)
      code_path: frontend/src/interaction-logic/
      interfaces:
        hooks:
          source: .interface/config/frontend.yaml — layers.interaction_logic (state_management, behaviours)
          kind: import
          entrypoint: '@/interaction-logic — the notification provider and hook and the Model records hook'
          consumers:
          - my_frontend.presentation
      dependencies:
      - my_frontend.api_access — the only door to application data
      configuration: none of its own
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/interaction-logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

    my_frontend.api_access:
      name: api-access
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.api_access
      responsibility: The Frontend-side client boundary — the Fetch client, the Model operations over the Backend API, the transport types generated from the Backend's OpenAPI description, and the Model specification derived from that description which the other sublayers read for routes, titles, and field metadata.
      kind: nested TypeScript package (directory frontend/src/api-access/ with an index export)
      code_path: frontend/src/api-access/
      interfaces:
        client:
          source: .interface/config/frontend.yaml — layers.api_access (uses, contract_source, client, model_operations, rule)
          kind: import
          entrypoint: '@/api-access — the Model operations, the API error type, and the derived Model specification'
          consumers:
          - my_frontend.interaction_logic
          - my_frontend.presentation (the derived Model specification only, for routes, titles, and field metadata)
      dependencies:
      - my_backend.backend_api — over the network at NEXT_PUBLIC_API_BASE_URL
      configuration: NEXT_PUBLIC_API_BASE_URL, inlined at build time by the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/api-access/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

    my_platform:
      name: my_platform
      parent: null
      owner: platform — content.platform and content.runtime_configuration of this file
      responsibility: The composition layer's implementation — loads application.yaml and .env, applies environment overrides, validates every section, binding, Instance selection, and secret reference, and starts each layer process in its own directory with only its own section injected.
      kind: runnable Python application (uv project with the uv_build backend, src layout, import package my_platform) exposing a command
      code_path: developer/
      interfaces:
        commands:
          source: content.platform.composition and content.runtime_configuration of this file
          kind: command
          entrypoint: 'uv run my-platform <command>, run from developer/ — validate (load and validate the configuration), migrate (apply the Database migrations and seeding to the selected Instance by running the Database migration command in database/ with the database section injected), backend (start the Backend API server in backend/ with the backend and database sections injected), frontend (start the Frontend server in frontend/ with the frontend section injected)'
          consumers:
          - the human or a project script starting the system
      dependencies:
      - PyYAML 6.0.3 — reading application.yaml
      - python-dotenv 1.2.3 — reading .env
      - pydantic 2.13.5 — validating the loaded configuration
      - the layer packages only as processes it starts in their own directories with their own commands; none is installed into the Platform environment
      configuration: 'Owns the loading of application.yaml and .env at the project root; its own section is empty. Python 3.14.7 with uv 0.12.10, as for the other Python packages'
      distribution: internal; not published; distribution name my-platform, import name my_platform; its own uv environment; installed by no other package
      readme:
        path: developer/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

  # <!-------------------------------------------- connections -->
  connections:
    database_to_model:
      from: database
      to: model
      interface: Model package
      description: Database Data Logic (my_database.data_logic) imports the Model package (my_model, installed as an editable local path dependency) and derives every table, column, constraint, and seed record from its classes and model_metadata. It never redefines a Model.
    backend_to_model:
      from: backend
      to: model
      interface: Model package
      description: Backend Logic and API (my_backend.logic, my_backend.api) import the Model package (my_model, installed as an editable local path dependency) for Model classes, validation, credential markers, and transport-schema derivation. They never copy a Model.
    backend_to_database:
      from: backend
      to: database
      interface: Database Interface
      description: Backend Data Access (my_backend.data_access) imports the Database package (my_database, installed as an editable local path dependency), selects the Instance named by its runtime binding, and calls only the typed Database gateway. It never receives the Engine connection and never reaches tables, ORM mappings, migrations, or the database file.
    frontend_to_backend:
      from: frontend
      to: backend
      interface: Backend API
      description: Frontend API Access (my_frontend.api_access) calls the Backend HTTP API over the network at the base URL supplied by runtime configuration and derives its transport types from the Backend's generated OpenAPI description. It never connects to Database and never imports Backend or Model code.

  # <!-------------------------------------------- cross_cutting -->
  cross_cutting:
    testing:
      enabled: false
      applies_to: []
    logging:
      enabled: false
      applies_to: []
    error_handling:
      enabled: false
      applies_to: []
    authentication:
      enabled: false
      applies_to: []

  # <!-------------------------------------------- platform -->
  platform:
    package: my_platform
    environment:
      execution_model: Native local processes. The Model package is imported in-process by Database and Backend; Database is an embedded file Engine opened in-process by the Database package inside the Backend process and the migration process; Backend runs as one HTTP server process; Frontend runs as one development or production server process; Platform runs as a short-lived command that validates configuration and starts those processes.
      operating_system: 'No project constraint — any platform supported by the resolved toolchain: Python 3.14.7 with uv 0.12.10 for Model, Database, Backend, and Platform, and Node.js 24.20.0 (the current LTS release) with npm 12.0.2 for Frontend. Node.js 24.20.0 bundles npm 11.19.0, so the Frontend setup upgrades npm to the resolved version, which declares support for Node.js 24.'
    composition:
      startup:
      - 'Model: create the uv environment in model/ and verify the package imports.'
      - 'Database: create the uv environment in database/ (which installs my_model from ../model); Platform migrate applies the migrations to head, including seeding, for the selected Instance.'
      - 'Backend: create the uv environment in backend/ (which installs my_model and my_database); Platform backend starts the HTTP API server so it serves its OpenAPI description.'
      - 'Frontend: install npm dependencies in frontend/, generate the API transport types from the running Backend''s OpenAPI description, then Platform frontend starts the server pointed at the Backend API base URL.'
      - 'Platform itself: create the uv environment in developer/ and run validate before the first migrate.'
      orchestration: None. Processes are started by the Platform commands, by hand, or by a project script in the order above; a single-machine setup needs no orchestrator.
      networking: The Model package and the Database Interface are reached in-process through Python imports. The Backend API is reached over local HTTP at http://127.0.0.1:8000 by default; the Frontend server listens at http://127.0.0.1:3000 by default and reads the Backend base URL from its own section. The Backend allows the Frontend's origins for browser requests. All addresses are overridable through runtime configuration.
      configuration: Platform reads application.yaml, overlays .env and the process environment in the recorded precedence, validates the complete configuration, and injects each layer's section as the environment of the process it starts, as recorded under runtime_configuration.delivery; layer settings are defined once there and never duplicated here. Secrets reach only the processes that host the boundary referencing them.
    deployment:
      target: Local machine — a developer workstation running all layers.
      artifacts:
      - 'application.yaml and .env.example at the project root, created with the generated defaults; .env is created locally and never committed.'
      - 'model/: the my_model package and its uv lockfile.'
      - 'database/: the my_database package with migration history, ORM mappings, seeding, and its uv lockfile, which reproduce the Database from nothing.'
      - 'backend/: the my_backend application source and its uv lockfile.'
      - 'frontend/: the my_frontend application source, the committed generated API types, and the npm lockfile.'
      - 'developer/: the my_platform package and its uv lockfile.'
      - 'Source-control ignore rules for .env, .venv/, node_modules/, .next/, and the Instance database files; the current .gitignore covers .venv and *.db but not .env, node_modules/, or .next/.'
      - 'Delivery: check out the repository and run the startup sequence; a release is verified when Platform validate passes, migrations report head, the Backend serves its OpenAPI description, and the Frontend renders against that API.'
