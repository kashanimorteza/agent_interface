# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/development.yaml
  path_note: 'Generated configuration of the Development Component — the independent application layers, the common package standard and package map, declared-interface connections, cross-cutting capabilities, and the Platform that runs and deploys them. Shape: schema/development.yaml; rules: principles/development.md; defaults: preferences/development.yaml'
  standard: Agent Project Interface
  schema_version: '4.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: Written only by the configuring operation. Outside a configuring run this file is human-owned; planning and development read it and never write it
  changed_by: The human, directly, or by re-running the configuring operation
  precedence: Layer responsibilities and interfaces summarized here must agree with each layer's own generated configuration. When they differ, the owning configuration governs and this file is reconciled. Package entries reference the owning Component definitions for operations, technologies, and domain meaning and never redefine them
  agent_selected: project.md states no runtime, composition, deployment, or package constraint. Package names follow preferences/development.yaml (responsibility-based, prefix my_, nested role names in the parent namespace, adapted to each ecosystem); no existing implementation was renamed because the generated configuration was empty when this run started. The execution model, startup order, networking (including the default local addresses), the named runtime-configuration variables, and the deployment target are agent-selected under the shared decision policy and recorded so they are never re-decided downstream. Every cross-cutting capability keeps its preference default because the project requests none; authentication therefore stays disabled although the User Model carries credentials — enabling it would add a Behaviour the project does not state, and the human can request it in project.md


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- summary
- layers
- package_standard
- packages
- connections
- cross_cutting
- platform


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  summary: The project's resolved layered composition in one sentence
  layers: The application layers participating in the project, their top-level package, and the interfaces each provides and consumes
  package_standard: The common package conventions resolved from Development Preferences
  packages: The package map — one entry per application layer and per architectural sublayer, with interfaces, dependencies, configuration, distribution, and README
  connections: The directed consumer-to-provider connections between layers
  cross_cutting: The resolved state and scope of capabilities coordinated across layers
  platform: The environment, composition, and deployment of the complete project


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- summary -->
  summary: Three independent application layers — a file-based Database publishing a generic data-access interface, a Python HTTP API Backend consuming it, and a TypeScript web Frontend consuming the Backend API — each organized as a package with one nested package per architectural sublayer, composed by a Platform that runs them as native local processes on one machine.

  # <!-------------------------------------------- layers -->
  layers:
    database:
      name: Database
      configuration: .interface/config/database.yaml
      package: my_database
      responsibility: Owns the complete persistence layer — engine, storage, connection, ORM, storage schema, migrations, and initial data — and publishes one generic data-access interface.
      provides:
      - Database Interface — generic create, read, list, update, delete, status, and parameterized SQL operations for every persistent Model, as resolved under layers.database_interface of its configuration.
      consumes: []
    backend:
      name: Backend
      configuration: .interface/config/backend.yaml
      package: my_backend
      responsibility: Executes application Behaviour and Model Logic, reaches persistence only through Data Access, and publishes the external HTTP API.
      provides:
      - Backend API — the implemented HTTP API for every Model's standard operations and exposed Behaviour, with its generated OpenAPI description, as resolved under layers.api of its configuration.
      consumes:
      - Database Interface
    frontend:
      name: Frontend
      configuration: .interface/config/frontend.yaml
      package: my_frontend
      responsibility: Presents the application to users through composed Components, manages user interaction, and reaches application data only through API Access.
      provides:
      - User-facing web application served to the browser.
      consumes:
      - Backend API

  # <!-------------------------------------------- package_standard -->
  package_standard:
    naming:
      basis: responsibility — a package is named for the responsibility it owns, never for a technology or a project fact
      top_level_prefix: my_
      top_level_name: <prefix><role> — my_database, my_backend, my_frontend
      nested_name: <role> — the architectural sublayer name inside the parent namespace (my_database.storage_adapter, my_backend.logic, my_frontend/src/api-access)
      nested_namespace: parent_package
      ecosystem_adaptation: 'Python packages keep snake_case import names (my_database, my_backend) and use hyphenated distribution names (my-database, my-backend); the npm package name is my-frontend and its nested packages are kebab-case directories under src/ (presentation, interaction-logic, api-access). The logical role stays recognizable in every form.'
      collision_handling: 'Checked in the intended namespaces: no installed Python distribution or module named my_database or my_backend exists in the project environments, and the private npm package my-frontend is never published, so no qualifier is needed. If a collision appears later, a role-based qualifier is added; the prefix alone does not guarantee uniqueness.'
    distribution:
      visibility: internal
      publication: none — no package is published to a registry
      local_dependency: 'When one package must be installed by another, the consumer uses the ecosystem''s local path mechanism: the Backend installs the Database package as an editable uv path dependency (tool.uv.sources with path ../database and editable true). Network consumers use the provider''s API instead of installing its implementation: the Frontend never installs the Backend.'
    nested_packages:
      independently_installable: false
      dependency_management: parent — a nested package declares no dependencies of its own; the parent's pyproject.toml or package.json manages them
      runtime: parent_when_applicable — a nested package runs inside its parent's process and environment
    documentation:
      filename: README.md
      location: package_root
      sections:
      - purpose_and_boundaries
      - public_interface
      - dependencies
      - configuration
      - installation_and_startup_when_applicable
      - usage_examples
      nested_setup: A nested package's README references the parent README for shared installation and startup and documents this package's interface and usage locally.

  # <!-------------------------------------------- packages -->
  packages:

    my_database:
      name: my_database
      parent: null
      owner: layers.database — .interface/config/database.yaml
      responsibility: The complete persistence layer of the project — the Database Interface, Data Logic and Mapping, and Storage Adapter sublayers, the migration history, and the initial data.
      kind: importable Python library (uv project with the uv_build backend, src layout, import package my_database) that also carries the Alembic migration tooling
      code_path: database/
      interfaces:
        database_interface:
          source: .interface/config/database.yaml — layers.database_interface (operations create, read, list, update, delete, status, sql_commands; model_selector; error behaviour)
          kind: import
          entrypoint: my_database — the package root re-exports the Database class and the Database error types from the nested database_interface package
          consumers:
          - my_backend.data_access
      dependencies: []
      configuration:
        DATABASE_URL: supplied by the process environment or an untracked database/.env; defaults to the sqlite URL of database/app.db (platform.composition.configuration.variables)
        CREDENTIAL_ENCRYPTION_KEY: supplied by the process environment or an untracked database/.env; required before the first encrypted credential write, including the initial-data migration
      distribution: internal; not published; distribution name my-database, import name my_database; installed by consumers as an editable local path dependency; its own uv environment for the migration tooling
      readme:
        path: database/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_database.database_interface:
      name: database_interface
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.database_interface
      responsibility: The only boundary published to consumers — the generic Database class that accepts a Model key, an operation, and that operation's data or criteria, plus controlled parameterized SQL execution.
      kind: nested Python package (my_database.database_interface)
      code_path: database/src/my_database/database_interface/
      interfaces:
        database_class:
          source: .interface/config/database.yaml — layers.database_interface
          kind: import
          entrypoint: my_database.database_interface — the Database class, delegated by the parent root as the public Database Interface
          consumers:
          - my_database (the parent re-exports it as the package's public interface)
      dependencies:
      - my_database.data_logic — the generic Model-driven operation pipeline
      configuration: inherited from the parent (DATABASE_URL through the Storage Adapter)
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/database_interface/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_database.data_logic:
      name: data_logic
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.data_logic
      responsibility: The generic Model-driven data logic and storage mapping — the Model registry and the operation pipeline that resolves logical Models, fields, relationships, rules, credentials, and initial data into storage meaning.
      kind: nested Python package (my_database.data_logic)
      code_path: database/src/my_database/data_logic/
      interfaces:
        operations:
          source: .interface/config/database.yaml — layers.data_logic (responsibility, model_source, storage_schema, initial_data)
          kind: import
          entrypoint: my_database.data_logic — the registry and the generic create, read, list, update, delete, and status functions over a Storage Adapter session
          consumers:
          - my_database.database_interface
      dependencies:
      - my_database.storage_adapter — mapped tables, credential transformations, sessions
      configuration: none of its own; inherited from the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/data_logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_database.storage_adapter:
      name: storage_adapter
      parent: my_database
      owner: layers.database — .interface/config/database.yaml layers.storage_adapter
      responsibility: The engine-specific persistence — the SQLite connection with foreign keys enforced, the SQLAlchemy declarative mapping of the storage schema, credential at-rest transformations, the seed functions, and the Alembic migration history that creates the schema.
      kind: nested Python package (my_database.storage_adapter) plus the Alembic environment at the parent root
      code_path: database/src/my_database/storage_adapter/
      interfaces:
        storage:
          source: .interface/config/database.yaml — layers.storage_adapter (tech, standards, backups)
          kind: import
          entrypoint: my_database.storage_adapter — engine and session factory, mapped tables, credential transformations, seed and unseed
          consumers:
          - my_database.data_logic
          - the parent's Alembic migration environment (database/alembic/)
      dependencies: []
      configuration: DATABASE_URL and CREDENTIAL_ENCRYPTION_KEY, read through the parent's settings module
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: database/src/my_database/storage_adapter/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: database/README.md

    my_backend:
      name: my_backend
      parent: null
      owner: layers.backend — .interface/config/backend.yaml
      responsibility: The Backend application — the API, Logic, and Data Access sublayers composed into one FastAPI application that publishes the HTTP API over the Database Interface.
      kind: runnable Python application (uv project with the uv_build backend, src layout, import package my_backend) started by its runner or the fastapi CLI
      code_path: backend/
      interfaces:
        backend_api:
          source: .interface/config/backend.yaml — layers.api (model_api, behaviours, credential_handling, api_documentation, provides)
          kind: network API (HTTP with an OpenAPI description)
          entrypoint: 'http://<BACKEND_HOST>:<BACKEND_PORT>/ — default http://127.0.0.1:8000, with the OpenAPI document at /openapi.json (configuration-based endpoint; no secret values)'
          consumers:
          - my_frontend.api_access
          - external HTTP clients of the API
      dependencies:
      - my_database.database_interface — installed as an editable local path dependency and used only by my_backend.data_access
      - .interface/config/backend.yaml — tech (language, environment, packages) and layers.api.framework
      configuration:
        BACKEND_HOST: supplied by the process environment or an untracked backend/.env; default 127.0.0.1
        BACKEND_PORT: supplied by the process environment or an untracked backend/.env; default 8000
        BACKEND_CORS_ORIGINS: supplied by the process environment or an untracked backend/.env; default the Frontend's local origins
        DATABASE_URL and CREDENTIAL_ENCRYPTION_KEY: read by the Database package from its own configuration; never configured here
      distribution: internal; not published; distribution name my-backend, import name my_backend; runs in its own uv environment and is installed by no other package
      readme:
        path: backend/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_backend.api:
      name: api
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.api
      responsibility: The external communication boundary — request validation, Pydantic schemas derived from the shared Model specification, HTTP error mapping, one router per Model, and the application with its OpenAPI description and allowed origins.
      kind: nested Python package (my_backend.api)
      code_path: backend/src/my_backend/api/
      interfaces:
        application:
          source: .interface/config/backend.yaml — layers.api
          kind: import
          entrypoint: my_backend.api — the FastAPI application object served by the parent's runner
          consumers:
          - my_backend (the parent's runner and CLI entrypoint serve it as the Backend API)
      dependencies:
      - my_backend.logic — the Model Logic units and project Behaviour
      configuration: BACKEND_CORS_ORIGINS through the parent's settings module
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/api/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_backend.logic:
      name: logic
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.logic
      responsibility: Application Behaviour and Model Logic — the shared Model specification, the standard-operation baseline, one Logic unit per shared Model in its own source file, and the declaration of the project Behaviour.
      kind: nested Python package (my_backend.logic)
      code_path: backend/src/my_backend/logic/
      interfaces:
        model_logic:
          source: .interface/config/backend.yaml — layers.logic (model_logic, project_behaviours, supporting_services)
          kind: import
          entrypoint: my_backend.logic — the Model Logic units, their registry, and the shared Model specification
          consumers:
          - my_backend.api
      dependencies:
      - my_backend.data_access — the only route to persistence
      configuration: none of its own; inherited from the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_backend.data_access:
      name: data_access
      parent: my_backend
      owner: layers.backend — .interface/config/backend.yaml layers.data_access
      responsibility: The only Backend boundary that consumes the Database Interface — translating Logic's data operations into Database calls and Database errors into Backend errors, without application Behaviour.
      kind: nested Python package (my_backend.data_access)
      code_path: backend/src/my_backend/data_access/
      interfaces:
        data_access:
          source: .interface/config/backend.yaml — layers.data_access (uses, operations)
          kind: import
          entrypoint: my_backend.data_access — the DataAccess boundary bound to the Database Interface
          consumers:
          - my_backend.logic
      dependencies:
      - my_database.database_interface — through the parent's editable local path dependency on my_database
      configuration: none of its own; the Database package reads its own configuration
      distribution: parent-managed nested package; not independently installable; shares the parent's environment and runtime
      readme:
        path: backend/src/my_backend/data_access/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: backend/README.md

    my_frontend:
      name: my_frontend
      parent: null
      owner: layers.frontend — .interface/config/frontend.yaml
      responsibility: The Frontend application — the Presentation, Interaction Logic, and API Access sublayers composed into one Next.js application served to the browser.
      kind: runnable Next.js application (private npm package my-frontend, App Router entry under src/app/) run by npm
      code_path: frontend/
      interfaces:
        user_interface:
          source: .interface/config/frontend.yaml — layers.presentation.routes and pages, boundaries.interface
          kind: user interface (web application)
          entrypoint: http://127.0.0.1:3000/ by default — the home route and one management route per Model as resolved in frontend.yaml (configuration-based endpoint; no secret values)
          consumers:
          - end users through a browser
      dependencies:
      - my_backend.backend_api — consumed over the network by my_frontend.api_access; the Backend is never installed
      - .interface/config/frontend.yaml — tech (language, library, framework, package manager, packages)
      configuration:
        NEXT_PUBLIC_API_BASE_URL: supplied by the process environment or an untracked frontend/.env.local and inlined into the browser bundle at build time; default http://127.0.0.1:8000
      distribution: internal; private npm package my-frontend that is never published or installed by another package; run with npm
      readme:
        path: frontend/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - installation_and_startup_when_applicable
        - usage_examples

    my_frontend.presentation:
      name: presentation
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.presentation
      responsibility: The reusable user-interface Components, the Theme, and the page compositions that render the home page and the Model management pages; the App Router entry files under src/app/ only mount these compositions.
      kind: nested TypeScript package (directory frontend/src/presentation/ with an index export)
      code_path: frontend/src/presentation/
      interfaces:
        pages_and_components:
          source: .interface/config/frontend.yaml — layers.presentation (theme, routes, pages, components)
          kind: import
          entrypoint: '@/presentation — page compositions and Components imported by the App Router entry files'
          consumers:
          - my_frontend (the App Router entry under src/app/ mounts the pages)
      dependencies:
      - my_frontend.interaction_logic — user-interface state and the management flow
      configuration: none of its own; the Theme tokens are part of this package
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/presentation/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

    my_frontend.interaction_logic:
      name: interaction-logic
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.interaction_logic
      responsibility: User-interface state and flow — notifications of operation outcomes and the per-Model records hook that lists, creates, updates, deletes, and toggles records through API Access.
      kind: nested TypeScript package (directory frontend/src/interaction-logic/ with an index export)
      code_path: frontend/src/interaction-logic/
      interfaces:
        hooks:
          source: .interface/config/frontend.yaml — layers.interaction_logic (state_management, behaviours)
          kind: import
          entrypoint: '@/interaction-logic — the notification provider and hook and the Model records hook'
          consumers:
          - my_frontend.presentation
      dependencies:
      - my_frontend.api_access — the only door to application data
      configuration: none of its own
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/interaction-logic/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

    my_frontend.api_access:
      name: api-access
      parent: my_frontend
      owner: layers.frontend — .interface/config/frontend.yaml layers.api_access
      responsibility: The Frontend-side client boundary — the Fetch client, the Model operations over the Backend API, the transport types generated from the Backend's OpenAPI description, and the shared Model specification the client and the other sublayers read.
      kind: nested TypeScript package (directory frontend/src/api-access/ with an index export)
      code_path: frontend/src/api-access/
      interfaces:
        client:
          source: .interface/config/frontend.yaml — layers.api_access (uses, contract_source, client, model_operations, rule)
          kind: import
          entrypoint: '@/api-access — the Model operations, the API error type, and the shared Model specification'
          consumers:
          - my_frontend.interaction_logic
          - my_frontend.presentation (the shared Model specification only, for routes, titles, and field metadata)
      dependencies:
      - my_backend.backend_api — over the network at NEXT_PUBLIC_API_BASE_URL
      configuration: NEXT_PUBLIC_API_BASE_URL, inlined at build time by the parent
      distribution: parent-managed nested package; not independently installable; shares the parent's dependencies and runtime
      readme:
        path: frontend/src/api-access/README.md
        sections:
        - purpose_and_boundaries
        - public_interface
        - dependencies
        - configuration
        - usage_examples
        setup_reference: frontend/README.md

  # <!-------------------------------------------- connections -->
  connections:
    backend_to_database:
      from: backend
      to: database
      interface: Database Interface
      description: Backend Data Access (my_backend.data_access) imports the Database package (my_database, installed as an editable local path dependency) and calls only its generic interface. It never receives the engine connection and never reaches tables, ORM mappings, migrations, or the database file.
    frontend_to_backend:
      from: frontend
      to: backend
      interface: Backend API
      description: Frontend API Access (my_frontend.api_access) calls the Backend HTTP API over the network at the base URL supplied by runtime configuration and derives its transport types from the Backend's generated OpenAPI description. It never connects to Database and never imports Backend code.

  # <!-------------------------------------------- cross_cutting -->
  cross_cutting:
    testing:
      enabled: false
      applies_to: []
    logging:
      enabled: false
      applies_to: []
    error_handling:
      enabled: false
      applies_to: []
    authentication:
      enabled: false
      applies_to: []

  # <!-------------------------------------------- platform -->
  platform:
    environment:
      execution_model: Native local processes. Database is an embedded file engine opened in-process by the Database package; Backend runs as one HTTP server process; Frontend runs as one development or production server process.
      operating_system: 'No project constraint — any platform supported by the resolved toolchain: Python 3.14.7 with uv 0.12.10 for Database and Backend, and Node.js 24 LTS (v24.20.0) with npm 12.0.2 for Frontend. Node 24.20.0 bundles npm 11.19.0, so the Frontend startup upgrades npm to the resolved version.'
    composition:
      startup:
      - 'Database: create the uv environment in database/, apply migrations to head, and apply initial data.'
      - 'Backend: create the uv environment in backend/ (which installs my_database from ../database), then start the HTTP API server so it serves its OpenAPI description.'
      - 'Frontend: install npm dependencies in frontend/, generate the API transport types from the running Backend''s OpenAPI description, then start the server pointed at the Backend API base URL.'
      orchestration: None. Processes are started by hand or by a project script in the order above; a single-machine setup needs no orchestrator.
      networking: The Database Interface is reached in-process through a Python import. The Backend API is reached over local HTTP at http://127.0.0.1:8000 by default; the Frontend server listens at http://127.0.0.1:3000 by default and reads the Backend base URL from its own runtime configuration. The Backend allows the Frontend's origins for browser requests. All addresses are overridable through the variables below.
      configuration:
        mechanism: Each layer reads environment variables supplied through an untracked .env file in its code path (frontend uses .env.local) or through the process environment. Every secret — including the encryption key for encrypted credential fields — is delivered this way and never written into any Interface configuration file or committed file. Each layer documents its variable names in a committed .env.example that holds no values.
        variables:
          DATABASE_URL: Read by Database — the SQLAlchemy connection URL; defaults to the sqlite URL of database/app.db.
          CREDENTIAL_ENCRYPTION_KEY: Read by Database — the key for the reversible encryption of columns whose credential_storage is encrypted; secret, required before the first encrypted write.
          BACKEND_HOST: Read by Backend — the bind address of the HTTP API server; default 127.0.0.1.
          BACKEND_PORT: Read by Backend — the port of the HTTP API server; default 8000.
          BACKEND_CORS_ORIGINS: Read by Backend — comma-separated browser origins allowed to call the API; default http://127.0.0.1:3000,http://localhost:3000, the Frontend's local origins.
          NEXT_PUBLIC_API_BASE_URL: Read by Frontend — the Backend API base URL used by API Access in the browser and on the server; default http://127.0.0.1:8000. The framework-required prefix exposes it to the browser and inlines it at build time.
    deployment:
      target: Local machine — a developer workstation running all three layers.
      artifacts:
      - 'database/: the my_database package with migration history, ORM mappings, initial-data records, and the uv lockfile that reproduce the Database from nothing.'
      - 'backend/: the my_backend application source and its uv lockfile.'
      - 'frontend/: the my_frontend application source, the committed generated API types, and the npm lockfile.'
      - 'Delivery: check out the repository and run the startup sequence; a release is verified when migrations report head, the Backend serves its OpenAPI description, and the Frontend renders against that API.'
