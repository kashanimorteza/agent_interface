# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: .interface/config/development.yaml
  path_note: 'Generated configuration of the Development Component — the independent application layers, their declared-interface connections, cross-cutting capabilities, and the Platform that runs and deploys them. Shape: schema/development.yaml; rules: principles/development.md; defaults: preferences/development.yaml'
  standard: Agent Project Interface
  schema_version: '4.0'
  generated: '2026-09-06'


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: Written only by the configuring operation. Outside a configuring run this file is human-owned; planning and development read it and never write it
  changed_by: The human, directly, or by re-running the configuring operation
  precedence: Layer responsibilities and interfaces summarized here must agree with each layer's own generated configuration. When they differ, the owning configuration governs and this file is reconciled
  agent_selected: project.md states no runtime, composition, or deployment constraint. The execution model, startup order, networking (including the default local addresses), the named runtime-configuration variables, and the deployment target below are agent-selected under the shared decision policy and recorded here so they are never re-decided downstream. Every cross-cutting capability keeps its preference default because the project requests none; authentication therefore stays disabled even though the User Model carries credentials — enabling it would add a Behaviour the project does not state, and the human can request it in project.md


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
- summary
- layers
- connections
- cross_cutting
- platform


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  summary: The project's resolved layered composition in one sentence
  layers: The application layers participating in the project and the interfaces each provides and consumes
  connections: The directed consumer-to-provider connections between layers
  cross_cutting: The resolved state and scope of capabilities coordinated across layers
  platform: The environment, composition, and deployment of the complete project


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- summary -->
  summary: Three independent application layers — a file-based Database publishing a generic data-access interface, a Python HTTP API Backend consuming it, and a TypeScript web Frontend consuming the Backend API — composed by a Platform that runs them as native local processes on one machine.

  # <!-------------------------------------------- layers -->
  layers:
    database:
      name: Database
      configuration: .interface/config/database.yaml
      responsibility: Owns the complete persistence layer — engine, storage, connection, ORM, storage schema, migrations, and initial data — and publishes one generic data-access interface.
      provides:
      - Database Interface — generic create, read, list, update, delete, status, and parameterized SQL operations for every persistent Model, as resolved under layers.database_interface of its configuration.
      consumes: []
    backend:
      name: Backend
      configuration: .interface/config/backend.yaml
      responsibility: Executes application Behaviour and Model Logic, reaches persistence only through Data Access, and publishes the external HTTP API.
      provides:
      - Backend API — the implemented HTTP API for every Model's standard operations and exposed Behaviour, with its generated OpenAPI description, as resolved under layers.api of its configuration.
      consumes:
      - Database Interface
    frontend:
      name: Frontend
      configuration: .interface/config/frontend.yaml
      responsibility: Presents the application to users through composed Components, manages user interaction, and reaches application data only through API Access.
      provides:
      - User-facing web application served to the browser.
      consumes:
      - Backend API

  # <!-------------------------------------------- connections -->
  connections:
    backend_to_database:
      from: backend
      to: database
      interface: Database Interface
      description: Backend Data Access imports the Database package as a local path dependency and calls only its generic interface. It never receives the engine connection and never reaches tables, ORM mappings, migrations, or the database file.
    frontend_to_backend:
      from: frontend
      to: backend
      interface: Backend API
      description: Frontend API Access calls the Backend HTTP API over the network at the base URL supplied by runtime configuration and derives its transport types from the Backend's generated OpenAPI description. It never connects to Database and never imports Backend code.

  # <!-------------------------------------------- cross_cutting -->
  cross_cutting:
    testing:
      enabled: false
      applies_to: []
    logging:
      enabled: false
      applies_to: []
    error_handling:
      enabled: false
      applies_to: []
    authentication:
      enabled: false
      applies_to: []

  # <!-------------------------------------------- platform -->
  platform:
    environment:
      execution_model: Native local processes. Database is an embedded file engine opened in-process by the Database package; Backend runs as one HTTP server process; Frontend runs as one development server process.
      operating_system: 'No project constraint — any platform supported by the resolved toolchain: Python 3.14.7 with uv 0.12.10 for Database and Backend, and Node.js 24 LTS (v24.20.0) with npm 12.0.2 for Frontend. Node 24.20.0 bundles npm 11.19.0, so the Frontend startup upgrades npm to the resolved version.'
    composition:
      startup:
      - 'Database: create the uv environment in database/, apply migrations to head, and apply initial data.'
      - 'Backend: create the uv environment in backend/, then start the HTTP API server so it serves its OpenAPI description.'
      - 'Frontend: install npm dependencies in frontend/, generate the API transport types from the running Backend''s OpenAPI description, then start the development server pointed at the Backend API base URL.'
      orchestration: None. Processes are started by hand or by a project script in the order above; a single-machine setup needs no orchestrator.
      networking: The Database Interface is reached in-process through a Python import. The Backend API is reached over local HTTP at http://127.0.0.1:8000 by default; the Frontend development server listens at http://127.0.0.1:3000 by default and reads the Backend base URL from its own runtime configuration. Both addresses are overridable through the variables below.
      configuration:
        mechanism: Each layer reads environment variables supplied through an untracked .env file in its code path or through the process environment. Every secret — including the encryption key for encrypted credential fields — is delivered this way and never written into any Interface configuration file or committed file. Each layer may document its variable names in a committed .env.example that holds no values.
        variables:
          DATABASE_URL: Read by Database — the SQLAlchemy connection URL; defaults to the sqlite URL of database/app.db.
          CREDENTIAL_ENCRYPTION_KEY: Read by Database — the key for the reversible encryption of columns whose credential_storage is encrypted; secret, required before the first encrypted write.
          BACKEND_HOST: Read by Backend — the bind address of the HTTP API server; default 127.0.0.1.
          BACKEND_PORT: Read by Backend — the port of the HTTP API server; default 8000.
          NEXT_PUBLIC_API_BASE_URL: Read by Frontend — the Backend API base URL used by API Access in the browser and on the server; default http://127.0.0.1:8000. The framework-required prefix exposes it to the browser.
    deployment:
      target: Local machine — a developer workstation running all three layers.
      artifacts:
      - 'database/: migration history, ORM mappings, initial-data records, and the uv lockfile that reproduce the Database from nothing.'
      - 'backend/: application source and its uv lockfile.'
      - 'frontend/: application source and its npm lockfile.'
      - 'Delivery: check out the repository and run the startup sequence; a release is verified when migrations report head, the Backend serves its OpenAPI description, and the Frontend renders against that API.'
