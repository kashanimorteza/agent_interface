# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/rules.yaml"
  path_note: "Generated configuration layer of the Agent Project Interface — the boundaries of agent behavior, produced by my-interface-interpreter from Phase 1 of .interface/project.md"

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "No mode edits this file. It is regenerated only by my-interface-interpreter, from project.md, and that regeneration is the one time it is touched"
  changed_by: "The human, or a my-interface-interpreter run the human invoked. A rule that needs changing outside that is raised as an open question in config/state.yaml"

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "precedence — which rule wins, before any rule is applied"
  - "environment, code, database, security — the boundaries of building"
  - "test, contract, design — the boundaries of proving, publishing, and drawing"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  precedence: "Which rule wins when two collide"
  environment: "Where code runs and what is never committed"
  code: "How code is shaped and where logic lives"
  database: "How the schema moves and the engine's traps"
  security: "What must never leak — overrides every other group"
  test: "What must be proven, and how, while no test suite is required"
  contract: "How the API surface and its contract stay in step"
  design: "How the interface is drawn — empty of work while no frontend is in play"

# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Precedence -->
  precedence: "Security rules override every other group, and within any other collision the more specific rule wins over the more general one."

  # <!-------------------------------------------- Environment -->
  environment:
    - "Create the backend's virtual environment with uv and run every command and every install inside it."
    - "Add or change a dependency only through uv, so the project file stays the single record of what is installed."
    - "Never commit the virtual environment or the SQLite database file."

  # <!-------------------------------------------- Code -->
  code:
    - "Keep each kind of code in its place as backend.yaml's code_layout assigns it — models, validation schemas, and routes never share a file."
    - "Validate every request body through a validation schema in schemas/, never by hand inside a route."
    - "Keep a route to translating between the API and the models — logic that outlives one request belongs with the models, not in the route."
    - "Leave errors to FastAPI's built-in behavior and write no application logs — error handling and logging are both disabled for this project."

  # <!-------------------------------------------- Database -->
  database:
    - "Change the database schema only through an Alembic migration — never by editing the models alone or the database by hand."
    - "Write every migration so it can be reversed."
    - "Use Alembic's batch mode for table alterations, because SQLite barely supports ALTER TABLE."
    - "Reach the database only through SQLAlchemy — no raw SQL outside a migration."

  # <!-------------------------------------------- Security -->
  security:
    - "Never place an account's Username or Password in a URL, an error message, or any output the API did not contractually promise."
    - "Require the API key on every request and reject a request without it before any data is touched."
    - "Let an error message say what failed and never how — no paths, no SQL, no stack traces in a response."

  # <!-------------------------------------------- Test -->
  test:
    - "Write no test suite — Testing is disabled for this project — and add no test dependency to make one possible."
    - "Prove a task only by running its own verify command from the backend's verify_cwd, inside the uv environment, and treat a failing verify as a task not done."

  # <!-------------------------------------------- Contract -->
  contract:
    - "Change the API surface only together with the contract in backend.yaml — the surface and the contract never drift apart."
    - "Never edit a frozen contract version — a change means a new version, and only the human freezes or versions a contract."
    - "Build a consumer only against a frozen contract version, never against a draft."

  # <!-------------------------------------------- Design -->
  design:
    - "Do no design work while the frontend is disabled — Phase 1 builds no user interface."
