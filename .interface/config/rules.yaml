# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "Written only by my-interface-interpreter during a generation run. No mode edits it — every mode obeys it"
  changed_by: "The human, directly or by regenerating through my-interface-interpreter"
  group_shape: "Every group after precedence is a list of single imperative sentences"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "precedence"
  - "environment"
  - "code"
  - "database"
  - "security"
  - "test"
  - "contract"
  - "design"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  precedence: "Which rule wins when two collide"
  environment: "Where code runs and what is never committed"
  code: "How code is shaped — where logic lives, what a route may do, how input is validated, the one error structure"
  database: "How the schema moves — migrations, reversibility, indexes, and SQLite's traps"
  security: "What must never leak — overrides every other group"
  test: "What must be proven before a task is done"
  contract: "How the API surface and its contract stay in step"
  design: "How the interface is drawn"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Precedence -->
  precedence: "Security rules override every other group; below them an explicit statement in .interface/project.md overrides a preference default, a frozen contract overrides the code, and a rule here overrides an agent's own judgment."

  # <!-------------------------------------------- Environment -->
  environment:
    - "Run every backend command and every backend install inside the uv-managed virtual environment under backend/, because that environment is the only route a dependency enters the backend by."
    - "Run every frontend command and every frontend install through npm inside frontend/, because node_modules is the only route a dependency enters the frontend by."
    - "Declare every backend dependency in the uv project file and every frontend dependency in package.json, so the environment can be rebuilt from the repository alone."
    - "Never commit the virtual environment, node_modules, the SQLite database file, or a framework build output."
    - "Start the backend only with the run command recorded in .interface/config/backend.yaml under content.tech.run."

  # <!-------------------------------------------- Code -->
  code:
    - "Keep business logic in the services layer; a route receives a request, validates it through a schema, calls a service, and returns the response, and does nothing else."
    - "Put every database access behind the ORM session obtained from the database module; no route opens a connection or writes raw SQL."
    - "Validate every request body and query parameter through a validation schema before it reaches a service, and reject what does not validate with the error shape."
    - "Return every failure in the single error shape defined in the contract; no route invents its own error structure."
    - "Follow the naming standards in .interface/config/backend.yaml and .interface/config/frontend.yaml for every variable, function, class, constant, file, and folder."
    - "Give every model, schema, service, and route its own file in the folder the code_layout assigns to it; do not put two models or two route groups in one file."
    - "Model every entity named by the project with exactly the fields the project states; add a field only when a task written into the plan requires it and the plan says why."

  # <!-------------------------------------------- Database -->
  database:
    - "Change the database schema only through an Alembic migration; never create or alter a table by any other route."
    - "Write every migration with a working downgrade, so any schema change can be reversed."
    - "Give every foreign key column a foreign key constraint and an index, because SQLite creates neither on its own."
    - "Enable foreign key enforcement on every SQLite connection, because SQLite leaves it off by default."
    - "Open every SQLite connection with check_same_thread disabled, because the API serves requests across threads."
    - "Keep the database in the single file named in .interface/config/backend.yaml under content.tech.database and nowhere else."

  # <!-------------------------------------------- Security -->
  security:
    - "Never include an Account password in any API response, log line, or error message."
    - "Do not decide how the Account password is stored at rest; that decision is an open question in .interface/config/state.yaml and stays with the human."
    - "Never reveal a stack trace, a file path, a SQL statement, or an internal identifier in an error message returned to a caller."
    - "Never log a request body that carries a password."
    - "Do not add authentication, sessions, or ownership checks, because the project does not ask for them; a task that needs them is raised as an open question, not implemented."

  # <!-------------------------------------------- Test -->
  test:
    - "Do not write test files for a task, because needs_test is false for both items; a task's verify command is its proof."
    - "Give every task a runnable verify command that exercises the thing the task created, and do not mark a task done until that command has passed."
    - "Run every backend verify command from backend/ inside the uv virtual environment, and every frontend verify command from frontend/."
    - "Run verify commands that touch the database against a throwaway SQLite file, never against the committed development data."
    - "Require no ownership proof, because the API has no authenticated callers and no per-user ownership."

  # <!-------------------------------------------- Contract -->
  contract:
    - "Change the API surface only together with the contract in .interface/config/backend.yaml; a route that the contract does not name is not written."
    - "Never edit a contract version whose lifecycle is frozen; a needed change is a new version, and only the human freezes or versions a contract."
    - "Implement each route exactly as its contract entry states — method, path, body, success response, and error codes."
    - "Treat contract v1 as draft until the human freezes it; a consumer defines against a frozen version only."

  # <!-------------------------------------------- Design -->
  design:
    - "Do not create or infer a design file, because the project names none; a design source is raised as an open question before any page is drawn."
    - "Draw no page until a project phase targets the frontend and states what the page shows."
    - "Give every page the same shared look once one exists, and export a page only in the format the human names."
