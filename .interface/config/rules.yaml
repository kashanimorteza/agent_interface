  path: ".interface/config/rules.yaml"
  path_note: "Generated Config — the boundaries of agent behavior on this project. Derived by my-interface-interpreter from .interface/project.md and the resolved preferences in .interface/preferences/develop.yaml, according to .interface/schema/rules.schema.yaml"
  schema: ".interface/schema/rules.schema.yaml"
