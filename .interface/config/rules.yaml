# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  precedence: "Which rule wins when two collide"
  environment: "Where code runs, what is installed into it, and what is never committed"
  code: "How code is shaped — where logic lives, what a route may do, how input is validated, and the shape every error takes"
  database: "How the schema moves — migrations, indexes, and the engine's traps"
  security: "What must never leak — the key, the stored credentials, and what an error may reveal"
  test: "What must be proven, and how, given that written tests are switched off"
  contract: "How the API surface and its contract stay in step"
  design: "How the interface is drawn"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Precedence -->
  precedence: "When two rules collide, a security rule wins over every other group; among the rest, the more specific rule wins over the more general one."

  # <!-------------------------------------------- Environment -->
  environment:
    - "Run every backend command and every backend install inside the virtual environment that uv creates under backend/, and never outside it."
    - "Add a backend dependency only through uv, so that pyproject.toml and its lock file remain the single record of what is installed."
    - "Run every frontend command through npm inside frontend/, and add a frontend dependency only through npm, so package.json and its lock file remain the single record."
    - "Never commit the backend virtual environment, node_modules, the Next.js build output, or the SQLite database file."
    - "Never commit an account credential; read it from the environment or a local, uncommitted configuration file."
    - "Use the latest stable release of every technology whose version the configuration leaves as latest, and do not pin a version the human has not asked for."

  # <!-------------------------------------------- Code -->
  code:
    - "Keep business logic in the services layer and let a route only validate input, call a service, and return its result."
    - "Validate every request body and path parameter through a Pydantic schema before it reaches a service, and never read raw request data in a route."
    - "Reach the database only through the SQLAlchemy models and a session the database module provides; a route or service never opens its own connection."
    - "Rely on the framework's built-in error responses, because the project switches centralized error handling off; do not add an error layer, an exception handler, or a custom error shape."
    - "Do not add application logging, because the project switches logging off; no logger is configured or required."
    - "Follow the naming standards in config/backend.yaml for every backend name, and the language conventions of TypeScript and Next.js for every frontend name."
    - "Name a field, a route, and a model exactly as the contract in config/backend.yaml names them, so the surface and the code never differ."

  # <!-------------------------------------------- Database -->
  database:
    - "Change the database schema only through an Alembic migration; never create or alter a table by hand or through create_all at runtime."
    - "Write every migration with a working downgrade, so that any schema change can be reversed."
    - "Keep the SQLite database file at the path config/backend.yaml names and nowhere else."
    - "Declare every foreign key the models state — a reference such as broker_id points at an existing row of the referenced table — and enable foreign-key enforcement on every SQLite connection, because SQLite does not enforce it by default."
    - "Use SQLite's batch mode in Alembic for any migration that alters an existing table, because SQLite cannot alter most column definitions in place."
    - "Add an index for every foreign-key column, because SQLite does not create one automatically."

  # <!-------------------------------------------- Security -->
  security:
    - "Never include an account password in a list or read response beyond what the contract states, and never place a stored credential in an error message."
    - "Let an error message name only what the caller sent and what was expected of it; never reveal a stack trace, a file path, a query, or the database file location."
    - "Serve plain HTTP only, because the project switches HTTPS off; do not add TLS configuration or redirect to HTTPS."
    - "Add no user authentication, session, or login, because the project switches authentication off."

  # <!-------------------------------------------- Test -->
  test:
    - "Write no test suite and require none, because the project switches testing off; needs_test is false in every item file."
    - "Prove every task by the runnable verify command it carries, run from the item's verify_cwd, and mark no task done without that command passing."
    - "Run every backend verify command inside the uv virtual environment and every frontend verify command through npm."
    - "Prove a route against the SQLite database at the path config/backend.yaml names, not against an in-memory or substitute database."

  # <!-------------------------------------------- Contract -->
  contract:
    - "Change the API surface only together with the contract in config/backend.yaml, and never let the served routes differ from the contract version they implement."
    - "Never edit a frozen contract version; a change to it is a new version, and creating one is the human's decision."
    - "Build the frontend only against the contract version config/backend.yaml publishes, and never against a route the contract does not list."
    - "Keep the API documentation the framework generates in step with the contract; a route the documentation shows is a route the contract lists."

  # <!-------------------------------------------- Design -->
  design:
    - "Create no design file, page mockup, or shared visual style until the project names one; the project states none, and a needed design is raised as an open question."
    - "Draw every frontend page from the models and routes the backend contract publishes, and show on a page only data a contract route returns."
    - "Do not export or hand-draw a page for a model the contract does not serve."
