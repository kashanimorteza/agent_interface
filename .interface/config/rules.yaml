# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".interface/config/rules.yaml"
  path_note: "Config layer of the Agent Project Interface — the boundaries of agent behavior for this project, generated from Phase 1 of project.md by my-interface-interpreter"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-09-01"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: false
  rule: "No mode edits this file. It is regenerated only by a my-interface-interpreter run, from project.md"
  changed_by: "The human, by editing project.md and re-running my-interface-interpreter. A change this file needs is raised as an open question in config/state.yaml"
  source: ".interface/project.md — Phase 1 only, and the defaults the schemas declare"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "precedence — which rule wins, before any rule is applied"
  - "environment — where code runs, before code is written"
  - "code — how code is shaped"
  - "database — how the schema moves"
  - "security — what must never leak; overrides every other group"
  - "test — what must be proven"
  - "contract — how the API surface and its contract stay in step"
  - "design — how the interface is drawn, last because no current phase draws one"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  precedence: "Which rule wins when two collide — one sentence"
  environment: "The isolated environment, what is installed into it, and what is never committed"
  code: "Where logic lives, what a route may do, and how errors behave"
  database: "Migrations, the engine's traps, and the only route to the data"
  security: "What must never leak — overrides every other group by precedence"
  test: "What must be proven, given the project disables written tests"
  contract: "No surface change without the contract, no change to a frozen version"
  design: "The design surface — nothing is drawn while no phase targets the frontend"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # <!-------------------------------------------- Precedence -->
  precedence: "When two rules collide, security wins over every other group, and a more specific rule wins over a more general one."

  # <!-------------------------------------------- Environment -->
  environment:
    - "Run every backend command and every install inside the uv-managed virtual environment of the backend's code_path — never against the system Python."
    - "Add a dependency only through uv, so the environment stays reproducible from the project files."
    - "Never commit the virtual environment, the SQLite database file, or any generated artifact."
    - "Install nothing the configuration does not call for — a disabled capability produces no dependency."

  # <!-------------------------------------------- Code -->
  code:
    - "Keep business logic out of route handlers — a route validates input, calls the layer that does the work, and shapes the response."
    - "Validate every request body and parameter with the API framework's validation schemas before it reaches the database."
    - "Rely on FastAPI's built-in error behavior only, because the project disables centralized error handling — do not add a custom error layer."
    - "Write no application logging, because the project disables logging."
    - "Follow the naming standards fixed in backend.yaml (snake_case files, functions, and variables; PascalCase classes; UPPER_SNAKE_CASE constants) instead of deciding case style file by file."

  # <!-------------------------------------------- Database -->
  database:
    - "Change the database schema only through an Alembic migration — never by editing the database directly or letting the ORM create tables ad hoc."
    - "Write every migration so it can be reversed, because SQLite offers limited ALTER TABLE support and a wrong step is otherwise unrecoverable."
    - "Reach the data only through SQLAlchemy — no raw connection outside the ORM layer."
    - "Keep the SQLite database file inside the backend's code_path and out of version control."

  # <!-------------------------------------------- Security -->
  security:
    - "Never return, log, or echo an account's Password field in any API response or error message."
    - "Check the API key on the API surface as the project requires, and reject a request that lacks a valid key."
    - "Never commit an API key, a password, or any credential into the repository."
    - "Reveal nothing in an error message beyond what the caller needs — no stack traces, no file paths, no internal identifiers."
    - "Add no authentication layer, because the project disables authentication — API key support is the only access control."

  # <!-------------------------------------------- Test -->
  test:
    - "Write no test files, because the project disables testing — needs_test is false for every item."
    - "Prove every task instead by its verify command — a runnable check against the running API — since no written test will exist."
    - "Run every verify command from the item's verify_cwd, inside its environment."

  # <!-------------------------------------------- Contract -->
  contract:
    - "Change the API surface only together with the contract in backend.yaml — the two are never allowed to drift."
    - "Never edit a frozen contract version — a change means a new version, and freezing or versioning is the human's decision."
    - "Build a consumer only against a frozen contract version, never against a draft."

  # <!-------------------------------------------- Design -->
  design:
    - "Produce no design file and no design pages while no phase targets the frontend — Phase 1 targets the backend only."
    - "Raise a design need as an open question in state.yaml instead of inventing pages or a shared look."
