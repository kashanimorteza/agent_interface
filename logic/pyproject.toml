[project]
name = "logic"
version = "0.1.0"
description = "Reusable Behaviour library: Storage Service gateway to Database and one Entity Child Service for every Model Entity."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "database",
    "model",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "logic"

[tool.uv.sources]
database = { path = "../database", editable = true }
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
