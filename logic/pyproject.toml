[project]
name = "logic"
version = "0.1.0"
description = "Reusable library of Services that holds the application's Behaviour over the Model Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "database",
    "model",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "logic"

[tool.uv.sources]
model = { path = "../model", editable = true }
database = { path = "../database", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["logic"]
