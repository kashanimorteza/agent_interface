[project]
name = "logic"
version = "0.1.0"
description = "Reusable Logic library for operating on the Trading Assistant Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.0",
    "database",
    "model",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
database = { path = "../database" }
model = { path = "../model" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.pyright]
reportUnsupportedDunderAll = "none"

[tool.ruff.lint.per-file-ignores]
"src/logic/services/entity/interface.py" = ["I001", "RUF022"]
