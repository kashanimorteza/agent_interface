[project]
name = "logic"
version = "0.1.0"
description = "Reusable application-logic library publishing its Services through one Interface."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "database",
    "model",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "logic"

[tool.uv.sources]
database = { path = "../database", editable = true }
model = { path = "../model", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
