[project]
name = "logic"
version = "0.1.0"
description = "Application Behaviour for the Trading Assistant Entities."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=48.0.0",
    "database",
    "model",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
database = { path = "../database" }
model = { path = "../model" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.ruff.lint.per-file-ignores]
"src/logic/core/dependency.py" = ["BLE001"]
