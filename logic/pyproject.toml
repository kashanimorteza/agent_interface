[project]
name = "logic"
version = "0.1.0"
description = "Reusable Logic library: the application's Behaviour, held in modular Services."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "database",
    "model",
    "sqlmodel",
]

[dependency-groups]
dev = [
    "pyright",
    "ruff",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "logic"

[tool.uv.sources]
database = { path = "../database", editable = true }
model = { path = "../model", editable = true }

[tool.ruff.lint.isort]
combine-as-imports = true
