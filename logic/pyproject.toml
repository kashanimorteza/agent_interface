[project]
name = "logic"
version = "0.1.0"
description = "Reusable Behaviour layer of the Trading Assistant: Services over Model and Database behind one Interface."
requires-python = ">=3.14"
dependencies = [
    "database",
    "model",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
database = { path = "../database", editable = true }
model = { path = "../model", editable = true }

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
reportPrivateImportUsage = "none"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
