# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "develop.yaml"
  path_note: "The address of this file — layer 4, the whole build layer in one file: the items themselves, and the rules every plan follows"
  purpose: "The build layer — what the backend and the frontend are built with, how their code is laid out, and the shape their plans follow; the plans themselves live in task.yaml"
  scope_note: "An item's settings live on its entry under content.items; its plan lives in task.yaml — there are no per-item files and no item folders"
  contract_gap: "api-v1 defines no registration, login, session, or owner field, while the root goals and the security rules require per-user ownership — no task is written against that missing surface; it is recorded as Q1 and Q2 in state.yaml"
  updated: "2026-08-25"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  scope: "Scoped by section — content.items is the working surface, everything else is the frame. The frame — plan_structure, contracts, boundaries — is fixed by the human and an agent never rewrites it. A frozen contract on an item is frame too — it is never rewritten, only versioned"
  editable_in_mode: "planning may write the items' settings and draft contracts; development and review never write this file — a task's status moves in task.yaml"
  new_item: "A new item is not added by an agent — it is raised with the human"
  new_contract_version: "A new contract version is a new entry under the producing item's contracts section, written in planning mode as a draft — it becomes frozen only by the human"
  task_creation: "An agent never writes a task into an item's plan speculatively — a plan stays as it is, empty or not, until the human explicitly asks for tasks to be created. When asked, tasks are created for exactly what was requested, no more"
  needs_test: "Whether tasks come with written tests is declared per item, as needs_test on the item's entry — true means every task that produces code is proven by a test in tests/ and its verify is that test run; false means no written test is required, though every task still carries a runnable verify. Set by the human"
  settings: "An item's settings sections — responsibility through out_of_scope — are written in planning mode only, never in development; a needed change there is recorded in the affected task's log and raised with the human"
  task_protocols: "How a task is claimed, done, blocked, and logged is the policy of task.yaml — it is not repeated here"
  on_change_needed: "A wanted change to the frame — the schemas or the vocabulary — is raised as an open question in state.yaml"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "plan_structure here, then task_schema and task_states in task.yaml — know the shape of a plan, the shape of a task, and its states before reading any item"
  - "contracts and boundaries — know how items connect and where the limits are"
  - "then the active item under items — settings first: responsibility, code_path, tech, code_layout, contracts, boundaries, out_of_scope"
  - "then that item's plan — in task.yaml, read by that file's own read_order"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  items: "The build items — backend and frontend — each with its identity and settings on its entry; their plans live in task.yaml"
  plan_structure: "The three-level shape of every plan — phases, groups inside a phase, tasks inside a group — with the schema of a phase and a group, the sizing, and the granularity rule"
  contracts: "The contract lifecycle, how a contract may change, and what a task may name in needs_contract — a contract itself lives on its producing item, under its contracts section"
  boundaries: "What an item may touch, and how items connect"


# <!--------------------------------------------------------------------------------- Content -->
content:

  # =============================================================== Items
  items:

    # ------------------------------------------------------------- Backend
    backend:
      enabled: true
      code_path: "backend/"
      code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
      summary: "API, task and user logic, database"
      needs_test: true
      verify_cwd: "Every verify command runs from backend/ — inside its virtual environment"

      responsibility: "HTTP API — task and group logic, validation, and the database"

      tech:
        language:
          name: "Python"
          version: "3.12"
          frameworks:
            api: "FastAPI — HTTP layer, routing, and request validation"
            orm: "SQLAlchemy — data models and queries"
            migrations: "Alembic — schema changes, one migration per change"
            test: "pytest — test runner"
        database:
          engine: "SQLite"
          storage: "A single file on disk — its path comes from configuration, never hardcoded"
          owned_by: "This item — the schema belongs to the backend and no other item reaches it"
          access: "Only through the ORM — a route never opens a connection of its own"
        environment: "A virtual environment inside code_path — every command and every install happens inside it, and it is never committed"
        run: "uvicorn app.main:app --reload"

      code_layout:
        "app/main.py": "Entry point — the application object and the router registrations"
        "app/config.py": "Configuration — the database path and every other setting, read from the environment"
        "app/db/": "Engine and session — the only place a connection is opened"
        "app/models/": "ORM models — the database schema in Python"
        "app/schemas/": "Validation models — every API input and output is bound to one"
        "app/services/": "Business logic — the only layer permitted to query the database"
        "app/api/": "Routes — accept input, call a service, return output, nothing else"
        "app/errors.py": "The uniform error shape and its handlers"
        "migrations/": "Alembic — one migration per schema change, each with its downgrade"
        "tests/": "Tests — mirror the structure of app/"

      contracts:
        produces: "api-v1"
        rule: "This item's implementation must match the frozen contract exactly — the contract is the promise, not a sketch"
        change_rule: "api-v1 is frozen — a needed change means api-v2, a new entry beside it, and that is a human decision"

        api-v1:
          lifecycle: "frozen"
          lifecycle_note: "Final — the implementation matches it and the frontend may define tasks against it. This version never changes; a change means api-v2."
          consumed_by: "frontend"
          contract_read_order:
            - "conventions — they apply to everything that follows"
            - "error_shape — every route's errors point at its codes"
            - "models — every route's response is one of them"
            - "routes — last, because each one is read against the three above"

          conventions:
            transport: "HTTP with JSON bodies"
            ids: "Integers, assigned by the server; a client never chooses one"
            timestamps: "ISO 8601, UTC"
            unknown_id: "Any route addressing a missing group or task answers 404 with the error shape below"

          error_shape:
            rule: "Every non-2xx response has exactly these three fields, with no others"
            fields:
              code: "A stable machine-readable string — a client may branch on it"
              message: "One human-readable sentence, safe to show a user"
              details: "An object with anything specific to this error; may be empty"
            codes:
              not_found: "404 — no group or task with that id"
              invalid_input: "422 — the body failed validation; details.fields lists field and problem"
              http_error: "4xx raised by the transport layer, such as an unknown route"
              internal_error: "500 — the service failed; details is always empty and no internals are exposed"

          models:
            Group:
              id: "integer"
              name: "string, 1 to 120 characters"
              created_at: "timestamp"
            Task:
              id: "integer"
              group_id: "integer — the group this task belongs to"
              title: "string, 1 to 200 characters"
              done: "boolean, false when created"
              created_at: "timestamp"

          routes:

            - method: "GET"
              path: "/health"
              summary: "Liveness"
              response: "200 — {status, service}"

            - method: "POST"
              path: "/groups"
              summary: "Create a group"
              body: "{name}"
              response: "201 — Group"
              errors: ["invalid_input"]

            - method: "GET"
              path: "/groups"
              summary: "List every group, ordered by id"
              response: "200 — array of Group, empty array when there are none"

            - method: "GET"
              path: "/groups/{group_id}"
              summary: "Read one group"
              response: "200 — Group"
              errors: ["not_found"]

            - method: "PATCH"
              path: "/groups/{group_id}"
              summary: "Rename a group"
              body: "{name}"
              response: "200 — Group"
              errors: ["not_found", "invalid_input"]

            - method: "DELETE"
              path: "/groups/{group_id}"
              summary: "Delete a group and every task inside it"
              response: "204 — no body"
              errors: ["not_found"]

            - method: "POST"
              path: "/groups/{group_id}/tasks"
              summary: "Create a task inside a group"
              body: "{title}"
              response: "201 — Task"
              errors: ["not_found", "invalid_input"]

            - method: "GET"
              path: "/groups/{group_id}/tasks"
              summary: "List the tasks of one group, ordered by id"
              response: "200 — array of Task, empty array when the group has none"
              errors: ["not_found"]

            - method: "GET"
              path: "/tasks/{task_id}"
              summary: "Read one task"
              response: "200 — Task"
              errors: ["not_found"]

            - method: "PATCH"
              path: "/tasks/{task_id}"
              summary: "Change a task's title, its done state, or both"
              body: "{title?, done?}"
              response: "200 — Task"
              errors: ["not_found", "invalid_input"]

            - method: "DELETE"
              path: "/tasks/{task_id}"
              summary: "Delete a task"
              response: "204 — no body"
              errors: ["not_found"]

      boundaries:
        owns: "All code inside backend/, and the whole database schema"
        does_not_own: "Client code — not a single line"
        interface: "The only thing this item promises the outside is the api-v1 contract"

      out_of_scope:
        - "Rendering and user interface"
        - "Deployment infrastructure and CI"

    # ------------------------------------------------------------- Frontend
    frontend:
      enabled: true
      code_path: "frontend/"
      code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
      summary: "Web client — consumer of the api-v1 contract"
      needs_test: true
      verify_cwd: "Every verify command runs from frontend/"
      cross_item_rule: "No task here depends on a backend task — the only dependency is on the contract version, via needs_contract"

      responsibility: "Web client — user interface for login, registration, and task management"

      tech:
        language:
          name: "TypeScript"
          frameworks:
            ui: "React — components and rendering"
            build: "Vite — dev server and bundling"
            routing: "React Router — one route per page"
            test: "Vitest + Testing Library — test runner and component testing"
        database:
          engine: "none — this item never touches a database; all data arrives through api-v1"
        state: "Server state via a request cache; local state via React's own hooks"
        run: "npm run dev"

      code_layout:
        "src/main.tsx": "Entry point"
        "src/api/": "API client — the only layer that talks to the network"
        "src/pages/": "Pages — one file per route"
        "src/components/": "Reusable components"
        "src/auth/": "Session handling and route protection"
        "tests/": "Tests — mirror the structure of src/"

      contracts:
        consumes: "api-v1"
        contract_location: "this file — content.items.backend.contracts.api-v1, on the producing item"
        rule: "Tasks in this item depend on the contract version, not on backend tasks"
        before_frozen: "Until the contract is frozen, work proceeds against mock data derived from that same contract"

      boundaries:
        owns: "All code inside frontend/"
        does_not_own: "Backend code and the database schema — not a single line"
        interface: "The only way to communicate with the backend is the api-v1 contract"

      out_of_scope:
        - "Server-side business logic and final validation"
        - "Direct database access"
        - "Deployment infrastructure and CI"

  # =============================================================== Plan structure
  plan_structure:
    rule: "Every plan has exactly three levels — phases at the top, groups inside a phase, tasks inside a group; a task never sits directly in a phase, and nothing sits outside a phase"

    phase_schema:
      purpose: "A phase is one stage of the build — the plan moves phase by phase, and a later phase assumes the earlier ones are done"
      fields:
        id: "P1, P2, ... — numbered in build order, unique within the item"
        title: "The stage in a few words"
        does: "What this phase accomplishes — what exists at its end that did not exist at its start"
        groups: "The groups of this phase — every task of the phase lives inside exactly one of them"

    group_schema:
      purpose: "A group is one area of work inside a phase — related tasks side by side"
      fields:
        id: "P1-G1, P1-G2, ... — the phase id plus a group number, unique within the item"
        title: "The area in a few words"
        does: "What this group of tasks is doing, and what is true when all of them are done"
        task_count: "How many tasks the group holds — stated on the group so the size is visible without counting"
        tasks: "The tasks of this group, each per task_schema in task.yaml"

    sizing:
      phases: "About ten phases per item — one per build stage, in the order the stages are built"
      groups_per_phase: "About five to ten groups per phase — one per area of work"
      tasks_per_group: "Five, ten, up to twenty tasks per group — as many as the area truly needs, never padded and never squeezed"

    granularity:
      rule: "A task is one concrete act, never something general — it names the file it creates or the piece it changes, and one sitting finishes it"
      examples:
        - "Creating a main file and writing its first content — one task"
        - "An API with several modules — each module is its own task, never one task called 'build the API'"
        - "A model, its migration, its schema, its service, its route, its test — each its own task, never one task called 'the tasks feature'"
      test: "If a task's title needs the word 'and' more than once, or its touches spans unrelated files, it is too big — split it"


  # =============================================================== Contracts
  contracts:
    location: "A contract lives on its producing item, under content.items.<item>.contracts — the consuming item points at it and never copies it"
    lifecycle:
      draft: "Under design — only the producing item relies on it"
      frozen: "Final — the consuming item may define tasks against it"
      deprecated: "Obsolete — replaced by a newer version"
    change_rule: "A frozen contract never changes — a new version is created instead"
    coverage_rule: "A task may only name a contract that exists — a task needing a surface no contract provides is blocked, not written against a guess"


  # =============================================================== Boundaries
  boundaries:
    code_isolation: "Each item writes only inside its own code_path — touching another item's code is forbidden"
    cross_item_link: "Items connect only through a producing item's contract — never through direct task-to-task dependencies"
    contract_change: "A frozen contract never changes — if a change is needed, raise it with the human"
