meta:
  layer: "cross"
  layer_name: "HISTORY — project history"
  purpose: "Answers 'why did we end up here' — not current state, not definition"
  write_mode: "append-only"
  immutability: "Nothing is deleted or overwritten — a wrong record is corrected by a new record, never by editing the old one"
  index_agent_may_edit: false
  index_on_change_needed: "Record a proposal in questions.yaml — this index itself changes only by a human"
  files_agent_may_edit: true
  updated: "2026-08-24"


records:

  decisions:
    path: "history/decisions/"
    responsibility: "Decision records (ADR) — architecture and design decisions someone will later ask 'why was it done this way'"
    file_pattern: "ADR-0001-<slug>.yaml"
    id_source: "The ADR counter in counters.yaml"
    when_to_write: "Any decision that affects more than one task, or that will look non-obvious later"
    fields:
      id: "ADR identifier"
      title: "The decision in one sentence"
      date: "Date recorded"
      context: "What problem led to this decision"
      decision: "What was decided"
      alternatives: "What options were rejected and why"
      consequences: "What this decision makes easy and what it makes hard"
      status: "active | superseded"
      superseded_by: "Id of the replacing ADR — only when status is superseded"

  journal:
    path: "history/journal/"
    responsibility: "Report of each agent session — what happened, what remains, what is next"
    file_pattern: "<YYYY-MM-DD>-<seq>-<item>.yaml"
    when_to_write: "At the end of every session — mandatory, even if the session produced nothing"
    fields:
      date: "Session date"
      mode: "The active mode during that session"
      item: "The active item during that session"
      tasks_touched: "Tasks touched and the outcome of each"
      decisions_made: "Ids of ADRs recorded in this session"
      blockers_opened: "Blockers opened"
      blockers_resolved: "Blockers resolved"
      questions_asked: "Questions recorded for the human"
      unfinished: "Unfinished work — exactly where it stopped and where the next agent should resume"
      next: "Suggested next step"


rules:
  append_only: "A recorded file is never edited — corrections are made by adding a new record"
  no_deletion: "No file is ever removed from this layer, even if its decision is obsolete"
  supersede_not_edit: "An obsolete decision is replaced by a new ADR and the old status becomes superseded — this is the only edit allowed"
  session_mandatory: "Every session has exactly one journal entry — without it, the session is incomplete"
  handoff: "If work is left unfinished, the unfinished field must let the next agent resume without guessing"
  no_state_here: "Current state is never written here — that belongs in state.yaml; this layer records only past events"
  id_before_write: "Before creating any ADR, increment the ADR counter in counters.yaml"
