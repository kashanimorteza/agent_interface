# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "root.yaml"
  path_note: "Layer 1, the entry point of the Agent Project Interface — the only file an agent finds without guidance"
  standard: "Agent Project Interface"
  version: "1.0"
  updated: "2026-08-26"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "This file holds no write protocol for results — every other file carries its own write rules, scoped to what that file owns"
  by_mode: "What may be written where is decided per mode — see content.modes — never here"
  on_change_needed: "A wanted change to the read order, the layers, or the modes is raised with the human, never applied by an agent"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  enforcement: "Exactly this order — no less, no more"
  steps:
    - step: 1
      read: "root.yaml"
      why: "This file — read protocol and working modes; the write rules of each file are read with that file, under its own policy section"
    - step: 2
      read: "definition.yaml"
      why: "Understand what product is being built"
    - step: 3
      read: "rules.yaml"
      why: "Read in full — every rule lives here and security overrides everything"
    - step: 4
      read: "develop.yaml"
      why: "Learn the frame of the build layer — which items exist and which file holds each, the shape of a plan, and how items connect"
    - step: 5
      read: "task.yaml"
      why: "Know the shape of a task, its states, and where every plan stands"
    - step: 6
      read: "state.yaml"
      why: "Learn the active mode, the active item, the blockers, and the open questions"
    - step: 7
      read: "Active item: its own file — named on its entry in develop.yaml — and its plan in task.yaml"
      why: "Understand the item you are working on and where each of its tasks stands"
  no_history_layer: "There is no history file — the reason behind a task's current state travels with the task, in its own log field"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  structure: "The files of the interface — the layer, path, and responsibility of each"
  modes: "The working modes — planning, development, review — and what each may write"


# <!--------------------------------------------------------------------------------- Content -->
content:

  structure:

    root:
      layer: 1
      path: "root.yaml"
      responsibility: "Entry point — read protocol and working modes"
      note: "The only file an agent finds without guidance"

    definition:
      layer: 2
      path: "definition.yaml"
      responsibility: "Product definition — identity, goals, and architecture"
      note: "To understand what is being built, read definition.yaml"

    rules:
      layer: 3
      path: "rules.yaml"
      responsibility: "Rules governing agent behavior — security, quality, and their precedence"
      note: "No rule lives anywhere else — read rules.yaml before doing anything"

    develop:
      layer: 4
      path: "develop.yaml"
      responsibility: "Build layer frame — the item index, the plan structure, the contract lifecycle, and the boundaries"
      note: "For any work in this layer, read develop.yaml first — it names the file of every item"

    items:
      layer: 4
      path: "backend.yaml, frontend.yaml"
      responsibility: "The items themselves — one file per item: its settings and the contracts it produces or consumes"
      note: "An item's settings live in its own file and nowhere else; the shape they follow is schema/item.schema.yaml"

    task:
      layer: 5
      path: "task.yaml"
      responsibility: "Task layer — the shape of a task, its states, and the plans that hold the tasks"
      note: "A task and its status live here — the plan is both definition and state"

    state:
      layer: 6
      path: "state.yaml"
      responsibility: "Project-wide state — active mode, active item, blockers, and open questions"
      note: "Task status does not live here — every task carries its own status field in task.yaml"


  modes:
    rule: "Exactly one mode is active at a time — it is named in state.yaml under active.mode"
    set_by: "The human — an agent never changes the active mode"

    planning:
      purpose: "Decide what will be built and in what order — no product code is written"
      may_write:
        - "The item files — backend.yaml and frontend.yaml — their settings and draft contracts, never a frozen contract"
        - "task.yaml — the plans only, never task_schema and task_states"
        - "state.yaml"
      may_not_write:
        - "Any file under an item's code_path"
        - "A frozen contract"
        - "root.yaml, definition.yaml, rules.yaml, and develop.yaml — the frame of the build layer"

    development:
      purpose: "Implement the tasks that planning defined"
      may_write:
        - "Files under the active item's code_path, limited to the touches of the claimed task"
        - "task.yaml — the status, blocker, and log fields of a task only, never the plan"
        - "state.yaml"
      may_not_write:
        - "Another item's code_path"
        - "A frozen contract"
        - "root.yaml, definition.yaml, rules.yaml, develop.yaml, and the item files"
      plan_change: "Changing a task in this mode requires the reason written into that task's log and human approval — an agent never silently rewrites the plan it is executing"

    review:
      purpose: "Read the result and report — nothing is repaired in this mode"
      may_write:
        - "state.yaml — blockers and open questions only"
        - "task.yaml — the status, blocker, and log fields of a task only, to mark it blocked and record what was found"
      may_not_write:
        - "Anything else"
