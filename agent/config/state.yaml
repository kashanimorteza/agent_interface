# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "state.yaml"
  path_note: "The address of this file — layer 6, the operational state"
  purpose: "The project-wide state — active mode, active item, blockers, and open questions"
  shape: "schema/state.schema.yaml — the shape of this file: its sections, their order, and what each parameter means"
  scope_note: "This file holds no definition, no rule, and no task status — the status of a task lives on the task itself, in task.yaml"
  phase_scope: "Phase 1 only — every blocker and every question below is about the data-entry build"
  reason: "Only what belongs to no single task lives here — per-task state travels with the task, so definition and status can never drift apart"
  updated: "2026-08-27"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning, development, and review — review may write blockers and open questions only"
  rule: "Every result is recorded in the file that owns it — this file owns blockers and open questions, nothing else"
  blocker: "Written under blockers — with an id, what is actually missing, and its consequence; the affected tasks point at it by id from task.yaml"
  open_question: "Written under open_questions — addressed to the human, with why it matters and which blocker it blocks; an agent never answers one on its own"
  decision_pending: "A decision the human must still make is an open question here — it is not a decision, and nothing is built on its assumed answer"
  active: "Never written by an agent — active.mode and active.item are set by the human"
  by_mode: "planning and development may write blockers and open questions; review may write blockers and open questions only"
  agent_may_edit_field: "Every file carries agent_may_edit in its policy — false means the human owns it, and an agent that wants it changed raises an open question here instead"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active — know the mode you are in and the item you are on before anything else"
  - "blockers — know what cannot move and why"
  - "open_questions — know what is waiting on the human, so you do not answer it yourself"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "The one mode and the one item currently in play — set by the human"
  blockers: "What is actually missing, by id — the tasks that cannot move point here"
  open_questions: "What the human still has to decide, by id — each names the blocker it would release"


# <!--------------------------------------------------------------------------------- Content -->
content:

  active:
    mode: "planning"
    mode_reason: "No code exists yet and no plan has been written — api-v1 is still a draft, so nothing is implementable until the questions below are answered and the contract is frozen"
    item: "none"
    set_by: "human"


  blockers:

    - id: "B1"
      blocks: "Every backend task that names api-v1 — 80 of the 93 in task.yaml, from the six models through the migrations, the validation schemas, the error surface, all four operations of all six records, and the conformance run. The 13 tasks that need no contract — the environment, the package tree, the application object, configuration, the database layer, the declarative base, and the Alembic setup — are todo and can proceed"
      what_is_missing: "A frozen api-v1. Phase 1 names the operations Add, Edit, Update, Delete, and Status without separating Edit from Update, names no read or list operation, and fixes no type, length, or permitted value for Status, State, Risk Parameter, or Profit — so the surface cannot be settled"
      consequence: "The plan can be written and its foundation built, but not one record can be modelled, migrated, validated, or exposed until the contract is frozen"
      decision_belongs_to: "human"
      raised: "2026-08-26"

    - id: "B2"
      blocks: "The frontend item entirely — its settings cannot be written and no task for it can exist"
      what_is_missing: "Any definition of the frontend at all. Phase 1 says only to be defined — no language, no framework, no code path, no responsibility"
      consequence: "The item stands in the interface with enabled false and does nothing until the human defines it"
      decision_belongs_to: "human"
      raised: "2026-08-26"


  open_questions:
    note: "Addressed to the human — an agent does not answer these on its own"
    questions:

      - id: "Q1"
        question: "Phase 1 lists Edit and Update as separate operations. Are they two different things — a partial change and a full replacement — or the same operation named twice?"
        why_it_matters: "The draft contract collapses them into one update route per model. If they are meant to be distinct, every model is missing a route, and api-v1 cannot be frozen as written"
        blocks: "B1"

      - id: "Q2"
        question: "Phase 1 names Add, Edit, Update, Delete, and Status but no read or list operation. Is reading one record and listing many part of managing a model, or deliberately out of Phase 1?"
        why_it_matters: "Without them the API can create and change records that nothing can ever read back. They are not written into the draft because they cannot be derived from Phase 1"
        blocks: "B1"

      - id: "Q3"
        question: "Every one of the six models carries a Status field and there is a Status operation that sets it. What values may it hold?"
        why_it_matters: "Validation, the database column, and the Status route all need the vocabulary. Nothing in Phase 1 names a single permitted value"
        blocks: "B1"

      - id: "Q4"
        question: "Execute carries both State and Status. What separates them, and what values does State take?"
        why_it_matters: "Two fields with the same kind of name on one model will be built wrong if the difference is guessed; Execute cannot be modelled until it is stated"
        blocks: "B1"

      - id: "Q5"
        question: "What is a Strategy's Risk Parameter — a single number, a named choice, or a structure of several values?"
        why_it_matters: "It is the one field that makes a strategy more than a name, and its type decides the column, the validation, and the body of two routes"
        blocks: "B1"

      - id: "Q6"
        question: "What is Execute's Profit — a decimal amount, and in what unit or currency?"
        why_it_matters: "A money value stored as the wrong type is a defect that survives every later phase; Phase 1 fixes neither type nor unit"
        blocks: "B1"

      - id: "Q7"
        question: "An Account carries a Password, but Phase 1 requires no authentication and nothing in Phase 1 reads it back. Is it a credential to be hashed irreversibly, or a secret that must stay recoverable?"
        why_it_matters: "The security rules forbid returning it, but how it is stored cannot be decided by an agent — hashing it is irreversible, and storing it recoverably is a deliberate risk. No task may write that field until this is answered"
        blocks: "B1"

      - id: "Q8"
        question: "What is the frontend? Phase 1 names it and defines nothing — no language, no framework, no code path, no responsibility"
        why_it_matters: "The item stands in the interface with enabled false. Until it is defined it has no settings, no plan, and no way to consume the contract"
        blocks: "B2"

      - id: "Q9"
        question: "rules.yaml requires one design page per interface file, and the interface files have changed — backend.yaml and frontend.yaml each have their own shape now, and the schema folder has grown. rules.yaml is human-owned"
        why_it_matters: "The design rule asks for pages that do not exist and no longer matches the files that do — the rule may not be corrected by an agent"
        answered_so_far: "On 2026-08-26 the whole interface was regenerated against Phase 1 of project.md with the design rules kept exactly as they stand — what remains open is only that the pages in design/file.drawio have not caught up with the current files"
        blocks: "nothing yet"

      - id: "Q10"
        question: "schema/frontend.schema.yaml is the backend's shape with the word frontend swapped in — its contracts section offers produces, rule, change_rule, and a version entry, but no field for a contract this item consumes, and its tech section asks a client for an ORM, a migrations framework, and a database. Is that intended, or should the frontend have a shape of its own?"
        why_it_matters: "The frontend is a consumer, not a producer. frontend.yaml carries consumes and contract_location so it can name the contract it reads, and those two keys have no place in the shape. A schema file is human-owned and may not be corrected by an agent"
        blocks: "nothing yet"

      - id: "Q11"
        question: "root.yaml is the only file in config/ with no shape of its own — schema/ holds one file per config file except this one. Should schema/root.schema.yaml exist, fixing the two sections root.yaml carries — structure and modes — the way every other file's shape is fixed?"
        why_it_matters: "root.yaml is the index every agent reads first, and it is the one file whose sections nothing checks. Every other config file names its shape in meta.shape and can be validated against it; root.yaml carries no such field because there is nothing to point at. A schema file is human-owned and may not be created by an agent"
        blocks: "nothing yet"
