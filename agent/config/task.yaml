# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "task.yaml"
  path_note: "The address of this file — layer 5, the task layer: the configuration of tasks and the plans that hold them"
  purpose: "Task configuration — the fields every task carries, the states it may hold — and the plans of the items"
  shape: "schema/task.schema.yaml — the shape of this file: its sections, their order, and the three levels of a plan"
  plan_source: "The three-level shape of a plan — phases, groups, tasks — is defined in schema/task.schema.yaml, under sections.phases"
  creation_rule_source: "Whether and when a task may be written here is governed by policy.task_creation below — no task is added speculatively"
  status_lives_here: "Every task carries its own status field — this file both defines the task and says where it stands; there is no separate status list"
  phase_scope: "Phase 1 only — the phase titles below are the stages of the data-entry build and nothing beyond it"
  contract_gap: "api-v1 is a draft, not frozen — every task that names it is written with status blocked and blocker B1, per policy.coverage_rule; only the tasks that need no contract are todo. Recorded as B1 and Q1 through Q7 in state.yaml"
  points_to: "backend.yaml — content.contracts.api-v1, the contract a task names in needs_contract"
  updated: "2026-08-27"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning may write plans; in development, only the status, blocker, and log fields of a task may change"
  scope: "The plans are the working surface; task_schema, task_states, and phase_titles are the frame — fixed by the human, never rewritten by an agent"
  rule: "Every result about a task is recorded here, on the task itself — an agent that writes nowhere has done nothing"
  task_creation: "An agent never writes a task into a plan speculatively — a plan stays as it is, empty or not, until the human explicitly asks for tasks to be created. When asked, tasks are created for exactly what was requested, no more"
  task_status: "The status field on the task — the one field that moves; a blocked task also names its blocker id from state.yaml"
  claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
  done_gate: "A task becomes done only after its verify has been run and passed from inside the item's code_path — the code being written is not the gate"
  blocked_protocol: "On a blocker, set the task to blocked, name the blocker id, state what is missing in state.yaml, and stop — an agent never invents its way past a missing contract or a missing decision"
  coverage_rule: "A task may only name a contract that is frozen — a task needing a surface that exists only as a draft, or not at all, is blocked, not written against a guess"
  decision: "A decision about a task goes into that task's log with its date and reason — a decision the human must still make is an open question in state.yaml, not a log entry"
  log: "Append-only — a past entry is never rewritten"
  plan_change: "In development mode the plan fields of a task change only with the reason written into its log and human approval; in planning mode the plan may be written freely, but never against a contract that is not frozen"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "schema/task.schema.yaml first — know the shape of a task, its states, and the three levels of a plan"
  - "task_schema and task_states here — the frame itself, before any plan is read"
  - "then the plan — phases in order, P1 first; a later phase assumes the earlier ones are done"
  - "inside a phase, its does line first, then its groups in order — each group's does says what its tasks accomplish together"
  - "inside a group, tasks by id — depends_on names what must be done before, and is the actual order when it disagrees"
  - "for each task, status before anything else — a task that is not todo is not yours to start"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: "The fields every task carries"
  task_states: "The status vocabulary a task's status field may hold, and the protocols around it"
  phase_titles: "Quick lookup from phase id to its title — the stages the Phase 1 build follows, in build order"
  phases: "The backend plan — 93 tasks in 28 groups across the 14 Phase 1 phases; the tasks that need api-v1 stand blocked on B1 while it is a draft, the rest are todo"


# <!--------------------------------------------------------------------------------- Content -->
content:

  task_schema:
    rule: "Every task carries exactly these fields"
    fields:
      id: "Identifier unique within the item — for example 0001; each item numbers its own tasks"
      title: "The task in one sentence"
      goal: "What becomes possible after this task that was not possible before"
      depends_on: "Ids of tasks in the same item — depending on another item is forbidden"
      needs_contract: "The contract version required — used instead of depending on another item's task; omitted when the task needs none"
      acceptance: "Human-readable acceptance criterion — what must actually work"
      verify: "A runnable command that proves acceptance — without it a task is never done; when the item's needs_test is true, this is the test run itself for every task that produces code"
      touches: "Paths this task touches, written relative to the item's code_path"
      status: "Where the task stands right now — the one field of a task that moves; vocabulary in task_states"
      blocker: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise"
      log: "Append-only list of dated entries carried with the task — who claimed it, why it moved, the reason for a cancellation, the successor of a superseded task, an approved plan change with its reason; absent until the task first moves"
    status_lives_here: "Status is written on the task itself — the entry that defines a task also says where it stands, so definition and state can never drift apart"
    history_lives_here_too: "There is no history file — how a task got to its current state is recorded in its own log field, and a past log entry is never rewritten"


  task_states:
    path: "the status field on each task"
    states:
      todo: "Defined, not started"
      claimed: "An agent has taken it and is working on it"
      blocked: "Stopped — the reason is stated to the human, who decides how to proceed"
      done: "verify was run and passed"
      cancelled: "No longer needed — the reason is recorded in the task's log"
      superseded: "Replaced by another task — the successor id is recorded in the task's log"
    derived_ready: "ready is not a stored status — a task is ready when it is todo and all of its depends_on are done"
    done_gate: "Without a passing verify run, no task becomes done — even if the code is written"
    claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
    status_only_in_development: "In development mode the status, blocker, and log fields are the only part of a plan an agent may change — every other field is the plan, and the plan changes only in planning mode with the reason written into the task's log"


  phase_titles:
    P1: "Foundation"
    P2: "Configuration"
    P3: "Database layer"
    P4: "Models"
    P5: "Migrations"
    P6: "Validation schemas"
    P7: "Error surface"
    P8: "Account"
    P9: "Asset"
    P10: "Strategy"
    P11: "Action group"
    P12: "Action"
    P13: "Execute"
    P14: "Conformance"


  

  phases:

    # ================================================================= P1
    - id: "P1"
      title: "Foundation"
      does: "At the end of this phase an isolated interpreter exists with every dependency inside it, the package tree stands, and the application object starts — before it, nothing runs at all"
      groups:

        - id: "P1-G1"
          title: "Virtual environment"
          does: "An isolated interpreter with every dependency pinned and installed — the ground every later verify stands on"
          task_count: 3
          tasks:

            - id: "0001"
              title: "Create the virtual environment"
              goal: "backend/ has its own interpreter, separate from the system one"
              depends_on: []
              acceptance: "A virtual environment exists inside backend/ and its interpreter resolves to it"
              verify: "python -c \"import sys; assert 'backend' in sys.prefix\""
              touches: [".venv/"]
              status: "todo"

            - id: "0002"
              title: "Write requirements.txt"
              goal: "Every dependency the backend needs is named and pinned in one file"
              depends_on: ["0001"]
              acceptance: "requirements.txt pins fastapi, uvicorn, sqlalchemy, alembic, and pydantic; no test runner is listed, because Phase 1 requires none"
              verify: "python -c \"r=open('requirements.txt').read(); assert all(p in r for p in ['fastapi','uvicorn','sqlalchemy','alembic','pydantic'])\""
              touches: ["requirements.txt"]
              status: "todo"

            - id: "0003"
              title: "Install the requirements into the virtual environment"
              goal: "Every dependency imports from inside the environment, and nothing was installed globally"
              depends_on: ["0002"]
              acceptance: "fastapi, sqlalchemy, alembic, and pydantic all import from inside the virtual environment"
              verify: "python -c \"import fastapi, sqlalchemy, alembic, pydantic\""
              touches: [".venv/"]
              status: "todo"

        - id: "P1-G2"
          title: "Repository hygiene"
          does: "What must never be committed is ignored before it ever exists"
          task_count: 1
          tasks:

            - id: "0004"
              title: "Write the backend .gitignore"
              goal: "The environment, the database file, and the caches never enter git"
              depends_on: []
              acceptance: ".gitignore covers .venv/, *.db, and __pycache__/"
              verify: "python -c \"g=open('.gitignore').read(); assert '.venv' in g and '*.db' in g and '__pycache__' in g\""
              touches: [".gitignore"]
              status: "todo"

        - id: "P1-G3"
          title: "Package skeleton"
          does: "Every folder named in the item's code_layout exists as an importable package, so every later task has its place ready"
          task_count: 1
          tasks:

            - id: "0005"
              title: "Create the app package tree"
              goal: "app/ and each of its subpackages import"
              depends_on: ["0003"]
              acceptance: "app, app.api, app.db, app.models, app.schemas, and app.services all import, each from its own __init__.py"
              verify: "python -c \"import app, app.api, app.db, app.models, app.schemas, app.services\""
              touches: ["app/__init__.py", "app/api/__init__.py", "app/db/__init__.py", "app/models/__init__.py", "app/schemas/__init__.py", "app/services/__init__.py"]
              status: "todo"

        - id: "P1-G4"
          title: "Application object"
          does: "The one application object every router will later register on"
          task_count: 1
          tasks:

            - id: "0006"
              title: "Create app/main.py with the FastAPI application object"
              goal: "The service starts and has a single application object"
              depends_on: ["0005"]
              acceptance: "app.main exposes an object named app that is a FastAPI instance; Phase 1 defines no route on it yet, so none is added"
              verify: "python -c \"from app.main import app; from fastapi import FastAPI; assert isinstance(app, FastAPI)\""
              touches: ["app/main.py"]
              status: "todo"

    # ================================================================= P2
    - id: "P2"
      title: "Configuration"
      does: "At the end of this phase the database path comes from the environment with a safe default — before it, a path could only be hardcoded, which the rules forbid"
      groups:

        - id: "P2-G1"
          title: "Config module"
          does: "One module owns every setting, and the database path is read rather than written into the code"
          task_count: 2
          tasks:

            - id: "0007"
              title: "Create app/config.py and read the database path from the environment"
              goal: "The database path is a setting, not a literal"
              depends_on: ["0005"]
              acceptance: "app.config reads the database path from an environment variable, so a verify run can point it at a throwaway file"
              verify: "python -c \"import os; os.environ['BACKEND_DB_PATH']='/tmp/probe.db'; import app.config as c; assert c.get_db_path()=='/tmp/probe.db'\""
              touches: ["app/config.py"]
              status: "todo"

            - id: "0008"
              title: "Give the database path a default outside the repository"
              goal: "With no environment variable set, the database still never lands inside the repository"
              depends_on: ["0007"]
              acceptance: "With the environment variable unset, the default path resolves outside the repository folder"
              verify: "python -c \"import os; os.environ.pop('BACKEND_DB_PATH',None); import app.config as c, pathlib; assert not str(pathlib.Path(c.get_db_path()).resolve()).startswith(str(pathlib.Path('.').resolve()))\""
              touches: ["app/config.py"]
              status: "todo"

    # ================================================================= P3
    - id: "P3"
      title: "Database layer"
      does: "At the end of this phase one module owns the engine, one owns the session, and foreign keys are enforced on every connection — before it, no code can reach a database at all"
      groups:

        - id: "P3-G1"
          title: "Engine"
          does: "One place builds the engine, from configuration only"
          task_count: 1
          tasks:

            - id: "0009"
              title: "Create app/db/engine.py"
              goal: "Every connection the service opens starts in one place"
              depends_on: ["0007"]
              acceptance: "app.db.engine builds the SQLAlchemy engine from the configured path, and no other module calls create_engine"
              verify: "python -c \"import os; os.environ['BACKEND_DB_PATH']='/tmp/probe.db'; from app.db.engine import get_engine; assert get_engine() is not None\""
              touches: ["app/db/engine.py"]
              status: "todo"

        - id: "P3-G2"
          title: "Session"
          does: "One dependency yields a session and closes it — no route or service opens its own"
          task_count: 1
          tasks:

            - id: "0010"
              title: "Create app/db/session.py"
              goal: "A request-scoped session exists as a dependency the routes can take"
              depends_on: ["0009"]
              acceptance: "app.db.session exposes a get_session dependency that yields a session and closes it afterwards"
              verify: "python -c \"import os; os.environ['BACKEND_DB_PATH']='/tmp/probe.db'; from app.db.session import get_session; s=next(get_session()); assert s is not None\""
              touches: ["app/db/session.py"]
              status: "todo"

        - id: "P3-G3"
          title: "Foreign keys"
          does: "The SQLite foreign key pragma runs on every connection — without it the reference rules are silently unenforced"
          task_count: 1
          tasks:

            - id: "0011"
              title: "Enable the SQLite foreign key pragma on every connection"
              goal: "No connection ever runs with foreign keys off"
              depends_on: ["0009"]
              acceptance: "A connect listener on the engine issues PRAGMA foreign_keys=ON, and a fresh connection reports it enabled"
              verify: "python -c \"import os; os.environ['BACKEND_DB_PATH']='/tmp/probe.db'; from app.db.engine import get_engine; from sqlalchemy import text; assert get_engine().connect().execute(text('PRAGMA foreign_keys')).scalar()==1\""
              touches: ["app/db/engine.py"]
              status: "todo"

    # ================================================================= P4
    - id: "P4"
      title: "Models"
      does: "At the end of this phase the six Phase 1 records exist as ORM models — before it, the schema exists only as a list of field names in project.md"
      groups:

        - id: "P4-G1"
          title: "Declarative base"
          does: "One Base every model inherits from, so one metadata drives every migration"
          task_count: 1
          tasks:

            - id: "0012"
              title: "Create app/models/base.py"
              goal: "There is exactly one metadata object for the whole schema"
              depends_on: ["0005"]
              acceptance: "app.models.base exposes Base, and every later model registers on its metadata"
              verify: "python -c \"from app.models.base import Base; assert hasattr(Base,'metadata')\""
              touches: ["app/models/base.py"]
              status: "todo"

        - id: "P4-G2"
          title: "The six records"
          does: "Each Phase 1 record as its own ORM model, with the fields project.md names and the references between them"
          task_count: 6
          tasks:

            - id: "0013"
              title: "Create app/models/account.py"
              goal: "The Account record exists in the schema"
              depends_on: ["0012"]
              needs_contract: "api-v1"
              acceptance: "Account carries id, name, username, password, status, and description — and nothing else"
              verify: "python -c \"from app.models.account import Account; assert {'id','name','username','password','status','description'}=={c.name for c in Account.__table__.columns}\""
              touches: ["app/models/account.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0014"
              title: "Create app/models/asset.py"
              goal: "The Asset record exists in the schema"
              depends_on: ["0012"]
              needs_contract: "api-v1"
              acceptance: "Asset carries id, name, status, and description — and nothing else"
              verify: "python -c \"from app.models.asset import Asset; assert {'id','name','status','description'}=={c.name for c in Asset.__table__.columns}\""
              touches: ["app/models/asset.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0015"
              title: "Create app/models/strategy.py"
              goal: "The Strategy record exists in the schema, carrying its risk parameter"
              depends_on: ["0012"]
              needs_contract: "api-v1"
              acceptance: "Strategy carries id, name, risk_parameter, status, and description — the type of risk_parameter is the one Q5 settles"
              verify: "python -c \"from app.models.strategy import Strategy; assert {'id','name','risk_parameter','status','description'}=={c.name for c in Strategy.__table__.columns}\""
              touches: ["app/models/strategy.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0016"
              title: "Create app/models/action_group.py"
              goal: "The Action Group record exists in the schema"
              depends_on: ["0012"]
              needs_contract: "api-v1"
              acceptance: "ActionGroup carries id, name, status, and description — and nothing else"
              verify: "python -c \"from app.models.action_group import ActionGroup; assert {'id','name','status','description'}=={c.name for c in ActionGroup.__table__.columns}\""
              touches: ["app/models/action_group.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0017"
              title: "Create app/models/action.py"
              goal: "The Action record exists, bound to an asset, a strategy, and an action group"
              depends_on: ["0013", "0014", "0015", "0016"]
              needs_contract: "api-v1"
              acceptance: "Action carries id, name, asset_id, strategy_id, group_id, status, and description; each of the three references is a foreign key with an index"
              verify: "python -c \"from app.models.action import Action; c=Action.__table__.columns; assert all(c[k].foreign_keys and c[k].index for k in ('asset_id','strategy_id','group_id'))\""
              touches: ["app/models/action.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0018"
              title: "Create app/models/execute.py"
              goal: "The Execute record exists, bound to an action and carrying its profit and its state"
              depends_on: ["0017"]
              needs_contract: "api-v1"
              acceptance: "Execute carries id, name, action_id, profit, state, status, and description; action_id is an indexed foreign key, and the types of profit and state are the ones Q6 and Q4 settle"
              verify: "python -c \"from app.models.execute import Execute; c=Execute.__table__.columns; assert c['action_id'].foreign_keys and c['action_id'].index\""
              touches: ["app/models/execute.py"]
              status: "blocked"
              blocker: "B1"

    # ================================================================= P5
    - id: "P5"
      title: "Migrations"
      does: "At the end of this phase every table is created and reversed by Alembic alone — before it, a table could only be created by hand, which the rules forbid"
      groups:

        - id: "P5-G1"
          title: "Alembic setup"
          does: "Alembic runs against the configured database and sees the models' metadata"
          task_count: 1
          tasks:

            - id: "0019"
              title: "Initialize Alembic wired to app.config and the models' metadata"
              goal: "alembic commands run from backend/ against the configured path"
              depends_on: ["0012", "0009"]
              acceptance: "alembic.ini and migrations/env.py exist; env.py takes its url from app.config and its target metadata from app.models.base"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic current"
              touches: ["alembic.ini", "migrations/"]
              status: "todo"

        - id: "P5-G2"
          title: "One migration per record"
          does: "Each of the six tables arrives in its own migration, each with the downgrade that removes it"
          task_count: 6
          tasks:

            - id: "0020"
              title: "Write the accounts table migration"
              goal: "The accounts table is created and removed by Alembic alone"
              depends_on: ["0019", "0013"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the accounts table matching the model; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

            - id: "0021"
              title: "Write the assets table migration"
              goal: "The assets table is created and removed by Alembic alone"
              depends_on: ["0020", "0014"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the assets table matching the model; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

            - id: "0022"
              title: "Write the strategies table migration"
              goal: "The strategies table is created and removed by Alembic alone"
              depends_on: ["0021", "0015"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the strategies table matching the model; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

            - id: "0023"
              title: "Write the action_groups table migration"
              goal: "The action_groups table is created and removed by Alembic alone"
              depends_on: ["0022", "0016"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the action_groups table matching the model; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

            - id: "0024"
              title: "Write the actions table migration"
              goal: "The actions table is created with its three foreign keys and removed clean"
              depends_on: ["0023", "0017"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the actions table with indexed foreign keys to assets, strategies, and action_groups; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

            - id: "0025"
              title: "Write the executes table migration"
              goal: "The executes table is created with its foreign key and removed clean"
              depends_on: ["0024", "0018"]
              needs_contract: "api-v1"
              acceptance: "upgrade creates the executes table with an indexed foreign key to actions; downgrade removes it clean"
              verify: "BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head && BACKEND_DB_PATH=/tmp/probe.db alembic downgrade -1 && BACKEND_DB_PATH=/tmp/probe.db alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "blocked"
              blocker: "B1"

    # ================================================================= P6
    - id: "P6"
      title: "Validation schemas"
      does: "At the end of this phase every body and every response of the surface is bound to a validation model — before it, raw input could reach a service, which the rules forbid"
      groups:

        - id: "P6-G1"
          title: "One schema module per record"
          does: "Each record gets its add body, its change body, its status body, and its response shape"
          task_count: 6
          tasks:

            - id: "0026"
              title: "Create app/schemas/account.py"
              goal: "Every account body and response has a shape"
              depends_on: ["0005"]
              needs_contract: "api-v1"
              acceptance: "The add body, the change body, the status body, and the response of Account are each bound to a model; the response never carries the password"
              verify: "python -c \"import app.schemas.account as s; assert 'password' not in s.AccountOut.model_fields\""
              touches: ["app/schemas/account.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0027"
              title: "Create app/schemas/asset.py"
              goal: "Every asset body and response has a shape"
              depends_on: ["0005"]
              needs_contract: "api-v1"
              acceptance: "The add body, the change body, the status body, and the response of Asset are each bound to a model"
              verify: "python -c \"import app.schemas.asset\""
              touches: ["app/schemas/asset.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0028"
              title: "Create app/schemas/strategy.py"
              goal: "Every strategy body and response has a shape, including the risk parameter"
              depends_on: ["0005"]
              needs_contract: "api-v1"
              acceptance: "The add body, the change body, the status body, and the response of Strategy are each bound to a model, with risk_parameter typed as Q5 settles"
              verify: "python -c \"import app.schemas.strategy\""
              touches: ["app/schemas/strategy.py"]
              status: "blocked"
              blocker: "B1"

            - id: "0029"
              title: "Create app/schemas/action_group.py"
              goal: "Every action group body and response has a shape"
              depends_on: ["0005"]
              needs_contract: "api-v1"
              acceptance: "The add body, the change body, the status body, and the response of ActionGroup are each bound to a model"
              verify: "python -c \"import app.schemas.action_group\""
