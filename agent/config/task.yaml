# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "task.yaml"
  path_note: "The address of this file — layer 5, the task layer: the configuration of tasks and the plans that hold them"
  purpose: "Task configuration — the fields every task carries, the states it may hold — and the plans of the items"
  shape: "schema/task.schema.yaml — the shape of this file: its sections, their order, and the three levels of a plan"
  plan_source: "The three-level shape of a plan — phases, groups, tasks — is defined in schema/task.schema.yaml, under sections.phases"
  creation_rule_source: "Whether and when a task may be written here is governed by policy.task_creation below — no task is added speculatively"
  status_lives_here: "Every task carries its own status field — this file both defines the task and says where it stands; there is no separate status list"
  phase_scope: "Phase 1 only — the phase titles below are the stages of the data-entry and data-management build and nothing beyond it"
  phase_titles_scope: "The titles below are the backend's build stages — the frontend's stages cannot be named until its technology is chosen (Q5)"
  contract_gap: "api-v1 is a draft, not frozen — no task may be defined against it, so no plan is written here; recorded as B1 and Q1 through Q4 in state.yaml"
  points_to: "backend.yaml — content.contracts.api-v1, the contract a task names in needs_contract"
  updated: "2026-08-27"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning may write plans; in development, only the status, blocker, and log fields of a task may change"
  scope: "The plans are the working surface; task_schema, task_states, and phase_titles are the frame — fixed by the human, never rewritten by an agent"
  rule: "Every result about a task is recorded here, on the task itself — an agent that writes nowhere has done nothing"
  task_creation: "An agent never writes a task into a plan speculatively — a plan stays as it is, empty or not, until the human explicitly asks for tasks to be created. When asked, tasks are created for exactly what was requested, no more"
  task_status: "The status field on the task — the one field that moves; a blocked task also names its blocker id from state.yaml"
  claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
  done_gate: "A task becomes done only after its verify has been run and passed from inside the item's code_path — the code being written is not the gate"
  blocked_protocol: "On a blocker, set the task to blocked, name the blocker id, state what is missing in state.yaml, and stop — an agent never invents its way past a missing contract or a missing decision"
  coverage_rule: "A task may only name a contract that is frozen — a task needing a surface that exists only as a draft, or not at all, is blocked, not written against a guess"
  decision: "A decision about a task goes into that task's log with its date and reason — a decision the human must still make is an open question in state.yaml, not a log entry"
  log: "Append-only — a past entry is never rewritten"
  plan_change: "In development mode the plan fields of a task change only with the reason written into its log and human approval; in planning mode the plan may be written freely, but never against a contract that is not frozen"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "schema/task.schema.yaml first — know the shape of a task, its states, and the three levels of a plan"
  - "task_schema and task_states here — the frame itself, before any plan is read"
  - "then the plan — phases in order, P1 first; a later phase assumes the earlier ones are done"
  - "inside a phase, its does line first, then its groups in order — each group's does says what its tasks accomplish together"
  - "inside a group, tasks by id — depends_on names what must be done before, and is the actual order when it disagrees"
  - "for each task, status before anything else — a task that is not todo is not yours to start"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_schema: "The fields every task carries"
  task_states: "The status vocabulary a task's status field may hold, and the protocols around it"
  phase_titles: "Quick lookup from phase id to its title — the stages the Phase 1 backend build follows, in build order"
  phases: "The plans — empty; api-v1 is still a draft, so no task may be defined against it, and per policy.task_creation a plan is written only on explicit request"


# <!--------------------------------------------------------------------------------- Content -->
content:

  task_schema:
    rule: "Every task carries exactly these fields"
    fields:
      id: "Identifier unique within the item — for example 0001; each item numbers its own tasks"
      title: "The task in one sentence"
      goal: "What becomes possible after this task that was not possible before"
      depends_on: "Ids of tasks in the same item — depending on another item is forbidden"
      needs_contract: "The contract version required — used instead of depending on another item's task; omitted when the task needs none"
      acceptance: "Human-readable acceptance criterion — what must actually work"
      verify: "A runnable command that proves acceptance — without it a task is never done; when the item's needs_test is true, this is the test run itself for every task that produces code"
      touches: "Paths this task touches, written relative to the item's code_path"
      status: "Where the task stands right now — the one field of a task that moves; vocabulary in task_states"
      blocker: "Id of the blocker in state.yaml — present only when status is blocked, absent otherwise"
      log: "Append-only list of dated entries carried with the task — who claimed it, why it moved, the reason for a cancellation, the successor of a superseded task, an approved plan change with its reason; absent until the task first moves"
    status_lives_here: "Status is written on the task itself — the entry that defines a task also says where it stands, so definition and state can never drift apart"
    history_lives_here_too: "There is no history file — how a task got to its current state is recorded in its own log field, and a past log entry is never rewritten"


  task_states:
    path: "the status field on each task"
    states:
      todo: "Defined, not started"
      claimed: "An agent has taken it and is working on it"
      blocked: "Stopped — the reason is stated to the human, who decides how to proceed"
      done: "verify was run and passed"
      cancelled: "No longer needed — the reason is recorded in the task's log"
      superseded: "Replaced by another task — the successor id is recorded in the task's log"
    derived_ready: "ready is not a stored status — a task is ready when it is todo and all of its depends_on are done"
    done_gate: "Without a passing verify run, no task becomes done — even if the code is written"
    claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
    status_only_in_development: "In development mode the status, blocker, and log fields are the only part of a plan an agent may change — every other field is the plan, and the plan changes only in planning mode with the reason written into the task's log"


  phase_titles:
    P1: "Foundation"
    P2: "Configuration"
    P3: "Database layer"
    P4: "Models"
    P5: "Migrations"
    P6: "Validation schemas"
    P7: "Error surface"
    P8: "Account"
    P9: "Asset"
    P10: "Strategy"
    P11: "Action group"
    P12: "Action"
    P13: "Execute"
    P14: "Conformance"


  phases: []
