meta:
  item: "backend"
  layer: 4
  purpose: "Definition of the backend tasks — what has to be done and in what order"
  schema_source: "The shape of each task is defined in task_schema inside develop.yaml"
  no_status_here: "Task status is not written here — it lives in status.yaml"
  agent_may_edit: true
  editable_in_mode: "planning"
  change_in_development: "Changing the plan in development mode requires a recorded reason and human approval"
  updated: "2026-08-24"


groups:

  - id: "G1"
    title: "Foundation and infrastructure"
    goal: "The service comes up and connects to the database"
    tasks:

      - id: "BE-0001"
        title: "Project skeleton and running the service"
        goal: "The service runs and responds on a health route"
        depends_on: []
        acceptance: "A GET request to /health returns 200 with a status body"
        verify: "pytest tests/test_health.py"
        touches: ["backend/app/main.py", "backend/tests/test_health.py"]

      - id: "BE-0002"
        title: "Database connection and configuration"
        goal: "The service connects to the database using environment configuration"
        depends_on: ["BE-0001"]
        acceptance: "The connection is established from environment values and a session is opened and closed"
        verify: "pytest tests/test_db_connection.py"
        touches: ["backend/app/db/", "backend/app/config.py"]

      - id: "BE-0003"
        title: "Alembic setup"
        goal: "The migration infrastructure is ready"
        depends_on: ["BE-0002"]
        acceptance: "An empty migration is created, applied, and rolled back"
        verify: "alembic upgrade head && alembic downgrade -1"
        touches: ["backend/migrations/"]

  - id: "G2"
    title: "Data model"
    goal: "The users and tasks tables exist with an ownership relation"
    tasks:

      - id: "BE-0004"
        title: "User model and migration"
        goal: "A user is stored with a unique email and a hashed password"
        depends_on: ["BE-0003"]
        acceptance: "The users table is created with a unique email and no plaintext password is stored"
        verify: "pytest tests/test_user_model.py"
        touches: ["backend/app/models/user.py", "backend/migrations/"]

      - id: "BE-0005"
        title: "Task model and migration"
        goal: "A task is stored with an owner, a title, and a done status"
        depends_on: ["BE-0004"]
        acceptance: "Every task is linked to a user and cannot be created without an owner"
        verify: "pytest tests/test_task_model.py"
        touches: ["backend/app/models/task.py", "backend/migrations/"]

  - id: "G3"
    title: "Authentication"
    goal: "A user can create an account and sign in"
    tasks:

      - id: "BE-0006"
        title: "Registration"
        goal: "A new user is created with an email and a password"
        depends_on: ["BE-0004"]
        acceptance: "A successful registration creates an account; a duplicate email returns a specific error without revealing that the account exists"
        verify: "pytest tests/test_auth_register.py"
        touches: ["backend/app/routes/auth.py", "backend/app/services/auth.py"]

      - id: "BE-0007"
        title: "Login and token issuance"
        goal: "A user with correct credentials receives a token"
        depends_on: ["BE-0006"]
        acceptance: "A correct login returns a token with an expiry; an incorrect login returns 401"
        verify: "pytest tests/test_auth_login.py"
        touches: ["backend/app/routes/auth.py", "backend/app/services/auth.py"]

      - id: "BE-0008"
        title: "Authentication middleware"
        goal: "Protected routes know the current user"
        depends_on: ["BE-0007"]
        acceptance: "A request with no token or an expired token gets 401"
        verify: "pytest tests/test_auth_middleware.py"
        touches: ["backend/app/services/auth.py", "backend/app/main.py"]

  - id: "G4"
    title: "Tasks API"
    goal: "A user can manage their own tasks"
    tasks:

      - id: "BE-0009"
        title: "Creating and listing tasks"
        goal: "A user creates a task and sees only their own tasks"
        depends_on: ["BE-0005", "BE-0008"]
        acceptance: "The list returns only the current user's tasks"
        verify: "pytest tests/test_tasks_create_list.py"
        touches: ["backend/app/routes/tasks.py", "backend/app/services/tasks.py"]

      - id: "BE-0010"
        title: "Editing, completing, and deleting a task"
        goal: "A user changes or deletes their own task"
        depends_on: ["BE-0009"]
        acceptance: "User A cannot view, change, or delete user B's task — the response is 404"
        verify: "pytest tests/test_tasks_ownership.py"
        touches: ["backend/app/routes/tasks.py", "backend/app/services/tasks.py"]

  - id: "G5"
    title: "Contract"
    goal: "The frontend can start without waiting for the backend"
    tasks:

      - id: "BE-0011"
        title: "Draft of the api-v1 contract"
        goal: "The full shape of the API is settled before implementation"
        depends_on: []
        acceptance: "The contract covers all authentication and task routes with their inputs and outputs"
        verify: "test -f develop/shared/contracts/api-v1.yaml"
        touches: ["develop/shared/contracts/api-v1.yaml"]

      - id: "BE-0012"
        title: "Freezing the api-v1 contract"
        goal: "The contract becomes frozen and the frontend can define tasks on top of it"
        depends_on: ["BE-0010", "BE-0011"]
        acceptance: "The implementation matches the contract and the contract status is frozen"
        verify: "pytest tests/test_contract_conformance.py"
        touches: ["develop/shared/contracts/api-v1.yaml"]
