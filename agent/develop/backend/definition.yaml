meta:
  item: "backend"
  layer: 4
  purpose: "Definition of the backend item — what it does, with which technology, and where its boundaries are"
  agent_may_edit: true
  editable_in_mode: "planning"
  on_change_needed: "Do not change in development mode — record a proposal in questions.yaml"
  updated: "2026-08-24"


responsibility: "API service — user authentication, task logic, and data persistence"

code_path: "backend/"


tech:
  language: "Python 3.12"
  framework: "FastAPI"
  database: "PostgreSQL"
  orm: "SQLAlchemy + Alembic for migrations"
  test: "pytest"
  run: "uvicorn app.main:app --reload"


code_layout:
  "app/main.py": "Entry point and route registration"
  "app/models/": "Data models"
  "app/routes/": "API routes — one file per domain"
  "app/services/": "Business logic — independent of HTTP"
  "app/db/": "Database connection and session"
  "migrations/": "Alembic migrations"
  "tests/": "Tests — mirroring the structure of app/"


contracts:
  produces: "api-v1"
  contract_path: "develop/shared/contracts/api-v1.yaml"
  rule: "Every change at the API surface must land in the contract first, then in the code"


boundaries:
  owns: "All code inside backend/ and the database schema"
  does_not_own: "Frontend code — not a single line"
  interface: "The only way to communicate with the frontend is the api-v1 contract"


out_of_scope:
  - "Rendering the user interface or HTML templates"
  - "Sending emails and notifications"
  - "Deployment infrastructure and CI"
