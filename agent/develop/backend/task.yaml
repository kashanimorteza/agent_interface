# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "develop/backend/task.yaml"
  path_note: "The address of this file — the develop layer, backend item"
  item: "backend"
  layer: 4
  purpose: "The backend plan — phases, groups inside each phase, tasks inside each group"
  derived_from: "the root definition.yaml goals, the global rules.yaml, the api-v1 contract, and this item's definition.yaml"
  plan_source: "The three-level shape of the plan — phases, groups, tasks — is defined in develop.yaml, under content.plan_structure"
  schema_source: "The shape of each task is defined in develop.yaml, under content.task_schema"
  states_source: "The status vocabulary is defined in develop.yaml, under content.task_states"
  creation_rule_source: "Whether and when a task may be written here is governed by develop.yaml, under policy.task_creation — this plan was written on the human's explicit request"
  status_lives_here: "Every task carries its own status field — this file both defines the task and says where it stands; there is no separate status list"
  verify_cwd: "Every verify command runs from this item's code_path — backend/ — inside its virtual environment"
  touches_are_relative: "Every touches path is relative to code_path"
  contract_gap: "api-v1 defines no registration, login, session, or owner field, while the root goals and the security rules require per-user ownership — no task here is written against that missing surface; it is recorded as Q1 and Q2 in state.yaml"
  points_to: "develop/shared/contracts/api-v1.yaml — the contract most tasks name in needs_contract"
  updated: "2026-08-25"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning — in development, only the status, blocker, and log fields of a task may change"
  rule: "Every result about a backend task is recorded here, on the task itself — an agent that writes nowhere has done nothing"
  task_status: "The status field on the task — the one field that moves; a blocked task also names its blocker id from state.yaml"
  claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
  done_gate: "A task becomes done only after its verify has been run and passed from inside backend/ and its virtual environment — the code being written is not the gate"
  blocked_protocol: "On a blocker, set the task to blocked, name the blocker id, state what is missing in state.yaml, and stop — an agent never invents its way past a missing contract or a missing decision"
  decision: "A decision about a task goes into that task's log with its date and reason — a decision the human must still make is an open question in state.yaml, not a log entry"
  log: "Append-only — a past entry is never rewritten"
  plan_change: "In development mode the plan fields of a task change only with the reason written into its log and human approval; in planning mode the plan may be written freely, but never against a contract that does not exist"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "phases in order, P1 first — a later phase assumes the earlier ones are done"
  - "inside a phase, its does line first, then its groups in order — each group's does says what its tasks accomplish together"
  - "inside a group, tasks by id — depends_on names what must be done before, and is the actual order when it disagrees"
  - "for each task, status before anything else — a task that is not todo is not yours to start"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  phase_titles: "Quick lookup from phase id to its title — ten phases, P1 to P10"
  phases: "The plan itself — 76 tasks in 37 groups across 10 phases, ids 0001 to 0076, every task per task_schema and every level per plan_structure"


# <!--------------------------------------------------------------------------------- Content -->
content:

  phase_titles:
    P1: "Foundation"
    P2: "Configuration"
    P3: "Database layer"
    P4: "Models"
    P5: "Migrations"
    P6: "Validation schemas"
    P7: "Error surface"
    P8: "Groups feature"
    P9: "Tasks feature"
    P10: "Conformance"


  phases:

    # ================================================================= P1
    - id: "P1"
      title: "Foundation"
      does: "At the end of this phase a virtual environment exists with every dependency in it, the package skeleton is on disk, the application object starts, and GET /health answers — before it, nothing runs at all"
      groups:

        - id: "P1-G1"
          title: "Virtual environment"
          does: "An isolated interpreter with every dependency pinned and installed — the ground every later verify stands on"
          task_count: 3
          tasks:

            - id: "0001"
              title: "Create the virtual environment"
              goal: "backend/ has its own interpreter, separate from the system one"
              depends_on: []
              acceptance: "A venv exists inside backend/ and python resolves to it from inside"
              verify: "python -c \"import sys; assert 'backend' in sys.prefix\""
              touches: [".venv/"]
              status: "todo"

            - id: "0002"
              title: "Write requirements.txt"
              goal: "Every dependency is named and pinned in one file"
              depends_on: ["0001"]
              acceptance: "requirements.txt lists fastapi, uvicorn, sqlalchemy, alembic, pytest, and httpx, each with a version"
              verify: "python -c \"lines=open('requirements.txt').read(); assert all(p in lines for p in ['fastapi','uvicorn','sqlalchemy','alembic','pytest','httpx'])\""
              touches: ["requirements.txt"]
              status: "todo"

            - id: "0003"
              title: "Install the requirements into the venv"
              goal: "Every dependency imports from inside the environment"
              depends_on: ["0002"]
              acceptance: "fastapi, sqlalchemy, alembic, pytest, and httpx import from inside the venv and nothing was installed globally"
              verify: "python -c \"import fastapi, sqlalchemy, alembic, pytest, httpx\""
              touches: [".venv/"]
              status: "todo"

        - id: "P1-G2"
          title: "Repository hygiene"
          does: "What must never be committed is ignored before it ever exists"
          task_count: 1
          tasks:

            - id: "0004"
              title: "Write the backend .gitignore"
              goal: "The venv, the database file, and caches never enter git"
              depends_on: []
              acceptance: ".gitignore covers .venv/, *.db, and __pycache__/"
              verify: "python -c \"g=open('.gitignore').read(); assert '.venv' in g and '*.db' in g and '__pycache__' in g\""
              touches: [".gitignore"]
              status: "todo"

        - id: "P1-G3"
          title: "Package skeleton"
          does: "Every folder of code_layout exists as an importable package, so every later task has its place ready"
          task_count: 2
          tasks:

            - id: "0005"
              title: "Create the app package tree"
              goal: "app/ and its subpackages import"
              depends_on: ["0003"]
              acceptance: "app, app.api, app.db, app.models, app.schemas, and app.services all import, each from its own __init__.py"
              verify: "python -c \"import app, app.api, app.db, app.models, app.schemas, app.services\""
              touches: ["app/__init__.py", "app/api/__init__.py", "app/db/__init__.py", "app/models/__init__.py", "app/schemas/__init__.py", "app/services/__init__.py"]
              status: "todo"

            - id: "0006"
              title: "Create the tests package with pytest configuration"
              goal: "pytest discovers the tests folder and finds the app package"
              depends_on: ["0005"]
              acceptance: "pytest runs from backend/ with zero collected tests and zero errors"
              verify: "pytest --collect-only -q"
              touches: ["tests/__init__.py", "pytest.ini"]
              status: "todo"

        - id: "P1-G4"
          title: "Application object"
          does: "The service exists as a running process with its first route"
          task_count: 2
          tasks:

            - id: "0007"
              title: "Create app/main.py with the FastAPI application object"
              goal: "There is one application object every router will register on"
              depends_on: ["0005"]
              acceptance: "app.main exposes an object named app that is a FastAPI instance"
              verify: "python -c \"from app.main import app; from fastapi import FastAPI; assert isinstance(app, FastAPI)\""
              touches: ["app/main.py"]
              status: "todo"

            - id: "0008"
              title: "Add the GET /health route"
              goal: "The service answers a liveness request"
              depends_on: ["0007"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "GET /health answers 200 with exactly {status, service}"
              verify: "python -c \"from fastapi.testclient import TestClient; from app.main import app; r=TestClient(app).get('/health'); assert r.status_code==200 and set(r.json())=={'status','service'}\""
              touches: ["app/main.py"]
              status: "todo"

        - id: "P1-G5"
          title: "First test"
          does: "The habit every later group repeats — a route exists only with a test beside it"
          task_count: 1
          tasks:

            - id: "0009"
              title: "Write tests/test_health.py"
              goal: "The health route is proven by the test runner, not by hand"
              depends_on: ["0006", "0008"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "One test asserts the 200 and the exact body keys of /health, and pytest passes"
              verify: "pytest tests/test_health.py"
              touches: ["tests/test_health.py"]
              status: "todo"

    # ================================================================= P2
    - id: "P2"
      title: "Configuration"
      does: "At the end of this phase every setting the service needs comes from the environment through one module — before it, settings could only be hardcoded"
      groups:

        - id: "P2-G1"
          title: "Config module"
          does: "One module owns every setting; the database path is read from an environment variable with a default outside the repository"
          task_count: 2
          tasks:

            - id: "0010"
              title: "Create app/config.py with the database path setting"
              goal: "The database path is a setting, not a literal"
              depends_on: ["0005"]
              acceptance: "app.config reads the database path from an environment variable and falls back to a default outside the repository"
              verify: "python -c \"import os; os.environ['BACKEND_DB_PATH']='/tmp/x.db'; import app.config as c; assert c.get_db_path()=='/tmp/x.db'\""
              touches: ["app/config.py"]
              status: "todo"

            - id: "0011"
              title: "Add the service name setting"
              goal: "The health route's service field comes from configuration, not a string in the route"
              depends_on: ["0010"]
              acceptance: "app.config exposes the service name and app/main.py uses it in /health"
              verify: "python -c \"from app.config import SERVICE_NAME; from fastapi.testclient import TestClient; from app.main import app; assert TestClient(app).get('/health').json()['service']==SERVICE_NAME\""
              touches: ["app/config.py", "app/main.py"]
              status: "todo"

        - id: "P2-G2"
          title: "Config tests"
          does: "Both configuration behaviors — the env var read and the safe default — are pinned by tests"
          task_count: 1
          tasks:

            - id: "0012"
              title: "Write tests/test_config.py"
              goal: "The env var wins, the default is outside the repository, and both stay that way"
              depends_on: ["0006", "0010"]
              acceptance: "One test proves the env var is honored; another proves the default path is not inside the repository"
              verify: "pytest tests/test_config.py"
              touches: ["tests/test_config.py"]
              status: "todo"

    # ================================================================= P3
    - id: "P3"
      title: "Database layer"
      does: "At the end of this phase one module owns the engine, one owns the session, and foreign keys are on for every connection — before it, no code can reach a database at all"
      groups:

        - id: "P3-G1"
          title: "Engine"
          does: "One place builds the engine, from configuration only"
          task_count: 1
          tasks:

            - id: "0013"
              title: "Create app/db/engine.py"
              goal: "Every connection the service will ever open starts here"
              depends_on: ["0010"]
              acceptance: "app.db.engine builds the SQLAlchemy engine from the configured path and nothing else imports create_engine"
              verify: "python -c \"from app.db.engine import get_engine; e=get_engine(); assert e is not None\""
              touches: ["app/db/engine.py"]
              status: "todo"

        - id: "P3-G2"
          title: "Session"
          does: "One dependency yields a session and closes it — routes and services never open their own"
          task_count: 1
          tasks:

            - id: "0014"
              title: "Create app/db/session.py"
              goal: "A request-scoped session exists as a FastAPI dependency"
              depends_on: ["0013"]
              acceptance: "app.db.session exposes a get_session dependency that yields a session and closes it after use"
              verify: "python -c \"from app.db.session import get_session; g=get_session(); s=next(g); assert s is not None\""
              touches: ["app/db/session.py"]
              status: "todo"

        - id: "P3-G3"
          title: "Foreign keys"
          does: "The SQLite FK pragma runs on every connection — without this, ownership constraints are silently unenforced"
          task_count: 1
          tasks:

            - id: "0015"
              title: "Enable the foreign key pragma on every connection"
              goal: "No connection ever runs with foreign keys off"
              depends_on: ["0013"]
              acceptance: "An event listener on the engine issues PRAGMA foreign_keys=ON at every connect"
              verify: "python -c \"from app.db.engine import get_engine; from sqlalchemy import text; assert get_engine().connect().execute(text('PRAGMA foreign_keys')).scalar()==1\""
              touches: ["app/db/engine.py"]
              status: "todo"

        - id: "P3-G4"
          title: "Database layer tests"
          does: "The FK pragma is proven by a refused orphan row, not by reading the code"
          task_count: 1
          tasks:

            - id: "0016"
              title: "Write tests/test_db_session.py"
              goal: "A row inserted with a missing parent is refused on every connection"
              depends_on: ["0006", "0014", "0015"]
              acceptance: "A test creates two related tables, inserts a child with a missing parent, and asserts the insert fails"
              verify: "pytest tests/test_db_session.py"
              touches: ["tests/test_db_session.py"]
              status: "todo"

    # ================================================================= P4
    - id: "P4"
      title: "Models"
      does: "At the end of this phase the two tables of api-v1 exist as ORM models with their relationship — before it, the schema exists only on paper"
      groups:

        - id: "P4-G1"
          title: "Declarative base"
          does: "One Base every model inherits from, so one metadata drives every migration"
          task_count: 1
          tasks:

            - id: "0017"
              title: "Create app/models/base.py"
              goal: "There is exactly one metadata object for the whole schema"
              depends_on: ["0005"]
              acceptance: "app.models.base exposes Base and every later model registers on its metadata"
              verify: "python -c \"from app.models.base import Base; assert hasattr(Base, 'metadata')\""
              touches: ["app/models/base.py"]
              status: "todo"

        - id: "P4-G2"
          title: "Group model"
          does: "The groups table of api-v1, as Python"
          task_count: 1
          tasks:

            - id: "0018"
              title: "Create app/models/group.py"
              goal: "The Group row exists with the exact api-v1 fields"
              depends_on: ["0017"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "Group has id (integer pk), name (string), created_at (datetime) — and nothing else"
              verify: "python -c \"from app.models.group import Group; assert {'id','name','created_at'} <= set(Group.__table__.columns.keys())\""
              touches: ["app/models/group.py"]
              status: "todo"

        - id: "P4-G3"
          title: "Task model"
          does: "The tasks table of api-v1, owned by its group — indexed FK, cascade delete"
          task_count: 1
          tasks:

            - id: "0019"
              title: "Create app/models/task.py"
              goal: "The Task row exists, belongs to a group, and dies with it"
              depends_on: ["0018"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "Task has id, group_id (indexed FK with cascade delete), title, done (default false), created_at"
              verify: "python -c \"from app.models.task import Task; c=Task.__table__.columns; assert c['group_id'].index and c['done'].default is not None\""
              touches: ["app/models/task.py"]
              status: "todo"

        - id: "P4-G4"
          title: "Model tests"
          does: "Each model's shape and the cascade are pinned by tests against a throwaway database"
          task_count: 2
          tasks:

            - id: "0020"
              title: "Write tests/test_model_group.py"
              goal: "A Group persists and round-trips its fields"
              depends_on: ["0006", "0018"]
              acceptance: "A test creates the schema in a temp database, inserts a Group, reads it back, and checks every field"
              verify: "pytest tests/test_model_group.py"
              touches: ["tests/test_model_group.py"]
              status: "todo"

            - id: "0021"
              title: "Write tests/test_model_task.py"
              goal: "A Task persists under its group and deleting the group deletes it"
              depends_on: ["0019", "0020"]
              acceptance: "A test inserts a group with tasks, deletes the group, and asserts the tasks are gone; done defaults to false"
              verify: "pytest tests/test_model_task.py"
              touches: ["tests/test_model_task.py"]
              status: "todo"

    # ================================================================= P5
    - id: "P5"
      title: "Migrations"
      does: "At the end of this phase the schema is created and reversed by Alembic alone, and the round trip is proven — before it, tables could only be created by hand, which rules.yaml forbids"
      groups:

        - id: "P5-G1"
          title: "Alembic setup"
          does: "Alembic runs against the configured database and sees the models' metadata"
          task_count: 1
          tasks:

            - id: "0022"
              title: "Initialize Alembic wired to config and metadata"
              goal: "alembic commands work from backend/ against the configured path"
              depends_on: ["0013", "0017"]
              acceptance: "alembic.ini and migrations/env.py exist; env.py takes the url from app.config and the target metadata from app.models.base"
              verify: "alembic current"
              touches: ["alembic.ini", "migrations/"]
              status: "todo"

        - id: "P5-G2"
          title: "Groups migration"
          does: "The first real migration — the groups table, with its downgrade"
          task_count: 1
          tasks:

            - id: "0023"
              title: "Write the groups table migration"
              goal: "The groups table is created and removed by Alembic alone"
              depends_on: ["0022", "0018"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "upgrade creates the groups table matching the model; downgrade removes it clean"
              verify: "alembic upgrade head && alembic downgrade -1 && alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "todo"

        - id: "P5-G3"
          title: "Tasks migration"
          does: "The second migration — the tasks table with its indexed FK, and its downgrade"
          task_count: 1
          tasks:

            - id: "0024"
              title: "Write the tasks table migration"
              goal: "The tasks table is created with its FK and index, and removed clean"
              depends_on: ["0023", "0019"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "upgrade creates the tasks table with the indexed group_id FK; downgrade removes it clean"
              verify: "alembic upgrade head && alembic downgrade -1 && alembic upgrade head"
              touches: ["migrations/versions/"]
              status: "todo"

        - id: "P5-G4"
          title: "Round trip proof"
          does: "The whole chain moves base → head → base → head without error, as a test"
          task_count: 1
          tasks:

            - id: "0025"
              title: "Write tests/test_migrations.py"
              goal: "Every migration is reversible, proven in one run"
              depends_on: ["0006", "0024"]
              acceptance: "A test runs upgrade head, downgrade base, upgrade head against a temp database and asserts both tables exist at the end"
              verify: "pytest tests/test_migrations.py"
              touches: ["tests/test_migrations.py"]
              status: "todo"

    # ================================================================= P6
    - id: "P6"
      title: "Validation schemas"
      does: "At the end of this phase every api-v1 body and response is bound to a model with the contract's exact bounds — before it, raw input could reach a service, which rules.yaml forbids"
      groups:

        - id: "P6-G1"
          title: "Group schemas"
          does: "The three shapes of a group crossing the wire — create body, rename body, response"
          task_count: 3
          tasks:

            - id: "0026"
              title: "Create the GroupCreate schema"
              goal: "POST /groups input has a shape with the contract bound"
              depends_on: ["0005"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "GroupCreate requires name, 1 to 120 characters; an empty or overlong name is refused"
              verify: "python -c \"from app.schemas.group import GroupCreate; import pydantic; GroupCreate(name='x');\nimport pytest_check\" 2>/dev/null || python -c \"from app.schemas.group import GroupCreate; GroupCreate(name='x')\""
              touches: ["app/schemas/group.py"]
              status: "todo"

            - id: "0027"
              title: "Create the GroupRename schema"
              goal: "PATCH /groups/{id} input has its own shape with the same bound"
              depends_on: ["0026"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "GroupRename requires name, 1 to 120 characters"
              verify: "python -c \"from app.schemas.group import GroupRename; GroupRename(name='x')\""
              touches: ["app/schemas/group.py"]
              status: "todo"

            - id: "0028"
              title: "Create the GroupOut schema"
              goal: "Every group response serializes the same way"
              depends_on: ["0026"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "GroupOut carries id, name, created_at, and created_at serializes as ISO 8601 UTC"
              verify: "python -c \"from app.schemas.group import GroupOut; assert set(GroupOut.model_fields)=={'id','name','created_at'}\""
              touches: ["app/schemas/group.py"]
              status: "todo"

        - id: "P6-G2"
          title: "Task schemas"
          does: "The three shapes of a task crossing the wire — create body, patch body, response"
          task_count: 3
          tasks:

            - id: "0029"
              title: "Create the TaskCreate schema"
              goal: "POST tasks input has a shape with the contract bound"
              depends_on: ["0005"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "TaskCreate requires title, 1 to 200 characters"
              verify: "python -c \"from app.schemas.task import TaskCreate; TaskCreate(title='x')\""
              touches: ["app/schemas/task.py"]
              status: "todo"

            - id: "0030"
              title: "Create the TaskPatch schema"
              goal: "PATCH /tasks/{id} accepts title, done, or both — never nothing"
              depends_on: ["0029"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "TaskPatch accepts title alone, done alone, or both, and refuses an empty body"
              verify: "python -c \"from app.schemas.task import TaskPatch; TaskPatch(done=True);\nimport sys\ntry: TaskPatch(); sys.exit(1)\nexcept Exception: pass\""
              touches: ["app/schemas/task.py"]
              status: "todo"

            - id: "0031"
              title: "Create the TaskOut schema"
              goal: "Every task response serializes the same way"
              depends_on: ["0029"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "TaskOut carries id, group_id, title, done, created_at, and created_at serializes as ISO 8601 UTC"
              verify: "python -c \"from app.schemas.task import TaskOut; assert set(TaskOut.model_fields)=={'id','group_id','title','done','created_at'}\""
              touches: ["app/schemas/task.py"]
              status: "todo"

        - id: "P6-G3"
          title: "Schema tests"
          does: "Every bound and refusal above is pinned by the test runner"
          task_count: 2
          tasks:

            - id: "0032"
              title: "Write tests/test_schema_group.py"
              goal: "The group bounds hold at both edges"
              depends_on: ["0006", "0028"]
              acceptance: "Tests cover name at length 1, 120, 0, and 121, and the ISO serialization of created_at"
              verify: "pytest tests/test_schema_group.py"
              touches: ["tests/test_schema_group.py"]
              status: "todo"

            - id: "0033"
              title: "Write tests/test_schema_task.py"
              goal: "The task bounds and the empty-patch refusal hold"
              depends_on: ["0031", "0032"]
              acceptance: "Tests cover title at 1, 200, 0, and 201, the empty TaskPatch refusal, and both single-field patches"
              verify: "pytest tests/test_schema_task.py"
              touches: ["tests/test_schema_task.py"]
              status: "todo"

    # ================================================================= P7
    - id: "P7"
      title: "Error surface"
      does: "At the end of this phase every failure the service can produce answers in the one contract shape with a stable code — before it, errors leak framework defaults"
      groups:

        - id: "P7-G1"
          title: "Error shape"
          does: "The one body of every non-2xx response — code, message, details — as code"
          task_count: 2
          tasks:

            - id: "0034"
              title: "Create app/errors.py with the error body builder"
              goal: "There is exactly one way to build an error response"
              depends_on: ["0005"]
              needs_contract: "api-v1 (frozen)"
              acceptance: "errors.py builds {code, message, details} and nothing can add a fourth field"
              verify: "python -c \"from app.errors import error_body; b=error_body('not_found','x',{}); assert set(b)=={'code','message','details'}\""
              touches: ["app/errors.py"]
              status: "todo"

            - id: "0035"
              title: "Add the NotFound domain exception"
              goal: "Services raise one exception for a missing thing, and never build HTTP responses"
              depends_on: ["0034"]
              acceptance: "app.errors exposes NotFound; a service can raise it without importing anything from FastAPI"
              verify: "python -c \"from app.errors import NotFound; assert issubclass(NotFound, Exception)\""
              touches: ["app/errors.py"]
