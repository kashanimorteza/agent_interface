meta:
  item: "backend"
  layer: 4
  purpose: "Rules specific to the backend item — a complement to the global rules, not a replacement for them"
  relation_to_global: "It may only tighten, never loosen — precedence is defined in the global rules.yaml"
  agent_may_edit: true
  editable_in_mode: "planning"
  updated: "2026-08-24"


code:
  - "Business logic stays in services — routes only accept input and return output"
  - "Direct database access from inside routes is forbidden — go through a service"
  - "Every API input is validated against a model — raw input never reaches a service"
  - "Error responses always have the same structure — code, message, details"


database:
  - "Every schema change comes with an Alembic migration — changing a table by hand is forbidden"
  - "A migration that has already run is never edited — create a new migration"
  - "Every migration must be reversible — write the downgrade"
  - "Do not write a query that filters on a column without an index"


security:
  - "Passwords are stored hashed only — never in the clear"
  - "Session tokens are issued with an expiry"
  - "Every task-related route must check user ownership — a user only sees their own tasks"
  - "Error messages must not reveal whether an account exists"


test:
  - "Every API route has at least one success test and one error test"
  - "Tests run against a test database — not the development database"
  - "An ownership test is mandatory: user A must not be able to access user B's task"


contract:
  - "Changing the API surface without updating the contract is forbidden"
  - "A frozen contract does not change — create a new version"
