entry_schema:
  rule: "Each task gains these fields as work progresses — do not write a field with no value"
  fields:
    status: "One of the task_states in develop.yaml"
    claimed_at: "Time the task was picked up — when moving to claimed"
    verify_result: "Output of running verify — pass or fail with a summary of the reason"
    done_at: "Time of completion — only when verify passed"
    notes: "Details of the work done and decisions made along the way"
    blocker: "Blocker id in blockers.yaml — only in the blocked status"
    unfinished: "If the work was left half-done, exactly where it stopped"
    superseded_by: "Id of the superseding task — only in the superseded status"
    cancel_reason: "Reason for cancellation — only in the cancelled status"

example:
  note: "A sample of a complete entry — a template, not real data"
