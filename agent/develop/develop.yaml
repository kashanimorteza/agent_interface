items:

  backend:
    enabled: true
    path: "develop/backend/"
    code_path: "backend/"
    code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
    summary: "API, task and user logic, database"

  frontend:
    enabled: true
    path: "develop/frontend/"
    code_path: "frontend/"
    code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
    summary: "Web client — consumer of the api-v1 contract"


item_files:
  rule: "Every item has exactly these four files, no more and no fewer"
  files:
    definition.yaml: "What this item does, with what technology, and its own specifics"
    task.yaml: "Task groups and tasks, step by step"

item_read_order:
  - "definition.yaml"
  - "task.yaml"


task_schema:
  rule: "Every task in task.yaml carries exactly these fields, including its status"
  fields:
    id: "Identifier unique within this item's task.yaml — for example 0001; each item numbers its own tasks"
    title: "The task in one sentence"
    goal: "What becomes possible after this task that was not possible before"
    depends_on: "Ids of tasks in the same item — depending on another item is forbidden"
    needs_contract: "The contract version required — used instead of depending on another item's task"
    acceptance: "Human-readable acceptance criterion — what must actually work"
    verify: "A runnable command that proves acceptance — without it a task is never done"
    touches: "Paths inside code_path that this task touches"
    status: "Current task state"
  states:
    todo: "Defined, not started"
    claimed: "An agent has taken it and is working on it"
    blocked: "Stopped — the reason is stated to the human, who decides how to proceed"
    done: "verify was run and passed"
    cancelled: "No longer needed — the reason is recorded"
    superseded: "Replaced by another task — the successor id is recorded"
  derived_ready: "ready is not a stored status — a task is ready when it is todo and all of its depends_on are done"
  done_gate: "Without a passing verify run, no task becomes done — even if the code is written"
  claim_protocol: "Before starting, set the status to claimed and record it immediately — so two agents never take the same task"


shared:
  contracts:
    path: "develop/shared/contracts/"
    responsibility: "Versioned contracts between items — the only permitted connection point"
    lifecycle:
      draft: "Under design — only the producing item relies on it"
      frozen: "Final — the consuming item may define tasks against it"
      deprecated: "Obsolete — replaced by a newer version"
    change_rule: "A frozen contract never changes — a new version is created instead"


boundaries:
  code_isolation: "Each item writes only inside its own code_path — touching another item's code is forbidden"
  cross_item_link: "Items connect only through shared/contracts — never through direct task-to-task dependencies"
  contract_change: "A frozen contract never changes — if a change is needed, raise it with the human"