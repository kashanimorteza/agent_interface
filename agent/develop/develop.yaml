meta:
  path: "develop/develop.yaml"
  path_note: "The address of this file — the index of the develop layer"
  purpose: "The develop layer is described here — which items exist, which files each item has, and in what order they are read"
  contains: "items, item_files, and item_read_order"
  completeness: "An item that is not in this file does not exist as far as an agent is concerned"
  item_files_exception: "The files inside each item are writable — per the mode permissions in root.yaml"
  on_change_needed: "Record a proposal in questions.yaml — only a human may change this file"
  agent_may_edit: false
  updated: "2026-08-24"


items:

  backend:
    enabled: true
    path: "develop/backend/"
    prefix: "BE"
    prefix_note: "Task ids look like BE-0001"
    code_path: "backend/"
    code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
    summary: "API, task and user logic, database"

  frontend:
    enabled: true
    path: "develop/frontend/"
    prefix: "FE"
    prefix_note: "Task ids look like FE-0001"
    code_path: "frontend/"
    code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
    summary: "Web client — consumer of the api-v1 contract"


item_files:
  rule: "Every item has exactly these four files, no more and no fewer"
  files:
    definition.yaml: "What this item does, with what technology, and its own specifics"
    rules.yaml: "Rules specific to this item — supplementing the global rules"
    task.yaml: "Task groups and tasks, step by step"

item_read_order:
  - "definition.yaml"
  - "rules.yaml"
  - "task.yaml"