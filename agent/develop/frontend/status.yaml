meta:
  item: "frontend"
  layer: 4
  purpose: "Status and execution report for the tasks in plan.yaml — the only place task status lives"
  states_source: "The status vocabulary is defined in task_states inside develop.yaml"
  agent_may_edit: true
  editable_in_mode: "development"
  write_rule: "Update after every task — not at the end of the session"
  contract_gate: "A task whose needs_contract is not frozen is not claimed"
  updated: "2026-08-24"


