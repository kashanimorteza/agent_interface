# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning — in development, only the status, blocker, and log fields of a task may change"
  rule: "Every result about a frontend task is recorded here, on the task itself — an agent that writes nowhere has done nothing"
  task_status: "The status field on the task — the one field that moves; a blocked task also names its blocker id from state.yaml"
  claim_protocol: "Before starting, set the task's status to claimed and write this file immediately — so two agents never take the same task"
  done_gate: "A task becomes done only after its verify has been run and passed from inside frontend/ — the code being written is not the gate"
  blocked_protocol: "On a blocker, set the task to blocked, name the blocker id, state what is missing in state.yaml, and stop — a task needing a surface no contract provides is blocked, never written against a guess"
  decision: "A decision about a task goes into that task's log with its date and reason — a decision the human must still make is an open question in state.yaml, not a log entry"
  log: "Append-only — a past entry is never rewritten"
  plan_change: "In development mode the plan fields of a task change only with the reason written into its log and human approval; in planning mode the plan may be written freely, but a task never depends on a backend task — only on a contract version"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "groups in order, first group first — a later group assumes the earlier ones are done"
  - "inside a group, tasks by id — depends_on names what must be done before, and is the actual order when it disagrees"
  - "for each task, status before anything else — a task that is not todo is not yours to start"


