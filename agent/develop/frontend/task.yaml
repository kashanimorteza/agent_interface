meta:
  path: "develop/frontend/task.yaml"
  path_note: "The address of this file — the develop layer, frontend item"
  item: "frontend"
  layer: 4
  purpose: "Definition of the frontend tasks — what has to be done and in what order"
  derived_from: "the root definition.yaml goals, the global rules.yaml, the api-v1 contract, and this item's definition.yaml"
  schema_source: "The shape of each task is defined in develop.yaml, under content.task_schema"
  states_source: "The status vocabulary is defined in develop.yaml, under content.task_states"
  status_lives_here: "Every task carries its own status field — this file both defines the task and says where it stands; there is no separate status list"
  verify_cwd: "Every verify command runs from this item's code_path — frontend/"
  touches_are_relative: "Every touches path is relative to code_path"
  cross_item_rule: "No task depends on a backend task — the only dependency is on the contract version, via needs_contract"
  contract_gap: "No contract defines registration, login, or session — the tasks that need that surface name it plainly and are blocked in state.yaml rather than written against a guess"
