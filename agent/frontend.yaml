# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: "frontend.yaml"
  path_note: "The address of this file — layer 4, the frontend item: its settings and the contract it consumes"
  purpose: "The frontend item — what it is built with, how its code is laid out, and the contract it reads"
  shape: "schema/item.schema.yaml — the shape every item file follows"
  frame: "develop.yaml — the frame this item sits in: the item index, the plan structure, the contract lifecycle, and the boundaries"
  plan_location: "This item's plan lives in task.yaml — never here"
  contract_gap: "api-v1 offers no registration, login, session, or owner field, so the authentication surface of this item cannot be planned — recorded as B1, Q1, and Q2 in state.yaml"
  updated: "2026-08-26"


# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  editable_in_mode: "planning may write the settings; development and review never write this file — a task's status moves in task.yaml"
  scope: "The settings are the working surface — this item produces no contract, and it never edits the one it consumes"
  settings: "The settings — responsibility through out_of_scope — are written in planning mode only; a change wanted during development is recorded in the affected task's log and raised with the human"
  consumed_contract: "The consumed contract lives on the producing item and is never copied here — a change to it is raised with the human, never applied"
  task_protocols: "How a task is claimed, done, blocked, and logged is the policy of task.yaml — it is not repeated here"
  on_change_needed: "A wanted change to the shape of an item is raised as an open question in state.yaml, never applied here"


# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "develop.yaml first — the frame: the item index, plan_structure, contracts, boundaries"
  - "then the settings here, in order — responsibility, tech, code_layout, contracts, boundaries, out_of_scope"
  - "then the consumed contract where it lives — backend.yaml, content.contracts.api-v1 — by its own contract_read_order"
  - "then this item's plan in task.yaml, by that file's own read_order"


# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  enabled: "Whether this item is in play"
  code_path: "The one folder this item may write inside"
  summary: "The item in one line"
  needs_test: "Whether every task producing code is proven by a written test"
  verify_cwd: "Where every verify command of this item runs from"
  cross_item_rule: "How this item may lean on the other — the contract version, never a backend task"
  responsibility: "What this item is answerable for"
  tech: "What the item is built with — language, frameworks, state handling, and the run command"
  code_layout: "Every path inside code_path and what it holds"
  contracts: "The contract this item consumes, and where it lives"
  boundaries: "What is this item's, what is not, and the one route to the other item"
  out_of_scope: "What this item does not do"


# <!--------------------------------------------------------------------------------- Content -->
content:

  enabled: true
  code_path: "frontend/"
  code_path_note: "Actual code of this item — relative to the repository root, not the interface root"
  summary: "Web client — consumer of the api-v1 contract"
  needs_test: true
  verify_cwd: "Every verify command runs from frontend/"
  cross_item_rule: "No task here depends on a backend task — the only dependency is on the contract version, via needs_contract"

  responsibility: "Web client — user interface for login, registration, and task management"


  # =============================================================== Tech
  tech:
    language:
      name: "TypeScript"
      frameworks:
        ui: "React — components and rendering"
        build: "Vite — dev server and bundling"
        routing: "React Router — one route per page"
        test: "Vitest + Testing Library — test runner and component testing"
    database:
      engine: "none — this item never touches a database; all data arrives through api-v1"
    state: "Server state via a request cache; local state via React's own hooks"
    run: "npm run dev"


  # =============================================================== Code layout
  code_layout:
    "src/main.tsx": "Entry point"
    "src/api/": "API client — the only layer that talks to the network"
    "src/pages/": "Pages — one file per route"
    "src/components/": "Reusable components"
    "src/auth/": "Session handling and route protection"
    "tests/": "Tests — mirror the structure of src/"


  # =============================================================== Contracts
  contracts:
    consumes: "api-v1"
    contract_location: "backend.yaml — content.contracts.api-v1, on the producing item"
    rule: "Tasks in this item depend on the contract version, not on backend tasks"
    before_frozen: "Until the contract is frozen, work proceeds against mock data derived from that same contract"


  # =============================================================== Boundaries
  boundaries:
    owns: "All code inside frontend/"
    does_not_own: "Backend code and the database schema — not a single line"
    interface: "The only way to communicate with the backend is the api-v1 contract"


  # =============================================================== Out of scope
  out_of_scope:
    - "Server-side business logic and final validation"
    - "Direct database access"
    - "Deployment infrastructure and CI"
