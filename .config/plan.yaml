# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 126
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: 'The independent Model library exists as a reusable project-internal package: every Target Entity is realized with its complete public Declaration, published through the Model Interface as individual exports and one ordered collection, and documented.'
      constraints:
      - An Entity is made public only by the Interface publication work of this phase; no Entity realization work publishes it.
      task_count: 26
      groups:
        P1-G1:
          id: P1-G1
          title: Library Package
          description: The Model library's own packaging and dependency baseline, on which every other piece of Model work builds.
          area: Model library packaging and dependency resolution
          does: The Model library can be installed and imported as a project-internal package with its dependency versions resolved and locked.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the Model library package
              description: Create the Model library as a self-contained package that other project Components can depend on locally. Resolve the dependencies its selected technology needs to concrete compatible versions, make the language's quality-standard tooling available to it, and add any ignore entries it needs to the project's single ignore file.
              reason: Every later Model Task needs a package to live in and a resolved dependency baseline.
              inputs:
              - Model Component identity and selected language profile
              - Development language standards and shared defaults
              skills:
              - sqlmodel
              expected_result: An importable Model package, containing no Entities yet, whose dependencies are resolved and locked.
              depends_on: []
              constraints: []
              acceptance: The package installs into an isolated environment from the repository alone and imports without error, and every dependency is recorded at a concrete version in lock metadata.
              status: done
              log:
              - at: '2026-10-08T06:47:23Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:47:44Z'
                event: decision
                note: Python floor set to >=3.14 (installed interpreter) because Python version is latest-compatible and nothing set a lower bound; dependency floors set to the resolved versions.
              - at: '2026-10-08T06:47:44Z'
                event: done
                note: Created the Model Component directory with a flat-layout library package (uv_build), dependency sqlmodel resolved to 0.0.48 (pydantic 2.14.0, sqlalchemy 2.1.4) and dev tools ruff 0.16.10 and ty 0.0.85, all pinned by the lock file (uv.lock). Isolated environment (.venv) created by uv; package imports. Root ignore file already covers .venv/, __pycache__/ and .ruff_cache/, so no entry was added.
        P1-G2:
          id: P1-G2
          title: Shared Entity Contract
          description: 'The Entity-independent contracts and behaviours every Entity builds on: declaration records, value types, validation, storage mapping, and JSON conversion.'
          area: 'Core: shared declaration, value-type, validation, storage-mapping and conversion contracts'
          does: Every Entity can be declared, validated, mapped to a table form, and converted to and from JSON text through shared contracts.
          constraints: []
          task_count: 6
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Define the Field Declaration contract
              description: Provide the public, immutable record that states one Field's name, description, Type, presence meaning, Default Value, sensitivity, immutability, constraints, and Value Generation, together with the closed sets of Field Types, Value Generation kinds, and Sensitivity Markers it draws on. An invalid or contradictory Field Declaration fails at creation instead of being repaired.
              reason: Entities state their Fields only through this one record, so its rules must exist before any Entity is realized.
              inputs:
              - Model Declaration contract and its structural rules
              - Recognized Sensitivity Markers and Value Generation options
              skills: []
              expected_result: A Field Declaration can be created from valid input and refuses invalid or contradictory input.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: A valid Field Declaration exposes exactly the properties the Declaration contract lists and distinguishes an absent Default Value from an explicit null default; an unknown Type, a Default Value combined with Value Generation, a size constraint on a non-string Field, and a Value Generation on an incompatible Type are each refused rather than coerced.
              status: done
              log:
              - at: '2026-10-08T06:50:05Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:50:32Z'
                event: decision
                note: A Field Type must be given as a FieldType member; a plain string is refused rather than converted, because the unknown-Type rule forbids guessing.
              - at: '2026-10-08T06:50:32Z'
                event: decision
                note: Field description is optional (None) because the Target states none for the mandatory id and is_active Fields and Model adds no description of its own.
              - at: '2026-10-08T06:50:32Z'
                event: done
                note: 'Wrote the Field Declaration part of the public Declaration contract (model/model/core/declaration.py): the closed Field Type, Value Generation and Sensitivity sets, an immutable FieldDeclaration and FieldConstraints, the NO_DEFAULT marker that separates an absent Default Value from an explicit null, and creation-time refusal of invalid Type, Default Value/Value Generation conflicts, misplaced size, mismatched defaults. Observed: valid declarations are created; each listed invalid input raised DeclarationError.'
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Define the Entity Declaration contract
              description: Provide the public, immutable record that states one Entity's name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, checking the Entity-level structural rules when it is created.
              reason: Entity Metadata lives outside Field Declarations, and every Entity publishes it through this one record.
              inputs:
              - Field Declaration contract
              - Model Declaration contract and its structural rules
              skills: []
              expected_result: An Entity Declaration can be created from valid input and refuses structurally invalid input.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: A valid Entity Declaration exposes its name, description, ordered Fields, and Entity Metadata; duplicate Field names, a Primary Key other than the Identity, an unknown or repeated Field reference, duplicate Uniqueness Constraints or Indexes, and a second Relation on one local Field are each refused at creation.
              status: done
              log:
              - at: '2026-10-08T06:50:32Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:50:56Z'
                event: decision
                note: Collections must be given as tuples and are refused otherwise, so immutability needs no copying or coercion.
              - at: '2026-10-08T06:50:56Z'
                event: decision
                note: Entity description is required (str) while Field description is optional, because the Target states a Purpose for every Entity.
              - at: '2026-10-08T06:50:56Z'
                event: done
                note: 'Added Relation and the immutable Entity Declaration (name, description, ordered Fields, Primary Key, Relations, unique_constraints, indexes) to the same Declaration contract file, using the member names from Model Preferences. Structural rules are checked at creation: unique Field names, id as Primary Key (non-nullable, immutable), boolean non-nullable mutable is_active, known local Fields, at most one Relation per local Field, non-empty duplicate-free Uniqueness Constraints and Indexes over known Fields, collections as tuples. Observed: a valid Declaration is created; each of 12 invalid inputs raised DeclarationError.'
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Realize the Field Types
              description: Realize each member of the closed set of Field Types with its in-language form and its JSON text form as Model Preferences set for the selected language, keeping decimal values exact, datetime values timezone-aware, and float values finite. A Type outside the closed set stops generation instead of being guessed.
              reason: Entities and JSON conversion need one agreed realization of every value category.
              inputs:
              - Closed set of Field Types
              - Selected language's Type realization profile
              skills:
              - sqlmodel
              expected_result: Every Field Type has a defined in-language form and JSON text form with its exactness rules enforced.
              depends_on:
              - P1-G2-T1
              constraints: []
              acceptance: A value of each Field Type is accepted in its declared form and refused in any other form without coercion; a datetime without timezone information and a non-finite float are refused; a Type outside the closed set is refused.
              status: done
              log:
              - at: '2026-10-08T06:50:56Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:51:44Z'
                event: decision
                note: JSON decoding converts a text form only when it parses; an unparsable text is passed on unchanged so strict validation refuses it, instead of raising a second kind of error.
              - at: '2026-10-08T06:51:44Z'
                event: done
                note: 'Wrote the private Field Type realization (model/model/core/_types.py): Python annotation per Type (AwareDatetime for datetime, joined with None when nullable), JSON text encode/decode per Type (decimal and uuid as text, temporal values as ISO 8601 text), DecimalText (exact decimal text column returning decimal.Decimal) and AwareDateTime (UTC storage, timezone-aware read-back, naive values refused) column types. Float finiteness and strict Type conformance are in the Declaration contract conforms(). Observed: every Type round-trips through its JSON form with identical value and class; a naive datetime, an infinite float, a bool as integer, a NaN decimal and a non-string are not conforming; both column types round-trip on SQLite.'
            P1-G2-T4:
              id: P1-G2-T4
              source_id: '003'
              title: Provide the shared Entity validation behaviour
              description: 'Provide the private behaviour every Entity inherits: strict validation with no implicit coercion or undeclared Field; whole-Entity validation on construction; atomic validated assignment that keeps the prior value on failure; refusal of assignment to an immutable Field or to a caller-closed Auto Increment Field; an omitted Auto Increment Field kept pending; Generated Identifier production at creation; non-hashable mutable Entities; masking of Sensitivity-marked input in validation messages; and the load-time check that an Entity''s type name, table name, and Fields equal its Declaration.'
              reason: Field contracts must be enforced identically for every Entity from one place, so no Entity re-implements them.
              inputs:
              - Field Declaration contract
              - Entity Declaration contract
              - Field Type realization
              skills:
              - sqlmodel
              expected_result: Any Entity built on this behaviour enforces its Declaration at construction, assignment, and load.
              depends_on:
              - P1-G2-T2
              - P1-G2-T3
              constraints: []
              acceptance: An Entity built on the shared behaviour rejects an unknown Field, a wrong Type, a missing Required Field, a caller-supplied Auto Increment value, and an assignment to an immutable Field; a failed assignment leaves the prior value; a mismatch between the Entity and its Declaration fails loading; a marked input never appears in a validation message.
              status: done
              log:
              - at: '2026-10-08T06:51:44Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: 'Physical Entity name rule: each space-separated word of the logical name is capitalized (first letter only) and the words are joined (PascalCase), rejecting results that are not identifiers or are reserved words.'
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: The shared table metadata is created bare here; its naming convention is registered by the storage-mapping Task, so the validation Task needs nothing from storage.
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: Equality is defined field-by-field on the same Entity type because the library default compares private state and made two equal Entities unequal; this is the equality the JSON round trip requires, nothing more.
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: model_validate on an Entity is routed through construction so every validation path shares one set of rules and one redaction.
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: An explicitly supplied null for an Auto Increment Field is refused like any supplied value; pending is expressed only by omission.
              - at: '2026-10-08T06:53:09Z'
                event: decision
                note: A Field with no declared Default Value that is nullable is omitted as null; this presence meaning is applied by storage-mapping Field realization.
              - at: '2026-10-08T06:53:09Z'
                event: done
                note: 'Wrote the private shared Entity base (model/model/core/_base.py) on top of SQLModel: strict validation with no coercion or undeclared Field; whole-Entity validation on every direct construction (table models skip it natively); atomic validated assignment that keeps the prior value on failure; refusal of assignment to immutable and Auto Increment Fields and of a caller-supplied Auto Increment value (omitted stays pending as None); Generated Identifier production (uuid4) at creation; unhashable mutable Entities; redaction of Sensitivity-marked input in all validation messages without chaining the original error; and a load-time check that type name, table name, Fields (names, order, annotations) equal the Declaration and that the physical name is unique. Observed with a throwaway probe Entity: all listed refusals occurred, prior value kept after a failed assignment, marked input redacted, a type-name mismatch failed loading.'
              - at: '2026-10-08T06:54:05Z'
                event: completed-result-corrected
                note: 'While developing the storage mapping, the library column API was found not to accept a finite-only option, so finiteness of float and decimal values was moved into the shared validation behaviour (validator now refuses infinity and NaN for those Types). Observed: an infinite float is refused at construction. Result of this Task otherwise unchanged; status stays done.'
            P1-G2-T5:
              id: P1-G2-T5
              source_id: '003'
              title: Provide the shared storage mapping
              description: 'Provide the shared table-ready realization of Entities, derived only from the Declaration: deterministic physical table and column names, the Primary Key, a foreign key for each Relation, uniqueness and index entries, a generated identity column for each Auto Increment Field, exact storage of decimals and UTC storage of datetimes, constraint and index names following the single naming convention in Model Preferences, and one shared table metadata that registers the table form of every Entity and nothing else. Model declares this form and never runs storage.'
              reason: The Database Component consumes Entities in table form, which Model must supply from the Declaration alone.
              inputs:
              - Entity Declaration contract
              - Field Type realization
              - Shared Entity validation behaviour
              - Storage naming convention
              skills:
              - sqlmodel
              expected_result: Every Entity built on the shared contract has a table form registered in one shared table metadata.
              depends_on:
              - P1-G2-T2
              - P1-G2-T3
              - P1-G2-T4
              constraints: []
              acceptance: For an Entity built on the shared contract, the table form takes exactly the names, keys, constraints, indexes, and identity column its Declaration and the naming convention imply; the shared table metadata holds exactly the registered Entities' tables; an unresolvable or colliding physical name is rejected.
              status: done
              log:
              - at: '2026-10-08T06:53:09Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:54:05Z'
                event: decision
                note: Naming convention is registered on the shared metadata when the storage module loads, and Entity units import this module before declaring their type, so no Entity is created without it.
              - at: '2026-10-08T06:54:05Z'
                event: decision
                note: A Field that is nullable and states no Default Value is realized with a null default (omitted means null); an Auto Increment Field is realized with a pending null default.
              - at: '2026-10-08T06:54:05Z'
                event: done
                note: 'Wrote the private storage mapping (model/model/core/_storage.py): column-level realization of each Field from its Field Declaration and Entity Metadata (nullability, defaults, description, primary key, single-Field uniqueness and index, foreign key from the Relation, size, exact-decimal and UTC-datetime column types, identity construct for Auto Increment), table-level realization (combined uniqueness, combined indexes, sqlite autoincrement), and the constraint naming convention registered on the one shared table metadata held by the base. Observed with two throwaway probe Entities: both tables registered in one shared metadata; created tables carry pk/fk/uq/ix names of the Preferences form, AUTOINCREMENT identity, VARCHAR(3) for a size-3 string, decimal stored as text and read back exact, a +03:00 datetime stored and returned as UTC-aware, an oversized string and an infinite float refused.'
            P1-G2-T6:
              id: P1-G2-T6
              source_id: '003'
              title: Provide the shared JSON conversion
              description: Provide the public shared contract that converts an Entity to JSON text with one root object whose keys are exactly its Field names in Declaration order, and reconstructs an Entity from such text under the same rules as direct construction. Malformed text, a repeated key, a non-standard constant, and a root that is not one object are rejected.
              reason: Consumers need one portable, lossless representation of every Entity.
              inputs:
              - Shared Entity validation behaviour
              - Field Type realization
              skills:
              - sqlmodel
              expected_result: Every Entity built on the shared contract converts to JSON text and back without loss.
              depends_on:
              - P1-G2-T3
              - P1-G2-T4
              constraints: []
              acceptance: An Entity converted to JSON text and back equals the original, keeping null, false, zero, and empty string distinct and keeping decimal and timezone-aware datetime values exact; each rejected text form is refused.
              status: done
              log:
              - at: '2026-10-08T06:54:05Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-08T06:55:08Z'
                event: decision
                note: A non-null Auto Increment value in JSON text is refused like any supplied value, so an Entity whose identity storage has assigned cannot be rebuilt from its own JSON text; null is read as pending.
              - at: '2026-10-08T06:55:08Z'
                event: decision
                note: A JSON integer for a float Field is read as that float; every other wrong value form is left to strict validation.
              - at: '2026-10-08T06:55:08Z'
                event: done
                note: 'Wrote the public Foundation contract (model/model/core/foundation.py): to_json returns JSON text with one root object whose keys are the Field names in Declaration order (decimal and uuid as text, temporal values as ISO 8601 with offset, pending Auto Increment as null); from_json rejects malformed text, repeated keys, non-standard constants and out-of-range numbers, a non-object root and non-text input, decodes text forms by Field Type and builds the Entity through direct construction; model_validate_json is routed to from_json. Observed with a throwaway probe Entity covering every Field Type: an Entity with all values set and one with defaults both convert to text and back equal to the original with null, empty string, false and exact decimal text preserved; 13 invalid texts were each refused.'
        P1-G3:
          id: P1-G3
          title: User and Connectivity Entities
          description: The Entities for system users, supported trading platforms, and the user-owned connections to those platforms.
          area: 'Entity: user, platform, and connection concepts'
