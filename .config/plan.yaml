                - at: "2026-10-06T15:10:15Z"
                  execution: "014"
                  transition: "claimed -> done"
                  note: "Published exactly one Child Service for every Entity of Model's Entity Collection, together with the republished contracts and nothing else, through the Entity Service Interface."
                  locations:
                    - "logic/logic/services/entity/interface.py"
                  observed: "In a fresh process the interface exposed exactly 31 public names: the 15 Child Services, in the Entity Collection's order and each bound to the Entity of its own name, and the 16 republished contracts; Base and the Storage gateway are not published by name; no two names collide; under an audit hook loading it wrote no file and opened no connection or process."
                  decisions:
