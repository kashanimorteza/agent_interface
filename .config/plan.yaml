              source_id: '024'
              title: Provide the related record choices flow
              description: 'Provide the interface state and flow that supplies a related Field with the records of the Entity it relates to: requesting that Entity''s records through API Access, holding them with the
                loading state, and handing the value of the chosen record back to the record form flow.'
              reason: A related Field is chosen from the records of the related Entity, which only a call to the API can supply.
              inputs:
