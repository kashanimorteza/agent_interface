              expected_result: Trading Platform is available as a complete Entity extending the shared foundation, with a Declaration that matches the Target.
              depends_on:
              - P1-G2-T1
              - P1-G2-T4
              - P1-G2-T5
              constraints: []
              acceptance: The Trading Platform Declaration matches the Target definition of Trading Platform in Fields, order, Types, nullability, defaults, and metadata; the name is unique and the code Field is declared as required.
              status: done
              log:
              - at: '2026-10-08T04:27:45Z'
                execution: '004'
                status: claimed
                note: Claimed; Core dependencies P1-G2-T1, P1-G2-T4, P1-G2-T5 done.
              - at: '2026-10-08T04:28:07Z'
                execution: '004'
                status: done
                note: Realized the Trading Platform Entity as its own unit with every Target Field in Target order and a unique name. Formatted, linted, type-checked; imported and registered in the shared table metadata.
                evidence:
                - model/model/entity/trading_platform.py
                - ruff format/check and ty check passed
                decisions:
                - unset: Physical name of an Entity whose logical name has a space
                  chosen: TradingPlatform for both type and table, module trading_platform
                  why: Physical names remove spaces and capitalise each word under the Entity PascalCase rule.
            P1-G3-T3:
              id: P1-G3-T3
              source_id: '003'
              title: Realize the Instance Entity
              description: Realize Instance as a complete Entity from its Target definition, including its Relations and its optional connection Fields.
              reason: An Account connects to a trading platform through an Instance.
              inputs:
              - The Target definition of Instance
              skills:
              - sqlmodel
              expected_result: Instance is available as a complete Entity extending the shared foundation, with a Declaration that matches the Target.
              depends_on:
              - P1-G2-T1
              - P1-G2-T4
              - P1-G2-T5
              - P1-G3-T1
              - P1-G3-T2
              constraints: []
              acceptance: The Instance Declaration matches the Target definition of Instance in Fields, order, Types, nullability, defaults, and metadata; it relates to User and to Trading Platform, the combination of user_id and name is unique, the optional connection Fields are nullable, and the password and api_key Fields expose a recognized Sensitivity Marker.
              status: done
              log:
              - at: '2026-10-08T04:28:07Z'
                execution: '004'
                status: claimed
                note: Claimed; Core dependencies and the Entities it relates to are done.
              - at: '2026-10-08T04:28:23Z'
                execution: '004'
                status: done
                note: Realized the Instance Entity with every Target Field in order, Relations to User and Trading Platform, combined uniqueness of user_id and name, nullable connection Fields, and sensitivity markers on password and api_key. Formatted, linted, type-checked and imported.
                evidence:
                - model/model/entity/instance.py
                - ruff format/check and ty check passed
                decisions:
                - unset: Sensitivity Marker for the connection credentials
                  chosen: password marker on password; sensitive marker on api_key
                  why: Same mapping as the other credential Fields.
