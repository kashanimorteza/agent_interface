        P1-G4:
          id: "P1-G4"
          title: "Interface publication"
          description: "Publishes every Entity through the Model's single publishing entrypoint under its versioned Interface contract."
          area: "Interface: the entrypoint that publishes the Entity Exports and the Entity Collection."
          does: "Consumers can import any Entity by its own name and enumerate all Entities in Target order through the versioned Interface contract."
          constraints: []
          task_count: 1
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              source_id: "003"
              title: "Publish the Entity Exports and the Entity Collection"
              description: "Publish each Entity by an explicit named export and all Entities once each, in Target order, as the immutable Entity Collection, under the contract version and symbol names Model Preferences set, publishing nothing else and performing nothing when loaded."
              reason: "Consumers depend on one contract that gives them both a single Entity's real type and the complete ordered set of Entities."
              inputs:
                - "Every realized Entity unit"
              skills: []
              expected_result: "The Interface publishes exactly the Entity Exports and the Entity Collection."
              acceptance: "Loading the Interface yields exactly one export per Target Entity, each the actual Entity exposing its actual Declaration, and an immutable Entity Collection holding exactly those Entities in Target order; nothing else is published, and loading creates no instance, data, connection, file, or process."
              depends_on: ["P1-G3-T1", "P1-G3-T2", "P1-G3-T3", "P1-G3-T4", "P1-G3-T5", "P1-G3-T6", "P1-G3-T7", "P1-G3-T8", "P1-G3-T9", "P1-G3-T10", "P1-G3-T11", "P1-G3-T12", "P1-G3-T13", "P1-G3-T14", "P1-G3-T15"]
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T19:07:43Z"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "2026-10-12T19:08:22Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Wrote the Interface as the package's only publishing file: one explicit named import per Entity under its physical name and the Entity Collection as an immutable tuple of all fifteen Entities in Target order under the selected symbol name; every package initialiser stays empty."
                  locations: ["model/model/interface.py"]
                  evidence: "A scratch check loaded the Interface and saw exactly the fifteen Entity names plus the Entity Collection published, each export identical to the class defined in its own unit with its own Declaration, the Collection a tuple holding those classes in Target order and refusing item assignment, no wildcard or published-name list, the package initialiser publishing nothing, and no Entity instance, file, new directory entry, or network connection created during load; ruff and ty reported no violation."
                  decisions:
                    - unset: "How the named exports are written."
                      chosen: "Plain named imports used by the Collection, without self-aliasing."
                      why: "Each import is an explicit named export; the selected linter rejects redundant re-export aliases."

