# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress. Operational Config record at the project root, outside .interface/."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."
  changed_by: "Skills and supporting Agent Instances, each within the records its own Operation owns."
  precedence: "The Plan Schema and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 40
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Implement the independent Model layer and its reusable package from the defined models, fields, relationships, and rules.
      constraints: []
      task_count: 40
      groups:
        P1-G1:
          id: P1-G1
          title: Component scaffold
          description: The Model Component's own package identity and dependency resolution, which must exist before any contract is realized inside it.
          area: Component packaging and canonical structure
          does: The Model Component exists as a consumable project-internal library with its canonical structure ready to receive shared contracts and Entities.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T01:
              id: P1-G1-T01
              source_id: '002'
              title: Establish the Model library Component
              description: Create the Model Component as a library with its package identity, resolved dependencies, and the canonical areas for the Interface, the Entity units, and the shared Core.
              reason: Every other contract of the phase is realized inside this Component, and its direct consumers depend on it as a local library.
              inputs:
              - Model Component selections for identity and language
              - Development shared defaults and the declared Connections to Model
              skills: []
              expected_result: An importable, dependency-resolved library whose canonical areas exist and which publishes no Entity yet.
              depends_on: []
              constraints: []
              acceptance: The library can be loaded from a clean setup with all dependencies resolved, exposes no Entity, and loading it creates no instance, data, connection, file, or process.
              status: done
              log:
              - at: '2026-10-07T18:59:44Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:00:16Z'
                entry: '003'
                event: done
                evidence: 'Created the Model Component directory with its build metadata, lockfile (sqlmodel 0.0.48, pydantic 2.14.0, sqlalchemy 2.1.4; dev group ruff, ty), and the package with empty interface/core/entity areas. Observed: uv sync succeeded; importing the package in an isolated interpreter succeeded and exposed no names.'
                decisions:
                - Component root is the Component directory 'model' holding build metadata and documentation, with package directory 'model' inside it (flat layout, module-root empty). Model Preferences name both as 'model' and the Definition tree shows the documentation beside the package; layout between them was unset.
              - at: '2026-10-07T19:20:02Z'
                entry: '003'
                event: note
                note: 'Decision: a small ignore file was added at the Component root listing the isolated environment and tool caches, so machine-specific artifacts are not committed; the project-level ignore file is outside this Component and not changed. This was unset in the Task and Preferences.'
        P1-G2:
          id: P1-G2
          title: Declaration contract
          description: The public structured records that state Entity and Field meaning, with their structural rules checked at creation.
          area: Public Declaration contract in the shared Core
          does: Any Entity's meaning can be stated as an immutable Declaration that refuses contradictory structure when it is created.
          constraints: []
          task_count: 4
          tasks:
            P1-G2-T01:
              id: P1-G2-T01
              source_id: '002'
              title: Define the closed vocabularies of Field meaning
              description: 'Define the closed sets that Declarations draw from: Field Types, Value Generation kinds, Sensitivity Markers, and Field Constraints.'
              reason: Field and Entity Declarations can only be validated against sets that are fixed and shared.
              inputs:
              - Model definition of Field Types, Value Generation, and Sensitivity
              - Recognized Sensitivity Markers from Model selections
              skills: []
              expected_result: One shared vocabulary that every Declaration and every consumer of a Declaration uses.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: Only the members of each closed set are accepted; any other value is refused, and an unknown Field Type stops generation instead of being guessed.
              status: done
              log:
              - at: '2026-10-07T19:00:16Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:00:39Z'
                entry: '003'
                event: done
                evidence: 'Added the closed vocabularies (Field Type, Value Generation, Sensitivity, Field Constraints, and a Declaration error) to the shared Core declaration area. Observed: the nine Field Types, two Value Generation kinds, and two Sensitivity Markers construct; an unknown member of each is refused; a size of zero or a boolean is refused.'
            P1-G2-T02:
              id: P1-G2-T02
              source_id: '002'
              title: Define the Field Declaration record
              description: Define the immutable record of one Field's name, description, Type, presence meaning, Default Value, sensitivity, immutability, constraints, and Value Generation.
              reason: A Field's complete value contract must be stated once so no realization reads omission, null, defaults, or generation differently.
              inputs:
              - Closed vocabularies of Field meaning
              skills: []
              expected_result: A Field Declaration that distinguishes an absent Default Value from an explicit null default and refuses contradictory combinations when created.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: A Field Declaration with a default that mismatches its Type or nullability, a default together with Value Generation, a size constraint on a non-string Field, Auto Increment on a non-integer Field, or a Generated Identifier on a Field that is neither uuid nor string is refused, while consistent Declarations are accepted and keep absent and explicit-null defaults distinguishable.
              status: done
              log:
              - at: '2026-10-07T19:00:39Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:02:13Z'
                entry: '003'
                event: done
                evidence: 'Added the immutable Field Declaration record (name, Type, nullability, description, Default Value with a distinct absent marker, Sensitivity Marker, immutability, constraints, Value Generation) to the shared Core declaration area. Observed: consistent Declarations construct and keep an absent default distinct from an explicit null; a default mismatching Type or nullability, a default with Value Generation, a size on a non-string Field, Auto Increment on a non-integer, a Generated Identifier on an integer, a non-finite float default, a naive datetime default, a datetime default for a date Field, and a plain-string Type are each refused.'
            P1-G2-T03:
              id: P1-G2-T03
              source_id: '002'
              title: Define the Entity Metadata records
              description: Define the immutable records for a Relation, a Uniqueness Constraint, and an Index, each owned by an Entity rather than by one Field.
              reason: Structure beyond a single Field must be stated outside Field Declarations so consumers can realize it unambiguously.
              inputs:
              - Model definition of Entity Metadata
              skills: []
              expected_result: Relation, Uniqueness Constraint, and Index records that state only what the Model contract allows them to state.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: A Relation records exactly a local Field, a target Entity name, and a target Field name; a Uniqueness Constraint or Index records a non-empty ordered set of Fields without a repeated Field; anything beyond that is refused.
              status: done
              log:
              - at: '2026-10-07T19:00:16Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:00:39Z'
                entry: '003'
                event: done
                evidence: 'Added immutable Relation, Uniqueness Constraint, and Index records to the shared Core declaration area. Observed: valid records construct and are frozen; an empty or repeated Field set, a non-tuple Field set, an empty Field name, and an empty Relation member are each refused.'
            P1-G2-T04:
              id: P1-G2-T04
              source_id: '002'
              title: Define the Entity Declaration record
              description: Define the immutable record of one Entity's name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, and the rules that make it consistent.
              reason: The Entity Declaration is the public statement of an Entity's meaning and the single source from which validation and storage are derived.
              inputs:
              - Field Declaration record
              - Entity Metadata records
              skills: []
              expected_result: An Entity Declaration that refuses contradictory structure when created and exposes every part of an Entity's meaning.
              depends_on:
              - P1-G2-T02
              - P1-G2-T03
              constraints: []
              acceptance: An Entity Declaration with a repeated Field name, a Primary Key other than the Identity, a nullable or mutable Identity, a nullable or immutable Activity Field, a Relation or entry naming an unknown Field, a second Relation on one local Field, or a duplicated Uniqueness Constraint or Index is refused, while a consistent Declaration exposes all of its parts.
              status: done
              log:
              - at: '2026-10-07T19:02:13Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:02:33Z'
                entry: '003'
                event: done
                evidence: 'Added the immutable Entity Declaration record (name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, Indexes) to the shared Core declaration area, with a Field lookup and Field-name listing. Observed: a consistent Declaration exposes all parts; a repeated Field name, missing id or is_active, a Primary Key other than id, a nullable or mutable id, a mutable-flag or non-boolean is_active, an unknown Field in a Relation, Uniqueness Constraint or Index, two Relations on one Field, and duplicate Uniqueness Constraints or Indexes are each refused.'
        P1-G3:
          id: P1-G3
          title: Entity runtime behaviour
          description: The shared private validation and the public Foundation conversion that every Entity inherits.
          area: Shared Validation and Foundation conversion
          does: Every Entity inherits strict Field enforcement, identity handling, and a lossless round trip through JSON text.
          constraints: []
          task_count: 10
          tasks:
            P1-G3-T01:
              id: P1-G3-T01
              source_id: '002'
              title: Realize the Field Types for the selected language and for JSON
              description: Give each closed Field Type its value representation in the selected language and its JSON form, including finite floats and timezone-aware datetimes.
              reason: Validation, conversion, and storage all depend on one agreed representation of each Type.
              inputs:
              - Closed vocabularies of Field meaning
              - Language profile selected for Model
              skills:
              - sqlmodel
              expected_result: A single representation per Field Type that validation, conversion, and storage share.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: Values of every Field Type are accepted in their language form and appear in their JSON form, while a non-finite float and a datetime without timezone are refused.
              status: done
              log:
              - at: '2026-10-07T19:00:39Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:02:13Z'
                entry: '003'
                event: done
                evidence: 'Added the private Field Type realization: Python value rules and JSON forms for all nine Field Types. Observed: a value of each Type survives conversion to its JSON form and back unchanged with the same Python type; booleans are refused as integers, non-finite floats, integers for floats, naive datetimes, datetimes for date Fields, and non-finite decimals are refused; malformed JSON forms are refused with messages that do not echo the value.'
                decisions:
                - Date and time values use the standard ISO 8601 text of the language; a float JSON number written without a fraction is read back as a float. Preferences name the JSON form of date and time only as ISO 8601 strings, so these details were unset.
              - at: '2026-10-07T19:20:02Z'
                entry: '003'
                event: note
                note: 'Post-completion correction within the same execution, after the Component''s own lint and type tooling reported issues in this output; behaviour is unchanged. Afterwards the Component''s lint and type checks report no issues and the earlier observations were all repeated against the final state and held (foundation behaviours, all 15 Entities against the Target, exports, collection, integration run, documentation examples, verification snippet). Change: the JSON-form decoding helpers were typed precisely and their type checks rewritten with exact-type tests (a boolean is still refused as an integer, an integer is still accepted for a float).'
            P1-G3-T02:
              id: P1-G3-T02
              source_id: '002'
              title: Enforce strict whole-Entity validation on construction
              description: Make direct construction and JSON Object construction accept only declared Fields and enforce required values, nullability, Types, defaults, and constraints identically, without implicit coercion.
              reason: Construction is where every Field contract must hold before an Entity can exist.
              inputs:
              - Entity Declaration record
              - Field Type representations
              skills:
              - sqlmodel
              expected_result: Construction that validates the whole Entity before any value is set and treats explicit false, zero, empty string, and null as supplied values.
              depends_on:
              - P1-G2-T04
              - P1-G3-T01
              constraints: []
              acceptance: Construction from valid values succeeds; an undeclared Field, a wrong Type, a missing required value, a null in a non-nullable Field, and a violated constraint are each refused; values are never coerced; explicit false, zero, empty string, and null are retained as supplied.
              status: done
              log:
              - at: '2026-10-07T19:02:33Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: done
                evidence: 'Added the private Base: each Entity declares its Declaration, and Base derives from it a strict whole-Entity validator (declared Fields only, no coercion, defaults validated) that runs on every direct and JSON-based construction before any value is set. Observed with a scratch Entity: valid construction keeps defaults; a missing required value, an undeclared Field, a wrong Type, an over-size string, an integer or text for a decimal, an integer for a boolean, and null for a non-nullable Field are each refused; explicit null, false, and a supplied decimal are retained as supplied; an omitted nullable Field is null.'
                decisions:
                - Validation runs through a separate plain validator derived from the Declaration, instead of model_validate on the table class itself. The table-model preference describes the latter; the validator keeps validation free of SQLAlchemy instance state and gives identical results. Undeclared validation shape was unset.
              - at: '2026-10-07T19:20:02Z'
                entry: '003'
                event: note
                note: 'Post-completion correction within the same execution, after the Component''s own lint and type tooling reported issues in this output; behaviour is unchanged. Afterwards the Component''s lint and type checks report no issues and the earlier observations were all repeated against the final state and held (foundation behaviours, all 15 Entities against the Target, exports, collection, integration run, documentation examples, verification snippet). Change: typing of the validator construction and the context manager return type.'
            P1-G3-T03:
              id: P1-G3-T03
              source_id: '002'
              title: Enforce atomic validation on assignment
              description: Make assignment to a Field refuse an immutable Field and revalidate the whole Entity with the new value for any other Field.
              reason: Mutation must be held to the same Field contracts as construction without leaving a half-changed Entity.
              inputs:
              - Strict construction validation
              skills:
              - sqlmodel
              expected_result: Assignment that either fully succeeds or leaves the prior value untouched.
              depends_on:
              - P1-G3-T02
              constraints: []
              acceptance: Assigning a valid value to a mutable Field changes it; assigning an invalid value is refused and the prior value remains; assigning an immutable Field is refused.
              status: done
              log:
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: done
                evidence: 'Added assignment validation to the private Base: assigning a declared mutable Field revalidates the whole Entity with the new value first and only then sets it; an immutable Field, an undeclared name, and the Declaration member are refused. Observed on a scratch Entity (asserted): a valid assignment changes the value; a wrong Type, null for a non-nullable Field, and a boolean given an integer are refused and the prior value remains; assigning the immutable id, an undeclared name, and the declaration member is refused.'
            P1-G3-T04:
              id: P1-G3-T04
              source_id: '002'
              title: Keep Auto Increment Fields pending and closed to callers
              description: Leave an omitted Auto Increment Field in an explicit pending state without making it nullable, and refuse a caller-supplied value at construction and at assignment unless the Target permits one.
              reason: Storage, not the caller or the Model, owns the value of an Auto Increment Field.
              inputs:
              - Atomic assignment validation
              skills:
              - sqlmodel
              expected_result: Auto Increment Fields that are pending until storage assigns them and are never assigned inside Model.
              depends_on:
              - P1-G3-T03
              constraints: []
              acceptance: An Entity constructed without its Auto Increment Field reports it as pending while the Field remains non-nullable in its Declaration; supplying a value for it at construction or assignment is refused.
              status: done
              log:
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:09:26Z'
                entry: '003'
                event: done
                evidence: 'Closed Auto Increment Fields to callers: an omitted one stays pending (null) while its Declaration remains non-nullable, a supplied value is refused at construction, and any assignment is refused with a message naming the Field. Observed (asserted): omitted and explicit-null id stay pending; supplying a value for id or for a second Auto Increment Field at construction is refused; assigning either is refused and leaves them pending; no Preference permits caller values, so none are accepted.'
            P1-G3-T05:
              id: P1-G3-T05
              source_id: '002'
              title: Produce Generated Identifiers during Entity creation
              description: Supply a value for a Field declared with a Generated Identifier when the Entity is created, using the selected algorithm unless the Target names another.
              reason: A declared Generated Identifier must be filled by the Model so callers never choose it.
              inputs:
              - Strict construction validation
              - Selected generated-identifier algorithm
              skills:
              - sqlmodel
              expected_result: Entities whose Generated Identifier Fields are filled with valid, distinct values at creation.
              depends_on:
              - P1-G3-T02
              constraints: []
              acceptance: Two Entities created with a Generated Identifier Field carry different values that satisfy the Field's contract, and a caller-supplied value follows the Field's normal validation.
              status: done
              log:
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: done
                evidence: 'Added Generated Identifier production: a Field declared with Value Generation generated_identifier receives a new value at Entity creation, produced with the algorithm Model Preferences select (uuid4), in both the validator and the table realization, and the value validated at creation is the one stored. Observed (asserted): two Entities carry different version-4 UUID values; a supplied valid UUID is used; a supplied non-UUID is refused by the normal Field validation.'
            P1-G3-T06:
              id: P1-G3-T06
              source_id: '002'
              title: Keep sensitive values out of validation messages
              description: Replace the input of a Field carrying a Sensitivity Marker in every validation message and never expose or chain the original message holding the value.
              reason: A marker records what a value means, and its only effect is that diagnostics never echo it.
              inputs:
              - Strict construction validation
              - Sensitivity Markers
              skills:
              - sqlmodel
              expected_result: Validation diagnostics that never contain a marked Field's value.
              depends_on:
              - P1-G3-T02
              constraints: []
              acceptance: A validation failure on a Field carrying a Sensitivity Marker produces a message without the offending value and without a chained original message, while the stored value is otherwise unchanged by the marker.
              status: done
              log:
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: done
                evidence: 'Validation failures now replace the input of any Field carrying a Sensitivity Marker, and the input of unknown or missing-value errors that would echo the whole input; the sanitized error is raised outside the handler so the original message is not chained. Observed (asserted) on a scratch Entity with a password-marked Field: a wrong-type value, an unknown key carrying the same text, and a failed assignment never print the value in the message or error list; the error has no cause or context; the Entity representation omits the value; the stored value and its JSON text are unchanged; a non-sensitive Field''s input is still shown.'
                decisions:
                - Errors that would otherwise echo the whole input (missing values, undeclared Fields) also have their input replaced, since that input can contain a sensitive value; the Model contract names only marked Fields, so this extent was unset.
              - at: '2026-10-07T19:20:02Z'
                entry: '003'
                event: note
                note: 'Post-completion correction within the same execution, after the Component''s own lint and type tooling reported issues in this output; behaviour is unchanged. Afterwards the Component''s lint and type checks report no issues and the earlier observations were all repeated against the final state and held (foundation behaviours, all 15 Entities against the Target, exports, collection, integration run, documentation examples, verification snippet). Change: typing of the error rebuild.'
            P1-G3-T07:
              id: P1-G3-T07
              source_id: '002'
              title: Make mutable Entities unhashable
              description: Ensure a mutable Entity is not hashable and that the Model defines no equality, ordering, copy, or merge beyond what the JSON round trip requires.
              reason: Mutable data must not be usable as a stable key, and the Model must not invent behaviour the contract does not state.
              inputs:
              - Strict construction validation
              skills:
              - sqlmodel
              expected_result: Entities that refuse hashing and carry no invented comparison or copy behaviour.
              depends_on:
              - P1-G3-T02
              constraints: []
              acceptance: Using a mutable Entity as a hash key is refused.
              status: done
              log:
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: done
                evidence: 'Set the private Base hash to none so mutable Entities are not hashable; Model defines no equality, ordering, copy, or merge of its own. Observed (asserted): hashing an Entity and putting one in a set both raise a type error.'
            P1-G3-T08:
              id: P1-G3-T08
              source_id: '002'
              title: Provide conversion of an Entity to JSON text
              description: Give every Entity a conversion to JSON text with one root object whose keys are exactly its Field names in Declaration order.
              reason: Consumers need one portable, lossless value representation of an Entity.
              inputs:
              - Field Type representations
              - Strict construction validation
              skills:
              - sqlmodel
              expected_result: JSON text conforming to the JSON standard that preserves each value's declared Type semantics.
              depends_on:
              - P1-G3-T01
              - P1-G3-T02
              constraints: []
              acceptance: The output parses as standard JSON with a single root object whose keys equal the Field names in Declaration order, null, false, zero, and empty string remain distinguishable, and decimal and datetime values keep their exact value.
              status: done
              log:
              - at: '2026-10-07T19:04:34Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: done
                evidence: 'Added conversion of an Entity to JSON text to the public Foundation contract: one root object whose keys are the Field names in Declaration order, null for pending or null values, decimals as exact text, datetimes as ISO 8601 with offset, uuids as text, no non-standard constants. Observed (asserted): the text parses as standard JSON with keys in Declaration order, the pending id is null, a 27-digit decimal is exact text, a +05:00 datetime keeps its offset, non-ASCII text is retained, and empty string, 0.0, and false stay distinct from null.'
            P1-G3-T09:
              id: P1-G3-T09
              source_id: '002'
              title: Provide construction of an Entity from JSON text
              description: Give every Entity a construction from JSON text that rejects malformed input and decodes values by each Field's Type before applying the construction rules.
              reason: A lossless round trip requires reconstruction to be as strict as direct construction.
              inputs:
              - Conversion of an Entity to JSON text
              - Strict construction validation
              skills:
              - sqlmodel
              expected_result: Reconstruction that returns an equal Entity from the text produced by conversion.
              depends_on:
              - P1-G3-T02
              - P1-G3-T08
              constraints: []
              acceptance: Malformed text, a repeated key, a non-standard constant, and a root that is not a single object are each refused; valid text rebuilds an Entity that converts to the same text again.
              status: done
              log:
              - at: '2026-10-07T19:08:32Z'
                entry: '003'
                event: claimed
                note: Claimed by Develop before work began.
              - at: '2026-10-07T19:09:26Z'
                entry: '003'
                event: done
                evidence: 'Added construction from JSON text to the public Foundation contract: malformed text, a repeated key, a non-standard constant, and a non-object root are rejected, values are decoded by each Field''s Type, and the Entity is then built with the direct-construction rules. Observed (asserted): an Entity with a many-digit decimal, a -03:30 datetime with microseconds, empty string, 0.0, and false converts to text and back to an Entity whose text is identical and whose every Field is equal with the same Python type; 20 invalid texts (malformed, empty, non-object roots, repeated key, NaN/Infinity, undeclared key, missing required, wrong value forms, naive datetime, null for a non-nullable Field, supplied id, overflowing float) are each refused; refusal messages do not contain the sensitive or undeclared value; an absent key applies the default and a null id stays pending.'
              - at: '2026-10-07T19:20:02Z'
                entry: '003'
                event: note
                note: 'Post-completion correction within the same execution, after the Component''s own lint and type tooling reported issues in this output; behaviour is unchanged. Afterwards the Component''s lint and type checks report no issues and the earlier observations were all repeated against the final state and held (foundation behaviours, all 15 Entities against the Target, exports, collection, integration run, documentation examples, verification snippet). Change: the root-object check uses an exact-type test.'
            P1-G3-T10:
              id: P1-G3-T10
              source_id: '002'
              title: Verify each Entity type against its Declaration when it is defined
              description: Check at definition time that an Entity type's name and table name equal the Entity's physical name and that its Fields are exactly the Declaration's Fields in the same order.
              reason: A mismatch between an Entity and its Declaration must stop loading rather than surface later.
              inputs:
              - Entity Declaration record
              - Strict construction validation
              skills:
              - sqlmodel
              expected_result: Entity definitions that cannot load while they disagree with their Declaration.
              depends_on:
              - P1-G2-T04
