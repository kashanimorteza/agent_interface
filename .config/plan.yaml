                note: Credential Fields (password, api_key) are held as plain string Fields with no Sensitivity Marker, because the Target declares none and Model neither hashes nor encrypts; the Target's at-rest storage rules for them are outside Model's Boundaries (recorded as an Open Question).
              - at: '2026-10-08T06:57:09Z'
                event: done
