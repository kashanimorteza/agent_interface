          title: Entity Sections
          description: The Section of the Entity Area for every Entity of Model, each presenting one Adapter of the API's Entity Group and composed from the shared Components, Interaction Logic, API Access and Theme,
            with its Fields drawn from the Entity's Declaration. The Target defines no Behaviour specific to any single Entity, so no Section adds, omits or alters an action.
          area: 'Entity Area: the Section of every Entity'
          does: Every Entity has exactly one Section that offers a user action for every Endpoint of its Adapter, in step with the API; each action calls its Endpoint and presents the result, or the error returned,
            as the API gives it, and each Section stands entirely on its own, sharing no page or inherited structure with another Section.
