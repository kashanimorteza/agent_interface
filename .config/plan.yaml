        P4-G7:
          id: P4-G7
          title: Group Registration
          description: The assembly of Entity Group from its Adapters and the registration of every listed Group beneath its URL segment.
          area: 'Entity Group and Bootstrap: Group assembly and registration'
          does: Every Endpoint of every listed Group is served at its address beneath the Base URL, and the API serves nothing else.
          constraints: []
          task_count: 2
          tasks:
            P4-G7-T1:
              id: P4-G7-T1
              source_id: '016'
              title: Assemble the Entity Group
              description: 'Provide the Entity Group under its configured name: it presents every Adapter beneath the Adapter segment named from its Entity and presents nothing else. Every Adapter segment and
                every Method-and-Path combination is valid and unique.'
              reason: The Group is the unit Bootstrap registers, and clients need unambiguous addresses.
              inputs:
              - Every Entity Adapter
              - Entity Group Preferences
              skills:
              - fastapi
              expected_result: The Entity Group presenting all its Adapters.
              depends_on:
              - P4-G6-T1
              - P4-G6-T2
              - P4-G6-T3
              - P4-G6-T4
              - P4-G6-T5
              - P4-G6-T6
              - P4-G6-T7
              - P4-G6-T8
              - P4-G6-T9
              - P4-G6-T10
              - P4-G6-T11
              - P4-G6-T12
              - P4-G6-T13
              - P4-G6-T14
              - P4-G6-T15
              constraints: []
              acceptance: The Group presents exactly one Adapter segment for each Entity Adapter; no two Adapter segments are equal and no two Endpoints share a Method and Path; an invalid or colliding identity
                stops generation with a clear error and nothing is renamed.
              status: done
              log:
              - at: '2026-10-09T19:25:08Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:26:19Z'
                event: decision
                note: The Entity Group is assembled in Bootstrap as an explicit ordered list of the 15 Adapter routers under the Group's configured name, because the Entity Group's Directory Structure holds only Adapter
                  units and its documentation; each Adapter router carries its own Adapter segment, and the Group segment is the configured name in lower case.
              - at: '2026-10-09T19:26:19Z'
                event: done
                note: 'Assembled the Entity Group in Bootstrap: an explicit list of the 15 Adapters in the Collection''s order under the Group name Entity, each Adapter carrying its segment and section tag. Observed:
                  15 distinct Adapter segments equal to the Entities of Logic''s Entity Service in order, 12 Endpoints under each, 180 distinct method and path pairs; no Adapter or Endpoint beyond these.'
            P4-G7-T2:
              id: P4-G7-T2
              source_id: '016'
              title: Register every listed Group beneath its URL segment
              description: Register each Group listed in the API Preferences beneath the URL segment of its configured name after the Base URL, so that every Endpoint is served at the Base URL followed by the
                Group segment, the Adapter segment and the Endpoint path. Register nothing else.
              reason: Clients need one address for every capability area, and the API has no capability of its own.
              inputs:
              - Group list of the API Preferences
              - Runtime Configuration
              - Entity Group
              skills:
              - fastapi
              expected_result: Every listed Group served beneath its segment.
              depends_on:
              - P4-G7-T1
              - P4-G3-T1
              - P4-G2-T2
              constraints: []
              acceptance: Every Endpoint of the Entity Group answers at the Base URL followed by the Group segment, the Adapter segment and the Endpoint path; with the key setting on, no Endpoint answers without
                the key segment; no path outside the registered ones is served and the API has no Endpoint of its own.
              status: done
              log:
              - at: '2026-10-09T19:25:08Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:26:19Z'
                event: decision
                note: The interactive documentation's OAuth redirect route is switched off, because the unmodified application served it at the bare address outside the Group segment and key, and nothing in the API uses
                  OAuth.
              - at: '2026-10-09T19:26:19Z'
                event: done
                note: 'Registered every listed Group in Bootstrap beneath its segment: each Adapter router is included beneath the key, when the Configuration has one, and the lower-case Group name. Observed on the application
                  itself: all 180 Endpoints are served at the Base URL, the Group segment, the Adapter segment and the Endpoint path, and each answered at its address with a refusal raised before any Handler ran (probe
                  requests built so that conversion refuses them); the same paths answer 404 without the key, with a wrong key, without the Group segment and with the Group name in upper case; the root, the key root
                  and the Group root answer 404; apart from the interactive documentation and its schema the application has no route of its own, and the unmodified OAuth redirect route that sat outside the key was found
                  and removed.'
        P4-G8:
          id: P4-G8
