                - "P1-G1-T12"
              constraints: []
              acceptance: "The published Declaration of the Trading Platform Entity matches the Target's definition of Trading Platform in Fields, order, Types, nullability, defaults, and metadata; the Entity constructs from valid values, rejects an unknown Field, a wrong Type, and a missing required value, and returns an equal Entity after conversion to JSON text and back."
              status: "todo"
            P1-G2-T3:
