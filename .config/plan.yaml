                  script: it answered 200 on the configured address beneath the key and 404 at the bare address, exactly 2 worker processes were running, and the port was free again after the process was stopped.'
        P4-G4:
          id: P4-G4
          title: Parameter Conversion
          description: The conversion of non-simple Parameters and results between their transport forms and the types the Logic Interface publishes. It is part of serving and happens before any Handler runs.
          area: 'Serving: conversion of non-simple Parameters and results'
          does: Every non-simple Parameter arrives in its stated transport form and reaches its Handler as the published type, and every result leaves in a form that loses nothing.
          constraints: []
          task_count: 4
          tasks:
            P4-G4-T1:
              id: P4-G4-T1
              source_id: '016'
              title: Convert Filters and Orders
              description: 'Provide the transport forms of the query values: a Filter as an object of field, operator and value and an Order as an object of field and direction, each in a request body. A field
                travels as the name of a Field of the bound Entity and resolves to it; operators and directions travel by name. Each is converted to the published value before the Handler runs.'
              reason: Every client must send query values the same way for every Entity.
              inputs:
              - Published value group
              - Value form table of the API Preferences
              - Bound Entity's Fields
              skills:
              - fastapi
              expected_result: Conversion of Filter and Order objects into the published values.
              depends_on:
              - P4-G3-T1
              - P3-G4-T3
              constraints: []
              acceptance: A Filter or Order object with a known field name and a known operator or direction reaches its Handler as the published value; an unknown field name, operator or direction fails with
                the source's invalid-input error unchanged; nothing is converted inside a Handler.
              status: done
              log:
              - at: '2026-10-09T19:21:36Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:22:44Z'
                event: decision
                note: A combination travels by name as plain text, because the Preferences' value table names only Filter, Order and Instance and the combination is a closed set like an operator or direction; unknown
                  names fail with the source's invalid-input error.
              - at: '2026-10-09T19:22:44Z'
                event: decision
                note: A Filter value sent as text for a decimal, datetime, date, time or uuid Field is decoded to that type by the Field's declared type before the Filter is built, because the source accepts only typed
                  values for those Fields; other values pass through, so floats for decimals are still refused by the source.
              - at: '2026-10-09T19:22:44Z'
                event: done
                note: 'Wrote the shared conversion for Filters, Orders and combinations in the application''s conversion unit: Filter and Order transport objects (extra keys refused), the field name resolved to the bound
                  Entity''s Field attribute, operator and direction resolved by name, applied through validators on the request parameters so they run before any Handler. Observed on a probe application (not part of
                  the Component): filter plus order plus limit, OR combination, IS_NULL without value and IN with a list reached the source and returned records; an unknown field, operator, direction or combination failed
                  with the source''s Invalid Input error as 422 Problem Details; no conversion is done inside a route function.'
            P4-G4-T2:
              id: P4-G4-T2
              source_id: '016'
              title: Convert Instance selections
              description: 'Provide the transport form of an Instance selection: its name, converted to the published Instance before the Handler runs.'
              reason: A client must be able to choose where a call runs without knowing any connection detail.
              inputs:
              - Published Instance group
              - Value form table of the API Preferences
              skills:
              - fastapi
              expected_result: Conversion of an Instance name into the published Instance.
              depends_on:
              - P4-G3-T1
              - P3-G4-T3
              constraints: []
              acceptance: A known Instance name reaches the Handler as the published Instance; an unknown name fails with the source's invalid-input error unchanged; omitting the selection leaves the Handler's
                default.
              status: done
              log:
              - at: '2026-10-09T19:21:37Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:22:45Z'
                event: done
                note: 'Added the Instance conversion: a name is resolved to the published Instance member, in a request body or query, before the Handler runs; an omitted selection stays None for the source''s default.
                  Observed on the probe: the name SQLITE reached the Handler as the published member, an omitted name reached it as None, an unknown name failed with the source''s Invalid Input error as 422 Problem Details.'
            P4-G4-T3:
              id: P4-G4-T3
              source_id: '016'
              title: Convert Entity instances in requests
              description: 'Provide the transport form of an Entity instance given to a Handler: a JSON object of the Entity''s Fields, built from the bound Entity''s class before the Handler runs.'
              reason: A client must be able to add and replace records by sending them as JSON.
              inputs:
              - Published Entities
              - Entity JSON conversion the Entity offers
              skills:
              - fastapi
              expected_result: Conversion of a JSON object into an instance of the bound Entity.
              depends_on:
              - P4-G3-T1
              - P3-G4-T2
              constraints: []
              acceptance: A complete object of Fields reaches the Handler as an instance of the bound Entity holding the given values; an object the Entity refuses never reaches the Handler.
              status: done
              log:
              - at: '2026-10-09T19:21:37Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:22:45Z'
                event: decision
                note: An Entity instance that carries a stored identity (needed by update, whose Entity must hold its stored id) is built by validating every other Field through the Entity's JSON construction and then
                  constructing the instance with the identity through pydantic's model_construct, because the Entity's construction and JSON conversion refuse a supplied identity and the Model offers no public way to
                  build an Entity with one; recorded as an Open Question.
              - at: '2026-10-09T19:22:45Z'
                event: done
                note: 'Added the Entity request conversion: a JSON object of Fields becomes an instance of the bound Entity through the Entity''s own JSON construction before the Handler runs; a non-null identity is
                  carried over after the other Fields validate. Observed on the probe with Currency: an add body built a Currency instance and was stored (id assigned); an update body carrying the stored id built an
                  instance holding that id and the source updated the record; a wrong value form, a missing key, an unknown key and a non-object were all refused before the Handler (422); a supplied id on add reached
                  the source and was refused by it with its own Invalid Input error.'
            P4-G4-T4:
              id: P4-G4-T4
              source_id: '016'
              title: Return results in transport form
              description: 'Provide the transport form of Handler results: an Entity, a list of Entities, a count, a total, an extreme value, a deleted count or no value are returned as JSON, with every Field
                value kept without loss.'
              reason: A client must receive the Action's result unchanged in meaning.
              inputs:
              - Published Entities
              - Entity JSON conversion the Entity offers
              skills:
              - fastapi
              expected_result: Results returned as JSON.
              depends_on:
              - P4-G3-T1
              - P3-G4-T2
              constraints: []
              acceptance: A returned Entity appears as a JSON object holding every Field value; a list appears as a JSON array of such objects; numbers, exact decimals, dates and times and the absence of a
                value survive the round trip; a result of no value is returned as null and is not an error.
              status: done
              log:
              - at: '2026-10-09T19:21:37Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:22:45Z'
                event: decision
                note: Results are returned through the framework's own serialization of the returned Entity, with no wrapper, because it keeps every value without loss; the Field order of the JSON object follows the
                  Entity's stored Field order, which differs from the Model's declaration order and is not part of the acceptance.
              - at: '2026-10-09T19:22:45Z'
                event: done
                note: 'Verified and kept the framework''s serialization of results, adding no code: observed on the probe that an Entity appears as a JSON object with every Field, a list as an array, a count and a total
                  as numbers and a missing record as null with status 200. Observed with a Position holding exact decimals (0.10, -12.340, 1.1000000000000000000001, 1E+3) and an aware datetime with a 3:30 offset: every
                  value on the wire is textually equal to the Model''s own JSON conversion, and the wire text rebuilds an equal Entity through the Model''s JSON construction.'
        P4-G5:
          id: P4-G5
          title: Error Mapping
          description: The mapping of every error an Endpoint returns to its HTTP form, part of serving every Endpoint.
          area: 'Serving: the mapping of errors to HTTP'
          does: Every client reads every Group's errors the same way and receives the error's class unchanged.
          constraints: []
          task_count: 1
          tasks:
            P4-G5-T1:
              id: P4-G5-T1
              source_id: '016'
              title: Return every error as Problem Details
              description: 'Provide the error mapping: every error an Endpoint returns is sent as RFC 9457 Problem Details with the error''s class name as its type and the status the API Preferences'' error
                table sets for it; an error the table does not name uses the generic server-error status. The mapping adds no retry, recovery or other behaviour.'
              reason: Every client must read the errors of every Group the same way.
              inputs:
              - Error table of the API Preferences
              - Published error group
              skills:
              - fastapi
              expected_result: A uniform error response for the whole API.
              depends_on:
              - P3-G4-T3
              - P4-G3-T1
              constraints: []
              acceptance: An error from an Action reaches the client as Problem Details with its class name as type and the status the table sets; an error the table does not name returns the generic server-error
                status; no retry or recovery occurs and a successful result is unaffected.
              status: done
              log:
              - at: '2026-10-09T19:21:37Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:22:45Z'
                event: decision
                note: A malformed request (a body or path the framework refuses) is sent as Problem Details of type RequestValidationError with status 422, and an error outside the Database errors gets the generic server-error
                  status with a fixed neutral detail and its class name as type, because the Preferences' table names only Database errors; the detail of a malformed request names locations and messages and never the
                  input values.
              - at: '2026-10-09T19:22:45Z'
                event: done
                note: 'Wrote the error mapping unit and registered it in Bootstrap: Database errors are sent as application/problem+json with the class name as type, the table status (invalid input 422, inactive instance
                  and connection failure 503, execution, declaration mismatch and configuration 500), a status phrase as title and the error''s message as detail; any other error returns 500. Observed on the probe: unknown
                  field gave InvalidInputError 422, a referenced delete gave ExecutionError 500, a bad path id gave RequestValidationError 422, an unexpected KeyError gave type KeyError 500 with a neutral detail; successful
                  results (including null) were unaffected and nothing is retried.'
        P4-G6:
          id: P4-G6
          title: Entity Adapters
          description: One standalone Adapter for every Entity Child Service that Logic presents, each serving the Actions of its Child Service as Endpoints under the rules of API and Entity Group. The Target
            defines no Behaviour specific to any single Entity, so no Adapter adds, omits or alters an Endpoint.
          area: 'Entity Group: the Adapter of every Entity'
          does: Every Entity has exactly one Adapter that serves every Action of its Child Service, in step with Logic's Entity Service.
          constraints: []
          task_count: 15
          tasks:
            P4-G6-T1:
              id: P4-G6-T1
              source_id: '016'
              title: Provide the User Adapter
              description: Provide the Adapter bound permanently to the User Entity, serving one Endpoint for every Action of its Child Service.
              reason: Clients must be able to operate on User records through the API without naming the Entity in a request.
              inputs:
              - The User Child Service published through the Logic Interface
              - API Endpoint rules
              skills:
              - fastapi
              expected_result: The User Adapter with its Endpoints.
              depends_on:
              - P3-G5-T1
              - P4-G1-T1
              - P4-G3-T1
              - P4-G4-T1
              - P4-G4-T2
              - P4-G4-T3
              - P4-G4-T4
              constraints: []
              acceptance: The Adapter serves exactly one Endpoint for every Action of the User Child Service and none for anything else; each Endpoint's identity, Parameter placement and Handler follow the
                API rules; calling an Endpoint gives what calling its Action gives, and its errors are the Action's errors; a request cannot supply another Entity; the Adapter stands entirely on its own, sharing
                nothing with another Adapter.
              status: done
              log:
              - at: '2026-10-09T19:23:13Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-09T19:24:55Z'
                event: decision
                note: 'Parameter types are taken from what the source''s Operations accept, because the Actions'' signatures are typed as Any: an Entity instance is a JSON object, filters and orders are lists of their
                  objects, combination and instance travel by name, limit is an integer, id is an integer in the path and a field is a Field name; each Adapter lists every Parameter in the Action''s order with the Action''s
                  requirement and defaults.'
              - at: '2026-10-09T19:24:55Z'
                event: decision
                note: The Adapter segment is the Entity name in snake case, the tag of an Adapter is the Group name, a middle dot and the Entity name, the route functions are named like the operations, and every request-body
                  Parameter is declared as an embedded body member so that a body with one or several Parameters has the same shape.
              - at: '2026-10-09T19:24:55Z'
                event: decision
                note: The Adapters are written out by a generator that lives outside the Component, from Logic's Action list and the verb table, placement rule and Parameter forms of the Preferences, so that each of
                  the 15 units is explicit and the units share nothing.
              - at: '2026-10-09T19:24:55Z'
                event: done
                note: 'Wrote the User Adapter: one router with the segment user and one explicitly written route for each of the 12 Actions of the User Child Service (add POST, update PUT, list POST, get_by_id GET with
                  the id in the path, delete DELETE, enable and disable PATCH, count, sum, min and max POST, truncate DELETE), each a plain function that calls its Action on the one Child Service and returns the result.
