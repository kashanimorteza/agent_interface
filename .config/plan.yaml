                - at: "2026-10-06T21:53:29Z"
                  execution: "019"
                  transition: "claimed -> done"
                  note: "Provided the Adapter for the User Entity: it is bound to that Entity, serves one Endpoint for each of the 12 Actions of its Child Service, and is listed in the Entity Group. This Task also added the shared result serialization every Adapter's Handlers use."
                  locations:
                    - "api/api/groups/entity/user.py"
                    - "api/api/groups/entity/__init__.py"
                    - "api/api/conversion.py"
                  observed: "In a throwaway copy with real prepared storage, 27 live observations held through the Endpoints: list, get_by_id (with the Instance in the query), add (generated id returned), update with the stored id (replaced and persisted; a missing id returned null), enable and disable, count, sum, min, max, delete (final Entity returned, a missing id null), the Filter, Order, limit, and combination body, and a refused truncate of a table other Entities reference (500 Problem Details, nothing removed); errors were Problem Details with their class name and the table's status (unknown Instance, non-integer id, invalid Entity, missing body member, unknown field 422; a duplicate add 500); a rejected Entity's message did not repeat the submitted value; the Adapter holds exactly 12 routes; structure observations (Handler is one return of its Action, derived Method and Path on each route, parameters equal the Action's) also held; ruff and ty reported no findings."
                  decisions:
                    - unset: "How a result is turned into JSON."
                      chosen: "Every route's return type carries one shared serializer: an Entity becomes its own JSON Object (exact decimal text, ISO datetimes, the Model's Field order), lists and Decimal and datetime values are converted, anything else is passed as is; the Handler returns the Action's result unchanged."
                      why: "The framework's default encoding turns a Decimal into a float or integer and loses exactness, while the Model defines the exact form; the return type is where the package serializes without the Handler touching the value."
                    - unset: "How a route function declares its Parameters."
                      chosen: "Each is an annotated parameter named like the Action's with its default, placed by the rule (path, query, or one JSON object in the body keyed by name), with the published-class and name-travelling forms attached as converters that run before the function."
                      why: "The Group Preferences ask for route functions whose parameters copy the Action's names, types, and defaults, placed by the placement rule."
                    - unset: "How an Adapter holds its Child Service."
                      chosen: "One module-level Child Service created when the Adapter loads, with the bound Entity published beside it."
                      why: "Creating a Child Service opens nothing and holds one Storage; one shared instance serves every request of the Adapter."
                    - unset: "Route function names."
                      chosen: "Each is named exactly like its operation, including names that coincide with built-in functions inside the module."
                      why: "The operation's name is the Endpoint's identity, and no built-in is used in these modules."
