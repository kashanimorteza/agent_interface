              acceptance: "Importing the Entity Service Interface exposes exactly one Child Service for every Entity of the Entity Collection, under the Entity's name, and the republished contracts; Base and the Storage gateway are not reachable by name; no published name collides with another; loading it opens no connection and creates no data or file."
