                  execution: "018"
                  transition: "todo -> claimed"
                  note: "Claimed after P4-G4-T1 was done. Scope: the cross-origin policy API's Preferences select, applied to every served Endpoint."
                - at: "2026-10-06T16:28:21Z"
                  execution: "018"
                  transition: "claimed -> done"
                  note: "Applied the cross-origin policy API's Preferences select (any origin, no credentials, any method, any header) to the whole application through one middleware."
                  locations:
                    - "api/api/bootstrap.py"
                  observed: "On the served schema address, a request carrying another origin received the any-origin allowance and no credentials allowance; a preflight request for DELETE with a custom header was answered 200 allowing that method and header; a request without an origin received no cross-origin header. The Entity Group does not exist yet (its Adapters are blocked, see 018-B1), so the same policy was observed on the Endpoints that are served now."
                  decisions:
