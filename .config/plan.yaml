        P5-G5:
          id: P5-G5
          title: Interaction Logic
          description: 'The behaviour behind the pages: the interface state and flows of listing, viewing, adding, editing, acting on a record, removing every record, choosing related records, and counting, each
            built on API Access and answering only for the interface.'
          area: 'Interaction Logic: interface state and flows'
          does: Every flow a Section offers has its state and its sequencing in one place behind the Components.
          constraints: []
          task_count: 7
          tasks:
            P5-G5-T1:
              id: P5-G5-T1
              source_id: '024'
              title: Provide the listing flow
              description: 'Provide the interface state and flow for listing records: the Filters, their combination, the order, the limit, the loading state and the result, requesting the list through API Access when
                the user applies their choices.'
              reason: Users must be able to find records by any Field in any order, and every Section lists in the same way.
              inputs:
              - Field descriptions
              - Query vocabulary
              - Endpoint calls
              skills: []
              expected_result: A listing flow usable for any Entity.
              depends_on:
              - P5-G10-T2
              - P5-G2-T8
              - P5-G2-T7
              constraints: []
              acceptance: Applying Filters, a combination, an order and a limit requests the list with exactly those choices and holds the result; the operators, combinations and directions offered are those of the
                query vocabulary; loading is reported while waiting; an error is held as returned; the flow works for any Entity it is given.
              status: done
              log:
              - at: '2026-10-11T18:23:16Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-11T18:25:35Z'
                event: decision
                note: The list is requested once when the flow starts, with no choices, and again each time the user applies choices or the owner asks for a refresh; the Task states only that it requests when the user applies, so showing the records on opening is Develop's own proposal. The operators, combinations and directions offered are the API's published query vocabulary without any restriction by Field kind, because the vocabulary states none.
              - at: '2026-10-11T18:25:35Z'
                event: done
                note: 'Added the listing flow (interaction/listing.ts): Filter, order and limit choices, their problems, the loading state and the result as interface data, requesting the list through the Endpoint call it is given. Observed in a real browser against a scratch copy of the API (Currency, 8 records): the opening request carried no choices and showed 8 rows; applying a Filter (code CONTAINS ''U''), an order (decimal digits, DESCENDING) and a limit of 3 sent exactly {filters:[code CONTAINS U], orders:[decimal_digits DESCENDING], limit:3} and held 3 rows; an incomplete Filter sent nothing and reported ''Enter a value.''; loading showed while waiting. An error held as returned is the failed state the flow gives the Section to present. Typecheck, lint and format check pass.'
              - at: '2026-10-11T18:25:47Z'
                event: note
                note: 'Error path observed afterwards in the same browser run: a Filter the API refuses (CONTAINS on the integer identity Field) was sent as chosen, and the flow held the API''s Problem Details unchanged (type InvalidInputError, status 422, detail ''A text operator needs a textual Field and a text value.'') for the Section to present.'
            P5-G5-T2:
              id: P5-G5-T2
              source_id: 019
              title: Provide the single-record flow
              description: Provide the interface state and flow for presenting one record retrieved by its id, including the case of there being no such record.
              reason: Users must be able to open one record and read it.
              inputs:
              - Endpoint calls
              skills: []
              expected_result: A single-record flow usable for any Entity.
              depends_on:
              - P5-G2-T7
              constraints: []
              acceptance: Given an id it requests that record and holds it; loading is reported while waiting; an unknown id is held as the absence of a record; an error is held as returned.
              status: done
              log:
              - at: '2026-10-11T14:59:14Z'
                event: claimed
                note: "Claimed before changing its result."
              - at: '2026-10-11T15:04:25Z'
                event: note
                note: "Resumed by Develop Entry 023 after Entries 021 and 022 were stopped; the claim of Entry 021 stands."
              - at: '2026-10-11T15:04:25Z'
                event: decision
                note: "The flow receives the Entity's get call and Field descriptions as arguments, so it works for any Entity and contains no Entity name; the state it holds is idle, loading, loaded (as interface data), absent or failed; an answer arriving for an earlier id is dropped; a record with a Field that is not described is held as an untranslatable failure rather than guessed. The Field descriptions come from the blocked Task P5-G2-T3 when a Section is built."
              - at: '2026-10-11T15:04:25Z'
                event: done
                note: "Added the single-record flow to Interaction Logic (a reusable load-by-key helper and the record flow built on it). Observed against a running API through the generated calls with 7 checks: loading is held while waiting; an id gives the record as interface data; an unknown id is held as absence; no id requests nothing; an unreachable API and an undescribed Field are held as failures; with two quick requests the record shown belongs to the latest id."
            P5-G5-T3:
              id: P5-G5-T3
              source_id: '024'
              title: Provide the record form flow
              description: 'Provide the interface state and flow of the record form: its entered values, interaction-level checks of requirement taken from the Field descriptions, the exclusion of immutable and generated
                Fields from what is entered, the value of a related Field taken from the related record choice, and submission as an add or as an update of an existing record.'
              reason: Users must be able to add a record and edit an existing one, and both share one flow.
              inputs:
              - Field descriptions
              - Endpoint calls
              - Related record choices
              skills: []
              expected_result: A record form flow usable for any Entity.
              depends_on:
              - P5-G10-T2
              - P5-G2-T7
              - P5-G5-T7
              constraints: []
              acceptance: In add mode it submits the entered record as an add and in edit mode as an update of that record; a required Field left empty is reported before anything is submitted; an immutable or generated
                Field is never submitted as entered; a related Field is submitted with the value of the record chosen for it; the API's result or error is held as returned; no application rule is decided by the flow.
              status: done
              log:
              - at: '2026-10-11T18:27:55Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-11T18:31:09Z'
                event: decision
                note: 'What a form submits: an optional Field left empty is submitted as no value (null); an entry left exactly as the record holds it is passed through unchecked, so a record whose stored value is an empty text (as the initial User record holds for its credentials) can still be edited; an empty entry for a sensitive Field keeps the value the record holds; when updating, the record''s identity and every other Field a user cannot enter are carried as the record holds them, because the API''s update takes the stored id and stores the whole record. None of this was stated in Preferences or the Task.'
              - at: '2026-10-11T18:31:09Z'
                event: decision
                note: The record form Component now renders a related Field through the related record choice (a loading note while the records load, the failure as returned, or the choice), taking the choices the related record choices flow supplies; the Task requires the related value to come from that choice and no earlier Task connected the two.
              - at: '2026-10-11T18:31:09Z'
                event: done
                note: 'Added the record form flow (interaction/form.ts: recordFromEntries and useRecordForm), moved the one rule for which Fields can be entered to interaction/fields.ts for the form and the flow to share, and connected related choices to the record form (view/record-form.tsx). Observed in a real browser against a scratch copy of the API: adding a Broker with required Fields empty sent nothing and reported ''Enter a value.'' for both; the completed add sent {name, user_id (the chosen User''s id), is_active, description:null} with no id and held the stored record; editing it showed the id as shown-only and sent {id, name, user_id, is_active, description} as an update; a refused add (duplicate name) held the API''s Problem Details unchanged and kept the entries; for a User form whose password was described as sensitive, the input was a password input, the stored secret appeared nowhere on the page, and submitting untouched sent the held value. No application rule is decided by the flow. Typecheck, lint and format check pass.'
            P5-G5-T4:
              id: P5-G5-T4
              source_id: 019
              title: Provide the record action flow
              description: Provide the interface state and flow for enabling, disabling and deleting one record, asking for confirmation before a delete and refreshing what the user sees after an action succeeds.
              reason: Users must be able to switch a record on or off and to remove it.
              inputs:
              - Endpoint calls
              skills: []
              expected_result: A record action flow usable for any Entity.
              depends_on:
              - P5-G2-T7
              constraints: []
              acceptance: Each of the three actions calls only its own Endpoint for the chosen record; a delete is carried out only after confirmation; after success the user sees the record in its new state
                or no longer; an error is held as returned and nothing is changed in what the user sees.
              status: done
              log:
              - at: '2026-10-11T14:59:14Z'
                event: claimed
                note: "Claimed before changing its result."
              - at: '2026-10-11T15:04:25Z'
                event: decision
                note: "The flow receives the three calls and the Field descriptions as arguments (no Entity name inside); a delete first reaches a confirming state and sends nothing until confirmed; after a success the owner is told so it can refresh and the flow holds the record in its new state (or its absence after a delete); a failure is held as returned and does not tell the owner to refresh. The Task names enable, disable and delete only, so truncate (an Endpoint every Adapter offers) is not part of this flow; the Section Tasks will need an action for it, which no planned Task provides a flow for (reported)."
              - at: '2026-10-11T15:04:25Z'
                event: done
                note: "Added the record action flow to Interaction Logic. Observed against a running API with spies on each call (9 checks): disable and enable each call only their own Endpoint for the chosen record and give the record in its new state; the owner is told after each success; a delete waits for confirmation and sends nothing, cancelling leaves the record unchanged, confirming deletes it and the API no longer has it; an unreachable API is held as a failure with the owner not told to refresh, and a failure can be dismissed. Test data created in the scratch copy was removed."
            P5-G5-T5:
              id: P5-G5-T5
              source_id: '024'
              title: Provide the count and aggregate flow
              description: Provide the interface state and flow for asking for a count or an aggregate, with the Field and Filters the operation takes, wherever the Adapter offers it, and holding the single result.
              reason: Users must be able to ask how many records match and to read an aggregate of a Field.
              inputs:
              - Field descriptions
              - Query vocabulary
              - Endpoint calls
              skills: []
              expected_result: A count and aggregate flow usable for any Entity.
              depends_on:
              - P5-G10-T2
              - P5-G2-T8
              - P5-G2-T7
              constraints: []
              acceptance: Choosing an operation and its arguments requests exactly that operation and holds its single result; loading is reported while waiting; an error is held as returned; an operation the Adapter
                does not offer cannot be chosen.
              status: done
              log:
              - at: '2026-10-11T18:31:49Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-11T18:32:31Z'
                event: decision
                note: 'Which Fields an operation is offered for: a total for numeric Fields (integer, float, decimal) and a smallest or largest value for every Field except a boolean, as the API itself states when it refuses others (''sum needs a numeric Field'', ''min needs a comparable Field''); a sensitive Field is never offered because its value would be shown. The API''s documentation lists no such restriction, so this follows its observed refusals.'
              - at: '2026-10-11T18:32:31Z'
                event: done
                note: 'Extended interaction/aggregate.ts with the count and aggregate flow (operationsOf, useAggregate) and gave the aggregate panel a problems input forwarded to its Filter editor so an incomplete Filter is reported there. Observed in a real browser against a scratch copy of the API (Account): the operations offered were exactly those of the calls given (count, sum, min, max; without a max call, max is not offered); count sent {} and showed 1; sum sent {field: ''instance_id''} and showed the single result; with username described as sensitive it was not among min''s Fields; an incomplete Filter sent nothing and reported ''Enter a value.''. Loading is held while waiting and an error as returned. Typecheck, lint and format check pass.'
            P5-G5-T6:
              id: P5-G5-T6
              source_id: '024'
              title: Provide the remove-all flow
              description: Provide the interface state and flow for removing every record of an Entity, asking the user to confirm, with a question that names what will be removed, before anything is requested, and
                refreshing what the user sees after it succeeds.
              reason: Every Endpoint of an Adapter must have a user action, the Endpoint that removes every record is not covered by the record action flow, and removing everything must never happen by a single accidental
                action.
              inputs:
              - Endpoint calls
              - Confirmation
              skills: []
              expected_result: A remove-all flow usable for any Entity.
              depends_on:
              - P5-G2-T7
              - P5-G4-T7
              constraints: []
              acceptance: The request to remove all records is made only after the user confirms and only to the Endpoint of the chosen Entity that removes every record; cancelling changes nothing; after success the
                user sees no records; a failed request leaves the records the user sees as they were and holds the error as returned.
              status: done
              log:
              - at: '2026-10-11T17:03:45Z'
                event: claimed
                note: "Claimed before changing its result."
              - at: '2026-10-11T17:08:37Z'
                event: done
                note: "Added the remove-all flow to Interaction Logic: asking first with a question that names the Entity, calling only the Endpoint that removes every record after the user confirms, ignoring a second confirmation while the request is in flight, telling the owner to refresh after success, and holding a failure exactly as the API returned it without telling the owner to refresh. Observed in a DOM environment against a running API copy with 12 checks: nothing is sent by a request, a bare confirmation or a cancel; one confirmation sends exactly one request; the Action Entity then holds no records (it held one); an invalid Instance gives a held 422 InvalidInputError with its type and status unchanged and no refresh; two confirmations while working send one request; a Broker removal, which accounts reference, came back as the API's 500 Problem and was held as returned. Type check, lint and format check report nothing. The user-facing confirmation is the existing confirmation Component, composed by each Section."
            P5-G5-T7:
