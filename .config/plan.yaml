        P2-G7:
          id: P2-G7
          title: Engine implementations
          description: One complete Engine implementation for each Engine used by at least one active Instance, serving every Entity Operation, the Command Operation, and the storage capabilities the Setup Operations require, and returning raw results.
          area: Engine implementations
          does: Every active Instance is served by a complete Engine implementation that preserves the published request, result, error, and atomicity meaning.
          constraints: []
          task_count: 19
          tasks:
            P2-G7-T01:
              id: P2-G7-T01
              source_id: '005'
              title: Provide one implementation per Engine in use
              description: Provide an Engine implementation for every Engine that at least one active Instance uses and for no other Engine, shared by all Instances of that Engine.
              reason: An Engine nobody uses must leave nothing behind, and an Engine in use must always be served.
              inputs:
              - Instances section
              - Instance and default integrity
              skills:
              - sqlmodel
              expected_result: Engine implementations exist for exactly the Engines used by active Instances.
              depends_on:
              - P2-G3-T02
              - P2-G4-T02
              constraints: []
              acceptance: The set of Engine implementations equals the set of Engines used by at least one active Instance, and an Engine used only by inactive Instances has none.
              status: done
              log:
              - at: '2026-10-08T01:06:18Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:06:56Z'
                transition: claimed -> done
                note: Created the Engine unit for the Engine used by the active Instance (sqlite, a file-backed Engine requiring a database value) and none for the Engine used only by the inactive Instance; configuration loading now refuses an active Instance whose Engine has no unit, a missing required connection value, or an escaping storage location.
                evidence:
                  locations:
                  - database/database/engine/sqlite.py
                  - database/database/core/configuration.py
                  observed: The Engine package holds exactly one unit, sqlite; activating the postgresql Instance, or pointing the sqlite Instance at it, was refused at load because that Engine has no implementation; an empty database value and an escaping location were refused; a made-up Engine key and a path-like Engine key were refused; no storage file or directory was created by loading.
                decisions:
                - unset: How a unit declares the connection values it requires and its storage kind
                  chosen: Two module constants, STORAGE and REQUIRED, read by Core when resolving a connection
                  why: Only the Engine knows whether its storage is a file and which connection values it needs, and Core must hold no Engine-specific behaviour.
            P2-G7-T02:
              id: P2-G7-T02
              source_id: '005'
              title: Open a connection for an Instance
              description: Open, for the Instance Core supplies, a connection to its storage using its Engine's connection requirements, and report a failure to connect as a connection failure that carries no connection value or credential.
              reason: Every Operation needs a connection that is opened from configuration only.
              inputs:
              - Resolved Instance connection
              - Database storage area
              skills:
              - sqlmodel
              expected_result: A valid Instance connects, and an Instance that cannot be reached fails as a connection failure.
              depends_on:
              - P2-G7-T01
              - P2-G3-T03
              - P2-G2-T01
              constraints: []
              acceptance: A valid Instance connects, an unreachable Instance fails as a connection failure whose text carries no connection value or credential, and a file-backed Instance keeps its storage inside the Database storage area.
              status: done
              log:
              - at: '2026-10-08T01:07:22Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:08:48Z'
                transition: claimed -> done
                note: 'Added connection handling to the Engine unit: a unit of work opens a connection to the Instance''s storage (creating the storage directory on first use), enables foreign keys, registers an exact decimal comparison, runs inside an explicit transaction that commits only when the work completes, and reports a failure to connect as a connection failure that carries no connection value.'
                evidence:
                  locations:
                  - database/database/engine/sqlite.py
                  observed: A valid location connected and its storage directory was created inside the given area; a location that could not be prepared raised ConnectionFailureError with text naming only the Instance key; a failing statement inside the unit of work rolled back and surfaced as ExecutionError.
                decisions:
                - unset: How atomic units of work are made on this Engine
                  chosen: Disable the driver's implicit transaction handling and begin each unit of work explicitly
                  why: The driver's default leaves schema statements outside transactions, and Database needs every change, including table creation, to be all-or-nothing.
                - unset: How exact decimal comparison works on an Engine that stores decimals as text
                  chosen: Register a decimal collation on every connection and apply it to decimal Fields in conditions and orders
                  why: Model stores a decimal as its exact text, so plain text comparison would order and match numeric values wrongly.
                - unset: How an Engine error is reported
                  chosen: The Engine's own message about the violated constraint or syntax, without statement text or parameters
                  why: Failures must be actionable without exposing values.
