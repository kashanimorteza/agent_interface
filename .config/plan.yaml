        P4-G4:
          id: "P4-G4"
          title: "Serving"
          description: "API as one running boundary: it starts from its runtime Configuration, registers every listed Group beneath its own URL segment, serves nothing of its own, publishes interactive documentation, applies its cross-origin policy, and is documented."
          area: "Bootstrap and Groups"
          does: "API runs as one boundary that serves every listed Group beneath its segment and nothing else, with documentation for clients and operators."
          constraints: []
          task_count: 6
          tasks:
            P4-G4-T1:
              id: "P4-G4-T1"
              source_id: "017"
              title: "Start API from its runtime Configuration"
              description: "Create and start the one running API from the runtime Configuration alone: it binds to the configured host and port with the configured number of workers, defines no capability of its own, and reads no Definition or Preferences file while running."
              reason: "One narrow entry point keeps execution separate from generation sources and from the capabilities it serves."
              inputs:
                - "The runtime Configuration"
              skills:
                - "fastapi"
              expected_result: "API starts and serves from its runtime Configuration."
              depends_on:
                - "P4-G1-T1"
                - "P4-G2-T3"
              constraints: []
              acceptance: "Starting API with the runtime Configuration serves at the configured address with the configured workers; changing a Configuration value and starting again changes that behaviour without any source change; API starts and serves with no Definition or Preferences file available."
              status: "done"
              log:
                - at: "2026-10-06T16:26:45Z"
                  execution: "018"
                  transition: "todo -> claimed"
                  note: "Claimed after P4-G1-T1 and P4-G2-T3 were done. Scope: the Bootstrap that creates and starts API from the runtime Configuration alone."
                - at: "2026-10-06T16:27:47Z"
                  execution: "018"
                  transition: "claimed -> done"
                  note: "Created the Bootstrap that reads the runtime Configuration, creates the one API from it, and starts serving at the configured host and port with the configured number of workers; it defines no capability and reads no Definition or Preferences file."
                  locations:
                    - "api/api/bootstrap.py"
                    - "api/pyproject.toml (start command)"
                  observed: "Started from the real Configuration, API answered 200 at both configured documentation addresses and at the interactive schema address under the key, and 404 at the bare address outside the key. In a temporary copy of the Component that holds no Definition or Preferences file, changing the port and the worker count in the Configuration alone and starting again served at the new port (the old port refused) with one worker in the main process and with three worker processes respectively."
                  decisions:
                    - unset: "How the Bootstrap starts serving, and how many entry points exist."
                      chosen: "One start function that runs the server on the importable application with the Configuration's host, port, and workers, exposed as the project's start command and runnable as a module; no second entry point."
                      why: "A multi-worker server needs an importable application, and Preferences name Bootstrap as the single runtime entry point."
                    - unset: "Where the Bootstrap places the interactive documentation and the schema address."
                      chosen: "The documentation and the schema address are placed from the Configuration's own addresses (the path of the documentation addresses and of the Base URL), never rederived."
                      why: "Bootstrap reads every value only from the Configuration, and its documentation addresses already include the key."
            P4-G4-T2:
              id: "P4-G4-T2"
              source_id: "017"
              title: "Register every listed Group beneath its segment"
              description: "Register every Group API's Preferences list beneath the URL segment derived from its configured name after the Base URL, serving exactly that Group's own Endpoints unchanged, and register nothing else; API adds no Endpoint, wrapper, or behaviour of its own."
              reason: "Clients need one address for every capability area while each area keeps its own surface."
              inputs:
                - "The Group list of API's Preferences"
              skills:
                - "fastapi"
              expected_result: "Every listed Group is served beneath its own segment and API serves no Endpoint of its own."
              depends_on:
                - "P4-G4-T1"
                - "P4-G3-T16"
              constraints: []
              acceptance: "Each Endpoint of the Entity Group answers at the Base URL, then the Group segment, then the Adapter segment, then its Endpoint path; the Group list and the registrations match exactly; no other Endpoint is served besides the interactive documentation."
              status: "todo"
            P4-G4-T3:
              id: "P4-G4-T3"
              source_id: "017"
              title: "Keep every public identity valid and unique"
              description: "Keep every Group segment, Adapter segment, and the combination of Method and Path of every Endpoint valid and unique across API, and stop generation with a clear error naming the affected item when one is invalid or collides, without renaming or repairing it and without publishing a partial result."
              reason: "A client must find every Group and operation at one unambiguous address."
              inputs: []
              skills: []
              expected_result: "Generation refuses invalid or colliding public identities and otherwise publishes only unique ones."
              depends_on:
                - "P4-G4-T2"
              constraints: []
              acceptance: "Every segment and every Method-and-Path combination served is valid and unique; when an invalid or colliding identity is introduced, generation stops with a clear error that names it, nothing is renamed, and the previous valid output remains."
              status: "todo"
            P4-G4-T4:
              id: "P4-G4-T4"
              source_id: "017"
              title: "Serve interactive documentation of every Endpoint"
              description: "Enable the interactive documentation the API package offers, listing every served Endpoint with one section per Group and, within it, one section per Adapter holding all of that Adapter's Endpoints, and nothing the Groups do not serve."
              reason: "Every client can discover and try every Endpoint without reading source."
              inputs: []
