# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 34
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "The Model Component exists as an independent, reusable data-model layer that publishes every Target Entity with its complete Declaration, strict validation, lossless JSON conversion, and table-ready storage mapping, together with its own documentation."
      constraints: []
      task_count: 34
      groups:
        P1-G1:
          id: "P1-G1"
          title: "Shared Entity infrastructure"
          description: "Everything that serves all Entities rather than one: establishing the Component, the public Declaration and Foundation contracts, and the private validation, Field Type representation, and storage behaviour behind them. Every Entity depends on this work and this work depends on no Entity."
          area: "Shared Entity infrastructure"
          does: "Every Entity can be built on one shared set of contracts and behaviours for declaration, validation, conversion, and storage."
          constraints: []
          task_count: 12
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "002"
              title: "Establish the Model Component as a self-contained reusable package"
              description: "Create the Model Component as an independent reusable library whose language, package management, modeling package, and quality tooling are resolved from their owning sources, with its dependencies recorded so its environment is reproducible."
              reason: "Every other Task in the phase builds inside this Component, and later Components consume it as a project-internal dependency."
              inputs:
                - "Model Component Preferences"
                - "Development shared defaults for language and package management"
              skills:
                - "sqlmodel"
              expected_result: "A Model Component that can be set up in an isolated environment from its recorded dependencies and loaded without error, containing no Entity yet."
              depends_on: []
              constraints: []
              acceptance: "Setting up the Component from a clean state reproduces its environment from the recorded dependencies, and the Component loads without error and without side effect."
              status: "blocked"
              blocker: "B-003-1"
              log:
                - at: "2026-10-07T18:42:44Z"
                  status: "blocked"
                  event: "blocked"
                  note: "Cannot establish the reproducible environment: the package distribution host cannot be reached, so no dependency can be resolved, locked, or installed. No Component packaging was created."
                  evidence:
                    - "The package index host resolves and answers, but the distribution host files.pythonhosted.org does not resolve (name lookup fails with a temporary-failure result) on repeated attempts across several minutes."
                    - "Resolving the modeling library through the selected package manager fails while fetching pydantic wheel metadata from that host after three retries (observed at 18:32 and again at 18:42 UTC)."
                    - "No lock or environment could be produced; nothing for this Task was written."
            P1-G1-T2:
              id: "P1-G1-T2"
              source_id: "002"
              title: "Realize the Field Declaration contract"
              description: "Provide the public, immutable Field Declaration record with the closed set of Field Types, the Value Generation kinds, the recognized Sensitivity Markers, and Field constraints, enforcing its structural rules at creation so contradictory input fails instead of being repaired."
              reason: "Entity Declarations and every Entity Field are built from this record, so Field meaning is written once."
              inputs:
                - "Model Definition's Field Declaration contract"
                - "Sensitivity markers and Field defaults in Model Preferences"
              skills:
                - "sqlmodel"
              expected_result: "A Field Declaration that records a Field's name, description, Type, presence meaning, Default Value, sensitivity, immutability, constraints, and Value Generation, and distinguishes an absent Default Value from an explicit null default."
              depends_on: []
              constraints: []
              acceptance: "A Field Declaration is created for each valid combination and cannot be changed afterwards; an unknown Type, a Default Value combined with Value Generation, a default that mismatches the Field's Type or nullability, a size constraint on a non-string Field, Auto Increment on a non-integer Field, and a Generated Identifier on a Field that is neither uuid nor string are each refused at creation."
              status: "done"
              log:
                - at: "2026-10-07T18:39:49Z"
                  status: "claimed"
                  event: "claimed"
                  note: "Claimed before changing its result; no dependencies."
                - at: "2026-10-07T18:40:34Z"
                  status: "done"
                  event: "completed"
                  note: "Field Declaration contract generated as an immutable record with the closed Field Type, Value Generation, and Sensitivity sets, Field constraints, an explicit marker for an absent Default Value, and creation-time structural checks."
                  evidence:
                    - "Generated the public Declaration contract (Field part) under the Core area of the Model Component, plus the language-required package marker for Core."
                    - "Observed with a throwaway script kept outside the Component: valid combinations are created and are immutable; absent default and explicit null default are distinct values; an unknown Type, a default with Value Generation, a default mismatching Type or nullability (including bool for integer, naive datetime, non-finite float, over-long string), a size constraint on a non-string, Auto Increment on a non-integer, and a Generated Identifier on a Field that is neither uuid nor string are each refused at creation."
                  decisions:
                    - unset: "Public names for the Field Declaration record, the closed Field Type, Value Generation and Sensitivity sets, the constraints record, the absent-default marker, and the creation error; Model Preferences name only the Declaration and Foundation symbols."
                      chosen: "FieldDeclaration, FieldType, ValueGeneration, Sensitivity, FieldConstraints, NO_DEFAULT, DeclarationError, following the selected language's naming rules (PascalCase classes, snake_case members)."
                      why: "Development precedence: no Component Preference or Development Default exists, so the executor's own proposal applies."
                    - unset: "How a Field Declaration represents an absent Default Value as distinct from an explicit null default."
                      chosen: "A dedicated singleton marker, NO_DEFAULT, as the default of the default member."
                      why: "None must remain available as the explicit null default."
                    - unset: "Whether a Field description may be absent when the Target states no purpose for it (the identity Field has none)."
                      chosen: "The description member accepts a string or None; None means the Target states none."
                      why: "Model must not invent Target meaning, and Model Preferences supply no description default."
            P1-G1-T3:
              id: "P1-G1-T3"
              source_id: "002"
              title: "Realize the Entity Declaration contract"
              description: "Provide the public, immutable Entity Declaration record holding an Entity's name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, with ordered immutable collections and structural checks at creation."
              reason: "Entity Metadata lives outside the Fields, and each Entity publishes one complete Declaration."
              inputs:
                - "Field Declaration contract"
                - "Model Definition's Entity Declaration contract"
              skills:
                - "sqlmodel"
              expected_result: "An Entity Declaration that exposes the Entity's name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes."
              depends_on:
                - "P1-G1-T2"
              constraints: []
              acceptance: "An Entity Declaration is created from valid input and exposes every listed property in order; duplicate Field names, a Primary Key other than the identity Field, a Relation or constraint naming an unknown Field, a Field with more than one Relation, and empty or duplicated Uniqueness Constraints or Indexes are each refused at creation."
              status: "done"
              log:
                - at: "2026-10-07T18:40:34Z"
                  status: "claimed"
                  event: "claimed"
                  note: "Claimed before changing its result; its dependency P1-G1-T2 is done."
                - at: "2026-10-07T18:42:44Z"
                  status: "done"
                  event: "completed"
                  note: "Entity Declaration contract generated in the same public Declaration contract: an immutable Entity record with ordered immutable Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, and creation-time structural checks."
                  evidence:
                    - "Extended the public Declaration contract under the Core area of the Model Component; Relation and Declaration records added, with the physical member names Model Preferences select (including unique_constraints for the Uniqueness Constraints)."
                    - "Observed with a throwaway script kept outside the Component: a valid Declaration exposes every property in order with tuple collections and cannot be changed; duplicate Field names, a Primary Key other than id, a missing, nullable, or mutable id, a missing or non-boolean or immutable is_active, a Relation naming an unknown Field, two Relations on one Field, and empty, unknown, repeated, or duplicated Uniqueness Constraints and Indexes are each refused at creation. The Field Declaration observations were repeated after the change and still hold."
                    - "Source wrapped by hand to the formatter's default width because the formatter is not installed in this environment; it was not run."
                  decisions:
                    - unset: "Public names for the Entity Declaration record and the Relation record; Model Preferences name only the Declaration symbol and the member names."
                      chosen: "Declaration (the symbol Model Preferences set) and Relation, with members exactly as Model Preferences list them."
                      why: "Development precedence: Component Preference first, then the executor's own proposal for the unset Relation record name."
                    - unset: "The representation of a Uniqueness Constraint or Index entry and how a Declaration reports a structural failure."
                      chosen: "Each entry is an ordered tuple of Field names (a bare string is refused so a name is never split into characters); the first structural failure raises the Declaration error naming the Entity and the offending item."
                      why: "Model Definition fixes the rules but not the representation; one error type keeps failures explicit and non-partial."
                    - unset: "Whether an Entity description may be empty."
                      chosen: "An Entity description must be a non-empty string."
                      why: "Model Definition requires every Entity to preserve its description, and the Target gives one for each."
            P1-G1-T4:
              id: "P1-G1-T4"
              source_id: "002"
              title: "Realize the Field Type representation"
              description: "Provide the private mapping from each Field Type in the closed set to its in-language value category and its JSON representation, requiring floats to be finite and datetimes to be timezone-aware, and stopping on an unknown Type instead of guessing."
              reason: "Validation, conversion, and storage all need one agreed meaning for each Field Type."
              inputs:
                - "Field Type table of the selected language profile in Model Preferences"
                - "Field Declaration contract"
              skills:
                - "sqlmodel"
              expected_result: "Every Field Type in the closed set resolves to exactly one in-language category and one JSON form."
              depends_on:
                - "P1-G1-T1"
                - "P1-G1-T2"
              constraints: []
              acceptance: "Each Field Type resolves to exactly one in-language category and one JSON form; a non-finite float and a timezone-naive datetime are rejected; an unknown Type stops with a report and no guessed substitute."
              status: "todo"
            P1-G1-T5:
              id: "P1-G1-T5"
              source_id: "002"
              title: "Realize strict Entity construction"
              description: "Provide the private shared behaviour by which direct construction accepts only declared Fields, applies no implicit coercion, validates every default and the whole Entity before any value is set, treats explicit false, zero, empty string, and null as supplied values, keeps an omitted Auto Increment Field pending without making it nullable, and refuses a caller-supplied Auto Increment value."
              reason: "Every Entity must enforce its Field contracts identically at construction so that no package convention changes data."
              inputs:
                - "Entity Declaration contract"
                - "Field Type representation"
              skills:
                - "sqlmodel"
              expected_result: "Constructing an Entity validates the whole Entity first and yields it only when every Field satisfies its contract."
              depends_on:
                - "P1-G1-T3"
                - "P1-G1-T4"
              constraints: []
              acceptance: "Valid values construct an Entity; an undeclared Field, a value of the wrong Type, a missing Required Field, a violated constraint, and a caller-supplied Auto Increment value each refuse construction; a permitted explicit false, zero, empty string, or null is kept as supplied; an omitted Auto Increment Field stays pending."
              status: "todo"
            P1-G1-T6:
              id: "P1-G1-T6"
              source_id: "002"
              title: "Realize Entity assignment and identity rules"
              description: "Provide the private shared behaviour by which assignment to a mutable Field revalidates the whole Entity with the new value before applying it, assignment to an immutable Field or a caller assignment of an Auto Increment Field is refused, and a mutable Entity is not hashable."
              reason: "Mutation must obey the same Field contracts as construction, and a failed change must never leave an Entity half-updated."
              inputs:
                - "Strict Entity construction"
              skills:
                - "sqlmodel"
              expected_result: "Assignment either fully succeeds or leaves the Entity unchanged."
              depends_on:
                - "P1-G1-T5"
              constraints: []
              acceptance: "A valid assignment to a mutable Field takes effect; an invalid assignment is refused and the prior value remains; assigning an immutable Field is refused; hashing an Entity is refused."
              status: "todo"
            P1-G1-T7:
              id: "P1-G1-T7"
              source_id: "002"
              title: "Keep Sensitivity-marked values out of diagnostics"
              description: "Provide the private shared behaviour by which the input of any Sensitivity-marked Field is replaced in every validation message and the original message holding the value is never chained or exposed, while the actual value stays unchanged in Entity state."
              reason: "A marker records what a value means, and its only effect is that the value never leaks through diagnostics."
              inputs:
                - "Field Declaration contract's recognized Sensitivity Markers"
                - "Strict Entity construction"
              skills:
                - "sqlmodel"
              expected_result: "Validation failures on a marked Field reveal nothing about the offending value."
              depends_on:
                - "P1-G1-T2"
                - "P1-G1-T5"
              constraints: []
              acceptance: "When a marked Field receives an invalid value, no validation message and no chained cause contains that value; a valid marked value is stored and read back unchanged."
              status: "todo"
            P1-G1-T8:
              id: "P1-G1-T8"
              source_id: "002"
              title: "Refuse Entity definitions that diverge from their Declaration"
              description: "Provide the private shared behaviour that, when an Entity is defined, checks that its type name and table name equal the Entity's physical name and that its Fields are exactly the Declaration's Fields in the same order, failing loading on any mismatch."
              reason: "A single check at definition time keeps each Entity and its Declaration from drifting apart."
              inputs:
                - "Entity Declaration contract"
                - "Strict Entity construction"
              skills:
                - "sqlmodel"
              expected_result: "An Entity that does not match its Declaration cannot be loaded."
              depends_on:
                - "P1-G1-T3"
                - "P1-G1-T5"
              constraints: []
              acceptance: "An Entity defined with a different name, a missing Field, an extra Field, or reordered Fields fails to load; an Entity that matches its Declaration loads."
              status: "todo"
            P1-G1-T9:
              id: "P1-G1-T9"
              source_id: "002"
              title: "Realize the shared table metadata and constraint naming"
              description: "Provide the private shared table metadata in which the table form of every Entity is registered, and the single deterministic convention by which every primary key, foreign key, uniqueness constraint, and index is named."
              reason: "Storage consumers must reach exactly the Entities' tables through the Entities themselves, and constraint names must be stable and predictable."
              inputs:
                - "Constraint naming convention in Model Preferences"
              skills:
                - "sqlmodel"
              expected_result: "One shared table metadata that registers Entity tables and names every constraint and index by the Preference convention."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              acceptance: "Every registered Entity table appears in the shared metadata and no other table does; each primary key, foreign key, uniqueness constraint, and index receives its name from the Preference convention, and the same inputs always produce the same names."
              status: "todo"
            P1-G1-T10:
              id: "P1-G1-T10"
              source_id: "002"
              title: "Realize exact-value column storage"
              description: "Provide the private shared storage behaviour by which a decimal value is stored as its exact text and read back as a decimal, and a datetime value is stored in UTC and read back timezone-aware."
              reason: "Decimal precision and datetime offsets must survive storage exactly."
              inputs:
                - "Field Type representation"
                - "Shared table metadata"
              skills:
                - "sqlmodel"
              expected_result: "Decimal and datetime Fields keep their exact value through storage."
              depends_on:
                - "P1-G1-T4"
                - "P1-G1-T9"
              constraints: []
              acceptance: "A decimal value written to storage is read back as an equal decimal with every digit intact, and a datetime value is read back timezone-aware and equal to the value written."
              status: "todo"
            P1-G1-T11:
              id: "P1-G1-T11"
              source_id: "002"
              title: "Realize Entity-to-JSON conversion"
              description: "Provide the public shared Foundation capability that converts any Entity to JSON text with one root object whose keys are exactly the Entity's Field names in Declaration order, preserving declared Type semantics and distinguishing null, false, zero, and empty string."
              reason: "Consumers need one portable value representation of an Entity."
              inputs:
                - "Field Type representation"
                - "Strict Entity construction"
              skills:
                - "sqlmodel"
              expected_result: "Every Entity converts to standard-conformant JSON text with exact keys and values."
              depends_on:
                - "P1-G1-T4"
                - "P1-G1-T5"
              constraints: []
              acceptance: "The JSON text of an Entity parses as standard JSON with a single root object; its keys equal the Field names in Declaration order; decimal, datetime, date, time, and uuid values appear in their declared text forms; no key or nested Entity is added."
              status: "todo"
            P1-G1-T12:
              id: "P1-G1-T12"
              source_id: "002"
              title: "Realize Entity-from-JSON reconstruction"
              description: "Provide the public shared Foundation capability that reconstructs an Entity from JSON text, rejecting malformed text, a repeated key, a non-standard constant, and a root that is not one object, decoding the text forms of decimal, datetime, date, time, and uuid by each Field's Type, and then applying the same rules as direct construction."
              reason: "Lossless reconstruction completes the portable representation that conversion to JSON begins."
              inputs:
                - "Entity-to-JSON conversion"
                - "Field Type representation"
                - "Strict Entity construction"
              skills:
                - "sqlmodel"
              expected_result: "Every valid JSON text of an Entity rebuilds an equal Entity, and every invalid text is refused."
              depends_on:
                - "P1-G1-T4"
                - "P1-G1-T5"
                - "P1-G1-T11"
              constraints: []
              acceptance: "Text produced by the conversion rebuilds an equal Entity; malformed text, a repeated key, a non-standard constant, a non-object root, an undeclared key, a wrong value Type, and a missing required value are each refused."
              status: "todo"
        P1-G2:
          id: "P1-G2"
          title: "Target Entities"
          description: "One Task per Target domain concept, in Target order. Each Task realizes its concept as its own Entity unit with its Declaration, strict validation, JSON conversion, and table-ready storage mapping, preserving everything the Target declares for it and adding only the mandatory identity and activity Fields with their Preference defaults. A Task depends on the Entities its Relations point to."
          area: "Entity"
          does: "Every Target domain concept exists as exactly one complete, independently changeable Entity ready to be published."
          constraints: []
          task_count: 15
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "002"
              title: "Realize the User Entity"
              description: "Realize the Entity for the Target's User concept."
              reason: "The Target declares User as a persistent concept, so the Model must publish it as an Entity."
              inputs:
                - "Target definition of the User concept"
              skills:
                - "sqlmodel"
              expected_result: "A complete User Entity unit exposing its Declaration and the shared Foundation capabilities."
              depends_on:
                - "P1-G1-T6"
                - "P1-G1-T7"
                - "P1-G1-T8"
                - "P1-G1-T9"
                - "P1-G1-T10"
                - "P1-G1-T12"
              constraints: []
              acceptance: "The published Declaration of the User Entity matches the Target's definition of User in Fields, order, Types, nullability, defaults, and metadata; the Entity constructs from valid values, rejects an unknown Field, a wrong Type, and a missing required value, and returns an equal Entity after conversion to JSON text and back."
              status: "todo"
