        P3-G5:
          id: "P3-G5"
          title: "Entity Service Interface"
          description: "What Entity Service publishes to callers: the Child Services, the Entities they bind, and the Storage contracts and errors, in four groups."
          area: "Entity Service: Interface"
          does: "Entity Service publishes one exact Interface of four groups that lets a caller call Actions, build requests, read results, and catch errors without importing Model, Storage, or Database."
          constraints: []
          task_count: 6
          tasks:
            P3-G5-T1:
              id: "P3-G5-T1"
              source_id: "014"
              title: "Refuse invalid or colliding Entity Service names"
              description: "Resolve the configured Entity Service name, the Base name, the four group names, and every Child Service name derived from the configured naming, and refuse any that is not valid for the selected language or collides within its group, reporting a clear configuration error and never inventing a suffix, number, or rename; a Child Service and its Entity share one name by design."
              reason: "Every Entity needs an unambiguous realization that the selected language accepts."
              inputs:
                - "The configured Entity Service names and naming"
                - "The Child Services"
              skills: []
              expected_result: "Entity Service is realized under valid, collision-free names, or realization stops with a clear configuration error."
              depends_on:
                - "P3-G4-T1"
                - "P3-G4-T2"
                - "P3-G4-T3"
                - "P3-G4-T4"
                - "P3-G4-T5"
                - "P3-G4-T6"
                - "P3-G4-T7"
                - "P3-G4-T8"
                - "P3-G4-T9"
                - "P3-G4-T10"
                - "P3-G4-T11"
                - "P3-G4-T12"
                - "P3-G4-T13"
                - "P3-G4-T14"
                - "P3-G4-T15"
              constraints: []
              acceptance: "Valid, non-colliding names are accepted and used unchanged; an invalid, reserved, or colliding value stops realization with a clear configuration error and nothing is renamed or suffixed."
              status: "done"
              log:
                - at: "2026-10-06T21:18:59Z"
                  execution: "015"
                  transition: "todo -> claimed"
                  note: "Claimed after all 15 Child Service Tasks were done. Scope: validation of the configured Entity Service names and every derived Child name before the Interface is realized."
                - at: "2026-10-06T21:19:15Z"
                  execution: "015"
                  transition: "claimed -> done"
                  note: "Validated every configured and derived Entity Service name during realization: the Service name, the Base name, the four group names, every Child unit and structure name, and the members of the Parameter and Error groups must be valid identifiers, not reserved, not private, and unique within their group; otherwise realization stops with a clear configuration error."
                  locations:
                    - "(realization generator, kept outside the project)"
                  observed: "The configured names and all 15 derived Child names were accepted and used unchanged (a Child Service and its Entity share one name by design); negative controls for a reserved Service name, a Base named like a group, an invalid Base name, two groups with one name, two Children with one unit name, a Child unit equal to the Base unit, and a duplicate group member each stopped with a configuration error naming the cause; none renamed or suffixed anything and no file changed."
                  decisions:
                    - unset: "Which names the validation covers beyond those the Definition lists."
                      chosen: "Group members (the Parameter and Error groups) are also checked for validity and uniqueness within their group."
                      why: "They are names the Interface publishes, and the Definition requires every published name to be valid and collision-free within its group."
