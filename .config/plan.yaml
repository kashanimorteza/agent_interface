              depends_on:
              - P1-G2-T1
              - P1-G2-T4
              - P1-G2-T5
              constraints: []
              acceptance: The Trading Platform Declaration matches the Target definition of Trading Platform in Fields, order, Types, nullability, defaults, and metadata; the name is unique and the code Field is declared as required.
              status: done
              log:
              - at: '2026-10-08T04:27:45Z'
                execution: '004'
                status: claimed
                note: Claimed; Core dependencies P1-G2-T1, P1-G2-T4, P1-G2-T5 done.
              - at: '2026-10-08T04:28:07Z'
                execution: '004'
                status: done
                note: Realized the Trading Platform Entity as its own unit with every Target Field in Target order and a unique name. Formatted, linted, type-checked; imported and registered in the shared table metadata.
                evidence:
                - model/model/entity/trading_platform.py
                - ruff format/check and ty check passed
                decisions:
                - unset: Physical name of an Entity whose logical name has a space
                  chosen: TradingPlatform for both type and table, module trading_platform
                  why: Physical names remove spaces and capitalise each word under the Entity PascalCase rule.
            P1-G3-T3:
              id: P1-G3-T3
              source_id: '003'
              title: Realize the Instance Entity
              description: Realize Instance as a complete Entity from its Target definition, including its Relations and its optional connection Fields.
              reason: An Account connects to a trading platform through an Instance.
              inputs:
