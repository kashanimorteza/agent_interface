                  observed: A User added through Storage was read back through Database with the same username and id. Signature (names, order, defaults, kinds) and documentation equal Database's; with a recording stand-in for the kept access, the Action forwarded every argument positionally in order and returned its answer unchanged, and an error raised by the access propagated unchanged.
                decisions:
                - unset: How the Actions are written
                  chosen: Emitted deterministically from what Database's Interface group publishes (its class and the signatures and documentation of its methods) by a throwaway generator kept outside the repository, then formatted
                  why: The Actions must follow Database one to one without being named or listed by hand; a generator reading only the published Interface keeps them in step.
                - unset: How published types are named in the generated signatures
                  chosen: Types that Database's Interface publishes are written through their published group names (database_value, database_instance, database_result); the built-in list type is written through an alias because an Action is named list
                  why: Storage may reach Database only through Database Interface, and the Action named list would shadow the built-in inside the class.
