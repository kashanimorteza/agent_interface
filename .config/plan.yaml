        P2-G5:
          id: P2-G5
          title: Query checking
          description: Core's validation of Conditions and Sorts against the Entity they target, so that every Field reference is verified before any Instance is accessed.
          area: Query checking and defaults
          does: A Filter, Order, or aggregate Field that does not suit its Entity is refused before storage is touched, and every valid one is turned into a checked form.
          constraints: []
          task_count: 4
          tasks:
            P2-G5-T01:
              id: P2-G5-T01
              source_id: '005'
              title: Check a Filter against its Entity
              description: Verify that a Filter's Field belongs to the given Entity, that its operator suits the Field's declared Type, that its value is compatible, and produce the checked Filter holding the Field's name and Type, the operator, and the normalized value.
              reason: A condition that does not fit its Entity must fail before any storage is touched.
              inputs:
              - Immutable Filter value
              - Entity Declaration
              - Database failure kinds
              skills: []
              expected_result: A valid Filter becomes a checked Filter, and an unsuitable one is refused as invalid input.
              depends_on:
              - P2-G2-T01
              - P2-G2-T03
              - P1-G7-T02
              constraints: []
              acceptance: A Filter on a Field of another Entity, a textual operator on a non-textual Field, an incompatible value, a missing value for a comparison, or a non-collection value for set membership is refused as invalid input, and each valid Filter yields a checked Filter with the Field's declared Type.
              status: done
              log:
              - at: '2026-10-08T01:05:23Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:05:36Z'
                transition: claimed -> done
                note: 'Created Filter checking against the Entity: the Field must be a reference of that Entity, the operator a FilterOperator member, the operator must suit the Field''s declared Type, the value must be compatible (a null test takes none, set membership takes a collection), and the checked Filter holds the Field name, Type, operator and normalized value.'
                evidence:
                  locations:
                  - database/database/core/query.py
                  observed: 'Run against the real Entities: a valid Filter became a checked Filter; a Field of another Entity, a Field name string, an operator string, a textual operator on a boolean, an ordering comparison on a boolean, a bool for an integer, a missing value, a value for a null test, a non-collection for IN, an int for a float, and a naive datetime were each refused with InvalidInputError; a datetime with an offset was normalized to UTC.'
                decisions:
                - unset: Which Types accept ordering comparisons
                  chosen: All Types except boolean and uuid
                  why: The definition requires a compatible value but orders only comparable Types; booleans and uuids have no meaningful order.
                - unset: Strictness of a Filter value against its Field Type
                  chosen: Same strict type matching as the Entity (no int for float, no bool for integer, aware datetimes only)
                  why: Model refuses implicit coercion, and a lenient query would accept values no Entity can hold.
            P2-G5-T02:
              id: P2-G5-T02
              source_id: '005'
              title: Check an Order against its Entity
              description: Verify that an Order's Field belongs to the given Entity and produce the checked Order holding the Field's name and Type and whether it descends.
              reason: A sort that does not fit its Entity must fail before any storage is touched.
              inputs:
              - Immutable Order value
              - Entity Declaration
              - Database failure kinds
              skills: []
              expected_result: A valid Order becomes a checked Order, and an unsuitable one is refused as invalid input.
              depends_on:
              - P2-G2-T01
              - P2-G2-T04
              - P1-G7-T02
              constraints: []
              acceptance: An Order on a Field of another Entity is refused as invalid input, and each valid Order yields a checked Order with the Field's declared Type and its direction.
              status: done
              log:
              - at: '2026-10-08T01:05:23Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:05:36Z'
                transition: claimed -> done
                note: 'Created Order checking against the Entity: the Field must be a reference of that Entity and the direction an OrderDirection member; the checked Order holds the Field name, Type and whether it descends.'
                evidence:
                  locations:
                  - database/database/core/query.py
                  observed: A valid ascending and a descending Order became checked Orders; an Order on a Field of another Entity and an Order with a direction string were refused with InvalidInputError.
            P2-G5-T03:
              id: P2-G5-T03
              source_id: '005'
              title: Check an aggregate Field against its Entity
              description: Verify that the Field named for a sum belongs to the Entity and is numeric, and that the Field named for a minimum or maximum belongs to the Entity and is comparable.
              reason: An aggregate over an unsuitable Field must fail before any storage is touched.
              inputs:
              - Entity Declaration
              - Database failure kinds
              skills: []
              expected_result: A suitable aggregate Field is accepted, and an unsuitable one is refused as invalid input.
              depends_on:
              - P2-G2-T01
              - P1-G7-T02
              constraints: []
              acceptance: A sum over a non-numeric Field, a minimum or maximum over a non-comparable Field, and an aggregate over a Field of another Entity are each refused as invalid input, and suitable Fields are accepted.
              status: done
              log:
              - at: '2026-10-08T01:05:23Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:05:36Z'
                transition: claimed -> done
                note: 'Created aggregate Field checking: a sum needs a numeric Field (integer, float or decimal) and a minimum or maximum a comparable Field, each belonging to the Entity.'
                evidence:
                  locations:
                  - database/database/core/query.py
                  observed: A sum of a decimal Field and a minimum of a string Field were accepted; a sum of a string Field, a maximum of a boolean Field, and a Field of another Entity were each refused with InvalidInputError.
                decisions:
                - unset: Which Types are comparable for a minimum or maximum
                  chosen: string, integer, float, decimal, datetime, date and time
                  why: These Types have a total order; boolean and uuid do not.
            P2-G5-T04:
              id: P2-G5-T04
              source_id: '005'
              title: Resolve omitted query inputs from the defaults
              description: Resolve an omitted Filter combination, an omitted set of Orders, and an omitted limit from the configured query defaults, keeping supplied Orders in the order given in place of the default.
              reason: The same call must return the same result on every Instance and every run.
              inputs:
              - Normalized query defaults
              - Checked Filters and Orders
              skills: []
              expected_result: Omitted query inputs take their configured values, and supplied Orders replace the default.
              depends_on:
              - P2-G3-T04
              - P2-G5-T01
              - P2-G5-T02
              constraints: []
              acceptance: An omitted combination resolves to the configured one, omitted Orders resolve to the configured default order, an omitted limit resolves to no limit, a positive limit is the maximum count, and supplied Orders replace the default and are applied in the order given.
              status: done
              log:
              - at: '2026-10-08T01:06:18Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:06:56Z'
                transition: claimed -> done
                note: 'Created defaults resolution: an omitted combination takes the configured one, omitted Orders take the configured default order (checked against the Entity), an omitted limit takes the configured limit, a positive limit is the maximum count, zero or negative means no limit, and supplied Orders replace the default and keep their sequence.'
                evidence:
                  locations:
                  - database/database/core/query.py
                  observed: 'With the repository defaults: omitted combination gave AND, an explicit OR was kept, a string was refused; omitted Orders gave id ascending, two supplied Orders (name descending, id) were kept in that sequence; limits None, 5, 0 and -3 resolved to -1, 5, -1 and -1; a string and a boolean limit were refused with InvalidInputError.'
        P2-G6:
          id: P2-G6
          title: Shared request routing
          description: 'Core''s handling of every public request: validating input, choosing the Instance, forwarding to the Engine, materializing Entities, and normalizing results.'
          area: Core request routing
          does: Every request is validated and routed in the same way whichever Instance or Engine serves it.
          constraints: []
          task_count: 5
          tasks:
            P2-G6-T01:
              id: P2-G6-T01
              source_id: '005'
              title: Refuse strings where imported values are required
              description: Refuse an Entity Operation whose entity is not an imported Entity (such as an Entity name or another string), whose identifier or supplied Entity does not suit that Entity, or whose Instance is not a member of the public Instance enumeration, before any storage is touched.
              reason: Typed values are checked before storage so that a wrong call never reaches an Instance.
              inputs:
              - Published Entity identities
              - Database failure kinds
              skills: []
              expected_result: A request built from a string identity or an unsuitable value is refused as invalid input.
              depends_on:
              - P2-G2-T01
              - P1-G7-T01
              constraints: []
              acceptance: An Entity Operation given an Entity name, a Field name, or any other string in place of an imported value is refused as invalid input, and nothing is stored or read.
              status: done
              log:
              - at: '2026-10-08T01:06:18Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:06:56Z'
                transition: claimed -> done
                note: 'Created public input validation: an Entity class or Entity instance must be one of Model''s Entities (an Entity name or any other string is refused), an identifier must suit the Entity''s Primary Key Field, and an Instance must be a database_instance member or absent, each refused with InvalidInputError before any storage is touched.'
                evidence:
                  locations:
                  - database/database/core/data.py
                  observed: An Entity class and an instance were accepted where each is required; the string User, a User instance where a class is required, and a class where an instance is required were refused; identifiers 3 was accepted and '3', True and None refused; Instance None and the SQLITE member accepted and the string sqlite refused. No connection was opened and no file created.
            P2-G6-T02:
              id: P2-G6-T02
              source_id: '005'
              title: Select the Instance for each request
              description: Use the Instance a request names or, when none is named, the configured default Instance, and resolve its complete configuration; an unknown Instance fails as invalid and an inactive one fails as inactive, each before any storage is touched.
              reason: A consumer selects an Instance by public member and never sees connection values.
              inputs:
              - Loaded Database Configuration
              - Public Instance enumeration
              skills: []
              expected_result: Every request runs on exactly one active Instance with its full configuration resolved.
              depends_on:
              - P2-G3-T02
              - P2-G2-T01
              - P2-G9-T01
              constraints: []
              acceptance: A request without an Instance runs on the configured default Instance, a request naming an active Instance runs on it, and a request naming an unknown or inactive Instance fails with the matching failure kind before any storage is touched.
              status: done
              log:
              - at: '2026-10-08T01:06:18Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:06:56Z'
                transition: claimed -> done
                note: 'Created Instance selection: the named Instance or, when none, the configured default Instance is resolved to its Engine unit and complete connection before any storage is touched; an unconfigured Instance fails as a configuration error and an inactive one as an inactive-Instance error.'
                evidence:
                  locations:
                  - database/database/core/data.py
                  - database/database/core/configuration.py
                  observed: Selecting with no Instance and with the SQLITE member both resolved to the sqlite unit with a connection whose representation hides connection values; resolving the inactive postgresql Instance raised InactiveInstanceError and an unconfigured key raised ConfigurationError, with no storage file or directory created.
                decisions:
                - unset: When the configuration is loaded
                  chosen: On first use and then kept for the process
                  why: The Interface must open nothing on import, and one validated configuration keeps every call consistent.
                - unset: Where the resolved connection is built
                  chosen: In the configuration module as an immutable connection value that hides connection values from its representation
                  why: The Definition makes Core resolve each Instance's connection from the configuration.
            P2-G6-T03:
              id: P2-G6-T03
              source_id: '005'
              title: Forward each request to its Engine
              description: Hand every validated request, together with the resolved connection of its Instance, to the Engine implementation for that Instance's Engine and receive the raw result, without any Engine-specific behaviour in Core.
              reason: Instances of one Engine must be served by the same implementation and differ only in their connection.
              inputs:
              - Selected Instance
              - Engine implementations
              skills: []
              expected_result: Each request reaches the Engine of its Instance with that Instance's connection.
              depends_on:
              - P2-G6-T02
              - P2-G7-T01
              - P2-G3-T01
              constraints: []
              acceptance: Requests for two Instances of the same Engine reach the same Engine implementation with different connections, and a request for an Instance whose Engine has no implementation fails as an invalid configuration.
              status: done
              log:
              - at: '2026-10-08T01:07:22Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 006) before changing the result.
              - at: '2026-10-08T01:08:48Z'
                transition: claimed -> done
                note: 'Added request forwarding to Core: a validated request and the Instance''s resolved connection are handed to the Engine unit of that Instance''s Engine, and the raw result returned, without any Engine-specific behaviour in Core.'
                evidence:
                  locations:
