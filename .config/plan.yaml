                - at: "2026-10-06T22:00:05Z"
                  execution: "019"
                  transition: "claimed -> done"
                  note: "Wrote the Entity Group documentation with the sections its Preferences define, in order (overview, endpoints, use, verify): the Group in one paragraph with a request example, the twelve Endpoints with Method, Path, and Parameters for every one of the 15 Entities, each with one example, how a client calls an Endpoint and how each Parameter form travels, and a runnable script that shows every Entity and Action has its Endpoint."
                  locations:
                    - "api/api/groups/entity/README.md"
                  observed: "The README was generated by running every example against prepared storage and written with the statuses actually returned; it was then replayed against a real running server on freshly prepared storage in a throwaway copy: all 184 example commands returned the documented status (including the prerequisite and cleanup steps, truncate answering 200 for the Entities nothing references and 500 for the rest), the two response examples equalled their documented JSON, and the Verify script printed that all checks passed (189 checks, 0 failed); with an Adapter removed from the Group in a throwaway copy the Verify script failed, so it can detect a missing Endpoint; the README is clean under the Python formatter and ruff reported no findings."
                  decisions:
                    - unset: "How the Endpoints are listed for every Entity."
                      chosen: "As one table and one example block per Entity, produced from the Adapters' own derived Methods and Paths and the Entity's Declaration, so the listing cannot drift from the code; a legend table before them gives the shared meaning of each operation."
                      why: "The Preferences ask for every Entity's Endpoints with Method, Path, and Parameters, each with one example; the Endpoints are identical in shape, so a derived listing avoids a hand-kept copy."
                    - unset: "How the examples are written."
                      chosen: "As shell commands against a Base URL variable, each followed by the status it returns, in an order that adds, uses, and removes one record per Entity; a prerequisite record is added for the Account (a new group, so its combination is unique) and for the Position (a new Action)."
                      why: "The examples are the only way to show the Endpoints work, and the Account's unique combination and the Position's Action reference need a record the first examples cannot reuse."
                    - unset: "The caveat about the examples."
                      chosen: "The text says the examples run in order against a freshly prepared Database and that truncate also removes the prepared records of an Entity nothing references."
                      why: "Observed: ids come from storage, and truncating the Action table succeeds and removes its prepared record."
