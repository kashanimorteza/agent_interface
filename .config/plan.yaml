              reason: Most other Entities belong to a user, so it is the root of the ownership relationships.
              inputs:
              - The Target definition of User
              skills:
              - sqlmodel
              expected_result: User is available as a complete Entity extending the shared foundation, with a Declaration that matches the Target.
              depends_on:
              - P1-G2-T1
              - P1-G2-T4
              - P1-G2-T5
              constraints: []
              acceptance: The User Declaration matches the Target definition of User in Fields, order, Types, nullability, defaults, and metadata; the name and the username are each unique, and the password and api_key Fields expose a recognized Sensitivity Marker.
              status: done
              log:
              - at: '2026-10-08T04:27:45Z'
                execution: '004'
                status: claimed
                note: Claimed; Core dependencies P1-G2-T1, P1-G2-T4, P1-G2-T5 done.
              - at: '2026-10-08T04:28:07Z'
                execution: '004'
                status: done
                note: 'Realized the User Entity as its own unit: Declaration with every Target Field in Target order (id, name, username, password, api_key, is_active, description), unique name and username, and the table Fields derived from that Declaration. Formatted, linted, type-checked; constructed once and round-tripped through JSON text.'
                evidence:
                - model/model/entity/user.py
                - ruff format/check and ty check passed
                - User constructed from valid values; JSON round trip returned identical text
                decisions:
                - unset: Sensitivity Marker for each credential Field
                  chosen: password marker on the password Field; sensitive marker on the api_key Field
                  why: The Target names both as credentials without naming a marker; the recognized markers are password and sensitive.
                - unset: Unit naming and Entity layout
                  chosen: One module per Entity named in snake_case; the Declaration is the class attribute declaration; type and table named by the physical name; Fields declared in Declaration order
                  why: Preferences fix module snake_case, Entity PascalCase and declaration as a class attribute.
                - unset: Representation of a Target Unique flag on one Field
                  chosen: A single-Field entry in the Uniqueness Constraints
                  why: The Declaration holds uniqueness only as Entity Metadata.
            P1-G3-T2:
              id: P1-G3-T2
              source_id: '003'
              title: Realize the Trading Platform Entity
              description: Realize Trading Platform as a complete Entity from its Target definition, including the code that identifies its implementation.
              reason: Instances and Positions refer to a supported trading platform.
              inputs:
              - The Target definition of Trading Platform
              skills:
