# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 54
  plans:
    P1:
      id: "P1"
      title: "Model"
      order: 1
      target: "Model"
      does: "The independent Model library publishes every Target Entity with its complete Declaration, strict validation, lossless JSON conversion, and table-ready storage mapping, and documents that published surface for its consumers."
      constraints: []
      task_count: 28
      groups:

        P1-G1:
          id: "P1-G1"
          title: "Component setup"
          description: "Establishes the Model library as a project-internal package with its isolated environment, resolved dependencies, applied quality standards, and version-control exclusions, so every later Task builds inside a ready Component."
          area: "Component setup: the package identity, environment, dependencies, and development standards of the Model library."
          does: "The Model library exists as a project-internal package whose dependencies are resolved and locked, whose quality standards can be applied, and whose environment artifacts stay out of version control."
          constraints: []
          task_count: 3
          tasks:
            P1-G1-T1:
              id: "P1-G1-T1"
              source_id: "003"
              title: "Establish the Model library package and its environment"
              description: "Create the Model library as a project-internal package with its own isolated environment, declaring the selected modeling package as its dependency and resolving every unpinned version to a concrete compatible version preserved in lock metadata."
              reason: "Every other Model Task needs an existing package and a reproducible environment to build in."
              inputs:
                - "Model component identity and language profile"
                - "Development language standards and package-management defaults"
              skills:
                - "sqlmodel"
              expected_result: "An empty, importable Model package exists in an isolated environment with its modeling dependency resolved and locked."
              acceptance: "The Model package imports cleanly in its isolated environment, and its dependency metadata records a concrete resolved version for every third-party package it uses."
              depends_on: []
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:48:10Z"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Created the Model Component directory with its project metadata and an empty package initialiser, added the modeling dependency with uv, and created the isolated environment and lockfile."
                  locations: ["model/pyproject.toml", "model/uv.lock", "model/model/__init__.py"]
                  evidence: "uv resolved and locked 8 packages (sqlmodel 0.0.48, pydantic 2.14.1, pydantic-core 2.50.1, sqlalchemy 2.1.4, annotated-types 0.8.0, typing-extensions 4.16.0, typing-inspection 0.4.4, model 0.1.0); the package and its dependencies import cleanly in the .venv environment."
                  decisions:
                    - unset: "Concrete Python version for 'latest-compatible'."
                      chosen: "requires-python >=3.14, resolved to the installed CPython 3.14.4."
                      why: "The newest available interpreter is supported by every resolved dependency."
                    - unset: "Build backend and package layout."
                      chosen: "uv_build with a flat module root, so the package directory sits directly inside the Component directory."
                      why: "uv is the selected package manager, and the Model Directory Structure places the package directly under the Component root."
                    - unset: "Whether to run the Development skill-provisioning step."
                      chosen: "Not run."
                      why: "It writes outside the Model Component, and the required sqlmodel Skill is already available at project scope."
            P1-G1-T2:
              id: "P1-G1-T2"
              source_id: "003"
              title: "Apply the shared quality standards to the Model package"
              description: "Configure the selected formatter, linter, and type checker for the Model package so its source can be checked against the shared language standards."
              reason: "Development standards require every Python Component to be formatted, linted, and type-checked consistently."
              inputs:
                - "Development quality-tool defaults"
                - "The established Model package"
              skills: []
              expected_result: "The formatter, linter, and type checker are available to and configured for the Model package."
              acceptance: "Formatting, linting, and type checking each run against the Model package as it stands and report no violation."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              status: "done"
              log:
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Added the selected formatter, linter, and type checker to the Model package's development dependency group with uv, using their default configurations."
                  locations: ["model/pyproject.toml", "model/uv.lock"]
                  evidence: "ruff 0.17.0 and ty 0.0.86 resolved and locked; ruff format --check, ruff check, and ty check each reported no violation on the package as it stood."
                  decisions:
                    - unset: "Quality-tool configuration beyond the tool selection."
                      chosen: "Tool defaults, with the target Python version inferred from requires-python."
                      why: "No Preference sets rules, and the defaults are the tools' own standard."
            P1-G1-T3:
              id: "P1-G1-T3"
              source_id: "003"
              title: "Exclude the Model package's environment and generated artifacts from version control"
              description: "Add to the project's single root ignore file only the entries the Model package needs, scoped to the Component where they apply only to it, without duplicating or altering any existing entry."
              reason: "The isolated environment and generated artifacts of the package must not enter version control, and the project keeps exactly one ignore file."
              inputs:
                - "The established Model package and its environment"
              skills: []
              expected_result: "Environment and generated artifacts of the Model package are ignored by version control."
              acceptance: "After the package environment has been created and used, version control reports none of its environment or generated artifacts as untracked, no ignore file exists inside the Component, and every pre-existing root ignore entry is unchanged."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              status: "done"
              log:
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Appended a Model section to the root ignore file with the Component-scoped environment, lint cache, build output, and bytecode cache entries; existing entries were left unchanged and no ignore file was created inside the Component."
                  locations: [".gitignore"]
                  evidence: "After creating and using the environment and running the quality tools, version control listed only model/pyproject.toml, model/uv.lock, and model/model/__init__.py as untracked."
                  decisions:
                    - unset: "Exact ignore entries for the Model Component."
                      chosen: "/model/.venv/, /model/.ruff_cache/, /model/dist/, /model/**/__pycache__/; the lockfile stays tracked."
                      why: "These are the artifacts the selected package manager, linter, build backend, and interpreter produce; the lockfile is the version-stabilization record."

        P1-G2:
          id: "P1-G2"
          title: "Core shared contracts"
          description: "Builds the parts that serve every Entity rather than one: the public Declaration and Foundation contracts and the private Validation, Field Type realization, and Storage Mapping behind them."
          area: "Core: the shared public contracts and private systems on which every Entity unit is built."
          does: "Any Entity can be declared, strictly validated, converted to and from JSON text, and mapped to a table by supplying only its Declaration and its Fields."
          constraints: []
          task_count: 8
          tasks:
            P1-G2-T1:
              id: "P1-G2-T1"
              source_id: "003"
              title: "Provide the public Declaration contract"
              description: "Provide immutable Entity and Field Declaration records together with their Field Constraints, Relation, Uniqueness Constraint, Index, Field Type, Value Generation, and Sensitivity parts, checking every structural rule when a Declaration is created and failing on any invalid or contradictory Declaration instead of repairing it."
              reason: "Each Entity's meaning is written once as its Declaration, and every other Core part and Entity unit reads it from there."
              inputs:
                - "The established Model package"
              skills: []
              expected_result: "Declarations can be created for any Entity, expose every member read-only, and refuse every structurally invalid combination."
              acceptance: "A valid Entity Declaration is created and exposes its name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes without allowing change, and each violation of a Declaration structural rule is refused at creation."
              depends_on:
                - "P1-G1-T1"
              constraints: []
              status: "done"
              log:
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Wrote the public Declaration contract as frozen, slotted dataclasses with tuple collections (EntityDeclaration, FieldDeclaration, FieldConstraints, Relation, UniquenessConstraint, Index) plus the closed FieldType, ValueGeneration, and Sensitivity sets, the NO_DEFAULT marker, and DeclarationError, which collects every structural problem of one record. Default conformance is checked through the private Field Type module."
                  locations: ["model/model/core/declaration.py", "model/model/core/_types.py", "model/model/core/__init__.py"]
                  evidence: "A scratch check outside the Component created a valid Declaration, confirmed its members are read-only, and saw each of 25 structural violations refused at creation (duplicate Field, missing/mutable/nullable id, wrong Primary Key, invalid is_active, mismatched/null/coexisting defaults, misplaced or non-positive size, invalid Value Generation, unknown Type or marker, invalid Relation, Uniqueness Constraint, and Index entries, non-tuple collections)."
                  decisions:
                    - unset: "Physical member names of a Field Declaration."
                      chosen: "name, type, nullable, description, default, sensitivity, immutable, constraints, value_generation."
                      why: "Model Preferences name only Entity and Relation members; the Model Definition's own Field Declaration names were used."
                    - unset: "How an absent Default Value is represented."
                      chosen: "A public NO_DEFAULT singleton, distinct from None."
                      why: "The Declaration must distinguish an absent default from an explicit null default."
                    - unset: "Which value constraints a Field may carry."
                      chosen: "size only, read as a maximum string length."
                      why: "Size is the only Field value constraint the Target uses; uniqueness and indexes are Entity Metadata."
            P1-G2-T2:
              id: "P1-G2-T2"
              source_id: "003"
              title: "Realize the closed set of Field Types"
              description: "Realize every Field Type of the closed set in the selected language and in JSON text as the language profile defines, refusing any Type outside the set."
              reason: "Validation, conversion, and storage all depend on one agreed realization of each Field Type."
              inputs:
                - "The public Declaration contract"
              skills:
                - "sqlmodel"
              expected_result: "Each Field Type has exactly one in-language and one JSON realization, and an unknown Type is refused."
              acceptance: "Each Field Type of the closed set resolves to its profile realization, a non-finite float and a timezone-naive datetime are refused, and a Type outside the set is refused rather than guessed."
              depends_on:
                - "P1-G2-T1"
              constraints: []
              status: "done"
              log:
                - at: "between 2026-10-12T18:48:10Z and 2026-10-12T18:58:44Z (not measured)"
                  by: "004"
                  transition: "todo -> claimed"
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Realized every Field Type in Python and in JSON in the private Field Type module: a Python annotation per Type (a pending Auto Increment or nullable Field adds None), the set of Types whose JSON form is text, exact decoders for those text forms, and strict value conformance. Non-finite floats and decimals are refused through the Base configuration; naive datetimes through the timezone-aware datetime realization."
                  locations: ["model/model/core/_types.py"]
                  evidence: "A scratch probe outside the Component saw a naive datetime, an infinite float, a NaN decimal, an int for a float, a string for a decimal, a bool for an integer, and a datetime for a date each refused; an unknown Type was refused by the Declaration; every Type round-tripped through JSON with its expected text or number form."
                  decisions:
                    - unset: "How JSON text forms are decoded."
                      chosen: "Model-owned decoders (a strict decimal pattern plus Decimal, ISO 8601 parsers for datetime, date, and time, and UUID) applied before strict validation."
                      why: "SQLModel table models do not run validation on JSON input, so decoding must happen inside Model's own validation path."
            P1-G2-T3:
              id: "P1-G2-T3"
              source_id: "003"
              title: "Provide the private Storage Mapping"
              description: "Derive each Entity's table form solely from its Declaration: table and column names, column types, Primary Key, a foreign key per Relation, uniqueness and indexes as declared, the identity column for Auto Increment, and exact decimal and UTC datetime columns, registering every table in one shared table metadata reached through the Entities and naming every constraint and index by the selected convention."
              reason: "Consumers that store Entities need a table-ready form that cannot drift from the Declaration."
              inputs:
                - "The public Declaration contract"
                - "The Field Type realization"
              skills:
                - "sqlmodel"
              expected_result: "Any declared Entity yields its complete table form without storage options being stated beside its Declaration."
              acceptance: "For a declared Entity, the shared table metadata holds exactly its table, named by its physical name, with columns named by its Fields, the declared keys, uniqueness constraints, and indexes under convention names, an identity column for its Auto Increment Field, decimals read back exactly, and datetimes stored in UTC and read back timezone-aware; no storage is run by Model."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T2"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, after P1-G2-T2 was claimed, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Wrote the private Storage Mapping: one registry whose shared metadata carries the pk/fk/uq/ix naming convention, deterministic physical Entity names (PascalCase words) and Field names (snake_case, refusing keywords and invalid identifiers), a per-Field realization from the Field Declaration and Entity Metadata (default, nullability, description, size, primary key, single-Field uniqueness and index, foreign key, Identity construct for Auto Increment, exact-decimal column type), and table-level arguments for combined uniqueness and indexes plus sqlite_autoincrement."
                  locations: ["model/model/core/_storage.py"]
                  evidence: "The scratch probe created two probe tables in an in-memory SQLite database: table and column names matched physical names; constraints were named pk_Probe, fk_Probe_owner_id, uq_Probe_owner_id_code, ix_Probe_code, ix_Probe_owner_id_day; the id column rendered as INTEGER PRIMARY KEY AUTOINCREMENT and storage assigned id 1; Decimal('0.10') was stored as text '0.10' and read back exactly; a +03:00 datetime was read back as the same instant, UTC-aware; the shared metadata held exactly the probe tables."
                  decisions:
                    - unset: "The fixed exact-decimal column type."
                      chosen: "A TypeDecorator over a string column that binds str(Decimal) and reads Decimal(text)."
                      why: "A numeric column is not exact on every Engine; text preserves the exact decimal."
                    - unset: "How the datetime column is realized."
                      chosen: "SQLModel's automatic UTCDateTime for the timezone-aware datetime annotation."
                      why: "It is a TypeDecorator over DateTime(timezone=True) that stores UTC and returns UTC-aware values, which satisfies the Model Preference and follows the sqlmodel Skill's guidance."
                    - unset: "The physical naming of an Entity whose logical name has several words."
                      chosen: "Capitalize each space-separated word and join them; the table name equals that physical name."
                      why: "Model Preferences select PascalCase Entity naming and require the table name to equal the physical name."
            P1-G2-T4:
              id: "P1-G2-T4"
              source_id: "003"
              title: "Provide strict Base validation for construction and assignment"
              description: "Provide the private Base on the selected modeling package that validates every Entity strictly: no implicit coercion or undeclared Field, validated defaults, whole-Entity validation on direct construction before any value is set, atomic whole-Entity revalidation on assignment that keeps the prior value on failure, refusal to assign an immutable Field, and no hashing of a mutable Entity."
              reason: "Every Entity must enforce its Field contracts identically, without package-specific construction or mutation conventions changing data."
              inputs:
                - "The public Declaration contract"
                - "The Field Type realization"
              skills:
                - "sqlmodel"
              expected_result: "Every Entity type built on Base enforces its Field contracts identically on construction and on assignment."
              acceptance: "An Entity built on Base rejects an unknown Field, a value of the wrong Type, and a missing Required Field at construction; a failed assignment leaves the previous value in place; assigning an immutable Field is refused; explicit false, zero, empty string, and null stay supplied values; and a mutable Entity cannot be hashed."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T2"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Wrote the private Base on SQLModel with a strict, extra-forbidding, default-validating, finite-number configuration. Direct construction first runs model_validate on the whole input and only then initializes; assignment refuses immutable Fields and otherwise validates the whole Entity with the new value before setting it; Base is unhashable. A metaclass keeps each Entity's Declaration a read-only class member once the type is defined."
                  locations: ["model/model/core/_base.py"]
                  evidence: "The scratch probe saw an unknown Field (extra_forbidden), a wrong Type (int_type), and a missing Required Field (missing) refused at construction; a too-long assignment refused with the prior value kept; an immutable assignment refused (frozen_field); empty string and None kept as supplied values; hash() raised TypeError; reassigning a type's declaration raised AttributeError."
                  decisions:
                    - unset: "How construction validation is bypassed for SQLModel's own internal instance creation."
                      chosen: "A Model-private context flag set only while Model itself validates or initializes."
                      why: "It avoids depending on SQLModel's private initialization flag while keeping every caller construction validated."
            P1-G2-T5:
              id: "P1-G2-T5"
              source_id: "003"
              title: "Keep sensitive values out of validation diagnostics"
              description: "Make Validation replace the input of any Field carrying a Sensitivity Marker in every validation message, without chaining or exposing the original message, while leaving the value itself unchanged in Entity state."
              reason: "A marked value must never be echoed by diagnostics, and Model must not transform it."
              inputs:
                - "Strict Base validation"
              skills: []
              expected_result: "Validation failures on marked Fields never reveal the supplied value, and valid marked values are kept as given."
              acceptance: "A failed construction or assignment on a marked Field produces an error whose message and cause chain contain no trace of the supplied value, and a valid marked value is stored and returned unchanged."
              depends_on:
                - "P1-G2-T4"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Every validation failure is rebuilt from its error details with the input of each marked Field, and each marked key inside a whole-input mapping, replaced by a fixed placeholder; the rebuilt error is raised outside the original handler with no cause, context, or traceback link to the original. Malformed JSON for an Entity with marked Fields reports the placeholder instead of the text."
                  locations: ["model/model/core/_base.py", "model/model/core/foundation.py"]
                  evidence: "The scratch probe checked the message, error details, cause, context, and formatted traceback of five failures involving a password-marked value (wrong type at construction, a missing other Field, a bad assignment, invalid JSON fields, malformed JSON); the value appeared in none, and a valid marked value was stored and serialized unchanged."
            P1-G2-T6:
              id: "P1-G2-T6"
              source_id: "003"
              title: "Realize Value Generation behavior"
              description: "Keep an omitted Auto Increment Field in its pending state without making it nullable, refuse a caller-supplied Auto Increment value at construction and at assignment, never assign it inside Model, and produce a Generated Identifier at Entity creation with the selected algorithm."
              reason: "Generated values are owned by whoever generates them, so callers must not supply them and Model must not invent them."
              inputs:
                - "Strict Base validation"
              skills:
                - "sqlmodel"
              expected_result: "Auto Increment Fields stay pending until storage assigns them, and Generated Identifier Fields are filled on creation."
              acceptance: "An Entity constructed without its Auto Increment value holds the pending state; supplying that value at construction or by assignment is refused; and a Generated Identifier Field receives a new identifier of the selected algorithm on each creation."
              depends_on:
                - "P1-G2-T4"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "An Auto Increment Field defaults to the pending value None while its column stays non-nullable; a field-level check refuses any non-pending value at construction and in JSON, and assignment always refuses it; Model never assigns it. A Generated Identifier Field is produced at creation by uuid4 (as a UUID, or its text for a string Field)."
                  locations: ["model/model/core/_base.py", "model/model/core/_storage.py", "model/model/core/_types.py"]
                  evidence: "The scratch probe constructed an Entity whose id was None and serialized as null; id=5 at construction, assignment of id, and id 3 in JSON were each refused (generated_value); two constructions produced two different UUID tokens; after insert, storage assigned id 1."
            P1-G2-T7:
              id: "P1-G2-T7"
              source_id: "003"
              title: "Check each Entity type against its Declaration when it is defined"
              description: "Make Base verify, when an Entity type is defined, that its type name and table name equal the Entity's physical name and that its Fields are exactly its Declaration's Fields in the same order, failing loading on any mismatch."
              reason: "An Entity type that drifts from its Declaration must fail immediately rather than publish a wrong contract."
              inputs:
                - "Strict Base validation"
                - "The private Storage Mapping"
              skills:
                - "sqlmodel"
              expected_result: "Only Entity types that match their Declarations can be loaded."
              acceptance: "Defining an Entity type whose name, table name, Field set, or Field order differs from its Declaration fails at load, and a matching type loads."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T3"
                - "P1-G2-T4"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Base checks every type that carries a Declaration when the type is defined: its type name and table name must equal the Entity's physical name, its Fields must be exactly the Declaration's Fields in order, and each Field's annotation must be the realization of its declared Type; any mismatch raises at load."
                  locations: ["model/model/core/_base.py"]
                  evidence: "The scratch probe saw four types fail at load (wrong type name, reordered Fields, wrong table name, wrong Field Type) while the two matching probe types loaded."
            P1-G2-T8:
              id: "P1-G2-T8"
              source_id: "003"
              title: "Provide the public Foundation JSON conversion"
              description: "Provide Foundation, extending Base, that converts an Entity to JSON text whose single root object has exactly the Entity's Field names as keys in Declaration order, and reconstructs an Entity from JSON text by rejecting malformed text, repeated keys, non-standard constants, and non-object roots, decoding text forms by Field Type, and then applying the same rules as direct construction."
              reason: "Consumers need one portable and lossless value representation for every Entity."
              inputs:
                - "Strict Base validation"
                - "The Field Type realization"
                - "Value Generation behavior"
              skills:
                - "sqlmodel"
              expected_result: "Every Entity built on Foundation round-trips through JSON text without loss."
              acceptance: "An Entity converted to JSON text and back equals the original, including a pending Auto Increment value; decimal and datetime values keep their exact values; null, false, zero, and empty string stay distinct; and each kind of invalid JSON text is rejected."
              depends_on:
                - "P1-G2-T2"
                - "P1-G2-T4"
                - "P1-G2-T6"
              constraints: []
              status: "done"
              log:
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "todo -> claimed"
                  note: "Claim recorded late: the work was done earlier in this execution, before this claim was written."
                - at: "2026-10-12T18:58:44Z"
                  by: "004"
                  transition: "claimed -> done"
                  done: "Wrote the public Foundation: to_json returns the model's JSON text with the Fields in Declaration order; from_json parses the text itself, refusing non-text input, malformed text, repeated keys, non-standard constants, and non-object roots, then validates the decoded object through the same path as direct construction with text forms decoded by Field Type."
                  locations: ["model/model/core/foundation.py", "model/model/core/_base.py"]
                  evidence: "The scratch probe converted an Entity with a pending id, an 18-digit decimal, a +03:00 microsecond datetime, a date, a time, a UUID, an empty string, and false to JSON (keys in Declaration order) and back to an equal Entity with exact values; malformed, repeated-key, NaN, array-root, non-text, numeric-decimal, malformed-decimal-text, and naive-datetime JSON were each refused."
                  decisions:
                    - unset: "Whether a JSON number is accepted for a text-form Type."
                      chosen: "Refused; only the text form is accepted, while an integer JSON number is accepted for a float Field."
                      why: "A JSON number cannot carry an exact decimal, and JSON makes no distinction between integral and fractional numbers."

        P1-G3:
          id: "P1-G3"
          title: "Entity units"
