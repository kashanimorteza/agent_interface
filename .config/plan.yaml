        P3-G5:
          id: "P3-G5"
          title: "Entity Service Interface"
          description: "The gateway callers import Child Services and the needed contracts from; it publishes nothing of its implementation."
          area: "Entity Service: Interface"
          does: "A caller imports every Child Service and every contract it needs from one Interface."
          constraints: []
          task_count: 3
          tasks:
            P3-G5-T1:
              id: "P3-G5-T1"
              source_id: "013"
              title: "Republish the Storage contracts"
              description: "Republish, as the original objects and never copies, every contract Storage Interface publishes except the Storage gateway, read from Storage each time and not listed by hand, so that no caller has to import Storage or Database."
              reason: "Callers need to build requests, read results, and catch errors through the Entity Service alone."
              inputs: []
              skills: []
              expected_result: "Every Storage contract except the gateway is available through the Entity Service as the original object."
              depends_on:
                - "P3-G2-T5"
              constraints: []
              acceptance: "Every contract the Storage Service Interface publishes other than the Storage gateway is available from the Entity Service Interface as the identical object, and the Storage gateway is not."
              status: "done"
              log:
                - at: "2026-10-06T15:09:18Z"
                  execution: "014"
                  transition: "todo -> claimed"
                  note: "Claimed after P3-G2-T5 was done. Scope: republishing the Storage contracts through the Entity Service Interface."
                - at: "2026-10-06T15:09:51Z"
                  execution: "014"
                  transition: "claimed -> done"
                  note: "Republished every Storage contract except the gateway through the Entity Service Interface as the original objects."
                  locations:
                    - "logic/logic/services/entity/interface.py"
                  observed: "The 16 contracts Storage Interface publishes besides its gateway are available from the Entity Service as the identical objects; the Storage gateway is not; the list was derived from the Storage Service Interface when the file was generated."
                  decisions:
                    - unset: "How the Entity Service's republished list follows Storage."
                      chosen: "The interface unit is generated from the Storage Service Interface's published list, minus the gateway."
                      why: "The Schema requires the contracts to be read from Storage each time and never listed by hand."
            P3-G5-T2:
              id: "P3-G5-T2"
              source_id: "013"
              title: "Publish exactly one Child Service for every Entity"
              description: "Publish through the Entity Service Interface exactly one Child Service for every Entity of Model's Entity Collection, following the Entity Collection, together with the republished contracts and nothing else, so that Base, the Storage gateway, and every Child implementation are never published and loading the Interface opens no connection and creates no data or file."
              reason: "Callers depend on one exact gateway that stays in step with Model."
              inputs: []
              skills: []
              expected_result: "The Entity Service Interface publishes exactly the Child Services and the republished contracts."
              depends_on:
                - "P3-G5-T1"
                - "P3-G4-T1"
                - "P3-G4-T2"
                - "P3-G4-T3"
                - "P3-G4-T4"
                - "P3-G4-T5"
                - "P3-G4-T6"
                - "P3-G4-T7"
                - "P3-G4-T8"
                - "P3-G4-T9"
                - "P3-G4-T10"
                - "P3-G4-T11"
                - "P3-G4-T12"
                - "P3-G4-T13"
                - "P3-G4-T14"
                - "P3-G4-T15"
