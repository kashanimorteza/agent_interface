        P1-G3:
          id: "P1-G3"
          title: "Published Interface"
          description: "The single entrypoint through which the Model publishes every Entity by name and as one ordered collection, and publishes nothing else."
          area: "Interface"
          does: "A consumer can import any one Entity directly or enumerate all of them, and the Model creates nothing when it is loaded."
          constraints: []
          task_count: 3
          tasks:
            P1-G3-T1:
              id: "P1-G3-T1"
              source_id: "002"
              title: "Publish every Entity by its own name"
              description: "Publish through the Model's entrypoint one explicit named export for every Target Entity, each being the actual Entity exposing its actual Declaration rather than a copy, wrapper, or alias, with no wildcard or dynamically generated export."
              reason: "A consumer that works with one specific Entity must import that Entity's real type by name."
              inputs:
                - "All completed Target Entities"
              skills: []
              expected_result: "Each Target Entity is importable directly by its own name."
              depends_on:
                - "P1-G2-T1"
                - "P1-G2-T2"
                - "P1-G2-T3"
                - "P1-G2-T4"
                - "P1-G2-T5"
                - "P1-G2-T6"
                - "P1-G2-T7"
                - "P1-G2-T8"
                - "P1-G2-T9"
                - "P1-G2-T10"
                - "P1-G2-T11"
                - "P1-G2-T12"
                - "P1-G2-T13"
                - "P1-G2-T14"
                - "P1-G2-T15"
              constraints: []
              acceptance: "Importing each Target Entity by its own name succeeds and yields the actual Entity with its actual Declaration; the set of Entity exports equals exactly the Target's Entity set."
              status: "todo"
            P1-G3-T2:
              id: "P1-G3-T2"
              source_id: "002"
              title: "Publish the ordered Entity Collection"
              description: "Publish one immutable collection holding every actual Entity exactly once, in Target order, under the symbol name Model Preferences set."
              reason: "A consumer that works with all Entities without knowing their names must be able to enumerate them."
              inputs:
                - "Entity exports"
              skills: []
              expected_result: "A single ordered collection of every Entity that corresponds one-to-one with the Entity exports."
              depends_on:
                - "P1-G3-T1"
              constraints: []
              acceptance: "Enumerating the collection yields exactly the exported Entities, each once, in Target order, and each item is the same Entity that its export yields; the collection cannot be modified."
              status: "todo"
            P1-G3-T3:
              id: "P1-G3-T3"
              source_id: "002"
              title: "Keep the Interface free of side effects and extra surface"
              description: "Ensure that loading the Model's entrypoint creates nothing and performs no external action, and that nothing beyond the Entity exports and the Entity Collection is published."
              reason: "Consumers rely on the Interface contract's guarantees of no side effect and no additional registry or discovery mechanism."
              inputs:
                - "Entity exports"
                - "Entity Collection"
              skills: []
              expected_result: "An entrypoint that publishes exactly the contracted surface and does nothing on load."
              depends_on:
                - "P1-G3-T2"
              constraints: []
              acceptance: "Loading the entrypoint creates no Entity instance, data, connection, file, or process and performs no network, storage, or runtime-configuration action; no registry, lookup table, or discovery mechanism other than the exports and the collection is published."
              status: "todo"
        P1-G4:
          id: "P1-G4"
          title: "Component documentation"
          description: "The root documentation of the Model, in the form, location, and format Model Preferences name, with its sections in the order the Model Definition fixes. It defines no other Component, exposes no private helper as contract, retains no stale meaning, and contains no real credential or secret."
          area: "Documentation"
          does: "A consumer can learn, set up, use, and verify the Model from its documentation alone."
          constraints: []
          task_count: 4
          tasks:
            P1-G4-T1:
              id: "P1-G4-T1"
              source_id: "002"
              title: "Document the Overview and Interface sections"
              description: "Write the Overview section as one concise introduction with one simple example using one Entity, and the Interface section explaining the Entity exports and the Entity Collection, listing every Entity once in Target order with its description, complete Field table, and Entity Metadata outside that table, and showing one consumer importing an Entity directly and one enumerating the collection without wildcard exports, reflection, directory scanning, or internal paths."
              reason: "Consumers learn what the Model publishes and how to reach it from its documentation."
              inputs:
                - "Entity exports"
                - "Entity Collection"
                - "Model Documentation preferences"
              skills: []
              expected_result: "Overview and Interface sections in the form, location, and format Model Preferences name, in the order the Model Definition fixes."
              depends_on:
                - "P1-G3-T1"
                - "P1-G3-T2"
              constraints: []
              acceptance: "Every Target Entity appears exactly once in Target order with its description, complete Field table, and Entity Metadata; the direct-import and enumeration examples reflect the published exports and collection; the sections name no real credential or secret."
              status: "todo"
            P1-G4-T2:
              id: "P1-G4-T2"
              source_id: "002"
              title: "Document the Declaration and Foundation sections"
              description: "Write the Declaration section showing how a consumer reads one Entity's public Declaration, including Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, through the Entity itself, and the Foundation section giving one example for each Foundation capability and one complete Entity-to-JSON-text-to-Entity round trip."
              reason: "Consumers rely on the public Declaration and Foundation contracts and need correct usage shown."
              inputs:
                - "Entity Declaration contract"
                - "Entity-to-JSON conversion"
                - "Entity-from-JSON reconstruction"
                - "Entity exports"
              skills: []
              expected_result: "Declaration and Foundation sections that follow the Overview and Interface sections."
              depends_on:
                - "P1-G1-T12"
                - "P1-G3-T1"
              constraints: []
              acceptance: "The Declaration section reads each listed Declaration property through an Entity and the Foundation section's examples and round trip behave as documented; the sections expose no private helper as contract and name no real credential or secret."
              status: "todo"
            P1-G4-T3:
              id: "P1-G4-T3"
              source_id: "002"
              title: "Document the Setup and Use sections"
              description: "Write the Setup section giving the setup steps for the selected technology and the Use section showing use that follows the Entity exports and the Entity Collection."
              reason: "Consumers must be able to prepare and use the Model from its documentation alone."
              inputs:
                - "Established Model Component"
                - "Entity exports"
                - "Entity Collection"
              skills: []
              expected_result: "Setup and Use sections that follow the Foundation section."
              depends_on:
                - "P1-G1-T1"
                - "P1-G3-T2"
              constraints: []
              acceptance: "Following the Setup steps on a clean machine yields a working environment, and the Use examples run as documented using only the published exports and collection."
              status: "todo"
            P1-G4-T4:
              id: "P1-G4-T4"
              source_id: "002"
              title: "Document the Verify and Troubleshooting sections"
              description: "Write the Verify section describing how to verify Interface-contract-conformant shape, exact Entity export membership, collection membership and order and its correspondence with the exports, actual Entity and Declaration references, immutability, side-effect freedom, representative Entity construction, Declaration access, and a lossless JSON text round trip, and the Troubleshooting section covering Model concerns only."
              reason: "Consumers and reviewers need documented ways to confirm the Model is conformant and to resolve Model-specific problems."
              inputs:
                - "Interface contract guarantees"
                - "Entity-from-JSON reconstruction"
              skills: []
              expected_result: "Verify and Troubleshooting sections that complete the documentation."
              depends_on:
                - "P1-G1-T12"
                - "P1-G3-T3"
              constraints: []
              acceptance: "Every listed Verify observation is covered and can be carried out as written; Troubleshooting addresses only Model concerns and defines no other Component."
              status: "todo"
