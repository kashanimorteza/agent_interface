# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order: ["task_count", "plans"]

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 47
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Deliver the independent, reusable Model Component whose Entities realize every Target-defined model with its Fields, Relations, and rules.
      constraints: []
      task_count: 47
      groups:
        P1-G1:
          id: P1-G1
          title: Component package
          description: Makes the Model Component an independently usable library and holds the standards its finished source must satisfy.
          area: Component packaging and source quality
          does: The Model Component is a reusable library package whose finished source meets the project's quality standards.
          constraints: []
          task_count: 2
          tasks:
            P1-G1-T01:
              id: P1-G1-T01
              source_id: '002'
              title: Establish the Model library package
              description: Create the Model Component as a self-contained, reusable library whose dependencies resolve to concrete compatible versions recorded in lock metadata.
              reason: Every other Task in this phase places its result in a package that later Components depend on.
              inputs:
              - Model Component packaging choices
              - Development shared defaults and package-dependency rules
              skills: []
              expected_result: The Model Component exists as a library package that a consumer inside the repository can depend on, with reproducible dependency resolution.
              depends_on: []
              constraints: []
              acceptance: A consumer elsewhere in the repository can declare a local dependency on the Model Component and load it successfully, and its dependencies resolve to the same concrete versions on every installation.
              status: done
              log:
              - at: '2026-10-07T23:14:02Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:14:31Z'
                transition: claimed -> done
                note: Created the Model library package with a lock file; a throwaway consumer project declared it as a local path dependency and imported it.
                evidence:
                  locations:
                  - model/pyproject.toml
                  - model/uv.lock
                  - model/README.md
                  - model/.gitignore
                  - model/model/__init__.py
                  - model/model/core/__init__.py
                  - model/model/entity/__init__.py
                  observed: uv lock resolved 10 packages (sqlmodel 0.0.48, pydantic 2.14.0, sqlalchemy 2.1.4; dev tools ruff 0.16.10, ty 0.0.85); uv sync built and installed the package; a separate project with a path dependency on the Component imported it.
                decisions:
                - unset: Dependency version specifiers
                  chosen: Lower bounds at the resolved versions, exact versions recorded in the lock file
                  why: Keeps the library compatible with a consumer's own resolution while the lock stabilizes concrete versions.
                - unset: Python requirement and build backend
                  chosen: Python 3.14 or newer; uv's build backend with the package at the Component root
                  why: Development default language is Python with uv; the Component directory and package share the name model.
                - unset: Ignoring generated environment artifacts
                  chosen: A Component-local ignore file for the virtual environment and caches
                  why: Keeps cached and compiled artifacts out of the Component's tracked output without touching files outside it.
            P1-G1-T02:
              id: P1-G1-T02
              source_id: '002'
              title: Bring the finished source to the quality standards
              description: Once all Model source exists, make it conform to the selected language's formatting, lint, and static type-checking standards without changing Model meaning.
              reason: Quality standards are a Development obligation, and failing checks would block downstream Components.
              inputs:
              - Completed Model source
              - Development language quality standards
              skills: []
              expected_result: The complete Model source passes the formatting, lint, and static type-checking standards.
              depends_on:
              - P1-G7-T03
              constraints: []
              acceptance: Formatting, lint, and static type checks over the complete Model source report no violations.
              status: done
              log:
              - at: '2026-10-07T23:24:31Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:25:44Z'
                transition: claimed -> done
                note: 'Brought all Model source to the selected quality standards: formatter, linter and type checker now report nothing for the complete Component. Fixes were limited to ordering of exported names, quoted annotations, exception kinds for wrong input types, a verbose decimal literal in two generated Entities, and type-narrowing changes; no Model meaning changed.'
                evidence:
                  locations:
                  - model/pyproject.toml
                  - model/model/
                  observed: 'ruff format: 25 files unchanged; ruff check: all checks passed; ty check: all checks passed. Earlier behaviour checks (construction, assignment, definition checks, JSON round trip, storage mapping, interface surface, side-effect freedom, one row per Entity) were rerun afterwards and still passed.'
                decisions:
                - unset: Exception kind for a wrongly typed JSON root or text form
                  chosen: TypeError (wrapped by the Field-level conversion error where a Field is involved)
                  why: The linter's rule asks for TypeError on invalid type and it is the more accurate kind.
        P1-G2:
          id: P1-G2
          title: Declaration and Field Types
          description: 'The shared public vocabulary every Entity is described in: the closed set of Field Types and the immutable Declaration records for Entities and their Fields.'
          area: Declaration contract and Field Type set
          does: Every Entity can be described by a complete, structurally valid, immutable Declaration over a closed set of Field Types.
          constraints: []
          task_count: 3
          tasks:
            P1-G2-T01:
              id: P1-G2-T01
              source_id: '002'
              title: Realize the closed Field Type set
              description: Provide the closed set of Field Types with each Type's language and JSON realization from the selected language profile, and refuse any Type outside the set.
              reason: Declarations, validation, conversion, and storage all depend on one agreed set of Types.
              inputs:
              - Model Field Type set
              - Selected language's Type realizations
              skills: []
              expected_result: Each Field Type has a defined value form in the language and in a JSON Object, and an unknown Type is refused instead of guessed.
              depends_on:
              - P1-G1-T01
              constraints: []
              acceptance: Each Field Type resolves to its defined language and JSON forms, a float rejects non-finite values, a datetime rejects a value without timezone information, and a Type outside the set is refused.
              status: done
              log:
              - at: '2026-10-07T23:14:31Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:15:38Z'
                transition: claimed -> done
                note: 'Created the private Field Type realization: the closed set of nine Field Types with their Python and JSON forms, strict exact-type matching, JSON encode/decode for decimal, datetime, date, time and uuid, and refusal of any unknown Type.'
                evidence:
                  locations:
                  - model/model/core/_types.py
                  observed: 'Smoke run: integer rejects bool, float rejects int and NaN, datetime rejects naive values, date rejects datetime, and an unknown Type name raises UnknownFieldTypeError.'
                decisions:
                - unset: How a float Field is kept free of implicit int coercion
                  chosen: A before-validator annotation that accepts only float values
                  why: The validation library otherwise accepts integers for float Fields, which Model forbids as implicit coercion.
              - at: '2026-10-07T23:17:06Z'
                transition: done (unchanged)
                note: Amended the float annotation so it also rejects non-finite values, because the modeling package's Field has no finite-number option.
                evidence:
                  locations:
                  - model/model/core/_types.py
            P1-G2-T02:
              id: P1-G2-T02
              source_id: '002'
              title: Realize the immutable Declaration records
              description: Provide the public Entity Declaration, Field Declaration, Relation, Uniqueness Constraint, and Index records as immutable records with ordered immutable collections and no runtime behaviour.
              reason: Entity meaning must be written once and read by every consumer through one structured public record.
              inputs:
              - Model Declaration contract
              - Closed Field Type set
              skills: []
              expected_result: A Declaration can be created for any Entity and exposes every property of the Model Declaration contract.
              depends_on:
              - P1-G2-T01
              constraints: []
              acceptance: A created Declaration exposes every property of its Entity and Field contract, distinguishes an absent Default Value from an explicit null, and refuses every attempt to change it.
              status: done
              log:
              - at: '2026-10-07T23:15:38Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:15:54Z'
                transition: claimed -> done
                note: 'Created the public Declaration contract: FieldType, ValueGeneration and Sensitivity vocabularies, an ABSENT marker distinct from an explicit null default, and frozen records for field constraints, Field Declaration, Relation, Uniqueness Constraint, Index and Entity Declaration with ordered tuple collections and no behaviour.'
                evidence:
                  locations:
                  - model/model/core/declaration.py
                  observed: 'Smoke run: a Declaration built from the records exposes its members, ABSENT survives copy, deepcopy and pickle as the same marker, and assigning to a Declaration or Field Declaration raises FrozenInstanceError.'
                decisions:
                - unset: Shape of the Uniqueness Constraint, Index and Primary Key members
                  chosen: Uniqueness Constraint and Index each hold an ordered tuple of Field names; the Primary Key holds the single Field name
                  why: The Model contract names ordered Field combinations and a Primary Key that names the Identity Field, and Preferences fix only the member names of the Entity Declaration and Relation.
                - unset: How a Field without a stated description is recorded
                  chosen: The description is None
                  why: The Target gives no purpose for the Identity Field, and Model preserves only what the Target declares.
            P1-G2-T03:
              id: P1-G2-T03
              source_id: '002'
              title: Enforce Declaration structural rules at creation
              description: Check each structural rule of the Declaration contract when a Declaration is created, and fail on an invalid or contradictory Declaration instead of repairing it.
              reason: Entities must never be built from a Declaration that contradicts itself.
              inputs:
              - Declaration structural rules
              - Immutable Declaration records
              skills: []
              expected_result: Only structurally valid Declarations can be created.
              depends_on:
              - P1-G2-T02
              constraints: []
              acceptance: Creating a Declaration that breaks any structural rule of the Declaration contract is refused, and creating a valid Declaration succeeds.
              status: done
              log:
              - at: '2026-10-07T23:15:54Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:16:43Z'
                transition: claimed -> done
                note: 'Added creation-time structural checks to the Declaration records: Type, Sensitivity Marker and Value Generation membership, positive size on string Fields only, Default Value matching Type and nullability and never coexisting with Value Generation, unique Field names, Primary Key naming id, id non-nullable and immutable, is_active a non-nullable mutable boolean, known and non-repeated Relation, Uniqueness Constraint and Index Fields, no duplicate entries. Violations raise DeclarationError without echoing values.'
                evidence:
                  locations:
                  - model/model/core/declaration.py
                  observed: 'Smoke run: a valid Declaration was accepted and 19 distinct invalid constructions were each refused with DeclarationError.'
                decisions:
                - unset: Whether a size limits a string to a maximum or an exact length
                  chosen: A maximum length
                  why: The Target gives only a size for a code string and Model says a size is a positive length; a maximum is the usual meaning of a string size.
                - unset: How structural violations are reported
                  chosen: A dedicated DeclarationError (a ValueError) that names the Entity or Field but never a value
                  why: Failures must be explicit and must not expose values that may be sensitive.
        P1-G3:
          id: P1-G3
          title: Entity runtime behaviour
          description: 'The private shared behaviour every Entity inherits: strict validation, assignment rules, identity handling, generated values, and protection of sensitive values in diagnostics.'
          area: Entity validation and Value Generation
          does: Every Entity enforces its Field contracts identically on construction and mutation and supplies its generated values as declared.
          constraints: []
          task_count: 7
          tasks:
            P1-G3-T01:
              id: P1-G3-T01
              source_id: '002'
              title: Validate every construction strictly
              description: 'Validate the whole Entity on direct construction before any value is set: no implicit coercion, no undeclared Field, Required Fields enforced, and every default validated against its Field.'
              reason: One strict construction contract stops the data from being changed or invented on the way in.
              inputs:
              - Entity Declaration
              - Closed Field Type set
              skills: &id001
              - sqlmodel
              expected_result: Construction accepts only values that satisfy the Field contracts.
              depends_on:
              - P1-G2-T03
              constraints: []
              acceptance: Constructing an Entity with a wrongly typed value, an undeclared Field, or a missing Required Field is refused, while valid values construct it and supplied false, zero, empty string, and null stay as supplied.
              status: done
              log:
              - at: '2026-10-07T23:16:43Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:17:05Z'
                transition: claimed -> done
                note: 'Created the private Base for every Entity: strict configuration (no coercion, undeclared Fields forbidden, defaults validated) and a construction path that validates the whole Entity before any value is set, then hands the validated values to the modeling package.'
                evidence:
                  locations:
                  - model/model/core/_base.py
                  observed: 'With a throwaway table model: wrong types, an undeclared Field, a missing Required Field, an over-size string, bool for integer, text for integer, int and infinity for float, float for decimal and a naive datetime were each refused (10 cases); valid construction succeeded and false, 0, empty string and null stayed as supplied.'
                decisions:
                - unset: How validation of a table model runs on construction
                  chosen: Validate through the modeling package's validator on a blank probe instance, then pass the validated values to the normal initializer; the blank instances the package itself creates skip this
                  why: Table models skip validation on construction, and re-entering model_validate from the initializer would recurse.
            P1-G3-T02:
              id: P1-G3-T02
              source_id: '002'
              title: Validate assignment atomically
              description: Refuse assignment to an immutable Field, and validate the whole Entity with the new value before applying any other assignment, keeping the previous value when validation fails.
              reason: Mutation must obey the same Field contracts as construction without ever leaving an Entity half-changed.
              inputs:
              - Strict construction validation
              skills: *id001
              expected_result: Assignment to a mutable Field is validated atomically and an immutable Field cannot change.
              depends_on:
              - P1-G3-T01
              constraints: []
              acceptance: Assigning to an immutable Field is refused, a valid assignment to a mutable Field takes effect, and an invalid assignment is refused and leaves the previous value unchanged.
              status: done
              log:
              - at: '2026-10-07T23:17:06Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:15Z'
                transition: claimed -> done
                note: Assignment to a declared Field now refuses an immutable Field, and otherwise validates the whole Entity with the new value before applying it, so a failed assignment keeps the previous value.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  - model/model/core/_types.py
                  observed: 'Throwaway table model: assigning the immutable id was refused; a valid name assignment took effect; an over-size and a wrong-typed assignment were refused and the earlier value remained; an undeclared attribute was refused.'
                decisions:
                - unset: Where assignment validation applies
                  chosen: Assignment to declared Fields only; the modeling package's own internal attributes pass through
                  why: Persistence internals must keep working while every Field assignment obeys its Field contract.
            P1-G3-T03:
              id: P1-G3-T03
              source_id: '002'
              title: Refuse hashing of mutable Entities
              description: Make a mutable Entity not hashable.
              reason: A mutable Entity must not be usable as a stable key.
              inputs:
              - Strict construction validation
              skills: *id001
              expected_result: Attempting to hash a mutable Entity fails.
              depends_on:
              - P1-G3-T01
              constraints: []
              acceptance: Attempting to hash a mutable Entity is refused.
              status: done
              log:
              - at: '2026-10-07T23:17:06Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:15Z'
                transition: claimed -> done
                note: Declared the shared Base unhashable so no mutable Entity can be hashed.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  - model/model/core/_types.py
                  observed: 'Throwaway table model: hash() raised TypeError; the table model was still usable with a session in an earlier probe.'
            P1-G3-T04:
              id: P1-G3-T04
              source_id: '002'
              title: Verify an Entity against its Declaration when it is defined
              description: When an Entity type is defined, check that its type name and table name equal the Entity's physical name and that its Fields are exactly those of its Declaration in the same order, and fail loading on a mismatch.
              reason: The Declaration is the only source of Entity meaning, so a type that drifts from it must never load.
              inputs:
              - Entity Declaration
              - Strict construction validation
              skills: *id001
              expected_result: An Entity type that disagrees with its Declaration cannot load.
              depends_on:
              - P1-G3-T01
              - P1-G2-T03
              constraints: []
              acceptance: Defining an Entity type whose name, table name, or Field set or order differs from its Declaration fails loading, while a matching type loads.
              status: done
              log:
              - at: '2026-10-07T23:17:06Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:16Z'
                transition: claimed -> done
                note: When a table Entity type is defined, Base checks that a Declaration exists, that the type name and table name equal the Entity's physical name, and that the type's Fields equal the Declaration's Fields in the same order; a mismatch raises DefinitionError and the type does not load. The Declaration is also read-only on the type.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  - model/model/core/_types.py
                  observed: Five throwaway definitions (wrong type name, wrong table name, wrong Field order, missing Field, no Declaration) each raised DefinitionError before any table was built; a matching definition loaded; replacing the Declaration with a different one was refused.
                decisions:
                - unset: Where the definition-time check runs
                  chosen: In the metaclass initializer, before the table is built
                  why: The modeling package records the table setting only after the class is created, and the check must stop loading before any table exists.
                - unset: How an Entity's physical name is derived
                  chosen: PascalCase of the alphanumeric words of the logical name
                  why: Model Preferences select PascalCase for Entity names and the Target's logical names are spaced words.
            P1-G3-T05:
              id: P1-G3-T05
              source_id: '002'
              title: Keep Auto Increment values pending
              description: Leave an omitted Auto Increment Field in an explicit pending state without making it nullable, and refuse a caller-supplied value for it at construction and at assignment unless the Target permits one; Model never assigns the value.
              reason: Value assignment belongs to storage, so callers must not choose these values.
              inputs:
              - Strict construction validation
              - Atomic assignment validation
              skills: *id001
              expected_result: An Auto Increment Field is pending until storage assigns it and cannot be set by a caller.
              depends_on:
              - P1-G3-T02
              constraints: []
              acceptance: An Entity built without its Auto Increment value holds a pending value while the Field stays non-nullable, and supplying a value for that Field at construction or assignment is refused.
              status: done
              log:
              - at: '2026-10-07T23:19:16Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:41Z'
                transition: claimed -> done
                note: Base now leaves an omitted Auto Increment Field in its pending state (None, with the Declaration still non-nullable) and refuses any caller-supplied value for it, including null, at construction and at assignment; Model never assigns it.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  observed: 'Throwaway table model: an Entity built without id kept id as None; constructing with id=3, constructing with id=None, and assigning id=5 were each refused with a ValueError naming the Field.'
                decisions:
                - unset: Whether an explicit null for an Auto Increment Field counts as supplying a value
                  chosen: Yes, any supplied key is refused
                  why: Model says a caller-supplied value is refused; omission is the only way to leave the value pending.
            P1-G3-T06:
              id: P1-G3-T06
              source_id: '002'
              title: Produce Generated Identifiers at creation
              description: Supply a fresh identifier at Entity creation for a Field declared with a Generated Identifier, using the algorithm Model Preferences select, and leave every other Field unaffected.
              reason: The Value Generation contract offers this form to any Entity that declares it.
              inputs:
              - Strict construction validation
              - Model Preferences Generated Identifier selection
              skills: []
              expected_result: An Entity that declares a Generated Identifier receives one when it is created.
              depends_on:
              - P1-G3-T01
              constraints: []
              acceptance: An Entity declaring a Generated Identifier receives a distinct identifier of the Field's Type at creation, and a Field without that declaration receives none.
              status: done
              log:
              - at: '2026-10-07T23:17:06Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:16Z'
                transition: claimed -> done
                note: Base supplies a fresh Generated Identifier at creation for every declared Generated Identifier Field the caller left out (a uuid for uuid Fields, its text for string Fields) using the selected uuid4 algorithm; Fields without that declaration are untouched and a caller-supplied identifier is kept.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  - model/model/core/_types.py
                  observed: 'Throwaway table model with a Generated Identifier id: two creations received distinct UUIDs and a supplied id was kept.'
                decisions:
                - unset: Whether a caller may supply a Generated Identifier
                  chosen: A supplied value is accepted and validated; only an omitted one is generated
                  why: Model refuses caller values only for Auto Increment, and JSON reconstruction must be able to supply an existing identifier.
            P1-G3-T07:
              id: P1-G3-T07
              source_id: '002'
              title: Protect sensitive values in diagnostics
              description: Replace the input of a Field that carries a Sensitivity Marker in every validation message, never chain or expose the original message holding the value, and keep the actual value unchanged in Entity state.
              reason: A marker records what a value means and its only effect is keeping the value out of diagnostics.
              inputs:
              - Strict construction validation
              - Recognized Sensitivity Markers
              skills: []
              expected_result: Validation messages never reveal the value of a marked Field.
              depends_on:
              - P1-G3-T01
              constraints: []
              acceptance: A validation failure on a marked Field reports no part of the supplied value, and a valid marked value is stored and read back unchanged.
              status: done
              log:
              - at: '2026-10-07T23:17:06Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:19:16Z'
                transition: claimed -> done
                note: Validation failures that involve a Field carrying a Sensitivity Marker report the redacted marker instead of the supplied value and are raised without chaining the original error; failures on other Fields are unchanged and the actual value stays unchanged in Entity state.
                evidence:
                  locations:
                  - model/model/core/_base.py
                  - model/model/core/_types.py
                  observed: 'Throwaway Entity with a password-marked Field: an over-size value produced a ValidationError containing no part of the value and a redaction marker, with no chained cause; an error on an unmarked Field kept its normal text; a valid marked value was stored unchanged.'
                decisions:
                - unset: What replaces a sensitive input in a diagnostic
                  chosen: The text [redacted], keeping the error type and location
                  why: Diagnostics stay actionable without exposing the value.
        P1-G4:
          id: P1-G4
          title: JSON conversion
          description: The shared public Foundation contract converting any Entity to and from JSON text.
          area: Foundation Conversion
          does: Every Entity round-trips through JSON text without loss.
          constraints: []
          task_count: 2
          tasks:
            P1-G4-T01:
              id: P1-G4-T01
              source_id: '002'
              title: Convert an Entity to JSON text
              description: Give every Entity a conversion that produces JSON text with one root object whose keys are exactly its Field names in Declaration order, with values following their Types and a pending Auto Increment value written as null.
              reason: Consumers need one portable, lossless representation of an Entity.
              inputs:
              - Field Type JSON forms
              - Strict construction validation
              skills: *id001
              expected_result: Any Entity can be written as standard JSON text.
              depends_on:
              - P1-G3-T01
              constraints: []
              acceptance: The produced text is standard JSON with one root object whose keys equal the Field names in Declaration order, decimal and datetime values keep their exact value in their text forms, and null, false, zero, and empty string remain distinct.
              status: done
              log:
              - at: '2026-10-07T23:19:42Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 003) before changing the result.
              - at: '2026-10-07T23:20:04Z'
                transition: claimed -> done
                note: 'Created Foundation, the public shared contract every Entity extends, with a to_json conversion producing standard JSON text: one root object, keys exactly the Field names in Declaration order, decimal as exact text, datetime/date/time as ISO 8601 text (datetime with offset), uuid as text, a pending Auto Increment value as null, and null, false, zero and empty string kept distinct.'
                evidence:
                  locations:
                  - model/model/core/foundation.py
                  observed: 'Throwaway table model with one Field of every Field Type: the text parsed as one object with keys in Declaration order, the 29-digit decimal kept its exact text, the +03:30 offset and microseconds were kept, false/0/empty string/null stayed distinct, and the pending id was null.'
            P1-G4-T02:
              id: P1-G4-T02
              source_id: '002'
              title: Build an Entity from JSON text
              description: Give every Entity a conversion that rejects malformed text, a repeated key, a non-standard constant, and a root that is not one object, decodes decimal, datetime, date, time, and uuid values by each Field's Type, and then builds the Entity under the same rules as direct construction.
              reason: A lossless round trip requires reconstruction to be as strict as construction.
              inputs:
              - JSON text conversion
              - Strict construction validation
              skills: *id001
              expected_result: An Entity can be rebuilt from the JSON text it produced, and invalid text is refused.
              depends_on:
              - P1-G4-T01
              constraints: []
              acceptance: Malformed text, a repeated key, a non-standard constant, and a root that is not one object are each refused, and converting any Entity to JSON text and back yields an Entity with identical Field values.
              status: done
              log:
              - at: '2026-10-07T23:20:04Z'
                transition: todo -> claimed
