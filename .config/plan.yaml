        P3-G7:
          id: P3-G7
          title: Entity Service Interface
          description: 'The gateway callers import from: everything a caller needs to call Actions, build requests, read results and catch errors without importing Model, Storage or Database. It publishes its own two groups, Service and Model, under the configured names, and the four groups Storage''s Interface republishes, and nothing else.'
          area: Entity Service Interface
          does: A caller reaches every Child Service, every bound Entity and the four Database groups through one exact Interface and nothing else.
          constraints: []
          task_count: 8
          tasks:
            P3-G7-T01:
              id: P3-G7-T01
              source_id: 008
              title: Publish the Service group of Child Services
              description: Publish, under the configured group name, a group holding exactly one Child Service for every Entity in Model's Entity Collection, each under its Entity's name, with names that are valid and collide with nothing in the group.
              reason: A caller selects an Entity once by selecting its Child Service.
              inputs:
              - Child Services
              - Model Entity Collection
              skills: []
              expected_result: The Service group holds every Child Service.
              depends_on:
              - P3-G6-T01
              - P3-G6-T02
              - P3-G6-T03
              - P3-G6-T04
              - P3-G6-T05
              - P3-G6-T06
              - P3-G6-T07
              - P3-G6-T08
              - P3-G6-T09
              - P3-G6-T10
              - P3-G6-T11
              - P3-G6-T12
              - P3-G6-T13
              - P3-G6-T14
              - P3-G6-T15
              - P1-G7-T02
              constraints: []
              acceptance: The group holds one Child Service for every Entity of the Collection in Collection order and no other, creating one from the group yields a Service bound to that Entity, and a change in the Collection changes the group without a manual edit.
              status: done
              log:
              - at: '2026-10-08T03:08:02Z'
                transition: todo -> claimed
                note: Claimed by Develop (execution 009) before changing the result.
              - at: '2026-10-08T03:08:42Z'
                transition: claimed -> done
                note: Published the Service group as a namespace class named Service holding one Child Service class for every Entity in Model's Entity Collection, under the Entity's name, in Collection order.
                evidence:
                  locations:
                  - logic/logic/services/entity/interface.py
                  observed: The group holds 15 Child Services in the same order as the Collection and no other; each is creatable and bound to its Entity; the names are valid and unique within the group; regenerating from the Collection reproduced the stored unit exactly, and shortening the Collection by one removed that Entity from the regenerated group without a manual edit.
                decisions:
                - unset: How the Interface unit is produced
                  chosen: Emitted deterministically from Model's Entity Collection by a throwaway generator kept outside the repository, importing every Child under a private alias
                  why: The groups must follow the Collection without a hand-written list, and private aliases keep the Child classes out of the published names.
            P3-G7-T02:
              id: P3-G7-T02
              source_id: 008
              title: Publish the Model group of bound Entities
              description: Publish, under the configured group name, a group holding the Entity each Child Service binds, under the same name as its Child Service, as the original object Model's Interface publishes.
              reason: A caller builds an Entity without importing Model.
