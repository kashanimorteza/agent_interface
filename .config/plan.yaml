                  note: "Wrote the API documentation with the sections its Preferences define, in order (overview, configuration, groups, setup, use, verify, troubleshooting): what the API is with one request example, every runtime Configuration value and how the Base URL is formed from it, every Group beneath its segment with a link to its own documentation, how to install, prepare, and start the API, how a client reaches a Group, a runnable script that shows every listed Group is served beneath its segment and nothing else is, and real problems with their fixes."
