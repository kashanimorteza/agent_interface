                  decisions:
                    - unset: "How a Target Initial Data record becomes a complete Entity-compatible mapping."
                      chosen: "Every Field of the Entity except the one storage generates, in Declaration order: the value the Target gives, otherwise the Declaration's default, otherwise null; decimals as exact text, floats as numbers, booleans as booleans. This choice applies to every Initial Data Task."
