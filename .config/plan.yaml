# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/plan.yaml"
  path_note: "Mutable Plans, Groups, Tasks, counts and progress."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current Plan Component and the active operation's ownership rules."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read task_count, then the Plan selected by stable Target phase identifier, with its Groups and Tasks in nesting order."
  selection: "A requested phase resolves to the Plan keyed by that phase identifier; a Task resolves within its containing Group and Plan."
  absence: "No matching Plan means no current planning record exists for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "task_count"
  - "plans"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  task_count: "Total number of stored Tasks."
  plans: "Current phase Plans and their Groups and Tasks."

# <!--------------------------------------------------------------------------------- Content -->
content:
  task_count: 24
  plans:
    P1:
      id: P1
      title: Model
      order: 1
      target: Model
      does: Deliver the independent Model layer as a reusable package that realizes every Target-defined Entity with its Fields, relationships, and rules, published through its Interface and documented for consumers.
      constraints: []
      task_count: 24
      groups:
        P1-G1:
          id: P1-G1
          title: Component package
          description: The reusable library package that holds everything else in the phase.
          area: Component packaging
          does: The Model Component exists as a self-contained reusable package whose dependencies are resolved and recorded.
          constraints: []
          task_count: 1
          tasks:
            P1-G1-T1:
              id: P1-G1-T1
              source_id: '003'
              title: Establish the Model package
              description: Create the Model Component as a self-contained reusable library with its dependency manifest and isolated environment, ready to receive its Core, Entities, and Interface.
              reason: Every other Task builds inside this package, and consuming Components depend on it as a project-internal dependency.
              inputs:
              - The Model Component identity and technical profile
              - The shared Development defaults for the selected language
              skills: []
              expected_result: An empty but buildable and installable Model package whose dependencies are resolved to concrete compatible versions and recorded in its lock metadata.
              depends_on: []
              constraints: []
              acceptance: The package installs into a clean isolated environment, its dependencies resolve to concrete versions recorded in lock metadata, and importing the package succeeds without any side effect.
              status: done
              log:
              - at: '2026-10-08T04:17:09Z'
                execution: '004'
                status: claimed
                note: Claimed; dependencies none.
              - at: '2026-10-08T04:17:29Z'
                execution: '004'
                status: done
                note: 'Created the Model Component directory with a flat-layout library package, manifest, lock metadata and an isolated environment; dependencies resolved to concrete versions (sqlmodel 0.0.48, sqlalchemy 2.1.4, pydantic 2.14.0; dev: ruff 0.16.10, ty 0.0.85) on CPython 3.14.4. Root ignore file already covers the isolated environment and bytecode, so no ignore entry was added.'
                evidence:
                - model/pyproject.toml
                - model/uv.lock
                - model/model/__init__.py (empty package entrypoint)
                - uv sync/add completed and built the package
                decisions:
                - unset: Build backend and package layout
                  chosen: uv_build with flat layout (module-root empty) so the package directory sits directly in the Component directory
                  why: Matches the Directory Structure (Component directory containing the package directory) and the uv package manager selected by Development.
                - unset: Python version bound
                  chosen: requires-python >=3.14
                  why: Language version is latest-compatible; the dependencies resolve and install on 3.14.
                - unset: Placement of quality tools
                  chosen: ruff and ty in the dev dependency group
                  why: They are Development-selected tools, not runtime dependencies.
        P1-G2:
          id: P1-G2
          title: Core
          description: 'The shared behaviour and contracts that serve every Entity rather than one: Declaration, Field Type realization, validation, storage mapping, and JSON conversion.'
          area: Core
          does: Every Entity can be defined by extending one shared foundation that validates its values, maps to table-ready storage, and converts to and from JSON text.
          constraints: []
          task_count: 5
          tasks:
            P1-G2-T1:
              id: P1-G2-T1
              source_id: '003'
              title: Provide the Declaration contract
              description: Provide the public, immutable Entity Declaration and Field Declaration records, including Relation, Uniqueness Constraint, Index, Sensitivity, Value Generation, and Field Constraints, whose structural rules are checked when a Declaration is created.
              reason: Entity meaning is written once in a Declaration and read by every Entity and every consumer.
              inputs:
              - The Declaration structure defined for Model
              skills: []
              expected_result: Declarations can be created from valid inputs and expose every Entity and Field property; an invalid or contradictory Declaration cannot be created.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: A valid Entity Declaration exposes its name, description, ordered Fields, Primary Key, Relations, Uniqueness Constraints, and Indexes, and each Field Declaration exposes its full property set; neither can be modified after creation; and duplicate Field names, a Primary Key other than the Identity, a default coexisting with Value Generation, a size on a non-string Field, a Relation naming an unknown local Field, and an empty or duplicated constraint or index are each rejected.
              status: done
              log:
              - at: '2026-10-08T04:17:29Z'
                execution: '004'
                status: claimed
                note: Claimed; dependency P1-G1-T1 done.
              - at: '2026-10-08T04:23:26Z'
                execution: '004'
                status: done
                note: Provided the public Declaration contract as immutable records (Entity Declaration, Field Declaration, Relation, Field Constraints) with the Sensitivity, Value Generation and Field Type sets; structural rules are checked on creation and refuse invalid or contradictory input. Formatted, linted and type-checked with the Development-selected tools; exercised once with representative valid and invalid records.
                evidence:
                - model/model/core/declaration.py
                - ruff format/check and ty check passed
                - 'invalid records refused: duplicate Field names, non-id Primary Key, default with generation, size on non-string, unknown Relation field, empty and duplicate constraint or index, null default on non-nullable'
                decisions:
                - unset: Public symbol names for the Declaration records
                  chosen: Declaration for the Entity Declaration record (the language symbol Preferences select), FieldDeclaration, Relation, FieldConstraints, plus ABSENT for an undeclared Default Value
                  why: Preferences fix Declaration and its Entity and Relation member names only; the remaining names follow the Architecture vocabulary.
                - unset: Field Declaration member names and the shape of constraints, uniqueness and index entries
                  chosen: name, type, nullable, description, default, sensitivity, immutable, constraints, value_generation; constraints hold size only; unique_constraints and indexes are tuples of Field-name tuples
                  why: Names come from the Architecture Declaration tree; size is the only constraint the Target uses.
                - unset: Description of a Field whose Target definition states no Purpose
                  chosen: Field description is nullable
                  why: The Target gives the id Field no Purpose and the Model must not invent meaning.
                - unset: Error kinds
                  chosen: Built-in ValueError and TypeError, no custom error types
                  why: Model Preferences turn error handling off.
            P1-G2-T2:
              id: P1-G2-T2
              source_id: '003'
              title: Realize the Field Types
              description: Realize each member of the closed Field Type set as a value representation in the selected language and as a JSON representation, and refuse every other Type.
              reason: Fields need one exact, shared meaning for each Type in the language and in JSON.
              inputs:
              - The closed Field Type set
              - The selected language profile for Model
              skills:
              - sqlmodel
              expected_result: Every Field Type has exactly one language representation and one JSON representation, and an unknown Type stops generation.
              depends_on:
              - P1-G1-T1
              constraints: []
              acceptance: Each Field Type resolves to its representation, a decimal keeps its exact value, a datetime is always timezone-aware, a float rejects non-finite values, and an unrecognized Type is refused with a report instead of being guessed.
              status: done
              log:
              - at: '2026-10-08T04:17:29Z'
                execution: '004'
                status: claimed
                note: Claimed; dependency P1-G1-T1 done.
              - at: '2026-10-08T04:23:26Z'
                execution: '004'
                status: done
                note: Realized the closed Field Type set (string, integer, float, decimal, boolean, datetime, date, time, uuid) with strict Python value rules (finite float, finite exact decimal, timezone-aware datetime, bool not an integer) and the JSON forms (decimal and uuid as text, datetime/date/time as ISO 8601); any other Type is refused with a message naming the known Types. Checked with ruff and ty and exercised once.
                evidence:
                - model/model/core/_types.py
                - ruff format/check and ty check passed
                - unknown Type text refused; NaN float, bool integer and naive datetime rejected; decimal 1.10 round-trips to the same text
                decisions:
                - unset: Where the Field Type set lives
                  chosen: Defined in the private realization module and re-exported by the public Declaration
                  why: Keeps one definition while the Declaration remains the public contract that publishes it.
            P1-G2-T3:
              id: P1-G2-T3
              source_id: '003'
              title: Provide shared Entity validation
              description: Provide the private shared behaviour that validates every Entity strictly on construction, on assignment, and when its type is loaded, and keeps mutable Entities unhashable.
              reason: One validation behaviour stops package-specific conventions from changing how Entities accept data.
              inputs:
              - The Declaration contract
              - The realized Field Types
              skills:
              - sqlmodel
              expected_result: Every Entity built on this behaviour enforces its Field contracts identically however it is constructed or changed.
              depends_on:
              - P1-G2-T1
              - P1-G2-T2
              constraints: []
              acceptance: Construction with an undeclared Field, a wrongly typed value, or a missing Required Field is rejected without implicit coercion; assigning an immutable Field is refused; a failed assignment keeps the prior value; mutable Entities are not hashable; validation messages replace the input of a Sensitivity-marked Field; and loading an Entity whose type name, table name, or ordered Fields differ from its Declaration fails.
              status: done
              log:
              - at: '2026-10-08T04:23:26Z'
                execution: '004'
                status: claimed
                note: Claimed; dependencies P1-G2-T1 and P1-G2-T2 done.
              - at: '2026-10-08T04:25:24Z'
                execution: '004'
                status: done
                note: 'Provided the private shared Validation: strict construction (no coercion, no undeclared Field, defaults validated, finite numbers), whole-Entity revalidation on assignment with the prior value kept on failure, refusal of immutable and Auto Increment assignment and of a supplied Auto Increment value, unhashable mutable Entities, a load-time match of type name, table name and ordered Fields against the Declaration, and validation messages that replace the input of Sensitivity-marked Fields (including inside echoed input mappings) without chaining the original error. Exercised once on a throwaway Entity; formatted, linted and type-checked.'
                evidence:
                - model/model/core/_base.py
                - ruff format/check and ty check passed
                - construction rejected unknown Field, wrong Type, missing Required Field, oversize string, naive datetime, NaN, bool as integer; failed assignment kept prior value; sensitive value absent from messages; mismatched type/table name refused at definition
                decisions:
                - unset: How the load-time Declaration match is triggered
                  chosen: On definition of any class that carries its own Declaration
                  why: SQLModel sets the table flag after Pydantic subclass hooks run, so the flag cannot be used to recognise an Entity.
                - unset: Meaning of the physical name used for type and table
                  chosen: The Entity logical name with spaces removed and each word capitalised (PascalCase), used for both the type name and the table name
                  why: Preferences make the table name exactly the Entity physical name and the language names Entities in PascalCase.
                - unset: Where an assigned value is validated
                  chosen: The whole Entity is revalidated by building a candidate from current values plus the new one, before anything is set
                  why: SQLModel sets SQLAlchemy state before Pydantic validation, so only a pre-check keeps the prior value on failure.
                - unset: Refusal of an explicit null for an Auto Increment Field
                  chosen: Any supplied value, including null, is refused at construction
                  why: Principle refuses a caller-supplied value; pending is represented by omission.
            P1-G2-T4:
              id: P1-G2-T4
              source_id: '003'
              title: Provide Storage Mapping
              description: Provide the private, table-ready realization derived only from a Declaration, covering physical names, key, relation, uniqueness and index constraints, the identity column, and exact decimal and UTC datetime values, with every Entity registered in one shared table metadata.
              reason: Consumers create exactly the Entities' Tables from the Entities themselves, while Model never runs storage.
              inputs:
              - The Declaration contract
              - The realized Field Types
              skills:
              - sqlmodel
              expected_result: Any Entity carries a complete table-ready form determined solely by its Declaration.
              depends_on:
              - P1-G2-T1
              - P1-G2-T2
              constraints: []
              acceptance: For a sample Declaration, the table and columns take the Entity and Field names, constraints and indexes follow one deterministic naming convention, a Relation becomes a foreign key to the target table and Field, an Auto Increment Field becomes a generated identity column, a decimal reads back exactly, a datetime reads back timezone-aware in UTC, and the shared table metadata holds only the Entities' own Tables.
              status: done
              log:
              - at: '2026-10-08T04:23:26Z'
                execution: '004'
                status: claimed
                note: Claimed; dependencies P1-G2-T1 and P1-G2-T2 done.
              - at: '2026-10-08T04:25:24Z'
                execution: '004'
                status: done
                note: 'Provided private Storage Mapping derived only from the Declaration: Field options (default, nullability, description, size, primary key, single-Field uniqueness and index, foreign key to the target Entity physical name, identity column for Auto Increment, repr hidden for sensitive Fields), table-level combined uniqueness and indexes, sqlite_autoincrement on tables with an Auto Increment identity, one registry whose table metadata holds only Entity Tables, one constraint naming convention, exact decimal text storage and UTC-normalised timezone-aware datetime storage over DateTime(timezone=True). Exercised once against an in-memory SQLite database.'
                evidence:
                - model/model/core/_storage.py
                - ruff format/check and ty check passed
                - created tables Owner and Thing only; constraints named pk_Thing, fk_Thing_owner_id, uq_Thing_name, uq_Thing_owner_id_name, ix_Thing_owner_id_at; identity assigned on flush; Decimal 1.10 read back exactly; datetime read back as the same instant in UTC
                decisions:
                - unset: Type of the stored datetime column
                  chosen: A private type wrapper over DateTime(timezone=True) that converts to UTC on write and restores UTC awareness on read
                  why: Preferences fix DateTime(timezone=True) and UTC storage with a UTC-aware read back on Engines that drop the offset; the wrapper realizes the read-back.
                - unset: Column type for exact decimals
                  chosen: A private wrapper storing the decimal text in a string column
                  why: Preferences require one fixed column type that stores exact decimal text and returns Decimal on every Engine.
                - unset: Whether the primary key constraint carries its conventional name on SQLite
                  chosen: 'Left to SQLAlchemy: the metadata names it pk_<table>, but SQLite renders an AUTOINCREMENT primary key inline without a constraint name'
                  why: AUTOINCREMENT requires the inline form on SQLite.
            P1-G2-T5:
              id: P1-G2-T5
              source_id: '003'
              title: Provide Foundation conversion
              description: Provide the public shared contract that converts any Entity to JSON text and reconstructs an Entity from that text, building on shared validation.
              reason: Consumers need one portable, lossless value representation of every Entity.
              inputs:
              - Shared Entity validation
              - The realized Field Types
              skills:
              - sqlmodel
              expected_result: Every Entity gains a lossless round trip through JSON text.
              depends_on:
              - P1-G2-T2
              - P1-G2-T3
              constraints: []
              acceptance: An Entity converts to JSON text with one root object whose keys are exactly its Field names in Declaration order, and back to an equal Entity; malformed text, a repeated key, a non-standard constant, and a non-object root are rejected; null, false, zero, and empty string stay distinct; and sensitive values are neither altered nor transformed.
              status: done
              log:
              - at: '2026-10-08T04:25:24Z'
                execution: '004'
                status: claimed
                note: Claimed; dependencies P1-G2-T2 and P1-G2-T3 done.
              - at: '2026-10-08T04:25:54Z'
                execution: '004'
                status: done
                note: 'Provided the public Foundation: Entities convert to JSON text with one root object keyed exactly by their Fields in Declaration order (decimal and uuid as text, datetime/date/time as ISO 8601, null/false/zero/empty string distinct, pending Auto Increment as null) and are rebuilt from that text by decoding each Field by Type and constructing under the ordinary construction rules. Malformed text, repeated keys, non-standard constants and non-object roots are refused. Exercised once on a throwaway Entity with every Field Type; formatted, linted and type-checked.'
                evidence:
                - model/model/core/foundation.py
                - ruff format/check and ty check passed
                - 'one round trip returned identical Field values and identical JSON text; rejected: malformed, repeated key, NaN, Infinity, array root, scalar root, unknown key, supplied id, bad uuid text, naive datetime, number for a decimal, missing Required Field'
                decisions:
                - unset: Handling of a non-null Auto Increment id in JSON text
                  chosen: Refused like any caller-supplied Auto Increment value; null (pending) is accepted by omission
                  why: Principle refuses supplied Auto Increment values and requires JSON construction to follow the construction rules.
                - unset: JSON integer given for a float Field
                  chosen: Accepted as the equal float
                  why: 1 and 1.0 are the same JSON number; the strict Field rule is applied to the decoded float.
                - unset: Error kind for a root that is not an object
                  chosen: TypeError; other malformed text raises ValueError
                  why: Built-in errors only, as error handling is off.
        P1-G3:
          id: P1-G3
          title: Identity and platform Entities
          description: The Entities describing users and the trading platforms they connect through.
          area: Entity
          does: User, Trading Platform, and Instance are available as complete Entities.
