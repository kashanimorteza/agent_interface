        P4-G6:
          id: "P4-G6"
          title: "Entity Group"
          description: "The API Group that gives every Entity of Entity Service one Adapter holding an Endpoint for every Action of that Entity; the Adapters are grouped because each follows the same contract, stated here once: it is permanently bound to its own Entity, has one Endpoint for every Action of its Child Service, and its Handlers only call their Action."
          area: "Entity Group"
          does: "Every Entity that Entity Service presents has exactly one bound Adapter, in Entity Service's order, with an Endpoint for every Action of its Child Service."
          constraints: []
          task_count: 16
          tasks:
            P4-G6-T1:
              id: "P4-G6-T1"
              source_id: "018"
              title: "Establish the Entity Group"
              description: "Establish the Entity Group so that it states its one source, Entity Service, and obtains Entities, Actions, and their public contracts only through Logic Interface, in the shape the API Group Interface Schema defines, under the configured Group name."
              reason: "The Entity Group is the Group that turns Entity Service into Endpoints, and every Adapter needs it to exist."
              inputs:
                - "The Entity Group Definition and Preferences"
                - "The Logic Interface"
              skills:
                - "fastapi"
              expected_result: "The Entity Group exists, names Entity Service as its source, and reaches the application only through Logic Interface."
              depends_on:
                - "P4-G4-T1"
                - "P4-G1-T1"
              constraints: []
              acceptance: "The Entity Group states its source, Adapters, and Endpoints in the shape the API Group Interface Schema defines, and imports nothing for the application except Logic Interface."
              status: "done"
              log:
                - at: "2026-10-06T21:50:12Z"
                  execution: "019"
                  transition: "todo -> claimed"
                  note: "Claimed after P4-G4-T1 and P4-G1-T1 were done. Scope: the Entity Group stating its source, name, role, and Adapters, reaching the application only through Logic Interface."
                - at: "2026-10-06T21:51:15Z"
                  execution: "019"
                  transition: "claimed -> done"
                  note: "Established the Entity Group: its unit states the fixed role, the configured name, its one source (the Entity Service Interface obtained through Logic Interface), and the collection of Adapters it serves, which the Adapter Tasks fill in. It holds no Endpoint of its own."
                  locations:
                    - "api/api/groups/entity/__init__.py"
                  observed: "The Group states role entity, name Entity, and Entity Service from Logic Interface as its source (identity check) with an empty Adapter collection; its imports are the framework router type and Logic Interface only, with no Model or Database import; it holds no function and no Definition or Preferences text; ruff and ty reported no findings."
                  decisions:
                    - unset: "How the Group states its source, Adapters, and Endpoints."
                      chosen: "As module-level statements: the role, the configured name, the source object, and a mapping from Adapter segment to that Adapter's router; the Endpoints are the routes of each Adapter's router."
                      why: "The API Group Interface Schema fixes what a Group states, not the language form; the Group Preferences ask for one module per Adapter holding one router."
                    - unset: "Where the Group unit is placed."
                      chosen: "In the Groups directory, in a directory named by the Group's configured directory, beside its Adapters."
                      why: "Entity Group Preferences name the directory and place each Adapter directly inside it."
