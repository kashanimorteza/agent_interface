              expected_result: Instance is available as a complete Entity extending the shared foundation, with a Declaration that matches the Target.
              depends_on:
              - P1-G2-T1
              - P1-G2-T4
              - P1-G2-T5
              - P1-G3-T1
              - P1-G3-T2
              constraints: []
              acceptance: The Instance Declaration matches the Target definition of Instance in Fields, order, Types, nullability, defaults, and metadata; it relates to User and to Trading Platform, the combination of user_id and name is unique, the optional connection Fields are nullable, and the password and api_key Fields expose a recognized Sensitivity Marker.
              status: done
              log:
              - at: '2026-10-08T04:28:07Z'
                execution: '004'
                status: claimed
                note: Claimed; Core dependencies and the Entities it relates to are done.
              - at: '2026-10-08T04:28:23Z'
                execution: '004'
                status: done
                note: Realized the Instance Entity with every Target Field in order, Relations to User and Trading Platform, combined uniqueness of user_id and name, nullable connection Fields, and sensitivity markers on password and api_key. Formatted, linted, type-checked and imported.
                evidence:
