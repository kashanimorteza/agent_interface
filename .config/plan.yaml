              - Endpoint calls
              - Listing flow
              skills: []
              expected_result: Related record choices usable for any related Field.
              depends_on:
              - P5-G10-T2
              - P5-G2-T7
              - P5-G5-T1
              constraints: []
              acceptance: For a Field described as related, the records offered are those the API returns for the related Entity, requested when the choice is needed; loading is reported while waiting; an error is
                held as returned; the value handed on is the chosen record's value of the related Field; a Field that is not related requests nothing.
              status: done
              log:
              - at: '2026-10-11T18:26:24Z'
                event: claimed
                note: Claimed before changing its result.
              - at: '2026-10-11T18:26:57Z'
                event: decision
                note: A related record is told apart by its value of the related Field followed by its first text Field that is not sensitive ('1 · Default'), and by the value alone when it has none; the Task leaves what a record shows of itself to the owner and nothing in Preferences chose it. Only Fields a user may enter are supplied with choices, so an immutable or generated related Field requests nothing.
              - at: '2026-10-11T18:26:57Z'
                event: done
                note: 'Added the related record choices flow (interaction/related.ts): for the related Fields of a form it requests the related Entity''s list through API Access (reusing the listing request), holds the loading state, the records and a failure per Field, and describes each record. Observed in a real browser against a scratch copy of the API: the Account form requested exactly the group, broker, instance and currency lists when shown, offered the returned records (''1 · Default'' for the group) and, once chosen, held the chosen record''s id as the Field''s value; the User form, which has no related Field, requested nothing. A failed list is held as returned through the same path observed in the listing flow. Typecheck, lint and format check pass.'
        P5-G6:
