      event: "review"
      outcome: "satisfied"
      started_at: "2026-10-07T23:30:43Z"
      completed_at: "2026-10-07T23:38:24Z"
      duration: "7:41"
      open_questions: []
      blockers: []
      report: "Reviewed phase P1 (Model) against its Plan and the Model Review category: two Findings (datetime Python form; undeclared direct dependencies) were recorded, resolved and rechecked. Every Task acceptance and every Model Review observation now holds on current evidence observed in this Review; outcome satisfied. Open Questions OQ-002-1 and OQ-003-1..3 remain with the Human."
      data:
        findings:
          - id: "F-004-1"
            state: "resolved"
            resolution: "The datetime Field Type now resolves to the timezone-aware datetime type (pydantic.AwareDatetime) in the Field Type realization (model/model/core/_types.py, PYTHON_TYPES and the python_type return type); no other behaviour changed."
            recheck: "Re-ran the Field Type comparison with the Preferences table: all nine Python forms and all nine JSON forms match. Re-ran formatter, linter, type checker, every Entity and Core observation and the README examples: no problems."
            task: "P1-G2-T01"
            expected: "Each Field Type resolves to its defined language form. Model Preferences define the datetime Python form as the timezone-aware datetime type (pydantic.AwareDatetime)."
            observed: "The Field Type realization maps the datetime Field Type to the plain datetime.datetime class; python_type('datetime') returns datetime.datetime. Timezone awareness is enforced separately, but the resolved form differs from the defined one."
            evidence: "model/model/core/_types.py line 19 (PYTHON_TYPES['datetime']); observation: a script comparing python_type() of every Field Type with the Preferences types table reported 'datetime: Python form <class datetime.datetime> vs pydantic.AwareDatetime'; all other eight Field Types and all nine JSON forms matched."
          - id: "F-004-2"
            state: "resolved"
            resolution: "pydantic and sqlalchemy are now declared as direct dependencies with lower bounds at the versions the lock already held (2.14.0 and 2.1.4); the lock file was regenerated and resolves to the same concrete versions (pydantic 2.14.0, sqlalchemy 2.1.4, sqlmodel 0.0.48). Changed files: model/pyproject.toml and model/uv.lock."
            recheck: "The dependency checker reports no dependency issues; the lock check passes; a clean copy installs with a locked sync, imports with warnings treated as errors and builds a wheel."
            task: "P1-G1-T01"
            expected: "The package declares the third-party packages its source needs, with concrete versions stabilized (Plan acceptance: dependencies resolve reproducibly; Review dependency check)."
            observed: "pydantic and sqlalchemy are imported directly by the Model source but are not declared in the project's dependencies; only sqlmodel is declared, so the two resolve only as transitive dependencies of sqlmodel."
            evidence: "model/model/core/_base.py line 7, model/model/core/_storage.py lines 9-12, model/model/core/_types.py line 11, model/model/entity/position.py line 6; project dependencies list in model/pyproject.toml; a dependency checker reported 7 'imported but missing from the dependency definitions' issues (pydantic, sqlalchemy)."
        observations:
          - "Testing is disabled for Model, so all runtime verification was transient: scripts written for this Review (not the implementer's checks) compared every Entity Declaration with the Target definition (15 models, all Fields, order, Types, nullability, defaults, sizes, descriptions, Relations, uniqueness; 0 differences), exercised construction, assignment, JSON round trip and storage for every Entity (0 problems), exercised every Core acceptance criterion on synthetic Entities, and checked Interface shape, import graph, hygiene and the README against the Documentation contract."
          - "Technical checks passed: formatter, linter and type checker report nothing; compilation, lock check, wheel build (31 files, no cached or environment artifacts), clean wheel install and import with warnings as errors, and a locked sync of a clean copy all succeeded."
          - "Zero-diff regeneration: re-running the Entity generator and the README composer into temporary folders and formatting reproduced all 15 Entity units and the README identically. The Develop Log Entry 003 states that regeneration produced no difference, but no diff result was recorded at the time; this Review established it independently. The generator is not part of the repository, so a future regeneration relies on Develop reproducing the same output from unchanged authorities."
          - "Model Preferences describe construction validation as running model_validate before initializing; the source validates through the validator on a probe instance for recursion reasons recorded in the Task Log of P1-G3-T01. The behaviour required by the Plan and the Model Review category was observed to hold; the mechanism is outside the review baseline."
          - "Ignored local artifacts (.venv, __pycache__, .ruff_cache) exist in the Component directory; they are excluded by the Component's ignore file and are not part of its tracked output."
          - "Primary key constraint names exist on the shared metadata (pk_<table>); SQLite does not persist a name for an autoincrement primary key, so that name is observed on the metadata rather than on the engine."
