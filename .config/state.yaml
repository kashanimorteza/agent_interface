        task_acceptance: "Acceptance established by direct observation for all 24 Tasks of P1: P1-G1-T1 (clean install, concrete locked versions, side-effect-free import); P1-G2-T1 to T5 (Declaration refusals and immutability, Field Type forms, validation behavior, storage mapping, JSON conversion); P1-G3-T1 to P1-G7-T3 (each Entity against the Target); P1-G8-T1 and T2 (exports and Collection); P1-G9-T1 (documentation structure, completeness, executable examples)."
