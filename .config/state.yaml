            be opened'', which the API correctly sends as 503. The same failure reproduces through Logic alone, with or without a Child Service shared between threads, so it comes from how the Database SQLite
            engine meets SQLite''s writer lock (an immediate ''locked'' result mapped to that error), not from the API. 300 concurrent reads over two workers all succeed. Plan P4 sets no concurrency criterion,
            so this is not a Finding. Should Database make concurrent writes reliable (wait or serialize), given that the API serves requests concurrently with several workers?'
          current_choice: No change; the API forwards Database's error unchanged as the Preferences require.
