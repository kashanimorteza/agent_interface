            question: "The sqlmodel Skill recommends the modeling package's own UTC datetime column type for datetime Fields and warns against an explicit timezone-aware column override. Model Preferences select the timezone-aware datetime column stored in UTC with UTC-aware reads. Should Model Preferences adopt the Skill's alternative?"
            current_choice: "Keep the Preferences choice, realized as a column type that normalizes to UTC on write and re-attaches UTC on read."
          - id: "OQ-003-3"
            question: "The sqlmodel Skill recommends keeping related table models in one file to simplify relationship annotations. Model requires one unit per Entity. Should the structure change?"
            current_choice: "Keep one unit per Entity; Relations are metadata only and no relationship attributes are used, so the Skill's concern does not arise."
