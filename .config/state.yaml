      data:
        phase: "P4"
        findings:
          - id: "020-F1"
            state: "open"
            category: "Definition and Schema do not match"
            baseline: "API Definition, Review observation 1 and the Principle 'API conformance covers every API contract': every need of the Groups layer and every Endpoints Principle in the Definition appears in the API Interface Schema, and the Schema holds nothing beyond them; API is conformant only when the Definition, the Schema, and the real API all match."
            expected: "The API Interface Schema states all four Endpoints Principles of the Definition: Endpoint identity derived from the operation, one placement rule for simple Parameters, one form in which non-simple Parameters travel, and one table mapping Action errors to HTTP."
            observed: "The Schema's endpoints section states the identity rule and the placement rule only. It states neither the form in which non-simple Parameters (Entities, Filters, Orders, Instances, field references) travel, nor the error table (Problem Details form, class name as type, statuses). Both are required by the Definition and are observable in the real API."
            evidence: ".interface/foundation/schema/api-interface.yaml, structure.endpoints (keys source, identity, placement, url) and rules (no_own_surface, unique, contract_change) hold no non-simple-Parameter rule and no error table; .interface/implementation/development/api/api.md, Principles 'Non-simple Parameters travel by one rule' and 'Action errors map to HTTP by one table' state them."
            resolution: "None possible within Review: the Schema and the Definition are Human-owned and the Interface tree is read-only to every Skill. The implementation already realizes both missing rules exactly as the Definition states them (observed below), so nothing in the API needs to change; the Human must either add the two rules to the API Interface Schema (a Schema version change) or decide that the Definition's observation should not require them. Recorded as Blocker 020-B1 and Open Question 020-OQ1."
            recheck: "Not applicable until the Human changes the source; Review will observe the Schema again at its next run."
        blockers:
