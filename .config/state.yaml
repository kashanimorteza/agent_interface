            subject: "Applying a stored identity to an Entity"
            question: "The Database Preferences ask for each row to be built with the Entity's own constructor from all Field values, but the Model refuses a supplied generated identity (open question 006-OQ1). The Database builds the Entity with its own constructor from every other Field and applies the stored identity with the storage layer's own committed-value mechanism, leaving Model untouched. Should the Target permit supplying a generated identity so rows can be built with a single constructor call? Carries 008-OQ1."
            current_choice: "Construct without the generated identity, then apply it through the storage layer's committed-value mechanism."
          - id: "011-OQ2"
            subject: "SQLModel Skill recommendation"
            question: "The sqlmodel Skill recommends SQLModel's session and select API first, and not SQLAlchemy statements. The Engine unit uses SQLModel's engine and the Model's table models but runs SQLAlchemy core insert, update, delete, and select statements, because it needs raw row mappings, explicit atomic transactions including schema changes, and exact-value handling. Should the Engine use the SQLModel session API instead?"
            current_choice: "Keep the core statements."
          - id: "011-OQ3"
            subject: "Exact-decimal storage and query cost"
            question: "Model stores decimals as exact text, so storage cannot compare or add them correctly. The Engine unit therefore evaluates decimal comparisons, ordering, and aggregates in memory on the matching records, which is exact but reads whole tables for decimal queries. Should Model store decimals in a form that storage can compare exactly?"
            current_choice: "Keep Model's text form and decide decimal conditions in the Engine unit."
