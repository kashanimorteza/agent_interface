        open_questions:
          - id: "018-OQ1"
            subject: "The Update Endpoint needs an Entity carrying its stored identity"
            question: "The Entity Service Update Action takes one complete Entity instance whose id locates the record, and the API Definition carries such a Parameter as a JSON object built from the bound class before the Handler runs. Model refuses a supplied generated identity on construction and on JSON reconstruction (open question 006-OQ1), and it makes id immutable once set, so no public way builds an Entity that carries a client-supplied id. The Plan keeps the Update Endpoint as the Definitions state it (every Action has an Endpoint; every Handler only calls its Action). Develop must realize it without changing Model or Logic, and the Human may want to settle 006-OQ1 first. Should the Target permit supplying a generated identity when an Entity is built from an API request?"
            current_choice: "Plan the Adapter Tasks as written; leave the realization of the Update Endpoint to Develop under the API and Model authorities. Carries 006-OQ1."
          - id: "018-OQ2"
            subject: "Entity Service Actions publish untyped Entity and result values"
            question: "The API Group Interface Schema asks every Endpoint's Parameters to carry types the source publishes and its results unchanged. Entity Service Actions annotate the Entity, Field, and result values as untyped (015-OQ1 notes the same loss for the Entity parameter), so the Actions themselves give the API no type for an Entity instance, a Field reference, or a returned Entity. The interactive documentation and request validation can only be as precise as what Develop derives from the bound Entity. Should Logic publish precise types for these values?"
            current_choice: "Plan the Adapter and Endpoint-rule Tasks as written; Develop derives the types from the bound Entity and leaves a result untyped when the Action publishes none."
        notes:
          - "The Endpoint rules are planned once, as shared API behaviour in Group P4-G5, and each Adapter depends on them; they are observable on every Endpoint once the Entity Group exists, and Review establishes them after Development."
          - "Adapters are planned as one Task per Target Entity (15), in Target order, because the Entity Group Definition gives each Entity exactly one Adapter holding one Endpoint for every Action of its Child Service; the Endpoints themselves are not planned one by one because the API Definition derives them from the operations and forbids a hand-kept list."
