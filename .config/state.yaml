        open_questions:
          - id: "008-OQ1"
            subject: "Carrying a stored Auto Increment value into an Entity (follows 007-OQ2, 006-OQ1)"
            question: "The Database builds each returned Entity through its own construction from every Field except the generated one, which validates the row, and then attaches the stored identity with the ORM's public committed-value operation, because the Model refuses a supplied Auto Increment value. Should the Target instead permit supplying an Auto Increment value when materializing a stored row?"
            current_choice: "Keep the committed-value approach; the Entity stays instrumented and its identity stays immutable."
          - id: "008-OQ2"
            subject: "sqlmodel Skill recommends Session and select for loading Entities"
            question: "The Skill recommends SQLModel Sessions and select(Model) so rows load directly as table-model instances. The Database Definition has Engine units return raw results and Core materialize each Entity through its own construction, so the Engine unit runs SQLAlchemy Core statements on the Entities' tables instead. Should the Definition allow Session-loaded Entities?"
            current_choice: "Keep the Definition: raw rows from the Engine unit, materialization in Core."
          - id: "008-OQ3"
            subject: "Precision of decimal comparisons in the storage engine"
            question: "Decimal Fields are stored as exact text, so Filters and Orders on them compare after a cast to a floating-point number in the storage engine, which limits comparison precision to about 15 significant digits; stored and returned values stay exact, and sums, smallest, and largest values are computed exactly. Is that acceptable, or must comparisons also be exact?"
            current_choice: "Numeric cast for comparison and ordering; exact values everywhere else."
          - id: "008-OQ4"
            subject: "Query semantics the Definition leaves open"
            question: "The Definition does not say how the text-matching operators treat letter case, or whether a not-equal condition matches records whose Field is null. The file-backed storage engine matches ASCII letters without regard to case, and a null Field never matches not-equal; the documentation states the null rule and tells readers to use the null tests. Should case-sensitive matching and null-inclusive not-equal be required?"
            current_choice: "Storage-engine behaviour, with wildcard characters in the supplied text matched literally."
          - id: "008-OQ5"
            subject: "The Configuration and Storage sit outside the importable package"
            question: "As the Definition places them at the Component root, the configuration file and the storage directory are not part of the importable package, so a non-editable install of the Database cannot load its Configuration, while the project-internal editable path dependency works. Is a non-editable install expected to work?"
            current_choice: "Support the project-internal editable path dependency, as Development Principles require."
