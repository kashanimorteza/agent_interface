            finding: "020-F1"
            condition: "The Human-owned API Interface Schema lacks two Endpoints Principles the API Definition states, so the Definition's first fixed observation cannot be shown to hold, and API conformance (Definition, Schema, and real API all matching) cannot be established."
            required_operation: "Human edit of the API Interface Schema (or of the Definition's observation); then Review again. No Plan, Develop, or implementation change is required."
