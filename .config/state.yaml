            question: "Foundation reconstruction follows direct construction, which refuses a caller-supplied Auto Increment value, so JSON text of an Entity whose id storage has already assigned cannot be rebuilt (only a pending id round-trips). Should the Target permit supplying Auto Increment values for reconstruction?"
            current_choice: "Refuse a non-null Auto Increment value in JSON text."
