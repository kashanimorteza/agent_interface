          - id: "F-003"
            state: "resolved"
            resolution: "Declared pydantic, pydantic-core and sqlalchemy as dependencies (lower bounds at the resolved versions) and refreshed the lock metadata."
            recheck: "The import scan reports every directly imported third-party package declared and none unused; the lock is consistent and the dependency check of a clean install reports all packages compatible."
