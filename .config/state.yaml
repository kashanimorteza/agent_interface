# <!--------------------------------------------------------------------------------- Meta -->
meta:
  path: ".config/state.yaml"
  path_note: "Mutable Workflow position, Phase progress, and execution Log. Operational Config record at the project root, outside .interface/."

# <!--------------------------------------------------------------------------------- Policy -->
policy:
  agent_may_edit: true
  rule: "Apply the current State Component and the active operation's ownership rules."
  changed_by: "Skills and supporting Agent Instances, each within the records its own Operation owns."
  precedence: "The State Schema and every applicable Principle take precedence over this file."

# <!--------------------------------------------------------------------------------- Resolution -->
resolution:
  consumption: "Read active, then the Phase selected by stable Target phase identifier, then the Log Entries by identifier."
  selection: "A requested phase resolves to the phases entry keyed by that phase identifier; a Log Entry resolves by its identifier."
  absence: "No matching phases entry means no progress is recorded for that phase."

# <!--------------------------------------------------------------------------------- Read_Order -->
read_order:
  - "active"
  - "phases"
  - "log"

# <!--------------------------------------------------------------------------------- Content_Map -->
content_map:
  active: "Current Workflow position."
  phases: "Aggregate progress for each Target phase."
  log: "Recorded Skill executions and their outcomes."

# <!--------------------------------------------------------------------------------- Content -->
