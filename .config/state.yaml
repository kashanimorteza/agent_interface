      report: "Reviewed phase P1 (Model) against its Plan and the Model Review category with independent observations: Target text compared with the published Declarations, behaviour, exactness, storage form, Interface contract, a transient probe of contract areas the Target Entities do not exercise, technical conformance and documentation. Three Findings were recorded and resolved: undeclared direct dependencies (F1), integer coerced for a float Field (F2), missing Declaration-reference check in the Verify script (F3). Outcome satisfied."
      data:
        phase: "P1"
        scope: "Plan P1 (10 Groups, 26 Tasks) and the Model Review category, judged against the generated Model Component."
        findings:
          - id: "F1"
            state: "resolved"
            category: "dependency"
            expected: "Every third-party package the library imports directly is declared as a necessary dependency with its version resolved in lock metadata."
            observed: "The library declares only sqlmodel, but imports pydantic and sqlalchemy directly: model/core/_base.py (pydantic, sqlalchemy), model/core/_storage.py (sqlalchemy), model/core/_types.py (pydantic, sqlalchemy). Both are present only as transitive dependencies of sqlmodel."
            evidence: "model/pyproject.toml, [project] dependencies = [\"sqlmodel>=0.0.48\"]; import analysis of model/model/**/*.py lists pydantic (3 files), sqlalchemy (3 files), sqlmodel (2 files)."
            plan_reference: "P1-G1-T1 (every dependency recorded at a concrete version in lock metadata); P1-G10-T1"
            resolution: "Declared pydantic and sqlalchemy as direct dependencies of the library with their resolved versions (pyproject dependencies and lock file updated); no code changed."
            recheck: "Import analysis of the library now lists pydantic, sqlalchemy and sqlmodel as imported and the same three as declared, none undeclared and none unused; lock file consistent; a clean install from the lock file, import of the Interface (15 Entities) and the package build all succeed."
          - id: "F2"
            state: "resolved"
            category: "behaviour"
            expected: "A float Field accepts only a float: direct construction applies the same no-coercion rule as for every other Type, and agrees with the Declaration contract, which refuses an integer Default Value for a float Field."
            observed: "Asset(broker_id=1, symbol=\"s\", category=\"c\", point_size=1) is accepted and the stored value becomes the float 1.0. Integer, decimal and boolean Fields all refuse a value of another Type."
            evidence: "Reproduction: from model.interface import Asset; Asset(broker_id=1, symbol='s', category='c', point_size=1).point_size == 1.0 and is a float. The strict validator built in model/core/_base.py (_validator_for) uses the library's strict float, which converts an integer."
            plan_reference: "P1-G2-T3 (a value of each Field Type is refused in any other form without coercion); P1-G2-T4"
            resolution: "The shared validation now refuses an integer, including a boolean, for a float Field before the strict check, in model/core/_base.py; a JSON integer for a float Field is still read as that float by the JSON conversion, which converts by Type before construction."
            recheck: "Asset(point_size=1) and point_size=True are refused with a validation error, point_size=1.0 is accepted, assigning an integer is refused and keeps the prior value, and JSON text holding 2 for a float Field rebuilds the Entity with 2.0. The independent Target comparison, the behaviour checks, the transient probe and Develop's verification all pass again; formatter, linter and type checker report nothing."
          - id: "F3"
            state: "resolved"
            category: "missing evidence"
            expected: "The Verify section covers each listed conformance observation, including that each Entity exposes its own actual Declaration (Documentation contract: actual Entity and Declaration references)."
            observed: "The Verify script checks that every export is the actual Entity, but never checks that an Entity's declaration is its own actual Declaration; no other part of the section demonstrates it."
            evidence: "model/README.md, section Verify: the script asserts getattr(interface, entity.__name__) is entity and reads entity.declaration, with no check that the Declaration is the Entity's own member."
            plan_reference: "P1-G9-T2 (verification covers each listed conformance observation)"
            resolution: "Added to the Verify script a check that each Entity holds its own Declaration as the very object it exposes, and named that check in the section's description (model/README.md)."
            recheck: "The documentation was regenerated from the Declarations and differs from the previous one only in those two places; all 12 Python examples run, and the Verify script prints Model verified with the new check in place."
        observations_made:
          - "Compared the Target's Model definitions, parsed from the Target text, with all 15 published Declarations: 124 Fields (names, order, Types, nullability, descriptions, sizes, Defaults, generation), Primary Keys, uniqueness rules, Relations and their targets and Types, name collisions - no differences."
          - "Interface contract: AST of the entrypoint holds only 15 explicit named imports and the collection tuple; public names are exactly the 15 Entities and the collection; exports are the actual Entities; every package initialiser is empty; Core holds exactly the five named files; importing in an empty directory creates no file and starts no thread."
          - "Behaviour of all 15 Entities: valid construction, defaults and pending identity, refusal of unknown Field, wrong Type, missing Required Field, null for non-nullable, immutable id assignment, unhashable, atomic failed assignment, JSON round trip with Declaration key order; exact decimal and microsecond datetime with non-UTC offset through JSON and through storage."
          - "Storage form: shared metadata and naming convention, table and column names, identity column with sqlite autoincrement, unique and foreign-key names, absence of indexes, sized string and datetime and decimal column types, created DDL, stored values read back."
          - "Transient probe with throwaway Entities for what the Target Entities do not exercise: all nine Field Types accepted and refused by form, generated identifier, null/false/zero/empty-string distinctions, rejected JSON forms, redaction of Sensitivity-marked input on construction, assignment, JSON and model_validate paths without error chaining, load-time mismatch and collision refusals, 16 Entity Declaration and 14 Field Declaration refusals."
          - "Technical conformance: formatter, linter and type checker pass; lock file consistent; clean install from the lock file, import and wheel/sdist build succeed with all 15 Entity units in the wheel; documentation structure, Target order, table completeness, forbidden constructs and all documentation code examples."
        notes_about_the_review:
          - "The Entity declaration class attribute can be rebound (Entity.declaration = other). The Architecture describes it as a read-only member, but neither the Model Review category nor a Task acceptance names it, so it is reported here and not recorded as a Finding."
          - "Zero-diff regeneration is observed with the generation scripts the Develop run used, which live outside the project; a regeneration check therefore repeats the same transcription of the Target. The independent Target-versus-Declaration comparison above covers that transcription."
        outcome: "satisfied"
        outcome_basis: "Every Finding is resolved and rechecked; every Task acceptance and every observation of the Model Review category is established by an observation made in this Review; technical and repeatable conformance holds."
        acceptance_established:
          - tasks: ["P1-G1-T1"]
            by: "Clean install from the lock file in an empty directory, import of the Interface, package build; dependency declaration analysis (after F1)."
          - tasks: ["P1-G2-T1", "P1-G2-T2"]
            by: "Transient probe: 14 Field Declaration and 16 Entity Declaration refusals, absent versus null Default Value, exact member lists of both Declarations, immutable records with tuple collections."
          - tasks: ["P1-G2-T3"]
            by: "Transient probe over all nine Field Types: accepted in declared form, refused in any other (after F2), naive datetime, non-finite float and decimal refused; unknown Type refused."
          - tasks: ["P1-G2-T4"]
            by: "Behaviour checks on 15 Entities and transient probe: unknown Field, wrong Type, missing Required Field, supplied identity, immutable assignment refused; failed assignment keeps prior value; load-time mismatch and collision refusals; marked input absent and not chained on construction, assignment, JSON and model_validate paths."
          - tasks: ["P1-G2-T5"]
            by: "Storage form check on 15 Entities and DDL: names, keys, constraint names, identity, column types, one shared metadata with exactly the Entity tables; colliding and unresolvable physical names refused; stored decimal and datetime values read back exact."
          - tasks: ["P1-G2-T6"]
            by: "Round trips of all 15 Entities and the probe Entity, null/false/zero/empty-string distinctions, exact decimal and microsecond offset datetime, 12 rejected text forms."
          - tasks: ["P1-G3-T1", "P1-G3-T2", "P1-G3-T3", "P1-G4-T1", "P1-G4-T2", "P1-G4-T3", "P1-G5-T1", "P1-G5-T2", "P1-G6-T1", "P1-G6-T2", "P1-G6-T3", "P1-G6-T4", "P1-G7-T1", "P1-G7-T2", "P1-G7-T3"]
            by: "Target text parsed independently and compared with each published Declaration (124 Fields, uniqueness, Relations); valid construction of every Entity."
          - tasks: ["P1-G8-T1"]
            by: "Syntax tree of the entrypoint, public names, identity of exports and collection items, empty initialisers, side-effect-free load in an empty directory."
          - tasks: ["P1-G9-T1", "P1-G9-T2"]
            by: "Documentation structure, Target order, table and metadata completeness, forbidden-construct scan, execution of all 12 examples including the Verify script; Verify coverage gap closed by F3."
          - tasks: ["P1-G10-T1"]
            by: "Formatter, linter and type checker pass over library and documentation; zero-difference regeneration of the Entity units and the documentation."
        review_category_observations:
          - "Interface publishes every need of its contract and nothing beyond: held"
          - "Every Target Entity has exactly one Entity Export: held"
          - "The Entity Collection holds exactly the exported Entities, in Target order: held"
          - "Every Relation reaches a Field of an Entity in Model with a compatible Type, and no two Entities collide in name before or after physical naming: held"
          - "Each Entity's Declaration matches the Target: held (124 Fields compared)"
          - "Every Entity has an immutable id and a Boolean is_active: held"
          - "Each Entity constructs from valid values and rejects an unknown Field, a wrong Type and a missing Required Field: held (after F2)"
          - "Converting any Entity to its JSON Object and back returns an equal Entity: held"
          - "Decimal and datetime values keep their exact value through JSON: held"
          - "Loading Interface has no side effect: held"
          - "An unknown Type in the Target stops generation: held"
          - "Each Entity's storage mapping takes exactly the form Model Preferences list: held"
