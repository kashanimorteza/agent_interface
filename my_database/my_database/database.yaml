# Database-owned, non-secret runtime configuration. Resolved per Database
# Preferences: engines catalogue, instance catalogue, and the default
# instance selection. No secret value is ever recorded here.
engines:
  sqlite:
    driver: "sqlite3"
    foreign_keys: true
    check_same_thread: false

instances:
  general:
    name: "Trading Assistant General"
    purpose: "General application data."
    engine: "sqlite"
    database: "trading_assistant_general"

default_instance: "general"
