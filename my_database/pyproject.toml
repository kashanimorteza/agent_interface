[project]
name = "my-database"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morteza", email = "kashani.morteza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "cryptography>=50.0.1",
    "my-model",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2,<3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
my-model = { path = "/root/agent_interface/my_model", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
