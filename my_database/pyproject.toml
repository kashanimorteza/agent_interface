[project]
name = "my-database"
version = "0.1.0"
description = "The complete persistence layer for the Trading Assistant, built on the shared my_model domain package."
requires-python = ">=3.13"
dependencies = [
    "my-model",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "cryptography>=42,<46",
    "pyyaml>=6,<7",
]

[tool.uv.sources]
my-model = { path = "../my_model" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_database"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
