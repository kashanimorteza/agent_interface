[project]
name = "my-database"
version = "0.1.0"
description = "Persistence layer for the Trading Assistant Target, built on the shared logical Model package."
requires-python = ">=3.13"
dependencies = [
    "my-model",
    "sqlalchemy>=2,<3",
    "alembic>=1.13",
    "cryptography>=42",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_database"]

[tool.uv.sources]
my-model = { path = "../my_model", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1",
    "ruff>=0.6",
]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
