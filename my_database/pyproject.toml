[project]
name = "my_database"
version = "0.1.0"
description = "Independent Database layer persisting my_model Domain Entities and publishing Database Operations to Logic."
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "my_model",
]

[tool.uv.sources]
my_model = { path = "../my_model", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_database*"]
