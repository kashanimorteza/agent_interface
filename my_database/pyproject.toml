[project]
name = "my_database"
version = "0.1.0"
description = "Reusable persistence library that stores the Trading Assistant Model Entities and provides standard data Operations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "my-model",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.47",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
my-model = { path = "../my_model" }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
