# Database-owned non-secret runtime configuration.
# Resolved per Database Preferences: engine catalogue, Instance catalogue, and default selection.
# No secret values live here; connection secrets and the credential-encryption key
# are resolved separately (see README.md "Secrets").

engines:
  sqlite:
    driver: "sqlite3"
    foreign_keys: true

default_instance: "general"

instances:
  general:
    name: "Trading Assistant General"
    purpose: "General application data."
    engine: "sqlite"
    database: "general"
